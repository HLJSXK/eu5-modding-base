    reference_game_files/game/in_game/events/government/town_rights_events.txt:476
  notes: Direct scoped numeric reads in these dynamic value slots can be interpreted as existence/truthy values and collapse
    to 1. The script-value block preserves the selected number and supports inline arithmetic.
- id: effect_conditional_chain_inside_scripted_trigger
  pattern: ^[ \t]*(?:if|else_if|else)\s*=\s*\{
  detectability: lint
