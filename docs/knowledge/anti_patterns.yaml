- id: gui_renderer_flattens_nested_datacontext
  pattern: null
  bad: Resolving every widget expression from global mock values while ignoring a parent widget's datacontext
  correction: Keep ancestor datacontexts on a stack while resolving descendants; in the battle view, Combat.GetDefender supplies
    the CombatSide object used by child CombatSide.GetLeft. Report unresolved mock contexts separately from ordinary unknown
    expressions.
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/battle_lateralview.gui:543,552; docs/guides/EU5_GUI_Modding_Guide.md section
