# Reusable EU5 engine/tooling anti-patterns. Project-specific rules stay in each workspace.
- id: action_button_diamond_datacontext_breaks_tooltip
  pattern: ''
  bad: datacontext = "[InternationalOrganizationsView.GetPlayer]" inside action_button_diamond in an organization panel
  correction: Remove datacontext entirely. Use Player.MakeScope.GetVariable(...).IsSet in visible expressions instead of Country.MakeScope.GetVariable(...).IsSet
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/organization/defensive_league.gui:128-149
  notes: Adding datacontext to action_button_diamond overrides the widget's internal binding, causing tooltip generation to
    fail silently (empty tooltip, button stays grayed regardless of action potential). Vanilla IO panels never use datacontext
    on action_button_diamond. Use Player (global GUI binding) instead of Country (datacontext-dependent) to access player-country
    variables.
- id: add_country_modifier_auto_modifier_id
  pattern: add_country_modifier\s*=\s*\{[^\n{}]*modifier\s*=\s*[A-Za-z0-9_]*auto[A-Za-z0-9_]*
  detectability: advisory
  bad: Using add_country_modifier with a modifier id defined only in common/auto_modifiers
  correction: Keep Country Auto modifiers in common/auto_modifiers for actual automatic effects. For tooltip previews or scripted
    effect lists, emit real non-modifier effect lines or omit the modifier-list preview. Do not pass auto modifier ids to
    add_country_modifier, and do not restore finalization-time static grants/removals for building-gated wonder effects.
  category: modifier
  scope: country
  source: 'runtime error.log, 2026-06: add_country_modifier rejected tv_wonder_auto_unique_*_style_1_country_modifier in tv_engineering_department_wonder_mechanics_effects.txt'
  notes: Country Auto modifiers and static country modifiers are separate databases. A Country Auto modifier may have category
    = country, but add_country_modifier still cannot use its id.
- id: add_treasury_nonexistent
  pattern: \badd_treasury\b
  bad: add_treasury = X to add or subtract gold from a country
  correction: 'Use add_gold = X (simple literal: add_gold = -200) or add_gold = { value = script_value multiply = N } (computed
    form). Trigger side: gold >= 200 (literal integer) is valid.'
  category: script
  scope: country
  source: reference_game_files/game/in_game/common/scripted_effects/country_effects.txt:2161 (add_gold = 5000), reference_game_files/game/in_game/common/generic_actions/fall_of_delhi.txt:44
    (add_gold = { value = ... })
  notes: 'add_treasury does not exist in EU5. The effect is add_gold; it accepts a bare literal integer (positive or negative)
    or a block with value/multiply. Error: ''Unknown effect add_treasury''.'
- id: advance_inject_duplicates_allow_block
  pattern: ''
  bad: INJECT:advance_name = { allow = { ... } } when the vanilla advance already has an allow block
  correction: Use REPLACE:advance_name = { <full vanilla block> allow = { OR = { <mod condition> <original condition> } }
    } to merge conditions. Use INJECT only for advances with no existing allow block.
  category: modifier
  scope: any
  source: reference_game_files/game/in_game/common/advances/0_age_of_discovery.txt:336 (printing_press_advance has allow);
    reference_mods/3649381461/in_game/common/advances/mod_improved_trade_and_buildings_advances.txt:1 (REPLACE syntax)
  notes: EU5 advance definitions allow only ONE allow block. INJECT appends properties; a second allow block via INJECT is
    invalid. Must copy the full vanilla advance definition into a REPLACE block and merge the OR condition manually.
- id: artist_selector_should_use_artist_column
  pattern: name\s*=\s*"tv_select_arts_leader"[\s\S]{0,240}?column\s*=\s*\{\s*data\s*=\s*character_info\s*\}
  only_in_paths:
  - generic_actions
  bad: Arts leader select_trigger using column.data = character_info
  correction: Use column.data = character_artist for artist-only character selectors so the list uses the artist ability view.
  category: gui
  scope: character
  source: reference_game_files/game/in_game/common/country_interactions/invite_artist.txt:68; reference_game_files/game/in_game/gui/attribute_columns/character.gui:10
  notes: The character_artist attribute column swaps the character list's ability area and tooltip to artist skill. Generic
    character_info shows ruler-style ADM/DIP/MIL information and is the wrong view for selecting a Chief Artist.
- id: artist_skill_is_normalized_float
  pattern: artist_skill\s*\n.*multiply\s*=\s*0\.00[0-9]
  bad: value = character.artist_skill  multiply = 0.002 (assuming artist_skill is an integer 0-100 scale)
  correction: Use multiply = 0.1 (or other factor scaled to the 0-1 range). artist_skill in EU5 is a normalized float 0.0-1.0,
    not a raw integer. A skill-5 artist returns ~0.5, not 5.
  category: modifier
  scope: character
  source: 'src/in_game/common/international_organizations/tv_arts_exhibition.txt (confirmed by runtime: original multiply
    = 0.002 was 100× too small; corrected to multiply = 0.1)'
  notes: artist_skill is a level-based attribute normalized to [0,1] by the engine when accessed as a scripted value. Design
    formulas written assuming 0-100 scale must divide the intended multiplier by 100.
- id: artist_skill_modifier_invalid
  pattern: artist_skill_modifier
  bad: static_modifier or character_modifier using artist_skill_modifier = X
  correction: Use artist_skill_level_gain = X instead (already_percent = yes, category = character)
  category: modifier
  scope: character
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt, reference_game_files/game/in_game/common/traits/03_artist.txt
  notes: artist_skill_modifier does not exist. The correct modifier type for boosting artist skill development is artist_skill_level_gain
    (declared as already_percent in modifier_type_definitions).
- id: auto_modifier_missing_name_localization
  pattern: ''
  detectability: advisory
  bad: Emitting a common/auto_modifiers id without matching AUTO_MODIFIER_NAME_<id> localization
  correction: Generate AUTO_MODIFIER_NAME_<id> for every emitted auto modifier, including hidden hide_effects companions such
    as *_unscaled.
  category: localization
  scope: modifier
  source: 'runtime error.log, 2026-06: AUTO_MODIFIER_NAME_tv_wonder_auto_pirate_port_unscaled and AUTO_MODIFIER_NAME_tv_wonder_auto_unique_algiers_pirate_port_unscaled'
  notes: Hidden Country Auto modifiers still load as modifier database entries and the localization system requests their
    AUTO_MODIFIER_NAME keys during startup.
- id: background_widget_expanding_width_distorts_fixed_aspect_illustration
  pattern: layoutpolicy_horizontal\s*=\s*expanding\s*\n\s*layoutpolicy_vertical\s*=\s*fixed\s*\n\s*size\s*=\s*\{\s*-1\s+\d+\s*\}\s*\n\s*background\s*=\s*\{\s*\n\s*texture
  detectability: advisory
  bad: Filling a `-1 <fixed_height>` (expanding-width, fixed-height) `background = { texture = ... }` widget with a wide non-tileable
    illustration (e.g. the 2048x1152 victory reward-tree banners) -- e.g. gen_tv_victory_situation_gui.py's first draft on
    append_tree_background used `spriteType = stretched`, then a second draft added `fittype = centercrop`, and both still
    visibly distorted/misbehaved because the widget's runtime width is not fixed and does not match the texture's aspect ratio.
  correction: For a non-tileable illustration with a specific aspect ratio, do not let the container's width float (`-1`/expanding)
    while only the height is pinned -- any stretch or crop fit mode still has to guess how to reconcile an arbitrary runtime
    width against the fixed texture aspect ratio. Instead give the widget an explicit fixed size on both axes computed from
    the source image's real aspect ratio (e.g. `width = 508`, `height = round(508 * source_height / source_width)`), with
    `layoutpolicy_horizontal = fixed` and `layoutpolicy_vertical = fixed`, so `spriteType = Stretched` maps the texture 1:1
    onto matching proportions with no distortion and no cropping.
  category: gui
  scope: any
  source: scripts/in_game/gui/panels/situation/gen_tv_victory_situation_gui.py append_tree_background
  notes: Found 2026-07-12 wiring the six victory-path reward-tree background DDS assets into tv_victory_situation.gui. First
    fix attempt (fittype = centercrop) was rejected by the user as both an unwanted crop and non-functional; the working fix
    is a hard pixel size (508 wide, proportional height) instead of any fit-mode reliance on a floating container width.
- id: blockoverride_content_indirectly_inside_vbox_via_base_template
  pattern: ''
  detectability: advisory
  bad: Appending a `parentanchor`/percentage-size widget as a direct child of a `blockoverride "<name>" { ... }` body, on
    the assumption that because the widget appears as a plain sibling in the mod's own .gui file (not literally nested inside
    a local `vbox = { }`/`hbox = { }`), the hbox/vbox restriction does not apply. `append_tree_pending_confirm_overlay(lines,
    2)` was emitted as a direct sibling inside `blockoverride "situation_panel_main_content" { ... }` with `parentanchor =
    top|left` and `size = { 100% 100% }` directly on it.
  correction: A `blockoverride "X"` substitutes content at the exact point where the BASE type declares `block "X" {}` — read
    that declaration in `reference_game_files` before assuming the substitution point's parent container. `situation_panel_main_content`
    is declared inside `scrollwidget = { vbox = { ... block "situation_panel_main_content" {} ... } }` in `reference_game_files/game/in_game/gui/panels/situation/common.gui`,
    so every direct child emitted inside the local `blockoverride` block is actually a vbox child at runtime, even though
    the mod's own file shows it as a sibling of other top-level widgets. Do NOT fix this by wrapping the ENTIRE blockoverride
    body (including the real scrollable content) in one outer `widget` — a plain `widget` does not propagate its children's
    natural/intrinsic height to its own parent the way a `vbox` does, so wrapping the tabs+pages vbox inside that outer widget
    hides its true content height from the enclosing `scrollarea`'s `autoresizeviewport` and disables scrolling entirely (confirmed
    by the user in-game). Only wrap the OFFENDING widget itself, and keep the real scrollable content vbox as a direct, unwrapped
    sibling in the blockoverride exactly as before. For a widget that must also default to zero layout footprint while hidden
    (e.g. a conditional overlay), the wrapper must be a `vbox`/`hbox` with `ignoreinvisible = yes` set on itself — not a plain
    `widget`, which does not support `ignoreinvisible` at all (see rule `gui_ignoreinvisible_on_plain_widget`) — then nest
    a plain `widget` inside that ignoreinvisible-capable vbox, and only put `parentanchor`/percentage `size` on a THIRD widget
    nested one level deeper still (a child of that plain widget, not of the vbox).
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/situation/common.gui:257-258 (`vbox = { ... block "situation_panel_main_content"
    {} ... }`); scripts/in_game/gui/panels/situation/gen_tv_victory_situation_gui.py append_panel, append_tree_pending_confirm_overlay
  notes: 'Found 2026-07-13 from docs/error_log/error.log: ''Unsupported property: parentanchor on widgets that are a child
    of a hbox/vbox'' / ''size with a percentage ... consider using layout policies'' at tv_victory_situation.gui:20148-20149,
    origin 20145 — the confirm-overlay widget added right after the tabs vbox closed. The existing lint validator `check_gui_parentanchor_under_hbox_vbox`
    (see [[parentanchor_under_hbox_vbox]]) only scans the LOCAL file''s brace structure and cannot see that a `blockoverride`
    substitution point is itself inside a vbox in a different (vanilla) file, so this class of violation is not currently
    lint-detectable — verify blockoverride parentage against the base template (see gui.md risk card point 5) whenever adding
    parentanchor/percent-size widgets as direct blockoverride children. First fix attempt wrapped the WHOLE blockoverride
    body (tabs/pages vbox + overlay) in one outer `widget = { layoutpolicy_horizontal = expanding  layoutpolicy_vertical =
    expanding }`; this passed `validate.py` and cleared the log errors, but the user reported it broke the situation panel''s
    scrollarea entirely. Re-fixed by reverting `append_panel` to its original unwrapped vbox, and instead restructuring only
    `append_tree_pending_confirm_overlay` into `vbox { ignoreinvisible = yes ... } > widget { datacontext ... } > widget {
    parentanchor = top|left  size = { 100% 100% } ... }` — three levels, not the two originally used, because the outer level
    needs to be an `ignoreinvisible`-capable vbox (see `gui_ignoreinvisible_on_plain_widget`) to keep contributing zero height
    to the scrollarea while the popup is hidden (the default and by far most common state). SUPERSEDED 2026-07-13 (same day):
    `append_tree_pending_confirm_overlay` itself was deleted once `force_click_and_confirm_or_hold = yes` (see `generic_action_confirmation_needs_pending_variable_overlay_not_engine_window`)
    made the whole overlay unnecessary. The structural fact about `situation_panel_main_content` being nested in vbox in vanilla
    `common.gui`, and the wrap-only-the-offender-not-the-whole-block fix pattern, remain generically true for ANY future content
    injected into that same blockoverride — kept for that reason, not because the deleted overlay still exists.'
- id: blockoverride_widget_child_invalid
  pattern: blockoverride\s+"common_header_text"\s*\{[^}]*text_single
  bad: text_single widget inside blockoverride "common_header_text"
  correction: blockoverride overrides a 'text' property value, not a widget container; do not add child widgets
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/common/cards.gui:1084
  notes: Guessing block structure causes silent failures; always read cards.gui before using blockoverride
- id: boolean_modifier_can_recruit_regiment_numeric
  pattern: can_recruit_regiment_in_this_location\s*=\s*(?:0|1)\b
  detectability: lint
  only_in_paths:
  - building_types
  - static_modifiers
  bad: Boolean location modifier can_recruit_regiment_in_this_location assigned numeric 0/1
  correction: Use can_recruit_regiment_in_this_location = yes or no. The modifier type is declared boolean=yes, and vanilla
    building modifiers use yes.
  category: modifier
  scope: location
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:9910; reference_game_files/game/in_game/common/building_types/manpower_buildings.txt:29
  notes: EU5 logs Malformed token near the numeric literal when a boolean modifier value is emitted as 1. Generated YAML data
    must preserve bools and render them as yes/no, not Python True/False or 1/0.
- id: broad_location_iterator_uses_direct_nullable_links
  detectability: advisory
  pattern: ''
  only_in_paths:
  - scripted_triggers
  - generic_actions
  - scripted_effects
  bad: Using direct `owner = <scope>` or `dominant_culture = <scope>` comparisons while iterating all locations or a geography
    that can include non-ownable, water, or ownerless locations
  correction: 'Filter the iterator with `is_ownable = yes`, then use optional scope links: `dominant_culture ?= <culture>`
    and `NOT = { owner ?= <country> }`. Optional owner comparison safely treats an ownerless ownable location as not controlled;
    optional dominant-culture comparison ignores locations with no culture object.'
  category: scope
  scope: location
  source: 'User runtime log: tv_io_leader_actions -> tv_victory_path_tasks_assign_conquest_slot_3_effect -> tv_victory_task_1101/1103/1104/1105/1106_current_condition,
    2026-07-28; reference_game_files/game/in_game/common/building_types/unique_buildings.txt:22; reference_game_files/game/in_game/events/debug/qa_debug.txt:561-562'
  notes: Saving the country owner scope fixed the earlier invalid-root path but did not make each iterated location's nullable
    links valid. The task generator still scanned sea/non-ownable locations with direct `dominant_culture` and direct `owner`
    links, so Governor's House creation and its hover-pre-evaluation logged invalid-object errors repeatedly. The safe pattern
    is emitted for all culture and geography unification checks, including the culture-group display trigger.
- id: building_efficiency_colon_chain_numeric_read_invalid
  pattern: '\bbuilding_efficiency\s*:'
  detectability: lint
  only_in_paths:
  - script_values
  - scripted_effects
  - scripted_triggers
  bad: Using `building_efficiency:` in any colon-chained form (`<scope>.building_efficiency:<X>`, `<scope>.building_efficiency:<type>:<X>`,
    or bare `building_efficiency:<X>`) as a numeric value source.
  correction: 'For numeric building-efficiency reads, use the quoted function-call-style event target link: `value = "<location_scope>.building_efficiency(building_type:<id>)"`,
    or `value = "location.building_efficiency(scope:<saved_building_type>)"` when the current scope is a building and the
    building type was saved as a scope. For trigger checks, the block form remains valid: `building_efficiency = { building_type
    = building_type:<id> value >= <N> }`. Do not use the colon-chain form; it is parsed as an event-target link and either
    fails to resolve the building id or rejects the extra colon. Do not use `building_efficiency` as input-goods access.'
  category: script
  scope: any
  source: 'docs/error_log/error.log 2026-08-02 16:45 (jomini_eventtarget.cpp:749, 1-colon form) and 18:00 (jomini_eventtarget.cpp:703
    "More than one colon in event target link", jomini_scriptvalue.h:498/798 "Badly read script value", 2-colon form); reference_mods/3735059838/in_game/common/scripted_effects/epbm_calculate.txt:135
    and :179 (`value = "location.building_efficiency(scope:epbm_bt)"`); vanilla quoted function-call precedents: reference_game_files/game/in_game/common/disasters/coup_attempt.txt:13
    (`power > "root.estate_power(estate_type:crown_estate)"`), reference_game_files/game/in_game/common/attribute_columns/57_parliament_issues.txt:40
    (`value = "scope:actor.estate_power(root.estate_type)"`), reference_game_files/game/in_game/events/estates/burghers_estate_events.txt:144-145
    (`"market_price(goods:wheat)" > { value = "default_price(goods:wheat)" }`), reference_game_files/game/in_game/events/government/D008_latinization_vs_hellenization.txt:2593
    (`value = "border_distance_to(scope:target_province)"`); reference_official_defines/docs/triggers.log:2521-2525; reference_game_files/game/in_game/events/debug/000_johan_debug.txt:539
    (trigger block form); docs/technical/EU5_Modding_Knowledge_Base.md section 5.3 function-call-style event target links
    must be quoted'
  notes: '2026-08-02: tv_wonder_labor_camp_input_goods_access originally used `value = var:tv_wonder_site.building_efficiency:tv_wonder_labor_camp`,
    treating building_efficiency as a colon-chained numeric data function. Two in-game failures ruled out the colon chain:
    the bare argument form failed to resolve `tv_wonder_labor_camp`, and the scope-prefixed argument form failed earlier with
    `More than one colon in event target link`. The user''s discovery in reference mod 3735059838 (`set_local_variable = {
    name = epbm_bldg_eff value = "location.building_efficiency(scope:epbm_bt)" }`) shows `building_efficiency` can be read
    numerically, but only through the quoted parenthesized event-target-link syntax. This quoted+parenthesized style is not
    a reference-mod oddity: vanilla uses the same script-value/parser form for `estate_power(...)`, `market_price(...)`, `default_price(...)`,
    and `border_distance_to(...)`. Later same-day in-game validation showed `building_efficiency` matches the labor/staffing
    satisfaction represented by `total_effective_building_levels`, not the input-goods green bar. See `building_efficiency_not_input_goods_access`.'
- id: building_efficiency_not_input_goods_access
  pattern: ''
  detectability: advisory
  bad: Using `building_efficiency` as the material/input-goods satisfaction green bar.
  correction: For labor/staffing, use `total_effective_building_levels:<id>` versus nominal `location_building_level(building_type:<id>)`,
    or the quoted `building_efficiency(...)` read when a building-efficiency value is specifically needed. The green input-goods
    bar is GUI `Building.GetInputGoodsAccess`; no script numeric event target with that value was found in official defines.
    In script, use building-scope `is_lacking_goods` as the authoritative boolean gate for whether an input shortage affects
    the building at all. When a numeric material-side approximation is needed, use the site's market-scope `goods_supply_in_market(goods:<input>)
    / goods_demand_in_market(goods:<input>)` for each required input only after that boolean gate is true; average the per-input
    satisfaction ratios across the building's fixed input list rather than taking the bottleneck. For a two-input recipe,
    one input short by x% produces an x/2% material penalty. Do not use `building_goods_input` as the green bar.
  category: script
  scope: any
  source: Project owner in-game validation, 2026-08-02; reference_official_defines/docs/data_types_uncategorized.txt:43319
    (`Building.GetInputGoodsAccess`); reference_official_defines/docs/triggers.log:2539 (`building_goods_input`), :4205 (`goods_demand_in_market`),
    :4222 (`goods_supply_in_market`), :6958 (`is_lacking_goods`); reference_game_files/game/main_menu/gui/shared/building_tooltips.gui:960;
    reference_mods/3735059838/in_game/common/scripted_effects/epbm_calculate.txt:127-147; reference_game_files/game/in_game/common/generic_actions/columbian_exchange.txt
    uses demand-vs-supply checks; src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt
    `tv_wonder_update_logistics_metrics_effect`
  notes: 'For `tv_wonder_labor_camp`, user in-game validation showed `building_efficiency` and `total_effective_building_levels`
    both track labor/staffing satisfaction. The vanilla green input-goods indicator is `Building.GetInputGoodsAccess`, but
    official docs expose that only as a GUI data function, not a script numeric accessor. `building_goods_input(goods:X)`
    is a building-scope required-input value; the 3735059838 reference mod comments that it is scaled by market access and
    building efficiency, which means it is entangled with the labor value the Wonder breakdown is already displaying separately.
    The Wonder construction cache therefore checks the active worksite building''s `is_lacking_goods` first, then uses the
    selected site''s market supply/demand ratios for the Labor Camp''s two fixed inputs, `tv_wonder_materials` and `tools`,
    averaging the two satisfaction ratios. This matches the observed two-input behavior: if only one input is short by x%,
    the building''s material/input penalty is x/2%, while small market imbalances that do not trip `is_lacking_goods` apply
    no penalty. This is not a general alias for `GetInputGoodsAccess`; it is a local approximation chosen because the exact
    green bar is GUI-only.'
- id: building_eu4_price_numeric
  pattern: ^\s*price\s*=\s*\d+
  only_in_paths:
  - building_types
  bad: Direct numeric price in EU5 building definition, e.g. price = 200 (EU4 carry-over)
  correction: Use price = <named_constant> referencing a definition in common/prices/ (e.g. price = tv_academy_1_price with
    gold = 600). Capital buildings that scale with age use expensive = yes instead.
  category: modifier
  scope: location
  source: reference_official_defines/types/building_types.txt:18, reference_game_files/game/in_game/common/building_types/estate_buildings.txt:416
  notes: EU5 building gold cost uses named price constants from common/prices/ (e.g. price = expensive_estate_building at
    line 416 of estate_buildings.txt). Direct numeric literals like price = 200 are silently ignored. Named constants ARE
    valid.
- id: building_level_not_current_employment
  pattern: location_building_level\(building_type:tv_wonder_labor_camp\)[^\n]*(?:\*\s*1000|(?:\n[^\n]*){0,4}\bmultiply\s*=\s*1000\b)
  detectability: lint
  only_in_paths:
  - scripted_effects
  bad: Using building levels multiplied by nominal employment size to determine how many workers a building actually employs
  correction: For actual employment, scope into the building object with ordered_buildings_in_location/random_buildings_in_location
    and read building_employed_amount. If downstream variables are stored as people rather than pop-size units, multiply the
    value by 1000. `location_building_level(building_type:X)` remains valid when the intended value is nominal completed building
    levels, such as the Engineering Department's current worksite scale.
  category: script
  scope: building
  source: reference_game_files/game/in_game/common/trigger_localization/building_triggers.txt:137; reference_game_files/game/in_game/common/scripted_effects/location_effects.txt:338;
    fixed in src/in_game/common/scripted_effects/tv_engineering_department_effects.txt
  notes: location_building_level reports completed levels/capacity, not current staffing. For labor-sensitive mechanics such
    as Engineering Department construction, use completed levels only for nominal scale, then compare against total_effective_building_levels
    or building_employed_amount for labor-sensitive effective staffing.
- id: building_upgrade_completion_relying_on_on_built
  pattern: ''
  only_in_paths:
  - building_types
  - scripted_effects
  bad: Using building on_built as the only completion signal for a mechanic that also upgrades existing building levels
  correction: Use on_construction_ended to directly mark the active auxiliary-building ritual finished and run the normal
    ritual completion effect. Do not depend on on_built for upgrades, and do not require location_building_level to have updated
    inside the construction-ended hook.
  category: script
  scope: building
  detectability: advisory
  source: reference_official_defines/types/building_types.txt:36 lists on_built; reference_game_files/game/in_game/common/building_types/trade_company_buildings.txt:66-78
    uses on_construction_started/on_construction_ended; fixed in scripts/in_game/common/building_types/gen_tv_engineering_department_wonder_mechanics_buildings.py
  notes: Engineering Department style-2 ritual annex completion relied on on_built. Fresh annex construction completed, but
    expansion reused the same annex building as a higher level, so the ritual needed construction-ended direct completion.
- id: change_variable_add_prev_var
  pattern: 'add\s*=\s*\{?\s*value\s*=\s*prev\.var:|add\s*=\s*prev\.var:'
  bad: change_variable = { name = X add = prev.var:some_var } — reading a named variable from prev scope in a numeric value
    position
  correction: 'Use set_local_variable / change_local_variable to capture the numeric value before the scope switch, then use
    add = local_var:name inside the new scope. Example: set_local_variable = { name = tmp value = var:some_var }  then in
    the other scope: change_variable = { name = X add = local_var:tmp }.'
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/situations/guelphs_and_ghibellines.txt:229 (add = local_var:guelphs_total_tax)
  notes: 'prev.var:X is valid only as a scope reference (country, religion, etc.), not as a numeric value source. Using it
    in an add = position causes ''Variable not of the value scope type. Type: empty''. Built-in scripted values like prev.num_locations
    are valid inline; only prev.var:X is broken.'
- id: change_variable_divide_is_integer
  pattern: ''
  bad: change_variable { divide = N } expecting float result when input < N (e.g. score ÷ large_threshold to get [0,1])
  correction: Multiply by 100 (or desired precision) BEFORE dividing, then compare/cap at 100 instead of 1. For thresholds
    divisible by 100, use divide = (threshold÷100) in one step.
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/scripted_effects/global_effects.txt:137
  notes: EU5 change_variable { divide } performs FLOOR integer division. E.g. 160÷2000=0, not 0.1. Use integer scale [0,100]
    with max=100 on GUI progressbar. Pattern left empty (no auto-detect) — all divide uses cannot be classified as bad without
    context.
- id: change_variable_uses_value_key
  pattern: change_variable\s*=\s*\{[^\}\n]*\bvalue\s*=
  bad: change_variable = { name = X value = 1 }
  correction: Use a named arithmetic operator with change_variable, e.g. change_variable = { name = X add = 1 }. If you want
    to overwrite the variable, use set_variable = { name = X value = 1 }.
  category: script
  scope: any
  source: 'reference_game_files/game/in_game/events/situations/red_turban_rebellions.txt:3349; runtime error.log: jomini_effect.cpp:918'
  notes: 'change_variable does not accept a value field. The engine logs ''Failed to read value for change_variable'' when
    value is used there. value belongs to set_variable; change_variable uses add/subtract/multiply/divide. False-positive
    edge case (confirmed live 2026-07 in scripts_engineering_department/unique_wonder_ritual_content/bank_of_saint_george.py):
    the single-line regex also fires on a legitimate nested scriptvalue block, e.g. `change_variable = { name = X add = {
    value = var:X multiply = var:Y } }` (compounding interest). That inline `add = { value = ... multiply = ... }` idiom is
    valid vanilla syntax -- confirmed at reference_game_files/game/in_game/events/disaster/turmoil_in_brandenburg.txt:1598
    (`add_gold = { value = var:bra_owes_gold multiply = -1 }`) -- because the pattern''s negated-character-class scan does
    not track brace depth and cannot tell the nested block''s own `value =` from a top-level one on the same physical line.
    Do not silence this by weakening the regex (it still correctly catches the real mistake). Prefer rewriting the nested
    arithmetic as a named scratch variable instead: `set_variable = { name = tmp value = var:X }`, `change_variable = { name
    = tmp multiply = var:Y }`, `change_variable = { name = X add = var:tmp }`, `remove_variable = tmp` -- this also matches
    the codebase''s existing scratch-variable convention (e.g. `*_ritual_total_favorable`, `*_combined_score`) better than
    a one-line nested scriptvalue.'
- id: change_variable_value_op_invalid
  pattern: change_variable\s*=\s*\{[^{}]*\bvalue\s*=
  bad: change_variable = { name = X  value = Y } — value is not a valid operation for change_variable
  correction: 'Use change_variable = { name = X  add = Y } (or subtract / multiply / divide). Negative literals are fine for
    add: e.g. add = -0.00020. value = is reserved for set_variable.'
  category: scripted_values
  scope: any
  source: 'EU5 engine error: ''change_variable effect [ No operation specified ]'''
  notes: set_variable accepts 'value = X' (absolute assignment); change_variable does NOT — it requires an operation keyword
    (add/subtract/multiply/divide). Mixing them up emits a runtime PostValidate error and the change is silently dropped.
    Often introduced by codegen scripts that mirror set_variable templates without adapting the op keyword. Pattern uses [^{}]*
    (not [^}]*) so it does NOT cross nested-block boundaries — this prevents false positives on the legal form 'change_variable
    = { name = X  add = { value = Y  multiply = Z } }' where value = is the inner-block scalar literal of add's value-with-operations
    form.
- id: character_interaction_recipient_requires_select_trigger
  pattern: ''
  detectability: needs_parser
  only_in_paths:
  - common/character_interactions/
  bad: A targeted character interaction uses scope:recipient in allow or effect without a character select_trigger that sets
    target_flag = recipient
  correction: Add select_trigger = { looking_for_a = character source = actor target_flag = recipient ... }. Character-interaction
    registration does not automatically pass the viewed/menu character as recipient; target eligibility belongs in the selector
    visible/enabled blocks, and recipient-dependent effects remain guarded with exists = scope:recipient.
  category: scope
  scope: character
  source: error.log interaction_target.cpp:3875, 2026-07-30; reference_game_files/game/in_game/common/character_interactions/readme.txt;
    reference_game_files/game/in_game/common/character_interactions/appoint_dragoman.txt
  notes: Without the selector, the engine rejects the action at load with `Targetted action <id> doesn't specify a recipient
    for the action`, even when its allow/effect body refers to scope:recipient.
- id: character_modifier_country_cabinet_efficiency
  pattern: ''
  detectability: advisory
  bad: Putting country_cabinet_efficiency inside a character-scoped modifier to lower one cabinet member's efficiency
  correction: Use character_cabinet_efficiency for character modifiers. Reserve country_cabinet_efficiency for country modifiers.
  category: modifier
  scope: character
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:5924-5943
  notes: country_cabinet_efficiency is a country modifier type and has no effect on a character modifier; the character-scoped
    equivalent is character_cabinet_efficiency.
- id: character_modifier_missing_game_data_category
  pattern: ''
  bad: Static modifier used with add_character_modifier but defined without game_data = { category = character }, e.g. my_modifier
    = { }
  correction: 'All static modifiers intended for use with add_character_modifier / has_character_modifier MUST include game_data
    = { category = character }. Example: my_modifier = { game_data = { category = character } [effects...] }'
  category: modifier
  scope: character
  source: reference_game_files/game/main_menu/common/static_modifiers/character.txt:227-232 (bastard); D008_fate_of_the_phoenix_modifiers.txt:472-480
    (despot_modifier)
  notes: 'Without category = character, the engine does not recognize the modifier as character-scoped. add_character_modifier
    runs (tooltip shows the grant) but the modifier is not stored on the character — has_character_modifier returns false
    and no title prefix fires. Confirmed at runtime: tv_chief_artist_role_modifier = {} appeared in appoint tooltip but never
    on the character panel.'
- id: character_traits_wrong_directory
  pattern: common/character_traits/
  bad: Placing character trait definitions in common/character_traits/ (e.g. src/in_game/common/character_traits/my_traits.txt)
  correction: 'Place trait files in common/traits/ — the correct EU5 directory: src/in_game/common/traits/my_traits.txt'
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/traits/ (confirmed directory; character_traits/ does not exist in vanilla)
  notes: EU5 loads character traits from common/traits/ not common/character_traits/. Files in the wrong directory are silently
    ignored and all has_trait checks against those trait IDs produce 'Invalid database object' errors at PostValidate.
- id: cmf_log_entry_overloaded
  pattern: null
  bad: Packing many unrelated diagnostics or more than four dynamic values into one CMF log entry
  correction: Keep each CMF entry to one diagnostic concept and at most four dynamic values. Prefer compact labels; split
    an essential wide vector into short rows, or omit secondary fields rather than emitting an unreadable line.
  category: framework
  scope: any
  source: user-reported in-game CMF log readability feedback (2026-08-07)
  notes: CMF renders the actor and localized action text in one log row. Dense profile/equation entries become difficult to
    read or copy even when the total remains below the 200-entry cap.
- id: cmf_suppress_for_confirmed_dynamic_reference_variables
  pattern: ''
  detectability: advisory
  bad: Treating a `jomini_effect.cpp` 'Variable X is set but is never used' / 'used but is never set' warning as an unfixable
    false positive and leaving it undocumented once the read/write site is confirmed to be a GUI-only `GetVariable` read,
    a `variable_map`/`global_variable_map` name that is only ever touched by `add_to_*_variable_map`/`clear_variable_map`
    (never a literal `set_variable`), or a vanilla-consumed variable name (e.g. `parliament_seat`)
  correction: Once source-reading confirms the variable genuinely has a legitimate consumer the engine's static usage tracker
    cannot see, register it in `data/cmf_warning_suppressions.yaml` (a literal name in `extra_suppressions`, or a new structured
    family function in `scripts/in_game/common/on_action/gen_tv_cmf_suppressions.py` for anything with more than a couple
    of instances, e.g. per-advance or per-slot families read straight from the owning data YAML) and regenerate `tv_cmf_suppressions.txt`.
    Do not hand-add `cmf_suppress` lines to that generated file.
  category: workflow
  scope: any
  source: docs/knowledge/risk_cards/gui.md rule 2; src/in_game/common/on_action/tv_cmf_suppressions.txt (`tv_cmf_warning_suppressions_monthly_pulse`,
    an intentionally unreachable `if = { limit = { always = no } cmf_suppress = { v = ... } } }` block — this shape is CMF's
    own recommended suppression idiom, not dead code)
- id: cmf_suppress_status_is_not_proof_a_variable_reference_is_real
  pattern: ''
  detectability: advisory
  bad: Assuming an existing `cmf_suppress = { v = X }` entry (via `data/cmf_warning_suppressions.yaml` + `gen_tv_cmf_suppressions.py`)
    means variable `X` is a handled/accepted case and its 'used but never set' or 'set but never used' line in `error.log`
    can be safely ignored without checking whether `X` actually has a real setter/reader anywhere.
  correction: '`cmf_suppress`''s own definition (`reference_mods/3692202776/in_game/common/scripted_effects/cmf_utility_effects.txt`)
    is an `always = no`-guarded dead branch that references `$v$` in every set/get form (`set_variable`, `exists = var:$v$`,
    `has_variable_map`, etc.), explicitly to make the engine''s static usage scanner see both a ''set'' and a ''used'' occurrence
    — per its own comment this targets exactly the two `jomini_effect.cpp` warning strings this project cares about, not a
    separate CMF-only display. Whether it reliably works for every reference shape (plain scope variable vs. a bare `global_variable_map`
    name) through this project''s own extra outer `always = no` wrapper (`gen_tv_cmf_suppressions.py`''s `tv_cmf_warning_suppressions_monthly_pulse`)
    is NOT independently confirmed — do not present ''cmf_suppress does/doesn''t silence the native log'' as a settled fact
    either way without an actual in-game error.log re-check after the suppression entry is added and the mod redeployed. What
    IS certain regardless of that mechanism question: a suppression entry is never a substitute for checking the real reference
    graph. Grep the variable across both mod roots for every `set_variable`/`change_variable`/`add_to_variable_map` (a real
    setter) and every `var:`/GUI `GetVariable`/`GetVariableFromGlobalVariableMap` read (a real consumer) before deciding whether
    to keep code, delete it, or just suppress the log line. If there is truly zero setter anywhere, delete the dead `remove_variable`
    calls and the code they clean up rather than leaving them for a suppression entry to paper over. If a `global_variable_map`
    genuinely has zero readers anywhere including GUI and isn''t planned future scaffolding, delete it instead of suppressing
    it.'
  category: effect
  scope: any
  source: reference_mods/3692202776/in_game/common/scripted_effects/cmf_utility_effects.txt (cmf_suppress definition); scripts/in_game/common/on_action/gen_tv_cmf_suppressions.py;
    data/cmf_warning_suppressions.yaml; docs/error_log/error.log jomini_effect.cpp:1162/1166, 2026-07-15
  notes: '2026-07-15: triaged 9 error.log lines after the Engineering Department mod split. tv_wonder_{foundation,body,function,decoration}_progress
    and tv_wonder_construction_paused had zero setters anywhere (superseded by tv_wonder_construction_progress + tv_wonder_active_part)
    despite being cmf_suppress-listed since this suppression file''s first commit — the suppression entry masked genuinely
    dead code rather than a real false positive; deleted the dead remove_variable calls and their suppression entries. tv_wonder_final_building_type_to_display_id
    (gen_tv_wonder_index_effects.py''s FINAL_BUILDING_DISPLAY_ID_MAP) turned out to be a dead duplicate of the already-consumed
    tv_wonder_final_building_type_to_wonder_id (same generator loop, same wonder_id value, zero readers) rather than a genuine
    dynamic-reference case — deleted rather than kept suppressed. tv_wonder_suitability_weight (read only via GUI GetVariableFromGlobalVariableMap)
    and tv_wonder_suitability_flag_static_reference_never_set (an intentional trade-off documented on tv_wonder_suitability_flag_static_reference_trigger,
    trading one variable warning for avoiding dozens of unused-flag warnings) are both genuine cases where the code itself
    is correct and only the log line is cosmetic noise — added both to data/cmf_warning_suppressions.yaml for consistency
    with every other GUI-only-read/deliberate-workaround entry in that file, on the working assumption (unverified in this
    session, no way to launch the game) that cmf_suppress''s mechanism is sound for the ~2200 other entries already relying
    on it and these two are not structurally different from those.'
- id: cmf_warning_suppression_established_mechanism_for_dynamic_reference_variables
  pattern: ''
  detectability: advisory
  bad: Re-deriving from scratch whether a variable-map name, GUI-only-read variable, or other dynamic-reference identifier
    flagged in error.log as used-but-never-set/set-but-never-used is a false positive, instead of checking data/cmf_warning_suppressions.yaml
    first.
  correction: This project has a pre-existing, already-adopted mechanism (data/cmf_warning_suppressions.yaml + scripts/in_game/common/on_action/gen_tv_cmf_suppressions.py)
    for the whole class of variables that are read/written only through generation-time-static dynamic references (variable_map
    names, GUI GetVariable/GetVariableFromGlobalVariableMap-only reads) the native scanner cannot trace. Check this file before
    spending time re-deriving why a variable 'looks unused'. But a suppression entry existing is not proof the variable is
    genuinely a false positive — see [[cmf_suppress_status_is_not_proof_a_variable_reference_is_real]] for the follow-up correction
    after one suppressed entry (tv_wonder_final_building_type_to_display_id) turned out to be a real duplicate/dead map, not
    a dynamic-reference case, and five more (the wonder progress-tracking variables) turned out to have zero setters at all.
  category: workflow
  scope: any
  source: data/cmf_warning_suppressions.yaml; scripts/in_game/common/on_action/gen_tv_cmf_suppressions.py
  notes: '2026-07-09: error.log flagged tv_advance_<id>_researched (31 advances, GUI-only read), tv_academy_debate_node_<1-5>_year/index/type
    (15 vars, GUI-only read), tv_research_open_age_ceiling (GUI-only read), tv_wonder_final_building_type_to_display_id and
    tv_trade_good_global_consumption/production (global_variable_map names, assumed never literally set_variable''d), tv_trade_chain_demand_slot_1..20
    (variable_map names, same reason), and parliament_seat (vanilla-consumed IO parliament-seat location, confirmed against
    reference_game_files) as used-but-never-set/set-but-never-used. All were added to data/cmf_warning_suppressions.yaml via
    new add_locked_advance_researched_suppressions/add_academy_debate_suppressions family functions plus TRADE_EXTRA_VARIABLES/trade-chain-slot-loop
    extensions and two extra_suppressions singletons, then tv_cmf_suppressions.txt was regenerated, without individually verifying
    each had a real reader. 2026-07-15: deeper investigation found tv_wonder_final_building_type_to_display_id was actually
    a dead duplicate of tv_wonder_final_building_type_to_wonder_id (same generator loop, same value, zero readers anywhere)
    and was deleted rather than re-suppressed — this entry was previously (and incorrectly) recorded as a ''confirmed legitimate
    dynamic-reference case.'' This note previously overwrote mechanic_similarity_audit_short_triggers_file_dominates_combined_ratio''s
    own notes via a duplicate YAML key in that entry (YAML mappings silently keep only the last value for a repeated key)
    — split into its own entry 2026-07-15.'
- id: cmm_compat_opt_in_reuses_legacy_setting_id
  pattern: null
  bad: Reusing a formerly enabled or hidden CMM setting ID for a new compatibility opt-in and expecting default_value = 0
    to reset upgraded saves
  correction: Register a compatibility-specific setting ID with default_value = 0, sync it to the gameplay alias, and omit
    the legacy setting ID. Gate the gameplay trigger through that alias and keep the feature off when CMM is absent.
  category: framework
  scope: country
  source: reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_bool_setting_effects.txt:28-35,56-59; reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_alias_effects.txt:99-115
  notes: Documentation-only (no regex lint). CMM applies a setting's default only when its variable-map key is missing. A
    saved legacy key keeps its old value, so a fresh compatibility ID is the safe way to preserve default-off behavior without
    directly rewriting CMM internal maps.
- id: cmm_default_off_alias_initialized
  bad: Initializing a default-OFF CMM bool alias in the mod's on_game_start defaults effect, e.g. set_global_variable = {
    name = sol_x_enabled value = no }
  correction: 'Omit default-OFF aliases from the init effect entirely. cmm_sync_bool_alias sets the global only when the toggle
    is ON and calls remove_global_variable when OFF, so has_global_variable must stay false until CMM enables it. Also invert
    the CMM-absent fallback in the matching sol_*_is_on trigger: default-ON toggles use OR = { NOT = { has_global_variable_map
    = cmm } ... }, while default-OFF toggles must NOT include that escape or they read as enabled without CMM.'
  category: framework
  scope: global
  source: reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_alias_effects.txt:105-125; reference_mods/3662193478/in_game/common/scripted_effects/fum_cmm_effects.txt:8-15
    (FUM never initializes its default_value = 0 aliases)
  notes: 'Documentation-only (no regex lint) because a legitimate default-ON init line is textually identical apart from the
    value. set_global_variable with value = no still creates the key, so has_global_variable returns true and a default-OFF
    feature runs from turn one. Any setting registered with default_value = 0 must appear in exactly four places: cmm_register_global_bool_setting,
    cmm_sync_bool_alias, the cmf_on_callback switch, and a <mod_id>__<setting_id>_on_changed scripted GUI when cmm_add_scripted_gui
    is called — but never in the init defaults.'
- id: cmm_disabled_setting_left_registered
  pattern: null
  bad: Leaving a disabled feature in the mod's CMM registration effect, or directly mutating CMM internal maps to hide a stale
    setting from old saves
  correction: Replace the mod registration effect and omit disabled settings and callbacks. CMM's _cmm_register_group clears
    each group's setting-key list during every registration cycle, so omitted settings disappear from both new games and upgraded
    saves. Hard-disable the gameplay trigger separately for defense in depth.
  category: framework
  scope: country
  source: reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_effects.txt:198-199
  notes: Documentation-only (no regex lint). Localization and unused scripted GUI definitions do not create a visible setting;
    CMM panel visibility is driven by the rebuilt per-group registration list.
