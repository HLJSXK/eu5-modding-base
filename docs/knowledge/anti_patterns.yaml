    reference_game_files/game/in_game/common/on_action/_hardcoded.txt:1789-1792
  notes: The official type note says new songs are added in Wwise and registered by event key. Vanilla entries contain no
    trigger/chance/category fields beyond metadata, and the in-game music player plays registered track objects via GUI bindings.
    EU5 does expose Audio_PlayEvent to send a Wwise event to music_manager from GUI, and on_war_declared exists as a script
    hook, but current references do not expose EU4-style songs.txt conditional rules or a normal effect that directly plays
    a named music-player track.
- id: nested_location_scope_plain_var_reads_location_store
  pattern: ''
  detectability: advisory
  bad: Inside a location-scoped block (`capital = {}`, `var:site ?= {}`, `every_location_in_province = {}`, etc.), reading
    a country-owned numeric as plain `var:X`
  correction: Plain `var:X` always reads the current scope's variable store. After switching into a location/province block,
    use `root.var:X` when root is the original country owner, or capture the number before the scope switch with `set_local_variable`
    and use `local_var:X` inside the nested scope.
  category: scope
  scope: location
  source: 'reference_game_files/game/in_game/events/disaster/chinese_crisis_events.txt:306-311 (change_prosperity = root.var:character_ability_prosperity_variable);
    runtime error.log: common/scripted_effects/tv_engineering_department_effects.txt:2128-2129'
  notes: A nested location/province scope does not inherit country `var:` reads. If the numeric lives on the country, plain
    `var:X` inside the location block fetches the location variable store instead and can log 'Failed to fetch variable' /
    unset-scope errors.
- id: noncapital_building_country_effects_via_capital_country_modifier
  pattern: ''
  only_in_paths:
  - building_types
  bad: Using capital_country_modifier for a building that can be finalized or created outside the capital, expecting country-wide
    effects everywhere
  correction: Keep local effects in building modifier/raw_modifier; for noncapital national effects use Country Auto modifiers
    gated by owned buildings, or require the building to be in the capital.
  category: modifier
  scope: country
  source: reference_official_defines/types/building_types.txt:29
  notes: capital_country_modifier is explicitly applied to the country only if the building is built in the capital. Engineering
    Department wonders may be sited outside the capital, so their final buildings carry national/base/ritual country effects
    only as display data; actual national effects come from building-gated Country Auto modifiers.
- id: none_available_msg_key_missing_trigger_no_icon
  pattern: ''
  bad: none_available_msg_key localization value missing @trigger_no! icon prefix
  correction: In the localization YAML, the VALUE of the none_available_msg_key string must begin with @trigger_no! — e.g.
    "@trigger_no! No characters available." The key name itself has no prefix requirement.
  category: localization
  scope: any
  source: src/main_menu/localization/english/tv_arts_exhibition_l_english.yml:27
  notes: 'Engine logs: Key X doesn''t exist or doesn''t start with trigger_no icon. The @trigger_no! inline icon must be the
