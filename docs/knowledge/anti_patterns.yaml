- id: console_effect_and_debug_log_values
  pattern: null
  bad: Relying on debug_log with GuiScope.SetRoot(...).ScriptValue(...) to read numbers during in-game tests
  correction: 'Run effects from the console as `effect c:TAG = { ... }`. Record numbers in the CMF Action Log instead: cache
