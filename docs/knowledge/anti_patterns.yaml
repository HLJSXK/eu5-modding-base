  source: EU5 runtime error docs/error_log/error.log:10; reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:333
  notes: GUI datamodel item descriptions can only contain a single child and no properties. Multiple top-level children log
    'Malformed item desc' and can cause adjacent formatter noise while the list is rendered.
