- id: gui_variable_comparison_no_operators
  pattern: ''
  bad: Using > >= < <= == operators directly in GUI visible expressions to compare variable values (e.g. visible = "[Country.MakeScope.GetVariable('x').GetValue
    >= 3]")
  correction: 'Use typed comparison functions: GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.GetVariable(''name'').GetValue,
    ''(CFixedPoint)N.0'') for integer milestone variables; EqualTo_float(FixedPointToFloat(...GetValue), ''(float)N.0'') for
    float comparisons'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/situation/treaty_of_tordesillas.gui:138
  notes: EU5 GUI expression language has no inline comparison operators; all comparisons require named typed functions (GreaterThanOrEqualTo_CFixedPoint,
    LessThan_float, EqualTo_int32, etc.) with explicit type-cast literals
- id: gui_variable_isset_check
  pattern: ''
  bad: Using HasVariable or is_set (script trigger syntax) inside a GUI visible expression to check whether a situation-scope
    variable exists
  correction: 'Use GetVariable(''name'').IsSet as the final accessor in a GUI visible expression: visible = "[SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable(''name'').IsSet]"'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/situation/council_of_trent.gui:232, golden_age_of_piracy.gui:139
  notes: HasVariable is a script-side trigger and does not exist in the GUI expression language. GetVariable('name').IsSet
    is the GUI-native null guard for optional variables stored on situation/country scopes.
- id: gui_visibility_gate_on_proxy_variable_not_the_real_condition
  pattern: ''
  detectability: advisory
  bad: Gating a GUI visibility toggle on a proxy variable's mere existence (e.g. `tv_wonder_active_part`, 'which part is currently
    targeted') when the intended condition is a different, related-but-distinct fact (e.g. 'is real monthly progress > 0 actually
    accumulating right now').
  correction: '`tv_wonder_active_part` gets assigned by `tv_wonder_monthly_construction_effect` purely from `tv_wonder_organization_logistics_unlocked_trigger`
    (debate/lock/site-selected/not-complete) plus ''some part is still below max'' — it says nothing about whether the labor
    camp is actually staffed (`tv_wonder_has_organized_labor_trigger` / `total_effective_building_levels:tv_wonder_labor_camp
    > 0`) or whether `tv_wonder_monthly_construction_progress` is actually nonzero this month. A wonder can have `tv_wonder_active_part`
    set while producing zero real progress (e.g. an unstaffed Labor Camp), so a GUI toggle built on `active_part.IsSet` alone
    silently drifts from the intended ''is there a genuinely working site'' condition. Add an explicit check on the real underlying
    variable (`GreaterThan_CFixedPoint(GetVariable(''tv_wonder_monthly_construction_progress'').GetValue, ''(CFixedPoint)0.0'')`)
    alongside the proxy, rather than trusting the proxy to always track it.'
  category: gui
  scope: any
  source: src_engineering_department/in_game/gui/panels/organization/tv_engineering_department.gui (construction card, TV_ENGINEERING_CONSTRUCTION_NO_ACTIVE_SITE_TEXT
    / TV_ENGINEERING_CONSTRUCTION_REMAINING_TEXT visibility); src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt
    tv_wonder_monthly_construction_effect; src_engineering_department/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt
    tv_wonder_has_organized_labor_trigger
  notes: '2026-07-15: user reported that the ''when monthly progress is 0, show no available work site instead of a remaining-time
    estimate'' behavior had stopped working. Traced to the construction card''s two visibility conditions (added 2026-07-13,
    commit 469ab549) having always been gated purely on `tv_wonder_active_part.IsSet` — a proxy that was never actually tied
    to real progress, since the monthly auto-advance branch that assigns `tv_wonder_active_part` does not check `tv_wonder_has_organized_labor_trigger`
    the way the four manual tv_wonder_begin_foundation/body/function/decoration actions already do. Added `GreaterThan_CFixedPoint(...
    tv_wonder_monthly_construction_progress ..., 0)` to both visibility conditions (AND''d with the existing active_part check)
    so the GUI now reflects genuine 0-progress stalls (e.g. an unstaffed Labor Camp) instead of only ''no part selected at
    all''. Left tv_wonder_monthly_construction_effect''s script-side auto-advance logic untouched since the underlying construction
    math already self-corrects (0 progress never crosses a completion threshold) — this was purely a display-layer gap.'
- id: gui_wrapping_text_without_max_width_inflates_frame
  pattern: null
  bad: Placing a wrapping `text_multi`/`textbox` in a layout without a `max_width`, assuming the parent's width will constrain
    it
  correction: 'Give every wrapping text an explicit `max_width`. An hbox measures its children with no width hint, so an uncapped
    multiline text reports its full *unwrapped* width as a **minimum**, and a minimum defeats the contextual-tooltip width
    cap: the whole tooltip is dragged wider than its frame. `max_width` caps that minimum as well as the hint.'
  category: gui
  scope: any
  source: Symptom measured in the project renderer (an informational paragraph reported 663px as a minimum inside a 520px
    card); mechanism in `ai_gui_assessment/renderer/engine.py` `hw = max(min(hw, tooltip_avail), child_min_w)`
  notes: Missed twice in the SOL tooltip rebuild - first as a bare `text_multi`, then again after rebuilding it on TooltipListBase,
    because the cap only applies once `max_width` is set. Rule also in the GUI guide section 2 (2026-10-13).
- id: has_building_is_not_completion_gate
  pattern: ''
  detectability: advisory
  only_in_paths:
  - scripted_triggers
  - generic_actions
  - scripted_effects
  bad: Using has_building = building_type:X as the gate for a mechanic that should unlock only after X is completed
  correction: Use has_building_with_at_least_one_level = X for completed-building gates. Keep separate under-construction
    checks such as building_levels_under_construction >= 1 when the mechanic needs to block duplicate queues.
  category: script
  scope: building
  source: User-reported IO establishment bug, 2026-06-24; fixed in scripts/gen_victory.py. Syntax verified in reference_game_files/game/in_game/events/economy/building_events.txt:7
    and reference_game_files/game/main_menu/localization/english/triggers_l_english.yml:2033.
  notes: The IO establishment headquarters cache used has_building on the capital, so starting construction made the step-3
    appoint-chief action available before the headquarters finished. The completed gate must require an actual built level.
- id: hbox_explicit_size_without_layoutpolicy_horizontal_collapses_to_content_width
  pattern: ''
  detectability: advisory
  bad: An hbox/vbox sets an explicit `size = { W H }` to bound a mixed fixed-column + expanding-column layout (e.g. a fixed
    icon widget plus an expanding text_multi) but does not itself declare `layoutpolicy_horizontal = expanding` -- e.g. gen_tv_wonder_ceremony_cards_gui.py's
    per-card `hbox = { size = {432 104} spacing = 8 widget {...64px icon...} text_multi {...} }`.
  correction: When a container combines an explicit `size` hint with expanding children, also set `layoutpolicy_horizontal
    = expanding` (and `layoutpolicy_vertical` if relevant) on the container itself, matching this file's own established precedent
    (Pharos stage rows at tv_engineering_department.gui:8401-8402; the Hagia active-ritual row at :9372-9375). Without it,
    the declared `size` is not honored -- the container instead sizes itself to the sum of its children's intrinsic minimums,
    so a fixed-width icon column plus a text_multi with no minimumsize (0 intrinsic width until stretch is applied) collapses
    the whole row to roughly just the icon's width, leaving the text column effectively 0px wide and unselectable.
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:8401-8402 (Pharos hbox, layoutpolicy_horizontal
    = expanding + explicit size, correct precedent); :9372-9375 (Hagia hbox, same pattern); TV_WONDER_CEREMONY_CARDS per-card
    hbox, fixed 2026-07-12 by gen_tv_wonder_ceremony_cards_gui.py
  notes: 'Reported by the user via in-game inspection: the per-card content hbox rendered at ~80px wide (icon column + spacing
    only) instead of its declared 432px, and the flavor text_multi was unselectable (effectively 0 width). A prior guess that
    the missing property was `ignoreinvisible = yes` on the same hbox was reverted by the user as not addressing the actual
    observed symptom; the real gap was the container''s own layoutpolicy_horizontal. This rule is specific to hbox/vbox as
    multi-child flex containers -- for the DIFFERENT (but easy to conflate) failure where a vbox uses `set_parent_size_to_minimum
    = yes`, see `set_parent_size_to_minimum_vbox_needs_leaf_minimumsize_for_width` instead; adding layoutpolicy_horizontal
    to the surrounding widget/vbox in that case has no effect and was reverted by the user as such.'
- id: hidden_event_missing_title
  pattern: ''
