- id: gui_modify_texture_requires_rendered_layer
  pattern: ''
  detectability: advisory
  only_in_paths:
  - gui
  bad: Putting modify_texture directly in a layout/type block such as a card_bg override that expands into a vbox
  correction: Put modify_texture inside a rendered background, icon, or other image-layer block. For card_bg overrides, preserve
