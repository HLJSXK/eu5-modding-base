    (GetShortNameWithNoTooltip)
  notes: HasLeader is a method on Unit (for army/navy leaders), not on InternationalOrganization. Calling it on an IO scope
    produces 'Could not find data system function HasLeader' and a malformed token error. IsLeaderCountryInPlace is the equivalent
    check for IOs.
