- id: missing_localization_for_new_modifier_price_auto_modifier_definitions
  pattern: ''
  detectability: lint
  validator: check_modifier_type_definition_loc_and_icon_coverage, check_auto_modifier_name_loc_coverage, check_price_name_loc_coverage
  bad: Adding a new common/modifier_type_definitions, common/auto_modifiers, or common/prices entry without its required companion
