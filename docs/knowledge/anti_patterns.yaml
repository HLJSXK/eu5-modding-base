- id: gui_expression_properties_need_brackets
  pattern: null
  bad: Passing an expression to a numeric property without brackets, e.g. `layoutstretchfactor_horizontal = "FixedPointToInt(Multiply_float(x,
    1000))"`
  correction: 'Expression-valued properties must be wrapped as `"[...]"`. Unbracketed, the string does not evaluate: it resolves
    to the default (0 for stretch factors), which the engine then treats as a real value, so two such children split the space
    evenly instead of proportionally.'
  category: gui
  scope: any
  source: Existing expression rules in docs/guides/EU5_GUI_Modding_Guide.md §4; reproduced in the project renderer (Evaluator.resolve
    vs. literal) with `run.py proto` - an unbracketed pair of stretch factors landed at 36/36 in a 72px hbox instead of 17/983
  notes: 'Adjacent trap: the project renderer''s evaluator functions are BINARY - `Max_float(a, b, c)` raises `TypeError`,
    so multi-argument folds must be nested pairwise (2026-10-13).'
