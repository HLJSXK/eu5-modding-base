  - scripted_effects
  - gen_location_window
  - wonder_mechanics
  bad: Using location.owner inside a scripted effect rendered by ShowScriptedEffectForScope with LocationView.GetLocation.MakeScope.Self
  correction: When the GUI passes the location itself as the effect scope, enter the owning country with owner ?= { ... }.
    Reserve location.owner for contexts that expose a separate location event target, such as building on_built.
