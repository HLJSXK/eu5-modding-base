  bad: Using EU5 1.3 *_efficiency cost-style modifier keys while the project/reference data target EU5 1.2
  correction: 'Use the EU5 1.2 *_cost modifier key. When rolling back from 1.3, invert the value sign: +x% efficiency becomes
    -x% cost, while -x% efficiency becomes +x% cost.'
  category: modifier
  scope: any
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:3115,4025,4057,4065,4073,6600,6616,6864,6872,15389
  notes: The current reference files define 1.2 cost-style keys and do not define the migrated 1.3 efficiency keys. EU5 1.3
    replaced several of these with good-colored percent efficiency variants; changing direction without sign inversion reverses
    the intended gameplay effect.
- id: eu5_has_no_ck2_style_global_flag_use_global_variable
  pattern: set_global_flag|has_global_flag|remove_global_flag
  detectability: lint
  bad: Using EU4/CK2-style `set_global_flag = X` / `has_global_flag = X` / `remove_global_flag = X` in EU5 script, on the
    assumption every Paradox/Jomini game has this exact global-flag mechanism.
  correction: 'EU5 has no `global_flag` effect/trigger at all — confirmed by an exhaustive grep of `reference_official_defines/docs/effects.log`
    and `triggers.log` (zero matches for `flag` in either) and of every file under `reference_game_files/`. The real EU5/Jomini
    equivalent is a bare global variable: `set_global_variable = X` (shorthand for `set_global_variable = { name = X value
    = yes }`) and `has_global_variable = X`, both `Supported Scopes: none` (usable from anywhere). Confirmed extensively in
    vanilla (e.g. `reference_game_files/game/in_game/common/on_action/_hardcoded.txt:564` `set_global_variable = byzantine_empire_fallen`)
    and in community mods (`reference_mods/3613232232/in_game/common/on_action/pp_game_start.txt`''s `pp_mod_welcome_situation_completed`/`pp_mod_welcome_situation_pending`
    pattern, which this mod''s own standalone-mod-bootstrap event copied).'
  category: effect
  scope: any
  source: reference_official_defines/docs/effects.log:10145 (set_global_variable), triggers.log:4844 (has_global_variable);
    reference_game_files/game/in_game/common/on_action/_hardcoded.txt:546,564,1624,3674, D008_lutheran.txt, italian_wars.txt,
    hre.txt, crusade.txt, country_specific.txt, 22_swiss_confederation.txt; reference_mods/3613232232/in_game/common/on_action/pp_game_start.txt:127-142
  notes: Found 2026-07 while implementing the standalone Engineering Department mod's game-start/game-load bootstrap (data/pulse_registry.yaml
    + src_engineering_department/in_game/common/on_action/tv_engineering_department_standalone_on_action.txt), which needed
    a save-wide 'has this mod's intro event already run' marker not tied to any one country. The doc entries for set_global_variable/has_global_variable
    themselves quote the generic set_variable/has_variable usage examples verbatim (a documentation copy-paste artifact, not
    a syntax difference) — trust the real vanilla usage sites over the doc's literal example text.
- id: eu5_vanilla_copy_singleton_file_cannot_split_across_mods
  pattern: ''
  detectability: advisory
  bad: Treating a winner-takes-all 'full vanilla copy with mod entries inserted' file (e.g. `character_title.txt`, `messagetypes.txt`)
    as an additive registry, or assuming dependency metadata alone makes the intended superset copy load last.
  correction: 'Files in this category are NOT name-keyed registries where independent per-file entries accumulate: the winning
    whole-file definition must contain every entry needed by the enabled mods it overrides. Standalone roots may carry only
    their own insertions when the playset manually sorts a later superset root after them; for TV+Engineering this means Engineering
    Department carries only Engineering entries, while the main TV copy carries the TV + Engineering Department union and
    must be sorted after Engineering Department. Validate the vanilla prefix and each root''s expected singleton coverage.'
  category: localization
  scope: any
  source: scripts/in_game/common/customizable_localization/gen_character_title.py; scripts/gen_messagetypes.py; scripts/validate.py
    check_vanilla_copy_integrity; runtime error.log message_handler.cpp:421, 2026-07-28
  notes: 'Found 2026-07 while splitting the Engineering Department subsystem into `src_engineering_department/`; an initial
    standalone-subset/main-superset strategy assumed the main dependency would load later. Runtime logs on 2026-07-28 showed
    the Engineering Department singleton winning instead: all 81 main-only `PERFORM_`, `WE_PERFORM_`, and `ACTION_*_PERFORMED_ON_US`
    message types failed lookup despite appearing in the main copy. The other shared multi-IO files are genuine name-keyed
    registries and split cleanly. Updated 2026-08-01 after the user chose to manually sort TV after Engineering Department:
    `gen_character_title.py`, `gen_messagetypes.py`, and `check_vanilla_copy_integrity()` now enforce root-specific standalone
    subsets plus the main TV+Engineering superset instead of byte equality.'
- id: europedia_custom_scrollbox_missing_size_contract
  pattern: ''
  detectability: advisory
  bad: Adding a static card-list vbox under a custom Europedia scrollbox without an expanding visible root/scrollbox/card-list
    root, a minimum content height, and expanding filter buttons
  correction: For the custom tab use `using = layoutpolicy_expanding` on its visible root and scrollbox; give the generated
    vbox directly inside `scrollbox_content` both `using = layoutpolicy_expanding` and `set_parent_dimension_to_minimum =
    height`; set `layoutpolicy_horizontal = expanding` on every filter button. Preserve this in gen_tv_encyclopedia_wonders_cards_gui.py
    so regeneration cannot drop the contract.
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/ui_library.gui:133-140, 12926-12934; src_engineering_department/in_game/gui/encyclopedia_lateralview.gui;
    scripts_engineering_department/in_game/gui/gen_tv_encyclopedia_wonders_cards_gui.py
  notes: The first custom Towards Victory tab omitted the expanding/minimum-height contract from its static card-list root
    and did not expand its filter buttons. The parser accepted the GUI but layout received no stable content extent, producing
    an upper-left collapse at runtime.
- id: europedia_page_has_no_native_registration
  pattern: ''
  detectability: advisory
  bad: Assuming EU5's Europedia (Encyclopedia) sidebar supports adding a new named page/category through data -- e.g. a `page
    =`/`category =` field on a `game_concept` block, or a `common/encyclopedia_pages/`-style registry folder -- and searching
    for one before implementing a custom browsable tab
  correction: 'There is no such registration point anywhere in reference_game_files or reference_official_defines: `Encyclopedia.AccessPages`/`EncyclopediaPage`
    is a read-only, engine-populated collection with getters only (GetTitle, Self, AccessSelf) and no AddPage/RegisterPage
    function. The only working approach (confirmed against community mod 3613232232, a released Workshop mod) is to fully
    override in_game/gui/encyclopedia_lateralview.gui and toggle two mutually-exclusive content trees with a GetVariableSystem
    variable (see docs/knowledge/risk_cards/europedia.md for the full pattern, adopted for src_engineering_department/in_game/gui/encyclopedia_lateralview.gui''s
    tv_encyclopedia_active tab).'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/encyclopedia_lateralview.gui; reference_official_defines/docs/data_types_uncategorized.txt
    (Encyclopedia/EncyclopediaPage API, no register/create function); reference_mods/3613232232/in_game/gui/encyclopedia_lateralview.gui
    (pp_encyclopedia_active toggle pattern)
  notes: 'src_engineering_department/in_game/gui/encyclopedia_lateralview.gui implements a ''Towards Victory'' tab this way:
    tv_encyclopedia_active toggles vanilla content vs. a custom vbox, tv_encyclopedia_filter (all/mechanics/generic/unique)
    gates individual generated cards. Card list is generated by scripts_engineering_department/in_game/gui/gen_tv_encyclopedia_wonders_cards_gui.py
    and spliced by merge_tv_encyclopedia_wonders_cards_gui.py via a `# BEGIN/END GENERATED TV_ENCYCLOPEDIA_CARDS` marker pair,
    reusing every existing game_concept_<id>/_desc pair from tv_game_concepts_l_*.yml and tv_engineering_department_wonder_mechanics_l_*.yml
    rather than authoring new prose.'
- id: event_building_cost_manual_text_hidden_construction
  detectability: advisory
  pattern: ''
  only_in_paths:
  - events
  - scripted_effects
  - localization
  bad: Event option text manually states a building cost while the real construction is hidden behind pay_price plus free
    or silent construct_building
  correction: Put real building construction in the visible option effect chain when the player should see the cost. Let `construct_building`
    / `change_building_level_in_location` render the building name, price, and modifiers automatically. Use manual `pay_price`
    and hidden construction only for intentionally hidden or nonstandard funding flows.
  category: event
  scope: building
  source: tv_govhouse.5 Local Administration confirmation cleanup, 2026-07-07
  notes: The Governor's House local-administration event option said 'Build ... for 400 ducats' while a hidden follow-up paid
    tv_govhouse_local_administration_price and constructed the building with cost_multiplier = 0. Moving construct_building
    into the visible option made the engine render the actual building cost and avoids stale duplicated cost text.
- id: event_flavor_invalid_key
  pattern: ^\s+flavor\s*=\s*flavor_
  bad: flavor = flavor_neutral / flavor_good / flavor_bad inside an event block
  correction: 'Use outcome = neutral / good / bad / positive / negative instead. Valid values confirmed from vanilla: neutral,
    good, bad, positive, negative.'
  category: event
  scope: any
  source: reference_game_files/game/in_game/events/culture/culture_greek.txt:2847 (outcome = neutral)
  notes: 'EU5 uses outcome = (neutral|good|bad|positive|negative); there is no ''flavor'' key on events. Using flavor causes
    ''Unexpected token: flavor'' parse errors and the event will be missing an outcome.'
- id: event_gui_structure_downgrade_for_data_change
  detectability: advisory
  pattern: ''
  only_in_paths:
  - events
  - gui
  - scripted_effects
  - localization
  bad: Collapsing existing per-target event descriptions, target-specific options, per-id effect dispatch, staged GUI rows,
    or localized branch text into generic fallback behavior just to make a data-list change smaller
  correction: Preserve the existing player-facing structure when changing the data set. If the branch count is large, extend
    the appropriate generator/data source first, or stop and ask before changing structure. Do not silently replace target-specific
    UX with generic text/options or leave stale unreachable branches.
  category: event
  scope: any
  source: User correction during Academy research-target update, 2026-07-06
  notes: A data-list update is not permission to downgrade event/GUI structure. Removing or genericizing established branch
    structure is a design change and must be explicitly requested or approved.
- id: event_id_multi_dot
  pattern: ^[a-z_]+\.[a-z_]+\.\d+\s*=\s*\{
  bad: Event ID with more than one dot, e.g. tv.conquest.1 = { type = country_event ... }
  correction: Event ID must be exactly <namespace>.<integer> with one dot. Use one namespace per category (e.g. namespace
    = tv_conquest, IDs tv_conquest.1..5), or flatten to sequential integers under one namespace. Localization keys for title/desc/option
    name CAN still use dotted suffixes (tv_conquest.1.t).
  category: event
  scope: any
  source: reference_game_files/game/in_game/events/ages.txt:1-3 (namespace = ages_of_eu, ID ages_of_eu.1)
  notes: 'EU5 jomini_eventmanager splits the event ID on the FIRST dot. tv.conquest.1 becomes namespace ''tv'' + integer ''conquest.1''
    which fails to parse, the event is dropped, and surviving entries collide as duplicates. Engine error: ''Failed to split
    namespaced event ID, needs to be in the form of namespace.integer''.'
- id: event_loc_root_makescope_getvariable
  pattern: \bROOT\.MakeScope\.GetVariable\(
  only_in_paths:
  - localization
  bad: ROOT.MakeScope.GetVariable('var_name') inside event localization
  correction: Use ROOT.GetVariable('var_name') in event localization. Reserve Country.MakeScope.GetVariable(...) / Location.MakeScope.GetVariable(...)
    for GUI object contexts.
  category: localization
  scope: any
  source: reference_game_files/game/main_menu/localization/english/events/DHE/flavor_mal_l_english.yml:46
  notes: In event localization, ROOT is already a script scope. Adding MakeScope produces runtime data errors such as 'Could
    not find promote for MakeScope' and 'Failed converting statement'.
- id: event_missing_outcome_field
  pattern: ''
  bad: country_event / age_event / etc. without an 'outcome = ...' top-level field
  correction: 'Add ''outcome = neutral'' (or good / bad / positive / negative) below ''desc = ...'' in every event block.
    Vanilla 1.2 added a hard validator: events without an outcome emit ''Event #X is missing an outcome'' to error.log on
    game-load. The five accepted values are neutral, good, bad, positive, negative — match the event''s actual flavor (use
    neutral for pure-notification events with no consequential choice).'
  category: event
  scope: any
  source: 'reference_game_files/game/in_game/events/ages.txt:7 (ages_of_eu.1 uses ''outcome = neutral''); EU5 1.2 changelog
    — added in unscoped ''Bug Fixes'' / event_database validator pass; engine error: ''Event #X is missing an outcome in events/Y.txt''
    from event_database.cpp:648'
  notes: Pre-1.2 events did not require this field and ran fine without it. 1.2 added the validator that emits the missing-outcome
    warning per event, per file-load. The warning does NOT block the event from firing in-game, but it floods error.log and
    indicates a category mismatch. Use 'outcome = neutral' for tooltip-only / show_as_tooltip notification events (matches
    vanilla age events). Use 'good' / 'bad' / 'positive' / 'negative' when the event has a clear directional flavor for the
    player. Documentation-only entry (no regex lint) because parsing top-level event blocks reliably is hard, and validate.py
    would over- or under-match.
- id: event_multiple_desc_blocks_invalid
  pattern: ''
  bad: Two or more top-level desc = { ... } blocks on the same event — e.g. desc = { desc = key_a trigger = {...} } followed
    by desc = { desc = key_b trigger = {...} }
  correction: 'Use a single desc block with first_valid + triggered_desc children: desc = { first_valid = { triggered_desc
    = { trigger = { ... } desc = key_a } triggered_desc = { trigger = { ... } desc = key_b } } }'
  category: event
  scope: any
  source: reference_game_files/game/in_game/events/culture/culture_greek.txt:2831-2846
  notes: EU5 allows only one top-level desc block per event. A second desc block at the same level causes 'Scoped pointer
    has already been read' and 'There should be only one special desc' engine errors. All conditional descriptions must be
    nested inside a single desc = { first_valid = { ... } } block.
- id: event_numeric_id_over_9999
  pattern: ''
  detectability: advisory
  bad: Generating or referencing an event ID whose numeric part is 10000 or higher, such as tv_engineering_department.50011
  correction: EU5 event IDs must be <namespace>.<integer> with the integer below 10000. Do high-cardinality dispatch before
    firing the event, or branch only over a small non-event-id dimension inside an already typed event.
  category: event
  scope: any
  source: 'runtime error.log: jomini_eventmanager.cpp:141, 2026-06-08'
  notes: The engine logs that five-digit numeric event IDs are invalid and can then report duplicate IDs as parser fallout.
    scripts/validate.py scans src/data/scripts for dotted event references whose numeric part is >= 10000.
- id: event_option_computed_variable_map_key_for_dynamic_building_tooltip
  detectability: needs_parser
  pattern: ''
  only_in_paths:
  - events
  - scripted_effects
  bad: A visible event option/helper computes a temporary variable-map key and immediately uses global_variable_map(...|var:X)
    to choose a dynamic building for construct_building or change_building_level_in_location
  correction: Do not infer that dynamic building effects are unsupported. For tooltip-visible building effects, use a map
    key that already exists before the event opens, or branch over bounded non-wonder dimensions such as module part or ceremony
    style and use direct maps keyed by persistent project state. Capture the mapped building type into a local variable before
    switching to the location scope.
  category: event
  scope: variable_map
  source: 'In-game runtime test, 2026-06-05: tv_engineering_department.200 and .201 rendered dynamic module construct/demolition
    effects after replacing the same-chain tv_wonder_locked * 10 + part map key with per-part maps keyed directly by tv_wonder_locked;
    helper-building construction already rendered through tv_wonder_id_to_helper_building_type.'
  notes: The failed chain was set_variable/change_variable of tv_wonder_module_building_key followed by set_local_variable
    value = global_variable_map(tv_wonder_module_key_to_building_type|var:tv_wonder_module_building_key) and building_type
    = local_var:tv_wonder_module_building_type. The working chain branches on tv_wonder_last_completed_part, captures from
    tv_wonder_id_to_<part>_module_building_type keyed by var:tv_wonder_locked, and then runs construct_building/change_building_level_in_location
    with local_var:tv_wonder_module_building_type. This preserves variable_map/numeric-id architecture without generated per-wonder
    dispatch tables.
- id: event_option_effect_reads_newly_set_variable
  detectability: needs_parser
  pattern: ''
  bad: Event option effect sets variable X and then immediately calls a visible helper that compares var:X, assuming the option
    tooltip pre-evaluator sees the new value
  correction: Wrap the state-changing/application sequence in hidden_effect, or make the called helper guard has_variable
    before direct var:X comparisons. For optional option triggers, use var:X ?= N.
  category: event
  scope: country
  source: 'runtime error.log: tv_govhouse.40 -> tv_govhouse_approve_pending_tactic_effect -> tv_govhouse_apply_tactic_effect'
  notes: EU5 event option tooltip generation may pre-evaluate option effects without committing earlier set_variable writes.
    A later visible direct var:X comparison can fetch an unset variable repeatedly while the event is open.
- id: event_option_hidden_effect_not_performance_boundary
  detectability: advisory
  pattern: ''
  only_in_paths:
  - events
  - scripted_effects
  bad: Putting global scans, high-cardinality dispatch, broadcasts, construction cleanup, map rebuilds, or other heavy work
    in an event option hidden_effect and expecting tooltip hover not to evaluate it
  correction: Keep option hidden_effect blocks to light guards or scheduler calls. Run heavy hidden work from a hidden = yes
    event immediate block or another non-tooltip execution path.
  category: event
  scope: any
  source: User-reported Engineering Department wonder finalization tooltip stutter, 2026-06-10; fixed in generated tv_wonder_finalization_events.txt
    / tv_wonder_finalization_effects.txt via tv_engineering_department.6202
  notes: hidden_effect suppresses visible tooltip output, but it does not isolate event-option code from hover evaluation.
    The wonder finalization hidden chain was expensive because it included per-wonder/per-style dispatch, final building construction,
    cleanup, world-news broadcast, post-finalization priority caching, and project-state clearing.
- id: event_option_name_needs_customizable_localization_not_dynamic_dispatch
  pattern: ''
  detectability: advisory
  bad: Trying to make an event `option.name` read differently per-condition by wrapping it in a `first_valid`/`triggered_desc`
    block, the same way `title`/`desc` support dynamic per-condition dispatch.
  correction: 'There is no vanilla or mod precedent anywhere for `option.name = { first_valid = { ... } }` (confirmed by an
    exhaustive grep of reference_game_files/game/in_game/events and every reference mod) — `option.name` is always a single
    flat localization key. To make that fixed key''s displayed text vary per scope/condition, keep `option.name` as a flat
    key and instead give that key''s `.yml` VALUE a Customizable Localization call: `some_key:0 "[ROOT.Custom(''some_block'')]"`,
    where `some_block` is a new `type = country` (or matching scope) block in `in_game/common/customizable_localization/`
    with one `text = { trigger = {...} localization_key = ... }` entry per case plus a `fallback = yes` entry. This keeps
    the event''s option structure completely unchanged and reuses an already-verified engine mechanism instead of an unverified
    one.'
  category: event
  scope: any
  source: docs/technical/EU5_Modding_Knowledge_Base.md 'Customizable Localization Syntax and Usage'; src/in_game/common/customizable_localization/tv_academy_debate_groups.txt
    (existing 1-block precedent in this mod); scripts/in_game/common/customizable_localization/gen_tv_wonder_ceremony_options.py
    + src/in_game/common/customizable_localization/tv_wonder_ceremony_options.txt (16-block precedent, one per ceremony stage
    x pay/decline, 121 text entries each)
  notes: Found 2026-07 while reworking the Unique Wonder Ceremony's two per-stage event options to read as wonder-specific
    flavor text (previously one generic 'Pay the price.'/'Not yet.' pair shared by all 121 wonders x 8 stages). The event's
    `tv_wonder_ceremony_events.txt` needed zero changes; only the loc generators changed, from a static string per flat key
    to `[ROOT.Custom(...)]`. See docs/knowledge/risk_cards/wonders.md rule 26.
- id: event_option_temp_variable_used_by_visible_helper
  detectability: needs_parser
  pattern: ''
  only_in_paths:
  - events
  - scripted_effects
  bad: Event option or visible event helper computes a temporary variable and a later visible helper compares var:X or uses
    scope.var:X as an effect value
  correction: Do not rely on temporary variables written earlier in the same visible option/effect chain. Use optional checks
    directly against persistent state, branch over bounded values with literals, or wrap the state-changing chain in hidden_effect
    when the nested tooltip is not needed.
  category: event
  scope: any
  source: 'runtime error.log: tv_engineering_department.500 -> tv_wonder_complete_finalization_effect -> tv_wonder_construct_final_building_effect
    -> tv_wonder_construct_final_building_in_site_effect; tv_prosperity.1 -> tv_grant_prosperity_milestone_1 -> tv_engineering_department_create_effect
    -> tv_wonder_reinitialize_building_state_effect -> tv_wonder_combine_completed_modules_at_location_effect; tv_engineering_department.200
    -> tv_wonder_after_unit_completed_event_effect -> tv_wonder_apply_helper_building_to_final_site_effect / tv_wonder_materialize_module_buildings_from_unit_vars_effect
    / tv_wonder_update_construction_progress_display_effect'
  notes: The event option tooltip pre-evaluator did not commit tv_wonder_final_building_extra_levels before the nested helper
    ran. The same failure reappeared when Prosperity M1 reinitialized wonder module/helper buildings from partially built
    wonders, and again when unit-completion hover rebuilt helper/module levels through temporary current/target vars. For
    bounded 0..6 helper/module sync, emit literal per-level building deltas directly from persistent state instead of temporary
    combinable/current/target variables. For rounded countdown displays, prefer script-value operators such as ceiling/floor
    over scratch check variables like tv_wonder_remaining_months_floor_check.
- id: expanding_row_wrapper_vbox_missing_layoutpolicy_horizontal
  pattern: ''
  detectability: advisory
  bad: Wrapping an already-working `hbox { layoutpolicy_horizontal = expanding ... expand = {} ... }` row in a NEW parent
    `vbox` (e.g. to gate both the row and its alternate/placeholder `text_single` behind one shared `visible` condition) without
    also giving that new wrapper `vbox` its own `layoutpolicy_horizontal = expanding`.
  correction: 'A `vbox`/`hbox` container''s own horizontal sizing defaults to shrinking-to-content unless a `layoutpolicy_horizontal`
    is explicitly declared; it does NOT automatically inherit or forward its ancestor''s fixed width to its children. When
    the immediate parent enforces a fixed column width (e.g. `layoutpolicy_horizontal = fixed` + matching `minimumsize`/`maximumsize`,
    as in `tv_engineering_suitability_location_conditions_column`''s 218px sibling column), every intermediate wrapper between
    that fixed-width ancestor and an `expanding` row must also declare `layoutpolicy_horizontal = expanding`, or the chain
    breaks at that wrapper: the `expanding` row inside only gets the wrapper''s shrunk-to-content width to expand into, so
    an `expand = {}` widget inside it renders at 0px and the row never reaches the intended max width. Give the new wrapper
    `layoutpolicy_horizontal = expanding` at the point it''s introduced.'
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:1766 (regression); git show dc585057:src/in_game/gui/panels/organization/tv_engineering_department.gui:1766
    (pre-refactor working precedent -- hbox was a direct child of the fixed-218px column vbox, not wrapped); scripts/in_game/gui/panels/organization/gen_tv_engineering_department_wonder_mechanics_gui.py
    suitability_dynamic_row()
  notes: Regressed 2026-07-13 by commit 84141ceb ('Refactor suitability conditions localization and logic'), which introduced
    `suitability_dynamic_row()`'s per-row wrapper `vbox` (grouping the reveal-gated `hbox` with its 'hidden' `text_single`
    fallback behind one `visible` check) to replace the old flat alternating hbox/text_single siblings directly under the
    fixed-218px column vbox. The user reported in-game that an `expand = {}` widget inside the row `hbox` rendered at 0 width
    and the row never reached its expected max width; comparing against the pre-refactor GUI (same commit range as this same-day
    suitability GUI collapse, see `gui_dynamic_composite_key_variable_map_lookup`) showed the old `hbox` was a direct fixed-column
    child, so its own `layoutpolicy_horizontal = expanding` correctly picked up the 218px fixed width -- the new wrapper vbox
    sat between them without a horizontal policy of its own. Fixed by adding `layoutpolicy_horizontal = expanding` to the
    wrapper vbox in `suitability_dynamic_row()`, then regenerating via `gen_tv_engineering_department_wonder_mechanics_gui.py`
    + `merge_tv_engineering_department_wonder_mechanics_gui.py` (this GUI section is fragment-generated then merged into the
    hand-maintained file, not a straight generated-file overwrite).
- id: flat_gold_cost_when_dynamic_event_cost_intended
  pattern: ''
  bad: Hardcoding add_gold = -N for an event option that should scale with the country's economy
  correction: Use vanilla scripted effect change_gold_effect = { scale = -N } for dynamic country-event costs. The effect
    scales with capital_wealth and country_economical_base and clamps the result.
  category: script
  scope: country
  source: reference_game_files/game/in_game/common/scripted_effects/country_gold_effects.txt:1, reference_game_files/game/in_game/events/government/laws.txt:238
  notes: Vanilla event laws.0005 uses change_gold_effect = { scale = -3.5 } for the paid +10 research-progress option. Use
    fixed add_gold only when a flat cost is the design intent.
- id: float_precision_exceeds_5dp
  pattern: \d\.\d{6,}
  bad: float literal with 6+ decimal places (e.g. value = 0.123456789)
  correction: 'Round to at most 5 decimal places: value = 0.12346; EU5 engine reads no further'
  category: precision
  scope: any
  source: user-reported engine behavior (2026-04)
  notes: EU5 engine truncates all float literals at 5 decimal places; digits beyond the 5th are silently ignored
- id: game_concept_loc_without_concept_definition
  pattern: ''
  only_in_paths:
  - localization
  bad: Adding localization keys game_concept_tv_x / game_concept_tv_x_desc and then using [tv_x|e] without defining tv_x in
    main_menu/common/game_concepts
  correction: Register every custom concept ID in src/main_menu/common/game_concepts/tv_game_concepts.txt with at least a
    texture block. Localization alone is not enough.
  category: localization
  scope: game_concepts
  source: 'reference_game_files/game/main_menu/common/game_concepts/00_game_concepts.txt:73-75; runtime error.log: Data error
    in loc string ''tv_cultural_m1_io_grant_tt'''
  notes: Unregistered custom concepts in square brackets are parsed as data-system functions. The engine logs 'Could not find
    data system function <concept>' and renders ERROR:<concept> in tooltip text.
- id: game_is_initialized_delays_situation_spawn
  pattern: game_is_initialized\s*=\s*yes
  only_in_paths:
  - situations
  bad: can_start = { game_is_initialized = yes } on a situation intended to spawn at game start
  correction: Use can_start = { always = yes } for situations with monthly_spawn_chance_unique that should exist from turn
    1. game_is_initialized evaluates to current_date > 1337.5.1 (strictly greater); EU5 starts on exactly 1337.5.x, so the
    first spawn attempt fails and the situation spawns one month late.
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/scripted_triggers/game_triggers.txt:58-60
  notes: game_is_initialized = { current_date > 1337.5.1 }. The strict > operator means month-1 (1337.5.x) evaluates to FALSE.
    Situation spawns in month 2 and becomes visible to the player in month 3 due to UI propagation delay. For non-popup situations
    with on_start initialization, always = yes is safe because monthly_spawn_chance_unique prevents duplicate instances.
- id: generated_static_modifier_key_flood_hash_collision_risk
  pattern: ''
  detectability: advisory
  only_in_paths:
  - scripts/in_game/common/static_modifiers
  - data
  bad: 'A generator that emits one static_modifier (and therefore one auto-derived STATIC_MODIFIER_NAME_<id> localization
    key) per integer value across a large numeric range -- e.g. scripts/in_game/common/static_modifiers/gen_tv_trade_chain_display_modifiers.py
    emitting tv_trade_chain_strength_display_0 .. tv_trade_chain_strength_display_20000, 20001 modifiers/keys from a single
    strength_display_cap: 20000 in data/trade_chain.yaml'
  correction: Prefer bucketing a continuously-scaling display value into a bounded number of tiers (e.g. every 50 or 100 points)
    rather than one generated key per exact integer, both to keep modifier/localization key counts sane and to reduce the
    chance of a 32-bit loc key hash colliding with an unrelated vanilla or mod key. Not yet applied to tv_trade_chain_display_modifiers.py
    as of 2026-07-11 -- left as-is per explicit project owner decision; if new hash collisions appear whose 'other' key traces
    back to this generator, bucketing becomes the recommended fix.
  category: localization
  scope: global
  source: 'docs/error_log/error.log 2026-07-11 session: pdx_localize.cpp hash collisions between STATIC_MODIFIER_NAME_tv_trade_chain_strength_display_{3346,7162,7844,10455,11629}
    and unrelated vanilla keys (flavor_rus.35.b.entry, name_takayoshi, flavor_ven.49.a, PERFORM_call_parliament_ACTION_DESC,
    tv_engineering_department.1197.b, break_sow_discontent_desc); one of the collisions (flavor_ven.49.a) subsequently logged
    as ''Unrecognized loc key'' at CEventOptionDesc:172, i.e. the collision measurably broke an unrelated vanilla event option''s
    text that same session.'
  notes: This is a known-accepted risk, not a fix-in-progress. Do not add ad hoc mitigation (renaming just the colliding keys,
    etc.) without revisiting the project owner's decision -- the actual fix, if pursued, is reducing key volume at the generator
    level (bucketing), not patching individual collisions as they're discovered.
- id: generic_action_ai_list_io_leader_country_this
  pattern: any_international_organizations_member_of\s*=\s*\{[^{}]*\bleader_country\s*=\s*this\b
  detectability: lint
  only_in_paths:
  - generic_action_ai_lists
  bad: Comparing leader_country to this inside any_international_organizations_member_of in a generic_action_ai_list
  correction: 'The AI-list potential root is the evaluating country, while this becomes the IO inside the iterator. Compare
    with root instead: exists = leader_country; leader_country = root.'
  category: scope
  scope: country
  source: reference_game_files/game/in_game/common/generic_action_ai_lists/readme.txt:10; reference_game_files/game/in_game/common/generic_action_ai_lists/high_kingship_of_ireland_list.txt:13-15
  notes: Inside the IO membership iterator, this is the international organization. leader_country = this compares a country
    to an international_organization and logs a type-mismatch error.
- id: generic_action_allow_rechecks_select_target_availability
  pattern: ''
  detectability: advisory
  only_in_paths:
  - generic_actions
  bad: A generic action allow block calls a has-any-valid-target trigger solely to prevent opening an empty select_trigger
    chooser
  correction: Do not duplicate selector candidate scans in allow. Keep allow for actor/state/resource prerequisites, put target
    eligibility in select_trigger visible/enabled, provide none_available_msg_key for an empty chooser, and keep the final
    effect guarded with exists = scope:target.
  category: performance
  scope: generic_actions
  source: reference_game_files/game/in_game/common/generic_actions/readme.txt:43-44; project performance rule, 2026-06-20
  notes: EU5 already handles a select_trigger with no selectable targets by showing the none_available_msg_key and blocking
    completion of that selection step. Repeating the same any-target scan in allow charges action rendering, tooltip evaluation,
    and AI/list evaluation before the chooser performs its own candidate pass.
- id: generic_action_character_type_is_unsupported
  pattern: ^[ \t]*type\s*=\s*character\b
  detectability: lint
  only_in_paths:
  - common/generic_actions/
  bad: Using `type = character` in a common/generic_actions definition
  correction: Generic actions cannot use the `character` EGenericActionType in the current engine build. Keep country/situation
    controls as supported generic actions, and define an action that appears on a character's lateral-view or context menu
    under common/character_interactions instead. Give that interaction a character select_trigger with target_flag = recipient,
    then use scope:recipient after the selector has supplied it.
  category: enum
  scope: character
  source: error.log interaction_target.cpp:1407 and pdx_persistent_reader.cpp:289, 2026-07-30; reference_game_files/game/in_game/common/character_interactions/readme.txt;
    reference_game_files/game/in_game/common/character_interactions/appoint_dragoman.txt
  notes: 'The generic_actions readme still lists character in a stale type comment, but runtime rejects every `type = character`
    definition with `Failed to read enum! Type: EGenericActionType, Val character`.'
- id: generic_action_cleanup_effect_must_be_hidden
  pattern: ''
  only_in_paths:
  - generic_actions
  bad: Calling cleanup-only scripted effects from a visible generic action effect
  correction: Wrap cleanup/rebuild-only helper calls in hidden_effect = { ... }. scripts/validate.py enforces the registered
    high-risk helper list, including tv_governor_remove_effect.
  category: script
  scope: any
  source: runtime tooltip pre-evaluation errors from Governor's House regional governor dismissal; fixed in src/in_game/common/generic_actions/tv_govhouse_actions.txt
  notes: Generic action effect tooltips can pre-evaluate cleanup helpers, causing variable/list cleanup chains to run through
    unsafe reads while merely hovering the button. Hidden output is required for these internal maintenance effects.
- id: generic_action_confirmation_needs_pending_variable_overlay_not_engine_window
  pattern: ''
  detectability: advisory
  bad: 'RETRACTED 2026-07-13 — DO NOT build a custom pending-variable + shared overlay GUI to make a generic-action button
    ''ask for confirmation''. A prior version of this rule claimed the engine has no mod-facing confirmation mechanism and
    prescribed exactly that workaround; it was wrong. The actual bad pattern is the workaround itself: staging a click into
    a pending-id country variable, rendering a shared scrim+dialog overlay gated on that variable, and dispatching Confirm/Cancel
    through a big if/else_if chain — all to reproduce something the engine already does natively.'
  correction: 'Set `force_click_and_confirm_or_hold = yes` directly on the `generic_action` definition (see `reference_game_files/game/in_game/common/generic_actions/readme.txt:76`:
    ''optional, to always show confirmation dialog. Useful for tweaking dangerous IO actions like declaring wars without redoing
    UI layout''). The engine shows its own native confirmation dialog before running the action''s `effect`, reusing the SAME
    `title`/`description` loc keys the action''s `action_button` already sets for its tooltip — no extra loc keys, no pending
    variable, no custom overlay widget tree needed. `main_menu/gui/confirm_window.gui`''s `ConfirmWindow` singleton (the thing
    the original search was looking for and correctly ruled out as not parametrizable) is unrelated to this — `force_click_and_confirm_or_hold`
    is a different, per-generic_action-level field, not a GUI window.'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/common/generic_actions/readme.txt:76; reference_game_files/game/in_game/common/generic_actions/tatar_yoke.txt:2
    and italian_wars.txt:1313 (both `force_click_and_confirm_or_hold = yes` on a plain generic_action, right after `type =
    ...`); scripts/victory_tree_node_codegen.py generate_actions (fixed to add the field directly to each node's action instead
    of the deleted pending-variable dispatch)
  notes: 'Implemented 2026-07-13 for the Victory Path Tree''s click-to-unlock flow, then corrected same-day. First pass searched
    reference_game_files for a reusable confirmation window, found only the hardcoded `ConfirmWindow` singleton (no mod-facing
    hook for a custom on-confirm effect), and WRONGLY concluded no native mechanism existed at all — missing the separate,
    un-searched-for `force_click_and_confirm_or_hold` field on `generic_action` itself. Built the pending-variable (`tv_tree_pending_id`)
    + shared overlay (`append_tree_pending_confirm_overlay`) workaround instead, which then needed two more anti_patterns
    entries (`gui_sibling_overlay_outside_datacontext_scope_loses_context`, `blockoverride_content_indirectly_inside_vbox_via_base_template`)
    just to debug the overlay''s own GUI structure bugs. The user flagged that EU5 natively supports click-and-confirm and
    asked for the entire workaround to be deleted; verified via the generic_actions readme and two vanilla examples, then
    removed `PENDING_VAR`/`CONFIRM_ACTION`/`CANCEL_ACTION`/`node_uid`/`PATH_ORDER` from `victory_tree_node_codegen.py`, the
    whole `append_tree_pending_confirm_overlay` function and its call from `gen_tv_victory_situation_gui.py`, and the two
    now-dead action ids from `gen_messagetypes.py`. Lesson: when a reference search comes back negative for the FIRST mechanism
    you think of (a modal window), check the readme/field list of the RELEVANT script object (here, `generic_actions/readme.txt`)
    for a purpose-built field before concluding ''no native support'' and reaching for a custom GUI workaround.'
- id: generic_action_helper_assumes_root_owner
  detectability: needs_parser
  pattern: ''
  only_in_paths:
  - generic_actions
  - scripted_effects
  bad: A reusable helper reached from a generic-action effect compares IO leader/member state to `root`, assuming `root` is
    the action actor or current country
  correction: At helper entry or before changing scope, save the current owner/actor with `save_scope_as = <owner_scope>`,
    then compare against `scope:<owner_scope>` inside nested IO/member iterators. Use `root` only in contexts whose root scope
    is verified by the caller.
  category: scope
  scope: generic_actions
  source: 'runtime error.log: tv_establish_science_io -> tv_academy_debate_change_local_progress_effect, 2026-07-07'
  notes: The Academy Philosophy debate progress helper used `leader_country ?= root` under `every_international_organizations_member_of`.
    Generic-action effect pre-evaluation reached it with no valid root RHS and logged `Invalid right side during comparison
    'root'`; saving `tv_academy_debate_progress_owner` at helper start made the comparison stable.
- id: generic_action_hidden_effect_not_hover_boundary
  detectability: advisory
  pattern: ''
  only_in_paths:
  - generic_actions
  - scripted_effects
  bad: A generic action effect wrapped in hidden_effect still initializes variables that a later helper compares during select_trigger
    hover pre-evaluation
  correction: Do not treat hidden_effect as a hover-evaluation barrier in generic actions. Guard the action effect on persistent
    state and make nested helper reads safe with optional variable links, persistent-state checks, or local scratch variables
    that are compared before persistent display variables are written.
  category: script
  scope: any
  source: 'runtime error.log: common/generic_actions/tv_govhouse_actions.txt:142 -> common/scripted_effects/tv_govhouse_effects.txt:1307;
    common/generic_actions/tv_io_leader_actions.txt:823 -> tv_academy_philosophy_refresh_timeline_effect, 2026-07-07'
  notes: Hovering the Governor appointment selector still reached tv_governor_apply_modifiers_effect even though the appointment
    chain used hidden_effect. The same class reappeared when the Science IO establishment action reached the Academy Philosophy
    timeline refresh through an effect chain. The pre-evaluator walked into helpers and needed safe reads or local scratch
    calculations for newly initialized task/display variables.
- id: generic_action_loc_uses_gui_country_binding
