- id: gui_no_get_area_accessor
  pattern: GetVariable\([^)]*\)\.GetArea\.
  bad: GetVariable('tv_governed_area').GetArea.GetName — navigating from a scope variable that stores an Area to call .GetName
    directly via .GetArea
  correction: GetVariable(...).GetArea is not a valid EU5 GUI accessor. To display an area name from a scope variable, store
    a location from the area as a separate character variable (e.g. tv_governed_area_capital), then use GetVariable('tv_governed_area_capital').GetLocation.GetArea.GetNameWithNoTooltip.
    Location.GetArea.GetName IS valid when the Location type is a proper GUI-layer typed object (e.g. from GetLocation on
    a typed view).
  category: gui
  scope: any
  source: Exhaustive search of reference_game_files/game/main_menu/gui/ — zero occurrences of GetVariable(...).GetArea in
    any .gui file. Location.GetArea IS used in reference_game_files/game/in_game/gui/context_menu.gui and area.gui (typed
    Location, not scope variable). GetVariable('x').GetLocation confirmed valid in fall_of_delhi.gui.
  notes: 'The accessor .GetArea exists on the Location GUI type but not on scope variable wrappers returned by GetVariable().
    Chain: GetVariable(''loc_var'').GetLocation.GetArea.GetNameWithNoTooltip works because GetLocation returns a typed Location
    object. Pattern rule narrowed to only flag GetVariable(...).GetArea. to allow Location.GetArea. chains.'
