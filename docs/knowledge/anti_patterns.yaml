    while the key is passed through a local variable.
- id: variable_map_owner_read_from_item_iterator_scope
  pattern: ''
  detectability: needs_parser
  bad: Calling is_key_in_variable_map or variable_map(...) for a country-scoped map directly from an every_in_list/random_in_list/any_in_list
    item scope such as a region, location, or character
  correction: Save the country/map owner before the item iterator, copy the dynamic key to a local variable, and run both
    is_key_in_variable_map and the quoted variable_map scope link inside scope:<saved_owner>.
  category: scope
  scope: variable_map
  source: 'Runtime error.log: common/scripted_effects/tv_govhouse_effects.txt:2281 via Governor''s House creation, 2026-07-07'
  notes: Governor's House display refresh iterated tv_govhouse_region_list, making the current scope a region. The country-scoped
    region_to_admin_location map check then logged 'This scope doesn't support variables' for each region. The same pattern
    can happen while iterating character/location lists; variable-map reads belong on the scope that owns the map.
- id: variable_map_reread_as_confirmation_gate
  detectability: advisory
  pattern: ''
  only_in_paths:
  - events
  - scripted_effects
  bad: A non-silent confirmation event's hidden follow-up re-reads a variable_map/global_variable_map entry for the event's
    key and identity-matches it against the scope captured when the event was queued, instead of validating the captured scope
    directly
  correction: When an event can stay open for arbitrary game time before the player answers, do not treat a variable_map lookup
    at confirm-time as the source of truth for what the player is confirming. Validate the scope saved at queue time/immediate
    (ownership, building state, etc.) directly, and only write it back into the map after that direct validation succeeds.
    Make any trailing unconditional cleanup effect conditional on the confirmation having actually committed, so a failed
    confirm leaves the pending state for the real recovery/re-request path instead of silently discarding it.
  category: event
  scope: variable_map
  source: tv_govhouse.5 Local Administration confirmation region-disappears-from-list bug, 2026-07-12
  notes: tv_govhouse_confirm_local_administration_event_scope_effect re-derived scope:tv_govhouse_selected_admin_location
    from tv_govhouse_region_to_admin_location_map and required it to `this =` match scope:tv_govhouse_pending_local_admin_scope.
    Because tv_govhouse.5 is trigger_event_non_silently and can sit open while on_location_changed_owner / admin-location-loss
    handling legitimately reselects the map's candidate for the region, the map value could drift away from the location the
    player actually built on. The identity match then silently failed, tv_governor_appoint_effect (and therefore the tv_govhouse_region_display_list
    rebuild) was skipped, and the unconditional trailing cleanup discarded the pending request anyway -- making the region
    vanish from the Governor's House list. Fixed by validating scope:tv_govhouse_pending_local_admin_scope directly (owner
    ?= only -- NOT has_building_with_at_least_one_level, since the same instant construct_building in this option's visible
    effect does not reliably update that read yet) and gating the cleanup on a committed flag.
- id: variable_map_scope_link_used_direct_rhs
  pattern: ''
  detectability: needs_parser
  bad: Using a quoted variable_map/global_variable_map/local_variable_map lookup directly as an equality right-hand side,
    trigger comparison RHS, or effect parameter after scope switching
  correction: Use variable-map lookups primarily as left-side scope links. When the mapped value is needed as a RHS, first
    capture it with set_local_variable or set_variable in the map-owning scope, then use local_var:X or var:X. Prefer local_var
    for temporary values.
  category: scope
  scope: variable_map
  source: User-provided Variable maps reference excerpt, 2026-06-04; TV runtime test with Engineering Department wonder helper
    building probes
  notes: Quoted variable-map expressions are reliable for entering the mapped value scope on the left side. Runtime tests
    found direct RHS use unreliable for value extraction or comparisons, e.g. building_type = "variable_map(...)" inside a
    later location/building scope. Cache the mapped value before entering the later scope.
- id: variable_map_value_inline_math_block
  pattern: add_to_(?:global_)?variable_map\s*=\s*\{[^\n]*\bvalue\s*=\s*\{
  bad: Passing an inline arithmetic block such as value = { value = var:X divide = var:Y } to add_to_global_variable_map
  correction: Evaluate arithmetic with set_variable first, pass the resulting scalar as value = var:temporary_value, then
    remove the temporary variable after the map write.
  category: scope
  scope: any
  source: 'runtime error.log (2026-08-07): Failed to find event target link ''{'' and Failed to read ''divide''/''min'' for
    add_to_global_variable_map; reference_mods/3739393770/in_game/common/scripted_effects/dmsd_update_display.txt:30-33'
  notes: The variable-map effect parses value as a direct scalar or event target, not a script-math block. The invalid SOL
    CMF writes corrupted class raw-average/share diagnostics without changing classification or solver gameplay state.
- id: variable_prefix_must_be_var
  pattern: \bvariable:[a-zA-Z_]
  bad: variable:NAME as an event-target / value reference (e.g. value = variable:foo, multiply = variable:foo, add = variable:foo)
  correction: 'Use the short form: var:NAME (e.g. value = var:foo). EU5/Jomini''s event-target link prefix for scope variables
    is ''var'', not ''variable''. The long form does not resolve.'
  category: scripted_values
  scope: any
  source: reference_game_files/game/in_game/common/attribute_columns/06_country.txt:149
  notes: 'Engine error: ''Failed to find a valid event target link variable:NAME'' / ''Cannot read [variable:NAME] as a script
    value''. The set_variable / change_variable / has_variable effects all use the keyword ''variable'' inside their own block
    (name = NAME, value = X), but READING a variable elsewhere in script_values, triggers, or modifier values requires the
    var: prefix. Comments in source files often informally write ''variable:foo'' for documentation — never copy that into
    actual code.'
- id: while_waiting_for_instant_building_level
  pattern: ''
  only_in_paths:
  - scripted_effects
  bad: A while loop checks location_building_level and then tries to drive construct_building instant = yes or change_building_level_in_location
    until the level catches up
  correction: Do not wait for location_building_level to change inside the same effect. Use fixed if / else_if branches or
    a bounded script-value delta so the effect runs once and never depends on a 0-day build task updating synchronously.
  category: script
  scope: building
  detectability: needs_parser
  source: 'fixed in src/in_game/common/scripted_effects/tv_engineering_department_effects.txt; runtime behavior: construct_building
    instant = yes queues a 0-day task rather than synchronously updating the level'
  notes: Wonder selection/finalization previously used while loops that assumed instant construction updated the location
    building level during the same effect. That can deadlock or spin forever because the engine only creates a queued task.
    Treat instant construction as asynchronous for script control flow.
- id: yaml_localization_non_ascii_quotes
  pattern: '[“”‘’]'
  only_in_paths:
  - /localization/
  bad: Smart/curly quotes (“”‘’) in localization YAML
  correction: Use straight ASCII double-quotes (") only; escape with \" inside values
  category: localization
  scope: any
  source: reference_official_defines/docs/data_types_gui.txt; reference_game_files/game/in_game/events/DHE/flavor_FRA.txt (flavor_fra.428 comment)
  notes: >-
    This rule applies only to localization files, as declared by only_in_paths.
    Script comments and other source text are outside its scope; the vanilla
    flavor_fra.428 header contains d’Opera and must survive verbatim copying.
    Scope metadata and provenance corrected 2026-10-22; validators must honor
    the generic path metadata rather than special-case this rule ID.
- id: gui_parser_uppercase_types_group_ignored
  pattern: ''
  detectability: advisory
  category: gui
  scope: any
  bad: Recognizing only lowercase types declarations silently omits vanilla HUD bars.
  correction: Parse both types and Types group keywords; preserve type-name case and register their children normally.
  source: reference_game_files/game/in_game/gui/hud_topbar.gui:46; reference_game_files/game/in_game/gui/panels/left_panel/left_panel.gui:93
  notes: Shared parser regression covers both spellings and type expansion; full HUD preview retains unresolved-binding diagnostics.
- id: offline_preview_samples_detached_from_current_data
  pattern: ''
  detectability: advisory
  category: workflow
  scope: any
  bad: Hand-authored offline effect examples drift from current data, selected options or completion state, or are presented as engine output.
  correction: Derive labeled sample effect text from the authoritative current project data and scenario. Keep lifecycle and selected-option dispatch in the workspace; use shared fixtures.modifier_sample_lines for numeric modifier formatting with caller-supplied metadata and selected localization. Leave unknown bindings diagnostic and do not treat samples as script execution or in-game validation.
  source: ai_gui_assessment/renderer/eu5_gui_renderer/fixtures.py modifier_sample_lines; ai_gui_assessment/renderer/tests/test_preview.py; eu5-towards-victory/ai_gui_assessment/tests/test_engineering.py test_ritual_effect_samples_follow_selected_style_and_completion
  notes: Extracted from the unified ritual offline preview update, 2026-10-23. Shared formatting is tested with synthetic modifiers; project ritual schemas and reward rules remain local.
- id: offline_preview_detail_crops_use_fixed_coordinates
  pattern: ''
  detectability: advisory
  category: workflow
  scope: any
  bad: Offline detail previews hardcode card rectangles, reopen full images in project adapters, or render detached subtrees with missing parent context.
  correction: Pass elements from the fresh expanded panel through preview.render_tree detail_elements. The shared pipeline crops the final bitmap after layout using scaled bounds clipped to the image, omits unplaced or out-of-image elements and writes detail paths with the main diagnostics report. Workspaces own semantic selectors and suffix names only.
  source: ai_gui_assessment/renderer/eu5_gui_renderer/preview.py render_tree; ai_gui_assessment/renderer/tests/test_preview.py test_details_follow_scaled_layout_and_clip_to_the_rendered_image; docs/guides/EU5_GUI_Modding_Guide.md
  notes: Offline synthetic regressions cover fractional scale, partial clipping, hidden/outside elements and report persistence, 2026-10-23. Crops preserve the original panel bitmap and its rendering limits.
