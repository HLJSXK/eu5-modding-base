- id: gui_dynamic_composite_key_variable_map_lookup
  pattern: ''
  detectability: advisory
  bad: Emitting one static, near-duplicate GUI `widget` block per data-table row (e.g. one `visible = mechanic_id == N` branch
    per wonder) purely to display a (label, value) pair that is otherwise homogeneous across rows -- e.g. the pre-2026-07-13
    Engineering Department 'suitability location conditions' block, 54 near-identical widgets (~4000 generated lines) differing
    only in loc key and a flat bonus number per wonder.
  correction: 'GUI expressions can build a dynamic composite key at runtime with `MakeScopeFlag(Concatenate(''<system_prefix>_'',
    Concatenate(<id_string>, ''_<slot>'')))` and read a value baked into a global variable map with `GetVariableFromGlobalVariableMap(''<map_name>'',
    <composite_key>).GetValue`, matching a `flag:<system_prefix>_<id>_<slot>` key written at generation time via `add_to_global_variable_map`.
    Give the flag a named prefix (e.g. `tv_wonder_suitability_`), not a bare `<id>_<slot>` number pair -- a bare-number flag
    key is indistinguishable from a concatenation bug when it shows up in error.log''s benign ''flag is set but never used''
    notice (see the sibling advisory note on this same entry). Combine with `text = "[Localize(Concatenate(''PREFIX_'', ToString_int32(FixedPointToInt(<id_value>))))]"`
    to resolve a dynamic loc key from a small numeric enum id. This collapses N per-row static branches into one shared widget
    plus two small generation-time-static lookup tables (condition/label id, numeric weight), keyed `flag:<system_prefix>_<entity_id>_<slot>`.
    Only applies when the *display* is homogeneous (same widget shape, different data); do not use this to flatten genuinely
    heterogeneous per-target logic (e.g. per-wonder survey trigger scripts checking different location conditions), which
    the Structural Fidelity Rule still requires to stay as explicit branches. If the user wants the per-key ''flag is set
    but never used'' log noise eliminated rather than accepted: `has_flag` is NOT a valid EU5 trigger at all -- Jomini has
    no EU4-style boolean flag system, and referencing `has_flag = <key>` anywhere logs ''Unknown trigger type: has_flag''
    on load (this was a bug in the original fix attempt, not a working scanner-satisfier). Since a `flag:<name>` variable-map
    key is a string-typed map key, not a scope flag, the real reference is `is_key_in_global_variable_map = { name = <map_name>
    target = flag:<key> }` against the map that keys off it (e.g. `tv_wonder_suitability_condition_type`), placed inside a
    scripted trigger/effect that is itself reachable from a real on_action/event/decision entry point (e.g. called once from
    an existing on_game_start/on_game_load hook) -- an unreachable/never-called scripted trigger or effect does NOT satisfy
    the scanner even though it textually contains the reference; the engine''s own message says so explicitly (''Use in unused
    scripted triggers and effects also does not count''). See tv_wonder_suitability_flag_static_reference_trigger for the
    working pattern: one generated trigger ORs `is_key_in_global_variable_map` across every baked key (always true since every
    key is baked at init, harmless), called once via a no-op `if` (`remove_variable` on a name that''s never set) from tv_wonder_initialize_index_on_game_start/_on_game_load.'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/religion/religious_doctrine.gui:24 (GetVariableFromVariableMap with
    a typed scope key); reference_mods/3683328614/in_game/gui/shared/aaa_noicthy_topbar_tooltips.gui:117 (GetVariableFromVariableMap
    reading a CFixedPoint value); reference_mods/3692202776/loading_screen/data_binding/cmm_macros_list.txt:96 (GetVariableFromGlobalVariableMap('cmm',
    MakeScopeFlag(Concatenate(...))) -- the exact composite-key pattern); docs/technical/EU5_Modding_Knowledge_Base.md section
    5.2 and lines 1320-1329 (Localize(Concatenate(...)) dynamic loc key precedent); scripts/in_game/common/scripted_effects/gen_tv_wonder_index_effects.py
    (SUITABILITY_CONDITION_TYPE_MAP/SUITABILITY_WEIGHT_MAP writers); scripts/in_game/gui/panels/organization/gen_tv_engineering_department_wonder_mechanics_gui.py
    (suitability_knowledge_display reader); scripts/in_game/common/scripted_triggers/gen_tv_engineering_department_wonder_mechanics_triggers.py
    (append_suitability_flag_static_reference_trigger, tv_wonder_suitability_flag_static_reference_trigger); src/in_game/common/on_action/tv_engineering_department_on_action.txt
    (tv_wonder_initialize_index_on_game_start/_on_game_load call sites)
  notes: 'Implemented 2026-07-13 for the Engineering Department suitability panel: two new global variable maps (tv_wonder_suitability_condition_type,
    tv_wonder_suitability_weight) keyed flag:tv_wonder_suitability_<mechanic_id>_<slot 1..5>, baked once from suitability_knowledge_for_wonder()
    at generation time, replacing the 54-wonder GUI loop with one wonder-agnostic widget. Net effect: tv_engineering_department.gui
    dropped from 9041 to 5168 lines. validate.py cannot execute Concatenate/MakeScopeFlag/GetVariableFromGlobalVariableMap
    (no Clausewitz GUI expression interpreter in the pipeline), so any future change to this pattern still needs manual in-game
    verification per wonder/reveal-tier combination. In-game confirmed 2026-07-13: on load, error.log/jomini_effect.cpp:1162
    logs one ''Flag "<key>" is set but is never used'' line per baked flag key (270 = 54 mechanics x 5 slots). This is EXPECTED
    and benign -- the engine''s flag-usage scanner only tracks references from scripted triggers/effects, and its own message
    already documents that localization use doesn''t count; GUI-file reads (GetVariableFromGlobalVariableMap in .gui) are
    the same kind of blind spot. A first attempt to silence it by adding a `has_flag` reference inside a scripted trigger
    that was never called from anywhere still logged all 270 warnings, confirming the engine message''s own caveat that unused/unreachable
    scripted triggers and effects also don''t count. The user then asked for the warnings to actually be eliminated rather
    than accepted. Fix (same day): added `tv_wonder_suitability_flag_static_reference_trigger` (generated, one `OR` of `has_flag
    = tv_wonder_suitability_<mechanic_id>_<slot>` per baked key) and called it once from the existing, already-reachable `tv_wonder_initialize_index_on_game_start`/`_on_game_load`
    hidden_effect via a no-op `if` (`remove_variable` on a variable name that is never set elsewhere, so the branch has zero
    side effects whether or not the always-false OR matches). Making the *containing* trigger reachable, not just the flag
    literal present in a text file, is what satisfies the scanner. `SUITABILITY_KNOWLEDGE_ROW_SLOTS` and the `tv_wonder_suitability_<mechanic_id>_<slot>`
    key format were centralized into `scripts/wonder_mechanics/suitability_conditions.py` (`suitability_row_key()`) so both
    generators stay in sync. Do not add a per-flag repair anywhere else, and do not move this reference into a hot/monthly
    path -- it only needs to run once per game start/load.

    Correction (2026-07-13, same-day follow-up): the `has_flag` reference itself was invalid EU5 syntax -- error.log/pdx_persistent_reader.cpp:289
    logged ''Unknown trigger type: has_flag'' once per line (270 occurrences) on parse, before the flag-usage scanner even
    ran. `has_flag` does not exist in Jomini; there is no EU4-style boolean flag system. Since `flag:<key>` here is a string-typed
    `global_variable_map` key namespace, not a scope flag, the reference must instead be `is_key_in_global_variable_map =
    { name = tv_wonder_suitability_condition_type target = flag:tv_wonder_suitability_<mechanic_id>_<slot> }` (vanilla precedent:
    reference_game_files/game/in_game/common/country_interactions/hre.txt:897). `append_suitability_flag_static_reference_trigger`
    in the generator was updated to emit this instead; the OR now evaluates true for every entry (all keys are baked at init)
    rather than always-false, which remains harmless since this trigger is a static reference, not real gameplay logic.'
