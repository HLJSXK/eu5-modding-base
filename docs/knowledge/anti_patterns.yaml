- id: temporary_scope_name_collides_with_permanent_scope
  pattern: ''
  detectability: needs_parser
  bad: Using `save_temporary_scope_as = <name>` inside a `limit` block (or other trigger context) when the same effect/file
    also does a real `save_scope_as = <name>` with the identical name for the loop's payload, e.g. `every_in_list = { limit
    = { save_temporary_scope_as = tv_display_region ... } save_scope_as = tv_display_region ... }`
  correction: Give the trigger-context temporary save a distinct name (e.g. `tv_display_region_check`) and keep the real `save_scope_as
    = tv_display_region` for the effect body outside `limit`. This mod's convention (see `tv_govhouse_refresh_governor_display_effect`)
    is `<name>_check` for the limit-only temporary.
  category: scope
  scope: any
  source: src/in_game/common/scripted_effects/tv_govhouse_effects.txt:2295 (tv_govhouse_refresh_governor_display_effect region-init
    loop); docs/error_log/error.log jomini_eventscope.cpp:676
  notes: Engine logs `Trying to add the temporary target '<name>' which has the same name as a permanent target` and the effect/action
    silently fails at runtime (reproduced by appointing a regional governor). Temporary and permanent scope target names share
    one namespace per game-object scope; a `save_temporary_scope_as` registered inside a `limit`/trigger context conflicts
    with a later `save_scope_as` of the same name in the same effect chain, even though `save_temporary_scope_as` is otherwise
    the mandatory form inside trigger contexts (see EU5_Modding_Knowledge_Base.md 'save_scope_as is an effect only').
- id: tooltip_requirements_list_maximumsize_without_matching_minimumsize_override
  pattern: ''
  detectability: advisory
  bad: A `TooltipRequirementsList = { ... maximumsize = { N -1 } ... }` block with N narrower than the template's default
    minimumsize (400px, from `@tooltip_inner_wide = @tooltip_title_wide(420) - @tooltip_inner_margin(10)*2`) and no `blockoverride
    "tooltip_minimumsize"` to match -- e.g. tv_engineering_department.gui's three wonder-debate demand-row TooltipRequirementsList
    instances (nobles/burghers/clergy), each declaring only `maximumsize = { 230 -1 }`.
  correction: Whenever `maximumsize` on a `TooltipRequirementsList` is set narrower than the inherited 400px default, also
    add `blockoverride "tooltip_minimumsize" { minimumsize = { N -1 } }` with the same N. Without it, the wider inherited
    minimumsize wins over the narrower maximumsize and the widget renders near its ~400px minimum regardless, which -- inside
    a non-clipping `layoutpolicy_horizontal = fixed` ancestor chain -- bubbles up through every expanding container and stretches
    an outer fixed-`maximumsize` card wider than declared. Match the working precedent already used by every other TooltipRequirementsList
    instance in the same file (e.g. the 'suitability location conditions' blocks pairing `maximumsize = { 218 -1 }` with `blockoverride
    "tooltip_minimumsize" { minimumsize = { 218 -1 } }`).
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:337 (template default); src/in_game/gui/panels/organization/tv_engineering_department.gui:1728-1736
    (working precedent with tooltip_minimumsize override) vs. :1418-1426/:1490-1498/:1562-1570 (bug instance, fixed 2026-07-13)
  notes: Reported by the user as the Engineering Department wonder-debate Card (declared maximumsize = { 500 -1 }) visibly
    widening only while the debate stage (tv_wonder_stage == 1) was active, then reverting to 500px once the debate ended
    -- exactly matching the demand rows' visibility gate. Fixed by adding the missing tooltip_minimumsize override to all
    three TooltipRequirementsList instances.
- id: tooltip_table_column_field_text_no_width_cap_overflows_fixed_width_stringpairlist
  pattern: ''
  detectability: advisory
  bad: Placing a `TooltipStringPairList` inside a fixed-width column (`layoutpolicy_horizontal = fixed`, `maximumsize = {
    W -1 }`) to show `ShowModifierEffect(...)`/`ShowModifier(...)` breakdown rows, without also bounding the row text itself.
  correction: 'Vanilla `TooltipStringPairList` (`reference_game_files/game/in_game/gui/cooltip_types.gui`) renders each row
    through `TooltipStringPairListContent` -> two `TooltipTableColumn` children (label expanding, value fixed), each of which
    blockoverrides the shared `type TooltipTableColumn`''s `field_text` (`main_menu_cooltip_types.gui` ~L1771: `autoresize
    = yes` with no `max_width`) down to a `field_text_format` splice block that by default has zero width constraint. A parent''s
    `maximumsize`/`layoutpolicy_horizontal = fixed` only bounds the StringPairList''s own declared box; it does not clip or
    wrap the child `text_single`''s natural single-line width, so long English modifier-effect text (short in Chinese, long
    in English) renders past the column''s right edge with no error in the log. Fix by extending the existing `blockoverride
    "field_text_format" { fontsize = ... }` (already present at every StringPairList call site in this codebase for font sizing)
    to also add `autoresize = yes`, `max_width = ...`, and `elide = right` — verified as a valid vanilla `text_single` combination
    at `reference_game_files/game/in_game/gui/shared/io_tooltips.gui:459-466` (`text_single = { autoresize = yes elide = right
    using = tooltip_max_width_title_wide text = ... }`). This truncates with an ellipsis instead of overflowing, and does
    not require touching the vanilla `.gui` template at all, since `field_text_format` is already the caller-facing splice
    point. IMPORTANT: the label and value columns are two SIDE-BY-SIDE `TooltipTableColumn`/`TooltipTableField` instances
    sharing the ONE declared column width, and the caller-level `field_text_format` override reaches BOTH columns'' identically-named
    nested block simultaneously (confirmed by the pre-existing shared `fontsize` override applying uniformly). The first fix
    attempt set `max_width = column_width - 25`, accounting only for the label column''s OWN `margin={10,0}` + `spacing=5`
    chrome (~30px) and ignoring that the adjacent value column reserves its own ~30px chrome plus its own (short but nonzero)
    rendered text width out of the SAME total — that left almost no headroom for the value column and the overflow persisted.
    The correct budget is `column_width - (label_chrome ~30) - (value_chrome ~30) - (value_text_reserve ~45)` = `column_width
    - 105`, not `column_width - 25`.'
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui (type TooltipTableColumn, ~L1665-1722,
    ~L1771 field_text blockoverride); reference_game_files/game/in_game/gui/cooltip_types.gui (TooltipStringPairListContent
    ~L1091-1141, TooltipStringPairList ~L474); reference_game_files/game/in_game/gui/shared/io_tooltips.gui:459-466; scripts_engineering_department/in_game/gui/panels/organization/gen_tv_engineering_department_wonder_mechanics_gui.py
    preview_modifier_column; scripts_engineering_department/in_game/gui/gen_location_window.py render_modifier_column; 2026-07-17
  notes: '2026-07-17: user reported the Engineering Department wonder construction card and the location-page wonder tooltip
    both call two-column ShowModifierEffect breakdowns inside a fixed ~223px/218px column, and under English localization
    the modifier text (short enough in Chinese to fit) overflowed past the column''s right edge instead of being capped around
    the expected ~200px content width. Traced the render chain from the mod''s own `TooltipStringPairList` call site down
    through vanilla `cooltip_types.gui`/`main_menu_cooltip_types.gui` to confirm the shared `TooltipTableColumn` type''s `field_text`
    has no built-in width cap, then found `field_text_format` is the existing splice point already used in this codebase for
    `fontsize` overrides — extended it in both generator scripts (`preview_modifier_column`, `render_modifier_column`) with
    `autoresize = yes` / `max_width = column_width - 25` / `elide = right`, regenerated via each script plus their merge/compat
    steps (`merge_tv_engineering_department_wonder_mechanics_gui.py`, `scripts/compat/gen_tv_meiou_and_taxes_location_window.py`),
    and confirmed `scripts/validate.py --changed --fix --ai-report` passed clean. User then pointed out the chosen width was
    still too generous and asked for a more careful pass: `column_width - 25` only subtracted the label column''s own margin/spacing
    chrome and ignored that the value column sitting next to it in the same row draws from the SAME declared column width
    — corrected to `column_width - 105` (label chrome ~30 + value chrome ~30 + value text reserve ~45), regenerated again,
    `validate.py` re-confirmed clean. User then tested in-game and asked to widen the label back out to a flat `max_width
    = 140` (wider than the derived ~118/113 estimate, still narrower than the original overflowing 198/193) — set as a literal
    constant in both generators rather than a `column_width`-derived formula, since the user''s in-game check is the authoritative
    signal here, not the chrome arithmetic estimate.'
