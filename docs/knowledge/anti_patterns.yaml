- id: derived_cache_variable_not_recomputed_after_restoring_its_source_counters
  pattern: ''
  detectability: advisory
  bad: Restoring/backfilling a set of source counters (e.g. tv_wonder_foundation_units/body_units/function_units/decoration_units,
    read back from location_building_level for an existing pre-built building) without also re-running the effect that recomputes
    the derived cache variable (tv_wonder_level) computed from those counters, then immediately snapshotting that stale/still-unset
    derived variable elsewhere (tv_wonder_project_base_level = var:tv_wonder_level).
  correction: Whenever an effect restores/backfills the SOURCE counters a derived variable is computed from, immediately re-run
    the dedicated recompute effect (here, tv_wonder_update_wonder_level_effect) before anything downstream reads the derived
    variable. tv_wonder_select_construction_site_effect called tv_wonder_restore_locked_wonder_final_building_state_effect
    and tv_wonder_sync_units_from_buildings_effect (which correctly restore tv_wonder_*_units from the location's existing
    building levels) but never called tv_wonder_update_wonder_level_effect before capturing tv_wonder_project_base_level =
    var:tv_wonder_level a few lines later — so for a wonder resuming construction on a site with pre-existing progress (an
    existing-at-game-start unique wonder like Jerusalem's Dome of the Rock, initial_level > 0, or any wonder whose site already
    has partial levels), tv_wonder_level was still 0/unset at the exact moment of the snapshot, so the set_variable using
    that non-existent source silently produced no tv_wonder_project_base_level at all. Added the missing tv_wonder_update_wonder_level_effect
    call between the restore/sync calls and the snapshot. The debug/repair tool tv_wonder_reinitialize_building_state_core_effect
    already had the correct order (sync then update_wonder_level) — that established precedent is what confirmed the fix,
    and it was also missing the equivalent project_mode==2 + missing-base_level repair, which was added there too so players
    already stuck mid-playthrough (base_level already silently missing) can recover via the tv_reinitialize_mod debug action
    instead of needing a fresh project.
  category: effect
  scope: any
  source: src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt tv_wonder_select_construction_site_effect,
    tv_wonder_reinitialize_building_state_core_effect; src_engineering_department/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt
    tv_wonder_can_finish_construction_trigger
  notes: '2026-07-15: user reported the ''must gain a level since resuming'' Finish Construction gate stayed permanently blocked
    while expanding the pre-existing Dome of the Rock at Jerusalem, after the has_variable guard fix (see [[custom_tooltip_unguarded_comparison_corrupts_later_effect_tooltip_in_same_pass]])
    correctly stopped the pre-evaluation crash but exposed that tv_wonder_project_base_level was never actually being set
    for this exact scenario. Traced through tv_wonder_initialize_existing_unique_wonders_effect (seeds only the survey/final-building-level
    maps at game start, not the country''s own _units/level variables) -> the priority-project/proposal pipeline (correctly
    sets tv_wonder_project_mode=2 and tv_wonder_resume_project=1) -> tv_wonder_select_construction_site_effect (correctly
    restores _units from the site''s actual building levels via two dedicated restore effects, but never recomputed tv_wonder_level
    from them before the snapshot line two calls later). Confirmed data/unique_wonders.yaml id 103''s only final_buildings
    entry (style 1 = tv_wonder_unique_dome_of_the_rock_inaugurated, initial_level 1) is exactly what the restore effects look
    up, so the restore itself works fine — only the missing recompute call was the gap.'
- id: destroy_building_forcefully_in_button_effect_chain_fails_tooltip_preview_even_with_owner_link
  pattern: ''
  detectability: advisory
  bad: Calling a scripted_effect that contains `destroy_building`/`destroy_building_forcefully` directly (even through nested
    scripted_effect calls) from inside a player-clickable generic_action's own `effect = { ... }` body — the block the button's
    hover/tooltip preview pre-evaluates — even after the target is resolved through a correct implicit link (`owner`, `root`,
    etc., see [[destroy_building_target_via_custom_saved_scope_breaks_tooltip_preview]]).
  correction: 'The implicit-link fix only cures the case where the destroy target itself was mis-resolved (a custom `save_scope_as`).
    It does not cure the separate case where the destroy call sits directly inside the button''s own tooltip-pre-evaluated
    effect chain: `tv_wonder_finish_construction` (generic_actions/tv_engineering_department_actions.txt) has `effect = {
    scope:actor = { tv_wonder_finish_construction_effect = yes } }`, and `tv_wonder_finish_construction_effect` used to call
    `tv_wonder_destroy_labor_camp_effect = yes` inline before scheduling `trigger_event_non_silently = { id = tv_engineering_department.202
    days = 1 }`. Because the destroy call lived inside the directly-evaluated chain, the button''s preview pass still tried
    (and failed) to promote TARGET_BUILDING for the THIRD_DESTROY_BUILDING_EFFECT loc string, even with the owner-link fix
    already applied. Fixed by removing `tv_wonder_destroy_labor_camp_effect = yes` from `tv_wonder_finish_construction_effect`
    entirely and adding it to event `tv_engineering_department.202`''s `option` effect instead — the event already fires asynchronously
    via the existing `trigger_event_non_silently ... days = 1` call, so the destroy now runs after the button''s own preview
    pass has already rendered, from within an already-scoped event option rather than a hover-evaluated generic_action effect
    chain. This generalizes rule 9 in `docs/knowledge/risk_cards/wonders.md` (keep `hidden_effect` light, defer heavy chains
    to a triggered event''s `immediate`) to also cover a generic_action''s own non-hidden `effect =` body: any destroy_building
    call anywhere in that chain is pre-evaluated for the button tooltip, so it must be deferred to a separately-triggered
    event rather than run inline.'
  category: gui
  scope: any
  source: src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt tv_wonder_finish_construction_effect;
    src_engineering_department/in_game/common/generic_actions/tv_engineering_department_actions.txt tv_wonder_finish_construction;
    src_engineering_department/in_game/events/tv_engineering_department_events.txt tv_engineering_department.202; docs/error_log/error.log
    pdx_data_localize_helper.cpp:290, pdx_data_callstack.cpp:53, 2026-07-16
  notes: '2026-07-16: error.log kept showing the TARGET_BUILDING/THIRD_DESTROY_BUILDING_EFFECT error after the owner-link
    fix (commit 431810e7) had already landed, proving the two bugs were distinct and the first fix alone was insufficient.
    Moved `tv_wonder_destroy_labor_camp_effect = yes` out of `tv_wonder_finish_construction_effect` and into `tv_engineering_department.202`''s
    option effect. All three callers of `tv_wonder_finish_construction_effect` (the player button, an on_action auto-completion
    path, and an events.txt call) still schedule event 202 identically, so the demolition still happens on every completion
    path — it is now deferred until the event''s option resolves instead of running synchronously inside the completion effect.'
- id: destroy_building_forcefully_needs_hidden_effect_even_inside_deferred_event_option
  pattern: ''
  detectability: advisory
  bad: Deferring a `destroy_building`/`destroy_building_forcefully` call out of a generic_action's own `effect =` body into
    a separately-triggered event's `option`, and assuming that deferral alone (without also using `hidden_effect`) is enough
    to escape tooltip/effect-preview pre-evaluation.
  correction: Event options get the exact same hover/tooltip pre-evaluation walk that generic_action buttons do — the fix
    for [[destroy_building_forcefully_in_button_effect_chain_fails_tooltip_preview_even_with_owner_link]] moved `tv_wonder_destroy_labor_camp_effect`
    out of `tv_wonder_finish_construction_effect` (a button's own effect body) into `tv_engineering_department.202`'s `option`,
    but the option still called it directly (not inside `hidden_effect`), so the same pre-evaluation error persisted unchanged.
    `hidden_effect` is the only block the pre-evaluation pass actually skips, regardless of how many scopes/events the real
    call is deferred through. Fixed by wrapping the call in `hidden_effect = { tv_wonder_destroy_labor_camp_effect = yes }`
    and adding a sibling `custom_tooltip = <key>` line so the option still shows correct static tooltip text — this is vanilla's
    own pattern (e.g. `earthquake_events.txt`'s `earthquake_events_minor.a`/`.b` options pair `hidden_effect` with `custom_tooltip`
    the same way).
  category: events
  scope: any
  source: src_engineering_department/in_game/events/tv_engineering_department_events.txt tv_engineering_department.202 option;
    reference_game_files/game/in_game/events/earthquake_events.txt earthquake_events_minor.a/.b; docs/knowledge/risk_cards/wonders.md
    rule 31 second follow-up; 2026-07-16
  notes: '2026-07-16: user reported the wonder-finish worksite demolition still errored even after it had already been moved
    into event tv_engineering_department.202''s option (per the rule 31 fix). The generalization is: deferring a heavy/unsafe
    effect call to *any* visible effect body — button, event option, whatever — never escapes pre-evaluation by itself; only
    `hidden_effect` does. Wrapped the call in `hidden_effect` and added `custom_tooltip = tv_engineering_department.202.a.tt`
    (with matching English/Simplified Chinese loc) so the option keeps a correct static tooltip. validate.py --changed --fix
    --ai-report passed with 0 errors/warnings after the fix.'
- id: destroy_building_target_via_custom_saved_scope_breaks_tooltip_preview
  pattern: ''
  detectability: advisory
  bad: destroy_building/destroy_building_forcefully targeting `building(building_type:X|scope:Y)` where `scope:Y` was captured
    earlier in the SAME effect via `save_scope_as = Y`, instead of an implicit link (`owner`, `root`, `scope:actor`, `prev`)
    that is naturally available without a prior save.
  correction: Every vanilla destroy_building/destroy_building_forcefully call resolves its `building(building_type:X|<link>)`
    second argument through an implicit, framework-provided link (`owner`, `root`, `prev`, `scope:actor`, `scope:target`,
    `scope:recipient`) — never through a custom name captured by a preceding `save_scope_as` inside the same effect (confirmed
    by grepping every vanilla usage in reference_game_files, zero counter-examples). The engine's runtime executor happily
    resolves a custom `scope:Y` reference and destroys the correct building, so this pattern looks correct in testing — but
    the effect-tooltip PREVIEW pass (used to render "here's what will happen" for a player-clickable generic_action) does
    not replay `save_scope_as` as a real side effect before trying to resolve the destroy target for display, so it fails
    to promote the engine's internal TARGET_BUILDING placeholder and the tooltip renders garbled/placeholder text instead
    of the real building name — while the actual click-through destruction still works perfectly. If the destroy call already
    executes from inside the target location's own scope (e.g. `var:tv_wonder_site ?= { ... }`), just use the location's own
    `owner` link directly and delete the now-unnecessary `save_scope_as`.
  category: gui
  scope: any
  source: src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt tv_wonder_destroy_labor_camp_effect;
    reference_game_files/game/in_game/common/generic_actions/catholic.txt:427 (destroy_building_forcefully = "building(building_type:seat_of_cardinal|owner)",
    called from inside scope:target_location); docs/error_log/error.log pdx_data_localize_helper.cpp:290, pdx_data_callstack.cpp:53,
    2026-07-15
  notes: '2026-07-15: user reported that after the finish-construction gate fix landed, the button''s effect tooltip still
    showed a garbled "X will be destroyed" line for the Labor Camp, but confirmed the actual click-through correctly destroyed
    the building every time — the split between broken preview and correct runtime execution was the key clue that ruled out
    a logic bug and pointed at a preview-only scope resolution gap. tv_wonder_destroy_labor_camp_effect did `save_scope_as
    = tv_wonder_labor_camp_owner` at country scope, then entered `var:tv_wonder_site ?= { ... }` (the location) and referenced
    `scope:tv_wonder_labor_camp_owner` in the destroy_building_forcefully target — replaced with the location''s own `owner`
    link (matching vanilla''s catholic.txt seat_of_cardinal precedent exactly, called from the same location-scoped position)
    and deleted the save_scope_as entirely. NOT yet fixed: the same save_scope_as-then-scope:X_owner pattern is used ~926
    times across tv_wonder_module_effects.txt (tv_wonder_module_owner) for the generic/module wonder building-consolidation
    system — that whole family is only ever called from tv_wonder_reinitialize_building_state_core_effect (the tv_reinitialize_mod
    debug action) and every_owned_location, not from a normal player-facing construction button, so the same tooltip-preview
    corruption is plausible but unconfirmed there and was left alone rather than blindly refactoring 926 call sites without
    a reported symptom — check this file first if a similar garbled destroy-building tooltip is ever reported near the reinitialize
    debug action or module-building consolidation. 2026-07-16 follow-up: the `owner`-link fix alone did NOT clear the error
    — `docs/error_log/error.log` kept logging `Promote ''TARGET_BUILDING'' returned nullptr` / `Data error in loc string ''THIRD_DESTROY_BUILDING_EFFECT''`
    because `tv_wonder_destroy_labor_camp_effect` was still called directly from `tv_wonder_finish_construction_effect`, which
    is itself the generic_action `tv_wonder_finish_construction`''s own `effect =` body — the exact chain the button''s hover/tooltip
    preview pre-evaluates. See `[[destroy_building_forcefully_in_button_effect_chain_fails_tooltip_preview_even_with_owner_link]]`
    for the real fix (move the call out of the button''s effect chain entirely).'
- id: dynamic_scope_value_must_use_script_value_block
  pattern: ''
  detectability: advisory
  only_in_paths:
  - generic_actions
  - scripted_effects
  - gen_tv_trade_league_actions
  - gen_tv_trade_league_effects
  bad: Passing a generic-action value selector or scoped variable directly as set_variable value, add_temporary_demand scale,
    or add_goods_supply amount
  correction: Wrap dynamic numeric reads in an explicit script-value block, e.g. value = { value = scope:target_1 }, value
    = { value = scope:target_1 divide = 2 }, scale = { value = scope:io.var:X }, or amount = { value = scope:io.var:X }.
