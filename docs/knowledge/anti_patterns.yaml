- id: comparison_plain_var_numeric_rhs_in_iterator
  pattern: ''
  detectability: needs_parser
  bad: local_var:X ?= var:Y, local_var:X > var:Y, or similar dynamic numeric comparisons inside an effect/key iterator when
    var:Y is owned by the outer scope
  correction: Capture the outer-scope value before entering the iterator with set_local_variable, then compare local_var to
    local_var inside the iterator. For equality, prefer NOT < and NOT > against the captured local instead of ?= var:Y.
  category: script
  scope: any
  source: 'runtime error.log: common/scripted_effects/tv_wonder_module_effects.txt:3305, 2026-06-10'
  notes: During Engineering Department priority-candidate unregister, a variable-map key iterator compared a map-captured
    local candidate id against the country-scoped current candidate id with local_var:X ?= var:Y. EU5 logged 'Invalid right
    side during comparison var'. Capturing the country value into a second local before the iterator and comparing locals
    avoids the RHS parser path.
- id: comparison_prev_var_numeric_rhs
  pattern: '(>=|<=|>|<)\s*prev\.var:'
  bad: var:X ?= { this >= prev.var:some_numeric_var } or var:X > prev.var:some_numeric_var inside a trigger/effect limit
  correction: Use root.var:some_numeric_var when root is verified to be the original numeric owner, or capture the value before
    an effect iterator with set_local_variable and compare/use local_var:name inside the switched scope.
  category: script
  scope: any
  source: 'runtime error.log: common/scripted_triggers/tv_engineering_department_triggers.txt:311; reference_game_files/game/in_game/common/missions/generic_capital_economy_mission_pack.txt:388
    (root.var comparison)'
  notes: Using prev.var:X as the RHS of a numeric comparison can log 'Invalid right side during comparison 'var'' and make
    the condition fail every tick. In Engineering Department construction this caused the monthly material check to fail and
    kept the UI stuck on the materials-insufficient pause state.
