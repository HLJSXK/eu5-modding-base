- id: generic_action_missing_ai_list
  pattern: ''
  only_in_paths:
  - generic_actions
  bad: Defining a generic action without listing it in common/generic_action_ai_lists
  correction: Add every generic action id to at least one generic_action_ai_lists file. Use the list potential to restrict
