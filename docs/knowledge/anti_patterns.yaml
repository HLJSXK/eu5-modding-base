- id: scripted_trigger_typed_parameter_double_prefix
  pattern: 'location_and_owner_can_build\s*=\s*\{[^}]*\bbuilding_type\s*=\s*building_type:'
  detectability: lint
  only_in_paths:
  - scripted_triggers
  - scripted_effects
  - gen_victory.py
  - generic_actions
  bad: Passing a typed building_type:<id> value into location_and_owner_can_build
  correction: 'Pass the bare building id, e.g. location_and_owner_can_build = { building_type = tv_conquest_headquarters }.
