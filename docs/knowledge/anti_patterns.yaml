- id: scripted_trigger_called_from_wrong_entry_scope
  pattern: null
  bad: Calling a scripted trigger from a scope it does not support because one of its internal scope links happens to reach
    the desired object
  correction: Verify the scripted trigger's entry scope from its complete body. Call it only from that scope, or replace it
