- id: num_of_advances_researched_broken_eu5_1_3
  pattern: ''
  detectability: advisory
  bad: 'Gating a requirement on `num_of_advances_researched >= N` and assuming it will progress normally. As of the EU5 1.3
    build tested 2026-07-10, this country trigger appeared stuck/non-updating in an actual playthrough (confirmed via the
    live tooltip added for TV_SCIENCE_ESTABLISHMENT_STEP1_TEXT — the displayed count never moved despite the player researching
    advances). Also, there is NO engine on_action that fires when a country finishes researching any advance — confirmed empty
    against `reference_official_defines/docs/on_actions.log` (no advance/research/tech/innovation entries) and by inspecting
    a live Steam Workshop mod (reference_mods/3668193813, ''National Destinies''): its DHE (dynamic_historical_event) reactions
    to specific advances use `monthly_chance = 100` + `trigger = { has_advance = <specific_advance> }` + `fire_only_once =
    yes` — i.e. the same has_advance-polling idiom, just applied per-known-advance, not a real completion callback.'
  correction: Do not build a replacement counter that still reads num_of_advances_researched (for example by baseline-diffing
    it) — if the underlying value is stuck, the derived count is equally stuck. There is no Advance-completed on_action, so
    a reliable complete count requires polling an explicit candidate list with has_advance. Keep the expensive scan off monthly_country_pulse
    and isolate its generated branches in a dedicated file. Towards Victory's gen_tv_science_score_effects.py generates tv_science_score_effects.txt
    from every top-level definition under reference_game_files/game/in_game/common/advances/. The situation-start and yearly_country_pulse
    callers both require is_ai = no, so only player-controlled countries pay the scan cost. The generated effect must explicitly
    mark this as a temporary num_advance_researched / num_of_advances_researched engine workaround and should be removed when
    the upstream interface is confirmed fixed. The separate science-establishment basic gate remains waived until its gameplay
    requirement is explicitly restored.
  category: scope
  scope: country
  source: docs/error_log/error.log investigation 2026-07-10 (user-confirmed live tooltip showed no progress); reference_official_defines/docs/on_actions.log
    (no advance/research/tech hooks); reference_mods/3668193813/in_game/events/nd_aeg.txt (has_advance + dynamic_historical_event
    polling pattern); scripts/in_game/common/scripted_effects/gen_tv_science_score_effects.py; data/pulse_registry.yaml yearly
    callback
  notes: 'Not independently reproduced against Paradox''s own changelog/bug tracker — based on this project''s playthrough
    observation on the tested 1.3 build. On 2026-07-24 the project adopted the complete but expensive yearly workaround for
    Scientific Victory progress, then isolated it for maintenance: gen_tv_science_score_effects.py extracts all top-level
    vanilla Advance ids and emits one has_advance branch per id into tv_science_score_effects.txt; the situation-start and
    tv_science_victory_yearly_pulse callers refresh player-controlled countries only. If a later patch fixes the engine count,
    restore direct num_of_advances_researched use, remove the independent scanner and yearly callback, and reconsider the
    separately waived science-establishment gate. See [[raw_trigger_count_has_no_live_tooltip_value]] for the reverted live-tooltip
    mirror attempt that surfaced this.'
- id: on_action_effect_block_singleton
  detectability: needs_parser
  pattern: ''
  bad: Defining a direct effect block on a vanilla hardcoded on_action hook inside a mod file when the same hook already exists
    in the vanilla _hardcoded on_action table
  correction: Extend hardcoded vanilla hooks with on_actions = { tv_named_callback } delegation and put the TV logic in the
    named callback's own effect block. Do not add a second direct effect block to the hardcoded hook itself.
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/on_action/_hardcoded.txt:497, 1182, 1436, 1575, 1790, 3175, 4833
  notes: Hardcoded on_action hooks are singleton by key for top-level effect blocks. A mod file that adds another direct effect
    to the same hardcoded hook will not merge the bodies; Jomini keeps the most recent effect and silently drops the earlier
    one. Use an on_actions delegate to route TV logic into a separate named on_action.
- id: on_action_global_root_remove_variable_noop
  pattern: ''
  detectability: advisory
  bad: Using `remove_variable = X` as a harmless no-op directly inside a global-root `on_action` callback, even when the variable
    is intentionally never set.
  correction: Global-root `on_action` callbacks do not own a normal scope variable store. For a reachable no-op branch in
    that root, use a scratch global variable pair (`set_global_variable = tv_example_noop` followed by `remove_global_variable
    = tv_example_noop`), or enter a variable-owning scope before using scoped `set_variable`/`remove_variable` effects.
  category: on_action
  scope: global
  source: 'runtime error.log: jomini_script_system.cpp:252 `remove_variable effect [ This scope does not have variables ]`
    at common/on_action/tv_engineering_department_on_action.txt:18; reference_official_defines/docs/effects.log documents
    `set_global_variable` and `remove_global_variable` with Supported Scopes: none'
  notes: 'Fixed 2026-08-01 in `src_engineering_department/in_game/common/on_action/tv_engineering_department_on_action.txt`:
    the `tv_wonder_suitability_flag_static_reference_trigger` call remains reachable from on_game_start/on_game_load, but
    its no-op body now sets and removes `tv_wonder_suitability_flag_static_reference_noop` as a global variable. This supersedes
    the older never-set `remove_variable` placeholder and its `data/cmf_warning_suppressions.yaml` entry.'
- id: on_action_simulates_generic_action_actor_context
  pattern: ''
  detectability: advisory
  only_in_paths:
  - on_action
  - scripted_effects
  - generic_actions
  bad: A monthly/yearly/on_action helper manually simulates a generic action by calling action/building eligibility helpers
    that evaluate code expecting literal scope:actor.
  correction: Put AI behavior on the generic action itself with ai_tick, ai_will_do, and a generic_action_ai_lists entry.
    If an execution-only pulse must call action-style helpers, create the exact event targets they require before evaluating
    them; a custom saved scope name is not a substitute for scope:actor.
  category: scope
  scope: country
  source: 'runtime error.log, 2026-06: IO establishment monthly AI progress called location_and_owner_can_build, which evaluated
    headquarters building allow blocks reading scope:actor; fixed in scripts/gen_victory.py and scripts/in_game/common/generic_actions/gen_tv_io_leader_actions.py'
  notes: The generated tv_io_establishment_ai_progress_effect saved the country as tv_io_establishment_ai_actor, then entered
    capital and called location_and_owner_can_build. That helper invokes can_build_building for the location and owner, causing
    the building allow block to read scope:actor. Because the monthly pulse did not define the literal actor event target,
    the engine logged Undefined event target 'actor' and unset scope errors every month. The current flow keeps monthly pulses
    to requirement/cache updates and lets AI use the generated build-HQ/establish-IO actions.
- id: on_action_war_gate_missing_winner_check
  pattern: on_(pre_winning_war|ending_war)\s*=
  detectability: advisory
  only_in_paths:
  - on_action
  bad: Gating an `on_pre_winning_war`/`on_ending_war` on_action's effect only on `has_variable`/ownership/site-control checks,
    treating 'this war-ending on_action fired' as equivalent to 'root won a war'
  correction: Add `scope:winner = { this = root }` to the trigger when the gated effect is meant to require an actual win,
    not just war conclusion. `root` fires for both the winner and loser of the war; `scope:winner`/`scope:loser`/`scope:war`
    are all available scopes in both on_actions.
  category: scope
  scope: on_action
  source: reference_game_files/game/in_game/common/on_action/_hardcoded.txt:1518-1576 (`#root = country ..., scope:winner
    = country, scope:loser = country, scope:war = war`); scope-equality idiom verified at line 3292 (`leader_country ?= {
    this = root }`) and in src/in_game/common/generic_actions/tv_arts_exhibition_actions.txt
  notes: 'Confirmed live instance: `scripts_engineering_department/unique_wonder_ritual_content/alhambra.py:build_on_action_body`
    set `tv_wonder_alhambra_war_validation = 1` in both `tv_wonder_unique_alhambra_ritual_on_pre_winning_war` and `_on_ending_war`
    whenever root held Granada, with no winner/loser distinction — a lost war validated the ritual''s ''won or ended'' war-gate
    exactly like a won one. Fixed 2026-07 by adding `scope:winner = { this = root }` to both on_actions'' triggers.'
- id: one_shot_completion_gate_never_reset_on_multi_cycle_resume
  pattern: ''
  detectability: advisory
  bad: A variable meant to gate "has this construction/ritual cycle already completed" is set once on completion and cleared
    only on full project abandonment, while a separate resume/expansion code path re-enters the SAME stage machinery for a
    NEW cycle on the SAME object without ever clearing that gate.
  correction: 'When a mechanic supports repeated cycles on one persistent object (a generic Engineering Department wonder''s
    expand-then-hold-ceremony-again loop, `tv_wonder_project_mode ?= 2`), any one-shot "this cycle is done" variable must
    be explicitly cleared at the start of each new cycle, not just on abandonment. `tv_wonder_ceremony_ready_trigger` (`tv_engineering_department_triggers.txt:418-423`)
    gates the ceremony conditions/rewards/hold-button display on `stage==4 AND NOT has_variable = tv_wonder_finalized`. `tv_wonder_finalized`
    is set once by `tv_wonder_finalize_effect` and was previously cleared ONLY by the full-abandonment cleanup (`tv_wonder_clear_project_state_core_effect`).
    The expansion-mode branch of `tv_wonder_select_construction_site_effect` (added by commit afd14d65, 2026-06-11, well before
    `tv_wonder_finalized` even existed as a concept the branch needed to interact with) resets `tv_wonder_stage = 3` and other
    construction counters to let the wonder build past its previous completed level and re-reach stage 4, but never cleared
    `tv_wonder_finalized` — so after a wonder''s FIRST ceremony completion, every later expansion cycle reached stage 4 again
    with `tv_wonder_finalized` still set from the prior cycle, permanently failing `tv_wonder_ceremony_ready_trigger`. The
    GUI''s downstream cache-populate effect then took its else-branch (`tv_wonder_index_clear_selected_ritual_cache_effect`)
    every time, wiping the cached ritual id/cost-type the conditions/rewards/hold-button widgets key off — while a SEPARATE,
    unrelated "ceremony style locked" static text (gated only on `tv_wonder_ceremony_locked.IsSet`, which is correctly meant
    to persist across expansions per design so the player cannot re-pick a style) kept rendering, making the wonder look permanently
    stuck with no way to ever hold the ceremony again. Fix: clear ONLY the one-shot completion gate (`remove_variable = tv_wonder_finalized`)
    inside the expansion branch (`if = { limit = { var:tv_wonder_project_mode ?= 2 } ... }`) — do NOT clear `tv_wonder_ceremony_locked`/`tv_wonder_ceremony_style`,
    since design intent is that an expansion reuses the previously-chosen style and only needs the player to click the hold/confirm
    button again, not re-pick. When two variables gate overlapping-looking UI (one meant to persist across cycles, one meant
    to reset per cycle), verify each one''s clear points independently against the actual multi-cycle design intent instead
    of assuming a single "locked" flag''s persistence also implies the completion gate should persist.'
  category: script
  scope: country
  source: src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt tv_wonder_select_construction_site_effect;
    src_engineering_department/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt tv_wonder_ceremony_ready_trigger;
    commit afd14d65 (pre-ED-split, 2026-06-11, src/in_game/common/scripted_effects/tv_engineering_department_effects.txt);
    docs/knowledge/risk_cards/wonders.md rule 38
  notes: '2026-07-20: user reported that for a generic wonder, after choosing ceremony style 1, every EXPANSION of that wonder
    shows a static "style 1 locked" text with no conditions/rewards/hold-button, and the ceremony can never be held again.
    Traced via two background research passes plus direct git archaeology: the gap predates the 2026-07 Engineering Department
    mod split (c371a9af) entirely — `git log -S` on the pre-split file path shows `tv_wonder_finalized` was introduced by
    d394ac0a and the `project_mode ?= 2` expansion-resume branch was added later by afd14d65, which never accounted for the
    pre-existing completion gate. Not a regression from a single later change that broke previously-correct behavior; a design
    gap present since the expansion-resume feature''s inception. User confirmed design intent (no re-pick allowed on expansion,
    but the hold-button must reappear) and confirmed the correct minimal fix is removing only `tv_wonder_finalized`, not the
    lock/style variables. Follow-up in the same session: fixing the gate alone was not sufficient — the GUI reads a SEPARATE
    cached layer (`tv_wonder_selected_ritual_id` etc.), populated only when something explicitly calls `tv_wonder_index_refresh_country_cache_effect`.
    That effect is not reactive; nothing recomputes it just because a raw variable changed. So the added `remove_variable
    = tv_wonder_finalized` fix (in the load-repair effect) was paired with an explicit `tv_wonder_index_refresh_country_cache_effect
    = yes` call right after it, and a THIRD, related but distinct gap was found and fixed the same way: `tv_wonder_finish_construction_effect`
    (`:1998-2016`) transitions a wonder to `stage = 4` and calls `tv_wonder_initialize_ceremony_runtime_state_effect`, but
    that callee entire body — including its own cache-refresh call — is gated on `tv_wonder_unique_locked_trigger = yes`,
    a no-op for generic wonders. A FRESH (not-yet-locked) generic wonder self-heals anyway, because its choose-a-style GUI
    buttons are gated on a live `NOT tv_wonder_ceremony_locked.IsSet` check (no cache needed), and the player click itself
    calls `tv_wonder_choose_ceremony_style_effect`, which does refresh the cache. But an EXPANSION whose style is already
    locked (design intent: no re-pick allowed) never shows those buttons and has no equivalent player click, so nothing would
    refresh the cache until the next `tv_engineering_department_wonder_auto_cache_monthly_pulse` (up to about a month of the
    ceremony UI looking stuck, self-resolving, not permanent like the primary bug). Fixed by adding an unconditional `tv_wonder_index_refresh_country_cache_effect
    = yes` to `tv_wonder_finish_construction_effect` itself — harmless no-op for unique wonders and for fresh generic wonders
    (which already self-heal), and closes the gap specifically for locked-style expansions. General lesson: when a cache/derived-display
    layer is populated only by specific named call sites rather than being recomputed reactively, enumerate every state-transition
    point that could make the underlying condition true and verify each one calls the refresh — a transition that happens
    to also be reachable via a player click that already refreshes elsewhere can mask a transition that has no such click.'
- id: ordered_in_global_list_limit_unguarded_var
  pattern: ''
  bad: ordered_in_global_list limit block that references situation:X.var:Y without a prior has_variable = Y guard when Y
    might not be set
  correction: 'Wrap the entire ordered_in_global_list block in: if = { limit = { has_variable = Y } ordered_in_global_list
    = { ... } }. The outer if is evaluated once on the situation scope, so it is cheap. The inner limit still includes the
    var: reference but now only runs when Y is known to be set.'
  category: script
  scope: any
  source: src/in_game/common/scripted_effects/towards_victory_leaderboard.txt (ranks 2-5 fix, 2026-05)
  notes: ordered_in_global_list evaluates its limit block for EVERY entry in the pool. If the referenced situation variable
    (e.g. tv_rank_1_country) was never set (because the pool was empty at situation on_start), every pool entry triggers a
    script error, producing N errors on first load. Guard with has_variable on the outer if to skip the whole pass when the
    prerequisite rank is absent.
- id: ordered_in_global_list_stale_rank_rebuild
  pattern: ''
  bad: Cascading ordered_in_global_list ranks that never clear old rank variables and gate later ranks only with has_variable
    = previous_rank
  correction: 'Treat ranking output as a fresh snapshot: remove all rank_N variables before rebuilding, ensure every pool
    entry has numeric order_by variables, and guard rank N with global_variable_list_size value > N-1 before running ordered_in_global_list.'
  category: script
  scope: any
  source: src/in_game/common/scripted_effects/towards_victory_leaderboard.txt (leaderboard rebuild fix, 2026-05)
  notes: A stale previous rank can survive from an earlier rebuild. If the current pool has fewer eligible entries, the later
    ordered_in_global_list pass can run with no selected item; prev is none, set_variable value = prev logs 'Value of wrong
    type ... none', and order_by/var reads may log failed variable fetches. Clearing outputs and checking current pool size
    prevents the pass from running when no current candidate exists.
- id: ordered_key_variable_map_oversized_max
  pattern: ''
  detectability: advisory
  bad: Using an inflated ordered_key_in_variable_map max value such as 10000 to process every current key
  correction: Use every_key_in_variable_map with a found/stop flag when all keys may need inspection, or set ordered_key_in_variable_map
    max only to an exact known upper bound that cannot exceed the current map size.
  category: scope
  scope: variable_map
  source: 'Runtime error.log: common/scripted_effects/tv_wonder_module_effects.txt:3361 via Engineering Department saved priority
    proposal selection, 2026-06-10'
  notes: EU5 logs a Script system error when ordered_key_in_variable_map max is larger than the current key list, even though
    it reports that it capped max at the list size. Do not use a huge max as a harmless 'iterate all' shortcut.
- id: ordered_scope_without_explicit_max
  pattern: null
  bad: Omitting max from an ordered_* scope while expecting it to iterate every matching object
  correction: Set an explicit sufficient max for full ordered traversal, or a verified dynamic bound. Reserve max = 1 or the
    default single result for deliberate best-candidate selection.
  category: scope
  scope: any
  source: user-reported in-game SOL classification log (2026-08-07); scripts/sol_economy_effects_source.py; reference_game_files/game/in_game/events/character/consort_events.txt:645-652
  notes: In runtime testing, ordered_owned_location without max scored 189 valid locations in the first pass but assigned
    only the first location in the ordered pass. An explicit max = 100000 makes the classification pass traverse all practical
    country location counts.
- id: parentanchor_under_hbox_vbox
  pattern: ''
  validator: check_gui_parentanchor_under_hbox_vbox
  detectability: lint
  only_in_paths:
  - .gui
  bad: Setting parentanchor on a widget that is a direct child of an hbox or vbox (e.g. inside hbox = { widget = { parentanchor
    = vcenter ... } })
  correction: Remove parentanchor from layout-managed hbox/vbox children. Explicit ignore_layout = yes overlays may position
