- id: io_monthly_change_signed_contribution_inside_named_add
  pattern: ''
  detectability: needs_parser
  bad: A named positive monthly_change contribution wraps both signs in add = { desc = KEY ... } and conditionally flips opponents
    with an inner multiply = -1
  correction: 'Put the stance condition outside the signed operation and emit mutually exclusive branches: supporters use
    if = { limit = { ... stance = support } add = { desc = KEY <positive magnitude> } }, while opponents use if = { limit
    = { ... stance = oppose } subtract = { desc = KEY <positive magnitude> } }. Neutral or inactive contributors should match
    neither branch.'
  category: script
  scope: international_organization
  source: reference_game_files/game/in_game/common/international_organizations/catholic_church.txt:63-78; Academy of Sciences
    monthly debate tooltip report, 2026-07-24
  notes: IO monthly_change is also a scripted-value breakdown. Tooltip evaluation can expose a nested anonymous sign-flip
    operation even when its condition contributes nothing, producing phantom negative rows beside the named positive row and
    a 'missing tooltip' label. Keep each displayed signed contribution as its own desc-bearing add or subtract node; do not
    encode the sign with an unnamed nested multiply.
- id: io_non_unique_scope_link
  pattern: ''
  bad: international_organization:type_name or is_member_of_international_organization = type_name for an IO type without
    unique = yes
  correction: For non-unique IOs, never add unique = yes. Use on_creation = { set_leader_country = scope:actor } in the IO
    type definition to set the leader on creation. To scope to an IO instance at runtime, use every_international_organization
    = { limit = { type = type_name } ... }. Do NOT use international_organization:type_name or is_member_of_international_organization
    = type_name — both require unique = yes and will error at runtime for non-unique types.
  category: scope
  scope: any
  source: 'runtime error.log: ''key tv_arts_exhibition does not lead to a unique international organization'', reference_game_files/game/in_game/common/international_organizations/swiss_confederation.txt:3
    (unique = yes enables the scope link)'
  notes: 'tv_arts_exhibition is a non-unique IO: each country pursuing cultural victory creates their own independent instance.
    unique = yes is FORBIDDEN on this IO. The engine errors ''Failed to find a valid event target link'' and ''does not lead
    to a unique international organization'' for both the scope link and is_member_of_international_organization trigger.
    Pattern empty — static detection would require cross-referencing IO type definitions.'
- id: io_parliament_issue_without_special_status_agenda
  pattern: ''
  bad: Adding IO parliament issues for a special status without any valid parliament_agenda for that special status
  correction: Add at least one common/parliament_agendas entry with type = international_organization and special_status =
    <status>. Keep its potential/allow valid for the IO so the parliament button has a special-status agenda to resolve.
  category: script
  scope: international_organization
  source: reference_game_files/game/in_game/common/parliament_agendas/readme.txt:1-11; reference_game_files/game/in_game/common/parliament_agendas/10_hre_agendas.txt:1-23
  notes: IO parliaments rely on special-status agendas as well as issues. Without a valid agenda for the participating special
    status, the UI can report that no special status wants to propose an issue even when parliament_issues exist.
- id: io_policy_activation_direct_leader_country
  pattern: ''
  detectability: needs_parser
  bad: Using direct `leader_country = { ... }` inside IO policy on_activate/on_deactivate effect chains
  correction: Keep IO variable writes on the current IO root, but enter the leader country with `leader_country ?= { ... }`
    for mirrored country state or side effects.
  category: scope
  scope: international_organization
  source: reference_game_files/game/in_game/common/parliament_agendas/10_hre_agendas.txt:104; runtime error.log tv_alliance_laws.txt
    2026-06-25
  notes: The law browser and policy tooltips can walk activation/deactivation effect chains before a leader country is available.
    Direct leader_country scope entry logs `Event target link 'leader_country' returned an invalid object`; the optional link
    safely no-ops when null.
- id: io_policy_ai_math_scope_recipient_requires_exists
  pattern: ''
  detectability: needs_parser
  bad: Using scope:recipient inside IO policy AI math without first checking exists = scope:recipient
  correction: In wants_this_policy_bias, wants_propose_policy, wants_keep_policy, reasons_to_join, and diplomatic_capacity_cost,
    guard direct scope:recipient reads with exists = scope:recipient or use optional scope:recipient ?= blocks.
  category: scope
  scope: international_organization
  source: reference_official_defines/types/laws.txt:39-43; reference_game_files/game/in_game/common/resolutions/policy_vote.txt:408;
    runtime error.log tv_alliance_laws.txt 2026-05-21
  notes: Although the law readme documents recipient = IO for policy AI math, the engine can pre-evaluate these maths without
    a recipient event target. Unguarded scope:recipient reads caused repeated 'Undefined event target recipient' and unset-scope
    errors in generated Diplomatic Alliance laws.
- id: io_policy_execution_scope_recipient_unset
  pattern: ''
  bad: Using scope:recipient inside IO policy allow/on_activate/on_deactivate to read or mutate the IO
  correction: Use the current IO root directly in policy allow/on_activate/on_deactivate. Reserve scope:recipient for documented
    country-root policy AI math blocks such as wants_this_policy_bias and wants_propose_policy.
  category: scope
  scope: international_organization
  source: reference_game_files/game/in_game/common/laws/readme.txt:31-40; runtime error.log tv_alliance_laws.txt 2026-05-21
  notes: Generated Diplomatic Alliance laws wrapped IO variable checks and tier changes in scope:recipient in execution blocks.
    At runtime those blocks had no recipient event target, causing repeated 'Undefined event target recipient' and unset-scope
    errors.
- id: io_policy_leader_country_modifier_unguarded_recipient_tooltip
  pattern: ''
  detectability: advisory
  only_in_paths:
  - laws
  bad: Representing a visible additive leader-only IO law effect as country_modifier = { potential_trigger = { is_leader_of_international_organization
    = scope:recipient } ... } without a no-recipient display branch
  correction: Use country_modifier = { potential_trigger = { OR = { NOT = { exists = scope:recipient } is_leader_of_international_organization
    = scope:recipient } } ... } when the leader-only policy effect must remain an additive country modifier. The no-recipient
    branch is for ordinary law browsing; the leader check still applies when a vote/application recipient exists.
  category: script
  scope: international_organization
  source: reference_game_files/game/in_game/common/laws/readme.txt:36; reference_game_files/game/in_game/common/laws/readme.txt:48;
    fixed in scripts/in_game/common/laws/gen_tv_govhouse_laws.py
  notes: The normal law browser may evaluate modifier display without a populated scope:recipient, causing an unguarded filtered
    country_modifier package to collapse to 'No Effects'. leader_modifier has leader-country target semantics, but the law
    readme says it replaces previous leader_modifier blocks, so additive multi-law packages should stay country_modifier with
    a display-safe filter.
- id: io_policy_member_modifier_utility_unfiltered
  pattern: ''
  detectability: advisory
  only_in_paths:
  - laws
  bad: An IO policy member modifier is meant to affect only the leader or another subset, but the modifier block has no potential_trigger
    filter.
  correction: 'Use an appropriate member filter. For visible leader-only effects that must stack with other law modifiers,
    keep country_modifier but guard the filter for law browsing: potential_trigger = { OR = { NOT = { exists = scope:recipient
    } is_leader_of_international_organization = scope:recipient } }. Use leader_modifier/non_leader_modifier only when replacement
    semantics are intended. Vanilla policy_vote automatically adds scope:vote.modifier_utility(scope:actor) as POLICY_MODIFIER_UTILITY,
    so every voting member evaluates unfiltered member modifiers as personal policy utility.'
  category: script
  scope: international_organization
  source: reference_game_files/game/in_game/common/resolutions/policy_vote.txt:842-843; reference_game_files/game/in_game/common/laws/20_hre.txt:187;
    fixed in scripts/in_game/common/laws/gen_tv_govhouse_laws.py
  notes: Governor's House subject-chain members voted on overlord administration country modifiers. Some subject tooltips
    showed extreme 'Policy Modifier Utility' support for particular laws. A recipient-guarded potential_trigger keeps the
    additive country modifiers and their automatic utility on the supreme overlord while still displaying during ordinary
    law browsing.
- id: io_scoped_effect_called_inside_create_io_block
  pattern: ''
  bad: Calling an IO-scoped helper with IO-only triggers directly inside create_international_organization's effect block
  correction: Put IO-scoped initialization in the IO type's on_creation/on_joined hooks, or call it only after switching to
    a saved IO scope that is verified to exist. Keep create_international_organization blocks free of helpers that assume
    root is the new IO during pre-evaluation.
  category: scope
  scope: international_organization
  source: runtime error.log tv_diplomatic_alliance 2026-06-24; reference_game_files/game/in_game/common/international_organizations/readme.txt:75
  notes: Generic-action tooltip/effect pre-evaluation can walk a create_international_organization block before the new IO
    is a stable root. An IO helper that starts with international_organization_type then logs 'Expected international_organization,
    but got country'. Diplomatic Alliance fixed this by relying on IO on_creation/on_joined and removing the direct helper
    call from the creation block.
- id: io_single_member_parliament_without_leader_special_status
  pattern: ''
  bad: A single-member IO relies on a generic member special status to propose IO parliament issues
  correction: Do not rely on vanilla call_organization_parliament for single-member support-token meetings. The mechanic needs
    a different design before custom support meetings are enabled.
  category: script
  scope: international_organization
  source: reference_game_files/game/in_game/common/generic_actions/io_parliament.txt:86-120; reference_game_files/game/in_game/common/scripted_effects/international_organization_effects.txt:507-538;
    runtime playtest of tv_academy_of_sciences
  notes: The vanilla call_organization_parliament picker builds its issue list through every_possible_parliament_issue and
    reports 'no special status wants to propose an issue' when it cannot surface one. propose_parliament_issue then initializes
    support from the issue special status and marks the proposer as voting yes. In a founder-only IO, self-backed support
    issues are brittle even with a leader status.
- id: io_special_status_auto_bestow_without_lifecycle_sync
  pattern: ''
  detectability: advisory
  bad: A custom IO parliament special status relies only on auto_bestowal_trigger or same-tick on_joined state to appear
  correction: For custom IO statuses that drive parliament voting or UI power, grant/remove the status directly in the action
    or lifecycle effect that creates, invites, promotes, demotes, or removes the country. Do not add recurring monthly refreshes
    for special-status repair.
  category: script
  scope: international_organization
  source: reference_game_files/game/in_game/common/country_interactions/hre.txt:502-560; reference_game_files/game/in_game/common/international_organization_special_statuses/hre.txt:187-274;
    reference_game_files/game/in_game/common/resolutions/policy_vote.txt:620; runtime playtest of tv_diplomatic_alliance 2026-06-25
  notes: HRE free city actions explicitly call international_organization_add_special_status from the HRE scope; free_city
    has an empty auto_bestowal_trigger and does not need a monthly repair pass. Diplomatic Alliance members could wait through
    monthly pulses without showing tv_alliance_* special statuses, but starting a law vote refreshed visible status/power
    state. The minimal TV pattern is to grant the leader's advocator status at creation and grant each joining country member
    status in on_joined, without recurring special-status maintenance or extra parliament-seat repair.
- id: io_special_status_missing_parliament_modifier_types
  pattern: ''
  bad: Defining a custom IO special status without the matching auto-requested parliament modifier type pair
  correction: For every custom IO special status key that can be implemented on an international organization, define <status>_can_participate_in_parliament
    as boolean and <status>_agenda_impact as percent in main_menu/common/modifier_type_definitions with game_data category
    = internationalorganization.
  category: modifier
  scope: international_organization
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:14570-14582; runtime
    error.log tv_trade_league_member_status 2026-05-27
  notes: EU5 automatically tries to resolve these modifier type names for custom IO special statuses; missing definitions
    produce startup DB assertions such as 'Modifier type definition <status>_can_participate_in_parliament must exist in DB'.
- id: io_trigger_iterator_limit_invalid
  pattern: any_international_organizations_member_of\s*=\s*\{\s*limit\s*=
  only_in_paths:
  - scripted_triggers
  bad: limit = {} as a direct child of any_international_organizations_member_of in a scripted trigger
  correction: 'In trigger context, put iterator filters directly in the block: any_international_organizations_member_of =
    { international_organization_type = international_organization_type:<io_type> ... }. Reserve limit = {} for effect iterators
    such as every_international_organizations_member_of.'
  category: scope
  scope: country
  source: src/in_game/common/scripted_triggers/tv_arts_exhibition_triggers.txt:7-10; runtime error.log tv_engineering_department_triggers.txt:68
  notes: 'The trigger iterator treats direct children as trigger clauses; limit is not a trigger here and logs ''Unknown trigger
    type: limit''.'
- id: io_typed_variable_update_in_on_action
  pattern: ''
  bad: Applying a computed bonus to an IO typed variable via change_variable inside on_action (e.g. every_international_organizations_member_of
    { change_variable { name = tv_arts_intl_influence add = local_var:X } }) to implement a monthly character contribution,
    or moving an existing visible IO variable's monthly gain from monthly_change into monthly_country_pulse/country effects
  correction: 'Put the contribution in the IO type''s monthly_change scripted value using leader_country.var:X chained access:
    if = { limit = { international_organization_has_leader = yes  leader_country = { has_variable = X } }  add = { desc =
    KEY  value = leader_country.var:X } }. Store computed helper values on the country via on_action only for cached inputs
    or GUI display. If a visible IO variable stops advancing, fix the monthly_change scope/conditions or its cached inputs;
    do not migrate the source arithmetic out of monthly_change.'
  category: script
  scope: any
  source: 'reference_game_files/game/in_game/events/situations/red_turban_rebellions.txt:3371 (value = root.var:X); reference_game_files/game/in_game/common/laws/christian_tenets.txt:359
    (value = scope:recipient.leader_country.modifier:X); src/in_game/common/international_organizations/tv_diplomatic_alliance.txt
    (leader_country.modifier: in monthly_change)'
  notes: IO typed variables (in the variables = {} block of the IO type) have a monthly_change scripted value that drives
    the tooltip and automatic monthly breakdown. Contributions applied externally via on_action or country pulse change_variable
    are invisible to that breakdown and can make the UI lie even when the number changes. The leader_country.var:X chain is
    valid in scripted value context (same family as root.var:X); it is NOT valid in change_variable { add = } effect context
    (see change_variable_add_prev_var anti-pattern). Set leader_type = country and call set_leader_country in on_creation
    or the creation block.
- id: is_courtier_invalid_after_move_country_unilateral
  pattern: is_courtier\s*=\s*yes
  only_in_paths:
  - on_action
  bad: is_courtier = yes in every_character limit to find a character dispatched via move_country in a generic_action
  correction: Use is_alive = yes + has_variable = <dispatch_tag> instead. The dispatch tag (e.g. tv_on_exhibition) set before
    move_country is sufficient to uniquely identify the character.
  category: scope
  scope: character
  source: reference_game_files/game/in_game/common/country_interactions/invite_artist.txt:104 (move_country in formal interaction
    grants courtier); src/in_game/common/on_action/tv_arts_exhibition_on_action.txt
  notes: 'move_country called unilaterally from a generic_action (owncountry type) does NOT grant is_courtier = yes in the
    destination court. Only formal country_interaction invitations (e.g. invite_artist where the recipient accepts) produce
    a true courtier relationship. The result: every_character { is_courtier = yes } silently skips the dispatched character
    in both yearly and monthly pulses — timer never increments, no events fire.'
- id: kill_character_yes_in_character_scope
  pattern: kill_character\s*=\s*yes
  bad: kill_character = yes
  correction: Use kill_character = this when in character scope (e.g. inside var:name ?= { }), or kill_character = scope:char_ref
    from any scope. kill_character = yes is invalid — EU5 expects a character scope reference, not a boolean.
  category: event
  scope: character
  source: reference_game_files/game/in_game/events/DHE/flavor_ENG.txt:11243
  notes: 'kill_character takes a character scope value, not a boolean. kill_character = yes causes PostValidate error: target
    scope type boolean, expected character.'
- id: limit_in_scope_transition_block
  pattern: null
  bad: '''limit = { ... }'' directly inside a scope-transition block such as ''location = { limit = { ... } }'', ''country
    = { limit = { ... } }'', etc.'
  correction: Wrap with 'if = { limit = { ... } }' inside the scope-transition block. 'limit' is only valid directly inside
    iteration effects (every_*, random_*, ordered_*, while). Inside a scope-hop block it is an 'Unknown effect limit' error.
  category: scope
  scope: any
  source: 'src/stable/in_game/common/scripted_effects/z_SOL_scarcity_score.txt:1864 — engine error: ''Unknown effect limit
    at ... :1864'' from jomini_effect.cpp:556'
  notes: Scope-transition blocks (location={}, country={}, etc.) are NOT loops — the engine does not recognise 'limit' there.
    Use 'if = { limit = { ... } }' for conditional execution inside a scope hop.
- id: loc_color_tag_adjacent_text
  pattern: '#[YGR](?=[^\s#!\[$@+\-])'
  detectability: lint
  only_in_paths:
  - localization
  - philosophy_debate_codegen.py
  bad: '#YText#! / #Y{generated_text}#! — color tag immediately followed by normal text or generated text with no separator'
  correction: 'Insert a separator after the color tag, e.g. #Y Text#!, #G Text#!, or #R Text#!. Do the same in generators
    before substituting localized names or concept text.'
  category: localization
  scope: any
  source: User-reported display truncation in tv_academy_debate.100, 2026-07-07; vanilla examples use a space such as reference_game_files/game/main_menu/localization/english/events/DHE/flavor_kor_l_english.yml:86
  notes: 'EU5/Jomini localization does not reliably treat #Y/#G/#R as complete color tags when text or a generated placeholder
    starts immediately after the tag. The formatter can treat the adjacent content as part of the formatting tag and drop
    or mangle the highlighted span. A visible space after the tag terminates it.'
- id: loc_color_tag_adjacent_variable
  pattern: '#[A-Z]\['
  only_in_paths:
  - localization
  bad: '#Y[variable_expression]#! — color tag immediately followed by [ with no separator'
  correction: 'Either omit the color tag and write [variable_expression] as plain text, OR add a space: #Y [variable_expression]#!
    — the space terminates the tag name so the parser reads #Y (tag) then '' value'' (content). Note the leading space will
    be visible in the rendered string.'
  category: localization
  scope: any
  source: 'EU5 engine error log: pdx_text_formatter.cpp:807: Unknown formatting tag ''y64!'''
  notes: 'In EU5 Jomini localization, the color tag name is read from # until the first non-alphanumeric. When a [var] resolves
    to a number (e.g. 64) and is placed directly after #Y, the parser reads #Y64 as the tag name (unknown). The leading space
    in ''#Y [var]'' terminates the tag name at Y.'
- id: loc_text_format_tag_catalog_undiscovered
  pattern: ''
  detectability: advisory
  bad: 'Only using #R/#G color tags (or inventing a custom GUI/widget solution) for localization text emphasis, tabular tooltip
    alignment, or numeric breakdowns, without checking whether an existing `#tag` already covers the need'
  correction: 'Check the Text Format Tag Catalog in docs/technical/EU5_Modding_Knowledge_Base.md section 6.3 before designing
    new emphasis/layout for event or tooltip text. Confirmed tags: colors #R #G #Y #W #V #L #P #N #X #D #F (plus lowercase
    #r #g #y); style #bold #italic #weak #high #T #subtle_name; tabular #col #col_t #col_m; and special #TOOLTIP:$BREAKDOWN_TAG$,
    #indent_newline:N, #trigger_pass/#trigger_fail. All must be closed with #! and (per [[loc_color_tag_adjacent_text]]) separated
    from adjacent content by a space.'
  category: localization
  scope: any
  source: reference_game_files/game/main_menu/localization/english/*.yml (empirical grep across ~530 English localization
    files, 2026-07-10); docs/technical/EU5_Modding_Knowledge_Base.md section 6.3
  notes: 'There is no single canonical reference file for the full #tag list in this repo''s mirror — the underlying textformatting.gui
    asset is gfx-adjacent and pruned by scripts/sync_reference.py. The catalog was reconstructed by frequency-counting #[A-Za-z_0-9]+
    tokens across all main_menu English localization files and reading surrounding usage context to infer each tag''s semantics.'
- id: local_var_lost_across_var_scope_switch
  pattern: ''
  detectability: needs_parser
  bad: 'set_local_variable inside var:X ?= {} and then reading that local_var from prev = {} or after leaving the dynamic
    scope. Example: var:tv_chief_artist ?= { set_local_variable = { name = ca value = artist_skill } change_local_variable
    = { name = ca multiply = 0.002 }  prev = { set_variable = { name = tv_chief_artist_monthly_bonus value = local_var:ca
    } } }'
  correction: 'Use chained scope access from the original scope instead of switching when possible. To read a character skill
    stored in a country variable: value = var:tv_chief_artist.artist_skill. If a temporary value is needed inside a later
    scope, set_local_variable before entering that scope and read local_var:X inside it; that direction is valid.'
  category: scope
  scope: any
  source: reference_game_files/game/in_game/common/country_interactions/invite_artist.txt:129 (add = scope:target.artist_skill
    confirms chained character-scope access); hellenism_religion.txt:2866 (value = artist_skill as direct scripted value)
  notes: 'The unreliable direction is dynamic-scope local_var escaping outward through prev or later outer-scope reads. The
    opposite direction is valid: set_local_variable before a var:X ?= {} / location scope switch, then use local_var:X inside
    the nested scope.'
- id: local_variables_are_not_market_storage
  pattern: null
  bad: Treating local_var as independent per-market storage, or validating that assumption with a Scope.local dictionary in
    an offline fixture
  correction: Local variables are event-context links visible across scope switches. Use market-keyed global_variable_map
    for per-market isolation; use local_var only for one calculation's scratch and explicitly remove it. Correct offline fixtures
    to share one local context across scope switches.
  category: scope
  scope: any
  source: reference_official_defines/docs/event_targets.log:822-830; reference_game_files/game/in_game/common/scripted_effects/location_effects.txt:145-168;
    effects.log:531-537
  notes: Vanilla transfer_pop sets pops_to_add inside target scope and reads it after returning to root. Market scope also
    cannot hold persistent set_variable values. SOL market population and spending caches use maps, including a typed country
    owner map to prevent shared-market cross-country reuse.
- id: localization_duplicate_key_across_files
  pattern: ''
  detectability: needs_parser
  only_in_paths:
  - localization
  bad: Defining the same localization key in more than one YAML file for the same language
  correction: Keep each localization key owned by exactly one file per language. When a generator takes over a key family,
    remove the stale manual copies instead of redefining them.
  category: localization
  scope: any
  source: 'runtime error.log: pdx_localize.cpp:221 Duplicate localization key. Key ''STATIC_MODIFIER_NAME_tv_wonder_sacred_mountain_level_1''
    is defined in both localization/simp_chinese/tv_engineering_department_l_simp_chinese.yml and localization/simp_chinese/tv_engineering_department_wonder_mechanics_l_simp_chinese.yml'
  notes: Main-menu localization YAML does not merge duplicate keys across files within one language pack. Startup logs a duplicate-key
    error and only one definition can win, so manual and generated files must have unambiguous ownership.
- id: localization_generated_caption_has_one_owner
  pattern: null
  bad: Keeping a GUI caption in handwritten economy localization after adding the same key to generated UI localization
  correction: Give each key one definition per language and target. Remove old caption definitions when generated UI vocabulary
    owns them; preserve UTF-8 BOM. Check the complete target, not one file.
  category: localization
  scope: any
  source: docs/error_log/error.log (duplicate SOL_GUI_SECTION_POP / SOL_GUI_SECTION_CONSUMPTION); scripts/gen_sol_ls_gui.py
    UI_STRINGS
  notes: Both English and Chinese were duplicated although only the active Chinese language was reported. Stable and standalone
    need independent checks.
- id: localization_getbuilding_function_invalid
  detectability: lint
  pattern: \[GetBuilding\('[^']+'\)\.GetName\]
  only_in_paths:
  - localization
  - io_establishment.yaml
  bad: Using [GetBuilding('building_key').GetName] inside localization text
  correction: Use the localization helper [ShowBuildingTypeName('building_key')] for building-type display names.
  category: localization
  scope: building
  source: 'runtime error.log: pdx_data_factory.cpp failed to find type GetBuilding in IO establishment localization; fixed
    in data/io_establishment.yaml'
  notes: EU5 localization exposes ShowBuildingTypeName/ShowBuildingTypeNameWithNoTooltip helpers for building types. GetBuilding('key').GetName
    is not a valid localization data function and causes GUI-bound localized text parsing to fail.
- id: localization_value_raw_physical_newline
  pattern: ''
  detectability: lint
  validator: localization_physical_lines
  only_in_paths:
  - localization
  bad: A localization value contains a real physical newline inside the quoted string
  correction: Keep each localization key/value on one physical line. Generators should render intentional line breaks as \n
    inside the quoted value.
  category: localization
  scope: any
  source: 'runtime error.log: localization_reader.cpp:445 Invalid character in key name; fixed in scripts_engineering_department/wonder_mechanics/_core.py'
  notes: The localization reader treats the continuation line as a new key, causing invalid-character and missing-colon errors.
    scripts/validate.py checks main-menu localization physical lines.
- id: location_auto_modifier_nonfunctional
  pattern: category\s*=\s*location
  only_in_paths:
  - auto_modifiers
  bad: auto_modifier with category = location (inside auto_modifiers/ file)
  correction: 'Use main_menu/common/static_modifiers/: define new objects with game_data.category = location, or use a minimal
    TRY_INJECT delta when modifying an existing object.'
  category: modifier
  scope: location
  source: src/stable/main_menu/common/static_modifiers/A_SOL_war_modifiers.txt:4-8; reference_mods/3613232232/main_menu/common/static_modifiers/pp_location_modifier_adjustments.txt:439
  notes: Location auto_modifiers are NON-FUNCTIONAL in EU5; bake effects into static_modifier values instead
  source_variants:
  - project: eu5-modding-project
