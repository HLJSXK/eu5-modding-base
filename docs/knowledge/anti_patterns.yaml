- id: root_scope_in_situation_on_monthly
  pattern: ''
  bad: every_X = { root = { change_variable = { name = Y ... } } } where Y was set_variable'd on `this` before the loop, called
    from a situation's on_monthly
  correction: 'Use set_local_variable / change_local_variable for the accumulator. local_variable persists across all scope
    switches. Inside every_X, access the current-scope value directly (no prev. needed): change_local_variable = { name =
    acc add = some_value }. Then use local_var:acc after the loop.'
  category: scope
  scope: any
  source: reference_game_files/game/in_game/common/situations/guelphs_and_ghibellines.txt:229 (add = local_var:guelphs_total_tax);
    reference_game_files/game/in_game/events/wokou_events.txt:140 (change_local_variable block form)
  notes: 'In a situation''s on_monthly, root = the situation scope, not the iterating country. set_variable stores onto `this`
    (country); root = { change_variable } then targets the situation — the accumulation goes to the wrong scope and the variable
    on the country stays 0. fix: local_variable is scope-independent and thread-local to the effect call.'
- id: same_chain_set_variable_not_visible_to_nested_trigger_during_tooltip_preview
  pattern: ''
  detectability: advisory
  bad: Gating a button/option's own definite-completion effect through a shared "maybe complete" helper whose guard trigger
    re-reads a variable that same option's effect chain just wrote a few lines earlier, when the caller already knows the
    condition is true and does not need to re-derive it.
  correction: 'EU5''s option/button tooltip pre-evaluation does not reliably thread a `set_variable` write across several
    nested `scripted_effect`/`scripted_trigger` call layers within the SAME previewed chain: even though the write and the
    read are both inside the one call being previewed, and both run correctly (in write-then-read order) at real execution
    time, the preview pass can still evaluate the nested trigger against the pre-write value, producing a false result with
    no error (a false `limit`, not a script fault). The Unique Wonder Ceremony''s stage-8 button (`tv_wonder_ceremony_advance_to_stage_8_effect`)
    writes `set_variable = { name = tv_wonder_ceremony_stage value = 8 }` then calls `tv_wonder_complete_active_ritual_effect
    = yes`, which routes through `tv_wonder_mechanics_maybe_complete_active_ritual_effect`''s `tv_wonder_selected_ritual_completion_requirements_met_trigger`
    guard — for the ceremony framework this trigger literally checks `var:tv_wonder_ceremony_stage ?= 8`, the SAME variable
    just written two lines above. The tooltip preview read back the still-7 value, so the whole `if` block containing the
    completion reward (`add_country_modifier`) rendered as unreachable and was silently omitted — cost showed, reward did
    not, with a clean error.log. Making the completion call inline (undoing the [[deferred_reward_via_trigger_event_silently_invisible_to_tooltip_preview]]
    deferral) was necessary but not sufficient; the real fix was to stop re-deriving "is this complete" via the shared trigger-gated
    helper when the caller already knows it is. Added `tv_wonder_mechanics_force_complete_active_ritual_effect`, a duplicate
    of `tv_wonder_mechanics_maybe_complete_active_ritual_effect`''s body without the `completion_requirements_met_trigger`
    gate, and had the stage-8 button call it directly. General lesson: when a button/option''s effect chain establishes a
    fact about itself (by writing a variable) and then needs to act on that fact, do not route back through a shared "maybe/check-then-act"
    helper that re-derives the fact via a nested trigger read of the same variable — call the unconditional "definite" version
    of that helper directly. Reserve the trigger-gated shared helper for callers (monthly pulses, other ritual modes) that
    genuinely do not know in advance whether the condition holds.'
  category: script
  scope: any
  source: scripts_engineering_department/in_game/common/scripted_effects/gen_tv_engineering_department_wonder_mechanics_effects.py
    append_ritual_effects (tv_wonder_mechanics_force_complete_active_ritual_effect, tv_wonder_mechanics_maybe_complete_active_ritual_effect);
    scripts_engineering_department/in_game/common/scripted_effects/gen_tv_wonder_ceremony_effects.py append_advance_stage_effects;
    src_engineering_department/in_game/common/scripted_effects/tv_wonder_ceremony_effects.txt tv_wonder_ceremony_advance_to_stage_8_effect;
    src_engineering_department/in_game/common/scripted_triggers/tv_engineering_department_wonder_mechanics_triggers.txt tv_wonder_selected_ritual_custom_completion_requirements_met_trigger;
    docs/knowledge/risk_cards/wonders.md rule 20
  notes: '2026-07-16: after fixing the deferred-reward tooltip gap (see [[deferred_reward_via_trigger_event_silently_invisible_to_tooltip_preview]]),
    the user redeployed via build.bat and re-tested in game — the stage-8 tooltip still showed only cost, error.log clean.
    Traced the full guard chain for wonder 103 (ritual id 10301): tv_wonder_complete_active_ritual_effect -> tv_wonder_mechanics_maybe_complete_active_ritual_effect
    -> tv_wonder_selected_ritual_completion_requirements_met_trigger -> tv_wonder_selected_ritual_custom_completion_requirements_met_trigger''s
    10301 branch checks var:tv_wonder_ceremony_stage ?= 8, which the SAME advance_to_stage_8_effect had just set two lines
    earlier. Confirmed via git history and code reading that tv_wonder_ritual_in_progress, var:tv_wonder_stage (the separate
    overall build-stage variable, stays 4 throughout since tv_wonder_finalize_effect only sets it to 5 AFTER the static-modifier
    call), and the ritual-id/has_custom_completion_trigger cache variables (set once at construction-finalization time, never
    clobbered by other cache-refresh call sites which all key off the acting country''s own tv_wonder_locked/tv_wonder_ceremony_style)
    were all genuinely fine — the only remaining suspect was the just-written tv_wonder_ceremony_stage read-back. First attempt
    at the effect edit accidentally landed in the wrong function in gen_tv_engineering_department_wonder_mechanics_effects.py
    (this module exports several independent generate_*() entry points — generate() for tv_engineering_department_wonder_mechanics_effects.txt,
    generate_ritual_effects() via append_ritual_effects() for tv_wonder_ritual_effects.txt — and the new effect needed to
    go inside append_ritual_effects, not before it); running the wrong module''s own main() regenerated the wrong output file
    and silently left the real target unchanged, confirmed by grep showing the new effect name absent from tv_wonder_ritual_effects.txt
    after the first regen. Relocated the edit, ran gen_tv_wonder_ritual_effects.py specifically, and confirmed the new tv_wonder_mechanics_force_complete_active_ritual_effect
    appears in the generated file and the ceremony stage-8 effect calls it.'
- id: same_id_database_override_missing_replace_prefix
  pattern: ^(?:destroy_all_italian_leagues|university|library)\s*=\s*\{
  detectability: lint
  only_in_paths:
  - tv_engineering_department_triggers.txt
  - tv_victory_path_task_effects.txt
  - tv_victory_path_task_buildings.txt
  bad: Copying an existing vanilla trigger-localization key, scripted effect, or building type into an override file with
    the original bare top-level key
  correction: 'Prefix the patch with the narrowest correct directive: use `INJECT:<id>` when only adding a field that the
    vanilla definition does not contain (for example `INJECT:university = { on_construction_ended = { ... } }`); use `REPLACE:<id>`
    only when altering or replacing existing fields, preserving the complete original block plus the intended modification.
    This applies only to base-game vanilla identifiers guaranteed to exist regardless of load order — for a TV-namespaced
    key that only a non-guaranteed mod (e.g. the main `src/` mod) defines, see replace_prefix_requires_guaranteed_base_entry
    instead; REPLACE:-sharing that kind of key breaks whenever the defining mod isn''t loaded.'
  category: script
  scope: any
  source: runtime error.log gamedatabase.h:408, 2026-07-28; reference_mods/3626895335/in_game/common/scripted_effects/mshre_international_organization_effects.txt:1;
    reference_mods/3649381461/in_game/common/building_types/mod_improved_trade_&_buildings_buildings.txt:7
  notes: 'EU5 does not infer a patch merely because a mod repeats an existing non-event database key. A bare later block is
    rejected as a duplicate; use INJECT for a new child field and REPLACE only when an existing definition must change. 2026-08-02:
    removed TV_HAS_VARIABLE_NOT_SET_TT from this pattern''s example list after discovering it was the wrong fix for that specific
    key — see replace_prefix_requires_guaranteed_base_entry.'
- id: save_scope_as_used_in_trigger_context
  pattern: save_scope_as\s*=
  detectability: needs_parser
  only_in_paths:
  - generic_actions
  bad: Using `save_scope_as` inside a select_trigger `visible`/`enabled` block, or inside an `effect`'s `if`/`limit` trigger
    body, to stash a scope for a later comparison in that same trigger context
  correction: Use `save_temporary_scope_as` for any scope save performed inside a trigger-evaluated block (select_trigger
    visible/enabled, allow, potential, or any `limit = { ... }` body). Reserve `save_scope_as` for saves performed directly
    inside an effect body (siblings of `limit`, not inside it), where the scope needs to persist to sibling/later effect lines.
  category: scope
  scope: generic_actions
  source: 'reference_game_files/game/main_menu/common/scripted_triggers/00_coa_triggers.txt:116 (c:BOH = { save_temporary_scope_as
    = custom_overlord } inside a trigger-only scripted_trigger); pdx_persistent_reader.cpp ''Unknown trigger type: save_scope_as''
    runtime error in tv_trade_league_actions.txt, 2026-07-07'
  notes: 'The engine''s trigger parser does not register `save_scope_as` as a valid trigger type at all; only `save_temporary_scope_as`
    is valid inside trigger evaluation. `save_scope_as` is effect-only. The Trade Chain generator (`scripts/in_game/common/generic_actions/gen_tv_trade_league_actions.py`)
    used `save_scope_as` inside `chain_previous_save`/`chain_nearest_previous_limits` (limit-block distance comparisons) and
    `chain_selector_filter` (select_trigger visible/enabled), producing hundreds of duplicate ''Unknown trigger type: save_scope_as''
    errors on load. Fixed by switching those three helpers to `save_temporary_scope_as`; the one genuine effect-body save
    (`scope:target = { save_scope_as = tv_trade_chain_candidate_market }` in the action''s `effect` block) was left unchanged.'
- id: saved_scope_name_must_match_save_scope_as_exactly
  pattern: scope:tv_trade_candidate_market_location
  detectability: lint
  only_in_paths:
  - trade_league
  bad: Reading `scope:<name>` where `<name>` does not exactly match the string passed to any `save_scope_as = <name>` earlier
    in the same effect chain (e.g. reading `scope:tv_trade_candidate_market_location` when only `save_scope_as = tv_trade_candidate_market`
    was ever executed)
  correction: Grep the generator for every `save_scope_as = <name>` it emits and use that exact name in every later `scope:<name>`
    reference, including references made from a nested scope such as `scope:tv_trade_monopoly_leader = { ... }`. Saved scopes
    are exact-string keyed; a plausible near-miss name (an extra `_location` suffix, a singular/plural mismatch) silently
    resolves to nothing rather than erroring at generation time.
  category: scope
  scope: any
  source: 'runtime error.log, 2026-07-09: jomini_effect.cpp reported Event target ''tv_trade_candidate_market_location'' is
    used but is never set; scripts/in_game/common/scripted_effects/gen_tv_trade_league_effects.py:1717 (assign_candidate_to_io_rank)
    read scope:tv_trade_candidate_market_location while every_market_in_world only ever saved scope:tv_trade_candidate_market
    (annual_good_refresh_block, lines ~1849/1882)'
  notes: assign_candidate_to_io_rank runs inside scope:tv_trade_monopoly_leader = { ... }, itself nested inside the every_market_in_world
    iterator that saved the candidate as tv_trade_candidate_market. The `_location` suffix was never saved anywhere (no STATIC_MARKET_FIELDS
    entry and no other save_scope_as call produces it), so the representative-market assignment for the Trade League detail
    page silently wrote an unresolved scope into tv_trade_{prefix}_market_{rank}_{good} instead of the real candidate market.
    Fixed by correcting the reference to scope:tv_trade_candidate_market and regenerating tv_trade_league_effects.txt.
