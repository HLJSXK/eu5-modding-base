- id: effect_scalar_vocabulary_missing_target_check
  pattern: ''
  detectability: advisory
  only_in_paths:
  - scripts/wonder_mechanics
  - data/unique_wonders.yaml
  bad: 'Adding an EU5 effect name to a generic ''reward type -> effect'' vocabulary table (e.g. STYLE_3_REWARD_EFFECTS in
    scripts_engineering_department/wonder_mechanics/_core.py) with scope: country_scalar (a bare number as the whole statement,
    e.g. `add_bureaucracy = 12`) without checking reference_official_defines/docs/effects.log''s ''Supported Targets'' line
    for that effect'
  correction: 'Before adding any add_X effect to a numeric reward vocabulary table, grep reference_official_defines/docs/effects.log
    for ''## add_X'' and confirm it has no ''Supported Targets'' line (or one that only names a scope, not a typed target).
    Effects whose doc entry lists a Supported Targets type (e.g. add_bureaucracy: ''Supported Targets: bureaucracy_type'')
    take a typed reference argument, not a scalar, and will silently no-op (PostValidate returns false, no runtime crash)
    if assigned a bare number.'
  category: event
  scope: country
  source: 'scripts_engineering_department/wonder_mechanics/_core.py STYLE_3_REWARD_EFFECTS ''bureaucracy'' entry (removed
    2026-07-11); reference_official_defines/docs/effects.log ''add_bureaucracy: Adds a new bureaucracy of the supplied type
    to the country''s government. Supported Targets: bureaucracy_type''; 12 silently-failing add_bureaucracy = <N> calls across
    src_engineering_department/in_game/common/scripted_effects/tv_wonder_ceremony_effects.txt, all traced back to data/unique_wonders.yaml
