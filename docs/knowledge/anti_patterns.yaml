  correction: 'Use IsLeaderCountryInPlace instead: visible = "[InternationalOrganizationsView.GetInternationalOrganization.IsLeaderCountryInPlace]".
    To display the IO leader character''s name, use datacontext = "[InternationalOrganizationsView.GetInternationalOrganization.GetLeaderCountry.GetGovernment.GetRuler]"
    then text = "[Character.GetShortNameWithNoTooltip]".'
