  bad: Putting text_single with multiline text inside an hbox elastic column whose width is unconstrained (for example size
    = { -1 H })
  correction: Give the text area an explicit width or maximum width. For paragraph-like content, wrap it in a fixed-width
    widget/card and use text_multi with max_width and autoresize, as vanilla IO GUI does.
  category: gui
