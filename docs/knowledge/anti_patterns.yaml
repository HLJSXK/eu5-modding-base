    while the panel is hovered.
- id: gui_select_location_to_build_string
  pattern: SelectLocationToBuild(?:Default|WithLocation)?\s*\(\s*'[^']+'
  only_in_paths:
  - gui
  bad: Passing a building key string to SelectLocationToBuildDefault / SelectLocationToBuildWithLocation in GUI
  correction: Pass a BuildingType object from GUI data context, such as BuildingItem.GetBuildingType, LocationBuildingItem.GetBuilding.GetType,
    or BuildingType.Self. If no BuildingType object is available in the panel, route the button through a generic action with
    a location select_trigger.
  category: gui
  scope: building
  source: reference_game_files/game/in_game/gui/production_lateralview.gui:987; runtime report in src/in_game/gui/panels/organization/tv_engineering_department.gui
  notes: The vanilla build-location GUI calls SelectLocationToBuildDefault with a typed BuildingType object. A literal string
