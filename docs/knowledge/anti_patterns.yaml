- id: gui_tooltip_text_block_ignores_row_size_override
  pattern: ''
  detectability: advisory
  only_in_paths:
  - gui
  bad: Using TooltipTextBlock for a fallback/empty-state line next to a sibling TooltipRequirementsList or text_single that
    has blockoverride row_size / field_text_format sizing, expecting both to render at the same height
  correction: TooltipTextBlock (vanilla type in main_menu_cooltip_types.gui) wraps its text in a fixed vbox { margin = { @tooltip_inner_margin
    @tooltip_inner_margin } } (10px each side) around a text_multi_template textbox, and exposes no blockoverride for font
    size or row height. blockoverride row_size / field_text_format on a sibling TooltipRequirementsList does not reach it.
    When a mutually-exclusive fallback line must match a sized row's height (e.g. an effect list vs. its own "no effect" line),
    replace TooltipTextBlock with a plain text_single using the same fontsize and an explicit size, not the templated tooltip
