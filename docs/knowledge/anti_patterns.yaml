  correction: 'Every new modifier_type_definitions entry `<id>` needs MODIFIER_TYPE_NAME_<id> and MODIFIER_TYPE_DESC_<id>
    in every supported language (English, Simplified Chinese), plus a same-key entry in common/modifier_icons (see custom_modifier_type_missing_modifier_icon).
    Every new auto_modifiers entry `<id>` needs AUTO_MODIFIER_NAME_<id> in every supported language (no DESC key exists anywhere
    in this codebase — do not add one). Every new common/prices entry `<id>` needs a bare `<id>: "..."` localization key in
    every supported language (no `_desc` suffix). scripts/validate.py now runs check_modifier_type_definition_loc_and_icon_coverage,
    check_auto_modifier_name_loc_coverage, and check_price_name_loc_coverage automatically whenever the relevant common/ directories
    or main_menu/localization/ change.'
  category: localization
  scope: any
  source: docs/error_log/error.log 2026-08-02 16:19-16:20 (localization_util.cpp:103 TODO placeholders for MODIFIER_TYPE_NAME_/MODIFIER_TYPE_DESC_/AUTO_MODIFIER_NAME_/bare
    price keys; modifier_type.cpp:1294 Missing Icon for Modifier); scripts/validate.py check_modifier_type_definition_loc_and_icon_coverage,
    check_auto_modifier_name_loc_coverage, check_price_name_loc_coverage, _loc_keys_by_language
  notes: '2026-08-02: after fixing the direct-build price/cost_modifier registration bugs (price_gold_field_rejects_dynamic_scriptvalue),
    the user tested in-game again and reported error.log still showed six TODO-placeholder loc warnings (three MODIFIER_TYPE_NAME_/DESC
    pairs, three AUTO_MODIFIER_NAME_ names) plus three ''Missing Icon for Modifier'' warnings plus three bare price-name TODO
    placeholders — none of the three newly-created files (the modifier_type_definitions registration, the auto_modifiers file,
    and the price file itself) had been given companion localization, mirroring the EXACT gap the pre-existing STATIC_MODIFIER_NAME_<id>
    check (check_static_modifier_name_loc_coverage) already catches for common/static_modifiers, but that check does not cover
    modifier_type_definitions/auto_modifiers/prices at all. User explicitly asked for a validator so this class of mistake
    (new script identifier defined, companion localization forgotten) cannot recur silently. Added three new validate.py checks
    modeled directly on check_static_modifier_name_loc_coverage''s existing brace-aware block-iteration + per-language-key-set
    pattern (reusing _iter_top_level_blocks and a new shared _loc_keys_by_language() helper), registered in main() with the
    same use_changed/_paths_match guard style as the existing check. Verified the new checks against the pre-fix state first
    (confirmed they correctly flagged exactly the six missing loc keys and three missing icon entries the user reported, with
    zero false positives across the other 285 files), then filled in the actual English/Simplified Chinese localization plus
    the modifier_icons entries (reusing the existing masonry_positive.dds already used by the sibling tv_wonder_ritual_annex_*_price_cost_modifier
    entries), then re-ran validate.py --ai-report unfiltered to confirm 0 errors/0 warnings across all 288 files. The missing-icon
    check is a WARNING (baseline-trackable, does not block game load per the engine''s own log severity), while missing NAME/DESC/price-name
    localization is an ERROR (a real player-facing ''TODO: Write a desc'' defect), matching the severity split already established
    by check_modifier_names'' issues-vs-warnings convention.'
