- id: gui_show_modifier_effect_dynamic_key_static_reference
  pattern: ''
  detectability: advisory
  only_in_paths:
  - gui
  bad: Calling ShowModifierEffect with wonder display modifier ids built by GUI Concatenate(...) without generated static
    modifier definitions and unreachable script references
  correction: Generate matching static display modifiers plus an unreachable always = no script block that references every
    possible display id through add_country_modifier/add_location_modifier. Use those mirrors for GUI ShowModifierEffect display
    only; do not route completed wonder grants or scripted-effect tooltip previews through them.
  category: gui
  scope: modifier
  source: Engineering Department wonder auto-modifier refactor, 2026-06; follow-up runtime error.log for add_country_modifier
    invalid database objects, 2026-06
  notes: 'Building modifier blocks and GUI static mirrors carry display-only country/local effects, while country auto modifiers
    provide the actual national effects from owned final buildings. Scripted effect previews are a separate parser path: add_country_modifier
    validates against static/country modifiers, not common/auto_modifiers; the current wonder flow avoids modifier-list previews
    for auto-driven country effects.'
- id: gui_show_trigger_conditions_dynamic_key_needs_numeric_id_alias
  pattern: ''
  detectability: advisory
  only_in_paths:
  - gui
  bad: Calling ShowTriggerConditionsForScope with a trigger name built by GUI Concatenate(...) from a numeric display id,
    but only defining the underlying scripted_trigger under its string wonder key; or aliasing straight to a real gameplay
    trigger that carries extra guard conditions the display context already guarantees
  correction: Generate a thin alias scripted_trigger named with the numeric display id (e.g. tv_wonder_display_<id>_base_site_rules_trigger)
    so the Concatenate-built name resolves. Unlike ShowModifierEffect, scripted_trigger/scripted_effect names are not a separate
    database lookup, so no unreachable always = no reference block is needed for these aliases. Do not simply delegate the
    alias to the real gameplay trigger (tv_wonder_location_meets_<key>_base_site_rules_trigger = yes) if that trigger carries
    a guard condition (such as unique wonders' this = location:<site>) that is always true in the display's own context —
    a location tooltip already IS that location, so showing that condition as a row is redundant noise. Instead, re-embed
    just the site-rule condition list (the same trigger_conditions(...)/site_trigger_lines_for_wonder(...) call the real trigger
    uses) directly in the display alias, omitting the always-true guard.
  category: gui
  scope: trigger
  source: reference_official_defines/docs/data_types_uncategorized.txt (ShowTriggerConditions/ShowTriggerConditionsForScope
    both Arg0 CString, Arg1 Scope -> CString, same shape as ShowScriptedEffectForScope/ShowModifierEffect); location_window.gui
    wonder construction-conditions block, 2026-07
  notes: tv_wonder_location_meets_<key>_base_site_rules_trigger is already the location-scoped (unwrapped) form of the Engineering
    Department's any_owned_location-wrapped site rule check, so a GUI block that already runs in LocationView.GetLocation.MakeScope.Self
    can reuse its condition list directly via ShowTriggerConditionsForScope(Concatenate('tv_wonder_display_', Concatenate(idString,
    '_base_site_rules_trigger')), LOCATION_SCOPE) without any_owned_location. For unique wonders specifically, keep the this
    = location:<site> guard only on the real gameplay trigger (still needed so the wonder can only be queued/built at its
    designated site); the display alias should call trigger_conditions(wonder, mechanics, 1) directly rather than delegating,
    so the redundant 'is <site>' row does not render.
- id: gui_sibling_overlay_outside_datacontext_scope_loses_context
  pattern: ''
  detectability: advisory
  bad: Appending a shared overlay `widget` (e.g. a confirmation popup meant to float above all tab content) as a sibling AFTER
    a `vbox`/`hbox` closes, when that vbox is the one carrying `datacontext = "[...]"`, instead of nesting the overlay inside
    the vbox or giving the overlay its own datacontext. `append_tree_pending_confirm_overlay()` was called after `emit(lines,
    2, "}")` closed the datacontext-carrying vbox, so the overlay widget and all its descendants (visible checks, text_single/text_multi
    labels) had no Country data context at all.
  correction: '`datacontext` set on a widget/vbox/hbox only applies to that block''s own descendants; it is NOT inherited
    by later siblings once the block closes, even if the sibling is still inside the same enclosing `blockoverride`. Any `Country.MakeScope.GetVariable(...)`
    (or other typed accessor) used inside a sibling overlay placed outside the datacontext-carrying container must either
    be moved inside that container, or receive its own `datacontext = "[SituationView.GetPlayer]"` (or equivalent) directly
    on its own outermost widget. The runtime does not error at load time; every `FetchData` call inside the affected subtree
    silently fails with `pdx_data_callstack.cpp: No context supplied (Use SetDataContext), wanted context of type ''Country''`,
    which reads as the whole overlay''s dynamic content just not evaluating (visible conditions default false, values blank)
    rather than a crash.'
  category: gui
  scope: country
  source: 'scripts/in_game/gui/panels/situation/gen_tv_victory_situation_gui.py append_tree_pending_confirm_overlay (fix:
    added `datacontext = "[SituationView.GetPlayer]"` as the overlay''s own first property); docs/error_log/error.log 2026-07-13
    18:10:27 (repeated `No context supplied ... wanted context of type ''Country''` for every `tv_tree_pending_id` FetchData
    call between tv_victory_situation.gui:20145-21408)'
  notes: 'Found 2026-07-13 debugging the Victory Path Tree confirm/cancel overlay (see `generic_action_confirmation_needs_pending_variable_overlay_not_engine_window`):
    `append_panel()` calls `append_tree_pending_confirm_overlay(lines, 2)` right after closing the tab-content vbox that carries
    `datacontext = "[SituationView.GetPlayer]"`, making the overlay a sibling of that vbox inside `blockoverride "situation_panel_main_content"`,
    not a descendant of it. Every `visible`/`text` expression inside the overlay referenced `Country.MakeScope.GetVariable(...)`
    assuming it would inherit the parent''s Country context; instead every one of them failed FetchData silently. Applies
    to any future shared overlay/popup appended as a top-level sibling after a datacontext-scoped container closes -- always
    give it its own explicit `datacontext` if it needs typed-scope accessors. SUPERSEDED 2026-07-13 (same day): the overlay
    this bug lived in was deleted entirely once `force_click_and_confirm_or_hold = yes` (see `generic_action_confirmation_needs_pending_variable_overlay_not_engine_window`)
    was found to make it unnecessary -- kept here only as a general datacontext-scoping lesson for any future shared overlay/popup,
    not as a reference to still-existing code.'
- id: gui_situation_get_player_country_nonexistent
  pattern: GetPlayerCountry
  bad: GetPlayerCountry.MakeScope.GetVariable(...) or GetPlayerCountry in situation panel GUI expressions
  correction: Use Country.MakeScope.GetVariable('name').GetValue — Country is the implicit player country datacontext in situation
    panels. For situation-scope variables use SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('name')
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/situation/western_schism.gui:43
  notes: Exhaustive search of all situation panel .gui files found zero occurrences of GetPlayerCountry; western_schism.gui:43
    confirms Country.MakeScope as the correct chain for per-country variables
- id: gui_slider_template_background_dropped
  pattern: null
  bad: Flattening a ranged_slider part's template to its own texture and discarding the child widget's background layers
  correction: Preserve background blocks from the resolved slider-part widget and draw them behind its texture with their
    margins and alpha.
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/shared/standard_types.gui:668-673; reference_game_files/game/main_menu/gui/shared/progressbars.gui:126-162;
    ai_gui_assessment/screenshots/ui_library/lib_buttons_selectors.png
  notes: economy_slider_track uses bg_progress_bar_frame; its dark bordered track is visible in the UI Library screenshot
    (2026-10-12).
- id: gui_spriteborder_framesize_in_texture_pixels
  pattern: null
  bad: Treating spriteborder or framesize as texture pixels when sizing a nine-slice border or a frame strip
  correction: 'Both are in GUI units; the texture pixel value is the number multiplied by texture_density. Example: checkbox.dds
    is 160x80 with texture_density 2 and framesize {40 40}, i.e. two 80px frames.'
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/main_menu_buttons.gui:729-733; main_menu/gui/shared/textures.gui:194-199
    (pattern_vertical_bis); docs/guides/EU5_GUI_Modding_Guide.md section 3
  notes: Confirmed in game on the UI Library selectors page and the situation panel's empty sub-header band (2026-10-11).
- id: gui_stacked_bar_is_barchart_not_progressbar_arithmetic
  pattern: null
  bad: Faking a stacked or offset bar by overlapping several progressbars, or sizing widgets from expressions
  correction: 'Use `barchart` with `barslice` / `barslice_no_highlight` children: slice values are normalised like a pie,
    `direction = vertical` stacks bottom-up, `righttoleft = yes` reverses, and a transparent slice (`color = { 0 0 0 0 }`)
    offsets the next. Vanilla uses it inside tooltips (combat_tooltips.gui:2909) and as a horizontal bar (guelphs_and_ghibellines.gui:7).'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/shared/combat_tooltips.gui:2909; in_game/gui/panels/situation/guelphs_and_ghibellines.gui:7;
    in_game/gui/outliner_entries.gui:6533; loading_screen/gui/shared/defaults.gui:140 (`type barslice`)
  notes: A transparent leading slice as an offset has no vanilla precedent - verify in game before relying on it. The project
    renderer draws barchart/progressbar since 2026-10-13 (run.py proto).
- id: gui_state_on_start_does_not_inherit_datacontext
  pattern: state\s*=\s*\{[^{}]*\btrigger_on_create\s*=\s*yes[^{}]*\bon_start\s*=\s*"\[MapMode\.SetMapMode\]"
  only_in_paths:
  - src/stable/in_game/gui
  bad: Calling [MapMode.SetMapMode] from state.on_start while expecting a sibling or parent datacontext = [GetMapMode('<tag>')]
    to supply the MapMode object
  correction: 'Call the object-returning function inside the action expression: on_start = "[GetMapMode(''<tag>'').SetMapMode]".'
  category: gui
  scope: any
  source: 'EU5 error.log: No context supplied, wanted context of type ''MapMode'' for ''MapMode.SetMapMode''; reference_mods/3692202776/in_game/gui/cmf/cmf_after_lobby_caller.gui:10'
  notes: trigger_on_create state actions do not inherit the widget's datacontext for method dispatch. The action expression
    must create or receive the required object itself.
- id: gui_text_localizes_raw_text_is_literal
  pattern: null
  bad: Putting a localization key in `raw_text`, or an expression/`#format#` markup string in `text`
  correction: '`text` resolves a localization key (and also evaluates an embedded `[expression]`); `raw_text` is printed verbatim.
    Labels use `text`; expressions, inline `@icon!` texticons and `#colour ... #!` markup go in `raw_text`.'
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/goods_details.gui:61-64 vs 159 (`raw_text = "[Goods.GetNumSources]"`
    beside `text = "[Goods.GetDemandsInfo]"`)
  notes: Symptom is a raw key printed in the UI (e.g. `SOL_GUI_ROW_STRATUM_INCOME`), which reads as a styling bug rather than
    a property bug. Rule also in the GUI guide section 4 (2026-10-13).
- id: gui_text_missing_localization_key
  pattern: ''
  only_in_paths:
  - gui
  bad: text = "LOC_KEY" in a GUI file when LOC_KEY is not defined in main_menu/localization
  correction: Define the key in every supported localization file, correct the key to an existing one, or use raw_text for
    literal display strings.
  category: localization
  scope: any
  source: 'runtime error.log: pdx_gui_localize.cpp:182'
  notes: GUI text fields are localized. A typo such as TV_RM_TARGET_STEAM_ENGINE when only TV_RM_TARGET_IRON_WORKING exists
    logs 'Unlocalized text' at load.
- id: gui_text_single_autoresize_beats_declared_size
  pattern: null
  bad: Giving a fixed-width column cell a `size = { 46 26 }` and expecting the column to be 46px wide
  correction: Set `autoresize = no` on every fixed-width text cell. `text_single` inherits `autoresize = yes` from `text_single_template`,
    and autoresize makes the declared size lose to the text's intrinsic width, so the cell collapses to its content and the
    columns run together. Keep the default only where shrink-to-fit is wanted.
  category: gui
  scope: any
  source: reference_game_files/game/loading_screen/gui/textformatting.gui:636-642 (`text_single_template` sets `autoresize
    = yes`); renderer `engine.py` measures `hw = sw` only when autoresize is off
  notes: 'Cost real debugging time on the SOL estate ledger: five declared columns (46/50/58/52/96) all rendered at content
    width and fused into one run of digits. The renderer reproduces the game''s behaviour, so this was visible before launch.
    Rule also in the GUI guide section 2 (2026-10-13).'
- id: gui_texture_concatenate_raw_path
  pattern: ''
  detectability: advisory
  bad: Using texture = "[Concatenate('gfx/...', key, '.dds')]" to dynamically select a raw DDS path
  correction: Route dynamic images through a GUI function that returns a texture handle, such as GetConceptTexture(...). For
    arbitrary mod DDS assets, register image-only game concepts like tv_wonder_display_image_<id>, add matching game_concept_*
    and game_concept_*_desc localization, and build that concept id from a numeric slot id.
  category: gui
  scope: texture
  source: runtime-tested in src/in_game/gui/location_window.gui dynamic wonder display test; reference_official_defines/docs/data_types_uncategorized.txt
    lists GetConceptTexture
  notes: In the location-window test, GetConceptTexture(Concatenate(...)) rendered, but nested, suffix-only, and flat Concatenate
    expressions that returned raw DDS path strings did not render and produced no useful error log. Static texture paths are
    parsed by the GUI loader, while runtime texture expressions need a texture-like return value rather than a CString path.
- id: gui_tooltip_fixed_height_row_overflows
  pattern: ''
  only_in_paths:
  - gui
  bad: Wrapping tooltip rows that can grow in height in a fixed-size `widget` or an `expanding` child, e.g. `size = { W H
    }` around a `TooltipStringPairList` chain
  correction: Let the visible tooltip content establish its own height. Constrain width with `size = { W -1 }` or `minimumsize`,
    add `set_parent_size_to_minimum = yes` to the containing layout, and keep `ignoreinvisible = yes` so only visible rows
    contribute to the measured height.
