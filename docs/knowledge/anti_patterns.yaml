- id: select_trigger_world_source_reads_previous_target
  pattern: ''
  detectability: needs_parser
  bad: A later select_trigger uses source = world while visible/enabled/effect-preview logic reads scope:target or another
    earlier target_flag
  correction: Do not use source = world on a selector that depends on earlier selections. Omit source, use an inherited/actor
    source, or build an interaction_source_list so the chooser retains the previous target flags.
  category: scope
  scope: any
  source: src/in_game/common/generic_actions/tv_trade_league_actions.txt (Trade League embargo country selector fix, 2026-05);
    reference_game_files/game/in_game/common/country_interactions/force_embargo.txt:33-36
  notes: Trade League embargo selected a market, then opened a country selector with source = world and filtered countries
    by any_owned_location = { market = scope:target }. The selector showed no countries and logged 'Asking for a flag that's
    not in the interaction target chooser specified'. Removing source = world kept the later selector in the same interaction-target
    chooser so scope:target remained available.
- id: set_parent_size_to_minimum_vbox_needs_leaf_minimumsize_for_width
  pattern: ''
  detectability: advisory
  bad: A `vbox` with `set_parent_size_to_minimum = yes` (the standard auto-height chain pattern, paired with `layoutpolicy_vertical
    = shrinking`) contains a bare `text_multi` leaf with only `max_width`/`autoresize = yes`/`layoutpolicy_horizontal = expanding`
    and no `minimumsize` of its own -- e.g. `tv_engineering_department.gui`'s `TV_ENGINEERING_CEREMONY_ACTION_ONGOING`/`TV_ENGINEERING_CEREMONY_FINALIZED_TEXT`
    text_multi blocks, direct children of a vbox at `:8132`/`:8224` with `set_parent_size_to_minimum = yes`.
  correction: '`set_parent_size_to_minimum = yes` computes the vbox''s own size from the MINIMUM size each child reports --
    not from any `layoutpolicy_horizontal`/`size` set on the vbox itself or its parent `widget` (those were tried first, confirmed
    to have zero effect, and reverted). A bare `text_multi` with no `minimumsize` reports 0 intrinsic width, so it silently
    zeroes out the whole chain: the vbox (and any ancestor `widget` that in turn auto-fits to the vbox) collapses to margin-only
    width, and the text renders unselectable at effectively 0 width, with no error in the log. Give the leaf `text_multi`
    an explicit `minimumsize = { W -1 }` matching its `max_width` -- matching the vanilla `minimumsize = { W -1 }` + `autoresize`
    idiom (e.g. `reference_game_files/game/in_game/gui/advances_lateralview.gui:331-332`). The already-working Pharos/Hagia
    text rows in this same file never hit this because they are fully self-contained fixed-size boxes (`size = { W H }`, both
    dimensions literal) that never depend on `set_parent_size_to_minimum` in the first place.'
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:10520-10536 (TV_ENGINEERING_CEREMONY_ACTION_ONGOING/FINALIZED_TEXT,
    fixed 2026-07-12 by adding minimumsize = { 462 -1 }); :8140 (TV_ENGINEERING_CEREMONY_HELP_TEXT, same vbox :8132, same
    fix); :8211 (TV_ENGINEERING_CEREMONY_LOCKED_BY_EXPANSION_TEXT, same vbox, same fix); :8395-8431 (Pharos row, self-contained
    fixed size, never exposed to this failure); reference_game_files/game/in_game/gui/advances_lateralview.gui:331-332 (vanilla
    minimumsize + -1 auto-height precedent)
  notes: 'Two prior guesses were tested live by the user and confirmed to NOT fix this: (1) adding `ignoreinvisible = yes`
    to a sibling hbox -- irrelevant, wrong container; (2) adding/removing `layoutpolicy_horizontal`/`layoutpolicy_vertical`
    and explicit `size` on the ancestor `widget`/`vbox` (:8128, :8220) -- the user''s own live measurements showed the vbox
    width stuck at exactly its own doubled horizontal margin (8 = 4+4) regardless of those properties, and removing the widget''s
    `layoutpolicy_vertical = shrinking` entirely broke the widget''s OWN width too (470 -> 8). Those measurements were the
    key evidence that pointed to `set_parent_size_to_minimum` computing from child minimums rather than from ancestor policy.
    `docs/knowledge/risk_cards/gui.md` rule 14 and the tooltip-row paragraph in `docs/technical/EU5_Modding_Knowledge_Base.md`
    already documented giving the ROW/CONTAINER a `minimumsize` under `set_parent_size_to_minimum`, but neither stated that
    the LEAF content widget itself also needs one -- that gap is why this took three attempts to diagnose instead of one doc
    lookup. A follow-up project-wide regex/brace scan for other instances of this pattern produced far more false positives
    than real hits, because it cannot detect that an intervening fully-literal-sized `widget` (explicit numeric width AND
    height) breaks the dependency chain and makes everything inside it safe regardless of ancestors further up (e.g. `tv_engineering_department.gui:8263`/`:8298`-style
    ritual-requirement rows, and `tv_trade_league.gui:593`, both false-flagged). Only 2 additional real instances were confirmed
    by hand (`:8140`, `:8211`, same vbox as the original two). A reliable project-wide audit needs a `needs_parser` `validate.py`
    check that tracks literal-size-wrapper breaks, not a naive ancestor-substring scan.'
- id: shared_gui_type_default_vs_per_instance_placeholder_block
  pattern: ''
  detectability: advisory
  bad: Copy-pasting the same ~30-line header button+tooltip block (icon, action_tooltip, tooltipwidget shell) into every instance
    of a shared card type instead of baking it into the type's default, and/or leaving a fully-overridden shared-type instance
    (every visible block already blockoverride'd) instantiating the type anyway.
  correction: 'When a shared `type X = hbox { block "A" {...} block "B" {...} }` gets the same non-trivial content repeated
    across ≥3 instances (this project''s own ≥3-repeated-structural-unit threshold), move the repeated content into the type''s
    own default for that block and expose ONE narrow placeholder block at the point per-instance content differs -- but that
    placeholder MUST sit directly in the outer type''s own body, not nested inside a further `blockoverride` of a DIFFERENT
    type''s instantiation (e.g. a `tooltipwidget = { ConceptTooltipType = { blockoverride "tooltip_content" { ... } } }` embedded
    in the outer type). A per-instance `blockoverride` on the OUTER type could not reach a custom block declared two levels
    deep inside that nested type''s own blockoverride -- confirmed broken in-game even though it validated and parsed fine
    (validate.py is a text linter, not the real block-resolution engine). Every OTHER working block-override in this codebase
    is either declared directly within the same type''s body (no nested-type crossing), or is a block belonging to the nested
    type itself, overridden directly by the caller at the instantiation site (e.g. `ConceptTooltipType`''s own `title_icon`/`title_text`/`tooltip_content`,
    per `SimpleConceptTooltipType`/right_panel.gui precedent) -- not a custom block invented inside that nested override.
    Fix: expose one placeholder that wraps the ENTIRE nested type instantiation (e.g. `block "header_help_tooltip" { tooltipwidget
    = { ConceptTooltipType = {...default...} } }`), so each instance''s override supplies the whole `tooltipwidget = { ConceptTooltipType
    = { blockoverride ... } }` block directly -- more duplication than the two-placeholder version, but every override target
    is a proven-safe pattern. Conversely, before instantiating a shared type for a new generated/repeated component, check
    whether every block the type would provide is already going to be blockoverride''d (header fully blanked, background fully
    replaced, bottom content fully replaced) -- if so, the type contributes nothing but its outer layout skeleton and one
    non-overridden default property (here `card_common_bottom_margin`''s `margin = { 15 10 }`), which is cheap to reproduce
    directly without the type indirection.'
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui (tv_engineering_department_card_common type, header_help_tooltip
    block); scripts/in_game/gui/panels/organization/gen_tv_wonder_ceremony_cards_gui.py (append_card, converted from instantiating
    the shared type to a hand-built vbox)
  notes: 'Applied 2026-07-13: a Europedia-opening header help button (icon + action_tooltip + ConceptTooltipType tooltip)
    was first added by hand to 2 of 11 named tv_engineering_department_card_common instances, then baked into the base type''s
    common_header_extra_left/right defaults once the plan was to apply it to all 11. First attempt used two custom placeholder
    blocks (`header_help_title_text`, `header_help_tooltip_rows`) nested inside the base type''s own `blockoverride "title_text"`/`blockoverride
    "tooltip_content"` of a `ConceptTooltipType` instantiation -- this parsed cleanly and passed validate.py, but the user
    reported the Construction and Organization&Logistics cards'' tooltip content had actually disappeared in-game. Re-architected
    to a single `block "header_help_tooltip" {}` wrapping the entire `tooltipwidget = { ConceptTooltipType = {...} }` as a
    direct child of `button_regular` (same-type nesting, no crossing), with each of the 6 named cards now overriding that
    one block with its full tooltipwidget content -- verified via brace-balance + validate.py after the restructure; still
    pending an actual in-game confirmation. Separately, the panel''s 8 auto-generated Unique Wonder Ceremony stage cards already
    overrode every block the type renders (header_size/header_decor_templates/common_header all blanked, card_bg fully replaced,
    common_bottom_content fully replaced), so they were converted to a hand-built vbox in the generator, reproducing only
    the type''s real remaining contribution -- the card_common_bottom_margin default `margin = { 15 10 }` that the cards''
    hardcoded 432px content width (`462 - 15*2`) already depended on.'
- id: shared_texticon_glyphs_render_at_inconsistent_pixel_size_across_icon_names
  pattern: ''
  detectability: advisory
  bad: Rendering per-entity dynamic inline text-icons (`@icon_name!`) at one shared `fontsize` on a `text_single`, and assuming
    every icon name renders at the same visible pixel size because the call site's fontsize is identical.
  correction: '`reference_game_files/game/main_menu/gui/shared/font_icons.gui` defines every `texticon` block''s `iconsize.size`/`iconsize.fontsize`
    independently per icon name, with no shared convention: e.g. `construction` is 14x14 native at fontsize 14, `wealth` is
    20x20 at fontsize 18, `topography`/`army_tradition`/`prestige` range 24x24-26x26 at fontsize 16. The engine scales the
    glyph as `native_size * (call_fontsize / native_fontsize)`, so calling every icon at one shared fontsize (here, 17, in
    the Unique Wonder Ceremony''s 8 status cards, one inline icon per wonder per stage picked from `data/unique_wonders.yaml`''s
    `ceremony.stages[i].icon`) produced visibly different pixel sizes per wonder (a ~14px icon next to a ~26px icon in the
    same 52x52 piechart slot), plus inconsistent vertical centering from each icon''s own baked-in `offset`. Verified (Step
    3, `reference_official_defines` + `reference_game_files`) that there is no per-instance size-override syntax for inline
    icon markup (no `@icon|size!` form), and no vanilla or existing-codebase precedent for resolving a GUI `texture` field
    via `Localize()`/`Custom()` to fetch a per-entity dynamic icon path (that path is text-only). The correct fix is NOT a
    new icon widget with a dynamically-resolved texture (would need ~650 dispatch widgets with long `Or`-chained `visible`
    expressions across 121 wonders x 8 stages x 2 piechart states — real GUI bloat and per-frame eval cost) and NOT curating
    icon choices to already-similar sizes (data-only triage, not pixel-perfect). Instead, define a PARALLEL set of `texticon`
    aliases — one per distinct icon name actually used — each reusing the same vanilla texture but with a uniform `size`/`offset`/`fontsize`
    matching the call site''s own fontsize (so the render-time scale factor collapses to exactly 1 for every icon). Mods CAN
    declare their own `texticon` blocks reusing a vanilla texture with custom sizing (precedent: `reference_mods/3601047146/main_menu/gui/shared/glorpui_font_icons.gui`,
    `reference_mods/3599735023/in_game/gui/IV2_texticons.gui`). Implemented via `scripts_engineering_department/main_menu/gui/shared/gen_tv_ceremony_font_icons_gui.py`,
    which derives the distinct icon-name list from the ceremony data itself (not hardcoded) and looks up each name''s real
    texture path from a new `FONT_ICON_TEXTURES` map in `wonder_mechanics/_core.py` (a texture-capturing sibling of the existing
    `FONT_ICON_DECL_RE`/`_load_font_icon_names()`/`SUPPORTED_CEREMONY_STAGE_ICONS` name validator). The two ceremony localization
    generators then emit `@tv_ceremony_<name>!` instead of `@<name>!` via a new `ceremony_icon_alias()` helper in `wonder_ceremony_lib.py`
    — zero changes to the `.gui` call sites, zero new widgets, zero runtime dispatch changes.'
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/font_icons.gui; scripts_engineering_department/wonder_mechanics/_core.py
    FONT_ICON_TEXTURES/_load_font_icon_textures; scripts_engineering_department/wonder_ceremony_lib.py ceremony_icon_alias;
    scripts_engineering_department/main_menu/gui/shared/gen_tv_ceremony_font_icons_gui.py; src_engineering_department/main_menu/gui/shared/tv_ceremony_font_icons.gui;
    docs/knowledge/risk_cards/wonders.md; 2026-07-17
  notes: '2026-07-17: user reported the 8-step Unique Wonder Ceremony''s left-side piechart center icon sizes were inconsistent
    and generally too small, asking whether inline text icons could be replaced with a normal icon component. Investigated
    the GUI icon display tier order first (a real `icon` widget needs a dynamic texture, which has no engine precedent via
    Localize/Custom — verification failed), then a grouped-conditional-icon-widget alternative (rejected for ~650-widget bloat
    given 121 wonders), before landing on the texticon-alias approach, confirmed by mod precedent. Icon size was set to 22x22
    initially, then increased to 32x32 per user follow-up request (still fits inside the 52x52 piechart slot with margin).
    `test_wonder_mechanics_rules.py` and `scripts/validate.py --changed --fix --ai-report` both passed after the fix (0 errors/warnings).'
- id: simple_assign_trigger_not_equal_operator
