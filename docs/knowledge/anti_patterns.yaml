- id: gui_guessing_type_blocks
  pattern: null
  bad: Writing a blockoverride for a vanilla type from memory, or assuming where its content lands
  correction: 'Print the resolved type with `& $env:EU5_PYTHON ai_gui_assessment/renderer/guidef.py <type>` and check the
    block''s position: override content is inserted at the block and validated against that parent (no parentanchor or % size
    inside an hbox/vbox child). An instance''s own blockoverride beats one inherited from an outer instance. Optionally render
    the screen with ai_gui_assessment/renderer/run.py.'
  category: gui
  scope: any
  source: docs/guides/EU5_GUI_Modding_Guide.md sections 0-1; docs/error_log/error.log (pdx_gui_validation.cpp:62)
  notes: Supersedes guessing; compare each rendered region with its 1080p screenshot. The SOL tooltip frame width matches
    its screenshot, but screen-wide pixel accuracy is unproven.
- id: gui_hbox_assumed_left_aligned
  pattern: null
  bad: Assuming fixed-size children of an expanding hbox/vbox are packed to the start with the leftover space at the end
  correction: With no expanding/growing child, leftover space is distributed evenly between children (first and last flush
    with the edges). Add expand = {} to align to one side. Expanding children receive extra space before growing ones, and
    expand = {} is growing.
  category: gui
  scope: any
  source: loading_screen/gui/custom_loading_screen.gui:660 (type expand, layoutpolicy growing); docs/guides/EU5_GUI_Modding_Guide.md
    section 2
  notes: Confirmed in game on the SOL goods grids and the location window demography charts (2026-10-11). The final-row spacer
    widgets in SOL grids exist to keep the even distribution.
- id: gui_hbox_unbounded_multiline_text_width
