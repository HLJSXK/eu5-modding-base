- id: gui_datamodel_getlist_scope_wrapper
  pattern: ''
  bad: item = { widget = { datacontext = "[Scope.GetCharacter]" ... action_button_diamond = { parameter = { parameter_value
    = "[Character]" } } } } — rebinding datacontext to Character, then using [Character] in action_button_diamond parameter_value
  correction: 'MakeScope.GetList returns Scope wrappers. Do NOT rebind datacontext inside item''s widget. Instead, use the
    full Scope.GetCharacter chain everywhere: raw_text = "[Scope.GetCharacter.GetNameToFit(...)]", parameter_value = "[Scope.GetCharacter]".
    action_button_diamond evaluates parameter_value in UIAction context, which does NOT inherit parent widget datacontext
    — so [Character] after datacontext rebind silently resolves to the outer context or null.'
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:332-336 (GetList + Scope.GetCountry),
    reference_game_files/game/in_game/gui/government_lateralview.gui:4225 (parameter_value uses full explicit chain)
  notes: GetList always returns Scope wrappers regardless of stored type. action_button_diamond creates a UIAction object
    that evaluates parameter_value outside the widget's local datacontext chain. [Character] after datacontext = "[Scope.GetCharacter]"
    on the parent widget is NOT visible to the UIAction evaluator. Always use the explicit Scope.GetCharacter.xxx chain in
    every expression within the item, including parameter_value — never rely on datacontext inheritance through action_button_diamond.
- id: gui_datamodel_item_multiple_children
  pattern: ''
  bad: A datamodel item block with more than one top-level child widget, e.g. item = { vbox = { ... } widget = { ... } }
  correction: Wrap all row content inside a single parent widget/vbox/hbox so the item block contains exactly one child. Put
    dividers or auxiliary widgets inside that parent.
  category: gui
