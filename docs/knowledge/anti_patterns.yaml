- id: monthly_country_pulse_callback_missing_participation_gate
  pattern: ''
  detectability: needs_parser
  only_in_paths:
  - on_action
  - scripted_effects
  - pulse_registry.yaml
  bad: A monthly_country_pulse-registered callback (or any per-country on_monthly-style hook) starting straight into a global/expensive
    scope iteration (every_character, every_country, every_international_organizations_member_of, every_owned_location, nested
    every_key_in_variable_map, etc.) with no cheap has_variable/has_variable_list membership check first. Because the callback
    runs for EVERY country every month, an ungated O(k) scan inside it becomes O(countries x k) system-wide, and if k itself
    scales with world population/character count the callback alone is O(countries x world_size).
  correction: 'Before any nontrivial scope walk inside a per-country monthly callback, gate it behind the cheapest possible
    existence/membership check for the state the walk actually needs (has_variable_list on a country-scoped list variable
    is strictly better than a global every_character/every_country scan filtered by a limit, since the list is already bounded
    to what this country owns). Example fix: tv_leaderboard_monthly_pulse''s touring-artist roll used an ungated every_character
    = { limit = { is_artist=yes has_variable=tv_on_exhibition } } scanning every living character in the world every country
    every month; replaced with if = { limit = { has_variable_list = tv_dispatched_artists_list } } every_in_list = { variable
    = tv_dispatched_artists_list ... } since dispatching countries already maintain that list.'
  category: on_action
  scope: country
  source: src/in_game/common/on_action/towards_victory_leaderboard.txt (tv_leaderboard_monthly_pulse, fixed 2026-07-10); src/in_game/common/scripted_effects/towards_victory_effects.txt
    (tv_io_establishment_mark_basic_requirements_effect conquest branch, fixed 2026-07-10); src/in_game/common/scripted_effects/tv_trade_league_effects.txt
    + tv_diplomatic_alliance_effects.txt (tv_trade_league_country_monthly_pulse_effect / tv_diplomatic_alliance_country_monthly_pulse_effect,
    fixed 2026-07-10); src/in_game/common/scripted_effects/tv_academy_philosophy_debate_effects.txt (tv_academy_world_debate_monthly_effect's
    mirror call, fixed 2026-07-10); audit also found the same missing-gate shape still open in tv_wonder_mechanics_refresh_country_auto_level_map_effect
  notes: 'Engineering Department, Governor''s House, and Academy of Sciences monthly pulses already follow the correct has_variable-gate-first
    pattern and are good reference examples. This rule is needs_parser (not lint) because detecting it requires knowing whether
    a cheap gate trigger precedes the expensive iterator within the same callback body, which needs brace-aware scope tracking;
    a future scripts/validate.py checker could walk pulse_registry.yaml callbacks and flag every_character/every_country/every_international_organizations_member_of/every_owned_location
    appearing before any has_variable/has_variable_list check in the same effect body.

    Second technique, used for tv_io_establishment_mark_basic_requirements_effect''s conquest branch: an existence/membership
    gate does not help when the country IS a legitimate participant and the value must still progress toward completion (e.g.
    tv_update_conquest_score_effect''s every_subject_or_below scan feeds a threshold every not-yet-established country needs
    to keep evaluating). There, split by is_ai instead of gating on existence: keep the scan on the existing monthly_country_pulse
    callback for is_ai = no, and add a sibling callback registered under yearly_country_pulse (see pulse_registry.yaml) that
    runs the same scan for is_ai = yes once a year. This mirrors the already-accepted human-monthly/AI-yearly split in towards_victory_situations.txt''s
    tv_victory_situation.on_monthly. The scan itself is bounded by the ticking country''s own subject count (not world size),
    so this is a lower-severity instance of the pattern than the world-character scan in tv_leaderboard_monthly_pulse -- worth
    fixing for consistency and to stop it running forever for AI, but not an O(n^2) hazard on its own.

    Third technique, used for tv_trade_league_country_monthly_pulse_effect and tv_diplomatic_alliance_country_monthly_pulse_effect:
    both scanned every_international_organizations_member_of across ALL instances of the IO type every country every month,
    relying on an inner limit (leader_country ?= scope:<pulse_country>) to discard every entry except the one where the ticking
    country happens to be that instance''s leader -- meaning only actual IO leaders ever did real work, but every non-leader
    country still paid the full scan cost walking every league/alliance''s membership list. A plain has_variable_list membership
    gate is too coarse here (it would still admit every non-leader member, not just leaders). Use is_leader_of_international_organization_of_type
    = { type = tv_<io> } instead -- a single O(1) trigger check, already used elsewhere in this codebase (data/io_establishment.yaml
    ai_creation_requirement_body, src/in_game/common/generic_actions/tv_io_leader_actions.txt) -- to skip the scan entirely
    for every country that isn''t currently leading any instance of that IO type.

    Fourth case, tv_academy_world_debate_monthly_effect (scripts/philosophy_debate_codegen.py): this one already had the right
    gate (if = { limit = { has_variable = tv_academy_world_debate_active } ... }) but the tv_academy_world_debate_mirror_all_countries_effect
    = yes call (an every_country walk over every academy-owning country) was emitted at the WRONG indent level, one level
    shallower than the if body, so it ran every month unconditionally regardless of whether a debate was active. Not a missing
    gate, a misplaced statement outside an otherwise-correct one -- when a codegen helper builds nested blocks by explicit
    indent level (emit(lines, level, text) style, as opposed to raw multi-line string templates), double-check the indent
    level of every appended line against the block it is meant to close into, especially the last statement before a block''s
    closing brace. The mirror is still safe to run on the exact month the debate resolves, since resolve_effect only clears
    active partway through the same if body and EU5 effect blocks execute sequentially rather than re-checking the outer limit
    -- so moving the call to be the last line inside the if (not after it) preserves the one clearing pass on resolution while
    skipping all the months no debate is running.'
