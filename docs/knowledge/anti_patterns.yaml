  scope: character
  source: 'runtime error.log, 2026-06: character_noble localization fallback; reference_game_files/game/in_game/common/attribute_columns/09_character.txt
    defines character_info and character_artist'
  notes: 'The selector column data token is an attribute-column id, not a free label for the filtered target type. An undefined
    column can surface as a startup localization fallback such as character_noble: "Character noble".'
- id: generic_action_single_right_click_uses_right_action
  detectability: advisory
  pattern: ''
  bad: Binding an ordinary right-click generic action with right_click_and_hold_action, or omitting a separate right_action
    when the interaction requires an immediate right click
  correction: On the action_button, bind the separate action with right_action = { action_name = <id> }. Reserve right_click_and_hold_action
    for interactions that deliberately require the mouse button to be held. Give the right-click action its own potential,
    allow, effect, AI-list entry, message type, and localization.
  category: gui
  scope: any
  source: reference_game_files/game/in_game/common/generic_actions/readme.txt:90-91
  notes: The generic-action GUI contract distinguishes a single right click from a right-click-and-hold; choosing the hold
    field for an ordinary right click changes the player interaction instead of merely selecting another button.
- id: global_var_unguarded_in_script_value
  pattern: 'multiply\s*=\s*global_var:|add\s*=\s*global_var:|divide\s*=\s*global_var:|subtract\s*=\s*global_var:'
  bad: Direct 'multiply = global_var:NAME' (or add/subtract/divide) inside a script_value, expecting an on_game_start effect
    to set the global first
  correction: 'Wrap the global read in a guarded local script_value: define ''local_NAME = { value = <safe_default>  if =
    { limit = { has_global_variable = NAME }  value = global_var:NAME } }'' and reference ''multiply = local_NAME'' instead.
    Optionally also init via on_game_start as defense-in-depth, but the wrapper is the load-bearing fix.'
  category: scope
  scope: global
  source: runtime observation from EU5 script_value validation
  notes: EU5 evaluates script_values during file-load validation BEFORE any on_action (including on_game_start) fires. An
    unguarded global_var read produces 'Failed to fetch variable', 'Event target link global_var returned an unset scope',
    and 'Got value of type none' errors that propagate up to every caller script_value. on_game_start init alone cannot fix
    this — the validation pass runs earlier. Wrapping with has_global_variable + safe default is the only robust approach.
- id: global_variable_map_add_does_not_update
  pattern: null
  bad: Using add_to_global_variable_map by itself to update an existing key
  correction: 'Remove the existing key first, then add the new value: remove_from_global_variable_map = { name = X key = scope:Y
    } followed by add_to_global_variable_map = { name = X key = scope:Y value = Z }.'
  category: scope
  scope: global
  source: user-reported engine behavior (2026-06)
  notes: add_to_global_variable_map only inserts missing keys. If the key already exists, the old value is silently kept.
- id: goods_demand_block_value_syntax
  pattern: ''
  bad: 'goods demand entry using block syntax: wine = { value = SOL_wine_demand }'
  correction: 'Direct scalar assignment — no block wrapper: wine = SOL_wine_demand'
  category: scripted_values
  scope: pop
  source: reference_game_files/game/in_game/common/goods_demand/pop_demands.txt
  notes: pop_demand good entries must be plain key = value pairs (matching vanilla wine = 1 pattern). Block wrapper { value
    = ... } causes the parser to load only the first entry and drop all subsequent goods plus category. Both quoted strings
    and block wrappers are broken; direct assignment is the only valid form.
