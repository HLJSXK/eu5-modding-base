- id: select_trigger_custom_target_flag
  pattern: target_flag\s*=\s+(?!target(_\d+)?\b|recipient\b)
  bad: target_flag = selected_artist (or any custom name) in select_trigger for 3-step generic actions
  correction: 'Use the vanilla naming convention: target_flag = target for step 1, target_flag = target_1 for step 2, target_flag
    = target_2 for step 3. Always wrap effect block in if = { limit = { exists = scope:target } ... } guard.'
  category: scope
  scope: any
  source: reference_game_files/game/in_game/common/generic_actions/make_unit_available_for_hire.txt (target / target_1 / target_2
    pattern)
