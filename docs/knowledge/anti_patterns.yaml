- id: gui_bare_widget_never_sizes_to_its_children
  pattern: null
  bad: Wrapping content in a bare `widget = { background = {...} hbox = { ... } }` and expecting the widget to take its children's
    size, or trying to rescue it with `minimumsize` on the widget itself
  correction: A widget-like element takes its hint from a declared `size`, or only from children that carry `set_parent_size_to_minimum
    = yes` (a child's `resizeparent = yes` is honoured the same way). A bare `widget` with neither measures 0, and `minimumsize`
    on the parent does not rescue it because the parent is measured before that. Either use a `vbox`/`hbox` (which do size
    to their children) as the framed container, or put `set_parent_size_to_minimum = yes` on the child.
  category: gui
  scope: any
  source: 148 vanilla uses of `set_parent_size_to_minimum` in reference_game_files/game (e.g. alertmanager.gui:269, agenda_view.gui:220,
    alert_settings.gui:522); project renderer ai_gui_assessment/renderer/engine.py `_measure` widget branch and `_place` (`if
    c.kind in BOX ... and not size` / `set_parent_size_to_minimum`)
  notes: 'Cost a full prototype round: the SOL tooltip hero rendered as `widget 400x0` with all its content scrolled over
    the section below, and probes isolated it (a sized child measures; the same child inside a bare widget measures 0). Same
    rule applies to art placed as a bare `background` on a childless element - emit it as a sized child widget instead (2026-10-13).'
- id: gui_blockoverride_cannot_parameterize_siblings
  pattern: null
  bad: Declaring one block in a type and instantiating the type five times, expecting five different values - e.g. five table
    cells each with its own `blockoverride "cell_value"`
  correction: A `blockoverride` replaces a block *entirely*, and an instance's own override beats one inherited from outside,
    so sibling instances of the same type each keep their own default. Expose ONE container block per row (`block "sol_cells"
    {}`) and let the caller fill it with its own child instances, each carrying its own override.
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:1601 (`type TooltipTableHeader`); confirmed
    by rendering in `ai_gui_assessment/renderer/`
  notes: 'Design constraint behind the SOL kit''s single-container-block-per-row shape. Getting it wrong silently duplicates
    elements rather than erroring: emitting five cells *alongside* a block that already held five defaults produced ten per
    row (2026-10-13).'
- id: gui_boolean_helper_arity
  pattern: ''
  only_in_paths:
  - gui
  bad: Using GUI And(...) or Or(...) with three or more operands
  correction: Use And3(...) / Or3(...) for exactly three operands, or nest binary And(...) / Or(...) calls for larger expressions.
