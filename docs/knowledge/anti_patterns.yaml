- id: gui_only_global_variable_map_unused_warning
  pattern: null
  bad: Writing global_variable_map values only for GUI display, with GetVariableFromGlobalVariableMap(...) as the sole read
  correction: Keep global_variable_map for keyed caches when appropriate, but also read each map name in a live script path
