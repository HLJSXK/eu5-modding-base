  category: scope
  scope: location
  source: reference_mods/3692202776/in_game/common/scripted_effects/cmf_log_effects.txt:89; reference_mods/3692202776/in_game/gui/cmm/panes/cmm_log_pane.gui:214-249;
    reference_mods/3692202776/in_game/gui/cmm/cmm_components/cmm_text_setting.gui:34; reference_game_files/game/in_game/common/country_interactions/gra_trade_prestige_silk.txt:62
  notes: 'User-reported: debug_log output is unreliable for test readings. CMF stores a snapshot per row (cmf_log_num/num2/num3
    maps, max 200 rows; clear with cmf_clear_log). action and arg1 are flags rendered via Localize, so each needs a localization
    key. goods_demand_in_market is the market-wide total from all sources; isolate one country by differencing against a baseline.'
- id: construct_building_cost_multiplier_needs_reason
  pattern: ''
  detectability: lint
  validator: check_construct_building_cost_multiplier_reason
  bad: construct_building = { ... cost_multiplier = N ... } without cost_multiplier_reason
  correction: When construct_building uses cost_multiplier, also provide cost_multiplier_reason = <loc key>. For event-funded
    free construction, vanilla commonly uses cost_multiplier_reason = "game_concept_event".
  category: script
  scope: location
  source: reference_game_files/game/in_game/events/situations/golden_age_of_piracy.txt:261-265; reference_official_defines/docs/effects.log:1145-1154
    (construct_building documents cost_multiplier_reason as a sibling field); src_engineering_department/in_game/common/scripted_effects/tv_wonder_ceremony_effects.txt
    (13 pre-existing TV construct_building calls already pair cost_multiplier = 0 with cost_multiplier_reason = "game_concept_event")
  notes: 'EU5 logs a script system error when construct_building has a cost multiplier but no reason key: ''No reason given
    for the cost multiplier in construct_building effect''. 2026-08-02: upgraded from advisory (documented but unchecked)
    to lint after this exact mistake recurred — the CMM skip_ceremony ritual-annex construction added 54 new construct_building
    calls (`cost_multiplier = 0 instant = yes`, one per generic wonder) in tv_wonder_ritual_effects.txt without the reason
    key, even though the identical cost_multiplier = 0 free-construction pattern already existed correctly (with cost_multiplier_reason
    = "game_concept_event") in the adjacent tv_wonder_ceremony_effects.txt file in the SAME codebase. Added check_construct_building_cost_multiplier_reason,
    using the existing _find_matching_brace helper to extract each construct_building = { ... } block (handles both the single-line
    and multi-line forms both used in this codebase) and flag any block containing cost_multiplier but not cost_multiplier_reason.
    Unit-tested directly against synthetic single-line and multi-line bad/good snippets before trusting it, then verified
    0 false positives against the full 288-file repo.'
- id: cost_modifier_renamed_to_efficiency_1_3
  pattern: \b(?:global_build_buildings_cost|local_build_buildings_cost|local_build_new_buildings_cost|local_trade_embark_disembark_cost_modifier|stability_cost)\s*=
  only_in_paths:
  - src/stable
  bad: EU5 <=1.2 cost modifier name for construction, trade embark/disembark, or stability investment
  correction: 'Use the EU5 1.3 efficiency modifier name: global_build_buildings_efficiency, local_build_buildings_efficiency,
    local_build_new_buildings_efficiency, local_trade_embark_disembark_efficiency, or stability_cost_efficiency. Flip the
    sign when preserving old cost penalties/discounts.'
  category: modifier
  scope: any
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:4103,4167,4175,6838,10255
  notes: EU5 1.3 renamed these cost-style modifiers to positive-good efficiency modifiers. Positive efficiency reduces cost,
    so old positive cost penalties become negative efficiency and old negative cost discounts become positive efficiency.
- id: country_capital_link_non_optional_in_trigger
  pattern: ''
  detectability: advisory
  bad: Country-scoped pulse, iterator, scripted trigger, or effect `limit` uses a direct `capital = { ... }` link, or puts
    sibling `exists = capital` before it expecting trigger short-circuiting
  correction: Use the optional link form `capital ?= { ... }` for trigger/limit checks. For effects, put `capital ?= { ...
    }` in the `limit`, and only enter direct `capital = { ... }` in the effect body after that `if` limit passes.
  category: scope
  scope: country
  source: 'runtime error.log: common/scripted_triggers/towards_victory_triggers.txt:487, 2026-06-21; reference_game_files/game/in_game/common/generic_actions/religious_factions.txt:1352'
  notes: Some countries can have no valid capital object when yearly/monthly refresh effects run. Trigger blocks do not reliably
    short-circuit sibling lines, so `exists = capital` beside `capital = { ... }` still allows the direct link to be evaluated
    and can log `Event target link 'capital' returned an invalid object`.
- id: country_interaction_accept_unset_selection_reads
  pattern: ''
  detectability: advisory
  only_in_paths:
  - country_interactions
  bad: Reading `scope:recipient` or an unset actor variable directly inside country interaction accept scoring or a target-mutating
    effect before the select_trigger has chosen a country
  correction: Guard recipient-dependent reads and mutations with `exists = scope:recipient`. Initialize actor-owned variables
    at the feature creation lifecycle point, and gate nullable value reads with `has_variable` before using `scope:actor.var:<name>`
    in `accept`.
  category: scope
  scope: country
  source: runtime error.log for tv_invite_to_diplomatic_alliance, 2026-06-24; reference_game_files/game/in_game/common/country_interactions/invite_settlers.txt:90-104
  notes: Country interaction accept/effect paths can be evaluated from panel buttons before the selector populates recipient.
    Direct reads then report wrong-type `none`, unset variables, or unset `var` scopes while the player is only looking at
    the country picker.
- id: country_interaction_potential_io_iterator_without_actor
  pattern: potential\s*=\s*\{\s*(?:hidden_trigger\s*=\s*\{\s*)?(?:NOT\s*=\s*\{\s*)?any_international_organizations_member_of\s*=
  detectability: lint
  only_in_paths:
  - country_interactions
  bad: any_international_organizations_member_of directly under country_interaction potential
  correction: Wrap country-scoped checks in scope:actor = { ... } inside country_interaction potential.
  category: scope
  scope: country
  source: reference_official_defines/types/country_interactions.txt:11; reference_game_files/game/in_game/common/country_interactions/bribe_vote.txt:26-33
  notes: country_interaction potential does not provide a country root for this iterator; direct usage logs inconsistent trigger
    scopes (invalid vs. country). Official defines document scope:actor as the acting country.
- id: country_trigger_root_inside_situation_every_country
  pattern: most_powerful_merchant\s*=\s*root
  only_in_paths:
  - victory_paths.yaml
  - towards_victory_triggers.txt
  bad: Reusable country milestone trigger uses root inside a nested market iterator
  correction: Use prev inside nested iterators so the target remains the currently checked country when the trigger is called
    from situation->every_country.
  category: scope
  scope: country
  source: reference_game_files/game/in_game/events/diplomacy/overextension.txt:167-168; reference_game_files/game/in_game/events/economy/trade.txt:129
  notes: GUI ShowTriggerConditions(PlayerScope.Self) can pass because root is the player country, while the monthly situation
    checker calls the same trigger from a situation root. In any_market_with_merchants, prev points back to the iterated country.
- id: create_art_dynamic_event_missing_type_key
  pattern: ''
  only_in_paths:
  - events
  - scripted_effects
  bad: Event-created artwork uses create_art with only artist/quality and no explicit type/key, expecting a reliable tooltip
    and artwork name
  correction: For event-created named artworks, provide an explicit work_of_art_type and key with matching main_menu localization.
    If the type depends on the artist, branch with visible if/else_if create_art blocks so the real effect tooltip renders.
  category: script
  scope: location
  source: reference_game_files/game/in_game/events/culture/cultural_event.txt:406-411; src/in_game/events/tv_arts_exhibition_events.txt:1302-1428
  notes: tv_arts_exhibition.406 created a work in the capital but the option tooltip was empty and the resulting artwork had
    no name. Vanilla named artworks pair create_art with both type = work_of_art_type:<type> and key = <loc_key>. Visible
    if/else_if branches can render the real create_art tooltip while still selecting the appropriate art type by artist_type.
- id: create_io_inner_effects_must_be_hidden
  pattern: ''
  bad: add_country_to_international_organization = prev or set_leader_country = prev placed as direct (visible) children of
    create_international_organization = { ... }
  correction: 'Wrap add_country_to_international_organization and set_leader_country inside hidden_effect = { } within the
    create_international_organization block: create_international_organization = { type = ... hidden_effect = { add_country_to_international_organization
    = prev  set_leader_country = prev } }'
  category: script
  scope: any
  source: reference_game_files/game/in_game/events/situations/red_turban_rebellions.txt:379-386
  notes: The vanilla tooltip strings THIRD_ADD_TO_INTERNATIONAL_ORGANIZATION_EFFECT and SET_LEADER_EFFECT use INTERNATIONAL_ORGANIZATION.GetName
    / .GetLeaderTitle. When these effects are visible children of create_international_organization, the engine evaluates
    the tooltip before the IO is fully instantiated, causing 'Promote INTERNATIONAL_ORGANIZATION returned nullptr' errors.
    Wrapping in hidden_effect suppresses tooltip generation and eliminates the errors. The outer create_international_organization
    tooltip (CREATE_INTERNATIONAL_ORGANIZATION_EFFECT) still shows correctly.
- id: custom_build_action_without_explicit_cap
  pattern: ''
  only_in_paths:
  - generic_actions
  - scripted_effects
  bad: Custom generic-action building buttons rely only on can_build_building and do not repeat the building max-level / in-construction
    cap check
  correction: Add an explicit trigger shared by the action allow, select_trigger visible/enabled, and final effect guard.
    For per-country building caps, use total_building_levels_including_construction:<building> so queued levels count. For
    one-per-location selectors, also filter existing buildings and any_buildings_in_location with building_levels_under_construction
    >= 1.
  category: script
  scope: building
  source: reference_game_files/game/in_game/common/building_types/capital_buildings.txt:615-617; reference_game_files/game/in_game/common/missions/generic_traditional_economy_mission_pack.txt:173-176;
    fixed in src/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt
  notes: Building max_levels can stop normal construction but a custom IO/generic-action button can still spend its scripted
    price unless its action and effect repeat the cap logic. Re-check inside the effect because generic action UI pre-evaluation
    and stale target lists can otherwise charge the player for a no-op.
- id: custom_description_collapses_multi_condition_tooltip
  pattern: ''
  bad: custom_description { text = KEY  has_variable = X  var:X >= N  has_variable = Y  var:Y >= M } — multiple independent
    conditions collapsed into one block
  correction: Use one custom_tooltip block per condition group at the top level of the scripted_trigger body (implicit AND).
    The extra_trigger_block YAML field must be a complete custom_tooltip { } block, not raw condition lines.
  category: gui
  scope: scripted_triggers
  source: reference_game_files/game/in_game/common/scripted_triggers/building_triggers.txt:1-13
  notes: When multiple sub-conditions are collapsed into one custom_description or custom_tooltip, the player sees a single
    pass/fail indicator for all conditions combined. Separate custom_tooltip blocks each show their own pass/fail state, allowing
    the player to see which specific sub-condition is not yet met.
- id: custom_description_effect_needs_effect_loc
  pattern: ''
  validator: check_effect_loc_coverage
  detectability: lint
  only_in_paths:
  - scripted_effects
  - effect_localization
  bad: custom_description { text = MY_KEY } in common/scripted_effects where MY_KEY exists only in YAML or is absent from
    common/effect_localization
  correction: Register MY_KEY in src/in_game/common/effect_localization with the needed perspective mappings. The mapped localization
    keys still live in src/main_menu/localization.
  category: localization
  scope: any
  source: 'runtime error.log: common/scripted_effects/tv_academy_philosophy_debate_effects.txt:370-583, 2026-07-09; reference_game_files/game/in_game/common/effect_localization/scripted_effects.txt:597'
  notes: EU5 validates scripted-effect custom_description text keys against common/effect_localization at load. YAML-only
    keys produce 'No effect loc KEY' and PostValidate errors even when the display text exists.
- id: custom_description_needs_trigger_loc
  pattern: ''
  only_in_paths:
  - scripted_triggers
  bad: custom_description { text = MY_LOC_KEY } where MY_LOC_KEY exists only in a localization YAML but not in common/trigger_localization/
  correction: 'Create a trigger localization entry in src/in_game/common/trigger_localization/your_file.txt: MY_LOC_KEY =
    { global = MY_LOC_KEY }. The YAML key is still needed as the display text; the trigger_localization file is the bridge
    the engine uses at validation time.'
  category: localization
  scope: any
  source: reference_game_files/game/in_game/common/trigger_localization/_trigger_localization.info, reference_game_files/game/in_game/common/trigger_localization/scripted_triggers.txt:275
  notes: EU5 engine validates custom_description text keys against common/trigger_localization/ at load. A YAML-only key passes
    validate.py but produces 'PostValidate of trigger custom_description returned false' and 'No trigger loc KEY' at game
    startup.
- id: custom_goods_missing_modifier_type_family
  pattern: ''
  detectability: advisory
  only_in_paths:
  - goods
  bad: Defining a custom goods key without the matching auto-requested modifier type family
  correction: For every custom goods ID, add ban_exports_of_<good>, ban_imports_of_<good>, local_<good>_output_modifier, global_<good>_output_modifier,
    can_extract_<good>, <good>_impacts_inflation, <good>_used_for_minting, and global_<good>_pop_demand in main_menu/common/modifier_type_definitions,
    matching vanilla goods categories and boolean/percent flags.
  category: modifier
  scope: country
  source: 'reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:9391-9415; runtime error.log:
    modifier_type.cpp:1147'
  notes: EU5 automatically tries to use these modifier type names for every goods database entry. A custom goods key without
    the family logs 'Modifier type definition <name> must exist in DB'.
- id: custom_goods_reuses_vanilla_goods_color
  pattern: color\s*=\s*goods_(?!tv_)
  detectability: advisory
  only_in_paths:
  - goods
  bad: Defining a custom goods key with a vanilla goods color such as color = goods_masonry
  correction: Create a unique named color for the custom good in main_menu/common/named_colors, then reference it from the
    goods definition, e.g. color = goods_tv_wonder_materials.
  category: script
  scope: any
  source: 'runtime error.log: utility.h:242'
  notes: EU5 logs 'Goods <custom_good> has same color as <vanilla_good>' when two goods resolve to the same named color/value.
    Custom goods should have their own goods_<id> color key.
- id: custom_localization_call_needs_typed_scope_link_not_bare_root
  pattern: \[ROOT\.Custom\(
  detectability: lint
  bad: 'Calling a Customizable Localization block directly off a bare `ROOT` in event/effect loc text: `[ROOT.Custom(''some_block'')]`.'
  correction: '`docs/technical/EU5_Modding_Knowledge_Base.md`''s own documented Customizable Localization example already
    shows the correct form: `[ROOT.GetCountry.Custom(''ruler_residence'')]` — `Custom` must be chained off a properly-typed
    scope link (`GetCountry`, `GetCharacter`, etc. matching the block''s own `type = country`/`character`/...), not directly
    off the bare `ROOT` keyword, even in an already-country-scoped event/effect. The engine cannot resolve `Custom` as a function
    on the untyped root object: `pdx_data_factory.cpp: Could not find data system function ''Custom'' in ''ROOT.Custom(...)''`,
    followed by `pdx_data_localize.cpp: Data error in loc string ''<key>''`. Insert the matching `Get<Type>` link between
    `ROOT` and `.Custom(...)`.'
  category: localization
  scope: any
  source: docs/technical/EU5_Modding_Knowledge_Base.md Customizable Localization Syntax and Usage; scripts_engineering_department/main_menu/localization/english/gen_tv_wonder_ceremony_l_english.py;
    scripts/philosophy_debate_codegen.py tooltip_change_text; docs/error_log/error.log pdx_data_factory.cpp:1424, pdx_data_localize.cpp:158,
    2026-07-15
  notes: '2026-07-15: user reported the Unique Wonder Ceremony''s 8-stage pay/decline option text (tv_wonder_ceremony_events.txt,
    event tv_engineering_department.9300+ options .a/.b) errored on every stage; error.log confirmed ''Could not find data
    system function Custom in ROOT.Custom(...)''. The KB section this exact pattern was designed from (see risk_cards/wonders.md
    rule 26, added when the 8-stage ceremony''s per-wonder pay/decline text was migrated to Customizable Localization) already
    documents the correct `ROOT.GetCountry.Custom(...)` form via its own worked example — the ceremony generator (gen_tv_wonder_ceremony_l_english.py/gen_tv_wonder_ceremony_l_simp_chinese.py)
    simply didn''t chain the `.GetCountry` link when it was written. Grepping the whole repo for the same bare `[ROOT.Custom(`
    pattern found the identical bug already latent (never yet triggered in this playthrough) in scripts/philosophy_debate_codegen.py''s
    tooltip_change_text, feeding the Academy Philosophy Debate''s seated/vacated custom_description text (tv_academy_debate_group_seated_text
    and 7 sibling keys in tv_academy_philosophy_debate_l_english.yml/_simp_chinese.yml) — fixed both generators and regenerated
    all four affected localization files. Promoted to detectability: lint since the bare-ROOT pattern is a simple, unambiguous
    regex with no legitimate use (Custom always requires a typed link).'
- id: custom_modifier_type_missing_modifier_icon
  pattern: ''
  detectability: lint
  validator: check_modifier_type_definition_loc_and_icon_coverage
  only_in_paths:
  - modifier_type_definitions
  bad: Defining a custom modifier type without a matching common/modifier_icons entry
  correction: For every mod-defined modifier type, add a same-key entry in main_menu/common/modifier_icons with at least positive
    = "gfx/interface/icons/modifier_types/<vanilla_or_custom_icon>.dds". Reuse a close vanilla icon when no custom asset is
    needed.
  category: modifier
  scope: any
  source: 'reference_game_files/game/main_menu/common/modifier_icons/00_modifier_icons.txt:7; runtime error.log: modifier_type.cpp:1248/1294'
  notes: 'EU5 loads modifier icon mappings separately from modifier_type_definitions. A valid custom modifier type can still
    log ''Missing Icon for Modifier : <name>'' at startup until common/modifier_icons maps the key to a DDS. 2026-08-02: upgraded
    from advisory to lint after scripts/validate.py''s check_modifier_type_definition_loc_and_icon_coverage was added (WARNING
    severity, since a missing icon does not block loading, unlike missing MODIFIER_TYPE_NAME/DESC localization which is an
    ERROR in the same check) — see missing_localization_for_new_modifier_price_auto_modifier_definitions.'
- id: custom_tooltip_do_not_remove
  pattern: ''
  bad: Removing custom_tooltip from event options (wrong fix for dotted key confusion)
  correction: Keep custom_tooltip; verify key format via Step 2/3 — dotted suffix IS valid in event options
  category: gui
  scope: any
  source: reference_game_files/game/in_game/common/character_interactions/ali_qushji_settles.txt
  notes: AI wrongly removed custom_tooltip thinking dotted key format was invalid. Never remove; only verify format.
- id: custom_tooltip_unguarded_comparison_corrupts_later_effect_tooltip_in_same_pass
  pattern: ''
  detectability: advisory
  bad: A raw comparison against a conditionally-set variable (e.g. `var:tv_wonder_level > var:tv_wonder_project_base_level`
    where the RHS is only ever `set_variable`'d under one specific branch) inside a `custom_tooltip` block, when that trigger
    is also used as an effect's own `if.limit` (not just a generic_action's `allow`).
  correction: 'Follow the Milestone Trigger Tooltip Pattern already documented in CLAUDE.md: guard every raw variable comparison
    inside a `custom_tooltip` with `has_variable = X` in the same AND block before comparing `var:X`, exactly like the sibling
    branch in the same trigger already did (`var:tv_wonder_level ?= { this >= 1 }` is the safe form; the broken branch instead
    used a bare `var:tv_wonder_level > var:tv_wonder_project_base_level`). This is not just cosmetic: when the same trigger
    is reused as an effect''s `if.limit` (not only a generic_action''s `allow`), the tooltip-preview pass that renders the
    button''s effect chain walks the whole body in order — if it errors out evaluating this `limit`''s custom_tooltip mid-pass,
    it can corrupt or blank rendering for a completely unrelated LATER effect in the same preview (observed: `destroy_building_forcefully
    = "building(building_type:tv_wonder_labor_camp|scope:tv_wonder_labor_camp_owner)"`, several lines further down in the
    same `if` body, showed a garbled/placeholder building name instead of the Labor Camp). Fix the root unguarded comparison
    rather than chasing the seemingly unrelated downstream symptom.'
  category: gui
  scope: any
  source: src_engineering_department/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt tv_wonder_can_finish_construction_trigger;
    src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt tv_wonder_finish_construction_effect/tv_wonder_destroy_labor_camp_effect;
    CLAUDE.md Milestone Trigger Tooltip Pattern
  notes: '2026-07-15: user reported the ''must have increased at least one level since starting/resuming construction'' gate
    on the Finish Construction button was both ineffective and caused continuous pre-evaluation error spam while sitting in
    the construction stage, plus the button''s own effect tooltip showed a corrupted ''X will be destroyed'' line implying
    a missing building reference. Root cause: tv_wonder_project_base_level is only set via tv_wonder_select_construction_site_effect
    when var:tv_wonder_project_mode ?= 2 at site-selection time, so for any wonder not in that specific resume/upgrade mode
    the variable never exists at all, yet the trigger''s first AND-branch compared against it unconditionally. Fixed by adding
    `has_variable = tv_wonder_project_base_level` to that branch, matching the safe idiom the trigger''s own second branch
    already used one line below. The elsewhere-unguarded twin `var:tv_wonder_level > var:tv_wonder_project_base_level` inside
    tv_wonder_set_current_project_priority_candidate_mode_effect (same file, ~line 2164) was left alone: it is a plain effect
    `if.limit`, not a custom_tooltip, so ordinary AND short-circuiting protects it at runtime and no player-facing tooltip
    walks it.'
- id: customizable_localization_duplicate_key_ignored
  pattern: ''
  only_in_paths:
  - customizable_localization
  bad: Defining a second character_title_prefix block in a separate customizable_localization file
  correction: Copy/generate the full vanilla character_title.txt and insert custom title text entries into the original character_title_prefix
    block.
  category: localization
  scope: character
  source: 'reference_game_files/game/in_game/common/customizable_localization/character_title.txt:1; runtime debug.log: ''Duplicated
    key character_title_prefix will not be created'''
  notes: Top-level customizable localization keys are unique database entries, not additive merge blocks. A duplicate block
    is ignored, so custom character title prefixes never load.
- id: database_operation_priority_ignored
  pattern: null
  bad: Using a later filename, a zz_ prefix, or a lower playlist position as a universal way to make any INJECT/REPLACE database
    edit win
  correction: Separate exact-path file overwrites from database object edits. For object edits, compare operation type first
    (INJECT_OR_CREATE -> REPLACE_OR_CREATE -> TRY_INJECT -> TRY_REPLACE -> INJECT -> REPLACE), then use filename order only
    when the operation types are identical.
  category: compatibility
  scope: top-level database object
  source: User-provided EU5 compatibility mechanics note (2026-07-21); docs/technical/EU5_Multi_Mod_Compatibility.md
  notes: 'Documentation-only (no regex lint). Database entries are batched by operation type before filename ordering. Exact-path
    collisions use a separate whole-file rule: mod over base/DLC, then the lower mod in the playlist. INJECT is top-level
    append rather than nested deep merge, and scripted effects/triggers treat INJECT like replacement.'
- id: deferred_reward_via_trigger_event_silently_invisible_to_tooltip_preview
  pattern: ''
  detectability: advisory
  bad: Deferring an option/button effect's reward to a `trigger_event_silently = { id = X days = N }` call, when the deferred
    event's `immediate` effect is not otherwise proven too heavy/unsafe to run inline, purely to 'match the async pattern
    used elsewhere.'
  correction: 'EU5''s generic_action/event-option tooltip pre-evaluation only walks the option''s own `effect =` body — it
    does not follow a `trigger_event_silently`/`trigger_event_non_silently` call into the target event''s `immediate` block.
    So any reward effect placed only inside that deferred event is executed correctly at runtime but never rendered in the
    button''s tooltip preview. The Unique Wonder Ceremony''s shared 8-stage framework (docs/knowledge/risk_cards/wonders.md
    rule 20) had this exact asymmetry: stages 2/4 called their reward dispatch effects inline in `tv_wonder_ceremony_advance_to_stage_{2,4}_effect`,
    rendering both cost and reward in the tooltip, while stage 8 only scheduled a hidden completion event (`tv_engineering_department.9308`)
    whose `immediate` contained the real payoff — so stage 8''s button showed only the cost. Before accepting a deferral like
    this as necessary (per rule 9/31''s guidance for genuinely heavy/unsafe chains — `destroy_building`, `create_international_organization`,
    character-title promotion, or other operations documented to break tooltip preview), verify the deferred effect body actually
    contains one of those unsafe operations or a proven pre-evaluation error. In this case it did not: the completion chain
    was `add_country_modifier` plus variable bookkeeping and one `every_international_organizations_member_of` read-only loop
    — lighter than stage 4''s own inline 66-branch `construct_building` switch, and the identical chain (`tv_wonder_complete_active_ritual_effect`)
    already ran inline from several `on_action` hidden_effects for every ritual in progress. Fixed by calling `tv_wonder_complete_active_ritual_effect`
    inline in stage 8''s advance effect (matching stages 2/4) and deleting the now-unnecessary hidden event and `COMPLETION_EVENT_ID`
    constant.'
  category: events
  scope: any
  source: scripts_engineering_department/in_game/common/scripted_effects/gen_tv_wonder_ceremony_effects.py append_advance_stage_effects;
    scripts_engineering_department/wonder_ceremony_lib.py; src_engineering_department/in_game/common/scripted_effects/tv_wonder_ceremony_effects.txt
    tv_wonder_ceremony_advance_to_stage_8_effect; docs/knowledge/risk_cards/wonders.md rule 20
  notes: '2026-07-16: user reported that in the 8-step Unique Wonder Ceremony (applies to 121 unique wonders), steps 2 and
    4''s options rendered both cost and reward in the tooltip, but step 8 only rendered cost. Traced to `append_advance_stage_effects()`
    in gen_tv_wonder_ceremony_effects.py: steps 2/4 call their reward effects inline, step 8 instead only called `trigger_event_silently
    = { id = tv_engineering_department.9308 days = 1 }`, whose immediate block held the real completion reward. When the user
    asked ''why is this heavy, isn''t it just applying a country modifier,'' traced the full completion chain (`tv_wonder_complete_active_ritual_effect`
