- id: makescope_loses_type_needed_for_custom_data_function
  pattern: MakeScope\.Custom\(
  detectability: lint
  only_in_paths:
  - .yml
  - .gui
  bad: Calling `.MakeScope.Custom('key')` in a GUI expression or localization value, e.g. `[InternationalOrganizationsView.GetPlayer.MakeScope.Custom('tv_academy_debate_current_node_line')]`.
  correction: '`.Custom(''key'')` (customizable_localization) requires a scope of the TYPE declared by that key''s `type =
    ...` (e.g. `type = country` requires a real Country-typed scope), but `.MakeScope` converts a typed scope into the generic
    `Scope` object used for `GetVariable`/`var:` access, which does not expose `Custom`. Call `.Custom(...)` directly on the
    typed scope before any `.MakeScope` conversion — e.g. `InternationalOrganizationsView.GetPlayer.Custom(''key'')`, not
    `InternationalOrganizationsView.GetPlayer.MakeScope.Custom(''key'')`. `GetVariable` and `Custom` want different scope
    representations of the same underlying object; do not chain them off the same `.MakeScope` call.'
  category: gui
  scope: any
  source: 'reference_game_files/game/in_game/common/customizable_localization/customizable_localization.info:25 (use: [<scope>.Custom(''<key>'')]);
    reference_game_files grep for `.Custom(` (always called directly on a Country/Character/Location-typed scope, e.g. `ROOT.GetCountry.Custom(...)`,
    `SCOPE.sCountry(''actor'').Custom(...)`, never on a `.MakeScope` result); src/in_game/common/customizable_localization/tv_academy_gui_text.txt
    (`tv_academy_debate_current_node_line`/`tv_academy_philosophy_current_name`, both `type = country`)'
  notes: 'Found 2026-07-13 from docs/error_log/error.log: ''Could not find data system function Custom in InternationalOrganizationsView.GetPlayer.MakeScope.Custom(...)''
    at tv_research_l_english.yml TV_ACADEMY_DEBATE_CURRENT_NODE_LINE and TV_ACADEMY_PHILOSOPHY_CURRENT_NAME. Fixed by dropping
    `.MakeScope` since `InternationalOrganizationsView.GetPlayer` already yields a Country-typed scope suitable for `.Custom(...)`
    directly.'
