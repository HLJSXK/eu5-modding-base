  scope: international_organization
  source: user-reported runtime behavior in Trade League monopoly metrics (2026-05-22); reference_game_files/game/in_game/events/economy/slave_trade.txt:43-48;
    reference_game_files/game/in_game/events/government/republic_factions.txt:148
  notes: produced_in_market:<good> and goods_demand_in_market(goods:<good>) are valid for weighting origin and consumer control
    and for choosing representative markets; traded_in_market and goods_supply_in_market are not route volume. Export/transit
    control uses market every_export trade_volume; consumer control uses market every_import trade_volume.
- id: trade_route_all_goods_per_good_expansion
  pattern: ''
  detectability: advisory
  bad: Generating one market every_export/every_import route scan per good when the mechanic needs all goods from matching
    routes
  correction: Scan each route once, save the route good with `traded_goods = { save_scope_as = ... }`, and use that goods
    scope as a variable_map key or list item. Keep per-good static branches only for effects that require a static database
    id, such as `add_temporary_demand type = demand:*`.
  category: performance
  scope: international_organization
  source: reference_game_files/game/in_game/events/government/republic_factions.txt:164-191; Trade Chain refactor, 2026-06
  notes: Trade route scopes can expose the current good as a scope. The Trade Chain bargaining-demand accumulator now stores
    demand by slot maps keyed by goods scope, while final temporary-demand application still dispatches to generated static
    demand ids because no dynamic `type = demand:<scope>` pattern is verified.
- id: trigger_event_invalid_in_scripted_effects
  pattern: \btrigger_event\s*=
  only_in_paths:
  - scripted_effects
  - on_action
  bad: trigger_event = { id = X } or trigger_event = X inside scripted_effects or on_action
  correction: Use trigger_event_non_silently = { id = X } for popup events shown to the player, or trigger_event_silently
    = X for background events. Both accept simple form (= event_id) and object form (= { id = X days = Y }).
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/scripted_effects/on_action_effects.txt:39, reference_game_files/game/in_game/common/on_action/character_death_pulses.txt:57
  notes: EU5 does not have a bare trigger_event effect. In scripted_effects and on_action files, the engine reports 'Unknown
    effect trigger_event'. The two valid variants are trigger_event_non_silently (shows popup) and trigger_event_silently
    (hidden/background). This distinction does not apply inside event option = { } blocks, which may use a different syntax.
- id: trigger_loc_missing_first_perspective
  pattern: ''
  only_in_paths:
  - trigger_localization
  bad: MY_KEY = { global = MY_KEY } when the trigger using MY_KEY has custom_tooltip nested inside custom_description
  correction: 'Declare all four perspectives: MY_KEY = { none = MY_KEY  global = MY_KEY  first = MY_KEY  third = MY_KEY }.
    Use this form for every trigger_localization entry as a safe default.'
  category: localization
  scope: any
  source: reference_game_files/game/in_game/common/trigger_localization/scripted_triggers.txt (ironman block)
  notes: 'EU5 engine requires the ''first'' perspective when custom_description wraps a nested custom_tooltip. A global-only
    entry causes ''(BUG: KEY missing perspective. Could not find parameters for PROMOUN first Negative required false)'' at
    runtime. Adding all four perspectives is zero-cost and prevents this for any trigger regardless of nesting.'
- id: try_replace_only_needed_for_existing_modifier_name_override
  pattern: ''
  detectability: advisory
  bad: Assuming every new location-scoped static modifier definition must be prefixed `TRY_REPLACE:`, per CLAUDE.md's/Towards_Victory_Design.md's
    general wording about location-scoped statics.
  correction: '`TRY_REPLACE:<name> = { ... }` is a merge-conflict-resolution prefix used specifically to override an ALREADY-EXISTING
    modifier name (vanilla or another mod''s) — confirmed against reference-mod usage (e.g. `TRY_REPLACE:province_starving`,
    a real vanilla modifier id). A brand-new `tv_`-namespaced modifier name has no such collision and needs no wrapper — every
    existing wonder-domain location-modifier generator in this codebase (e.g. gen_tv_engineering_department_wonder_ritual_auxiliary_location_modifiers.py,
    gen_tv_wonder_ceremony_cost_local_modifiers.py) already omits `TRY_REPLACE` and works correctly. Only reach for `TRY_REPLACE`
    when the name you are defining already exists elsewhere.'
  category: modifier
  scope: location
  source: reference_mods/3613232232/main_menu/common/static_modifiers/pp_location_modifier_adjustments.txt (TRY_REPLACE:province_starving
    override example); scripts/main_menu/common/static_modifiers/gen_tv_engineering_department_wonder_ritual_auxiliary_location_modifiers.py
    (no TRY_REPLACE, brand-new tv_ names, works); scripts/main_menu/common/static_modifiers/gen_tv_wonder_ceremony_cost_local_modifiers.py
  notes: Found 2026-07 while adding the Unique Wonder Ceremony's location-scoped temporary cost modifiers. CLAUDE.md's 'Critical
    EU5 Gotchas' section and docs/design/Towards_Victory_Design.md both state TRY_REPLACE as a blanket rule for location-scoped
    static modifiers, which overstates the actual, narrower requirement — flagged for a future wording pass rather than silently
    worked around. See docs/knowledge/risk_cards/wonders.md rule 26.
- id: unquoted_paren_event_target_link_as_script_value
  pattern: ''
  detectability: advisory
  only_in_paths:
  - common
  bad: Writing `value = leader_country.estate_power(estate_type:crown_estate)` (or any other parenthesis-argument event target
    link, e.g. `estate_power(...)`, chained after a scope and used directly as the RHS of `value =`, a comparison, `add =`,
    `subtract =`, etc.) without wrapping the whole scope+call expression in double quotes
  correction: 'Wrap the entire chained expression in double quotes: `value = "leader_country.estate_power(estate_type:crown_estate)"`.
    Every vanilla usage of a function-call-style event target link (estate_power(...), estate(...), etc.) used as a script
    value or trigger operand is quoted, e.g. reference_game_files/game/in_game/common/disasters/coup_attempt.txt:13 `power
    > "root.estate_power(estate_type:crown_estate)"` and reference_game_files/game/in_game/common/attribute_columns/57_parliament_issues.txt:40
    `value = "scope:actor.estate_power(root.estate_type)"`.'
  category: event
  scope: country
  source: scripts/philosophy_debate_codegen.py emit_crown_contribution_add/emit_group_static_formula (tv_academy_of_sciences.txt
    monthly_change blocks, fixed 2026-07-11); reference_game_files disasters/coup_attempt.txt:13, court_and_country.txt:57,
    attribute_columns/57_parliament_issues.txt:40
  notes: 'Runtime symptom is a cluster of 3 errors per occurrence: jomini_eventtarget.cpp ''No data specified for an event
    target link that requires data. Link estate_power'', jomini_scriptvalue.h ''Cannot read [leader_country.estate_power]
    as a script value'', and pdx_persistent_reader.cpp ''Unexpected token: ('' immediately followed by ''Unexpected token:
    )'' and ''Unexpected token: ='' on the next two lines -- the parser splits on the bare `(` because unquoted script-value
    RHS syntax does not support inline function-call arguments; quoting makes the whole expression parse as one compound math-value
    string instead. Found across 47 identical occurrences in a single generated file (tv_academy_of_sciences.txt), all from
    the same 3 codegen template lines.'
- id: utf8_bom_mandatory_on_common_scripts
  pattern: ''
  bad: Saving common/ scripts (static_modifiers, situations, scripted_effects, on_action, etc.) as plain UTF-8 without a byte-order
    mark
  correction: 'Save with UTF-8 BOM (first 3 bytes EF BB BF). In Python: write_bytes(b''\xef\xbb\xbf'' + text.encode(''utf-8''))
    or open(..., encoding=''utf-8-sig''). Verify with `head -c 3 <file> | xxd` -> expect ef bb bf.'
  category: encoding
  scope: any
  source: 'EU5 engine warning (lexer.cpp:501: ''File X should be in utf8-bom encoding (will try to use it anyways)'')'
  notes: Engine retries without BOM but emits a warning per file per load. Localization YAMLs already require BOM; this rule
    extends the same requirement to common/ .txt scripts. Auto-generated files via scripts/gen_scaffold.py should always emit
    the BOM.
- id: v1_3_cost_modifier_renamed_to_efficiency
  pattern: \b(global_build_buildings_cost|global_foreign_build_buildings_cost|global_fort_build_buildings_cost|global_port_build_buildings_cost|global_urban_build_buildings_cost|global_rural_build_buildings_cost|local_build_buildings_cost|local_build_new_buildings_cost|local_fort_maintenance_cost|local_port_build_buildings_cost|fort_maintenance_cost|stability_cost|court_spending_cost_modifier|building_upkeep_costs|food_purchase_cost|army_reinforce_cost|navy_repair_cost|colonial_maintenance_cost|exploration_maintenance_cost|diplomatic_annexation_cost|hostile_diplomatic_annexation_cost|diplomatic_upkeep_modifier|foreign_export_from_market_cost_modifier|global_trade_through_owned_territory_cost_modifier|local_trade_embark_disembark_cost_modifier|global_bureaucracy_implementation_cost_modifier|global_bureaucracy_removal_cost_modifier|global_bureaucracy_maintenance_cost_modifier|hire_for_cabinet_cost_modifier)\b
  detectability: lint
  bad: Using a v1.2-era `_cost`/`_cost_modifier` static modifier name (e.g. `global_build_buildings_cost`, `stability_cost`,
    `court_spending_cost_modifier`, `global_bureaucracy_maintenance_cost_modifier`) — these were renamed to `_efficiency`
    in EU5 v1.3.
  correction: 'Rename to the v1.3 `_efficiency` identifier (see reference_game_files/game/main_menu/common/static_modifiers/00_modifier_types.txt)
    and negate the value: `color=bad->good` flips at the same time, so a value that reduced cost (e.g. -0.10) becomes a positive
    efficiency value (e.g. 0.10). Exception: `stability_cost` -> `stability_cost_efficiency` and `court_spending_cost_modifier`
    -> `court_spending_efficiency` (name doesn''t just gain the suffix). Confirmed exact `x-1` negation via matched vanilla
    `inflation_impact`/`construction_wages` country_modifier blocks; for fields without a matched-block confirmation, this
    project''s convention (see reverted scripts/archive/revert_1_3_modifier_efficiency_to_1_2_cost.ps1) is a uniform x-1 sign
    flip, treated as a placeholder pending a real balance pass.'
  category: modifier
  scope: any
  source: git diff <pre-v1.3 commit>^..c7978920 -- reference_game_files/game/main_menu/common/static_modifiers/00_modifier_types.txt
  notes: v1.3 renamed ~29 `_cost`-suffixed static modifiers to `_efficiency`. Also lost the `min=-0.95` floor clamp on the
    three `global_bureaucracy_*_cost_modifier` -> `_efficiency` fields. Discovered during the v1.3 migration pass (2026-07-10);
    ~114 usage sites found across hand-written src files and ~10 generator data YAMLs (victory_paths.yaml, trade_league_laws.yaml,
    govhouse_laws.yaml, arts_exhibition_laws.yaml, academy_laws.yaml, wonder_final_buildings.yaml, wonder_generic_rituals.yaml,
    unique_wonders.yaml). Unrelated to the separate v1.3 building_type.cpp validator capping local_manpower/employment_size
    <= 0.0125 (undocumented, not a rename).
- id: v1_3_event_outcome_enum_good_bad_rejected
  pattern: \boutcome\s*=\s*(good|bad)\b
  detectability: lint
  bad: '`outcome = good` / `outcome = bad` at event top level (the `EAudioEventOutcome` audio-direction field)'
  correction: 'Use `outcome = positive` / `outcome = negative` (keep `outcome = neutral` unchanged). Confirmed valid enum
    set from `reference_game_files/game/in_game/events/readme.txt` line 72: `outcome = positive/neutral/negative`, identical
    in both the pre-v1.3 and v1.3 reference commits — v1.3 only made the `pdx_persistent_reader.cpp` enum parser strict about
    rejecting values outside that set (error.log: `Failed to read enum! Type: "EAudioEventOutcome", Val "bad"/"good"`).'
  category: event
  scope: any
  source: reference_game_files/game/in_game/events/readme.txt:72
  notes: Found 2026-07-10 in error.log across ~841 sites in 17 TV event files after the v1.3 reference bump. Most sources
    were generator Python (hardcoded strings or dict literals in gen_tv_wonder_finalization_events.py, gen_tv_wonder_ownership_events.py,
    wonder_construction_event_lib.py's KIND_OUTCOMES, philosophy_debate_codegen.py's event_specs/notification_specs, and scripts_engineering_department/unique_wonder_ritual_content/*.py)
    or data/research_d_events.yaml, plus 6 hand-written event files with no generator (tv_academy_of_sciences_events.txt,
    tv_engineering_department_events.txt, tv_arts_exhibition_events.txt, tv_govhouse_events.txt, tv_medicine_events.txt, tv_research_events.txt).
    Fix at the generator/data source, never the generated .txt, then regenerate.
- id: validator_modifier_check_ignores_nested_scales_with_operators
  pattern: ''
  detectability: lint
  validator: check_modifier_names
  bad: scripts/validate.py's check_modifier_names treated every top-level-looking `word = number` line as a modifier-name
    assertion, including script_value operator keywords (value/add/subtract/multiply/divide/min/max/...) nested inside an
    auto_modifiers/static_modifiers entry's `scales_with = { ... }` or `limit = { ... }` sub-block.
  correction: check_modifier_names now tracks a per-line brace-depth stack and only applies the modifier-name whitelist check
    to lines outside any `scales_with`/`limit` nested block. (A separate attempt to also auto-whitelist every `common/prices/*.txt`
    entry's `<name>_cost_modifier` was reverted — that tag is NOT engine-auto-derived, it requires its own explicit `modifier_type_definitions`
    entry like any other custom modifier, so auto-whitelisting it would have hidden real missing-registration bugs from validate.py
    instead of catching them. See price_gold_field_rejects_dynamic_scriptvalue.)
  category: workflow
  scope: any
  source: scripts/validate.py check_modifier_names; fixed alongside price_gold_field_rejects_dynamic_scriptvalue, 2026-08-02
  notes: 'Discovered while fixing the direct-build price bug: a correct, vanilla-proven scales_with block (`scales_with =
    { value = global_var:X multiply = 1000 divide = 10000 subtract = 1 }`) plus a legitimate `tv_wonder_direct_build_small_price_cost_modifier
    = 1` line both false-positived as unknown modifiers. Verified the fix against the full repo (`scripts/validate.py --ai-report`,
    no --changed filter): 288 files checked, 0 errors, 0 warnings — no other auto_modifiers/static_modifiers file relied on
    the old (incorrect) flat-line behavior.'
- id: value_expression_clamp_direction_reversed
  pattern: value\s*=\s*\{[^\n}]*\bmax\s*=\s*0(?:\s|\})
  bad: Using max = 0 when a value expression must be clamped to a nonnegative lower bound
  correction: Use min = 0 for a lower bound and max = <positive limit> for an upper bound; verify both sides when writing
    a bounded value expression.
  category: scope
  scope: any
  source: reference_game_files/game/in_game/common/auto_modifiers/country.txt:330-335
  notes: EU5 value expressions apply min as the lower clamp and max as the upper clamp. Reversing them can silently zero positive
    solver factors; the SOL exact-derived minimax candidate exposed this at runtime on 2026-08-08.
- id: vanilla_event_override_uses_replace_or_late_file
  pattern: ''
  detectability: advisory
  bad: 'Using REPLACE: or INJECT: for an individual vanilla event, or copying that event into a mod event file which loads
    after its base-game source file'
  correction: Create a new event file whose filename sorts before the relevant base file (for example 0000_modded_events.txt),
    repeat the vanilla namespace, and copy only each modified event under its bare ID. Preserve the complete event block.
    If it calls a helper defined in the base event file, inline that helper's contents in the event or copy the helper under
    a new mod-specific name. The resulting duplicate-event-ID log entry is expected and harmless.
  category: event
  scope: any
  source: User-provided 'Modifying base game events' guide, 2026-07-28
  notes: 'The event manager applies the earlier duplicate definition; event-specific REPLACE: and INJECT: are not a valid
    replacement mechanism.'
- id: var_comparison_unset_crash
  detectability: needs_parser
  pattern: ''
  bad: limit = { var:some_var >= var:other_var } when some_var may not be set on the scope
  correction: 'Add has_variable = some_var to the limit block before the var: comparison: limit = { has_variable = some_var  var:some_var
    >= var:other_var }'
  category: script
  scope: any
  source: 'error.log: ''Failed to fetch variable for tv_science_progress_pct due to not being set'', towards_victory_leaderboard.txt:47'
  notes: EU5 does NOT default unset variables to 0 in trigger comparisons; var:X on the left side of >= throws a script error
    and aborts the if-block. set_variable = { value = var:X } with an unset var appears to be silent (no error), so only limit
    comparisons need the has_variable guard.
- id: var_optional_scope_silent_fail_nested_random_list
  pattern: ''
  bad: var:X ?= { trigger_event_non_silently = ... } or var:X ?= { change_variable = ... } inside a random_list weight branch
    that is itself inside another random_list or every_character
  correction: 'Navigate to the scope ONCE before the random_list using save_scope_as: var:tv_exhibition_home_country ?= {
    save_scope_as = touring_home }. Then use scope:touring_home = { ... } inside every branch. Guard the outer random_list
    with if = { limit = { exists = scope:touring_home } }.'
  category: scope
  scope: any
  source: src/in_game/common/on_action/towards_victory_leaderboard.txt (Block C rewrite)
  notes: 'var:X ?= {} is the optional-navigation operator: it silently skips the block if the variable is unset or the target
    doesn''t exist. Inside deeply nested random_list branches (every_character → random_list { 8 = { random_list { weight
    = { ... } } } }) the optional scope switch silently fails — no engine error is logged, the block is skipped, and no event
    fires. Pre-saving the target as a named scope before the random_list and using scope:name = {} inside branches is the
    reliable pattern.'
- id: var_read_without_outer_scope_guard
  detectability: needs_parser
  pattern: has_variable\s*=\s*(\w+)[\s\S]{0,300}var:\1\s*=
  only_in_paths:
  - generic_actions
  bad: scope:actor = { has_variable = X } followed by scope:actor = { var:X = { ... } } in a generic action allow/custom_tooltip/trigger,
    expecting has_variable to suppress the var:X read
  correction: 'Use the optional variable link for variable-dependent reads: var:X ?= { ... }, var:X ?= 1, or var:X ?= { this
    >= N }. For generic actions, move a prerequisite to potential only when the action should disappear entirely. Do not rely
    on has_variable, custom_tooltip order, or separate sibling scope blocks to prevent a direct var:X read.'
  category: scope
  scope: any
  source: 'Runtime: docs/error_log/error.log (tv_govhouse_actions.txt:57); vanilla optional variable links: reference_game_files/game/in_game/common/generic_actions/autocephalous_patriarchates.txt:214
    and reference_game_files/game/in_game/events/religion/buddhism_events.txt:1541'
  notes: EU5 generic action UI evaluation may fetch every trigger line needed for tooltips, including sibling scope blocks
    inside allow. A direct var:X = { ... } fetches X before the logical result of has_variable can protect it, producing 'Failed
    to fetch variable' and 'Event target link var returned an unset scope'. Optional ?= returns false when the variable/scope
    is absent and avoids the error.
- id: variable_list_remove_wrong_effect
  pattern: remove_from_variable_list\s*=
  bad: remove_from_variable_list = { name = X target = Y } for persistent variable lists
  correction: 'remove_list_variable = { name = X target = Y } to remove a specific entry. add_to_variable_list = { name =
    X target = Y } is still correct for adding. Temporary lists (add_to_list) use a different API: every_in_list = { list
    = X } and remove_from_list = X.'
  category: script
  scope: any
  source: src/in_game/common/scripted_effects/tv_govhouse_effects.txt
  notes: EU5 uses remove_list_variable (not remove_from_variable_list) to remove a scope reference from a persistent variable
    list. Confirmed by govhouse implementation.
- id: variable_list_wrong_iteration_syntax
  pattern: every_in_variable_list|remove_from_variable_list
  bad: every_in_variable_list = { name = X ... } or remove_from_variable_list = { name = X target = Y } for persistent variable
    lists
  correction: 'every_in_list = { variable = X ... } to iterate; remove_list_variable = { name = X target = Y } to remove a
    specific entry. add_to_variable_list = { name = X target = Y } is still correct for adding. Temporary lists (add_to_list)
    use a different API: every_in_list = { list = X } and remove_from_list = X.'
  category: script
  scope: any
  source: reference_game_files/game/in_game/events/culture/culture_greek.txt:452 (every_in_list variable =), reference_game_files/game/in_game/common/on_action/character_death_pulses.txt:37
    (remove_list_variable)
  notes: 'EU5 has two distinct list types: (1) Temporary lists created with add_to_list — iterated with every_in_list { list
    = X }, removed with remove_from_list = X. (2) Persistent variable lists created with add_to_variable_list — iterated with
    every_in_list { variable = X }, removed with remove_list_variable { name = X target = Y }. every_in_variable_list and
    remove_from_variable_list do not exist in EU5; the engine reports ''Unknown effect'' for both.'
- id: variable_map_callback_root_in_generic_action
  pattern: ''
  detectability: needs_parser
  bad: Using root inside a variable-map key callback called from a generic-action effect to write back to the action actor/current
    country
  correction: Save the current owner scope before random_key_in_variable_map/every_key_in_variable_map, then write back through
    scope:<saved_owner>; preserve the variable-map key stream instead of replacing it with generated per-id branches.
  category: scope
  scope: variable_map
  source: Runtime error.log from Engineering Department Great Engineer select-trigger tooltip pre-evaluation, 2026-06-04
  notes: Generic action selector hover can pre-evaluate action effects without a usable root event target. A proposal deck
    helper using random_key_in_variable_map -> root = { set_variable = { value = prev } } logged Event target link 'root'
    returned an unset scope and left no proposal slots.
- id: variable_map_key_iterator_scope_used_for_map_read
  pattern: ''
  detectability: needs_parser
  bad: Calling is_key_in_variable_map on the current every_key_in_variable_map/ordered_key_in_variable_map callback scope,
    especially with target = this
  correction: Save the map-owning scope before the key iterator, copy this into a local variable, and run is_key_in_variable_map
    inside scope:<saved_owner> with target = local_var:<key>.
  category: scope
  scope: variable_map
  source: 'Runtime error.log: common/scripted_effects/tv_wonder_module_effects.txt:3364 via tv_wonder_bribe_proposal generic
    action, 2026-06-10'
  notes: In a key iterator callback the current scope may be the numeric key itself (for example 1.00), which does not support
