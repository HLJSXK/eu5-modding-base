- id: io_custom_tab_scrollarea_autosize_wrapper_misaligns
  pattern: ''
  bad: Wrapping an organization_custom_content scrollarea in a child vbox and relying on autoresizescrollarea for dynamic
    overflow
  correction: Inject the scrollarea directly into organization_custom_content so it becomes a child of the vanilla inner vbox.
    Override margin_top/spacing on the block. Use a fixed viewport such as size = { 100% 430 } for bounded panels, or set
    the block layoutpolicy_vertical = expanding and the scrollarea using = layoutpolicy_expanding when the tab must claim
    the full IO pane from the common trailing expand spacer. Keep scrollwidget content with a natural/fixed vertical height
    (for example layoutpolicy_vertical = fixed plus ignoreinvisible = yes). Avoid autoresizescrollarea for tabs whose content
    can grow after state changes, because it can resize the viewport to the content and leave no useful overflow to scroll.
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/organization/common.gui:558-567; reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:209-214;
    reference_game_files/game/main_menu/gui/shared/main_menu_lists.gui:258-263; runtime playtest of tv_arts_exhibition
  notes: The vanilla custom content slot is already an inner vbox with margin_top = 5 followed by an expand spacer, and vanilla
    middle_kingdom injects children/properties directly into organization_custom_content. Adding another child vbox can make
    UI bounds look correct for the wrapper while the scrollarea sits lower inside it. A direct fixed viewport prevents autosize
    growth, but a full-pane custom tab also needs the injected block and scrollarea to be vertically expanding so the common
    trailing expand does not own the lower area. autoresizescrollarea is useful for dropdown-like natural-height widgets,
    but in this IO tab it grew with active exhibition content, removed overflow, and made the scrollarea stop scrolling.
- id: io_has_leader_invalid_gui_function
  pattern: InternationalOrganization\.HasLeader|GetInternationalOrganization\.HasLeader
  bad: visible = "[InternationalOrganizationsView.GetInternationalOrganization.HasLeader]" — HasLeader does not exist on InternationalOrganization
