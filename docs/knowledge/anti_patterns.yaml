- id: gui_removed_global_input_instance_property
  pattern: (?m)^\s*use_global_input_instance\s*=
  bad: Keeping use_global_input_instance in an active EU5 1.4 GUI widget because an upstream Glorp snapshot still contains
    the legacy field
  correction: Remove use_global_input_instance from every active 1.4 GUI file. The input-action reimplementation removed this
    property; upstream reference files may retain it as stale compatibility code and must be audited before copying.
  category: gui
  scope: any
  source: 'reference_game_files/game/in_game/gui/diplomacydialogs.gui:167-168; reference_game_files/game/in_game/gui/single_unit_formation_window.gui:159-160;
    runtime error.log: pdx_gui_factory.cpp invalid widget/type/property'
  notes: The current Glorp UI snapshot still contains this property in glorpUI_shared_types.gui and other files. SOL's copied
