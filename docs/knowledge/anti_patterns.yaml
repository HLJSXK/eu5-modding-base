  correction: Keep the complete production-method definition, but rename each copied child to a unique `tv_`-prefixed ID (for
    example `university_maintenance` to `tv_university_maintenance`).
  category: building
  scope: any
  source: runtime error.log building_type.cpp:1075, 2026-07-28; reference_game_files/game/in_game/common/building_types/culture_buildings.txt:38-46
  notes: REPLACE swaps the building definition but does not replace a nested unique production method's global registration;
    retaining the vanilla child ID logs a duplicate-production-method error and prevents the override from loading cleanly.
- id: resolution_ai_will_select_instead_of_vote_fields
  pattern: null
