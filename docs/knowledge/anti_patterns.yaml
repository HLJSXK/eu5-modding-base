- id: gui_generator_function_missing_final_closing_brace_cascades_nesting
  pattern: ''
  detectability: advisory
  bad: A Python .gui generator function builds a repeated block (e.g. one card in a list of N cards) across many `lines.append(...)`
    calls and closes each inner sub-block (blockoverride, hbox, vbox) but omits the final closing brace for the outermost
    block the function opened, e.g. `append_card()` in gen_tv_wonder_ceremony_cards_gui.py opened `tv_engineering_department_card_common
    = {` but its last two appended lines only closed the inner `hbox` and `blockoverride "common_bottom_content"`, never the
    card instantiation itself.
  correction: Verify total `{`/`}` counts for one generated repeated unit balance to zero, or -- for a list of siblings meant
    to render at the same nesting depth -- confirm every repeated instantiation opens at a constant depth (not a strictly
    increasing one). Since .gui block scope is pure brace balance, a missing closing brace does not raise a Python error;
    it silently nests the next generated unit one level inside the previous one. With N repeated units each missing one closing
    brace, unit k ends up nested k-1 levels deep inside unit k-1, cascading every subsequent unit's content into the first
    unit's innermost still-open block (here, the base type's header hbox at tv_engineering_department.gui:59) instead of stacking
    as N independent siblings.
  category: gui
  scope: any
  source: scripts/in_game/gui/panels/organization/gen_tv_wonder_ceremony_cards_gui.py:224-227 (missing `lines.append(f"{T}}}")`
    after the blockoverride "common_bottom_content" close); src/in_game/gui/panels/organization/tv_engineering_department.gui:9421-10483
    (TV_WONDER_CEREMONY_CARDS, fixed 2026-07-12)
  notes: 'Reported by the user as the 8 ceremony stage cards rendering as ''horizontally arranged, extremely tall'' instead
    of vertically stacked wide cards. Confirmed by an awk brace-depth trace: each `tv_engineering_department_card_common =
    {` opened at depth 1, 2, 3, ... 8 instead of a constant depth 1, and total `{`/`}` count for one card span was 45/44 (imbalance
    of exactly 1). Every other layout property (fixed 462x144 size, shrinking-height wrapper chain, header collapse, hbox-per-card
    content) matched prior documented fixes and was not the cause -- the bug was purely a missing brace in the generator,
    invisible to plain-text reading unless brace counts are checked explicitly.'
