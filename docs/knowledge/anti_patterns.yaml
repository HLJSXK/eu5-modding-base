  category: gui
  scope: generic_actions
  source: runtime error.log from tv_diplomatic_alliance.gui action_button, 2026-06-25
  notes: A direct enabled = [UIAction.IsEnabled] produced 'No function for call' / empty FetchData errors in this custom panel.
    Later apparent errors from normal action-button templates were traced to stale GUI hot reload state, not the template
