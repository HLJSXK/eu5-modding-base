- id: gui_plus_number_format_prints_sign
  pattern: null
  bad: Expecting the |+N number suffix to print a '+' sign, or writing '+[value|+N]' expecting a plain-coloured number
  correction: '|+N only colours by sign (positive green, negative red, zero uncoloured) and prints no ''+''. |=N / |+=N additionally
