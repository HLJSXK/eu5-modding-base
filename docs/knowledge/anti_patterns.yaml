- id: generic_action_nullable_numeric_comparison_direct
  detectability: needs_parser
  pattern: ''
  only_in_paths:
  - generic_actions
  bad: OR = { NOT = { has_variable = X } var:X < N } in generic action potential/allow/select_trigger logic when X may be
    unset
  correction: Use optional variable links for nullable reads. For bounded counts, emit an OR of NOT has_variable plus var:X
    ?= each allowed literal value, or otherwise restructure so the value is guaranteed initialized before the action can render.
    Do not use direct var:X < N when X can be absent.
  category: scope
  scope: generic_actions
  source: 'runtime error.log: common/generic_actions/tv_trade_league_actions.txt:640/652/671, 2026-07-07'
  notes: Generic action potential, allow, visible, and enabled blocks can be evaluated while startup/lifecycle variables are
    still absent. The engine still fetches the direct comparison inside an OR with NOT has_variable, logging Failed to fetch
    variable, unset var scope, and invalid left side errors. In Trade Chain add-node, the generated count < 20 checks were
    replaced with optional equality branches for 0..19 plus the unset branch.
- id: generic_action_player_selector_uses_ai_interaction_source_list
  pattern: ''
  detectability: advisory
  only_in_paths:
  - generic_actions
  bad: A player-facing select_trigger relies on ai_interaction_source_list to populate its candidate list
  correction: Use interaction_source_list for candidates shared by player and AI. Reserve ai_interaction_source_list for AI-only
    overrides only when the player selector also has a valid source, source_flags, or interaction_source_list.
  category: generic_actions
  scope: any
  source: reference_official_defines/types/peace_treaties.txt:21-22; reference_game_files/game/in_game/common/generic_actions/readme.txt:25-26;
    fixed src/in_game/common/generic_actions/tv_io_leader_actions.txt
  notes: ai_interaction_source_list is only applied to AI countries. If it is the only custom source list, human players can
    see the selector's none_available_msg_key even when a valid target exists.
- id: generic_action_scripted_trigger_assumes_root_owner
  detectability: advisory
  pattern: ''
  only_in_paths:
  - generic_actions
  - scripted_triggers
  bad: A scripted trigger reached from a generic-action effect uses `root`, `root.culture`, or another `root` link after entering
    a nested location/country scope, assuming the caller provides a valid country root.
  correction: At the scripted trigger's country-scope entry, use `save_temporary_scope_as = <owner_scope>` and use `scope:<owner_scope>`
    (or `scope:<owner_scope>.culture`) in nested trigger comparisons. Do not rely on the generic-action pre-evaluator to supply
    a valid `root`. In effect bodies, use `save_scope_as`; `save_temporary_scope_as` is for trigger contexts.
  category: scope
  scope: generic_actions
  source: 'User runtime log: tv_victory_claim_conquest_task_slot_2 -> tv_victory_path_tasks_claim_conquest_slot_2_effect ->
    tv_victory_path_tasks_refresh_conquest_slot_2_effect -> tv_victory_path_tasks_assign_conquest_slot_2_effect -> tv_victory_task_1101/1103/1104/1105/1106_candidate,
    2026-07-28'
  notes: The Victory Path task generator emitted country-scoped candidate/current-condition triggers whose nested location
    checks compared `dominant_culture = root.culture` and `owner = root`. Generic-action effect-tooltip pre-evaluation supplied
    no valid root object, producing `Invalid right side during comparison 'culture'`, `Event target link 'dominant_culture'
    returned an invalid object`, and four `Invalid right side during comparison 'root'` errors. Each generated target trigger
    now saves `tv_victory_task_trigger_owner` with `save_temporary_scope_as` and uses that scope explicitly; candidate and
    display triggers use their own saved owners for every remaining nested country comparison.
- id: generic_action_selector_unknown_attribute_column
  pattern: ''
  detectability: advisory
  bad: Using column = { data = character_noble } or another selector attribute column that is not defined in common/attribute_columns
  correction: Use a defined attribute column such as character_info or character_artist, or add a real common/attribute_columns
    entry plus localization. Keep eligibility filtering in visible/enabled.
