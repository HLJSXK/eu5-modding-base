  category: gui
  scope: any
  source: reference_game_files grep for `parentanchor\s*=` (only `|`-joined combinations found, no concatenated corner tokens);
    scripts/in_game/gui/panels/situation/gen_tv_victory_situation_gui.py append_tree_node_button
  notes: Found 2026-07-13 wiring absolutely-positioned Victory Path Tree node buttons into tv_victory_situation.gui — `parentanchor
