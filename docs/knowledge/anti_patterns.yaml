- id: gui_requirements_list_empty_block_title_override
  pattern: ''
  only_in_paths:
  - gui
  bad: RequirementsList with an empty blockoverride "block_title" { } to hide its title
  correction: 'Keep the nested title block and hide it explicitly: blockoverride "block_title" { block "block_title" { visible
    = no } }'
