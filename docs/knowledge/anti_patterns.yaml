- id: gui_anchor_invalid_concatenated_token
  pattern: (parentanchor|widgetanchor)\s*=\s*(topleft|topright|bottomleft|bottomright)\b
  detectability: lint
  bad: Writing `parentanchor = topleft` (or topright/bottomleft/bottomright) as a single concatenated token for a corner anchor.
  correction: 'EU5 GUI anchor values are combined with `|`, not concatenated: use `parentanchor = top|left` (verified via
    reference_game_files, which only ever uses combos like `top|left`, `bottom|right`, `left|top`, never a fused word). Runtime
