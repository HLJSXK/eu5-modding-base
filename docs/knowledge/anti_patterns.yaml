    or stretch factors.
- id: positive_sign_in_float_literal
  pattern: value = +0.xxx
  bad: Writing a leading + sign on positive float literals, e.g. value = +0.025 or change_variable = { ... value = +0.003
    }
  correction: 'Omit the + sign entirely: value = 0.025. The EU5/Jomini parser does not accept a leading + on numeric literals
    and will misread the value.'
  category: scripted_values
  scope: any
  source: runtime observation
  notes: 'Triggered by Python f-string format spec +:  e.g. f''{delta:+.5f}'' emits +0.00357 for positive deltas. Fix: use
    f''{delta:.5f}'' so no leading sign is emitted for positive values.'
  source_variants:
  - project: eu5-modding-project
    entry:
      id: positive_sign_in_float_literal
      reference: recursive source snapshot; see containing entry
  - project: eu5-towards-victory
    entry:
      id: positive_sign_in_float_literal
      pattern: value = \+\d
      bad: Writing a leading + sign on positive float literals, e.g. value = +0.025 or change_variable = { ... value = +0.003
        }
      correction: 'Omit the + sign entirely: value = 0.025. The EU5/Jomini parser does not accept a leading + on numeric literals
        and will misread the value.'
      category: scripted_values
      scope: any
      source: runtime observation
      notes: 'Triggered by Python f-string format spec +:  e.g. f''{delta:+.5f}'' emits +0.00357 for positive deltas. Fix:
        use f''{delta:.5f}'' so no leading sign is emitted for positive values.'
- id: preceding_has_variable_does_not_guard_a_later_raw_two_variable_comparison
  pattern: '(?<!\?)= \{\s*(?:\n\s*)?this [<>]=? var:'
  detectability: advisory
  bad: A raw hard comparison between two variables (`var:X <= var:Y`, `var:X > var:Y`, etc.) placed after a `has_variable
    = X` / `has_variable = Y` guard earlier in the SAME `AND` block, instead of checking whether the comparison's dynamism
    is even needed on that code path before patching its RHS syntax.
  correction: '`has_variable` guards preceding a raw two-variable comparison inside the same `AND` do NOT prevent the engine''s
    tooltip/effect-preview pre-evaluation pass from independently evaluating that comparison line and logging ''Event target
    link var returned an unset scope'' / ''Invalid left side during comparison var'' / ''Invalid right side during comparison
    var'' / ''Failed to fetch variable ... due to not being set'' — that preview pass evaluates each condition line independently
    rather than truly short-circuiting the AND at the first false guard. Two syntax-only fixes were tried on `tv_wonder_has_selected_ceremony_trigger`''s
    `var:tv_wonder_ceremony_style <= var:tv_wonder_locked_style_count` line and both failed: wrapping as `var:X ?= { this
    <= var:Y }` (still invalid — inside the `?=` block, scope has changed to the *value* of X, so a bare `var:Y` RHS can''t
    resolve there), then `var:X ?= { this <= root.var:Y }` (syntactically valid per `reference_game_files/game/in_game/events/disaster/castilian_civil_war.txt:2446`,
    but STILL failed in practice). The real root cause was structural, not syntactic, per risk_cards/wonders.md rule 10: `tv_wonder_locked_style_count`
    is a *derived cache variable* written by `tv_wonder_index_cache_locked_wonder_attributes_effect` and read back by this
    same trigger later in the *same pre-evaluated chain* (`tv_wonder_choose_ceremony_style_effect`''s non-hidden `effect=`
    -> `tv_wonder_index_refresh_country_cache_effect` -> writes the cache -> calls this trigger to read it) — during tooltip/allow
    preview the write hasn''t actually committed yet when the read happens, so no RHS syntax fixes it. The actual resolution
    was simpler still: the comparison was solving a non-problem. `tv_wonder_has_selected_ceremony_trigger` (via `tv_wonder_can_choose_ceremony_style_trigger`''s
    `NOT = { tv_wonder_unique_locked_trigger = yes }` guard) is reachable only for *generic* wonders, which always have exactly
    3 fixed ceremony styles (`tv_wonder_choose_ceremony_style_1/2/3` are the only actions that ever set this variable) — unique
    wonders use a completely separate ritual system (`tv_wonder_selected_ritual_*` variables) and never reach this trigger.
    The dynamic `tv_wonder_locked_style_count` (driven by `ceremony_styles()`/`final_buildings` in `scripts_engineering_department/wonder_mechanics/_core.py`,
    genuinely variable per *unique* wonder) was introduced into this *generic*-wonder-only trigger by mistake in commit 66b5edf5
    (''implement wonder global variable map'', 2026-06-04), replacing the original literal `var:tv_wonder_ceremony_style ?=
    { this <= 3 }` (from the trigger''s introducing commit d394ac0a) that had never had this bug. Restored the literal `<=
    3` form and dropped the now-unneeded `has_variable = tv_wonder_ceremony_style` / `has_variable = tv_wonder_locked_style_count`
    guards. General lesson: two consecutive failed syntax-only fixes on the same two-variable comparison is a strong signal
    to check the git history / design intent for whether the dynamism is even reachable on that path, rather than trying a
    third RHS variant.'
  category: script
  scope: any
  source: src_engineering_department/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt tv_wonder_has_selected_ceremony_trigger;
    src_engineering_department/in_game/common/scripted_effects/tv_wonder_index_effects.txt tv_wonder_index_refresh_country_cache_effect
    (:17107-17118), tv_wonder_index_cache_locked_wonder_attributes_effect; src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt
    tv_wonder_choose_ceremony_style_effect (:1986); src_engineering_department/in_game/common/generic_actions/tv_engineering_department_actions.txt
    tv_wonder_choose_ceremony_style_1/2/3; scripts_engineering_department/wonder_mechanics/_core.py ceremony_styles(); docs/knowledge/risk_cards/wonders.md
    rules 9, 10, 27-28, 33; docs/error_log/error.log jomini_script_system.cpp:252, 2026-07-16; git commit 66b5edf5 (introduced
    the bug), d394ac0a (original working form)
  notes: '2026-07-16: user reported errors ''kept happening'' (持续报错) while constructing a generic wonder, then after a first
    `?=`-wrap syntax fix, reported it errored again with a new message (''Invalid right side during comparison var''), then
    after a second `root.var:` syntax fix, said the fix was still ineffective ("修复无效，我已回退") and asked to look at how the trigger
    was originally written instead of continuing to patch the comparison syntax. `git log -S"tv_wonder_has_selected_ceremony_trigger"`/`-S"tv_wonder_locked_style_count"`
    found the trigger''s original form (commit d394ac0a) used a literal `var:tv_wonder_ceremony_style ?= { this <= 3 }` with
    zero history of this error, and pinpointed commit 66b5edf5 as the exact change that introduced the two-variable comparison
    and thus the bug. The user then clarified the actual design: all generic wonders have exactly 3 ceremony styles; unique
    wonders never reach this trigger (separate ritual system) — so the ''dynamic style count'' the two prior fix attempts
    were trying to make safe was never a real requirement on this path, it was a copy-paste-era mistake from the global-variable-map
    refactor. Restored the literal `<= 3` original form (deleting the now-pointless `has_variable` guards) and validate.py
    --changed --fix --ai-report passed. Key process lesson for future sessions: two consecutive failed syntax-only fixes on
    the same comparison line is a strong signal to check the git history / design intent for whether the dynamism is even
    needed, rather than trying a third RHS variant.'
- id: price_gold_field_rejects_dynamic_scriptvalue
  pattern: ''
  detectability: advisory
  bad: Referencing a conditional/dynamic script_value (one with an `if =`, `min =`, `max =`, or any block reading `global_var:`/`var:`)
    as the RHS of `gold =` (or any other amount field) inside a `common/prices/` price definition.
  correction: 'Keep the price''s `gold =` (or equivalent) field a compile-time-static number, or a reference to a simple flat
    named value (vanilla `build_price_age_of_tradition = 50` style — no braces, no conditional logic). To make the effective
    cost track a runtime value (a CMM setting, a country variable, ...), keep the base price static and apply the adjustment
    through the `<price_name>_cost_modifier` tag instead: register an `auto_modifiers` (or `static_modifiers`) entry with
    `scales_with = { value = global_var:X multiply = ... divide = ... subtract = 1 }` computing the desired percentage delta
    from the base price, and set `<price_name>_cost_modifier = 1` in that same block so the final applied modifier equals
    `scales_with`''s value directly. `scales_with` blocks ARE full script_value contexts (proven by vanilla `reference_game_files/game/in_game/common/auto_modifiers/country.txt`,
    e.g. `scales_with = { value = num_colonial_charters subtract = 1 min = 0 max = 1 }`) and evaluate at runtime in the owning
    scope, unlike `common/prices/` fields. IMPORTANT: `<price_name>_cost_modifier` is NOT engine-auto-derived — every price''s
    cost_modifier tag, vanilla and TV alike, needs its own EXPLICIT `modifier_type_definitions` entry (`color = bad  percent
    = yes  game_data = { category = country }`; see `build_gravel_road_cost_modifier` at `reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:802`
    and every sibling TV price in `src_engineering_department/main_menu/common/modifier_type_definitions/tv_engineering_department_modifier_types.txt`).
    Skipping that registration produces a SEPARATE, later error: `pdx_persistent_reader.cpp: Unknown modifier type: <name>.
    It is either invalid, or a potential dynamic modifier type definition missing from the database`, and `price_database.cpp:
    Missing modifier type for price. <name>` even once the price''s own `gold =` field is fixed.'
  category: script
  scope: country
  source: docs/error_log/error.log 2026-08-02 15:38-16:06 (both the malformed-token round and the follow-up unknown-modifier-type
    round); reference_game_files/game/in_game/common/prices/*.txt (exhaustive grep, zero dynamic gold values in vanilla);
    reference_mods/*/in_game/common/prices/*.txt (exhaustive grep across every reference mod's price files, zero dynamic gold
    values); reference_game_files/game/in_game/common/auto_modifiers/readme.txt and country.txt (scales_with proof); reference_game_files/game/main_menu/common/script_values/default_values.txt:1217
    (build_price_age_of_tradition = 50, the only form of named-value reference vanilla uses inside a price); reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:802
    (build_gravel_road_cost_modifier explicit registration); src_engineering_department/main_menu/common/modifier_type_definitions/tv_engineering_department_modifier_types.txt
    (every existing TV price already registers its own _cost_modifier the same way)
  notes: '2026-08-02: a CMM-driven direct-build price feature defined `tv_wonder_direct_build_small_price = { gold = tv_wonder_direct_build_small_price_value
    }` where the referenced script_value had `if = { limit = { has_global_variable = ... } ... }` branching to read a CMM
    global_var. In-game this produced `pdx_persistent_reader.cpp:289: Malformed token` plus `jomini_named_values.h: Matching
    scriptvalue [...], but of wrong type` for every affected price, plus a `price_database.cpp: Missing modifier type for
    price. <name>_cost_modifier` warning that read, at the time, like a cascading symptom of the malformed price. Fixed round
    1 by reverting the price to a flat default and moving the CMM-driven adjustment to a new `auto_modifiers` file with `scales_with`
    feeding a `<price>_cost_modifier` tag — but that tag was never explicitly registered, on the WRONG assumption (based on
    `build_gravel_road_cost_modifier` appearing usable in advances/estate-privilege files with no obvious nearby registration)
    that the engine auto-derives `<price>_cost_modifier` from the price definition itself. In-game round 2 then produced a
    DIFFERENT, unrelated-looking error: `Unknown modifier type: tv_wonder_direct_build_small_price_cost_modifier ... a potential
    dynamic modifier type definition missing from the database`, plus the SAME `price_database.cpp: Missing modifier type
    for price` line recurring even though the price itself now parsed fine — proving the missing-modifier-type warning was
    never just a symptom of the malformed token; it was reporting a second, independent, still-unfixed gap. Re-grepping `00_modifier_types.txt`
    directly (rather than trusting the earlier failed reference_mods-wide search) found `build_gravel_road_cost_modifier`
    explicitly defined there at line 802, and every sibling TV price (`tv_wonder_labor_camp_price`, `tv_wonder_ritual_annex_small_price`,
    ...) already had its own explicit entry in `tv_engineering_department_modifier_types.txt` all along — the auto-derivation
    theory was simply wrong. Fixed round 2 by adding the three missing entries to that same file. General lesson: when an
    identifier ''just works'' somewhere without an obvious nearby registration, grep the SPECIFIC registration file directly
    for that exact identifier before concluding the mechanism is implicit/auto-derived — a quick reference_mods-wide grep
    that returns zero hits is not proof of absence if the search pattern or directory scope was too narrow.'
- id: price_missing_cost_modifier_type
  pattern: ''
  only_in_paths:
  - prices
  bad: Defining a mod price key without a matching <price_key>_cost_modifier modifier type
  correction: For every mod-defined price key, add <price_key>_cost_modifier in main_menu/common/modifier_type_definitions
    with category = country, and localize the price key plus MODIFIER_TYPE_NAME/DESC entries.
  category: modifier
  scope: country
  source: 'src/main_menu/common/modifier_type_definitions/towards_victory_modifier_types.txt:41; runtime error.log: price_database.cpp:116'
  notes: EU5 automatically looks for a cost modifier type named <price_key>_cost_modifier for each price. If it is absent,
    the engine logs 'Missing modifier type for price'.
- id: price_requires_cost_modifier_type
  pattern: ''
  bad: Defining a price in common/prices/ without a corresponding modifier_type in common/modifier_type_definitions/
  correction: For every price named {name} in common/prices/, a modifier type named {name}_cost_modifier MUST exist in common/modifier_type_definitions/.
    EU5's price_database.cpp validates this at startup and logs 'Missing modifier type for price. {name}_cost_modifier'. The
    modifier type allows future modifiers/events to discount the price.
  category: script
  scope: any
  source: price_database.cpp:116 (runtime error log)
  notes: 'This is an engine-enforced convention, not optional. Even if no modifier currently applies the discount, the modifier_type
    definition must be present. The naming is exact: price ''tv_academy_1_price'' requires modifier type ''tv_academy_1_price_cost_modifier''.
    These appear unused but are implicitly consumed by the price loading system.'
- id: price_resource_inject_treated_as_additive
  pattern: null
  bad: Treating a repeated price resource field such as gold as an additive delta, or injecting a negative value to cancel
    an earlier mod's price injection
  correction: Repeated scalar fields injected into a price object replace the earlier field value. When two mods use the same
    operation type, use filename order to select the owner; use a verified full replacement only when filename ordering cannot
    express the intended final object. Never emit a negative cleanup injection.
  category: compatibility
  scope: price
  source: user-reported EU5 1.3.11 runtime behavior (2026-07-24); src/stable/in_game/common/prices/A_SOL_economy_prices.txt:177-191;
    reference_mods/3613232232/in_game/common/prices/pp_road_gold_adjustments.txt:2-13
  notes: In the SOL-PP stack, A_SOL_economy_prices.txt loads before pp_road_gold_adjustments.txt within TRY_INJECT, so PP's
    road gold fields naturally replace SOL's. A later compatibility injection of -10/-25/-100/-400 became authoritative and
    road costs were clamped to zero. This price behavior differs from additive numeric static modifiers.
- id: production_method_base_profit_too_high
  pattern: ''
  detectability: needs_parser
  only_in_paths:
  - production_methods
  bad: Production method base input/output values produce profit above 30%
  correction: Compute recipe value from goods default_market_price and keep base profit below 30%, usually by slightly increasing
    inputs or reducing output/default output price.
  category: script
  scope: any
  source: 'runtime error.log: production_methods.cpp:429'
  notes: EU5 logs a startup error when a production_method's base profit exceeds 30%, e.g. tv_wonder_material_dispatch_point_production
    at 33.33%. A recipe worth 5 output needs input value greater than 3.8462 to be just under 30% profit.
- id: production_method_invalid_goods_aliases
  pattern: \b(candles|luxury_cloth)\s*=
  only_in_paths:
  - production_methods
  bad: Using display/alias-like goods names such as candles or luxury_cloth in production method upkeep
  correction: 'Use real goods database IDs: beeswax for candle upkeep, fine_cloth for luxury cloth upkeep.'
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/goods/03_food.txt:319; reference_game_files/game/in_game/common/goods/02_produced_goods.txt:130
  notes: Production method input keys must be exact goods IDs. Invalid goods tokens inside common/production_methods can load
    as 'Unexpected token' errors, as seen with candles and luxury_cloth.
- id: progressbar_default_max_is_one
  pattern: ''
  bad: progressbar with dynamic GetVariable value binding and no explicit max
  correction: Always set max = 100 on the progressbar widget. Store values as integer [0,100] in scripted variables using
    integer-scale arithmetic.
  category: gui
  scope: any
  source: reference_game_files/game/in_game/gui/panels/situation/the_revolution.gui:112
  notes: Default progressbar max appears to be 1; GetVariable returning an integer 0-100 without matching max produces 0%
    for all values except 1 (which shows 100%). Pattern left empty — regex cannot reliably detect the missing-max + variable-value
    combination.
- id: prosperity_value_is_fractional
  pattern: ''
  detectability: advisory
  bad: Treating location prosperity reads as 0..100 percent points, such as dividing an average prosperity value by 100 before
    using it as a weight
  correction: Use the raw signed fractional prosperity value. For recovery priorities, negate the average directly and clamp
    below 0.
  category: script
  scope: location
  source: reference_game_files/game/in_game/events/government/societal_values.txt:12373; reference_game_files/game/in_game/events/exploration/exploration_monthly_events.txt:235
  notes: Vanilla checks use fractional thresholds such as prosperity < 1 and prosperity < -0.1; an extra divide by 100 makes
    prosperity-derived weights too small to compete.
- id: python_boolean_token_in_common_script
  pattern: ^\s*[A-Za-z0-9_:.]+\s*=\s*(?:True|False)\b
  detectability: lint
  only_in_paths:
  - src/in_game/common
  - src/main_menu/common
  bad: Python-style boolean token True/False emitted into an EU5 common script
  correction: Render script booleans as yes or no. In Python generators, handle bool before int/float because bool is an int
    subclass.
  category: script
  scope: any
  source: reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:1270; reference_game_files/game/main_menu/common/static_modifiers/country.txt:5603
  notes: YAML true/false loads as Python True/False; str(value) emits malformed tokens in Jomini scripts, as seen with global_peasants_migration_allowed
    = True.
- id: random_list_branch_modifier_filter
  pattern: (?m)^\s*\d+\s*=\s*\{\s*\n\s*modifier\s*=\s*\{\s*factor\s*=\s*0
  bad: Filtering random_list branches with modifier = { factor = 0 ... }
  correction: Use trigger = { ... } inside each weighted random_list branch. Vanilla random_list branch eligibility uses trigger
    blocks; use NOT = { var:current ?= N } there when a reroll must exclude the current result.
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/scripted_effects/location_effects.txt:238-240; reference_game_files/game/in_game/common/missions/generic_progress_and_literacy_mission_pack.txt:160-166
  notes: Engineering Department estate-demand rerolls used modifier factor zero in random_list branches. A player could bribe
    a demand into the artwork-loss branch and repeated same-day rerolls kept resolving to that same visible demand. Replacing
    branch modifiers with trigger filters and excluding the current demand makes the random pool behave like vanilla and prevents
    visible no-op rerolls.
- id: random_list_inside_random
  pattern: random\s*=\s*\{[^}]*random_list
  bad: random = { chance = X random_list = { ... } } — nesting random_list as a child of random
  correction: random_list = { (100-X) = {} X = { random_list = { ... } } }. Use the outer random_list to implement the probability
    gate and the inner random_list to pick the specific outcome. Both levels of random_list are confirmed valid EU5 syntax.
  category: script
  scope: any
  source: reference_game_files/game/in_game/common/situations/the_revolution.txt:59-72 (random_list { 98={} 1={event} 1={event}
    } pattern confirmed)
  notes: 'random_list as a direct child of random = { chance = X } is silently dropped by the EU5 engine — the 8% roll fires
    but the random_list produces no outcome. All intended events are skipped with no error in the log. Fix: restructure to
    nested random_list where the high-weight option is the no-event case.'
- id: raw_trigger_count_has_no_live_tooltip_value
  pattern: ''
  detectability: advisory
  bad: 'Assuming a built-in country trigger (e.g. `num_of_advances_researched >= 50`) will show the player''s current progress
    ''(37/50)'' in its custom_tooltip. Vanilla''s own default tooltip loc for these triggers (see `NUM_ADVANCES_TRIGGER` in
    triggers_l_english.yml: "Has $COMPARATOR$ $NUM|V0$ [advances|E] researched") only substitutes the comparator and threshold
    — never the live value — and GetVariable-style GUI live-value display only works on country *variables*, not raw engine
    triggers/counts.'
  correction: To show a live '(current/target)' readout for a raw trigger-only count, mirror it into a country variable via
    `set_variable = { name = tv_x_mirror value = <trigger_or_count> }` on the same monthly cadence that already checks the
    trigger (verify the count is usable as a `value =` expression first — e.g. `value = num_of_advances_researched` is confirmed
    vanilla usage in `reference_game_files/game/in_game/common/script_values/research_values.txt` and `estates/00_default.txt`).
    Then embed `[Country.MakeScope.GetVariable('tv_x_mirror').GetValue|0]` in the GUI-facing loc key only (e.g. an `_ESTABLISHMENT_STEP1_TEXT`
    card string), matching the existing `TV_CONQUEST_PROGRESS_DISPLAY`-style pattern. Do NOT also add this GUI `Country.MakeScope`
    macro to a sibling loc key that is rendered as a `custom_tooltip.text` inside a scripted_trigger — that renders in script-tooltip
    context (ROOT/THIS scopes), not GUI data-binding context, so the GUI-only accessor is unverified there and should be kept
    out.
  category: gui
  scope: country
  source: data/io_establishment.yaml (science progress_mirror), scripts/gen_victory.py mark_basic_requirements_effect + loc
    generation; reference_game_files/game/in_game/common/script_values/research_values.txt:3; src/main_menu/localization/*/towards_victory_leaderboard_l_*.yml
    Country.MakeScope.GetVariable(...).GetValue|0] precedent
  notes: Discovered while investigating a user report that the Academy of Sciences 'research at least 50 advances' requirement
    'seemed unsatisfiable' after the EU5 1.3 patch. First fix attempt added a tv_science_advances_researched_mirror variable
    (refreshed monthly inside tv_io_establishment_mark_basic_requirements_effect) and appended the live value only to TV_SCIENCE_ESTABLISHMENT_STEP1_TEXT.
    The player then confirmed in-game that the mirrored value itself never moved — num_of_advances_researched is apparently
    stuck/broken under this EU5 1.3 build, not just missing a tooltip — so the mirror was reverted (see [[num_of_advances_researched_broken_eu5_1_3]]
    for the replacement stopgap). The GUI-vs-script-tooltip loc-key split documented above is still valid general guidance
    for any OTHER numeric establishment route that wants a live readout — conquest/prosperity/trade/diplomatic already track
    a working `var:tv_x_score` for their basic requirement, so the same live-display pattern could be extended to them the
    same way if requested.
- id: recurring_silent_event_loop_without_guard
  pattern: ''
  detectability: advisory
  bad: Seeding a delayed trigger_event_silently recurring hidden-event loop without a persistent sentinel, active-prerequisite
    guard, or teardown cleanup
  correction: Seed the loop once from a lifecycle point, set a persistent sentinel, and call trigger_event_silently = { id
    = tv_feature.900 days = 1 }. In the hidden = yes country event's immediate block, re-check both the feature prerequisite
    and sentinel before doing work and before rescheduling itself. Clear the sentinel on teardown so already queued events
    stop naturally.
  category: event
  scope: country
  source: Governor's House daily hidden-event test, 2026-06; trigger_event_invalid_in_scripted_effects documents delayed trigger_event_silently
    object form
  notes: Delayed silent hidden events can implement daily immediate work outside monthly pulses and tooltip-rendered option
    chains, but every seed starts an independent loop. The sentinel prevents duplicate chains, and the teardown guard prevents
    a queued event from resurrecting a removed feature.
- id: religion_conversion_need_scope_mismatch
  pattern: ''
  detectability: advisory
  bad: Applying vanilla promote_religion's full target condition to a regional priority heuristic without checking the mechanic's
    design intent
  correction: Use the full vanilla OR when mirroring cabinet-action province eligibility. For Governor's House autonomous
    conversion priority, use only the share of owned locations whose dominant_religion differs from the governing country's
    religion.
  category: script
  scope: location
  source: reference_game_files/game/in_game/common/cabinet_actions/promote_religion.txt:73-76
  notes: Vanilla promote_religion can still work on minority non-state-religion pops when local_religious_unity is below 100%.
    The Governor's House design intentionally ignores that cleanup case so regional governors only prioritize locations where
    the non-state religion is still dominant.
- id: remove_trait_missing_trait_prefix
  pattern: remove_trait\s*=\s*(?!trait:)\w+
  bad: remove_trait = blind
  correction: 'remove_trait = trait:blind — always prefix the trait name with trait: for remove_trait and add_trait effects.
    Note: has_trait = blind (no prefix) is correct for trigger checks.'
  category: event
  scope: character
  source: reference_game_files/game/in_game/events/character/artist_events.txt:260
  notes: 'remove_trait effect requires trait: prefix (remove_trait = trait:blind). has_trait trigger does NOT use the prefix
    (has_trait = blind). Mixing them causes: remove_trait effect [ target: field not set ].'
- id: removed_setting_leaves_unset_variable_reads
  pattern: null
  bad: Removing a CMM setting and its active alias setter while leaving script values, triggers, or scripted GUIs that read
    the alias variable
  correction: Remove or exact-path override every residual reader; retain variable-free constant fallbacks for referenced
    script values and only the scripted GUI callbacks that remain registered
  category: framework
  scope: global
  source: 'runtime error.log (2026-07-22): Variable ''sol_cts'' is used but is never set. Setting it in an unused scripted
    trigger or effect does not count'
  notes: The engine's variable analysis ignores setters that only occur in unreachable or unused scripted objects. Dummy setters
    do not cleanly retire a setting; remove the readers instead.
- id: replace_prefix_requires_guaranteed_base_entry
  pattern: ''
  detectability: advisory
  bad: Using REPLACE:<id> in a standalone-loadable mod (e.g. src_engineering_department/, src_court_positions/) for a key
    that only a DIFFERENT, non-guaranteed mod (e.g. the main src/ mod) defines.
  correction: 'REPLACE:<id> requires <id> to already exist in the database at load time. A base-game vanilla identifier is
    always safe to REPLACE: regardless of mod combination. A key owned by another TV mod is safe to REPLACE: only if that
    mod is a guaranteed hard dependency. If the current mod must also work standalone (or with any subset of the other TV
    mods) and the key is not guaranteed present, give this mod its OWN uniquely-namespaced key instead of trying to share/override
    the other mod''s key — the same ''narrow to your own namespace'' resolution already used for Court Positions'' message
    types (see PROJECT_OVERVIEW.md).'
  category: script
  scope: any
  source: 'runtime error.log gamedatabase.h:425, 2026-08-02 ("You are trying to inject/replace to a non-existing entry: TV_HAS_VARIABLE_NOT_SET_TT:Replace");
    CLAUDE.md Project Identity ("Three deployable mod roots" — Engineering Department "has no dependency on the main mod and
    is fully playable without it")'
  notes: '2026-08-02: src_engineering_department/in_game/common/trigger_localization/tv_engineering_department_triggers.txt
    declared REPLACE:TV_HAS_VARIABLE_NOT_SET_TT, assuming the main src/ mod''s bare TV_HAS_VARIABLE_NOT_SET_TT definition
    (src/in_game/common/trigger_localization/towards_victory_triggers.txt) had already loaded. This is true only when both
    mods run together — CLAUDE.md''s own Project Identity section states Engineering Department must be fully playable standalone,
    and in that configuration the main mod''s copy never loads, so REPLACE: has nothing to replace and errors. This was the
    ORIGINAL motivation for anti_patterns rule same_id_database_override_missing_replace_prefix''s TV_HAS_VARIABLE_NOT_SET_TT
    example (added 2026-07-28, presumably tested only in the combined-mods configuration where REPLACE: happened to work),
    so that rule''s guidance was itself incomplete for standalone-capable mods. Fixed by renaming the Engineering Department
    mod''s copy to TV_ENGINEERING_DEPARTMENT_HAS_VARIABLE_NOT_SET_TT (bare declaration, no REPLACE: needed, all 3 internal
    custom_tooltip references and the EN/ZH game_concepts loc key renamed to match) rather than trying to share the main mod''s
    key at all — eliminates the collision instead of resolving it via load-order-dependent REPLACE:. The main src/ mod''s
    own TV_HAS_VARIABLE_NOT_SET_TT (used by ~50 unrelated references across src/) was left untouched.'
- id: replaced_building_reuses_vanilla_unique_production_method_id
