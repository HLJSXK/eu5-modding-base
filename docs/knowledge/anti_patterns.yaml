- id: gui_progressbar_margin_top
  pattern: (?ms)^[ \t]*progressbar\s*=\s*\{(?:(?!^[ \t]*\}).)*^[ \t]*margin_top\s*=
  detectability: lint
  only_in_paths:
  - .gui
  bad: Putting margin_top directly on a progressbar widget
  correction: Wrap the progressbar in a fixed-size widget/layout container, put vertical placement such as parentanchor/widgetanchor
    on the progressbar inside that wrapper, and leave margin_top off the progressbar itself.
  category: gui
  scope: any
  source: 'runtime error.log from gui/panels/organization/tv_engineering_department.gui: Property ''margin_top'' not handled
    for progressbar'
  notes: EU5 progressbar does not handle margin_top. Text and container widgets may use margins, but progressbar vertical
    offset should be expressed through a parent wrapper.
- id: gui_progressbar_needs_an_empty_texture
  pattern: null
  bad: Providing only progresstexture and expecting a parent background to supply the empty region
  correction: Set noprogresstexture explicitly. The progressbar shader samples Texture0 for the filled region and Texture1
    for the empty region. A separate background does not bind Texture1.
  category: gui
  scope: any
  source: reference_game_files/game/main_menu/gui/shared/progressbars.gui:165-170; installed game clausewitz/loading_screen/gfx/FX/pdxgui_progressbar.shader
  notes: 'The supplied screenshot showed solid lime bars while the renderer drew red/gold textures. Exact missing-sampler
    colour is engine-dependent. Evidence: screenshot symptom and source for the correction (2026-10-13).'
- id: gui_progressbar_using_is_a_type_not_a_texture
  pattern: null
  bad: Writing `progressbar = { size = { W H } using = bar_gold min = 0 max = ... value = ... }` on the assumption that `using`
    names a texture
  correction: '`using = X` inlines the properties of a `type X`; it is not a texture reference. If no `X` exists the progressbar
    resolves no texture and draws nothing at all - silently, while still occupying its layout slot and reporting a normal
    size. A progressbar needs an explicit `progresstexture` (and optionally `noprogresstexture`), plus `texture_density` /
    `spriteType` / `spriteborder` on the element.'
  category: gui
  scope: any
  source: Vanilla `type progressbar` in loading_screen/gui/shared/defaults.gui:225 (its own `using = tooltip_se` is a sound/behaviour
    type); main_menu/gui/shared/progressbars.gui:285 `template progress_bar_goldish_blue` names `progresstexture`/`noprogresstexture`
    directly; no `bar_*` type exists anywhere in reference_game_files
  notes: Every bar in the SOL prototype tooltips measured correctly and drew nothing (2026-10-13). The failure is invisible
    to both the renderer's measure pass and a size check - only the pixels reveal it.
- id: gui_prototype_mock_default_masks_missing_data
  pattern: null
  bad: A catch-all prototype mock returning zero before the scenario's supplied script values
  correction: Register only explicitly provided script-value/map keys before scenario mocks. Unspecified keys fall through
    to the scenario, and missing script values remain Unknown.
  category: gui
  scope: any
  source: ai_gui_assessment/renderer/run.py _proto_mocks; ai_gui_assessment/renderer/data.py Evaluator.lookup
  notes: 'Tool regression (2026-10-13): explicit overrides, scenario fallback and missing-key reporting are checked separately.
    A zero unknown-expression count must not come from zero defaults.'
- id: gui_quoted_string_newline_escape
  pattern: (?:tooltip|raw_text|text(?:context)?)\s*=\s*"[^"\r\n]*?(?<!\\)\\[nt]
  only_in_paths:
  - /gui/
  bad: Emitting literal backslash-n or backslash-t into a quoted GUI string
  correction: GUI lexing allows only escaped quotes/backslashes. Insert [Localize('NEWLINE_BREAK')] for tooltip line breaks;
    newline escapes belong in localization YAML. Do not double the slash merely to suppress the lexer error.
  category: gui
  scope: any
  source: 2026-10-15 user lexer.cpp:805 log; reference_game_files/game/in_game/gui/shared/character_tooltips.gui:1571; main_menu/localization/english/economy_l_english.yml:38
  notes: SOL goods-cell generator emitted invalid escapes on every hover. The shared generator now uses vanilla NEWLINE_BREAK
    and renderer pdx tokenizer rejects invalid escapes; bilingual location/country hover regression checks real line breaks.
- id: gui_raw_text_localization_substitution_literal
  pattern: ''
  detectability: advisory
  only_in_paths:
