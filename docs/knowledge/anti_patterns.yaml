  category: gui
  scope: any
  source: reference_official_defines/docs/data_types_script.txt:3727; docs/data_types_common.txt:468/928/940; docs/error_log/error.log
    (2026-10-13)
  notes: Runtime FetchData failures froze all six SOL dials at their first frame. The renderer now reports this type error.
- id: gui_flowcontainer_does_not_wrap_by_width
  pattern: null
  bad: Using `flowcontainer` with a `maximumsize` and expecting children to wrap onto a new line when the width runs out (CSS
    flex-wrap)
  correction: No vanilla `flowcontainer` wraps by available width; the only wrapping seen is a fixed item count (`wrap_count
    = N`, e.g. agenda_view.gui:638). For width-dependent wrapping, split the content into explicit rows in the generator.
  category: gui
  scope: any
  source: 'grep over reference_game_files/game: 56 `flowcontainer` direction uses, wrapping only via `wrap_count` (agenda_view.gui:638,
    expeditions_lateralview.gui:170/299)'
  notes: Found while prototyping the SOL goods-group rows (2026-10-13). Not verified in game; treat as source-level evidence.
- id: gui_format_tag_requires_separator_before_punctuation
  pattern: '#(?:R-|E/)'
