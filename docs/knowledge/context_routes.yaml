# Shared EU5 context routes. Workspace route tables add product-specific cards.
core_reads:
  - path: .eu5-base/CLAUDE.md
    reason: shared EU5 workflow
  - path: .eu5-base/docs/knowledge/BRIEF.md
    reason: shared engine and gameplay knowledge index
domain_routes:
  - id: generic_actions
    expand_mod_roots: true
    route_generated_consumers: true
    path_prefixes:
      - in_game/common/generic_actions/
      - in_game/common/generic_action_ai_lists/
      - main_menu/gui/messagetypes/
      - scripts/in_game/common/generic_actions/
      - scripts/in_game/common/generic_action_ai_lists/
      - scripts_engineering_department/in_game/common/generic_actions/
      - scripts_engineering_department/in_game/common/generic_action_ai_lists/
      - scripts_court_positions/in_game/common/generic_actions/
      - scripts_court_positions/in_game/common/generic_action_ai_lists/
      - scripts_eureka/in_game/common/generic_actions/
      - scripts_eureka/in_game/common/generic_action_ai_lists/
      - scripts/gen_messagetypes.py
    required_check:
      id: generic_action_registration
      message: >-
        Generic action changes require THREE companion registrations in the action's own mod root:
        (1) action id inside an AI list's actions = { ... } block;
        (2) PERFORM_<action_id>_ACTION in main_menu/gui/messagetypes/<mod>.txt (EU5 1.4.3+, additive; no vanilla copy);
        (3) PERFORM_<action_id>_ACTION_HEADER, _TITLE, _SETUP, _LOG and _MAP in supported languages, with UTF-8 BOM and resolving aliases.
        Update the owning generator and its declared data inputs, regenerate, then run scripts/validate.py --changed --fix --ai-report.
    card: generic_actions.md
    summary: action registration, five-field notifications, selector and hover risks
    reason: generic actions can evaluate before confirmation
  - id: gui
    expand_mod_roots: true
    path_prefixes: [in_game/gui/]
    card: gui.md
    summary: GUI type, data context, layout, and tooltip checks
    reason: GUI expression failures can be silent
  - id: events
    expand_mod_roots: true
    path_prefixes: [in_game/events/]
    card: events.md
    summary: event IDs, options, and effect preview
    reason: event option tooltips evaluate effect chains
  - id: on_action
    expand_mod_roots: true
    path_prefixes: [in_game/common/on_action/]
    card: on_action.md
    summary: hook, root scope, and pulse timing
    reason: on-action hooks have engine-defined caller context
  - id: localization
    expand_mod_roots: true
    path_prefixes: [main_menu/localization/]
    card: localization.md
    summary: encoding, keys, and format tags
    reason: localization failures cascade to UI
filename_routes:
  - id: europedia
    substrings: [encyclopedia_lateralview]
    card: europedia.md
    summary: full-panel override and compatibility implications
    reason: Europedia has no verified data registration API
content_routes:
  - id: generic_actions
    markers: [generic_actions, generic_action_ai_lists, PERFORM_, "def actions(", action_name]
    excluded_prefixes: [docs/, tests/, tmp/, .tmp/, .editor_state/, assets/, reference_game_files/, reference_mods/]
    excluded_paths: [AGENTS.md, CLAUDE.md, scripts/ai_context.py]
    card: generic_actions.md
    summary: AI list, message type and all five notification fields
    reason: generator, data, localization or GUI caller uses generic actions
  - id: variable_map
    markers: ["variable_map(", "global_variable_map(", "local_variable_map(", add_to_variable_map, add_to_global_variable_map, add_to_local_variable_map]
    excluded_prefixes: [docs/, tests/, reference_game_files/, reference_mods/]
    excluded_paths: [CLAUDE.md, scripts/ai_context.py]
    reads:
      - path: .eu5-base/docs/technical/EU5_Modding_Knowledge_Base.md
        reason: variable-map scope and right-hand-side rules
    reason: file content uses variable-map APIs
object_alerts:
  - id: object_on_built
    severity: high
    markers: [on_built]
    expand_mod_roots: true
    path_prefixes: [in_game/common/building_types/]
    file_suffixes: [.txt, .py, .yaml]
    excluded_prefixes: [docs/, tests/, reference_game_files/, reference_mods/]
    card: object_on_built.md
    summary: on_built may not signal upgrade completion
    reason: building lifecycle hook touched
    message: Check upgrade and reuse lifecycle; on_built alone is not a reliable completion signal.
maintenance_routes:
  - id: ai_workflow
    path_prefixes: [docs/knowledge/, docs/guides/, scripts/ai_context.py, scripts/gen_brief.py, CLAUDE.md, AGENTS.md]
    reads:
      - path: .eu5-base/docs/guides/AI_Tool_Workflow_Prompt.md
        reason: shared AI-tool workflow contract
    reason: AI workflow or knowledge file touched
