 unlock_feudal_levy_advance_desc: "$a_feudal_levy_desc$"
 unlock_footmen_advance: "$a_footmen$"
 unlock_footmen_advance_desc: "$a_footmen_desc$"
 unlock_horsemen_advance: "$a_horsemen$"
 unlock_horsemen_advance_desc: "$a_horsemen_desc$"
 unlock_traditional_galley_advance: "$n_traditional_galley$"
 unlock_traditional_galley_advance_desc: "$n_traditional_galley_desc$"
 windmills_advance: "$windmill$"
 windmills_advance_desc: "$windmill_desc$"
 #Legalism Institution
 codified_laws: "成文法"
 codified_laws_desc: "法令和法规是一个运作良好的社会的命脉。如果我们要提高效率和内部能力，一套强有力的成文法至关重要。"
 hospital_advance: "医院"
 hospital_advance_desc: "医院最早建立于中世纪，为病人、穷人和残疾人提供护理。通常由宗教团体运营，这些医院提供一系列医疗服务，包括基本的护理、草药治疗，最终发展出外科手术。它们通常位于教堂或修道院附近，并为男性和女性设置了不同的病房。尽管医疗知识有限，这些医院在历史上的艰难时期为有需要的人提供了庇护、安慰以及某种形式的医疗。"
 legalism_advance: "律法主义"
 legalism_advance_desc: "法律和规则如果不被编纂、标准化，并被社会成员所理解，那么它们毫无意义。待我们执行这些法律，自由与正义的规则将触及我们国土的每一个角落。"
 medieval_administration: "中世纪行政"
 medieval_administration_desc: "随着军事精英统治了我们的社会，下一阶段的发展就是文官阶层的诞生。通常这些人都是从神职人员的行列中选出的。"
 pest_house_advance: "$pest_house$"
 pest_house_advance_desc: "$pest_house_desc$"
 written_alphabet: "文字"
 written_alphabet_desc: "一个民族是他们传承的总和，因此，文字只是宣称不朽和教育一个运转良好的社会的第一步。"
 #Meritocracy Institution
 abacus_advance: "算盘"
 abacus_advance_desc: "虽说算盘流传已久，遍及寰宇，然而精准的会计工具与完善的分类账簿，才是我们掌握国库金银的关键所在。倘若缺少这些工具，或无能工巧匠运用之，国家之富，终将难以尽显。"
 educated_bureaucrats: "学而从仕"
 educated_bureaucrats_desc: "执掌政务的官员皆非世袭而来的庸碌之辈，而是凭借才学与功绩脱颖而出的优秀人才。这般选贤任能的治理之道，使我们的政府较之他国，必能以更高效率、更优成效开展各项事务。"
 efficient_bureaucracy: "机务如流"
 efficient_bureaucracy_desc: "官僚体系犹如行政机构的命脉，唯有选拔德才兼备、恪尽职守的官员，方能确保国家机器高效运转。"
 efficient_logistics: "高效驿传"
 efficient_logistics_desc: "完善的物流和通信系统是我们有效治理所有领土的关键。为了保证省份和各任命总督之间信息能够及时往来，我们需要建立完善的道路网络，以供信使通行。"
 government_sanctioned_celebrations: "官营庆典"
 government_sanctioned_celebrations_desc: "我国民众总是热切期盼庆祝国家喜事或重要节日。与其让他们自行庆祝，不如由政府组织这些庆祝活动，这不仅可以向民众表达我们的关怀，更能增强他们的团结意识。"
 ledgers_double_checking: "分账审计"
 ledgers_double_checking_desc: "正是会计工作缺乏严谨性，使得腐败得以滋生，并从内部腐蚀国家。为避免这种对我们行政管理的威胁，我们必须确保国库的任何变动都得到妥善核算。"
 meritocracy_advance: "任人唯贤"
 meritocracy_advance_desc: "才能并非社会上层专有，而是随处可见，甚至在最卑微的人身上也能发现。通过设立标准化考试来衡量才能、努力和整体能力，我们可以发现那些隐藏在众目睽睽之下的瑰宝，为我们国家的美好未来服务。"
 non_inheritable_offices: "非世袭官僚"
 non_inheritable_offices_desc: "子承父职弊害我朝政，致使惰政腐败蔓延于各级官署。所有官职都应授予能够胜任者，而非论资排辈。"
 power_projection_advance_1: "古典帝国野心"
 power_projection_advance_1_desc: "在中世纪鼎盛时期，随着国家的发展和巩固，他们的野心也在增长，并试图在他们的区域建立和重建帝国。"
 province_governors: "省级官僚"
 province_governors_desc: "我邦各省并非由地方势力或任何野心勃勃的地方贵族进行自治，而是由中央政府委派的总督负责，以扩张我邦的统治，遍及全国各地。"
 right_to_rule: "粉饰统治"
 right_to_rule_desc: "我方行政体制的根本在于，将人才安排至与其能力相符的职位。因此，统治者理应是最有才能之人，方能胜任统领全国之责。倘若统治者有所不足，则需倚重能够“美化”现实之人，无论是通过宏伟的雕像、令人惊叹的绘画，抑或气势恢宏的诗篇。"
 smooth_administration: "平稳治理"
 smooth_administration_desc: "拥有由最优秀和最合适的人才组成的政府，能够确保国家平稳运行，权力有效运转，不受外部环境的影响。"
 talented_traders: "通商人才"
 talented_traders_desc: "我们的行政部门人才济济，负责全国货物和货币流通的人员也应如此。由最优秀的人才负责贸易运营，将确保产品和利益的持续流动。"
 temporary_appointments: "流动任命"
 temporary_appointments_desc: "终身制的宫廷职位存在着固有的风险：他们任职时间越长，积累的权力和影响力就越大，而且由于工作过于程式化，可能会减少工作投入。与其如此，不如建立一个流动任命制度，根据官员的资历安排其担任最合适的职位，并在他们开始懈怠工作时将其调任其他职位。"
 #No Institution
 army_country_casus_belli_advance: "编织战端"
 army_country_casus_belli_advance_desc: "我们的专业外交官和职业间谍创造虚假但可信场景的能力，使我们能够创造虚假借口，在国际舞台上为几乎任何行动辩护。"
 army_country_integration_speed_advance: "尊重地方政府"
 army_country_integration_speed_advance_desc: "我们的人民是令人畏惧的战争狂，他们希望将自己的影响传播到世界的每个角落。为了整合和管理我们日益扩大的领域，我们选择尊重那些被征服地区当地人的行为方式。"
 army_initiative_ren: "先发制人"
 army_initiative_ren_desc: "出其不意的袭击与先发制人有时决定了武装冲突的胜负。确保我军的战斗主动性，是我们维持竞争优势的良策。"
 blockade_tactics: "封锁战术"
 blockade_tactics_desc: "在敌方港口外部署适当的舰队和巡逻任务，将大大提升我们切断其补给线的效率，从而缩短围攻战的时间。"
 construction_speed_renaissance: "石匠行会"
 construction_speed_renaissance_desc: "自由石匠通过行会组织世代相传，以资深匠人指导年轻学徒的传承体系，确保了建筑技艺的薪火相传。"
 food_advance_renaissance: "精耕农业"
 food_advance_renaissance_desc: "自有记录以来，农业一直是大多数社会的基础。近年来，一系列技术进步正在发展，改善了我们田地和农场的生产力，并带来了更多的粮食盈余。"
 fort_limit_2_advance: "边境戍卫官"
 fort_limit_2_advance_desc: "边境戍卫官负责统筹协调沿线各堡垒，构建补给线路与情报网络，并推动形成要塞联防体系。"
 global_burghers_max_literacy_advance: "市民文学"
 global_burghers_max_literacy_advance_desc: "市民们依靠技能和能力来致富，而这些能力又依赖于某些知识领域的良好教育。随着经济进步带来的财富增加，市民对于能提升书面文化的文学作品的需求日益增加。"
 global_clergy_max_literacy_advance: "宗教文学"
 global_clergy_max_literacy_advance_desc: "神职人员因职业性质必须具备读写能力，他们的工作需要学习、诠释和传播宗教教义。因此，他们的灵修养成很大程度上依赖于接触宗教教义与训导的著作。"
 global_nobles_max_literacy_advance: "贵族文学"
 global_nobles_max_literacy_advance_desc: "贵族们愈发重视文学技能，因为他们逐渐从高贵的战士转型为宫廷中的臣仆。这种变化产生了对于能满足他们品味的文学作品的需求。"
 global_supply_limit_modifier_advance_2: "供给线"
 global_supply_limit_modifier_advance_2_desc: "陆地战争越来越依赖于为我们日益庞大的军队提供补给。因此，更好地组织补给车队将意味着更强大的作战能力。"
 grant_privilege_cost_modifier_renaissance_advance: "特权与义务的成文法"
 grant_privilege_cost_modifier_renaissance_advance_desc: "将每个阶层充当的社会角色写入宫廷条文中，将使授予新特权的过程更加顺利，同时避免各阶层之间的敌对。"
 improve_relation_impact_renaissance: "奇异的外交礼物"
 improve_relation_impact_renaissance_desc: "自古以来，外交礼物一直是常用手段，通过强调对方的高贵地位来说服外国统治者在某些问题上达成共识。礼物可以从各种奢侈品到长颈鹿或大象等活体动物不等。"
 land_morale_recovery_renaissance_advance: "有序行军"
 land_morale_recovery_renaissance_advance_desc: "随着对于征召兵的依赖减少，陆军管理变得日益复杂。其中一个关键方面是在行军时更好地组织军队，这使得部队在战斗来临时准备更充分、更具备作战能力。"
 late_feudal_relations: "晚期封建关系"
 late_feudal_relations_desc: "封建制度基于不同等级的贵族向各自领主提供#italic 协助#!和#italic 建议#!的概念，形成了一个历经时代发展的等级制度。"
 law_making_renaissance: "审查法律"
 law_making_renaissance_desc: "新时期带来了新情况，传统法律并不总适用于这些新情境。我们需对法律进行持续审查和修订，以适应我们现今的时代。"
 medieval_military: "中世纪晚期军事"
 medieval_military_desc: "中世纪末期，陆军向着职业化、组织化发展。更先进的体制被建立，以用来更好地支持由征召兵与职业军人组成的混编部队，这种搭配正逐渐成为战场上的主流。步兵正缓慢而稳定地缩减着与骑兵的战力差距。"
 merchant_power_from_maritime_renaissance_advance: "商人合伙"
 merchant_power_from_maritime_renaissance_advance_desc: "长途贸易的增长促使商人创新出新的合伙模式以实现最大收益。最常见的模式是一方投资长途商贸所需的资金，另一方负责远行和运输商品，归来后共同出售。"
 minting_income_factor_building: "货币所有权"
 minting_income_factor_building_desc: "流通的货币有许多种，但印有我们印记的货币已经被广泛接受和认可，并赢得了人们的信任。"
 national_assemblies_advance: "全民集会"
 national_assemblies_advance_desc: "$national_assemblies_desc$"
 naval_initiative_ren: "部署战术"
 naval_initiative_ren_desc: "胜利的关键在于迅速动员与主动出击。部署策略的研究和实施将帮助我们实现这一目标。"
 naval_morale_advance_1: "中世纪航海"
 naval_morale_advance_1_desc: "近年来在航海领域取得的进步提高了我们水手的专业技能和信心，使他们能够自信地在近海水域航行。"
 naval_repair_ren: "更紧密的接缝"
 naval_repair_ren_desc: "众所周知，船体一旦有破洞便会导致沉没。通过改进造船技术，使船体木板更加紧密结合，不仅有助于使船只更不容易漏水，也便于在船体受损时堵塞任何漏洞。"
 recovery_efforts: "重建工作"
 recovery_efforts_desc: "战争是一位残酷的主宰，留给我们的仅有废墟与毁灭。通过集中力量帮助人民，我们可以加速全国范围的重建进程。"
 renaissance_city_rights: "正式城市自治权"
 renaissance_city_rights_desc: "确立规定城市自治权的授予仅由统治者掌控，将使我们更加清晰地掌握国家状况。"
 renaissance_development: "学术论文"
 renaissance_development_desc: "思想、艺术和科学的时代将带来新的发现和发明浪潮，使我们能够更好地吸收外来制度。"
 renaissance_subject_opinions_advance: "文化宗主权"
 renaissance_subject_opinions_advance_desc: "近年来，基于人类和自然重要性的文化和思想问题得到了广泛传播。这不仅适用于我们的人民，也适用于那些宣誓效忠于我们的人，使这种文化成为一种新的外交工具。"
 renaissance_urbanisation: "复兴城市规划"
 renaissance_urbanisation_desc: "在规划过程中专门预留资源开发的专用区域，将使我们的城市中心能够生产出比以前更多的商品。"
 rgo_build_time_advance: "文艺复兴建筑技艺"
 rgo_build_time_advance_desc: "昔日的伟大建筑和基础设施工程，仍然骄傲地屹立着。不可否认，用于设计和建造它们的建筑技术是复杂且发达的。加以研究，我们仍然可以学到很多东西。"
 rgo_construction_ren: "基础设施建设"
 rgo_construction_ren_desc: "我们的土地和人民是我们国家的命脉。适当的基础设施建设努力不仅造福百姓，也将十倍回馈我们。"
 rgo_size_advance_renaissance: "磨坊"
 rgo_size_advance_renaissance_desc: "磨坊自几个世纪前被发现以来一直在使用。然而，我们现在能够开发出更现代、更高效的用于收集原材料的风力和水力磨坊。"
 subject_integration: "头衔整合"
 subject_integration_desc: "多国臣服我国虽然有其助益，但是只有将他们零零总总的头衔整合进我国，我们才能真正从他们的土地上受益。最终，我国的统治者独享众多头衔，那些只有单个头衔的统治者将无力与我们相比。"
 trade_center_building_country_advance: "商业中心"
 trade_center_building_country_advance_desc: "通过巧妙的技术，我们可以轻松使我们控制的市场对外国商人更具吸引力，从而增加我们获得的收入。"
 unlock_m_galley_advance: "$n_mediterrannean_galley$"
 unlock_m_galley_advance_desc: "$n_mediterrannean_galley_desc$"
 unlock_peasant_levy_advance: "$a_peasant_levy$"
 unlock_peasant_levy_advance_desc: "$a_peasant_levy_desc$"
 war_no_cb_cost_modifier_renaissance_advance: "持续战争"
 war_no_cb_cost_modifier_renaissance_advance_desc: "战争的性质随参战国家的变化而改变。各国不断增强的实力使它们能够发动更长时间的战争，国家间的战争也因此愈发频繁。"
 #Banking Institution
 banking_advance: "银行系统"
 banking_advance_desc: "借贷自古有之，但并非没有风险。我们可以将这些行为制度化，使借贷在受控和公平的方式下进行。"
 bureaucracy_law_advance: "$bureaucracy_law$"
 bureaucracy_law_advance_desc: "$bureaucracy_law_desc$"
 counting_house_advance: "会计室"
 counting_house_advance_desc: "$counting_house_desc$"
 diplomatic_range_age_1: "驻外使节"
 diplomatic_range_age_1_desc: "国家之间的外交一直很重要。然而，外交关系正在变得更加频繁和复杂，派遣使节远赴海外，以扩大我国的对外关系，也变得越来越普遍。"
 dock_advance: "船坞"
 dock_advance_desc: "$dock_desc$"
 entrepot_advance: "货栈"
 entrepot_advance_desc: "$entrepot_desc$"
 infiltrate_administration_advance: "渗透行政系统"
 infiltrate_administration_advance_desc: "国家之间的冲突不仅在战场上进行，也在暗中较量。了解敌人的下一步行动是赢得战争的宝贵财富。因而，我国的间谍将专注于渗透国家的行政系统，并将任何信息传回我国。"
 infiltrate_administration: "[infiltrate_administration|e]"
 maritime_advance_age_2: "贸易舰队"
 maritime_advance_age_2_desc: "随着商业的发展，人们需要更快、更高效地运输更多货物。因此，那些投资于海上贸易的人都会不惜一切代价，在力所能及的范围内组建更大的船队。"
 merchants_and_trade: "商人与贸易"
 merchants_and_trade_desc: "可能是因为瘟疫和流行病的影响，贸易格局受到了严重的破坏。现在贸易正慢慢开始复苏。"
 paper_guild_cloth_maintenance_advance: "$paper_guild_cloth_maintenance$"
 paper_guild_cloth_maintenance_advance_desc: "$paper_guild_cloth_maintenance$由不适用于纺织品的棉花制成，在质量和耐用性方面树立了新的标准。"
 pop_promote_actions_advance: "社会阶梯"
 pop_promote_actions_advance_desc: "人们常说，混乱是阶梯，使人攀登社会地位。而在我们这里，这架阶梯并非源自混乱，而是源于秩序。我们已系统化了一套让人民通过自身努力提高社会地位的方法，我们甚至鼓励这样做。"
 pop_promotion_speed_age_2: "良性社会升迁"
 pop_promotion_speed_age_2_desc: "摆脱贫困并攀登社会阶梯是大多数农民的梦想，这在我们的社会中已成为现实。通过奖励勤奋工作、严谨细致和正确体现我们的理想的人们，我们将永远不会缺乏有能力和有影响力的人才。"
 pound_lock_canals_advance: "船闸运河"
 pound_lock_canals_advance_desc: "为引导财富、获取食物以及改善货物流通而开凿大地，这一行为早已为我们的民众所熟知。“斜接闸”的发明将有助于为我们的人民提供发展与繁荣所需的条件。"
 protected_harbor_advance: "$protected_harbor$"
 protected_harbor_advance_desc: "$protected_harbor_desc$"
 rebellion_support: "秘密接触"
 rebellion_support_desc: "时局动荡，世界各国民心难安。我们同国外这些不满的团体联系，或可将其转为己用，说服这些人发动叛乱，借此削弱敌国。"
 supportrebels: "[support_rebels|e]"
 rudimentary_coastal_ship_repair: "临时维修"
 rudimentary_coastal_ship_repair_desc: "船只在航行过程中难免会出现老化。海浪的拍打和海水的侵蚀日积月累，无论船只建造得多么精良，都会对船体和缆绳造成损害。为了缓解这种情况，水手们习惯于对船只进行定期维护，使其保持最佳工作状态，当船只受到较大损坏时，甚至能够使其保持漂浮状态，直到抵达安全的港口。"
 spy_construction_renaissance: "情报网络"
 spy_construction_renaissance_desc: "历史上的帝国都广泛使用间谍来获取内部和外部威胁的情报。蒙古人深谙此道，当时他们利用间谍活动来为军事行动做准备并确保成功。"
 standardized_coins: "标准化货币"
 standardized_coins_desc: "随着财富的创造，越来越多的铸币厂出现。尽管我们多年来使用了多种货币，但必须制定新标准，以避免因使用较少贵金属含量的货币，或磨损硬币边缘而导致的欺诈行为。"
 trade_range_advance_age_2: "远海市场"
 trade_range_advance_age_2_desc: "经济增长，出现新机遇。以前短途航线非常有利可图，但现在长途航线带来更多利润。我们的商船现在驶向更远的地方，寻找最好的生意。"
 unlock_barque_advance: "$n_barque$"
 unlock_barque_advance_desc: "$n_barque_desc$"
 unlock_early_carrack_advance: "$n_early_carrack$"
 unlock_early_carrack_advance_desc: "$n_early_carrack_desc$"
 unlock_hulk_advance: "$n_hulk$"
 unlock_hulk_advance_desc: "$n_hulk_desc$"
 #Professional Armies Institution
 armory_advance: "军械站"
 armory_advance_desc: "$armory_desc$"
 cannon_maker_advance: "$cannon_maker$"
 cannon_maker_advance_desc: "$cannon_maker_desc$"
 coastal_fort_advance: "岸防工事"
 coastal_fort_advance_desc: "$coastal_fort_desc$"
 correct_box_advance_renaissance: "校级军官"
 correct_box_advance_renaissance_desc: "职业军队的发展促使各部队出现了校级军官，这是由统治者直接委任的职位。"
 drill_army_advance: "操练军队"
 drill_army_advance_desc: "我们不再依赖缺乏操练的、临时征召的士兵。如果我们要保卫边疆并击败敌人，就必须进行有组织的定期操练。"
 gun_smith_advance: "火枪铺"
 gun_smith_advance_desc: "$gun_smith_desc$"
 gunpowder_advance: "火药"
 gunpowder_advance_desc: "在战场上使用火药肯定会对我们的表现产生积极影响，并使我们在交战中脱颖而出。"
 professional_armies_advance: "职业军队"
 professional_armies_advance_desc: "我们的军队现代化，在很大程度上依赖于我们的征兵和组织中心的运作。我们必须努力保持强大而不含糊的军事组织，减少浪费和冗余。"
 recruitment_improvements_renaissance: "有组织征募"
 recruitment_improvements_renaissance_desc: "职业军队的发展提高了军事能力。为了维持这种能力，国家还需要提高士兵招募数量的上限。"
 recruitment_law_advance: "$recruitment_law$"
 recruitment_law_advance_desc: "$recruitment_law_desc$"
 mercenary_market_law_advance: "$mercenary_market_law$"
 mercenary_market_law_advance_desc: "$mercenary_market_law_desc$"
 regiment_reinforcement_speed_renaissance: "常备军野战培训"
 regiment_reinforcement_speed_renaissance_desc: "职业军队正在改变战争的方式，它现在是长期服役的常设单位。保持训练有素的士兵定期进入这些部队是一项挑战，但这对他们的运作非常必要。"
 slave_center_advance: "$slave_center$"
 slave_center_advance_desc: "对本国债务奴隶的适当管理对于保持人民的持续富裕至关重要。"
 supply_depot_advance_age_2_renaissance: "补给站"
 supply_depot_advance_age_2_renaissance_desc: "没有补给，军队无法生存。建立专门提供补给的常设供应仓库可以确保补给线得到持续补充，使我们的军队始终保持最佳状态。"
 unlock_cavalry_advance: "$a_cavalrymen$"
 unlock_cavalry_advance_desc: "$a_cavalrymen_desc$"
 unlock_crossbowmen_advance: "$a_crossbowmen$"
 unlock_crossbowmen_advance_desc: "$a_crossbowmen_desc$"
 unlock_handgonners_advance: "$a_handgonners$"
 unlock_handgonners_advance_desc: "$a_handgonners_desc$"
 unlock_heavy_cavalry_advance: "$a_heavy_cavalrymen$"
 unlock_heavy_cavalry_advance_desc: "$a_heavy_cavalrymen_desc$"
 unlock_houfnice_advance: "$a_houfnice$"
 unlock_houfnice_advance_desc: "$a_houfnice_desc$"
 unlock_men_at_arms_advance: "$a_men_at_arms$"
 unlock_men_at_arms_advance_desc: "$a_men_at_arms_desc$"
 unlock_supply_carts: "$a_supply_carts$"
 unlock_supply_carts_desc: "$a_supply_carts_desc$"
 #Renaissance Institution
 anatomy_advance: "人体解剖"
 anatomy_advance_desc: "医生们对人体解剖学有了更深入的了解，这会促进更有效的伤病治疗。这些知识主要来自于对人类尸体的实际解剖，也有助于改进外科技术，并降低医疗程序的风险。"
 art_school_advance: "艺术学校"
 art_school_advance_desc: "只有艺术学校的精心培育，才能锤炼出精湛的艺术技艺和优秀的艺术家。这为有天赋的个人提供了开启职业生涯的平台，并且能为我们的名誉带来荣耀和辉煌！"
 chancery_records: "秘书室档案馆"
 chancery_records_desc: "随着秘书室机构的发展，它们的官僚体系变得更加复杂，管理难度增加，因此需要更高级别的行政机构。于是，秘书室档案馆出现了，它用于保存收到的所有信件以及文吏和书记员签发的所有文件的副本。"
 crown_power_advance_renaissance: "元首"
 crown_power_advance_renaissance_desc: "传统的治理方式是基于统治者处理国家不同阶层的能力。然而，现代政府理论确立了统治者在本国的元首地位，我们将不再屈服于其他世俗权力。"
 early_council_hall_advance: "$early_council_hall$"
 early_council_hall_advance_desc: "$early_council_hall_desc$"
 government_size_renaissance: "常设内阁"
 government_size_renaissance_desc: "传统上，统治者有一个顾问团，他们在战争与和平方面的决策提供建议。如今，我国的政府变得如此复杂，我们需要一些更为固定的职位来帮助处理日常治理。"
 nobles_rights_laws_advance: "$nobles_rights_laws$"
 nobles_rights_laws_advance_desc: "$nobles_rights_laws_desc$"
 patron_of_art: "赞助艺术"
 patron_of_art_desc: "我们从此将开始追求建立文化昌盛的社会，我们的艺术巨作将万古流传，成为这一世代的人间奇迹。"
 power_projection_advance_2: "跨国境强权野心"
 power_projection_advance_2_desc: "尽管关于建立帝国的旧观念仍然存在于这个时代统治者的心中，但他们也开始逐渐形成新的方式来确立对其他国家和民族的支配地位。"
 renaissance_advance: "文艺复兴"
 renaissance_advance_desc: "我们必须利用并运用遍布我们领土的创新思想和发现，才能保持在技术创新的前沿。"
 renaissance_court: "文艺复兴宫廷"
 renaissance_court_desc: "文艺复兴广泛传播，因此我们的宫廷如今应当充满敬业的艺术家与学者，追求创作最辉煌的作品。"
 renaissance_sculptures: "$renaissance$石雕"
 renaissance_sculptures_desc: "$renaissance$的兴起带来了对各种艺术形式的更大兴趣。如今，似乎谁的宅邸没有一件艺术品装饰，就不算是体面之人。雕塑是民众间最盛行的艺术表现形式之一，这促使许多采石场出现与扩张，以便向追求艺术的人们供应各种石材。"
 renaissance_thought: "文艺复兴思想"
 renaissance_thought_desc: "贵族寡头统治社会的观念从罗马时代就已经出现，并且在某些地方很受欢迎。现在，这个观念重新在那些与之有关的阶层中兴起。"
 theater_advance: "剧场"
 theater_advance_desc: "$theater_desc$"
 university_advance: "大学"
 university_advance_desc: "$university_desc$"
 vibrant_court_advance: "活跃宫廷"
 vibrant_court_advance_desc: "来自已知世界各地的杰出人才涌向我们的宫廷，带来了多样的时尚和语言。结果，我们变得更加适应他们的外来“礼仪”。"
 #Choice ADM
 benefits_for_mercenaries: "优待佣兵"
 benefits_for_mercenaries_desc: "佣兵总是会去寻找最划算的交易，因此我们得保证佣兵一直站在我们这边。只要对我们的佣兵多加关照，就能使他们长久效力，而且所需的薪资也更低。"
 church_attendance_duty: "义务性宗教活动"
 church_attendance_duty_desc: "通过制定强制性参与宗教活动的政策，我们官方信仰的权威得到维护，对宗教活动的管理得到加强，维护了社会秩序的稳定。"
 court_accounting: "宫廷会计制度"
 court_accounting_desc: "宫廷是国家的象征，它的繁荣应代表国家的繁荣。然而，这并不意味着宫廷可以超出国家财力肆意挥霍，必须有相应的会计制度监督宫廷开销。"
 debt_and_loans: "信托借贷"
 debt_and_loans_desc: "负债有时是不可避免的，然而，一个有序的信托市场会允许我们进行贷款，并享受较低的利率。"
 deus_vult: "神的旨意"
 deus_vult_desc: "遵循圣战的号召，循“神的旨意”击溃异教徒。"
 early_anti_piracy_warfare: "反海盗联盟"
 early_anti_piracy_warfare_desc: "在开展贸易和维持经济的水域，海盗、土匪和强盗的激增迫使我们的商人们联合起来，成立商会联盟，以便在长途航行中保护自己的船只。"
 empiricism: "经验主义"
 empiricism_desc: "事物之所以存在，是因为我们能够感知、看见并通过感官体验它们。正是通过利用这些经验证据，我们得出了新的想法。"
 innovativeness: "求知若渴"
 innovativeness_desc: "天生的好奇心和了解世界及其运作方式的愿望是推动我们前进的动力。我们的人民有求知欲，正是他们心中的火花将激起我们国家的进步。"
 organised_mercenary_recruitment: "佣兵招募"
 organised_mercenary_recruitment_desc: "招募佣兵时，金钱不是唯一的瓶颈。另一个瓶颈是是否有真正希望为我们服务的佣兵组织。因此，我们的系统必须确保所有的组织都能加入进来。"
 state_efficiency: "地方基建"
 state_efficiency_desc: "尽管我们关注的是全国范围内的事务，但我们绝不能忽视照顾地方立法者和执行官。"
 #Choice DIP
 benign_diplomats: "和善的外交官"
 benign_diplomats_desc: "外交是一门复杂的艺术。光擅长语言是不够的，因为整体的仪态和举止也对语言本身的解释至关重要。我们的外交工作要注重给人以友好的印象，这样才能确保我们被其他国家更为看好。"
 claim_fabrication: "伪造宣称"
 claim_fabrication_desc: "宣布某物属于自己非常容易，但要让每个人都信服你的这种占有权就非常难了。通过广泛地铺设外交网络，我们可以清楚地知道，谁会对你的这种占有权表示出浓厚的兴趣。"
 experienced_diplomats: "老练的外交官"
 experienced_diplomats_desc: "有时，要让人们相信我们的强大是很简单的。我们已经通过外交上的努力而让我们的发言在世界上更有分量。"
 influence: "外交施压"
 influence_desc: "结束一场战争需要双方进行谈判，有时对方表现得太顽固，不愿接受失败。在这种情况下，运用外交压力并提醒它即将灭亡，足以促使它接受我们的慷慨条件。"
 integrated_elites: "整合精英"
 integrated_elites_desc: "通过将我们属国中的统治阶层精英整合到我们的政府中，我们可以平滑而效果显著地整合他们的领土。"
 marcher_lords: "边疆领主"
 marcher_lords_desc: "通过给予那些在边界的封臣们高度自治权，这些“边疆领主”们将会在战争时提供更多的人力。"
 merchant_traditions: "商人传统"
 merchant_traditions_desc: "贸易和商业是经济的命脉，它们的流动是健康经济的保障。鉴于我们的商人注重保持贸易畅通，我们自行可以建立活跃商业的传统和声誉，使我们更容易吸引外国商贸。"
 privateers: "私掠者"
 privateers_desc: "狠狠打击敌方的商业运转会帮助我们奏响胜利的号角。我们应当鼓励船长们去主动袭击敌方的贸易航路。"
 shrewd_commerce_practice: "精明商业"
 shrewd_commerce_practice_desc: "使我们的商人具有更强的业务素质，压倒竞争对手。"
 tribute_system: "贡金体系"
 tribute_system_desc: "通过建立一个正式的附庸岁贡体系来加强我们的收入。"
 #Choice MIL
 battlefield_commisions: "战场委任制度"
 battlefield_commisions_desc: "使我们能够专注于陆军科技进步，提升陆军传统。"
 boarding_parties: "强行登船队"
 boarding_parties_desc: "通过教导我们的海军军官去领导登上敌船的行动，我们甚至在面对优秀的敌方[navies|e]时也能取得优势。"
 enforced_service: "强制征兵"
 enforced_service_desc: "志愿兵役制有效地稳固了我们军队的构成，但志愿兵的数量有时会显得不足，我们应当强征一些“志愿者”了。"
 finest_of_horses: "优良马匹"
 finest_of_horses_desc: "多么坚不可摧的部队！多么威武雄壮的骑兵！看那些灰色的壮马，那优秀的骑士又是何人？这是一支多么强大的部队。"
 glorious_arms: "陆军荣耀"
 glorious_arms_desc: "使我们的陆军获得无可匹敌的荣耀与威名，令所有敌人心怀恐惧。"
 marine_regiments: "海军陆战队"
 marine_regiments_desc: "海军陆战队是专门从事两栖作战的军事单位，既可突袭海岸、登上敌方船只，也可以参与陆地战斗。"
 naval_glory: "海军荣耀"
 naval_glory_desc: "我们的舰队无可匹敌的荣耀与威名将令所有敌人心怀恐惧。"
 open_levy_standards: "降低征召兵标准"
 open_levy_standards_desc: "凭借什么才使人有资格为国而战？信仰，或是对家族的忠诚？然而，唯一的正确答案是我们不能有所例外。每个人都有义务在我国的旗帜下服役。"
 regular_levy_training: "指定训练"
 regular_levy_training_desc: "征召兵在定义上并非精兵，但这并不意味着我们要把一群未经训练的民众送上战场。从我们最精良的部队挑选出教官，为他们提供强制训练期，将使他们脱胎换骨，成真正的战士。"
 tolerance_idea: "宽容理念"
 tolerance_idea_desc: "每个人都被创造为与造物主平等，因此我们理解他们的信仰，即使是错误的，也可以被接受为最终皈依唯一真正信仰的一种手段。"
 #No Institution
 army_country_diplo_range_advance: "武装使节"
 army_country_diplo_range_advance_desc: "我们的军队远近闻名。尽管有这样的声誉，我们还是应该与有相同目标的国家建立外交关系：摧毁我们共同的敌人。通过派遣武装精良且有护卫的使节到外国宫廷，如此，我们可以确保我们的外交影响不会因暴力事件爆发而受到影响。"
 army_country_looting_advance: "骄傲的掠夺者"
 army_country_looting_advance_desc: "掠夺和抢劫几乎是我们军队维持生存的基础。无论我军走到哪里，他们都会尽可能地掠夺。"
 construction_center_advance: "$construction_center$"
 construction_center_advance_desc: "$construction_center_desc$"
 dry_dock_advance: "干船坞"
 dry_dock_advance_desc: "$dry_dock_desc$"
 export_building_country_advance: "灵活清关"
 export_building_country_advance_desc: "我们的海关官员在监督和征税离港货物方面变得更加精明。通过加强对经由我方市场贸易的外国商人的管控，我们使其他国家更难从我们所掌控的领域中高效出口货物。"
 foreign_cultural_law_advance: "$foreign_cultural_law$"
 foreign_cultural_law_advance_desc: "$foreign_cultural_law_desc$"
 house_of_parliament_advance: "$house_of_parliament$"
 house_of_parliament_advance_desc: "$house_of_parliament_desc$"
 local_governor_advance: "$local_governor$"
 local_governor_advance_desc: "$local_governor_desc$"
 merchants_quarters_advance: "商人会馆"
 merchants_quarters_advance_desc: "$merchants_quarters_desc$"
 minting_trade_range_disc_building: "扩建的贸易仓库"
 minting_trade_range_disc_building_desc: "在规划我们的贸易活动时，必须考虑到国际贸易日益增长的需求。随着我们贸易仓库的扩建，我们可以到达新的海岸，而不必冒着损失珍贵货物的风险。"
 unlock_carrack_advance: "$n_carrack$"
 unlock_carrack_advance_desc: "$n_carrack_desc$"
 unlock_flute_advance: "$n_flute$"
 unlock_flute_advance_desc: "$n_flute_desc$"
 #New World Institution
 arts_academy_advance: "$arts_academy$"
 arts_academy_advance_desc: "艺术是人类的生命之气，它将世界从平淡的存在变成充满奇迹和可能性的生动画布。我们必须在民众中培养对艺术更大的好奇心。"
 beat_to_windward_advance: "逆风前进！"
 beat_to_windward_advance_desc: "装备有大三角帆的轻便帆船具有高度的机动性，使其能够轻松地逆风行驶。这使得在不利天气和敌对海域中的航行更加迅速。"
 blast_furnace: "高炉" #Age of Discovery
 blast_furnace_desc: "高炉通过重新熔炼不同成分的铁、钢、石灰石和木炭，能进一步将生铁精炼为铸铁，这是一种比传统冶金更昂贵的工艺。用这种方法将铸铁制成熟铁，是制造大炮等更复杂产品的绝佳材料。"
 burghers_rights_laws_advance: "$burghers_rights_laws$"
 burghers_rights_laws_advance_desc: "$burghers_rights_laws_desc$"
 coastal_trade_routes_advance: "沿海扩张"
 coastal_trade_routes_advance_desc: "任何船只最安全的方式就是靠近海岸航行。除非它们必须穿越大海，否则没有必要远离海岸失去保护，而且这仍然比陆路更快。因此，我们促进船只沿着海岸线稳定往来，将使货物和人员的流通更加便捷。"
 colonial_administration_advance: "$colonial_administration$"
 colonial_administration_advance_desc: "$colonial_administration_desc$"
 colonial_charters: "殖民特许状"
 colonial_charter_progress_tt_title: "特许殖民地进度"
 colonial_charters_desc: "这些新文件将确保我们国家的人民在新大陆未开垦的土地上的开拓权，并赋予殖民地治理新土地的专有权，同时规范他们与本土的关系。"
 colonial_policy_advance: "殖民政策"
 colonial_policy_advance_desc: "我们人民正在殖民的新土地和边境地区，需要新的管理和组织形式来管理定居点。"
 construction_speed_discovery: "标准化建材"
 construction_speed_discovery_desc: "运用近代工艺实现板材与砖块的规格标准化，从而大幅提升建筑施工的便捷性与作业效率。"
 diplomatic_range_age_2: "外交网络"
 diplomatic_range_age_2_desc: "通过在我国周围维持良好和成熟的外交网络，我们可以利用它向更远的国家派遣使节。"
 exploration_maintenance_advance: "坚固结构"
 exploration_maintenance_advance_desc: "造船时的关键是要有抵抗恶劣天气和海浪冲击的能力。通过开发更坚固的造船技艺，我们可以确保船只能够航行更久。"
 explorer_commisions_advance: "任命探险家"
 explorer_commisions_advance_desc: "在我们疆土的外，尚有未经开拓的广袤土地，等待我们占据！招募勇敢的探险家，向未知进发，这对我们而言是一个利润丰厚、至关重要的机会。"
 green_vitriol: "绿矾"
 green_vitriol_desc: "尽管严格来说与$alum$并非同一种物质，$green_vitriol$在炼金术著作中常与$alum$混用，且二者具有相似性质。因此，用其中一种来替代另一种并不罕见。"
 maritime_advance_age_3: "探索舰队"
 maritime_advance_age_3_desc: "随着对世界和新大陆知识的传播，人们需要了解更多。从东边的广阔海域到西边的新发现海岸，航行面对的风浪越来越大，因此也需要更大的船队来航行。"
 maritime_decay_advance_disc: "既定航线"
 maritime_decay_advance_disc_desc: "商人们不畏风浪，常年穿梭于海上，只为追逐最大利润。这自然而然地让某些航线比其他航线更为成熟且繁忙，而最理想的航线上总是船只往来不绝。"
 merchant_power_from_maritime_discovery_advance: "商人行会"
 merchant_power_from_maritime_discovery_advance_desc: "商人行会使我国商人组织起来，分享有利可图的贸易路线，并在海外市场中联合力量进行买卖交易。"
 native_policy_advance: "原住民政策"
 native_policy_advance_desc: "我们大胆的探险家发现的新土地通常居住着奇特而未开化的族群。现在是时候制定统一的规则，规范我们的军队与这些土地上的原住民之间的接触。"
 naval_ambitions: "海军野心"
 naval_ambitions_desc: "海军士气得到了极大鼓舞，我们的水手将征服风浪和海洋。我们的开拓者会勇敢面对这个世界上的黑暗角落，在远离故土的他乡建立新的家园。"
 new_currency_demands: "新币材的需求"
 new_currency_demands_desc: "新大陆的发现也带来了更多的贸易流动。这反过来又导致对货币需求的上升。虽然由$goods_gold$和$silver$铸造的贵金属货币仍然是主要通用价值，但其他次要金属如$copper$及其合金的使用与流通也日益增加。"
 new_world_advance: "发现新大陆"
 new_world_advance_desc: "正如佛罗伦萨航海家亚美利哥·韦斯普奇所说，哥伦布发现的土地并不是印度，实际上是一个我们祖先所未知的全新世界，等着被绘制地图和占领。"
 new_world_crops: "新大陆作物"
 new_world_crops_desc: "新大陆富饶的土地为我们的国家提供了许多宝藏，其中最大的宝藏之一，是由当地原住民作为食物和香料种植的奇异无比的植物。将这些作物引入我们的农田，将为我们的民众提供他们渴望的多样性和新鲜感。"
 open_sea_exploration: "海外探索"
 open_sea_exploration_desc: "辽阔的海洋给我们带来了巨大的财富和在遥远的海岸进行贸易的新机会。"
 patio_process_advance: "混汞法"
 patio_process_advance_desc: "$patio_process_advance$是一种使用以汞为基础的化学溶液催化混汞反应来提炼低品质银矿和金矿的方法。"
 plantation_buildings_advance: "种植园"
 plantation_buildings_advance_desc: "新大陆温和宜人的气候和广阔肥沃的土地，使殖民地成为生产高利润作物的理想土地，比如糖和烟草。"
 pop_promotion_speed_age_3: "因功晋爵"
 pop_promotion_speed_age_3_desc: "传统上，贵族通过为君主效力的军事服务获得地位。然而，不断发展的国家的需求，要求低阶贵族成员晋升为更高等级，同时包括商人等其他阶层则有资格成为贵族。"
 port_cost_distance_from_capital_advance: "久经风浪的船长"
 port_cost_distance_from_capital_advance_desc: "并非人人都能胜任船长，只有那些经验最为老道、航海技艺登峰造极的佼佼者，才有资格执掌我们的航船。这样的老船长，即便在最狂暴的风暴中，也能带领全船安全返航。"
 repair_at_sea_aod: "职业船员" #Age of Discovery
 repair_at_sea_aod_desc: "尽管造船工艺的最新进步拓展了航海边界，我们还需要训练熟练的船员才能充分利用这些新能力。唯有让他们成为职业的精英水手，方能确保他们正确执行新式船只维护所需的各项任务。"
 rgo_logistics_discovery: "本地仓储"
 rgo_logistics_discovery_desc: "商人与工匠若能就近获取所需产品，不仅可减轻其工作负担，更能有效防止商品价格飞涨。为此，我们将设立仓储配送中心，确保本地供应需求得到充分满足。"
 rgo_size_advance_discovery: "先进开发技术"
 rgo_size_advance_discovery_desc: "各种矿产的发现和新工具的发明为更高效的资源采集和生产线的加速铺平了道路。"
 saiger_process_discovery: "改进熔析精炼法"
 saiger_process_discovery_desc: "革新与作业方式的优化，将有力推动我们的银铅矿业蓬勃发展。"
 send_people_to_colonial_charter_advance: "新丰饶之地"
 send_people_to_colonial_charter_advance_desc: "新土地带来新机会，以及可开发的新资源。鼓励国民在此地定居并开发，将使我们更容易从中获利。"
 send_people_to_the_colonies_advance: "新机遇之邦"
 send_people_to_the_colonies_advance_desc: "一片全新的世界展现在我们眼前，它为人们的想象插上了翅膀，让他们勾画出在新天地中的生活。我们应鼓励这些遐想，美化这些故事，以激励我们的人民争相在这些新的土地上定居。"
 ship_building_techniques_discovery: "改进的造船技术"
 ship_building_techniques_discovery_desc: "新的造船技术将帮助我们更快地建造船只。"
 surgery_advance: "外科手术"
 surgery_advance_desc: "理发外科医生正在开发更复杂的技术来治疗伤病，新的外科器械的开发使手术过程更安全、更有效。结果是，在几年前可能致命的伤病，而现在，这些患者能够存活下来。"
 trade_range_advance_age_3: "先进商船"
 trade_range_advance_age_3_desc: "随着大型船舶的发展，船员更少，航行时间更长，我们的贸易范围将大大增加。"
 trading_hub_advance: "贸易枢纽"
 trading_hub_advance_desc: "$trading_hub_desc$"
 unlock_caravel_advance: "$n_caravel$"
 unlock_caravel_advance_desc: "$n_caravel_desc$"
 unlock_war_galley_advance: "$n_war_galley$"
 unlock_war_galley_advance_desc: "$n_war_galley_desc$"
 #Pike And Shot Institution
 battle_leadership_law_advance: "$battle_leadership_law$"
 battle_leadership_law_advance_desc: "$battle_leadership_law_desc$"
 correct_box_advance_discovery: "尉级士官"
 correct_box_advance_discovery_desc: "随着职业军队的发展，他们的军官领导的队伍越来越大。为了协助他们，中尉负责传达命令，并在战场上领导规模较小的部队。"
 fort_limit_3_advance: "边防司"
 fort_limit_3_advance_desc: "政府将把要塞的监管权收归至首都的官方机构统一管理，使档案文书、资金调拨及维护指令等事务均纳入单一行政部门的统筹范畴。"
 land_morale_attrition_cost_advance: "行军训练"
 land_morale_attrition_cost_advance_desc: "军队常需长途跋涉才能与敌军交锋。因此，长距离行军已成为我们军事训练的重要组成部分，使战士们适应远途跋涉，并确保他们在抵达战场时仍能保持充沛精力。"
 land_morale_movement_cost_advance_disc: "协调行军"
 land_morale_movement_cost_advance_disc_desc: "部队在行军途中最为脆弱，也最易陷入混乱。我们必须让士兵们养成组织严密、步调一致的行军习惯，确保即便遭遇突袭，也能迅速恢复战斗队形。"
 linked_armies_advance: "信息传递"
 linked_armies_advance_desc: "军队各单位的协调对军队的正常运作至关重要。建立完善的信使系统，以便将信息在将领和各部队间传达，将使我军更加紧密协调，并对任何情况作出更迅速的反应。"
 matchlock_gun: "早期猎枪"
 matchlock_gun_desc: "枪匠工艺的改良使猎人获得了更顺手的工具，从而能带回更多毛皮与野味。"
 pike_and_shot_advance: "枪刺与射击"
 pike_and_shot_advance_desc: "一种新的战争形式已经开始发展起来，长枪兵组成方阵，而火绳枪兵则在侧翼和前方展开，并在进入近战阶段时躲在方阵内或后方寻求掩护。"
 pike_square: "长枪方阵"
 pike_square_desc: "在整个中世纪，骑兵的优势地位一直受到训练有素的长矛兵的挑战。在诸如班诺克本或金马刺战役中，骑兵曾被长矛兵击败。结合改进的训练和纪律，并通过增加剑士来提供近距离搏斗支援使得这种编队的效能达到高峰。"
 regiment_reinforcement_speed_discovery: "早期军事后勤"
 regiment_reinforcement_speed_discovery_desc: "战事的一半问题是后勤保障。士兵在战场上作战，他们的武器和盔甲将磨损，并在敌人的攻击下损毁。建立本地供应仓库及其他后勤手段，使我们能够在短时间内为士兵重新配备新武器。"
 standardized_pikes: "制式长枪"
 standardized_pikes_desc: "长枪易于制作，但欲令其发挥最大作用，需整编部队挥舞的长枪有着相仿的长度和枪刃。"
 supply_depot_advance_age_3_discovery: "陆军仓库"
 supply_depot_advance_age_3_discovery_desc: "常备军的发展和部署增加了对武器、制服和其他军事用品的需求，这些物资需要储存在他们的附近。"
 supply_lines: "补给线"
 supply_lines_desc: "职业化军队的发展改变了战争的方式。后勤保障现在至关重要，供应线是确保军队粮草和弹药供给的必要条件。"
 training_fields_advance: "训练场"
 training_fields_advance_desc: "$training_fields_desc$"
 unlock_early_arquebusiers_advance: "$a_early_arquebusiers$"
 unlock_early_arquebusiers_advance_desc: "$a_early_arquebusiers_desc$"
 unlock_falconet_advance: "$a_falconet$"
 unlock_falconet_advance_desc: "$a_falconet_desc$"
 unlock_halberdiers_advance: "$a_halberdiers$"
 unlock_halberdiers_advance_desc: "$a_halberdiers_desc$"
 unlock_lancers_advance: "$a_lancers$"
 unlock_lancers_advance_desc: "$a_lancers_desc$"
 unlock_light_lancers_advance: "$a_light_lancers$"
 unlock_light_lancers_advance_desc: "$a_light_lancers_desc$"
 unlock_matchlock_levy: "$a_matchlock_levy$"
 unlock_matchlock_levy_desc: "$a_matchlock_levy_desc$"
 unlock_supply_convoy: "$a_supply_convoy$"
 unlock_supply_convoy_desc: "$a_supply_convoy_desc$"
 #Printing Press Institution
 artists_advance_discovery: "艺术印刷"
 artists_advance_discovery_desc: "印刷机的广泛使用将为我们的人民提供新的机会，使他们比曾经任何时候，都能更广泛、更迅速地分享他们的艺术技艺。"
 basic_financial_instruments: "基础金融工具"
 basic_financial_instruments_desc: "海外贸易带来高风险的同时也带来更高的利润。如信用证之类的金融工具的发展，将有助于减少风险，并增加我们的利润。"
 cabinet_laws_advance: "$cabinet_laws$"
 cabinet_laws_advance_desc: "$cabinet_laws_desc$"
 council_hall_advance: "$council_hall$"
 council_hall_advance_desc: "$council_hall_desc$"
 crown_power_advance_discovery: "治国之道"
 crown_power_advance_discovery_desc: "我们的统治者成为了领地上的唯一权威，显然需要变革政府结构，因而需要建立相适应的官僚机构加以治理。"
 diplomatic_training: "外交培训"
 diplomatic_training_desc: "我国的外交手册得到了改进，我们的随行人员中增加了优秀的外交官，以加强我们的外交工作。"
 faceting: "刻面工艺"
 faceting_desc: "宝石切割大师通过在切割盘上用悬浮于油中的钻石粉末进行实验，成功在钻石切割方面取得突破。这项工艺使工匠们能将稀有的钻石切割成全新的形状，成品更为光彩夺目。该工艺称为刻面工艺，产出的宝石具有更赏心悦目的几何形状和更优良的光学特性。随着新式宝石及其制作技艺在宫廷和工坊中流传，各类珠宝的需求大幅增加。"
 formalized_relations: "关系正式化"
 formalized_relations_desc: "如果我们要保持权力平衡并促进我们的利益，与相关邻国建立正式关系至关重要。"
 gov_reform_discovery_a: "早期行政改革"
 gov_reform_discovery_a_desc: "我们的人民正站在新时代的门槛上。为了发挥我国的内在潜力，我们必须调整我们的政府并优化我们的行政领域。"
 government_size_discovery: "早期行政容量"
 government_size_discovery_desc: "我们的领土上有多个行政部门，随着领土的扩展，我们必须对政府进行必要的调整以适应这种增长。"
 hire_artist_cost_modifier_advance_disc: "文化沃土"
 hire_artist_cost_modifier_advance_disc_desc: "文化与艺术是塑造国家认同的根基。通过对本土文化及艺术家的推崇，我们必将在世界各地留下深刻印记。"
 improved_book_binding: "改进的装订技术"
 improved_book_binding_desc: "思想和知识的发展必须有牢靠的书籍供应作为后盾，才能使我们繁荣昌盛，并养育我们的人民。"
 lazaretto_advance: "$lazaretto$"
 lazaretto_advance_desc: "$lazaretto_desc$"
 lumber_improvements_discovery: "专营林场"
 lumber_improvements_discovery_desc: "通过划拨专用林地培育优质林木，我们将为木材加工厂提供更加稳定优质的原材供应。"
 naval_morale_advance_2: "导航技术"
 naval_morale_advance_2_desc: "我们的水手们逐渐习惯了更长的航行，使用新一套的技术和仪器，如航海干罗盘，从而提高对航海的掌握能力。"
 naval_supplies_workshop_advance: "$naval_supplies_workshop$"
 naval_supplies_workshop_advance_desc: "$naval_supplies_workshop_desc$"
 paper_workshop_advance: "$paper_workshop$"
 paper_workshop_advance_desc: "$paper_workshop_desc$"
 paved_road_advance: "$paved_road$"
 paved_road_advance_desc: "$paved_road_desc$"
 power_projection_advance_4: "支配性强权野心"
 power_projection_advance_4_desc: "我们在外交舞台上的存在散发出一种宏伟和威严的气息。所有与我们接触的人都应当听到我们的声音，并受到我们的影响。"
 print_culture: "印刷文化"
 print_culture_desc: "随着印刷机的发明，知识的传播变得前所未有的容易。新的技术和进展将传遍我国的每个角落，使它变得更强大、更富有。"
 printing_press_advance: "印刷机应用"
 printing_press_advance_desc: "本世纪印刷技术的普及，促进了知识的传播，同时，重要手稿的复制效率的提升，简化了信息的交换过程。"
 printing_press_shop_advance: "印刷铺"
 printing_press_shop_advance_desc: "$printing_press_shop_desc$"
 regulate_court_procedures: "规范宫廷规章"
 regulate_court_procedures_desc: "通过对宫廷的各项规章施加严格制度与规范，我们将能减少潜在的额外开支，使宫廷运作节俭且高效。"
 rural_rgo_disc_advance: "聚落开发"
 rural_rgo_disc_advance_desc: "只要土地丰饶且有人辛勤耕耘，无论多小的定居点都将繁荣兴盛。假以时日，即使是最小的村庄也会变得人烟稠密、生机勃勃。"
 spy_construction_discovery: "改进的间谍组织"
 spy_construction_discovery_desc: "雇用值得信赖的人作为线人，并将他们安置在信息交汇之处，如此我们可以提高收集敌人及其活动信息的能力。"
 study_institutions_advance: "知识共享"
 study_institutions_advance_desc: "别人知道我们不知道的事情并不可耻，但若我们不去补救，那对我们就永远没有好处。通过主动学习他人的发现，我们能更好地提升对世界的认知。"
 town_rights_aod_advance: "首都优先"
 town_rights_aod_advance_desc: "在我国所有定居点中，无论城乡，最重要者莫过于首都。作为宫廷所在与权力源泉，它理应享有优先待遇。"
 town_rights_enable: "自治特权"
 town_rights_enable_desc: "毫无疑问，人口与居所的聚集使定居点与乡村截然不同。继承罗马城市自治传统，我们可以赋予这些定居点特殊法律与特权，从而明确差异，并为其居民带来益处。"
 trade_through_owned_disc_advance: "商旅之路"
 trade_through_owned_disc_advance_desc: "商贾们从不甘于固守一地，总在孜孜不倦地探寻利润丰厚的贸易路线。商人来来往往的身影早已成为这片土地上熟悉的风景，他们甚至不惜自行开辟捷径以缩短商途。"
 weapon_workshop_advance: "$weapon_workshop$"
 weapon_workshop_advance_desc: "$weapon_workshop_desc$"
 #Choice ADM
 additional_merchants: "额外商人"
 additional_merchants_desc: "如果不能将殖民地的物产运回祖国，那么殖民地将毫无意义。为此，我们必须充分地发展商人阶级。"
 dynamic_court: "充满活力的宫廷"
 dynamic_court_desc: "一个真正的有创造性的宫廷是一个人可以让任何人发挥作用的地方。我们必须努力确保这些旧的传统，出身或财富不会是我们在宫廷发展的阻碍，也不该成为希望通过服务国家而发迹的人才的障碍。"
 efficient_construction_plans: "高效的建设计划"
 efficient_construction_plans_desc: "我们在建设方面的高效规划使我们能够在不偷工减料的情况下完成工作订单。"
 efficient_mining: "高效采矿"
 efficient_mining_desc: "颁布法令，完善我国境内金属开采的各个方面，努力在我国市场中加以规范。"
 expansionism: "荆棘中的种子"
 expansionism_desc: "世界广阔无垠，我们不能安于一隅，毕竟我们的邻国也不会甘于平庸。我们着眼于开疆拓土、提升国力，以免被不断壮大的邻国遏制。"
 faster_colonists: "快速殖民"
 faster_colonists_desc: "不能仅仅把殖民者送去海外、不施以任何帮助，就指望他们建设起一块殖民地。为了新家园生存所需的远征物品的准备工作是一个费时的过程。利用我们过去的经验，我们可以加速这一进程。"
 missionary_schools: "传教士学校"
 missionary_schools_desc: "尽管我们从不缺乏有志于出外传播真理的人，但这些人的绝大多数人的行为都是弊大于利的。然而，专门培养传教士的学校会确保我们能够培养出这样的人才：他们不仅愿意去传播信仰，而且有能力取得成功。"
 organised_construction: "组织化建设"
 organised_construction_desc: "市政建设的升级是一项耗费庞大的工程。如果我们能够合理地对工程进行规划，就能节省一大笔资金。"
 organised_mercenary_payment: "佣兵标准薪资"
 organised_mercenary_payment_desc: "佣兵组织首领一向狡猾。他们能让同一军队的指挥官为了雇佣他们而争相出价，最后待价而沽。我们将精简佣兵招募流程，防止指挥官滥用职权，以此确保我们在谈判中总能处于优势地位。"
 preaching_missions: "宣教远征"
 preaching_missions_desc: "建立一支传教远征队，确保我们的民众信奉唯一真正的信仰。"
 #Choice DIP
 colonial_ventures: "开拓殖民地"
 colonial_ventures_desc: "使我们能够派遣更多的移民队，开拓未知世界。"
 efficient_spies: "高效间谍"
 efficient_spies_desc: "大多数的农民都会为了一点金钱而不惜出卖自己的母亲，但是，找到那些真正有用的间谍人员反而是很困难的。根据过往的经验，我们正在学会如何披沙拣金，从中拣选出合适的人选。"
 exploration: "探索理念"
 exploration_desc: "我们在地平线以外的海域航行的能力，与我们对未知地区的海岸和居民的自然主张相一致。"
 foreign_embassies: "驻外使馆"
 foreign_embassies_desc: "外交是一项非常精妙的活动，它需要同时在数个方面上取得平衡。如果我们能够让那些外派的大使馆定期传达一些基本信息，就能在进行决策时参考到更多的情报了。"
 merchant_adventures: "商业冒险"
 merchant_adventures_desc: "使我们能够充分引导本国商人追逐利益最大化，开拓新商路，开发新市场。"
 overseas_exploration: "寻宝探险"
 overseas_exploration_desc: "开拓远方殖民地的旅程往往都是单程的。即使没有被未知的传染病所吞噬，归乡所需的漫漫长日也会使你望而却步。如果能够宣示出此行所能带来的巨大财富，那么我们就能够激励人们去探索更加遥远的殖民地。"
 overseas_trade: "海外贸易"
 overseas_trade_desc: "我们的商人正在寻觅有利可图的新市场时，遥远国度的消息传到了我国，它就像成熟的水果等待采摘。"
 quest_for_the_new_world: "探索新大陆"
 quest_for_the_new_world_desc: "使我们能够专注于对远方世界的探索，发现新大陆，建立日不落帝国。"
 ships_penny: "征收船税"
 ships_penny_desc: "舰船很是昂贵，所以我们应当尽量找人来分担这笔军费。征收船税便是一种有效的解决之路。"
 vetting: "政治审查"
 vetting_desc: "所谓无官不贪，我们通常会发现，很多维持政府机构运转的官员们会倒在外国势力的银弹攻势之下。所以，一些简单的背景调查将有助于我们遏制住大多数的腐败苗头。"
 #Choice MIL
 adaptability: "领土声索的变通性"
 adaptability_desc: "我们的领土中，有的仅仅是属于我们，有的则是自古以来就拥有且永远不可分割。稍微宽松一下这个定义将使我们大量的领土被视作永远不可分割，若最糟糕的事发生了，全世界都将认可我们正当的收复失地行为。"
 administrative_leadership: "军政兼通"
 administrative_leadership_desc: "军事统帅只会一味打仗是不够的。后勤补给、物资调配、军费开支等事务，同样是任何军事行动成功的关键要素。"
 improved_manuever: "提升机动"
 improved_manuever_desc: "对于指挥官来说，学会如何在前线带兵打仗是必修课，而懂得该怎样调遣军队则会为我们带来额外的收益。"
 improved_rams: "改良金属撞角"
 improved_rams_desc: "舾装军舰上的金属撞角的历史可以追溯到数千年前，然而相较那时冶金已经有了长远的进步，我们应当利用这个优势并建造出更坚固的撞角。"
 military_drill: "定期军事操练"
 military_drill_desc: "使我们能够通过加强军事训练，提升陆军战斗力和士气。"
 naval_cadets: "海军学员"
 naval_cadets_desc: "通过晋升那些选择了海军作为职业生涯的贵族的次子及三子们，我们可以创建一个专业的海军军官团来监督我们的射击人员。"
 naval_drill: "海军训练"
 naval_drill_desc: "战场上的混乱会使得一艘舰船在相当长的时间内失去战斗力，而相较于普通船员来说，训练有素的船员们会更快地从混乱中恢复过来。"
 oak_forests_for_ships: "造船专用橡木林"
 oak_forests_for_ships_desc: "我们的战舰承受的打击越多，就能给予的打击就越大。让我们确保为我们的战舰储备充足的优质陈年橡木。"
 quality_education: "质量教育"
 quality_education_desc: "在战场上，一场大战之后的时刻往往最为危险。无论获胜还是战败，此时筋疲力尽的军队都会非常脆弱。在敌人来袭之前，我们必须要确保部队随时能够投入战斗。"
 the_old_and_infirm: "征召老弱残兵"
 the_old_and_infirm_desc: "虽然某些老兵行事卑鄙、生活堕落，但这些人仍然很有用处。比起任凭老兵沿街乞讨，将他们任用到人生的最后一息无疑更为有利。我们应当授予老兵们教官与军需官的职位，这样他们那些宝贵的技能就会得以发挥出来了。"
 #No Institution
 counter_espionage_building_country_advance: "秘密代码"
 counter_espionage_building_country_advance_desc: "众所周知，我们的活动引起了一些不受欢迎的关注。如果我们想让自己的行动远离这些好奇的目光，我们应该对通信进行加密。"
 naval_battery_advance: "海防炮台"
 naval_battery_advance_desc: "$naval_battery_desc$"
 shipyard_advance: "船厂"
 shipyard_advance_desc: "$shipyard_desc$"
 standardisation_of_calibre: "标准化口径"
 standardisation_of_calibre_desc: "随着炮兵在战场上的重要性日益增加，火炮的数量也在不断增加。但是由于每门火炮都是单独制造的，这无疑对补给造成了很大的困难。1544年，查理五世皇帝宣称将只有5种火炮口径，而法国国王亨利二世则制定了6个标准火炮口径。"
 unlock_brig_advance: "$n_brig$"
 unlock_brig_advance_desc: "$n_brig_desc$"
 unlock_galleon_advance: "$n_galleon$"
 unlock_galleon_advance_desc: "$n_galleon_desc$"
 unlock_pinnace_advance: "$n_pinnace$"
 unlock_pinnace_advance_desc: "$n_pinnace_desc$"
 #Artillery Institution
 artillery_institution_advance: "炮兵应用"
 artillery_institution_advance_desc: "中国宋王朝所研制的火药成为了火炮发明的先决条件，这一战争器械使用火药作为其火力动能的来源。它的使用对石质城堡与防御工事产生了重大威胁。"
 assault_ability_reformation: "改良的攻坚队"
 assault_ability_reformation_desc: "将突破防线的任务委派给我们最优秀、最有纪律的部队，我们将突破敌人藏身的最厚最坚固的防御工事。"
 barracks_advance: "兵营"
 barracks_advance_desc: "$barracks_desc$"
 bastion_advance: "棱堡"
 bastion_advance_desc: "$bastion_desc$"
 cannon_workshop_advance: "$cannon_workshop$"
 cannon_workshop_advance_desc: "$cannon_workshop_desc$"
 combined_arms_advance_reformation: "混编部队"
 combined_arms_advance_reformation_desc: "随着由长期服役士兵组成的常备军大规模建立，战争形态日趋复杂。火枪、火炮等新式武器的出现，促使各国采用全新的作战理念：以辅助部队为支援，推动轻步兵、重步兵、骑兵与炮兵之间的协同作战与均衡部署。"
 correct_box_advance_reformation: "团级组织"
 correct_box_advance_reformation_desc: "职业军队的出现使得我们能够创建一种新型单位——团，它不仅是士兵们永远的家，也是一种高效的战斗编制。"
 flintlock_gun: "燧发猎枪"
 flintlock_gun_desc: "优化的燧发机构造配合专用狩猎弹药，使猎人们的捕猎效率显著提升。"
 fort_limit_4_advance: "要塞巡察长"
 fort_limit_4_advance_desc: "专业的监察官巡行全国，评估各处要塞的驻军、仓储与城防，推行统一规范，以确保每一处设防地点的可靠性。"
 guns_workshop_advance: "$guns_workshop$"
 guns_workshop_advance_desc: "$guns_workshop_desc$"
 maurician_infantry: "毛里茨步兵"
 maurician_infantry_desc: "西班牙方阵的规模和纵深保证了它的力量威慑，但也使其在战场上移动缓慢，缺乏机动性。这导致了很大一部分士兵在战斗中都处于闲置状态。尼德兰的执政，拿骚的毛里茨，减少了方阵的人数，缩小了纵深因而提高了其机动性，使它仍维持同样的火力和冲击。"
 mercenaries_reformation_advance: "确保雇佣兵薪饷"
 mercenaries_reformation_advance_desc: "众所周知，雇佣兵只为合理的报酬而工作。通过承诺公平的薪酬和战利品的分成，我们可以牢牢吸引他们为我们效力，并确保更多雇佣兵组织为我们服务。"
 recruitment_improvements_reformation: "征兵办公室"
 recruitment_improvements_reformation_desc: "为了组建一支强大的军队，改进我们的征兵工作是必要的。通过加强征兵中心的工作，我们将更迅速地吸引合格人选。"
 regiment_reinforcement_speed_reformation: "火药瓶"
 regiment_reinforcement_speed_reformation_desc: "火药武器在我们军队中的普及率越来越高。然而，由于火药易受天气和外部影响，使用起来十分棘手。火药瓶将保护它免受外界元素的影响，使我们能够更轻松地为增援部队供应火药。"
 spanish_square: "西班牙方阵"
 spanish_square_desc: "西班牙方阵的发明自然来自于长矛和射击编队。它的核心是一个传统的长矛方阵。在方阵的四角都配备了一组火绳枪兵。它保留了传统长矛方阵的威力并通过火绳枪兵增强了火力。"
 supply_depot_advance_age_4_reformation: "弹药库"
 supply_depot_advance_age_4_reformation_desc: "火炮在战场和围攻战中的大量部署，促进对弹药和火药的需求，它们的储存仓库的重要性也随之提升。"
 unlock_arquebusiers_advance: "$a_arquebusiers$"
 unlock_arquebusiers_advance_desc: "$a_arquebusiers_desc$"
 unlock_baggage_train: "$a_baggage_train$"
 unlock_baggage_train_desc: "$a_baggage_train_desc$"
 unlock_chambered_cannon_advance: "$a_chambered_cannon$"
 unlock_chambered_cannon_advance_desc: "$a_chambered_cannon_desc$"
 unlock_flintlock_levy: "$a_flintlock_levy$"
 unlock_flintlock_levy_desc: "$a_flintlock_levy_desc$"
 unlock_heavy_lancers_advance: "$a_heavy_lancers$"
 unlock_heavy_lancers_advance_desc: "$a_heavy_lancers_desc$"
 unlock_pikemen_advance: "$a_pikemen$"
 unlock_pikemen_advance_desc: "$a_pikemen_desc$"
 unlock_pistoleers_advance: "$a_pistoleers$"
 unlock_pistoleers_advance_desc: "$a_pistoleers_desc$"
 #Confessionalism Institution
 artists_advance_reformations: "世俗艺术的发展"
 artists_advance_reformations_desc: "随着宗教改革后新艺术分支的发展，人们在各自领域获得认可，并在世界各地宫廷找到工作的机会变得更加容易。"
 clergy_rights_laws_advance: "$clergy_rights_laws$"
 clergy_rights_laws_advance_desc: "$clergy_rights_laws_desc$"
 confessional_court: "认信宫廷"
 confessional_court_desc: "宫廷开支很容易失控，甚至能让最富有的国家破产。为了在奢华与合理开支之间取得平衡，我们可以采取一些小技巧来降低花费，同时不减弱宫廷的宏伟气派。"
 confessionalism_advance: "认信主义"
 confessionalism_advance_desc: "关于信仰应有何种形式的各种不同解释的越来越多，无论是宗教还是世俗当局都越来越重视明确其特定信仰的形式，并在信仰和生活的各个方面强制执行特定的规则和理念。"
 construction_speed_reformation: "建筑论著"
 construction_speed_reformation_desc: "一部部凝聚数百年营造智慧的专著得以问世，极大地促进了高效建筑技术的传播与掌握。"
 counter_espionage_action_advance: "更严格的信息控制"
 counter_espionage_action_advance_desc: "如果我们在保密条件下讨论的任何机密和事务都被很轻易地泄露给任何外国，我们就不能指望在外交或军事领域有所作为。我们必须积极加强对信息流动的控制，迅速堵塞任何可能的泄密途径。"
 crown_power_advance_reformation: "教随君定"
 crown_power_advance_reformation_desc: "虽然我们的统治者对世俗事务的控制力很强，但在王国中控制宗教事务的需求成为一种新的必需。教会与国家必须合二为一。"
 early_modern_administation: "近代化行政"
 early_modern_administation_desc: "很明显，雇佣受过教育的官员的行政机关并采用更加集权的官僚体制对于建立一个早期现代化国家是十分必要的。"
 gov_reform_reformation_a: "君主论"
 gov_reform_reformation_a_desc: "新时代要求统治者采取不同的方式，更加系统地处理国家事务，同时也要考虑到国家内不同阶层，以及这些个体周围的善意人群。"
 lumber_improvements_reformation: "改良锯刃"
 lumber_improvements_reformation_desc: "随着工具制造技术的不断创新，锯片性能得到了显著提升，坚韧耐用的同时维护成本也大幅降低，为木材产业提供了稳定可靠的生产保障。"
 naval_morale_advance_3: "海外探险"
 naval_morale_advance_3_desc: "近年来，远程海外贸易的盛行使我们的水手习惯了长时间的海上航行，使他们能够抵御航海中的负面影响。"
 pan_amalgamation_advance: "平底盘混汞法"
 pan_amalgamation_advance_desc: "$pan_amalgamation_advance$是$patio_process_advance$的改进版本，加工时间更短。"
 pharmacology_advance: "药理学"
 pharmacology_advance_desc: "炼金术士和医生正在探索新的化合物和化学混合物以寻找治疗方法。其中一些早期的药剂师已经开发出治疗常见疾病（如发烧、感冒和消化问题）的方法，他们的疗法为未来带来了希望。然而，仍有很多知识需要学习，如果不正确准备，这些中的许多新疗法中可能具有危险。"
 power_projection_advance_3: "区域强权野心"
 power_projection_advance_3_desc: "国家展示自己实力的能力，对于是否能在区域舞台上占据重要地位至关重要。通过向过去和现在的其他国家学习，我们可以让我国在各处闻名，并利用这一地位施加影响力。"
 reformation_subject_opinions_advance: "经济宗主权"
 reformation_subject_opinions_advance_desc: "一个国家对另一国家宗主权的契约涵盖了许多不同的方面。其中之一是属国对宗主国的国内贸易义务，随着全球贸易日益突出，进一步扩展这些义务变得越来越重要。"
 road_advance_1: "道路网"
 road_advance_1_desc: "贸易和商业的重要性日益显著，因此建立更发达、更复杂的道路网络以促进和增加人员和货物的流动也变得尤为重要。"
 supreme_court_advance: "最高法院"
 supreme_court_advance_desc: "$supreme_court_desc$"
 town_rights_ref_advance: "发展首都"
 town_rights_ref_advance_desc: "随着国家发展，首都亦不断扩张，需要持续修订与更新相关法律。唯有一个制度完善、与其规模和地位相匹配的首都，国家方能继续成长。"
 war_score_reformations_advance: "征伐的神圣权力"
 war_score_reformations_advance_desc: "我们在战场上的胜利不仅仅是战斗计划和战争策略的成功执行，更是神明对我们的眷顾。因此，我们征服并吞并我们为之流血的新领土的权利，是神明希望我们成功的延伸。"
 #Global Trade Institution
 beer_workshop_advance: "$beer_workshop$"
 beer_workshop_advance_desc: "$beer_workshop_desc$"
 bole_smelting: "山顶吹风冶炼工艺"
 bole_smelting_desc: "一种在露天环境下冶炼铅的工艺，利用山顶上持续不断的强风将新鲜空气吹入正在熔炼的矿石中。"
 chartered_companies: "特许公司"
 chartered_companies_desc: "世界是广阔的，为了发展我们的贸易有时必须承担相当大的风险。幸运的是，我们国家的商人愿意利用自己的资源来冒这些风险。认可这些由政府通过特许证授予其垄断某些领域并履行近乎政府职能的特权的公司，可以控制和促进我们海外殖民地的商贸发展。"
 cloth_workshop_advance: "$cloth_workshop$"
 cloth_workshop_advance_desc: "$cloth_workshop_desc$"
 customs_house_advance: "海关"
 customs_house_advance_desc: "$customs_house_desc$"
 development_of_maritime_law: "制定海洋法"
 development_of_maritime_law_desc: "随着越来越多的国家把他们的国民或公民派遣到海外从事贸易活动并长期生活在一起，确定通行的海洋法的基本概念是绝对必要的。诸如“公海”或后来的“主宰海洋”学说为海洋国际法奠定了基础。"
 diplomatic_range_age_3: "常设使馆"
 diplomatic_range_age_3_desc: "当前的国际局势要求我们在邻国设立常驻外交机构。这是确保我们在本地区利益得到维护的唯一途径，同时我们也能将影响力扩展到更远的地方。"
 distillers_workshop_advance: "$distillers_workshop$"
 distillers_workshop_advance_desc: "$distillers_workshop_desc$"
 dyes_workshop_advance: "$dyes_workshop$"
 dyes_workshop_advance_desc: "$dyes_workshop_desc$"
 fine_cloth_workshop_advance: "$fine_cloth_workshop$"
 fine_cloth_workshop_advance_desc: "$fine_cloth_workshop_desc$"
 food_advance_reformation: "市场农业"
 food_advance_reformation_desc: "可以引入更新、更好的作物来提高我们农田的生产力。无论是选择更优良的品种，还是用外来产品取而代之，我们都可以轻松地推动粮食产量的增长。"
 foreign_mining_techniques: "外国采矿技术"
 foreign_mining_techniques_desc: "珍贵宝石自古以来就在世界各地受到人类珍视。通过与遥远的民族接触，我们不仅能了解他们最重视的$gems$种类，还能学习他们开采这些宝石的技术。"
 furniture_workshop_advance: "$furniture_workshop$"
 furniture_workshop_advance_desc: "$furniture_workshop_desc$"
 glass_workshop_advance: "$glass_workshop$"
 glass_workshop_advance_desc: "$glass_workshop_desc$"
 global_trade_advance: "全球贸易"
 global_trade_advance_desc: "自古以来，跨大陆的商品往来就存在了，而如今，所有贸易正在逐渐形成全球贸易网络的一部分。真正的世界经济体可能还没那么快到来，但有一点我们可以确定：它的第一颗种子已经被种下了。"
 global_trade_routes_advance: "海外贸易路线"
 global_trade_routes_advance_desc: "新发现使世界变得更大，世界也因新出现的、更频繁的贸易路线而变得更小。随着船只不断将货物和人员从遥远的国度运送来回，那些地方实际上比以前更近了。"
 imperial_ambitions: "帝国野心"
 imperial_ambitions_desc: "众所周知，往昔的伟大帝国，是史诗和诗歌的灵感来源，它们总是被敬畏和钦佩的目光所注视。如果我们想让自己的国家也产生同样的效应，我们就需要追求同等的丰功伟绩。"
 intelligence_agency_advance: "$intelligence_agency$"
 intelligence_agency_advance_desc: "$intelligence_agency_desc$"
 leader_recruit_cost_advance: "军官学堂"
 leader_recruit_cost_advance_desc: "统率军队绝非易事。战略眼光、战术素养、洞察力——这些仅是优秀将领必备的部分才能。建立专门培养此类领袖的学府，将确保我们拥有更充足的人才储备。"
 letters_of_marque: "私掠许可证"
 letters_of_marque_desc: "海盗行为令人发指。卑鄙的盗贼企图从他人的痛苦中获利。然而，授权舰船袭击我们的敌人却完全是另一回事。"
 maritime_advance_age_4: "全球舰队"
 maritime_advance_age_4_desc: "随着过去几个世纪中世界各地的最新发现，世界并非越来越大，反而越来越小了。在此之前没有任何联系的国家，现在都在不断地建立外交和商业关系。因此，为了维持所有这些海外联系，我们需要更大更好的舰队。"
 merchant_power_from_maritime_reformation_advance: "特许商团"
 merchant_power_from_maritime_reformation_advance_desc: "海外市场的扩张带来更高的成本与风险，促使商人需要结成贸易协会，分担在这些新土地上进行贸易的负担。"
 military_administration: "军事管理"
 military_administration_desc: "16世纪以来不断增加的军队数量对国家的行政体制提出了更高的要求。通过创建一个永久性组织来负责军用物资的采购和规划，使得即便在冬季与和平时期也能维持大量的部队。从长远来看，我们可以更廉价地维持一支庞大的军队，并且在战时更有效地补给这些军队。"
 pop_promotion_speed_age_4: "扩大神职队伍"
 pop_promotion_speed_age_4_desc: "宗教改革和认信主义的时代重新激发了组织化宗教告解的兴趣，部署更多神职人员在这些动荡时期引导信徒，因此使宗教职位对人们更具吸引力。"
 port_authority_advance: "港务局"
 port_authority_advance_desc: "$port_authority_desc$"
 pottery_workshop_advance: "$pottery_workshop$"
 pottery_workshop_advance_desc: "$pottery_workshop_desc$"
 reduce_inflations_advance: "严格的货币管控"
 reduce_inflations_advance_desc: "有些人可能会认为，如果我们需要更多的钱，我们唯一需要做的就是铸造更多的钱，但那只会加速自我毁灭。通过严格控制铸币流程，我们能够控制通货膨胀，甚至减少它。"
 direct_domestic_migration_advance: "内部重新安置"
 direct_domestic_migration_advance_desc: "我们的行政官已经认识到，国度的财富不仅在于土地，更在于耕作土地的双手。通过组织[pops|e]从拥挤的内地流向未开发的边区，我们可以按照国家的需要塑造自身的人口结构。"
 rgo_size_advance_reformation: "纺车"
 rgo_size_advance_reformation_desc: "我们学习了到新的、更好的资源利用手段，我们的生产能力将因而大幅提高，从而使我们更加富有。"
 riches_of_foreign_coasts: "海外海岸的财富"
 riches_of_foreign_coasts_desc: "遥远的土地为我们带来了丰富资源，但不仅是土地本身富饶。海岸与海洋也充满财富，通过学习外国采珠人的经验，我们的采珠人也能捕获更丰盛的珍珠。"
 safe_exploration_techniques_advance: "积累的知识"
 safe_exploration_techniques_advance_desc: "探索未知总是令人恐惧，但如今，真正未知的地方已经不多。尽管世界上许多地方尚未完全探索，但它们已经为人所知，而且关于如何到达那里有足够的信息。在前人知识的基础上，我们可以进入前所未有的未知领域。"
 saltpeter_workshop_advance: "$saltpeter_workshop$"
 saltpeter_workshop_advance_desc: "$saltpeter_workshop_desc$"
 scientific_experimentation: "科学实验"
 scientific_experimentation_desc: "世事皆有原因。通过理解每种事物背后的原理，我们可以在类似情况出现时预见其结果。"
 shared_products_procedures: "产品交流与工艺传播"
 shared_products_procedures_desc: "世界变得更小了，我们接触到了许多新土地与新民族，同时也接触到了许多新产品与使用方式。即便是最专业的商品，例如$alum$，在不同地方也可能被用于不同用途。"
 slitting_mills: "切割轧机" #Age of Reformation
 slitting_mills_desc: "这些新型水磨用来将铁锭切割成更细的铁条。这种工艺更高效地制造铁制工具和机械，因为相比于粗笨的铁锭，铸造工匠如此可以使用更适合其需求的铁条，减少了锻造过程中的废料浪费。"
 spy_construction_reformation: "先进的加密技术"
 spy_construction_reformation_desc: "如果我们想获取敌人的情报，重要的是让他们陷入一种虚假的安全感。只有这样，我们才能收集到详细而准确的信息，进而打击他们的计划。"
 sturdy_privateers: "坚固的私掠船"
 sturdy_privateers_desc: "私掠船始终处于炮火覆盖范围中。如果我们想充分利用它们的潜力，我们不能允许它们在第一轮炮火冲击后就沉没。让私掠者们乘上坚固的舰船，从长远来看将是有利的。"
 subject_income_reformation_advance: "结构化臣属义务"
 subject_income_reformation_advance_desc: "我们与属国之间的指挥链是一条明确的界线，规定了他们对我们的责任。加强这些契约并确保其按时履行，必将为我们的国库带来充实的收入。"
 tanning_workshop_advance: "$tanning_workshop$"
 tanning_workshop_advance_desc: "$tanning_workshop_desc$"
 tools_workshop_advance: "$tools_workshop$"
 tools_workshop_advance_desc: "$tools_workshop_desc$"
 trade_companies_advance: "贸易公司"
 trade_companies_advance_desc: "众所周知，金钱是世界运转的动力。随着更多的产品在遥远的土地上被发现，专门从事这些产品开发和分销的贸易公司必将带来巨大的利润。"
 trade_envoys: "贸易使节"
 trade_envoys_desc: "随着最近与远方国家的贸易往来的增加，我们的使节已开始加入贸易探险队，力图与那些过去无法触及的国家建立外交联系。"
 #Choice ADM
 advanced_bureaucracy: "先进文官制度"
 advanced_bureaucracy_desc: "使我们能够完善行政管理体系，扩展财源，增加税收。"
 competetive_merchants: "商业竞争"
 competetive_merchants_desc: "我们必须击败其他国家的竞争对手才能对我国招商引资。我们一定要确保我们的法律系统给予他们最多有利条件。"
 cultural_ties: "文化纽带"
 cultural_ties_desc: "不同的文化有不同的习俗，出于某种原因，当我们试图改变这种习俗时会受到抵制。通过一个他们乐意接受的方式——将当地领导合并到我们的管理体系中并让他们执行我们的意志，我们可以把这个弱点转化为力量。"
 devoutness: "献身主义"
 devoutness_desc: "宗教是我们统治地位的最坚实保证。统治者们通过公开展示虔诚，被统治者也会效仿。民众中虔诚的增长将加强我们的统治。"
 divine_supremacy: "神圣事务至上"
 divine_supremacy_desc: "我们必须将我们国家及其周边边境从侵扰我们土地的异教徒手中彻底清除。"
 ecumenism: "普世主义"
 ecumenism_desc: "异端和异教徒的问题总是如此棘手。尽管古老的火与剑法则能彻底解决大部分问题，但外交手腕也不失为一种解决之道。如果我们能够促进各教派之间的对话与协商，我们就能有效减少误解，促进国家内部的和平。"
 expanded_infrastructure_network: "扩建的基础设施网络"
 expanded_infrastructure_network_desc: "国内的道路网络是我们商业和行政繁荣的重要组成部分。因此，我们应该关注它的改善和维护。"
 humanist_tolerance: "人文宽容主义"
 humanist_tolerance_desc: "建立一个更宽容的社会，开明地对待不同社会思潮与宗教信仰，大幅度地提升国家稳定程度。"
 national_bank: "国家银行"
 national_bank_desc: "使我们建立对财政金融的监管体系，更好地引导经济发展。"
 religious_tradition: "宗教传统"
 religious_tradition_desc: "对信仰的坚定执著，对神明的顶礼膜拜，这些都会得到远近友邻们的艳羡，而这种艳羡便是对我们威望与荣耀的有力体现。"
 #Choice DIP
 audit_checks: "审计检查"
 audit_checks_desc: "当我们寻求渗透其他国家时，也必须警惕一些有毒的思想在我们自家传播。建立一个监察组以确保我们的官员按照国家的最高利益行事，这将有利于我们铲除一些腐败因素。"
 cabinet: "内阁责任制"
 cabinet_desc: "我们完善行政机构，训练更多熟练的外交官。"
 diplomatic_influence: "外交影响"
 diplomatic_influence_desc: "通过努力发展外交事业，我们可以在外交舞台上长袖善舞，左右逢源。"
 fast_negotiations: "快速谈判"
 fast_negotiations_desc: "有时候达成一项协议是非常迅速的，而我们要做的就是确保商人们能够切实完成我们的谈判。"
 free_colonies: "自由殖民"
 free_colonies_desc: "那些愿意移居海外，开拓伟大殖民帝国的人总是寥寥无几。然而如果我们许诺殖民者可以自由占有大片的农田，那么人们将争先恐后地前往海外追逐财富。好在那里每个人都会有足够多的土地。"
 free_trade: "自由贸易"
 free_trade_desc: "现在的商业家族们迫切希望能够确保他们对于商业专营权的垄断，但我们并不希望如此，而是希望整个商人阶层能够全面发展。"
 grand_banquets: "盛宴"
 grand_banquets_desc: "任何重要事务的讨论都离不开一顿饭，而事情越重要，这顿饭就应该越丰盛。定期举办盛大宴会，可以让我们持续并妥善地讨论所有需要考虑的事务。"
 grand_navy: "大海军主义"
 grand_navy_desc: "使我们能够组建空前庞大有力的[navies|e]。"
 land_of_opportunity: "机会之地"
 land_of_opportunity_desc: "我们应当大肆宣扬这样的理念，任何乐于开垦殖民地与处女地的男女都可以发家致富，这样人们就会更快地前往殖民地了。由此，我们可以在鼓励人们开垦殖民地上花费更少的金钱。"
 trade_manipulation: "操纵贸易"
 trade_manipulation_desc: "在那些事关贸易发展的关键枢纽上，我们要有能力制定政策，引导商业产生出更多的利润。"
 #Choice MIL
 camp_followers: "随军人员"
 camp_followers_desc: "战士显然是我们军队的主力，但没有军队能仅由战士组成。如果没有随军人员运输食物和装备，军队将无法顺利行动。通过组织和安排这些随军人员，我们可以大大提高他们的作用和效率。"
 copper_bottoms: "铜质船底"
 copper_bottoms_desc: "木材也许是造船的理想材料，但它会随着时间的推移逐渐糟朽。通过给我们的舰船在水线下装配铜质保护壳，我们可以减少这种破坏，使它们能够更好地耐受长途旅行。"
 cultures_capacity_mil_choice: "多元文化宏图"
 cultures_capacity_mil_choice_desc: "国家的扩张必然要吸收异域文化。要想开拓疆土，就必须具备接纳多元文化的胸襟。"
 defensive_army: "防御性军队"
 defensive_army_desc: "随着周边众多强国的崛起，我们亟需强大的防御力量，力求努力维护我们的领土完整。对地形、路径和战术的了解将帮助我们度过这一动荡时期。"
 defensive_mentality: "周密防守"
 defensive_mentality_desc: "有人说进攻是最好的防御，但当他们在反击中碰得头破血流时，你将毫不怀疑这句话的荒谬。我们的军队将如磐石般进行守备，我们的要塞也会坚持更长时间。"
 engineer_corps: "组建工兵军团"
 engineer_corps_desc: "使我们能够集中全国的军事技术人才，迅速加强陆军科技水平。"
 expanded_supply_trains: "扩充补给线"
 expanded_supply_trains_desc: "投入更多的资源在补给线上可以让我们的军队在敌对领土上活动更长的时间。"
 garrison_conscription: "征召守军"
 garrison_conscription_desc: "通过征召年轻人作为守军，我们可以拥有足够的边境守卫力量。"
 rgo_logistics_mil_choice: "仓储革新"
 rgo_logistics_mil_choice_desc: "完善的仓储设施对保障本地工商业物资供给至关重要，唯有如此才能确保经济体系顺畅运转。"
 supply_trains: "补给线"
 supply_trains_desc: "在战争中，我们最凶恶的敌人便是[attrition|e]，保护我们的部队不受这个敌人伤害的关键是良好的规划，以及能够提供支援和补给高效后勤网络。"
 #No Institution
 crown_rights_laws_advance: "$crown_rights_laws$"
 crown_rights_laws_advance_desc: "$crown_rights_laws_desc$"
 grand_shipyard_advance: "大船厂"
 grand_shipyard_advance_desc: "$grand_shipyard_desc$"
 unlock_frigate_advance: "$n_frigate$"
 unlock_frigate_advance_desc: "$n_frigate_desc$"
 unlock_merchantman_advance: "$n_merchantman$"
 unlock_merchantman_advance_desc: "$n_merchantman_desc$"
 unlock_twodecker_advance: "$n_twodecker$"
 unlock_twodecker_advance_desc: "$n_twodecker_desc$"
 unlock_xebec_advance: "$n_xebec$"
 unlock_xebec_advance_desc: "$n_xebec_desc$"
 #Banking Institution
 central_bank_advance: "中央银行"
 central_bank_advance_desc: "随着$banking$机构的稳固建立，国家现在可以特许设立一座常设的$central_bank$，并授权其发行$game_concept_government_bonds$。这些债券使王室能够迅速从私人投资者那里筹集大笔资金，并通过稳定的利息偿还，而不仅仅依赖阶层的贷款。"
 #Manufactories Institution
 absolute_rulership: "专制统治"
 absolute_rulership_desc: "许多人都想在政府中谋得一个职位，但事实上其中大多数人都希望能不劳而获。一种新的、有趣的专制主义思想正在传播，我们可以借此除掉那些寄生虫并独揽大权。"
 absolutist_court: "专制宫廷"
 absolutist_court_desc: "全世界的权威近期正集中于统治者一人之身。宫廷的其他人不再是独立的权力角色，而更像是君主的侍从与下属。这让统治者能更快、更高效地实现他们的意志。"
 artists_advance_absolutism: "艺术潮流"
 artists_advance_absolutism_desc: "艺术的表达方式一直多种多样，但最近的深度发展促成了数量繁多的表现形式。"
 brewery_manufactory_advance: "啤酒发酵场"
 brewery_manufactory_advance_desc: "$brewery_manufactory_desc$"
 cannon_foundry_advance: "$cannon_foundry$"
 cannon_foundry_advance_desc: "$cannon_foundry_desc$"
 cloth_manufactory_advance: "布料工场"
 cloth_manufactory_advance_desc: "$cloth_manufactory_desc$"
 coal_improvements_absolutism: "炼焦改良"
 coal_improvements_absolutism_desc: "通过优化煤炭精炼过程，我们能够更有效地将其作为燃料使用，同时避免对其他副产品产生不良影响。"
 construction_speed_absolutism: "建筑工程学"
 construction_speed_absolutism_desc: "随着时代发展，建筑施工已演变为一门融合多学科方法的系统工程学科，其工艺技术也日益精密复杂。"
 cork_stoppers: "软木瓶塞"
 cork_stoppers_desc: "玻璃瓶技术制造的发展令葡萄酒生产商们可以制作尺寸更标准的瓶子，使得回收利用软木塞成为可能。这比用布瓶塞更为高效，并且意味着葡萄酒可以被运输到更远的地方。或许我们正在见证全球葡萄酒贸易的开端。"
 distiller_manufactory_advance: "烈酒蒸馏所"
 distiller_manufactory_advance_desc: "$distiller_manufactory_desc$"
 dyesworks_advance: "$dyesworks$"
 dyesworks_advance_desc: "$dyesworks_desc$"
 fine_cloth_manufactory_advance: "精纺工场"
 fine_cloth_manufactory_advance_desc: "$fine_cloth_manufactory_desc$"
 firearms_manufactory_advance: "$firearms_manufactory$"
 firearms_manufactory_advance_desc: "$firearms_manufactory_desc$"
 food_advance_absolutism: "土地专用"
 food_advance_absolutism_desc: "在近些年之前，土地的所有权及其常规使用，相对来说没太多限制。然而，逐渐出现了一个趋势，人们开始进行特定土地的划界，明确确定专门用于农业的田地的边界和面积。如此，农业生产和效用可以大大加强。"
 furniture_manufactory_advance: "$furniture_manufactory$"
 furniture_manufactory_advance_desc: "$furniture_manufactory_desc$"
 glassworks_advance: "玻璃工场"
 glassworks_advance_desc: "$glassworks_desc$"
 government_size_absolutism: "忠心的臣僚"
 government_size_absolutism_desc: "权力集中在统治者手中使他们能够采取更直接的行动，但他们仍然需要下属来执行这些行动。然而，没有实权、并对统治者保持忠诚的下属，对于宫廷来说越多越好，统治者也不必担心内斗或不满。"
 iron_foundry_advance: "工具车间"
 iron_foundry_advance_desc: "$iron_foundry_desc$"
 lacquerware_manufactory_advance: "漆器工场"
 lacquerware_manufactory_advance_desc: "$lacquerware_manufactory_desc$"
 lead_ore_dressing: "铅矿选矿"
 lead_ore_dressing_desc: "在选矿过程中，将铅矿石清洗、粉碎，将矿石与岩石、粘土和其他矿物分离。"
 lumber_improvements_absolutism: "风动锯木厂"
 lumber_improvements_absolutism_desc: "建造风力驱动的锯木厂后，原木加工成板材的速度将达到前所未有的水平。"
 manufactories_advance: "工场生产"
 manufactories_advance_desc: "近年来的技术进步与机械化的推广促进了工场这样的集中大生产设施的兴起。在这样的进步下，生产速度和数量都得到了显著的提高，因而创造了更大的收益。"
 industrial_expansion_advance: "产业扩张"
 industrial_expansion_advance_desc: "工场的普及使国家得以监管日益广泛的生产网络，从而让我们能够在全境推广新的产业。"
 mint_advance: "$minting_office$"
 mint_advance_desc: "$minting_office_desc$"
 modern_council_hall_advance: "$modern_council_hall$"
 modern_council_hall_advance_desc: "$modern_council_hall_desc$"
 naval_supplies_manufactory_advance: "船具工场"
 naval_supplies_manufactory_advance_desc: "$naval_supplies_manufactory_desc$"
 ostentatious_clothing: "华丽服饰"
 ostentatious_clothing_desc: "统治阶层有权利也有义务通过外表来展示他们的权力。因此，他们身着愈加华丽的服饰，运用最新工艺来实现鲜艳而奢华的色彩与图案。"
 perfumery_advance: "香薰工坊"
 perfumery_advance_desc: "$perfumery_desc$"
 pop_promotion_speed_age_5: "晋升的官僚"
 pop_promotion_speed_age_5_desc: "官僚体系正在扩展，以满足自身不断扩大的需求，因此，对于可以加入行政工作且受过教育的官员，相应人才需求正在增长。"
 porcelain_manufactor_advance: "瓷器工场"
 porcelain_manufactor_advance_desc: "$porcelain_manufactory_desc$"
 pottery_manufactory_advance: "$pottery_manufactory$"
 pottery_manufactory_advance_desc: "$pottery_manufactory_desc$"
 powerful_statues: "强权的雕像"
 powerful_statues_desc: "一个繁荣的国家是强大统治者的象征，但只有当人民亲眼见到时，他们才会相信统治者确实强大。为此，许多统治者会委托雕刻各种各样的自己塑像，通常以石材或青铜制成，以向民众展示力量与权威。然而，这些雕像并非总能达到预期效果，有时仅仅导致大量材料被消耗与搬运。"
 rgo_size_advance_absolutism: "重农主义"
 rgo_size_advance_absolutism_desc: "经济思想的最新发展，已将重点从以往重商主义的贸易价值，转向了生产过程本身的价值。因此，生产过程正在稳步改善和进步。"
 sanitation_advance: "公共卫生"
 sanitation_advance_desc: "定居点正在投资改进卫生措施，例如废物处理和饮水净化系统。这将减少疾病传播，并改善人口的整体健康状况。现代卫生习惯的发展将使人们能够住得更近而不受疾病的影响。"
 stock_exchange_advance: "证券交易所"
 stock_exchange_advance_desc: "$stock_exchange_desc$"
 tannery_manufactory_advance: "制革工场"
 tannery_manufactory_advance_desc: "$tannery_manufactory_desc$"
 town_rights_abs_advance: "辉煌宫廷"
 town_rights_abs_advance_desc: "作为宫廷所在之地，首都也应沐浴于统治的荣光与壮丽之中。没有任何城镇或城市应在威仪与宏伟程度上与它相较。"
 weapon_manufactory_advance: "武器工场"
 weapon_manufactory_advance_desc: "$weapon_manufactory_desc$"
 winery_manufactory_advance: "$winery_manufactory$"
 winery_manufactory_advance_desc: "$winery_manufactory_desc$"
 #Military Revolution Institution
 absolutism_agressive_advance: "国家至上"
 absolutism_agressive_advance_desc: "在地区整合、资源愈发有限的时代，国家有权采取激进政策，以满足人民的物质需求，并扩大国家权力。战争虽应被视为最后的外交手段，但它仍是一种外交手段，因为国家超越了诸如道德和法律等人类限制。"
 admiralty_advance: "海军部"
 admiralty_advance_desc: "$admiralty_desc$"
 alleviate_concerns_advance: "缓解紧张局势"
 alleviate_concerns_advance_desc: "一个国家若让其所有邻国时刻戒备自己动向，将毫无益处。我们必须积极开展外交，不断缓和可能出现的紧张局势，这样我们的邻国就没有理由对我们抱有警惕之心。"
 anti_piracy_warfare: "商队护航"
 anti_piracy_warfare_desc: "在新大陆以及通往那里的海上航线，凶残且无法无天的海盗崛起，这对我们的商人和贸易产生了巨大影响。从现在开始，我们的商船将组成船队，如此更容易得到随行军舰的保护，并将在船上配备少量军人，以确保他们在公海上的安全。"
 army_doctrine_law_advance: "$army_doctrine_law$"
 army_doctrine_law_advance_desc: "$army_doctrine_law_desc$"
 army_movement_speed_absolutism: "弹药库"
 army_movement_speed_absolutism_desc: "弹药库的使用并非新事物，但现代军队的空前增长普及了它们的使用。它们为军队提供的稳定弹药供应，有助于增强军队的机动性，并扩大作战范围。"
 artillery_vs_fort_age_5_absolutism: "攻城炮"
 artillery_vs_fort_age_5_absolutism_desc: "火药促使多种不同类型的武器被制造出来。突破步兵防线所需的力量与摧毁城墙不同，因此在围攻战中必须部署专门的火炮。"
 correct_box_advance_absolutism: "灵活的战斗编队"
 correct_box_advance_absolutism_desc: "新的战术已经发展起来，步兵、骑兵和炮兵部队在战场上更加灵活和协调，通常以旅级单位编队。"
 country_unification_advance: "附属国监管"
 country_unification_advance_desc: "我们越早将附属国的行政与我国相统一，其他事务的整合便越轻松。设立与附属国的永久联络机构，将大大简化这一过程。"
 fort_limit_5_advance: "标准化堡垒工程"
 fort_limit_5_advance_desc: "国家标准的军事建筑与维修规范的颁布实施，使我们得以对整个要塞体系进行科学规划、设计共享，并实现预期内的维护管理。"
 global_supply_limit_modifier_advance_5: "陆军后勤计划"
 global_supply_limit_modifier_advance_5_desc: "任何军队的行军都依赖于后勤的支持。在后勤方面开展适当的研究和规划，军队可以进行更长时间和更远距离的作战。"
 gustavian_infantry: "古斯塔夫步兵"
 gustavian_infantry_desc: "瑞典国王古斯塔夫·阿道夫提升了步兵单位的火力使其得到进一步发展。他的步兵阵型更狭长并呈直角，从而增加了滑膛枪的数量使其齐射时的威力大增，同时他还配备小型火炮来进一步增加步兵火力。"
 improved_supply_lines: "改善补给线"
 improved_supply_lines_desc: "随着齐射战术的发展和战场上火炮的广泛使用，现代战争对我们军队的资源需求越来越多。"
 increase_control_area_advance: "广泛提高控制力"
 increase_control_area_advance_desc: "随着我国疆域不断扩张，我们必须牢牢掌控人口。"
 line_infantry: "线列步兵"
 line_infantry_desc: "有了刺刀，滑膛枪兵也可以起到长矛兵的作用。这导致长矛被移出了步兵装备列表，同时使得步兵编队的火力也进一步加强。"
 military_revolution_advance: "军事革命"
 military_revolution_advance_desc: "战争从未改变，变的是如何发动战争。最近在军备领域的发展已经证明：旧有的战术模式已经过时，军队在整体上经历了一场巨变。适应这些变化是保持军事强国地位的唯一途径。"
 militiamen_advance: "$a_militiamen$"
 militiamen_advance_desc: "$a_militiamen_desc$"
 naval_morale_advance_5: "常备舰队"
 naval_morale_advance_5_desc: "当前世界的局势，以及全球范围内贸易和商业活动的增加，要求各国使用常备舰队来保护本国利益。拥有一支成熟且无处不在的海军，可以让舰船更好地相互配合。"
 pacify_population_advance: "监控煽动者"
 pacify_population_advance_desc: "总会有人对我们的统治不满，这是不可避免的。然而，只要我们不再置之不理，并任其消亡，它便不会发展成更大的问题。若我们主动搜查那些可能鼓动反对我们的人，便能在他们聚拢足够支持者前将其扼杀于萌芽之中，从而使普通民众对我们的统治更为满意。"
 regiment_reinforcement_speed_absolutism: "宿营军官"
 regiment_reinforcement_speed_absolutism_desc: "常备军已经成为战争的新标准，这本身带来了诸多挑战。我军新设立的职位，宿营军官，将专职组织日益扩大的军队的后勤工作，来克服这些挑战。"
 regimental_camp_advance: "军团营地"
 regimental_camp_advance_desc: "$regimental_camp_desc$"
 star_fort_advance: "星堡"
 star_fort_advance_desc: "$star_fort_desc$"
 supply_depot_advance_age_5_absolutism: "前线仓库"
 supply_depot_advance_age_5_absolutism_desc: "陆军现在可以在敌方领土内进行更深入和更长时间的作战，因此有必要在靠近陆军的地方建立并维持前线仓库，同时与后方的补给线相连。"
 unlock_gallop_cavalry_advance: "$a_gallop_cavalry$"
 unlock_gallop_cavalry_advance_desc: "$a_gallop_cavalry_desc$"
 unlock_hunters_advance: "$a_hunters$"
 unlock_hunters_advance_desc: "$a_hunters_desc$"
 unlock_hussars_advance: "$a_hussars$"
 unlock_hussars_advance_desc: "$a_hussars_desc$"
 unlock_musketeers_advance: "$a_musketeers$"
 unlock_musketeers_advance_desc: "$a_musketeers_desc$"
 unlock_royal_mortar_advance: "$a_royal_mortar$"
 unlock_royal_mortar_advance_desc: "$a_royal_mortar_desc$"
 unlock_wagon_train: "$a_wagon_train$"
 unlock_wagon_train_desc: "$a_wagon_train_desc$"
 war_college_advance: "军校"
 war_college_advance_desc: "$war_college_desc$"
 war_score_absolutism_advance: "侵略性条款"
 war_score_absolutism_advance_desc: "国家的实力与其军事能力直接相关。事实证明，一个国家的人口越多，其军队就越强大。我们的外交必须采取强硬的态度，在和平条约中尽可能多地吞并土地，以进一步扩大我们对邻国的优势。"
 #Scientific Revolution Institution
 coke_blast_furnace: "焦炭高炉" #Age of Absolutism
 coke_blast_furnace_desc: "这是一种新型高炉，可以使用焦炭而非木炭作为燃料。这种工艺不仅更经济，还能建造更大的熔炉，不过缺点是焦炭比木炭含有更多的杂质，这个问题有待解决。"
 diplomatic_range_age_5: "外交使团"
 diplomatic_range_age_5_desc: "现代政治的复杂性已不再是单靠一个使节能够处理的任务。为了进一步扩展我们的影响力并保护我们在那些遥远国度的利益，我们将向每个国家派遣完整的专业外交官使团。"
 economical_policies_law_advance: "$economical_policies_law$"
 economical_policies_law_advance_desc: "$economical_policies_law_desc$"
 grand_marketplace_advance: "$grand_marketplace$"
 grand_marketplace_advance_desc: "$grand_marketplace_desc$"
 hollander_beater: "荷兰打浆机"
 hollander_beater_desc: "数世纪以来，造纸厂依靠机械锤来敲打块状纸浆，粉碎纤维，产出造纸所需的原料。如今，利用风车的动力，工匠们开发出一种更高效的装置。他们称之为荷兰打浆机，这是装有风力驱动的水平滚轮和叶片的大桶。过去靠机械锤耗时多日才能处理完的纸浆，这些刀片几个小时内就能完工。"
 improve_relation_impact_absolutism: "常设外交部"
 improve_relation_impact_absolutism_desc: "我国不断壮大的外交力量要求我们设立常设的外交部，以管理和协调众多使节的各项工作。"
 integrate_area_advance: "改良整合行政"
 integrate_area_advance_desc: "我们的行政管理正在改善，因此我们有能力一次性将更大的领土纳入国家版图。"
 jesuits_bark: "金鸡纳树皮"
 jesuits_bark_desc: "观察发现，南美洲的一些原住民会使用某种特定树木的树皮来治疗寒颤症状。一位耶稣会药剂师通过实验证明，金鸡纳树的树皮对治疗疟疾同样有效，它也因此被称为“耶稣会树皮”。将其分发给受疟疾影响的人群，将大幅减轻该疾病的危害。"
 maritime_advance_age_5: "护航船队"
 maritime_advance_age_5_desc: "随着海上贸易的不断扩大，从更远的地方向本土运送的货物越来越多，数量也越来越大，对更稳定的货物流动的需求也随之增加。组织护航贸易船队可以实现贸易船只的稳定航行。"
 measuring_the_world: "全球勘探"
 measuring_the_world_desc: "新的科学给了我们许多不同的方式来描述和测量我们周围的世界。让我们把这些饱学之士送去探索世界，尤其是我们自己的国家。我们只有在彻底探查我们土地上的所有矿产，清点所有国民以及评估所有产业之后才能确定我们究竟控制了多少资源。"
 medical_school_advance: "医学院"
 medical_school_advance_desc: "医学院是训练有素的医生的专门场所，是学者们学习人体、疾病以及如何预防或治疗的地方。"
 merchant_power_from_maritime_absolutism_advance: "商会联盟"
 merchant_power_from_maritime_absolutism_advance_desc: "随着新的商业与经济理念的兴起，地方商人联合组成了商业网络，促进共同利益，并维护他们的权利不受政治实体和外国影响。"
 modern_road_advance: "$modern_road$"
 modern_road_advance_desc: "$modern_road_desc$"
 national_sovereignty: "国家主权"
 national_sovereignty_desc: "17世纪上半叶旷日持久的诸多战争导致了以领土完整为基础的国际外交体系的诞生。既非统治者个人也非某些超国家组织，而是国家本身成为了国际舞台的主角，任何国家都无权干涉别国内政。"
 naval_doctrines_advance: "海军学说"
 naval_doctrines_advance_desc: "近年来，海战发生了许多变化，舰船和舰队变得更大、更专业化。因此，不同国家开始采用不同的战术和学说，来匹配各自的优势或特定的舰队运用方式。"
 naval_professionalism: "海军职业化"
 naval_professionalism_desc: "即便在17世纪初，常备海军的规模很小而且海军力量的存在也只是为了满足现实的迫切需要。然而，随着时间的推移，我们正在朝着大型的专业化海军方向前进。除非我们希望看到我们的对手在海军方面超越我们，我们必须努力创造更大规模的常备海军，并建立行政组织来支持它，确保海军职业能够成为我们军官的固定职业。"
 newspapers_advance: "报纸"
 newspapers_advance_desc: "以石碑或薄板为载体的公告已存在多时。然而，随着$printing_press$在全球传播，民众对于政治、军事和经济信息的需求日益增加。报纸——一种描述时事的定期出版物——将满足这一需求。"
 opera_house_advance: "歌剧院"
 opera_house_advance_desc: "$opera_house_desc$"
 paper_manufactory_advance: "$paper_manufactory$"
 paper_manufactory_advance_desc: "$paper_manufactory_desc$"
 power_projection_advance_5: "绝对性霸权野心"
 power_projection_advance_5_desc: "随着国家权力的日益集中，几乎所有世界统治者的脑海中都开始形成一个想法：成为所有领土的唯一统治者。他们想象自己如同太阳，独自为所有土地带来光明，他们希望拥有对万物的绝对权威。"
 printing_manufactory_advance: "$printing_manufactory$"
 printing_manufactory_advance_desc: "$printing_manufactory_desc$"
 putrefaction_works_advance: "堆硝工场"
 putrefaction_works_advance_desc: "$putrefaction_works_desc$"
 relations_absolutism_advance: "纵横捭阖的政治"
 relations_absolutism_advance_desc: "我们周围的世界发生了变化，为了适应真正的、更大范围的全球舞台，我们的外交努力也必须跟上日益增长的安全需求，应对外部威胁。"
 scientific_mapping_advance: "测绘学"
 scientific_mapping_advance_desc: "近年来，地理知识、制图学和测绘学等领域和科学的不断进步，使人们能够更准确地描绘陆块和自然地貌，包括它们的相对大小和确切位置。"
 scientific_revolution_advance: "科学革命"
 scientific_revolution_advance_desc: "近来，数学、物理学、天文学、生物学和化学的发展不仅对我们周围世界的认知提出了挑战，更是彻底改变了我们的世界观。社会正以前所未有的速度进步，每天都有新的科学发现。"
 ship_building_techniques_absolutism: "湿船坞"
 ship_building_techniques_absolutism_desc: "湿船坞或浮船坞的发展将使我们的造船工人能够比以前更快地建造船只。"
 spy_construction_absolutism: "扩大全球间谍网络"
 spy_construction_absolutism_desc: "随着世界上各个帝国和机构的不断扩张，我们需要维持间谍活动，以免落后于竞争对手。"
 subject_loyalty_absolutism: "绝对忠诚"
 subject_loyalty_absolutism_desc: "在我们自己的人民中，我们都不容忍任何异议或叛乱，为什么还要纵容我们的属国呢？"
 the_constitution: "宪政主义"
 the_constitution_desc: "一种被称为宪政主义的全新哲学概念逐渐兴起，它主张用法律来限制政府权力。这是一个很有趣的想法，但我们认为它难以广泛接受。"
 #Choice ADM
 additional_colonists: "额外殖民者"
 additional_colonists_desc: "新大陆意味着一切，而最重要的是，它尚未被占有。换句话来说，根本没什么大人物在那里占有哪怕一丁点的土地，如果我们能让人们了解这种近乎无限的良机，就能鼓励更多的人投身到新大陆的开发中去。"
 additional_diplomats: "额外外交官"
 additional_diplomats_desc: "要推动我们国家的发展，就得推动我们外交的发展。我们必须为所有外交工作指派人手。"
 bookkeeping: "簿记系统"
 bookkeeping_desc: "当资金短缺时，我们不得不借钱。债主通常都会担心别人会不会还钱。为了留下清白的记录，我们最好确保每一笔债务都清偿了，这样可以让我们通过谈判来降低一些利息。"
 centralized_government: "集权统治"
 centralized_government_desc: "如果对整个国家采取中央集权统治，我们将会很容易地将中央的理念与计划贯彻至全国各地。"
 civil_servants: "行政部门"
 civil_servants_desc: "通过建立一个由年轻又野心勃勃的官僚们组成的行政部门可以确保我们快速适应管理和统治的新进度。"
 economic_ideas: "附庸经济"
 economic_ideas_desc: "国家的经济和财富应该为国家服务，而不是相反。为此，最大限度积累资源才符合国家的最佳利益，如此方能确保真正的繁荣昌盛。"
 formalized_officer_corps: "正规化军官团"
 formalized_officer_corps_desc: "传统上军官都是由贵族来担当的，但贵族们的数量往往不足以满足庞大的军官需求。然而，我们的军队里也有相当多的来自于下层阶级的军士，我们应当尝试着将他们晋升为职业军官。"
 humanism: "人文主义"
 humanism_desc: "人类是我们主最伟大的创造，因此，自然而然地应将其置于创造的中心。人性的每个方面都必须加以保护和鼓励，从幸福到自由意志或探索世界的能力。"
 local_traditions: "当地传统"
 local_traditions_desc: "管理一个庞大的国家，意味着需要管理很多拥有自己习俗和传统的不同民族。通过把这些传统整合到我们的官方法典中，我们可以得到一批幸福又忠诚的子民。"
 religious_unification: "宗教统一"
 religious_unification_desc: "只有一种宗教是真理，因此我们有责任将所有信徒团结在神的唯一指引下。"
 #Choice DIP
 agent_training: "间谍训练"
 agent_training_desc: "我们已经有很多可以瞒天过海并精心策划的计划，但是困于没有合适的人选来执行。为我们的间谍建立培训方案将有助于提升他们执行危险的任务的能力。"
 dip_choice_subject_opinions: "属国使者"
 dip_choice_subject_opinions_desc: "与属国的持续沟通必将对我们的关系产生积极影响，加强我们势力的核心和所有忠诚站在我们旗下的国家。"
 diplomatic_corps: "外交使节团"
 diplomatic_corps_desc: "通过建立专业的外交使节团，我们可以确保老一辈的外交官总结出来的渊博经验传给年轻一代。"
 formal_diplomacy: "正规外交"
 formal_diplomacy_desc: "在一个权力从强大的个人手中转移到中央集权的时代，在我们和邻国之间建立沟通的桥梁和渠道是明智之举。如今面对崛起的大国，外交比以往任何时候都更重要。"
 national_trade: "国家贸易"
 national_trade_desc: "布匹、羊毛及其他热门商品在世界各地流通。在一个商业可以到达遥远海岸的时代，我们必须确保我们的商人拥有优势！"
 national_trade_policy: "全国性贸易政策"
 national_trade_policy_desc: "通过采用全国性的贸易政策，我国得以加强贸易存在，同时提高贸易效率。"
 naval_fighting_instruction: "海军作战理论"
 naval_fighting_instruction_desc: "使我们能够进一步提升[navy|e]战斗力，强化对敌方海域的[blockades|e]。"
 sheltered_ports: "避风港"
 sheltered_ports_desc: "船舶往往在争斗中被损坏是一个不幸的事实，而且同样不幸的是这些损坏很少能在海上进行修复。为了缓解这个问题，我们应该创造一个在我们的海岸线上可以修补船只的避风港系统。"
 state_propaganda: "国家宣传"
 state_propaganda_desc: "和人一样，国家的声誉就是一切，建立一个官方宣传机构可以确保我们的好名声不被敌人的谎言所玷污。"
 vice_roys: "总督委任制度"
 vice_roys_desc: "使我们能够强化殖民地管理，增加来自殖民地的收益。"
 #Choice MIL
 absolutism_control_decline_advance: "绝对主义行政"
 absolutism_control_decline_advance_desc: "专制统治者不仅要在宫廷彰显权威，更要通过覆盖全国的行政体系来施展统治。"
 discipline_drills: "严格操练"
 discipline_drills_desc: "在战斗中，只有三项要点：火力、人力和将两者结合起来的纪律。定期的军事操练和演习将使我军的军事水平提高到新的高度。"
 escort_ships: "轻护卫舰"
 escort_ships_desc: "轻护卫舰是一类被设计用来护送友方船只和骚扰敌军的小型军舰，它们依靠速度和机动性而不是集中的火力。"
 grand_army: "大陆军主义"
 grand_army_desc: "使我们能够组建空前庞大有力的陆军。"
 improved_foraging: "改善军粮征集"
 improved_foraging_desc: "在缺乏食物供应的情况下我们无法有效率地进行作战。一支擅长于收集[food|e]的军队可以维持更大的规模投入战斗。"
 offensive_army: "进攻性军队"
 offensive_army_desc: "火药与军事创新的时代已然来临，它们为战争带来了新的重要性与活力。为追求荣耀，我们必须努力确保我们的进攻部队的高标准。"
 private_to_marshal: "从士兵到元帅"
 private_to_marshal_desc: "每名士兵的背包中都藏有元帅的权杖。虽然这种表述有所夸张，但对那些在战场上表现出众的士兵来说，晋升与重赏将是他们理所应得之物。这种奖赏措施为军人们所周知，并激励着他们奋勇杀敌。"
 regimental_system: "乡地军团制度"
 regimental_system_desc: "如果将士兵们按照籍贯来进行编组，我们就能将[regiments|e]与他们的故乡紧密联系在一起。因此，当我们需要为各[regiments|e]招募新兵时，这种招募便会非常迅速。"
 repair_at_sea: "近岸倾斜修理" #Age of Absolutism
 repair_at_sea_desc: "归功于不断发展的新技术，船只在海上航行时间越来越长。这意味着船只需要更复杂的维修，而且它并非总能进入港口。我们的水手需接受培训，在远离船坞基地的情况下，利用海岸的退潮，使用倾斜法维护船只。"
 superior_firepower: "优势火力"
 superior_firepower_desc: "在总攻之前先采取密集火力对敌方进行杀伤，这种战术是一支部队的威力所在。所以，一定要确保我们的军官们能够明白这一点。"
 #No Institution
 global_supply_limit_modifier_advance_6: "战役后勤规划"
 global_supply_limit_modifier_advance_6_desc: "战争后勤的规划变得越来越复杂，因为军队规模的增长使得能够部署多支军队进行长期战役成为可能，可以维持数十万士兵的多年作战。"
 naval_base_advance: "海军基地"
 naval_base_advance_desc: "$naval_base_desc$"
 unlock_bomb_ketch: "$n_bomb_ketch$"
 unlock_bomb_ketch_desc: "$n_bomb_ketch_desc$"
 unlock_eastindiaman_advance: "$n_eastindiaman$"
 unlock_eastindiaman_advance_desc: "$n_eastindiaman_desc$"
 unlock_heavy_frigate_advance: "$n_heavy_frigate$"
 unlock_heavy_frigate_advance_desc: "$n_heavy_frigate_desc$"
 unlock_ship_of_the_line_advance: "$n_ship_of_the_line$"
 unlock_ship_of_the_line_advance_desc: "$n_ship_of_the_line_desc$"
 unlock_threedecker_advance: "$n_threedecker$"
 unlock_threedecker_advance_desc: "$n_threedecker_desc$"
 #Enlightenment Institution
 artists_advance_revolutions: "启蒙艺术"
 artists_advance_revolutions_desc: "随着启蒙运动的兴起，艺术在各个分支和社会层面上蓬勃发展。音乐和文学的新出版物引发了人们对这些艺术的广泛兴趣。"
 coal_improvements_revolutions: "蜂窝炉改良"
 coal_improvements_revolutions_desc: "炼焦是铁器加工的关键环节，需要大量蜂窝炉。通过改进炉子的建造方式并使用砖块，我们能够提高所产焦炭的质量。"
 construction_speed_revolutions: "铸铁结构"
 construction_speed_revolutions_desc: "随着冶金工艺的进步，特别是锻铁与铸铁技术的革新，诸如支柱、立柱等更为复杂的金属构件得以制造，这显著提升了建筑工程的建设效率。"
 crown_power_advance_revolutions: "国家主义"
 crown_power_advance_revolutions_desc: "随着所有权力在君主的铁腕统治下统一起来，全国的臣民都意识到了归属感。无论君主统治的是哪片领土，他们都是国家及人民的一份子。"
 diplomatic_range_age_6: "全球大使馆"
 diplomatic_range_age_6_desc: "随着各个国家试图进一步扩展它们的影响力，世界各国的互相之间的联系比以往更甚。只有在全球范围内建立常驻大使馆，才能使这种相互联系维持下去。"
 enlightened_court: "启蒙宫廷"
 enlightened_court_desc: "启蒙运动价值观如今已渗透进任何现代宫廷，伴随而来的是最具才智与学识的人才。得益于此，我们如今能够以更少的投入取得更多的成就。"
 enlightenment_advance: "启蒙运动"
 enlightenment_advance_desc: "在上一个世纪，理性主义和经验主义受到了越来越多的伟大思想家的推崇。理性之光正在缓缓升起，对许多人而言，他们的使命就是马不停蹄地让这束光芒照亮地球的每个角落。"
 government_size_revolutions: "现代代表制"
 government_size_revolutions_desc: "通过建立更好地代表人民的各种形式，政府能够比以往任何时候都更妥善地处理问题。"
 modern_bureaucracy: "现代官僚"
 modern_bureaucracy_desc: "为了最大限度地控制我们的土地和臣民，我们必须扩大、重组我们的官僚机构并使之专业化。一个稳健的官僚组织可以掌控我们国家的每一部分，并避免对于发明临时解决方案需要。让我们的大学研究考虑最好最有效地统治和管理方法，并鼓励贵族子弟用笔而不是刀剑来为国家服务。"
 nation_state_advance: "民族国家"
 nation_state_advance_desc: "将一种文化的全体成员凝聚于同一面旗帜之下的理念蕴含着强大力量。通过培育国族认同感，我们能确保臣民和公民对我们的事业始终保持忠诚。"
 power_projection_advance_6: "全球性霸权野心"
 power_projection_advance_6_desc: "国家的合并导致了主导其大陆大片地区的列强的形成，并且这些列强有意进一步扩大自己的权力。"
 quinine: "奎宁"
 quinine_desc: "尽管“耶稣会树皮”在过去对治疗疟疾有一定效果，但其以干燥树皮粉末形式服用的方式仍有较大改进空间。通过从树皮中分离并提取出真正具有治疗作用的成分，我们可以显著提高该疗法的有效性。"
 rgo_size_advance_revolutions: "蒸汽机"
 rgo_size_advance_revolutions_desc: "蒸汽作为一种驱动机器的动力，自古以来就为人所知。然而，直到最近，物理学和数学的最新进展才使更复杂的蒸汽机得以制造出来，从而为更复杂的机器提供动力，人们才充分认识到它的潜力。这使得所有领域的生产力都大大提高。"
 rights_of_man: "人权"
 rights_of_man_desc: "如今一种人人平等的激进观点占据着革命思想的最前线。来自各地的哲人们通力合作，起草了一份题名为《人权与公民权宣言》的文件。文件宣称如是种种权利乃是普世价值且应当由法律强制贯彻。这可能会在自由民主领域引起广泛的反响，我们可得好好表现以免落后。"
 rotherham_plough: "罗瑟拉姆犁"
 rotherham_plough_desc: "从罗马帝国以来欧洲的犁基本就没变过样。现在，由于设计上的改进，同样的犁可以更轻，减少了牲畜的工作量，使它们能够干更多的活。"
 separation_of_powers: "权力分立"
 separation_of_powers_desc: "一部关于政治理论的匿名论著出现在人们的视野，虽有各方压力对其打压，但仍未能阻止它在世界范围的传播。书中分析了政府形成的本质——无论是君主制，独裁制，还是民主制。该书还提出应将行政权，立法权，司法权严格地分离开来，以保护人民，限制君权，并理所当然受到了我国臣民的欢迎。除了涉及君权的部分以外，这些想法应该会对我们国家大有裨益。"
 slave_trade_act_advance: "奴隶贸易法案"
 slave_trade_act_advance_desc: "劳动力在我们殖民地之间的流动既有利可图又敏感。因此，我们必须投入资源进行立法，加以改进。"
 spy_construction_revolutions: "接触异议者"
 spy_construction_revolutions_desc: "随着新思想和政治制度在我们已确立的世界中传播，我们需要分配资源支持竞争对手国家的这些异议者，并榨取有价值的信息。"
 town_rights_rev_advance: "国家的心脏"
 town_rights_rev_advance_desc: "作为政府的源头，首都是国家的心脏。仅此一点，便足以使其地位高于其他一切。"
 vaccination_advance: "疫苗"
 vaccination_advance_desc: "随着疫苗的发展，医生能够为民众提供对抗致命疾病的免疫力。这些疫苗有助于减少了疾病的传播，并预防流行病的爆发。通过将少量的减毒或灭活细菌或病毒注射到体内，免疫系统能够识别并在再次遇到这种疾病时将其击退。"
 war_score_revolutions_advance: "理性战争条款"
 war_score_revolutions_advance_desc: "战争总是令人痛苦的丑陋事件，给双方带来痛苦。强调这些事实，并诉诸对方的逻辑和理性，将使我们在谈判不可避免的国界变更时，获得显著优势。"
 #Industrialization Institution
 brewery_mill_advance: "$brewery_mill$"
 brewery_mill_advance_desc: "$brewery_mill_desc$"
 clearing_house_advance: "票据清算所"
 clearing_house_advance_desc: "$clearing_house_desc$"
 commerce_center_advance: "$commerce_center$"
 commerce_center_advance_desc: "$commerce_center_desc$"
 cupola_smelting: "冲天炉冶炼工艺"
 cupola_smelting_desc: "此工艺采用圆筒炉，以较低成本高效冶铁，具有连续冶炼的独特能力。"
 distiller_mill_advance: "$distiller_mill$"
 distiller_mill_advance_desc: "$distiller_mill_desc$"
 dyes_mill_advance: "$dyes_mill$"
 dyes_mill_advance_desc: "$dyes_mill_desc$"
 fine_cloth_mill_advance: "精纺工厂"
 fine_cloth_mill_advance_desc: "$fine_cloth_mill_desc$"
 firearms_factory_advance: "$firearms_factory$"
 firearms_factory_advance_desc: "$firearms_factory_desc$"
 furniture_mill_advance: "$furniture_mill$"
 furniture_mill_advance_desc: "$furniture_mill_desc$"
 glass_mill_advance: "$glass_mill$"
 glass_mill_advance_desc: "$glass_mill_desc$"
 gun_factory_advance: "火炮厂"
 gun_factory_advance_desc: "$cannons_factory_desc$"
 hot_blast_furnace: "热风高炉" #Age of Revolutions
 hot_blast_furnace_desc: "焦炭高炉因焦炭杂质问题使得铸铁含有更多杂质，促使了热风技术的发展。此方法不仅显著减少了焦炭使用，从而提高了铁的质量，还可在有原煤资源时直接使用原煤作为燃料，这在冶铁领域是一项重大进步。"
 industrialization_advance: "工业革命"
 industrialization_advance_desc: "工业革命的兴起带来的国际性和持久的变革，不仅改变了商业和贸易，也改变了社会结构本身。动力织布机和蒸汽机等发明将推动人类能力达到前所未有的顶峰。"
 insurance_companies: "保险公司"
 insurance_companies_desc: "随着保险业的发展，风险在进一步降低。通过支付给保险业者很小一部分费用就可以在出事时获得赔偿，这促进了贸易的进一步增长。"
 iron_mill_advance: "$iron_mill$"
 iron_mill_advance_desc: "$iron_mill_desc$"
 joint_stock_companies: "股份公司"
 joint_stock_companies_desc: "随着贸易的发展，风险也随之而来。人们需要新的方法来积累资本和管理风险。在股份制企业中，我们可以和股东共同分担风险。"
 maritime_advance_age_6: "武装船队"
 maritime_advance_age_6_desc: "对于任何海盗来说，贸易船队显然都是非常诱人的目标。装满货物和金币的船只是很少有人会放过的战利品。因此，为这些护航船队提供防御武器，以阻止这些袭击至关重要。让贸易船队由护卫舰或其他武装船只陪同，可以确保它们的安全。"
 merchant_power_from_maritime_revolutions_advance: "有限公司"
 merchant_power_from_maritime_revolutions_advance_desc: "特许公司频繁破产催生了一种新型公司，在这种公司中股东的责任被限定在固定金额内，使贸易合伙风险降低，因而更具吸引力。"
 naval_supplies_mill_advance: "$naval_supplies_mill$"
 naval_supplies_mill_advance_desc: "$naval_supplies_mill_desc$"
 paper_guild_wood_pulp_maintenance_advance: "$paper_guild_wood_pulp_maintenance$"
 paper_guild_wood_pulp_maintenance_advance_desc: "利用随处可见的软木材，纸张生产将变得比以往更容易、更便宜。"
 paper_mill_advance: "$paper_mill$"
 paper_mill_advance_desc: "$paper_mill_desc$"
 peasants_rights_laws_advance: "$peasants_rights_laws$"
 peasants_rights_laws_advance_desc: "$peasants_rights_laws_desc$"
 pop_promotion_speed_age_6: "资本主义的社会流动"
 pop_promotion_speed_age_6_desc: "资本主义的扩展孕育了一个新的社会流动时代，在这个时代，从资本家到职员再到产业工人，财富正在取代传统的等级制度，成为提高社会地位的手段。"
 pottery_mill_advance: "$pottery_mill$"
 pottery_mill_advance_desc: "$pottery_mill_desc$"
 printing_mill_advance: "$printing_mill$"
 printing_mill_advance_desc: "$printing_mill_desc$"
 putrefaction_mill_advance: "$putrefaction_mill$"
 putrefaction_mill_advance_desc: "$putrefaction_mill_desc$"
 railroad_advance: "$railroad$"
 railroad_advance_desc: "$railroad_desc$"
 repair_at_sea_aorev: "深水倾斜修理" #Age of Revolutions
 repair_at_sea_aorev_desc: "这一先进的修理技术在沿海深水中进行，通过将重货置于船体一侧使其倾斜，从而使船员能够修理另一侧船体，而不需要像常规的倾斜法那样在海岸上停下来等待退潮。"
 revolutions_agressive_advance: "正当化的冲突"
 revolutions_agressive_advance_desc: "国际外交舞台追求国家间的力量平衡。因此，发动侵略战争会受到责难，若战胜，可能会形成联合起来反对胜利者的联盟。\n然而，通过巧妙运用外交手段和灵活的解释，我们可以让敌人显得是攻击我们的一方，使我们的战争和战果在公众眼中显得更为正当。"
 revolutions_subject_opinions_advance: "仁慈的宗主权"
 revolutions_subject_opinions_advance_desc: "革命的火焰是不可轻视的威胁。如果我们想确保属国的忠诚，我们必须通过任命忠诚的总督并消除任何动乱的原因，在萌芽阶段扼杀叛乱的想法。"
 road_advance_2: "基础道路"
 road_advance_2_desc: "简陋的道路网络已经让位于发展交通系统的需要。通过扩建道路，我们将扩大我国境内的货物流通。"
 steel_mill_advance: "炼钢厂"
 steel_mill_advance_desc: "$steel_mill_desc$"
 subject_income_revolutions_advance: "有偿主权论"
 subject_income_revolutions_advance_desc: "随着我们周围的世界在各个领域发生巨大变化，现在我们比以往任何时候都更能利用有偿契约来换取对属国存续的支持。"
 superior_ship_design: "先进船舶设计"
 superior_ship_design_desc: "比我们的对手更快地建造[ships|e]，即使这一优势微弱到在军事方面毫无意义，但这依然可以增强我们水手的信心，并在战斗中震慑敌人。"
 tannery_mill_advance: "$tannery_mill$"
 tannery_mill_advance_desc: "$tannery_mill_desc$"
 tax_assessor_advance: "税务局"
 tax_assessor_advance_desc: "$tax_assessor_desc$"
 textile_mill_advance: "纺织厂"
 textile_mill_advance_desc: "$textile_mill_desc$"
 the_gold_standard: "金本位"
 the_gold_standard_desc: "欧洲和中国之间的贸易逆差在欧洲和全世界都造成了白银短缺。如果我们从银本位变为金本位就可以为流通领域提供新的货币并促进贸易发展。"
 urbanization: "城市化"
 urbanization_desc: "新兴城市为我们的居民提供了新的机会和安全保障，吸引了越来越多的人离开农村农场，填补新兴现代工厂创造的产业岗位。"
 weapon_factory_advance: "兵器厂"
 weapon_factory_advance_desc: "$weapon_factory_desc$"
 #Levee En Masse Institution
 advanced_anti_piracy_warfare: "反私掠协定"
 advanced_anti_piracy_warfare_desc: "在这个充满发现与人文思想的时代，海上航线的盗窃和暴力行为已经不再有立足之地。越来越多的国家联合起来，应对这一对全体福祉和繁荣的共同威胁，并承诺终结这一祸患。"
 army_movement_speed_revolutions: "军需采买制"
 army_movement_speed_revolutions_desc: "在行军经过的地区，以公平的价格购买我军需要的食物和补给，而不是进行抢掠，这样的做法加速了在该地区的行军速度，因为农民们会自己将商品送到我们设立的收集点。"
 artillery_vs_fort_age_6_revolutions: "先进榴弹炮"
 artillery_vs_fort_age_6_revolutions_desc: "对介于攻城炮的直线火力与臼炮的高弧度间接火力之间的武器需求，为了满足这一需求，促使我们的军队研发了新型榴弹炮。"
 assault_ability_revolutions: "火线强攻令"
 assault_ability_revolutions_desc: "我们的军队心甘情愿地在炮火和尘土的混乱中前进，为部队夺取敌人的堡垒开辟道路。尽管火炮和新防御工事技术取得了进步，但我们在攻击敌方城墙方面的技艺仍然无可匹敌。"
 combined_arms_advance_revolutions: "兵种联合战术"
 combined_arms_advance_revolutions_desc: "数世纪以来，兵种联合战术的常态化运用，使其成为战场主流战法。轻装步兵与骑兵负责袭扰敌军、打乱其阵型，同时掩护己方部队的侧翼与后方。重装步兵与骑兵作为主力承担正面攻坚，发起决定性冲锋以击溃敌军。炮兵与辅助部队则在后方远程提供火力支援与后勤保障。"
 conscription_advance: "$a_conscripts$"
 conscription_advance_desc: "$a_conscripts_desc$"
 conscription_center_advance: "征兵中心"
 conscription_center_advance_desc: "$conscription_center_desc$"
 corps_organisation: "团队精神"
 corps_organisation_desc: "传统军队依赖严格的纪律来维持军中秩序，但通过激发军人的自豪感，我们可以达到更高的纪律水平。"
 correct_box_advance_revolutions: "总参谋部"
 correct_box_advance_revolutions_desc: "军队规模不断增长，它们在长期战役中的部署更需统筹规划，指派专职军官负责计划和后勤任务的需求日益迫切，以有效协调战场上各支部队的行动。"
 fort_limit_6_advance: "军事工程测量学"
 fort_limit_6_advance_desc: "通过系统的测绘技术与高效的物资调配，所有军事据点被整合为统一的防御网络；这是官僚体制、新兴学科与国家机器协同运作所取得的成就。"
 fortress_advance: "要塞"
 fortress_advance_desc: "$fortress_desc$"
 impulse_warfare: "袭扰战术"
 impulse_warfare_desc: "轻步兵的引入导致了战争方式的改变。在主要部队攻击前，散兵们以散阵部署为一行或一列来分散并骚扰敌军。"
 levee_en_masse_advance: "全民动员"
 levee_en_masse_advance_desc: "战争是一个不断演化的概念，它经历了一代又一代的创新与磨砺。侵略与野心的锻炉呼唤着年轻的躯体作为供养的燃料，而全新的征兵法案将得到起草，以将全国所有未婚男子征募在其麾下，他们的规模将足以屈折历史的进程。"
 long_rifle: "长管猎铳"
 long_rifle_desc: "专为狩猎设计的长管步枪，成为获取毛皮与野味的可靠利器。"
 march_to_the_sound_of_the_guns_advance: "$march_to_sound_of_guns$"
 march_to_the_sound_of_the_guns_advance_desc: "随着我军规模的稳步增长，放宽后勤要求变得尤为重要。战事爆发时，命令将领让兵力分头行动并迅速增援战场，将对我们大有裨益。"
 military_tactics_advance_6: "野战炮兵"
 military_tactics_advance_6_desc: "火炮能够随军机动，在战场上作战，它影响力便不再局限于射程内的目标。由炮兵军官领导的半自动炮兵编队可以部署到最需要他们的地方。"
 napoleonic_warfare: "拿破仑战术"
 napoleonic_warfare_desc: "对我们的陆军来说，围攻是一项耗费时间和金钱的任务。与其将精力分散在各个堡垒上，不如集中策略，一举击溃敌军，以赢得战争。"
 public_punishments: "公开处罚"
 public_punishments_desc: "海上的生活充满了危险，因此，需要严厉的惩罚来维持纪律。如果没有足够的威慑效果，我们会很快陷入困境。随着时间的推移，一套严格的惩处措施已经逐步形成，现在是时候将其正式确立下来。这将大大加强海上生活的纪律性。"
 recruitment_improvements_revolutions: "广泛征募"
 recruitment_improvements_revolutions_desc: "发生冲突威胁的地域比以往任何时候都更为广泛，我们需要相应地扩大征兵系统。通过奖励加入军队的志愿者、强制征募罪犯服役，我们将能够更迅速地应对任何危险。"
 regiment_reinforcement_speed_revolutions: "大规模军事训练"
 regiment_reinforcement_speed_revolutions_desc: "现代常备军比过去任何军事力量都更为庞大。战术由成千上万的人执行，伤亡人数前所未有。我们新的军事训练将通过同时训练数百名士兵。来适应现代战争的死亡率。"
 siege_ability_revolutions: "炮兵军官"
 siege_ability_revolutions_desc: "炮兵的重要性已发展到如此地步，它需要专业军官接受技术培训，并在现代战争中充分发挥作用。"
 supply_depot_advance_age_6_revolutions: "战役仓库"
 supply_depot_advance_age_6_revolutions_desc: "多支军队的长期战役对我们的补给系统施加了额外的压力，因此建立规模更大、建造更快的仓库，对于维持补给至关重要。"
 unlock_cuirassiers_advance: "$a_cuirassiers$"
 unlock_cuirassiers_advance_desc: "$a_cuirassiers_desc$"
 unlock_flying_battery_advance: "$a_flying_battery$"
 unlock_flying_battery_advance_desc: "$a_flying_battery_desc$"
 unlock_fusiliers_advance: "$a_fusiliers$"
 unlock_fusiliers_advance_desc: "$a_fusiliers_desc$"
 unlock_grenadiers_advance: "$a_grenadiers$"
 unlock_grenadiers_advance_desc: "$a_grenadiers_desc$"
 unlock_light_dragoons_advance: "$a_light_dragoons$"
 unlock_light_dragoons_advance_desc: "$a_light_dragoons_desc$"
 unlock_logistics_corps: "$a_logistics_corps$"
 unlock_logistics_corps_desc: "$a_logistics_corps_desc$"
 unlock_sharpshooters_advance: "$a_sharpshooters$"
 unlock_sharpshooters_advance_desc: "$a_sharpshooters_desc$"
 #Choice ADM
 benevolence: "仁慈之心"
 benevolence_desc: "我国是宽容和启蒙的堡垒。通过确保其他国家知道这一点，我们可以培养更好的国际关系。"
 formal_administration: "正规行政"
 formal_administration_desc: "正确的程序和精密的行政机器可使国家昌盛，因为没有适当的行政管理，国家打算做的任何事情都将徒劳无功。我们将使行政体制正规化、标准化，使国家的意志通过它自然地流向全国各个角落。"
 fort_logistics: "防御工事后勤"
 fort_logistics_desc: "通过在建设和后勤方面，合理地统筹我们的防御工事系统，我们可以在长期维护方面节省一些资金。"
 improved_shipyards: "改善船厂"
 improved_shipyards_desc: "要保证我们在全球的利益，我们需要一支强大的[navy|e]。我们必须确保我们的造船厂尽可能以最大效率生产船舰，以便随时补充战场上的损失。"
 indirect_rule: "间接统治"
 indirect_rule_desc: "有时候，让民众服从命令的最好方法，就是让他们相信他们可以做出自己的选择。这类间接统治的体制将减少新获得领土的动乱。"
 legislative_efficiency_idea: "行政效率"
 legislative_efficiency_idea_desc: "任何政府最重要的部分是得到正确的建议。我们对于顾问必须尽可能地包容以便于我们可以得到最大限度的不同观点。"
 nationalistic_enthusiasm: "爱国热忱"
 nationalistic_enthusiasm_desc: "支持我们的军队对国防至关重要。凭借我们卓越的管理能力，我们能够为物资采购争取到可观的折扣。"
 optimism: "军事乐观主义"
 optimism_desc: "胜利并不仅是在战场上打败敌人，而且还在于向手下灌输必胜的意志。如果战士们坚信他们是占据优势的一方，他们便会克服暂时的艰难险阻，将胜利由可能变为必然。"
 regulation_bureau: "监管局"
 regulation_bureau_desc: "一个立法机构，其管辖范围涉及维护和促进与通货膨胀有关的法律以及我们各省的地方行政。"
 smithian_economics: "自由市场经济"
 smithian_economics_desc: "通过反对重商主义并限制国家对经济事务的干预，我们将支持自由市场，从而提高整体生产效率。"
 #Choice DIP
 additional_loyalist_recruitment: "招募额外效忠派"
 additional_loyalist_recruitment_desc: "自然而然，在我们属国的土地上有一些人理解我们统治的神圣权利。通过招募和协助这些明事理的人，可以加强我们对属国的控制。"
 buffer_states: "缓冲国"
 buffer_states_desc: "没有什么比和你有过争执的人做邻居更糟糕的了。如果我们想避免边境紧张，那么，让其他国家作为我们与潜在敌人之间的缓冲地带，可以让我们有一些喘息空间。"
 flexible_negotiation: "灵活谈判"
 flexible_negotiation_desc: "你永远都不知道在谈判桌上会获得些什么，所以，请记得把你所有的选项带上谈判桌。"
 global_empire: "全球帝国"
 global_empire_desc: "我们对于整个殖民帝国的责任改变了管理殖民活动的官员们的工作态度。这里不再是海盗们横行无忌的天堂，聪明善良的公民们在这里安居乐业。而这些都将充实我们的税收。"
 merchant_marine: "商船护航"
 merchant_marine_desc: "我们应当令所有的商船上都飘扬起我们的旗帜，并使它们相信，一俟出现危险，我们的海军永远会是它们最为坚强的后盾。"
 merchant_power_from_maritime_rev_dip_choice: "商船舰队"
 merchant_power_from_maritime_rev_dip_choice_desc: "商船在我国水域出没已是司空见惯。商人们往来的船只如此之多，实质上已自成舰队规模。"
 morale_recovery_rev_dip_choice: "休整制度"
 morale_recovery_rev_dip_choice_desc: "没有军队能持续保持作战状态，士兵们需要休整与恢复的时间。通过建立规范的休整周期，既能避免士兵懈怠又能使部队保持最佳状态。"
 overseas_merchants: "海外商人"
 overseas_merchants_desc: "为了繁荣贸易，我们需要将公民权扩大至那些居住在国外的本国公民，全力支持贸易发展。以及相对应的社会阶层。"
 postal_service: "邮政业务"
 postal_service_desc: "通讯条件现在的水平很难确保我们的外交急件及时送达。创建一个邮局和驿站的网络，将会使我们的意志能更容易地传达到偏远地区。"
 sea_hawks: "海鹰之魂"
 sea_hawks_desc: "使我们能够迅速推进海军科技，加强海军传统。"
 #Choice MIL
 bayonet_leaders: "尖刀将领"
 bayonet_leaders_desc: "治兵有方的将领，士兵会愿意为他效死。因此，我们要确保军官们会在最前线上做出榜样。"
 improved_logistics: "改善后勤"
 improved_logistics_desc: "现代战争艺术如今明确区分了谈论战术的业余官员和研究后勤的专业官员。"
 land_morale_movement_cost_rev_choice_mil: "铁血行军"
 land_morale_movement_cost_rev_choice_mil_desc: "我军行进之姿堪称典范。严苛训练铸就的纪律性，使得部队即便经历长途跋涉，仍能保持整齐队形从容投入战斗。"
 mass_army: "总动员陆军"
 mass_army_desc: "迄今为止，我们一直在以严格标准为军队招募士兵。我们只挑选那些最为贫困、最为绝望的人，因为他们已经无甚留恋。现在，军队将为所有并不富裕的人敞开大门。"
 massed_battery: "炮兵集中"
 massed_battery_desc: "我们应当最大限度地集中使用我们的炮兵。这样，毁灭性的火力将在敌军的阵列中轻松撕开一个大洞。"
 national_conscripts: "全国征募制度"
 national_conscripts_desc: "强制征兵的举措可以使我们的部队规模得到迅速的扩充。"
 port_cost_distance_from_capital_choice_mil: "海岸巡防"
 port_cost_distance_from_capital_choice_mil_desc: "建立完善的海岸巡逻体系，将确保我们的行政管理效力覆盖所有海域，纵使最偏远的沿岸也不例外。"
 press_gangs: "强征入伍"
 press_gangs_desc: "海上的生活非常艰苦，容不得一点差错。但是，并不是所有的海员都乐于在海军服役。通过将强行征召水手的行为合法化，我们将能够更有效地征召船员，由此提高舰船的服役速度。"
 superior_seamanship: "优良航海技术"
 superior_seamanship_desc: "使我们的[navy|e]能够拥有高等级舰船，以及高水平的船长和水手。"
 the_young_can_serve: "收纳童军"
 the_young_can_serve_desc: "多长的岁月可以使男孩子变成男子汉？多大的年纪才能让这些男人为国捐躯？有些统治者确实过分拘谨，而我们有时候又与刽子手别无二致。"
 #Government Types
 #Monarchy
 #Age 1 - Age of Traditions
 feudal_de_jure_law_advance: "$feudal_de_jure_law$"
 feudal_de_jure_law_advance_desc: "#italic 法理#!，即“依法而论”，是对法律上认可的实践的描述，不论其实践是否符合现实。封建社会体系便是建立在此概念之上。"
 monarchy_reform_traditions_advance: "君主制改革传统"
 monarchy_reform_traditions_advance_desc: "国家权力不能分散，不应托付给国内的任何个人。应当将影响力集中在统治者手中，确保强大王权下的秩序与稳定。"
 monarchy_royal_court_advance: "$royal_court_customs_law$"
 monarchy_royal_court_advance_desc: "$royal_court_customs_law_desc$"
 noble_knights: "贵族骑士"
 noble_knights_desc: "维持一支骑兵部队需要整个经济系统提供大量的多余马匹。如果我们能够确保贵族阶级的特权，那么他们不仅会感到更加快乐，还会替我们承担生产所需马匹的工作。我们的宫廷小丑们认为，这就是所谓的服务保障服从。"
 partition_inheritance_advance: "分割继承制"
 partition_inheritance_advance_desc: "君主的儿子们之间的竞争并不少见，因为每个人都希望成为未来的君主。为了避免这种竞争，一些君主决定将所有领土和头衔分配给所有儿子，这样他们就会因平等地继承遗产而心满意足。"
 salic_law_advance: "萨利克法"
 salic_law_advance_desc: "在世界各地的君主制国家中，女性的地位并不总是受到尊重。因此，在这些君主国中，直接禁止女性参与遗产继承，并由男性兄弟或堂兄弟继承的法律并不罕见。"
 semi_salic_law_advance: "$semi_salic_law$"
 semi_salic_law_advance_desc: "根据$salic_law$，只有男性有权继承王位。然而当男性血脉断绝时，此项制度将导致王位继承危机。为了避免这种情况，应扩大妇女的权利，使其在没有合适的男性继承人的情况下有资格继承。"
 serfdom: "封建农奴"
 serfdom_desc: "没什么人愿意当步兵。这些马前小卒缺少[food|e]、薪俸不高，医疗也毫无保障。通过把农民牢牢拴在土地上，我们就会有稳定的新兵来源。"
 #Age 2 - Age of Renaissance
 aristocracy: "贵族政治"
 aristocracy_desc: "贵族政治是所有君主制的关键，王室身边的贵族们正是君主正当性的来源。归根结底，没有贵族血统的概念就不会有王室血统。因此，贵族们总是支持君主，但也希望拥有特权，以免与普通群众混为一谈。"
 local_nobility: "本土贵族"
 local_nobility_desc: "贵族们天生认为他们高人一等，并且愿意将自己的忠诚托付给那些值得托付的主君。如果我们能够确保他们的特权，他们便会铭记我们的宽宏大度，并在外国势力的引诱面前坚若磐石。"
 #Age 3 - Age of Discovery
 military_traditions: "军事传统"
 military_traditions_desc: "军事思想的变革日新月异，而我们需要做的就是紧跟时代的发展。贵族尽忠于主君的传统应当得到强化，优越的社会地位需要以战场上的奋勇行为作为保证。尽管勇敢精神之类的美德是很重要的，但当你发现自己的军队高出对方一等时，事情往往会简单得多。"
 #Age 4 - Age of Reformation
 legitimization_of_power_law_advance: "$legitimization_of_power_law$"
 legitimization_of_power_law_advance_desc: "$legitimization_of_power_law_desc$"
 noble_officers: "贵族军官"
 noble_officers_desc: "为部队挑选指挥官是一件头等大事，而贵族们总是跃跃欲试，希望能够得到你的偏爱。再没有什么能比挥起兵刃砍向敌人更能证明他们的勇武了，记得把这种机会交给他们吧。"
 #Age 5 - Age of Absolutism
 noble_resilience: "贵族纽带"
 noble_resilience_desc: "在这片大陆上，各种骑兵组织往往由小贵族领导。通过善待贵族，我们可以利用他们的人脉，获得更多更大规模的骑兵。"
 #Age 6 - Age of Revolutions
 international_nobility: "贵族外交"
 international_nobility_desc: "国际关系错综复杂，需要小心应对。有人认为，惯于与外国人打交道的商人阶级往往精于此道。但他们忽视了一点，那就是贵族们经年累月地建立起来的亲戚关系。在外交活动中，这些宗族关系往往会为我们带来很大的帮助。"
 #Republic
 #Age 1 - Age of Traditions
 banking_country_traditions: "银行业传统"
 banking_country_traditions_desc: "许多国家在贸易和商业的机会中寻求财富时，我们的国家靠着提供借贷维持生计。"
 bill_of_rights: "权利条款"
 bill_of_rights_desc: "使我们的国民享有各项基本权利，显著降低发生内乱的几率。"
 republic_reform_traditions_advance: "共和国改革传统"
 republic_reform_traditions_advance_desc: "权力的分散是健康的共和制的核心理念。抽签选举制支撑的强大法律体系将确保国家稳定并减少腐败。"
 republican_foundation_law_advance: "$republican_foundation_law$"
 republican_foundation_law_advance_desc: "$republican_foundation_law_desc$"
 #Age 2 - Age of Renaissance
 abolished_serfdom: "解放农奴"
 abolished_serfdom_desc: "罗马的历史告诉我们，由自由公民组成的军队在战斗意志上会远远胜过被强制拉上战场的乌合之众。因此，我们有必要赐予农民们以自由，这样他们将在战场上誓死保卫自己的自由。"
 plutocracy: "金钱之力"
 plutocracy_desc: "财富和权力不是同义词，但却息息相关。因为不仅权力可以使人富有，而且财富也可以赋予人权力。我们明白，因为我们最富有的人也是那些占据国家权力席位的人。"
 republican_election_law_advance: "$republican_election_law$"
 republican_election_law_advance_desc: "$republican_election_law_desc$"
 republican_electorate_law_advance: "$republican_electorate_law$"
 republican_electorate_law_advance_desc: "$republican_electorate_law_desc$"
 #Age 3 - Age of Discovery
 free_merchants: "自由商人"
 free_merchants_desc: "在一个相对顽固守旧的社会中，商人的社会地位要低于那些拥有土地的人。但很幸运我们并不是这样，财富就是力量，无论这财富是怎么来的。"
 republican_power_law_advance: "$republican_power_law$"
 republican_power_law_advance_desc: "$republican_power_law_desc$"
 tradition_of_payment: "发薪传统"
 tradition_of_payment_desc: "一般来说，人们倾向于将雇佣兵们的发薪日一推再推，毕竟谁都不知道这帮大爷会不会心血来潮，提出一些让人措手不及的要求。但我们不会这么做，我们会按时为雇佣兵们发放薪水，而佣兵队长们将会对我们的美德铭记在心。"
 #Age 4 - Age of Reformation
 free_cities: "自由城邦"
 free_cities_desc: "在贸易方面交给我们的城邦自治将使我们打开新的有利可图的贸易路线。"
 principle_of_administration_law_advance: "行政法的原则"
 principle_of_administration_law_advance_desc: "我国错综复杂的行政管理的自然演变，要求我们采纳与我们的行政体系相适应的新法律。"
 #Age 5 - Age of Absolutism
 free_subjects: "自由臣民"
 free_subjects_desc: "尽管对于奴仆们来说一顿暴打往往会非常合适，但这并不能有效地令他们勤奋工作。一些自然哲学家们偶然发现，提高人们的工作积极性会带来非常丰厚的回报。如果我们能够用征收实物来取代货币地租的话，我们的农民们便会更加积极地生产出更多的作物了。"
 #Age 6 - Age of Revolutions
 emancipation: "解放土地"
 emancipation_desc: "长期以来，只有那些我们认为值得信赖的人才有权拥有土地。如果我们废除这些限制，那么土地所有关系便会得到巩固。由此，那些选择从军打仗的人们便可以周期性地投入到生产活动中去了。"
 #Steppe Horde
 #Age 1 - Age of Traditions
 beyond_the_sun: "超越太阳"
 beyond_the_sun_desc: "伟大汗国的时代还没有结束！从敌人的错误中吸取的教训让我们的崛起更加聪慧而强大。从日出之地到日落之地的一切土地必将属于我们！"
 borjigin_blood: "$Borjigin$血脉"
 borjigin_blood_desc: "我们沿袭$Borjigin$的血脉，正是$genghis_khan_name_no_tooltip$本人的后裔。所有国家都应敬畏我们的传承，所有草原领土都应承认我们为他们的一部分。"
 caravanserai_advance: "$caravanserai$"
 caravanserai_advance_desc: "在过去的一千年中，中亚地区涌现出了许多贸易路线，形成了我们所称为丝绸之路的贸易网络。这个网络的关键是$caravanserai$的繁荣，商人和他们的商队可以在路途中停下来休息。"
 horse_lords: "大草原的马上汗王"
 horse_lords_desc: "只有拥有了人的品格，才能称得上是真正的野兽。骏马与我们的孩童一起出生、成长，它们也从我们的人民身上学到了勇猛而高贵的品格。我们将它们所受的严酷训练当作最伟大的荣耀，而它们也将我们认作最伟大的首领。"
 kurultai_advance: "忽里勒台大会"
 kurultai_advance_desc: "通过召集每个勇士部族的领袖，我们可以选举出将带领我们的部族走向胜利的$rank_empire_horde_ruler_suffix_male$。在一个帐篷里，我们人民的命运将被决定，领袖将在那些自认为配得上领导我们的人中被选出。"
 steppe_slave_raiding: "草原掠奴"
 steppe_slave_raiding_desc: "我们的掠袭分队如风般迅速，几乎在任何人察觉到我们存在之前就完成出击并脱离。攻击我们目标的定居点并不是唯一赚钱的方式，我们还可以抓捕囚犯，将他们卖出以获取可观的收入。"
 turco_mongol_tradition: "突厥‑蒙古传统"
 turco_mongol_tradition_desc: "虽然$Borjigin$王朝源于$mongolian_culture$，但$genghis_khan_name_no_tooltip$在$central_asia$征服的领土主要居住着$turkic_group$族群。因此，这两个群体之间形成了一种独特的文化融合。"
 yams_of_the_great_khan: "大$rank_kingdom_horde_ruler_suffix_male$站赤"
 yams_of_the_great_khan_desc: "为了确保信使能追上蒙古军队，$genghis_khan_name_no_tooltip$建立了一个驿站系统，每隔30‑60公里就设一个驿站，为信使提供食物、住宿及换乘马匹。这使得信使能够策马狂奔，而无需担心疲劳的马匹阻碍其赶路速度。利用以上手段，我们庞大的“蒙古和平”帝国克服了后勤问题，至少暂时如此。"
 #Age 2 - Age of Renaissance
 mandate_of_the_khan: "$rank_kingdom_horde_ruler_suffix_male$之天命"
 mandate_of_the_khan_desc: "即便是神佛也要听从$rank_kingdom_horde_ruler_suffix_male$的号令行事。我们人民的团结来源于对我们伟大首领的忠诚。唯有可使诸王屈服之王，才配得上我们的忠诚。"
 slavery_before_death: "奴役胜于毁灭"
 slavery_before_death_desc: "在战争中，焚毁和掠夺城市是常见的做法。过去，我军士兵会狂暴地破坏，劫掠一切物品，并屠杀所有抵抗者。虽然这种行为能提升士气，但却极为不经济。采用新的方式，我们可以确保至少奴役那些有能力工作的人，而不是盲目斩首他们用来装饰颅骨王座。"
 steppe_horde_tribal_religious_values_law_advance: "$tribal_religious_values_law$"
 steppe_horde_tribal_religious_values_law_advance_desc: "$tribal_religious_values_law_desc$"
 there_shall_be_no_grass: "寸草不生"
 there_shall_be_no_grass_desc: "不论哪里，只要我们的大军经过，都将寸草不生，这片土地将无法再供养我们的敌人，日复一日，土地将永远荒芜下去，颗粒无收。总有些饥饿你无法逃避。"
 #Age 3 - Age of Discovery
 horde_loot_discovery_advance: "掠袭收益"
 horde_loot_discovery_advance_desc: "掠夺一直是我们文化底蕴的一部分。洗劫与掠夺是我们民族获得训练和财富的重要方式。进一步鼓励袭击行动并没有什么害处，至少对我们来说没有害处。"
 horde_loyalty: "游牧忠诚"
 horde_loyalty_desc: "我们人民的忠诚是毋庸置疑的。在$rank_kingdom_horde_ruler_suffix_male$的繁荣统治下生活过的人，都不会想离开它。"
 steppe_horde_tribal_cultural_identity_law_advance: "$tribal_cultural_identity_law$"
 steppe_horde_tribal_cultural_identity_law_advance_desc: "$tribal_cultural_identity_law_desc$"
 trampling_horde: "震颤的游牧群"
 trampling_horde_desc: "$genghis_khan_name_no_tooltip$用他的征服让全世界颤抖，我们也要继续征服的步伐。世界将学会害怕我们的马蹄声。"
 #Age 4 - Age of Reformation
 logistics_of_khan: "$rank_kingdom_horde_ruler_suffix_male$的后勤学"
 logistics_of_khan_desc: "人们只记得大$rank_kingdom_horde_ruler_suffix_male$强大的军事实力，却忘记了他们卓越的后勤能力。我们必须效仿大$rank_kingdom_horde_ruler_suffix_male$的方法，这可以让我们征服更广大的土地。"
 populating_the_steppes: "移民大草原"
 populating_the_steppes_desc: "在我们给敌人带来毁灭的同时，我们必须为仍居住在国内的人带来和平。通过捍卫内部的和平，鼓励帝国各地有才华的男人与女人去规划并建立新的伟大城市，我们将驯服草原。"
 steppe_horde_tribal_modernization_law_advance: "$tribal_modernization_law$"
 steppe_horde_tribal_modernization_law_advance_desc: "$tribal_modernization_law_desc$"
 watchers_of_the_silk_road: "丝路守望者"
 watchers_of_the_silk_road_desc: "我们用不着建设或是贸易。我们夺取我们所需……有时不仅如此。我们的战士不眠不休地监视着外国商人和他们的小花招，因此我们知道哪里才是运输货物最安全的道路。"
 #Age 5 - Age of Absolutism
 a_magnanimous_empire: "宽宏帝国"
 a_magnanimous_empire_desc: "大$rank_kingdom_horde_ruler_suffix_male$治下的繁荣不只以他令人恐惧的宝剑闻名于世，他对明智地屈膝于他的人展现出的虔诚也远近皆知。那些欢迎我们宽容帝国统治的人也将被作为我们帝国的一部分来同等对待。"
 #Age 6 - Age of Revolutions
 horde_ardor: "游牧热忱"
 horde_ardor_desc: "我们的马匹让敌人感受到了无比的勇猛和恐惧，正如驾驭它们的骑手一样。我们的骑兵如同无可阻挡的地狱恶魔般，向战争进发。"
 #Theocracy
 #Age 1 - Age of Traditions
 by_the_grace_of_god: "上主恩典"
 by_the_grace_of_god_desc: "世界是在火焰中创造的，我们都将在火焰中灭亡。我们的神把生命之火赐予了我们这些卑微的凡人，在此过程中会燃烧我们的灵魂，让我们看到危险的真相。汝不应惧怕。"
 servants_of_god: "神的忠仆"
 servants_of_god_desc: "成为这神圣机器中的一个齿轮是一个人的最大荣幸。有我们自己的神作为主，我们的人民的心就会以雷鸣般欢呼，跳动。"
 state_of_clerics: "神职人员的地位"
 state_of_clerics_desc: "神权政治的本质是接近神性。为了实现这一目标，我们的许多政府要职都是由神职人员执行的，他们将宗教仪式与行政人员的官僚职责相结合。"
 theocracy_divine_cause_law_advance: "$divine_cause_law$"
 theocracy_divine_cause_law_advance_desc: "$divine_cause_law_desc$"
 #Age 2 - Age of Renaissance
 flesh_is_weak: "血肉苦弱"
 flesh_is_weak_desc: "血肉苦弱，灵魂永存。我们的军队已经学会了同心戮力，因此他们的士气将永远不会被击垮。"
 friends_in_high_places: "位高权重的朋友"
 friends_in_high_places_desc: "只有一条路能把我们引向永恒的幸福。认识祂在大地上最亲密的代理人就等于认识神。他们会帮我们找到那条路。"
 #Age 3 - Age of Discovery
 alpha_and_omega: "由始至终"
 alpha_and_omega_desc: "我们的神是万物之始，万物之终。祂的声音将盖过战斗中的怒吼，传入敌人的耳中。祂的虔诚将引导他们进入祂的怀抱。然后，他们将看到真理。"
 #Age 4 - Age of Reformation
 conviction_of_sin: "悔罪"
 conviction_of_sin_desc: "那些做错事的人将屈膝下跪，永受罪孽的折磨。除非他们为自己所造成的恶果赎罪，否则将永远不得安眠。"
 theocracy_nature_of_our_faith_law_advance: "$nature_of_our_faith_law$"
 theocracy_nature_of_our_faith_law_advance_desc: "$nature_of_our_faith_law_desc$"
 #Age 5 - Age of Absolutism
 martyrs: "殉道者"
 martyrs_desc: "殉道者即是那些知道为神而死是最高荣誉的人。我们土地上的人民将信仰深藏于心，并始终热切地加入我们的事业。"
 #Age 6 - Age of Revolutions
 divine_passion: "神圣热情"
 divine_passion_desc: "时代在变。在曾经信仰高于一切的地方，曾经被视为异教的思想正在普通民众中传播。面对一个不断变化的世界，我们的神职人员在我们坚定不移的奉献中找到了慰藉。"
 #Tribe
 #Age 1 - Age of Traditions
 tribal_religious_values_law_advance: "$tribal_religious_values_law$"
 tribal_religious_values_law_advance_desc: "$tribal_religious_values_law_desc$"
 #Age 4 - Age of Reformation
 tribal_migration_law_advance: "$tribal_migration_law$"
 tribal_migration_law_advance_desc: "$tribal_migration_law_desc$"
 #Age 5 - Age of Absolutism
 tribal_cultural_identity_law_advance: "$tribal_cultural_identity_law$"
 tribal_cultural_identity_law_advance_desc: "$tribal_cultural_identity_law_desc$"
 #Age 6 - Age of Revolutions
 tribal_modernization_law_advance: "$tribal_modernization_law$"
 tribal_modernization_law_advance_desc: "$tribal_modernization_law_desc$"
 #Religions
 #Buddhism
 #Age 1 - Age of Traditions
 buddhist_syncretism: "$buddhist_ADJ$融摄"
 buddhist_syncretism_desc: "尽管$buddhist$已经广泛传播，但它起源于$india$，并与许多不同的信仰接触。因此，它不仅与之前的$hindu_ADJ$传统融合，还与许多接触到的神灵进行了融合。"
 four_noble_truths: "四圣谛"
 four_noble_truths_desc: "$four_noble_truths$是对存有现状的解释，是佛陀教义的起源和基础。一切无常，由于意识执着于无常，即导致苦。只有通过解脱自我并放下执着，才能缓解苦，而这可以通过遵循$noble_eightfold_path$来实现。"
 middle_way: "中道"
 middle_way_desc: "佛陀教导我们应该避免极端，因为无论是感官放纵还是极端禁欲，都无法达到觉悟。"
 noble_eightfold_path: "八正道"
 noble_eightfold_path_desc: "概括为从轮回中解脱并走向涅槃的道路，$noble_eightfold_path$是$buddhist_ADJ$实践的精华，既规定了心理状态，也规定了身体行动，决定了任何$buddhist$信徒的行为。"
 three_jewels: "三宝"
 three_jewels_desc: "$three_jewels$是$buddhist$信徒皈依的核心。三宝分别是：#italic 佛#!，觉者；#italic 法#!，佛陀的教导；#italic 僧#!，维护佛法的僧侣团体。"
 #Age 2 - Age of Renaissance
 buddhist_canon: "$buddhist_ADJ$大藏"
 buddhist_canon_desc: "根据$buddhist$传承，$buddhist_canon$有不同的名称和内容，是$buddhist$的神圣经典集合。从僧人戒律到#italic 綖经#!（佛陀的教法），任何皈依$buddhist$的人都应该熟悉这些经典。"
 buddhist_councils: "$buddhist_ADJ$结集"
 buddhist_councils_desc: "自从悉达多·乔达摩去世以来，各僧团之间举行了多次结集，讨论不同大藏的文本。尽管具体结集的记录可能因学派而异，但这种结集的凝聚力是不可否认的。"
 buddhist_universities: "$buddhist_ADJ$学府"
 buddhist_universities_desc: "自古以来，$buddhist_ADJ$中心就一直也学习和知识的中心，吸引了来自世界各地的人们前来学习。那烂陀是古代最大的这些中心之一，但自那以后，许多其他中心也纷纷效仿。"
 pali_canon: "$pali_language$三藏"
 pali_canon_desc: "尽管$buddhist$根据不同的学派有许多不同的经典，但$theravada_ADJ$$pali_canon$是最古老和最有声望的。其他学派的经典是由各种来源的文本混合而成，而$pali_canon$自阿育王时代以来一直保持不变，包含了佛陀本人的话语，也为许多其他学派提供了基础或参考。"
 sutra: "綖经"
 sutra_desc: "$dharmic_ADJ$宗教和$buddhist_ADJ$中的一种神圣经典，其形式和内容各不相同，但始终被视为知识的源泉，如果一个人想要发展自己的精神，就需要对其进行适当的研究。"
 xuanzang_travels: "玄奘西行"
 xuanzang_travels_desc: "玄奘，7世纪唐朝的一名$chinese_group$$buddhist_ADJ$僧侣，花费17年前往$india$访问学术中心并收集大量$buddhist$经文。他前往了那烂陀寺等地，向最出色的大师学习，返回$china$时，他带回了超过一千部经文，为$mahayana$做出了突出贡献。他的旅途和记述成为了#italic 《西游记》#!故事的原型，在这部小说中，佛陀命唐僧前往$india$求取真经，同行者中就有美猴王孙悟空。"
 #Age 3 - Age of Discovery
 avalokitesvara: "观音菩萨"
 avalokitesvara_desc: "$avalokitesvara$，又名观世音菩萨或观自在菩萨，是最受尊崇的菩萨之一。根据宗派不同，观音有男相女相之分，在某些宗派中甚至被视为一切$hindu_ADJ$神祇的源头。$avalokitesvara$是慈悲的$bodhisattva$，#italic 唵嘛呢叭咪吽#!被视为观音菩萨的心咒。"
 bodhisattva: "菩萨"
 bodhisattva_desc: "$bodhisattva$在所有宗派中都有着重要地位，但其具体特征和重要性因教派有所不同。不过，他们在任何情况下都会受到尊崇。"
 maitreya: "弥勒"
 maitreya_desc: "$maitreya$目前还是$bodhisattva$，但根据预言将在未来成佛。他的使命是在末法时代重传佛法，因此是乔达摩·悉达多的继承者。"
 mount_meru: "须弥山"
 mount_meru_desc: "对于$hindu$、$buddhist$和$jain$来说，$mount_meru$在物质和精神意义上都是位于宇宙中心的圣山。与之类似，我们的统治者也是我们国家的中心。"
 silk_road_transmission: "丝路传教"
 silk_road_transmission_desc: "丝绸之路对$buddhist$的传播影响是不可否认的。无论是通过陆路还是海上丝绸之路，贸易都使$buddhist$传播得比其在$india$的最初起源更远。"
 #Age 4 - Age of Reformation
 edicts_of_ashoka: "阿育王诏令"
 edicts_of_ashoka_desc: "公元前三世纪阿育王颁布的法典，其中包括推广$buddhist$。尽管距今已有许多世纪，它仍受到广大$buddhist_ADJ$信徒的尊崇。"
 five_precepts: "五戒"
 five_precepts_desc: "作为$buddhist_ADJ$伦理和道德规范的基础，$five_precepts$代表了任何$buddhist$信徒，无论是否属于受戒的僧团，都必须遵守的最基本规则，要求人们避免杀生、偷盗、邪淫、妄语和饮酒。"
 four_heavenly_kings: "四天王"
 four_heavenly_kings_desc: "$four_heavenly_kings$分别镇守四方，保护天界不受阿修罗侵害，同时也负责检验凡人的德行。"
 naraka: "地狱"
 naraka_desc: "$naraka$，又称“奈落迦”，指的是转世轮回之前为清除恶业而受苦的境界。$naraka$分为多重，人在一地狱中受苦的时间和苦难的烈度取决于他们所造下的业，在那之后他们将转世至三善道。"
 vegetarianism: "茹素"
 vegetarianism_desc: "尽管各门各派教法各异，但善法中几乎都存在一些禁食荤腥的戒律。而禁食的严格程度，以及戒斋尽局限于僧众还是扩展到普通信众，每个派别的规定又各有不同。"
 #Age 5 - Age of Absolutism
 ascetic_practices: "苦行"
 ascetic_practices_desc: "尽管佛陀警告我们极端苦行的危险，但一些僧团中的成员仍然进行某种苦修。限制可穿的布料类型、可吃的食物或可住的地方，是那些希望走这条道路的人所采取的一些行动。虽然这些并不是获得功德的必要条件，但对修行者来说仍然有其自身的好处。"
 incense_burning: "焚香"
 incense_burning_desc: "焚香是任何$buddhist_ADJ$仪式或供奉中的一个重要部分。香的形状和形式各异，普通信徒和出家僧尼在进行任何仪式或禅修前，通常都会点燃香。因此，香的气味不断弥漫在任何$buddhist_ADJ$寺庙中。"
 monastic_communities: "僧伽"
 monastic_communities_desc: "$buddhist_ADJ$生活的中心是其僧尼的社区，称为#italic 僧伽#!。#italic 毗奈耶#!规定了任何$buddhist_ADJ$僧伽生活的规则和戒律。"
 offerings: "法供"
 offerings_desc: "供养$three_jewels$以积累功德是$buddhist$的戒律所要求的。这些供奉可以是物质的，也可以是非物质的。许多僧团依靠信众提供的食物为生。"
 prestigious_schools: "著名宗派"
 prestigious_schools_desc: "$buddhist$已经发展出许多不同的宗派，每个宗派都围绕一种僧团形式建立，并对某些经典有所偏好。然而，其中一些宗派获得了更多的认可，而另一些则被遗忘。通过与最有声望的宗派联系，人们可以获得对这种认可的反映。"
 #Age 6 - Age of Revolutions
 ahimsa: "不害"
 ahimsa_desc: "$ahimsa$，即非暴力的概念，是所有善法宗教中的一个关键美德。任何冲突都应通过对话和平解决，而非使用武力。不幸的是，这并不总是可能的，但暴力应始终是最后的手段，其使用必须是正义的。"
 buddhist_meditation: "禅修"
 buddhist_meditation_desc: "无论宗派如何，所有$buddhist_ADJ$信徒的共同实践是禅修。其目的是训练心灵和精神，以培养正念、定和慧，从而实现觉悟。"
 dana: "布施"
 dana_desc: "$dana$表示慈善，被定义为无偿给予的行为，是所有与正法相关宗教中的关键美德。无论是个人还是集体无私地帮助他人，都是积累善业的关键方式之一。"
 mindfulness: "正念"
 mindfulness_desc: "$mindfulness$是$buddhist$修行的重要部分之一，意指对身心现象保持觉知，同时牢记佛陀的教义。人们可以借此避免不良状态的产生，并培养出所期望的状态。"
 resistance_to_persecution: "历经法难"
 resistance_to_persecution_desc: "尽管$buddhist$已经广泛传播，但也在各个时代经历了相当多的迫害：寺庙和图像被摧毁，信徒被屠杀或被迫躲藏。但尽管如此，信仰依然坚强。"
 #Catholicism
 #Age 1 - Age of Traditions
 catholic_pilgrimages: "天主教朝圣者"
 catholic_pilgrimages_desc: "我们信仰的圣地值得每一位信徒的关心和关注。鼓励朝圣并提拔那些经历过朝圣的人应该是我们国家的重要行动。"
 crusading_knights: "波罗的十字军的经验"
 crusading_knights_desc: "将我们最优秀的骑士和贵族派往波罗的海或地中海的异教徒地区是我国的悠久传统。我们不仅会完成基督的善功，将信仰带给未开化的人们，还会为我们的军队培养有经验的指挥官。"
 marian_devotion: "童贞玛利亚敬礼"
 marian_devotion_desc: "我国对于童贞玛利亚的敬礼必须是我国信仰的中心支柱。"
 res_publica_christiana: "普世基督教"
 res_publica_christiana_desc: "我们必须与其他基督教徒建立良好关系，即便他们的宗教实践被视为异端。"
 roman_orthodoxy: "罗马正统"
 roman_orthodoxy_desc: "罗马天主教信仰正确无误，其信条必须不受质疑，以确保教会在人民中的权威。"
 #Age 2 - Age of Renaissance
 beguins_and_beghards: "在俗修会"
 beguins_and_beghards_desc: "许多信徒已经献身于祈祷和善行的生活，这通常伴随着修士和修女的修道生活。然而，他们没有正式宣誓，也没有得到教宗的正式批准。尽管如此，我们应该支持这些做善事的民间努力，并帮助我们的民众。"
 denounce_heretics: "谴责异端"
 denounce_heretics_desc: "我们需要维护唯一正信，谴责所有对其进行异端批评的人。"
 devotio_moderna: "现代灵修"
 devotio_moderna_desc: "现代灵修运动在我们的信仰中流传甚广，我们应当在宫廷中施行其部分教导，展现出虔诚基督徒家庭的形象。"
 inquisition_advance: "宗教裁判"
 inquisition_advance_desc: "宗教裁判所创建于12世纪，旨在打击清洁派异端，但在中世纪后期，其影响力显著扩大，成为天主教会应对异端教义传播的主要工具。"
 preaching_friars: "宣道兄弟会"
 preaching_friars_desc: "如今，由修士们传教我们的信仰变得相当流行。我们应该提拔那些承担这项任务的人，并赞扬他们在坚定农民信仰方面所做的努力。"
 #Age 3 - Age of Discovery
 conquistador_advance: "征服者"
 conquistador_advance_desc: "新大陆的发现吸引了各类冒险家，他们冒着财富和生命的风险，进行充满不确定性的探险，追求无与伦比的财富、名声和权力。这些探险是其领袖与王室之间的协议，在法律上表现为“征服契约”。"
 frequent_councils: "例行公会议"
 frequent_councils_desc: "有人提议为我们的信仰频繁召开公会议，以避免批评积压太久。虽然我们可能无法完全控制教廷的行为，但我们至少可以运用我们所能召集的影响力来实现这一提议。"
 grand_display_of_faith: "信仰的宏伟展示"
 grand_display_of_faith_desc: "为了荣耀神，我们需要以祂的名义建造伟大的纪念碑。这不仅会展示我们对唯一真神的虔诚，还会展示我们技艺精湛的建筑师的美丽作品。"
 mendicant_orders: "托钵修会"
 mendicant_orders_desc: "我们信仰的修会成员发誓过贫困和流浪的生活，已经为我国的许多地方带来了帮助。我们应该尽可能支持这些努力，同时不干扰他们的誓言。"
 monastery_productions: "修道院节俭"
 monastery_productions_desc: "我国修道院的居民正在践行节俭的理念。我国神职人员应当将这些男女修士作为他们行为的榜样。"
 reform_church_music: "教会音乐改革"
 reform_church_music_desc: "我们必须接受礼仪音乐改革方案。目前正在使用的平淡音乐不再被接受。"
 #Age 4 - Age of Reformation
 baptism_books: "洗礼书"
 baptism_books_desc: "我们必须确认洗礼是信仰的重要基石，让神职人员有机会为了所有信徒遵行此书。"
 confutatio_augustana: "驳斥错误教义"
 confutatio_augustana_desc: "在这样动荡的时刻，我们不得不向臣民清楚表示异端思想以及正统基督徒应守教义之间的界限。"
 exsurge_domine: "《上主求你兴起》"
 exsurge_domine_desc: "为了清除异端的邪恶，上主将亲自兴起，从我国土地之上铲除他们！"
 oversea_missions: "海外传教"
 oversea_missions_desc: "我国神职人员有意愿且已准备好向海外新领土传播我国的信仰。有了他们的贡献，在新土地上定居将更为简便、便宜。"
 roman_catechism: "《罗马要理》"
 roman_catechism_desc: "我国神职人员需要适应教会的官方教导，使司祭更高效、教学更容易。"
 #Age 5 - Age of Absolutism
 catholic_cuius_regio_eius_religio: "教随君定"
 catholic_cuius_regio_eius_religio_desc: "#italic 谁的领土就信谁的宗教。#!我们将不得不接受其他国家信仰不同的宗教，这有时对我们的外交至关重要。"
 #Sunday Schools Generic
 sunday_schools_advance: "主日学"
 sunday_schools_advance_desc: "教育贫困人群是我们宗教使命的重要组成部分。我们应该建立与教会服务紧密结合的学校，为我们的信徒提供基础教育。"
 catholic_sunday_schools: "$sunday_schools_advance$"
 catholic_sunday_schools_desc: "$sunday_schools_advance_desc$"
 embellish_baroque_art: "装饰巴洛克作品"
 embellish_baroque_art_desc: "在我们的信仰中有着赞助艺术的悠久传统。巴洛克风格的发展很好地反映了我们的神学，我们应该继续赞助这些艺术家。"
 index_librorum_prohibitorum: "禁书目录"
 index_librorum_prohibitorum_desc: "只有在我国臣民能够接触到传播宗教改革危险思想的书面作品时，这些荒谬的思想才会在他们的头脑中传播。"
 second_scholasticism: "第二经院哲学"
 second_scholasticism_desc: "我们需要复兴及深化中世纪的经院哲学运动。"
 #Age 6 - Age of Revolutions
 catholic_enlightenment: "天主教启蒙运动"
 catholic_enlightenment_desc: "为了使我们的信仰在启蒙时代中经受住考验，我们必须适应并获得对教会的新视角。"
 continue_missionary_works: "传教事工"
 continue_missionary_works_desc: "将我们的信仰传播到大地四极的努力永远不会结束。我们需要赞助更多的传教活动，以传播天主教的福音。"
 divine_church_music: "教会圣乐"
 divine_church_music_desc: "许多作曲家在信仰的启发下创作了他们最伟大的作品。我们应该继续寻找最有才华的艺术家并雇佣他们，以确保我们的教堂和主教座堂中永远不会回响低劣的音乐。"
 entrenched_church: "根深蒂固的教会"
 entrenched_church_desc: "不论我们统治的人民是什么样子，教会都将让我们能为人民提供一种统一的架构。"
 national_churches: "国定教会"
 national_churches_desc: "国家必须对我国的教会进行更大的控制，因为我们不能允许外国实体对我们的行政管理施加过多的影响。"
 #Hellenism
 #Age 1 - Age of Traditions
 epic_poetry_advance: "史诗"
 epic_poetry_advance_desc: "数千年来，我族人民通过史诗保存着关于神祇与英雄的传说。荷马的《伊利亚特》、《奥德赛》以及赫西俄德的《神谱》等作品，是我们文化遗产中最伟大的丰碑。这些永恒的叙事至今仍在塑造着我们的身份认同，并激励着一代又一代人。"
 makaron_nisoi_advance: "至福之岛的传说"
 makaron_nisoi_advance_desc: "马卡隆·内索伊，即至福之岛，人们它是最高尚灵魂的最终去处。一生践行虔诚与卓越之人，或许能在极乐原野中获得一席英雄之灵的位置。这些神圣领域的传说激励着整个社会追求美德、荣誉与道德上的卓越。"
 #Age 2 - Age of Renaissance
 offerings_to_the_moirai_advance: "摩伊赖的祭品"
 offerings_to_the_moirai_advance_desc: "每年，我们都会将一部分祭祀供品献给掌管命运的三位摩伊赖——掌管命运的命运三女神。纺织者克洛托、分配生命份额的拉克西斯以及必然的终结者阿特罗波斯，依照宇宙的秩序掌管每个凡人生命的完成。在许多神学传统中，她们的权威被认为是本原性的，有时甚至高于诸神。"
 on_hubris_and_morality_advance: "论傲慢与道德"
 on_hubris_and_morality_advance_desc: "我们信仰的准则源于众神的意志，并通过祭司、先知的解读和占卜活动得以阐明。凡人试图通过预言和神圣的阐释来理解宇宙的神圣秩序。然而，通往道德美德最可靠的道路，始终是虔敬、敬畏，以及谨慎地避免那招致毁灭的傲慢。"
 religious_dialects_hellenic_faith_advance: "宗教方言"
 religious_dialects_hellenic_faith_advance_desc: "尽管我们的信仰为众多社群所共有，但在仪式、传统与地方宗教实践方面却存在着显著差异。随着时间的推移，这些差异自然地发展演变，有时甚至在同一省份内也存在不同。如同语言演化出地域方言一般，我们的宗教习俗也在同一神圣传统内部，逐渐形成了独特的地方表现形式。"
 #Age 3 - Age of Discovery
 mystai_advance: "秘仪教派"
 mystai_advance_desc: "在面具、符号与神圣仪式的掩盖下，具有影响力的信众聚集于隐秘的秘仪教派之中。这些组织通过仪式权威、财富和谨慎的结盟，施展着巨大的社会与政治影响力，左右着事件的发展。明智的统治者会与这些秘仪教徒维持良好关系，以免他们的影响力和谋划转而危害国家。"
 variety_in_divine_identity_advance: "神祇身份之多样性"
 variety_in_divine_identity_advance_desc: "我们的万神殿中神祇种类繁多，每位代表不同的美德、技艺与理想。这种多样性使得每个人都能找到与自己生活和志业产生共鸣的神圣守护者。铁匠献给赫菲斯托斯的朴素祭坛，与献给宙斯的崇高虔诚具有同等的意义。"
 #Age 4 - Age of Reformation
 preserve_theogony_advance: "《神谱》的教谕"
 preserve_theogony_advance_desc: "赫西俄德的《神谱》讲述了众神的起源与谱系，揭示了神圣秩序本身的诞生。通过其诗句，权杖与统治之声等权威象征被呈现为神圣的职责。这部作品提醒统治者，真正的权威必须通过智慧、节制与理性来行使。"
 unify_priestly_class_advance: "统一协调祭司阶级"
 unify_priestly_class_advance_desc: "在我们历史的大部分时间里，负责管理圣地和寺庙收入的祭司阶层一直以分散的方式运作。然而，外国宗教机构的最新发展引入了关于组织与中央集权的新观念。这些影响如今正激励着我们将自己的祭司等级体系进行统一与协调。"
 #Hinduism
 #Age 1 - Age of Traditions
 mahabarata: "摩诃婆罗多"
 mahabarata_desc: "$mahabarata$是两大$smrti$经典之一（另一为$ramayana$），是古代$india$的史诗。它是有史以来最长的史诗，约为$greek_language$#italic 伊利亚特#!和#italic 奥德赛#!加起来的十倍长，讲述了古代$indian_group$俱卢王国王位争夺的故事，最终以俱卢之战（也称为$mahabarata$之战）告终。故事以$krishna_avatar$的死亡及其王朝的终结为结尾。"
 ramayana: "罗摩衍那"
 ramayana_desc: "$ramayana$是两大$smrti$经典之一（另一为$mahabarata$），是古代$india$的史诗，讲述了$vishnu_god$的化身$rama_avatar$作为拘萨罗国王子的一生，强调在生活的各个方面保持美德的重要性。"
 smrti: "传承经典"
 smrti_desc: "$smrti$原意为“所忆”，是受$vedah$启发或派生的文本，由于其派生性也因而被认为比$sruti$权威性低。然而，与$sruti$不同，$smrti$文本有明确的作者，并通过抄本传递。"
 sruti: "天启圣典"
 sruti_desc: "$sruti$原意为“所闻”，是$hindu$最古老和最神圣的经典，被认为是神圣的启示，因此不归为人类的创作，尽管有些人否认其神圣起源，但仍然接受其权威性。"
 vedah: "吠陀"
 vedah_desc: "$vedah$是$sruti$的主体，是最古老的$sanskrit_language$文本。根据《$mahabarata$》，其作者为梵天，它们分别是《梨俱吠陀》、《夜柔吠陀》、《娑摩吠陀》和《阿闼婆吠陀》。"
 #Age 2 - Age of Renaissance
 astika_schools: "正统派"
 astika_schools_desc: "被称为$hindu$的正统学派，接受$vedah$的权威和$atman$的存在。尽管由许多不同的学派组成，但这种共同的接受使$astika_schools$有很多共同点。"
 atman: "梵我"
 atman_desc: "被称为真实和永恒不变的自我，是每个人意识的本质。根据$astika$各学派，$atman$独立于心灵和身体，并且也不同于跨越多次生命的寿者。相比之下，$nastika$各学派对这个概念有不同的解释，或者完全否定它。"
 nastika_schools: "非正统派"
 nastika_schools_desc: "在$hindu$中，一些思想流派偏离了主流，拒绝承认$vedah$的权威和$atman$的存在。这些学派，如$jain$和$buddhist$，因此被认为是非正统，尽管它们仍然包含许多$hindu$的共有核心信条。"
 purana: "往世书"
 purana_desc: "$purana$被认为是$smrti$的一部分，是包含各种内容的文本。宇宙学、神灵谱系、天文学、语法、爱情故事……几乎所有内容都包含在其中。因此，尽管它们不是$sruti$的一部分，但通过将许多不同的地方信仰和传统结合到$vedah$的共同叙事中，它们在$hindu_ADJ$信仰和社会中的影响是不可否认的。"
 #Age 3 - Age of Discovery
 bhakti_movement: "奉爱运动"
 bhakti_movement_desc: "起源于6世纪，提倡对个人所崇拜的神灵或开悟者的爱与奉献，并通过直接用大众的语言与他们对话，吸引了主要民众。作为一个极具影响力的运动，它正在改变人们对宗教和信仰的感受。"
 diversity_of_beliefs: "多元信仰"
 diversity_of_beliefs_desc: "$india$人民的信仰围绕着善法的概念和$vedah$经典，但以各种形式和实践表现出来。即使是被认可和崇拜的神灵也不尽相同，但贯穿其中的概念主线是存在的。"
 ishvara: "自在主"
 ishvara_desc: "$ishvara$根据$hindu$学派或分支而有不同的解释，是指至高的存在或神明。因此可以指$shaivism$的$shiva_god$，$vaishnavism$的$vishnu_god$，或任何个人所崇拜的神。"
 sanskritization: "梵化"
 sanskritization_desc: "$hindu$已从$india$的起源地广传域外，许多其他文化和国家采用了$sanskrit_language$的概念和称谓来指代自己的身份。因此$hindu$的概念很容易渗透并融合到外国信仰中。"
 #Age 4 - Age of Reformation
 diwali: "排灯节"
 diwali_desc: "作为一个光明的节日，在$diwali$期间，我们庆祝善法的胜利，善战胜恶，光明战胜黑暗。我们会点燃蜡烛和灯笼来象征这一点，并纪念我们的祖先。"
 holi: "侯丽节"
 holi_desc: "在初春举行、庆祝春天来临的$holi$是色彩和爱的节日。我们纪念农业和丰收，同时享受春天带来的缤纷色彩。这也是一个享受乐趣和解决冲突的时刻，消除人们的情感杂质。"
 holy_rivers: "圣河"
 holy_rivers_desc: "河流及其崇拜一直是$hindu$的重要组成部分。从印度河到恒河，有许多被认为是神圣的河流，许多仪式在其岸边举行。圣河水被认为是神圣的，净化仪式在这些河流上很常见。"
 yoga: "瑜伽"
 yoga_desc: "作为$hindu_ADJ$的一个学派和哲学，$yoga$也是一套身心修炼的实践，其目的是控制心灵和身体。自几千年前开始施行，它几乎已成为觉悟之路的代名词。"
 #Age 5 - Age of Absolutism
 advaita_vedanta: "不二论吠檀多派"
 advaita_vedanta_desc: "$advaita_vedanta$拒绝意识与物质的二元论，主张$atman$，即内在的自我或意识，与宇宙的最高现实或意识——梵是同一的。从这个意义上说，物质世界只是隐藏梵终极现实的幻象。"
 hindu_architecture: "$hindu_ADJ$建筑学"
 hindu_architecture_desc: "无论是希诃罗、毗摩那还是普朗风格，$hindu_ADJ$寺庙以其高耸装饰的塔楼在各地都很独特。塔是$mount_meru$的象征，其塔的强调程度根据地区而有所不同，是权力的象征和体现。"
 hindu_muslim_relations: "$hindu_ADJ$徒-$muslim_ADJ$关系"
 hindu_muslim_relations_desc: "过去，$hindu$和$muslim$之间有很多互动，并且这种互动将继续存在。我们的人民已经学会了和平共处，甚至在两种信仰之间出现了一定程度的融合。"
 hindu_unification: "$hindu_ADJ$合一"
 hindu_unification_desc: "尽管$hindu$内部的信仰和实践存在差异，但团结我们的东西比分裂我们的东西更多。一个共同的$hindu$统一观念已经开始出现，我们的人民可以通过它获得强烈的团结感。"
 varna_system: "种姓制度"
 varna_system_desc: "自$vedah$时代以来，善法概念中就将个人分为四种可能性：#italic 婆罗门#!（学者或祭司）、#italic 刹帝利#!（统治者或战士）、#italic 吠舍#!（农民或商人）和#italic 首陀罗#!（工匠或仆人）。这些分类并不是严格固定的，而是代表了个人天职的理想状况，但它们在$hindu_ADJ$社会中仍然非常有影响力。"
 #Age 6 - Age of Revolutions
 extreme_pacifism: "极端和平主义"
 extreme_pacifism_desc: "基于$ahimsa$的概念，$hindu$一直提倡和平及非暴力。然而，我们的敌人仍应谨慎，不要挑衅我们，以免我们在被激怒后走向完全相反的极端，陷入战争。"
 hindu_empires: "$hindu_ADJ$帝国"
 hindu_empires_desc: "在历史上，有许多帝国信奉$hindu$。从$india$的孔雀帝国和笈多帝国，到$indonesia_region$的室利佛逝帝国，以及长久存在的朱罗王朝，$hindu$一直在强大统治者的王座背后。"
 sacred_cattle: "神牛"
 sacred_cattle_desc: "作为$ahimsa$的一部分，屠宰牛是被禁止的。因此，它们被尊敬和崇拜为母亲般的形象，作为无私奉献和牺牲的象征。自$vedah$时代以来，它们一直被崇拜，值得我们所有的尊重和关注。"
 #Islam
 #Age 1 - Age of Traditions
 holy_revelation: "神圣启示"
 holy_revelation_desc: "$muslim_god_name$的言语启示给先知穆罕默德（愿主福安之），并记录于神圣的$common_string_quran$。通过其篇章节句，$muslim_god_name$的旨意得以传达给祂的信众，所有$muslim_ADJ$都应当熟读其章节。"
 islamic_calligraphy: "伊斯兰书法"
 islamic_calligraphy_desc: "$muslim$不只是和平的宗教，也是艺术的宗教。$common_string_quran$章句的书法以及众先知的名讳在文献和美术作品中往复出现。"
 islamic_prayer: "天命拜功"
 islamic_prayer_desc: "$muslim$的五功之一，礼拜是$muslim_ADJ$每天必须完成的祈祷义务。尽管每天的次数以及特定动作每个学派各有不同，每日祈祷的行为对于所有$muslim$而言一样的。"
 people_of_allah: "$muslim_god_name$之民"
 people_of_allah_desc: "我们追随独一的安拉$muslim_god_name$，并遵守祂的言语。所有认主独一的人在祂的眼中都是我们的兄弟姊妹。"
 zakah: "天课天职"
 zakah_desc: "$muslim$五功之一，天课这一形式的施舍是任何$muslim_ADJ$必须完成的宗教义务。向有需要的人捐钱是每个有能力的人必须履行的慈善义务，并被视为一种税收。"
 #Age 2 - Age of Renaissance
 imamate: "伊玛目"
 imamate_desc: "$shia_ADJ$信仰的基础是穆罕默德（愿主福安之）指定阿里·伊本·阿比·塔利卜为他的继任者。因此，伊玛目是来自穆罕默德（愿主福安之）一系的精神领袖，领导所有$muslim_ADJ$信徒。"
 islamic_golden_age: "伊斯兰黄金时代"
 islamic_golden_age_desc: "尽管$muslim$文化的辉煌时代已经过去，但$islamic_golden_age$对全世界的影响（不仅限于$muslim_ADJ$国家）是不可否认的。一些异教国家现在才开始发现，在他们曾经陷入无知时代之际，我们在艺术和科学方面取得了伟大成就。"
 muslim_caravans: "$muslim_ADJ$商队"
 muslim_caravans_desc: "从丝绸之路的众多路线到穿越撒哈拉的盐路，我们的人民有着前往遥远土地进行贸易商队冒险的传统，通过整个$muslim_ADJ$世界提供各种各样的商品。"
 muslim_lineage: "$muslim_ADJ$世系"
 muslim_lineage_desc: "自穆罕默德（愿主福安之）的时代起，$muslim$就与统治架构密不可分。因此我们的统治者世系也是由信仰合法化的。"
 ramadan: "斋月"
 ramadan_desc: "纪念先知穆罕默德（愿主福安之）首次启示的月份，$ramadan$是$muslim$最神圣的月份。在这个月里，所有$muslim_ADJ$信徒都应在白天进行斋戒和禁欲（即封斋），并进行祈祷和反思。"
 sunnah: "逊奈"
 sunnah_desc: "$sunnah$由可以追溯到穆罕默德（愿主福安之）的传统和实践组成，是每个$muslim_ADJ$信徒应当遵循的行为准则，也是$sunni$名称的由来。尽管不同的法学派在细节上可能有所不同，但它们都以$sunnah$为基础。"
 islamic_jurisprudence: "伊斯兰教法学"
 islamic_jurisprudence_desc: "数个世纪的学术积淀已将#italic 斐格赫#!和#italic 乌苏勒·斐格赫#!的学问锤炼成一整套依据$sharia$治理国度的完备框架。法律既已如此周密地阐发，我们法庭中受过训练的教法学家便能以恰当方式执行法律，使我们得以维持政府机构的正常运转。"
 #Age 3 - Age of Discovery
 blend_of_influences: "影响的交融"
 blend_of_influences_desc: "$muslim$自起源于$arabia_region$以来，已经扩展到许多地方。在这一扩展过程中，它与许多不同的民族和生活方式接触。许多影响的交流在这一过程中发生，以至于许多原本不属于$muslim$的特征已经与其紧密相连，而许多接受$muslim$的文化也受到了它的影响。"
 expansionist_faith: "信仰扩张"
 expansionist_faith_desc: "在过去，$muslim$从$arabia_region$的起源之地迅速扩展。在短短几代人的时间里就从$iberia_region$扩展到了$india$，是世界上有史以来最快的扩张。现在我们的边界之外又有新的土地，也许是时候进行第二次$muslim_ADJ$扩张了。"
 indian_sea_trade: "印度洋贸易"
 indian_sea_trade_desc: "$muslim_ADJ$商人世世代代在$indian_ocean_region$的水域航行，深入寻找有利可图的商品。从$africa$东海岸到$india$，甚至远至$indonesia_region$的香料群岛，$muslim_ADJ$船只乘风破浪。"
 islamic_schoolars: "伊斯兰学派"
 islamic_schoolars_desc: "$muslim$一直鼓励对其经典的思考和研究，甚至出现了不同的释经学派。因此，我们在$common_string_quran$和其他圣典方面的学者都是非常博学的人，能够进行最深入的讨论。"
 muslim_trade_communities: "$muslim_ADJ$贸易社区"
 muslim_trade_communities_desc: "$muslim_ADJ$商人在遥远的土地上与许多不同的民族和信仰接触，建立贸易社区，使当地的信仰与$muslim_god_name$的真言进行一定程度的融合与综摄。"
 #Age 4 - Age of Reformation
 distant_trade_ventures: "远距离贸易冒险"
 distant_trade_ventures_desc: "从最遥远的土地上，我们可以获得最有利可图的产品。多年来，$muslim_ADJ$商人们在陆地和海洋上长途跋涉，寻找有利可图的贸易机会。"
 established_holy_sites: "不变的圣地"
 established_holy_sites_desc: "虽然其他宗教对其圣地的使用有些松散和不一致，但$muslim$对圣地的规定非常明确。因此，毫无疑问，当时机到来时，我们将尽职尽责地进行朝圣。"
 gunpowder_empires: "火药帝国"
 gunpowder_empires_desc: "火药是在远东发明的，但正是通过$muslim$而传播到了全世界并得到了广泛使用。火药武器已经成为我们军队的主力武器，其生产和使用是定义我们的特征之一。"
 islamic_courts: "伊斯兰宫廷"
 islamic_courts_desc: "$muslim_ADJ$国家王室的宫廷一直是世界上最受人钦佩的。我们的精致文化、异国商品、辉煌宫廷的故事传遍四方，我们的人民为属于这样的宫廷而自豪。"
 schools_of_thought: "思想学派"
 schools_of_thought_desc: "$muslim$一直与知识和教育紧密相连。从各种法学和神学学派，到各个统治者建立的不同知识学派，$muslim_ADJ$学者的著作不仅在$muslim_ADJ$世界中受到钦佩，也在异教徒中受到赞赏。"
 #Age 5 - Age of Absolutism
 comprehensive_land_survey: "全面土地调查"
 comprehensive_land_survey_desc: "为了知道谁应该纳税，我们首先必须知道谁拥有什么。进行全面的土地调查并确保其及时更新是至关重要的。这样我们就能始终获得应得的税款。"
 cosmopolitan_court: "普世宫廷"
 cosmopolitan_court_desc: "来自世界各地的人们都来仰慕我们的$muslim_ADJ$宫廷。这样的宫廷魅力不减，这使得我们的大殿中汇聚了各种各样的人才。"
 counting_the_people: "人口普查"
 counting_the_people_desc: "如今我们了解了谁拥有什么，合乎逻辑的下一步便是了解谁住在哪里。这将使我们知道，当我们寻找人员参军时应该去哪里寻找。"
 jewels_of_the_desert: "沙漠的明珠"
 jewels_of_the_desert_desc: "确实，$muslim$起源于$arabia_region$的沙漠，并扩展到许多其他干旱地区。然而，一些$muslim_ADJ$城市尽管位于沙漠地区，却能够熠熠生辉，被誉为富裕生活的中心。只要付出足够的努力，任何定居点都可以变得和它们一样富有。"
 resilient_merchants: "坚韧的商人"
 resilient_merchants_desc: "$muslim_ADJ$商人在探险中不得不忍受最恶劣的条件。从穿越撒哈拉和戈壁的炽热沙漠，到航行在季风肆虐的$indian_ocean_region$水域，他们一次又一次地证明了自己在艰苦环境中坚持不懈的韧性，以实现成功的贸易。"
 #Age 6 - Age of Revolutions
 caliphate: "哈里发国"
 caliphate_desc: "哈里发国是指所有$muslim_ADJ$信徒以哈里发国的形式联合于单一统治者之下，$rank_empire_muslim_ruler_male$是穆罕默德（愿主福安之）政治上和精神上的继任者。尽管关于谁有资格成为$rank_empire_muslim_ruler_male$存在分歧，但自其创立以来，所有$muslim$在一个旗帜下团结的理念一直存在。"
 contacts_network: "接触网络"
 contacts_network_desc: "$muslim$在广阔领土上的传播使$muslim_ADJ$国家与许多遥远的土地接触。保持这样一个丰富的联系网络在外交领域总是有益的。"
 harsh_environments: "严酷的环境"
 harsh_environments_desc: "$muslim$自从创立以来，已经传播到世界上最恶劣的环境中。异教徒在我们的土地上按照我们的条件作战时，总是会感到困难。"
 ibadi_imamate: "$ibadi_ADJ$伊玛目国"
 ibadi_imamate_desc: "与$caliphate$的理念或圣命的$shia_ADJ$伊玛目不同，$ibadi_ADJ$ 伊玛目不需要统治整个$muslim_ADJ$世界。相反，每个社区都应该能够由自己的伊玛目独立统治。"
 infiltration_tactics: "渗透战术"
 infiltration_tactics_desc: "尽管古老的$nizari_school$$shia_ADJ$哈萨辛教团在其初始范围之外被大大神话，但不可否认的是，他们的潜伏和暗杀战术是有效的。如果我们自己也采用这种渗透战术，我们也将从同样的成功中受益。"
 unified_armies: "整齐划一的军队"
 unified_armies_desc: "不可否认，$muslim$自从在$arabia_region$出现以来，已经传播到许多不同的文化和民族。只要他们相信$muslim_god_name$，任何人都应该能够以真主的名义战斗，无论他们的出身如何。"
 #Judaism
 #Age 1 - Age of Traditions
 judaism_talmudic_academies: "塔木德学院"
 judaism_talmudic_academies_desc: "我们伟大的叶史瓦继承了巴比伦的学术传统，通过绵延不绝的师徒传承链条，在我们散布各地的社群中传递《塔木德》及其注疏。"
 judaism_kabbalistic_tradition: "卡巴拉传统"
 judaism_kabbalistic_tradition_desc: "我们称之为卡巴拉的神秘奥秘思潮，通过象征性的神圣流溢框架来诠释《托拉》，并与律法性的哈拉卡研习一道，在封闭的师承体系中代代相传。"
 judaism_communal_autonomy: "社群自治"
 judaism_communal_autonomy_desc: "我们的社群通过 #italic kahal #! 自我治理，这一由拉比长老组成的议事会裁决内部宗教律法事务，征收社群税赋，并代表我们的信众向宿主王权交涉。"
 judaism_court_patronage_finance: "宫廷赞助金融"
 judaism_court_patronage_finance_desc: "宗教少数身份使我们的金融家得以豁免于约束多数族群的基督教放贷禁令，从而在每一个需要信贷的王室宫廷中开辟出放贷与铸币总监的生计门路。"
 #Age 2 - Age of Renaissance
 judaism_tikkun_mysticism: "修复神秘主义"
 judaism_tikkun_mysticism_desc: "我们的神秘学派发展出#italic提昆#!（宇宙修复）之说，将$judaism_ADJ$流散的处境诠释为一项积极的属灵使命——通过祈祷、研习与德行，修复这破碎的世界。"
 judaism_halakhic_codification: "哈拉哈法典"
 judaism_halakhic_codification_desc: "我们的法学家将数个世纪积累的哈拉哈裁决整理为结构化的法律汇编，通过手稿和印刷网络，让每一个遵行律法的社群都能接触到统一的标准。"
 #Age 3 - Age of Discovery
 judaism_court_patronage_banking: "宫廷赞助银行业"
 judaism_court_patronage_banking_desc: "我们的金融家的业务已不仅涵盖个别王室的借贷，同时经营跨越多宫廷的银行机构，利用犹太人流散作为跨国的信贷网络，这是任何单一宗教的银行社群都无法复制的。"
 judaism_rabbinic_council: "拉比议会"
 judaism_rabbinic_council_desc: "我们各社群的首席拉比召开地区性议会，以协调哈拉卡裁决、规范社群间的商贸往来，并在王权面前代表我们的信众，委任交涉代表、裁断纷争。"
 judaism_diaspora_communal_institutions: "流散社群机构"
 judaism_diaspora_communal_institutions_desc: "我们的社群正式确立 #italic Beit Din #!（拉比法庭），赋予其在婚姻、离婚、继承及绝罚事务上明文规定的司法权，使我们的信众自成一套独立于宿主法庭的律法与属灵秩序。"
 #Age 4 - Age of Reformation
 judaism_state_credit_apparatus: "国家信贷机器"
 judaism_state_credit_apparatus_desc: "我们的宗教银行世家转变为国家信贷的工具，直接为整场战争融资、为和平协议提供担保；所在国的财政军事实力已与我们信众整体的信誉不可分割。"
 judaism_hasidic_movement: "哈西德运动"
 judaism_hasidic_movement_desc: "#italic 哈西迪主义 #! 这一民间神秘运动，围绕着富有魅力的 #italic 察迪克 #! 展开，他们以情感化、体验式的虔信、欢乐的歌咏以及与神亲近的个人体悟来引导信众，触及纯粹文本学问所无法企及的不识字的平民百姓。"
 judaism_rationalist_yeshiva: "理性主义叶史瓦"
 judaism_rationalist_yeshiva_desc: "我们的学术性经学院将塔木德研析锤炼成一套精密的理性方法——细致的文本解读、系统的律法推演与严谨的批判——并为更广大的虔信社群出版注释与答问录。"
 #Age 5 - Age of Absolutism
 judaism_religious_emancipation: "宗教解放"
 judaism_religious_emancipation_desc: "专制与革命政权赋予我们的信众公民平等之权，向我们开放了数百年来因宗教缘由而被禁入的行会、职业、兵役与民选官职；我们的信众在继续其内部宗教生活的同时，成为宿主国完全意义上的臣民。"
 judaism_reform_movement: "改革运动"
 judaism_reform_movement_desc: "宗教改革者通过引入方言礼拜仪式、礼仪改革和神学重新诠释来现代化宗教遵行，使宗教实践与解放后我们的信教群体所置身的资产阶级公民生活相协调。"
 judaism_international_banking_networks: "国际银行网络"
 judaism_international_banking_networks_desc: "我们的宗教银行世家——借由彼此联姻、遍布多国宫廷的家族银行网络——在那些无法公开谈判的国家之间充当着非正式的外交桥梁，不仅传递资金，也传递消息、条件与无声的压力。"
 #Age 6 - Age of Revolutions
 judaism_mussar_movement: "穆萨尔运动"
 judaism_mussar_movement_desc: "#italic穆萨尔#!伦理属灵运动转向内省，以刻意的自我修养、品格锤炼与冥想式的伦理操练取代外在化的仪规，作为应对侵蚀传统虔信的现代化压力的回应。"
 judaism_modern_orthodoxy: "现代正统派"
 judaism_modern_orthodoxy_desc: "正统派的信仰实践与世俗教育、公民参与及市民生活相调和，确立了在现代性之内而非与之对立地阐释宗教律法的原则，同时仍严守礼仪规范。"
 judaism_positive_historical_movement: "实证—历史运动"
 judaism_positive_historical_movement_desc: "“实证历史学派”的宗教取向认为哈拉卡律法虽受历史条件制约，却依然具有恒久的权威性。该学派既对宗教典籍进行严谨的历史学分析，又维护这些典籍的律法约束力。"
 #Miaphysitism
 #Age 1 - Age of Traditions
 beyond_the_borders: "越过边界"
 beyond_the_borders_desc: "$christian$无疑起源于罗马帝国的襁褓，许多分支也满足于停留在其边界之内。然而，$miaphysite$自从被迦克墩派谴责以来，一直位于帝国的边缘，并勇敢地超越其边界，将天主的光辉带到最偏远的地方。"
 monophysite_vs_miaphysite: "基督一性派与$miaphysite_ADJ$"
 monophysite_vs_miaphysite_desc: "虽然$miaphysite$也宣称基督只有一个本性，但与优迪克派的一性论观点有显著不同，后者宣称基督的人性被吸收到其神性之中。尽管有些人称我们为一性论者，但这仅仅是笔墨官司，二者的观点在本质上明显不同。"
 original_christianity: "原初$christian$"
 original_christianity_desc: "$christian_ADJ$世界中存在许多分裂和分歧，但我们的信条可以追溯到尼西亚第一次大公会议所制定的原始真$christian$。此后，从主干中分裂的只有异端。"
 rejection_of_chalcedon: "拒斥迦克墩"
 rejection_of_chalcedon_desc: "由于他们不接受$second_council_of_ephesus$，教宗良一世召集了迦克墩会议，要求废除$second_council_of_ephesus$。我们拒绝这个虚假的会议，并坚持支持原大公会议所作的决定。"
 second_council_of_ephesus: "第二次以弗所大公会议"
 second_council_of_ephesus_desc: "$second_council_of_ephesus$于449年在$alexandria$教宗狄奥斯科鲁斯的主持下召开，是一次合法的$christian_ADJ$会议——尽管$catholic_ADJ$和$orthodox_ADJ$教会都予以谴责。会议采纳了亚历山大的济利禄的阐发，声明基督具有道成肉身的唯一性体，既是人性又是神性。"
 #Age 2 - Age of Renaissance
 acceptance_of_old_testament: "《旧约》接纳"
 acceptance_of_old_testament_desc: "一些$christian_ADJ$教派决定削减《旧约》的重要性，认为耶稣的到来完全取代了《旧约》。然而，我们认为它仍然具有重要意义，并且其中的一些指示与写下时一样有效。"
 independent_leaders: "独立领袖"
 independent_leaders_desc: "由于$miaphysite$的孤立状况，有时与其他牧首区的联系变得困难。因此，我们的领袖学会了独立行事，同时尽可能找到自己的方式与其他$christian$保持联系。"
 isolated_reaches: "孤立之地"
 isolated_reaches_desc: "$miaphysite$能够传播到非常遥远的地方。即使被敌人和异教徒包围，我们的信仰依然坚韧不拔。"
 jerusalem_focus: "关注$jerusalem$"
 jerusalem_focus_desc: "我们始终将圣城$jerusalem$铭记于心，因为那里不仅是耶稣传教和殉难的地方，也是他第二次来临时的回归之处。因此，无论身在何处，我们总是面向$jerusalem$的方向祈祷。"
 #Age 3 - Age of Discovery
 double_patriarchate: "双重牧首"
 double_patriarchate_desc: "$alexandria$和$antioch$都认为自己拥有两个不同的牧首区，一个属于$miaphysite$，另一个属于$orthodox$。尽管他们可能宣称自己的统绪是合法的，但只有$miaphysite$保留了真正的牧首区。"
 preserving_of_local_languages: "保存当地语言"
 preserving_of_local_languages_desc: "尽管$greek_language$和$latin_language$在早期$christian$中具有重要地位，$miaphysite$仍然将其礼仪保存在更本地化的方言中，例如$coptic_language$、$aramaic_language$和$armenian_language$。这些语言本身都是古老且传统的，每个$miaphysite_ADJ$分支都保留着自己的历史语言。"
 primacy_of_alexandria: "$alexandria$首席地位"
 primacy_of_alexandria_desc: "尽管$miaphysite$有许多分支和独立的领袖，我们承认$alexandria$及其教座为我们的精神领袖。这仅仅是对那里的使徒圣座表示尊敬的一种方式，是对其的致敬，而并非赋予其任何特殊的特权。"
 school_of_alexandria: "$alexandria$教理学校"
 school_of_alexandria_desc: "根据圣热罗尼莫的说法，$school_of_alexandria$教理学校据称由使徒马尔谷本人创立，是世界上最古老的教理学校。自$christian$诞生之初，这所学校就教授圣经和神学研究。尽管当$rome$的主教被宣布高于$alexandria$的牧首时，学校被摧毁，但其传统仍然延续至今。"
 #Age 4 - Age of Reformation
 eastern_christianity: "东方$christian$"
 eastern_christianity_desc: "我们属于所谓的$eastern_christianity$分支，融合了许多具有不同神学和礼仪传统的教派，但在文化方面有许多共同点。"
 gradual_departure: "逐渐分离"
 gradual_departure_desc: "尽管他们迅速将我们贴上异端的标签，$miaphysite$并没有立即与其他$christian_ADJ$世界断绝联系。我们与其他牧首区保持联系，并参加了各类会议，但逐渐清楚的是，$miaphysite$与那些异端信仰是不同的。"
 life_among_infidels: "异教徒中生存"
 life_among_infidels_desc: "我们的信仰之地经常被异教徒的存在所玷污，但我们的传教士也勇敢地向未知领域进发，将耶稣的光辉带到遥远的土地。因此，我们在许多方面影响了这些异教徒，超出了人们的预期，尽管我们未能让他们认识到其信仰的错误。"
 #Age 5 - Age of Absolutism
 defense_against_heretics: "抵御异端"
 defense_against_heretics_desc: "自从分裂以来，异端多次向我们提出指控和谴责。他们自称为$christian_ADJ$，但他们的观点显然被异端所误导，而我们的视野在天主的光辉下是清晰的。"
 further_reaches: "继续延伸"
 further_reaches_desc: "尽管我们的信仰在许多情况下被限制在异教徒之中，但也能够传播到更遥远的地方，并扩展到许多不同的民族和文化中。"
 preserver_of_national_identity: "民族认同的保存者"
 preserver_of_national_identity_desc: "正是因为经历了压迫和迫害，我们的教会才能声称自己是身份的守护者。在教会的怀抱中，我们的语言和传统得到了最好的保存，而我们对教会的信仰始终不曾破裂。"
 remote_patriarchates: "远方的牧首"
 remote_patriarchates_desc: "由于我们的人民遭受征服和迫害，我们的牧首之座多次落入异教徒之手并受到其控制。因此，我们被迫迁移并将牧首之座转移到其他地方，但原始的座席仍然得到保存和敬仰，即使是从远处运作。"
 thrive_under_persecution: "迫害下繁盛"
 thrive_under_persecution_desc: "尽管我们的信徒几个世纪以来一直受到异端和异教徒的迫害，但我们的信仰始终坚韧不拔。无论他们让我们跌倒多少次，我们都会再次站起来。"
 #Age 6 - Age of Revolutions
 cradle_of_monasticism: "隐修的摇篮"
 cradle_of_monasticism_desc: "$christian$的隐修传统诞生于$egypt_region$，古时候的$christian_ADJ$教徒前往沙漠祈祷并将生命献给上帝。既然$miaphysite$是亚历山大的传统宗派，我们有理由宣称这种传统的摇篮为我们所有。"
 internal_communion: "内部共融"
 internal_communion_desc: "尽管拥有独立的牧首，$miaphysite$的所有分支之间都有内部的共融关系，能够彼此保持紧密联系，并确保教会的合一。"
 unique_architecture: "别具一格的建筑"
 unique_architecture_desc: "我们的牧首区由于相对的孤立，形成了独特的圣所建筑风格。尽管其他$christian_ADJ$教派可能更为显著，我们独特的建筑风格同样能够打动信徒的心。"
 #Orthodoxy
 #Age 1 - Age of Traditions
 anagignoskomena: "次经"
 anagignoskomena_desc: "我们的圣经包含所有值得崇敬和研究的经典，尽管有一些的重要性可能不如其他书籍。$anagignoskomena$不存在于$hebrew_language$圣经中，因此它们的重要性不如其他文本，但仍然值得阅读，不应被忽视。"
 filioque_issue: "和子句争议"
 filioque_issue_desc: "西方异端在没有召开适当公会议以决定的情况下，偷偷添加了#italic 和子句#!，因此是非法的。只有我们保留了正确的祈祷方式，因此他们因异端邪说而永远被诅咒下地狱。"
 imperial_creed: "帝国信条"
 imperial_creed_desc: "$orthodox$自从罗马帝国皈依$christian$以来，一直是其官方信仰。西方的异端及其虚假宣称的“皇帝”将无法否认我们这一系的合法性。"
 septuagint: "七十士译本"
 septuagint_desc: "我们的旧约已译为$greek_language$，称为《$septuagint$》，这是公元前三世纪由72位独立翻译者从$hebrew_language$翻译而来的，他们各自独立完成了完全相同的译本，因此绝对是圣神默感的真正的天主圣言。"
 the_pentarchy: "五大牧首区"
 the_pentarchy_desc: "$orthodox$仍在完全贯彻查士丁尼皇帝制定的古老教会架构。尽管$rome$牧首自认为在$catholic$中高于所有人，但对真正的教会来说，$constantinople$、$alexandria$、$antioch$和$jerusalem$都拥有崇高的地位。"
 #Age 2 - Age of Renaissance
 church_councils: "教会公会议"
 church_councils_desc: "由于教会必须团结一致，任何单个主教无法解决的重大问题都需要召开公会议，在公会议上主教们将探讨教会的意图。因此，公会议的决定将反映整个教会的共识。"
 church_guidance: "教会训导"
 church_guidance_desc: "圣经是天主的圣言，但只有教会能够解释其正确含义并传达给羊群。任何在教会训导之外对圣经的独立阅读或解释只会导致迷失在虚假之中，走上异端的道路。"
 greek_rite: "$greek_culture$礼"
 greek_rite_desc: "几个世纪以来，我们的仪式和教规实践一直明确遵循$constantinople$的$greek_culture$礼。尽管某些地方可能存在一些小的差异，但整个$orthodox$的礼仪同质性是普遍的。"
 religious_icon_power_advance: "宗教圣像"
 religious_icon_power_advance_desc: "圣像是我们信仰的实物代表，是对神圣人物的神圣描绘，旨在激发人们对圣像的敬畏和虔诚。"
 unchanging_tradition: "不更易的圣传"
 unchanging_tradition_desc: "耶稣基督和使徒传给我们的传统是一致的，没有更易、增添或删减。这是因为信仰本身是不变的，并且在各地都被实践。"
 #Age 3 - Age of Discovery
 heavenly_architecture: "天上的建筑学"
 heavenly_architecture_desc: "$orthodox_ADJ$宗教建筑总是模仿天国而设计。与西方基于巴西利卡样式的建筑相比，它们以更中心化的样式建造，中央圆顶作为屋顶象征着天国。建筑物总是覆盖着图像和圣像，令人叹为观止。"
 iconostasis: "圣像屏"
 iconostasis_desc: "任何$orthodox_ADJ$教堂的一个关键特征是$iconostasis$，即一堵将建筑主体与祭坛分隔开的圣像墙。其上的圣像可视化地表现了信徒与至圣所之间的联系，从而成为天国与人类之间的联系，指引人们走向天国。"
 physical_body_of_christ: "基督的奥体"
 physical_body_of_christ_desc: "我们的教会是基督身体在地上的真实体现，于祂在天上的身体毫无二致。因此，教会就是救主的真实临在，为了众人的利益而被派遣。"
 sight_veneration: "视觉崇敬"
 sight_veneration_desc: "崇敬最重要的方面是通过信徒自己的感官来使他们知晓。因此，我们的教堂总是装饰着鲜艳的图像和色彩，使基督在地上的临在能够被任何人立即感受到。"
 theotokos: "诞神女"
 theotokos_desc: "童贞玛利亚是我们的主保，她满全了旧约，孕育了新约的基督。因此，她是为天主基督取得肉身者，真正的诞神女，其地位高于所有其他圣人。"
 #Age 4 - Age of Reformation
 julian_calendar: "儒略历"
 julian_calendar_desc: "几个世纪以来，我们的国家和教会一直在使用尤利乌斯·凯撒于公元前46年颁布的$julian_calendar$。它不仅使所有东方$christian_ADJ$国家成为一体，还规定了举行重要节日和庆典的时间。"
 national_rites: "民族礼仪"
 national_rites_desc: "我们的教会存在各自主教会，允许各国的民族礼仪有所不同。然而，福音的统一性依然存在，整个教会作为一个整体并未被打破。"
 oktoechos: "八调"
 oktoechos_desc: "$oktoechos$是谱写音乐的八调式系统，数个世纪以来一直被用于为教会谱写宗教唱诗和乐曲，是$orthodox_ADJ$唱诗的基础，但各文化会对其做出一些改变。"
 paschal_cycle: "葩斯哈周期"
 paschal_cycle_desc: "$orthodox$在#italic 葩斯哈#!，即复活节，前后有一些可以移动日期的庆节，以$paschal_cycle$的形式安排具体日期。在葩斯哈之前的十周被称为大斋期，而葩斯哈之后的50天被称为五旬。这一周期标志着礼仪年中最为重要的庆典。"
 prestigious_monasticism: "备受尊崇的修道生活"
 prestigious_monasticism_desc: "在$orthodox$中，修道和酷刑生活被高度重视，几乎是必需的。任何主教必须首先是僧侣，如果不是，他们必须在被祝圣之前成为僧侣。因此，修道院和修道中心对我们的教士生活有很大影响。"
 #Age 5 - Age of Absolutism
 christianization_of_the_slavs: "斯拉夫人的基督化"
 christianization_of_the_slavs_desc: "基辅罗斯人是最先接受基督之光，皈依$orthodox$的东$slavic_group$人。基督教信仰从那里开始在东方人之间广泛传播。"
 cyril_and_methodius: "基里尔和麦托迪"
 cyril_and_methodius_desc: "二人都是9世纪的$BYZ_ADJ$神学家，在向斯拉夫人传福音的过程中发挥了重要作用。他们创造了格拉哥里字母，这是用于书写$church_slavonic_language$的第一种文字，之后他们的追随者创造了基里尔字母，以基里尔的名字命名。"
 heirs_of_rome: "罗马的继承者"
 heirs_of_rome_desc: "许多人声称自己是罗马及整个罗马帝国的继承人。然而，只有我们的信仰才是古老帝国的正信，只有我们可以合法地声称自己是其直接后裔。"
 interaction_between_church_and_state: "教会与国家间的互动"
 interaction_between_church_and_state_desc: "牧首对其所辖范围及其信徒拥有绝对权威。通过将他们的权威与统治者的权威联系起来，我们可以利用教会的资源来加强国家的权威。"
 legacy_of_saint_andrew: "圣安德列的遗产"
 legacy_of_saint_andrew_desc: "根据圣传，圣安德列来到了斯基泰和$black_sea_area$的北部海岸，预言了$christian$在传扬到未来$kyiv$位置时的巨大发展。"
 #Age 6 - Age of Revolutions
 eastern_ecumenism: "东方教会合一"
 eastern_ecumenism_desc: "东方正统教会的$christian_ADJ$宗派常常被不熟悉的人误认为是$orthodox$。尽管在许多关键问题上它们与我们不同，但它们仍然是$christian_ADJ$，并且有许多共同点可以用来将它们带回正统信仰。"
 justified_holy_wars: "合法圣战"
 justified_holy_wars_desc: "我们不能允许异教徒和异端来支配我们的行动。净化土地上的不洁是我们的神圣职责，以便在地上显现真正的天主的国。"
 outwards_expansion: "继续扩张"
 outwards_expansion_desc: "教会的神圣职责是将基督之光带给异教徒和异端。因此，我们必须在边界之外探寻，将救赎带给他们的灵魂。"
 resistance_to_the_infidels: "抵御异教徒"
 resistance_to_the_infidels_desc: "我们的$orthodox_ADJ$弟兄有时会发现自己处于外国异教徒的压迫之下。然而，我们已经学会了忍受这种压迫，甚至与那些异教徒共同生活。"
 structured_patriarchates: "井井有条的牧首区"
 structured_patriarchates_desc: "我们的各牧首区一直以来都组织严密、结构清晰，每个牧首区都有各自的职责和界限。这使得整个教会和国家的运作更加顺畅。"
 #Protestantism
 #Age 4 - Age of Reformation
 confessio_augustana: "新的信条"
 confessio_augustana_desc: "宗教改革是我们有机会为人民订立新信理，更重要的是，我们可以接受批评并改变信理。"
 devotionalism: "献身"
 devotionalism_desc: "我们必须复兴奥斯定的神学，将信仰奠基于信徒的激情与热忱之上。"
 protect_the_new_faith: "信仰之盾"
 protect_the_new_faith_desc: "我们的信仰四面受敌，我们必须捍卫自己信仰的权利，抵御教宗分子的压迫者。"
 protestant_administration_tax: "高效税吏"
 protestant_administration_tax_desc: "神职人员以前承担了一部分亲自收税的负担。虽然在宗教改革后，这些安排中有一部分已经被废除，但有能力的人仍然存在，并准备好为我们服务。"
 protestant_invite_persecuted: "邀请不受欢迎者"
 protestant_invite_persecuted_desc: "虽然我们已经看到了正信的光明，但我们的许多兄弟姐妹仍在被误导者的压迫统治下受苦。我们应该邀请并支持这些人定居在我们的土地上，在这里他们可以无后顾之忧地生活，更重要的是，他们可以为我们的国库做出贡献。"
 #Age 5 - Age of Absolutism
 expulsion_of_heretics: "驱逐异端"
 expulsion_of_heretics_desc: "我们领土内的麻烦异端可能会成为反对统治者的叛乱中心。将他们转移到我们的海外殖民地会更好，在那里他们能引起的麻烦会少得多。"
 involved_laity: "平信徒参与"
 involved_laity_desc: "随着平信徒越来越多地参与教会的日常管理，我们的人民与信仰本身建立了更个人化的联系。"
 protestant_cuius_regio_eius_religio: "$catholic_cuius_regio_eius_religio$"
 protestant_cuius_regio_eius_religio_desc: "$catholic_cuius_regio_eius_religio_desc$"
 protestant_painters: "新教艺术"
 protestant_painters_desc: "宗教改革促使越来越多的艺术家描绘新的景象，远离宗教体裁。雇佣更多这样的艺术家将使我们作为艺术赞助人的形象更加光辉。"
 repurposed_monasteries: "修道院改变用途"
 repurposed_monasteries_desc: "我们国家在改信过程中没收的旧教会土地，现在可以作为新的生产或行政中心为我们服务。"
 #Age 6 - Age of Revolutions
 embrace_romanticism: "拥抱浪漫主义"
 embrace_romanticism_desc: "在启蒙运动之后，我们不应忘记浪漫注意的吸引力。我们的浪漫主义艺术家必将创作出伟大的艺术作品。"
 protestant_innovation: "新教革新精神"
 protestant_innovation_desc: "从我们的信仰起源开始，我们已经学会了质疑既定教义和信仰的内在价值。我们可以将同样的思维方式应用于其他研究领域。"
 protestant_sunday_schools: "$sunday_schools_advance$"
 protestant_sunday_schools_desc: "$sunday_schools_advance_desc$"
 protestant_work_ethic: "勤勉工人"
 protestant_work_ethic_desc: "清教徒或虔敬主义传教士对宗教改革的影响是不可否认的。他们对勤奋和节俭等美德的关注将帮助我们培养高素质的劳动力。"
 wary_of_heretic_preachers: "抵御异端"
 wary_of_heretic_preachers_desc: "我们需要警惕那些试图转变人民信仰或变回旧信仰的力量。通过将这些传教士标记为恶意和敌对，我们可以让我们的人民为这些接触做好准备，并更容易地贯彻宗教正统。"
 #Shinto
 #Age 1 - Age of Traditions
 heian_kyo: "平安京"
 heian_kyo_desc: "几个世纪以来，平安京一直是天皇的居所，也是艺术和文化的中心。$fujiwara$时代的奢华宫廷曾在此兴盛，一度令整个日本为之景仰。我们将继承传统，并在我们的赞助下，再次让京城的文化焕发光彩。"
 matsuri: "祭典"
 matsuri_desc: "每个地方的神社和寺庙都有自己的节日和庆典，吸引了周围所有人踊跃参与。这是他们向当地守护神表达忠诚和感激的机会。"
 onmyodo: "阴阳道"
 onmyodo_desc: "阴与阳的理论数个世纪前从$china$传来，在$japan_region$演变为$onmyodo$。这方面的专家被称为阴阳师，负责净化和驱除邪灵恶鬼，以及占卜、天文和自然研究。"
 sumo: "相扑"
 sumo_desc: "$sumo$起源于一种祈求丰收的农业祭祀舞蹈，现在已摆脱了宫廷和祭司的束缚，成为普通民众间广为流传的习俗，同时也是一种军事作战训练方式。"
 #Age 2 - Age of Renaissance
 honji_suijaku: "本地垂迹说"
 honji_suijaku_desc: "$shinbutsu_shuugou$的关键思想是将本土神明视为不同的佛和菩萨，而后者也是不同神明的化身。因此，两教归根结底融合为了一体，这些神祇的法身被称为本地（即#italic 佛本#!），而不同的化身被称为垂迹（即#italic 权现#!）。"
 nanto_rokushuu: "南都六宗"
 nanto_rokushuu_desc: "自从$buddhist$从$china$传入以来，$nara$东大寺就一直很有影响力。寺庙中形成的六大宗派是知识的宝库，它们蕴含了关于佛陀教义和各种悟道方法的知识，也包括像如何正确管理寺院这样更世俗的内容。"
 shinbutsu_shuugou: "神佛习合"
 shinbutsu_shuugou_desc: "自$buddhist$传入$japan_region$以来，其教义一直与本土的神灵崇拜相混合，佛和神道已融合为一套统一的综合信仰，尽管其礼仪天差地别。"
 #Age 3 - Age of Discovery
 bodaiji: "菩提寺"
 bodaiji_desc: "自古以来，崇敬祖先就是遍布我国国土一种普遍现象。因此，我们最有影响力的统治者可以为他们建立整座庙宇，供他们死后安葬和瞻仰。这样，他们的生平事迹也会被保存和铭记。"
 gozan_jissetsu: "五山十刹"
 gozan_jissetsu_desc: "“五山制”起源于$china$，是由国家资助$buddhist_ADJ$寺院的一项传统制度，因这些寺庙其位于五座神山之上而得名。在$japan_region$，这一做法在镰仓时代得到了延续，赞助了$kyoto$五山和$kamakura$五山上的十座禅院。通过保持对这些机构的赞助，我们可以利用它们来帮助稳定我们的统治。"
 hachiman_worship: "八幡神"
 hachiman_worship_desc: "八幡大明神是最受尊崇的神祇之一。祂起初被视作应神天皇的神化，在$buddhist$传入后又被称作八幡大菩萨。祂是日本皇室的祖神，也是武士阶层的战神。"
 #Age 4 - Age of Reformation
 kagura: "神乐"
 kagura_desc: "$kagura$最初是由神社#italic 巫女#!在神座前表演的礼仪性质的歌舞，后来在$japan_region$各地演变成不同样式的表演形式，但其传统的仪式内核基本保留了下来。"
 neo_confucianism: "理学"
 neo_confucianism_desc: "$SECT_CONFUCIANISM_NAME$已有数千年的历史，理学在$japan_region$也已存在数个世纪。然而，国家对它的进一步支持将确保我们的政府能牢牢掌控国家。"
 obon: "盂兰盆节"
 obon_desc: "$obon$是最重要的节日之一，是祭奠死者和祖先的日子。人们会献上食物，跳祭祀舞蹈，同时点燃火堆和灯笼，引导亡灵回家团聚，而后再次回到亡灵之地。"
 #Age 5 - Age of Absolutism
 danka_system: "檀家制度"
 danka_system_desc: "几个世纪以来，$japan_region$的各个家族与当地的$buddhist_ADJ$寺院保持着良好的关系。豪族给予僧人经济供养，以换取他们提供精神慰藉。将这一制度推广到全体国民，将确保我国人民的信仰得到保障。"
 harae: "禊祓"
 harae_desc: "作为一种净身仪式，#italic $harae$#!是我们信仰的关键，它将清洁我们所有的#italic 罪孽#!和#italic 污秽#!。如果能保障人民时常正确地执行$harae$仪式，就能确保我们的国家时时保持纯洁。"
 jisha_bugyou: "寺社奉行"
 jisha_bugyou_desc: "作为所有寺庙和神社的管理者和监督者，$jisha_bugyou$负责监督这些宗教机构的所有活动，确保它们的利益与政府保持一致。"
 #Age 6 - Age of Revolutions
 fukko_shinto: "复古神道"
 fukko_shinto_desc: "正如人们拒绝外来文化污染我们的文化一样，我们也拒绝$buddhist_ADJ$和$SECT_CONFUCIANISM_NAME$混入我们的信仰。并遵循此道以复兴$shinto$。"
 home_shrines: "神棚"
 home_shrines_desc: "传统上，崇拜和仪式都是在神社和寺庙中进行的。不过，越来越多的人开始在家中设立#italic 神棚#!以供奉神灵，并设立#italic 佛坛#!作为供奉祖先的$buddhist_ADJ$祭坛。"
 kokugaku: "国学"
 kokugaku_desc: "几乎自神武开国以来，$japan_region$和$shinto$就一直受到来自$china$和$buddhist$的舶来思想的影响。一场新的运动正在生根发芽，它声称我们自己的民族精神是天然纯洁的，所有外来影响都应被剔除。"
 #Unique Advances
 #Balkans Region Advances
 #Albanian Shared
 albanian_the_kanun: "卡努法典"
 albanian_the_kanun_desc: "在缺乏中央王权的情况下，我们的社会秩序由#italic 《卡努法典》#!来维护，这是一套精密的习惯法。这套法律框架管辖着从财产权到#italic 贝萨#!（神圣誓言）的神圣义务等一切事务。#italic 《卡努法典》#!提供了稳固的稳定与荣誉基石，这是外国统治者永远无法彻底瓦解的。"
 albanian_prokletije: "诅咒山脉"
 albanian_prokletije_desc: "屹立在我国腹地的诅咒山脉，如同#italic 《卡努法典》#!本身一样，早已成为我们民族的一部分。即便最卑微的村民也知道哪些山口在冬季可以通行，哪些山脊可以躲避伏击，哪些山谷是死胡同。入侵者在遭遇我们的战士之前，就会早早地因地形而困于这片迷宫之中。"
 albanian_the_stradioti_tradition: "斯特拉迪奥蒂传统"
 albanian_the_stradioti_tradition_desc: "我们山区的贫困，将我们的男儿锤炼成了基督教世界最优秀的轻骑兵。从威尼斯到法兰西，每个大国都垂青这些斯特拉迪奥蒂骑兵，他们擅长散兵作战与侦察，技艺无与伦比。通过输出我们的尚武精神，我们为山区带回财富，并确保我们的士兵拥有欧洲最丰富的实战经验。"
 albanian_the_sacred_oath: "神圣誓言"
 albanian_the_sacred_oath_desc: "#italic 贝萨#!这一观念已演变为全国性的信任与好客制度。阿尔巴尼亚人言出必行，这种坚贞忠诚的声誉使我们成为地中海地区最受信赖的卫士与雇佣兵。在一个联盟关系变幻莫测的世界里，我们的誓言就是我们最宝贵的货币。"
 albanian_the_transhumance_networks: "季节移牧网络"
 albanian_the_transhumance_networks_desc: "牲畜的季节性迁徙（转场放牧）使我们的子民得以利用夏日高地牧场与沿海地区温暖的冬季平原。这种流动的生活方式使敌人难以锁定我们的人口所在，也提供了一种坚韧的食物来源，不易被焦土战术所摧毁。我们的财富长着四条腿，随时准备转移到更安全的地方。"
 albanian_the_fortified_kulla_houses: "设防的库拉塔楼"
 albanian_the_fortified_kulla_houses_desc: "在乡间各处，贵族与富裕农民纷纷建起#italic库拉塔#!——坚固的石造塔楼住宅。这些建筑如同微型城堡，既能保护家族免受血仇侵害，也能抵御敌人的袭扰。它们彰显着一个时刻处于备战状态的社会。"
 albanian_the_albanian_alphabet_commission: "阿尔巴尼亚字母委员会"
 albanian_the_albanian_alphabet_commission_desc: "学者与爱国者们正不懈努力，以统一的拉丁字母为基础，将阿尔巴尼亚语标准化。通过建立民族学校、用民族语言印刷报纸，我们正在打破外国语言的文化霸权。阿尔巴尼亚语的普及是实现真正独立的第一步。"
 #Albanian Unique
 alb_the_arberian_principality: "阿尔巴利亚公国"
 alb_the_arberian_principality_desc: "随着敌人势力的衰退，我国各大家族联合一致，以确保国家的存续。凭借我们地处天主教西方与东正教东方之间的有利位置，我们已成为海上外交与沿海贸易的行家。这种战略上的自主性，使我们能够周旋于邻邦的纷争之中，坐收渔利。"
 alb_angevin_legitimacy: "安茹的合法性"
 alb_angevin_legitimacy_desc: "我们最新加冕的君主，其血统可直接追溯至卡佩王朝的安茹家族，具体由那不勒斯的查理一世建立，旨在将其作为进入拜占庭腹地的门户。这一渊源使我们在四分五裂的巴尔干领主中独享西方威望，使我们得以在欧洲天主教大国的议席中占有一席之地。通过尊奉百合纹章的荣耀与纹章，我们彰显了自身的王权，区别于普通的部落首领。"
 ant_born_in_the_highlands: "生于高地"
 ant_born_in_the_highlands_desc: "我们在本国高地的祖居之地，是一座由嶙峋山峰与狭窄峡谷构成的天生堡垒，常规军队几乎无法通行。我们进一步加固了每一处战略要隘与山峰，确保任何入侵之敌，每试图占领我方一寸土地，都必须付出惨重的鲜血代价。"
 mtr_the_masters_of_the_karavasta: "卡拉瓦斯塔泻湖之主"
 mtr_the_masters_of_the_karavasta_desc: "我们的疆域受到迷宫般的卡拉瓦斯塔泻湖的庇护，我族人民精通在泥滩与隐秘水道间的航行。这片水域景观如同一座天然堡垒，外来的重装大军几乎无法测绘或征服，是任何骑兵冲锋都无法触及的庇护所。"
 mzk_the_agricultural_wealth_of_the_devoll: "德沃尔河谷的农业财富"
 mzk_the_agricultural_wealth_of_the_devoll_desc: "我国腹地肥沃的河谷借助先进的灌溉技术，为我们供养起奢华的宫廷与训练有素的骑兵部队。德沃尔河谷的丰收滋养着我们的政治雄心，充实着庞大常备扈从的行伍。"
 thp_french_blood_claims: "法兰西血统宣称"
 thp_french_blood_claims_desc: "我们声称自己拥有源自法兰西王室的尊贵血统，尽管存在争议，但这为我们的外交官在欧洲宫廷中赢得了独特地位。这种公认的高贵谱系使我们能够与意大利城邦及教廷以平等身份谈判，缔结那些普通巴尔干军阀无法企及的联盟。"
 alb_eastern_and_western_heritage: "东西方双重遗产"
 alb_eastern_and_western_heritage_desc: "我们的城市中心，至今仍在拜占庭法精妙原则与西方现代官僚体制的双重作用下运转。这种法律上的延续性，为契约、产权与继承提供了稳定的框架，吸引了外国商人与学者来到我们的宫廷。一套恪守传统的法律体系，是我们行政实力日益增长的基石。"
 alb_the_national_arsenal: "国家兵工厂"
 alb_the_national_arsenal_desc: "作为西方干预力量的主要港口，我们现代化了都拉斯的造船厂，以维持一支常备桨帆船舰队。这些基础设施使我们能够将力量投射至亚得里亚海对岸，确保那不勒斯与阿尔巴尼亚之间的海上通道畅通无阻，以输送援军与贸易物资。我们对港口的控制，使我们成为巴尔干西海岸线无可争议的主宰者。"
 ant_the_iron_mines_of_the_interior: "内陆铁矿"
 ant_the_iron_mines_of_the_interior_desc: "我国控制的阿尔巴尼亚中部崎岖山区，蕴藏着丰富的优质铁矿石，这是战争工具所必需的。我们建立了由国家资助的冶炼厂，为我们的部族持续供应优质的钢制刀剑与甲片，确保我们不断壮大的军队无需依赖外国进口。"
 mtr_lagoon_fisheries: "泻湖渔业"
 mtr_lagoon_fisheries_desc: "我们沿海水域的生物资源，提供了稳定的食物供给，即便在地区性饥荒时期也能供养规模更大的常备民兵。通过垄断泻湖的渔业捕捞，我们确保了人民的健康与粮仓的充盈，为国家的存续提供了动力。"
 mzk_the_despots_of_berat: "培拉特专制君主"
 mzk_the_despots_of_berat_desc: "以“千窗之城”培拉特城堡为治所，我们代表着阿尔巴尼亚城市文明的巅峰与拜占庭式行政管理的典范。我们的宫廷吸引着学者与工匠，将我们的都城打造成堪比东方伟大都会的文化灯塔。"
 thp_the_lion_of_thopia: "托皮亚之狮"
 thp_the_lion_of_thopia_desc: "我们家族凭借在各部族纷争间游刃有余的周旋，一跃成为举足轻重的势力，使托皮亚家族成为阿尔巴尼亚主权的仲裁者。通过编织一张错综复杂的联盟之网，我们将赢得首个获东西方共同承认的真正 #italic 阿尔巴尼亚亲王 #! 头衔。随着我们家徽上的雄狮飘扬于海岸壁垒之上，我们已建立起一套专业化的行政核心体系，远胜于对手那原始的封建制度，确保我们家族始终是亚得里亚海沿岸首屈一指的强权。"
 alb_the_champion_of_christ: "基督捍卫者"
 alb_the_champion_of_christ_desc: "尽管我们的社群因信仰而分属不同教派，但我国全体虔奉基督，为我们赢得了#italic 基督斗士#!的称号。我们坚定不移的信仰引起了教宗与牧首们的关注，为我们争取到了财政补贴与志愿兵源。我们不仅是为自己的土地而战，更是为“基督圣言”的存续而战。"
 alb_the_catholic_bulwark: "天主教之盾"
 alb_the_catholic_bulwark_desc: "作为罗马教会最东端的前哨，我们已成为抵御东正教分裂者与突厥异教徒的主要屏障。我们肩负的神圣职责带来了一种浸润全境的内心安宁，将我们的奋战升华为一场关乎灵魂的圣战。"
 ant_arianitis_defiance: "阿里亚尼蒂的抗争"
 ant_arianitis_defiance_desc: "效仿我们先辈的英雄事迹，我族以最早举起义旗、最晚向敌人屈服而闻名。这种不屈抵抗的传承，将我们的人民锻造成一个视战斗为神圣天职、而非负担的战斗民族。"
 mtr_marshland_guerillas: "沼泽游击战术"
 mtr_marshland_guerillas_desc: "我们专门训练征召的民兵，引诱敌军部队陷入深沼泽，在那里，他们的重甲反成累赘。在这种环境中，我们轻装、不穿甲胄的步兵通过伏击战术占据绝对优势，将脚下的土地化为武器。我们适应任何地形、在最恶劣条件下快速机动的能力，使我们成为令人生畏的对手。"
 mzk_the_muzaka_chronicle: "《穆扎卡编年史》"
 mzk_the_muzaka_chronicle_desc: "我们家族精心保存着关于自身历史与领土权利的宏大记录，确保我们古老的权属主张永不遗忘。这种修史传统延续着我们崇高的拜占庭头衔，以帝国的尊严与历史的厚重感震慑着地方上的对手。"
 thp_a_centralized_levy_system: "中央集权的征兵制"
 thp_a_centralized_levy_system_desc: "我们已摆脱松散的部族联盟，转而在中心城市建立起一支半职业化的步兵核心力量。当部族征召尚在缓慢集结之时，我们的军队已能迅速而有序地应对威胁。"
 alb_the_arbereshe_diaspora: "阿尔贝雷舍侨民"
 alb_the_arbereshe_diaspora_desc: "随着时间的推移，相当一部分我族人民移居海外，形成了#italic 阿尔贝雷舍#!社群。这些“海外的阿尔巴尼亚人”在保持我们语言与传统的同时，也在新的家园获得了影响力。他们在那里充当着常驻的外交使节，不断为故土奔走游说，争取支持。"
 alb_diplomacy_of_the_two_shores: "两岸外交"
 alb_diplomacy_of_the_two_shores_desc: "我们的位置使我们能够充当意大利城邦与崎岖巴尔干内陆之间的关键桥梁。我们的外交官经过专门训练，既能游刃有余地应对威尼斯元老院，也能在部族议事会中斡旋，使我们的调解在贸易与战争中不可或缺。"
 ant_patronage_of_the_faith: "信仰的赞助"
 ant_patronage_of_the_faith_desc: "通过向修道院捐赠大量土地与资金，我们维系了贵族与农民在精神上的忠诚。这些圣地是我们公国的文化心脏，我们的胜利在那里被传颂与庆祝。"
 mtr_the_trade_monopolies: "贸易垄断"
 mtr_the_trade_monopolies_desc: "通过控制入海口与海岸，我们成功掌握了从内陆向威尼斯桨帆船输送木材与谷物的通道。我们已将自己定位为亚得里亚海贸易中不可或缺的中间商，确保任何商人都无法绕过我们规定的通行税。"
 mzk_silk_road_waystations: "丝绸之路驿站"
 mzk_silk_road_waystations_desc: "我们的土地位于内陆主要商路之上；通过对丝绸商队征税，我们维持着充盈富庶的国库。这些收入使我们能够资助最优秀的书法家与圣像画师，将我们的领地打造成南阿尔巴尼亚的文化之都。"
 thp_mecenas_of_the_arts: "艺术的赞助人"
 thp_mecenas_of_the_arts_desc: "我们资助兴建了融合哥特式与拜占庭风格的宏伟主教座堂与防御工事，以此展示我们的财富与虔诚。这种建筑上的辉煌，在教会与臣民眼中巩固了我们统治的合法性，将我们的城市打造为永恒权力的象征。"
 alb_the_albanian_merchant_class: "阿尔巴尼亚商人阶级"
 alb_the_albanian_merchant_class_desc: "我国沿海的商人已成为巴尔干与西方之间贸易的主要承运者。他们在商业中使用希腊语，在忠诚问题上使用阿尔巴尼亚语，从而主宰了从威尼斯到君士坦丁堡的市场。这些商船船员是我们经济现代化进程的命脉。"
 alb_the_expansion_of_the_regnum: "王国的扩张"
 alb_the_expansion_of_the_regnum_desc: "在古老王国的疆界恢复到其极盛版图乃至更远之前，我们绝不罢休，势必重夺巴尔干霸主的地位。这一中央集权的使命，使我们得以在恢复'正统'统治的同时，将新征服的领土几乎不费吹灰之力地纳入治下。"
 ant_the_eternal_resistance: "永恒抵抗"
 ant_the_eternal_resistance_desc: "我们发下永恒誓言：只要我们一息尚存，反抗的意志就将继续跳动。我军士兵在训练中被注入了对我朝统治家族的狂热忠诚，确保他们即便在面对帝国压倒性兵力时也能严守纪律。"
 mtr_reclamation_engineering: "开垦工程"
 mtr_reclamation_engineering_desc: "我们已启动米泽凯沼泽的部分排水工程，以开垦出更多肥沃的农田。这一工程壮举不仅扩大了我们的税基，还使我们能够在曾经无法通行的沼泽地带修筑永久性道路。"
 mzk_literary_patronage: "文学赞助"
 mzk_literary_patronage_desc: "我们将都城打造成文化中心，为后世保存了东西方的智慧。这种知识界的声望，使我们的宫廷成为东正教与拉丁世界最杰出人才的向往之地。"
 thp_princeps_albaniae: "阿尔巴尼亚亲王"
 thp_princeps_albaniae_desc: "我们的名号已与国家本身成为同义词，使我们能够将不同的族群凝聚在同一面旗帜之下。通过提拔最有才华的个人，无论其出身如何，我们建立了一个唯才是举的官僚体系，令我们封建时代的对手相形见绌。"
 alb_the_spirit_of_the_rilindja: "民族复兴精神"
 alb_the_spirit_of_the_rilindja_desc: "我们的#italic 民族复兴#!之火，点燃了从北部山区到意大利、埃及侨民社群中所有阿尔巴尼亚人的心灵。这场文化与政治运动将所有阿尔巴尼亚人统一在“阿尔巴尼亚主义”的共同旗帜之下。我们是一个重生的民族，准备好跻身欧洲主权国家之列。"
 alb_enlightened_albanian_absolutism: "阿尔巴尼亚开明专制"
 alb_enlightened_albanian_absolutism_desc: "追随欧洲潮流，我们的君主已实现权力集中，剥夺了旧氏族的封建特权，以建立现代国家。此举使我们得以实施统一税制与国家司法体系，将王国转变为一台精简高效的战争机器。"
 ant_the_professional_highland_grenadiers: "职业高地掷弹兵"
 ant_the_professional_highland_grenadiers_desc: "我们将传统的散兵部队，发展为一支精锐的高山掷弹兵部队，专精于强攻与围城战。这些士兵融合了他们祖先的山地敏捷性与现代炸药毁灭性的火力，成为任何要塞守军的噩梦。"
 mtr_the_mataranga_port_authority: "马塔兰加港务局"
 mtr_the_mataranga_port_authority_desc: "我们已将沿海所有港口统一置于单一行政机构之下，简化了关税与赋税的征收。这种中央集权化使我们成为亚得里亚海最高效的贸易管理者，吸引着外国商贾的真金白银。"
 mzk_the_muzakan_industrialization: "穆扎卡工业化"
 mzk_the_muzakan_industrialization_desc: "我们在最肥沃的河谷引入了经济作物的大规模种植，为新兴的国内工业提供了动力。通过将我们的原材料加工成高附加值产品，我们建立了一个工业基础，支撑起一个富裕而忠诚的城市人口阶层。"
 thp_the_thopia_merchant_marine: "托皮亚商船队"
 thp_the_thopia_merchant_marine_desc: "我们通过为所有悬挂托皮亚旗帜的商船提供国家保护，扩大了商业影响力。这种海上安全保障，使我们的港口成为黎凡特贸易的首选枢纽，源源不断地从对手日渐衰败的港口中汲取财富。"
 #Bosnian Shared
 bos_cultural_customs: "$bosnia_area$的斯特茨奇墓碑"
 bos_cultural_customs_desc: "我们的人民有许多独特的习俗，不受信仰差异的限制。建造精美装饰的墓碑——#italic 斯特奇石#!，将标示出我们这片独属波斯尼亚的领土。"
 bos_katun_communities: "弗拉赫村社自治"
 bos_katun_communities_desc: "我们的一部分人口以自治的游牧社群形式生活。与其强迫他们屈从中央政府的意志，我们更应与其合作，尝试从偏远地区获取更多资源。"
 bos_defiant_terrain: "顽固的地形"
 bos_defiant_terrain_desc: "$bosnia_area$的土地由森林覆盖的山丘和山脉构成，其间河谷纵横交错。这样的地形天然适合拖延消耗入侵军队。我们应当善用这个优势，只在对我方有利时与敌交战，让险恶的地形自行消耗他们的物资和兵力，如此便能保存我方实力。"
 bosnian_bosancica: "波斯尼亚西里尔文"
 bosnian_bosancica_desc: "波斯尼亚人民团结在 #italic 博桑契察文 #! 周围，这是一种独特的草书西里尔字母文字，广泛用于从外交条约到私人商号账簿的各种场合。这种民族文字成为一道强大的文化屏障：外族人难以辨读，却在识字阶层中通行无阻，不论其信仰为何。通过保留这种独特的文字，人民确保了其法律与历史文献在帝国官吏眼中始终是一本'无法破译的天书'，以一种强化其独特斯拉夫传统的形式，守护着财产法与血统传承中那些隐秘的精微之处。"
 bosnian_people_from_the_hills: "山地民族"
 bosnian_people_from_the_hills_desc: "波斯尼亚腹地的地形是一座由石灰岩山脊与谷地组成的立体迷宫，令寻常的地图测绘无从下手。我们的子民早已适应这种地理逻辑，精通地下洞穴网络的秘密，以及骡队运输的后勤之道。"
 bosnian_susjedsvto_of_bosnia: "波斯尼亚的邻里之道"
 bosnian_susjedsvto_of_bosnia_desc: "古老的文化观念#italic邻里互助#!（即保护和尊重邻人的神圣社会义务）已演变为一种超越宗教分歧的精深公民哲学。面对外部压力，这条不成文的准则规定，邻人的安全与财产应与自身的一样神圣不可侵犯。这一习俗挫败了外国势力惯用来挑拨内部纷争的'分而治之'伎俩。通过将地方团结与'邻里之法'置于首位，我们维系着一种社会和睦与内部稳定的局面，使国家能够以坚不可摧的统一阵线，抵御任何企图瓦解我们共同家园的图谋。"
 #Bosnian Unique
 bos_land_of_many_churches: "波斯尼亚的诸多教派"
 bos_land_of_many_churches_desc: "波斯尼亚地区拥有多个教派。我们的土地不仅由东正教与天主教共同分享，还是波斯尼亚教会的所在地。由于远离中央监管，我们必须促进各群体间的本地化理解与和谐，以确保稳定。"
 bos_influence_of_the_stanak: "斯塔纳克会议"
 bos_influence_of_the_stanak_desc: "我国的贵族们定期齐聚一堂，商讨国家最紧迫的事务。这些会议确保我们的贵族领主们在政策上保持一致，并在议会会议中展现出团结。"
 bos_kingly_ambitions: "为王的野心"
 bos_kingly_ambitions_desc: "我们人民的成就与辛劳理应得到认可和保护。为此，我们需要与周边统治者建立牢固的认可与纽带，从而为我们赢得一个尊贵的头衔。"
 bos_the_srebrenica_mint_office: "斯雷布雷尼察铸币局"
 bos_the_srebrenica_mint_office_desc: "随着$srebrenica$的银矿成为巴尔干地区最主要的贵金属来源，我们的王国已不再满足于仅仅出口原矿石。我们建立了皇家铸币局与化验办公室，以规范波斯尼亚白银的成色，铸造出在可靠性上足以媲美威尼斯的银币。通过强制规定，无论是拉古萨矿主还是萨克森矿工开采的所有白银，都必须经由国家控制的精炼厂处理，我们攫取了绝大部分的增值利润。这种流动的财富使波斯尼亚成为迪纳拉山脉地区财政最稳健的强国。"
 bos_bosnian_ljekaruse: "波斯尼亚药典"
 bos_bosnian_ljekaruse_desc: "在我国僻静的山谷之中，修道院的僧侣们编纂了 #italic 民间医典 #!，这是一部以本民族 #italic 博桑契察文 #! 书写的庞大医药典籍。通过将古希腊-拜占庭理论与第纳里克阿尔卑斯山高海拔草药学相融合，这些手册在专业医师稀缺的年代，为社群提供了一套精密的医疗保健体系。这种对民间医术与外科技艺的精湛掌握，确保我国人民在肆虐低地的瘟疫面前依然坚韧不拔，培育出一种以知识自立与斯拉夫科学传承为核心的文化认同。"
 bos_the_filigree_guilds: "金银细工行会"
 bos_the_filigree_guilds_desc: "凭借中部山脉取之不尽的银矿脉，我国城市工匠精研出'费里格兰'金银丝细工的技艺，这已成为波斯尼亚奢华工艺的标志。这些行会作为一股强大的经济力量，将礼仪匕首与精美珠宝销往威尼斯与维也纳的市场。将我们的原矿财富转化为高价值的艺术出口品，我们因此孕育出一个对王室忠心耿耿的繁荣城市中产阶层。这种精湛的工艺令我国在各国宫廷中声望倍增，证明巴尔干的'铁之心'同样拥有可与西方诸大都城媲美的精致文化底蕴。"
 #Bulgarian Shared
 bulgarian_orthodox_patriarchate: "保加利亚东正教牧首区"
 bulgarian_orthodox_patriarchate_desc: "1235年经兰普萨库斯公会议确认而恢复的保加利亚牧首区，使特尔诺沃成为可与君士坦丁堡和罗马相抗衡的独立灵性中心。至十四世纪，该牧首区已成为阿森王朝与希什曼王朝的思想支柱，凭借其自治教会的地位，为王国的政治分裂局面提供了超越性的神圣合法性。从其坐落于查雷维茨山的总部出发，教会管理着由主教区与修道院组成的庞大行政网络，如阿索斯山上的佐格拉夫修道院，这些机构皆是保加利亚语教会斯拉夫语文本的宝库。"
 reformation_of_the_bulgarian_patriarchate: "牧首区改革"
 reformation_of_the_bulgarian_patriarchate_desc: "保加利亚世界的精神中心将在我们牧首的铁腕指导下经历一场严格而深刻的变革。牧首区认识到国家的生存取决于其信仰的纯洁性和圣典的准确性，将以特尔诺沃圣三一修道院为中心发起一场全面的语言和礼仪改革。通过清除教会斯拉夫语手稿中数百年间累积的抄写错误与地方讹变，我们将建立一套全新的标准化正字法，它会成为从多瑙河到伏尔加河的整个东正教斯拉夫世界的黄金标准。"
 bulgarian_the_danubian_river_merchants: "多瑙河商贾"
 bulgarian_the_danubian_river_merchants_desc: "保加利亚商人家族利用其地处下多瑙河门户的位置，建立了一个连接黑海与中欧的精密贸易网络。通过使用浅吃水驳船和筑防河港，他们成功绕过了昂贵且危险的陆路路线，掌控了盐、谷物和木材在整个巴尔干地区的流通。这种对河流的专精将多瑙河变成了保加利亚的财富动脉，资助了一个新兴城市精英阶层的崛起，使我们得以以特权换取他们的赋税。"
 fortress_of_the_balkans: "巴尔干要塞"
 fortress_of_the_balkans_desc: "我们已经认识到，仅靠精神上的纯净无法阻挡世俗狂热的侵蚀。为了存续，国家转向了全面领土设防的方针，将巴尔干山脉改造成了一堵无法逾越的花岗岩城墙。通过用分级石质棱堡和常驻守军加固我们的土地，国家建立了一种战略纵深，迫使任何入侵者陷入一场致命的消耗战。这一政策确保保加利亚腹地仍然是东正教稳定的庇护所，我们民族的精神火种被保护在铁石构筑的屏障之后，没有风暴能轻易将其扑灭。"
 bulgarian_the_bulgarian_cloth_industry: "保加利亚纺织工业"
 bulgarian_the_bulgarian_cloth_industry_desc: "保加利亚各城镇将凭借 #italic 阿巴呢绒 #! （一种厚实耐用的毛呢）和 #italic 盖坦编带 #! （装饰性编绳）的专业化生产，转变为半岛的工业心脏地带。通过将当地的织工与牧人组织成强大的自治行会，我们的商人将能够获得大批国家合同，为地区军队和地中海日益壮大的城市中产阶级提供装备。这股经济浪潮将催生一个商人贵族阶层，标志着保加利亚人民从乡村农民转变为拥有左右邻邦之力的精密的原始工业社会。"
 bulgarian_the_bulgarian_national_awakening: "保加利亚民族觉醒"
 bulgarian_the_bulgarian_national_awakening_desc: "在诸如希伦达的帕伊西这样的修士著作的推动下，保加利亚人民重新发现了他们的帝国历史和语言自豪感，引发了一场大规模的教育和政治复兴。这场运动已超越地方性的不满，要求建立一个集中的、现代化的国家，使其能在欧洲列强中占有一席之地。其结果是一个积极性高且具备读写能力的民众，随时准备为现代官僚机构或国家军队服务，他们坚信沙皇的荣耀并非记忆，而是未来。"
 #Bulgarian Unique
 legacy_of_ivan_asen_ii: "伊凡·阿森二世的遗产"
 legacy_of_ivan_asen_ii_desc: "伊凡·阿森二世统治时期标志着保加利亚在权力、外交和经济扩张方面达到了新的高度。他的遗产成为了构建一个强大且中央集权国家的基础。"
 bul_the_bastion_of_tseverets: "察雷韦茨要塞"
 bul_the_bastion_of_tseverets_desc: "特尔诺沃作为首都，坐落在察雷韦茨山和特拉佩济察山的悬崖上，或许可称得上是巴尔干地区最坚固的堡垒，它象征着阿森王朝的强大。我们持续扩建宫殿群、大主教座堂以及三层城墙，打造出了一个足以抵御突袭政变或围攻的行政中心。这种建筑上的压倒性存在投射出帝国的稳固形象，令当地的波雅尔们感到畏惧，并让民众相信“第三罗马”确实已迁到了扬特拉河岸边。"
 kvn_karvunan_maritime_heritage: "卡尔武纳海事传统"
 kvn_karvunan_maritime_heritage_desc: "卡尔武纳将其力量建立于海洋而非肥沃的平原之上，吸纳了保加利亚、希腊和意大利的水手。通过加固海岸的石灰岩悬崖，我们将建立一系列海军基地，从而掌控多瑙河三角洲与君士坦丁堡之间的黑海贸易路线。这种对海洋的重视将赋予我们在保加利亚世界中独特的身份，将海军优势和贸易置于传统内陆封建考量之上。"
 vid_the_stronghold_of_baba_vida: "巴巴维达要塞"
 vid_the_stronghold_of_baba_vida_desc: "维丁要塞坐落于多瑙河的一处战略性河湾，是保加利亚土地、匈牙利平原和塞尔维亚山地之间的终极门户。在希什曼王朝的统治下，巴巴维达城堡被改造成一座精密的河畔堡垒，能够抵御长期围困并驻扎精锐常备军。这种对防御建筑的重视确保了即使在保加利亚核心领土受到威胁时，维丁仍能作为一座主权堡垒屹立不倒，成为国家的“西方之盾”。"
 revival_of_the_literary_schools: "特尔沃诺艺术学派"
 revival_of_the_literary_schools_desc: "在希什曼王朝的直接赞助下，国家经历了显著的文化发展，将自身定位为真正的#italic 第三罗马#!，以及东正教高级文化的首要守护者。通过资助牧首座堂和察雷维茨皇家宫殿的重建，国家聚集起了新一代的圣像画师、圣徒传记作者与建筑师，他们将传统拜占庭美学和独特、富有感染力的保加利亚现实主义相融合。这一流派不只是创作宗教圣像，它还是帝国宣传的有力工具，规范了教会斯拉夫语的保加利亚语修订本，还编撰出《马纳塞斯编年史》，为沙皇对拜占庭遗产的主张赋予合法性。"
 bul_the_chancery_of_the_asens: "阿森官署"
 bul_the_chancery_of_the_asens_desc: "在全盛时期，特尔诺沃的官署是东正教世界最完备的外交枢纽，其拟定的复杂斯拉夫文书对塞尔维亚和俄罗斯的宫廷产生了影响。沙皇通过将#italic 书记#!和文吏群体职业化，确保每一份土地封赐和国际条约都能得到细致记录并具有法律约束力。这种严谨的行政管理体系使国家能更高效地征收税款，并以中世纪晚期罕见的中央集权方式，管理着复杂的封臣体系网络。"
 kvn_looking_for_friends: "寻求盟友"
 kvn_looking_for_friends_desc: "鉴于我们国土面积狭小，我们的统治者明白需要强大的盟友和贸易伙伴。通过授予这些盟友在瓦尔纳等港口的贸易专营权，专制国将获得西方现代海军技术和金融信贷，并可能获得强大的海军保护以抵御敌人。这种联盟将把多布罗加变成一个国际化的贸易中心，丝绸之路的财富在此与北方的谷物和毛皮进行交换。"
 vid_the_western_connection: "西方纽带"
 vid_the_western_connection_desc: "维丁沙皇地处文化交汇之地，与天主教西方的关系比任何其他保加利亚统治者都更为密切，常与匈牙利和瓦拉几亚贵族联姻。这种外交灵活性使维丁得以维持独立，利用西方军事技术和宫廷传统来使自己与$BUL$的其他地区区分开来。作为东正教与天主教世界之间的桥梁，维丁成为了一个贸易和知识交流中心，充实了地方国库和军队。"
 bul_the_boyar_council: "波雅尔议会"
 bul_the_boyar_council_desc: "为了防止困扰14世纪的内乱，我们将演变为一种“协商式专制政体”，将最有权势的波雅尔纳入一个常设国务委员会。该机构将充当最高法院和军事规划委员会，确保土地贵族的利益与王权一致。这种政治稳定将使我们能够维持一支庞大的常备军，并避免那些在历史上使帝国容易受到邻国攻击的毁灭性内战。"
 bul_the_hesychast_state_philosophy: "静修派国家哲学"
 bul_the_hesychast_state_philosophy_desc: "格里高利·西奈特的灵修教诲已从隐士的斗室走入权力的殿堂。通过将静修主义——一种追求内心静谧与神圣之光的哲学——确立为事实上的国家思想，我们培养出一个虔诚而坚韧的民族。这种共同的精神认同成为抵御敌人思想渗透的强大屏障，使保加利亚臣民免受外来皈化或颠覆之害。"
 kvn_the_condotta_of_varna: "瓦尔纳佣兵团"
 kvn_the_condotta_of_varna_desc: "作为一个陆地人口相对较少的海洋国家，卡尔武纳通过与意大利海上强国建立正式的佣兵团契约，完善了“合同战争”的艺术。根据这一安排，我们为他们提供黑海的守备完善的仓库和海军基地，作为回报，意大利人为专制国的防御提供一支由重弩手和攻城工程师组成的职业军团。这种共生关系使卡尔武纳在陆地战役中能够发挥远超自身实力的作用，利用西方的战术创新和职业纪律来保卫其沿海地带，而本土保加利亚水手则主宰海浪，实际上是将陆地防御外包给了地中海最精锐的雇佣军。"
 vid_the_order_of_the_danubian_dragon: "多瑙河龙骑士团"
 vid_the_order_of_the_danubian_dragon_desc: "为了确保边境贵族的忠诚并建立职业军官团，维丁沙皇将效仿西欧的#italic 龙骑士团#!，建立一个本地骑士团。该骑士团成员会在蒂莫克河和多瑙河沿岸获得地产，作为回报，他们将保持永久战备状态，并为沙皇国的防御提供一支重骑兵核心。这一制度有望弥合旧保加利亚波雅尔传统与西方骑士标准之间的鸿沟，培养高度的军事纪律和对王室的个人忠诚，并防止内部分裂。"
 bul_the_silk_and_rose_guilds: "丝绸与玫瑰行会"
 bul_the_silk_and_rose_guilds_desc: "凭借肥沃的色雷斯平原与玫瑰谷独特的气候，我们建立了受国家保护的行会，专门生产名贵香油与丝绸。这些价值高、重量轻的货物最适合经由陆路出口至欧亚各国宫廷。这些行会所创造的财富使国家得以积累巨额黄金储备，令我们的经济成为整个地中海流域最稳健、最具信用的经济体之一。"
 bul_the_bulgarian_gunpowder_foundries: "保加利亚火药铸造厂"
 bul_the_bulgarian_gunpowder_foundries_desc: "依托巴尔干山脉的铁矿和撒克逊矿工的专业技术，我们将建立该地区首个大型本土火药工业。这些铸造厂将生产重型攻城炮和早期手持火枪，使保加利亚军队从纯粹的封建骑兵转向更现代化、以步兵为主的力量。通过控制硝石和铁的生产，我们将确保我们的城墙对任何潜在的巴尔干征服者来说都是最危险的障碍。"
 kvn_the_cosmopolitan_code_of_karvuna: "《卡尔武纳万民法典》"
 kvn_the_cosmopolitan_code_of_karvuna_desc: "为维持其作为黑海首要贸易枢纽的地位，我们将颁布一部革命性的法律体系——《卡尔武纳法典》，赋予获认可的商人民族治外法权与宗教自由。无论信仰或出身为何，凡在我方港口经营的商人，皆由其同业组成的商事法庭审理，而非受制于当地封建领主。这种法律的可预见性与宽容氛围，将吸引大量资本与人才涌入，使卡尔武纳成为一个巨大的枢纽，让丝绸与香料之路的财富被重新投入国家的道路、兵工厂与军队建设之中。"
 vid_the_mining_grants: "采矿特许权"
 vid_the_mining_grants_desc: "维丁需要将其影响力扩展到矿产资源丰富的蒂莫克河谷，向撒克逊人和拉古萨人颁发特许状，以开采银、铅和铜。这一工业基础将为沙皇国提供现代货币铸造和高质量火器生产所需的金属，使维丁成为一个自给自足的军事强国。这些矿山的财富也将使沙皇能够维持一支职业军队。"
 bul_the_grand_academy_of_the_yantra: "扬特拉河大学院"
 bul_the_grand_academy_of_the_yantra_desc: "通过建立一所现代国立大学，14世纪特尔诺沃文学学派的知识遗产将在17世纪得以复兴。这所机构专注于民法、工程学以及将西方科学著作翻译成保加利亚通俗语，培养出一批与巴黎或维也纳任何官僚一样能干的官员。这种精英的现代化将确保我们能够管理一个复杂、多民族的帝国，同时维持其保加利亚核心的文化纯洁性。"
 bul_the_standing_drilled_infantry: "常备正规步兵"
 bul_the_standing_drilled_infantry_desc: "我们摒弃了季节性征召，建立了第一批常设的“雄狮团”。这些步兵全年接受火器培训，遵循基于邻国成功模式但根据巴尔干地形改编的严格操练。这支职业步兵核心为我们提供了可靠的进攻性战争工具，其行军速度和射击能力均胜过我们邻国的传统军队。"
 kvn_the_black_sea_admiralty: "黑海海军部"
 kvn_the_black_sea_admiralty_desc: "卡尔武纳将建立一个常设的、由国家运营的海军部，负责监督现代深水战舰的建造和职业军官团的培训。我们将放弃小型桨帆船，开始建造能够将力量投射至爱琴海和亚速海区域的护卫舰和小型战列舰。这种海军现代化将确保我们保持主要海上参与者的地位，能够保卫我们的贸易利益不受敌人威胁。"
 vid_vidins_custom_houses: "维丁海关"
 vid_vidins_custom_houses_desc: "随着上多瑙河与黑海之间的贸易增长，维丁已成为下多瑙河最重要的海关之一，调控着欧洲奢侈品进入巴尔干地区的流动。通过实施精密的关税和仓库法体系，国家将能够充实国库，而不会给其农业人口带来沉重负担。这种以贸易为主的经济将使维丁能够实现基础设施现代化，修建连接多瑙河与巴尔干半岛腹地的公路和石桥。"
 bul_the_imperial_restoration_doctrine: "帝国复兴论"
 bul_the_imperial_restoration_doctrine_desc: "我们完全接受了作为巴尔干各民族天然领导者的角色，阐述了一项统一所有前保加利亚土地的正式纲领。这一命运由一支现代化、职业化的军队和一个精明的外交使团支撑，后者试图挑动列强相互争斗。对“大保加利亚”的信念成为国家的核心支柱，推动着旨在恢复西美昂大帝帝国的侵略扩张和文化同化政策。"
 bul_the_bulgarian_census_bureau: "保加利亚统计局"
 bul_the_bulgarian_census_bureau_desc: "知识就是力量。我们实施了十年一次的人口普查，记录帝国的每一个人、每一头牲畜和每一户炉灶。这些精确的数据使我们能够建立巴尔干地区最高效的税收和征兵体系。通过确切了解国家能提供什么，我们可以以高水平的后勤确定性来规划长期战役，确保我们的军队始终粮草充足，国库永不枯竭。"
 kvn_the_free_port_of_varna: "瓦尔纳自由港"
 kvn_the_free_port_of_varna_desc: "为巩固我们作为巴尔干地区首要商业中心的地位，我们将宣布瓦尔纳为自由港，对国际商人免除大部分传统关税，仅收取一笔固定的过境费。这项政策将吸引大批商人、银行家和保险业者聚居，使瓦尔纳成为“黑海的威尼斯”和保加利亚世界的金融之都。由此产生的财富将使我们得以维持一支职业化陆军和世界级海军，确保我们的沿海国家在群雄环伺的时代中，依然是一个富裕且独立的强权。"
 vid_the_codex_shishman: "《希什曼法典》"
 vid_the_codex_shishman_desc: "为完成从中世纪封建国家向现代化中央集权君主国的转型，沙皇国将颁布#italic 《希什曼法典》#!，这是全面的法律改革，旨在统一西巴尔干地区各异的地方习俗。该法典将建立一个独立于地方地主的专业司法机构，并统一维丁贸易网络中所使用的度量衡与货币。通过提供一个可预测且公平的法律环境，我们将确保一个忠诚的城市中产阶级的成长以及国家税收的稳定。这场行政现代化将使维丁成为东方“开明专制”的灯塔，在这里，法治如同巴巴维达堡垒的城墙一般坚不可摧。"
 #Croatian Shared
 croatian_the_glagolitic_lithurgy: "格拉哥里字母礼拜"
 croatian_the_glagolitic_lithurgy_desc: "我们的文化因格拉哥里字母礼拜仪式的独特特权而独树一帜，这使我们成为天主教世界中唯一以本土斯拉夫语咏唱弥撒的土地。这一传统在拉丁城邦与斯拉夫腹地之间架起桥梁，塑造出统一的文化认同。通过保存这一古老文字，我们的人民守护着一种独特的语言，巩固了自身的独特性，培养出抵御意大利与日耳曼文化圈同化的民族自豪感。"
 cro_influx_of_foreign_knowledge: "外国知识涌入"
 cro_influx_of_foreign_knowledge_desc: "沿海的城市已经成为文艺复兴的活跃中心，学者和艺术家在这里将来自意大利的古典影响与鲜明的斯拉夫特质融合在一起。这场思想运动催生了诸多伟大的思想家，他们为欧洲的科学、诗歌与哲学作出贡献，证明克罗地亚文化走在现代的前沿。富裕商人家族的资助让人们得以修建宏伟的教堂与宫殿，将我们的海岸变成高雅文化的灯塔，吸引着时代最顶尖的人才。"
 cro_trade_posts: "马鲁利奇史诗传统"
 cro_trade_posts_desc: "凭借“克罗地亚文学之父”马尔科·马鲁利奇的《#italic犹滴传#!》等著作，克罗地亚的文化灵魂攀上了文学的巅峰。马鲁利奇借用圣经寓言描绘我们当代的卫土之战，为这个民族提供了一份关于生存的高雅文化蓝图。这部文学作品在文艺复兴时代的都市人与边疆战士之间架起桥梁，使各阶层在共同的英雄使命下团结一致，确保克罗地亚语作为高雅艺术与神学论辩语言得以延续。"
 croatian_the_peasants_revolts: "农民起义"
 croatian_the_peasants_revolts_desc: "连绵战乱下封建义务的沉重负担，曾引发农民起义。农民起义反抗的并非我们，而是那些未能保护他们却苛征重税的“不义”贵族。尽管这些起义通常遭到残酷镇压，但它们留下了持久的社会意识遗产，并改变了阶级间的关系，迫使国家最终节制其赋税要求以维持内部稳定。"
 croatian_the_cravats: "克拉瓦特领巾"
 croatian_the_cravats_desc: "在这动荡的岁月里，世人注意到了克罗地亚军队中那支独具特色的精锐轻骑兵团。除却其传奇般的机动性与凶悍之名外，这些骑兵还带来了一项独特的服饰创新：一条系于颈间、用以固定衬衫领口并防止胸甲摩擦的实用布巾。这种 #italic 领巾 #! （其名得自法语对 #italic 克罗地亚人 #! 一词的讹读）迅速超越了战场，成为巴黎乃至整个欧洲时尚的巅峰之作。将一项粗犷的军事必需品转化为时髦装束的标志，我们的文化由此取得了一场虽不张扬却恒久不衰的胜利。这种服饰上的统领地位，确保了克罗地亚军官的形象兼具战术上的致命与无与伦比的豪迈风度。"
 croatian_the_illyrian_movement: "伊利里亚运动"
 croatian_the_illyrian_movement_desc: "在过去的几年里，我国见证了#italic 伊利里亚运动#!的爆发，这是一场旨在将所有克罗地亚人统一在同一旗帜下的文化与政治革命。该运动实际上旨在将我国各不相同的地区统一为一个紧密团结的政治与文化民族实体。通过规范语法和正字法，我们将把中世纪的民族转变为现代的国度，确保克罗地亚的名号、语言与国家地位永不再被遗忘或压制。"
 #Croatian Unique
 cro_maritime_connections: "契约协定"
 cro_maritime_connections_desc: "这一法律基石正式确立了克罗地亚十二贵族部落与匈牙利王权之间的联合。通过保留推选君主的权利，以及保留使用兹沃尼米尔王冠举行独立加冕仪式的惯例，我们确保克罗地亚在与其他国家联合时，仍是一个独立的政治实体。这一契约性质的主权，使其不会被完全并入外来行政体系，让我们的贵族能够依据自身古老的法律，管理内部司法与防务事务。"
 cro_the_bashka_tablet: "巴什卡石碑"
 cro_the_bashka_tablet_desc: "克罗地亚的文化灵魂深植于“兹沃尼米尔传统”之中，我们的历史被镌刻于石碑之上。我们借助史诗与历史编年史传颂历代独立君主的记忆，在每一位农民与贵族心中灌输“王权意识”。即使身处外邦君主治下，克罗地亚人仍视自己为一个古老而独立的民族之一员，这份自豪感令我们的文化历久弥新，抵御外来的侵蚀。"
 svn_the_marturina_tax_system: "貂皮税制"
 svn_the_marturina_tax_system_desc: "我们已将 #italic 马尔图里纳 #! （貂皮税，亦称 #italic 库诺维纳 #! ），这一古老而独特的斯拉沃尼亚贡赋体系为总督提供了一笔价值不菲且便于携带的财富储备。通过将这些毛皮的价值与皇家马克标准挂钩，我们为该地区创造了一种保值稳定的货币。这种财政上的可靠性使总督辖区得以维持一支常备卫队，并沿着脆弱的德拉瓦河渡口修筑大量木石河防工事，而无需以繁重的粮税压迫农民。"
 cro_legacy_of_the_trpimirovic: "特皮米罗维奇的遗产"
 cro_legacy_of_the_trpimirovic_desc: "我们回溯到本国诸王（如托米斯拉夫和兹沃尼米尔）的辉煌时代，以激发对独立命运和民族自豪感的认同。通过将我们的血统和制度追溯到这些主权统治者，我们提升了在欧洲各宫廷中的外交地位，并确立了我们对一顶比许多邻国历史更为悠久的王冠的权利。这份历史威望赢得了圣座的尊重，并作为一种强大的统一神话，将王国各不相同的地区凝聚在一个具有罗马-斯拉夫王室色彩的传奇旗帜下。"
 cro_the_banovac_silver_denar: "巴诺瓦茨银第纳尔"
 cro_the_banovac_silver_denar_desc: "我们确立了#italic 铸币权#!，建立了一家主权铸币厂来铸造巴诺瓦茨银第纳尔。通过维持比邻国货币更高的含银量，我们的硬币成为亚得里亚海北部和德拉瓦河流域的主要交易媒介。这种财政独立性使我们能够在不依赖外部补贴的情况下为行政管理提供资金，将我们的宫廷转变为吸引拉古萨和威尼斯资本涌入的区域金融中心。"
 svn_the_slavonian_sabor: "斯拉沃尼亚议会"
 svn_the_slavonian_sabor_desc: "我国人民在斯拉沃尼亚#italic 议会#!的监督下得到治理。这种立法独立性使得斯拉沃尼亚贵族能够处理河间平原的具体需求，例如排水工程和粮食市场监管。通过拥有一个专门的议会，总督辖区能够对区域危机做出迅速反应，并直接协商税收减免，确保斯拉沃尼亚的农业财富主要用于斯拉沃尼亚自身的防御与改善。"
 cro_antemurale_christianitatis: "基督教壁垒"
 cro_antemurale_christianitatis_desc: "我们的文化认同在“殉道者世纪”的烈火中锻造而成。我们接受了#italic 基督教世界之盾#!的角色，将我们的军事斗争转化为一项神圣的宗教使命。这种神话在民众中灌输了一种深厚而不可动摇的历史责任感，将保卫我们的国家视为保卫文明本身。这种“英雄精神”确保民族之火即使在最黑暗的时刻也依然燃烧。"
 cro_the_croatian_press: "克罗地亚印刷厂"
 cro_the_croatian_press_desc: "我们建立了斯拉夫世界最早也最富胆识的印刷厂之一。通过将我们技术的核心转移到“难以逾越”的科西尼山谷，我们确保了神圣的格拉哥里文本的生产能够免受困扰沿海地区的海上袭击和边境冲突的影响。这座印刷厂不仅是提升识字率的工具，更是一个文化存续的实验室，我们在此用本国语言铸造出第一批印刷的弥撒经书。通过现代印刷术规范我们古老的文字，我们为王国的每个教区提供了统一且不可篡改的法律与礼仪典籍。这确保了克罗地亚人的身份认同在智识上得到巩固，在精神上保持独立，因为典籍会传递到每一位牧羊人与贵族手中，将民族的灵魂锚定在一种不可动摇、土生土长的传统之上。"
 svn_the_alluvial_grant_lands: "冲积地授予制度"
 svn_the_alluvial_grant_lands_desc: "萨瓦河与德拉瓦河之间肥沃的淤泥是我们最宝贵的财富。通过授予免税地块以换取开垦厚重的河岸灌丛，我们正将这片泛滥平原转变为北方首要的粮仓。如此丰收足以供养一支庞大的常备军，使王国的守卫者即便在最严酷的冬季封锁中也能丰衣足食。"
 cro_reliance_on_adriatic: "乌斯科克人的教训"
 cro_reliance_on_adriatic_desc: "为对抗敌人的进犯，我们已将沿海要塞转变为乌斯科克人的庇护所，这些流亡战士发动着永不停息的战争。这些轻步兵利用小巧迅捷的船只，对敌方补给线发动闪电突袭，在崎岖的喀斯特地形中生存，而正规军队却无法追击。这一政策将我们的海岸变成敌人的致命“无人之地”，为我们提供了一支成本低廉却斗志昂扬的边境卫队，无需中央国库的支持，却能令敌人始终处于守势。"
 cro_the_jesuit_academy: "耶稣会学院"
 cro_the_jesuit_academy_desc: "这所学院由受邀而来的耶稣会创立，已从一所地方中学发展为我们民族的智识中心。通过建立亚里士多德哲学、数学与修辞学的严谨课程体系，该学院培养出一批本土的“开明克罗地亚人”精英，他们既能游刃于维也纳的沙龙，也能活跃于萨博尔议会之中。这项改革确保了我们的行政机构由能够驾驭本世纪复杂法律与科学变革的饱学之士领导。"
 svn_the_oak_staple_rights: "橡木囤积权"
 svn_the_oak_staple_rights_desc: "斯拉沃尼亚橡木因其如铁般抗水腐蚀的特性，现已成为地中海地区最受追捧的木材。通过对威尼斯船厂建立成熟橡木出口的皇家垄断权，我们掌握了一项针对这些海上共和国的战略性经济杠杆。这项贸易不仅充盈了我们的国库，更确保了威尼斯宫殿的地基和桨帆船的船体，其物理构成皆源自克罗地亚的土壤，赋予了我们对于“亚得里亚海女王”独特的外交影响力。"
 cro_baroque_pietas: "巴洛克虔诚"
 cro_baroque_pietas_desc: "我们的文化已融入一种充满戏剧性与强烈情感的巴洛克式天主教，表现为盛大的宗教巡行以及富丽堂皇教堂的兴建。这种“视觉虔诚”成为了强大的凝聚力量，通过共同的仪式与壮观场景，弥合了城市贵族与乡村农民之间的差距。这种强烈的宗教身份充当了文化屏障，抵御着新教和东方的影响，，从而确保克罗地亚的精神牢固锚定在天主教‑地中海世界，同时守卫着中欧平原。"
 cro_the_national_garrison_system: "国家守备系统"
 cro_the_national_garrison_system_desc: "为抵御敌舰队的突然两栖袭击或边境侵犯，我们将在韦莱比特山峰最高处建立一个利用烟雾和火焰信号的精密视觉系统。这套“山地瞭望网”将使我方要塞能在数分钟内跨越崎岖地形进行通讯，避开缓慢的山间小径。通过将这些信号与内陆驻军协调，我们能在任何行动发生前完成国家动员并加固城墙。这种高海拔监视将把难以逾越的山峰转变为一个中央指挥塔，确保任何企图靠近的敌人都逃不过我们的耳目。"
 svn_swamp_drainage_projects: "沼泽排水工程"
 svn_swamp_drainage_projects_desc: "通过投资大型水利工程以排干河流沿岸广袤的沼泽地，我们开辟出数以千计英亩的新沃土。这些开垦的土地将很快得到人口定居，从而充实该省的人口与税收，同时也消除了疾病的温床。这种地貌的改变不仅增强了我们的经济，也创造出更易通行、更易防守的地形，消除了曾阻碍我们内部交通的天然障碍。"
 cro_the_royal_council_of_croatia: "克罗地亚王室委员会"
 cro_the_royal_council_of_croatia_desc: "我们已在首都设立 #italic 皇家枢密院 #!，为克罗地亚民族建立了一个专门的行政政府。该机构将充当准部门，负责管理 #italic 三一王国 #! 的经济、教育与内部治安事务。这个"
 cro_uniting_the_coast_and_the_inner_lands: "连接海岸与内陆"
 cro_uniting_the_coast_and_the_inner_lands_desc: "为打破海岸的孤立状态，我们将监督大规模道路建设，将内陆与我们的港口连接起来。这条精心设计的大道将凿穿韦莱比特山脉的石灰岩心脏，采用先进的石桥和蛇形弯道以适应重型马车的通行。这条道路将把我们的沿海地区从一片荒芜的边陲转变为至关重要的经济动脉，使内陆的木材和粮食得以进入国际市场。通过从物理上将山区腹地与亚得里亚海连接在一起，我们将完成国家的领土整合，开启跨韦莱比特商业的新时代。"
 svn_the_slavonian_grenadier_regiments: "斯拉沃尼亚掷弹兵团"
 svn_the_slavonian_grenadier_regiments_desc: "我们的步兵部队被重组为精锐的掷弹兵团，以其高大健壮的体格、严格的纪律和在枪林弹雨中坚定不移的勇气而闻名欧洲大陆。这些精锐突击部队受训在枪林弹雨中带头冲锋，用手榴弹和刺刀击溃即使是最强大的对手的阵线。这些“斯拉沃尼亚巨人”在战场上的存在是一种强大的心理武器，既鼓舞了我方军队的士气，又给面对他们的敌人心中带来恐惧。"
 #Dalmatian Shared
 dalmatian_the_maritime_commune_spirit: "海洋公社精神"
 dalmatian_the_maritime_commune_spirit_desc: "我们的文化由公社精神所定义，每一位公民的荣誉都与他们城市的声望紧密相连。这种城市间的竞争精神驱使我们的人民建造比邻邦更美丽的大教堂和更快的船只，创造了一种极度崇尚地方自豪感和创新的文化。这种“城邦”心态确保了人民对地方治理和防御的高度投入，培养出异常坚韧和自立的人口，即便在中央王权遥远或衰微时，也能独立管理自身事务。"
 dalmatian_the_cult_of_the_local_patron_saint: "地方主保圣人敬礼"
 dalmatian_the_cult_of_the_local_patron_saint_desc: "每一座达尔马提亚城市都因对其独特守护圣徒的虔诚崇拜而凝聚：扎达尔的圣赫利索戈努斯、斯普利特的圣多姆尼乌斯、科托尔的圣特里芬。这些圣徒不仅仅是宗教人物，更是城市的“奠基君主”。他们的瞻礼日是一年中最重要的社会与政治盛事，令各阶层在共同的仪式中团结一心，强化城市的独立认同。这种强烈的地方主义，使达尔马提亚文化成为一幅由各自独立不屈的城市身份拼成的马赛克，令任何外来强权都无法一举在文化上统治整条海岸。"
 dalmatian_the_guild_of_the_stone_master: "石匠行会"
 dalmatian_the_guild_of_the_stone_master_desc: "海岸线上盛产的骨白色石灰岩，孕育出一群视喀斯特地貌为画布的石匠大师。我们的工匠发展出一种以结构创新与精细雕刻闻名于世的“哥特-文艺复兴”风格。这绝非单纯的艺术，而是我们恒久长存的实体宣言。通过以本地石材建造每一座教堂、宫殿与城墙，我们的人民创造出一片既美丽又坚不可摧的景观，培养出一种民族自豪感，将达尔马提亚城镇视为彰显我们技艺的神圣永恒丰碑，任何海上帝国都无法真正将其抹去。"
 dalmatian_the_high_chancery_style: "官署雅文"
 dalmatian_the_high_chancery_style_desc: "达尔马提亚贵族阶层已在其私人信函与外交档案中采纳了「高地达尔马提亚」文学标准，效仿意大利半岛同侪的做法。摒弃中世纪拉丁文、转向精炼的本地白话，使沿海诸城与意大利文艺复兴的核心紧密相连。共通的品味在我们与威尼斯的 #italic 学院 #! 之间架起了一座无缝的知识桥梁，令我们的诗人与法学家得以跻身意大利最顶尖的人文主义圈子。这种「语言的精雅」确保我们的外交官在任何西方宫廷中都被视为文化上的同侪，为我们提供了一道建立在共同文明而非单纯军事实力之上的外交屏障。"
 dalmatian_the_accademia_degli_oziosi: "闲适学会"
 dalmatian_the_accademia_degli_oziosi_desc: "效仿意大利的文学院，我们城市的知识分子已创立如#italic闲人学院#!之类的团体，探讨物理学、天文学与古典诗歌。这些自称「闲散」的学者其实丝毫不闲：他们担任海军部的科学顾问，将新兴的巴洛克理性主义应用于制图与弹道学。这种被悉心培育的求知精神，确保达尔马提亚的城市中心始终是亚得里亚海的「科学瞭望塔」，让沿海地区始终是欧洲启蒙运动的枢纽，而巴尔干内陆依旧困于传统的循环之中。"
 dalmatian_mediterranean_cosmopolitanism: "地中海世界主义"
 dalmatian_mediterranean_cosmopolitanism_desc: "数百年的海上贸易与双语传统孕育出一种世界主义文化，使我们的人民在从威尼斯到黎凡特的任何港口都能宾至如归。这种文化上的开放性，使我们能够吸收并改造来自全球各地的最佳理念，造就一个格外灵活且富有韧性的社会。我们的人民是「海洋的子民」，拥有远比内陆封闭之地更为广阔的世界观。这种世界主义精神确保达尔马提亚文化始终充满活力并在商业上取得成功，成为整个巴尔干半岛通向世界的「窗口」。"
 #Dalmatian Unique
 dal_comune_privileges: "城市公社特权"
 dal_comune_privileges_desc: "为确保沿海城市在威尼斯扩张的威胁下对我们保持忠诚，我们将颁发特权，保障这些城市公社（一种政府单位）的内部自治权及其遵循的拉丁法系。通过允许这些城市自行选举执政官并管理本地税收，我们将塑造一个忠诚的市民阶层，他们将视我们为保护者，而非压迫者。这种分散化的城防守卫体系，确保了海岸沿线成为一片由忠诚且设防坚固的自治城市所组成的网络，足以抵御海上侵袭，并将沿海与内陆紧密联结。"
 rag_the_statute_of_1272: "《1272年法典》"
 rag_the_statute_of_1272_desc: "为安抚那些在我们港口冒险押上身家财富的商人，拉古萨已将其法律编纂为一套完整的法律体系，明确界定产权与海事法规。通过限制任何单一贵族的权力，并设立 #italic Consilium Rogatorum #!，我们营造出一个有序的市场，吸引着地中海最富有的商人前来。这种法律的清晰明确，使这个蕞尔小邦得以发挥远超其体量的影响力，将一处岩石海角变成了一座任何封建领主都难以轻易颠覆或无视的 #italic Libertas #! 圣地。"
 dal_the_union_of_the_two_souls: "双魂交融"
 dal_the_union_of_the_two_souls_desc: "达尔马提亚文化已演进为一个真正双语并行的社会，拉丁语是法律的语言，斯拉夫语则是心灵的语言。这种语言上的灵活性使我们的人民能够游刃有余地穿梭于文艺复兴时期亚得里亚海错综复杂的社会阶层之间。通过精通这两种语言，我们的商人和水手成为了意大利各城邦与斯拉夫内陆地区之间所有贸易往来不可或缺的桥梁。这种双语传统孕育出一种独特的“达尔马提亚桥梁”文化，极其适应国际贸易与外交的需求，确保我们的人民始终处于地中海商业活动的中心。"
 rag_the_lazzaretto_system: "拉扎雷托隔离制度"
 rag_the_lazzaretto_system_desc: "面对黑死病的反复肆虐，拉古萨率先在姆尔坎岛和博巴拉岛创立了世界上首个强制性海事隔离制度。通过对进港船员与货物进行为期四十天的隔离，我们既保护了城市人口，又能在其他地中海枢纽因瘟疫而瘫痪时维持港口运作。这种科学的公共卫生方针，确保了共和国始终是一个可靠、清洁的停靠港，即便在欧洲历史上最致命的时期，也能保全我们的人力与商业网络。"
 dal_the_soldato_dalmantine: "达尔马提亚战士"
 dal_the_soldato_dalmantine_desc: "随着我们巩固统治，我们已将人民锻造成“国家之剑”。我们的男子被招募进精锐的#italic 斯拉夫#!军团，充当战争中的前线重步兵。这种兵役制度为人民提供了专业的军事训练，并使其接触到欧洲最新的战争技术，从而培育出一种职业军人的文化。纵然我们的城市可能因此逐渐失去其商业优势，我们的人民却成为了地中海最受尊敬的战士，确保了我们的军事传统即便在外国统治下也永不中断。"
 rag_the_arsenal_expansion: "兵工厂扩建"
 rag_the_arsenal_expansion_desc: "我们的船厂因建造 #italic 阿尔戈西大帆船 #! 而闻名遐迩，这种巨型克拉克帆船足以在大西洋与印度洋的惊涛骇浪中安然无恙。通过统一造船工艺，并从波斯尼亚森林获取优质橡木，我们确保拉古萨商船队始终是亚得里亚海技术最为先进的船队。这些船只载货量巨大，火炮林立，使我们的商人得以主宰香料与丝绸航路，令圣布莱斯之旗从伦敦到果阿的每一个主要港口都迎风飘扬。"
 dal_adriatic_oak_galleys: "亚得里亚海橡木桨帆船"
 dal_adriatic_oak_galleys_desc: "认识到地中海正逐渐成为一片战火纷飞的海域，我们已委托在最好的船坞中建造一型新型重装桨帆船，采用橡木加固。这些船只利用沿海山脉中铁一般坚硬的木材建造，能够承受更猛烈的舷侧炮火，并且专为在威尼斯大型桨帆船无法航行的、遍布熔岩的浅水湾内航行而设计。这种优势使我们能够巡逻自己的海域，并保卫海岸免遭任何敌人的侵袭。"
 rag_the_collegium_ragusinum: "拉古萨学院"
 rag_the_collegium_ragusinum_desc: "为维持我们作为高雅文化中心的地位，我们建立了由耶稣会主导的高等学府#italic 拉古萨学院#!，吸引了巴尔干与意大利贵族的子弟前来求学。通过培养一批受过高等教育的外交官、科学家和诗人，我们确保了拉古萨的领导层在欧洲的宫廷中永远不会处于下风。这种对智识的投资，将我们这座小城转变为文化中心，在这里，拉丁的逻辑与斯拉夫的精神相互融合，孕育出的学者们将定义整个亚得里亚海沿岸地区的文化觉醒。"
 dal_morlach_frontier_levies: "莫尔拉赫边疆征召兵"
 dal_morlach_frontier_levies_desc: "我们已将摩尔拉赫人——那些内陆骁勇的弗拉赫与斯拉夫牧民——纳入了常设军事预备队。这些非正规军获得土地权利，以换取他们时刻保持的战备状态，充当着国家的耳目。他们对喀斯特地形的熟稔，使我们得以发动深入敌后的突袭与夜袭，瘫痪敌军的补给线。这在达尔马提亚腹地造就了一种「全民皆兵」的文化，为了捍卫我们的家园，平民与士兵之间的界限已被彻底抹去。"
 rag_the_ragusan_porto_franco: "拉古萨自由港"
 rag_the_ragusan_porto_franco_desc: "随着邻国间的战争愈演愈烈，我们宣布我们的城市成为一个严格中立的#italic 自由港#!。通过拒绝外国军舰入港，同时为所有商船提供高质量的维修和仓储服务，我们确保了冲突只会为我们带来更多利润。这种“经济不结盟”政策使拉古萨成为燃烧之海中唯一安全的港湾，让我们能够夺取那些被竞争对手因追求军事荣耀而抛弃的贸易路线。"
 dal_dalmatian_olive_pacts: "达尔马提亚橄榄公约"
 dal_dalmatian_olive_pacts_desc: "我们将经济重心转向集约型农业，充分利用达尔马提亚海岸的气候优势。通过建立由国家监管的“农业公约”，我们开垦了沿海的山丘以进行大规模生产，将崎岖的土地转变为一片绿色的出口花园。这种经济多元化降低了我们对海上贸易的依赖，为沿海贵族提供了新的财富来源，并资助建造了可与意大利本土相媲美的宏伟夏日别墅与城市剧院。"
 rag_the_ragusan_maritime_insurance_code: "《拉古萨海事保险法典》"
 rag_the_ragusan_maritime_insurance_code_desc: "我们已超越单纯的航运业，涉足高端金融领域，正式创立了最早一批成熟的海事保险体系之一。通过#italic 虔诚山#!机制，我们的商人世家得以共同分担风险，使得我们的船长们能够以最小的个人风险，大胆开辟通往美洲和远东的新航线。这种金融创新确保了拉古萨的资本始终在流动，创造了一个自给自足的财富循环，即使在地中海传统贸易路线重要性开始衰退之际，依然能让我们的城市保持富足与举足轻重的地位。"
 #Frankokratia Shared
 frankokratia_frankokratia_advance: "法兰克人的统治"
 frankokratia_frankokratia_advance_desc: "1204年拜占庭帝国的初始分封，至今仍是我们法理体系的基石。它赋予我们对希腊世界残余领土永续且神圣不可侵犯的宗主权。我们并非以征服者自居，而是作为拉丁皇帝与威尼斯总督授予我们先祖封地的合法继承者。这一不容置疑的法理依据，使我们有充分权利对拒不承认我们封建宗主权的当地领主，实施坚定不移的扩张与领土收复政策。"
 frankokratia_synthesized_levies_advance: "混编征召"
 frankokratia_synthesized_levies_advance_desc: "为了在悬殊的劣势中维系权力，我们已将当地的普罗尼亚制度（以土地换取兵役）与西方骑士领地传统相结合。这造就了一个混合型的尚武阶层——#italic 拉丁尼孔 #!，他们效忠于拉丁王冠，却又对崎岖的希腊地形与东方战术了如指掌。这些士兵将法兰克式冲锋的沉重冲击力，与坚守巴尔干边疆所必需的耐力和游击作战能力融为一体。"
 frankokratia_union_of_the_soul_advance: "精神联合"
 frankokratia_union_of_the_soul_advance_desc: "通过任命一位尊重古希腊礼拜仪式与儒略历、同时承认教宗至上地位的拉丁宗主教，我们在境内弥合了大分裂。这一#italic 东仪天主教#!式的妥协方案稳定了王国，允许希腊农民保持其祖先的仪式，又确保城市精英与罗马保持联系。此举有效消除了宗教叛乱的威胁，也为我们继续统治东正教核心地区提供了神学依据。"
 frankokratia_levantine_trades_advance: "黎凡特贸易"
 frankokratia_levantine_trades_advance_desc: "数个世纪生活在东西方十字路口的经历，教会了我们的商人阶层如何驾驭最复杂的贸易网络，从丝绸之路到黎凡特的香料市场。我们是资源丰富的黑海与西欧制造业中心之间不可或缺的中间人，从每一个经我们港口进行的交易中获利。我们的商人既善于与埃及人谈判，也精于同佛兰德的织工打交道，确保我们的港口永远繁荣。"
 frankokratia_the_frankish_greek_symbiosis_advance: "法兰克-希腊共生"
 frankokratia_the_frankish_greek_symbiosis_advance_desc: "我们国家演变的最终阶段，造就了一个在骑士精神与信仰上文化属性为 #italic Latin #! 、却在语言与社会层面与希腊民众深度融合的统治阶层。通过鼓励通婚，并促使下层贵族采纳本地习俗，我们终结了异族统治的时代，塑造出一种统一的民族认同。这种 #italic Greco-Latin #! 文化对自己的故土怀有炽烈的忠诚，将西方封建制度的精华与希腊精神的坚韧融为一体。"
 frankokratia_the_latin_enlightenment_advance: "拉丁启蒙"
 frankokratia_the_latin_enlightenment_advance_desc: "数个世纪的斗争最终催生了一场独特的东欧启蒙运动，其中十字军精神已被一种理性主义的、帝国主义的秩序追求所取代。法兰克民族的各个邦国不再是“十字军前哨”，而是一个成熟的、统一的强权集团，融合了西方的技术与东方的战略纵深。我们已成为文明之间决定性的桥梁，一条既非纯粹西方、亦非纯粹拜占庭的&quot;第三条道路&quot;，一种全新的存在。"
 #Frankokratia Unique
 ach_assizes_of_romania_advance: "罗马尼亚法令"
 ach_assizes_of_romania_advance_desc: "法兰克东方的封建法律是天主教世界中最精密的，它们是为管理复杂的希腊农奴和法国领主关系网而编纂的。这些#italic 法令#!为土地争端、继承和军事义务提供了清晰的法律框架，确保即使在战时，社会秩序也坚不可摧。严格遵守这些法律，防止了曾摧毁首批十字军国家的内部分裂，为国家行政奠定了磐石般的基础。"
 arg_the_peloponnesian_diplomatic_hub_advance: "伯罗奔尼撒外交中心"
 arg_the_peloponnesian_diplomatic_hub_advance_desc: "由于阿尔戈斯是伯罗奔尼撒半岛最为中立、最为安全的港口，它已成为拉丁诸国使节们首选的会晤之地。我们已设立一个常设的「外交区」，法兰克领主与列强在此谈判条约、缔结同盟。作为列强之间的调停者，我们的用处太大，不至于被邻近的强邻所吞并。"
 ath_the_catalan_company_advance: "加泰罗尼亚雇佣军"
 ath_the_catalan_company_advance_desc: "在被拜占庭皇帝雇佣并背叛后，凶猛的加泰罗尼亚大军团转而对抗他们先前的雇主，于1311年在基菲索斯河战役中全歼法兰克公爵布列讷的沃尔特五世，夺取了雅典公国的控制权，开启了加泰罗尼亚人统治的时期。这些身经百战的阿尔莫加瓦尔步兵将一种更为无情的雇佣军作风引入希腊事务，他们加固关键据点，向乡村强征贡赋，并通过恐怖手段和严整的步兵战术维持统治，直到内讧和阿拉贡的干预最终将权力拉回到更常规的封建体制。"
 bod_guardians_of_thermopylae_advance: "温泉关守卫者"
 bod_guardians_of_thermopylae_advance_desc: "我们的领地坐落于历史上最著名的关隘上，我们汲取了列奥尼达的教训，用法兰克的石材加固了山间小径。每一条狭窄的路对入侵者来说都是致命陷阱，每一处悬崖都是我们弓箭手与侦察兵的制高点。穿越博多尼察犹如穿越钢铁构筑的鞭刑巷，确保了希腊的心脏地带始终免受来自北方的威胁。"
 cep_cephalonian_raids_advance: "凯法洛尼亚的掠夺"
 cep_cephalonian_raids_advance_desc: "凯法洛尼亚与扎金索斯的统治者们，长期沿袭着一种传统：袭击任何胆敢在没有充分护卫的情况下，航行通过伊奥尼亚海域的敌方船只。这些来自岛屿的袭击以掠夺和勒索赎金积累了大量财富，同时削弱了敌人在西爱琴海的海军后勤力量，从而使这个小小的伯国得以发挥出远超其体量的影响力，保持住自身的独立。"
 crt_the_trapete_of_messara_advance: "梅萨拉的榨糖机"
 crt_the_trapete_of_messara_advance_desc: "我们已在肥沃的梅萨拉平原扩大甘蔗种植，并建造了先进的水力榨糖磨坊（特拉佩特）用于精炼。克里特蔗糖如今已成为欧洲各国宫廷竞相追求的奢侈品，直接与黎凡特的产品一较高下。这些磨坊带来的黄金，正支撑着王室的海上霸权。"
 lat_emperor_latins_advance: "拉丁人的皇帝"
 lat_emperor_latins_advance_desc: "随着#italic 法兰克人统治区#!在我们的治下统一，我们的宫廷如今精心融合了法兰西与奥克传统中严谨、尚武的封建等级制度，以及希腊人古老而繁复的礼仪。我们身着东方风格的威仪紫色长袍，赢得了希腊臣民精神上的尊敬，同时维系着西方骑士的忠勇。这种融合使皇帝不再仅仅是异族征服者，而是成为君士坦丁的合法继承者，既获教宗认可，又令敌人畏惧。"
 nax_sanudos_isles_advance: "萨努多的群岛"
 nax_sanudos_isles_advance_desc: "马可一世·萨努多，一位参与第四次十字军东征的威尼斯贵族，于1207年夺取基克拉泽斯群岛，建立了纳克索斯公国，创立了一个海上封建国家：诸领主自岛上坚固的城堡统治，收入来源包括贸易、镇压海盗以及纳克索斯、帕罗斯与圣托里尼的肥沃谷地。萨努多王朝将意大利的商业本能与法兰克封建组织相融合，维系着一个半独立的公国，成为拉丁贸易网络中至关重要的一环，既保护航运线路、征收通行税，又为十字军、热那亚与威尼斯船只提供安全的避风港。"
 neg_negropontine_navarchy_advance: "内格罗蓬特的海军统帅权"
 neg_negropontine_navarchy_advance_desc: "内格罗蓬特的三位领主将这个长岛划分为三个管区，由三个家族统治，但仍维持着统一的海上政策，控制着狭窄的尤里普斯海峡，并向每一艘往返于爱琴海和北方港口之间的船只征收通行费。他们的战舰由法兰克骑士、希腊水手和意大利雇佣兵混合编组，以冷酷的效率在海峡巡逻，确保内格罗蓬特成为法兰克统治下最富有、战略意义最重要的前哨之一。"
 neo_neopatras_fortresses_advance: "新帕特雷要塞"
 neo_neopatras_fortresses_advance_desc: "在色萨利南部多山的边疆地带，新帕特拉斯的领主们——先是布列讷家族，后是阿拉贡家族——建造并屡次加固了法兰克希腊境内最为坚固的城堡群之一，将这座古城变成了一座几乎坚不可摧的堡垒，屡次击退敌人的围攻。这些高耸的城墙、深邃的壕沟和布局精巧的外围工事，成为拉丁人顽强不屈的象征，使一支虽小却意志坚定的守军，能将影响力投射至希腊中部腹地，令敌对势力北进的步伐延误了数代人之久。"
 pat_the_church_state_of_saint_andrew_advance: "圣安德肋教会国"
 pat_the_church_state_of_saint_andrew_advance_desc: "作为法兰克人统治下的精神中心，帕特雷已演变为一个独立的教会公国，类似神圣罗马帝国的采邑主教制。大主教同时执掌权杖与利剑，通过#italic 防卫宗教会议#!来统治领地，该会议将宗教律法与封建军事义务合而为一。这种独特的地位使我们能够通过宗教热忱动员农民，将每一次边境冲突都视为一场局部性的圣战。"
 sao_salonas_stance_advance: "萨洛纳的立场"
 sao_salonas_stance_advance_desc: "萨洛纳山地领主们坐拥着德尔斐古址，控制着进入希腊中部的战略隘口。他们凭借崎岖的地形、坚固的防御工事，以及从整个法兰克人统治区招募战士的军事传统，始终保持着桀骜的独立。即便周边大国纷纷崩溃，萨洛纳的领主们也一再击退敌人，将他们的山地领地打造成希腊境内拉丁骑士的避风港，成为了每一个试图统治科林斯湾与斯佩尔基奥斯河谷之间地区势力的眼中钉。"
 the_the_thessalonican_crown_advance: "帖撒罗尼迦的王冠"
 the_the_thessalonican_crown_advance_desc: "蒙费拉托的博尼法斯于1204年加冕为帖撒罗尼迦国王，建立了一个北方的拉丁王国，控制着至关重要的埃格纳蒂亚大道与马其顿大部分地区，缔造了一个富庶且具有重要战略意义的国家。其首都成为法兰克宫廷生活、意大利商业活动以及拉丁统治下东正教与天主教共存的璀璨中心。尽管屡遭周边敌人的威胁，王国的男爵们仍保持着骄傲的尚武传统，以及基于谷物、葡萄酒和过境贸易的繁荣经济，确保帖撒罗尼迦始终是法兰克人统治区最耀眼的明珠之一。"
 ach_morean_silk_advance: "摩里亚丝绸"
 ach_morean_silk_advance_desc: "伯罗奔尼撒仍是欧洲丝绸生产的心脏，这是拜占庭时代的遗产，法兰克诸侯们通过国家扶持的桑树林加以扩展。通过控制战略港口，我们得以压低波斯和中国进口丝绸的高价，使亚该亚成为佛罗伦萨和里昂服装制造商的主要供应商。这种垄断提供了源源不断的#italic 软黄金#!，用于资助我们的雇佣军和加固我们的山隘。"
 arg_the_heraldry_of_the_brienne_advance: "布列讷的纹章学"
 arg_the_heraldry_of_the_brienne_advance_desc: "由于布列讷家族始终对耶路撒冷与塞浦路斯拥有继承权主张，阿尔戈斯已成为「骑士谱系学」的中心。来自整个西方的骑士纷纷前来此地，证明自己的血统，或在这片「十字军边地」寻求封号。源源不断的显贵冒险者，为我们的地方征召部队提供了层出不穷的杰出军官。"
 ath_thebes_textiles_advance: "底比斯的纺织品"
 ath_thebes_textiles_advance_desc: "底比斯的作坊早在拜占庭时代便以丝织闻名，如今在法兰克统治下再度繁荣：雅典公爵鼓励意大利商人投资织机、染坊与出口网络，将底比斯锦缎与天鹅绒远销布鲁日乃至亚历山大港的市场。这种奢华纺织业的复兴，加之维奥蒂亚肥沃平原所提供的原料，创造出可观的财富，为城堡修建、骑士扈从以及雅典宫廷奢华的生活方式提供了资金，确保这个公国始终是整个法兰克统治区域中最富庶、经济最为发达的领地之一。"
 bod_the_curia_of_the_three_keys_advance: "三钥匙制度"
 bod_the_curia_of_the_three_keys_advance_desc: "为管理北方商路复兴带来的财富，侯爵设立了#italic 三钥匙制度#!。国库与法律档案被存放在波多尼察城堡中，需由侯爵、拉丁主教及当地希腊市民代表分别持有的三把钥匙才能开启。这种原始却有效的“制衡”防止了小型封建国家常见的贪污问题，确保在温泉关征收的重税最终切实用于堡垒城墙的建设。"
 cep_ionian_sea_wall_advance: "伊奥尼亚海墙"
 cep_ionian_sea_wall_advance_desc: "作为凯法洛尼亚岛、赞特岛与伊萨卡岛的领主，我们坐镇亚得里亚海与地中海的交汇处，是意大利的第一道防线。我们的海军战略专注于“反介入”作战，通过重型防御工事与快速侦察船只，阻止敌人在伊奥尼亚群岛停泊。我们是西方的守门人，没有我们的默许，任何舰队都无法进入亚得里亚海。"
 crt_the_galley_assembly_line_of_suda_advance: "苏达桨帆船装配线"
 crt_the_galley_assembly_line_of_suda_advance_desc: "通过将苏达湾轻型桨帆船建造所用的零件标准化，我们开创了一种以可互换零件造船的早期形式。这使我们能够以其他地中海列强极小的一部分时间与成本，补充损失的船只。坎迪亚建造的船只，皆以其速度和在克里特海险恶洋流中航行的能力而闻名。"
 lat_hegemony_over_the_bosphorus_advance: "博斯普鲁斯霸权"
 lat_hegemony_over_the_bosphorus_advance_desc: "掌控黑海的狭窄门户，使我们得以向意大利商业共和国征收重税，而这些共和国曾一度凭借债务与海上封锁来左右我们的命运。本都地区的粮食贸易以及丝绸之路北方终点的财富，如今直接流入帝国的国库，而非威尼斯或热那亚，为我们的复兴提供资金。我们已将金角湾从外国商人盘踞的巢穴，转变为一个中央集权、主权独立、富甲一方的帝国跳动的心脏。"
 nax_archipelagic_vigil_advance: "群岛警戒"
 nax_archipelagic_vigil_advance_desc: "爱琴海星罗棋布的岛屿要求它的拉丁统治者时刻保持警惕。他们维持着轻型桨帆船舰队，以巡逻防范海盗、劫掠者及敌对的意大利海上势力。纳克索斯的公爵及封臣们发展出了一套复杂的系统，包括岛屿驻军、烽火信号和快速的传讯船只，使他们能够对群岛各处出现的威胁迅速做出反应。同时，从贸易保护和港口税中获取的财富，则用于建造坚固的沿海堡垒，使基克拉泽斯群岛成为法兰克人统治区最安全的地区之一，一座海上要塞。"
 neg_the_three_fold_defense_advance: "三重防御"
 neg_the_three_fold_defense_advance_desc: "优卑亚岛由三位 #italic 特尔齐耶里 #! ，即三头领主共同治理，形成了一种既相互竞争又彼此统一的防御体系，使任何一位领主都难以独大。这种三头制确保了一旦某座要塞陷落，另外两位便会即刻动员驰援，造就了一套难以被轻易瓦解的军事体制。这种内部的较量也让我们的驻军始终保持最高的战备状态，因为没有哪位三头领主愿意被同僚比下去。"
 neo_the_consulate_of_the_sea_advance: "海洋领事馆"
 neo_the_consulate_of_the_sea_advance_desc: "借助与阿拉贡王冠及巴塞罗那商人的联系，新帕特雷成为伊比利亚商品进入黎凡特的主要门户。我们设立了#italic 海洋领事馆#!，为所有加泰罗尼亚与西班牙商人提供法律保护与统一度量衡。这一特殊关系使新帕特雷成为希腊腹地中西地中海最富裕的前哨。"
 pat_the_pilgrimage_tolls_advance: "朝圣通行税"
 pat_the_pilgrimage_tolls_advance_desc: "据称属于圣安德肋的圣物吸引了数以千计寻求东方庇护的天主教朝圣者，我们建立了设防的“招待所”网络加以保护。通过收取适度的“保护费”以提供通行与住宿，大主教区得以维持一支十字军修士常备军。这些资金也被用于美化城市，使帕特雷成为“东方的罗马”，拉丁建筑的灯塔。"
 sao_the_parnassus_mines_advance: "帕那索斯矿脉"
 sao_the_parnassus_mines_advance_desc: "在我们领地崎岖山脉深处，蕴藏着自德尔斐神谕时代以来被遗忘的金属矿脉。通过引入萨克森采矿专家并采用西方冶炼技术，我们将#italic 缪斯山#!打造为重工业中心。从这些矿山开采的财富，使萨洛纳领主得以维持一座在优雅与权势上不逊于雅典公爵的宫廷。"
 the_the_fair_of_saint_demetrios: "圣迪弥特里集市"
 the_the_fair_of_saint_demetrios_desc: "我们将古老的宗教集市扩展为大型国际贸易博览会，将巴尔干内陆与地中海海上航线连接起来。通过为商人提供安全通行，帖撒罗尼迦成为毛皮、谷物与西方纺织品的首要市场。这样的经济活力使国王能够绕过地方贵族，通过销售税与关税为其行政体系提供资金。"
 ach_knights_of_the_peloponnese_advance: "伯罗奔尼撒骑士"
 ach_knights_of_the_peloponnese_advance_desc: "我们的贵族在与敌人的边境冲突中度过数百年，形成了独特的高机动骑兵传统。这些骑士摒弃其法国祖先沉重的马铠，改用更轻便的装备与适应希腊险峻山地的战术。这使我军的机动性胜过传统重骑兵，能以惊人的速度与精准打击敌军侧翼。"
 arg_the_gibraltar_of_the_levant_advance: "黎凡特的直布罗陀"
 arg_the_gibraltar_of_the_levant_advance_desc: "高踞于阿尔戈斯湾之上的帕拉米迪要塞，已被扩建为由七座互为犄角的堡垒构成的复杂防御体系，掌控整个阿尔戈利斯。通过控制这处“直布罗陀”，我们能够左右任何试图为摩里亚境内军队补给的舰队行动，使这片领地在陆海两途皆坚不可摧。这种战略优势使我们得以在邻国之间扮演决定王位归属的关键角色。"
 ath_the_parthenon_dukes_advance: "帕特农公爵"
 ath_the_parthenon_dukes_advance_desc: "雅典首任公爵奥托·德·拉·罗什在卫城遗址间建立宫廷，将古老的帕特农神庙改建为奉献于圣母的天主教主教座堂，并统治着自阿提卡延伸至维奥蒂亚的公国。在其继任者治下，公国出人意料地成为文化交流中心：法兰克骑士资助希腊抄写员，意大利商人在比雷埃夫斯贸易，学者们在大理石神庙的注视下辩论哲学。这一切塑造出独特的贵族社会，既珍视骑士精神的尚武美德，也欣赏长期被西方征服者忽视的希腊传统。我们必须让这座宫廷重现往昔荣光。"
 bod_the_alpine_skirmishers_advance: "山地散兵"
 bod_the_alpine_skirmishers_advance_desc: "我们那些生活在卡利兹罗莫山峭壁之间的人民，发展出一种强调垂直机动与弩箭运用的轻步兵战法。这些“山口山民”在齐射之后便能隐没于岩石之间，使传统重步兵无从接战。他们是南方诸邦的耳目，为任何来自北方的动向提供预警。"
 cep_the_currant_trade_advance: "葡萄干贸易"
 cep_the_currant_trade_advance_desc: "伊奥尼亚群岛独特的气候使#italic 桑特岛葡萄干#!得以大规模种植，这种奢华的干果已成为欧洲饮食的常见食材。通过垄断这种特色作物的生产与出口，我们为这片相对狭小的领地打造出专门化的经济引擎，创造出了巨额财富。凯法洛尼亚的“葡萄干领主”乃拉丁东方最富有的贵族之一。"
 crt_the_malvasia_wine_export_advance: "马尔瓦西亚葡萄酒出口"
 crt_the_malvasia_wine_export_advance_desc: "伊达山沐浴阳光的山坡孕育出著名的马尔瓦西亚葡萄，这种葡萄酿造出的甜酒已成为北欧宫廷中最受追捧的餐后佳酿。通过严格监管品质，并在每一桶出口酒品上加盖#italic 圣马尔谷印章#!，我们建立起高价值的贸易垄断，为海军防御提供资金支持。这种“液体黄金”确保即便作为殖民地，干地亚仍是威尼斯海上帝国最具盈利性的明珠。"
 lat_the_new_praetorian_guard_advance: "新禁卫军"
 lat_the_new_praetorian_guard_advance_desc: "我们源于古老瓦兰吉传统的现代卫队，由来自欧洲各地的职业天主教雇佣兵组成，主要为法兰西老兵与瑞士长枪兵。这些人效忠皇帝并非基于土地或头衔，而是基于黄金与共同的十字军身份，成为对抗不忠诚的封建领主的铁拳。这支常备军确保皇权至高无上，为军队提供稳定核心，不受上层贵族反复无常的影响。"
 nax_the_marble_trade_of_paros_advance: "帕罗斯的大理石贸易"
 nax_the_marble_trade_of_paros_advance_desc: "随着对精美艺术品的需求上升，帕罗斯大理石的需求已恢复至自奥古斯都时代以来未见的水平。通过重开古老采石场并采用现代工程技术，我们将一项地质奇观转化为财富之源，为我们在爱琴海的霸权提供资金。罗马与巴黎的宫殿越来越多地使用采自我们的主权岛屿的石材建造。"
 neg_bridgehead_of_the_euripus_advance: "埃夫里普海峡桥头堡"
 neg_bridgehead_of_the_euripus_advance_desc: "将我们的岛屿与大陆分隔的狭窄海峡，是中希腊最具战略意义的咽喉要道，由我们宏伟的旋转桥与坚固塔楼牢牢掌控。通过对往来于波奥提亚与爱琴海之间的货物课以重税，我们已将这一地理奇观变成了源源不断的过境税收。我们掌握着巴尔干各路军队调动的关键，使用此道，必付重金。"
 neo_the_great_companys_code_advance: "伟大兵团法典"
 neo_the_great_companys_code_advance_desc: "这个国家依旧遵循加泰罗尼亚公司的民主与军事传统，官职由选举产生，战利品则由众人共享。这种平等的体制造就了一支士气高昂的军队，因为每一名士兵都深知自己与国家的存亡息息相关。当欧洲其他地方纷纷走向专制集权之时，我们这个“士兵共和国”依旧是一支忠诚无比、团结一心的战斗力量。"
 pat_uniate_liturgical_printing_advance: "东仪天主教礼仪印刷"
 pat_uniate_liturgical_printing_advance_desc: "为对抗东正教世界的影响，大主教在伯罗奔尼撒设立了首个希腊语天主教印刷所。我们印制的圣经和礼仪文本采用希腊语，但遵循拉丁教义，逐渐在识字的希腊阶层中赢得这场“文字之战”。这场文化攻势降低了叛乱的风险，并使希腊民众在不被剥夺语言遗产的前提下，融入拉丁社会的等级结构。"
 sao_the_asceticism_of_the_crissaean_crags_advance: "克里萨峭壁的苦行"
 sao_the_asceticism_of_the_crissaean_crags_advance_desc: "萨洛纳的土地贫瘠，除了山间药草，几乎无法为那些生活在山峰阴影下的人们提供多少食物。这片嶙峋地貌中孕育出的农民与骑士阶层，都以对饥饿与困苦的漠然而闻名。我们的士兵所需给养仅为法兰克重装步兵的一半，他们拥有狼一般的坚韧耐力，使得他们能在行军与攀爬中胜过任何对手。在福基斯的高山隘口间，他们腹中虽然空乏，但意志却如群山一般坚不可摧。"
 the_the_lombard_guard_advance: "伦巴第卫队"
 the_the_lombard_guard_advance_desc: "作为重获新生的马其顿的堡垒，王国邀请伦巴第和意大利北方的军事工程师来使其防御工事现代化，从而实现了传统的复兴。这些#italic 伦巴第卫队#!构成了军队的专业且核心力量，他们运用先进的长枪与火器方阵，以守卫瓦尔达尔河谷，抵御不断进犯的敌军。他们的存在确保了我国在巴尔干中心地带成为西方军事理论的堡垒。"
 ach_a_system_of_forts_advance: "要塞体系"
 ach_a_system_of_forts_advance_desc: "我们的海岸防御无与伦比，采用了意大利的#italic 棱堡#!设计，以击退敌方的海上劫掠和对我主权领土的入侵。我们将古老的十字军城堡改造成了现代炮兵要塞，既能经受数月的围困，又能对伊奥尼亚海和爱琴海形成威慑。只要我们的石制哨兵守卫着岩石岬角和肥沃山谷，就无人能从海上攻占摩里亚。"
 arg_the_artillery_school_of_argos_advance: "阿尔戈斯炮兵学校"
 arg_the_artillery_school_of_argos_advance_desc: "认识到战争的未来由火炮决定，我们将高地要塞转变为了弹道学与炮术实验室。军官接受的训练是从极端高度计算射击弧线，使炮台能够以精确无比的火力命中敌舰。#italic 阿尔戈斯炮兵学校#!以其数学精度与战术创新享誉欧洲。"
 ath_the_piraeus_arsenal_advance: "比雷埃夫斯军械库"
 ath_the_piraeus_arsenal_advance_desc: "我们在比雷埃夫斯新建的船坞仿照威尼斯兵工厂之制，并采用了现代化的流水线工艺，数周之内便能造出一艘装备齐全的战桨船。这种海军战备的工业化，使这个小小的公国得以以小博大，维持着一支称霸萨罗尼克湾的职业海军。比雷埃夫斯如今已不再是一片废墟，而是东地中海最为现代化的海军基地。"
 bod_the_maritime_consulates_advance: "海事领事馆"
 bod_the_maritime_consulates_advance_desc: "依照威尼斯传统，我们在埃维亚和阿提卡的主要港口设立了领事馆，以维护博多尼察商人的利益。这些机构充当情报枢纽，将海军动向信息直接传递给侯爵。我们虽是山地国家，但目光始终紧盯着大海的地平线。"
 cep_the_chancery_of_the_three_tongues_advance: "三语官署"
 cep_the_chancery_of_the_three_tongues_advance_desc: "我们的政府已发展出以拉丁语、希腊语与意大利语同时颁布法令的体制，以此体现爱奥尼亚群岛上商人与贵族阶层的多元构成。这种语言上的包容性吸引了大陆与意大利半岛上许多渴求稳定、开放多元之法治秩序的宝贵移民，有效减少了在这片身份各异之海域中施政的阻力。"
 crt_the_cretan_labyrinth_of_fortifications_advance: "克里特的防御迷宫"
 crt_the_cretan_labyrinth_of_fortifications_advance_desc: "随着新威胁日益逼近，国内的工程师们已将整座岛屿改造成一座#italic 棱堡式#!的海上要塞。通过加固干地亚、雷西姆农和哈尼亚的城墙，并增设能抵御重炮轰击的土方工事，我们确保任何围攻都会让入侵者陷入长达数十年的苦战。这种基础设施使得一支小型驻军能够无限期地抵抗数量占优的敌人，以等待来自海上的援军。"
 lat_the_golden_gate_customs_house_advance: "黄金海道海关署"
 lat_the_golden_gate_customs_house_advance_desc: "拉丁皇帝们已超越了封建征兵之制，转而依赖一套精密的海上关税与过境税体系。每一艘穿越达达尼尔海峡或博斯普鲁斯海峡的船只，都须在帝国海关停靠，缴纳以硬币计的“皇帝什一税”。这笔庞大的收入，使帝国得以维持一支不受贵族意志左右的常备职业军队。"
 nax_naxian_sea_knights_advance: "纳克索斯海骑士"
 nax_naxian_sea_knights_advance_desc: "我们的贵族在西方世界独树一帜：他们是以桨帆船取代战马、以登船长枪取代骑枪的骑士。这些“海骑士”在公爵旗帜下巡弋东地中海，推行所谓的“拉丁和平”。这种进取姿态使我们的水手保持进取状态，也让对手的贸易始终处于危险之中。"
 neg_the_eubean_tidal_mills_advance: "埃维亚潮汐磨坊"
 neg_the_eubean_tidal_mills_advance_desc: "优里普斯海峡独特的潮汐逆流现象，已被我们的工程师们加以利用，用来驱动一系列庞大的潮汐磨坊。这些机械无论风向如何，都能为磨谷、锯造船材与鼓风炉提供稳定的动力。这一技术优势使优卑亚成为地中海工业最为发达的岛屿，产能足以压倒其海上竞争对手。"
 neo_the_neopatras_horse_breeding_program_advance: "新帕特雷育马计划"
 neo_the_neopatras_horse_breeding_program_advance_desc: "在肥沃的斯派尔希奥斯河谷，公爵设立王家马厩，将加泰罗尼亚种公马与巴尔干本地母马杂交培育新的战马品种。由此诞生的#italic 新帕特雷冲锋马#!以其在山地地形中的耐力与冲锋时的震撼力而闻名。这种骑兵优势使我们得以主宰色萨利平原，并令敌人心生畏惧。"
 pat_the_patrine_mint_advance: "帕特雷铸币厂"
 pat_the_patrine_mint_advance_desc: "帕特雷已获得铸造自有货币的权力，即#italic 帕特雷索尔多#!，这种货币因其币值稳定而广受爱琴海地区认可。作为法兰克摩里亚的中央银行，大主教对世俗领主施加了强大的经济影响力。我们则通过银币的纯度掌控着贸易命脉。"
 sao_the_phocian_mule_chancery_advance: "福基斯骡队官署"
 sao_the_phocian_mule_chancery_advance_desc: "在我国大部分疆域中，轮式运输几乎无法通行；因此，我们设立国家运营的官署，将山地后勤运输国有化。这使我们能够以令传统帝国军队在山岩间挨饿的速度推进补给车队。"
 the_the_via_egnatia_restoration_advance: "修复埃格纳提亚大道"
 the_the_via_egnatia_restoration_advance_desc: "国王下令对古老的埃格纳提亚大道进行全面重铺与加固，这条道路是连接亚得里亚海与博斯普鲁斯海峡的生命线。通过沿线设立常驻驻军，我们消除了盗匪横行，大幅缩短商旅与军队的行程时间。这一后勤杰作巩固了塞萨洛尼基作为拉丁帝国与西欧列强之间不可或缺桥梁的地位。"
 ach_achaean_enlightenment_advance: "亚该亚启蒙"
 ach_achaean_enlightenment_advance_desc: "随着学者从东方崩溃的边缘地区逃离，许多人在我们的宫廷中寻得庇护，促成拉丁哲学与希腊古典知识的独特融合。在诸侯开明的赞助下，我们建立学院，让东西方伟大贤哲的著作并列研习，引发文化复兴。这场思想繁荣吸引欧洲最优秀的头脑，确保国家始终站在行政与科学进步的前沿。"
 arg_argive_maritime_insurance_advance: "阿尔戈斯海事保险"
 arg_argive_maritime_insurance_advance_desc: "凭借着我们作为安全港湾的地位，瑙普利亚的商行们已发展出一套用于爱琴海贸易的精密海事保险与风险共担体系。通过为拉丁货物提供抵御海盗与风暴的保障，我们已将本港变为伯罗奔尼撒的金融避风港。这种早期形式的金融资本主义，将资本从那些更为庞大的意大利共和国手中吸引而来，集中于我们本地的银行之中。"
 ath_the_athenian_bureaucracy_advance: "雅典官僚体系"
 ath_the_athenian_bureaucracy_advance_desc: "随着统治者迈向专制统治，他们以从城市资产阶级中选拔的功绩制文官体系取代了纷争不断的封建领主。这个中央集权的行政机构确保税收高效征集，并使统治者的法律自马拉松至墨伽拉统一施行。通过打破旧有男爵家族的权势，我们的国家已成为一个精简而现代化的、能够迅速动员的政体。"
 bod_the_spercheios_civil_chancellery_advance: "斯派尔希奥斯民政大法官署"
 bod_the_spercheios_civil_chancellery_advance_desc: "博多尼察侯国已从单纯的边境瞭望塔发展为中希腊的行政中枢，必须从封建任意统治转向职业化文官制度。俯瞰斯派尔希奥斯河谷的大法官署的建立，标志着国家迈向中央集权的现代政体：旧有法兰克男爵特权被受过法律训练的“文职骑士”所取代，由他们管理福基斯腹地复杂的通行费与土地登记。"
 cep_the_arsenal_of_argostoli_advance: "阿尔戈斯托利军械库"
 cep_the_arsenal_of_argostoli_advance_desc: "我们已将阿尔戈斯托利天然的深水湾改造为首屈一指的海军维修基地。与威尼斯那庞大的兵工厂不同，我们专精于快速修复用于爱琴海劫掠的双桅帆船与小型桨帆船等小吨位船只。这座专业化的兵工厂使我们的舰队能比对手更长久地停留海上，确保了我们在当地的海上优势。"
 crt_the_council_of_the_two_peoples_advance: "两族议会"
 crt_the_council_of_the_two_peoples_advance_desc: "持续的外部入侵与内部叛乱的威胁，促使干地亚的拉丁诸王放弃了早期征服时期的严格隔离政策。我们设立了“大议会”，让古老的威尼斯裔贵族与#italic 阿洪特#!——希腊东正教地主精英——共同议政。这种共同治理促成了统一的行政阵线，西方的军事传统由根深蒂固的希腊官僚体系提供资金支持，确保了该岛对任何潜在的征服者而言，始终是一座稳定且无法吞并的堡垒。"
 lat_codex_latinus_advance: "拉丁法典"
 lat_codex_latinus_advance_desc: "皇帝已下令对法律体系进行全面修订，将《查士丁尼法典》与法兰克风格的#italic 《罗马尼亚法令》#!融合为一个统一的法律实体。#italic 《拉丁法典》#!消除了法兰克人与希腊臣民之间的法律区别，在皇帝的法律之下创建了一个单一的帝国公民阶层。这种法律统一是给旧封建秩序钉上的最后一颗钉子，为一个真正中央集权的绝对君主制铺平了道路。"
 nax_aegean_waystation_networks_advance: "爱琴海驿站网络"
 nax_aegean_waystation_networks_advance_desc: "在全球贸易时代，我们的岛屿已成为地中海不可或缺的中转站，为远洋船只提供淡水、造船木材与腌制肉类。通过在二十余座岛屿间统一港口设施标准，我们确保任何商船都必须为享受我们的补给与庇护付费。这一后勤网络使我们成为爱琴海内部经济无可争议的主宰。"
 neg_the_triarchic_naval_academy_advance: "三执政海军学院"
 neg_the_triarchic_naval_academy_advance_desc: "为确保舰队质量，岛上的三位领主共同创办海军军官与航海士培训学院。学员学习最新的天文导航与海事法知识，确保每一位埃维亚船长都具备最高水准的专业素养。对海军教育的重视使我们的舰队始终立于海战与探索的前沿。"
 neo_the_ordinance_of_the_viles_noves_advance: "新镇法令"
 neo_the_ordinance_of_the_viles_noves_advance_desc: "本国已着手将分散于群山之中的人口集中迁入“新镇”（加泰罗尼亚语称Viles Noves），其规划仿照加泰罗尼亚的设防村落而建。这些城镇的治理交由一位“炉灶执政官”负责，专司管理公共木柴燃料与谷物储备，以应对严酷的寒冬。通过掌控高地的炉火与面包，我们的统治有效终结了独立山地领主的时代，以一套精简的城市化官僚体系取而代之。"
 pat_the_seminary_of_diplomats_advance: "外交修院"
 pat_the_seminary_of_diplomats_advance_desc: "大主教已创办一所学校，专门训练神职人员掌握国际谈判与密信往来之术。我们那些“黑袍外交官”活跃于欧洲各国宫廷，充当拉丁东方的耳目。借助这些信件与密语，帕特雷对外国宫廷所施加的影响，连敌对的王国也为之艳羡。"
 sao_the_parnassian_wolf_pacts_advance: "帕纳索斯的狼约"
 sao_the_parnassian_wolf_pacts_advance_desc: "在风云变幻的权力格局中，萨洛纳已超越了简单的封建誓约，发展出一套被称为“狼契”的掠食性法理学说。通过在法理上将邻邦定义为需要萨洛纳这头“头狼”庇护方能存续的“附庸猎物”，我们为干涉与吞并建立了永久的外交依据。这种掠食性外交使我们得以借“防御性整合”之名，吞并较小的领地与边境采邑，确保拉丁人在巴尔干的存在，由一个利齿尖锐的强权来统率，而非一群散乱、脆弱的乌合之众。"
 the_the_macedonian_fur_trade_advance: "马其顿毛皮贸易"
 the_the_macedonian_fur_trade_advance_desc: "我们的猎人已深入北部群山的广袤荒野，建立起一项为意大利与法兰西奢侈品市场供应优质皮毛的丰厚贸易。通过规范捕猎季节、保护通往多瑙河的商路，我们已为王室财库确保了这一“毛皮黄金”的稳定来源。这项产业也为我们北部要塞的现代化改造提供了资金，以应对边境之外诸公国日益增长的势力。"
 ach_villehardouins_valor_advance: "维尔阿杜安的英勇"
 ach_villehardouins_valor_advance_desc: "香槟的元帅、第四次十字军东征的见证者编年史家维尔阿杜安的杰弗里，用古法语撰写了最早的本土语言历史著作之一，以生动、英勇的文笔，记录了同伴们的功绩与君士坦丁堡令人惊叹的陷落过程，其作品在西欧贵族中广泛流传。他的编年史不仅是记录，更成为宣传与激励的载体，号召新的骑士与朝圣者增援困守的拉丁诸国，同时在那些散居各地、即便在原十字军解散后仍自视为守卫上帝边疆、对抗分裂者与异教徒的十字军战士之间促进共同的骑士兄弟情。如今，是时候为了我们军队所面临的挑战，重新拾起那种精神了。"
 arg_the_curia_of_the_two_benches_advance: "双席法庭"
 arg_the_curia_of_the_two_benches_advance_desc: "为推动社会稳定，纳夫普利亚领主将高等法院改组为双席法庭。该司法机构要求，每一宗涉及土地或继承权的民事案件，都必须由一名法兰克法官和一名希腊民选长老组成的合议庭审理。通过将这种“共享正义”制度化，我们有效地终结了拉丁与东正教民众之间持续数世纪之久的法律摩擦。这种治理模式创造了一种独特的“阿尔戈斯认同”，使民众对领主保持高度忠诚，令国家免受席卷欧洲其他地区的革命思潮冲击。"
 ath_the_attican_gunpowder_mills_advance: "阿提卡火药工坊"
 ath_the_attican_gunpowder_mills_advance_desc: "我们的火炮如今堪称天下一流，得益于举世闻名的铸炮大师们的冶金秘术，以及我们本地炼金术士们的化学革新。“雅典之雷”响彻巴尔干，我们的火炮以射程与可靠性著称于世。"
 bod_the_oeta_riflemen_advance: "伊蒂火枪手"
 bod_the_oeta_riflemen_advance_desc: "在这火药的时代，厄塔山区那些坚韧的樵夫已被编组为专门的轻步兵部队。这些枪手精于游击战术，善用陡峭地形袭扰入侵之敌，一击致命，毫不留情。他们是任何企图强攻希腊北部隘口的将领心中挥之不去的噩梦。"
 cep_the_ionian_merchant_experts_advance: "伊奥尼亚商贸专家"
 cep_the_ionian_merchant_experts_advance_desc: "我们赋予本地商人广泛特权，允许其成立自治贸易公司，管理最具利润的进出口业务。这种商贸自治培育出富裕的城市阶层，为伯爵领的现代行政改革提供资金支持。"
 crt_academy_of_the_stratioti_advance: "斯特拉蒂奥蒂学院"
 crt_academy_of_the_stratioti_advance_desc: "凶悍的克里特山民被整合为职业轻骑兵军团，将西方纪律与巴尔干边疆的游击战术融为一体。我们设立常设训练场，使本地贵族与拉丁移民之子学习#italic 刀剑与枪械#!的技巧，以守护岛屿内陆。这些部队如今作为精锐雇佣兵输出至诸多国家，带来源源不断的军事声望与收入。"
 lat_the_order_of_the_star_of_the_east_advance: "东方之星骑士团"
 lat_the_order_of_the_star_of_the_east_advance_desc: "皇帝设立高级功绩骑士团，以基于功勋的贵族身份取代世袭头衔，确保帝国领袖因才能而被选拔。骑士团成员身份乃国家最高荣誉，授予扩大了拉丁王座荣耀的将军、外交官与学者。此制度塑造出完全依赖皇帝恩宠的忠诚精英阶层，巩固了君主对国家的控制。"
 nax_the_aegean_hydrographic_bureau_advance: "爱琴海水文局"
 nax_the_aegean_hydrographic_bureau_advance_desc: "在全球探索与精密测绘的时代，纳克索斯公爵建立地中海首屈一指的制图与海洋科学中心。通过聘用最优秀的天文学家与钟表匠，绘制基克拉泽斯群岛的每一处礁石、洋流与风向，我们的航海图成为世上最炙手可热的工具。这种科学掌控力确保纳克索斯船长即便在夜间或风暴中，也能驾驭险恶的爱琴海，使我们的商船与战舰在速度与安全上远胜任何外来者。"
 neg_the_glassworks_of_chalkis_advance: "哈尔基斯玻璃工坊"
 neg_the_glassworks_of_chalkis_advance_desc: "凭借我们海滩上优质的硅砂与沿岸工厂出产的苏打灰，我们已建立起一项足以媲美穆拉诺的玻璃制造业。我们的镜子与彩色玻璃远销拉丁帝国与西方的宏伟宫殿，为本岛带来了巨额财富。而这项奢侈贸易所征的税款，正支撑着我们在这火药时代维护庞大海防城墙的开销。"
 neo_the_academy_of_administration_advance: "行政学院"
 neo_the_academy_of_administration_advance_desc: "新帕特雷必须用一所专门的行政学院的毕业生，取代世袭的“队长总督”制度。候选人要接受民法知识与最新技术的考核，确保国家官员既能挥毫治政，亦能挥剑作战。这种从“门第”到“才干”的转变，使新帕特雷成为中希腊治理效率最高的领地，能够精确清点户籍、迅速征收赋税。"
 pat_the_port_of_sanctuary_advance: "庇护港"
 pat_the_port_of_sanctuary_advance_desc: "我们的港口已被宣布为“中立圣港”，无论天主教徒、东正教徒还是其他信仰的商人，皆可在此安全贸易。这一庇护地位，使我们的港口成为地中海商贸的首要中立场所。即便在全面战争时期，在大主教的禁令庇护下，帕特雷的贸易依旧川流不息。"
 sao_the_legacy_of_the_alpha_protector_advance: "头狼保护者的遗产"
 sao_the_legacy_of_the_alpha_protector_advance_desc: "“狼约”已达成其必然结果：萨洛纳霸权被公认为东地中海的“头狼”。我们不再为侵略辩解，只是行使天然权力“管控”黎凡特地区。这种权力投射确保希腊海域成为萨洛纳商人的私家湖泊。"
 the_the_university_of_thessalonica_advance: "帖撒罗尼迦大学"
 the_the_university_of_thessalonica_advance_desc: "帖撒罗尼迦创立王家大学，致力于研究多元学科，将意大利理论与本地巴尔干经验相结合。该机构培养出法兰克统治时期最杰出的学生，成就非凡。我们的毕业生在整个拉丁世界备受青睐，使王国成为创新与思想的学术中心。"
 #Greek Shared
 greek_group_the_spirit_of_resistance_advance: "抵抗的精神"
 greek_group_the_spirit_of_resistance_advance_desc: "十字军攻陷君士坦丁堡并非罗马精神的终结，而是其熔炉。在各分崩离析的军区，一种激烈的#italic 民族意识#!开始凝聚，其定义便是拒绝向拉丁人的#italic 法兰克人统治#!屈服。这种反抗表现为精神与肉体的总动员，每个村庄都成为对抗十字军领主的抵抗据点。通过坚守我们的仪式与语言，我们将地方冲突升华为一场收复正当遗产的圣战。"
 greek_group_hesychast_traditions_advance: "静修主义传统"
 greek_group_hesychast_traditions_advance_desc: "在政治衰败的时代，由格里高利·帕拉玛斯倡导的静修主义运动赋予了人民深刻的内在力量。通过在沉默祈祷中追寻“非受造之光”，我们的人民获得超越衰败边界与帝国阴谋的团结。阿索斯山的修道院成为希腊世界的精神中枢，确保无论教宗使节还是苏丹的耶尼切里，都无法打破民众的宗教凝聚力。"
 greek_group_stratioti_levies_advance: "斯特拉蒂奥蒂征召兵"
 greek_group_stratioti_levies_advance_desc: "巴尔干崎岖的地形孕育出独特的战士阶层——斯特拉蒂奥蒂。这些轻骑兵常身着拜占庭甲胄与地方服饰的混合装束，精于“一击脱离”的战术，能够骚扰更庞大但更迟缓的西方或奥斯曼军队。他们以勇猛与卓越的侦察能力著称，在重甲骑士束手无策的山地战场上扭转战局，成为希腊军事复兴的先锋。"
 greek_group_the_phanariote_network_advance: "法纳尔人网络"
 greek_group_the_phanariote_network_advance_desc: "在法纳尔区的狭窄街巷中，崛起了一个新兴的希腊商人外交家阶层。凭借其识文断字与多语言的才能，这些家族已使自己成为地中海列强行政机构中不可或缺的人物。他们身兼译员、总督与金融家之职，编织出一个从多瑙河延伸至尼罗河的影子权势帝国。他们的秘密信函，为我国提供了无与伦比的情报与外交筹码。"
 greek_group_aegean_coastal_defence_advance: "爱琴海沿岸防御"
 greek_group_aegean_coastal_defence_advance_desc: "爱琴海崎岖海岸与成千上万的岛屿本身就是天然堡垒。我们将海洋文化转化为防御学说，使每一艘商船皆可武装，每一名渔夫皆可成为水兵。通过巡弋狭窄海峡与隐蔽海湾，我们确保任何试图穿越我方水域的敌对舰队都遭受持续骚扰。这种分散化海军力量使我们的海上核心地带几乎无法被占领。"
 greek_group_the_modern_greek_enlightenment_advance: "现代希腊启蒙"
 greek_group_the_modern_greek_enlightenment_advance_desc: "#italic 现代希腊启蒙运动#!将西方科学探究之火带回哲学诞生之地。希腊知识分子将成千上万册书籍运回故土，引发大规模教育改革。这场运动以自由、平等与复兴的希腊身份理念取代旧有迷信。由此产生的民族觉醒，将臣民转化为公民，准备为现代开明国家而战。"
 #Greek Unique
 epi_the_eagle_of_the_pindus_advance: "品都斯雄鹰"
 epi_the_eagle_of_the_pindus_advance_desc: "在崎岖险峻、雨水充沛的品都斯山脉，伊庇鲁斯的统治者们开辟出一片罗马军队无法攻破的圣所。我们精通“山地伏击”战术，利用我国地势的垂直落差，在狭窄的山谷中诱捕并歼灭规模大得多的敌军。这种对环境的掌控，使我们整个国家成为入侵者的死亡陷阱，确保了平原或许会失陷，但群山将永远属于希腊。"
 feo_gothic_hellenic_synthesis_advance: "哥特‑希腊融合"
 feo_gothic_hellenic_synthesis_advance_desc: "在克里米亚山区的隔绝环境中，克里米亚哥特人的遗民与当地的希腊人口已融合成一个单一而坚韧的族群。这种文化融合了北方坚忍尚武的传统与南方卓越的行政和航海才能。这种“狄奥多罗式”精神是我们最强大的防线，它造就了一个自视为罗马边疆最后真正守护者的群体，甘愿为其独特的生活方式战斗至最后一人。"
 gre_restoration_of_power_advance: "权力复兴"
 gre_restoration_of_power_advance_desc: "为在第四次十字军东征后的混乱中生存，分散的希腊势力必须回归单一、绝对的巴西琉斯原则。我们拆解了让拉丁人各个击破的地方#italic 执政官#!竞争，重建拥有绝对忠诚的中央宫廷。权力集中确保国家以一声发言、以一剑行动，终结曾令帝国衰竭的内耗。"
 moe_the_court_of_mystras_advance: "米斯特拉斯宫廷"
 moe_the_court_of_mystras_advance_desc: "如同君士坦丁堡一般，米斯特拉斯这座山城正崛起为希腊文化的首要中心，吸引帝国最杰出的学者、艺术家与神学家汇聚于其沐浴阳光的山坡。坎塔库泽努斯与帕里奥洛格斯两大家族的despot（专制公）们，培育出一种生机勃勃的思想氛围，使古典希腊哲学的研究与东正教神秘主义相互交融。这场#italic米斯特拉斯文艺复兴#!，确保了despotate（专制国）不再只是一个边陲省份，而是一座真正名副其实的显赫都城，其魅力足以吸引来自地中海各地的外交家与思想家。"
 ths_the_wallachian_scutari_advance: "瓦拉几亚斯库塔里"
 ths_the_wallachian_scutari_advance_desc: "在第四次十字军东征后的混乱中，色萨利统治者转向#italic 大瓦拉几亚#!的半游牧弗拉赫人以补充兵源。通过授予自治与牧场权以换取军役，专制领地获得忠诚的轻步兵与散兵阶层，他们在崎岖品都斯山脉如鱼得水。这些士兵以机动性与毁灭性冲击战术著称，成为对抗拉丁骑士与伊庇鲁斯对手的主要威慑力量，将山口化为致命瓶颈。"
 epi_balkan_marriages_advance: "巴尔干婚姻"
 epi_balkan_marriages_advance_desc: "伊庇鲁斯地处希腊、斯拉夫与拉丁三大世界的交汇之处，我们已将王室的女儿们化为最得力的外交使者。通过与塞尔维亚诸王、阿尔巴尼亚酋长乃至意大利伯爵结成的复杂联姻网络，我们已使杜卡斯—科穆宁家族成为巴尔干政治中不可或缺的仲裁者。这些血缘纽带确保了我们一旦开战，绝不会缺少愿意从敌人侧翼出击的强大盟友。"
 feo_the_bastion_of_mangup_advance: "曼古普要塞"
 feo_the_bastion_of_mangup_advance_desc: "我们的首都曼古普‑卡莱是一座名副其实的山中要塞，四周环绕着任何攻城器械都无法逾越的陡峭悬崖。我们通过一系列精密的隧道、蓄水池和隐蔽的出击口，扩展了这些天然防御，使这座城市在必要时可坚守数年。这座坚不可摧的基地确保了即使我们的土地遭金帐汗国蹂躏，公国的心脏地带仍安然无恙，成为所有北方基督徒希望的灯塔。"
 gre_rebuilding_the_theme_system_advance: "重建军区制度"
 gre_rebuilding_the_theme_system_advance_desc: "我们借鉴中期拜占庭黄金时代的制度解决兵源危机。通过授予#italic 阿克里泰#!（边境守卫）世袭土地以换取永久军役，我们建立深植于所守土壤的自给自足防御力量。此制度减少对昂贵雇佣兵的依赖，并确保各省拥有能够坚守阵线直至帝国主力抵达的民兵。"
 moe_reclaiming_the_peloponnese_advance: "收复伯罗奔尼撒"
 moe_reclaiming_the_peloponnese_advance_desc: "在拜占庭收复莫奈姆瓦夏、马伊纳与米斯特拉斯各个要塞后，摩里亚专制领地投身于漫长的“再征服”事业，从法兰克诸侯手中逐步夺回半岛。这场战役不仅是围城术，更是文化渗透：希腊行政当局鼓励地方民众反抗拉丁领主，拥护“合法统治者”。通过战略联姻、持续小规模冲突与逐步吸收封建封邑，摩里亚缓慢而坚定地将破碎土地编织为统一省份。"
 ths_meteora_sanctuaries_advance: "迈泰奥拉圣所"
 ths_meteora_sanctuaries_advance_desc: "随着巴尔干地区日益动荡，色萨利的专制君主们资助在迈泰奥拉难以企及的砂岩柱顶端建造修道院群。这些“空中修道院”有双重用途：既是东正教信仰的精神灯塔，也是高海拔的宝库，可保护国家财富和圣物免遭掠夺雇佣兵的洗劫。通过将地区精神权威集中于这些易守难攻之地，专制君主国确保了即便中央政府面临压力，当地的身份认同仍牢牢根植于东正教信仰。"
 epi_arvanite_communities_advance: "阿尔瓦尼蒂社区"
 epi_arvanite_communities_advance_desc: "为弥补我方人口的日渐稀少，我们邀请骁勇善战的阿尔瓦尼亚部族定居于伊庇鲁斯与阿卡纳尼亚的肥沃河谷。作为土地与自治权的交换，这些战士为我们提供了一支不知疲倦的轻步兵力量，擅长巴尔干边境那种残酷的近身肉搏战。他们独特的尚武文化与我们的罗马军事传统相融合，锻造出一支既极度忠诚、又在战斗冲击中令人胆寒的混合部队。"
 feo_black_sea_fur_trade_advance: "黑海毛皮贸易"
 feo_black_sea_fur_trade_advance_desc: "尽管国土狭小，我们却掌控着连接俄罗斯广袤毛皮产区森林与地中海市场的要津港口。我们已与当地的鞑靼可汗们谈妥独家协议，成为黑海毛皮运输的唯一承运方。这一垄断带来的利润，足以聘请热那亚工程师与拜占庭学者，使我们这个弹丸小国在草原之中，依旧保持着财富与文明的中心地位。"
 gre_greek_viticulture_advance: "希腊葡萄种植业"
 gre_greek_viticulture_advance_desc: "我们彻底变革了希腊的农业，使其从自给自足转向高价值的出口作物，特别是著名的#italic 马尔瓦西亚#!葡萄酒和日晒无籽葡萄干。通过对现代灌溉和加工技术的投资，我们的农产品已成为欧洲奢侈品市场的主流商品。随之而来的经济繁荣，为维持一支职业常备军提供了资金，并使我们得以保持可与西方伟大诸王相媲美的辉煌宫廷。"
 moe_plethons_vision_advance: "卜列东的愿景"
 moe_plethons_vision_advance_desc: "哲学家乔治斯·格弥斯托士·卜列东抵达米斯特拉斯宫廷，标志着摩里亚身份认同的一次彻底转变——他主张回归古斯巴达的法律与社会结构。卜列东主张建立一支由本土希腊人组成的国家军队，而非依赖不可靠的雇佣兵，并倡导一种基于希腊传统而非仅仅是基督教信仰的社会秩序。这种原民族主义意识的觉醒，将为专制国提供一件强大的意识形态武器，将保卫摩里亚转变为一场为希腊民族自身生存而战的圣战。即便我们仍坚信基督，这也能极大提升我们统治家族的声音。"
 ths_thessalian_horse_breeding_advance: "色萨利育马业"
 ths_thessalian_horse_breeding_advance_desc: "环绕拉里萨与特里卡拉的广袤沃野，在这个群山环伺的地区赋予了我们独特的地理优势：大规模养马的能力。承袭古代色萨利骑兵的辉煌传统，各位专制公已建立起官办的种马场，培育出能负载全副武装骑士、穿越各类地形的强健快马。这项投资将彻底改造专制国的军事力量，使其得以组建一支足以匹敌敌方骑士的职业骑兵部队，为国家在开阔战场上提供决定性的进攻利器。"
 epi_adriatic_gatekeepers_advance: "亚得里亚海的守门人"
 epi_adriatic_gatekeepers_advance_desc: "通过掌控瓦洛纳与布特林特两大港口，伊庇鲁斯俨然成为亚得里亚海的守门人。我们借此地位，与威尼斯及意大利诸城邦谈成了有利的贸易条约，因为它们欲抵达黎凡特，必须经由我们的势力范围。凭借精准的关税征收，以及对抗海盗的“保护”服务，我们已将这个一度孤立的专制国，转变为沟通东西方的富庶商贸枢纽。"
 feo_the_northern_star_of_greece_advance: "希腊的北方之星"
 feo_the_northern_star_of_greece_advance_desc: "作为北方主要的希腊语国家，特奥多罗已成为宗教抵抗与文化存续的象征。我们已将本国亲王确立为 #italic Protector of the Pontic Greeks #! ，吸引着来自远方的移民与学者。这份威望赋予我们超越国境的道德权威，使我们在宏大的宗教斗争中，成为希腊东正教信仰的 #italic Northern Star #! ，发挥着举足轻重的作用。"
 gre_the_new_stratikon_advance: "新军阵"
 gre_the_new_stratikon_advance_desc: "随着火药重塑欧洲战场格局，我们将西式火绳枪操练与传统战术手册融为一体。我们的步兵，即#italic 新军阵#!，经训练能在炮火下保持严明的纪律，既仿效了古代方阵的传奇韧性，又装备着现代火绳枪与长矛。这种对普通士兵的专业化改造，确保了我们将不再是中世纪的遗民，而是一支能与任何帝国正面抗衡的现代军事力量。"
 moe_the_hexamilion_modernization_advance: "六里墙现代化"
 moe_the_hexamilion_modernization_advance_desc: "鉴于科林斯地峡是通往半岛的门户，摩里亚国将投入巨资重建和现代化六里墙。运用火药防御工事的新发展，这道古老的屏障将被转变为由棱堡、多面堡和炮台组成的精密防线，旨在抵御现代帝国的围攻，并随后在全境复制。这道“希腊长城”将作为防御战略的基石，使专制国得以在一道坚不可摧的防线后方安全地投送力量，迫使任何入侵者陷入漫长而代价高昂的海上封锁。"
 ths_raiders_of_the_pindus_advance: "品都斯的袭扰者"
 ths_raiders_of_the_pindus_advance_desc: "在北希腊求生，意味着放弃传统拜占庭会战战术，转向精密的游击体系。色萨利军学将演化为以#italic 克列夫特式#!战术为核心，利用品都斯山脉的深谷与密林，不断骚扰敌军补给线，使其精疲力竭。这种向游击抵抗的文化转型，使任何占领军都将面对一个“牧人皆为斥候、山径尽藏伏兵”的险恶环境，使征服色萨利成为外国帝国的后勤噩梦。"
 epi_fortresses_of_ioannina_advance: "约阿尼纳要塞"
 epi_fortresses_of_ioannina_advance_desc: "约阿尼纳城已被改造为一座真正的要塞。运用最新的意大利军事工程技术，我们在都城及其湖畔修筑了一系列相互呼应的棱堡与水上堡垒，足以抵御数月之久的持续炮击。这一防御体系是我国整体战略的根基所在，每当战局在野外对我们不利之时，便可退守这座坚不可摧的核心堡垒。"
 feo_the_gothic_red_guard_advance: "哥特红卫"
 feo_the_gothic_red_guard_advance_desc: "我们借鉴了哥特祖先古老而严酷的传统，以及罗马人严谨的军事手册，组建了#italic 红卫#!。这些精锐突击部队完全从克里米亚最高的山村中招募，接受在要塞漆黑的隧道和海岸幽闭的峡谷中作战的训练。他们装备着重型长柄武器和最新的燧发手枪，是发动突然、毁灭性袭击的大师。这支部队不留活口、永不撤退的名声，使其成为黑海盆地最令人胆寒的步兵，最顽强的军团也会因他们而士气崩溃。"
 gre_the_hellenic_admiralty_advance: "希腊海军部"
 gre_the_hellenic_admiralty_advance_desc: "一个统一的希腊若要生存于东西方巨人之间，就必须成为“内海”的主人。我们已在比雷埃夫斯建立了中央海军部，以标准化造船，并以最新的航海科学训练一支专业的军官团。通过融合桨帆船的速度与盖伦帆船的火力，我们打造了一支既能灵活应对爱琴海的风向，又能在开阔地中海域展现强大威力的舰队。"
 moe_the_silk_road_of_morea_advance: "摩里亚丝绸之路"
 moe_the_silk_road_of_morea_advance_desc: "伯罗奔尼撒的丝绸产业，长久以来一直是当地经济的支柱，在17世纪经历了一场由国家主导的大规模扩张，以供养专制国日益膨胀的军事野心。通过邀请威尼斯织造大师与热那亚染匠定居于都城米斯特拉斯，各位despot（专制公）打破了外国在奢侈纺织品加工上的垄断，确保从桑树种植到成品锦缎的整条产业链都留在希腊境内。这种经济保护主义，将把摩里亚打造成一个至关重要的“丝绸枢纽”，连接欧洲启蒙时代的奢侈品需求与东方的原材料。由此激增的关税与贸易税收，将为国库提供足够的黄金，以维持一套现代化官僚体系与一支常备军，而无需过度盘剥农民。"
 ths_armatole_administration_advance: "民兵行政署"
 ths_armatole_administration_advance_desc: "为应对边境地区的无法无天的匪患滋生局面，色萨利将#italic 民兵制度#!规范化，即授予地方首领对特定地区的正式军事管辖权。这一行政层级填补了中央专制君主与乡村农民之间的空白，形成了一个纪律严明的准军事阶层，负责征税和维持内部治安。通过将曾经的法外之徒转变为国家认可的治安维持者，这个专制政权将实现国内稳定，从而推动经济复苏并建立更集中的治理模式。"
 epi_the_sublime_diplomacy_advance: "强势外交"
 epi_the_sublime_diplomacy_advance_desc: "在强敌环伺中生存数百年，使我们拥有了世上最精妙的外交体系。我们发展出“强势中立”学说，巧妙地令列强彼此竞争以争取我们的友谊，而非图谋征服。我们的使节以缔结总能使伊庇鲁斯在冲突结束后获得更多领土与影响力的和约而闻名。"
 feo_the_iron_harvest_advance: "铁血收割"
 feo_the_iron_harvest_advance_desc: "狄奥多罗的哥特‑希腊融合文化已彻底褪去防御外壳，转化为一部“战争机器”。我们不再满足于悬崖上的生存，而是将山地要塞工业化为庞大的铸造厂与兵营，在草原战争的严酷学堂中培养职业军官团与征召军。公国的每一位公民首先是一名士兵，将周遭平原视为哥特荣耀与罗马复兴的收获之地。这种“总体战争”姿态，使我们能够以远超疆域规模的军事力量震慑更庞大的邻国。"
 gre_megali_idea_realized_advance: "实现大希腊梦想"
 gre_megali_idea_realized_advance_desc: "重建一个从伊奥尼亚海延伸至安纳托利亚海岸的希腊世界的梦想，已成为我国政策的指引方向。我们构建了一套法律与历史框架，为收复祖先曾统治的所有土地提供正当性，将我们的征服行动定义为“解放”。这种意识形态热忱推动着政府以前所未有的速度整合新领土，民众也欣然接受重归希腊怀抱。"
 moe_the_constitution_of_morea_advance: "摩里亚宪章"
 moe_the_constitution_of_morea_advance_desc: "当启蒙之潮席卷地中海，摩里亚专制君主采取激进举措，以成文宪章明确王权与人民之间的关系。该文件深受米斯特拉学院社会理论影响，废除拜占庭宫廷最后的裙带残余，建立以功绩为本的文官制度，并保障新兴商人阶层的财产权。通过赋予公民参与国家治理的份额，专制公国培养出强烈的民族忠诚，使人民更能抵御外国颠覆。这一政治现代化将把摩里亚从传统专制政体转型为精密的“民族君主制”，能够为国家荣耀动员其人民全部的精神与财政资源。"
 ths_thessalian_grain_exchange_advance: "色萨利粮食交易所"
 ths_thessalian_grain_exchange_advance_desc: "色萨利平原向现代化农业粮仓的转变，将通过建立色萨利谷物交易所而最终完成。国家将摆脱中世纪的分成租佃制，鼓励采用最先进的耕作技术，而交易所则将为国际市场统一价格与品质标准。这种对谷物贸易的垄断，将使色萨利得以把粮食盈余当作外交工具，在冲突期间供给欧洲饥饿的军队，以换取政治让步与现代技术。这些出口所产生的财富，将用于修建基础设施，把山区矿场直接与沿海港口连接起来，使全国融为一个统一的经济体。"
 #Serbian Shared
 serbian_zaduzbina: "扎杜日比纳"
 serbian_zaduzbina_desc: "无论是塞尔维亚的权贵还是平民，皆恪守着 #italic Zadužbina #! （灵魂献礼）的传统——即\"为灵魂而立的奉献\"。这种兴建石砌教堂与修道院的文化冲动，在整个巴尔干地区勾勒出一幅恒久不灭的实体景观，彰显着我们的存在。这些建筑不仅仅是宗教中心，更是承载历史、艺术与文字传承的宝库，定义着塞尔维亚人的\"生存空间\"。这种对建筑的执着，确保我们的文化实实在在地扎根于这片土地，赋予人民一种恒久感与历史延续感，激励他们不惜一切代价捍卫自己的\"圣土\"。"
 home_of_hussars: "骠骑兵之乡"
 home_of_hussars_desc: "尽管轻骑兵编制自古有之，但最早的巴尔干骠骑兵（或称#italic gusars#!）作为$BYZ$的辅助部队出现，主要征募自10至11世纪由$BYZ_ADJ$控制的$serbia_area$地区。即便在$BYZ_ADJ$势力式微之后，这一传统依旧延续，并在此后数个世纪中不断发展完善。"
 serbian_serbian_epic_poetry: "塞尔维亚史诗"
 serbian_serbian_epic_poetry_desc: "塞尔维亚人通过史诗诗歌创造了一部“活的历史”。#italic古斯拉琴师#!，这位云游的吟游诗人，是民族魂魄的首要守护者。#italic古斯拉琴师#!伴随着#italic古斯拉琴#!的乐声吟诵千言万语的诗篇。这些歌谣保存着家族谱系、法律先例与道德训诫。塞尔维亚文化确保即便是最目不识丁的牧羊人，也能理解祖传的权利与共同的身份认同。每一次村落聚会，都成为一场历史的熏陶仪式。"
 serbian_the_icon_of_saint_sava: "圣萨瓦圣像"
 serbian_the_icon_of_saint_sava_desc: "塞尔维亚人民的文化根基由圣萨瓦所奠定。他将拜占庭的灵性信仰与斯拉夫本土习俗相融合，并坚持以塞尔维亚语进行礼拜仪式，由此创立了一个与民族身份密不可分的民族教会。这一根基在我们的人民中再度浮现，使所有塞尔维亚人，无论贵族还是平民，都将自己视为一个独特而神圣的共同体的一员，即便政治疆界变迁或崩溃，这种团结也始终如一，为我们提供了抵御外来文化同化的内在稳定力量。"
 serbian_seobe: "流徙文化"
 serbian_seobe_desc: "塞尔维亚人民精通“流动的身份认同”这门艺术，即在不丧失文化凝聚力的情况下，将整个社群迁徙至新土地的能力。这种流动性确保了“塞尔维亚炉灶”并非一个固定的地理坐标，而是一份可携带、不可摧毁的社会契约；无论塞尔维亚人的社群将拐杖插在何处，古老的律法与#italic斯拉瓦#!的传统都会立刻重新确立。这种韧性使我们的文化无法被斩草除根——我们的民族可以舍弃焦土化的河谷，却能在新的边疆重新以一个完整、尚武的社会形态出现，静候时机，向祖先故土的腹地发起反击。"
 serbian_enlightenment: "塞尔维亚启蒙运动"
 serbian_enlightenment_desc: "受启蒙时代其他国家的启发，多西泰·奥布拉多维奇这样的民族英雄致力于提升我们的本国语言和文学。由于感受到世俗作品在普通民众中稀缺，奥布拉多维奇率先弥合书面塞尔维亚语和口语之间的差距。他通过精心编写语法书和词典、撰写巨著并翻译外国作品，推动了国家的文学复兴。"
 #Serbian Unique
 hum_a_sheep_surrounded_by_wolves: "群狼环伺之羊"
 hum_a_sheep_surrounded_by_wolves_desc: "我们的地理位置被强大敌人的勃勃野心所夹击。为了在这场猎食者的包围中生存下来，我们的领主精通离间邻邦之术，不断向远方的恶狼称臣纳贡，以此遏制近在门前的那一只。借助天主教西方与东正教东方之间、以及波斯尼亚克斯特亚尼教派与两者之间的制衡，我们确保了任何一方霸主都无法完全吞并我们的土地，而不招致其对手的强力干涉。这种精妙的政治两面手法，将我们表面上的弱小转化为生存之道：我们向当前保障我们内部自治的强权授予贸易特权与军事通行权，巧妙地让更强大的群狼彼此争斗不休，而我们则继续安然做内雷特瓦河的真正主人。"
 serbian_mining: "$saxon$矿业特权"
 serbian_mining_desc: "出于对来自$upper_saxony_area$和哈尔茨山脉的#italic 萨克森#!矿工的有意邀请，我们将原始的露天矿坑转变为复杂的工业引擎。通过赋予这些日耳曼专家独立的法庭、依据自身矿业法规进行管理的权利，以及宗教自由，我们成功开采出$brskovo$与$novo_brdo$地底深处蕴藏的丰富银矿和金矿矿脉。这批技术人才的大量涌入，为我们提供了充足的硬通货，让哦我们得以雇佣最精锐的西方雇佣兵，建造宏伟的石制建筑设施，并铸造高品质的银质#italic 马塔潘#!仿币，这些货币将逐渐主导巴尔干地区的贸易以及地中海地区的商业往来。"
 mimic_the_phoenix: "模仿凤凰"
 mimic_the_phoenix_desc: "我们热切吸收拜占庭的传统，力求仿效其法律和整体风格。我们汲取罗马影响的丰富底蕴，努力将其精髓融入我们的治理和法律体系，并有意识地在我们的领土内效仿拜占庭帝国的优雅和精致。"
 tro_zupa_administrative_reform: "行政区改革"
 tro_zupa_administrative_reform_desc: "在前任统治者的治理下，传统的斯拉夫#italic 行政区#!特拉武尼亚被重组，以更好地征收#italic 土地税#!。统治者任命#italic 长官#!监管特雷比什尼察河谷，确保肥沃平原的财富流入中央国库。这种原始官僚体系使我们过去的统治者能够通过从腹地高产的农业产出中榨取财富来为战争提供资金，我们将延续这一传统。"
 zta_maritime_fiefdoms_of_the_adriatic: "亚得里亚海的海上封邑"
 zta_maritime_fiefdoms_of_the_adriatic_desc: "我们的身份认同形成于高耸的石灰岩山脉与咸涩大海的激烈交汇之处。通过牢牢控制沿海的关键城镇，泽塔的领主们成为了整个塞尔维亚内陆不可或缺的海上门户，掌控着盐、丝绸与白银的流动。我们利用从地中海贸易和关税中获取的巨额财富，来资助我们那些独立意识强烈的山地部族，并建造了守护海岸线的巨大石质防御工事。这确保了泽塔本身即是一支不容小觑的海上力量，其影响力远远辐射出内陆的崎岖悬崖之外。"
 hum_the_kosaca_iron_fist: "科萨查铁拳"
 hum_the_kosaca_iron_fist_desc: "受科萨查家族的启发，公国已开始将军队统一于单一的王朝旗帜之下，国家正逐步摆脱分散的封建征召制，转向以重装步兵与雇佣弩手为核心的职业化军队。这一军事整合使我们得以蔑视敌人，将我们崎岖的山地变为第拿里阿尔卑斯山南部的权力仲裁者。"
 ser_vitestvo: "骑士精神"
 ser_vitestvo_desc: "我们将倡导 #italic 维泰什特沃 #!，这是一种独特的塞尔维亚骑士准则，融合了西方的重甲传统与东方那种坚忍的战士精神。这种骑士文化不会局限于最高贵族阶层，而将逐渐渗透至自由士兵等下层民众之中。它强调个人的勇敢、对真信仰的忠诚，以及对长矛与军刀的精湛掌握。这种尚武文化将造就一个天生倾向于征战的民族，将从军视为社会与精神成就的最高形式。"
 rallying_the_troops: "集结部队"
 rallying_the_troops_desc: "我国已经开发出迅速集结军队的方法，因此没有敌人能够在我们毫无准备时袭击我们。这一优势使我们在逆境中屹立不倒，我们已准备好迎战。我们团结一致，坚定不移，准备捍卫我们的荣誉和祖国。"
 tro_the_defensive_network_of_klobuk: "克洛布克防御网络"
 tro_the_defensive_network_of_klobuk_desc: "为了对抗敌人的扩张，国家将把克洛布克堡垒重建为一座现代要塞。我们将在#italic 波波沃波列#!引入一套烽火信号系统，使特雷比涅的驻军能够在数小时内向整个腹地发出入侵警报。这将形成一个控制区，使该地区无法被绕过。"
 zta_the_italian_condottieri: "意大利雇佣兵"
 zta_the_italian_condottieri_desc: "我们已掌握了国际雇佣兵合同这门利润丰厚却又充满风险的技艺。通过向意大利人提供精锐的泽塔山地步兵和经验丰富的水手，以支持他们海外征战，我们得以获得现代西方武器装备、火药以及亚德里亚海的强大海军盟友。这种联系确保了我们的独立得到强大友邦的庇护，同时我们也得以在国内维持并精进我们古老的军事传统。它赋予我们一支专业的军事力量，其优势是其他巴尔干国家难以企及的。"
 hum_the_viticulture_of_the_sunny_scree: "阳光坡地的葡萄种植"
 hum_the_viticulture_of_the_sunny_scree_desc: "黑塞哥维那河谷那阳光充沛、富含石灰岩的山坡，孕育出一种独特的高糖葡萄，为亚得里亚海沿岸所艳羡。通过建立对日拉夫卡与布拉蒂纳葡萄酒出口的王室垄断，我们能够开辟一条绕开粮食市场波动的奢侈品贸易之路。这种“液体外交”使我们的宫廷得以维持可与意大利城邦相媲美的生活方式，并以高端葡萄酒出口作为外交润滑剂，与威尼斯共和国及那不勒斯王国缔结有利条约。"
 ser_the_transcribers_of_resava: "雷萨瓦的缮写员"
 ser_the_transcribers_of_resava_desc: "在战乱的时代，塞尔维亚人民转而以笔守护刀剑所不能保全之物。#italic Resava School#! 的正字法将使塞尔维亚—斯拉夫语规范统一，缔造出一个文化上的"
 keepers_of_the_gate: "门户的守卫"
 keepers_of_the_gate_desc: "塞尔维亚崎岖的地形孕育出一张强大的防御网络，雄伟的斯梅代雷沃要塞就是一个缩影。这些持久的防御工事保卫着我们的国家，加大入侵的难度。从绵延的山脉到具有战略意义的河谷，塞尔维亚的防御体系证明了我们坚韧不拔的精神。"
 tro_the_trebisnjica_bridges: "特雷比什尼察桥"
 tro_the_trebisnjica_bridges_desc: "效仿罗马工程的模式，当地领主将投资建造大型石桥，以确保从内陆来的“白银之路”在冬季洪水期间从不中断。这种对基础设施的投资，将允许沉重的贸易商队在山脉与沿海城镇之间全年通行。"
 zta_the_retreat_to_the_karst: "退守喀斯特群山"
 zta_the_retreat_to_the_karst_desc: "沿海之地或许会暂时随帝国权力的流沙而失去，但喀斯特群山始终是我们永恒而不可攻破的堡垒。我们坐落于洛夫琴山高处的采蒂涅修道院要塞，那里空气稀薄、山势陡峭，正是我们民族的核心所在。这座城池体现了一种长远的国家战略——“山地孤立”，我们甘愿舍弃港口的财富与脆弱，换取高峰之上的绝对安全。凭借扎根于岩石之中，我们实际上使任何帝国强权都无法完全吞并或统治泽塔国。"
 hum_the_humite_chancery_records: "胡姆战时文书档案"
 hum_the_humite_chancery_records_desc: "为治理我们的国家，我们已将行政体系集中于一个机动而高度有序的秘书处。即使在战时，我们也能维持对土地所有权、氏族世系及税收义务的精确记录，从而防止外敌占领后常见的社会解体。多亏这些记录，一旦侵略者被击退，国家便能立即恢复全面运作，一条清晰而不间断的指挥链，从君主的宫殿一直延伸至高地喀斯特中最偏远的山村。"
 the_rebirth_of_the_patriarchate: "牧首的复兴"
 the_rebirth_of_the_patriarchate_desc: "凭借在邻国复杂的帝国行政体系中展现出的惊人机敏与政治手腕，我们成功通过谈判恢复了本国的牧首区。这一外交胜利赋予我们对从亚得里亚海沿岸延伸至多瑙河中游的所有塞尔维亚人口的精神与法律管辖权，使教会得以成为“全体塞尔维亚人的守护者”。此举使我们能够维持一个影子行政体系，负责征收什一税、管理地方教育，并在由单一强大信仰凝聚的民众中延续我们传统的火种。"
 reform_the_ecclesiastical_authorities: "摩拉瓦贸易行会"
 reform_the_ecclesiastical_authorities_desc: "我们将向摩拉瓦河谷的行会颁发王室特许状，鼓励在河流运输枢纽沿线发展大规模的皮革加工、纺织与金属精加工作坊。通过豁免这些行会部分内部关税，换取其为王室军队提供标准化装备（如骑兵的鞍具与步兵的制服），国家将建立起一种自给自足的本土产业。此举将减少王国对昂贵外国进口商品的依赖，并培育出一个繁荣的城市中产阶级，作为制衡乡村贵族权力的忠诚力量，从而显著扩大国家的可征税经济基础。"
 tro_the_aqueducts_of_popovo_polje: "波波沃波列引水渠"
 tro_the_aqueducts_of_popovo_polje_desc: "利用特雷比什尼察河（世界上最长的伏流河）独特的水文条件，国家将建造一系列石砌引水渠和磨坊。这将使得即使在干燥的夏季月份也能进行集约农业，从而使国家在谷物上自给自足，并能承受长期的海上封锁。"
 zta_the_vladika_sovereignty: "弗拉迪卡主权"
 zta_the_vladika_sovereignty_desc: "随着世俗贵族王朝在连年战争的压力下衰落，采蒂涅的主教亲王（弗拉迪卡）肩负起国家领导的重任。这种独特的 #italic 神权君主制#!将精神权威与世俗权力统一于一个独身的职位，有效防止了国家因封建继承人的争斗而陷入危险的分裂。它将争取山地独立的斗争转变为一场永恒的圣战，每个部族成员都负有宗教义务参与其中。#italic 弗拉迪卡#!不仅仅是统治者；他是我们抵抗运动的鲜活象征，确保在保卫 #italic 黑山#!时，十字架与利剑永不分离。"
 hum_the_ponor_storage_system: "波诺尔储备体系"
 hum_the_ponor_storage_system_desc: "我们掌握了特雷比什尼察河系——世界上最长的潜流河——气候控制的秘密。通过夏季利用#italic 波诺尔#!（落水洞）稳定的温度和干燥的上层洞穴，我们建立了一个全国性的地下粮仓网络。这个“隐秘储备”确保我们的粮食供应不受黑塞哥维那炙烤酷热的影响，更重要的是，对入侵军队的征粮队隐形。当敌人在焦土河谷中挨饿时，我们的部队却能从大地清凉的深处获得补给，使我们即使在长达数年的封锁中也能维持一支士气高昂的常备军。"
 ser_serbian_national_militia: "塞尔维亚国民民兵"
 ser_serbian_national_militia_desc: "汲取过去几十年我们老兵部队来之不易的经验，我们建立了一支永久性的、专业的常备国民民兵。这支力量代表着告别混乱的农民征召制的决定性转变，它采用严格的西式操练、统一的装备和现代化的指挥体系，同时保留了我们巴尔干先辈勇猛、高士气的战斗风格。这确保了我们的独立不是一份脆弱的外交礼物，而是有一台可信的、现代化的军事机器作为后盾，能够保卫我们的边界，抵御任何扩张的帝国势力。"
 foreign_relations_bureau: "外事处"
 foreign_relations_bureau_desc: "我国已经认识到与邻国建立友好关系和联盟的重要性。为此，我们将成立专门的外交事务机构。注重外交的我们，将更有能力驾驭复杂的国际关系网络，确保国家的繁荣。"
 tro_the_zudiosca_network: "祖迪奥斯卡间谍网"
 tro_the_zudiosca_network_desc: "随着地中海的大战愈演愈烈，特拉武尼亚国将借助其与犹太及拉古萨商人家族（即 #italic 祖迪奥斯卡 #!）之间的独特关系，建立一套精密的间谍网络。由于这些商人能够自由往来于山地腹地与亚得里亚港口之间，他们能为特拉武尼亚的指挥官们提供外国军队实时动向的情报。这支"
 zta_guerillas_of_the_scrub: "灌木丛游击战术"
 zta_guerillas_of_the_scrub_desc: "喀斯特地带的#italic 戈拉布尔达#!（意为裸山）为传统入侵军队提供不了任何掩护，却为我们敏捷的战士提供了无尽的藏身之所和伏击点。我们发展出了一套精妙的“夜袭”战术学说，我们的族人借着夜色的完全掩护，从峰顶悄然下山，屠戮敌军营地，破坏其火炮，并在黎明第一缕曙光前消失于迷雾之中。这种心理战确保任何占领低地的军队都因持续的恐惧和体力消耗而被逼至疯狂边缘，使得我们的领土成为他们最终选择放弃的噩梦，同时也使我们的军队能适应任何敌对环境。"
 hum_modernized_national_redoubt: "现代化国家堡垒"
 hum_modernized_national_redoubt_desc: "我们提炼了数个世纪的山地战争经验，实施了“国家堡垒”学说，将每个主要城市和关隘整合进一个统一的、协调一致的防御计划中。利用现代西方弹道学和制图学，我们已将火炮和补给预先安置在隐秘的山间藏匿处。这一学说确保即使河谷失守，国家仍能作为一个主权的军事实体在高峰上继续运作，以永久的、积极的抵抗嘲弄任何占领者，使得任何帝国占领胡姆的成本都高得令人却步。"
 military_modernization: "军队现代化"
 military_modernization_desc: "我们的人民铭记着国家的诞生，当时周围强权环伺，安全威胁无时不在。这种持久的警惕性塑造了一种毫不动摇的战备文化，确保我们的武装力量成为对抗逆境的盾牌。无畏且受人尊敬的士兵将我们从潜在的猎物转变为强大的对手，震慑那些敢于侵犯我们主权的势力。"
 ser_the_sumadija_agrarian_revolution: "舒马迪亚农业革命"
 ser_the_sumadija_agrarian_revolution_desc: "塞尔维亚的农民阶层通过采纳从西方学来的农耕技术，掀起了一场属于自己的文化与经济革命。这使 $sumadija_province$ 茂密的森林转变为高产的农业腹地。这种粮食的盈余不仅养活了人民，更引发了一场人口的大爆发。一个丰衣足食的塞尔维亚民族充满活力与雄心，为军队提供了庞大的年轻健壮兵源，也形成了坚实的国内市场，使塞尔维亚成为中巴尔干地区首屈一指的经济引擎。"
 tro_the_constitution_of_trebinje: "特雷比涅宪法"
 tro_the_constitution_of_trebinje_desc: "国家将颁布一部成文宪法，限制君主权力，并赋予“贵族与公民议会”各项权利。这将是巴尔干地区最早的自由主义文件之一，旨在防止内部革命，并向欧洲列强展示特拉武尼亚是一个“文明国家”，从而确保我们主权的延续。"
 zta_the_code_of_the_black_mountain: "《黑山法典》"
 zta_the_code_of_the_black_mountain_desc: "为了最终从一个松散的部落联盟过渡到一个现代化的中央集权国家，我们引入了一部严谨且不妥协的新法典，严格压制血仇这一破坏性传统，并集中了#italic 弗拉迪卡#!的权力。通过用统一的国家司法和税收体系取代古老的部落法，我们将相互竞争的部族统一为一个单一、团结的国家实体。这项改革将山区分散且常显混乱的能量，转变为一支专注、纪律严明的国家力量，能够以现代欧洲强国的效率，收复我们祖先的海岸线并扩大我们的疆域。"
 #Slovene Shared
 slovene_the_freising_fragments: "弗赖辛手稿"
 slovene_the_freising_fragments_desc: "借鉴弗赖辛手稿的古老传统，斯洛文尼亚农民和当地神职人员保持了一种独特的语言认同，这种认同在神圣罗马帝国的教会结构中得以存续。这一早期的方言传统，作为一个沉默但坚韧的文化锚点，将#italic 文迪什#!语使用者与他们的日耳曼和意大利邻居区分开来。"
 slovene_the_dukes_chair_tradition: "公爵宝座传统"
 slovene_the_dukes_chair_tradition_desc: "采用斯洛文尼亚语举行卡林西亚公爵就职的古老仪式，意味着统治者与被统治者之间存在一种独特的契约关系。这一传统强化了拥有特定法律权利的自由农民阶层理念，防止农村人口被完全剥夺权利。这种社会契约在我们的领土上形成了稳定且高效的农业基础。"
 slovene_the_tabor_defense_system: "塔博尔防御体系"
 slovene_the_tabor_defense_system_desc: "作为一个边境民族，我们始终处于面对敌人的危险境地，因此我们的人民发展出了 #italic Tabor #! ——一种设防的教堂围场，村民可携带牲畜与贵重物品在此避难。这种分散化的防御体系使每个村庄都成为一座小型堡垒，迫使任何入侵者陷入他们无法取胜的艰苦消耗战。"
 slovene_the_catechismus_and_abecedarium: "《教理问答》与《启蒙读本》"
 slovene_the_catechismus_and_abecedarium_desc: "我们民族的灵魂通过印刷机找到了它的声音。普里莫日·特鲁巴尔出版了#italic 《教理问答》与《启蒙读本》#!，这是有史以来第一批用斯洛文尼亚语印刷的书籍。这远不止是一个宗教行为；这是一场政治地震，它将我们各种方言统一成单一的文学语言。通过用人民自己的语言为他们提供识字工具，我们锻造了一种超越旧封建公国边界的统一民族意识。这种思想觉醒加速了现代行政制度的采纳，并使得新思想的火花能够迅速从教堂传播到农田。"
 slovene_the_glory_of_carniola: "卡尼奥拉的荣光"
 slovene_the_glory_of_carniola_desc: "追随扬内兹·瓦伊卡德·瓦尔瓦索尔的脚步，我们已着手进行一项宏大的工程，测绘我们领土的地理、历史与风俗。凭借这份调查，国家对其资源与人民的了解前所未有，能够公正地征税，并迅速将新发明付诸实用。"
 slovene_the_zois_circle: "佐伊斯圈子"
 slovene_the_zois_circle_desc: "西格蒙德·佐伊斯男爵，一位富有的矿物学家和艺术赞助人，组织了一个知识分子圈子，引领了斯洛文尼亚民族觉醒。该团体在高雅文化、科学和政治中推广斯洛文尼亚语的使用，有效地将一种“农民语言”转变成了现代国家的语言。"
 #Slovene Unique
 cli_the_counts_ambition: "伯爵的雄心"
 cli_the_counts_ambition_desc: "凭借高超的联姻外交手腕与对神圣罗马皇帝矢志不渝的忠诚，我们已从地方领主跃升为神圣罗马帝国的亲王。通过与邻国王室缔结姻亲关系，我们已将自己确立为不可或缺的“南方之盾”。如此迅猛的崛起，使我们足以要求欧洲最显赫的世家对我们以礼相待。"
 cli_the_sanneck_condottieri: "桑内克雇佣兵"
 cli_the_sanneck_condottieri_desc: "在我们成为帝国诸侯之前，齐利家族以其桑内克骑士的锋利刀锋而闻名。通过为匈牙利王室和帝国皇室率领精锐雇佣兵连队征战达尔马提亚和意大利，我们将“战争契约”变成了提升家族地位的工具。这种职业军事服务的传统使我们能够以较低的成本，拥有出类拔萃的雇佣兵。"
 cli_the_last_counts_legacy: "末代伯爵的遗产"
 cli_the_last_counts_legacy_desc: "在深度介入邻国继承权之争后，我们将自己作为王国主要保护者、监督帝国南部边疆的法律主张正式化。即便我们的对手试图吞并我们的土地，我们已确保的行政架构和“帝国直属”地位，仍使我们领土成为区域治理的特权中心。"
 cli_the_windic_march_arsenal: "温迪克边区军需坊"
 cli_the_windic_march_arsenal_desc: "作为南部边疆的主要领主，我们将自己的领地转变为一条永久性的军事供应链。通过资助萨维尼亚河谷的铁器工场，我们确保我们的重装骑兵和边防军配备了内奥地利锻造的最精良的板甲和火器。这种本土化的军事工业减少了对外国武器的依赖，并使我们的军团时刻保持战备状态。"
 cli_the_marble_palaces_of_celje: "采列的大理石宫殿"
 cli_the_marble_palaces_of_celje_desc: "为彰显我们作为帝国诸侯的地位，我们邀请了意大利建筑师以宏伟的巴洛克风格重新设计我们的城市中心。这些宏伟的宫殿和公共广场不仅仅是用来炫耀；它们更是行政中心化的枢纽，国家的官僚机构在此实现专业化。我们首都的辉煌壮丽足以震慑外国使节和国内对手，巩固我们合法的统治权。"
 cli_the_modernization_of_a_nation: "国家现代化"
 cli_the_modernization_of_a_nation_desc: "我们祖先的山谷已从封建牧地转变为我们王国的工业心脏。我们通过建立大规模工业以及利用现代蒸汽动力磨坊来加工周围山区的原木和铁矿石，抓住了这一势头。这种快速的现代化创造了一个新的技术劳工和工程师阶层，将我们的首都变成了一个推动整个国家进入工业时代的技术创新中心。"
 #Balkan Shared
 expansionist_ambitions: "扩张野心"
 expansionist_ambitions_desc: "随着巴尔干半岛的分裂，许多正在崛起的巴尔干势力开始向外扩张。雄心勃勃的统治者们利用拜占庭的衰弱，致力于将不同土地整合到同一个更强大的王权之下。"
 poklisars: "波克利萨"
 poklisars_desc: "自建国以来，我们一直把目光投向国外。无论是为了建立有利可图的贸易路线，安抚强大的邻国并建立联盟，还是是建立强有力的伙伴关系来对付共同的敌人。波克利萨是我们赋予这些执行这些使命的大使们的名称。"
 balkan_hajduks: "黑盗客"
 balkan_hajduks_desc: "随着中世纪王国中央权威在帝国扩张的重压下分崩离析，社会真空由哈伊杜克填补。这些人原本是普通的#italic 牛贩子#!和季节性劳工，现已转变为一个半传奇般的游击战士和拦路强盗阶层。他们以小规模、有纪律的部队行动，由#italic 哈兰巴夏#!领导，遵循强调忠诚和保护当地农民的严格内部行为准则。在我们看来，他们不过是匪徒；对平民而言，他们是抵御外来税吏劫掠和无序入侵者的唯一屏障。将他们的存在纳入我们的军事体系，我们就能让这支在边境的无法无天中愈发强大的力量为己所用。"
 cro_pandurs_recruitment: "潘杜尔兵"
 cro_pandurs_recruitment_desc: "国家必须驾驭边疆的凶悍之风，而不被其混乱所吞噬。$cro_pandurs_recruitment$ 原本不过是夜间巡警与地方治安力量，如今经富有魅力的首领重组，已成为职业化的轻步兵。这些士兵在欧洲战场上令人闻风丧胆，并伴有自己的军乐队。他们精通小规模战斗，擅长袭扰补给线、掩护主力部队及心理战。他们的纪律或许参差不齐，对劫掠的热衷亦颇为旺盛，但在君主手中，他们是一件灵活的威慑利器。"
 #Carpathia Region Advances
 #Hungarian Shared
 hun_composite_light_cavalry: "复合轻骑兵"
 hun_composite_light_cavalry_desc: "由马弓手和迅捷骑兵组成的轻骑兵是我们军队的主力。它在1278年的马希费尔德大决战中展现了其价值，并将再次率领我们的军队走向辉煌。"
 hun_multi_culturalism: "文化融汇之国"
 hun_multi_culturalism_desc: "喀尔巴阡山脉不仅仅是匈牙利人的家园。斯洛伐克人、鲁塞尼亚人、库曼人、德意志人以及许多其他不同的少数民族都将我们的国度视为家。因此，我们的政府自然能够从容地吸纳多元文化，融汇为一体。"
 hun_reformed_coinage: "改革铸币"
 hun_reformed_coinage_desc: "为了支付我们新的职业军队的费用，我们将需要稳定的收入来源。改革钱币，使其重量标准化，能帮助我们弄清楚人们到底要交多少税，大大减轻我国财政压力。"
 hun_hungarian_reformation_intro: "宗教改革的思想如野火般席卷欧洲，因此必然会传入我们的土地。"
 hun_hungarian_reformation: "匈牙利改革"
 hun_hungarian_reformation_desc: "$hun_hungarian_reformation_intro$我们的土地已经长期受到外部势力的威胁。通过加入宗教改革，放弃像走狗那样追随教宗的义务，我们至少可以打破压迫我们的枷锁之一！"
 hun_the_catholic_shield: "天主之盾"
 hun_the_catholic_shield_desc: "$hun_hungarian_reformation_intro$然而，信徒们依然坚定。天主和祂的忠实仆人将抵挡住异端的疯狂。"
 hun_realm_of_many_religions: "诸宗教之国"
 hun_realm_of_many_religions_desc: "$hun_hungarian_reformation_intro$唉，宗教改革使家庭分裂，将昔日的朋友变成敌人，并威胁到许多国家的稳定。然而，我们的王国深知不能成为神学斗争的牺牲品。毕竟，我们是一个多宗教的民族和王国。"
 hun_hungarian_hussars: "$a_hungarian_hussars$"
 hun_hungarian_hussars_desc: "$a_hungarian_hussars_desc$"
 hun_revolutionized_military_tactics: "革命性军事战术"
 hun_revolutionized_military_tactics_desc: "随着军事技术的进步，战场上的战术也在不断变化。为了我们国家的生存，我们必须跟上陆地战争不断变革的特点。"
 hun_strengthened_towns: "强化城镇"
 hun_strengthened_towns_desc: "决定匈牙利财富的关键是城镇。如果能够让贵族精心呵护城市，他们所带来源源不断的贸易税就能为我们所用。"
 #Hungarian Unique
 hun_castle_warriors: "城堡战士"
 hun_castle_warriors_desc: "城堡战士是我国的一个特殊阶层，他们有义务在皇家城堡区为当地的#italic 伊什潘#!提供军事服务。在王国的早期，这些享有特权的土地所有者保持着独特的地位，捍卫他们的领土，同时珍惜他们的世袭权利。"
 hun_renaissance_knowledge: "文艺复兴君王"
 hun_renaissance_knowledge_desc: "农民们认为自己的统治者是公正的，因为官方明令保护他们不受权贵的苛求和其他压迫。 $HUN$ 的统治者是一位真正的 $renaissance$ 王公：他既是成功的军事统帅和行政官员，又是杰出的语言学家，更是开明的艺术赞助人。"
 hun_found_the_black_army: "建立黑军"
 hun_found_the_black_army_desc: "深受尤利乌斯·恺撒著作的影响，匈牙利深谙用兵之道。士兵们骁勇善战，以至于在日后的战斗中被敌方冠名为黑军。"
 hun_bulwark_of_christianity: "基督之盾"
 hun_bulwark_of_christianity_desc: "随着土耳其在南方的势力逐渐减弱，匈牙利王国的人民有责任保护基督教世界免受其威胁。昭告天下，我们不会逃避自己的责任。"
 hun_curtailed_peasantry: "剥夺农民阶级的自由"
 hun_curtailed_peasantry_desc: "匈牙利缺乏便于防守的天险之地。匈牙利的荒野平原将我们的祖先吸引到这里，是因为这儿是劫掠西方，而非用于防守的最佳地点。如果要保卫匈牙利，我们就需要资源。如果我们同意让地主们把农民和土地更紧密地联系在一起，他们就会确保农民更努力地工作。"
 hun_hungarian_unity: "匈牙利团结"
 hun_hungarian_unity_desc: "尽管我们的人民面临许多外部威胁，匈牙利人的精神和意志仍未被打破。匈牙利人的团结对我们骄傲的士兵们来说是巨大的激励，他们将誓死保卫我们的家园。"
 #Romanian Shared
 wallachian_tradition: "瓦拉几亚的南迁"
 wallachian_tradition_desc: "根据历史传统，拉杜·内格鲁率众翻越喀尔巴阡山脉，自特兰西瓦尼亚南下，建立了瓦拉几亚公国，其他公国的建立也流传着类似的故事。这场“奠基迁徙”，即#italic Descălecatul#!，象征着罗马尼亚精英的迁移，以及第一个不受外族霸权支配的主权罗马尼亚之地（Țara Românească）的建立。此事件标志着一个有别于周边帝国、却又深深植根于东正教与拉丁传统的独特国家的诞生。"
 romanian_the_foundation_of_the_voivodeship_tradition: "督军领地传统的奠基"
 romanian_the_foundation_of_the_voivodeship_tradition_desc: "从部落首领向总督制度的转变，标志着罗马尼亚政治文化迈入成熟的中世纪体系。这种#italic 总督式的#!军事领袖模式融合了斯拉夫与拜占庭影响，又具本土特色，将选举君主制与王朝继承结合，为国家提供清晰的军事等级体系，使其能够以平等主权身份与邻国交涉。"
 romanian_the_letter_of_neacsu: "内亚克舒的书信"
 romanian_the_letter_of_neacsu_desc: "肯普隆格的内亚克舒的书信是现存最早的罗马尼亚语文献。这一从斯拉夫语向本土语言的转变，表明精英与商人阶层民族意识的觉醒，为统一的罗马尼亚文学文化奠定基础。"
 romanian_the_postelnic_bureaucracy: "宫廷总管官僚制"
 romanian_the_postelnic_bureaucracy_desc: "我们通过扩大宫廷总管职能，建立专业化外交与财政书记体系，实现中央行政现代化。借鉴西方法院制度并严密记录财政与条约，我们已超越传统封建治理。这种效率使统治者能最大化多瑙河贸易收益，同时维持庞大间谍网络。"
 romanian_the_romanian_renaissance: "罗马尼亚文艺复兴"
 romanian_the_romanian_renaissance_desc: "在富裕家族推动下，我国文化进入勃兰科温风格的繁荣期。宏伟宫殿与人文主义学者将强调罗马血统，使我们成为斯拉夫与马扎尔世界中的“拉丁孤岛”，提升我们在西欧的外交地位。"
 romanian_the_scoala_ardeleana: "阿尔迪亚尔学派"
 romanian_the_scoala_ardeleana_desc: "这一诞生于特兰西瓦尼亚的思想运动结合了启蒙理性与民族自豪，通过缜密的文化与语言学研究证明本民族的拉丁起源。该学派编写了首批现代语法书与史书，激发了民族主义精神，使各地人民认同为统一民族，终结中世纪的地方分裂。"
 #Romanian Unique
 mol_the_moldavian_road: "摩尔达维亚走廊"
 mol_the_moldavian_road_desc: "通过掌控连接波罗的海与黑海的贸易路线，我们成为北欧毛皮与蜂蜡贸易枢纽。我们给予斯拉夫商人与德意志市民广泛的特权，允许他们在我们的关税城镇定居，确保每支从波罗的海通往南部热那亚港口的商队都向我们的国库缴纳高额过路费。凭借这笔商业财富，我们得以供养一支职业化的宫廷卫队，并修建石质防御工事，而无需通过征税迫使自由农民揭竿而起。"
 rmn_the_descendants_of_trajan: "图拉真后裔"
 rmn_the_descendants_of_trajan_desc: "随着敌潮退去，喀尔巴阡山脉地区的拉丁语族群认识到了他们共同的罗马遗产。通过将“瓦拉几人”的口述历史与法律传统成文化，我们建立了一种超越零散#italic 公国#!与督军领地的统一文化认同。这种#italic 罗马性#!提供了将山地各氏族凝聚为一个统一国家所需的意识形态黏合剂。"
 tra_the_transylvanian_autonomy: "特兰西瓦尼亚自治"
 tra_the_transylvanian_autonomy_desc: "虽然特兰西瓦尼亚仍是匈牙利王国的一部分，但当地的罗马尼亚人、萨克森人和匈牙利贵族在其各自的督军治下，都维持着独特的区域自治，并和睦相处。这种共同治理让各方在显著差异之下，仍能保留各自独特的信仰与习俗。如此内部协作确保了喀尔巴阡山脉腹地一定程度的内部和平与多元文化。"
 wallachian_heritage: "波萨达战役的遗产"
 wallachian_heritage_desc: "1330年，巴萨拉布一世击败了匈牙利国王查理·罗贝尔，通过卓越的山地战术确保了瓦拉几亚的独立。这场胜利证明了一支规模较小、本土化的部队能够利用险峻的喀尔巴阡山口瓦解帝国军队，为接下来的五个世纪树立了军事先例。我们的部队现在是游击战专家，利用地形在入侵者抵达多瑙河平原之前就让他们付出代价。"
 mol_the_banner_of_the_golden_bull: "金玺诏书之旗"
 mol_the_banner_of_the_golden_bull_desc: "我们在金玺诏书之旗的引领下，摩尔达维亚将成为东方壁垒，成功抵御外敌入侵。我们将开创为每一场军事胜利修建一座修道院的传统，从而营造一片遍布宗教圣地的景观。这种宗教热忱与军事纪律的融合，确保我军将士能以十字军般的信念作战。"
 rmn_the_foundation_of_the_metropolises: "都主教区的建立"
 rmn_the_foundation_of_the_metropolises_desc: "通过确保在我国土地上建立都主教区，我们实现了精神与政治上不受外部教会影响的独立。这种宗教自主使罗马尼亚王冠能够将教会作为行政臂膀，借助宗教权力的奖惩确保大贵族的忠诚。教会成为罗马尼亚文字与法律的首要赞助者。"
 tra_unio_trium_nationum: "三公国同盟"
 tra_unio_trium_nationum_desc: "为应对农民起义的威胁，我国上层阶级组建了“三族联盟”。这一复杂而僵化的法律体系虽然将占多数的平民排除在外，却为本地区打造了一个高度稳定、坚固而忠诚的行政核心。王权正是从这种团结中，汲取了一支可靠的城市与封建职业军队的基础。"
 boyar_regime: "大公官署的设立"
 boyar_regime_desc: "大公官署的正式化，使得土地授予与外交条约得以用教会斯拉夫语乃至后来的罗马尼亚语系统记录。这一官僚体系的演进，将使大公们能够更高效地向乡村农民征收赋税，并在欧洲各宫廷中维持常驻外交使团。这标志着从部落军事社会向成熟中世纪国家的转变。"
 mol_the_great_military_reforms: "军事大改革"
 mol_the_great_military_reforms_desc: "为抗衡敌军的人数优势，我们重组军队，组建了#italic大军（Oastea Mare）#!。通过向#italic自耕农（Răzeși）#!（直接向大公效忠服役的自由持地农民）授予土地，我们打造出一支忠诚、自备装备的步兵核心，他们如同保卫自家土地的地主一般英勇作战。这一制度确保即便波雅尔贵族动摇不定，大公手中仍握有一支可靠而庞大的百战之师。"
 rmn_the_byzantine_heirs: "拜占庭的继承者"
 rmn_the_byzantine_heirs_desc: "受君士坦丁堡荣耀的感召，罗马尼亚大公们致力于成为阿索斯山与东正教世界的主要赞助者。通过将自身定位为拜占庭文化遗产的继承者，我们吸引了来自巴尔干各地的学者与艺术家。如今的罗马尼亚“比拜占庭更拜占庭”，成为东正教世界的信仰之都。"
 tra_the_transylvanian_trade_guilds: "特兰西瓦尼亚贸易行会"
 tra_the_transylvanian_trade_guilds_desc: "在喀尔巴阡弧地带繁华的城镇中，来自主要文化群体的商人开始组建自己的贸易行会与互助会，彼此间时而竞争、时而合作。这推动了部分人口的城市化进程，催生了资助学校、印刷书籍的中产阶级。这种经济崛起将使我国走出乡村生活的蒙昧与封闭，迈向思想与全球贸易的市场。"
 wal_the_order_of_the_dragon_influence: "龙骑士团的影响"
 wal_the_order_of_the_dragon_influence_desc: "我们将在瓦拉几亚引入残酷心理战与绝对法治的文化。通过清除腐败的大贵族并施行严苛的法典，我们将巩固大公权力，并将军队改造为唯督军之命是从的中央集权力量。这种冷酷的威名将成为震慑敌方力量的首要武器。"
 mol_the_chronicles_of_grigore_ureche: "《格里戈雷·乌雷凯编年史》"
 mol_the_chronicles_of_grigore_ureche_desc: "一个知识性自我觉醒的变革时代已然来临！我国的高级大贵族首次开始以罗马尼亚本民族语言系统性地记载我们民族的历史。通过科学地证明我们与罗马尼亚同胞共享的拉丁起源与语言传承，我们将国家的基础从纯粹的宗教认同转变为现代的、基于语言与历史的认同。这场文化觉醒加强了大公的国内合法性，并为我们的外交官提供了在欧洲宫廷间宣示主权所需的历史论据。历史已成为国家手中的武器。"
 rmn_cartea_romaneasca_de_invetatura: "《罗马尼亚语法律教本》"
 rmn_cartea_romaneasca_de_invetatura_desc: "我们颁布了本国首部印刷成册的法典#italic 《罗马尼亚语法律教本》#!。这部里程碑式的著作旨在统一王国的法律实践，并使其与更广泛的欧洲司法体系接轨。通过推动司法职业化与刑罚标准化，我们削弱了地方大贵族的专断权力，强化了王权的中央权威，使我国成为东正教法治与秩序的典范。"
 tra_the_edict_of_torda: "托尔达敕令"
 tra_the_edict_of_torda_desc: "在一个日益被血腥狂热的宗教战争所撕裂的欧洲，特兰西瓦尼亚勇敢地颁布了《托尔达敕令》，这是西方世界第一部确立普遍宗教宽容的法律。通过允许天主教徒、路德派、加尔文派与一位论派在同一法律框架下共存，我们避免了神圣罗马帝国各地所见的内部社会崩溃与内战纷争。这种前所未有的和平，使我们的公国成为流离失所的学者、科学家与商人的避风港，极大加快了我们吸纳现代行政改革与多元文化影响的步伐。宽容已成为我们最大的战略资本。"
 cunning_diplomacy: "灵活外交"
 cunning_diplomacy_desc: "在我们富有远见的统治者领导下，我们将完成这一地缘政治上的不可能任务：让所有罗马尼亚领土统一在同一面旗帜之下。这一“伟大构想”将唤醒深藏的民族意识，使其超越古老的封建疆界，向世界证明，一个统一的#italic 达契亚#!能够凭借自身力量屹立于欧洲大国之林。这一神圣愿景将为区域霸权奠定法律、军事和象征意义上的先例，同时也赋予我们一项永恒的历史使命——最终团结所有罗马尼亚人。"
 mol_the_moldovan_enlightment: "摩尔达维亚启蒙运动"
 mol_the_moldovan_enlightment_desc: "迪米特里耶·坎特米尔崛起为享誉欧洲的博学者，将早期启蒙运动的激进思想直接引入我国宫廷。通过向西方世界系统阐述本地区复杂的历史、音乐与地理，我们在变幻莫测的东欧政治棋局中获得了深远的战略优势。我们已从中世纪边疆藩属转型为科学化管理的国家，在政治与军事上日益寻求西方现代化改革的启示。知识已成为摩尔达维亚王权治下的新硬通货。"
 rmn_the_bible_of_bucharest: "布加勒斯特圣经"
 rmn_the_bible_of_bucharest_desc: "首部罗马尼亚语《圣经》全译本的出版，从根本上将我们的文化认同从礼拜用的教会斯拉夫语转向了鲜活的民间语言。这部里程碑式的著作起到了语言统一者的作用，将瓦拉几亚、摩尔达维亚与特兰西瓦尼亚的方言融合为一种统一的文学语言。通过让普通民众也能接触神圣的经典，我们为跨越三个公国政治边界的统一民族意识奠定了基础。"
 tra_the_vauban_transylvanian_bastion_synthesis: "复合式堡垒"
 tra_the_vauban_transylvanian_bastion_synthesis_desc: "随着火药时代臻于鼎盛，我们采用了一种独特的军事建筑流派，将最新的意大利与法兰西 #italic 棱堡式（Trace Italienne）#! 设计，因地制宜地融入喀尔巴阡山区崎岖的石灰岩地貌之中。我们的主要行政中心已被重新加固，建有低矮倾斜的棱堡，足以承受重型攻城炮火的轰击。与过去厚重的石墙不同，这些由泥土与砖石构筑的现代工事专为主动防御而设计，为公国日益壮大的炮兵部队提供了交叉火力网。这一防御方针确保任何入侵之敌，在威胁到国家腹地之前，都将在一场场旷日持久、代价高昂的围城战中流血耗尽。"
 wal_the_diplomat_schools: "外交官学校"
 wal_the_diplomat_schools_desc: "在高级官员的赞助下，我们建立了圣萨瓦公学院，聘请意大利与希腊教授来到都城。这笔对高等教育的投资培养出一代“哲人外交官”，他们既能在拉丁修辞学上侃侃而谈，也能娴熟地与邻国谈判密约。通过将都城打造为知识灯塔，我们确保了我国的行政精英仍是巴尔干地区最杰出的，能够在任何博弈中智胜对手。"
 mol_the_cotnari_and_odobesti_wines: "科特纳里与奥多贝什蒂葡萄酒"
 mol_the_cotnari_and_odobesti_wines_desc: "葡萄园始终是摩尔达维亚最宝贵的财富，科特纳里出产的甜白葡萄酒在欧洲宫廷中足以媲美托卡伊葡萄酒。我们已制定了首部葡萄酒分级制度，将“摩尔达维亚珍珠”的出口确立为国家利益；现在是采取行动的时候了。这项奢侈品贸易将为大公宫廷从周边市场带来大量硬通货，资助我们首都中那些富丽堂皇的宫殿。"
 rmn_the_pandur_militias: "潘杜尔民兵"
 rmn_the_pandur_militias_desc: "我国涌现出一支名为#italic 潘杜尔#!的部队，这是一支由自由农民与小贵族组成、极具战斗热情的非常规步兵力量。这些士兵擅长游击战与在多瑙河沼泽地带快速机动，证明了本土的、受意识形态驱动的力量足以对抗敌人与大贵族的亲兵。潘杜尔传统将成为未来第一支职业化、现代化的本土罗马尼亚国民军的蓝本。"
 tra_the_national_mining_academy: "国家矿业学院"
 tra_the_national_mining_academy_desc: "我们建立了世界级的科研机构，用以监督我国多座山脉中黄金、白银与盐矿的集约化开采。通过应用最新的矿物学与化学技术，我们将特兰西瓦尼亚打造成了该地区的主要金库。这种对工业的重视催生了一个由专业工程师和技术官僚组成的新阶层，他们以科学般的精准管理国家资源，确保了长期的经济稳定。"
 wal_the_abolition_of_serfdom: "废除农奴制"
 wal_the_abolition_of_serfdom_desc: "在我国改革派人士的推动下，我们迈出了激进的一步，比许多邻国更早以法律形式废除了农奴制。通过将农民从“财产”转变为“纳税臣民”，我们集中了国家的财政权力，打破了乡村波雅尔贵族的绝对控制。这场社会变革拉近了大公与民众的距离，也解放出一批更具流动性、经济上更为活跃的人口，为现代化中央政府提供了有力支撑。"
 #Slovak Shared
 slovak_the_urban_syncretism: "城市融合"
 slovak_the_urban_syncretism_desc: "蒙古入侵的破坏之后，国家鼓励#italic 齐普塞尔#!日耳曼移民的到来，以重建被摧毁的经济。与许多其他殖民运动不同，这些移民与当地斯拉夫人口深度融合，产生了一种被称为“萨克森法”的独特文化与法律混合体。传统的融合创造了一个多语言、高度熟练的城市中产阶层，他们将斯拉夫的农业韧性与德国在采矿和冶金方面的技术专长结合在一起。这种共享知识的氛围培育了一种创新文化，不同语言群体之间的思想交流加速了新技术和行政做法的传播，使斯洛伐克城镇成为该地区最进步的城镇之一。"
 slovak_the_slovensky_vernacular: "斯洛伐克方言"
 slovak_the_slovensky_vernacular_desc: "有别于捷克语或波兰语的本地斯拉夫方言，正日益频繁地出现在官方城镇记录与法律文书之中，尤以《日利纳之书》最为显著。若我们加以扶持，这一发展或将预示着一种正式斯洛伐克行政语言的诞生，使地方政府能够更有效地与农民及下层贵族沟通，而不必完全依赖拉丁语或德语。通过将本地语言规范为书面行政用语，国家将使其法庭更加公正、高效，并加强平民与政府之间的纽带。这种早期的语言规范化，将赋予我们一种民族认同感，使外国行政者更难以凌驾于我们的习俗之上。"
 slovak_the_slovak_rome: "斯洛伐克罗马"
 slovak_the_slovak_rome_desc: "特尔纳瓦城已成为斯洛伐克的知识与精神圣地。这促成了盛期巴洛克建筑的蓬勃发展，城市天际线布满了宏伟的教堂和学术厅堂。斯拉夫语书籍的印刷业在此地空前繁荣，使特尔纳瓦成为对抗异端和异教徒思想的主要核心。通过加强这种文化凝聚，我们将确保斯拉夫人口在极端生存威胁期间，始终深深扎根于一种成熟、有文化且宗教统一的身份认同之中。"
 slovak_the_slovak_sappers: "斯洛伐克工兵"
 slovak_the_slovak_sappers_desc: "斯洛伐克矿石山脉的深层采矿传统培养出了欧洲最熟练的地下工程师。国家已经开始征召这些#italic 斯洛伐克矿工#!编入专门的“工兵与矿工”团。他们在黑暗中对于黑火药、隧道挖掘和结构支撑有着天然的熟悉，使他们在攻城战中极具威慑力。他们可以从地下摧毁敌方堡垒，或者用普通劳工一半的时间修筑防御战壕。这种“矿工士兵”的身份将把斯洛伐克劳动力转变为一项战略军事资产，使得占领斯洛伐克采矿城镇成为任何想要掌握十七世纪攻城术的帝国的优先事项。"
 slovak_the_highland_architecture: "高地建筑"
 slovak_the_highland_architecture_desc: "一种独特的建筑文化正在兴起，德意志人精湛的石作工艺与古老的斯拉夫重木构造传统在此交汇融合，由此诞生了“铰接式木教堂”。从文化上看，这代表着一种“抵抗的建筑”：这些建筑能在山区迅速建成，却暗藏防御设计，如加固的橡木百叶窗与抬高的入口。这种文化审美，诞生于长期猜忌不安之境中对美的渴求，塑造出一片彰显文化卓越的风貌。借鉴这一经验，我们可将这些技艺化为我国的荣耀所在。"
 slovak_the_slovak_romanticism: "斯洛伐克浪漫主义"
 slovak_the_slovak_romanticism_desc: "新一代浪漫主义知识分子正将语言基础转向中部斯洛伐克方言，创造出一种正在成为标准语的语言版本。这不仅仅是文学上的转变，更是一场激进的政治运动，因为他们利用诗歌、民歌和新闻来提升我们的身份认同。这种浪漫主义热情将把每一项文化产出都变成对国家伟大的呼唤，把农民阶层和新兴中产阶级团结在共同的民族自豪感中。"
 #Slovak Unique
 slo_the_law_of_the_seven_towns: "七镇法"
 slo_the_law_of_the_seven_towns_desc: "安茹的查理一世国王深知北部领地的巨大战略与财政价值，遂绕开桀骜不驯的地方男爵，向班斯卡什佳夫尼察与克雷姆尼察等主要矿业中心授予特殊的“皇家自由城镇”地位。这些定居点脱离了地方领主的管辖，直接隶属于#italic王室财务官（Tavernicus）#!之下，在山区矿场与王座之间建立起直接的financial纽带。这一法律框架培育出一个忠诚的城市化税基，以及一个独立于封建土地权利之外运作的德意志—斯拉夫商人阶层。这一行政转变确保了我国拥有稳定可靠的现钱来源，为中央政府稳定国家、使王室官僚体系专业化的努力提供了资金。"
 slo_the_slovak_castle_system: "斯洛伐克城堡体系"
 slo_the_slovak_castle_system_desc: "面对四面受敌的局势，我们将沿多瑙河与喀尔巴阡山麓建立一条正式的军事边境。我们将授权 #italic 泽曼 #! （拥有土地的下层斯拉夫贵族）充当常设的世袭边防守卫。这些战士居住在 #italic 庄园堡 #! （设防的庄园宅邸）中，可免除部分税赋，以换取他们随时整装待发的义务。这将造就一个熟知当地地形、坚韧不拔的武士农民阶层，为国家提供一道廉价而积极的防御屏障，在外敌入侵波及王国腹地之前将其冲击力消解殆尽。"
 slo_the_universitas_istropolitana: "伊斯特罗波利坦大学"
 slo_the_universitas_istropolitana_desc: "我们正处于人文主义运动的高峰期，这意味着我们有一个很好的机会在布拉迪斯拉发建立一所大学（伊斯特罗波利坦学院），吸引包括意大利、波兰和德意志各邦学者在内的时代最杰出人才。课程将重点教授天文学、数学和罗马法等新兴科学，推动国家外交与法律体系的现代化进程。这场知识繁荣将确保统治精英系统学习欧洲最前沿的政治哲学思想，使国家能够以专业技巧应对文艺复兴时期错综复杂的国际关系。这所大学还将作为天文学研究的中心，使斯洛伐克的土地处于开始席卷整个大陆的科学革命的前沿。"
 slo_the_mining_captancy: "矿业长辖区"
 slo_the_mining_captancy_desc: "我国群山矿藏丰富，为此国家将通过设于班斯卡什佳夫尼察的#italic矿务局（Bergkammer）#!，正式确立对“七城”的中央管理。通过任命一位王室#italic矿务长官（Berghauptmann）#!，政府将直接掌控金银的开采与冶炼，剥夺地方封建领主自古享有的矿产权利。这一产业的专业化管理，将使先进的排水技术与更深矿井开采得以推行，确保金银不断流入王室铸币厂。这源源不断的金银之流，将充盈我们的国库，使斯洛伐克矿山成为我们不可或缺的支柱。"
 slo_the_social_banditry: "社会性匪患"
 slo_the_social_banditry_desc: "几十年来，以尤拉伊·亚诺希克为代表的#italic 高地亡命徒#!这一文化形象，已经成为我们人民心中的军事理想。这便是“森林文化”——年轻人逃入山区，对封建压迫展开游击战。尽管我们视其为匪徒，民众却将他们视为守护者。这一文化原型在斯洛伐克民族心理中培育出游击思维：对中央权威的不信任，以及精通焦土战术与山地伏击的能力；若我们能成功将其纳入国家体系，这些特质将为我们所用。"
 slo_the_hron_valley_industries: "赫龙河谷工业"
 slo_the_hron_valley_industries_desc: "大规模铁矿的发现与蒸汽技术的飞速发展，使赫龙河与瓦赫河流域诞生了最早的现代工业区。我国必须大力补贴铁工厂与纺织工厂的建设，以减少对外国进口的依赖。这股追求工业自主的浪潮，将把传统的农业景观转变为制造业重镇，赋予我们与其他列强一较高下的工具。随着劳动力向这些新兴中心集中，本地区的社会结构也将开始转变，催生出一个城市工人阶层，并在下个世纪成为一股新的政治力量。"
 #Iberia Region Advances
 #Andalusi Shared
 gra_nasrid_art: "奈斯尔艺术"
 gra_nasrid_art_desc: "安达卢斯的工匠们承袭了倭马亚与穆瓦希德千年以来在灰泥雕饰、瓷砖镶嵌与 #italic 穆卡纳斯（muqarnas）#! 穹顶工艺上的精湛造诣。他们在阿尔罕布拉宫与优素福一世的优素福尼亚学院的作品，吸引了来自非斯与开罗的大师前来研习格拉纳达风格，我们的陶器、丝绸与镶嵌兵器在地中海各地均卖出高价。即便我国疆域不断收缩，工匠们仍能为国库带来充盈的财源。"
 gra_razzias: "奈斯尔袭击"
 gra_razzias_desc: "自倭马亚时代以来， #italic 突袭（ḡazwa） #! （深入基督教领地劫掠牲畜、俘虏与财物的快速骑兵袭击）便一直是边境诸酋长国的命脉所系。我方突袭队趁夜翻越山脉，以五十至两百人为一队，席卷守备薄弱的河谷平原，待卡斯蒂利亚的 #italic 民兵队（mesnadas） #! 集结应战之前便已撤退。这种劫掠经济使基督教边境地区日益贫困、受制于我方，同时也为格拉纳达带来了奴隶、牲畜与贡品。"
 gra_expand_qanahs: "扩建运河"
 gra_expand_qanahs_desc: "#italic坎儿井（Qanāh）#!（经倭马亚哈里发传自波斯的地下重力引水渠）使维加平原的干旱荒地化为果园与桑树林。我们将这一水网从内华达山脉的融雪水源一直延伸至阿尔拜辛、阿尔穆涅卡尔与阿尔梅里亚，水权则由古老的#italic水务法庭（Tribunal de las Aguas）#!加以维护。得益于这些渠道的灌溉，我们的田地所产的丰饶收成，远胜莫雷纳山脉以北之地，并养育了安达卢斯其他地方所不及的稠密人口。"
 gra_expand_the_frontier: "拓展疆域"
 gra_expand_the_frontier_desc: "自从我们王国建立以来，我们的领土一直在缩小。然而，我们现在处于强势地位，我们不仅可以收复失地，而且可以梦想扩张我们的领土。"
 gra_modernized_economy: "现代化经济"
 gra_modernized_economy_desc: "现代社会要求一个现代化的经济，能够在竞争更加激烈的世界中繁荣发展。通过升级我们的基础设施，提升技术和流程的效率，我们将能够用相同的资源生产更多的产品。"
 gra_ghazawat: "奈斯尔的圣战"
 gra_ghazawat_desc: "在一个君主们以开明大臣与常备军衡量国力的时代，我们的国家却将每一场战役宣告为 #italic Ḡazawāt #!（圣战），这是一种将统治者与臣民结合于同一宗教与军事事业中的神圣之战。#italic 'ulamā #! 在每周五的布道中宣讲动员，阿尔拜辛、安特克拉和洛哈的民兵们每周依照埃米尔颁布的敕令操练，这些敕令向战死边境者许诺天堂。对圣战的信仰赋予格拉纳达民兵一种欧洲世俗君主国鲜有的狂热。"
 #Andalusi Unique
 gra_banu_nasr: "奈斯尔家族"
 gra_banu_nasr_desc: "我们是哈兹拉吉部落的后裔，先知穆罕默德的同伴萨阿德·伊本·奥贝达的血脉。我们王朝的开创者穆罕默德一世控制着包括格拉纳达、哈恩、阿尔梅里亚和马拉加在内的领土，尽管其中一些土地落入了基督教势力之手。从那时起，我们一直在顽强地抵抗他们的进攻，我们将继续以祖先之力进行抵抗。"
 gra_skillful_envoys: "精通外交的使者"
 gra_skillful_envoys_desc: "纳斯里德埃米尔国之所以能比其他任何泰法王国多存续两个世纪，靠的并非军队，而是我方使节在卡斯蒂利亚、阿拉贡、马林王朝与热那亚宫廷中展现的灵活手腕。 #italic 秘密书记官 #! ，即我们的机密大臣，维持着一套常设的密码通信网络，并在突尼斯到图卢兹之间布下一张兼营情报的商人网络。正是凭借这种外交技巧，我们在六次卡斯蒂利亚王位更迭与三次马林王朝入侵中纵横捭阖、挑动基督教诸国互相争斗，为我们的埃米尔国换来了一个又一个十年的存续。"
 gra_muttavia_armies: "雇佣军队"
 gra_muttavia_armies_desc: "格拉纳达的人口有限，可征召的人也不够多，不足以有效地保卫我们的国家。然而，我们缺乏人手，却有充足的金钱，可以用来购买外国的武器，让他们为我们效力。"
 gra_adaptative_trade: "适应性贸易"
 gra_adaptative_trade_desc: "我们作为$christian_ADJ$国家和$muslim_ADJ$国家之间中介的优越地位正受到挑战。这一威胁可以成为我们贸易方式现代化的契机，并恢复我们作为遥远市场和欧洲之间的纽带的地位。"
 gra_a_strong_rule: "强有力的统治"
 gra_a_strong_rule_desc: "三代人以来的纳斯里德继承危机——穆罕默德六世、穆罕默德八世与穆罕默德九世相继被废黜——使得 #italic 萨拉吉家族 #! （阿本塞拉赫人）与阿济兹家族之间的派系争斗成为宫廷政治的主旋律。在一位强势埃米尔的统治下，这些敌对宗族被限制在礼仪性职位之内，阿尔罕布拉宫卫队由忠诚的穆德哈尔人重新编组，大维齐尔之职则专授予才能卓著之人，而非凭血统继承。这种王朝的巩固终结了那场内耗——它所夺走的城市，比历次卡斯蒂利亚战役加起来还要多。"
 gra_a_new_golden_era: "新黄金时代"
 gra_a_new_golden_era_desc: "安达卢斯曾是伊斯兰世界的智识中心，孕育了伊本·鲁世德对亚里士多德的注疏、阿尔萨赫拉维的外科全书，以及伊本·图费勒的哲理小说 #italic 哈义·本·叶格赞 #!。我们将在格拉纳达重建 #italic 优素福学院 #!，召回来自非斯与特莱姆森的学者，并将西班牙与法兰西新近的科学著作译为阿拉伯文，供我方医师与天文学家研习。这场智识复兴证明，安达卢斯学问之灯只是黯淡，从未熄灭，并使我们的国家在整个马格里布对人心的影响力，是任何基督教邻邦都无法比拟的。"
 #Aragonese Shared
 aragonese_montaneses: "洛斯蒙塔涅塞斯"
 aragonese_montaneses_desc: "哈卡与索夫拉尔韦周边的比利牛斯高地山谷，锻造出一批坚毅的山地战士，世称 #italic 山民 #!，他们自山麓长驱南下，为我王国在收复失地运动中赢得了最早的军事声誉。我们的山民自幼即受训在崎岖地形作战，习惯了漫长的冬季战役，行动比历来与之对阵的平原征召兵更为迅捷，打击更为凌厉。正是这些山谷孕育出机动步兵，其坚韧耐劳塑造了我们所进行的每一场战役。"
 aragonese_pyrenean_passes: "比利牛斯山口"
 aragonese_pyrenean_passes_desc: "比利牛斯山脉中段的高地隘口——松波特、龙塞斯瓦列斯以及若干季节性小径——汇聚了每一车贝亚恩羊毛、加斯科涅葡萄酒与朗格多克呢绒，由此进入我们的市场，而哈卡与坎弗兰克的税关自十一世纪以来便为王室征收这一商路的份额。通过修缮道路、驻守瞭望塔，并沿这些 #italic 王家大道 #! 统一关税核算，我们将地理上的偶然转化为商业上的垄断。对比利牛斯山通行要道的掌控，吸引着山脉两侧的商人汇聚于我们的集市，也让王室金库持续获得可靠的过境税收入。"
 aragonese_castillos_frontera: "边塞城堡"
 aragonese_castillos_frontera_desc: "我王国与安达卢斯之间的边境，遍布着 #italic 边境堡垒 #! ：洛阿雷、蒙松、阿尔瓦拉辛，以及散布在每一处可守高地上的数十座小型要塞。每座堡垒皆由当地公社自费维持，王室仅出资修筑城墙并委派一名统领，由此形成一张防御网络，任何入侵者都难以在不付出高昂围城代价的情况下轻易突破。这套体系使我方领土成为代价高昂的入侵目标，往往在我方野战军队出阵应战之前，便已令来犯之敌元气大伤。"
 aragonese_salinas_reales: "王室盐场"
 aragonese_salinas_reales_desc: "我们的王室长期以来一直垄断着纳瓦尔、萨连特和雷莫利诺斯等产盐山谷，并将开采权承包给直接对国库负责的王室官员。#italic 王室盐场#!提供了稳定的收入，补充了不稳定的农业税收，并为我们的国家提供了应付歉收所需的流动资金。这种矿产收益使我们的政府格外具有偿付能力，并使我们不必持续依赖议会来获取紧急资金。"
 aragonese_sociedad_economica: "阿拉贡经济协会"
 aragonese_sociedad_economica_desc: "创立于萨拉戈萨的#italic阿拉贡王家经济之友会#!，汇聚了我方开明的公民——教士、贵族与市民皆在其列——共同探讨农业改良、制造业与商业改革。该会通过小册子、奖励竞赛以及与欧洲各地改革者的直接通信，传播实用知识。这一爱国改良者的网络提升了其成员所涉及的每一个行业的生产力，使我们的省份成为伊比利亚半岛最为低调却卓有成效的现代化引擎之一。"
 aragonese_foralism: "福埃罗主义"
 aragonese_foralism_desc: "数道敕令剥夺了我王国的中世纪制度之后，一批法学家、历史学家与地方贵族组成的持续运动，致力于保存业已失落的 #italic fueros #! 的记忆与实际效力。 #italic Foralist #! 的事业借助地方认同，与中央政府谈判，争取恢复特权、设立地方法院，并承认独特的法律习俗。我们持之以恒的压力，使马德里无法将我们的省份视为又一个千篇一律的行政单位，我们的制度也因此在波旁王朝历次改制的冲击下得以延续。"
 #Aragonese Unique
 ara_conquest_of_the_ebro: "埃布罗征服"
 ara_conquest_of_the_ebro_desc: "从比利牛斯山谷向 #italic Ebro#! 平原的进军，是世代边境战争的加冕之作：韦斯卡于1096年陷落，#italic Alfonso el Batallador#! 于1118年攻克萨拉戈萨，使之成为王国的都城。我方轻装边境步兵，久经南征跋涉的磨炼，又精于攻克摩尔人城墙环绕的城镇，总能将每一座攻陷的要塞化为下一轮攻势的据点。我们的军队是为攻城拔寨而生，而非为驰骋海上而生。"
 ara_desperta_ferro: "醒来吧钢铁！"
 ara_desperta_ferro_desc: "“#italic醒来吧，铁！#!”（意为“唤醒钢铁！”）是$a_almogavars$的战吼，呐喊之际伴以长矛柄与标枪撞击燧石，迸出火星，以壮冲锋之势。1229年詹姆斯一世征服马略卡时曾闻此声，罗歇·德弗洛尔麾下加泰罗尼亚雇佣军在博斯普鲁斯山坡上亦曾高呼此语，在漫长的地中海世纪中，阿拉贡的每一场战役皆回荡着这一呐喊。这一战场仪式使我方步兵在接战之前凝聚为齐声呐喊的一体，所产生的震慑效果，令拜占庭人、西西里人与法兰西人无不为之胆寒。"
 ara_a_mediterranean_trade_power: "地中海贸易强国"
 ara_a_mediterranean_trade_power_desc: "自1164年阿拉贡与巴塞罗那伯国缔结王朝联合以来，我们的王室便以巴塞罗那、瓦伦西亚与帕尔马为支点，建立起一套地中海商业体系。#italic 海事领事法庭 #!，这个世界上第一个常设海事贸易法庭，依照加泰罗尼亚法律裁决从比萨到法马古斯塔的各类纠纷，我方领事的权威遍布从亚历山大港到布鲁日的每一个主要港口。这一商业与法律体系，使阿拉贡王室成为意大利银行、非洲黄金与黎凡特香料之间不可或缺的中间人。"
 ara_dinero_jaques: "哈卡银币"
 ara_dinero_jaques_desc: "自阿拉贡最初几位国王以来，在#italic 哈卡#!铸造的#italic 哈卡银币#!成为王国信得过的货币，其含银量由议会严格保护，抵御王室每一次贬值的诱惑。稳健的货币使王室能廉价借贷，商人能诚实结算，国库能征收收入而不受剪边和可疑钱币的困扰。这种货币稳定比任何单一税种都更可靠地支撑着王国的财政。"
 ara_diputacion_del_general: "总代表院"
 ara_diputacion_del_general_desc: "我王国常设的行政机构——#italic 总议会 #!——源自蒙松议会，是一个常设委员会，负责征收一般补助金、在历届议会休会期间捍卫王国的特权法，并在与王室的持续对话中代表四大等级。我们将通过总议会的会计机构调拨王国的税收，借助其各个委员会资助公共工程，并在其常设议事厅中受理贵族世家的诉求。由于总议会从不休会，我们的王国得以保持其议会记忆与账目的井然有序，而王室治下的其他领地每逢议会召开却都要从头开始。"
 ara_overseas_realms: "海外王国"
 ara_overseas_realms_desc: "在海的那一边，王室汇聚起一片星罗棋布的领地——1282年赢得的西西里、1324年赢得的撒丁岛，以及#italic“宽宏者”阿方索#!治下的那不勒斯——每一处皆由总督治理，作为独立的王国保留下来，而非被径直并吞。我们以确认其特权、保留本地官署并对其自治权宽以相待的方式，将这些领地与王朝维系在一起，使其贵族阶层发现，效忠所得的利益远胜过叛乱。这一海外王国的联盟，为王朝带来了稳定的贡赋，以及一连串任何对手都难以轻易撼动的地中海据点。"
 ara_carinena_vineyards: "卡里涅纳葡萄园"
 ara_carinena_vineyards_desc: "#italic 卡里涅纳#!和#italic 博尔哈原野#!的石质梯田，在干燥的内陆阳光炙烤和#italic 西尔佐#!风吹拂下，产出一种深色、强劲的葡萄酒，其声誉远超王国之外。修道院的酒窖和城镇行会沿着埃布罗洼地扩张种植，葡萄酒经由河运和骡队运往王室的宫廷和要塞。这种强健的葡萄栽培将贫瘠的高地土壤转化为内陆王国最有价值和最持久的出口品之一。"
 ara_stronger_united: "团结更强大"
 ara_stronger_united_desc: "自1164年与巴塞罗那伯国缔结王朝联合以来，王室便以复合君主国的形式运作，其下各个构成王国——阿拉贡本土、加泰罗尼亚、瓦伦西亚、马略卡与撒丁岛——各自保留着本地的 #italic Corts#! 、特权法与货币。为了在不废除这些自由权利的前提下强化中央行政，我们将整顿王室秘书处，统一各领地的王室税收征管，并强化 #italic Lloctinent General#! 一职——此职在国王缺席时代为摄政。这一行政整合，使王室能以欧洲任何其他复合君主国都望尘莫及的速度协调战争、税收与外交事务。"
 ara_basilica_del_pilar: "圣柱圣母宗座圣殿"
 ara_basilica_del_pilar_desc: "在萨拉戈萨矗立着宏伟的巴洛克式#italic 圣柱圣母宗座圣殿#!，建于传说中圣母向圣雅各伯显现的柱子之上，吸引着来自整个西班牙各地的朝圣者。王室为教堂的司铎团提供资助，在重大节日在其塔楼下举行游行，并将自身的合法性包裹在半岛最受尊崇的圣母玛丽亚敬礼之中。这种神圣威望将神职人员和民众与王朝紧密相连，并使王国的统治神圣化，绝非单纯的法律所能比拟。"
 ara_protection_of_the_little_folk: "保护平民百姓"
 ara_protection_of_the_little_folk_desc: "我们的士兵希望知道，如果他们在战斗中牺牲，他们的亲人是否会得到妥善照顾。阿拉贡将履行其职责，通过为战死者的遗孤设立工场体系来实现这一点。"
 ara_mossos_esquadra: "警卫队"
 ara_mossos_esquadra_desc: "#italic 乡团警卫队 #!，由佩雷·安东·韦西亚纳组建的乡民小队，是一支从所保护的当地社区中招募而来的常设乡村治安力量。他们不隶属于正规军事体系，而是直接向加泰罗尼亚总督负责，在王室军队难以有效巡查的地形中追捕盗匪与走私者。这支地方治安力量在不招致民众反感的情况下，保障了公国境内贸易路线的安全，为其他伊比利亚王国日后效仿树立了范例。"
 ara_zaragoza_industry: "萨拉戈萨产业"
 ara_zaragoza_industry_desc: "随着内陆王国进入工业时代，萨拉戈萨和埃布罗走廊的各城镇涌现出糖厂、面粉厂、铸造厂和铁路工场。帝国运河的水源、连接该市与坎塔布里亚海岸和地中海的新铁路线，以及离开土地的稳定移民潮，共同滋养了不断增长的制造业经济。这次工业觉醒将一度以农业为主的腹地提升为一个可与旧沿海中心相媲美的生产地区。"
 #Basque Shared
 nav_transatlantic_whaling: "跨大西洋捕鲸"
 nav_transatlantic_whaling_desc: "四个世纪以来，圣塞瓦斯蒂安、贝尔梅奥和莱克蒂奥的渔民一直在坎塔布连海猎捕比斯开露脊鲸，不断完善鱼叉、炼油锅与小艇追猎之术。由于近海过度捕猎，我们的船队如今远航至纽芬兰与贝尔岛海峡，在红湾建起季节性的 #italic txalupa #! 炼油场，将鲸油贩售给英格兰与汉萨同盟。我们的远洋捕鲸者使巴斯克的身影早在其他欧洲船队定期涉足北美水域之前数十年，便已存在于大西洋之上。"
 nav_fearless_seamen: "无畏海员"
 nav_fearless_seamen_desc: "比利牛斯山与大海之间，巴斯克海岸几乎没有可耕之地，我们沿海的乡民长久以来都依靠比斯开湾谋生，或捕鱼，或经商，或领航。来自毕尔巴鄂、帕萨亚和巴约讷的水手，几乎撑起了半个欧洲商船队的船员班底：胡安·德拉科萨为哥伦布的 #italic 圣玛利亚号 #! 领航，胡安·塞巴斯蒂安·埃尔卡诺完成了人类首次环球航行，安德烈斯·德乌尔达内塔则绘出了从马尼拉返航阿卡普尔科的太平洋航线。如此集中的航海人才，使讲巴斯克语的港口成为伊比利亚航海术不可或缺的摇篮。"
 nav_people_of_the_sea: "海上人民"
 nav_people_of_the_sea_desc: "从毕尔巴鄂、帕萨亚到圣塞瓦斯蒂安的港口，讲巴斯克语的船员在伊比利亚每一次伟大的航海发现中，都占据着远超我们这小小人口比例所应有的席位。我们的领航员绘制出纽芬兰浅滩的最初海图，我们的水手长为马尼拉大帆船装配索具，我们的炮手更是以不成比例的人数操纵着西班牙无敌舰队的重炮战舰。谁掌握了巴斯克的港口，谁便能仅凭我们的海港组建一支远航诸洋的海军。"
 nav_an_industrious_folk: "勤劳的民族"
 nav_an_industrious_folk_desc: "比斯开和吉普斯夸的山谷蕴藏着西欧最丰富的铁矿，自罗马时代起便在被称为 #italic ferrerías#! 的小型水力锻坊中开采冶炼。我们的铁匠所炼出的比斯开钢坚硬无比，托莱多的刀剑、特西奥步兵的火绳枪，乃至每一艘西班牙大帆船的船锚，无不仰赖巴斯克的冶铁匠人。这条从采矿、冶炼到锻造一气呵成的产业链，赋予了巴斯克地区远超其人口规模的工业分量。"
 nav_shipyards_ironworks: "船厂和铁厂"
 nav_shipyards_ironworks_desc: "帕萨亚、奥里奥和穆特里库的造船厂，与德瓦河及卡达瓜河谷的炼铁厂，共同构成了一条延续数百年的工业带，靠比利牛斯木炭与比斯开铁矿石维系运转。我们引入瓦隆与瑞典的锻造技术对锻坊加以革新，在帕萨亚的 #italic 皇家船厂 #! 依荷兰图纸铺设龙骨，并聘请曼努埃尔·德科西奥为王室设计新式三层甲板战列舰。这一工业集群仍是伊比利亚半岛唯一能够在本地区内，从原矿一路造出一等战列舰并下水的地方。"
 nav_royal_basque_society: "巴斯克皇家社团"
 nav_royal_basque_society_desc: "由佩尼亚弗洛里达伯爵及一众巴斯克贵族在贝尔加拉创立的 #italic 巴斯克祖国之友皇家学会 #! ，是伊比利亚半岛第一所近代学术团体。其设于贝尔加拉的 #italic 爱国学院 #! 向地方乡绅之子传授近代化学、数学与经济学，并培养出了福斯托与胡安·何塞·埃尔乌亚尔兄弟，他们首次在历史上成功分离出钨元素。借此，巴斯克诸省在西班牙王国更广阔的启蒙运动中，站到了科学与经济的前沿。"
 #Basque Unique
 nav_shipbuiling_experts: "造船专家"
 nav_shipbuiling_experts_desc: "帕萨亚、穆特里库和莱克蒂奥的造船匠人，自十三世纪起便为外国客户建造捕鲸双桅船、鲱鱼渔船与跨大西洋货运船。纳瓦拉王室特许我们的造船厂统一船体设计规格，采用本地橡木、比利牛斯铁件以及能够快速替换受损船体的建造工艺。凭借众多船厂同时运作，纳瓦拉成为伊比利亚诸王国中唯一能在接到预警后一季之内，便下水全副武装战舰编队的国度。"
 nav_memories_reconquista: "收复失地运动的记忆"
 nav_memories_reconquista_desc: "1212年拉斯纳瓦斯-德托洛萨战役中，强者桑乔七世亲自率领他的骑士们突破了阿尔莫哈德中心，夺取了现在装饰纳瓦拉王室徽章的哈里发黄金帐篷链。尽管后来被卡斯蒂利亚和阿拉贡的崛起所包围，但纳瓦拉的每一代骑士都在桑乔冲锋的传奇故事中成长，并致力于在半岛上的每一次重大基督教运动中作战。十字军传奇赋予纳瓦拉王冠在伊比利亚半岛上的神圣地位，这是其小规模的国力所无法单独获得的。"
 nav_a_renaissance_realm: "文艺复兴王国"
 nav_a_renaissance_realm_desc: "跨越比利牛斯山两侧，纳瓦拉通过两条渠道接受文艺复兴人文主义的熏陶：北方来自波尔多与巴黎的大学，南方则来自萨拉曼卡与阿尔卡拉。让三世·达尔布雷与弗瓦的凯瑟琳的宫廷与伊拉斯谟通信往来，延请佩德罗·德阿塔拉比亚讲授哲学，并资助了首部巴斯克语出版物——贝尔纳特·埃切帕雷的 #italic 巴斯克语初阶 #!。这种开放的思想氛围，造就了一个虽小却兼具世界眼光的精英阶层，使其独具调和法兰西与卡斯蒂利亚人文主义的才能。"
 nav_always_ready: "时刻准备"
 nav_always_ready_desc: "我们曾是一个四面环敌的小国，这深刻影响了我们国家性格的发展以及我们与世界交往的方式。因此，我们始终保持警惕，准备在威胁初现时立即作出反应。"
 nav_chartered_councils: "特许议会"
 nav_chartered_councils_desc: "#italic Foruak#!（卡斯蒂利亚语称 #italic Fueros#!），即管辖各巴斯克省份的习惯法体系，以地方自治换取对纳瓦拉王室的效忠。各历史领地选出对其总议会——#italic Junta General#! ——负责的 #italic Diputación Foral#!，同时仍隶属于更广泛的王室行政体系之下。通过这些议会，王室得以征收赋税、征募士兵，而不致引发那种曾摧毁其他伊比利亚中央集权计划的、捍卫特权法的激烈反抗。"
 nav_basque_ferocity: "$basque$民风彪悍"
 nav_basque_ferocity_desc: "不必说龙塞斯瓦列斯战役，甚至$french$人仍在为之哭泣；也不必说纳瓦拉连所参与的那些战役——早在之前，我们的民族就号称为勇猛的战士。我们绝不能让敌人忘了这一点。"
 nav_mercantile_expansion: "商业扩张"
 nav_mercantile_expansion_desc: "自中世纪早期起，纳瓦拉商人便沿着比利牛斯羊毛商路，在卡斯蒂利亚、阿拉贡与法兰西大西洋港口之间建立起商贸网络。如今，透过巴约讷与图德拉的领事馆，我们的商行经手卡斯蒂利亚美利奴羊毛输往佛兰德斯、英格兰呢绒输入伊比利亚内陆，以及波尔多集市上白银与香料的交易。由此，这个被群山环抱、不临海洋的王国，在从海峡到格拉纳达的每一条大陆主要商路上，都占据了一席之地。"
 nav_navarrese_defense_force: "纳瓦拉国防军"
 nav_navarrese_defense_force_desc: "随着时间的推移，我们的邻国不断增强实力，对我们的国家生存构成了越来越大的威胁。为应对这一问题，我们将设立一个军事部门，旨在不降低新兵的质量的情况下，增加士兵数量，增强我们的军队。"
 nav_adept_traders: "精通贸易的商人"
 nav_adept_traders_desc: "我们船只的质量、商人的熟练程度以及流程的有效性使我们的贸易业务极具盈利能力。这将为我们的国家带来大量财富，从而增强国家实力。"
 nav_the_national_military_academy: "国家军事学院"
 nav_the_national_military_academy_desc: "随着军队的职业化，为新兵建立教育中心的必要性变得显而易见。我们将组织一批经验丰富的士兵，向他们传授战争的秘诀，使他们成为我们军队的先锋。"
 nav_efficient_bureaucracy: "高效的官僚机构"
 nav_efficient_bureaucracy_desc: "潘普洛纳的 #italic 皇家会计院 #! ，作为伊比利亚半岛第一个常设王室财政机构，留下了半岛上持续时间最长的财政档案。我们以启蒙时代的复式记账法革新其工作程序，引入仿效法兰西王室做法的编号档案制度，并委任奥尼亚蒂大学培养的法学家出任高级会计要职。凭借这些方法，王室得以极为精确地从王国各地征收赋税。"
 nav_riflemen_march: "来复枪兵行进"
 nav_riflemen_march_desc: "线膛枪与火帽的引入，要求一种全新的散兵战术，即在疏开队形中进行散兵游击战，而比利牛斯的地形早已令纳瓦拉步兵世代习得此道。潘普洛纳皇家学院正在发展 #italic 猎兵行军式 #! ，这是一种快速行军节奏与散开操练法，可令整营士兵在保持建制凝聚力的同时，借掩护推进。这一操典使纳瓦拉轻步兵成为所有适应线膛武器战争现实的伊比利亚军队效仿的典范。"
 #Castilian Shared
 cas_repoblaciones: "重新定居"
 cas_repoblaciones_desc: "我们祖先的征服使国家变得地广人稀，对于其他区域的移民需求大增，尤其是南方的安达卢西亚，自1267年穆斯林居民被驱逐后，该地区人口严重不足。"
 cas_castilian_navy: "卡斯蒂利亚海军"
 cas_castilian_navy_desc: "我们半岛的海岸线，一边是险恶的坎塔布连海，一边是大西洋门户，故而我们的海军长久以来都是国家存续的支柱，由 #italic 卡斯蒂利亚大提督 #! 一职统领。从桑坦德到塞维利亚，我们的造船厂在中世纪晚期的坎塔布连战争中组建的舰队屡屡压倒英格兰与汉萨同盟的分舰队，佩罗·尼尼奥等将领的劫掠之手甚至远至泰晤士河。这支海军已为即将到来的海洋帝国时代所需的深海征战做好了准备。"
 cas_masters_of_the_orders: "骑士团的统领"
 cas_masters_of_the_orders_desc: "随着收复失地运动的完成，卡斯蒂利亚三大军事修会— #italic Santiago #! 、 #italic Calatrava #! 与 #italic Alcántara #! —虽坐拥广袤领地与私人军队，却已再无敌可战。天主教双王已悄然展开兼并，由王室接掌各修会的大团长之位，将其领地、 #italic encomiendas #! 与金银财富一并纳入王室掌控。此举消灭了卡斯蒂利亚境内王权最后的强劲对手，并为王室的常备力量增添了无可匹敌的军事与宗教实力。"
 cas_marine_infantry: "卡斯蒂利亚海军步兵"
 cas_marine_infantry_desc: "查理五世皇帝创建了 #italic 那不勒斯海上老兵连 #! ，这是世界上第一支常备海军陆战队，专为地中海桨帆战船上服役的特西奥步兵提供船员。这些 #italic 海军陆战兵 #! 训练有素，擅长接舷混战中的近身厮杀，亦可驻守从奥兰到马尼拉的沿海要塞。这支常备突击力量成倍提升了每艘旗舰的价值，并守护着横跨两大洋的帝国沿海航线。"
 cas_pasos: "卡斯蒂利亚圣像"
 cas_pasos_desc: "圣周的 #italic 帕索 #! （在我们街道上游行的巨大受难雕塑场景）已成为卡斯蒂利亚巴洛克艺术最具代表性的民间艺术形式。巴利亚多利德的胡安·德·胡尼、格雷戈里奥·费尔南德斯等雕刻家以彩绘木雕技法，在十七世纪初将这一艺术形式推向顶峰，所塑人物栩栩如生，以至于人群在其经过时无不落泪。这种游行文化将市井百姓、教区兄弟会与王室联系在一起，共同成就一场任何新教国家都无法比拟的虔信盛典。"
 cas_canal_de_castilla: "卡斯蒂利亚运河"
 cas_canal_de_castilla_desc: "受欧洲各地用于商业和灌溉的水系启发，#italic 卡斯蒂利亚运河#!会将水从山区送到#italic 梅塞塔高原#!北部，灌溉旧卡斯蒂利亚的农田。这一工程壮举将提高我们田地的产量，创造出我们可以用于贸易的盈余，并充当将盈余运往出口港的通道。"
 #Castilian Unique
 cas_a_land_of_castles: "城堡之地"
 cas_a_land_of_castles_desc: "卡斯蒂利亚之名即源自那遍布杜罗河、塔霍河与瓜迪亚纳河沿岸每一处险要山脊之上的 #italic castillos #! （城堡、要塞与瞭望塔）网络，自九世纪梅塞塔高原再殖民以来便已如此。布尔戈斯、戈尔马斯、卡拉特拉瓦，以及 #italic Castillos de la Frontera #! 中数十座堡垒，皆由边境议会（#italic concejos #!）与依王室特许状行事的圣地亚哥骑士团、卡拉特拉瓦骑士团修建、驻守并维护。历经数世纪营建，我们的王室如今在每一道边境上都拥有一条坚固的要塞链。"
 cas_camino_de_santiago: "圣地亚哥朝圣之路"
 cas_camino_de_santiago_desc: "#italic 圣地亚哥之路#!从比利牛斯山脉向西穿过我们的王国，经布尔戈斯、卡里翁和莱昂通往孔波斯特拉，沿途的招待所和桥梁承载着源源不断的朝圣者、修士和外国商人。沿路的城镇因朝圣贸易而繁荣，其#italic 福埃罗#!吸引定居者在道路开通后重新填充梅塞塔高原。这条信仰与商业的伟大动脉为我们的边境城镇带来了人口，并将基督教北方连接成一条统一的信仰之路。"
 crd_city_of_the_caliphs: "哈里发之城"
 crd_city_of_the_caliphs_desc: "自929年起，倭马亚 #italic Ḵilāfa #! 使 #italic Madīnat Qurṭuba #! 成为拉丁与伊斯兰世界中最宏大、最博学的都市，街道铺石并设有照明，其大清真寺与 #italic Madīnat az-Zahrā #! 更是那个时代的奇迹。尽管费尔南多三世已于1236年将此地重归基督教统治，昔日的辉煌记忆仍萦绕于城中每一处角落，令其大主教辖区与领主们享有超乎寻常的威望。我们借助这座昔日声名远播——自巴格达至亚琛皆有所闻——的都城之名声行事，吸引着远超我们当下实力所能招致的学者、朝圣者与使节。"
 jae_llave_de_castilla: "卡斯蒂利亚之钥"
 jae_llave_de_castilla_desc: "哈恩的徽章上镌刻着 #italic Guarda y Defendimiento de los Reinos de Castilla #! 的铭文，这是其两百年来坚守对抗纳斯里德格拉纳达前线所赢得的荣誉。从城上方的圣卡塔利娜城堡到沿山脉布设的瞭望塔，这一圈边境 #italic castillos #! 将每一次袭击与反击都引导至边境线上。这一要塞化的边境角色使该王国成为卡斯蒂利亚南方的盾牌，也造就了一方久经战阵的百姓。"
 muc_huerta_acequias: "穆尔西亚灌溉园"
 muc_huerta_acequias_desc: "#italic 穆尔西亚灌溉园地 #! 由密布的 #italic \"阿塞基亚\" #! （由安达卢斯工程师设计的重力渠道）灌溉，至今仍由古老的 #italic \"贤人水务会\" #! 水务法庭管理，裁决一切关于塞古拉河水权分配的争端。我们的园丁在此种植桑树、柑橘与蔬菜，产量之丰，竟使若无此河便将是荒原的土地一年可获数季收成。这一灌溉网络令穆尔西亚平原成为整个伊比利亚半岛上出产最为集约丰饶的土地之一。"
 sev_guadalquivir_port: "瓜达尔基维尔河港"
 sev_guadalquivir_port_desc: "塞维利亚坐落于 #italic 瓜达尔基维尔河 #! 可通航水域的尽头，是伊比利亚唯一一座远洋船只可借潮水深入内陆五十英里、直抵城墙下停泊的大河港。我们的码头装运 #italic 阿尔哈拉费 #! 的油与酒、内陆的羊毛，又卸下来自远海的鱼货、布匹与木材。这座深入内陆的深水港使塞维利亚成为南方天然的商贸中心，也是河运与海运交汇之处。"
 tol_primate_see: "西班牙首席主教之座"
 tol_primate_see_desc: "托莱多大主教乃 #italic 全西班牙首席主教 #!，凭借711年前该城所召开的西哥特宗教会议之权柄，位居半岛教界之首。我们的主教区统辖西班牙最富庶的教区、庞大的下属主教网络，在教会与王室事务上皆拥有国王也不敢轻忽的话语权。我们在教会中的首席地位，为王国带来崇高的宗教权威与源源不断的什一税与庇护收益。"
 cas_cronicas_reales: "皇家编年史"
 cas_cronicas_reales_desc: "承袭“智者”阿方索十世#italic《西班牙史》#!的传统，王室书记处长期以来一直为每位君主的统治委托编纂官方编年史，诸如#italic《阿方索十一世纪事》#!、佩德罗·洛佩斯·德·阿亚拉记述特拉斯塔马拉内战的著作，以及埃尔南多·德尔·普尔加尔的#italic《天主教双王纪事》#!。将这些史料汇编为一部统一的王朝史，使每一位卡斯蒂利亚国王都得以追溯至阿斯图里亚斯的佩拉约，延续西哥特与收复失地运动一脉相承的世系。如此书写，我们王朝的正统性便不间断地上溯至佩拉约。"
 cas_santa_hermandad: "市镇兄弟会"
 cas_santa_hermandad_desc: "#italic“兄弟会”#!是卡斯蒂利亚各城镇结成的宣誓同盟，联合其民兵以巡查道路、追捕盗匪，在王室官员鞭长莫及之处维护国王的治安。这些同盟配备弩与长矛，听命于自己选出的#italic“市长”#!，组成一支常设的乡村治安力量，使不法贵族与歹徒皆心生忌惮。兄弟会由自身成员出资供养，使王国得以维持秩序而不加重王室财政负担。"
 crd_silver_filigree: "科尔多瓦银器工艺"
 crd_silver_filigree_desc: "科尔多瓦的金属匠人承袭了安达卢斯精湛的 #italic filigrana#! 技艺，将金银拉制成极细的丝线，编织成北方难觅其匹的花边般饰品、圣髑盒与珠宝。自旧清真寺旁的银匠区起，我们的工匠将这些商品供应至卡斯蒂利亚、热那亚与马格里布的奢侈品市场，所售之处皆价格不菲。这种精细工艺的汇聚使熟练工匠及其财富扎根于此城，也为其赢得了工艺重镇的美誉。"
 jae_olive_presses: "橄榄榨油坊"
 jae_olive_presses_desc: "哈恩起伏的乡野是一片连绵不绝的 #italic 橄榄之海 #! ，自罗马时代的贝提卡行省以来，这片橄榄林便为每座山丘披上银灰色的外衣。我们的 #italic 榨油坊 #! 将秋季的收成压榨成油，储存于巨大的陶制 #italic 坛罐 #! 之中，再由骡队运往半岛内外的各个市场。这种橄榄单一种植经济使本省成为南方首屈一指的产油地，也是其乡村财富的发动机。"
 muc_silk_looms: "穆尔西亚丝织机"
 muc_silk_looms_desc: "灌溉园地的桑林滋养着一派兴盛的 #italic 养蚕业 #!，城中及其 #italic 摩尔人聚居区 #! 的织机将缫出的生丝织成在王国各地备受珍视的塔夫绸与丝绒。这种承自安达卢斯的养蚕与织造之业，占据了本城大多数家庭从春季孵蚕到冬季售布的整个劳作周期。这一丝绸产业乃是穆尔西亚王国的标志性产业，也是其城市财富的根基。"
 sev_merchant_fairs: "商贾集市"
 sev_merchant_fairs_desc: "塞维利亚的集市以及热那亚、佛罗伦萨和布尔戈斯商人的常驻商站，使该城在发现印度之前很久就已是最繁忙的半岛市场。我们的交易所处理来自地中海和大西洋两岸商人的汇票、海运保险和货物，为该城带来了极少对手能匹敌的商业成熟度。这个已建立起来的商贾社群为此城即将到来的伟大奠定了金融基础。"
 tol_school_of_translators: "翻译学院"
 tol_school_of_translators_desc: "自十二世纪起，#italic 托莱多翻译学院#!在大主教及后来的王室赞助下，汇集基督教、犹太教和穆斯林学者，将阿拉伯世界的科学和哲学译为拉丁文和卡斯蒂利亚语。克雷莫纳的杰拉德、迈克尔·斯科特以及阿方索十世的团队为整个基督教世界复原了亚里士多德、托勒密、欧几里得和阿维森纳的医学。这项翻译工作使托莱多成为伊斯兰世界与拉丁世界之间伟大的知识门户，以及学者的吸引中心。"
 cas_audiencias: "王家高等法院"
 cas_audiencias_desc: "设于巴利亚多利德、后迁至格拉纳达的王室 #italic Audiencias #! 与 #italic Chancillerías #!，将国王的司法权带入王国的每一个角落，受理那些昔日在贪婪领主的法庭中便已无疾而终的上诉案件。其身着法袍、受训于萨拉曼卡罗马法学的 #italic oidores #!，使贵族与平民同受一套王室司法体系的约束。这一王室司法体制将王国紧密联系在一起，剥夺了各大家族滋生叛乱的司法独立性。"
 cas_new_world: "新大陆！"
 cas_new_world_desc: "哥伦布的登陆与圣菲协议已将大洋彼岸的土地与民众置于卡斯蒂利亚王室治下。我们将按照 #italic 监护征赋制 #! 的模式，向征服者与持照殖民者颁发特许状，授予他们使用原住民劳力的权利，以换取传教之责及自新土地所铸一切金属中五分之一的 #italic 王室五一税 #!。在所有欧洲列强之中，唯独卡斯蒂利亚已经具备一套足以吞并整个半球的现成统治体系。"
 crd_cordwainer_guilds: "科尔多瓦制革行会"
 crd_cordwainer_guilds_desc: "科尔多瓦之名成就了 #italic 科尔多瓦革 #! ，即柔软的山羊皮革，以及镀金彩绘的 #italic 瓜达梅西 #! 壁挂，其鞣制与雕镂技艺自哈里发国时代起便由行会精益求精。我们位于瓜达尔基维尔河畔的 #italic 制革匠 #! 与 #italic 瓜达梅西工匠 #! ，为欧洲每一座宫廷供应备受推崇的鞋履、书籍装帧、马具与皮革制品。这一标志性工艺支撑起稳定的出口贸易，其行会体制组织了本城大部分的劳动人手。"
 jae_linares_lead: "利纳雷斯铅矿"
 jae_linares_lead_desc: "自卡斯图罗矿山向迦太基与罗马供矿以来，#italic利纳雷斯#!与莫雷纳山脉一带便一直出产铅矿和含银方铅矿。我们的冶炼厂铸造出用于船体与屋顶包覆的生铅，以及填满王国火药库的铅弹。如今哈恩拥有一种与橄榄种植业截然不同的矿产财富，还有一支久经锤炼的矿工队伍。"
 muc_consulado_de_la_seda: "丝绸领事馆"
 muc_consulado_de_la_seda_desc: "穆尔西亚获得王室特许，设立 #italic 丝绸领事馆 #!：一个丝绸交易所兼商会，有权检验货品质量、裁决商业纠纷，并为经卡塔赫纳和阿利坎特港口运出的布匹提供融资。我们的商人由此获得一个获王室与外国买家承认的法人团体，拥有独立司法权与储备资金。这一机构将分散的家庭手工业转变为组织严密、影响深远的商业机器。"
 sev_casa_de_contratacion: "贸易厅"
 sev_casa_de_contratacion_desc: "王室在塞维利亚设立 #italic Casa de Contratación #! ，负责对每一艘驶往印第斯的船只、乘客与货物进行许可、登记与征税，并在其 #italic Padrón Real #! 中保存这片新海域的总图。我们的城市由此成为新大陆贸易唯一合法的门户，领航员须经考核，归航的金银须由王室官员过秤核验。这一垄断将两大洲的白银汇聚于一个河港之中，使塞维利亚成为欧洲最富庶、最令人艳羡的城市。"
 tol_toledan_steel: "托莱多钢"
 tol_toledan_steel_desc: "托莱多的铸剑匠锻造的刀剑自古代起便以其回火工艺享誉全欧洲，其秘密在于用塔霍河水淬火的细砂淬炼钢材，以及行会严密守护的技艺。我们的#italic 铸剑师#!，每人在剑身上打上自己的标记，为当时最优秀的士兵提供武器，并将剑出口至远达意大利和西印度群岛的宫廷。这种钢铁工艺使该城之名成为最高品质武器的代名词。"
 cas_armada_real: "王家舰队"
 cas_armada_real_desc: "#italic皇家舰队#!将坎塔布里亚、安达卢西亚与那不勒斯的大帆船与加莱船编为一支统一的王室舰队，护航运宝船队，并在从英吉利海峡到黎凡特的海域与敌争锋。我们在桑坦德的船坞与南方的兵工厂建造并整修巨舰，训练有素的船员在每场战事中操持舰船。一支常备王家海军将历史上王室的影响力延伸至远洋深处，远非任何分裂出去的继承国所能比拟。"
 cas_reform_of_millones: "百万税制改革"
 cas_reform_of_millones_desc: "#italic百万税#!最早由卡斯蒂利亚议会在无敌舰队覆灭之后批准征收，是对王国境内出售的四种日用品（酒、油、醋与肉）征收的一种间接消费税。此税每六年与十八个有表决权的城市协商续征一次，因其以消费而非财产为征税对象，从而绕开了贵族与教士的免税特权。这项单一改革在财政最为紧张之际几乎使王室常规收入翻倍，理想情况下足以支撑哈布斯堡王朝的战争机器延续至下一个世纪。"
 crd_andalusi_libraries: "安达卢斯图书馆"
 crd_andalusi_libraries_desc: "据称，哈卡姆二世的哈里发图书馆藏有四十万卷图书，而当时欧洲其他地方的书本以十计数；这些学问的残余碎片为我们重建后的城市的学校播下了种子。学者们聚集于此，抄写、翻译和教授科尔多瓦在黑暗世纪中保存下来的数学、医学和哲学。这种深厚的学术传承吸引了半岛各地的才俊，并提高了我们神职人员和法学家的识字率和社会地位。"
 jae_frontier_jinetes: "边境轻骑兵"
 jae_frontier_jinetes_desc: "世代与格拉纳达对峙，培养出一支 #italic jinetes#!，他们以 #italic a la jineta#! 骑乘，脚蹬短镫，手持皮制 #italic adarga#! 盾牌，配以数支标枪，这种战法正是师法摩尔敌人本身。我们的骑手以北方重枪骑士难以企及的速度与耐力进行突袭、伏击与掩护。我们的军队由此获得一支迅捷、历练且花费低廉的骑兵力量，极适于边境战争。"
 muc_baroque_processions: "巴洛克游行"
 muc_baroque_processions_desc: "穆尔西亚的圣周发展成为南方最盛大的宗教庆典之一，其#italic 兄弟会#!在挤满信众的街道上抬着雕刻的#italic 耶稣受难圣像#!游行。各兄弟会竞相委托制作更加生动的彩绘雕像，将贵族、行会成员和工人纳入同一场礼拜仪式剧场。这种游行文化以王室和教会都能庆祝和引导的形式，巩固了公民认同和大众虔诚。"
 sev_triana_ceramics: "特里亚纳陶器"
 sev_triana_ceramics_desc: "在河对岸的#italic 特里亚纳#!，数代陶工烧制锡釉#italic 花砖#!和陶器，铺就王国及其殖民地的地板、立面和祭台。我们的窑炉既生产继承自安达卢斯的几何穆德哈尔图案，也生产教堂和宫殿所需的新式具象面板。这种陶瓷工艺是一项独特且利润丰厚的行业，其产品远销半岛各地并横跨大西洋。"
 tol_imperial_cortes: "帝国议会"
 tol_imperial_cortes_desc: "作为古老的西哥特和帝国首都，也曾是查理五世本人的驻地，托莱多是国家举行庄严#italic 议会#!的首选之地，国王、高级神职人员、大贵族和各城市代表在此聚会。我们的议事厅承办决定特殊税收、解决继承问题和宣誓王储的重大集会。作为议会所在地的角色，将这座城市置于王室治理的礼仪和政治中心。"
 cas_consejo_de_castilla: "卡斯蒂利亚议会"
 cas_consejo_de_castilla_desc: "#italic卡斯蒂利亚议事会#!位居王国政府之巅，是一个由#italic法学士#!组成的议事机构，负责起草法律、监督法院与财政，并在国王出征或远行在外时以国王之名施政。其下属各委员会与#italic市政长官#!将王命贯彻至每一座城市、每一个省份，使王室意志化为行政实绩。通过这一议事会，王室施政之广度与延续性为国内任何其他机构所不能及。"
 cas_real_academia_espanola: "西班牙皇家语言学院"
 cas_real_academia_espanola_desc: "由比列纳侯爵胡安·曼努埃尔·费尔南德斯·帕切科仿照 #italic 法兰西学术院 #! 之例创立 #italic 西班牙皇家语言学院 #!，以 #italic 净化、规范并增辉 #!（意为净化、固定并赋予卡斯蒂利亚语以光辉）为院训。其首项重大成果——六卷本 #italic 权威词典 #!，确立了拼写、语法与用法的标准，将从加的斯到利马的每一位卡斯蒂利亚作家联系在一起。这一机构使我们的语言成为欧洲各大民族语言中规范程度最高、最易于传播的一种，既是文学的工具，也是帝国的工具。"
 crd_andalusian_horse: "安达卢西亚马"
 crd_andalusian_horse_desc: "瓜达尔基维尔河畔的草甸孕育出 #italic 安达卢西亚马 #! ：这种科尔多瓦战马以体格紧实有力、步态高昂、临阵沉稳而闻名，成为全欧洲最受珍视的坐骑。我们的种马场——后来正式纳入王室 #italic 皇家马厩 #! 之中——不断培育出一代代为当世各宫廷与骑兵争相求购的良种血统。这一育种事业既为王国提供了珍贵的出口商品，也为自身的骑兵中队供应了上佳的轻型战马。"
 jae_royal_mines: "王家矿山"
 jae_royal_mines_desc: "王室将莫雷纳山脉的银矿和铅矿区直接纳入管理，作为#italic 王家矿山#!，任命领薪监工，保障木材和劳动力供应，并将最丰富的矿脉保留给国库。南方的金银和铅直接流入王室金库，而非消散在私人冒险家手中。王室对矿山的控制将其转变为国家财政中可靠且不断增长的支柱。"
 muc_cartagena_arsenal: "卡塔赫纳兵工厂"
 muc_cartagena_arsenal_desc: "#italic卡塔赫纳#!深水良港四周群山环抱，被建设为王家海军#italic兵工厂#!，设有干船坞、制绳坊、铸造厂与地中海舰队专用的造船台。我们的基地建造、维修并补给着守护黎凡特海岸和驶往意大利的护航船队的分舰队。这座兵工厂使穆尔西亚王国成为君主国在西地中海海权中不可或缺的支柱。"
 sev_jabon_works: "肥皂工坊"
 sev_jabon_works_desc: "#italic 塞维利亚肥皂 #!（以阿尔哈拉费的橄榄油与沿海 #italic 盐碱草 #! 灰烬熬制而成的坚硬白皂）在特里亚纳的大型 #italic 皂坊 #! 中依王室特许生产，这一垄断权可追溯至收复失地运动时期。我们的皂坊出产王国家家户户所需的日用品，并大批运往印第斯销售。这一制造业将本地区丰裕的橄榄油转化为一项持久而有利可图的出口产业。"
 tol_royal_armory: "王家军械库"
 tol_royal_armory_desc: "托莱多的刀剑匠人长期组成行会，如今由王室整合为 #italic 皇家兵工厂 #! ，专责按统一检验标准为王室步兵装备武器。我们的兵工厂出产刀剑，并顺应时代需要生产刺刀与火器，其检验印记保证每件出厂武器的质量。这座皇家制造厂将这座城市古老的手艺直接与国家的军事需求联系在一起。"
 cas_royal_arsenals: "王家兵工厂"
 cas_royal_arsenals_desc: "王家兵工厂和#italic 王家武器工厂#!将王国的枪械匠和铸炮匠聚集到王室制造业中，按照统一检验标准为各团装备武器。铸造厂的大炮、工场的火枪和王室火药厂的炸药，通过国营军械系统流向各驻军。这一军事工业支柱使历史上的王室军队得以保持其装备的规模和一致性，这是任何后继国家都无法临时拼凑的。"
 cas_royal_factories: "王室工厂"
 cas_royal_factories_desc: "为摆脱对外国制成品的依赖——这种依赖正不断耗尽王国的美洲白银——波旁诸王正在创办 #italic Reales Fábricas#! ，这是按重商主义原则生产奢侈品的国营制造厂。马德里的 #italic Real Fábrica de Tapices#! 、拉格兰哈的 #italic Real Fábrica de Cristales#! ，以及瓜达拉哈拉的毛纺织工场，在王室庇护下雇用了成千上万工人，并引入外国工匠教授佛兰德、波希米亚与英格兰的工艺技术。这一工业计划扭转了十八世纪的贸易逆差，并为日后工业革命的兴起播下了制造业的根基。"
 crd_sierra_morena_mining: "莫雷纳山脉采矿"
 crd_sierra_morena_mining_desc: "城北莫雷纳山脉的林木丘陵中蕴藏着铜、铅与煤，自罗马科尔杜巴时代便已开采，如今由特许公司与外国资本重新开发。矿业聚落、冶炼厂以及为其服务的道路，在这片数百年来唯有牧场与匪盗的丘陵间兴起。矿产财富将这座昔日的哈里发都城变为一座现代工业中心，使其拥有超越田地与手艺之外的新财源。"
 jae_mining_boomtowns: "采矿新兴城镇"
 jae_mining_boomtowns_desc: "在外国资本与排干深井积水的新式蒸汽泵的推动下， #italic 利纳雷斯 #! 与拉卡罗利纳从边陲村落膨胀为井架与冶炼厂环绕的拥挤矿业城镇。数以万计的矿工、工程师及其家眷涌入一个世纪前仅有橄榄采摘者与匪盗的丘陵地带。这股采矿热潮使昔日格拉纳达边境之地，一跃成为南方人口最稠密、产出最丰厚的地区之一。"
 muc_la_union_mining: "拉乌尼翁采矿"
 muc_la_union_mining_desc: "#italic拉乌尼翁#!周边卡塔赫纳山区的丘陵中布满了开采铅、银与锌矿的矿井，吸引数以万计的人投身于十九世纪这场狂热的淘金热，手工开采与蒸汽机械并用。我们的冶炼厂与卡塔赫纳的码头将精炼后的金属运往地中海沿岸乃至更远之地。这场矿产热潮为王国注入了巨额新财富，也使南部海岸聚集起一支熙攘繁盛的产业工人队伍。"
 sev_trade_emporium: "贸易商埠"
 sev_trade_emporium_desc: "塞维利亚是南方的商业中心，河畔的 #italic 交易所 #! （Lonja）与商人们的账房掌控着整个瓜达尔基维尔河流域及安达卢西亚腹地的贸易。我们的市场汇聚本地区的油、酒、布匹与金属，供应沿河及出海的销售与运输。尽管正式的印度群岛垄断权时盛时衰，这种商业上的首要地位仍使本城始终是安达卢西亚贸易跳动的心脏。"
 tol_fabrica_nacional: "国家武器工厂"
 tol_fabrica_nacional_desc: "托莱多的王室兵工厂发展成为宏大的 #italic 国家军工厂 #!（Fábrica Nacional de Armas），其水力与蒸汽驱动的车间以工业化的规模产出现代征召军队所需的刀剑、刺刀与火器。 #italic 制剑匠 #!（espaderos）的古老手艺被重新整编为标准化的生产线，为全国的军械库供货。这座工厂使本城成为现代国家的军械库，并将其钢铁传统带入工业时代。"
 #Catalan Shared
 ara_a_maritime_realm: "海洋之国"
 ara_a_maritime_realm_desc: "巴塞罗那伯爵继承了一片面向地中海的疆域，其贸易传统源自罗马塔拉科（Tarraco）与加洛林时代的西班牙边区（Marca Hispanica）。我们在漫长的加泰罗尼亚海岸上的商人，从塔拉戈纳、巴塞罗那到圣费利乌以及恩波达的各个港口，推动着王国早期的海洋经济，并以贸易 #italic 特权 #! （privilegis）为条件资助王室的征战。正是这种商业与海事导向，使加泰罗尼亚成为阿拉贡历次东扩——从马略卡直至西西里——的引擎。"
 ara_fleet_ordinances: "舰队条例"
 ara_fleet_ordinances_desc: "阿拉贡王室麾下种类繁多的桨帆船队，其船员来自马赛直至西西里，没有任何单一港口城市的法规能够管束外国水域中这支多国船员舰队的行为。因此，贝尔纳特·德·卡夫雷拉（Bernat de Cabrera）在“庄重者”彼得（Peter the Ceremonious）治下编纂了#italic《海上事务条令》#!（Ordinacions sobre lo Fet de la Mar），这是欧洲最早的海军军事法典之一。此法典统一规范了来自阿拉贡各领地的海军上将、船长与船员的职责，使加泰罗尼亚—阿拉贡舰队成为一支组织严整的战斗力量——而彼时其他列强仍依赖那些只为薪饷而战的城邦分队。"
 ara_valencian_golden_age: "巴伦西亚黄金时代"
 ara_valencian_golden_age_desc: "自1238年海梅一世征服巴伦西亚，直至十五世纪的商贸繁荣，这座城市已成为阿拉贡王室东部领地的文化首都。若阿诺特·马托雷尔（Joanot Martorell）的骑士小说 #italic 《白衣武士蒂朗》 #! （Tirant lo Blanch）、奥西亚斯·马尔克（Ausiàs March）的爱情诗歌，以及伊莎贝尔·德·维列纳（Isabel de Villena）的 #italic 《基督传》 #! （Vita Christi），已将巴伦西亚语确立为与卡斯蒂利亚语或托斯卡纳语同等地位的文学语言。我们的文化地位为王国在远至那不勒斯与塞浦路斯的宫廷中赢得了声望，并使阿拉贡王室成为欧洲文化的创造者，而非仅仅是消费者。"
 ara_chartered_merchant_companies: "特许商业公司"
 ara_chartered_merchant_companies_desc: "我们的商人将资金投入到内部相互竞争上，而不是去与外国商人竞争，这是一种徒劳的内部消耗，我们应该团结一致将重心转向对外获取贸易的竞争上来，我们将授予一些特许公司，这些公司将在一段时间内会获得某些地区的贸易垄断权，而是否能继续合法垄断就要取决于他们对王室的贡献了。"
 ara_constellation_cities: "城市格局"
 ara_constellation_cities_desc: "阿拉贡王室自始便不像一个王国，而更像是诸多都城组成的联邦：萨拉戈萨属于阿拉贡人，巴塞罗那属于加泰罗尼亚人，巴伦西亚属于巴伦西亚人，帕尔马属于马略卡人，卡利亚里则属于萨丁尼亚人。每座都城都保有自己的 #italic Generalitat #! 或 #italic 王国代表会 #!、自己的货币与商业交易所，在国王名义上的权威之下彼此互派领事与使节。这张由各都城相互竞争织成的网络使王国极难被一击致命：失去任何一座都城都不会使整个王国瘫痪，而彼此间的竞争也使贸易保持活跃不息。"
 ara_gunpowder_souls: "火药灵魂"
 ara_gunpowder_souls_desc: "巴伦西亚的 #italic 法雅节 #! （Fallas，每年在圣约瑟夫节以烟火焚烧巨大木制与纸糊雕像的邻里庆典）孕育出一整个精通黑火药操作、引信调配与烟火计时的工匠阶层。那些曾制作华丽圣约瑟夫冠饰的作坊，如今已转而生产测距表、定时引信炮弹，以及被王室军械库采用的爆炸花束弹。源自节庆的技艺已发展成为本土的火药工程传统，这正是中等规模的欧洲列强不得不向德意志或法兰西专家购买的技艺。"
 #Catalan Unique
 anr_pau_dels_dos_coprinceps: "双亲王和平条约"
 anr_pau_dels_dos_coprinceps_desc: "#italic《两共治亲王和约》#!（Pau dels Dos Coprínceps，于1278年双重领主协议中由乌赫尔主教与弗瓦伯爵达成的永久和约）确立了安道拉的双重主权，使任何一方亲王若未经另一方同意，均不得在我们的山谷中采取行动。我们的外交官从一开始便懂得，任何对外关系都必须在另一位亲王的审视之下保持平衡，这养成了在只向单一君主负责的宫廷中罕见的谨慎起草与耐心谈判之风。这种双头主权教会我们的使节，从外国宫廷中争取到远超我方代表团规模所能预期的成果。"
 cat_principatus_cathaloniae: "加泰罗尼亚公国"
 cat_principatus_cathaloniae_desc: "我们领土在阿拉贡王室内的正式名称为#italic 加泰罗尼亚公国#!，使加泰罗尼亚不仅仅是一个伯爵领地或附属物，而是一个拥有自身法律、货币和#italic 议会#!的主权公国。巴塞罗那伯爵自称为#italic 亲王#!，以强调我们制度与阿拉贡王国本土制度在法律上的平等地位。这一宪制尊严提升了我们的宫廷在基督教世界面前的地位，并将我们的贵族凝聚在超越任何一个伯爵家族的事业上。"
 mll_carta_de_franquesa: "特许自由宪章"
 mll_carta_de_franquesa_desc: "1230年，即征服马约卡（Mayūrqa）后的第一年，海梅一世国王颁布了 #italic《自由特许状》#! （Carta de Franquesa），奠定了马略卡自由的基石：新移民免于劳役义务，市议会（universitat）有权自行选举其行政官（jurats），我们的商人也得以豁免最苛重的王室课税。岛上分散各处的乡村社区——各个forana区——与帕尔马市民一同获得这些特权，将整个移民重建进程统一于同一部特许状之下，而非散乱的封建拼图。在这部建国特许状之下，每个马略卡家庭都与捍卫王室权威休戚相关，我们的使节在国外发言时，也更能以一个法治王国的身份从容应对。"
 val_llibre_repartiment: "分配书"
 val_llibre_repartiment_desc: "#italic《分地册》#!（Llibre del Repartiment，海梅一世于1238年征服巴伦西亚（Balansiya）后，为基督教移民分配土地、果园与房屋的总登记册）满载着分给来自加泰罗尼亚、阿拉贡、纳瓦拉及法国南部移民的地块记录。此后数百年间，这部册籍始终是权威的产权文献，在遗产争讼与王室授地中屡被援引，自基督教统治伊始的第一个十年起便确立了整个王国的土地保有制度。这份权威的地籍记录使每一处巴伦西亚庄园都能安心耕作，也使我们的农民摆脱了那些测绘欠精的国度中常见的边界纠纷。"
 anr_sis_parroquies: "六个堂区"
 anr_sis_parroquies_desc: "#italic 六教区 #!（Sis Parròquies：卡尼略、恩坎普、奥尔迪诺、拉马萨纳、安道拉城与圣胡利娅·德洛里亚）各自派代表前往 #italic 土地议会 #!（Consell de la Terra），共商税收、公共工程及治理我们山谷的习惯法事务。议会所作的决定对各教区一体适用，而各教区则自行管理各自的公地、灌溉与纠纷调解，日常治理事务无需交由两位共治亲王裁断。这种教区级的自治使我们王国的行政成本保持在极低水平，也让每个家庭对切身施行的政策都拥有直接的发言权。"
 cat_generalitat: "加泰罗尼亚自治政府"
 cat_generalitat_desc: "#italic加泰罗尼亚议会#!（Generalitat de Catalunya）是从旧有的#italic议会#!（Corts）中发展出的新机构，其中#italic总代表处#!（Diputació del General）作为常设执行机关，负责征收我们王国的普通税款，并在#italic议会#!（Corts）休会期间代行其职权。我们将通过#italic议会#!（Generalitat）的会计体系调度公共岁入，发行以加泰罗尼亚税收为担保的永久年金#italic“终身年金”#!（censals）与#italic“终身年金”#!（violaris），其利率之优惠，是热那亚与佛罗伦萨的老牌银行之家对主权借款人也无法比拟的。常设公共银行为我们的王国带来了稳定的收入，并建立起一个半岛上其他王国皆不具备的公共债务市场。"
 mll_escola_cartografica: "马略卡地图学派"
 mll_escola_cartografica_desc: "我们的 #italic 马略卡制图学派 #! （Escola Cartogràfica Mallorquina）以帕尔马的克雷斯克家族（亚伯拉罕及其子雅富达）为核心，汇聚了犹太与基督教制图师，为阿拉贡、法兰西与卡斯蒂利亚宫廷绘制了数十幅实用的波特兰海图。他们的作坊将罗盘花、航向线与标注港口的绘制惯例加以规范，往后两百年间地中海与大西洋的每一位船长都将依赖这些成规。这种制图学识的汇聚，提升了我们王国在整个基督教世界中的声望，也在我们的印刷业中播下传统的种子，滋养着远超制图学本身的学术研究。"
 val_primera_impremta: "首台印刷机"
 val_primera_impremta_desc: "伊比利亚半岛上第一台印刷机由德意志工匠兰伯特·帕尔马特（Lambert Palmart）在巴伦西亚安装，他印制的 #italic 《颂圣母玛利亚诗文集》 #! （Obres e trobes en lahors de la Verge Maria，为一次文学竞赛而作的圣母颂诗集）成为西班牙活字印刷的开山之作。此后这门行业从那间作坊迅速扩散：斯平德勒（Spindeler）、哈根巴赫（Hagenbach）与罗森巴赫（Rosenbach）在二十年内相继于巴伦西亚开设了各自的印坊，印制圣经、法律汇编，以及巨著骑士散文 #italic 《白衣武士蒂朗》 #! （Tirant lo Blanch）。我们在印刷业上的领先地位使作坊遍布全国，也使我们的文化在传播文本方面占得先机，其他西班牙诸国都须向我们购买。"
 anr_questia: "年贡"
 anr_questia_desc: "我们向两位共治亲王缴纳的年度贡赋 #italic 奎斯提亚税 #!（Questia），逐年轮流交予乌赫尔主教与弗瓦伯爵，这一数额数百年来名义上始终不变，而我们山谷的经济却早已大幅增长。这笔数额本就有限，加之其实际价值随时间不断贬低，使我们的教区议会得以凭借地方税收自行筹措经费。这种有利的财政格局，使朝廷的开支能够用于公共工程与治理所需的礼仪事务，而非耗费于向外邦缴纳的贡赋。"
 cat_remenca: "抗争雷门萨"
 cat_remenca_desc: "#italic雷门萨制#!（remença）通过六项#italic“恶俗”#!（Mals Usos）将加泰罗尼亚农民束缚于土地之上，这些“恶俗”迫使农奴依附其采邑，直至自赎自由为止。根据《瓜达卢佩裁决》所议定的改革条款，农民获得了对其地块的产权，同时继续缴纳已减轻的税赋，从而在整个公国范围内释放了农村的劳力与资本。这一农业变革使加泰罗尼亚早在其他任何欧洲王国解决领主与农民问题之前数十年，便已建立起一个富有生产力的自耕农阶层。"
 mll_corsaris_mallorquins: "马略卡私掠船"
 mll_corsaris_mallorquins_desc: "王家#italic 私掠许可证#!授权我们的船长自费武装快桨帆船和双桅帆船，对巴巴里和热那亚航运以及任何敌对王室的商船进行劫掠。帕尔马的私掠兄弟会保有自身的资深舵手、炮手和水手长名册，王室海军在战时从中征召，模糊了私掠者与海军预备役之间的界限，汇集成单一的海上人力池。这一深厚的训练有素船员储备使我们的舰队比任何国家招募的海军都能更快地满员，并让我们的分舰队能在任何对等的地中海力量清出港口之前就抵达远方阵位。"
 val_germanies_valencianes: "巴伦西亚兄弟会"
 val_germanies_valencianes_desc: "瓦伦西亚的 #italic 基尔达 #! （由织工、染工、铁匠以及布满我城墙内外的数十个行会组成的宣誓兄弟会）的职能早已超越行业本身，延伸至互助基金、民兵集结、宗教游行与堂区济贫事务。加入一个 #italic 基尔达 #! ，是瓦伦西亚城市居民仅次于堂区与家族的核心社会身份，而这些兄弟会也为王室在每次战役中提供训练有素的征召兵与现成的补给网络。正因如此紧密的联结，我们的城镇得以保有预备兵力，并维持街头的公民秩序。"
 anr_sindic_procurador_general: "总代表议事官"
 anr_sindic_procurador_general_desc: "我们的#italic总执事（Síndic Procurador General）#!主持地方议会（Consell de la Terra），作为安道尔在两位共治亲王面前的行政代表，代表各堂区进行谈判，却从不出让议会对自身事务的最终主权。总执事由各堂区代表协商推举，通常是一位受人敬重的教士或显贵，充当地方利益与外部压力之间的常设缓冲。这一中立调解者的角色使教士与贵族都能恪守议会的决议，并限制了党派化行政官所带来的分裂倾向。"
 cat_els_segadors: "收割者之歌"
 cat_els_segadors_desc: "收割者战争中，#italic血之圣体节（Corpus de Sang）#!的加泰罗尼亚收割者们奋起反抗卡斯蒂利亚军团的驻扎与对我们宪章的侵犯，证明了我们的农民足以组成一支能够抵御欧洲最庞大军队长达近二十年之久的武装力量。民谣#italic《收割者之歌》（Els Segadors）#!保存着那次动员的记忆，每个加泰罗尼亚孩童自幼便学唱其中的词句。深厚的农兵传统为我们的王室提供了一支无需职业募兵官或外国雇佣兵队长即可召集的兵源储备。"
 mll_torres_costaneres: "海岸塔楼"
 mll_torres_costaneres_desc: "一道由#italic沿海塔楼（torres costaneres）#!组成的网络——用马雷斯石砌成的矮壮圆形瞭望塔——环绕着马略卡、梅诺卡、伊维萨与福门特拉。这些塔楼彼此相望，由堂区征召兵驻守，一旦巴巴里战船出现在海平线上，便立即点燃烽火。每座塔楼都与一座设防的堂区教堂及一口避难蓄水池相配，使沿海每个社区都能在一小时之内抵达可防御的城墙与储水之处。这道覆盖全岛的防御网，提高了任何两栖进犯我们海岸的代价，使较小的驻军也能守卫比任何同等王国都更长的防线。"
 val_seda_valenciana: "巴伦西亚丝绸"
 val_seda_valenciana_desc: "我们的丝绸业，即 #italic 瓦伦西亚丝绸（seda valenciana）#!，集中于韦略特斯堂区及阿尔布费拉湖周边，依靠种植于阿尔拜达谷与卡塞尔谷的桑树林，每年春季供养蚕卵饲育场。丝绸业大行会（Col·legi de l'Art Major de la Seda）管理织机，制定品质标准，并让新织工在师傅门下学艺，这些师傅的技艺可追溯至本王国从未完全驱逐的摩里斯科工匠。这一涵盖从果园、饲育场、缫丝坊到织机各个环节的完整丝绸产业链，使我们的王室拥有其他伊比利亚地区无法比拟的奢华织物。"
 anr_via_dels_passos: "山口之路"
 anr_via_dels_passos_desc: "连接我们的谷地与法国阿列日及加泰罗尼亚乌尔赫尔的高山隘口——#italic恩瓦利拉山口（Port d'Envalira）#!、#italic博特利亚山口（Coll de la Botella）#!以及#italic卡布斯山口（Port de Cabús）#!——终年由堂区劳役维护，清除落石、标记雪桩，并储备可供军事与商贸往来通行的避难小屋。数百年的山路建设造就了一支堂区工程队，能在令平原军队望而却步的条件下，在高山地形间转运人员与物资。掌控这些高山隘口，使我们的小股部队能比任何平原军队更快地集结以应对入侵者。"
 cat_principat_constitucionalista: "宪政公国"
 cat_principat_constitucionalista_desc: "我们的#italic 宪政公国#!传统在法学手稿、城市法规和法学家的耐心学术中得以延续。每一代人都抄写宪法，在大学中加以辩论，并在这些法令的执行者不注意的地方，悄然将其原则扩展到市政实践中。这种持久的宪政记忆缓和了宫廷的向心力，并为每个加泰罗尼亚城市提供了一套自治词汇，可供后来的反抗和改革所借鉴。"
 mll_industria_lapidari: "石料加工产业"
 mll_industria_lapidari_desc: "马略卡的淡色 #italic 马雷斯石（marès）#! 与梅诺卡的深色板岩，供养着一个有组织的 #italic 采石业（indústria lapidària）#!，为从帕尔马的主教座堂、加泰罗尼亚沿海要塞，到美洲殖民地教堂等各处伊比利亚建筑工地供料。我们在圣塔尼和费拉尼奇的采石工人按季为王室军械库签约劳作，以切割石料而非金钱缴纳贡赋，并以其琢石的精工而闻名。这一有组织的石材加工业，使马略卡每间作坊的生产效率更高，并加快了我们王国境内每一项王室建筑工程的进度。"
 val_real_societat_economica: "巴伦西亚经济爱国者皇家协会"
 val_real_societat_economica_desc: "瓦伦西亚的#italic祖国之友皇家经济学会（Real Societat Econòmica d'Amics del País）#!，将本王国开明的贵族、堂区教士与市民改革者凝聚一堂，致力于耐心改进全境的灌溉、畜牧、制造业与初等教育。该学会资助织机与提水装置最佳设计的奖励竞赛，赞助外国农学著作的翻译，并向任何愿意接待的村庄派遣专家通讯员。这一专注于改革的机构，将开明的庇护转化为我们王室农田、作坊与税收上看得见的进步。"
 anr_neutralitat_pirinenca: "比利牛斯中立"
 anr_neutralitat_pirinenca_desc: "我们的#italic比利牛斯中立（Neutralitat Pirinenca）#!政策，使安道尔得以置身于吞噬周边大国的大战之外，我们的谷地转而成为政治流亡者、走私者、途经的王朝claimant，乃至偶尔因突如其来的声名而令本国税吏格外关注的游吟诗人的庇护所。两位共治亲王都觉得此一安排颇为便利，从而使我们免于正式卷入他们更广泛的冲突。这种中立的声誉使我们的使节得以出席那些交战国被排除在外的会议，也让我们的小规模军队有时间准备无人敢于进犯的防御工事。"
 cat_renaixenca_catalana: "加泰罗尼亚文艺复兴"
 cat_renaixenca_catalana_desc: "我们的文学与文化复兴运动——#italic加泰罗尼亚文艺复兴（Renaixença Catalana）#!——在加泰罗尼亚语仅存于私人信函与民谣之中数代之后，使其重返印刷机、讲堂与抒情舞台。我们将赞助恢复的#italic花节诗赛（Jocs Florals）#!诗歌竞赛，资助编纂现代文学标准的辞典与语法书，并使我们的语言重新进入报刊、学术界与公共行政之中。这场文化复兴提升了我们臣民以母语识字的比例，并将所有讲加泰罗尼亚语的社区凝聚成一个任何中央集权国家都难以轻易同化的共同文化体。"
 mll_escola_mallorquina: "马略卡学派"
 mll_escola_mallorquina_desc: "通过#italic马略卡学派（Escola Mallorquina）#!，我们岛屿的文学繁荣，在我们的语言仅存于私人虔信与民谣之中数代之后，重新使马略卡文学回归欧洲主流。我们将赞助波连萨与帕尔马的诗歌圈子，其清晰、古典化的加泰罗尼亚语既汲取希腊拉丁经典传统，又取材于特拉蒙塔纳山脉险峻的风光，并将他们的刊物与诗篇传播到岛屿与大陆之间每一条航运路线上。这场文学复兴加深了岛民对自身语言的认同感，并通过该学派广为流传的篇章，使大陆移民更易吸收当地的语言习惯，从而缓和同化过程。"
 val_renaixenca_valenciana: "巴伦西亚文艺复兴"
 val_renaixenca_valenciana_desc: "我们的文学复兴运动——#italic瓦伦西亚文艺复兴（Renaixença Valenciana）#!——围绕瓦伦西亚恢复的#italic花节诗赛（Jocs Florals）#!，以及重新从本王国印刷机中涌现的田园抒情诗、讽刺韵文与历史编年纪事而展开。我们将把王室与市政的赞助投向花节诗赛的奖章与新兴的瓦伦西亚刊物，使我们的语言重返足以媲美全境文雅门第藏书的文学舞台。这场语言复兴提升了我们宫廷的声望，并将散布各地的地方（comarques）凝聚成一个任何外国统治都难以轻易割裂的共同文化体。"
 #Galician Shared
 galician_rias_atlanticas: "大西洋溺湾"
 galician_rias_atlanticas_desc: "我们大西洋沿岸的深邃河口——维戈、蓬特维德拉、阿罗萨与穆罗斯一带的 #italic Rías Baixas #! ，以及拉科鲁尼亚、贝坦索斯与费罗尔一带的 #italic Rías Altas #! ——深入内陆绵延数十公里，形成欧洲最富饶的渔场之一。沿岸每个村庄的男子自幼便出海谋生，捕获沙丁鱼、鳕鱼与贝类，供养我们的市场及内陆的西班牙经济。这些天然港湾庇护我们的船队免受大西洋风暴侵袭，并培养出一支内陆王国无从比拟的常备熟练水手队伍。"
 galician_camino_pilgrimages: "圣地亚哥朝圣之路"
 galician_camino_pilgrimages_desc: "通往圣地亚哥-德孔波斯特拉的朝圣之路每年吸引来自基督教世界各地的成千上万虔诚旅行者，来自皮卡第和科隆、博洛尼亚和维也纳，甚至不列颠群岛和斯堪的纳维亚。沿途的每一个#italic 朝圣者客栈#!、堂区和路边神龛都从这些访客身上收取钱财，我们的内陆城镇直接从其通行中获利。这种朝圣经济将精神义务转化为稳定的外币流入，规模之大是其他伊比利亚王国所无法企及的。"
 galician_foros: "福罗斯"
 galician_foros_desc: "我们的长期租佃契约——#italic 永佃契（Foros）#!——赋予农民家庭对其地块三代乃至更久的可继承权利，以换取向领主、修道院或拥有地产所有权的城市缴纳的固定地租。这种租佃保障鼓励我们的小农投资于开垦、排水、修筑梯田与种植果园，这些工作是短期佃户绝不会去做的。这一稳定的租佃制度提高了我们这片小块土地拼凑而成的农业生产力，并保护乡村人口增长免受最严酷的封建盘剥。"
 galician_irmandinos_legacy: "伊尔曼迪尼奥农民兄弟会"
 galician_irmandinos_legacy_desc: "#italic伊尔曼迪尼奥斯（Irmandiños）#!——那支奋起反抗加利西亚贵族暴行的伟大农民兄弟会——在我们的村庄与堂区留下了持久的社群组织遗产。尽管这场起义最终被镇压，但其谈判结果带来了保护农民租佃权的永佃契改革，以及至今仍将邻里团结为互助会以对抗未来任何暴政的#italic兄弟会（irmandade）#!传统。这一社群组织的传统，使我们的国家一旦遭王室征召，便能立即调动民兵、劳力与信贷网络。"
 galician_mountain_minerals: "山地矿产"
 galician_mountain_minerals_desc: "卢戈、奥伦塞与比埃尔索的内陆山区蕴藏着丰富的锡、钨、板岩与白银矿藏，如今我们已通过系统化的采矿特许加以开采。#italic加利西亚矿场（Minas de Galicia）#!所产矿石供应阿斯图里亚斯的炼铁炉，所产白银则补充王室在费罗尔铸造的货币。矿产财富使我们的地区经济不再局限于渔业与乳制品，赋予我们的城镇其他地质条件较差的王国难以轻易仿效的制造业。"
 galician_rexurdimento: "复兴运动"
 galician_rexurdimento_desc: "我们的文化复兴——#italic Rexurdimento#!——于十九世纪蓬勃兴起，诞生了抒情诗歌、史诗性历史著作、吟游诗篇与辛辣讽刺文学。在作为书面语言沉寂数百年之后，加利西亚语重返印刷品，成为一种在我们的疆域之外也备受尊重的文学表达载体。这场语言复兴提升了我们地区的识字率，也让每一位加利西亚人都为一种中央集权国家难以轻易抹去的地方身份认同而自豪。"
 #Galician Unique
 glc_kingdom_of_garcia: "加西亚王国"
 glc_kingdom_of_garcia_desc: "1065年，加西亚国王依其父遗诏，将加利西亚从莱昂与葡萄牙分割出来，建立了我们短暂独立的王国，证明了加利西亚宫廷完全可以作为一个拥有自己铸币权、特许状与军事征募权的独立王国运作。尽管加西亚于1071年被其兄弟废黜并囚禁，但他那 #italic Regnum Gallaeciae #! 的记忆，在此后数世纪间始终萦绕于贵族野心与教会诉求之中。凭借这份失而复得的王室遗产，我们得以以古老王权的自信来治理我们的边远领地。"
 glc_cathedral_santiago: "圣地亚哥主教座堂"
 glc_cathedral_santiago_desc: "我们的圣地亚哥大教堂供奉着使徒圣雅各的圣髑，与罗马、耶路撒冷并列，是拉丁基督教世界三大朝圣圣地之一。#italic 荣耀之门 #!（Pórtico de la Gloria）与盛大的游行礼仪年复一年地吸引着王公、高级教士与使节来到我们的大门前，每一次来访都为我们带来无需刻意谈判便可获得的外交交流机会。教会的这份分量，使我们的宫廷成为欧洲各天主教强权经常往来的伙伴，也使我们的外交通信更加顺畅。"
 glc_armada_de_galicia: "加利西亚舰队"
 glc_armada_de_galicia_desc: "当我们的君主建造其大西洋大舰队之时，我们的加利西亚分舰队提供了其中大部分经验丰富的水手、领航员以及作为舰队中坚的盖伦船船体。#italic Armada de Galicia#! 在费罗尔与维戈集结，征调沿海每一个村庄的船员，并取用富含花岗岩的加利西亚山地所产的造船木材与石制压舱物。正是这些船坞与船员，使我们的王室得以跨越大西洋运送士兵，这是其他地方势力鲜有能及的。"
 glc_murallas_atlanticas: "大西洋城墙"
 glc_murallas_atlanticas_desc: "英格兰人与柏柏里海盗对我们海岸的屡次袭扰，迫使我们在拉科鲁尼亚、拜奥纳与维戈修筑高大的防御城墙与棱堡，即 #italic 大西洋城墙 #!（Murallas Atlánticas），以抵御十七世纪那些装备火器的袭击者。每座堡垒皆由其所保护的城镇以专项税收维持，王室则提供工程技术与火炮支援。这张防御网络使我们的大西洋海岸线付出极高代价方能被攻破，也使野战部队得以抽身执行其他战事。"
 glc_junta_general: "加利西亚王国总议会"
 glc_junta_general_desc: "我们的 #italic 加利西亚王国大议会 #! （Junta General del Reino de Galicia）召集加利西亚七大主教辖区（圣地亚哥、奥伦塞、卢戈、蒙多涅多、贝坦索斯、拉科鲁尼亚与图伊）代表，在王室权威之下共商税收、司法与王国防务事宜。大议会的决议承载着整个地区的共识之力，即便强大的加利西亚贵族也要受其约束，遵从他们个人未必赞同的省级决议。王国借大议会之口发声，使我们的王室得以与一个伙伴共同治理内陆地区，而非仅靠官吏统治的行省可比。"
 glc_escuadra_atlantica: "大西洋分舰队"
 glc_escuadra_atlantica_desc: "我们驻扎于费罗尔皇家兵工厂的大西洋分舰队，已成为近代伊比利亚海上力量的中坚：一支由战列舰、巡洋舰与驱逐舰分队组成的常备力量，随时准备捍卫伊比利亚海域，并将力量投射至南北美洲两地。#italic 大西洋分舰队 #!（Escuadra Atlántica）常年在加利西亚海岸的天然良港中演训，维持着其他分散部署的舰队难以企及的战备水平。这种集中化的海军战略思想，使我们的海军能比任何同等强权的大西洋舰队更快出动，并发挥更协调一致的火力。"
 #Leonese Shared
 leonese_asturian_inheritance: "阿斯图里亚斯传承"
 leonese_asturian_inheritance_desc: "我们的王国追溯其从未中断的政治世系至阿斯图里亚斯的基督教残余王国，这是711年后唯一从未向征服的伍麦叶哈里发屈服的伊比利亚王国。我们继承了#italic 收复失地运动#!的合法主义旗帜，以及阿斯图里亚斯王朝在两个世纪的山地避难中所保存的法典、修院和贵族世系。这种深厚的王朝连续性使我们的王室行为合法化，并将我们所吸纳的人口绑定在一个他们难以拒绝的叙事上。"
 leonese_gothic_art: "莱昂哥特式建筑"
 leonese_gothic_art_desc: "我们的莱昂大教堂，即 #italic 美丽的莱昂 #!（Pulchra Leonina），以基督教伊比利亚境内规模最宏大的彩绘玻璃工程为王国增辉，其石匠与玻璃匠大师皆师承建造沙特尔与兰斯大教堂的工坊。我们将依循同样的构图原则，资助新的教区教堂、王室基金会与熙笃会修道院，为那些以技艺传承此一传统的世家提供稳定的生计。这种建筑与艺术文化深化了我们的文化影响力，并降低了王室委托建造的每一座纪念性建筑的成本。"
 leonese_pendon_morado: "紫色旗帜"
 leonese_pendon_morado_desc: "#italic 紫色军旗 #!（Pendón Morado）——自王国肇建以来，这面绘有银狮的紫色旗帜便一直在每一次莱昂军队集结时行于队伍最前——承载着一种延续性的地方身份认同，历经我们王国遭遇的每一次王朝合并而不衰。我们在每一次 #italic 市镇议会 #!（concejo）集会与每一场教区节庆中郑重地展示此旗，将各城镇、山谷与牧场公地凝聚于一个任何中央集权法令都无法抹去的鲜明标志之下。这种象征性的延续，使我们的地方身份认同不致消逝，也让每一位莱昂人都对捍卫这面旗帜所代表的一切怀有切身利益。"
 leonese_textile_industry: "纺织业"
 leonese_textile_industry_desc: "我们蒂耶拉德坎波斯羊群所产的羊毛——纤长、耐候、产量丰富——供养着莱昂、阿斯托尔加、萨拉曼卡与萨莫拉境内一整套作坊网络，织造出我们农民与步兵所依赖的粗布。我们将王室庇护延伸至织布行会，并沿着自高地牧场一直延伸至梅迪纳德尔坎波春秋两季集市的 #italic 莱昂呢绒 #! （Paños de León）贸易路线统一度量标准。从羊毛到成品布匹，整条产业链始终掌握在我们手中，足以抵御羊毛价格的每一次波动。"
 leonese_provincial_academies: "地方学院"
 leonese_provincial_academies_desc: "在我们的主要城市中，地方启蒙圈创办了#italic 经济协会#!和学术学院，出版关于农业、制造业和自然史的论著。这些机构通过吸引教士、贵族和市民订阅者来运作，无需王室补贴，他们将爱国改良视为其阶层的一项责任。这种省级知识网络提高了我们整个地区的识字率，并产生了稳定的行政人员供给，足以胜任远在我国境外的王室项目。"
 leonese_industrial_revival: "产业复兴"
 leonese_industrial_revival_desc: "阿斯图里亚斯的煤层与比埃尔索及里奥萨河谷的铁矿，推动了一场地方性的工业复兴，使我们的山地河谷在历经数百年边缘化之后重新融入欧洲经济主流。外国工程师与本地资本携手开办 #italic 矿场 #! 与 #italic 冶炼厂 #! ，将原矿石转化为生铁、铁轨与船用钢板。这一工业基础使我们的经济不再局限于牧羊与乳制品业，也为我们的熟练劳工带来更优厚的工资，吸引着移民从大西洋移民船上折返归来。"
 #Leonese Unique
 atu_cradle_of_reconquista: "收复失地运动的摇篮"
 atu_cradle_of_reconquista_desc: "约722年，贵族佩拉约在阿斯图里亚斯山地的 #italic 科瓦东加 #! 击败一支倭马亚军队，此役被铭记为收复失地运动的首场基督徒胜利，亦是阿斯图里亚斯王国——以及由其传承而来的每一个伊比利亚王权——得以崛起的火种。我们承载着作为未被征服之遗民的荣耀，是征服浪潮最终撞碎于其上的磐石。这一建国传奇赋予我们的王室一种道义上的权威，以及一份比任何对手都更为古老纯正的正统性主张。"
 lon_kingdom_from_oviedo: "从奥维耶多到莱昂"
 lon_kingdom_from_oviedo_desc: "大约在910年，我们的宫廷从奥维耶多的山地要塞迁至莱昂的开阔平原，标志着收复失地运动已向南推进到足以让王国重新从一个像样的城市进行治理。这次迁都将王室、秘书室和军队围绕适合平原而非山峰的新后勤体系进行了重组，并赋予王国其持久的名称：#italic 莱昂王国#!。这次迁都使王室能够以山地束缚的对手难以匹敌的速度协调其不断扩张的领土。"
 lon_order_of_santiago: "圣地亚哥骑士团"
 lon_order_of_santiago_desc: "#italic 圣地亚哥#!骑士团成立于1170年，在莱昂王室的赞助下，建立了一个宣誓保卫朝圣之路和推进收复失地运动前线的修士骑士兄弟会。其统领区拥有广袤的庄园，并部署纪律严明的重装步兵和攻占摩尔人要塞的工程师，他们服从于大团长而非任何好斗的伯爵。这个军事修会为莱昂王室提供了一支常备铁拳，是任何世俗封臣都无法比拟的。"
 atu_cantabrian_fisheries: "坎塔布里亚渔业"
 atu_cantabrian_fisheries_desc: "崎岖的坎塔布里亚海岸的港口派出船队捕捞无须鳕、沙丁鱼以及在比斯开湾用敞篷小船捕猎的露脊鲸。我们的渔村培育了北岸最勇敢、最善于适应天气的水手，王家海军和商船队都争相招募这些人。这种坚韧的海洋人口是一个远超该省规模的常备熟练水手储备。"
 lon_canada_leonesa: "莱昂牧道"
 lon_canada_leonesa_desc: "莱昂境内的大 #italic 牧道 #!（cañadas），即那些牲畜转场之路，承载着庞大的羊群与牛群，在坎塔布连山脉的夏季高地牧场与平原的冬季牧场之间随季节往返迁徙。王室特许并保护这些季节性转场路线，对牲畜征税，并借此将牧民城镇紧紧维系于王室恩庇之下。这一牧业经济为王国带来稳定的肉类财富，是这片少雨的梅塞塔高原本身难以产出的粮食盈余。"
 lon_cortes_de_leon: "莱昂议会"
 lon_cortes_de_leon_desc: "1188年，我们的国王阿方索九世不仅召集了主教和大贵族，还召集了各城市选举的代表，召开了#italic 莱昂议会#!，这是欧洲历史上最早的议会集会。这些议会审查王室税收、商议战争和继承问题，并编纂城市的特权，王室的民兵正是依赖这些城市。这种王室与市民之间的制度性伙伴关系使我们的行政更有效率，使我们的臣民更愿意批准我们的战争所需的特别税收。"
 atu_mountain_fastness: "山地要塞"
 atu_mountain_fastness_desc: "#italic 欧罗巴峰#!和#italic 坎塔布里亚山脉#!将阿斯图里亚斯环绕在岩石壁垒之后，只有少数几个高海拔、可防守的隘口可通行。我们的山地民兵守住这些隘口，正如他们的祖先对抗摩尔人和法兰克人一样，使该省对任何入侵者几乎坚不可摧。这座天然堡垒让一个弱小贫穷的王国能够对抗数倍于其力量的大国。"
 lon_frontier_expansion: "莱昂边境扩张"
 lon_frontier_expansion_desc: "自我国立国以来，我们的军队便持续向南推进，攻击泰法诸国：在阿方索三世治下抵达杜罗河，在阿方索六世治下抵达塔霍河，又在阿方索九世治下抵达埃斯特雷马杜拉。每一次新的征服之后，都紧随着有计划的 #italic 再殖民 #!（repoblación）——移民特许状、免除庄园赋役与教区的建立——使被征服的土地比对手所能做到的更快转化为莱昂领土。这套行之有效的扩张方法，使每一次收复失地运动的征服都化为永久融入王国的行省，而非一时的军事占领。"
 lon_tierra_de_campos: "坎波斯平原"
 lon_tierra_de_campos_desc: "#italic 蒂耶拉德坎波斯 #!（Tierra de Campos）——塞亚河与皮苏埃尔加河之间起伏的黏土平原——是莱昂王室的粮仓，其开阔的麦田与大麦田养活着北方诸城。王室的赐地与修道院庄园的劳作，使犁铧在这片一望无际的庄园中永不停歇。作为王国的粮仓，蒂耶拉德坎波斯所提供的粮食盈余，以及由此带来的城镇与城市的繁荣，是周遭山地诸省所无法比拟的。"
 atu_cider_orchards: "苹果酒果园"
 atu_cider_orchards_desc: "阿斯图里亚斯湿润青翠的山谷中遍植苹果园，果实被压榨发酵成#italic苹果酒#!（sidra），是每个村庄的日常饮品，也是乡间社交生活的核心。我们的#italic果园#!（pomaradas）与#italic榨坊#!（llagares）维系着一种独立于梅塞塔谷物贸易之外的小农经济。果园文化赋予阿斯图里亚斯乡村一种富足、独特而长久的生计。"
 lon_adelantado_mayor_de_leon: "莱昂大总管"
 lon_adelantado_mayor_de_leon_desc: "#italic 莱昂大总督 #!（Adelantado Mayor de León）一职为世袭官职，自十四世纪起由基尼奥内斯家族世代执掌，将莱昂全境的司法、财政与地方外交大权集于一身，直接对王室负责。我们将通过此官署传递与莱昂各大家族的往来文书、各行政区的税务核定，以及各治理区的上诉陈情，绕开卡斯蒂利亚中央议会那更为迟缓的渠道。将地方权力集中于一署，使我们在莱昂境内的行政触角延伸得比任何泛卡斯蒂利亚官署都更远。"
 lon_maragato_arrieros: "马拉加托骡夫"
 lon_maragato_arrieros_desc: "阿斯托加丘陵的 #italic 马拉加托人 #! （maragatos）使自己成为王国的首席运输者，他们的骡队往来于坎塔布里亚港口与内陆集市之间，运载腌鱼、殖民地货物与王室白银。这些 #italic 脚夫 #! （arrieros）团结互信，经营着遍及莱昂与卡斯蒂利亚各地集市的信贷与运输网络。这一运货行会将王国的内陆商贸与商人触角延伸到远超其朴素城镇所能及之地。"
 atu_coal_basin: "阿斯图里亚斯煤田"
 atu_coal_basin_desc: "在阿斯图里亚斯中部山谷之下，蕴藏着半岛最丰富的煤田，开采于米耶雷斯、兰格雷奥以及考达尔和纳隆山谷的深部煤层。我们的矿业城镇随着来自周围山丘和山外涌入的工人而膨胀，并由新建的通往海岸的铁路服务。这种煤炭使阿斯图里亚斯成为国家产业化的燃料和能源心脏。"
 lon_bierzo_vineyards: "比埃尔索葡萄园"
 lon_bierzo_vineyards_desc: "#italic别尔索#!（Bierzo）地处莱昂西缘，群山环绕，其庇护下的山谷自中世纪起便由朝圣之路的修士悉心照料门西亚葡萄藤。层层板岩梯田所产的佳酿备受北方市场珍视，沿朝圣之路南下销售。我们的葡萄藤将不宜耕犁的陡峭之地化作宝贵的出口产业。"
 lon_real_casa_moneda: "王家铸币厂"
 lon_real_casa_moneda_desc: "我们的皇家铸币厂作为永久性王室机构运作，通过长期协议采购银铜原料，铸造出支付我方驻军与税吏薪饷的钱币。#italic皇家铸币局#!（Real Casa de Moneda）每铸一枚硬币都为国库带来可观利润，同时使王室得以掌控流通货币中的含银量。这种健全的货币体系让我们能以更有利的条件举债，并使资金在那些更为混乱的货币体系干涸之处继续流通。"
 atu_steel_works: "阿斯图里亚斯钢铁厂"
 atu_steel_works_desc: "在拉费尔格拉、米耶雷斯以及纳隆河口，高炉与轧钢厂将本地煤炭与进口矿石结合，产出现代经济所需的钢铁。我们的冶金厂为全国提供铁轨、机械、船板与军械。这一重工业将收复失地运动时期那座古老的山地避难所，改造为现代西班牙最伟大的工业重镇之一。"
 lon_leonese_collieries: "莱昂煤矿"
 lon_leonese_collieries_desc: "#italic 别尔索 #! （Bierzo）的煤炭，以及拉西亚纳与纳隆河流域日渐深掘的矿井，共同为工业时代的熔炉与铁路提供燃料。矿业城镇在莱昂群山间不断扩张，由新建铁路线连通至梅塞塔与沿海地区。这片煤田使这个收复失地运动时代的古老王国，成为现代经济的燃料之家。"
 lon_modern_brigades: "现代旅级部队"
 lon_modern_brigades_desc: "出自莱昂与阿斯图里亚斯的步兵团向来被视为西班牙军中最为稳健的部队，如今我们将其改组为现代旅级编制，配备整合炮兵、轻骑兵侦察部队与诸兵种协同训练。我们的 #italic 莱昂炮兵旅 #! 及其配属的野战炮兵队采用最新战术思想，实现步兵与火炮在工业化战场上的联合作战。这一现代化改革使我军旅级部队成为王国历次战役中最具战斗力的编制之一。"
 #Portuguese Shared
 por_establishment_portuguese_navy: "建立葡萄牙海军"
 por_establishment_portuguese_navy_desc: "1317年，国王迪尼什任命$GEN_ADJ$热那亚商人曼努埃尔·佩萨尼亚为葡萄牙#italic海军大元帅#!（Almirante-Mor），命其抵御北非海盗对海岸的侵扰，并以引进的外来专长建立一支国家舰队。佩萨尼亚带来了热那亚领航员、造船师与会计方法，奠定了日后一个世纪葡萄牙航海事业的基础。这一王室海军机构的建立，使葡萄牙几乎早于任何大西洋邻国两个世纪，便拥有了地中海水准的海事管理体系。"
 por_estimulate_rural_areas: "振兴农村地区"
 por_estimulate_rural_areas_desc: "我国的许多地区，特别是农村和偏远地区，正在经历人口减少，田地、森林和矿山逐渐废弃。我们要通过法律体系改革，把农村变成生产力，把人口留在农村。"
 por_bombardeiros: "大型火炮"
 por_bombardeiros_desc: "绕过好望角的葡萄牙轻帆船与大帆船，面对的是印度洋上体型更大却武装轻薄的舰队。为将这一劣势转为决定性优势，我们的造船师将加固新式大帆船的上甲板与炮门，装备在 #italic 炮务总长 #! （Bombardeiro-Mor）若昂·阿内斯主持下、里斯本兵工厂铸造的重型青铜火炮。这种加固炮台战术将赋予葡萄牙舰队远程压制的火力，足以在第乌一战摧毁马穆鲁克海军，并确保香料航路畅通百年。"
 por_the_bandeirantes: "支持班代兰特旗队"
 por_the_bandeirantes_desc: "#italic Bandeirantes#! （Bandeirantes，自十六世纪末起从圣保罗与圣维森特出发的武装远征队）深入未经测绘的巴西内陆，搜寻原住民俘虏、逃亡奴隶与传说中的矿藏。多明戈斯·若热·维略、安东尼奥·拉波索·塔瓦雷斯以及费尔南·迪亚斯·派斯·莱梅等人，皆通过历时数年的远征，持续将托德西利亚斯分界线不断向西推进，沿途测绘马托格罗索与戈亚斯高地。这种大陆规模的殖民拓展，使葡萄牙主权远远超越最初的条约分界线，奠定了巴西今日的大陆版图。"
 por_colonial_governors: "殖民领总督"
 por_colonial_governors_desc: "十七世纪的殖民行政改革，以向里斯本 #italic 海外事务委员会 #! （Conselho Ultramarino）直接负责的王室总督与副王，取代了原本零散的封建 #italic 封地领主 #! （donatário）体制。果阿的印度国副王、安哥拉总司令，以及萨尔瓦多的巴西总督，各自统领一支由王室官员、法官与财政稽查员组成的俸禄官僚体系。这一统一行政体制加强了王室对遥远领地的掌控，并大幅提高了流入本土国库的殖民地收入比例。"
 por_vinho_porto: "波尔图酒"
 por_vinho_porto_desc: "在我国北部杜罗河的沿岸，人们种植葡萄酿造葡萄酒，然后加入烈酒，使其成为开始广为人知的#italic 波特酒#!。我们不应错失通过出口我们的葡萄酒来赚取大笔财富的机会。"
 #Portuguese Unique
 alv_almadraba_fisheries: "阿尔马德拉巴渔业"
 alv_almadraba_fisheries_desc: "#italic 陷网渔场 #!（almadrabas，固定于阿尔加维沿海、用以拦截春季洄游蓝鳍金枪鱼的庞大迷宫式渔网）自腓尼基人与摩尔人时代起，便年复一年带来丰厚的季节性渔获。我们从拉戈什到塔维拉的渔港将渔获腌制装桶，销往半岛各地，淡季时船队亦兼作培育老练水手的摇篮。这一海洋经济既供给王国的餐桌，也培养了我国船只与远航所需的训练有素的人力。"
 por_battle_ourique: "欧里基之战"
 por_battle_ourique_desc: "在1139年，我们英勇的军队在战斗中独力击败了五位摩尔国王。这一壮举将永远留在我们士兵的记忆中，因此他们能击败任何敌人，无论他们多强大，装备有多精良。"
 por_cistercian_clearance: "熙笃会的垦殖"
 por_cistercian_clearance_desc: "#italic熙笃会#!（Cister）的白衣修士（驻阿尔科巴萨、博罗与塔鲁卡等地）在收复失地运动之后，排干沼泽、开垦荒丛，在埃斯特雷马杜拉与阿连特茹建立起一座座修道庄园。他们的俗家修士以及受修道院#italic特许状#!（forais）吸引而来的移民，将荒芜的边境之地变为麦田、葡萄园与果园。这种熙笃会式的农耕滋养了这个年轻的王国，并将基督教农民牢牢安置在刚从摩尔人手中夺回的土地上。"
 alv_sagres_school: "萨格里什学派"
 alv_sagres_school_desc: "在风声呼啸的 #italic Sagres#! 海角，在航海家亨利王子的庇护下，领航员、热那亚制图师、天文学家与造船师云集于此，系统整理航行于开阔非洲大西洋所需的风向、洋流与星辰知识。我们的船长学会以北极星与太阳测算纬度，学会操纵三角帆轻帆船，并勇于越过博哈多尔角——那个旁人向来望而却步、总是折返的地方，继续南行。凭借在萨格里什汇集的航海知识，阿尔加维沿非洲海岸延伸的航程，远远超过任何竞争港口。"
 por_lisbon_entrepot: "里斯本中转港"
 por_lisbon_entrepot_desc: "里斯本，位于#italic 特茹河#!宽阔的河口，发展成为西海岸的伟大中转港，内陆的盐、酒和软木与北方的布匹和金属在此交汇。热那亚和佛兰德斯的商行沿河岸设立，王室的关税随着两海贸易而增长。这个塔霍河商埠使首都在第一艘卡拉维尔帆船绕过博哈多尔角之前很久就成为王国的商业中心。"
 por_pursuing_waves: "追逐海浪"
 por_pursuing_waves_desc: "在航海家亨利王子的主持下，萨格里什的航海学校汇聚了热那亚领航员、加泰罗尼亚制图师与葡萄牙造船师，系统整理非洲大西洋的航海知识。吉尔·埃亚内斯绕过博哈多尔角，轻帆船抵达塞拉利昂，巴尔托洛梅乌·迪亚士则越过好望角，每一次航行都将我们的海图向南延伸百里格。王室对探索事业的这份持久投入，使葡萄牙成为欧洲唯一一个愿意耐心等待两代人之久、只为换取海洋回报的王国。"
 alv_lagos_emporium: "拉各斯商埠"
 alv_lagos_emporium_desc: "#italic 拉各斯#!港，非洲航行的首个集结地和归航地，发展成为黄金粉末、象牙、马拉格塔胡椒和几内亚海岸被俘奴隶首次登陆、征税和出售的商埠。其海关和商行将这个小王国直接连接至南方利润丰厚的新贸易。这个中转港为阿尔加维带来了与其规模完全不成比例的商业触角和收入流。"
 por_carreira_da_india: "印度航线"
 por_carreira_da_india_desc: "#italic Carreira da Índia #! (自里斯本往果阿并绕好望角返航的年度往返航程)成为世界上最长的定期海上航线,庞大的 #italic naus #! 沿归航路线向南破浪而行,满载胡椒与肉桂归航。我们的领航员精通季风时刻表与此航程所需的深海航海术。印度航路拓展了王国的海上版图,并以远超其规模的香料收益充盈国库。"
 por_feitorias: "葡萄牙官厂"
 por_feitorias_desc: "#italic 商馆 #! (自十五世纪末起沿非洲与亚洲沿岸建立的设防贸易商站)将仓库、驻军、海关衙署与礼拜堂合于一座王室 #italic 商馆长 #! 的管辖之下。此网络始于圣若热达米纳,延伸至索法拉、霍尔木兹、果阿、马六甲与澳门,垄断了香料航路上的咽喉要地,而无需进行大规模的内陆征服。借助这种设防商站的模式,葡萄牙仅凭海上霸权,便以极少的驻军掌控了全球贸易的巨大份额。"
 alv_dryland_orchards: "旱地果园"
 alv_dryland_orchards_desc: "阿尔加维海岸后方干燥的石灰岩#italic巴罗卡尔台地#!上种满了无花果树、杏仁树与角豆树,这些耐旱树木所产的干果可保存数年,且便于海运。数代人的梯田耕作、嫁接与悉心照料,使我们的无花果与杏仁成为输往北欧市场的稳定出口商品。这一果园经济将贫瘠的、被阳光炙烤的南方土地,转化为可靠且可持续的贸易与乡村定居之源。"
 por_monopolio_das_especiarias: "香料专营权"
 por_monopolio_das_especiarias_desc: "王室宣称对经[ROOT.GetCountry.GetAdjective]港口运输的胡椒、肉桂与丁香享有#italic专营权#!（monopólio），决定哪些商人可以运载这些货物，并对每一批抵岸的货物征收五分之一税金。通过将香料贸易与王室特许挂钩，而非寄望于哪位船长最先归航，国库便将这场海上赌局变成了稳定而可预期的财源。"
 por_ordenancas: "后备军"
 por_ordenancas_desc: "塞巴斯蒂昂国王推行的#italic民团#!改革,将葡萄牙每一座市镇编组为由民选#italic民团统领#!率领的武装公民连队,每月操演,并须应王室征召而随时集结。腓力王朝的改革统一了装备标准,充实了征兵名册,并要求年满十六至六十岁的每一名男子都登记入所属堂区连队。这一全民民兵制度维持着一支可随时动员以应对殖民战事或本土防务的常备训练人力,而无需承担常备军的开支。"
 alv_sotavento_salt: "索塔文托盐田"
 alv_sotavento_salt_desc: "沿东部 #italic 顺风海岸 #! (塔维拉、卡斯特罗马林与法鲁)的潟湖,阳光、潮汐与耐心的劳作共同造就了盐田,在漫长的干燥夏季里成船成船地结晶出海盐。我们的盐腌制着大西洋船队捕获的金枪鱼与鳕鱼,也装满了将其运往北方的汉萨与比斯开商人的船舱。这盐业贸易虽不张扬,却是王国财富中一项古老而恒常的来源。"
 por_restoration_of_independence: "独立恢复"
 por_restoration_of_independence_desc: "王国摆脱了与卡斯蒂利亚的长期联合，并拥立了一个本土王朝，在阿连特茹边境开启了一代人的战争。新的棱堡式堡垒崛起，每个堂区组建新的团，保障其主权的联盟得以巩固。这次独立的恢复使整个国家团结在合法王冠之后，这是任何外来或虚构的竞争者都无法做到的。"
 por_royal_absolutism: "绝对王权"
 por_royal_absolutism_desc: "王室权力已经被愚蠢的贵族干预限制太久了。那些贵族狭隘的本地利益正在威胁着王国更大的利益。我们应该解散地方议会，并不受他们干扰地进行统治。"
 alv_coastal_fisheries: "沿海渔业"
 alv_coastal_fisheries_desc: "阿尔加维的港口里遍布 #italic 罐头作坊 #!,这些加工厂以盐、油与卤水腌制沙丁鱼与金枪鱼,销往全欧洲及各殖民地的市场。日益壮大的沿海劳动力与稳定的需求,将昔日仅限季节的渔获转变为全年不辍的贸易。这一沿海渔业将王国最古老的生计——向海洋讨食——提升到了新的规模。"
 por_administrative_reforms: "行政改革"
 por_administrative_reforms_desc: "王室以职业化的国务秘书处、改革后的财政体系和直接对国王负责的领薪部长精简内阁来彻底改组政府。旧的封建司法辖区让位于任命的治安法官，海外收入通过单一议事会统筹。这种行政现代化使王室能以旧有议事会纠葛绝不允许的速度推动改革。"
 por_royal_military_academy: "王家工事、炮兵与设计学院"
 por_royal_military_academy_desc: "玛丽亚一世女王在里斯本的圣若热城堡创立 #italic 皇家筑城、炮术与绘图学院 #! ,承继十七世纪路易斯·塞朗·皮门特尔所授的军事课程。该学院课程融合沃邦式筑城术、弗雷济耶的画法几何,以及经法国与普鲁士工程师检验的现代炮兵学说,由曼努埃尔·德·索萨·拉莫斯与皇家工程兵团执教。这所统一的军事学院将葡萄牙陆军军官训练至欧洲大陆的水准,使王国在未来一个世纪的战争中得以保有其技术上的威信。"
 #Iberian Formables
 #Al-'Andalus
 adu_khilafa_qurtuba_renewed: "科尔多瓦哈里发国复兴"
 adu_khilafa_qurtuba_renewed_desc: "我们对 #italic Ḵilāfat Qurṭuba #! 的复兴,重现了阿卜杜拉赫曼三世的礼仪尊号,重建的扎赫拉宫王座大殿、绣有哈里发在位纪年的金线 #italic ṭirāz #! 礼袍,以及重新在科尔多瓦大清真寺宣读的主麻礼拜词,皆一一恢复。我们以西非黄金铸造新哈里发名下的第纳尔金币,向承认我方宗主权的马格里布苏丹们颁发册封旗帜,并以平等身份而非请愿者的身份接待开罗马穆鲁克的使节。这一哈里发权威使 #italic ḏimma #! 契约在科尔多瓦为数众多的基督徒与犹太臣民中正式确立,将半岛上形形色色的人口凝聚为一体,令任何地区性的马格里布王朝都难以轻易与之抗衡。"
 adu_yusufiyya_andalusiyya: "安达卢斯优素福学院"
 adu_yusufiyya_andalusiyya_desc: "#italic 安达卢斯优素福学苑 #!(我们仿照十四世纪格拉纳达优素福一世模式建立的王室经学院网络)在科尔多瓦、塞维利亚、托莱多、巴伦西亚与萨拉戈萨设立了拥有捐赠的宣教清真寺,每一所皆配有图书馆、济贫所,以及延聘自整个伊斯兰世界的师资。我们的学者将安达卢斯马立克学派的教法学,与开罗的艾什尔里派神学,以及源自波斯的伊本·西那哲学传统的复兴融为一体。这种由国家出资的学术培育出了一批识字的教士与训练有素的法学家阶层,他们对复国的忠诚直接系于国家所授予的职位之上。"
 adu_riba_al_andalus: "安达卢斯商路"
 adu_riba_al_andalus_desc: "我们的远程商业——#italic安达卢斯商路#!,即西地中海的商贸航线——通过驻扎于阿尔梅里亚、马拉加、加的斯与丹吉尔的安达卢斯商行,将热那亚人、加泰罗尼亚人、马格里布人与马穆鲁克的市场编织在一起。以我方金第纳尔开具的信用票据远至亚历山大港与布鲁日仍可流通,安达卢斯的犹太人与穆萨拉布金融家为那些年迈的基督教银行视为过于冒险而不敢触碰的商贸冒险提供担保。这张信贷与商贸之网,使我们能以更优惠的条件借贷,并对穿越伊比利亚水域的各类贸易一一课税。"
 adu_aman_ahl_al_dhimma: "齐米保护契约"
 adu_aman_ahl_al_dhimma_desc: "我们更新的保护盟约——#italic 迪米民众安全保障 #!，为复国境内的基督徒与犹太社群提供正式的保障，规管其教堂与会堂、内部法庭，以及他们以代役方式缴纳的 #italic 吉兹亚丁税 #!。穆德哈尔与穆萨拉布行会获得确认其技艺的王室特许状，而塞法迪犹太人的大金融商行亦在苏丹国的庇护下于科尔多瓦与格拉纳达重设分号。这种 #italic 共处共存 #! 之道将富有生产力的非穆斯林社群融入国家生活，使我们城市的多元性成为繁荣之源，而非叛乱之因。"
 adu_armada_andalusiyya: "安达卢斯联合舰队"
 adu_armada_andalusiyya_desc: "#italic安达卢斯联合舰队#!将驻于阿尔梅里亚与加的斯的国家海军,与萨累、得土安的特许私掠船队,以及自阿尔及尔行动的安达卢斯流亡船长们合为一体,形成一支足以在西地中海与任何同等基督教强权抗衡的统一指挥力量。该舰队的两栖战法将桨帆船与风帆船中队,与训练有素、能在敌岸迅速登陆并在炮火下迅速撤离的海军陆战纵队相结合。这支整合一体的海军力量使我军能以超越任何敌对舰队拦截速度的方式,投射兵力穿越直布罗陀海峡,并沿非洲沿岸展开行动。"
 adu_nahda_andalusiyya: "安达卢斯复兴"
 adu_nahda_andalusiyya_desc: "我们的近代复兴运动——#italic 安达卢斯复兴 #!，肇始于伊本·鲁世德与扎赫拉维的手稿在科尔多瓦重建的印刷所付梓刊行，继而围绕格拉纳达新设的皇家学院汇聚一堂，其学者可溯源至帕斯夸尔·德·加扬戈斯与赖因哈特·多齐的学脉，并于十九世纪末绽放于阿拉伯语—卡斯提尔语双语文学期刊之中。我们将欧洲新兴的科学著作译为现代阿拉伯语，并从埃斯科里亚尔、博德利图书馆，以及非斯与突尼斯的藏书楼中，重新寻回中世纪安达卢斯的典籍遗产。这场思想上的复兴运动，重新确立了我国作为地中海学术中心的地位，使我们宫廷的声望得以延续，远胜于其他王室不得不重新购置声望的时代。"
 #Spain
 spa_visigothic_inheritance: "西哥特遗产"
 spa_visigothic_inheritance_desc: "伊比利亚的基督教诸王国皆自称承继自托莱多统治西班尼亚、直至711年穆斯林征服为止的统一西哥特王权。我们的编年史家将莱昂与卡斯蒂利亚的每一位君主,经由佩拉约上溯至雷卡雷德与托莱多王冠,将收复失地运动塑造为一场 #italic 光复大业 #! ——即恢复一个本应合法存在的基督教王国,而非征服数个异邦。这种新哥特意识形态为西班牙王室提供了一套统一的叙事,为一个自比利牛斯山延伸至直布罗陀海峡的单一半岛君主国正名。"
 spa_idea_de_hispania: "西班牙理念"
 spa_idea_de_hispania_desc: "半岛各宫廷的编年史家与法学家们复兴了 #italic 西班尼亚理念 #! ——这一源自西哥特—罗马传统的观念,将伊比利亚视为一个共享同一历史命运与同一法律遗产的基督教诸王共同体。我们将汇编那些把半岛诸王室凝聚为可辨识的政治家族的世系谱牒、宗教会议法令与十字军诏书,我们的尚书省也将采用那套彰显西班牙正统性的礼式,使我们的君主有别于比利牛斯山以北那些仅具地方性的王朝。这一共享的理想使我们的尚书省得以援引共同的先例体系,从而简化本国的立法;而我们身处这一公认的基督教诸王家族之中,也意味着邻邦宫廷会将我们的举动视为同族之邦的行为,而非威胁。"
 spa_revival_of_ecclesiastical_discipline: "复兴教会纪律"
 spa_revival_of_ecclesiastical_discipline_desc: "西班牙各修会正站在 #italic 观察派改革 #! 运动的门槛之上，这场追求更严格修道纪律的运动，已在卡斯蒂利亚的方济各会和多明我会修院中生根发芽。我们将把王室的支持扩展到每个正规修会的观察派分支，取缔那些已放弃封院制度的住院修会，并将其财产转拨给接受王室与宗教裁判所联合视察的改革派热罗尼莫会、奥古斯丁会、加尔都西会与熙笃会。对正规教士进行彻底改革，将使西班牙教会在天主教欧洲其余地区尚未正视这一问题之前，便率先建立起一套严谨的道德秩序。"
 spa_school_salamanca: "萨拉曼卡学派"
 spa_school_salamanca_desc: "#italic 萨拉曼卡学派 #!（十六世纪以萨拉曼卡大学为中心的神学家与法学家群体）将托马斯主义的经院方法，运用于帝国、征服与全球贸易所带来的前所未有的问题之上。弗朗西斯科·德·维多利亚关于美洲印第安人权利的讲座、多明戈·德·索托的货币理论，以及路易斯·德·莫利纳对自由意志的论述，共同开创了欧洲关于自然法、国际法与经济理论的第一套系统思想。该学派为西班牙王室提供了一整套为其帝国事业辩护的思想武器，领先任何竞争对手整整一代人之久。"
 spa_siglo_de_oro: "黄金时代"
 spa_siglo_de_oro_desc: "西班牙正站在一场前所未有的文化繁荣——#italic黄金世纪#!——的门槛之上，其最初的迹象已在安东尼奥·德·内夫里哈的卡斯蒂利亚语语法著作以及天主教双王宫廷的艺术圈中显现。我们将通过#italic王室之家#!以及各修会的分支机构，将王室的扶持引向诗人、剧作家与画家，为塞万提斯、洛佩·德·维加、委拉斯开兹与卡尔德隆创作传世杰作提供必要的制度支持。这种持续的文化投入，将使西班牙在此后两个世纪中成为天主教世界的文学与艺术之都。"
 spa_spanish_enlightenment: "西班牙启蒙运动"
 spa_spanish_enlightenment_desc: "十八世纪下半叶，卡洛斯三世及其大臣（弗洛里达布兰卡、阿兰达与坎波马内斯）推行的波旁改革计划，将西班牙向更广泛的欧洲启蒙运动敞开大门。加斯帕尔·梅尔乔尔·德·霍韦利亚诺斯发表其农业报告，#italic祖国之友皇家经济协会#!遍布每一个省会城市，萨拉曼卡、阿尔卡拉与瓦伦西亚各大学将现代物理学、化学与政治经济学纳入课程；#italic王室造币局条例#!将牛顿式的化验标准推行到从塞维利亚到波托西的每一家皇家铸币厂；而马德里新设立的#italic圣卡洛斯银行#!则汇聚商人资本与王室存款，以任何私人银行家都无法提供的条件为公共项目融资。思想与财政上的现代化，为晚期西班牙王室配备了训练有素的大臣、行政创新、以国家信用利率发行的公共信贷，以及高产的银币铸造能力，使其得以在新的大陆格局中立足竞争。"
 #Iberia Region
 cas_the_reconquista: "收复失地运动"
 cas_the_reconquista_desc: "自西哥特王国遭受入侵并落于敌手，我们与摩尔人的战争已经持续经年累月之久。战争让我们发展出了引以为荣的严格军纪。卡斯蒂利亚的战士们，向世界展示你们的决心！"
 lieutenancy_advance: "副王"
 lieutenancy_advance_desc: "一方面，王冠领的领地在增加，另一方面，王冠领之内各个王国的君主常常空缺。这削弱了王领的权力，并导致与臣民的紧张关系。为了解决这个问题，“副王”应运而生，该职位是领内王国君主出缺期间的临时代表，并非永久性的。这些副王不仅拥有王室血统，还来自与王室关系紧密的内部圈子。"
 spa_viceroyalties: "西班牙总督制"
 spa_viceroyalties_desc: "自埃尔南·科尔特斯攻陷特诺奇蒂特兰、弗朗西斯科·皮萨罗攻陷卡哈马卡之后，卡斯蒂利亚与葡萄牙所征服的广袤领土，需要一种任何中世纪封建体制都无法提供的王室监管水平。我们将设立 #italic 总督辖区 #!（先是以安东尼奥·德·门多萨为首、设于墨西哥城的新西班牙总督辖区，而后是以布拉斯科·努涅斯·德·维拉为首、设于利马的秘鲁总督辖区），各辖区由一位总督统领，全权代表国王行使治理、司法、财政与防务大权。总督制度是一种远程治理的典范，成功维系了人类历史上面积最大的连续性帝国。"
 spa_naval_reforms: "西班牙海军改革"
 spa_naval_reforms_desc: "伊比利亚半岛的海岸线跨越三片不同的海域——比斯开湾、大西洋沿岸与西地中海——每一片都由不同的伊比利亚民族的舰队历经数百年发展出各自的航海传统。我们将把半岛上历来分散的各海军指挥体系，整合为一支统一的职业化 #italic 无敌舰队 #! ，置于集中统一的舰队司令权威之下，统一从海岸到海岸每一座船厂的征募标准、信号编码与补给制度。半岛各舰队的这一整合，将使我们的王室得以为日后数个世纪全球帝国所需的两大洋同时配备、维护并派遣舰队。"
 tercio: "西班牙大方阵"
 tercio_desc: "#italic特西奥方阵#!步兵主要由意大利战争期间那位才华横溢的将领贡萨洛·费尔南德斯·德·科尔多瓦（人称#italic伟大统帅#!）所创立。这是一种由长矛兵与火枪兵混合编成的步兵阵型。正因采用了这种诸兵种协同的方式，它能同时兼具重装步兵的坚固阵形与火枪兵的远程火力，无论攻守皆堪称理想。"
 catalan_galley_desc: "古希腊船只的自然演进，$n_catalan_galley$是这些船只的更大版本，比地中海其他类似船只的发展记录更早。"
 catalan_galley: "加泰罗尼亚桨帆战舰"
 early_iberian_caravel_desc: "最早的卡拉维尔帆船起源于伊比利亚，虽然体积小但速度极快，常用于近海捕鱼和沿海贸易。它在伊比利亚半岛的使用极为广泛，因此在那里可以找到最先进的卡拉维尔帆船。"
 early_iberian_caravel: "早期伊比利亚卡拉维尔帆船"
 early_iberian_galleon_desc: "$n_early_iberian_galleon$是一种强大远洋船只的早期版本，是半岛的原创发明，具有较低的前甲板和较长的船身，特别稳定且抗逆风能力强。"
 early_iberian_galleon: "早期伊比利亚盖伦帆船"
 iberian_caravel_desc: "随着对更快、更可靠的卡拉维尔帆船的需求增加，伊比利亚港口设计了更新、更大的卡拉维尔帆船。尽管卡拉维尔帆船在整个欧洲已经普及，但伊比利亚的卡拉维尔帆船仍在创新性和速度上占据优势。"
 iberian_caravel: "伊比利亚卡拉维尔帆船"
 iberian_galleon_desc: "$n_early_iberian_galleon$的自然演进，$n_iberian_galleon$是前者的更具特定风格化版本，它是强大的船只，将在海上击溃敌人。"
 iberian_galleon: "伊比利亚盖伦帆船"
 square_rigged_caravel_desc: "结合$n_iberian_caravel$和$n_carrack$的特点，一种新的船只已经诞生：快速、强大，正是我们主宰海洋所需的。"
 square_rigged_caravel: "横帆卡拉维尔帆船"
 ara_almogavars: "$a_almogavars$"
 ara_almogavars_desc: "$a_almogavars_desc$"
 ara_catalan_crossbowmen: "$a_catalan_crossbowmen$"
 ara_catalan_crossbowmen_desc: "$a_catalan_crossbowmen_desc$"
 ara_late_almogavars: "$a_late_almogavars$"
 ara_late_almogavars_desc: "$a_late_almogavars_desc$"
 cas_lanzas_de_castilla: "$a_lanzas_de_castilla$"
 cas_lanzas_de_castilla_desc: "$a_lanzas_de_castilla_desc$"
 por_cacadores: "猎击兵"
 por_cacadores_desc: "绰号#italic 斗鸡#!，猎击兵是葡萄牙军队中的精锐轻步兵部队，身穿棕色制服以区别于普通士兵。"
 #Italy Region Advances
 #Corsican Shared
 corsican_the_machja: "马基亚"
 corsican_the_machja_desc: "科西嘉内陆大多是茂密且带有芳香的常绿灌木丛——即意大利语中的#italic 马基亚#!，它们已成为人民生存策略的核心支柱。人民没有在脆弱的海岸上对抗强大的海上入侵者，而是发展出一种“战略撤退”到难以进入的花岗岩山脉中的文化。这造就了一个高地人社会，他们是在垂直地形中隐藏和快速移动的大师。这种文化适应已将岛屿的地理变成了我们文化的活堡垒，人民可以在那里无限期地保全自己的法律和习俗，免受任何海上入侵者的威胁。"
 corsican_the_vindetta: "血海深仇"
 corsican_the_vindetta_desc: "当过去的占领者试图在我们岛上强行推行僵硬的法律体系时，科西嘉人民以强化自身基于血仇复仇的传统司法制度作为回应。这在外人眼中或许是无法无天，实则是一套精妙的荣誉与自我约束的社会机制。它造就了一种人人须自卫其身、自护其族的文化，使全体民众皆习武善战、战术娴熟。这种"
 corsican_the_castagniccia: "卡斯塔尼恰"
 corsican_the_castagniccia_desc: "过去热那亚的占领大力推广栗树的种植，尤其是在中部高地。这造就了一种围绕栗树而形成的独特文化，为民众提供了一种可靠、省力且不受地中海市场谷物价格波动影响的食物来源。如此富足使科西嘉人获得了惊人的战略自主权：他们可以退入山区，仅靠栗子面粉便能无限期自给自足，从而使他们对过去热那亚海军舰队惯用的常规海上封锁与'饥荒围困'战术免疫。"
 corsican_the_corsican_baroque: "科西嘉巴洛克风格"
 corsican_the_corsican_baroque_desc: "一股巴洛克式教堂建筑的热潮已席卷全岛，资金来自归乡雇佣兵与商人积累的财富。这些教堂以"
 corsican_lamentu_and_voceru: "哀歌与复仇曲"
 corsican_lamentu_and_voceru_desc: "科西嘉的口述诗歌文化，特别是#italic 哀歌#!与#italic 复仇曲#!，已成为保存民族记忆的主要载体。这些歌曲充当着记录人民的斗争历程和他们的殉难者的名字的活档案。在文化上，这确保了抵抗精神从出生起就刻在每个孩子心中，使占领者无法通过“再教育”或同化来征服民众。这一口述传统作为一种强大的心理武器，即使在外国军事占领最黑暗的时期，也能维持高昂的士气与文化上的不屈不挠。"
 corsican_chjame_rispondi: "呼答歌"
 corsican_chjame_rispondi_desc: "在外国军事压力的漫长岁月里，科西嘉的口头传统#italic “呼答歌”#!演变成了一种精妙的社会凝聚工具。这种即兴的诗歌竞赛让人民能够在城镇广场上通过隐喻来辩论政治、纪念逝去的英雄，以及嘲笑占领者。这一切确保了启蒙思想的原则与大革命的记忆，即便对社会中的文盲群体也触手可及。通过鼓励这一传统，我们将塑造一个不受审查影响的统一文化叙事，确保科西嘉认同之火在任何局势下都熊熊燃烧。"
 #Corsican Unique
 cor_the_pievi: "堂区"
 cor_the_pievi_desc: "王国传统上划分为 #italic Pievi#!，这是以一座母堂为中心的传统行政区划。这些不仅是宗教单位，更是民政管理的基本节点。国家利用 #italic Pievani#!（教区神父）充当王室的登记官与法官，建立起一套高度地方化而又高效的税收网络。这确保了王国即便在最偏远的山村聚落也能动员资源，将崎岖的地形转化为一张结构严整的行政网格。"
 cor_the_milizia_di_u_riamu: "王国民兵"
 cor_the_milizia_di_u_riamu_desc: "在我们的主导下，科西嘉各氏族正迫于敌军的军事压力，将传统征召兵正式整编为结构化的“王国民兵”。这需要从氏族式散兵作战向国家军事义务的文化转型。每个教区都需要维持标准化的军械库并进行定期训练。这种“刀剑的国家化”将确保该岛拥有一支由公民组成的常备军，他们因个人利益而投入家园的防御。它将弥合北部和南部之间的古老鸿沟，创造出统一的军事身份，这将成为现代民族国家的前身。"
 cor_capituli_di_corsica: "科西嘉条款"
 cor_capituli_di_corsica_desc: "我们将把 #italic Capituli#!——中央王室与内陆崎岖山区公社之间订立的书面协议——正式确立下来。这些特许状将赋予山民特定的税收豁免权与地方自治权，以换取他们永久的兵役义务与忠诚。这是一项高明的内部治理手段，以王室权威换取绝对的忠诚，确保岛上地形最险恶之地由心怀忠诚、依附国家的民众所掌控，而非由叛乱的封建领主盘踞。"
 cor_guardia_corsa: "科西嘉卫队"
 cor_guardia_corsa_desc: "数十年来，科西嘉人一直谋求在教廷与法兰西国王等多方宫廷中担任精锐卫队，并因坚贞的忠诚与骁勇善战而声名远扬。我们将善用这一点，重赏这些老兵归乡训练地方民兵。这将造就一种"
 cor_u_ginnasiu_corsu: "科西嘉文理中学"
 cor_u_ginnasiu_corsu_desc: "为了减少对外国受教育官员的依赖，王国将建立第一批世俗的文理中学和学院。这将培养出一批本土的国家法学家，他们精通我国的地理和普通法。这种知识上的繁荣将成为科西嘉启蒙运动的摇篮，培养出一代管理者，他们重视理性治理和“人民权利”胜过古老的氏族传统，为国家走向现代宪政做好准备。"
 cor_the_corsican_constitution: "科西嘉宪法"
 cor_the_corsican_constitution_desc: "在我们的统治者领导下，科西嘉将颁布世界上第一部现代成文宪法，赋予所有财产所有者普选权。这将培育一种“开明公民”文化，使科西嘉人民视自身为欧洲自由的先锋。这种政治上的成熟将使国家得以建立强有力的国家机构。科西嘉宪法将成为一座“自由的灯塔”，影响未来的革命，并赋予人民一种超越我们地理面积的巨大自豪感和历史使命感。"
 #Emilian Shared
 emilian_al_po_doma: "只在明天"
 emilian_al_po_doma_desc: "艾米利亚人生活在洪水频发的平原上，掌握了河流渠化的技艺。这些水道不仅用于排水，还为丝绸工坊和谷物磨坊提供了可再生能源。这使得摩德纳和博洛尼亚等内陆城市不仅能够通过人工水道将货物运至波河与亚得里亚海，从而发挥工业枢纽的作用，同时也驯服了波河及其破坏性的洪水。"
 emilian_the_via_emilia: "艾米利亚大道"
 emilian_the_via_emilia_desc: "艾米利亚诸城邦应善用其位于埃米利亚大道（古罗马主干道）上的地理优势，设立国际商贸集市。我们将为这些活动的开展提供全面的安全保障，并统一度量衡标准。这将有助于我们赢得国际商人的信任，使来自阿尔卑斯山与地中海两地的商旅得以在此会聚。这种对贸易的专注投入，将使艾米利亚诸邦在奢华丝绸与香料贸易中，作为不可或缺的中间商而蓬勃兴盛。"
 emilian_dispenza_emigliana: "艾米利亚佳肴"
 emilian_dispenza_emigliana_desc: "艾米利亚的宫廷已发展出一种文化，每位厨师都成为本地区的使者。我们地区独特的产品（香醋、腌火腿和陈年奶酪）被用来吸引外国君主。这种通过味蕾征服的策略将确保我们在欧洲的宫廷中始终拥有影响力，凭借我们优质食物的排他性和品质来巩固联盟。"
 emilian_the_tera_cruda: "夯土棱堡"
 emilian_the_tera_cruda_desc: "面对敌军的现代火炮，我们意识到砖石过于脆弱。我们将率先采用夯土与砖面护墙相结合的筑城技术。这种应对石材匮乏而生的创新——即后世多称之为#italic意大利式筑城法#!——将使我们的工程师成为举世争相延揽的军事顾问，把我们的"
 emilian_la_mzura_dal_sol: "太阳度量"
 emilian_la_mzura_dal_sol_desc: "为充分利用波河谷地的资源，国家将对每一条排水沟渠与每一片田地展开科学测绘。这种丈量将把整片土地化作一张巨大的账册。它将使欧洲最精确的税收征管成为可能，确保这片肥沃淤积平原上的每一英亩土地，都能为国库缴纳其应得的份额，以资助国家的现代化建设。"
 emilian_al_melodram: "致歌剧"
 emilian_al_melodram_desc: "建造大型公共歌剧院将成为国家优先事项。这些剧院将是“人民的议会”，崛起的资产阶级在此聚会，通过音乐分享共同的民族史诗。这种文化将确保艾米利亚民众成为意大利政治动员程度最高的群体，使人民做好准备面对各种挑战。"
 #Emilian Unique
 blg_la_dota: "博学之城"
 blg_la_dota_desc: "博洛尼亚凭借其大学的兴起成为欧洲的智识实验室——这是世界上最古老的大学，为这座城市赢得了 #italic La Dòta #! （标准意大利语作 #italic La Dotta #! ：意为"
 fer_the_curtesia: "宫廷礼仪"
 fer_the_curtesia_desc: "随着自由公社向领主制过渡，费拉拉宫廷成为中世纪晚期骑士文化的中心。这是法国亚瑟王传说与意大利人文主义智慧的文化融合。它创造了一套精致的宫廷礼仪，已成为欧洲贵族的黄金标准，使我们的宫廷成为一个外交枢纽，在那里，“可能的艺术”通过优雅的对话和艺术赞助来实践。"
 man_casa_gonzaga: "贡扎加家族"
 man_casa_gonzaga_desc: "一个多世纪以来，#italic贡扎加家族#!统治曼图亚，不是以征服者的姿态，而是以与臣民缔结互惠契约的领主身份，这种合法性绝非单凭军事力量所能购得，我们也始终恪守此道，从未将这座城市视为可任意榨取的资源。我们通过三条相互交织的途径维系这一地位：教会庇护将臣民以共同的信仰联系在一起；正式的王朝头衔为我们的统治奠定了对手无法挑战的法理根基；而我们对曼图亚市民仍视为世袭权利的公社传统的刻意尊重，更使这一地位稳固。立足于信仰、王朝与公民契约之上，我们的国家拥有每位臣民在日常生活中都能切身感受到的合法性，我们的统治也因此比任何单纯依靠武力建立的秩序更加稳固。"
 mod_the_ancient_commune: "古老公社"
 mod_the_ancient_commune_desc: "在伟大的王朝出现之前，波河平原上的城市通过选举产生的执政官和宣誓的公民协会来自我管理，建立起没有任何领主能够完全取代的公民组织习惯。我们利用这一遗产，来规范王室与我们城市社区之间的关系，以承认的权利来换取支撑国家的税收和士兵。这种王冠与城市之间的契约，将我们的权威建立在同意和武力两者之上，使我们的臣民成为政府的伙伴，而不仅仅是政府的臣民。"
 par_commune_of_parma: "帕尔马公社"
 par_commune_of_parma_desc: "帕尔马的自治传统由来已久，形成于意大利公社时代，当时这座城市与邻邦并肩作战，抵御帝国的野心，捍卫自身自由。我们利用这一遗产来规范王室与我们城市社区之间的关系，以保护和被承认的权利来换取支撑国家的税收与士兵。这种契约将我们的权威建立在同意和武力两者之上，使我们的政府对于生活在其治下的所有人来说，成为一个更稳定、更具合作性的伙伴。"
 pcz_commune_of_piacenza: "皮亚琴察公社"
 pcz_commune_of_piacenza_desc: "皮亚琴察早在任何领主到来之前就作为公社自我治理，而自治的那些制度——包括选举产生的执政官、市镇法庭、公民可执行的成文法规传统——通过适应而非抵抗，在每一次政权更迭中存活了下来。我们利用这一深厚的市民传统来合理化城市的管理，减少不成文习俗所造成的摩擦，并为城市人口提供一个他们认可为合法属于自己的治理结构。这种对#italic “公社制度”#!的复兴，使我们的国家更加稳定，也使我们的臣民更愿意履行其义务，无需昂贵的强制手段。"
 blg_la_grasa: "拉格拉萨"
 blg_la_grasa_desc: "凭借波河平原的丰饶物产和博洛尼亚行会的精湛技艺，我们的首都将因无与伦比的富饶而赢得声誉，并获得第二个绰号：#italic 拉格拉萨#!（标准意大利语中意为#italic 胖子#!）。通过投资四方市场区及精制肉类与面食产业，我们将确保每位旅人饱腹而归，钱包却空瘪而去。"
 fer_studio_di_ferrara: "费拉拉学院"
 fer_studio_di_ferrara_desc: "费拉拉大学由埃斯特家族创办，是最早的同类学府之一，吸引了来自意大利各地的人文主义者和法学家来到我们的宫廷。在杰出学者的指导下，我们的课堂成为新学问的工坊，培养出我们不断扩大的国家所需要的识字的仆从和外交官。这一机构确保知识和新制度在我们的土地上传播得比任何仅靠战争维系的王国都更快。"
 man_gonzaga_patronage: "贡扎加的艺术赞助"
 man_gonzaga_patronage_desc: "我们的宫廷已成为半岛上吸引艺术人才的一大磁极：画家、雕塑家与建筑师纷至沓来，他们深知曼图亚厚待雄心壮志之人，也深知在此完成的作品将呈现在每一位遣使来访的君主眼前。我们将这一庇护传统正式制度化，设立津贴与工坊，令多位艺术家常驻于此，并确保他们的作品能够彰显我们欲树立的声望。这种 #italic Mecenatismo #! 文化降低了供养艺术家的成本，也吸引了最顶尖的人才永久定居于此，而非仅为一次委托匆匆路过。"
 mod_este_textiles: "埃斯泰纺织工艺"
 mod_este_textiles_desc: "摩德纳的工坊长期以来生产的丝绸和羊毛布料质量上乘，在北方的大集市上能卖高价。在我们的赞助下，我们通过保护将织造技艺集中在我们城内的行会实践，并确保最有技能的工匠培养他们的接班人，从而深化了这一传统。这种对工艺的投资将我们的商人转变为欧洲宫廷信赖的供应商，并为我们的国库带来不依赖于战争运气的稳定回报。"
 par_the_bishop_of_parma: "帕尔马主教"
 par_the_bishop_of_parma_desc: "#italic 帕尔马主教#!长期以来行使着与这座城市世俗权力相抗衡的权威，通过意大利北部一些最出色的宗教建筑引导着城市的精神生活。我们选择与这一机构结盟而非对抗，将其影响力引向我们人民的稳定与虔诚。王权与教会之间的这种合作巩固了臣民的信仰，并为我们的政府提供了一种任何军事力量都难以替代的道德权威来源。"
 pcz_collegium_placentinum: "皮亚琴察学院"
 pcz_collegium_placentinum_desc: "皮亚琴察的法学传统早于本地区各大名校；正是从我们的城市出发，注释法学家与法学家们将对罗马法的精深知识传播到整个半岛，这一知识数百年来构成了意大利治理的智识基础。我们重振这一传统，设立专门致力于法律与市政管理的学院，从本城市民家族中招收学生，培养出能够管理现代国家法律与财政机构的训练有素的行政阶层。这所#italic皮亚琴察学院（Collegium Placentinum）#!提升了我们治理阶层的识字率与才干，也使我们的法律具备清晰、统一的形式。"
 blg_la_rassa: "红城"
 blg_la_rassa_desc: "#italic 红城#!，博洛尼亚的别称，这是对我们天际线的那一抹深红的赞美。从阿西内利塔俯瞰，那片古老的赤褐色砖墙与红色屋顶的海洋，令我们的臣民敬畏，也使我们的敌人恐惧。红色与我们城市的联结是如此紧密，以至于我们必须制定法律，确保任何目前不在我们偏好色谱中的建筑，都尽快用红色陶土重建。"
 fer_ladizion_erculea: "埃尔科莱的扩建"
 fer_ladizion_erculea_desc: "费拉拉首创了“理想城市”的理念。国家将不再遵循中世纪时自然生长的模式，而是实施大规模、有规划的城区扩建，修建宽阔的林荫大道和对称的广场。这将成为欧洲现代城市规划的首个范例，旨在体现国家的秩序与威严。此举将改善公共卫生，便利军事调动，使费拉拉成为西方最现代、最有声望的国家。"
 man_studium_mantovano: "曼托瓦学院"
 man_studium_mantovano_desc: "我们在曼图亚建立了一所正式学院，从该地区各大大学聘请法律、哲学与艺术领域的教师，为我们的市民阶层子弟及小贵族提供教育；在此之前，这种教育只有富庶到能去博洛尼亚或帕多瓦的人才能获得。该机构将曼图亚与流经那些大学校的欧洲学术网络连接起来，将法学、神学和自然哲学领域的最新思想带入我们的城市，而非经数年书信往来方姗姗来迟。这所#italic 曼图亚学院#!提高了我们统治阶级的识字率，并确保新思想在我们中间生根的速度与它们在意大利任何地方传播的速度一样快。"
 mod_estense_library: "埃斯特图书馆"
 mod_estense_library_desc: "在意大利众多著名的私人图书馆中，我们的藏书独树一帜：历经数代积累而成，其中的手抄本与装饰精美的典籍吸引了来自全欧的学者汇聚我们的宫廷。我们对这一藏书加以整理扩充，使之成为一座实至名归的学术机构，让博学之士在我们的庇护下不断拓展知识的疆界。这种对精神生活的投入加速了新思想在我们领土上的传播，也向世界昭示：我们的宫廷正是文明昌盛之地。"
 par_the_new_duchy: "新公国"
 par_the_new_duchy_desc: "我们的城市晋升为一个独立国家的都城，标志着帕尔马新篇章的开启：它不再是辗转于列强之间的属地，而是一个拥有自身传统与抱负、受到承认的领土国家之所在。我们迅速着手建立彰显主权的制度与仪典，赋予臣民明确的身份认同，也让邻国有了明确的交涉对象。这种合法权威的巩固，使我们的国家更难被吞并，也更易于治理。"
 pcz_piacentine_soldiery: "皮亚琴察士兵"
 pcz_piacentine_soldiery_desc: "皮亚琴察的乡村长期以来培养出的士兵质量，超出了这座小城的规模所预示的水平。这些在波河河谷农庄和亚平宁山麓长大的士兵，能够经受住一场军事行动而不厌战，坚守阵线而不溃散；而我们则在训练、薪资和军官方面加以投入，将这些禀赋转化为职业化的纪律。这支#italic 皮亚琴察士兵#!为我军提供了一支经验丰富的步兵核心，即使在那些意志薄弱的部队会溃散的条件下，他们仍能保持凝聚力。"
 blg_lacademia_di_incamine: "启程者学院"
 blg_lacademia_di_incamine_desc: "随着文艺复兴的狂热激情逐渐冷却，教育正转向有组织的学院。这些是国家资助的机构，面向科学家、作家和画家，其目标是通过从风格主义转向自然主义和写生，来改革艺术教育。这些改革将使国家能够把艺术和科学创作引向国家声望，最终催生“博洛尼亚画派”，它将主导欧洲的审美长达数十年。"
 fer_court_of_letters: "文学宫"
 fer_court_of_letters_desc: "我们的宫廷已成为意大利最著名的文学聚会场所，诗人在大厅中吟诵，学者在花园里辩论哲学，他们的作品既被当作治国的工具，也被当作私人的乐趣来支持。我们的名字就是方言文学卓越的代名词，吸引着半岛各地的人才前来争夺我们的青睐和赞助。这种文化声誉加深了我们的艺术遗产，使在这里诞生的每一部伟大作品都成为我们国家声望的广告。"
 man_palazzo_te: "特宫"
 man_palazzo_te_desc: "费代里科二世·贡扎加委托朱利奥·罗马诺在城郊的一座小岛上建造一座享乐宫殿，由此诞生了#italic德泰宫（Palazzo Te）#!——文艺复兴时期最富创意的建筑之一，其建筑语言对古典传统的引用充满精妙的机巧，以至于学者们至今仍在争论其中的反讽意味。殿内的壁画房间，从巨人在画中废墟中轰然倒塌，到费代里科马厩中以真人大小自信呈现的骏马，构成了意大利北部最大胆的装饰计划。这一非凡成就深化了我们的文化传统，也使在我们庇护下产生的作品具有独特的品格，备受收藏家与各国宫廷青睐，远胜于对手们较为平庸的出品。"
 mod_palazzo_ducale: "公爵宫"
 mod_palazzo_ducale_desc: "我们将建造一座与我们的雄心相称的宫殿，一座以石材与灰泥铸就的丰碑，向世界宣示永恒与权力，而非前人那种临时拼凑的浮华。每一座厅堂与长廊的设计都旨在令来访使节为之叹服，并强化臣民心中的敬畏，使建筑本身成为我们王朝正统的明证。这种对外在壮丽的投入，终将以声望与吸引至我们都城的艺术委托作为回报。"
 par_the_opera_obsession: "歌剧痴迷"
 par_the_opera_obsession_desc: "帕尔马将蜕变为一座孕育戏剧奇迹的实验室，并最终建成世界上第一座永久性镜框式舞台剧院。通过确立这种画框式舞台，帕尔马将在观众与演出的神圣技艺之间划出一道实实在在又意味深长的界限。我们对舞台场景（scena）的执着——融合复杂的水力装置与巧妙的滑轮系统——将使歌剧从学院式的实验，升华为彰显国家权力的至高盛典。这一建筑上的突破，将使我们成为全球舞台设计师心向往之的中心，为现代歌剧院树立技术标准。"
 pcz_the_citadel: "皮亚琴察城堡"
 pcz_the_citadel_desc: "我们的城市地处波河渡口要冲，这使它成为意大利北部争夺最为激烈的战略要地之一，而我们的应对之策，便是投资建造一座与自身地位相称的要塞。我们所建造的城堡不仅仅是驻军的避难所，更是一座能够在城市外交涉条款期间独立支撑围城战的自足要塞，其设计迫使任何进攻者必须面对层层设防，而非单薄的一道城墙。这座 #italic 堡垒（Cittadella）#! 使夺取皮亚琴察、乃至对我们维持占领都代价高昂，从而削弱了强大势力将我们的城市视为可凭一次征战轻易吞并的意愿。"
 blg_the_bolognese_school_of_music: "博洛尼亚乐派"
 blg_the_bolognese_school_of_music_desc: "博洛尼亚将成为协奏曲与管弦乐队专业化的发展中心。通过摒弃过去不可预测的调式传统，我们将建立现代大小调调性的严谨规则。这一综合体系将把小提琴从一件民间乐器转变为巴洛克时代的主要音色，使#italic 三重奏鸣曲#!和#italic 大协奏曲#!得以标准化。这种显见的简洁性，将很快成为声望的标杆，从意大利的主教座堂传播到最遥远的欧洲宫廷。它也将标志着从实验性的文艺复兴风格向自律的、器乐炫技时代的最终过渡。"
 fer_ferrarese_silk: "费拉拉丝绸"
 fer_ferrarese_silk_desc: "我们土地上的蚕和我们织工灵巧的双手，长期以来生产着品质卓越的布料，我们已将这手艺变成了我们经济中最可靠的支柱之一。通过规范贸易和保护我们的工匠大师，我们确保生丝在这里被加工成成品，而不是廉价出口给竞争对手。这种对布料贸易的掌控使我们的商人行会保持繁荣，并确保这里生产的每一匹布都将我们名字的声望带到欧洲的市场。"
 man_monteverdi_orfeo: "蒙特威尔第的《奥菲欧》"
 man_monteverdi_orfeo_desc: "当克劳迪奥·蒙特威尔第在我们的公爵宫中为“痴迷者学院”（Accademia degli Invaghiti）上演#italic《奥菲欧》（L'Orfeo）#!时，他为世界带来了第一部真正意义上完整的歌剧：一部将人声、乐器与戏剧熔铸为一体的作品，观众立刻意识到这是前所未闻的全新形式。曼图亚正是这一变革发生之地，而曼图亚宫廷正是促成此事的机构，它为蒙特威尔第提供了歌手、乐手以及持续不断的庇护，若无此支持，排练与乐谱都将无从成形。这一歌剧诞生之初的首创地位，使我们的宫廷成为公认的欧洲最具影响力的新艺术形式之发源地，而在其熏陶下成长的艺术家们，也将我们的声誉带往他们日后登台的每一个舞台。"
 mod_diplomazia_balsamica: "香醋外交"
 mod_diplomazia_balsamica_desc: "我们将把香醋的生产从传统的家庭用品转变为受国家保护的奢侈品。它只由我们的精英家族生产，将成为一种外交礼品，用来在朋友和对手的宫廷中巩固联盟和换取贸易利益。这些小小的奢侈品将确保摩德纳品牌始终等同于极致的品质和排他性。"
 par_prosciutto_e_parmigiano: "帕尔马火腿与帕玛森奶酪"
 par_prosciutto_e_parmigiano_desc: "在我们城市周围低地生产的风干火腿和陈年奶酪轮已成为销往整个大陆的奢侈品，作为波河平原所能提供的最佳产品的象征进入宫廷和商行。我们保护并规范这些产品的生产，制定使它们与众不同的标准，确保它们的出口在取悦顾客的同时也充实我们的国库。这种烹饪上的卓越声誉将一项朴素的农业传统转变为持久的商业和外交声望的来源。"
 pcz_administrative_reform: "皮亚琴察行政改革"
 pcz_administrative_reform_desc: "皮亚琴察的统治者们治理着一个靠裙带关系拼凑起来的国家，靠统治家族在军事上的无情和行政上的精明这一不寻常的组合维系着，而事实证明后者更为持久。我们致力于对财政和行政机构进行系统性改革，将最高效的意大利诸邦的做法引入这片长期依靠个人权威而非制度程序来运转的领土。这场#italic 行政改革#!以能力而非关系来提拔最有才干的臣民，并让我们的市民阶层在国家效率中拥有切身利益——这个国家的税收最终奖励的是生产者，而非征收者。"
 blg_galvanism: "电学"
 blg_galvanism_desc: "博洛尼亚大学依然处于启蒙运动的前沿。在博洛尼亚的一间实验室里发现的动物电，为现代生物电学和物理学奠定了基础。这种探究精神将把这座城市变成早期工业和科学先驱的中心，弥合古代经院哲学与现代实验室之间的鸿沟。"
 fer_po_delta_reclamation: "波河三角洲垦殖"
 fer_po_delta_reclamation_desc: "波河沼泽三角洲长久以来一直是我们门前积水成洼、瘴气弥漫的荒地。通过系统性地组织排水与筑堤工程，我们将这片湿地转变为丰饶的农田，既扩大了税基，又减轻了边境社区的疾病负担。将这片土地改造为井然有序、利润可观之地，正是我们治理理念的具象体现——国家本身即是这片土地的工程师。"
 man_po_agriculture: "波河平原农业"
 man_po_agriculture_desc: "环绕曼图亚三面的低地平原是意大利最肥沃的土地之一，我们对其管理的系统性投入已成为本国经济的基石：排干沼泽、扩建灌溉渠道，并对界定我们地理轮廓的湖泊边缘新垦土地加以规范管理。其成果是一种逐代稳步增长的农业产能，为我们的城市提供了足以维持远超政治本身所能支撑之人口规模的粮食盈余。这种对 #italic Pianüra Padâna #! （标准意大利语作 #italic Pianura Padana #! ：意为"
 mod_accademia_militare: "军事学院"
 mod_accademia_militare_desc: "我们将设立一所专门的军官正规训练学院，将军事精英的培养从军营中那种零散的学徒式传授，转变为课堂中系统化的教学。几何学、筑城术、战术与指挥之艺都将作为正式学科传授，培养出能够据理分析问题、而非仅凭惯例行事的军官。这所学院终将成为欧洲同类机构中的佼佼者，其毕业生也将为远超我们国境的各国军队所争相延揽。"
 par_enlightened_duchy: "开明公国"
 par_enlightened_duchy_desc: "一代改革者已使我们的宫廷确信，旧有的政府机器——其特权、其豁免、其迟缓的习惯程序——与其说是在保护臣民的福祉，不如说已成为阻碍。我们系统性地以成文法取代惯例，使税收、教育与公共事务的管理皆建立在理性之上。这种对理性治理的坚持使我们的国家运作更加高效，法律更加可预期，也使我们的臣民更愿意相信政府是在为他们的利益行事。"
 pcz_new_industry: "皮亚琴察新工业"
 pcz_new_industry_desc: "波河提供运输，山麓提供木材和水力，加上长久以来习惯了贸易的市民阶级，这些条件结合在一起，为皮亚琴察提供了许多更大城市所缺乏的早期工业发展的自然前提。我们投资于作坊、信贷机构和劳动力市场改革，使这些前提条件能够推动制造业的持续扩张，而非如多数城镇那样仅能维持零散的手工生产。这种对#italic 新工业#!的投入吸引了来自乡村的工人，扩大了我们的城市人口以及国家从中获取税收的收入基础。"
 #Ligurian Shared
 ligurian_coastal_seafarers: "利古里亚沿海航海者"
 ligurian_coastal_seafarers_desc: "沿着利古里亚海岸（从文蒂米利亚的渔港到拉斯佩齐亚上方的山村）的每一个社区，数百年来都曾派遣人们乘坐小型沿岸船只出海，熟谙地中海最严酷海岸之一的洋流、险情与气候。这种务实的航海传统，早在我们的任何一座城市建造远洋战舰之前，便已培养出素质非凡的水手，而由这些人维系的沿岸贸易，也将货物运送到任何内陆道路都无法高效抵达的港口之间。我们的航海传统赋予商人在沿海与区域贸易中天然的优势，而我们派往海上的任何桨帆船队，船员们早已谙熟这片水域。"
 ligurian_merchant_diaspora: "利古里亚商人侨居地"
 ligurian_merchant_diaspora_desc: "我们海岸的商人们从不等待那些大贸易城市来邀请他们加入；他们在每一个能够抵达的港口建立殖民地、代理行与合伙商号，从黑海沿岸的卡法与佩拉定居点，到塞维利亚与里斯本的账房商行，无不留下他们的足迹。这些 #italic Colonie#! 依靠信任与宗亲关系编织成网络，使热那亚的信用在亚历山大港与在本土一样可靠，而沿着这些网络流动的信息，又让我们的商人在每一个市场中都占得先机。这种散居四方的格局，把地理劣势转化为优势，使我们的商业触角远远超出我们舰队规模本应能及的范围。"
 ligurian_spirit_of_navigation: "利古里亚航海精神"
 ligurian_spirit_of_navigation_desc: "利古里亚海岸孕育出的航海家之多，与其疆域之小极不相称：克里斯托弗罗·科伦坡为卡斯蒂利亚的野心打开了西大西洋的航道，乔瓦尼·卡博托为英格兰王室绘制了新大陆北岸的地图，还有一代又一代领航员，凭借其技艺，驾船驶入欧洲船只所能抵达的每一片海洋。这种培养出敢于凭借并不完善的海图驶向地平线之外之人的传统，为利古里亚的航海技艺赢得了声誉，吸引了本不会留意我们这片狭小海岸的宫廷前来投资与庇护。这种航海文化提升了我们在列强之中的地位，并从遥远的异邦吸引技艺精湛的移民与寻求财富之人来到我们的港口。"
 ligurian_artisan_craft: "利古里亚工艺"
 ligurian_artisan_craft_desc: "利古里亚海岸的作坊发展出一套精湛的装饰工艺传统：城中金匠打造的银 #italic Filigrànn-a#! （标准意大利语称 #italic Filigrana#! ，即「金银细丝工艺」）、阿尔比索拉窑中烧制的马约里卡陶器，以及我们的织工早在十四世纪便已炉火纯青的精致天鹅绒织法——这些商品无论富有的主顾身在何处，只要他们寻求比寻常市场更为精美之物，便能在此觅得买家。这种工匠文化与制作日常粗货的同一批作坊并肩兴盛，赋予了我们的工匠一种纯粹专注奢侈品的行会所无法比拟的灵活性。这种精美装饰工艺的传统，吸引当世最杰出的艺匠前来定居，并确保他们所制之物无论销往何处，都能卖得高价。"
 ligurian_communal_councils: "公社议会改革"
 ligurian_communal_councils_desc: "数百年来管理利古里亚港口生活的自治公社，逐渐走向正式化与条理化，以成文宪章、选举产生的委员会以及标准化的行政程序取代非正式的惯例，使地方政务运作更为顺畅。这些经过改革的议会，为商人阶层提供了一个有章可循的场所，使其得以管理社区事务，而不必仰赖贵族的庇护或遥远的司法权威，从而把公民治理的能力深植于利古里亚每一座城镇的制度之中。我们的行政传统赋予政府深厚的治理人才储备，也使我们的制度对维系我们商业的市民更为敏锐回应。"
 ligurian_enlightenment: "利古里亚启蒙运动"
 ligurian_enlightenment_desc: "#italic 利古里亚#!的哲学家和法学家对启蒙思想的参与程度不亚于欧洲任何学派，他们主张理性和自然法的原则要求对国家如何治理和法律如何制定进行全面的重新思考。我们借助这一传统从内部改革制度，用编纂成文的程序取代习俗与特权，并将这个时代最优秀的行政人才引入公共服务。这种对理性治理的承诺使我们的法律更清晰、改革成本更低,也让国家更难被颠覆。"
 #Ligurian Unique
 genoese_maritime_diplomacy: "骄傲之城"
 genoese_maritime_diplomacy_desc: "自中世纪早期以来，我们的共和国便建立在商业与信用两大支柱之上，我们开创了债务和汇兑工具，为我们从#italic 黎凡特#!到黑海的贸易站提供了资金。我们在整个地中海地区的殖民地和商站，既是外交前哨，也是商业前哨，赋予了任何纯粹军事力量都无法比拟的覆盖范围。这种金融与治国方略的网络，确保我们的银行家和使节能够协同工作，降低了信贷成本，并使更多的外交官为我们服务。"
 bank_of_saint_george: "圣乔治银行"
 bank_of_saint_george_desc: "#italic Casa di San Giorgio#! 为整顿共和国日益高企的债务而设立，如今已成为基督教世界中最为精密的金融机构之一。私人债权人与国家共同参与其治理，将 $GEN_ADJ$ 的财富引向海外的各项事业，同时又将借贷成本维持在低位。公私资本一旦联合，便能为我们的宏图伟业提供大规模的资金支持。"
 genoese_flexibility: "新共和国"
 genoese_flexibility_desc: "在十六世纪初那段动荡的岁月里，#italic 安德烈亚·多里亚 #! 重整了我们的共和国，将旧日的贵族派系合并为二十八大家族，即 #italic Aberghi #!（标准意大利语称 #italic Alberghi #!，意为「大家族」），赋予我们长久以来所欠缺的政治稳定。正是这种务实精神重塑了我们的舰队，使我们的海军专长转向在整个地中海范围内提供服务，而非局限于单一的战略姿态。这种自我革新使我们得以用更低的成本维持海军，并在时机需要时将战桨帆船改装为更轻便的船只。"
 the_age_of_the_genoese: "热那亚人的时代"
 the_age_of_the_genoese_desc: "#italic 皮亚琴察#!的盛大银行交易会，使得$GEN_ADJ$的金融家们成为了西班牙王室不可或缺的债权人，并在此后世代扮演着欧洲资本流动的仲裁者角色。经过我们手中的巨额财富，最终汇聚于我国商人贵族的宫殿与别墅之中，他们已构筑起地中海世界最为广泛的商业网络。这种在欧洲金融界的至高地位，令我们的商业网络效率远超任何竞争对手；而经由这一网络汇通$GEN$的贸易活动，则从欧洲各大商业圈中汲取丰厚回报，不断充盈着我国国库。"
 genoese_school: "热那亚画派"
 genoese_school_desc: "数个世纪的贸易繁荣使$GEN$成为收藏家与赞助人的城市，从这种环境中诞生了独特的#italic $GEN_ADJ$画派#!，以其对戏剧性光线与丰富质感的精湛掌握而著称。在我们的共和国培养下，艺术家将$GEN_ADJ$的品味与声望带到了欧洲各地的宫廷与收藏馆中。这种艺术文化的兴盛深化了我们的传统，并将我们的影响力扩展至纯粹政治手段所不及之处。"
 gen_free_port: "自由港"
 gen_free_port_desc: "随着大西洋航路日益将贸易从地中海引开，我们以宣布我们的港口为 #italic Porto Franco#! 作为回应——一座向各国商人开放的自由港，免除了压在我们对手身上的种种关税与限制。那些曾绕开利古里亚的船只，如今纷纷停靠我们的码头，城中再度充满了外国商行、仓库与金钱。这种对各方来客一视同仁的开放态度，使我们的港口成为西地中海最繁忙的转运枢纽之一，同时招徕贸易与人流。"
 #Lombard Shared
 milanese_tradition: "市政自由"
 milanese_tradition_desc: "自伦巴第同盟时代以来，伦巴第的城市通过选举产生的执政官与独立法庭进行自治，建立了一种没有任何皇帝能够完全摧毁的城市法传统。我们通过将这些市政自由编纂成正式宪章来继承这一遗产，授予我们城镇一定程度的公认自治权，以换取它们忠诚地缴纳赋税与提供军队。这种王权与城市之间的契约使我们的城市人口保持参与与投入，减少了那些在需要征召臣民时就会耗尽其他国家的摩擦。"
 patron_of_music: "$lombard$银行家"
 patron_of_music_desc: "数代以来，$lombard$的商人与银行家已在欧洲各城市立足，向那些在其他地方找不到更可靠信贷来源的宫廷与贸易行提供贷款。通过受监管的汇兑行与固定期限的信用证将这一声誉正式化，我们使我们的金融网络成为国家有意识的工具，而非零散的私人企业集合。这种对外国国库的渗透使我们在欧洲宫廷中拥有了仅凭军事力量永远无法获得的发言权。"
 age_of_condottieri: "纳维利运河"
 age_of_condottieri_desc: "穿梭于$lombard$平原的运河网络最初仅是简单的灌溉系统，如今却已发展为我们整个地区的经济命脉。它将米兰与波河相连，以仅及陆路运输一小部分的成本运送谷物、木材与制成品。我们投入资金拓宽并加深这些水道，还新建了船闸，使更重的驳船能够全年运行，不再依赖季节性水位变化。这一网络既降低了供应城市与调动军队的费用，也让伦巴第成为意大利治理效率最高的地区之一。"
 merchant_princes: "伦巴第明暗法"
 merchant_princes_desc: "米开朗基罗·卡拉瓦乔出生于贝加莫附近的一座小镇，他开创了一种直接而粗犷的光影绘画手法。与之相比，其他所有画派的作品都显得矫揉造作。他的追随者将#italic 明暗法#!技法从我们的城市传播至罗马、那不勒斯与马德里，而赞助人已开始明确委托创作具有伦巴第风格的作品。这样的声誉为我们的城市吸引了众多收藏家与学者，而我们培养的艺术家无论走到何处，都备受追捧、供不应求。"
 lombard_silk_masters: "丝绸大师"
 lombard_silk_masters_desc: "科莫湖和$lombard$平原上的桑林与丝绸作坊，为欧洲的宫廷提供了所能获得的最优质丝绸面料，我们的织工已将生产工艺精进到了外国竞争者难以复制的程度。我们通过管控生丝的出口以及大师级织工的技艺来保护这一优势，确保增值的工序留在境内，而不是以廉价的原材料形式流出。这种对整个生产链的控制，将丝绸从一种地方贸易转变为稳定的收入来源，即使在其他大宗商品价格下跌时也能保持其价值。"
 lombard_the_manifattura: "工业升级"
 lombard_the_manifattura_desc: "在贝加莫与科莫周边的山麓地带，英式纺纱机与动力织机正在取代旧式的家庭作坊，借阿尔卑斯溪流驱动的工厂，生产布匹的速度与成本，已是任何手工织工都望尘莫及。我们投身于这场转型，兴建企业城镇，延请外国工程师训练我们的工人，将原本散落各地的家庭织机，转变为一个现代化产业。这一制造业基础使伦巴第成为意大利的生产重心，其所创造的财富流向我们领土的每一个角落。"
 #Lombard Unique
 milanese_heritage: "蛇纹章"
 milanese_heritage_desc: "维斯孔蒂家族的盘绕巨蛇，已成为北意大利权力最为人熟知的象征，印刻在我们的钱币、印玺之上，也悬挂在每一座听命于我们的城市的城门上。通过将 #italic Biscione #! 定为公国的官方标志，我们将这一地区的忠诚与我们的王朝而非任何一个贵族派系牢牢绑定。如此视觉权威，使得对手远难质疑我们的统治，而我们使节凭证上的那条巨蛇，更能开启那些对其他意大利君侯紧闭的大门。"
 renaissance_prince: "大教堂工坊"
 renaissance_prince_desc: "敬爱的#italic “大教堂工坊”#!长期雇佣着一支由石匠、工程师与建筑大师组成的固定团队，这一传统世代延续，将大教堂视为一项永不停歇的使命，而非一个终将完成的项目。它更像是一所机构——只要工作需要，便会持续培育工匠、精进技艺。我们扩展了其职责范围与资金支持，确保它所积累的知识能够流向我们领土内的每一处建筑工地。正因如此，这座工坊将米兰塑造成了一所实用的建筑学校，其培养出的工匠在整个北意大利都备受青睐。"
 lowered_power_of_barons: "米兰盔甲士"
 lowered_power_of_barons_desc: "我们作坊打造的胸甲，价格之高，科隆或托莱多的匠人都无法企及，我们的军械坊为从葡萄牙到波兰的宫廷与将领供应装备。我们将铠甲匠行会置于公国的监管之下予以正式化，制定标准以维护我们的声誉，并将技术知识及其利润留在我们的城墙之内。这种对高档军备的垄断为我们带来稳定的收入，也使我们自己的部队比任何须从他处进口板甲的敌人装备得更为精良。"
 encouragement_of_philosophers: "博罗梅奥改革"
 encouragement_of_philosophers_desc: "卡洛·博罗梅奥对 $MLO$ 的治理，成为这个时代最受研究的制度改革典范：严格重组地方层级架构，为官员建立标准化培训，并以定期巡视深入我们领地的每一个村庄。我们全盘采纳他的模式，动用手中每一项制度，将教育与纪律推广到全国各地。这项改革造就了一个识字率更高、与国家制度联系更紧密的民众，使维持社会秩序变得容易得多。"
 rulership_of_enlightened_principals: "贝卡里亚论犯罪与刑罚"
 rulership_of_enlightened_principals_desc: "我们的城市孕育了切萨雷·贝卡里亚，他关于犯罪与刑罚的论著已成为欧洲阅读最广的法学著作，主张法律应以必然性而非残酷性来遏制犯罪。按照这一思路改革我们的刑法——以比例刑罚与公开审判取代酷刑与擅断判决——我们便能建立一套被市民视为公正而非掠夺性的法律体系。这使我们的城市更易治理，也更能吸引那些深知自己的纠纷将依法而非靠贿赂解决的商人与投资者。"
 milanese_ambition: "斯卡拉歌剧院"
 milanese_ambition_desc: "我们在斯卡拉的圣玛利亚旧教堂的遗址上建造了一座剧院，足够容纳两千个座位，并配备了欧洲其他剧院无法比拟的舞台机械。首演之夜吸引了每一位与米兰有联系的使节、商业巨子与贵族家族。不到一个演出季，这里首演的作品就从伦敦讨论到了圣彼得堡。这座舞台使我们的宫廷成为欧洲大陆的文化仲裁者，而在斯卡拉成功的艺术家将我们城市的名字带到他们游历的每一个地方。"
 #Maltese Shared
 maltese_the_rahal_watch: "拉哈尔瞭望者"
 maltese_the_rahal_watch_desc: "马耳他的地貌已由 #italic Raħal #! （村落），以一座设防的堂区教堂为中心。与欧洲的封建庄园不同，马耳他村落是一个紧密相连的宗亲网络，平民百姓自行管理本地的治安。这种格局孕育出一种「哨兵之国」的文化，每一位村民都受训学会在地平线上辨认船帆，并退守至 #italic Dejma #! （地方民兵）据点，使这些岛屿成为一张分散而能自我修复的防御网络。"
 maltese_the_korsa: "科尔萨"
 maltese_the_korsa_desc: "随着地中海海盗活动的兴起，马耳他的平民百姓也纷纷投身其中。通过颁发私掠许可证，我们可令国家受益，培养出一个视大海为谋利与护教并重之战场的「水手商人」阶层。此举将使我们化身为「南方的维京人」，精于接舷战与沿海突袭。这种海上的进取之风，将确保我们的海岸线由一支由私人出资、熟悉每一处隐秘海湾的凶悍海岸巡防舰队所守护。"
 maltese_the_bajada: "巴哈达"
 maltese_the_bajada_desc: "我们的文化孕育出一个特殊的阶层——“夜行者”，或称为#italic 巴哈达#!。他们是对地形了如指掌的人，能在完全黑暗中穿越岛上崎岖的喀斯特地貌和陡峭悬崖。在军事上，他们是终极战术信使，能穿过敌方防线，或在封锁期间游弋于港口堡垒之间。这种隐秘文化若能制度化，将让我们培养出一支敌人无法察觉的间谍大军。"
 maltese_the_modernized_dejma: "现代化杰马"
 maltese_the_modernized_dejma_desc: "面对新的威胁，名为“杰马”的非正式村庄守望者需要现代化。我们将建立一套国民民兵体系，每名十六岁到六十岁之间的男性都被分配到一个特定的岗位。这将创造一种“士兵农民”的文化，农业周期与军事训练交织在一起。这种广泛的军事素养将确保群岛永远不会被突然登陆所攻占，因为整个乡村都充当高戒备的后备力量，支援王国的职业军人。"
 maltese_the_festa_ritualism: "庆典仪式主义"
 maltese_the_festa_ritualism_desc: "我们的身份认同围绕#italic 庆典#!和宗教游行展开，这些活动均以军事化般的精确方式进行组织。盛大的游行队伍、华丽的街道装饰以及公共盛宴构成了庆典的核心，是维系马耳他社会的主要纽带。这种公共虔诚与共同仪式的文化超越了阶级壁垒，将城市市民与乡村农民团结在强烈的宗教奉献这一共同身份之下。通过将资源投入到当地社区的美学与精神生活中，马耳他人培育了极高的内部凝聚力与社会和谐，确保即使在外部威胁的压力下，群岛仍能保持统一且文化充满活力。"
 maltese_center_of_the_mediterranean: "地中海的中心"
 maltese_center_of_the_mediterranean_desc: "由于我们的岛屿地处地中海中央，我们的海洋文化已转向工业化的船舶修理与全球物流。随着本地工匠将其古老的石工与木作技艺适应蒸汽与钢铁的时代，我们的大港将成为世界首屈一指的海军船坞。这种工业化的航海传统，将使这些岛屿成为一座全球性的加煤站与维修枢纽，确保我们的舰队在技术上始终领先于对手。"
 #Median Shared
 median_lo_statuto_del_comune: "城市宪章"
 median_lo_statuto_del_comune_desc: "在欧洲大多数地区还未想到要将自己的习惯法书写成文之前，我们地区的城市就已经将法律编纂成典，建立了自己的议会，并在#italic 城市宪章#!上规定了每一位公民与行政长官的职责。从安科纳到维泰博，这些文件经过一代又一代人的修订、辩论与更新，形成了一种鲜活的市政论辩传统，无论是封建领主还是过境的征服者都无法将其完全熄灭。这份成文法的遗产使我们的制度富有韧性，并使我们的市民深深投入到他们所参与治理的城市之中。"
 median_studio_generale: "通识学院"
 median_studio_generale_desc: "佩鲁贾大学创立于1308年，将自身置于市政而非教会的管辖之下，其后我们地区相继出现的学院，培养出了推动意大利公社事务前行的律师、公证人与行政官员。我们的城市提供了图书馆、资助与辩论风气，吸引了来自整个半岛的学者，使法学与哲学训练如同任何一门手艺一般，自然而然地成为中意大利的产物。这种崇尚学识的治理方式，使我们的官员在法律与论辩上的素养，远非那些更为纯粹封建地区的同僚所能企及。"
 median_bastioni_e_rocche: "棱堡与要塞"
 median_bastioni_e_rocche_desc: "意大利战争证明，中世纪的城垣抵挡不住一个早晨以上的炮击，而我们的山城则以其最大的天然优势（山脊、山嘴、沟壑）作为回应，将其改造为由棱角棱堡与紧凑的 #italic 要塞 #! 组成的防御体系，使每座城镇都成为一道独特的战术难题。建筑师与军事工程师用石材与夯土重建了我们的防线，在最令进攻方炮兵畏惧的角度上布设炮台。这种因地制宜的筑城传统，使我们的领土更难被攻陷，也让任何侵略者占领它的代价变得极其高昂。"
 median_baroque_sacred_patronage: "巴洛克神圣艺术赞助"
 median_baroque_sacred_patronage_desc: "时代的宗教动荡需要一种视觉上的回应，而我们的城市则以激增的礼拜堂、祭坛画和教堂立面作为回应，将每一处城市天际线转变为虔诚的剧场。宗教团体、市议会和富有的赞助人竞相委托创作其财力所能负担的最光彩夺目的图像、最富动感的雕塑以及最具说服力的虔敬绘画。这一赞助神圣艺术的传统滋养着我们的艺术家，用虔敬的图像充盈着我们的街道，并向每一位访客昭示：我们的文化正处在一种自信而富有表现力的灵性生活的中心。"
 median_jubilee_economy: "禧年经济"
 median_jubilee_economy_desc: "罗马每二十五年宣布一次的禧年，将拉丁基督教世界各个角落的朝圣者带到通往我们领土的道路上，而随后的#italic 壮游#!则带来了第二波富裕且好奇的北方人，愿意为舒适、引导和陪伴慷慨解囊。我们的旅店、市场和工坊学会了为国际客户服务，他们留下的金钱流经了我们经济的各个层面。这种款待信众与好奇者的传统，使我们的城市繁荣程度远远超出仅靠本地生产所能维持的水平。"
 median_enlightenment_civic_reform: "启蒙运动市政改革"
 median_enlightenment_civic_reform_desc: "十八世纪的理性主义思潮，在我们的公社传统中找到了早已准备好接纳它的沃土——我们的城市早已习惯于以书面形式辩论自身的治理、记录决策、问责官员。锐意改革的行政官与博学的学院，推动着我们治下的城镇与乡村采用更清晰的法典、更有序的城市规划、以及更可预见的行政管理。这种对理性治理的拥抱，使我们的制度更加高效，也使臣民更愿意将国家视为公共生活的伙伴，而非阻碍。"
 #Median Unique
 pap_head_of_the_church: "教会之长"
 pap_head_of_the_church_desc: "罗马主教在整个基督教世界中地位独一无二：他不仅是品级最高的教长，更是 #italic 基督的代理人 #!，其在信仰事务上的裁决，约束着每一位天主教统治者与王国，无论他们是否愿意接受。我们借助精神纽带与制度权力共同培育这一权威，自视为全体信徒之父，而非仅仅是他们的教会上司，这使得对手在选择与罗马教廷公开对抗之前都会三思。这种兼具制度元首与精神之父的双重地位，在整个欧洲持续产生宗教影响力，也使任何依赖天主教臣民忠诚的统治者，都要为触怒我们付出高昂代价。"
 pea_fontana_maggiore: "马焦雷喷泉"
 pea_fontana_maggiore_desc: "早在我们绘出最伟大的画作、训练出最负盛名的雇佣兵队长之前，我们便已用水与石头宣告了自己的雄心：#italic大喷泉#!由尼古拉与乔凡尼·皮萨诺雕刻而成，由全城公社出资兴建的新引水渠供水，矗立于佩鲁贾的心脏地带，证明中意大利没有哪座城市比我们更富庶、更自豪、更具集体雄心。这座喷泉将每一位圣徒、每一种商品、每一种古典美德汇聚于一座纪念碑之中，用大理石道出了任何特许状都难以言表的意味。这一城市宣言吸引着朝圣者与商人涌向我们的中心，也巩固了我们对人潮所聚街巷的掌控。"
 spl_duchy_of_spoleto: "斯波莱托公国"
 spl_duchy_of_spoleto_desc: "我们是伟大的 #italic 斯波莱托公国 #! 的继承者，这个伦巴第治下的领地，昔日疆域曾从翁布里亚一直延伸到梅佐乔诺的边缘。当其他公社早已遗忘自己的尚武渊源时，我们却在每一座山顶塔楼、每一座领主城堡中，延续着驻防的传统。那段广阔疆域统治的记忆，塑造了我们贵族对防御的思考方式，也塑造了我们农民对义务的理解，由此形成了一种围绕高地与石墙保护而建立的社会契约。这种分散筑防与尚武文化的遗产，赋予我们的军队以纪律，也赋予我们的领土以持久的力量，远非任何仅凭贸易立身的城邦所能及。"
 pap_the_word_of_the_lord: "主的言语"
 pap_the_word_of_the_lord_desc: "当教廷在信仰与治理事务上发声时，其所拥有的权威是任何世俗统治者都无法比拟的：那是通过 #italic Bulla Papalis #! 所表达的神圣授命之力，这一正式宣告将经文的分量传达到欧洲每一个天主教宫廷。我们以一套可追溯至帝权让渡本身的法律传统强化这一点，这不仅赋予我们作为上帝代理人的威望，更赋予我们干预世俗事务、裁可战争、将权贵召至一个高于任何君王所能掌控的法庭前问责的明文权利。这种兼具属灵之声与法律仲裁者的地位意味着，一旦我们认定某项事业为正义，盟友聚集的速度会更快，而对手犹豫的时间，会比面对任何纯粹的世俗势力时更久。"
 pea_scuola_del_perugino: "佩鲁吉诺画派"
 pea_scuola_del_perugino_desc: "彼得罗·万努奇，即#italic佩鲁吉诺#!，在我们的城墙之内建立了翁布里亚最受推崇的画坊，他的学生们将翁布里亚画派的优雅风格带往意大利各地，承接各方委托。拉斐尔曾来此拜入他门下求学，而后才被罗马收揽这位更伟大的画家；而这座教导出拉斐尔之师的城市，其艺术声望是本地区任何对手都难以轻易否认的。这种画坊教学与密集学徒制的传统，使我们的城市成为画家、赞助人以及源源不断的委托订单汇聚的磁石，技艺精湛者齐聚之处，必然繁荣相随。"
 spl_lippi_frescoes: "利皮壁画"
 spl_lippi_frescoes_desc: "我们邀请菲利波·利皮为我们主教座堂的后殿作画，他为我们留下的是 #italic Stories of the Virgin#!，这是十五世纪最明丽动人的壁画组画之一，仅因他本人在斯波莱托辞世而未竟全功——他被厚葬于这座经他之手焕然一新的教堂之中。他在我们主教座堂中的陵墓，使一段艺术赞助关系化作了面向全意大利有识之士与好奇之人的永久朝圣之地。这份艺术遗产加深了我们的学术声望，也吸引着博学的访客前来，他们的到访使全城的学术探讨更加精深。"
 glory_of_rome: "罗马的光荣"
 glory_of_rome_desc: "当代伟大的教皇们已将 #italic Roma #! 从一座中世纪废墟之城，改造成基督教世界最壮丽的宫廷，委托艺术家、建筑师与学者，以必将超越任何王朝寿命的美，充实梵蒂冈，使欧洲的目光汇聚于使徒座。我们刻意在古代帝国的遗骸之上建设，将我们的属灵权威裹以古典文明的威望，确保每一位踏入我们城市的使节都明白，他所拜访的这股权力，其根基比他所效忠的任何王国都更为古老。这种对永恒壮丽的投入，意味着我们的威望不会随个别教皇的逝去而消退，因为我们所建之物，在委托建造之人离世后依然雄辩自明，历久不衰。"
 pea_the_griffin_companies: "狮鹫佣兵"
 pea_the_griffin_companies_desc: "我们城市的徽记是#italic狮鹫#!，而再没有哪里比巴廖尼家族雇佣兵队长的战旗，将它带得更远——他们的刀剑贩卖（并赢得胜利）遍及整个半岛。佩鲁贾出产士兵，正如佛罗伦萨出产画家：量大质精，凭借数百年派系巷战与季节性劫掠所磨砺出的指挥本能。这种尚武传统培育出能激发忠诚的军官，以及在经验不足者溃散之时仍能临危不乱的士兵。"
 spl_ponte_delle_torri: "塔楼桥"
 spl_ponte_delle_torri_desc: "古老的#italic高塔桥#!（兼具罗马引水渠与设防桥梁的双重性质）以十座巨大桥墩横跨泰西诺峡谷，使我们掌控了翁布里亚与马尔凯之间亚平宁山脉的主要通道。凡欲穿越群山的商人，都须经过我们的桥梁，而我们从未吝于以通行税、情报与恭顺之态，收取这一特权应得的代价。这一建筑使我们的领土成为天然的咽喉要地，将贸易引向内地，也让任何意图入侵者在进军之前，都不得不先掂量这段路程的代价。"
 centralize_the_states: "权利的集中"
 centralize_the_states_desc: "特伦托大公会议已经革新了教义，划清了教会的制度边界，但教皇国本身仍是一盘由城市、领地与附庸领土拼凑而成的碎片，当地的诸侯长期以来都将我们的权威视为可讨价还价之物。我们如今着手弥合这一裂痕，收回诸侯世代暗中积攒的税收、任命权与司法管辖权，依照革新后的 #italic 教廷 #! 所要求的方式，将其置于罗马的直接管辖之下。随着王权在我们的领土上得以巩固，教廷便拥有了反宗教改革之宏图所需的财政与行政根基。"
 pea_guerra_del_sale: "食盐战争"
 pea_guerra_del_sale_desc: "当教皇强行推行盐业专卖之时，我们的百姓拿起了手边一切可用之物作为武器；因此教皇一方嘲讽地将这场起义称为 #italic 叉子战争 #! 。我们输掉了那场战争，遭受了莫大的羞辱——巴廖尼家族被逐，保利纳要塞更被直接建于他们的宫殿之上，以石头昭示蔑视——然而这场失败却凝结成一种比骄傲更为持久的东西。这种刻入骨髓的对外来权威的猜疑，使佩鲁贾的每一座山丘都成为天然堡垒，也让每一个入侵者都明白：无论从我们这里夺走什么，守住它的代价都远超任何战略利益所能证明的价值。"
 spl_cardinals_bulwark: "枢机的堡垒"
 spl_cardinals_bulwark_desc: "阿尔博诺兹枢机建造 #italic 阿尔博诺兹要塞 #! ，并非出于姿态，而是一种宣告——一座坚不可摧的堡垒，使罗马与佩鲁贾之间的每一位小领主都明白，中央权力已经切实回归，而斯波莱托正是其在中意大利最为坚固的工具。我们继承了这座建筑，也继承了它所体现的制度角色，使我们的城市在历经时代的每一次动荡之后，依然是本地区最有秩序、最有纪律的行政中心。这种军事坚固与公共秩序的结合，使我们的民众保持团结，使我们的市民阶层熟谙其公民职责，也使我们的城墙抵御住了困扰治理欠佳之地的叛乱与骚动风暴。"
 ecclesiastical_primacy: "教会至上地位"
 ecclesiastical_primacy_desc: "《威斯特伐利亚和约》已将我们排除在诸国君主的外交之外，但它并未解决一个问题：在每一个天主教王国内部，究竟由谁来代表天主教会发言——如今，那些意图将教会变成王权附属部门之人，正以危险的急迫感逼问着这一问题。我们重申对法兰西、德意志与奥地利主教们的首席权，这并非一种形式，而是活生生的教义现实：我们谴责#italic高卢主义#!的种种主张，迫使那些已经倾向于效忠本国的教士，为其本应归于罗马的权威作出交代。这种对教皇教义裁定专属权的重申，使摇摆不定的教会重新归于教廷的正统之下，也恢复了那些曾被各国统治者开始导向自身的什一税与教会收入的流向。"
 pea_umbrian_academies: "翁布里亚学院"
 pea_umbrian_academies_desc: "即便在我们的政治独立早已并入教皇国版图之后许久，我们在教皇庇护下维系的 #italic 设计学院 #! 与各类学术团体，依然延续着我们的学术与艺术文化命脉，培养出远超我们自身疆域、遍布各地机构的官员、理论家与艺术家。半岛上每一个强权都深知，佩鲁贾培养出的人才可靠信实，对我们毕业生的持续需求，使我们的学院即便在我们的影响力式微之时，依然兴旺发达。这种务实的学术文化传统，磨砺着我们所施行的每一项治理工具，也确保我们的城市在真正举足轻重的议事场合中，发挥出远超其政治分量的影响力。"
 spl_the_spoletine_silk: "斯波莱托丝绸"
 spl_the_spoletine_silk_desc: "我们谷地的桑林数百年来一直为教皇国最优秀的织工供应蚕丝，由此织就的 #italic 斯波莱托丝绸 #! 远销罗马的祭坛，乃至远至法兰西与哈布斯堡宫廷的衣橱。我们的商人凭借这一贸易培育出一个富裕的市民阶层，他们不仅有余力供子女读书识字，更有足够的政治智慧，使行会网络得以历经历代教皇总督的更迭而长存不衰。这一奢侈工艺传统凭借外部需求充实我们的国库，并维系着中等商人阶层的稳定，而这正是我们和平最可靠的根基。"
 pap_the_concordat: "政教协定体系"
 pap_the_concordat_desc: "革命与战争的政治震荡已夺走我们大部分的世俗权力，然而各国对宗教正统性的根本需求从未减弱，而我们正是利用这一需求，在我们称为 #italic 宗教协定 #! 的正式条约中为己谋利。我们与每一个主权国家分别谈判，以在行政事务上让出若干独立性为代价，换取对教会权利具有法律约束力的承认、我们神学院的安全保障，以及天主教神职人员在其境内的正式地位。这套双边协定体系将每一个天主教国家从潜在的敌手转变为条约约束下的伙伴，赋予我们任何军队都无法长久维系的外交影响力。"
 pea_the_old_university: "古老大学"
 pea_the_old_university_desc: "当革命席卷意大利之时，我们这座古老的大学并未退守中世纪的特权堡垒，而是向商人与工匠之子敞开大门，让他们将新政治推向前方。#italic佩鲁贾大学#!的师生培养出众多律师与小册子作者，正是他们在翁布里亚促成了复兴运动的实现，使一所经院学府转变为公民变革的引擎。凭借这种将学问化为组织力量的天赋，我们政府所欲推行的任何改革，都不会缺少懂得付诸实行的饱学之士。"
 spl_vale_of_spoleto: "斯波莱托谷地"
 spl_vale_of_spoleto_desc: "坐落于我们群山之间的这片广阔农业谷地，自古以来便是我们繁荣的物质根基，而我们在这革命年代里更对其加以改良：修筑排水渠道、推行系统性轮作，并将边际土地重新分配为生产性田产，使我们的劳动人口得以在经济冲击中安然度过，而准备不足的国家则难以承受此等打击。 #italic 斯波莱托谷 #! 如今养育着我们的城市，为我们的市场供应盈余，并产生任何真正的工业抱负都必须倚赖的农业资本。这份世代传承、精心耕耘、理性改良的丰饶土地，使每一个季节都成为抵御动荡的缓冲，而那些将资源耗费于不耐久之投资的邻邦，却因此一蹶不振。"
 #Neapolitan Shared
 mercantile_spirit: "商业精神"
 mercantile_spirit_desc: "与阿马尔菲这个有影响力的海洋共和国的类似，那不勒斯王国也坐拥着强大的贸易实力。包括那不勒斯本身的多个战略性的港口，作为重要的枢纽，连接本土与遥远的国度，并通过商品和思想的深度交流促进经济繁荣。"
 consolidate_the_royal_domain: "王族的统治"
 consolidate_the_royal_domain_desc: "我们继承了这样一块富裕的领土，但过时的律条和习俗让我们无法取得繁荣。过去的统治者曾经让国内贵族的出身与财产互相协调，而现在，我们应该更新这些旧的法条。通过强化王廷、巩固王家地产，我们可以建立一套更加清晰的法律体系。在属于王室和市民阶层的领地，我们应该把城市打造成权力的中心，鼓励贸易和技艺的发展。"
 crush_the_barons: "粉碎贵族权利"
 crush_the_barons_desc: "本地的男爵们在那不勒斯的乡村中仍然享有许多特权，如果我们想要继续集权化我们的王国，那就必须粉碎那些男爵的权力，否则，就是坐以待毙、让他们联合起来反对我们。"
 city_of_artists: "艺术家之城"
 city_of_artists_desc: "通过世界所有杰出艺术家的慷慨赞助，我们的城市变得万众瞩目。世人都将惊叹于我们的艺术家们所创造的辉煌与荣耀。我们要让那不勒斯文化成为衡量全世界各个艺术中心的标准。"
 a_central_power: "地中海的中心强国"
 a_central_power_desc: "我们在地中海的有利中心位置，使得我们可以轻松地到达任何海岸。我们应利用这一优势寻找盟友，建立新的友谊，并扩张疆域。海洋是我们的门户，为我们在寻求更大影响力和安全方面，提供了增长与繁荣的丰富机会。"
 neapolitan_army_reforms: "那不勒斯军队改革"
 neapolitan_army_reforms_desc: "我国需要进行全面的军事改革，使军队现代化，以应对战场变化带来的挑战。这些改革将磨砺我们的战术，简化我们的指挥体系，并改善我们的训练，使我们成为本地区一支令人生畏的力量。"
 #Neapolitan Unique
 university_naples: "那不勒斯大学"
 university_naples_desc: "由弗雷德里克二世皇帝于1224年建立的那不勒斯大学，是意大利最古老的公立机构之一。它秉承世俗精神，为数代学生提供了综合教育，并为各个领域的知识进步做出了贡献。"
 academia_pontaniana: "庞塔尼亚学院"
 academia_pontaniana_desc: "长久以来，那不勒斯一直致力于成为现代学术的中心，吸引着时代最伟大的学者，并且转播文艺复兴的光芒。在乔瓦尼·蓬塔诺的领导下，这个学术圈被体系化和组织化。我们用这位辛勤的领导者来命名这所学院再合适不过了。"
 encouraged_city_living: "鼓励在城市定居"
 encouraged_city_living_desc: "我们的前人为我们留下了一座美丽的城市。我们应该继续装点和改善这座地中海沿岸的大都市，让她继续发展、繁荣。除了修缮港口和建筑之外，我们还要修建渡槽、排干池沼、铺设道路，让这里能容纳更多的居民。"
 expanded_arsenale: "扩建军械库"
 expanded_arsenale_desc: "数百年来，$NAP$ 的兵工厂一直是我们造船业的中心与主要海军设施。然而，若要有效对抗地中海的敌对舰队，它必须加以扩建并实现现代化。让我们扩大港口的商业与军事实力，建设一座更为宏大的兵工厂，以维持一支规模更大、战力更强的舰队。"
 institutional_reorganization: "机构重组"
 institutional_reorganization_desc: "通过废除副手委员会和建立圣嘉勒修道院王家礼拜堂，我们将在那不勒斯王国实施重要的法律改革。当前的项目将旨在重新组织立法体系，将法律整合进加洛林纳刑法典，并实施土地登记册以进行税收改革。"
 neapolitan_industrialization: "那不勒斯工业化"
 neapolitan_industrialization_desc: "自18世纪开始，那不勒斯王国经历了渐进的工业化进程。纺织、造船和铁器等关键行业，在投资和技术进步的推动下得到了发展。这种工业化的转变，将在将那不勒斯成为主要经济中心的过程中，发挥重要作用。"
 #Piedmontese Shared
 piedmontese_the_ricet: "里切托"
 piedmontese_the_ricet_desc: "与皮埃蒙特乡村有着特殊渊源，各村落自古以来便发展出 #italic 里切托 #!（标准意大利语称谓，皮埃蒙特语作Ricèt），这是城镇内部的一处设防区域，用以储存社区的粮食与酒水，并在遭受袭击时提供庇护之所。这并非领主的城堡，而是由村民共同管理的集体财产。正因如此，农民阶层得以在该地区各邦国之间频繁的战争中幸存下来，国家的农场与作坊即便在遭受入侵之时也依然完好无损。"
 piedmontese_le_fere_del_piemont: "皮埃蒙特集市"
 piedmontese_le_fere_del_piemont_desc: "皮埃蒙特的城市正在将整个地区的大型贸易集市正式化。通过为国际商人提供国家保护和税收豁免，国家将把阿尔卑斯山的通道转变为财富走廊。这将为我们带来财富，提供必要的资金来购买独立领主的忠诚。"
 piedmontese_the_piassafort: "要塞城市"
 piedmontese_the_piassafort_desc: "认识到我们作为意大利门户的地位，我们将开始把城市转变为#italic 要塞城市#!。这需要一种文化上的加强——在持续威胁之下生活，城市规划由火炮和驻军的需要决定。这种工程上的卓越性将使皮埃蒙特成为意大利最难被征服的地区，迫使外部势力选择谈判而非入侵。"
 piedmontese_the_nebbiolo_vigne: "内比奥罗葡萄"
 piedmontese_the_nebbiolo_vigne_desc: "尽管葡萄种植自古有之，我们仍将在本地区的葡萄园中推行科学的种植方法。通过支持葡萄园的现代化与标准化，并规范高价值葡萄酒（内比奥罗）的生产，国家将确保一项能够充实国库的奢侈出口商品。这些措施将为国库带来一项不受粮食市场波动影响的稳定收入。"
 piedmontese_the_canal: "运河"
 piedmontese_the_canal_desc: "我们的政府将开展一项艰巨的工程，以驯服我们主要河流——波河、多拉河和塞西亚河——的水域。通过建造由石质水道和水闸构成的复杂网络，我们将把洪泛平原和大量沼泽改造成南欧最高产的粮田。这将为该地区提供大量、可靠的粮食盈余，使人口得以增长，并维持一支不受外国谷物进口影响的常备军。"
 piedmontese_the_setajoj: "丝绸厂"
 piedmontese_the_setajoj_desc: "皮埃蒙特将成为欧洲的丝绸之都，其特色在于大规模的丝织工厂（Filatoi），这些工厂将采用先进的水力机械。这将在我们的城镇中孕育出早期的工业文化，一个由技术工匠与商人组成的新阶层将由此兴起。这些投资将为本地区提供修建现代道路、运河以及军事改良所需的资本，使皮埃蒙特的经济与更广阔的世界直接相连。"
 #Piedmontese Unique
 mfa_the_paleologue_dynasty: "巴列奥略王朝"
 mfa_the_paleologue_dynasty_desc: "#italic 巴列奥略家族#!的古老血统赋予我们的侯国一种尊严与正统性，赢得了欧洲最伟大宫廷的尊重。这一血统将我们与那个诸多小邦只能远观的礼仪与外交世界联结在一起。我们把这笔遗产既当作装饰，也当作盾牌，用它来打开仅凭我们的军队永远无法叩开的大门。"
 pie_ordinanza_piedmontese: "皮埃蒙特法令"
 pie_ordinanza_piedmontese_desc: "数代以来，我们的山地领主一直依照传统和季节征召部队——在秋收后召集人手，在初雪前遣返家乡。我们已用一项正式法令取代了这一临时性的传统。该法令规定了步兵的规模、装备和训练标准，并强制我们的城市和乡村领主承担在任何时刻都可能被召集的统一义务。这一#italic 皮埃蒙特法令#!为我军提供了在军事行动间隙仍能保持凝聚力的职业核心，推动着那些临时征召的武装永远无法维持的纪律与军事传统。"
 mfa_casale_monferrato: "卡萨莱蒙费拉托"
 mfa_casale_monferrato_desc: "我们已将#italic 卡萨莱蒙费拉托#!塑造为国家的核心——一座在我们的统治下商业与手工业不断发展的城市。城中的商人和行会为街道带来生机，为国库贡献收入；其连通诸强国的地理优势，使其成为天然的贸易集散地。这座城市是我们最宝贵的财富，也是良好治理能够造就何等成就的明证。"
 pie_cavalleria_piemontese: "皮埃蒙特骑兵"
 pie_cavalleria_piemontese_desc: "波河平原与我方领土交汇之处，自古便孕育出一批小贵族骑士，其财富取决于其战马的品质与其骑枪部队的声望。我们已将这些分散的武装骑士整编为一支正规骑兵，统一其装备，并训练他们掌握协同机动战术，而非早年盛行的单骑冲锋。这支 #italic Cavalleria Piemontese#! 能够掩护我军侧翼、追击溃败之敌，并以现代战场所要求的散开队形作战，使我军摆脱步兵行进速度的束缚。"
 mfa_the_court_culture: "宫廷文化"
 mfa_the_court_culture_desc: "我们的宫廷已成为被我们的赞助和高雅品味吸引的艺术家、学者和音乐家的聚集地。我们高度重视#italic 宫廷艺术#!，将其视为获取声望的手段，在我国创作的艺术品，无论流往哪里都能反映我们的名号。这种对文化的投资获得的声誉回报足以抵消花费的金钱。"
 pie_via_delle_gallie: "高卢之路"
 pie_via_delle_gallie_desc: "这条自阿尔卑斯山口蜿蜒而下、通往波河平原的古道，曾承载过罗马的军团；此后它从未停止承载商人、使节与军队的往来，对他们而言，皮埃蒙特走廊是连接意大利与北方最为直接的路径。我们投入资金维护并保卫这些道路，修建驿站与关卡，带来稳定的收入，并确保过境货物能比经由任何对手路线更快地穿越我们的领土。我们对 #italic 加利亚之路 #! （标准意大利语称 #italic 加利亚人之路 #! ：高卢人之路）的掌控，使我们成为欧洲商业链条中不可或缺的一环，扩大了我们的市场，并为我们的使节在依赖我们所管辖道路的各国宫廷中创造出天然的门路。"
 mfa_the_casale_citadel: "要塞之城"
 mfa_the_casale_citadel_desc: "我们已将#italic 卡萨莱蒙费拉托#!改造成一座要塞城市，其城墙与棱堡堪称亚平宁半岛上最坚固的防御工事之一。城堡深阔的壕沟和倾斜的墙面旨在让围城的敌人深陷损耗的泥潭，并让试图速战速决的进攻者付出血的代价。这道防线使我们的权力中心成为当代最重大的军事战利品之一——强攻代价过于高昂，却又重要到无法忽视。"
 pie_citadel_system: "要塞体系"
 pie_citadel_system_desc: "一代受过意大利最新筑城学论著训练的工程师，已勘测了我国境内每一座重要城镇，并着手将旧式环形城墙改造为现代棱堡网络——倾斜、低矮而宽阔，足以架设火炮，同时使敌人无法从我方火炮无法覆盖的任何方向接近。我们以道路与信号将这些要塞彼此相连，使得一处谷地中受威胁的守军能够期待来自邻近要塞的支援。这套 #italic 要塞体系 #! 使皮埃蒙特成为一个无法被长驱直入、只能逐座堡垒攻取的国家，即便是最坚定的侵略者，在跨越我国边境之前也不得不三思而后行。"
 mfa_the_marquisate_resilience: "侯国的韧性"
 mfa_the_marquisate_resilience_desc: "我们靠灵活和审慎的结盟策略在大国的夹缝中生存，从不将信任完全寄托于任何一个联盟。通过保持讲道理和守信的名声，我们使那些本可能吞并我们的势力转而视我们为有用的盟友。这种#italic 外交韧性#!是我们最古老的策略，也是最可靠的一个。"
 pie_enlightened_court: "开明的宫廷"
 pie_enlightened_court_desc: "聚集在我们宫廷周围的那一代改革者让我们相信，治理的任务不仅仅是维持现状，而是发现更好的做法，并系统地用新的取代旧的。我们向受过当代学院和实验社会训练的人开放行政机构，委托编写从农业产量到司法程序等各个方面的报告，并资助培养一类既能阅读预算也能阅读条约的行政管理人员。这种#italic 开明宫廷#!造就了一个制度靠理性而非习俗不断改进的国家，从而使我们的政府更加高效，我们的研究更有成果，我们的臣民更有文化。"
 mfa_the_monferrato_agricoltura: "蒙费拉托农业"
 mfa_the_monferrato_agricoltura_desc: "侯国连绵起伏的山丘与肥沃的河谷的农业产出，养育着我们的人民，并支撑着不断增长的农民与乡村工匠人口。通过对土地的精耕细作和投资，我们将农业的版图扩展到了曾经闲置的山坡与梯田之上。这场#italic 农业转型#!为我们的乡村带来了新的定居者，也为我们的国家带来了新的财政收入。"
 pie_industrial_base: "工业基础"
 pie_industrial_base_desc: "山间河流的水力、城市日益增长的熟练工匠人口以及阿尔卑斯山麓的原材料，三者的结合为我们创造了意大利其他地区无法比拟的早期工业转型条件。我们投资于水力磨坊、标准化工坊以及信贷机构，使这一生产基础能够系统性地扩张，而非偶然地增长。这一#italic 工业基础#!从那些之前不为国库所见的活动中产生收入，并将农村的劳动力吸引到城镇，同步构建着城市的人口与国家的应税财富。"
 #Rhaetian Shared
 rhaetian_the_vicinanza: "邻里共同体"
 rhaetian_the_vicinanza_desc: "雷蒂亚山与多洛米蒂山严酷的环境，催生了#italic 邻里共同体#!的发展。在这一体系下，山谷中的居民集体拥有森林和高山牧场。这种“山地民主”文化阻止了封建领主对山区关键资源的垄断，培育了强烈的地方主义，使雷蒂亚‑罗曼语诸山谷成为大帝国内的自治组织。"
 rhaetian_the_tobia: "托比亚谷仓"
 rhaetian_the_tobia_desc: "拉埃蒂亚罗曼人长久以来一直使用 #italic 托比亚 #!，这是一种专为高海拔气候下长期储存而设计的木制谷仓。这类建筑常常带有防御性构造，以保护社区的粮食储备。这种自给自足的文化保障了我们人民在漫长冬季封锁期间的生存，因为民众可以退入高山谷地，依靠储备的粮草维持生计。"
 rhaetian_the_mountain_warriors: "山地战士"
 rhaetian_the_mountain_warriors_desc: "在我们的引导下，雷蒂亚‑罗曼战士将以其在崎岖地形中对戟和长矛的精通而闻名于世。这些士兵擅长在狭窄的峡谷中伏击重骑兵，可以将山谷变成致命的陷阱。这种军事文化使雷蒂亚‑罗曼雇佣兵备受追捧，并将财富和现代战术知识带回了他们在山区的家乡。"
 rhaetian_the_chanzun: "尚松"
 rhaetian_the_chanzun_desc: "雷蒂亚‑罗曼人比以往任何时候都更需要利用史诗歌曲（尚松）和口头诗歌来保存他们独特的语言和历史。这创造了一种“语言抗争”文化，他们基于拉丁语的言语被用来培养一种既非德国也非意大利的身份认同。这种文化自豪确保了山谷在面对外部行政变革时保持团结。"
 rhaetian_the_alpine_diplomacy: "阿尔卑斯外交"
 rhaetian_the_alpine_diplomacy_desc: "我们控制着穿越阿尔卑斯山的战略山口。这往往会引来其他国家不必要的关注，因为它们也想要同样的控制权。在这种混乱中，可能会诞生一个专门的列托罗曼外交官阶层。在我们的支持下，这些多语言的谈判者将掌握在大国之间周旋以维护地方自治的艺术。这种高风险调解的文化将确保，即使外国军队占领了各个山谷，各公社的法律和社会主权仍能通过精心起草的条约保持完整。"
 rhaetian_the_national_revival: "民族复兴"
 rhaetian_the_national_revival_desc: "我们的知识分子已经开始正式复兴我们的语言，这些语言长期以来被视为比其他拉丁语言“低等”。在我们的指导下，学者们将把方言编纂成文学标准，并出版民族史。这将为我们的语言奠定坚实的基础，确保列托罗曼人作为一个平等且受尊重的民族融入现代国家。"
 #Rhaetian Unique
 aqu_patriarchate_of_aquileia: "阿奎莱亚宗主教区"
 aqu_patriarchate_of_aquileia_desc: "阿奎莱亚曾是罗马帝国的第四大城市，后来成为宗主教区的驻地，曾宣称对整个意大利东北部和东阿尔卑斯山拥有权威——这种教会声望传统在缔造它的政治权力消逝之后，仍长期积淀于我们的制度之中。我们依托这一遗产建立学术机构，以体现这座城市作为拉丁西方与斯拉夫、日耳曼东方之间传播中心的古老角色。#italic 阿奎莱亚宗主教区#!作为文化与书籍十字路口的传统，为我国赋予了非凡的文化底蕴，以及植根于宗主教区数个世纪以来管理不同礼仪基督徒的宽容精神。"
 aqu_amber_road: "琥珀之路"
 aqu_amber_road_desc: "早在罗马军团将其正式化之前，这条将波罗的海琥珀从北部海域运往亚得里亚海的路线便已穿过我们的领土，使阿奎莱亚成为古代世界最大的转口贸易中心之一，形成了比后来铺设道路的帝国更为持久的贸易传统。我们重新振兴并投资于这一走廊，改善连接我们城市与阿尔卑斯山口及其背后贸易网络的道路与驿站，确保我们的商人能够比任何竞争路线都更高效地抵达北方市场。这种对#italic 琥珀之路#!的控制，成倍地扩大了我们的外交影响力，并使我们的贸易通道成为亚得里亚海与中欧之间货物运输的首选路线。"
 aqu_alpine_defense: "阿尔卑斯防御"
 aqu_alpine_defense_desc: "我们的领土坐落于尤利安山与喀斯特高原的交汇处，这片地貌对于懂得利用它的人而言具有天然防御优势，而对于不熟悉它的军队则足以致命。我们投入资源强化关键隘口和河谷通道的防御工事，训练守军利用地形固守而非在开阔地与敌军交战，并建立了一个信号站网络，确保在敌军接近前提供预警。这一#italic 阿尔卑斯防御#!体系使我们的领土成为本地区入侵代价最高的目标之一，它将崎岖的地形转化为盟友，在我方士兵与敌人接战之前就能对其造成损耗。"
 aqu_friulian_soldiery: "弗留利士兵"
 aqu_friulian_soldiery_desc: "弗留利乡村向来是一片边疆之地，在其农庄与集镇中成长起来的男子从小便养成了军人的习性，惯于持械、熟悉当地地形，对于那些在一处屡遭敌国侵犯的边境上无力自卫者的下场，更是心知肚明，不存幻想。我们将这种尚武传统加以正规化，按照专业标准组织、装备并训练 #italic 弗留利民兵 #! ，赋予这些久经历练之人以纪律与指挥，将他们个人的坚韧转化为一支可靠的军事力量。我们的军队由此获得了一支稳健的步兵核心，他们为自己的乡土而战，以雇佣兵罕有的顽强固守阵地。"
 aqu_patriarchal_legacy: "宗主教区遗产"
 aqu_patriarchal_legacy_desc: "数百年来，阿奎莱亚的宗主教们统治着一片从亚得里亚海岸延伸至阿尔卑斯山口的领地，同时处理教会法务、民事纠纷以及与世俗权力的外交关系，这份行政经验即便在宗主教区的世俗权力被威尼斯吞并之后，仍长久积淀于我们的制度之中。我们汲取这份遗产，以理顺并改善我们自身的治理机制，将一个曾经治理远为庞大复杂领土的机构所积累的程序性知识，运用于我们如今更易于掌控的国家规模之中。这份 #italic 宗主教遗产 #! 行政精熟使我们的内阁更为高效，使我们的立法更加连贯一致，赋予我们一种与我国疆域之狭小并不相称的治理实力。"
 aqu_enlightened_patriarchate: "开明宗主教区"
 aqu_enlightened_patriarchate_desc: "阿奎莱亚作为西方与东方、罗马世界与斯拉夫世界、拉丁世界与日耳曼世界之间十字路口的记忆，使我们的制度本能地对来自外部的思想保持开放，而这种开放性是那些更加同质的国家难以做到的。我们在此传统基础上，欢迎启蒙运动培养出的学者与行政官员进入我们的治理机构，并依照理性与证据的原则——正如宗主教区在另一个时代曾将其应用于教会法那样——来改革我们的法律。这种#italic 开明宗主教区#!的精神，为我国赢得了认真对待思想、乐于改进制度的声誉，吸引了学者与干练的行政官员，从而加速了我们所推行的每一项改革。"
 #Romagnol Shared
 romagnol_al_teri_dlesarchet: "总督区后方"
 romagnol_al_teri_dlesarchet_desc: "罗马涅地区保存了拜占庭拉韦纳总督区的一项独特法律遗存。与受伦巴第影响的北方不同，罗马涅文化保留了更深的罗马‑拜占庭行政法层级。这培育了一种分化的文化，即便最小的城镇也宣称拥有古老的帝国特权。这种行政复杂性使得该地区成为想要高效集权的大帝国的噩梦，因为每个山谷都受到其自身的罗马豁免权网络和地方法规的保护。"
 romagnol_mura_malatestiani: "马拉泰斯塔城墙"
 romagnol_mura_malatestiani_desc: "夹在教宗国与威尼斯之间的罗马涅地区的城镇已成为了防御建筑的实验场。该地区率先使用了#italic 罗卡式堡垒#!（标准意大利语#italic Rocca#!，意为堡垒），一种带有圆形塔楼的堡垒，能够偏转早期加农炮的炮弹。这些防御工事意味着每座村庄都是一个战术支撑点。它们将迫使入侵者陷入缓慢、消耗性的战争模式，从而使罗马涅小国在地中海权力政治中能发挥远超其体量的影响力。"
 romagnol_the_sangiovese_viticulture: "桑娇维塞葡萄种植"
 romagnol_the_sangiovese_viticulture_desc: "罗马涅的丘陵地带致力于桑娇维塞葡萄的种植。这不仅仅是农业，更是一种“战士之酒”，醇厚而刚烈。国家将为酿酒业制定严格规范，以确保为步兵提供一种高热量、耐久存的产品。这也将提供一种可靠而珍贵的贸易商品，将亚平宁山区粗犷的农民与城市市场联系在一起，借助经济繁荣确保乡村的忠诚。"
 romagnol_the_stampa_dpopul: "大众媒体"
 romagnol_the_stampa_dpopul_desc: "罗马涅将成为单页印刷品的中心，印制廉价而通俗的方言小册子。这将催生一种公共叙事，让新闻、预言与民谣得以传播，甚至惠及乡村百姓。这种以识字为基础的动员方式，将确保国家能够迅速而有效地传达法令，培育出一个见闻广博、积极参与政治的民众。"
 romagnol_the_agricultural_academies: "农业学院"
 romagnol_the_agricultural_academies_desc: "顺应晚期巴洛克的趋势，罗马涅的每个主要城镇都将建立专注于提高农业产量的#italic 学院#!。这些地方科学学会将研究#italic 沼泽#!的排水以及抗病葡萄藤的选育。这些农学项目将把该地区变成一个实验农场，从而产生农业盈余，为区域制造业提供燃料，并为国家提供面向亚得里亚海市场的高价值贸易商品。"
 romagnol_la_streda_rumegna: "罗马涅之路"
 romagnol_la_streda_rumegna_desc: "国家与地方自治城市将联合起来，对古老的罗马大道沿海道路进行彻底的现代化改造。通过修建新的石桥和排水系统，我们将重新连接罗马涅海岸与威尼斯及教宗国的市场。该计划将使沿海城镇从孤立的渔村转变为重要的贸易枢纽，促进罗马涅农产品的流通，并为任何未来威胁我们国土的战争提供必要的战略机动性。"
 #Romagnol Unique
 rav_the_pineda_di_classe: "克拉塞松林"
 rav_the_pineda_di_classe_desc: "亚得里亚海沿岸广袤的沿海松林将作为战略性国有资产进行管理。我们的人民发展出了林业与盐业的文化，采伐木材用于造船，并管理着切尔维亚广阔的盐田。通过强化这些传统，我们的人民将获得一种不受作物歉收影响的非农业财富来源，从而为我们提供应对任何挑战所需的流动资本。"
 urb_the_montefeltro_seignory: "蒙泰费尔特罗领主权"
 urb_the_montefeltro_seignory_desc: "我们以古老的权威统治着这些山巅城镇与谷地，我们的治理权从未受到过成功的挑战。子民们深知，#italic 蒙泰费尔特罗#!家族世世代代捍卫着他们的土地与习俗，而忠诚在主仆之间缔结了比任何法令都更加牢固的纽带。此领主权并非仅仅是对一片领土的统治，而是一项双方皆选择予以信守的契约。"
 rav_mosaics_of_ravenna: "拉韦纳马赛克"
 rav_mosaics_of_ravenna_desc: "西方世界再无一城能如我们这般，将 #italic 马赛克 #! 艺术保存至今；我们的教堂与陵墓镶嵌着熠熠生辉的嵌片，金色与深蓝交织的图案历经数百年战乱与荒废，依旧动人心魄。这些杰作吸引着学者、朝圣者与艺术家前来，探寻那失落已久的古代世界的面貌。这一卓越工艺的传统加深了我们的文化底蕴，赋予我们国家一种当代对手难以企及的声望。"
 urb_the_hill_fortresses: "山地堡垒"
 urb_the_hill_fortresses_desc: "我们领土内的山巅经过数代人的修筑，每座高处的城镇都变成了需要一支意志坚定的军队花数周才能攻克的阵地。我们的士兵在这些陡峭的通道上磨练技艺，防守着仅需少量守军就能抵挡大量敌人的重地。我们领土上的#italic 山地堡垒#!网络既是我们的盾牌，也是我们锤炼军事传统的学校。"
 rav_battle_of_ravenna: "之战"
 rav_battle_of_ravenna_desc: "长期以来，拉韦纳一直是值得为之战斗的珍宝，我们城墙外的田野见证了极其激烈的战役，使我们的名字在意大利成为最艰苦战斗的代名词。我们加固城墙，锤炼士兵以应对正面战场的冲击，从这片饱经战火的土地上汲取唯有鲜血才能换来的教训。这一军事传统锻造出一支难以击溃的军队，以及一座难以攻陷的城市。"
 urb_the_ideal_court: "完美宫廷"
 urb_the_ideal_court_desc: "我们的宫廷号称在意大利最为井然有序，博学之士与胸怀艺术抱负之人不远万里而来，投身于其生活之中。我们在此孕育的对话、演出与艺术作品，激发了关于#italic 完美宫廷#!应有之模样的描述，而这些描述使我们的声名远播国界之外。这份治理与文化的精致，是我们所建设的最伟大的成就。"
 rav_byzantine_legacy: "拜占庭遗产"
 rav_byzantine_legacy_desc: "我们的城市是一座活的档案馆，保存着几乎已在他处消逝的文明：金箔后殿、精致石工，以及#italic拜占庭#!世界的圣像传统，在此以西方绝无仅有的浓度留存下来。前来研习这些作品的艺术家与赞助人，将其影响力带往四方，提升了我们作坊所出一切作品的声誉。守护这份独特的遗产，使我们的过去化作长久的文化与商业价值之源。"
 urb_the_mathematical_school: "数学学派"
 urb_the_mathematical_school_desc: "我们培育了数学与哲学探究的传统，使我们的城市因思想家的精深而闻名欧洲。我们宫廷中的 #italic Mathematical School #! 产出了诸多译著、注疏与原创著作，推动科学进步，赢得最杰出大学的赞誉。对学问的执着开拓了我们公民的心智，也磨砺了我们理解与塑造这个世界的能力。"
 rav_bonifiche_ravennati: "拉韦纳土地开垦"
 rav_bonifiche_ravennati_desc: "环绕我们城市的沼泽与潟湖，既是护佑我们的屏障，也是我们的负担；它们抵御敌军，却也淹没田地、滋生疫病。我们决意推行一项系统性的排水与筑堤工程，开凿沟渠、筑起堤坝，将水患逐退，从沼泽中夺回新的农田。将湿地转化为富庶之地，既养育了日益增长的人口，也扩大了国家的可征税产业。"
 urb_the_ceramics_guilds: "陶器行会"
 urb_the_ceramics_guilds_desc: "我们城市的陶工与画师发展出了锡釉#italic 马约利卡#!陶器的传统，其鲜艳的色彩与精巧的图像受到欧洲各地收藏家与宫廷的追捧。我们的陶器行会守护并将技艺代代相传，确保了我们成名的品质的延续。这项工艺产业伴随着每一件离开工坊的彩绘餐盘与装饰器皿，将我们的文化传播至远方。"
 rav_the_new_ravenna: "新拉韦纳"
 rav_the_new_ravenna_desc: "历经数代的停滞不前后，我们投入资源重振城市：清理旧城区，修筑新的道路与市集广场，并为愿意定居城内的工匠和商人提供优惠。由此而生的城市更加开放、更加繁荣，也更能承受一个锐意革新的国家所带来的增长。这种对城市肌理的再投资，使拉文纳成为人们向往之地，而非仅仅困守之所。"
 urb_the_enlightened_university: "开明大学"
 urb_the_enlightened_university_desc: "我们的大学历经政府更迭与时代动荡而长存，凭借其教学声誉持续吸引着学生与学者来到我们的城市。在最为辉煌的日子里所确立的#italic 学术#!传统，早已化为一个活生生的机构，将这种精神带入新的时代。这份学术的延续性，是我们献给未来的礼物，也是我们与往昔伟大之间的纽带。"
 #Sardinian Shared
 sardinian_the_barbagia: "巴尔巴贾山"
 sardinian_the_barbagia_desc: "数百年来，中部山区——巴尔巴吉亚——对地中海的每一位入侵者而言，始终是一片“蛮族之地”。此地文化以#italic萨德#!（撒丁）身份为核心，那是一种顽强孤立的游牧文化，拒绝任何形式的外来赋税或征兵。这造就了一处文化堡垒，古老努拉吉精神中的独立性得以保存。入侵的国家或可掌控沿海城市，但岛屿腹地终将是一片禁地，凭借纯粹的地理与社会上的抗拒，确保我们习俗的延续。"
 sardinian_the_artizanu: "撒丁工匠"
 sardinian_the_artizanu_desc: "在城镇之中，一个独特的撒丁工匠与银匠阶层正在崛起，他们将外来美学与本土图案相融合。这些行会极力捍卫自身的自由，常与外国商人的垄断势力发生冲突。这造就了一种充满活力的城市文化，既具地中海的视野，又怀撒丁的灵魂，为国家提供了一批能够驾驭海上贸易复杂事务、识文断字的中坚阶层。"
 sardinian_the_ademprivio: "公共使用权"
 sardinian_the_ademprivio_desc: "撒丁文化始终根植于 #italic Ademprivio #! 之中：即百姓有权在封建领地上放牧、伐木、取水的权利。尽管土地私有化的企图屡屡出现，撒丁农民依旧坚守着他们"
 sardinian_the_turres_costeras: "沿海塔楼"
 sardinian_the_turres_costeras_desc: "为抵御海盗威胁，我们的人民将修筑一连串的海岸塔楼。由此将兴起“海岸守望”之风，整户人家将从海边迁往丘陵，同时维持永久轮岗的哨兵。这种“瞭望地平线”的文化，将使全岛人口都成为国家的战略资产，确保地中海最紧要的航道，时时刻刻受到一个将防御视作日常仪式的民众的监视。"
 sardinian_the_hymnu_sardu: "撒丁颂歌"
 sardinian_the_hymnu_sardu_desc: "随着现代民族意识渐渐觉醒，我们的文化正从封建忠诚转向一种崭新的“王国爱国主义”。这体现为撒丁文学与政治小册子的蓬勃兴起，它们呼吁“撒丁人的撒丁岛”。由此运动中，崛起了一批崭新的、现代化的行政阶层，他们力图将我们古老的封建法律改革为一部现代的主权宪法。"
 sardinian_the_industrial_transition: "产业转型"
 sardinian_the_industrial_transition_desc: "随着新的铅矿与锌矿矿脉被发现，我们传统的游牧文化正开始与工业时代相融合。我们将建立最早的现代矿场与铸造厂，由撒丁工人操持，他们将传统的“行会纪律”带入这个崭新的时代。这种矿业文化将为我们提供现代战争与公共工程所需的原材料，使这座岛屿成为我们这个崛起国家的锻炉。"
 #Sicilian Shared
 legacy_of_the_normans: "诺曼人的遗产"
 legacy_of_the_normans_desc: "在征服的熔炉中锻造而成的西西里诺曼军队，将诺曼骑士势不可挡的冲锋，与拜占庭、阿拉伯和伦巴第的战略精妙结合在一起。他们兼具战场的凶猛与战术的灵活，在文明交汇之地建立起一座王国。"
 sic_naval_vigilance: "海军警戒"
 sic_naval_vigilance_desc: "巴巴里海盗与奥斯曼人的持续袭击迫使西西里维持严密的海岸防御。它的桨帆船与要塞成为保卫南欧的关键。"
 sic_sicilian_silk: "西西里丝绸"
 sic_sicilian_silk_desc: "在腓特烈二世时期，丝绸是西西里的主要出口。尽管后来产业被意大利北方诸邦超越而衰落，但没有理由不能复兴。通过投资丝绸生产，我们的织工与工匠将再度兴旺。"
 sicilian_the_cult_of_the_santuzze: "女圣人崇拜"
 sicilian_the_cult_of_the_santuzze_desc: "长期以来，西西里的宗教认同都与极具影响力的女性主保圣人紧密相连，人们相信这些圣人能够保护城市免受瘟疫与熔岩之害。与敬奉这些圣徒相关的盛大、富有戏剧性的游行（如#italic 巴勒莫的圣罗莎莉亚节#!），既是社会紧张的宣泄口，也是社群团结的展示。这些仪式是西西里公共生活的脉搏，强化着社会的凝聚力。"
 sic_sicilian_enlightenment: "西西里启蒙运动"
 sic_sicilian_enlightenment_desc: "尽管远离巴黎或维也纳的大型沙龙，西西里岛却也孕育了自己的启蒙运动。知识分子们在天主教人文主义的框架内，挑战封建特权、推广科学并倡导法律改革。这些思想在君主制与传统的阴影下，为现代性奠定了基础。"
 sic_sicilian_reforms: "西西里改革"
 sic_sicilian_reforms_desc: "随着时间推移，我们的制度已变得过时或效率低下。如果我们希望国家繁荣昌盛，改革势在必行。最优秀的人才将携手合作，确保杜绝浪费，实现最高效的运作流程。"
 #Sicilian Unique
 sic_constitions_of_melfi: "《梅尔菲宪章》"
 sic_constitions_of_melfi_desc: "皇帝腓特烈二世，$SIC$的霍亨斯陶芬国王，起草了被称为《梅尔菲宪章》或称#italic 《奥古斯都之书》#!的法律汇编。该法典在数百年后依然沿用，奠定了治理国家的坚实基础，规范了公法、司法程序以及封建法、私法与刑法。"
 sic_studium_generale: "通识学院"
 sic_studium_generale_desc: "由阿拉贡国王阿方索五世于1434年创办的卡塔尼亚大学，是西西里最古老的大学，也是少数充分获得“通识学院”地位的南方学府。凭借王室特许与学术、法律并重的教育，它培养出服务教会与王权的法学家、神学家和科学家，立足于一个文化多元的地区。"
 sic_the_court_of_the_royal_patrimony: "王室遗产法庭"
 sic_the_court_of_the_royal_patrimony_desc: "我们将设立这一专门法庭，管理王室地产与 #italic 海关税务署 #! （关税机构）。通过使丝绸、金枪鱼与谷物出口税的征收专业化，国家将大幅减少腐败及流向地方男爵的"
 sic_licentia_populandi: "定居特许"
 sic_licentia_populandi_desc: "为增加收成与税收，国家向贵族颁发了 #italic 殖民许可状 #!。这将允许领主在岛屿荒凉的内陆建立全新的城镇，以土地和较低的赋税吸引农民前来定居。这场内部殖民运动将改变西西里的地貌，把荒芜的腹地变成一片片富饶的农业聚落。"
 sic_sicilian_baroque: "西西里巴洛克"
 sic_sicilian_baroque_desc: "我们的岛屿地真佩服，许多建筑因此坍塌。为了取代这些旧结构，国家将统筹人类历史上最宏大的重建计划之一。政府不会仅仅修复古老的废墟，而是运用夸张的、抗震的#italic 西西里巴洛克#!风格，对整座城市进行重新设计。这将展示国家在面临全面灾难时动员劳动力与资本的惊人能力。"
 sic_the_marsala_wine_industry: "马儿萨拉葡萄酒业"
 sic_the_marsala_wine_industry_desc: "得益于外国投资者的投入，西西里葡萄酒将从一种本地农民饮品转变为能够耐受长程海运的加强型奢侈品。#italic 葡萄酒庄#!文化将成为西西里财富与精致的新象征。它将岛上古老的农业传统与全球贸易的现代工业世界连接起来。"
 #Tuscan Shared
 birthplace_of_renaissance: "文艺复兴的摇篮"
 birthplace_of_renaissance_desc: "我们对美术的投入、对艺术人才的培养以及对创新思想的追求，使我们被视为世界上文化、哲学和科学进步最前沿的引领者之一。"
 a_land_of_banks: "银行之乡"
 a_land_of_banks_desc: "$tuscany_area$是$europe$的银行业中心，众多强大的金融机构总部设在其主要城市。从这些基地出发，通过广泛的贸易网络与利润丰厚的合作伙伴关系，它们的影响力遍及$italy_region$并进入北欧。"
 tuscan_merchant_houses: "托斯卡纳商人家族"
 tuscan_merchant_houses_desc: "在欧洲各地的各大贸易城市中，凡是有汇票签署、商品过秤之处，我们商人的名字无人不晓。从英格兰的羊毛市场到黎凡特的香料之路，我们的商业家族将影响力延伸至国土之外很远的地方，掌握着任何军队都无法匹敌的力量。这张商业与信贷的网络，确保我们在远方国王的宫廷中也能赢得一席之声。"
 tuscan_the_mezzadria: "对分制"
 tuscan_the_mezzadria_desc: "在我们领地那片肥沃的丘陵与河谷之间，地主与佃农之间古老的合作关系，确保田地得到精心耕作，收成得以诚信分享。#italic分成制#!不仅仅是一种农业安排；它是一份社会契约，维系着依赖乡村产出的农民与商人阶层。这种城乡之间的纽带，正是我们繁荣所赖以立足的根基。"
 tuscan_literary_academies: "托斯卡纳文学学院"
 tuscan_literary_academies_desc: "我们的城市催生了致力于语言净化、知识探索与公民美德培育的学术团体。从文学学者的语文学调查到科学家的自然哲学研究，这些学院汇聚了时代最优秀的头脑，磨砺了我们行政官员的才智。这一有组织的探究传统，已然提升了我们的治理品质与制度的抱负。"
 tuscan_enlightenment: "托斯卡纳启蒙运动"
 tuscan_enlightenment_desc: "启蒙运动的理性精神已在我们的城市深深扎根，思想家与改革者们在此挑战迷信、编纂法律，并从根基上重新设计我们的制度。接受新哲学熏陶的统治者，将子民的福祉既视为道德义务，也视为善政的尺度。这份对理性与改革的承诺，正将我们的街道、法庭与学院转变为现代世界的典范。"
 #Tuscan Unique
 florino_d_oro: "弗罗林金币"
 florino_d_oro_desc: "自1252年起，我们造币厂铸造的金#italic弗罗林#!便是整个基督教世界最受信赖的货币，从伦敦的钱庄到亚历山大港的集市，无人不毫不犹豫地接受它，因为无论历经多少位国王的雄心壮志，它的重量与纯度始终如一。以弗罗林进行贸易的商人，交易的也是我们的声誉：每一笔以我们货币完成的交易，都在无声地彰显$FLO_ADJ$治理的稳固，以及支撑其后的各项制度的可靠。这种对我们货币的普遍信心，使我们法庭所办的每一笔交易都更为顺畅，也让国库持续获得唯有真正值得信赖的交换媒介才能稳定产生的税收。"
 luc_the_silk_republic: "丝绸共和国"
 luc_the_silk_republic_desc: "长久以来，我们编织着全意大利最精美的#italic 卢卡丝绸#!，我们的织机使这座城市繁荣昌盛，远超其体量。织工行会守护着工艺的秘密，并确保着在远方市场上能卖出高价的品质。这种对布料的精通，将原始的丝线转化为我们共和国财富的基石。"
 pis_maritimes_legacy: "海上共和国的遗产"
 pis_maritimes_legacy_desc: "三个世纪以来， $PIS$ 一直是西地中海占主导地位的海上强国之一，其桨帆船抵达从撒丁岛到黎凡特的每一处港湾，而其对萨拉森人的海战胜利，更为本城赢得了弱小势力无法染指的市场准入特权。1284年梅洛里亚一役的失利削弱了我们的舰队，却无法抹去那数百年海上贸易所缔造的根基；我们的船长熟知这片海域，我们的商人在每一处港口都有相识的同行，而那些曾令我们辉煌的航线，如今仍是我们能够扬帆驶过的航线。我们的航海传承，使我们的商人在西方贸易中相较任何内陆对手都更具优势，而对往昔海上荣光的追忆，也驱使我们去重建那曾被夺走的一切。"
 sie_artists: "锡耶纳画派"
 sie_artists_desc: "自$renaissance$肇始以来，绘画艺术便在$ITA$蓬勃发展，然而无人能及在$SIE$受训之画师的那份优雅——在那里，#italic锡耶纳大学#!作为$europe$最古老的大学之一，确保画家与学者同受同一传统的市民庇护之滋养。$SIE_ADJ$的艺术超凡脱俗、精致典雅，着重描绘圣经人物与圣徒所行的神迹。这种学问与艺术的融合，造就了$SIE_ADJ$画派的独特风格，使其声名得以延续数百年而不衰。"
 florentine_school: "佛罗伦萨画派"
 florentine_school_desc: "$FLO$的工坊——乔托、布鲁内莱斯基、马萨乔、波提切利与莱昂纳多——重新定义了绘画与雕塑对整个文明的意义，每一代人都拓展了人眼与人手在石料、颜料与青铜上所能达到的边界。任何希望被认真对待的赞助人都会在委托作品之前首先咨询$FLO_ADJ$的大师，而我们的艺术家无论被召唤到哪里都携带着这一声誉，将城市之名转变为一种超越任何单幅画作的凭据。这种未曾中断的艺术领导传统使我们的工作室充满了$ITA$最优秀的人才，并确保我们生产的作品赢得基督教世界最苛刻赞助人的敬仰——以及黄金。"
 luc_the_towers_of_lucca: "卢卡塔"
 luc_the_towers_of_lucca_desc: "在我们的城市中，贵族家族建造的巍峨塔楼高耸于天际线之上，每一座都是共和国内部声望与权力的宣示。#italic 圭尼吉塔#!在其中最为高耸，塔顶那些圣栎树已成为我们城市的象征。这些塔楼提醒所有进入此地的人们：我们的力量，植根于那些以建筑作为竞赛的公民们的雄心和竞争之中。"
 pis_the_university_of_pisa: "比萨大学"
 pis_the_university_of_pisa_desc: "本校于1343年依帝国特许状创立，历经席卷$PIS$的每一次政治动荡而屡遭重建，培养出的法学家、医师与神学家，将$PIS_ADJ$严谨治学的传统带入了$ITA$乃至更远之处的法庭与教堂。#italic比萨大学#!与众不同之处，不仅在于其历史之悠久，更在于其治学之法：历代教员始终吸引着那些宁愿提出问题而非满足于答案的学者，培育出一种历久不衰的探究习惯，使毕业生不止于死记成说。这种积极治学的传统塑造了我们所培养的每一位专业人才的素质，提升了我们各机构的学术水准，确保知识始终是一种活的实践，而非徒具形式的仪式。"
 sie_council_priori: "执政官委员会"
 sie_council_priori_desc: "本共和国的九人执政官，皆严格选自 $SIE$ 的商人行会，而高门贵族——其派系纷争曾使历届政府毁于一旦——则被排除在外。他们以行政上的勤勉治理城市，这是我们那些更为贵族化的邻邦所无法比拟的。他们任期短暂、问责公开，使得长期的腐败难以隐藏，派系操纵也难以披上公义的外衣。商人治理赋予我们的制度一种务实的能力，以及一种根植于商业与共识、而非出身偶然的正当性。"
 florentine_citizen_militia: "佛罗伦萨公民兵"
 florentine_citizen_militia_desc: "马基雅维利反对雇佣军的论点多年来一直不为人所听——行会宁愿花钱雇佣佣兵队长，也不愿亲自上阵——然而1494年与1512年的灾难，却以惨痛的代价证明了雇佣兵愿为何而战、又不愿为何而死。我们的应对之策，是将各区的男子编入常备连队，以公款训练装备，他们保卫 $FLO$ 的动力并非每月的薪饷，而是自己的家园与营生。武装自己的公民，造就了在雇佣兵会溃退之处坚守不退的步兵——这是一支为无法在战役季末重新议价之事而战的核心力量。"
 luc_the_city_walls: "城市围墙"
 luc_the_city_walls_desc: "我们用一圈宏伟的#italic 文艺复兴堡垒#!环绕着城市——这是这个时代最出色的防御工程之一，历经数十年的劳动与市政投资方才建成。城墙基部极宽，顶部设有步道，从未被任何敌人攻破过。正是凭借这一防御工事，我们在周边城市纷纷陷落之时仍能保持自由。"
 pis_marble_tradition: "比萨大理石传统"
 pis_marble_tradition_desc: "为$PIS$及周边海岸提供石料的采石场长期以来出产了一些$ITA$最优质的白色大理石，这些石材被用于建造定义我们天际线的大型教堂和市政建筑。受此传统熏陶的雕塑家和建筑师在半岛备受追捧，而石材本身也以高价出售给希望以$PIS_ADJ$风格建造建筑的赞助人。这种对石料的精通提升了我们的文化地位，并确保每一份签下的合同、每一批售出的货物都承载着一座懂得如何让世界变得美丽的城市的声望。"
 sie_monte_dei_paschi: "牧山银行"
 sie_monte_dei_paschi_desc: "我们的执政官已设立 #italic 牧场山银行 #! ——一家以马雷马牧场收入为担保的公共信贷机构——以便为商人与贫民提供平价信贷，并在贸易日益扩张的时代，为 $SIE$ 的商业活动奠定稳固的基础。这项公共财政上的创新，成为了一种比帝国更为长久的银行稳定典范，使我们的商业生活得以在那些令更为鲁莽的对手破产的危机中延续不坠。这一机构加速了新经济实践在我们境内的推广，同时也带来了一座有志之城所需的稳定财政收入。"
 flo_florentine_bastions: "佛罗伦萨棱堡"
 flo_florentine_bastions_desc: "我们城市的军事工程师已掌握了低矮星型堡垒的设计，其倾斜的墙体能够散射炮火，并消除了旧式圆塔易于被地道攻破的盲区。我们所建的每一座重要据点都运用了建筑师们精研的几何学原理，从而建造出既需更少兵力驻守、又使任何进攻者更难突破的防御工事。这种对#italic 意大利式棱堡#!的掌握，使我们的城墙成为意大利最现代化的工事，并将驻守成本转化为可控的优势，而非财政上的负担。"
 luc_counter_reform_diplomacy: "反宗教改革外交"
 luc_counter_reform_diplomacy_desc: "我们通过审慎而克制的外交，在时代的宗教动荡中坚守了独立。我们对信仰的承诺真诚但从未流于狂热，这使得我们得以同时赢得虔信者与务实派的好感。这种虔诚与审慎的平衡，已成为我们共和国得以持久的艺术。"
 pis_natural_philosophy: "比萨自然哲学"
 pis_natural_philosophy_desc: "$PIS$的学者们追求的是通过细致的观察与测量来求得理解，而非单纯依赖既有权威，这建立在我们#italic比萨大学#!悠久的探究传统之上，涵盖力学、天文学与自然技艺等诸多领域。这种实证的治学精神，不仅塑造了我们的哲学家，也塑造了我们的工程师与指挥官，他们以学者研究天体运行时同样的严谨态度来处理问题。自然哲学训练了我们的军事思维，使我们军队的战术更为精准。"
 sie_santa_caterina: "圣卡泰丽娜的遗产"
 sie_santa_caterina_desc: "卡泰丽娜·迪·贾科莫·迪·贝宁卡萨——神秘主义者、神学家、教会圣师——仍是 $SIE$ 有史以来诞育的最受敬仰的灵魂。在那场时代大争论之后随之而来的宗教动荡年代，她的记忆成为一种坚定、虔敬信仰的凝聚之点，以虔诚而非论辩来回应挑战。$SIE_ADJ$ 的学者与布道者将自己置于这场灵性复兴的最前沿，援引这位圣徒的著作，主张改革必先始于人心，而后才能及于律法。这份圣洁与坚信的遗产，深化了我们人民的信仰，并将那些本可能在宗教冲突压力下分崩离析的社群凝聚在一起。"
 flo_camerata_fiorentina: "佛罗伦萨卡梅拉塔社团"
 flo_camerata_fiorentina_desc: "在乔瓦尼·德·巴尔迪伯爵的府邸中，音乐家、诗人与学者们齐聚一堂，试图重现他们想象中古希腊悲剧表演的声音——这一追寻终将创造出全然崭新、全然属于我们自己的东西。这些夜晚所激荡出的交谈、试验与创作，吸引了诸多才华横溢的演奏家，他们看重我们宫廷所给予的创作自由，胜过在别处所能获取的更高薪酬。这个艺术革新者的圈子——#italic 佛罗伦萨同好社 #!——使我们的城市成为一场音乐革命的发源地，这场革命终将把我们的影响力传播到每一个聆听过我们所创之作的宫廷。"
 luc_the_musical_tradition: "音乐传统"
 luc_the_musical_tradition_desc: "我们的城市长久以来滋养着音乐艺术，吸引作曲家与演奏家汇聚于教堂、沙龙与公共庆典之中。我们的乐正与乐器工匠声名远播，以至于才华横溢的#italic音乐家#!皆以受聘于此为荣耀之标志。这一传统令我们的城市化作一座舞台，使街头巷尾充盈着这门我们已然使其独具标志的艺术。"
 pis_medical_tradition: "比萨医学传统"
 pis_medical_tradition_desc: "$PIS$大学的医学院以#italic 植物园#!为核心——这是世界上最古老的大学植物园之一——学生们在此研究植物的治愈特性，并开发更有效治疗流行病的方法。在$PIS$接受培训的医生将这一经验传统带往全国，改善了患者的治疗效果，并减少了瘟疫与传染病对我国人口造成的损失。这份对医学学习的投入增强了我们人民的韧性，并传播了那些在诊断与记录保存的精细技艺中自然习得的素养。"
 sie_the_palio: "$SIE$赛马节"
 sie_the_palio_desc: "每年两次，$SIE$的各市区在#italic帕利奥赛马节#!中一较高下：这是一场在坎波广场上举行的无鞍赛马，既是一场竞赛，更是一场市民仪式，将城中各街区凝聚于一场共享的较量、身份认同与炽烈社区荣誉的戏剧之中。这场盛大庆典的精巧排场吸引着来自$ITA$各地的游客，向所有目睹者昭示着$SIE_ADJ$的文化活力，巩固了我们这座从未忘记如何庆祝自我的城市之声誉。这一历久弥新的传统扩大了我们在本地区的影响力，也赢得了那些视$SIE$为市民文化力量之活见证的宫廷的钦佩。"
 flo_florentine_merchant_houses: "佛罗伦萨商人家族"
 flo_florentine_merchant_houses_desc: "本城的望族已建立起横跨整个大陆的商业网络——伦敦的代理人，布鲁日的代办人，亚历山大港的通信人——使得印有我们名号的汇票，在那些从未见过我们城墙的城市中，也能如硬币般自由流通。通过在我们立宪政府的庇护下将这些网络正式化并加以扩展，我们确保了商人们能够在一种任何由君主统治的对手都难以轻易复制的稳定与信任之上运营。我们 #italic 商号 #! 的这种触角，推动着我们所从事的每一笔贸易的收益，并为我们工坊所产的货物打开了最遥远、最有利可图的市场。"
 luc_the_lucchese_constitution: "卢卡宪法"
 luc_the_lucchese_constitution_desc: "我们古老的 #italic 共和宪法 #! 历经岁月而不坠，全赖审慎的治理与我们公民抵抗暴政的决心。当邻近城邦相继沦陷于诸侯与征服者之手时，我们始终不曾中断成文法与议会的运作。这份历久不衰的秩序，赋予了我们的国家一种连更为庞大强盛的邻邦都艳羡不已的稳定。"
 pis_academic_prestige: "比萨学院声望"
 pis_academic_prestige_desc: "数个世纪的学术卓越，使得$PIS$这个名字在$ITA$及其他地区有教养的宫廷中成为学问与精致文化的同义词。外国学生和富有的赞助人珍视$PIS_ADJ$的教育，视其为身份的象征；在这种有文化抱负的氛围中产生的艺术作品，其价格令那些将这座城市与品质联系在一起的眼光独到的收藏家们趋之若鹜。这种学术声誉提升了我们在外国宫廷中的地位，并使那些生产和销售由我们的学术传统所激发的艺术作品的人们变得富有。"
 sie_civic_pride: "锡耶纳公民自豪"
 sie_civic_pride_desc: "即便 $SIE_ADJ$ 共和国的宏图壮志最终屈服于外部压力与托斯卡纳的统合，$SIE$ 的公民们仍保持着对自身独特身份——他们的方言、艺术与社群自治传统——的强烈自豪，使得这座城市若无挑衅便难以被轻易吞并。那些企图挑衅或削弱 $SIE$ 的人，都发现其人民在抵抗中异常顽强，他们被数百年共同的记忆紧紧维系在一起，坚信 $SIE_ADJ$ 的生活方式值得捍卫。这种深植人心的市民精神，遏阻了针对我们的侵略行径，也维系着那源自真心关切本乡福祉之民众的繁荣。"
 #Venetian Shared
 ven_venetian_palaces: "公社传统"
 ven_venetian_palaces_desc: "威尼托诸城的财富与秩序，是建立在 #italic Comùn #! （标准意大利语作 #italic Comune #! ：公社）之上的——这是市民与贵族之间的一项盟约，约定共同分担治理之责，而非将其交付给单一的领主。从帕多瓦到维罗纳，乃至更远的山地城镇，这种由选举产生的议会、成文法规与市民法庭构成的传统，赋予了我们的城市生活一种纯粹封建地区所无法比拟的稳定与自信。这份公社传承使我们的制度坚韧不拔，也使市民阶层对他们所协助治理的城市之兴衰休戚与共。"
 ven_state_inquisition: "威尼斯人文主义"
 ven_state_inquisition_desc: "在佛罗伦萨将文艺复兴据为己有之前，威尼托的学者们早已在重新发掘古典文献，探问身为公民而非臣民意味着什么。弗朗切斯科·彼特拉克在我们这里度过了人生的最后岁月，本地区的图书馆与宫廷也吸引了诸多学者，他们认为古典学问与基督教信仰并无矛盾。这种 #italic 人文主义 #! 的传统塑造了我们治理者的思维方式——他们不仅是行政官员，更是被历史与论辩所陶冶出来的人物，这提升了我们每一次谈判的质量。"
 ven_venetian_painting: "威尼斯绘画"
 ven_venetian_painting_desc: "我们城市的画家们发展出一种意大利其他地方皆无与伦比的风格，摒弃了佛罗伦萨传统那种生硬的轮廓线，转而追求唯有 #italic 威尼斯画派 #! 才能驾驭的那种色彩的温暖光泽与光影的柔和交融。乔凡尼·贝利尼、乔尔乔内与提香·韦切利使我们的画坊成为基督教世界每一位赞助人艳羡的对象，外国领主们不惜翻越阿尔卑斯山前来订购画作，因为没有任何其他画派能媲美我们颜料的丰富与构图的自信。我们的绘画为我们的文化赢得了一种感官精致的美誉，这种声誉传播得比我们的军队更远，从我们武力永远无法企及的宫廷中，吸引来赞助人、财富与赞叹。"
 ven_mixed_naval_tactics: "帕拉第奥式建筑"
 ven_mixed_naval_tactics_desc: "安德烈亚·帕拉第奥汲取古罗马的比例法则与威尼托的建筑材料，创造出一种兼具学识与实用性的风格，无论是布伦塔河畔的别墅，还是集市广场上的市民柱廊，皆相得益彰。他的理念从维琴察传播到每一座#italic内陆领地#!城市，使我们的公共建筑拥有一种根植于数学、而非流行风尚的庄严。这种#italic帕拉第奥风格#!不仅美化了我们的城市，也使其变得易于解读：造访我们城镇的旅人，能从每一面立面上读出自信、繁荣与永恒。"
 ven_ship_mounted_gunpowder_weapons: "威尼托别墅文化"
 ven_ship_mounted_gunpowder_weapons_desc: "威尼托的贵族们将 #italic 内陆领地 #! 视为自己的避暑乡间，在那里修建别墅——这些别墅既是正常运作的农庄，也是休憩之所，更是无法在运河上展开的文化生活之舞台。沿布伦塔河，直至维琴察与特雷维索的丘陵地带，这些庄园举办沙龙、音乐会与哲学座谈，足以与城市学院所能提供的一切相媲美。这种 #italic Vìla #! （标准意大利语作 #italic Villa #! ：乡间别墅）的文化，从本地区各处吸引人才，使我们的统治阶层与他们所治理的土地保持联系，让他们对自己所统治的土地拥有切实的了解。"
 ven_venetian_thalassocracy: "狂欢节"
 ven_venetian_thalassocracy_desc: "在四旬斋前的数周里，我们文化圈内的各座城市都会戴上 #italic 巴乌塔面具 #!，短暂地变得人人平等：一名戴面具的商人与一位元老并肩而行，无从分辨彼此，而平日规范衣着、行止与称谓的种种规矩，皆因举世的默许而暂告中止。这种受到节制的失序传统，数百年来一直充当着我们的泄压阀，也吸引了来自全欧洲的游客，他们一边挥金如土，一边为这奇观赞叹不已。这一年度狂欢节，维系着我们那种其他任何文化都无法真正复制的、受约束的自由之美誉。"
 #Venetian Unique
 pad_carraresi_dynasty: "卡拉拉执政团"
 pad_carraresi_dynasty_desc: "达卡拉拉家族统治帕多瓦已逾一个世纪，他们的权威建立在个人威望、帝国的法律认可，以及对其所统治城市繁荣的真切投入三者之结合上。我们的治理保留了公社时期所建立的市民机构，将其活力导入领主治理的服务之中，而非将其取而代之，其结果是一座运转异常顺畅的城市。这种尊重其所继承的市民结构的#italic领主制#!传统，使我们的城市治理运作得更好、花费也更少，令我们的臣民安居乐业、忠心不二。"
 ven_stato_da_mar: "海上领土"
 ven_stato_da_mar_desc: "自最早的 #italic 总督 #! 时代起，$VEN$ 便以掌控海洋为其权力之根基；我们的商人经亚得里亚海运来东方的财富，而我们的海外港口与岛屿网络—— #italic 海上国度 #! ——则守护着维系这一切的航道。在这个海上秩序的核心，矗立着 #italic 阿森纳造船厂 #! ，这是中世纪世界最伟大的工业综合体，一旦共和国有需，便能在一日之内下水一艘装备齐全的桨帆船。商人的支配地位、国家造船厂与海外帝国，三者结合，使 $VEN$ 有别于任何内陆对手，将大海本身化为我们国家的延伸。"
 perpetual_general_captain_of_the_people: "终身的人民队长"
 perpetual_general_captain_of_the_people_desc: "斯卡拉家族宣称拥有 #italic 人民队长 #! 之衔，这并非临时性的职务，而是植根于公社法律之上的永久授予，将每一场军事行动都塑造为保卫市民权利，而非王朝野心之举，使得对手更难将我们的战争说成是单纯的侵略。坎格兰德·德拉斯卡拉正是凭借这种正当性建立起自己的声望——他挥军对抗米兰、威尼斯与帕多瓦，却将每一场冲突都呈现为正义之举——而我们则通过让城市议会参与其他领主独断的决策，将他的先例制度化。这种法律地位与公众授权的结合，使对手不愿公然与我们为敌，因为任何对维罗纳的攻击，都会被视为对公社本身的攻击。"
 pad_the_bo: "帕多瓦大学"
 pad_the_bo_desc: "创建于1222年的#italic博宫#!，得名于其最早的学生们聚集的那家客栈，自建立以来从未停止过作为欧洲伟大学术中心之一的地位；帕多瓦愿意讲授那些更为谨慎的大学所回避的学科，使其成为每一代求知者心向往之的目的地。维萨里在此进行了他的解剖演示，伽利略在此担任数学讲席授课，法学院更为整个欧洲大陆培养了无数法官与行政官员。这种从未中断的自由探究传统，提高了依赖这所大学的市民阶层的识字率与技艺水准，也吸引了众多学者，他们的存在使这座城市的知识生活始终保持活力。"
 ven_gothic_architecture: "哥特式建筑"
 ven_gothic_architecture_desc: "沿我们运河两岸拔地而起的宏伟宫殿，体现了一种完全属于我们自己的建筑风格，它借鉴了哥特北方的尖拱、拜占庭东方的开放式柱廊，以及伊斯兰工匠精致的镂空雕饰，融合成我们称之为#italic繁花哥特式#!的风格。在意大利再无他处，商人的财富能如此自信地在石材与雕花大理石上宣示自身，公爵宫与黄金宫便是明证——我们的共和国能够建起不逊于任何国王的宏伟建筑。这一建筑传统巩固了我们贵族阶层的地位，使$VEN$的外在容貌与维系其繁荣与市民自豪感密不可分。"
 court_of_great_refugees: "流亡者的宫廷"
 court_of_great_refugees_desc: "但丁·阿利吉耶里流亡期间，曾多年漫步于我们的街巷，他的到来也吸引了其他人前来：诗人、学者与能工巧匠们，在维罗纳的罗马遗迹与丰富的石材中，看到了一座仍值得为之增光添彩的城市。我们将这种好客的传统发展为自觉的政策，为流离失所的才俊提供庇护与资助，并将最优秀的工匠吸引到 #italic 马尔莫里纳 #! 古老的作坊中，在那里，几代人积累的石雕技艺与新来者带来自意大利各地的新技法相遇融合。我们的好客之名吸引了非凡的艺术家，也为我们宏大的建筑工程提供了深厚的技艺人力，石材与人才皆触手可及。"
 pad_medical_school: "医学院"
 pad_medical_school_desc: "自大学创立以来，帕多瓦的医学院便被全欧洲公认为培养医师最为严谨的学府，它将系统的解剖研究与临床观察相结合，这是单凭伟大的阿拉伯医典汇编所永远无法达到的。穿过其解剖剧场的学生们，对人体的理解之详尽、之精确，是基督教世界任何其他学府都无法比拟的；而他们日后成为的医师，改变了他们此后所服务的每一座城市对疾病的理解与治疗方式。由于我们的医生信任自己的观察，瘟疫对我们子民的侵袭，远比对那些仰赖迷信之人来得轻微，而这所大学也提升了它所触及的每一个受教育阶层的识字水平。"
 ven_printing_industry: "印刷工业"
 ven_printing_industry_desc: "1494年，阿尔多·马努齐奥在$VEN$创立#italic阿尔定印刷所#!之时，我们几乎在一夜之间便成为了世界的印刷之都；我们的商人拥有资助印刷业的金钱，我们的学者精通编校所需的希腊文与拉丁文，我们的商路则能将印成的书籍运往欧洲的每一个宫廷。阿尔多所创制的斜体字、价廉物美的袖珍八开本，以及他所出版的柏拉图、亚里士多德与维吉尔的权威版本，为整个欧洲大陆的印刷业树立了至今无人企及的标准。对书籍贸易的精通，使$VEN$的影响远远超出我们桨帆船所能运抵之地，从我们印刷机中流淌而出的思想，变得与我们仓库中的香料一样珍贵。"
 the_adige: "阿迪杰河"
 the_adige_desc: "阿迪杰河自阿尔卑斯山发源，穿城而过，一路奔向亚得里亚海，自罗马时代起便沿途载运谷物、木材与制成品，获利丰厚。我们投资改善河岸码头，疏浚较浅的河段，并与下游各公社谈判通行权，将天然的地理优势转化为一套经过精心管理的商业体系。河运贸易为我们的市场填满了来自山区的货物，为我们的城市带来了对手难以轻易切断的稳定繁荣。"
 pad_paduan_philosophy: "帕多瓦哲学学派"
 pad_paduan_philosophy_desc: "帕多瓦的哲学院发展出了一种对自然界进行理性探究的传统，它以亚里士多德为基础，得出的结论却远比公开的神学更能困扰教会。在帕多瓦，人们普遍认为灵魂非不朽、理智是集体的而非个体的以及自然原因能解释一切事物。这种世俗推理的文化培养出了具有非凡知识独立性的律师、医生和行政官员——他们所受的训练是分析而非简单地接受权威。#italic 帕多瓦学派#!的声誉使我国聚集了众多非凡的头脑，吸引了丰富城市知识生活的学者。"
 ven_venetian_school_of_music: "威尼斯乐派"
 ven_venetian_school_of_music_desc: "圣马可大教堂金色中殿两侧相对而立的双重唱诗楼，孕育出了#italic Cori Spesâi#!（标准意大利语作#italic Cori Spezzati#!：分合唱）的技法——两组乐团一应一和、交错重叠，构成一种唯有大教堂非凡的音响效果才能充分呈现的、精心控制的声音交响。阿德里安·维拉尔特、加布里埃利家族与克劳迪奥·蒙特威尔第皆在这一传统中创作，他们所培养的音乐家们，将$VEN_ADJ$复调风格传播到从马德里到维也纳的各地宫廷。这一音乐流派使$VEN$成为公认的欧洲音乐之都，我们这座城市所培养出的一代代作曲家与歌者，将$VEN_ADJ$的声望带到了我们桨帆船永远无法抵达之处。"
 scaligers_military_ambitions: "竞技场表演"
 scaligers_military_ambitions_desc: "维罗纳的圆形竞技场是意大利现存最完好的罗马古迹之一，我们将其打造为北方最盛大的公共 #italic Spettacoli #! ——斗牛、游行与市民竞赛——的舞台，吸引威尼斯乃至 #italic 内陆领地 #! 各地民众连日云集。没有哪座城市能在古罗马石壁之内提供如此规模的盛景，而这一传统也早已与维罗纳的自我认知密不可分：这是一个仍在两千年前所建的空间中，当着成千上万见证者展示自身身份的共和国。这种公共盛大的声望传遍意大利北部，吸引来的访客所花费的金钱与寄回家乡的书信，对我们地位的提升比任何使节都更为有效。"
 pad_the_accademia: "帕多瓦学院"
 pad_the_accademia_desc: "我们设立 #italic 帕多瓦科学、文学与艺术学院 #!，将本城最杰出的学者、医师与文人汇聚于一个获得国家正式支持的机构之中，这一体制将大学教员个人的才智转化为持续的集体事业，使单一教授无法独力承担的项目得以展开。学院提供了一个平台，使大学研究的成果与行政和商业的实际需求相结合，让国家以远低于维持多个独立顾问机构的成本获得博学之士的专业意见。有组织的学术研究使我们的宫廷拥有异乎寻常的技术与行政智囊深度，并留住了那些原本可能转投更大国家、谋求更显赫舞台的人才。"
 ven_ridotto: "利多托赌场"
 ven_ridotto_desc: "1638年，$VEN$大议会采取了前所未有的举措，在丹多洛宫批准设立一座常设的公共赌场，建立了#italic里多托#!，这是欧洲首个由国家监管的赌场。入场须佩戴面具并戴贵族帽，这使该场所呈现出一种人人平等的表象，同时确保收益稳定流入国库，也使贵族的行为始终处于国家的监视之下。这一受管控的机构，将共和国无法根除的恶习，转变为可靠的财源，也成为将本城最有权势之人置于可监视之处的手段。"
 consolidate_italian_holdings: "阿尔卑斯山之门"
 consolidate_italian_holdings_desc: "斯卡拉家族不仅统治着维罗纳，更掌控着意大利北部日益扩张的城市网络。维系这样的疆域需要精密的外交策略、巧妙的权力委任以及高薪供养的职业军队。唯有通过巩固整合，维罗纳才能成为与意大利半岛其他强国真正匹敌的对手。"
 pad_paduan_commune: "帕多瓦公社"
 pad_paduan_commune_desc: "我们城市最古老的市政机构——民选议会、成文法规、市民参与公共决策的传统——即便在单一家族凌驾其上的领主统治的数十年间，也从未被彻底扑灭。我们恢复并正式确立这些公社制度，赋予我们的商人与市民阶层在城市治理中公认的角色，重建城市属于全体市民而非仅属统治者的观念。这一#italic帕多瓦公社#!（标准意大利语中称#italic帕多瓦公社#!：Paduan Commune）将我们最积极的市民的精力引导至为国家服务的机构之中，使相信自己纳税具有正当性的民众所贡献的税收不断增加。"
 ven_la_fenice: "凤凰歌剧院"
 ven_la_fenice_desc: "#italic凤凰剧院#!于1792年开幕，是$ITA$最宏伟的歌剧院，建成以取代一座毁于火灾的剧院，并以浴火重生的凤凰为名——这个象征不止一次残酷地应验。其镀金的内饰、依等级而设的包厢，以及一季又一季的首演，使歌剧从贵族的私人娱乐变成了这座已失去军事胜利却未失去美感的城市最具代表性的文化盛事。每晚，这座剧院都向贵族、旅人与评论家们展示共和国的品味、财富与雄心，而他们的赞誉所传播的范围，远胜于任何外交信函。"
 marmorina: "壮游之地"
 marmorina_desc: "维罗纳已成为欧洲受过教育的贵族若不造访便不算完成游历的目的地：英格兰的爵爷、法兰西的学者与德意志的亲王们纷纷前往竞技场、罗马剧场与斯卡利杰里哥特式陵墓，挥金如土，并将本城写入欧陆每个宫廷的往来书信之中。他们的记述使维罗纳成为意大利多层历史遗产的代名词——一座只需一个下午的漫步，便可读出罗马、中世纪与文艺复兴文明层叠痕迹、不属于任何单一世纪的城市。这股源源不断的富裕而有影响力的访客，充实了我们的国库，开启了仅凭我们的规模绝不可能引来的外交对话，并建立起一种远远走在我们军队之前的文明声望。"
 #Vivaro-Alpine Shared
 vivaro_alpine_drailles: "牧道"
 vivaro_alpine_drailles_desc: "牧人用以在高地夏季牧场与低地冬季牧场之间迁移畜群的古老季节性路线——#italic 德莱耶路 #!——是本地区维护最为精心的道路之一，穿越历经数世纪不断完善的山口与山谷。沿途的社区已发展出集体放牧权、驿站栖所与纠纷仲裁的制度，将季节性迁徙放牧由一项季节性风险转变为可靠的生产循环。正是因为如此细致地管理季节变化，我们的高地养育人民的能力，胜过任何定点耕作所能达到的水平。"
 vivaro_alpine_infantry: "阿尔卑斯步兵"
 vivaro_alpine_infantry_desc: "山地地形孕育出一支轻装机动的步兵传统，他们能在使骑兵与重甲都失去用武之地的环境中作战，这些人无需道路、无需平地，也无需比自己背负所能承受更长的补给线。我们文化所孕育的山谷子弟习惯了严寒、高海拔与突袭，能够以寡敌众，坚守狭窄的山口。在艰险地形上，我们的军队所遇到的对手大多是在开阔低地战场上训练出来的，他们对我们始终毫无准备。"
 vivaro_alpine_passes: "阿尔卑斯山口"
 vivaro_alpine_passes_desc: "塞尼山口、蒙热内夫尔山口、拉尔什山口：连接地中海世界与北欧的伟大跨阿尔卑斯通道，皆经过我们的领地，这使得即便是地位不高的领主，也成为国际往来不可或缺的守门人。商人、军队、教廷使节与朝圣者，无不需付费方能穿越我们的土地，而经我们之手流通的往来，为我们带来了单纯的内陆势力永远无法积累的情报、人脉与影响力。作为跨阿尔卑斯贸易枢纽的这一地位，使我们的外交格外灵通，商人格外广结人脉。"
 vivaro_alpine_herbes_des_alpes: "阿尔卑斯草药"
 vivaro_alpine_herbes_des_alpes_desc: "本地区的高山植被为我们提供了极为丰富的药材库——龙胆、山金车、缬草及数十种其他草药——这里的社区已发展出草药炮制与植物学知识的传统，使这些与世隔绝的山谷居民比低地居民更为健康。这并非民间巫术的产物，而是系统性观察的成果，以实用配方与世代积累的成败经验的形式代代相传。这些 #italic 阿尔卑斯草药 #! 赋予我们的治疗者一些依赖进口药品的大城市医师难以轻易复制的手段。"
 vivaro_alpine_valley_councils: "山谷议会"
 vivaro_alpine_valley_councils_desc: "我们山地社区的隔绝处境，迫使它们早在更大的国家想到要组织它们之前，就发展出了行之有效的自治制度：管理集体牧场的村议会、裁决纠纷的地方法庭，以及协调资源以助山谷度过寒冬的民选官员。这些机构的运作依赖于外来总督无法复制的本地情况知识，并经数代积累形成议事与记录的传统，使我们的社区在行政深度上远超其规模所应有的水平。这一#italic山谷议事会#!传统，使我们的治理异常精干，使我们的子民异常积极地参与自身事务的管理。"
 vivaro_alpine_nature: "阿尔卑斯风光"
 vivaro_alpine_nature_desc: "卢梭对山地纯朴生活的理想化想象，继而被浪漫主义运动的诗人与画家所传承，使阿尔卑斯山脉从一道需要翻越的屏障，转变为一个令人向往的目的地。我们的山谷、山峰与古老社区，成为受过教育的欧洲人投射一切自认已失落之物的镜子，吸引来的游客、博物学家与艺术家之多，是这些山口因其他任何缘由都从未见过的。我们以体现某种未被玷污的本真而著称的声誉，将我们文化的影响力传播到远超我们政治分量所能企及之处：人们来到我们这里以认识自身，并带着比任何条约都更为长久的记忆归去。"
 #Vivaro-Alpine Unique
 sal_the_alpine_passages: "阿尔卑斯山口"
 sal_the_alpine_passages_desc: "穿越我国的山口将意大利平原与远方的高地相连，我们已学会从每一位必须经过我方关隘的旅人和商人身上获利。控制#italic 阿尔卑斯通道#!赋予我们连军队都无法比拟的筹码，并借此维系着山脉两侧的友谊。这片地形，是我们最珍贵的传承。"
 sal_the_mountain_routes: "山地路线"
 sal_the_mountain_routes_desc: "我们对蜿蜒于山间的径路与大道了如指掌，外人却无从知晓。这份认知塑造了我们行军与补给的方式。我们的士兵沿着那些会让外国军队疲惫迷途的路径行进，在他人抵达时已筋疲力尽之处，他们却仍能保持充沛战力。这种对#italic 阿尔卑斯地形#!的深刻掌握，是一种任何堡垒都无法替代的力量。"
 sal_the_saluzzo_chronicles: "萨卢佐编年史"
 sal_the_saluzzo_chronicles_desc: "我们的宫廷培育出一种独特的文学传统，它将山脉两侧的语言与声音交织融合，编撰出出人意料的丰富多彩的编年史与诗歌。#italic 奥克语与意大利语#!在我们的文字中交融，正如它们在我们人民之中一般，创造出既不完全属于这一传统、也不完全属于那一传统的独特作品。这本记录我们是谁的编年史，将我们的身份保存在比石头更持久的文字之中。"
 sal_the_alpine_strongholds: "阿尔卑斯要塞"
 sal_the_alpine_strongholds_desc: "我们用城墙和塔楼加固了山中的天然要塞，使得我们的土地对于任何试图以武力占领的入侵者来说都是一场噩梦。每一条通往山谷的路径都通向一个设防的山口，而每一个山口都通向一座必须被攻克才能继续推进的#italic 山顶城堡#!。任何未经邀请就进入我们土地的军队都会发现，群山本身也已化身为他们的敌人。"
 sal_the_alpine_regiments: "阿尔卑斯军团"
 sal_the_alpine_regiments_desc: "我们的士兵经历了严酷的山地战争的锤炼——在那里，忍耐和纪律比人数更重要，每个人都深知战友的价值。侯国的#italic 高地军团#!赢得了稳健的声誉，即便在我国没有战争时，也备受追捧。这一军事传统是我们人民始终赖以依靠的盾牌。"
 sal_the_alpine_crafts: "阿尔卑斯工艺"
 sal_the_alpine_crafts_desc: "侯国的高地村庄长久以来依靠熟练的手工艺维持生计，生产出的优质产品远销下方平原的市场。我们工匠的知识在家族和行会内代代相传，确保每一代人都能完整继承#italic 阿尔卑斯工艺传统#!。这一产业支撑着社区的繁荣，并为我们的高地城镇赢得了经得起任何政治动荡考验的质量声誉。"
 #Italian Formables
 #Sardinia
 sar_the_giudicati: "裁判官领地"
 sar_the_giudicati_desc: "我们的岛屿曾分为四个自治的判官国，即 #italic 判官国 #!，各自拥有自己的法庭、法律，以及完全源自内部建立的治理传统。尽管那个时代已经过去，但它所培养出的独立行政习惯，依然深深扎根于我们的制度与人民之中。我们这种主权自治的传统，赋予我们的国家一种每个子民都能亲身感受、而非仅凭上位者宣告的正当性。"
 sar_the_stamenti: "三阶级议会"
 sar_the_stamenti_desc: "我们的议会#italic 三阶级议会#!是地中海世界最古老的代议制议会之一，它将立法顾问按教会、军事贵族和王室城镇三个阶级划分为三个独立的议会厅。这一体系使每一个主要选民群体在岛屿的治理方式中都拥有公认的发言权，将争端引向程序而非冲突。这种结构化的代议文化，使我们的商人和市民阶层始终致力于维护国家的稳定。"
 sar_university_of_cagliari: "卡利亚里大学"
 sar_university_of_cagliari_desc: "在我们首府建立一所大学，将大陆上早已享有的学术机构带给我们岛上的人民。在此受训的律师、医师与行政人员，不再需要远赴海外求学，他们所代表的才能也因此留在我们的治下，而不是去充实遥远宫廷的实力。这种对教育的投入，提升了我们统治阶层的识字率与才干，使我们的岛屿为应对日趋复杂的世界做好准备。"
 sar_sardinian_tercios: "撒丁步兵"
 sar_sardinian_tercios_desc: "我们的步兵在这个时代的战场上赢得了坚韧不拔的声誉，令敌人要击溃他们付出极为高昂的代价；他们坚守别人会放弃的阵地，发起别人不敢尝试的进攻。我们将这一传统正式确立，把步兵编入训练有素的长矛与火枪方阵，在我们男儿历来引以为傲的战斗素质之上加以强化。这种军事文化造就了一支士气极为高昂的军队，成为我们所进行的任何战役的中坚力量。"
 sar_enlightened_reforms: "开明改革"
 sar_enlightened_reforms_desc: "一代行政官员得出结论：我们的潜力一直受制于过时的法律、不均衡的税制，以及识字率的差距，致使太多子民无法参与国家的生活。我们承诺系统性地改革这些制度，整理税册、扩大教育，并以更清晰、更公平的法律框架取代种种豁免。这一行政现代化将提高我们的财政收入，并使我们的人民为应对一个正在转型的世界做好准备。"
 sar_the_cavalcadores: "撒丁尼亚轻骑兵"
 sar_the_cavalcadores_desc: "撒丁岛的内陆地区，尤其是坎皮达诺平原，发展出了世界级的马术文化。#italic 萨尔蒂利亚#!等马术赛事并非简单的游戏，而是极致骑术与军事戒备的展现。这一文化将为国家提供精锐轻骑兵部队（#italic 撒丁尼亚轻骑兵#!），他们以速度闻名，并能穿越险峻的喀斯特地形，成为我军首屈一指的侦察力量。"
 #Tuscany
 tus_il_contado: "孔塔多"
 tus_il_contado_desc: "#italic 孔塔多 #!（环绕我们各座城市的乡村地带）长久以来一直是托斯卡纳财富与权力的根基，其村落、城堡与农田皆依法依俗受城墙之内的城邦领主管辖。通过将我们对乡村的管辖权予以正式化，我们将零散的封建义务转化为一套井然有序的体系，涵盖农业余粮、兵源与直接税收。这种对孔塔多的掌控巩固了我们在地主阶层中的正统地位，并将我们的治理之手延伸至我们所宣称统治的每一寸土地。"
 tus_il_catasto: "佛罗伦萨地籍册"
 tus_il_catasto_desc: "我们将下令编纂 #italic 卡塔斯托 #! ，这是中世纪欧洲任何政府所进行过的最为全面的财产与财富普查，将每一位市民与每一户家庭的应税资产悉数登录在册，上至巨富商贾，下至寻常工匠。通过彻底摸清我们财政基础的全貌，卡塔斯托使我们得以前所未有的公平分摊赋税负担，以透明且可强制执行的评估取代旧制中派系操弄的弊端。这项改革赢得了臣民的信任，减轻了治理的成本，并确立了一套行政精确的标准，供日后托斯卡纳的统治者沿用发展。"
 porto_franco: "自由港"
 porto_franco_desc: "我们向各教各族的商人敞开我们的主要港口：亚美尼亚人、犹太人、希腊人与佛兰德人，皆可不受其他地中海港口所施加的宗教限制而自由往来。这种自由吸引了技艺精湛的商人与金融家前来定居，他们的到来丰富了我们的城市，也使我们的贸易航线充斥着那些较为封闭的港口无法承接的货物。我们这座海纳百川的港口，由一处朴素的沿海港埠，逐渐成长为西地中海最具活力的商业中心之一，吸引人口与资本汇聚于我们的海岸。"
 tuscan_uffizi: "乌菲齐"
 tuscan_uffizi_desc: "我们下令兴建 #italic 乌菲齐宫 #! ，作为我们新建大公国的行政中枢，这不仅是一处政府所在地，更是彰显我们权力的舞台，那条长廊不久将陈列满满的古物、雕塑与画作，宣示着我们统治家族在治国之道与艺术之美两方面的双重造诣。与此同时，在城中另一处，我们正于旧宫中秘密设立一间工坊，炼金术士与工匠们在那里精研出一种软质瓷器，乃欧洲首创，足以与不惜重金自中国运来的珍贵瓷器媲美。这行政与工艺两方面的双重成就，标志着我们赞助事业的巅峰，向基督教世界的每一个宫廷宣告：大公治下的托斯卡纳，既是权力的中心，亦是风雅的渊薮。"
 accademia_cimento: "实验学会"
 accademia_cimento_desc: "我们的大公已创立 #italic 实验学院 #!（Accademia del Cimento），将当世最杰出的科学头脑汇聚一堂，专注于实证探究，其成员恪守箴言 #italic 试而又试 #!（Provando e Riprovando），即反复试验、再三验证，为求知之道树立了新的标准。与此同时，大公国正在重塑托斯卡纳各市镇的治理，以统一的行政程序取代各地特权拼凑而成的旧制，使国家权威得以深入每一座城镇与山谷。这种科学雄心与行政严谨的结合，定义了我们的公国：无论思想还是治理，皆须经受同等严苛的求证标准。"
 tuscan_physiocratic_reforms: "托斯卡纳重农主义改革"
 tuscan_physiocratic_reforms_desc: "我们的统治者按照#italic 重农学派#!的原则治理托斯卡纳，该学派认为土地和农业才是一切财富的真正来源。我们将废除农奴制和行会垄断，致力于将粮食贸易从国家控制中解放出来，并将围绕土地生产力而非商人和贵族的特权来重组税收。这种理性治理的精神也在重塑我们的商业文化，拆除此前限制货物流通的内部壁垒，向行会特许状长期排斥的贸易开放我们的市场。这场对土地和商业的全面改革正在将托斯卡纳转变为开明行政的典范，一场欧洲各地的观察者前来研究和效仿的理性治理实验。"
 #Two Sicilies
 tws_unified_legal_code: "统一法典"
 tws_unified_legal_code_desc: "我国领土曾因法律执行不公而引发动荡。为避免重蹈覆辙，我们应当统一法典并确保法律得到公正执行。唯有如此，才能防止任何抗争演变为失控的乱局。"
 tws_ensure_loyal_families: "贵族家族忠诚"
 tws_ensure_loyal_families_desc: "两西西里的贵族家族在我们这里拥有巨大的权力。通过授予他们在宫廷中显赫却无实权的职位，我们将确保他们的忠诚，并维护对乡间的稳固统治。"
 tws_revitalize_the_lands: "吸引新人口"
 tws_revitalize_the_lands_desc: "前任统治者们过于专注于我国的特定区域。若想维持对两西西里的控制，我们必须在这两个部分进行公平公正的投资。实现这一目标的步骤之一便是吸引人们前往先前被忽视的地区定居。"
 tws_capable_vicars: "有能的总督"
 tws_capable_vicars_desc: "治理墨西拿海峡两岸地区，是我们统一国家过程中面临的一个特殊挑战。由于君主每次只能亲临一方领土，对岸地区必须委任总督代为管辖。为此，我们必须确保选拔出最有才干且值得信赖之人担任这一重要职务，从而防范腐败滋生。"
 tws_oversea_ambitions: "海外雄图"
 tws_oversea_ambitions_desc: "在意大利境内扩张领土绝非易事，既要周旋于错综复杂的联盟网络，又可能触怒教宗本人。因此我们应将目光投向海外—— 在北非和希腊的土地上，潜在的财富正等待着我们。"
 tws_protect_the_coastline: "加强海上巡逻"
 tws_protect_the_coastline_desc: "我国海岸线绵长，极易遭受海盗掳掠人口的侵袭。我们必须组建海军力量进行巡航护卫，最终彻底铲除这股危害民众的邪恶势力。"
 #Italy Formable Advances
 ita_connect_the_interior: "贯通半岛内陆"
 ita_connect_the_interior_desc: "尽管我国的地形为沿海地区的快速运输与通行提供了便利，但意大利半岛的内陆诸多区域仍难以穿行。不仅要连通内陆各地，更要实现海岸与海岸间的衔接，这既能为商业活动提供便利，也能提升军队的机动能力。"
 ita_increased_recruitment: "受觊觎之地"
 ita_increased_recruitment_desc: "$italy_region$是众多外国统治者觊觎的目标。若想守护国家，我们必须扩大陆海军的征兵规模。由于$italy_region$地区既容易遭受来自阿尔卑斯山口的入侵，漫长的海岸线也面临威胁，因此我们必须确保陆海军做好充分准备，抵御任何妄图破坏半岛和平的侵略者。"
 ita_flourishing_urban_centers: "繁荣的众城"
 ita_flourishing_urban_centers_desc: "我国拥有众多高度城市化的区域，这不仅为我们提供了大量制造商品的机会，其广泛的商业网络还能将商品运往海外市场，为我们赚取利润。清除这些产业扩张道路上的阻碍，必将确保它们持续发展壮大。"
 ita_influence_over_the_clergy: "结交显赫的教士"
 ita_influence_over_the_clergy_desc: "$italy_region$地区毗邻$papacy_reform$，历来就有众多有权势、有才能的神职人员为信仰效力的传统。无论未来我们在宗教事务上走向何方，都应与神职人员保持良好关系。"
 ita_enduring_hardship: "战火中的庇护所"
 ita_enduring_hardship_desc: "域外势力对$italy_region$地区的觊觎，曾多次将我们的土地变为强国的战场。在危难时期维系民众生计绝非易事。建立安全的避难所，让民众在战乱中得以庇护，即便在最严峻的战争时期，也能赢得他们的支持。"
 ita_attractive_migration: "迷人的沃土"
 ita_attractive_migration_desc: "我们半岛的土地肥沃、气候温和，吸引了周边国家的民众前来谋生。尽管我国许多城市早已依赖季节性移民的劳动力，但我们仍应加大努力，让这些人永久定居在我们的土地上。"
 #Italy Region
 italy_great_families: "意大利名门望族"
 italy_great_families_desc: "在意大利统一后，我们吸纳了许多显赫的贵族家族。我们应当借助他们的声望来提升我国的声誉，同时让这些能人志士为国效力。"
 italian_condottieri: "佣兵队长之乡"
 italian_condottieri_desc: "我们的土地以杰出的军事头脑闻名，这些将领们率领着荣耀的军队，为自身利益或最高出价者而战。我们必须确保这些人随时准备优先为我们效劳。"
 genoese_crossbowmen: "$a_genoese_crossbowmen$"
 genoese_crossbowmen_desc: "$a_genoese_crossbowmen_desc$"
 genoese_galley: "$n_genoese_galley$"
 genoese_galley_desc: "$n_genoese_galley_desc$"
 italian_galleass: "$n_italian_galleass$"
 italian_galleass_desc: "$n_italian_galleass_desc$"
 #Maghreb Region Advances
 #Algerian Shared
 algerian_hilali_settlement: "希拉勒部落定居"
 algerian_hilali_settlement_desc: "希拉尔部落与苏莱姆部落的阿拉伯氏族历经数代，由埃及向西推进，定居于马格里布中部的桑哈贾人与赞纳塔柏柏尔人之中，将其方言与部族世系强加于被同化的人口之上。我们的谢赫们采纳了希拉尔式的宗亲结构，我们的谷地依照放牧与村落的协议划分，而古老的柏柏尔语言则退居为底层语言，仅存于放牧歌谣与地名之中。阿拉伯与柏柏尔文化的这种交融，赋予了马格里布中部的台勒地区一种部族与世系秩序，使我们的文化有别于更偏内陆的赞纳提人与卡比利亚高地的身份认同。"
 algerian_tell_wheatlands: "泰勒麦田"
 algerian_tell_wheatlands_desc: "米提贾平原、谢利夫河谷、苏马姆地区，以及君士坦丁以南的丘陵地带，这些台勒地区的平原出产的小麦养活了我们的沿海城市，并通过国家特许的出口供养中央国库。费拉欣在世袭的地权制度下耕种灌溉的低地。收获季节结束时，合作打谷场汇集谷物，国家特许的粮仓则弥补雨养台勒地区偶尔歉收的年景。小麦出口充实我们城市的府库，这是那些更偏游牧的马格里布地区所无法企及的。"
 algerian_carpet_weaving: "地毯编织"
 algerian_carpet_weaving_desc: "我们的柏柏尔与阿拉伯织工——从卡拉阿贝尼拉希德与姆扎布河谷贝尼米扎布的地毯匠人，到阿尔及尔与君士坦丁的城市行会——织造出几何纹样的羊毛地毯，地中海与跨撒哈拉市场特意订购这些独具马格里布特色的产品。台勒地区的羊群提供羊毛供我们的纺工加工，而我们的染工将靛蓝、茜草与指甲花调配成界定本地审美的浓烈红与蓝。打结织工随后依照师徒代代相传的图样施工。我们的地毯因图案丰富、色泽持久而在整个地中海地区备受珍视，城市行会也借此出口贸易而日渐富裕。"
 algerian_makhzen_tribes: "马赫赞部落"
 algerian_makhzen_tribes_desc: "我们的国家盟友部落，即源出希拉尔部落的贝都因联盟，他们历来依附于任何能够确保其牧场权与粮食供应的阿尔及利亚政权，为我们的中央军队提供轻骑兵，并构建起任何纯粹的城市行政体系都无法复制的部族间联络网络。各位至高谢赫享有正式的宫廷头衔，每年的津贴将部族分队与国家绑定在一起。与显赫部族家族联姻则确保了遍及台勒地区的征募范围。这套马赫赞体系为我们的军队充实了骑兵，并将边疆部族与我们紧密相连，这是更为中央集权的马格里布对手所无法做到的。"
 algerian_qadiriyya_expansion: "卡迪里耶教团扩张"
 algerian_qadiriyya_expansion_desc: "#italic卡迪里耶#!教团，乃我们两大苏非兄弟会中历史更悠久者，其传承经巴格达一脉可追溯至阿卜杜勒·卡迪尔·吉拉尼，稳固地掌控着台勒地区与草原边疆的乡村宗教与司法权威。我们的扎维耶在偏远村落的清真寺中培养古兰经学者，我们的谢赫调解那些仅凭城市卡迪之法律权威难以平息的部族间纠纷，我们的道堂则提供了将边疆部族与其庇护兄弟会捆绑在一起的效忠誓约网络。这一乡村根基使该兄弟会得以在教义与律法事务上行使调解之权，而纯粹的城市法庭却力所不及。"
 algerian_tijaniyya_birth: "提加尼教团诞生"
 algerian_tijaniyya_birth_desc: "#italic提贾尼耶#!教团由艾哈迈德·提贾尼创立于阿尔及利亚中部草原的艾因马迪，发展为一个独具阿尔及利亚本土色彩的苏非教团，其教义以“光之#italic传承链#!”（silsila）为独特核心，并在马格里布各地迅速建立起分支道堂网络。我们的创立者在阿尔及利亚沙漠中获得了启示性的神视，我们最早的姊妹道堂随着教团西传而在非斯与特莱姆森开设，我们的学者们编纂教义文集，确立了本兄弟会独具特色的修行方式。有了提贾尼耶教团，我们的文化得以自豪地拥有一个诞生于本土的苏非教团，这是同时代其他马格里布文化都无法声称的殊荣。"
 #Algerian Unique
 alg_kasbah_citadel: "城堡要塞"
 alg_kasbah_citadel_desc: "我们的要塞城区——阿尔及尔的 #italic qasba #! ——高踞港口上方的山坡，蜂巢般密布着狭窄的小巷与紧密相连的房舍，成为历代阿尔及利亚政权施政的防御要地。我们的驻防部队足以抵御来自陆地或海上的任何攻击，我们的蓄水池储备了足以支撑长期围城的水粮，而我们的守门人即便下方港口落入敌手，仍能牢牢把控通往上城的通道。凭借这座卡斯巴，我们的国家得以从一处敌人难以轻易攻陷的坚固据点施政，这是那些更为开放的马格里布沿海城市所不及的。"
 alg_thaalibid_descent: "萨阿利比世系"
 alg_thaalibid_descent_desc: "我们的王朝——塔阿利比家族——世系经西迪·阿卜杜勒·拉赫曼·塔阿利比及其祖先，可追溯至摩洛哥的伊德里斯二世，并进而上溯至先知之孙哈桑，由此确立了一条 #italic 谢里夫 #! 血统，在马格里布中部无任何柏柏尔王朝能以先知血脉与世系权威与之匹敌。我们的宫廷谱系学者在每次继位时核实这一血统，我们在每一场 #italic 效忠礼 #! 仪式上诵念世系，将宗教阶层与统治家族紧密相连，而我们的贵族与乌理玛围绕谢里夫血统所达成的共识，历经每一次内部继承之争而屹立不倒。原本 $ALG$ 一脉的谢里夫血统赋予其植根于世系事实的神圣正统性，而一个仅以国家形态统治阿尔及尔的后继者，永远无法宣称拥有这种正统性。"
 zab_sidi_okba_shrine: "西迪奥克巴圣陵"
 zab_sidi_okba_shrine_desc: "#italic 欧克巴·伊本·纳菲尔 #!（凯鲁万的缔造者，率领最早的阿拉伯军队进入马格里布，葬于我们南方的西迪欧克巴村）之墓，乃是一处宗教权威先于马格里布历代王朝而存在的神圣朝圣之地。我们的守陵人世代看护陵墓，每年的朝圣吸引着来自整个伊斯兰西方世界的扎维耶学者与名流，我们的乌理玛在法律意见中援引这位缔造者的权威，其约束力远远超出我们实际的政治版图。这座开山圣陵赋予我们的国家一种神圣的正统性宣称，古老而与那位先知般的征服者本人紧密相连。"
 alg_algiers_emporium: "阿尔及尔商埠"
 alg_algiers_emporium_desc: "阿尔及尔崛起为马格里布中部沿海的核心商埠。比萨、热那亚、阿拉贡与普罗旺斯的商人在我们的港口常驻经纪人，源自基督教贸易的关税收入足以与内陆的贡赋收入相媲美。在港口前的船坞里，我们的造船匠既建造沿海商船，也建造早期的战桨船，供我们的船长们统领。我们的商会居间调度在台勒腹地与地中海市场之间流通的羊毛、蜡、皮革、珊瑚与奴隶，而我们的领事与条约体系则为来访的外国经纪人提供正式居留权与司法保护。正是从这商业崛起之中，产生了日后海盗国家赖以立足的港口税收与水手。"
 alg_thaalibid_emirate: "萨阿利比埃米尔国"
 alg_thaalibid_emirate_desc: "统治阿尔及尔的塔阿利比酋长国，在塔阿利比家族的宗教与政治权威之下宣告成立，权力行使遍及从谢尔谢勒到德利斯的马格里布中部沿海地带，与阿拉贡、热那亚及哈夫斯邻邦保持着持续的外交与商贸关系，这种关系形式上为日后的摄政国所继承，尽管王朝传承上并不相连。我们的宫廷文书依正式#italic降服协定#!与基督教强权互换密封文书，我们的港口依协议居留权接纳外国经纪人。我们钱币上的谢里夫头衔，使我们的统治有别于扎亚尼德的特莱姆森与哈夫斯的突尼斯。作为摄政之前的酋长国，原本$ALG$一脉持有以真正国家身份统治的持久权利主张，而任何后继政权都无法以同样的王朝名义恢复这一主张。"
 zab_zibane_palmery: "济班棕榈园"
 zab_zibane_palmery_desc: "我们的绿洲带，#italic Zībān #! 棕榈园，从比斯克拉和托尔加延伸，经西迪奥克巴和布萨达，直至乌莱德杰拉勒，所产椰枣以个大、味甜、耐储藏而闻名，专供马格里布和跨撒哈拉市场定向采购。我们的果园主世袭承租各自的棕榈地块，灌溉行会依照古老的分水表分配井水，商队首领则按产地林园和收成年份为每批货物定价。齐班棕榈之乡供应着一种高档椰枣贸易，马格里布任何更广大的果业产区都无法将其从精英市场中取代。"
 alg_corsair_emergence: "海盗兴起"
 alg_corsair_emergence_desc: "科尔萨柯（海盗）传统在阿尔及尔扎下根基。来自地中海各地的船长在国家特许下定居我们的港口。我们的造船匠专精于公海劫掠战所需的快速桨帆船与小型桨帆船船型，船长行会则将战利品分配规则制度化，使私人劫掠转变为国家组织的产业。我们改宗的基督徒、希腊人和意大利裔船长与本土船长并肩效力；我们的市场转销缴获的货物与赎回的俘虏；王室则从每次成功的战利品中抽成。随着科尔萨柯的兴起，阿尔及尔建立起自己的海上战争经济，而那些更依赖农业的马格里布对手却毫无相似之物。"
 alg_thaalibid_resistance: "萨阿利比抵抗"
 alg_thaalibid_resistance_desc: "在中世纪晚期，我们的埃米尔国抵御着压向阿尔及尔的多重外部压力：西班牙的沿海袭扰与希斯内罗斯枢机主教的远征、打着任何宗教团结幌子寻找据点的外国科尔萨柯船长，以及不时试图将我们纳入其朝贡网络的哈夫斯—扎耶尼德邻邦。我们维系着经验丰富的雇佣军和科尔萨柯部队，我们的国库已学会承担其供养之费；我们围攻沿岸每一处外国据点，其中以西班牙占据的 #italic 佩尼翁 #! 堡垒为首；我们的外交官谈判达成一次次临时休战，使我们的自治国得以在接连而来的浪潮中保全。正是从这一尚武传统中，$ALG$ 一脉传承下海外征战的遗产，而后来的摄政政权，颇为讽刺地，竟将其承袭并转而对抗同样的列强。"
 zab_saharan_terminus: "撒哈拉终点"
 zab_saharan_terminus_desc: "我们的绿洲位于西撒哈拉商队通道的北端终点。来自图瓦特、图古尔特和撒哈拉腹地的商队汇聚于比斯克拉，而后或北上君士坦丁与突尼斯，或东入哈夫斯领地；我们的商行则为南行商队补给谷物、布匹、盐与泰勒地区的陶器。我们的商队客栈让撒哈拉以南、柏柏尔和马格里布商人同堂落脚；我们的海关官员以温和税率对过境货物征税，使这条通道保持有利可图；我们的外交信函则将参与商路的各部落纳入我们的议事会仲裁之下。正因地处沙漠大道的尽头，我们的绿洲才成为一座商贾与使节云集的城市，这是任何纯粹的农业绿洲所无法企及的。"
 alg_corsair_state_economy: "海盗国家经济"
 alg_corsair_state_economy_desc: "科尔萨柯国家经济发展至成熟形态。王室向每位获准夺取战利品的船长颁发许可，并从每次成功的劫掠中抽取固定份额。我们的船厂按国家规定的标准桨帆船、小型桨帆船与三桅帆船船型批量建造，船长们以战利品分成条件向国家租用。我们的招募代理以国家资助的预支款，吸引外国船长与船员前来投奔我们的港口，为下一轮劫掠周期效力；我们的海军行政署追踪地中海各强国的交战状态，以指导劫掠行动；我们的中央国库同样依赖战利品收入周期，不亚于依赖关税与朝贡的流入。这种国家组织的科尔萨柯经济，比地中海那些较为传统的商贸国家更为稳定地以战争所得充实我们的国库。"
 alg_native_restoration: "本土复兴"
 alg_native_restoration_desc: "我们的王朝，在外国军官摄政时期及随之而来的动荡之后复位登基，重申了原塔阿利比德一脉灭绝之前所承载的本土阿尔及利亚主权。我们的宫廷重建了摄政政府辖下文书机构曾任其荒废的外交网络，我们的使节在恢复的谢里夫合法性之下，重新与地中海及跨撒哈拉各强国往来。学者史家撰写编年史，论证此次复位乃一脉相承、从未断绝的合法统绪。此次复位重振了 $ALG$ 原有一脉的外交影响力，这是仅凭国家权力立足的继任者所无法企及的权威。"
 zab_foggara_irrigation: "坎儿井灌溉"
 zab_foggara_irrigation_desc: "#italic福加拉#!地下渠系统——即挖于沙漠地下、将高地地下水引至绿洲园圃的坎儿井——在我们绿洲议事会的统筹下得以延伸和修复，使新的可耕地从旧有的地表灌溉范围之外被开发出来。我们的福加拉挖掘工行会通过世代传承的学徒制传授渠道开凿技艺，各定居村落为清淤轮班提供徭役劳力，我们的绿洲议事厅则仲裁新渠道不可避免引发的分水纠纷。随着福加拉渠系的扩展，我们的绿洲所获得的可耕地与人口，都超过那些仅依赖地表灌溉的竞争绿洲。"
 alg_consolidated_deylik: "巩固的达耶国"
 alg_consolidated_deylik_desc: "德伊政权终于稳定成型：#italic 德伊 #! 坐镇贾尼纳宫执政，各省 #italic 贝伊 #! 上缴贡赋并提供兵员，近卫军团充当国家军队，科尔萨柯船长行会则在其选举中保有发言权。历经数代政变与官职轮替之后，国库、战利品特许署与外交诸署终于统归巴尔多宫一套单一的官僚体系管理。一个稳固统一的德伊政权，以旧日轮替官员式治理永远无法维系的秩序，治理着我们的国家。"
 alg_thaalibid_sultanate: "萨阿利比苏丹国"
 alg_thaalibid_sultanate_desc: "随着复位的阿尔及利亚政权发展为完全主权国家，我们的王朝被擢升为苏丹国地位，沿用哈夫斯与马林王室所用的同等尊号与礼仪规范，以不曾中断的王朝血统承续，区别于那种由近卫军擢升而成、任何轮替官员政权都无法比拟的德伊政体形式。在相当于巴尔多宫的宫殿中，我们的宫廷举行正式的登基大典，学者们在法理注疏中阐述苏丹国的主权主张。贵族们以共识凝聚，依靠王朝的效忠而非军团推选来维系政体。由此，$ALG$ 原有一脉以切合其谢里夫合法性主张的形式进行统治，这是扎根于近卫军擢升的德伊摄政政权永远无法企及的。"
 zab_biskra_fair: "比斯克拉集市"
 zab_biskra_fair_desc: "一年一度的比斯克拉秋季集市，汇聚了来自图瓦特的撒哈拉商队、来自君士坦丁的萨赫勒商人、来自尼日尔河湾的撒哈拉以南奴隶贩子，以及来自草原边地的贝都因牧民，使我们的绿洲都城在秋季数周内变为一座地区性商业枢纽。各处帐篷棚厅承办交易谈判。海关衙署为每笔交易过秤登记，商人行会则张贴标准秤具与检验砝码，所有参与者皆须遵照使用。比斯克拉集市在固定时节将各商队聚集一处，将其天然的交汇点转化为一处由国家管理并征税的市场。"
 alg_consular_relations: "领事关系"
 alg_consular_relations_desc: "我们的领事关系体系——地中海与大西洋各主要强国均在阿尔及尔设有正式领事馆，与各国定期续约，并辅以礼物与款项等惯例安排——使我们得以灵活应对那些远比任何一次战败所能慑服的更为强大的对手。德伊依照固定礼仪接见各国领事使团。我们的文书机构以多种语言归档往来信函，海关衙署则执行各条约国商人所享有的差别关税。凭借其领事与条约，阿尔及尔得以灵活周旋于近代诸多外部强权之间，而更为孤立的北非诸国则只能各自为战。"
 alg_thaalibid_revival: "萨阿利比复兴"
 alg_thaalibid_revival_desc: "我们的改革派圈子复兴塔阿利比德遗产，将其作为现代阿尔及利亚国家的思想与文化支柱，追怀近卫军摄政之前的数个世纪——那时一支本土谢里夫王朝治理着阿尔及利亚中部，并与地中海世界保持着持续的外交与商贸往来。小册子作者出版塔阿利比德编年史的现代阿拉伯文版本，教师们在教授泛马格里布通行史观的同时，也讲授早期近代阿尔及利亚史。围绕阿尔及尔的西迪·阿卜杜勒拉赫曼圣庙，学者圈子维系着一种未曾中断的宗教与文化权威，这是任何政治灭亡都无法彻底抹去的。塔阿利比德复兴运动赋予 $ALG$ 原有一脉其自身的遗产与思想体系，这是仅凭国家权力推行的现代化运动所缺乏的。"
 zab_rahmaniyya_expansion: "拉赫曼教团扩展"
 zab_rahmaniyya_expansion_desc: "由西迪·穆罕默德·伊本·阿卜杜勒拉赫曼·阿扎哈里创立于卡比利亚中部地区的 #italic 拉赫曼尼亚 #! 教团，向南扩展至奥雷斯山麓一带，历经数代，在我们的绿洲带各处建立起分支道堂。我们的驻地谢赫接受拉赫曼尼亚教团的入教仪式，学者世家接纳来自卡比利亚和阿尔及利亚各中心的学生，我们的商旅朝圣者维持着跨地区的书信往来，将教团散布各地的道堂联结成一张宗教网络。通过拉赫曼尼亚道堂，学生与谢赫得以在我们的绿洲与阿尔及利亚中部高地之间自由往来。"
 #Amazigh Shared
 tamazight: "塔马齐格特语"
 tamazight_desc: "讲阿马齐格语的各社群，东起杰尔巴岛和马特马塔高地，中经高原地带的 #italic 泽纳塔 #! 部落联盟，西至大西洋中加那利群岛的 #italic 门塞亚托斯 #! 诸邦，都保存着远早于该地区阿拉伯人和卡斯蒂利亚人征服之前即已存在的塔马齐格特语族、习惯法与牧羊毛经济。我们的织工将本土与岛屿羊群的长纤羊毛，织成任何城市工业都无法比拟的粗织布料、帐篷幔布与斗篷，而我们的部落议事会与 #italic 门塞伊 #! 们，则维持着一套独立于任何外部法理之外的平行习惯司法体系。对于这些根植柏柏尔传统的社群而言，从撒哈拉绿洲到大西洋诸岛，语言、牲畜与纺织业构成的双重文化与经济遗产，与马格里布及伊比利亚的城市主流并行而独立地延续着。"
 amazigh_group_agraw_council: "阿格拉乌议会"
 amazigh_group_agraw_council_desc: "我们的村社议事会——卡比利亚高地的 #italic agraw #! 、马格里布各地的 #italic jma'a #! 、撒哈拉诸部落联盟的 #italic tagrart #! ，以及加那利门塞亚托斯诸邦的 #italic tagoror #! ——召集各户之长，商议水权、牧群迁移、血亲赔偿的了结事宜，以及对任何试图现身我们门前的外部权威的应对之策。议事会所作决议约束每一个参与其中的氏族，且被记录于与会的 #italic imghassen #! 长老们的口述记忆之中，而非载入任何易遭王室没收的书面名册。这种协商惯例使我们的王室免于承担镇压每一桩琐碎纠纷的代价，并使占人口多数的乡村民众服从于他们亲身参与达成的决议。"
 amazigh_group_igherman: "伊盖尔曼定居点"
 amazigh_group_igherman_desc: "我们的聚落采用 #italic 伊格尔曼 #! 的形式——即因地制宜筑建于我们所居各地的设防石造村落：高阿特拉斯山区夯土而成的 #italic 卡斯巴 #!、南部绿洲层叠而建的 #italic 克萨尔 #!、卡比利亚群峰的塔楼式 #italic 塔达尔特 #!，以及加那利高地带围墙的 #italic 塔戈罗尔 #!。每一处聚落皆由日后将居住其中的各户人家共同兴建，公用的谷仓、瞭望塔与避难蓄水池，都集中于墙垣之内，使敌军无法负担逐个围攻我们全境聚落的代价。这种分散的防御建筑，使我们的腹地入侵成本高得不成比例，令任何帝国式远征在其主力有所建树之前，便已元气大伤。"
 amazigh_group_taqbilt_solidarity: "塔克比尔特团结"
 amazigh_group_taqbilt_solidarity_desc: "#italic塔克比勒特#!（taqbilt），即我们以共同始祖世系为纽带的父系氏族网络，是每一个阿马齐格部落联盟政治生活的基本单位。移居海外的氏族仍保有其在故土联盟中的席位，并以使者、情报及待客网络作为回报，这些纽带将我们的族人从塞内冈比亚直到安纳托利亚紧密相连。这些血缘纽带赋予我们的王室使者与友人在马格里布、萨赫勒及地中海地区以超越任何个别统治者权威的影响力，且历经每一次王朝危机而不衰。"
 amazigh_group_levy_traditions: "部落征召传统"
 amazigh_group_levy_traditions_desc: "每个阿马齐格家庭都有义务，在议事会宣布动员之时，派出一名武装战士加入村中征召，由村中铁匠提供武器，妇女备好干肉与炒麦干粮，长老们则安排行军次序。此等征召不出数日便可集结，远胜领饷常备军所需的数周，且只接纳本族人担任队长，战事一结束便迅速解散，从不产生常备军队那般的长久耗费。传统动员应召更为迅捷，花费也远低于我们那些趋向中央集权的邻邦所维持的正规军团。"
 amazigh_group_tifinagh_revival: "提菲纳格复兴"
 amazigh_group_tifinagh_revival_desc: "我们十九世纪的学者——由西·阿马尔·布利法领导的卡拜尔学者、霍加尔的图阿雷格抄写员，以及姆扎卜的教书先生们，从撒哈拉岩画、图阿雷格面纱护身符与陶器刻痕中，重新发掘出先祖的 #italic 提非纳文 #! ，并将其几何字形加以规范，以供现代印刷之用。我们开办书写学堂，令每个阿马齐格部落联盟的孩童都能学会用这套任何阿拉伯或拉丁字母都无法僭取的文字来书写塔马齐格特方言。这场语言与文化的复兴，将散居于加那利群岛直至撒哈拉腹地的柏柏尔世界凝聚为共同的现代认同，令那些趋于中央集权的欧洲帝国难以将其分裂瓦解。"
 #Amazigh Unique
 ahg_hoggar_massif: "霍加尔山丘"
 ahg_hoggar_massif_desc: "霍加尔火山山地（塔哈特峰、阿塞克雷姆、阿塔科尔）为我们提供了中撒哈拉的庇护之所，我们的至尊部落联盟于此聚首，并从此向周遭的盐碱与沙海之地施展权威。我们的部落牧场环绕山地而立，夏季高地与冬季低地之间的迁徙路线也可预测地穿越其中。矗立峰巅的守卫塔楼可将视野延伸至数百公里外的旷野大漠。这片山地腹心乃 $AHG$ 部落联盟坚不可摧的核心，任何纯粹平原图阿雷格对手都无法触及。"
 ait_beni_abbas_confederation: "巴尼阿巴斯联盟"
 ait_beni_abbas_confederation_desc: "下卡拜利的巴努·阿巴斯氏族联盟将比班山脉的高地村落统合于单一世袭酋长治下，以联姻结盟、仪式誓约，以及马拉布特谢赫们的宗教与司法调解，将集会的 #italic 塔吉马阿特 #! 与其创始家族紧密相连。我们的酋长们自称出自同一位谢里夫始祖之后，并在中央要塞城堡召集联盟长老商议战和大计。这一王朝与宗教的双重根基，使我们的高地联盟在政治上保持延续，不同于我们西面那些结构较松散的卡拜尔联盟。"
 ajj_tassili_rock_art: "塔西里岩画遗产"
 ajj_tassili_rock_art_desc: "塔西利恩阿耶高原上，饰有撒哈拉新石器时代牛群、猎人与祭祀场景的史前岩画，为我们的部落联盟带来了一份早于马格里布任何王朝的深厚文化与考古遗产。我们的乌理玛解读现存的铭刻，口传传统则保留着每一处重要岩画遗址的名称与意义。学者世家将更古老的撒哈拉历史手稿与伊斯兰经典一并珍藏。这些岩画赋予 $AJJ$ 一种扎根于自身土地的文化与历史厚度，是其他任何图阿雷格部落联盟都无法声称拥有的。"
 btl_atlas_pastoralism: "泰勒阿特拉斯畜牧业"
 btl_atlas_pastoralism_desc: "我们的部落联盟因泰勒阿特拉斯山区的季节性游牧而繁荣。绵羊、山羊与骆驼随季节往返于奥雷斯高地夏季牧场与君士坦丁平原冬季低地之间，靠着纯粹农耕国家无法复制的宗亲经济维系。我们的部落酋长通过在各个成员氏族间协商季节性放牧权而掌握权威，我们的游牧财富也支撑起一支部落武士阶层，其畜群既是财富，也是随军口粮。游牧生活使部族民众对国家忠心耿耿，也带来一种不依赖雨养收成的繁荣。"
 cnr_tagoror_councils: "塔戈罗尔议会"
 cnr_tagoror_councils_desc: "#italic 塔戈罗尔#!在每一个门塞亚托的圣石围场召集我们岛上的户主、阿奇门塞贵族和每个氏族的长老，商议水权、牲畜迁移以及对任何登陆我们海岸的船只的应对。集会的决定对每个参与的氏族具有约束力，并仅保存在聚集的长者口头记忆中，而非任何易遭外部扣押的书面登记册中。这种商议传统使我们的门塞亚托免除了镇压每一桩琐碎争端的成本，并将农村多数人口绑定到他们参与达成的决策上。"
 dje_ibadi_refuge: "伊巴德避难所"
 dje_ibadi_refuge_desc: "我们的绿洲（托泽尔、奈夫塔、杜兹、哈马，以及肖特周边的较小聚落）乃是马格里布东部 #italic Ibāḍiyya #! 传统最后的庇护所之一，为早期伊斯兰教义之争中幸存下来的哈瓦利吉—伊巴德信众提供栖身之地。我们的教士团在马利克派占多数的周边地区中，依旧奉行独特的伊巴德 #italic fiqh #! ，保有在逊尼派主导地区中少见的宽容与宗教自主。伊巴德派的宽容与稳固的教士团体，赐予我们的绿洲一种坚定不移的宗教生活。"
 fez_qarawiyyin_school: "卡拉维因学院"
 fez_qarawiyyin_school_desc: "#italic卡拉维因大学#!由法蒂玛·菲赫里娅于859年创立，自此从未间断运作，传授逊尼派四大法学派、亚里士多德逻辑学、天文学与医学，吸引来自整个西地中海各个角落的学子。伊本·赫勒敦、迈蒙尼德，以及历代马林王朝苏丹的大臣们，皆是我们学堂所培育出的杰出校友。这股绵延不绝的学术传统，使我们宫廷的学问日益精进，造就出一个识字阶层，是任何更年轻的马格里布学府都难以企及的。"
 gbs_coastal_oasis: "沿海绿洲"
 gbs_coastal_oasis_desc: "我们这片海滨与绿洲交融的独特地貌——棕榈林生长于加贝斯湾地中海海岸可见之处——支撑起椰枣生产、柑橘果园、海娜花园与海洋渔业在同一农耕单元中的罕见结合。我们的农民秋日采摘椰枣，春日出海捕捞金枪鱼，并在撒哈拉与地中海两大贸易圈间往来交易，却始终无需离开我们绿洲的腹地。海洋与绿洲交汇之处，令我们的国家享有比纯内陆绿洲更丰厚的收成与更稳固的繁荣。"
 iwl_sahel_pastoral_economy: "萨赫勒牧业经济"
 iwl_sahel_pastoral_economy_desc: "我们的部落联盟占据着萨赫勒—图阿雷格地带，即中撒哈拉沙丘与尼日尔河谷湿地之间的季节性草原，在此我们的游牧经济将牛、羊与周边小型绿洲中的椰枣林结合在一起。我们的迁徙路线按年度周期随雨水南北往返。与周边定居民族订立的惯例协议划定了我们部落联盟的牧场界限，与尼日尔河谷农耕社群进行的季节性谷物贸易则补充了我们的粮食供应。将萨赫勒与游牧生活融为一体，赋予 $IWL$ 一种兼具牲畜与谷物的经济基础，有别于纯撒哈拉或纯萨赫勒定居经济。"
 kah_adrar_ifoghas: "伊福加斯高原避难所"
 kah_adrar_ifoghas_desc: "伊福加斯阿德拉尔山地，这座自马里—阿尔及利亚交界的撒哈拉拔地而起的花岗岩山地，为我们的部落联盟提供了一处由洞穴、狭窄隘口与高地牧场构成的天然堡垒，任何入侵者的正规军队若想将其扫荡，都必将耗费数月光阴、付出重大代价。常驻的圣陵守护者维系着散布山中的苏菲马拉布特道堂，我们的洞穴既在入侵之时庇护难民牧群，也在和平时期充作古兰经学堂。至尊统治者正是从这处可守的腹地，赢得整个部落联盟的忠诚。阿德拉尔既是我们的堡垒，也是我们的庇护所，一处联盟永远可以退守、祈祷并休养生息的地方。"
 kay_air_massif: "阿伊尔高原"
 kay_air_massif_desc: "艾尔火山山地，这片自中撒哈拉拔地而起、位于霍加尔以南、尼日尔河湾以北的花岗岩群峰，为我们的部落联盟提供了高地牧场与水源充足的河谷腹地，在周边氏族向南迁徙之际，支撑着我们的定居人口。我们的至尊统治者正是从这处据点赢得整个部落联盟的忠诚。村落聚居于高地河谷地带，而外围的游营氏族则依循惯例历法在山地牧场间循环往返。这处山地庇护所赋予 $KAY$ 一处坚固可守的武士腹地与稳固不移的驻防，这是开阔的沙漠领地永远无法提供给那些更为游牧的图阿雷格部落联盟的。"
 kgs_agropastoral_economy: "农牧经济"
 kgs_agropastoral_economy_desc: "我们的部落联盟占据着图阿雷格人领地最南端，即撒哈拉—图阿雷格游牧生活与雨养豪萨农耕平原交汇的边疆地带，奉行一种独特的农牧混合经济，将小米种植、养牛与同邻近豪萨社群的季节性劳力交换结合在一起。我们的牧民每年有部分时间与农民共同定居，图阿雷格与豪萨之间的联姻结盟也时常跨越族群界限。经济风险由游牧与农耕两大部门共同分担。将农耕与畜牧融为一体，赋予 $KGS$ 一种在图阿雷格人中独树一帜的经济基础，有别于中撒哈拉那些纯游牧或纯牧业的部落联盟。"
 kuk_djurjura_strongholds: "朱尔朱拉山要塞"
 kuk_djurjura_strongholds_desc: "朱尔朱拉山脉的高地堡垒群——库库中央要塞村、贝尼叶尼兵匠区，以及横贯大卡拜利山脊的一连串要塞工事——将我们的王国牢牢锚定在任何平原军队都难以有效抵达的地形之上。我们的驻防工程师通过世袭的劳役义务，维护着城墙、蓄水池与火药库，将每个村落都与中枢王座紧紧相连。这些密布的山地堡垒使我们的国家能够承受围攻，并不断壮大驻军，这是纯粹的低地王国在我们这般的海拔之上所无法做到的。"
 mrk_almoravid_ribat_tradition: "穆拉比特修行所传统"
 mrk_almoravid_ribat_tradition_desc: "我们的王室继承了#italic穆拉比特派#!的戒律——优素福·伊本·塔什芬麾下的武僧，其设防的#italic里巴特#!社群于十一世纪创建了$MRK$，既作为圣战的根据地，也作为苦修虔信之所。穆拉比特派的乌理玛在我们的大清真寺与经学院中依旧保有一席之地，这是更古老王朝所难以比拟的，令我们的苏丹拥有创立者正统继承人的道义地位，而非仅仅一位世俗统治者。这份承袭而来的宗教与军事身份，借由一段任何对手马格里布都城都无法声称拥有的共同创始叙事，将我们的教士团与武士贵族紧紧系于王座之上。"
 mzb_pentapolis_foundation: "姆扎卜五城"
 mzb_pentapolis_foundation_desc: "姆扎卜河谷五座设防的伊巴德派城市（盖尔达耶、贝尼伊斯甘、布努拉、梅利卡和埃尔阿图夫）矗立于瓦迪姆扎卜之上，为909年塔哈特鲁斯塔米德王国覆灭后幸存的伊巴德派教众提供庇护。每座城市皆建成设防的 #italic 克萨尔 #! ，其清真寺塔楼兼具宣礼塔与瞭望塔之用，由创建家族共同议决治理，并通过联姻与共同的 #italic 哈勒卡·阿扎巴 #! 宗教议事会与姊妹城邦相维系。这五城联邦为我们的伊巴德派社群留下了城墙与塔楼的城市遗产，这是撒哈拉其他任何聚落都无法比肩的。"
 ogl_saharan_terminus: "撒哈拉终点"
 ogl_saharan_terminus_desc: "我们的绿洲位于来自加奥、廷巴克图和尼日尔河大弯的跨撒哈拉商路北端终点。每一位从南方抵达的索宁克、桑海与图阿雷格商人，都须在我们的城门缴纳关税，方可继续北上地中海。我们的商旅客栈（西迪拉赫达尔、西迪布门迪勒，以及中央市场的 #italic 驿馆 #! ）为商队人马提供远征间歇数月的驻留之所，而我们的中间商则安排货物转运至阿尔及尔、突尼斯与的黎波里。立足于这一终点，我们的国家在跨撒哈拉贸易收益中占据主导份额，这是任何海上强权都无法争夺的。"
 qalat_al_mashwar_advance: "$qalat_al_mashwar$"
 qalat_al_mashwar_advance_desc: "位于$TLE$心脏地带的#italic马什瓦尔城堡#!，既是设防的王室居所，也是扎扬王朝宫廷礼仪的所在地，内设#italic迪万#!，向来自西吉尔马萨和瓦尔格拉的撒哈拉商队、来自奥兰的地中海航运，以及往返于非斯与突尼斯之间的陆路通行征税。其三重城墙围合的区域将国家各机构集中一处，包括行政厅堂、铸币厂、梅舒阿尔区集市以及苏丹的亲卫队，尽纳于一座可防御的建筑群内。这座兼具宫殿与国库功能的要塞，赋予扎扬王朝都城远超任何纯地域性马格里布国家的财政实力，以及将国家各机关尽纳同一城墙之内所带来的力量。"
 sos_taroudant_garrison_seat: "塔鲁丹特驻军驻地"
 sos_taroudant_garrison_seat_desc: "#italic塔鲁丹特#!的红色城垣，是苏斯河谷中持续驻军时间最长的设防城圈，将我们的营房、军械库区、兵工厂与骑兵马厩尽纳于一座可防御的建筑群内，自阿尔摩拉维德时代以来，击退了每一个前来围攻的敌手。我们的驻防工程师依靠一支世代承袭、以免税换取职守的熟练石匠劳役队，维护着城墙、棱堡与火药窖。这些集中的防御工事，使我们的王室得以用零散边境驻军所需花费的一小部分，维持整个苏斯地区的防务。"
 tat_date_palmery: "图瓦特椰枣园"
 tat_date_palmery_desc: "图阿特绿洲中数以百万计的椰枣树，依靠在沙漠地下绵延数十公里的 #italic 福加拉 #! 灌溉网络得以滋养，为我们的百姓、商队与出口贸易同时提供养分。我们的种植者精选了享誉盛名的德格莱特努尔与阿格拉斯品种，供应地中海与萨赫勒地区的高端市场。深层绿洲耕作为我们的王室带来可观的果品出口与稳定的繁荣，这是马格里布沿海靠雨水灌溉的农业所永远无法比拟的。"
 tfl_sijilmasa_gold_terminus: "锡吉勒马萨黄金终点"
 tfl_sijilmasa_gold_terminus_desc: "每一支来自萨赫勒的商队，最终都会抵达位于$TFL$心脏地带的#italic西吉尔马萨#!——这座伟大的跨撒哈拉驿站，瓦恩加拉金砂、苏丹可拉果与撒哈拉俘虏，在此与盐板、马格里布纺织品以及伊比利亚地中海的白银易手。我们的商人家族凭借世代传承的特许状，经营着检验铸炉、金砂天平与保税仓库，确保整个绿洲的繁荣。我们历久不衰的商业主导地位，使塔菲拉勒特充满南方商队带来的财富，这是远离沙漠终点的马格里布内陆城市所无法企及的繁荣。"
 tgt_saharan_crossroads: "撒哈拉十字路口"
 tgt_saharan_crossroads_desc: "我们的绿洲位于三条跨撒哈拉商路的交汇处（通往塔菲拉勒特与西吉尔马萨的西路，通往瓦尔格拉与尼日尔河的中路，以及通往加达梅斯与的黎波里的东路），使我们成为所有马格里布国家商队的天然会合点。我们的中央市场每季都吸引来自突尼斯、阿尔及尔、非斯、的黎波里以及深撒哈拉地区的商人，而追随商队而来的流动家庭则在我们日益扩大的城区定居。立足于这一十字路口，我们的国家得以触及整个撒哈拉商路网络，并为城镇带来源源不断的移民，这是任何单一商路绿洲都无法做到的。"
 trg_tin_hinan_legacy: "廷希南的遗产"
 trg_tin_hinan_legacy_desc: "传说中的#italic廷·希南#!，卡尔阿哈加尔人的开基女祖，其王陵至今仍矗立于阿巴莱萨，我们世代守护；她的事迹确立了依循母系传承贵族身份、畜群所有权与礼仪地位的继承传统。我们的阿梅诺卡尔皆自称通过母系氏族传承自廷·希南本人的血脉，继承争端亦依她的神圣权威裁决。这一母系正统将我们的贵族与王权紧密相系，形成一套任何父系传承的马格里布邻邦都无法扰乱或复制的继承体系。"
 ahg_abalessa_seat: "阿巴莱萨王座"
 ahg_abalessa_seat_desc: "阿巴莱萨要塞是先祖女王廷·希南长眠之地，支撑着我们至高宗系的政治与宗教权威。我们的阿梅诺卡尔继位仪式在要塞城墙内举行，我们的乌理玛也会在固定的时节前往陵墓朝圣。历代至高酋长继位的宫廷记录，皆以阿巴莱萨仪式作为正式册立的依据。这一神圣的政治中心长久地支撑着我们联盟的权威，这是组织更为松散的撒哈拉对手所做不到的。"
 ait_kabyle_marabouts: "卡比尔马拉布特权威"
 ait_kabyle_marabouts_desc: "本地的 #italic 马拉布特 #!，即游方的苏菲谢赫及其定居后裔，支撑着我们联盟的宗教与司法生活，他们仲裁部族争端、认证婚姻，并通过共同的 #italic 巴拉卡 #! 将分散的村落与中央酋长权相维系。我们的王室庇护西迪艾哈迈德·贝勒卡西姆学派的会堂以及更古老的卡迪里耶家族，使我们的宗教建制获得纯部落制山地联盟罕能企及的深度。马拉布特权威将我们国家在信仰与律法上的影响力延伸至全境，超越任何纯世俗酋长权所能及之处。"
 ajj_ghat_oasis: "加特绿洲"
 ajj_ghat_oasis_desc: "加特绿洲位于霍加尔山脉东麓、阿卡库斯山附近，是我们商队与移民的主要城镇，供养着椰枣林、绿洲园圃，以及常驻的、从中斡旋撒哈拉商队贸易的商人家族。灌溉的园圃出产着周遭沙漠无法提供的果蔬。我们的商旅客栈接待季节性的跨撒哈拉商旅，关税收入则充实联盟的中央国库。这座绿洲城镇为 $AJJ$ 奠定了纯游牧的图阿雷格对手所欠缺的农业与商业根基。"
 btl_constantine_hinterland: "君士坦丁腹地"
 btl_constantine_hinterland_desc: "我们的联盟占据着君士坦丁大要塞城的近郊腹地，向该城的粮食、羊毛、皮革与牲畜市场供货，同时我们的首领们也与无论哪一方掌控该城的势力，谈判商队保护与免税通行条约。我们的商号受惠于君士坦丁市场持续不断的贸易，我们的使节也借此积累了与阿尔及利亚和突尼斯中央宫廷谈判的经验。立足于一座大城市的腹地，使我们的国家获得了商人的触角与远离城市的纯山地联盟所未知的外交经验。"
 cnr_silbo_signal_tongue: "希尔博口哨信号"
 cnr_silbo_signal_tongue_desc: "我们的牧人与守望者精通口哨#italic西尔博#!语，这是将我们关契语转化为纯音调的一种方式，能够穿越$CNR$境内声音无法企及的深邃峡谷。山脊上的哨兵只需片刻，便能将陌生人来袭、海平线上船队现身，或集会号令的消息传递至下一道山脊，而无需信使跋涉数小时。我们的口哨信号能及早警示朝廷，并传递任何外国情报机构都无法破译或截获的秘密讯息。"
 dje_djerid_marabouts: "杰里德马拉布特"
 dje_djerid_marabouts_desc: "杰里德当地的苏菲马拉布特，将伊巴德派的宗教正统与绿洲水权、椰枣园继承以及商队保护仪轨方面的实际智慧融为一体，通过其常设的会堂与季节性的朝圣节庆，支撑着我们绿洲城市的宗教与司法生活。我们的王室资助历代开基谢赫的圣祠，并庇护其在世继承人的讲学圈子。伊巴德派与苏菲传统的融合，赋予我们的教团在南方诸绿洲中远超纯粹外来教派的深度与道德权威。"
 entrepot_connections: "仓库网络"
 entrepot_connections_desc: "我们的道路将 $TLE$ 与地中海畔的霍内因外港、撒哈拉的中转站西吉尔马萨，以及在王室护卫下横穿我们领土的马格里布主干商路相连。我们特许贵族世家维护这些干道沿线的马车道与 #italic 驿馆 #! 站点，以换取免税优惠与沿途的土地授予。即便派系战乱扰乱 $fez$ 或 $tunis$，这套商队护运体系仍能让马格里布中部的贸易持续畅通。"
 fez_brassworkers_guild: "黄铜工匠行会"
 fez_brassworkers_guild_desc: "聚集于塞法林区的非斯黄铜与红铜行会，制作镶嵌精美的油灯、托盘、星盘与锤揲铜盘，在地中海集市上向热那亚、比萨与威尼斯买家卖出高价。师徒相传的训练链将錾刻、锤揲与镶银技艺代代传承于非斯世家之中。受到规范的金属工艺，为我们的王室带来了铜器贸易与一代匠人，这是马格里布内陆的羊毛与皮革产区所无法提供的。"
 gbs_gulf_anchorage: "加贝斯湾锚地"
 gbs_gulf_anchorage_desc: "我们在加贝斯湾的天然良港，有凯尔肯纳群岛作为屏障，水深足以停泊地中海桨帆船，又有绿洲本身供应的淡水，支撑着一支沿海桨帆船队，以及一支人数相当、分别来自绿洲与沿海居民的水手队伍。我们的造船匠既精通东地中海桨帆船建造技艺，也熟谙我们腹地所需的撒哈拉商队骆驼饲养之术。我们在海湾的这处锚地，源源不断地吸纳水手，培育出纯粹内陆绿洲所不具备的航海传统。"
 iwl_niger_valley_rights: "尼日尔河谷权利"
 iwl_niger_valley_rights_desc: "我们的联盟与定居于尼日尔河谷泛滥平原牧场的桑海人、富拉尼人和索宁克人协商，通过我们的大酋长与其酋长之间的外交协议，而非武力，正式确立了牧场的使用权，从而保障了我们的畜群在旱季所依赖的放牧地。我们的使节在尼日尔河河曲的集市城镇中享有常驻席位，我们的迁徙时间也与尼日尔河的涨落周期相协调。每逢双方发生重大的继承更替，大酋长都会重新缔结牧场使用协定。我们沿尼日尔河达成的牧场协议维系着畜群的生存，这是纯粹依赖沙漠资源的图阿雷格联盟永远无法做到的。"
 kah_niger_pasture_rights: "尼日尔牧场权利"
 kah_niger_pasture_rights_desc: "我们的联盟与尼日尔河河曲沿岸的桑海及后桑海定居人口协商季节性的牧场与水源使用权，旱季将畜群南移至被河水淹没的泛滥平原牧场，雨季则北返阿达尔高地。我们的大酋长与尼日尔河河曲各酋长保持正式的使节往来，我们的迁徙安排也被记录于双方的习惯法之中。我们的游牧经济依赖于这一年度节律。进入尼日尔河河曲牧场的权利，使 $KAH$ 的经济与领土影响力超越了纯粹的撒哈拉图阿雷格联盟。"
 kay_agadez_sultanate: "阿加德兹苏丹国"
 kay_agadez_sultanate_desc: "阿加德兹苏丹国由图阿雷格人推举的大酋长创立，并得到周边贵族的批准，将我们的联盟确立为正式的王国，而非部落酋长领地。我们的苏丹在中央清真寺接受册封，继承礼制亦已载入习惯法。我们的宫廷以平等主权国家的身份接待来自桑海、豪萨及马格里布诸国的使节。作为苏丹国， $KAY$ 被承认为真正的国家，这是同时代其他图阿雷格联盟都无法企及的地位。"
 kgs_hausa_synthesis: "图阿雷格-豪萨文化融合"
 kgs_hausa_synthesis_desc: "我们联盟的身份认同，源自图阿雷格人与豪萨人之间长期的文化与语言接触：塔马舍克语与豪萨语并存的双语家庭、融合图阿雷格习惯法与豪萨伊斯兰教法的混合宗教习俗，以及跨越尼日尔-豪萨边界的共同宗亲网络。我们的乌理玛与豪萨马拉布特邻人互相交流学生与典籍。通婚习俗跨越语言界限，图阿雷格人与豪萨人双方的观察者都承认，我们形成了独特的第三种文化。两族融合赋予 $KGS$ 一种贯通两个世界的身份认同，这是纯粹的图阿雷格人或纯粹的豪萨人对手都无法做到的。"
 kuk_belkadi_dynasty: "贝尔卡迪王朝"
 kuk_belkadi_dynasty_desc: "库库的贝勒卡迪家族将分散的卡比利亚诸联盟统合于单一王室血统之下，其合法性来自先知后裔血统的主张、建国仪式上马拉布特的背书，以及每一个成员村落齐聚的 #italic 塔季马阿特 #! 。我们的秘书处记录王室法令与税册，宫廷礼仪兼采马林王朝的行政惯例与卡比利亚习俗，我们的王朝建立起一个中央集权的君主国，这是邻近那些以共识治理的卡比利亚联盟始终未能实现的。王室的建立，赋予我们的国家一个治理有方的宫廷，以及超越纯粹部落酋长领地的宗教与王朝合法性。"
 mrk_atlas_caravan_terminus: "阿特拉斯商队终点"
 mrk_atlas_caravan_terminus_desc: "凡是穿越高阿特拉斯山脉、来自德拉河谷、苏斯或锡吉勒马萨等撒哈拉终点站的商队，都会在$MRK$驻留歇脚。我们城市的#italic阿格马特门#!及南面城墙一带，设有客栈驿站、蓄水池与海关哨所，每一批货物都在此登记纳税。我们的商行以撒哈拉通行的货币向沙漠商人提供信贷，并以在我们城门卸下的货物作为回款，从而用一套账簿将跨撒哈拉经济与地中海经济编织在一起。作为终点站，马拉喀什为国库带来源源不断的过境收入，也使我们的商人市民阶层相较于远离山口的马格里布内陆城市，拥有持久的商业优势。"
 mzb_ibadi_seclusion: "伊巴德隐匿"
 mzb_ibadi_seclusion_desc: "我们的各社群在与逊尼派占多数的邻邦交往时，奉行 #italic 塔基亚 #! （防范性隐讳）之教义，在公开场合表面上奉行逊尼派的常规仪轨，而在五城邦的城墙之内则严守伊巴迪派的正统教义。我们的妇女蒙面、幽居于家中庭院，我们的市场将访客与内部的圣地分隔开来，我们的教法学者在公开场合表面上服从阿尔及尔与突尼斯的马立克派 #italic 教法判例 #! ，私下里却遵循自家的 #italic 瓦赫比教法学派 #! 路线。这种宗教与文化上的隐遁之道，使我们独特的伊巴迪派身份认同，历经数百年逊尼派政治压力的侵蚀而得以保存，而其他所有哈瓦利吉派社群却已荡然无存。"
 ogl_in_salah_route: "因萨拉赫路线"
 ogl_in_salah_route_desc: "我们的商队首领将瓦尔格拉至尼日尔河河曲的路线确立为中撒哈拉的主导贸易路线，取代了经由锡吉勒马萨穿越西撒哈拉的旧路线，成为我们商人首选的通路。我们与图阿雷格诸联盟共同维护因萨拉赫驿站，双方分别提供护卫、水权保障与仓储空间，我们的法学家在每一处驿站都制定了统一的关税与过路费则例。这条秩序井然的路线，凭借其护卫、水井与固定的过路费，使我们的商人能够穿越撒哈拉抵达任何其他绿洲国家都无法企及的远方。"
 sos_jazuli_sufi_movement: "贾祖利苏菲运动"
 sos_jazuli_sufi_movement_desc: "#italic贾祖利教团#!由穆罕默德·本·苏莱曼·贾祖利在我们南方腹地创立（其著作《善行指南》成为中世纪晚期流传抄录最广的马格里布宗教读本），该教团经$SOS$、德拉河谷及苏斯一带的扎维亚传播开来，随后其传教士将其带往马格里布每一个都城。我们的宫廷在阿富加勒的道堂资助贾祖利教团的谢赫，供养其教师，并在每一次登基典礼上依次接受其祝福。这场苏菲派的宗教复兴，借由单一的复兴思潮，将我们的城市教士与乡村马拉布特都紧紧维系于王座之上，也赋予我们的苏丹国一种宗教合法性，这是那些年代更久的既有教团难以抗衡的。"
 tat_maghili_jurisprudence: "马吉利的教法学"
 tat_maghili_jurisprudence_desc: "图瓦特的穆罕默德·马吉利，《齐米人民律例》的作者和桑海阿斯基亚的顾问，将我们的#italic 马立克#!法学输出到西撒哈拉、豪萨城市和更远的萨赫勒王国。他关于齐米地位、税收和统治者-臣民义务的裁决将桑海、卡诺和卡齐纳的法庭绑定于图瓦特的司法权威。这种集中的学术权威将我们的文化影响力扩展到绿洲边界之外，并将南部马格里布—萨赫勒神职人员绑定于我们的谢赫。"
 tfl_oasis_levy_horsemen: "绿洲征召骑兵"
 tfl_oasis_levy_horsemen_desc: "$TFL$的每一座凯萨尔，都要按份额提供季节性的骑马与#italic梅哈里#!骆驼骑兵征募，这是一支撒哈拉流派的轻骑兵，自幼便训练于沙丘间追击劫掠者、伏击商队，并能在任何步兵都无法穿越的地形上甩开追兵。我们的绿洲马厩以花园中的椰枣饲料及深处绿洲的咸水井，饲育深色毛皮的柏柏尔马，培育出在撒哈拉气候下任何地中海血统战马都望尘莫及的耐力良驹。我们的绿洲骑兵传统，组建起一支迅捷机动的部队，其耐力与速度，令那些日益中央集权的北方宫廷所拥有的常备军也难以匹敌。"
 tgt_caravan_levies: "商队义务"
 tgt_caravan_levies_desc: "我们的王室依靠商队税收，供养起一支常备军驻防。对入境货物征收的 #italic 什一天课 #! ，为常驻的绿洲卫戍部队及由周边柏柏尔联盟征募而来的部落骑兵预备队提供了资金。我们的部族男子轮流在城墙及商队驻留的水井处值守，以商队税费的份额代替常规薪饷，我们王室的常备军事建制也因而独立于阿尔及尔或突尼斯中央当局的贡赋要求之外。依靠商队供养，我们的征兵制度使国家得以维持一支常备卫戍部队，而无需耗费正常的农业经济。"
 trg_caravan_protection_levies: "商队保护税"
 trg_caravan_protection_levies_desc: "凡穿越我们撒哈拉领地的商队，都须缴纳图阿雷格人的 #italic teggama#! 保护税，税率由阿门诺卡尔的使者在每一处水井处公布，以换取安全通过深处沙漠劫掠部族领地的保障。我们的护卫分队经由各联盟的常设部族誓约征募而来，税收又沿同一宗亲网络返还，分配给出骑士的各个帐篷。一份公开、公布于众的保护税，为我们的王室带来源源不断的商队收入，也使各部族维系团结，这是任何定居型国家都无法从我们的迁徙路线中榨取到的。"
 ahg_tamanrasset_caravan: "塔曼拉塞特商队终点"
 ahg_tamanrasset_caravan_desc: "位于霍加尔山南麓的塔曼拉塞特绿洲，是马格里布北方与阿伊尔-尼日尔南方之间主要的商队终点站。我们的商行以谷物与布匹补给南行商队，我们的海关官员按固定税率对过境货物征税。霍加尔的采石场支撑着盐与小米的交易，使这条商路持续获利。作为商队终点站，塔曼拉塞特赚取的贸易收入，是那些更为孤立的撒哈拉绿洲仅凭过境商队所无法获得的。"
 ait_andalusi_smiths: "安达卢斯工匠"
 ait_andalusi_smiths_desc: "来自托莱多、格拉纳达与科尔多瓦的安达卢西亚流亡工匠（枪炮匠、铜匠、皮革匠及工程师）在我们的贝尼阿巴斯卡拉找到了庇护所，将失落的伊比利亚半岛的金属加工与火药制造技艺带入我们的山地工坊。我们高地的兵工厂如今所产的火绳枪枪管、铜器及镂刻火器，其品质为其他卡比利亚联盟所望尘莫及。安达卢西亚工艺的涌入，为我们的王室武装起一支携带火器的轻步兵队伍，以及纯粹的游牧邻邦所无法具备的铜艺制造能力。"
 ajj_libyan_caravan_route: "利比亚商队路线"
 ajj_libyan_caravan_route_desc: "连接加特—穆尔祖克—的黎波里的商路，作为撒哈拉以南非洲与奥斯曼—利比亚沿岸之间的东撒哈拉通道，贯穿我们的领土，并在每一处主要驿站向我们缴纳过路费与保护费。我们的商队首领引导过境商旅，我们的护井人则按固定间隔维护沿途水源站。在北端终点，大酋长与的黎波里塔尼亚及费赞当局协商过路费率。这条东部商路为 $AJJ$ 开辟了一条独立的商贸与外交道路，与西部通道（霍加尔—阿伊尔）的贸易体系截然不同。"
 btl_mountain_raiding: "山地劫掠传统"
 btl_mountain_raiding_desc: "我们的轻骑兵（从各氏族的幼子中征募，骑乘着我们游牧经济所饲养的迅捷柏柏尔马）巡逻于我们邦联争议不断的边境，追击敌对的劫掠者，向过路商队征收贡赋，并在各氏族竞相参与的季节性集市竞技中博取声望。我们的骑兵传统通过武士家族内部的世袭学徒制传承战术知识。我们的劫掠传统使国家充满了矫健的骑手，以及能从挫败中迅速恢复的士卒，这是更为定居的马格里布诸国无法通过正规训练复制的。"
 cnr_dragon_tree_groves: "龙血树树林"
 cnr_dragon_tree_groves_desc: "我们岛上的 #italic 龙血树 #! 林——这种古老的龙树，其宝石红色的树脂被地中海药剂师珍视为 #italic 龙血 #! ，用于药品、清漆和祭坛颜料——提供了任何大陆产地都无法比拟的奢侈品出口。中世纪晚期大西洋地区的热那亚货运清单将我们的树脂列为黎凡特与印度之间最可靠的来源，而我们的商人掌控着门塞雅托辖下每座岛屿上的每一片树林。对这种树脂的垄断为王室带来了丰厚的染料贸易，使其在欧洲市场上的地位远超一个纯粹的农业群岛所能企及。"
 dje_tozeur_madrasa: "托泽尔经学院"
 dje_tozeur_madrasa_desc: "我们位于图泽尔的中央经学院（由聚集起来的椰枣园地租家族出资兴办，由易巴德派与马立克派教师平均配置任教）通过一套在两大 #italic 教法学派 #! 与更广阔的撒哈拉学术传统之间居中调和的课程，培养出我们绿洲的书记官、法官与传教士。我们的毕业生在杰里德各地出任 #italic 卡迪 #! ，我们的学生远赴突尼斯与开罗深造，而我们在跨教派学术上的声誉也吸引了来自境外的朝圣求学者。集中的学术培养使我们的国家拥有比纯粹的乡村易巴德派社群更具文化素养的教士阶层，并在南方诸绿洲间拥有更广泛的影响力。"
 fez_old_city_refortified: "旧城加固"
 fez_old_city_refortified_desc: "瓦塔斯王朝的苏丹们重建了旧菲斯的城墙，又增筑了新菲斯的棱堡，经过一代人的精心筑城之功，提早防备萨阿德王朝自南方发起的攻势。我们的驻防工程师维护着 #italic 布·杰卢德门 #!、俯瞰塞布河平原的城垣以及卡斯巴要塞，而把守这些据点的常备部队皆由菲斯城各家族轮番征募而来。将我们的军事力量集中于这些城墙之内，使我们的驻军稳步壮大，并磨练出零散边塞据点永远无法获得的攻城工程技艺。"
 gbs_henna_export: "散沫花与染料出口"
 gbs_henna_export_desc: "我们沿海绿洲的指甲花园圃、靛蓝种植地与藏红花田出产的染料，正是欧洲布料整理商与马格里布制革作坊所需求的最高等级原料，为安达卢西亚风格的瓷砖工艺、地中海羊毛染色以及我们自己的沿海棉织业提供了着色原料。我们的商号掌控着海湾沿岸的保税仓库，我们的经纪人向染料园圃主提供信贷。货运代理商将出口货物经由突尼斯、古莱特以及突尼斯的其他小港转运。我们的染料出口以奢侈贸易的利润充实王室府库，使我们的商人兴旺繁荣。"
 iwl_hausa_trade_interface: "豪萨贸易接口"
 iwl_hausa_trade_interface_desc: "我们的南方边境使我们与豪萨诸城邦（卡诺、卡齐纳、扎里亚）建立起商业往来，我们向其市场供应沙漠盐与商队从北方带来的马格里布布匹，以此换取苏丹黄金、奴隶，以及我们这个游牧邦联无法自产的农业必需品。我们的商队首领专精于豪萨边境商路，我们的首领与豪萨埃米尔们保持着正式的礼节往来。与南方豪萨诸城的贸易关税安排大大补充了我们的游牧收入。向南方开展的贸易，使 $IWL$ 的商业版图远远超越了那些只向北方张望的图阿雷格各邦联。"
 kah_songhai_borderlands: "桑海边疆"
 kah_songhai_borderlands_desc: "桑海帝国的边境（廷巴克图、加奥以及帝国东部地区）使我们的邦联成为主要的撒哈拉边境强权，掌管着将马格里布的盐运往南方以换取苏丹黄金的跨撒哈拉商队往来。我们的首领在我们的谈判驿站接见桑海使节。与尼日尔河曲地区当局的商队关税安排在每次继位时都会重新确立，而图阿雷格与桑海之间的正式合作则保障了商路的安全。立于帝国边缘，使 $KAH$ 获得了任何纯粹的内陆撒哈拉邦联都无法扮演的商业与外交角色。"
 kay_salt_caravan_hub: "盐商队枢纽"
 kay_salt_caravan_hub_desc: "阿加德兹是中撒哈拉通道的主要商队枢纽：来自东方的比尔马盐运商队、来自北方的马格里布布匹与火器商队，以及来自南方的豪萨谷物与布匹商队，三条商路汇聚于此，形成一个统一的市场。此地过境贸易带来的关税收入是我们国家财政的主要支柱。我们的商旅客栈接待季节性到来的商队，我们的商号在三条商路之间充当中介。作为沙漠贸易的枢纽， $KAY$ 所赖以维生的贸易，是任何纯粹的游牧邦联都无法维系的。"
 kgs_madaoua_settlements: "马道阿定居点"
 kgs_madaoua_settlements_desc: "马达瓦地区（尼日尔南部的集市城镇地带，我们的农牧经济在此集中了定居人口）是我们邦联主要城市中心的所在，图阿雷格显贵家族与定居的豪萨商人工匠人口混居其间，形成了一种独特的混合城市文化。集市日将四周萨赫勒地带的游牧卖家汇聚一堂，我们的手工作坊专营皮革、金属制品与纺织生产，这是任何纯粹游牧经济都无法支撑的。我们的显贵家族在马达瓦城与周边游牧营地都保有宅邸。马达瓦及其定居城镇为 $KGS$ 提供了一处常设的行政据点，这是更为纯粹游牧的图阿雷格各邦联所不具备的。"
 kuk_mountain_warfare_doctrine: "山地作战学说"
 kuk_mountain_warfare_doctrine_desc: "我们的高地作战原则，经由历代卡拜尔武士在陡峭的朱尔朱拉山坡、茂密的橡树林以及王国中部崎岖的山脊隘口间作战而不断磨练完善，训练每一支村社民兵掌握伏击与撤退的战术，在平原步兵无法通行的地形中实施隐秘行动，并运用山脊间的信号让分散的部队无需直接指挥便能相互协同。我们的军官通过武士家族内部的世袭学徒制传承这套作战原则。每一支村社民兵都熟知自己脚下的山脊，任何胆敢攀爬而上的侵略者，都要为此付出代价。"
 mrk_almoravid_dinar_mint: "穆拉比特第纳尔铸币"
 mrk_almoravid_dinar_mint_desc: "我们位于$MRK$核心地带的伟大#italic造币局#!延续着阿尔摩拉维德王朝铸造著名穆拉比特第纳尔的传统——这是一种成色极高的金币，其原料来自经跨撒哈拉商队运抵我城门的万加拉金矿石，并在我们自己的化验铸炉中精炼而成。马拉喀什第纳尔的声誉远播马格里布之外，传至热那亚、比萨以及伊比利亚诸市场，在那里它可按面值流通，而成色较差的货币则需在每一张计账桌上被称重折价。这种货币信誉使我们的税吏得以在全境按面值征收，也使我们的商人得以用一种任何竞争对手的造币厂都无法匹敌的货币来维持账目。"
 mzb_ibadi_codification: "伊巴德法典编纂"
 mzb_ibadi_codification_desc: "我们在贝尼伊斯根与加尔达亚的学者编纂了伟大的易巴德—瓦赫比派教法典籍，即谢赫阿卜杜勒·阿齐兹·塔米尼所著的 #italic 《尼罗书》 #! ，以及阿特法亚什与巴布的法学注疏，将数百年的 #italic 易巴德教法学 #! 整理编纂为成文的参考典籍。我们将每座五城之一的优秀青年学子送往其余四城，向资深的 #italic 阿扎巴 #! 议事会求学，而我们培养出的学者毕业后，在从阿曼到桑给巴尔的整个易巴德世界中担任法官、书记与传教士。法典的编纂赋予我们的宗教体制一种在我们教派内部的深度与一致性，这是任何逊尼派马格里布经学院传统都无法提供的。"
 ogl_camel_caravan_corps: "骆驼商队连"
 ogl_camel_caravan_corps_desc: "我们的商队护卫辅助军团——由瓦尔格拉部族及沙漠边缘柏柏尔部落征募而成的 #italic 梅哈里斯特 #! 骆驼骑兵连队——在我们绿洲的南方要道巡逻，护送进港商队穿越塔西利与塔德迈特高原，那里正是图阿雷格劫掠者最为活跃之地。他们以契约形式效命于我们的王室，薪饷来自商队关税收入而非中央国库，而我们的军官在邦国间作战时，将他们作为辅助部队编入正规的绿洲驻军。骆驼军团是一支机动灵活的撒哈拉打击力量，能够驰骋于定居骑兵会陷入困境的漫长沙漠地带。"
 sos_draa_warrior_emergence: "德拉战士崛起"
 sos_draa_warrior_emergence_desc: "德拉河谷与塔格马达尔特的各氏族（这些长期定居的谢里夫家族，其武士世代与沿海外来入侵者交战不休）在$SOS$的旗帜下凝聚成一支南方军事联盟，从整个前撒哈拉盆地招募兵员。我们在塔格马达尔特、塔鲁丹特与马萨的集结地里，汇聚了山地步兵、绿洲骑兵，以及按照从沿海堡垒缴获的新技术训练出的火枪手，这一切皆由南方马拉布特的#italic巴拉卡#!之下所宣誓的誓言所维系。这种武士力量的崛起，使我们在每次战役后都能以更古老、更根深蒂固的马格里布都城所无法匹敌的速度与军事纪律重建兵源。"
 tat_caravan_escort_corps: "商队护送连"
 tat_caravan_escort_corps_desc: "图瓦特护卫连队装备精良，骑乘绿洲所产的骆驼与撒哈拉马匹，为每一支途经我们领土、往返于西吉尔马萨与尼日尔河曲之间的大型商队提供雇佣护卫服务。我们的骑手熟知两千公里沙漠间每一处水井、每一条可靠的觅草小径，以及每一处劫掠者可能设伏的地点。我们的轻骑兵能够迅速护送商队，也能迅速增援我们的战事，因为没有哪个内陆马格里布强权拥有我们这般对沙漠的了解。"
 tfl_caravan_protection_tariffs: "商队保护关税"
 tfl_caravan_protection_tariffs_desc: "$TFL$的各卡伊德按照我们在西吉尔马萨、里萨尼以及沙漠关口各海关所公布的税率，对每一批进出绿洲的货物征收一种有规制的#italic商队保护税#!，以此换取在前撒哈拉边境提供的武装护卫。征收所得经由卡伊德家族的保税会计经手，其中固定份额径直上缴中央宫廷，其余部分则留作沙漠护卫的维持费用以及供水驿站的维护开支。这一公布税率的关税制度，稳定了我们以商队关税换取国家保护的交换关系，并将所得款项径直输送至苏丹宫廷，使我们的国库免受地方中间人浪费之苦。"
 tgt_beni_djellab_dynasty: "贝尼杰拉卜苏丹国"
 tgt_beni_djellab_dynasty_desc: "贝尼·杰拉布家族自封为图古尔特苏丹，将苏夫与瓦迪里格绿洲群统一于一条王室血脉之下，其王朝延续之久远超周边任何绿洲联盟。他们兴建图古尔特中心的 #italic qaṣr #! ，既作为礼仪居所又作为行政中心，仿照 #italic makhzen #! 体制组建财政文书机构，并通过联姻与军事征召向周边 #italic ksūr #! 施加权威。这一苏丹国赋予苏夫绿洲地区一种集权化的政治形态，这是周边以协商治理的绿洲从未能实现的。"
 tle_tlemcen_carpets: "特莱姆森地毯"
 tle_tlemcen_carpets_desc: "我们的城市织机集中于 #italic 阿卡巴门 #! 与 #italic 西迪·布·马迪恩门 #! 两区，织出闻名遐迩的 #italic 特莱姆森地毯 #! ，这种密结绒头地毯以几何纹章图案区别于马格里布所有其他织毯传统。定居本城的安达卢西亚织匠大师带来新的植物纹样与靛蓝朱红配色，在奥兰集市上向热那亚、马赛与威尼斯商人卖出高价。我们受管制的地毯产业为王室带来一门奢侈织物贸易，并培育出一个城市工匠阶层，这是内陆部族的羊毛与帐篷制造者远远无法企及的。"
 trg_imuhagh_warrior_caste: "伊穆哈格战士阶层"
 trg_imuhagh_warrior_caste_desc: "#italic伊穆哈格#!贵族战士骑乘最优良的美哈利骆驼，自幼便习练长矛、十字柄的#italic塔库巴#!剑与铁尖标枪，组成我方的突击核心，其战场纪律无一支萨赫勒军队能够匹敌。他们在阿哈加尔水井与艾尔高地的训练营世代相传，淬炼出精湛武艺。正是这一贵族战士传统，孕育出一支轻骑兵突击力量，任何定居国家都需数百年才能建成。"
 ahg_amenokal_paramount: "阿梅诺卡尔至高酋长"
 ahg_amenokal_paramount_desc: "#italic 阿曼诺卡尔#!（最高酋长）凭借伊马沙根贵族议事会、象征权柄的战鼓及其他礼器，以及唯独图阿雷格人独有的礼仪称号，对整个联盟行使个人权威，这是任何马格里布苏丹都无法在其特有形式上比肩的。我们最高酋长的号令约束着各联合部落，我方使节在联盟一切谈判中都携带阿曼诺卡尔的印玺，行政信使则能在数日之内将中央霍加尔的决策传达至边远部族营地。在一位至高酋长的统领下，$AHG$ 方能当机立断，而纯粹以部族形式存在的图阿雷格对手则鲜能如此。"
 ait_independence_from_lowland: "独立于低地"
 ait_independence_from_lowland_desc: "我们的高地地形、马拉布特赋予的合法性，以及我方坚固城寨网络，使我们得以在任何试图将卡比利亚纳入直接统治的中央集权朝廷面前维持政治自治。我们在山中堡垒的庇护下以平等身份与之谈判，方便时纳贡，不便时则拒之，而中央朝廷的势力也因我方地形与马拉布特而受挫。这般独立使我国难以被击垮，也使我们少受平原朝廷的敌意之苦。"
 ajj_ahaggar_diplomacy: "部落联盟间的外交"
 ajj_ahaggar_diplomacy_desc: "我们的联盟与西方更强大的 $AHG$ 之间维持着审慎的外交平衡，通过联姻结盟、协商牧场与水源权利，并化解任何扩张中的霍加尔势力本会诉诸武力解决的联盟间纠纷。我方使节在塔曼拉塞特朝廷中常驻要职，我方最高酋长在某些霍加尔礼仪场合中承认其礼仪上的优先地位，同时在实质事务上保持我方独立。联姻使两大联盟以血亲纽带相系。正是这种审慎外交，使 $AJJ$ 得以在一个更强大的撒哈拉势力身旁保有独立，这是任何孤立无援的小部族群体都难以做到的。"
 btl_aures_marabouts: "奥雷斯马拉布特权威"
 btl_aures_marabouts_desc: "奥雷斯地区的马拉布特谢赫们传承自早期中世纪圣人，其陵墓乃我方最重要朝圣地的根基，他们将我们分散的村落与游牧部族编织进一张单一的宗教与司法网络，其权威无任何纯粹世俗的酋长体制可以比肩。我方王室资助道堂圣祠，我方诸酋长从奥雷斯谢赫处领受 #italic ijāza #! 认证，我方宗教体制也因世袭学术传承而更显深厚。根植于奥雷斯的这一精神权威使教士阶层安分守己，并赋予我方政府以平原朝廷难以企及的合法性。"
 cnr_aboriginal_shipwrights: "土著造船匠"
 cnr_aboriginal_shipwrights_desc: "流亡的安达卢西亚木匠与被俘的伊比利亚造船匠向我方沿海村落传授卡拉维尔式船壳技艺，而这正是我方土著社会历来所欠缺的；我方门塞亚托舰队将这些引进的技艺与关切斯人世代相传、对岛屿海岸每一处礁石、洋流与干谷河口了如指掌的知识融为一体。不出一代人的时间，本地水手便驾驭起大西洋群岛史上首支主权海军，首次将力量投射至碎浪线之外。有了这支本土海军，我方朝廷得以跨海通商，并从本族人民中征募水手，这是我们先辈从未有过的能力。"
 dje_hafsid_autonomy: "哈夫斯自治"
 dje_hafsid_autonomy_desc: "我们的绿洲联盟与突尼斯中央朝廷谨慎协商自治地位：名义上承认哈夫斯王朝的宗主权，每年缴纳适量的椰枣贡品，并接受定期视察，同时保留完整的内部治理权、水权司法权与独立的宗教体制。我方外交使节在突尼斯朝廷以平等身份协商事务，我方商号在沿海城市中维持着代理关系。我们的诸绿洲由此避开了平原边疆联盟所承受的高昂直接整合之累。这种协商得来的自治缓和了中央朝廷的敌意，也使我方国库得以保留那些由中央直辖的绿洲必须上缴的收入。"
 fez_morisco_gunsmiths: "莫里斯科枪匠"
 fez_morisco_gunsmiths_desc: "逃离伊比利亚的摩里斯科流亡者将火绳枪制造技艺带入非斯；如今每一支枪管、锁板与枪托，都出自那些曾在托莱多、格拉纳达与科尔多瓦作坊中受训的匠人之手。位于 #italic 纳贾林市场 #! 的新火枪匠区为非斯驻军提供火器，而那些受过伊比利亚泰西奥战术操练的摩里斯科老兵，则在城外的集训场将所学传授给我方新兵。这些工匠与教练的到来，为我方王室带来一支装备火器的轻步兵部队，以及一种与日俱增的军事传统。"
 gbs_date_coastal_industry: "沿海椰枣产业"
 gbs_date_coastal_industry_desc: "我方王室致力发展海湾沿岸的椰枣出口经济，开凿新的自流井，沿海岸平原扩展棕榈林，并铺设连接加贝斯、杰尔巴及沿海小型集市与中心绿洲的石砌道路。每一次扩建，共用工程都会降低整个绿洲腹地开垦土地的成本。在沿海地带，我方的农田与道路延展之广，远非那些被隔绝于海洋之外的内陆绿洲所能企及。"
 iwl_confederation_founding: "联盟建立"
 iwl_confederation_founding_desc: "$IWL$ 联盟经由一系列部族间结盟、正式的继承协议与仪式化的册立典礼，凝聚成一个至高的图阿雷格国家，并崛起为更广阔的尼日尔—萨赫勒地区中最大的图阿雷格联盟。我方最高酋长世系由此正式确立并实现连续继承，联盟全体大会按固定年度举行。附属部族的归附被记录于习惯法中，周边定居人口亦承认其具有约束力。有了这一建国伟业，$IWL$ 跻身撒哈拉大国之列，其声望超越任何规模较小的图阿雷格联合体。"
 kah_post_songhai_resurgence: "后桑海复兴"
 kah_post_songhai_resurgence_desc: "桑海在摩洛哥入侵下崩溃之后，我方联盟趁势填补政治真空，实际掌控廷巴克图的盐金贸易，令我方年轻战士成为尼日尔河曲地区的主要武装力量，并与残存的定居人口建立起纳贡关系。我方最高酋长世系接受尼日尔河曲地区多个帕夏辖地附庸的臣服，而随着图阿雷格人直接掌控取代桑海的中介地位，我方商队收入大幅攀升。对塔加扎—廷巴克图盐路的掌控，大幅提升了我方的经济地位。桑海覆灭之后， $KAH$ 跃居撒哈拉财富之首，超越同时代其他一切图阿雷格联盟。"
 kay_air_zawiya: "艾尔扎维耶网络"
 kay_air_zawiya_desc: "我方艾尔地区的扎维叶——散布于高地谷地间的苏非道堂与马立克学派经学院——奠定了外界任何联盟都无法从外部取代的宗教与司法权威。我方驻地谢赫教导着来自整个撒哈拉—萨赫勒地区的古兰经学者，我方习惯法法庭则将马立克学派的先例与既有的部族仲裁惯例融为一体。朝圣路线引来邻近联盟的信徒前往我方中心圣祠。这些道堂将宗教权威汇聚于艾尔，这是那些更为世俗化的图阿雷格联盟永远无法做到的。"
 kgs_settled_tuareg_identity: "定居-图阿雷格认同"
 kgs_settled_tuareg_identity_desc: "我方联盟日益有别于北方那些游牧的图阿雷格联盟：我们采取永久定居的居住形态，融入周边豪萨人的政治经济体系，并发展出一种独特的图阿雷格定居身份认同，而那些更为游牧的联盟则对此既怀敬意又略带轻视。我方最高酋长的朝廷采取更为定居化的行政形态，我方显贵家族也建起永久的宅邸群落。我们自我认同的叙事明确肯定了农耕与游牧并举的生活方式，而非纯粹游牧的图阿雷格理想。这种定居化的图阿雷格身份认同，使 $KGS$ 相较于开阔沙漠中的图阿雷格联盟，更易成为现代萨赫勒集权势力愿意与之打交道的伙伴。"
 kuk_central_court_autonomy: "中央宫廷自治"
 kuk_central_court_autonomy_desc: "我方王国的地形与马拉布特赋予的合法性，使我们无论面对哪一个掌控阿尔及利亚平原的集权朝廷，都能以主权平等的身份与之谈判：方便时纳贡，不便时拒之，并屡屡击退中央朝廷时常针对卡比利亚发动的惩罚性远征。我方外交使节在库库堡垒的庇护下与外国势力往来通商，我方商人经由平原港口贸易而不失我方内部主权。我方的政治实力足以承受那些足以击垮平原联盟的挫折。这份长久的自治使我们少受本会招致的敌意，并让我们在每一场危机中屹立不倒。"
 mrk_el_badi_palace: "巴迪宫"
 mrk_el_badi_palace_desc: "我们的苏丹在$MRK$下令兴建#italic巴迪宫#!（意为“无与伦比之宫”），其中央庭院铺以意大利大理石，饰以万加拉金箔，镶嵌着跨越三海运来的缟玛瑙，耗费之巨足以耗尽一代人的贡赋。游乐亭阁、大水池与王座殿接待欧洲、奥斯曼与非洲使团，其华美即便基督教世界的皇宫亦难与之匹敌。这座宏伟的礼仪建筑群提升了我们宫廷在地中海沿岸的地位，并带来源源不断的威望，其稳固程度非任何对手都城所能侵蚀。"
 mzb_diaspora_emergence: "姆扎卜流散"
 mzb_diaspora_emergence_desc: "最早的姆扎卜商人家族（巴尤德家族、阿特法亚什家族、巴哈克家族）开始在阿尔及尔、君士坦丁、突尼斯以及阿尔及利亚沿海小城镇建立商行，将儿子们送往北方学习商道，而女儿们则留在五城邦故里。我们的侨民商人为故乡的伊巴德派社群充当金融情报网络，发放伊巴德信贷，在歉收之年筹措粮食，并将利润输回五城邦的宗教基金。我们新兴的侨民网络将我们的金融影响力扩展至整个马格里布，远超任何同等规模的撒哈拉社群所能达到的范围。"
 ogl_southern_market: "南方市场"
 ogl_southern_market_desc: "我们的中央市场成为连接马格里布的跨撒哈拉黄金与奴隶贸易的主要清算中心。班巴拉人、桑海人与豪萨人俘虏在此卖给地中海买家，而来自班布克与布雷的万加拉黄金经鉴定后，以我们的印记转运至阿尔及尔与突尼斯的铸币所。我们的商行向等待季节的商队首领提供信贷，我们的圣祠接受感恩的商队幸存者所献的还愿供品，我们的蓄水池向每一位缴纳统一水税的过往商人开放。我们在贸易中的首要地位，使整个大陆的商业活动充实了国库，这是任何纯粹依靠农业的绿洲经济都无法拥有的缓冲。"
 sos_southern_transsaharan_reach: "南部跨撒哈拉投射"
 sos_southern_transsaharan_reach_desc: "我们的南方征召组织了一支由四千名安达卢斯#italic火枪兵#!组成的庞大跨撒哈拉远征军，统一指挥，将我们的力量投射至沙漠深处直抵尼日尔河湾，并将跨撒哈拉商队经济重新集中到我们苏斯的征兵地。苏丹黄金、盐矿特许权与萨赫勒贡赋如今经由我们火枪手护卫穿越最深的沙漠，源源北流至塔鲁丹特。在撒哈拉投射力量，使我们的王室得以在远离都城之处施政，并掌握一支轻步兵火力，这是任何内陆马格里布国家若无自己的火枪兵军团便无法比拟的。"
 tat_ibadi_maliki_coexistence: "伊巴德-马立克共存"
 tat_ibadi_maliki_coexistence_desc: "马利基派多数与#italic伊巴德派#!少数共享图瓦特绿洲各处的foggāra灌渠水权、商队护卫团与城寨议会，这种宗教共存是任何马格里布城邦都城在自身教法学者裁决下都难以企及的。两派的谢赫共同出席同一联盟议会，共坐同一贸易仲裁法庭，并互相承认彼此的婚姻与继承契约。这种多元共处的格局赋予我们宫廷以广泛的宽容与深厚的宗教合法性，这是单一教派国家难以长久维系的。"
 tfl_mulay_ali_emirate: "穆莱·阿里·谢里夫埃米尔国"
 tfl_mulay_ali_emirate_desc: "穆莱·阿里·谢里夫，长期定居于$TFL$的阿拉维谢里夫家族的长子，接受了集合的卡伊德、马拉布特和绿洲部落首领的#italic 效忠#!，作为自治南部公国的创始埃米尔。我们的维齐尔行政院、改革后的国库和宫廷礼仪同等地借鉴了我们祖先的撒哈拉伊德里斯遗产和北部马格里布的马林秘书室实践，锻造了一个其内部连贯性是我们周围异议地区所无法轻易比拟的埃米尔国。这次塔菲拉勒特在单一谢里夫王座下的巩固为我们的宫廷提供了行政触角、跨教派的合法性和王朝连续性，这是更古老的马格里布苏丹国花费数十年试图复制的。"
 tgt_sultanate_autonomy: "苏丹国自治"
 tgt_sultanate_autonomy_desc: "我们的苏丹与阿尔及利亚奥斯曼摄政当局谨慎协商自治，名义上承认崇高之门的宗主权，缴纳不多的年贡，并接受阿尔及尔派来的近卫军分遣队作为驻防辅军，同时保留完整的内部治理权与独立的国库。我们的宫廷以契约方式雇佣基督教叛教者、安达卢斯流亡者与奥斯曼近卫军，与我们的柏柏尔部落征召军并肩作战，使我们的军队拥有一支任何纯粹部落苏丹国都无法组建的多元军官团。这种协商而来的自治，使我们得以在阿尔及利亚摄政当局政局动荡的数百年间保持独立。"
 tle_maliki_high_council: "马立克高级议会"
 tle_maliki_high_council_desc: "我们城中的 #italic 马利基派 #! 教法学者——伟大的特莱姆森 #italic 卡迪 #! 伊本·马尔祖克的继承者，以及 #italic 雅古比亚 #! 经学院历代教师的传人——齐聚一堂，成为整个西马格里布公认的正统教法权威会议。#italic 特莱姆森马利基议会 #! 的裁决经由 #italic 卡迪里 #! 与 #italic 沙兹里 #! 苏非教团网络传播，在 $fez$ 与 $MRK$ 的宫廷以及跨撒哈拉诸酋长国中被引用援引，甚至连意图独揽教法权威的苏丹们也不得不受其约束。这种高度集中的法律与学术权威，将我们的文化影响力延伸至政治疆界之外，并将西马格里布的教界牢牢系于我们宫廷之下。"
 trg_inadan_silversmith_caste: "伊纳丹银匠阶层"
 trg_inadan_silversmith_caste_desc: "#italic 伊纳丹 #! 是一个世代通婚的铁匠与珠宝匠种姓，在互惠庇护契约下为每一个图阿雷格联盟服务，打造阿加德兹银十字、塔库巴剑刃、镶嵌皮革护身符盒，以及锻铁矛与刀具，这些制品在整个撒哈拉都能卖出高价。我们的工匠大师在种姓内部以世袭学徒制传授技艺，锻铁与银饰工艺代代相传，集中于同一些家族之中。如此集中的金属加工，使我们的作坊盛产银铁制品，这是任何定居的撒哈拉政权都无法复制的。"
 ahg_imashaghen_caste: "伊马沙根贵族"
 ahg_imashaghen_caste_desc: "#italic伊马沙根#!是$AHG$的武士贵族种姓，组成骑乘精锐，主持联盟的外交、战争劫掠与部落间调停事务。我们的贵族骑乘引进的巴布马与单峰驼并行，与邻近贵族世系的联姻巩固了更广阔的撒哈拉—图阿雷格世界。我们的首领从伊马沙根世系中挑选最亲信的谋士。这一武士贵族种姓为我们的外交与骑兵奠定了个人化与贵族化的基础，这与更为平等的图阿雷格联盟形成鲜明对比。"
 ait_rahmaniyya_zawaya: "拉赫曼教团札维亚"
 ait_rahmaniyya_zawaya_desc: "#italic 拉赫曼尼耶教团 #! 由西迪·穆罕默德·本·阿卜杜·拉赫曼创立于朱尔朱拉山麓，并通过遍布卡比利亚的 #italic 扎维亚 #! 网络传播，将我们的宗教机构、乡村长老与季节性征召军紧密联系于同一苏非潮流之下。我们的王室资助教团清真寺，我们的首领从拉赫曼尼耶教团的谢赫处获得 #italic 伊贾扎 #! 许可证，该教团的传教士将我们的宗教与文化影响力传播至整个中马格里布。对苏非网络的扶持，使我们的信仰与声望传播得比更为地方化的马拉布特网络更为深远。"
 ajj_islamic_absorption: "伊斯兰吸收"
 ajj_islamic_absorption_desc: "我们对伊斯兰教义的吸纳——经由加特的乌理玛、来自马格里布的往来马利基教法学者，以及塔西利地区从开罗与非斯带回最新宗教与教法见解的朝圣学者——以我们自己的节奏与方式完成了图阿雷格人的皈依进程。我们绿洲的清真寺以当地塔马舍克方言教授古兰经课程。习惯法实践将马利基派的先例与前伊斯兰时期的图阿雷格传统相融合，我们的学者家族撰写出专门适应游牧与畜牧生活条件的法律注疏。以此方式适应而成的伊斯兰教，赋予 $AJJ$ 一种契合本联盟独特性格的宗教与法律生活。"
 btl_dialect_distinction: "特尔方言声望"
 btl_dialect_distinction_desc: "我们独特的泰勒柏柏尔方言，保留了古老扎纳塔语的特征——这些特征在周边阿拉伯—柏柏尔混合语中已然消失——依靠我们奥雷斯 #italic qādīs #! 的手稿与马拉布特的宗教诗歌，支撑起我们的学术传统。我们识字的教士阶层保存着方言辞典、宗教诗歌手稿与部落历史编年，这些在更为阿拉伯化的邻近联盟中早已失传。这独特的语言使教士阶层保持识文断字，也使我们的国度充满精神与文化上的自信，这是更为中央集权的低地宫廷所欠缺的。"
 cnr_islander_militias: "岛民民兵"
 cnr_islander_militias_desc: "土著的 #italic 巴诺特 #! 与 #italic 马加多 #! 民兵传统，借助火器实现了现代化：每个曼塞亚托都组建自己的 #italic 连队 #! ，由训练有素的岛民在数日内集结，依托洞穴要塞与山脊隘口抵御任何登陆之敌，并在威胁消退后同样迅速地解散。此前的大西洋劫掠者正是在这种防御地理面前屡屡受挫，而我们改良的征召体系使得后继的劫掠者同样难以取胜。我们的征召传统为王室保留了一支庞大的轻步兵后备力量，这是正在走向中央集权的大陆列强常备军也难以轻易耗尽的。"
 dje_oasis_assembly: "绿洲议会治理"
 dje_oasis_assembly_desc: "我们每一座绿洲城市都由各自的 #italic 民众议会 #! （由拥有椰枣林的家族之长、宗教谢赫与商会代表组成）治理，他们在中央清真寺庭院集会，商讨政务，裁断继承与水权纠纷，并为每个礼仪年选举首席法官。这种议会治理不设世袭王室官职，权威源自共识，也源自宗教与学术建制的合法性。这种以共识为基础的治理方式，凭借任何专制宫廷都难以企及的信仰与社群团结，使我们的绿洲联盟能够良好而稳定地自治。"
 fez_marocain_leather: "摩洛哥皮革"
 fez_marocain_leather_desc: "优质的非斯皮革（法国人称之为#italic摩洛哥革#!，英国人称之为#italic摩洛哥皮#!）在整个十七、十八世纪主宰着欧洲各市场的装订皮革、马具与奢华鞋靴贸易。我们的舒瓦拉鞣皮厂与塞法林工坊将山羊皮鞣制得柔软无比，是任何大陆鞣皮厂都无法比拟的，我们的商人将成捆皮革运往马赛、热那亚、里窝那与伦敦。我们精良的皮革是一项宝贵的出口商品，使我们的名声传遍地中海，远比那些规模更大但品质较次的马格里布鞣皮厂所能企及的更远。"
 gbs_chott_salt_works: "肖特盐场"
 gbs_chott_salt_works_desc: "我们位于杰里德盐沼边缘的盐田——这片从加贝斯湾向内陆延伸的广阔季节性盐沼——为地中海与撒哈拉的盐业贸易供应从粗制工业盐到我们沿海蒸发法所产精细食盐的各种等级。我们的盐仓、过秤所与关卡将每一批货物纳入担保记账之中，中央国库从盐业贸易链的两端都能获取收益。盐业贸易为王室金库带来了庞大而稳定的收入。"
 iwl_kel_dinnik_ataram: "凯尔丁尼克与凯尔阿塔拉姆"
 iwl_kel_dinnik_ataram_desc: "我们的联盟正式分裂为以尼日尔为中心的东部凯尔·丁尼克分支，以及以马里为中心的西部凯尔·阿塔拉姆分支，两支首领之间以外交手段协调管理，而非沦为公开冲突。两大分支在对外交涉上保持一致立场，首领世系按固定间隔互派使节。尽管地理上已然分离，共同的文化认同依旧延续，使本可分裂的疆域结为一种联邦形态。通过妥善管理这一分裂局面，$IWL$ 得以在新的疆域上保持自身认同而不致分崩离析，这是任何更弱小的图阿雷格政权都无法做到的。"
 kah_kidal_tessalit: "基达尔-泰萨利特行政中心"
 kah_kidal_tessalit_desc: "基达尔与泰萨利特这两座定居的行政中心，是坐落于阿德拉尔山地门户的小型集市城镇，它们是我们联盟永久的行政所在地，设有首领的秘书厅、习惯法法庭，以及向过境撒哈拉商队征税的海关。显赫家族在两城均设有宅邸。我们的司法会议按固定的季度日程召开，首领则在每年的重要大会期间于基达尔开庭理政。有了固定的政府所在地，$KAH$ 得以施以纯粹游牧的图阿雷格联盟所无法给予的治理稳定性。"
 kay_inter_confederation_diplomacy: "部落联盟间的外交"
 kay_inter_confederation_diplomacy_desc: "我们地处北方的凯尔·阿哈加尔与西南方的伊韦莱梅丹之间，使我们成为图阿雷格各联盟间事务的外交中心：调解牧场与水权纠纷，斡旋各首领间的继承承认，并在阿加德兹中央宫廷召集多联盟会议。我们的使节在霍加尔与伊韦莱梅丹首领宫廷中均常驻职位。我们的首领被公认为中央撒哈拉图阿雷格世界中资历最深的外交调解人，习惯法法庭裁决联盟间的争端，这是任何纯属内部的权威都无法解决的。作为调解者，$KAY$ 立于图阿雷格世界的中心，而那些偏远的势力则无从企及。"
 kgs_sahel_sudan_trade: "萨赫勒-苏丹贸易整合"
 kgs_sahel_sudan_trade_desc: "我们的联盟融入了更广阔的萨赫勒—苏丹贸易网络，这条贯穿塞内加尔、经豪萨兰直至博尔努乃至更远方的东西向商业环线，而我们的地理位置让我们得以将其作为跨撒哈拉商队贸易的南北支线加以利用。海关在两条商路上均征收通行税。我们的商贾世家在豪萨及萨赫勒主要商业城市均设有分号，混合的游牧与农耕经济则为我们双向往来的商队提供了贸易货物。在南北与东西两条商路上同时经营贸易，使 $KGS$ 获得了比那些只顾北方的图阿雷格联盟更丰厚的收入。"
 kuk_rahmaniyya_lodges: "拉赫曼教团道堂"
 kuk_rahmaniyya_lodges_desc: "#italic拉赫曼尼耶教团#!的扎维耶网络发端于朱尔朱拉山麓，历经数代在数十座卡比利亚#italic扎维耶#!间传播开来，将我们的宗教建制、乡村显贵与季节性征兵统合于同一苏菲教脉之下。我们的王室资助教团清真寺，我们的首领从拉赫曼尼耶教长处获得#italic伊贾札#!传承资格，而教团的传教士则将我们的宗教与文化影响传播至整个中马格里布。对这一苏菲网络的扶持复兴了我们的教界，并将我们的信仰传播至更广阔的卡比利亚地区，其覆盖范围远胜那些更为地方化的马拉布特网络。"
 mrk_atlas_tribal_levies: "阿特拉斯部落征召"
 mrk_atlas_tribal_levies_desc: "高阿特拉斯与中阿特拉斯的柏柏尔部族，以世袭的征兵契约效忠于$MRK$王座，为我们的常备军提供训练有素的#italic山地战士#!，即阿尔摩拉维德奠基者最初确立的重装传统所训练出的山地步兵。每个部族联盟都设有自己的集结地、自己的兵器教头，以及自己独立的指挥体系，而各部首领皆将征兵义务视为祖辈传承下来的神圣信托。阿特拉斯的征兵部队为我军提供了一支兼具山地耐力与王朝忠诚的重装步兵，败而能速振。"
 mzb_djemaa_governance: "杰马阿治理"
 mzb_djemaa_governance_desc: "姆扎卜每座城市均由自己的 #italic djemaa #!（由各家族族长代表组成的议事会）治理，议会在城市清真寺庭院中召开，商讨政务、裁决纠纷，并选出掌握最高道德权威的 #italic 'azzāba #! 议事团。吉玛阿体制不设世袭官职或贵族特权；创城家族中的每位成年男性均享有平等投票权，议会的集体裁决甚至约束着最富有的商贾门第。这种近乎共和的协商治理方式，使我们的五城联盟得以稳固，其所依托的宗教与社群团结，是任何专制苏丹国都无法比拟的。"
 ogl_caravan_dominance: "商队主导地位"
 ogl_caravan_dominance_desc: "我们已确立对中撒哈拉贸易的无可匹敌的主导地位。阿尔及尔摄政国的商队、突尼斯哈夫斯王朝的商旅车队、驶往塔菲拉勒特的西行商路，以及深入撒哈拉腹地的图阿雷格商路，皆须在我们的关口缴纳通行税。我们的商队官员登记每一头过境牲畜，我们的书吏记录每笔货物及其价值，我们的王室从每笔交易中抽取份额，这是那些更为分散的绿洲联盟所无法企及的。对商路的主导为我们带来稳定的财源，而其他撒哈拉势力只能试图以劫掠手段加以挑战。"
 sos_bilad_al_siba_warriors: "比拉德西巴战士"
 sos_bilad_al_siba_warriors_desc: "#italic悖逆之地#!的山地部族，这片任何马赫赞政权都无法稳固掌控的叛逆之境，为我们的南方军队提供了纪律严明的重装步兵，他们效忠的对象是本地的卡伊德，而非远在$fez$或$marrakesh$的苏丹。我们辖境深入撒哈拉，这意味着我们的饷官须亲赴部族领地，在集会帐篷中商定季度征兵事宜，带回的部队其内部纪律绝非低地城市凭借法令所能约束。我们这种分散的尚武传统，使王室可随时调用一支深厚的山地重装步兵后备军，其士气恢复之速，胜过任何编制化的常备军。"
 tat_caravan_oligopoly: "商队寡头"
 tat_caravan_oligopoly_desc: "图阿特的商队世家（卡瓦西姆、布·巴克尔、昆提）通过在每个驿站设立担保仓库、在绿洲关口公示固定税率，以及订立竞争者无法复制的独家护运契约，将他们的跨撒哈拉垄断地位正式确立下来。我们在瓦拉塔、廷巴克图、西吉尔马萨以及图古尔特的代理人，皆依同一套账簿清算每批货物。这种紧密掌控的垄断为我们王室带来强大的商业实力与稳定的关税收入，而撒哈拉其他地区那些未成体系的商队经纪城镇则无从享有。"
 tfl_oasis_tax_resilience: "绿洲税收韧性"
 tfl_oasis_tax_resilience_desc: "塔菲拉勒特的灌溉登记册，详细记录着由卡伊德议会所掌管的每一条 #italic 水渠 #! 、每一块椰枣园地、以及每户的水权份额，使我们的财政官员得以以精准而公平的方式核定并征收赋税，这是马赫赞巡回稽查官在他处无法比拟的。塔菲拉勒特的商队世家将账目纳入同一登记体系，以极低廉的费用结清国家契约，内陆任何宫廷都无法从本地商人处商得同等的价格。这种根深蒂固的绿洲财政传统，使我们的国库得享稳定赋税与节俭有度的商贾纪律，这是马赫赞核心诸省难以匹敌的。"
 tgt_sultanate_administration: "苏丹国行政"
 tgt_sultanate_administration_desc: "我们贝尼·杰拉卜苏丹将 #italic 马赫赞 #! 行政体系完善为一套真正的财政制度：登记椰枣园与枣果产量，记录商队交易，由中央国库发放书吏与法官的俸禄，并通过从乡村 #italic 卡迪 #! 直至苏丹本人 #italic 迪万 #! 的分级法庭体系施行司法。我们聘请来自突尼斯、阿尔及尔乃至开罗的训练有素的行政官员充任顾问，我们以典雅阿拉伯文撰写的宫廷公文流传于整个奥斯曼世界，我们的档案保存着苏丹国的每一份财政记录。我们在财政与司法事务上的行政精密程度，是其他任何撒哈拉绿洲国家都望尘莫及的。"
 tle_tijaniyya_origins: "提加尼教团的起源"
 tle_tijaniyya_origins_desc: "#italic 马利基教法学者 #! 艾哈迈德·提贾尼在我境南缘的艾因·马迪绿洲创立了以其名命名的 #italic 提贾尼耶教团 #! ，自称与先知订有独一无二的精神契约，其权威传承凌驾于一切先前的苏菲教团之上。提贾尼耶的传教士由我国向西、向南扩散至整个撒哈拉，远至 $fez$ 、塞内加尔边境乃至苏丹诸酋长国，既传播教义，也传播其特莱姆森祖庭的外交声望。这一新兴苏菲网络，将我们的宗教影响力延伸至大西洋沿岸及跨撒哈拉世界的每一座穆斯林宫廷。"
 trg_mehari_corps: "梅哈里骆驼部队"
 trg_mehari_corps_desc: "#italic 梅哈里 #! 骑兵部队骑乘迅捷的赛驼品种而非驮运慢驼，维系着一支深入沙漠的突击力量，其在艾尔、阿哈加尔与塔西利沙丘间的耐力，任何骑马之军都无法匹敌。我们的骑手在行军途中于每口绿洲井泉补充坐骑，在每个联盟营地以伤员换取精神饱满的伊穆哈格与伊姆加德勇士，归营时士气丝毫不受损失的影响，这是任何定居民族的军队都承受不起的。我们这一精锐骑兵传统败而速振、增援迅捷，这是萨赫勒与马格里布的定居军队所无法做到的。"
 ahg_pastoral_persistence: "畜牧业持久性"
 ahg_pastoral_persistence_desc: "面对一波又一波外部权威（无论是奥斯曼、谢里夫王朝，还是现代中央集权政府）的集权压力，我们的联盟始终得以延续，这得益于我们将自身认同系于霍加尔牧场，而非任何固定的行政城市。我们的迁徙路线会随政治压力而调整。我们的首领世系在政变与妥协中维系着王朝的延续，而游牧经济则始终独立于定居国家的税收体系之外。正是这种游牧联盟的韧性，使 $AHG$ 得以原地长存，即便那些更为定居的马格里布国家已沦于外部统治之下。"
 ait_diaspora_emigration: "卡比尔流散"
 ait_diaspora_emigration_desc: "我们山地联盟狭窄的农业资源，迫使家中幼子纷纷外出谋生。卡比利亚的商人、泥瓦匠、咖啡馆主与季节性雇工，在地中海沿岸的每一座城市建立起自己的网络，通过可信的乡党将汇款寄回家乡，并在婚嫁与继承之时重返故里。我们的侨民家庭将商业触角延伸至远超我们政治疆界之外的地方，而我们的城市移民社群则年复一年地吸引着来自家乡村落的新移民。我们的侨民将贸易远播他方，并以新来者充实我们的城镇，这是纯粹依靠农业的山地联盟永远做不到的。"
 ajj_late_caravan_resilience: "晚期商队韧性"
 ajj_late_caravan_resilience_desc: "随着撒哈拉商队贸易因外国海运竞争和北部沿海铁路扩张而衰落，我们的联盟顺势调整，将定居家族转向绿洲农业、过境权税收，以及幸存商队仍能获利的小规模奢侈品贸易。我们在加特的海关衙署不断完善其税收征管方式。商队首领专精于高利润的小众路线，而最高酋长则调整过境税率，以维持残存商路继续穿越我们的领地。正是这种应变能力使 $AJJ$ 保持繁荣，而更依赖固定路线的图阿雷格各联盟却随跨撒哈拉通道的萎缩而衰落。"
 btl_berber_arabic_press: "柏柏尔-阿拉伯语印刷商"
 btl_berber_arabic_press_desc: "我们晚期的印刷工与石版印刷工在奥雷斯山区的集镇出版柏柏尔语—阿拉伯语双语期刊、宗教小册子与部落史纪事，将我们独特的文化身份传播于识字的马格里布读者之中。我们在与更广泛的阿拉伯—伊斯兰改革运动展开对话的同时，也保存了本联盟特有的语言与礼俗传承。这场双语出版复兴将我们分散的联盟凝聚为一个共同的现代身份，并将更广阔的特勒地区纳入我们的语言与信仰之中。"
 cnr_guanche_renaissance: "关切语文艺复兴"
 cnr_guanche_renaissance_desc: "一场假想中的关切 #italic Nahḍa#! 悄然兴起：原住民学者复兴了门塞亚托档案中祖传的塔马齐格特—关切文字，将接触前的口传编年史整理付印，出版关切语—卡斯蒂利亚语双语期刊，并开设学校，令各岛儿童在学习欧洲语言的同时也能读写祖传母语。我们的科学院延揽塞法迪、安达卢西亚及原住民学者，从无大陆天文台可比拟的火山峰巅观测星空，协力推进天文学、航海术与自然哲学。这场复兴令我们宫廷的学术风气为之一振，培育出足以比肩历史更悠久大陆都城的识字阶层。"
 dje_ibadi_revival: "伊巴德复兴"
 dje_ibadi_revival_desc: "我们晚期的知识分子重新出版伊巴迪—瓦赫比派的经典巨著（塔米尼的法学注疏、杰里德神秘主义者的灵性诗篇，以及突尼斯南部绿洲的编年史），同时创办改革派阿拉伯文报刊，将我们的社群与从姆扎布到阿曼、桑给巴尔的更广阔伊巴迪世界相连。我们的双语期刊从托泽尔经加贝斯流传至突尼斯城，我们的学者与开罗、大马士革的改革派报界平等往来。这场伊巴迪传统复兴，将我们分散的绿洲传统凝聚为一个共同的现代身份，为我们的国家赢得更广泛的读者群，并在其他规模较小的伊巴迪社群中赢得一席之地。"
 fez_guild_chambers: "行会议会"
 fez_guild_chambers_desc: "非斯行会体系经由 #italic 希斯巴 #! 稽查官、行会师傅名册及城市档案中的学徒契约而得以成文规范，使我们的城市拥有马格里布各都城中管理最严密的手工业经济。每一行当——织工、染工、书法家、黄铜匠、鞣皮匠、调香师——皆设有自己的行会厅，自有考核标准、纠纷仲裁之制，并在苏丹的迪万中设有代表。这些受规范的行会加速了我们经济中新作坊的创立，并以有序的商业纪律将我们的市民阶层与王座紧密相系。"
 gbs_djerba_link: "杰尔巴商业纽带"
 gbs_djerba_link_desc: "我们与杰尔巴岛之间紧密的商业纽带，借由每日穿越狭窄加贝斯湾水道的渔业与贸易往来而维系，通过常驻杰尔巴的塞法迪、热那亚及马耳他商行，将我们的商业网络延伸至整个地中海盆地。我们的代理人借助杰尔巴中间人在每一个地中海港口开展生意，我们的货运代理也与杰尔巴的领航行会协同合作。关税哨所同时从海岛与大陆的往来中征得税收。借助杰尔巴之力，我们的国家对海上贸易的掌控更为牢固，我们的商人所能触及之地，也远胜那些纯粹依靠内陆沿海城市的同行。"
 iwl_paramount_century: "最高世纪"
 iwl_paramount_century_desc: "我们的联盟在十九世纪达到鼎盛，成为尼日尔—萨赫勒地区最大的图阿雷格最高权力，最高统治者与索科托哈里发国、马西纳帝国、图库勒尔帝国及马格里布沿海诸摄政国保持直接往来。我们领地四周的定居国家皆承认我们的最高统治世系为图阿雷格各部中地位最尊的权威。我们的使节网络在当时的撒哈拉诸强权中覆盖最广，而我们的文化联盟身份也在此时表现得最为清晰、最具自觉。作为十九世纪首屈一指的图阿雷格强权， $IWL$ 得以与撒哈拉诸国平起平坐，这一地位是同时代其他任何图阿雷格联盟都无法企及的。"
 kah_ifoghas_paramountcy: "伊福加斯最高地位"
 kah_ifoghas_paramountcy_desc: "我们至高无上的伊弗加斯世系，身为 $KAH$ 的首要贵族，在十九世纪重新确立最高统治地位，巩固了阿德拉尔及尼日尔河曲更广阔地区的部族忠诚，并在马格里布沿海涌来的现代化压力面前，宣示了联盟全境的权威。我们最高统治世系的世系谱牒在每一次重大继承中都得到重申。与北方沿海当局及萨赫勒地区诸强权的外交往来，维系了本联盟的自治地位，我们的文化联盟身份也因外部压力而愈发锐利，而非因之瓦解。这场伊弗加斯的最高统治复兴，重振了 $KAH$ 作为联盟的地位——这是纯粹传统的图阿雷格群体，在十九世纪中央集权浪潮下无法做到的。"
 kay_tijaniyya_air: "提加尼教团吸收"
 kay_tijaniyya_air_desc: "提加尼耶苏非教团自其阿尔及利亚发源地沿撒哈拉—萨赫勒的苏非道堂网络向西传播，在我们阿伊尔地区的扎维亚中早早获得热烈接纳，我们当地的谢赫们接受提加尼派的入门礼，并借助既有的学术网络将教义传播给从属的部族社群。我们的宗教体系将这一新教团与更古老的卡迪里耶传统并行吸纳，我们的最高统治宫廷同时庇护这两个兄弟会。传教士将提加尼派教义带往我们疆域之外的豪萨及索科托地区民众之中。通过吸纳提加尼耶，$KAY$ 将其宗教网络延伸入萨赫勒地区，远非任何纯粹的北方图阿雷格联盟所能企及。"
 kgs_modern_synthesis: "现代豪萨-图阿雷格融合"
 kgs_modern_synthesis_desc: "我们的联盟以豪萨—图阿雷格融合的独特身份步入现代，在前殖民时代晚期的中央集权压力下得以幸存，靠的是加深与周边豪萨诸国的农牧一体化，而非退守游牧式的孤立。我们的最高统治世系与南方的索科托哈里发国及北方的图阿雷格诸联盟都保持着正式往来。我们独特的文化形态作为公认的混合型第三选择得以延续，而我们的经济与政治生活在应对地区格局变迁时，也证明比纯粹游牧的图阿雷格联盟更具适应力。正是这种善变而融合的身份，使 $KGS$ 得以在变局中存续，而更为保守的图阿雷格各部却步履维艰。"
 kuk_diaspora_networks: "卡比尔流散网络"
 kuk_diaspora_networks_desc: "我们晚期由卡比尔商人、咖啡馆主、泥瓦匠及季节性劳工组成的商贸与劳工侨民网络遍布地中海沿岸每一座城市，靠着侨汇、城市移民社群，以及归国侨资的持续流入，维系着我们王国的繁荣，并资助了我们对村庄与堡垒的修缮。我们的侨居家族与故乡村落保持着世代相承的联系，将女儿送回故里联姻，并以任何纯农业国家都无法企及的条件，为我们的山地经济引入外国资本。只要有王国之子定居的港口，钱财与消息便会源源流回故土，我们的城镇也因此愈发富庶。"
 mrk_southern_makhzen_axis: "南方马赫赞轴心"
 mrk_southern_makhzen_axis_desc: "我们设于$MRK$的宫廷，经由自设的#italic迪万#!——由维齐尔、卡伊德及财政官员组成——管理摩洛哥马赫赞的南半疆域，与设于$fez$的北方宫廷分庭抗礼，自行处理撒哈拉外交、阿特拉斯部族仲裁，以及整个南部大西洋港口的关税事务。我们的使节径直与苏斯卡伊德、德拉的谢里夫世家及撒哈拉埃米尔们谈判，无需北上请示，处理国事之迅捷，远胜那些将文书往返于两座都城之间耗费时日的政权。我们南方的行政体制使马拉喀什王座得以在外交与财政上自主行事，无需仰赖北方宫廷，而其他任何马格里布都城都难以轻易对其加以掣肘。"
 mzb_ibadi_modernism: "伊巴德现代主义"
 mzb_ibadi_modernism_desc: "我们十九世纪末的知识分子——瓦赫比派的极星谢赫穆罕默德·本·优素福·阿特费亚什、谢赫易卜拉欣·巴尤德，以及新一代 #italic 萨拉菲耶 #! 改革者——使姆扎布向开罗、大马士革及印度洋沿岸更广阔的伊斯兰改革运动敞开对话之门。我们将学生送往突尼斯与开罗，我们在加尔达亚出版的刊物与阿尔及尔及君士坦丁的萨拉菲派报界展开交流，我们五城学术传统也以平等的姿态，与桑给巴尔及阿曼更广阔的伊巴迪世界相遇。这场现代主义思想复兴，将分散的伊巴迪世界凝聚为一个共同的现代社群，纵使中央集权的外来政权也难以将其拆散。"
 ogl_sharif_resistance: "瓦尔格拉谢里夫"
 ogl_sharif_resistance_desc: "我们当地的 #italic 谢里夫 #! 西迪·穆罕默德·本·阿卜杜拉，自称伊德里斯圣裔，在一面兼具王统与宗教抵抗的旗帜下，宣告撒哈拉全境的统一起义，将沙漠部族、#italic 提加尼耶 #! 兄弟会及心怀不满的绿洲名流聚集于其麾下。他的征战将深撒哈拉诸联盟、提加尼道堂及塔菲拉勒特商队世家动员为一支武装联盟，使阿尔及利亚南部边境多年来抵挡住任何意图将其纳入直接统治的中央集权朝廷。这场旷日持久的撒哈拉起义，为我们的国家赢得了武装抗争的声望，以及一次性号召众多联盟的号召力，而更快被平定的北部绿洲却从未能做到这一点。"
 sos_soussi_grocer_diaspora: "苏西杂货商流散"
 sos_soussi_grocer_diaspora_desc: "$SOS$的各大商号，以遍及苏斯与地中海沿岸每一座集镇的共同#italic塔克比尔特#!宗亲契约为纽带，将家中幼子派往远超我们政治疆界的城市，开设杂货铺、榨油坊与香料店。同一户人家，既坐拥苏斯的阿甘树林，也在丹吉尔经营香料行，在$fez$开设染坊，在萨莱设有粮仓，每年借族中长老主持的聚会结算账目，迎接儿子们归乡。这一商贸侨民网络，使我们商人的触角与对移民的吸引力远远延伸到正式疆界之外，而无需动用一兵一卒或一名外交官去维系它。"
 tat_steamship_era_pivot: "蒸汽船时代转型"
 tat_steamship_era_pivot_desc: "随着十九世纪末大西洋蒸汽船将黄金与奴隶贸易从沙漠商路引走，图瓦特各商号转而经营椰枣、盐业及撒哈拉旅行中转，使我们的城镇适应了这个虽规模较小却经受住蒸汽革命冲击的持久商业空间。我们的绿洲如今接待来访的外国学者、商业代理及好奇的旅人，他们的付款与馈赠补充了残存的商队收入，而我们在阿尔及尔与奥兰的代理人也为沿海汽船航线打通了地中海的联络。这场转型开辟了部分海运贸易，并吸引移民来到我们的城镇，这是那些仅靠贸易量维生的撒哈拉城镇永远无法做到的。"
 tfl_trans_saharan_outposts: "跨撒哈拉前哨"
 tfl_trans_saharan_outposts_desc: "$TFL$的卡伊德（qā'id）们在廷杜夫、因萨拉赫、瓦迪索拉以及其间的沙漠水站维系着一条驻防前哨链，我们的商行、文书和外交使节正是通过这条链条，将影响力投射到撒哈拉深处，远及阿德拉尔、瓦拉塔诸埃米尔国乃至更远的萨赫勒地区。我们在每座#italic funduq#!（商栈）驻留的守军，兼管用水权、武装护卫与保税仓储，使跨撒哈拉商贸体系扎根于塔菲拉勒特的资本与塔菲拉勒特的关税之上，而非仰赖遥远宫廷的号令。这一前哨网络将我们绿洲的商业触角远远延伸至其正式疆界之外，为我们的商行提供了一条内陆马格里布诸国难以复制的驿站链。"
 tgt_qadiriyya_zawiyas: "卡迪里耶扎维耶网络"
 tgt_qadiriyya_zawiyas_desc: "我们的中央绿洲坐拥阿尔及利亚撒哈拉南部最重要的 #italic 卡迪里耶 #! 苏非派 #italic 扎维亚 #! （托尔加、西迪哈莱德，以及其间相连的道堂），吸引着奥雷斯山与萨赫勒之间每一座绿洲的朝圣者，并以共同的仪式与捐赠地产，将南方宗教体系与我们的宫廷紧紧相连。我们的苏丹出资维护道堂清真寺、卡迪里耶谢赫们的讲学圈子，以及每年吸引成千朝圣者涌入我城的 #italic 冒路德 #! 节庆。对苏非网络的庇护，将我们王室的宗教与文化影响力播撒至整个南方，这是任何纯粹世俗的苏丹国都无法企及的。"
 tle_tlemcen_nahda: "特莱姆森复兴"
 tle_tlemcen_nahda_desc: "我们的文化复兴——特莱姆森的#italic奈赫达#!——以学者穆罕默德·赛义迪、伊本·胡贾以及旧麦舍瓦尔沙龙为中心，重拾此前种种干预曾令其中断的扎扬德－安达卢西遗产。我们修复宏伟的经学院，从$fez$和埃斯科里亚尔的藏书中重印中世纪特莱姆森手稿，并出版双语期刊，将欧洲思想引入西马格里布的思想交流之中。这种语言与思想上的复兴，将零散的扎扬德遗产凝聚为一种共同的现代认同，任何外国统治都难以轻易将其割裂。"
 trg_blue_robes_identity: "蓝袍认同"
 trg_blue_robes_identity_desc: "我们贵族所戴的#italic利塔姆#!面纱、靛蓝染成、使男子肌肤染上蓝色的长袍、我们女子以提非纳文书写的诗歌，以及邻近民族从未保留过的母系习俗——这些图阿雷格身份的标志，在足以瓦解其他许多撒哈拉族群的外部压力之下依然延续。我们的学堂、牧歌与婚约，世代相传，未曾中断。这种文化的延续，使我们王室的权威跨越撒哈拉的辽阔距离传遍整个联盟，并抵御任何中央集权帝国的同化。"
 #Hassaniya Shared
 hassaniya_maqil_migrations: "巴努哈桑迁徙"
 hassaniya_maqil_migrations_desc: "巴努·哈桑及更广泛的巴努·马阿吉勒阿拉伯部族历经数代，从上埃及一路西迁，与西撒哈拉的桑哈贾柏柏尔人相融合，将他们的阿拉伯方言——我们的#italic哈桑尼耶#!语——强加于被征服的营地之上。我们的谢赫们采纳了外来阿拉伯人的谱系，我们的学者将每一个统治家族的世系追溯至巴努·哈桑的先祖，而更古老的柏柏尔语言则退居为词汇底层，仅存于牧歌与地名之中。这种阿拉伯与柏柏尔的融合，赋予了比丹人一种部落与谱系秩序，将西撒哈拉凝聚为一个邻近民族皆无法共享的独特文化圈。"
 hassaniya_azalai_salt_caravans: "阿扎莱盐商队"
 hassaniya_azalai_salt_caravans_desc: "每年两度的盛大#italic阿扎莱#!商队，在瓦丹集结，南下瓦拉塔与尼日尔河曲，将西撒哈拉伊吉勒矿场及伊吉勒盐沼开采出的岩盐块，运往马里与桑海的黄金谷物市场。我们的商队首领世代承袭各盐矿的租权，成百上千的驮运骆驼为南行之路集结成列，归程商队则将苏丹金沙、豪萨布匹与可乐果带回北方的商埠。这种以盐易金、根植于西撒哈拉盐源的循环，为比丹财库带来了任何邻近经济体都无法以本地岩石替代的矿物收入。"
 hassaniya_mehari_warbands: "梅哈里战团"
 hassaniya_mehari_warbands_desc: "#italic迈哈里#!骆驼——撒哈拉那高大、毛色雪白的乘用骆驼——能在三天之内载着我们的哈桑战团穿越四百公里、任何骑兵都无法通行的地形，在敌人尚来不及组织反击之前，便袭击商队、定居的敌人与对立部族。我们的年轻战士自幼便在这些坐骑上受训，学习列队冲锋、鞍上开弓，并在追兵出现时迅速散入沙丘之中。在我们本土的地形上，骑骆驼的突袭者比任何邻近的军事体系——无论马格里布、苏丹还是撒哈拉——都行动更快。"
 hassaniya_sharr_bubba: "沙尔布巴"
 hassaniya_sharr_bubba_desc: "#italic沙尔·布巴#!之役——这场最终将哈桑武士部族与扎维亚学者部族分离开来的漫长斗争——以一项具有约束力的种姓划界休战告终，双方皆将其视为结束杀戮的代价。哈桑部族保有携带武器与征收贡赋的垄断权；扎维亚部族保有古兰经讲学、司法调解与部族间外交的垄断权；作为附庸的拉赫马人与获释的哈拉廷人则在两者治下接受其定居地位。这一正式的种姓安排以明确的分工稳定了我们的比丹社会，使部族间的世仇难以再度燃起。"
 hassaniya_qadiriyya_tariqa: "卡迪里耶教团"
 hassaniya_qadiriyya_tariqa_desc: "#italic Qādiriyya#! 教团——这一通过孔塔学者世系及瓦丹、欣基特与瓦拉塔的宏大扎维亚传承下来的西撒哈拉古老苏非兄弟会——将比丹宗教阶层的道德与司法权威，从大西洋海岸一直延伸至尼日尔河曲。其传承谱系（西尔西拉）将跨部族的古兰经学者联系在一起，其道堂调解着任何武力都无法平息的部族间纠纷，其效忠誓言将附庸部族与其庇护扎维亚紧紧相连。这一根深蒂固的苏非网络，赋予比丹诸埃米尔国一种宗教合法性与个人忠诚网络，是任何后起的兄弟会都难以轻易取代的。"
 hassaniya_shinqit_libraries: "欣基特手稿图书馆"
 hassaniya_shinqit_libraries_desc: "欣基特、瓦丹、提契特与瓦拉塔的手稿图书馆，由西撒哈拉的大学者世家悉心保存，收录了数以万计关于马立克派教法学、马格里布语法、古典阿拉伯诗歌、苏非神秘注疏以及各比丹部族地方谱系的卷帙。我们的手稿抄写员将撒哈拉草书体代代相传，装订匠则以鞣皮装帧保存古老的抄本。学者商人将副本运往开罗、非斯与突尼斯的图书馆。这种高度集中的书籍文化，为西撒哈拉赢得了 #italic 欣基特之地 #! 这一文献与学术盛名，这是任何进口书籍都无法单独赋予一个大西洋移民社会的。"
 #Moroccan Shared
 moroccan_sharifian_descent: "谢里夫世系"
 moroccan_sharifian_descent_desc: "我们的王朝声称通过哈桑·本·阿里直接承袭自先知穆罕默德，这一#italic 谢里夫#!世系由伊德里斯创始者在八世纪带到埃及以西，我们现在将其作为我们王座的神圣基础。任何柏柏尔王朝（穆拉比特、穆瓦希德、马林或瓦塔斯）都无法比拟我们的宫廷谱系学家在每次#italic 效忠#!仪式上公布、认证和宣读的先知谱系。这种谢里夫世系确保了乌里玛的忠诚，并提升了我们的宫廷在每个穆斯林同侪面前的地位。"
 moroccan_bay_a: "效忠仪式"
 moroccan_bay_a_desc: "#italic拜阿#!（效忠誓约）是$fez$的乌理玛、城中显贵以及部族#italic卡伊德#!们向新即位苏丹宣誓效忠的正式仪式，每逢继位或重大政治危机，这一盟约便会重新缔结。这一仪式将统治者与臣民结于相互的义务之中：苏丹承诺捍卫信仰与习惯法，而与会的代表们则承诺以赋役与纳税支持国家。这种建立在同意之上的合法性，稳固了我们的继承制度，并抑制了若无此协商便会爆发的离心压力。"
 moroccan_andalusi_refuge: "安达卢斯避难所"
 moroccan_andalusi_refuge_desc: "一波又一波的安达卢西流亡者先后定居于我们沿海的城市：由曼扎里家族重建的得土安、$fez$的#italic安达卢西区#!、萨莱的奥尔纳切罗海盗聚居地，以及舍夫沙万的丝织工匠。他们带来了失落半岛上的火器工艺、银行技艺、城市建筑与饮食文化，这些知识被我们历史悠久的商行立即吸收。这股难民潮为我们的城市注入新生，也为王室带来了一批忠于赐予他们庇护之国的技艺精湛的市民阶层。"
 atlantic_trade_routes: "大西洋贸易路线"
 atlantic_trade_routes_desc: "葡萄牙人与卡斯蒂利亚人绕过博哈多尔角，开辟了一条沿我们整个海岸线延伸的新大西洋航运体系，从丹吉尔经萨莱、拉拉什，一路南下至摩加多尔与阿加迪尔。我们在大西洋各港口的 #italic 基督徒商栈（funduq an-Naṣārā） #! 接待欧洲商务代理，对每一艘前来补水或维修的船只征收关税，并将货物再出口至内陆的撒哈拉商队市场。我们的西部海岸赋予我国相较于东面那些完全地中海化的马格里布诸国一种持久的商业优势。"
 moroccan_malhun_poetry: "马尔洪诗歌"
 moroccan_malhun_poetry_desc: "我们城中的诗人——$fez$、梅克内斯、$marrakesh$与萨莱的#italic马勒洪诗派谢赫们#!——创作并演唱这一使摩洛哥阿拉伯文化有别于其他一切阿拉伯诗歌流派的吟唱诗歌传统。#italic格西达#!与#italic格里哈#!这两种体裁，将方言#italic达里贾#!诗句配以安达卢西－马格里布音乐的韵律，以每个城市家庭都能理解的语言，演绎爱情、讽喻、神秘主义与王朝政治等主题。这一通俗文学传统遍布我们的城市与绿洲商队，为我们的农民与市民提供了一种文化媒介，使摩洛哥阿拉伯身份的声望在历代统治者淡出记忆之后仍长存不衰。"
 moroccan_nahda_maghribiyya: "马格里布复兴"
 moroccan_nahda_maghribiyya_desc: "我们摩洛哥一脉的 #italic 奈赫达 #! 运动，汇聚于 $fez$ 以阿拉勒·法西与阿布·舒艾卜·杜卡利为核心的 #italic 萨拉菲耶 #! 学圈，汇聚于丹吉尔以 #italic 《马格里布之舌》 #! 为名的阿拉伯文报刊，也汇聚于得土安－非斯两地的双语期刊，这些期刊将欧洲思想引入西马格里布的思想交流之中。我们从外国图书馆中寻回伊本·赫勒敦、马卡里及马林王朝编年史家的中世纪手稿，以校勘本重新刊行，并在我们的学校与档案中，顶住外来行政语言的集权化压力，使摩洛哥古典阿拉伯语趋于规范统一。这场思想复兴将我们分散的精英阶层凝聚为一种共同的现代认同，任何集权化的外国统治都难以轻易将其割裂。"
 #Moroccan Unique
 mor_atlas_strongholds: "阿特拉斯山脉堡垒"
 mor_atlas_strongholds_desc: "占据我国大部分地区的山脉——阿特拉斯山脉和里夫山脉的各段——是没有任何帝国能真正征服$MOR$的原因。自罗马军队首次穿越这些山口以来，我们的阿马齐格山地部族就一直守护着它们，我们对每一条小道和避难所的熟悉程度无与伦比。群山不会阻碍我们；它们保护我们。"
 first_fleet_of_the_med: "地中海第一舰队"
 first_fleet_of_the_med_desc: "#italic穆瓦希德王朝#!诸哈里发在$marrakesh$所拥有的舰队，在雅库卜·曼苏尔治下由意大利各海上共和国的贡赋维系，并由帝国都城统一调度指挥，确立了摩洛哥在西地中海长达两个世纪的海上霸权。我们的苏丹所继承的，不仅是萨莱、阿西拉与拉拉什的船坞，更是一种战略集中的原则：舰队奉$marrakesh$之令，集中打击单一目标，而非任由沿海私掠船长各自为战、四处劫掠。这一帝国统一指挥的传统，使我们的海军得以作为一支协调一致的战略力量运作，这是任何分散的沿海海盗舰队都无法企及的。"
 mor_marinid_takeover: "马林接管"
 mor_marinid_takeover_desc: "来自东部高原的赞纳塔柏柏尔人——马林王朝（班努·马林），取代了日渐衰败的穆瓦希德王朝，夺取马拉喀什，并以非斯·贾迪德改革后的 #italic 马赫赞 #! 宫廷衙署、精简的省督 #italic 迪万 #! 议事机构，以及一套剔除了穆瓦希德宗教教义越界之弊的宫廷礼仪，重建帝国政体。此番王朝更迭所巩固的，是一个比先前那庞杂的哈里发国更为精干、行政上更为协调一致的帝国王权。马林王朝的这番重整，为我们的宫廷带来了一个真正行之有效的中央政府，而这正是单凭穆瓦希德遗产所无法提供的。"
 sle_idrisi_atlantic_port: "伊德里西的大西洋港口"
 sle_idrisi_atlantic_port_desc: "十二世纪的地理学家伊德里西，在为巴勒莫的诺曼宫廷撰述时，将萨累列为西马格里布大西洋沿岸的重要锚地之一，其码头、谷仓与海关设施之详尽记载，足见此城之重要。我们的商行所继承的这座港口，其船坞与城墙正是由穆拉比特与穆瓦希德两朝先辈所建，直至中世纪晚期的航运仍在沿用。中世纪留下的声望，使我们的王室拥有了一座发展成熟的大西洋商埠，非马格里布其余小港所能企及。"
 tet_strait_lookout: "海峡瞭望"
 tet_strait_lookout_desc: "我们在得土安上方修建的沿海瞭望塔与烽火台，扼守着直布罗陀海峡的东侧门户——这是地中海与大西洋之间最狭窄的天然通道。穆瓦希德与马林王朝的驻军世代把守于此高地，监视着伊比利亚海岸，以及往来穿梭于此的地中海各方战舰商船。我们对海峡的这番监视，使宫廷得以洞悉每一支从两海驶近我方海岸的舰队动向。"
 mor_marrakesh_fez_axis: "马拉喀什-非斯轴线"
 mor_marrakesh_fez_axis_desc: "我们的帝国王权立足于两座都城之上：马拉喀什承袭着穆瓦希德哈里发遗留下来的礼仪威望，而非斯·贾迪德则是王国行政与宗教的中枢所在。两都各自通过自己的 #italic 迪万 #! 议事机构与军事指挥体系，统辖其各占一半的领土，苏丹则在两都之间每年循环巡幸，借此礼仪巡行彰显对全国的中央权威。这种双都并立的格局，使我们的统治触及之广，远非任何单一都城的马格里布国家所能比拟。"
 mor_marinid_madrasas: "马林经学院"
 mor_marinid_madrasas_desc: "马林诸苏丹在非斯及周边城市广设帝国经学院网络（#italic 布伊南尼亚学院 #!、#italic 阿塔林学院 #!、梅克内斯的 #italic 布伊南尼亚学院 #!、#italic 萨赫里吉学院 #!，以及 #italic 米斯巴希亚学院 #!），每所学院皆设清真寺、藏书楼、济贫馆、教席师资，并由苏丹国库支付生员津贴。这些学院的毕业生日后充任王国的 #italic 卡迪 #! 法官、宫廷文书与宣教之士，借由共同的学养渊源，将宗教建制与帝国王权紧密相系。这份由苏丹出资的学术事业，使我们的国家更加博学，并自整个穆斯林世界吸引改革派学者纷纷来投我方宫廷。"
 sle_early_privateer_charters: "早期私掠特许状"
 sle_early_privateer_charters_desc: "马林王朝末期的诸位苏丹，自我方船坞颁发了最早的正式私掠许可状，授权萨累的船长们依王室特许劫掠阿拉贡、卡斯蒂利亚与热那亚的商船。我们的船长们向流亡而来的安达卢斯船长学习地中海捕获战利品之术，沿海的桨帆船队也开始陆续满载缴获货物与可赎俘虏凯旋而归。这种早期由国家颁照的私掠活动，为日后海盗共和国立法所确立的制度奠定了根基。"
 tet_riffian_levies: "里夫征召"
 tet_riffian_levies_desc: "吉巴拉与里夫山地各部族——其村落高踞于得土安上方群山之巅——为我方驻军提供了惯于伏击、突袭并能在崎岖地形中迅速撤退的轻装非正规兵员。各部族联盟皆各自保有其征募惯例、兵器传统与指挥体系，由酋长世袭掌管对本城的兵役契约。里夫民兵为我方常备军提供了一支灵活机动的辅助部队，这是低地马格里布诸城所难以轻易组建的。"
 mor_sadi_sharifian_emergence: "萨阿德谢里夫崛起"
 mor_sadi_sharifian_emergence_desc: "巴努萨阿德，通过哈桑·本·阿里承袭自先知穆罕默德，并长期定居在德拉河谷作为谢里夫地方名流家族，在十六世纪早期作为对衰落的瓦塔斯王朝的苏丹国觊觎者出现。其王朝使命——在谢里夫王冠下恢复统一的摩洛哥—阿拉伯帝国权威——迅速赢得了非斯和马拉喀什的乌里玛、跨撒哈拉商队首领以及城市安达卢斯流亡社群的支持。这次王朝崛起让我们的使节能够在穆斯林地中海和撒哈拉贸易世界的宫廷中宣称先知后裔的威望。"
 mor_chichaoua_sugar: "希绍瓦糖"
 mor_chichaoua_sugar_desc: "我们在希沙瓦、苏斯河谷与塔德拉平原的蔗糖种植园与炼糖作坊，将摩洛哥农业转变为一整套由王室一手掌控、涵盖各个环节的工业化出口体系：苏丹特许状赋予甘蔗种植园免税地位，王室磨坊将甘蔗炼制成精糖块，帝国国库则在每一环节抽取份额。我们的 #italic 摩洛哥糖 #! 经由大西洋诸港远销欧洲的账房、药商与糖果商，售价高于马德拉与巴西的同类竞品。这套由甘蔗到糖块皆握于王室之手的制糖产业，为我方中央国库带来了可直接支取的财源，也使摩洛哥王室在奢侈品出口方面拥有了其他马格里布国家无法匹敌的优势。"
 sle_atlantic_corsair_charters: "大西洋私掠特许状"
 sle_atlantic_corsair_charters_desc: "我们的船长在正式的国家特许状之下行事，这些特许状使其船员得以免于常规海军纪律的约束，同时规定须将每份战利品的固定份额上缴国库——这套契约化的私掠制度，吸引着来自地中海与大西洋各地野心勃勃的水手投身其中。萨累的海盗行会世代训练船长们掌握快速截船、信号旗欺敌与捕获物诉讼的种种技艺。这种有组织的私掠传统，使我方舰队得以年复一年地常驻海上，这是偶尔出动的国家舰队远征所无法比拟的。"
 tet_andalusi_quarter: "安达卢斯区"
 tet_andalusi_quarter_desc: "自阿里·曼扎里率领首批自安达卢斯而来的流亡者重建得土安城之后，城中的 #italic 安达卢斯人街区 #! 便如一方移植而来的纳斯里德式社区拔地而起：那铺砖的喷泉、带院落的宅邸、铁艺阳台与丝织作坊，将已逝的安达卢斯风貌一一镌刻进马格里布的石砌之中。格拉纳达流亡世家垄断了识字、金融与宗教建制，其所办学校为城市行政培养出一批又一批文书与书记官。正因这份移植而来的文化根基，得土安在读写方面之精，远非其他马格里布港口所能及。"
 foreign_politics: "以敌克敌"
 foreign_politics_desc: "$MOR$扼守西地中海门户与大西洋补给航线之战略要地，使我们成为任何一方欧洲强权谋求对另一方取得优势时不可或缺的外交砝码。我方使节出入各国宫廷皆以平等地位相待而受迎接；$marrakesh$的#italic崇高之门#!接见各国使节，签署通商条约，并为基督教诸王公之间的争端居中仲裁——这等调停，他们绝不肯接受出自其他任何穆斯林君主之手。这份独一无二的外交地位，令摩洛哥王室在欧洲事务中所拥有的影响力，是其他任何马格里布或撒哈拉以南国家都无法比拟的。"
 mor_dhahabi_golden_age: "黄金时代"
 mor_dhahabi_golden_age_desc: "在帝国全盛之期——后世子孙称之为#italic达哈比#!，即黄金时代——治下诸位伟大苏丹的宫廷积累了后世任何马格里布国家都无法匹敌的巨大财富。黄金源源不断地自锡吉勒马萨、瓦拉塔与廷巴克图等撒哈拉商道终点涌入；精炼的蔗糖经大西洋诸港运往欧洲糖果商手中；基督教世界各国宫廷与崇高之门的使节纷至沓来，或求结盟，或求通商。持续的繁荣充盈了国库，令后续历代君主得以凭借此积蓄，资助那些国力较弱的国家所无力承担的军事征伐、宗教慈善基金与王朝庆典。"
 sle_bou_regreg_republic: "布勒格雷格共和国"
 sle_bou_regreg_republic_desc: "萨累与拉巴特的海盗船长们，因萨阿德王朝对其利益经营不善而深感厌倦，遂于十七世纪初宣告建立布雷格雷格河自治共和国，这是一个拥有自己的 #italic 迪万 #! 议事机构（由选举产生的 #italic 卡伊德 #! 组成）并自行拥有缔约权的主权共同体。我们的共和国直接与荷兰联省议会、英格兰、法兰西及意大利各商业共和国缔结通商协议，条件之优渥，是任何马格里布君主国都无法企及的。作为一个主权的海盗共同体，萨累在大西洋与西地中海一带享有公认的宪制地位。"
 tet_andalusi_banking_houses: "安达卢斯银行家族"
 tet_andalusi_banking_houses_desc: "我方位于得土安的犹太—安达卢斯商业银行世家（卡塞斯、帕里恩特、纳洪、本德拉克与托莱达诺诸族，皆将托莱多的商业票据传统带入流亡之地），既资助海盗舰队，也支撑着日常的地中海贸易。他们与里窝那、热那亚、马赛、阿姆斯特丹及地中海各港口的塞法迪犹太社群皆保有通汇往来关系。借助这一银行世家网络，我方国库得以以纯粹穆斯林商业资本所无法提供的条件取得借贷。"
 jaysh_armies_advance: "加伊什军团"
 jaysh_armies_advance_desc: "战争新纪元的到来，迫切需要一支只效忠于我们的地方部落军队。我们将通过他们来掌控我们广袤领地的资源。"
 mor_sherifian_inviolability: "谢里夫不可侵犯性"
 mor_sherifian_inviolability_desc: "#italic谢里夫不可侵犯#!这一宪制原则认为，我方苏丹既是先知后裔——经由哈桑·本·阿里一脉传承而来——便不可与寻常省督或#italic卡伊德#!同等看待、遭受挑战。各省叛乱或可推翻个别#italic总督#!，城市暴动或可赶走遭人痛恨的税吏，部族联盟亦可抗拒某些王命，然而谢里夫王权本身，在乌莱玛与受#italic拜阿#!效忠誓约所约束的显贵眼中，始终神圣不可侵犯，受宪制保障。这份深厚的王朝合法性，使我方国家能够承受那些足以颠覆仅凭世俗权威立国的君主国的地方动荡。"
 sle_christian_captive_market: "基督徒俘虏市场"
 sle_christian_captive_market_desc: "我方在萨累与拉巴特码头设立的俘虏市场，接收着海盗舰队所俘获的欧洲囚犯，而赎回事宜则由携带热那亚信用函与银箱而来的三一会与仁慈会修士经手办理。拍卖师、赎金经纪人、看管奴隶之人与随行译员兼神父，共同组成了一套运转严密的买卖体系，支撑着我方整个海盗事业。这桩俘虏买卖，降低了国库所委任的每一次私掠远征的成本。"
 tet_naqib_al_ashraf: "谢里夫监察官"
 tet_naqib_al_ashraf_desc: "我们地方上的#italic先知后裔宗长#!（纳基布·阿舍拉夫），是得土安先知后裔家族的首领，召集全城的先知世系贤达，核验他们的世系谱牒，调解继承纠纷，并向帝国御座代表他们的共同利益。此议会享有免税特权、在城市节庆中享有礼仪上的优先地位，并在#italic卡迪#!与#italic马赫赞#!所任命的总督之间发生争执时享有被咨询之权。这一常设的先知后裔议会传统，通过先知血统这一合法渠道，稳定了我们的城市治理。"
 mor_imperial_modernization: "帝国现代化"
 mor_imperial_modernization_desc: "历代十九世纪的苏丹们推行一项持续不断的行政、财政与军事现代化计划：招募外国技术顾问，改组 #italic 马赫赞 #! 秘书厅，使帝国军械局现代化，并在全国统一税收制度。每一项改革都遭到根深蒂固的部落与乌理玛势力的抵制，但缓慢的改革与调适习惯逐渐形成，并在历代苏丹更替中持续延续。这种持久的适应能力，使我们的王室得以将技师、工程师与现代行政官员提拔至国家要职，同时使每一项收入来源都为国库带来更多财富。"
 mor_makhzen_taxation_reform: "马赫赞税收改革"
 mor_makhzen_taxation_reform_desc: "传统上纷繁杂乱的 #italic kharāj #! 、 #italic 'ushūr #! 、 #italic zakāt #! 以及城市行会的 #italic gharāma #! 等税收，被反复整顿为更高效的统一形式：乡村平原上统一的人头 #italic tertib #! 税、标准化的城市税，以及规范化的大西洋港口关税评估。我们的商人逐渐清楚自己应缴之数，我们在得土安与摩加多尔的犹太－安达卢西亚银行世家也相应完善其放贷条款，而我们的国库则截获了以往因重叠减免而流失的税收。持续的财政现代化，使我们的王室拥有资助现代军队与公共工程所需的财富，远非纯粹传统税制所能支撑。"
 sle_atlantic_legal_commerce: "大西洋合法贸易"
 sle_atlantic_legal_commerce_desc: "海上力量对比的变化使私掠活动不再占优，这促使萨累转向合法的大西洋贸易：通过与大西洋沿岸各国商行订立正式契约，出口加尔布平原的小麦、皮革制品、蜂蜡以及撒哈拉商队货物。我们的钱庄从赎金中介模式转向商业贴现放贷，我们的船坞也开始建造用于和平货运的商船。港务长采用标准化的关税评估方式。随着私掠时代的终结，这一商业转型使我们的国库得以维持其收入基础。"
 tet_andalusi_press_revival: "安达卢斯出版复兴"
 tet_andalusi_press_revival_desc: "我们晚期在得土安的印刷匠与石印匠们，重新刊印格拉纳达－安达卢西亚古典名著（伊本·赞敦的 #italic 诗集 #! 、利桑·丁·伊本·哈提卜的散文、伊本·萨赫勒的突尼斯－安达卢西亚 #italic 穆瓦沙哈 #! 诗体），同时出版改革派阿拉伯报刊，将马格里布西部与更广泛的 #italic 复兴运动 #! 潮流联系起来。识字的农民纷纷迁入得土安的印刷街区，学习排字、装订与雕版技艺，壮大了我们的市民阶层，每一期印刷品问世，都从乡间腹地吸引来新的家庭。印刷业的这番复兴，开辟了一条从乡村通往城市的稳定晋升之路，使我们的城市中心具备了任何以乡村为根基的马格里布国家都无法比拟的人口吸引力。"
 #Tunisian Shared
 tunisian_maliki_heartland: "马立克心脏地带"
 tunisian_maliki_heartland_desc: "凯鲁万——开罗以西最古老的清真寺之城，由欧克白·伊本·纳菲厄于七世纪所建——与突尼斯城的宰图纳清真寺大学一同，共同构成马利基学派在西方的中心，七百年来培养了马格里布各国的卡迪与穆夫提。我们的学者抄写并传承萨赫农所著的根本典籍《#italic穆达瓦纳#!》，我们的古兰经学校传授的师承谱系，正是安达卢西亚与撒哈拉乌理玛所追溯的同一传统，我们的教法裁决约束着从大西洋沿岸直至尼日尔河湾的信众。我们这信仰与学问并重的双子中心，承载着一脉无与伦比、古老而连续的法律与学术传统，比起非斯、特莱姆森或马拉喀什都更为悠久。"
 tunisian_sahel_ribats: "萨赫勒里巴特"
 tunisian_sahel_ribats_desc: "苏塞、莫纳斯提尔与马赫迪耶的设防 #italic 里巴特 #! 建筑群，建于阿格拉布王朝与法蒂玛王朝统治初期，兼作沿海修道院与驻防要塞，训练着常驻的宗教武士阶层，抵御基督徒的袭扰与内陆柏柏尔人的压力。每座里巴特既驻有常备守军，也聚居着虔诚志愿者的社群，即 #italic 穆拉比特 #! ，他们轮流承担守卫职责，兼习古兰经学问并调解部落间的争端。沿海防御与宗教训练相结合，使突尼斯萨赫勒地区拥有一条设防修道院组成的边疆防线，其规模为马格里布其他海岸所不及。"
 tunisian_andalusi_refuge: "安达卢斯避难所"
 tunisian_andalusi_refuge_desc: "格拉纳达的陷落，使一波又一波的安达卢西亚难民涌入我们萨赫勒沿岸的斯法克斯、苏塞与比塞大诸港，以及内陆的泰斯图尔与苏莱曼等中心，他们带来了安达卢西亚的手工技艺、方言、农业技术，以及安达卢斯的建筑记忆。我们的行会吸纳了他们的手工作坊，我们的果园也采用了他们的灌溉技术。我们的学者抄录他们从伊比利亚图书馆抢救出来的手稿。两岸文化的交融，赋予了我们城市文化独树一帜的风貌。"
 tunisian_shadhili_tariqa: "沙兹里耶教团"
 tunisian_shadhili_tariqa_desc: "由阿布·哈桑·沙兹利创立的 #italic 沙兹利教团 #! ——他在定居埃及之前，精神成长的关键岁月是在突尼斯度过的——通过我们的扎维耶据点一波波地传遍马格里布，奠定了苏非主义与正统教法合一的传统，这正是我们乌理玛所独有认可的结合。我们的学者阶层横跨马利基教法学与沙兹利神秘修行，二者并行不悖，我们的谢赫们同时身兼卡迪与传法谱系的持有者。宗教上处于边缘的群体（南方的柏柏尔部落、草原上的希拉里贝都因人）也被纳入该教团道堂与效忠誓约的网络之中。将苏非主义与教法学相结合，赋予了我们的宗教文化一种教义上的灵活性，这是单纯恪守教法的马格里布对手所无法企及的。"
 tunisian_maliki_hanafi_synthesis: "马立克-哈乃斐综摄"
 tunisian_maliki_hanafi_synthesis_desc: "我们贝伊法庭同时设有马利基派与哈乃斐派两套平行的法官席：较为古老的马格里布 #italic madhhab #! 服务于本地居民，而较新的哈乃斐学派则服务于奥斯曼新来的驻军及其家眷，二者在民事法律事务上享有同等的程序效力。我们的穆夫提们相互参照彼此的裁决，我们的商队商人会选择最适合各自契约的法庭，我们的教法档案则将两派的判例并列留存。双重法庭赋予我们城市文化一种法律上的灵活性，这是严格恪守马利基派的马格里布西方与严格恪守哈乃斐派的奥斯曼东方所不具备的。"
 tunisian_nahda_circle: "突尼斯复兴"
 tunisian_nahda_circle_desc: "我们的改革派圈子，聚集在海尔丁帕夏、伊本·阿比·迪亚夫与宰图纳的革新派人物周围，推动了 #italic 复兴运动 #! ，使突尼斯的行政、教育与法律在埃及与黎凡特阿拉伯腹地出现同类运动之前一代人的时间便已完成转型。我们将欧洲的政治论著译成阿拉伯文，创办了实行双语课程的萨迪基学院，并草拟了日后被《安全公约》纳入贝伊治国实践的各项章程。我们这场早发的、本土孕育的阿拉伯改革运动，奠定了一种现代主义知识传统，后来的埃及与黎凡特复兴运动也承认其为渊源所在。"
 #Tunisian Unique
 gfs_capsa_aqueduct: "卡普萨水渠"
 gfs_capsa_aqueduct_desc: "#italic卡普萨#!的罗马引水渠，建于二世纪，用以从杰贝尔·奥尔巴塔山泉引水，供给军团驻地及周边橄榄庄园，至今仍通过罗马人铺设的同一石质渠道向我们的绿洲输水，历经千年，由凯萨尔的世居社群维护至今。我们的哈曼浴室、果园蓄水池与市场水槽，皆取水于这一脉传承而来的单一工程。我们的石匠仍保有修补与清理渠道所需的技艺，以应对渠段坍塌之时。这项罗马水利工程为加夫萨带来的水流，是任何纯粹的中世纪工程都无法从零复制的。"
 tun_caliphal_claim: "哈里发宣称"
 tun_caliphal_claim_desc: "蒙古人洗劫巴格达、终结阿拔斯王朝之后，我们哈夫斯王朝的苏丹们宣称拥有 #italic 哈里发位 #!（对穆斯林社群的普世统治权），援引我们源自穆瓦希德派谢赫的世系，以及我们作为马利基正统信仰守护者的角色。我们的主麻聚礼宣讲中尊奉苏丹为信士的领袖，我们的钱币上铸有哈里发称号，我们与马木鲁克、马林王朝及伊儿汗国的外交往来，皆坚持平等的主权礼节。这一哈里发名号的宣称，赋予了原来的 $TUN$ 王朝一种其他马格里布王朝都无法企及的宗教与政治权威，无论是马林王朝、扎扬王朝，还是瓦塔斯王朝皆不能比。"
 tunisian_corsairs: "突尼斯海盗"
 tunisian_corsairs_desc: "$TUN$与古莱塔的私掠船长们，自哈夫斯王朝晚期以来便在地中海中部猎捕基督徒商船，依照国家特许状行事，与皈依伊斯兰的基督徒叛教者、改信伊斯兰的希腊船长，以及来自地中海各港口、在我们麾下寻得庇护与差遣的冒险者并肩作战。我们在比塞大与法里纳港的船坞维护着快速的#italic斯基拉#!桨帆船，本土与外来招募的船长皆驾驭此船；$TUN$的奴隶市场则将俘虏转销至$maghreb_region$各地，乃至奥斯曼世界。这种由国家支持的私掠活动，兼纳突尼斯本土与归化叛教者之才，使$TUN$拥有一支效力卓著的战桨舰队，以及任何马格里布国库都难以独力负担维系的水手储备。"
 connections_with_the_christian_world: "与基督教世界的联系"
 connections_with_the_christian_world_desc: "哈夫斯王朝的苏丹们自十三世纪以来，一直与比萨、热那亚、威尼斯、阿拉贡及普罗旺斯保持着持续的商业与外交关系，先后签订一系列 #italic 特许状 #! ，允许欧洲商人在 $TUN$ 与古莱塔设立常驻代理商站。我们的宫廷接待基督教使节所用的礼节，与接待穆斯林同侪君主并无二致，仅意大利贸易带来的关税收入便占中央国库的三分之一。与基督教欧洲务实往来，使 $TUN$ 在商业与外交上具备了那些更为孤立自守的马格里布国家所不具备的灵活性。"
 gfs_pomegranates_dates: "石榴与椰枣"
 gfs_pomegranates_dates_desc: "加夫萨的石榴园，自伊本·赫勒敦时代起便以其果实硕大、味甜、耐储而闻名马格里布，加之我们绿洲带的椰枣树所产之果实，皆为突尼斯、的黎波里与西吉勒马萨的商队买家专门订购，而非随意以他物替代。我们的果园主世代持有棕榈与石榴各地块的租约。灌溉行会的工匠依照古老的分水表分配井水，我们的商队首领也依产地果园而非按批量来为每批货物定价。我们在果品出口上的专长，使我们的绿洲拥有一门小众奢侈贸易，是任何更广泛产果绿洲都无法从地中海高端市场中取而代之的。"
 tun_khaldunid_circle: "赫勒敦圈子"
 tun_khaldunid_circle_desc: "我们苏丹的突尼斯宫廷在伊本·赫勒敦青年时代便对其加以庇护——这位哲人兼史学家所著的#italic《历史绪论》#!比任何欧洲同类著作早了一个世纪，奠定了社会与历史分析的基础——此外，安达卢斯避难学者、北非卡迪史家，以及途经我都的东方乌理玛，皆汇聚于此，构成更广阔的学术圈。我们宫廷的藏书官编纂谱系，行政档案保存了日后史家所据的文书记录，而我们对伊本·赫勒敦同代学者的庇护，令突尼斯成为穆斯林世界学术书信往来的汇聚之地。赫勒敦学派的思想繁荣，为$TUN$一脉留下了那个时代其他马格里布宫廷都无法企及的文化遗产。"
 export_monopolies: "出口垄断"
 export_monopolies_desc: "贝伊掌控着#italic橄榄油#!、斯法克斯毛织品、靛蓝与$dyes$等染料，以及突尼斯浅滩干鱼的王室出口专营权，这些都是地中海市场无法从别处完全替代的大宗货物。我们的国库仓房在货物流入外国商行之前便加以集中管理，而我们的定价委员会所定的价格，意大利与普罗旺斯的买家要么接受，要么无从购得。王室出口专营为中央国库带来了稳定的外币收入，比波动不定的商队税收更为可靠。"
 gfs_saharan_corridor: "撒哈拉走廊"
 gfs_saharan_corridor_desc: "我们的绿洲地处西撒哈拉商路的地中海一端。来自图瓦特、塔菲拉勒特及撒哈拉腹地的商队皆汇聚加夫萨，而后北上萨赫勒海岸，或东进哈夫斯王朝腹地，我们的商号则以谷物、布匹与陶器为南行商队供给物资。我们的商队驿站同时接纳撒哈拉以南、柏柏尔与安达卢斯商人；我们的关税官员对过境货物课以适中税率，使商路保持有利可图；而我们的绿洲经济既依赖常驻果园，也仰仗季节性商队的到来。扼守沙漠商道，加夫萨在贸易与外交上日益强盛，这是任何纯粹的农业绿洲都做不到的。"
 tun_imperial_axis: "哈夫斯帝国轴线"
 tun_imperial_axis_desc: "我们的霸权横跨整个伊夫里基亚地区（突尼斯、贝贾亚、君士坦丁、的黎波里），由总督宗亲网络、纳贡的巴努·希拉尔附庸部落，以及常驻的基督教商人代理行共同治理，其关税收入供养着中央国库。我们的远地行政仰赖沿海的信号塔、内陆路线上的付薪信使，以及一套习惯法规——此法赋予各地总督极大自主权，以换取其及时缴纳贡赋。从突尼斯到的黎波里的总督链条，承袭了 $TUN$ 一脉遍及伊夫里基亚的帝国疆域，而此后继任何政权都未能完全恢复这一盛况。"
 gfs_berber_substratum: "柏柏尔底层"
 gfs_berber_substratum_desc: "我们的绿洲保留着鲜明的柏柏尔底层文化：加夫萨方言、旧氏族中的母系继承习俗、散布于欧尔巴塔山的前伊斯兰墓葬遗址，以及诸多显赫家族可追溯至前希拉尔时代泽纳塔部落的谱系。我们的阿拉伯语与柏柏尔语使用者同处一家之中，我们的习惯司法在马立克派教法之外，仍保留柏柏尔部落先例。口传传统留存着卡普萨文化与罗马之前的历史记忆，这是任何纯阿拉伯语的南方绿洲都无法拥有的。我们的双重文化遗产，使我们的城市文化呈现出一种混合形态，与更为彻底阿拉伯化的萨赫勒沿海城镇迥然不同。"
 tun_admiralty_reform: "海军部改革"
 tun_admiralty_reform_desc: "我们位于比塞大与法里纳港的国家造船厂，正式归入贝伊海军部统辖：以受薪的舰队军官取代私人特许的海盗船长，通过正式的船员名册组织萨赫勒沿海城镇水手的征募，并以更重型的桨帆船与盖伦船取代上个世纪所依赖的轻型劫掠船只。我们位于古莱特的海军学院，训练军官团掌握地中海战争如今所需的炮术与航海技艺，而我们的司库则直接从中央国库发放舰队薪饷，不再依靠缴获分成。国家统一组织的海军行政，为我们的后继政权留下了一支任何私人特许海盗传统都无法维系至火器时代的舰队。"
 tun_la_goulette_defense: "拉古莱特防御"
 tun_la_goulette_defense_desc: "我们的国家海军与古莱特驻军，抵御了火器时代地中海带来的接连不断的哈布斯堡—奥斯曼入侵：海雷丁·巴巴罗萨的首次占领、查理五世皇帝对我苏丹的复位，以及随后旷日持久的消耗战。我们的海军统帅与突尼斯城堡指挥官加固了港口的海面防线。宫廷外交官令两大敌对帝国相互牵制，以维护王朝自主，而常驻的安达卢斯工程师则按最新规格重新设计我方炮台。哈夫斯王朝的反帝防御，为 $TUN$ 一脉留下了后继政权可资借鉴的军事防御遗产。"
 gfs_oasis_chamber: "绿洲议事会"
 gfs_oasis_chamber_desc: "我们跨部族的 #italic 长老会 #!，由哈马马、弗拉希奇、奥拉德布亚希亚各部代表及本地城市显贵共同组成，每季于中央城堡集会，分配灌溉用水权、调解商队路线纠纷，并核定当代统辖我们的北方强权所应得的贡赋份额。这一议事会世袭而具咨议性质，我们的显贵们虽无俸禄，却可接受款待与惯例性馈赠，而我们的决议靠习惯法而非强制力约束与会各部。常设的跨部族议事会使我们这处边疆绿洲在政治上保持延续，这是单纯部落政权或单纯城市政权在我们这般暴露的处境中都无法做到的。"
 tun_husaynid_dynasty: "侯赛因王朝"
 tun_husaynid_dynasty_desc: "我们的王朝由侯赛因·本·阿里所创——他出身克里特—安纳托利亚血统，从代伊体制的军官之位一步步崛起——巩固了贝伊对禁卫军团、代伊与帕夏的统辖权，以世袭王统取代前几代轮换官员的统治方式。历代贝伊皆任命自幼在巴尔多宫受训的马穆鲁克顾问。行政改革将包税权集中至贝伊直接掌控之下，而我们与伊斯坦布尔的外交往来在形式上承认奥斯曼宗主权，实则行使自主权力。王朝的巩固为我国带来了历代轮换官员所无法提供的连贯而持续的行政体系。"
 tun_hafsid_continuity: "哈夫斯连续性"
 tun_hafsid_continuity_desc: "我们侯赛因王朝的历代贝伊宣称直接继承哈夫斯王朝原有法统的王朝正统性，依据宫廷学者编纂的谱系链、跨越奥斯曼摄政空位期仍保留的礼仪头衔，以及巴尔多宫廷官员可上溯经代伊直至末代哈夫斯苏丹的正式官职延续性。我们的册封仪式、外交国书，以及宫廷史家编年记述，皆确证这一哈夫斯—侯赛因正统延续，作为我们统治合法性的根基。哈夫斯列王一脉经由我们延续不断，任何对手摄政政权都无法声称拥有更古老的王朝渊源。"
 gfs_southern_intellectuals: "南部知识分子"
 gfs_southern_intellectuals_desc: "我们这一代改革派知识分子，生于加夫萨，受学于宰图纳，为首都的突尼斯复兴运动圈子贡献了通讯撰稿人、随笔作家与现代派法学家，以南方内陆绿洲的视角来平衡都城的声音。我们的小册子作者在新兴的阿拉伯文报刊上议论贝伊的财政政策，我们的法学学者则就海尔丁的改革法规撰写注疏。年轻的行政官员充任萨迪基学院毕业生在突尼斯开设的新机构。我们南方的知识分子为我们的绿洲带来了一种来自边地的改革与现代化之声，这是任何纯粹都城化的改革运动都无法捕捉到的。"
 tun_fundamental_pact: "基本契约"
 tun_fundamental_pact_desc: "#italic《安全公约》#!（在改革派压力下由我贝伊颁布的安全盟约）保障穆斯林、基督徒与犹太人在法律面前一律平等，人身与财产在司法程序下不受侵犯，并将先前政权凭个人裁量施行的赋税与征兵程序，正式加以法典化。我方改革派起草人借鉴坦齐马特改革与欧洲先例，却以古典阿拉伯—伊斯兰法律语言行文，使这份文件同时获得宰图纳乌理玛与巴尔多宫廷的认可。我们的贝伊如今依成文法统治，而周遭的马格里布与奥斯曼宫廷仍依习俗与敕令行事。"
 tun_caliphal_revival: "哈里发复兴"
 tun_caliphal_revival_desc: "我们的改革派圈子将哈夫斯哈里发的记忆重新唤起，作为一种意识形态资源：援引突尼斯作为西方哈里发都城的数百年历史、我们先辈自君士坦丁至的黎波里维系的伊夫里基亚霸权，以及令我们祖先有别于同时代任何马格里布王朝的普世主权主张。我们的小册子作者援引这一先例以对抗日益逼近的外来权力中心，而官方史书也将哈夫斯哈里发时代置于其后数百年历史之前。我们的现代派乌理玛通过这一恢复的哈里发世系，为改革方案的正当性溯源。王朝记忆的复兴，赋予 $TUN$ 一脉其他地方纯粹现代派改革运动所缺乏的意识形态遗产。"
 #Maghrebi Formables
 #Carthage
 cth_merchant_legacy: "腓尼基商业传承"
 cth_merchant_legacy_desc: "推罗、西顿与迦太基的 #italic 腓尼基 #! 商船队，将地中海编织成一个统一的商业体系长达半个千年，而卡塔赫纳的银币，支付了在哈米尔卡与汉尼拔麾下为我们作战的伊比利亚、努米底亚与巴利阿里雇佣军统领。我们的海事法继承了布匿海军统帅的惯例，我们的招募代理沿袭着同一批统领穿行西地中海的路线，而我们的司库仍采用那套以现金酬劳换取兵役、从而使布匿公民免于亲赴战场的旧制。商业与雇佣兵传统的双重遗产，令复兴的 $CTH$ 商人拥有广阔的贸易网络与足以支付军费的经济实力，这是任何新兴贸易国家都无法白手建立的。"
 cth_cothons: "瓶型巨港"
 cth_cothons_desc: "古代迦太基的 #italic 科松军港 #! 是一座圆形军用港湾，设有二百二十个避风泊位、干船坞，以及供海军统帅指挥的中央小岛，能在数日之内整备出一支完整舰队，却又从外海无法窥见。我们的造船工匠正在港底重建这同一套工程构造，将加的斯、利克苏斯、莫加多尔与塔罗斯的腓尼基侨民重新召回本土各城，为新出船台的船体配备船员。这些复建的科松军港，使 $CTH$ 获得了任何方形欧式兵工船坞都无法比拟的造船速度与丰厚的水手储备。"
 cth_legacy_of_hannon: "航海家汉诺的遗产"
 cth_legacy_of_hannon_desc: "汉诺航海家在公元前五世纪便航出赫拉克勒斯之柱，在西非大西洋沿岸建立了七处商站，向南推进至此后一切古典航行都未能企及的极限。他所著的 #italic 《航海记》 #! 以希腊文译本留存至今，至今仍记载着我方船长每次南航都能加以验证的港口、河口与近海地标。这一有据可查的远洋航行传统，为 $CTH_ADJ$ 探险家们留下了一部航路志与一套后勤范式，这是任何欧洲国家都无法声称从古代继承而来的。"
 cth_punic_global_trade: "迦太基全球贸易"
 cth_punic_global_trade_desc: "迦狄尔、利克苏斯与摩加多尔等古老的布匿殖民地，曾将我们的势力延伸至赫拉克勒斯之柱以外千里之遥，如今我们现代$CTH_ADJ$商业的触角已遍及各大航路所开辟的每一片海域。我们的代理人驻守于亚洲与美洲的#italic商埠#!，我们的商船队将油、酒与制成品运往每一个可通航的港口，我们的经纪人在从伦敦到果阿的每一个主要交易所结算票据。这种遍及全球的商业触角将$CTH$之名远播于殖民地的重洋之外，其出口网络之广，恐怕连我们腓尼基先祖都难以想象。"
 cth_sufet_rule: "民长制"
 cth_sufet_rule_desc: "古代迦太基由每年选举产生的两位#italic苏菲特#!（Šūfeṭīm，意为士师）治理，二人皆出自显赫商贾世家，并向三百人元老院与公民大会负责。我们对这一双执政官体制的复兴，将布匿模式历经考验的稳定性与现代共和时代的法律革新融为一体。悠久的共和传统，赋予$CTH$一种比任何意大利或荷兰新兴共和国都更为古老的宪政合法性。"
 cth_breadbasket_of_rome: "罗马的粮仓"
 cth_breadbasket_of_rome_desc: "几个世纪前，我们在灌溉和橄榄种植技术上的进步为迦太基赢得了“罗马粮仓”的称号。如今我们将汇集古代知识，再次与沙漠抗争，重现古代的橄榄园盛景。"
 #Kingdom of Africa
 koa_norman_heritage: "诺曼遗产"
 koa_norman_heritage_desc: "我们的行政与军事体制，承袭自十二世纪西西里的罗杰二世所建立的诺曼非洲王国——那个从马赫迪耶延伸至的黎波里、存续一代人便告覆灭的拉丁基督教短命政权。我们的宫廷枢密院保留着当年的特许制度，骑士采邑制也继承了诺曼-西西里封建体制在北非领土上的调适形态。我们的城堡建筑师建造着诺曼工程师最初引入马格里布海岸的方形塔楼。诺曼-西西里的遗产，为我们复兴的非洲王国提供了一套现成的统治范式，这是任何纯粹的马格里布继承政权都无法凭空建立的。"
 koa_latin_episcopate: "拉丁主教区"
 koa_latin_episcopate_desc: "北非古老的拉丁教会，曾在希波的奥古斯丁时代拥有近七百个主教区，孕育了伟大的多纳图派争论与拉丁神学的根基，如今在我们的庇护下得以复兴，成为一个积极向周边民众传教的活跃教会。我们的迦太基大主教召集各省宗教会议，传教士们以改编过的柏柏尔语和阿拉伯语方言深入乡间传道。每座主要城镇的主教座堂重建工程，都巩固着穆斯林与异教柏柏尔社群持续皈依拉丁礼的进程。复兴的拉丁主教区体系，使我们天主教治下的马格里布拥有一个不断壮大、广纳信徒的教会，将我们直接联系于西方基督教的奠基时代。"
 koa_papal_endorsement: "教宗认可"
 koa_papal_endorsement_desc: "我们的王国获得了正式的教宗背书：确认我们为马格里布正统基督教君主之地位的诏书、由圣座授予我们的叙任权，以及赐予一切支持王国防务之臣民的赎罪恩惠。我们的宫廷按固定礼仪接待教廷使节。致各天主教君主的外交信函皆盖有教宗合法性印玺，我们的王室也在每一场正式典礼上援引教宗敕令。教宗的背书赋予我们这个拉丁基督教王国一种外交与宗教上的合法性，任何穆斯林继承政权都无法从其自身神学体系内部予以挑战。"
 koa_military_orders: "军事修会"
 koa_military_orders_desc: "医院骑士团、马耳他骑士团，以及圣殿骑士团的后继诸会，皆已纳入我们王国的防御体系：由重兵设防的骑士团驻地网络支撑着我们沿海与内陆的防务，海上天主教列强持续派来增援的常备武僧团，以及将缴获的穆斯林船只反用于打击柯尔索海盗国的舰队与要塞一体化体系。我们的大团长与指挥官列席王室议会，常驻骑士则戍守每一处重要要塞。教宗的捐赠资助着这些骑士团的永久建置。军事与宗教骑士团的联合，赋予我们王国一种纯粹封建征召体制所无法独力提供的防御力量。"
 koa_feudal_estates: "封建领地"
 koa_feudal_estates_desc: "我们的封建土地保有制度——授予效忠王室的贵族的特许采邑、附带依附农民的庄园领地组织，以及由王室经大领主下达至地方领主的指挥链——已以调适后的形式施行于我们的北非领土，取代了先前马格里布诸政权所沿用的古老部落与贡赋体制。我们的枢密院勘查各庄园领地，确认各采邑之疆界，大领主法庭则调解各领地间的争端。我们的佃农阶层已习于庄园日常事务，遵循着以谷物与葡萄为主的凉季经济农事历法。此封建与行政体系，赋予我们王国一套土地保有与效忠的秩序结构，迥异于我们周遭那动荡不安的部落版图。"
 koa_catholic_mission: "天主教传教"
 koa_catholic_mission_desc: "我们成熟的传教网络——方济各会与多明我会的布道修会、在拉丁语之外兼授地方方言的传教学校，以及沿海岸直至内陆维系各传教站的宗座代牧驻地——展现出历代皈化事业累积而成的深厚底蕴。我们的神学院培养出身皈依家庭的本地拉丁礼神职人员。各项捐赠支持着保障新皈依基督徒司法地位的《护教者宪章》，方言要理问答书亦流通于王国各堂区学校。此传教网络为我们王国供应训练有素的神职人员，并巩固了先前数世纪宗教与文化事业的成果。"
 #Maghreb Region
 city_of_scholars: "学者之城"
 city_of_scholars_desc: "我们马格里布的伊斯兰经学院——$fez$的#italic卡拉维因学院#!、$tunis$的#italic宰图纳学院#!、$tlemcen$的#italic塔什菲尼耶学院#!——自十三世纪以来，便从$maghreb_region$各地吸引着学子与学者。我们的法学家师从传承谱系可追溯至$cordoba$的大师，修习#italic马立克派教法学#!，我们的天文学家、医师与语法学家则与从$cairo$到$fez$各地的同侪保持书信往来。持久不衰的学术生命，使我们的宫廷成为中西马格里布的智识中心。"
 slave_raid_advance: "沿海劫掠"
 slave_raid_advance_desc: "我们马格里布的港口向#italic拉伊斯#!——那些悬挂我方旗帜、巡弋于西地中海与大西洋沿岸的柯尔索海盗船长——颁发许可，令其劫掠基督教船只以获取奖赏金，并掳获基督教水手充实我方的奴隶市场。我们将在港口装备轻型三桅帆船与桨帆船编队，将每次劫获的一部分纳入王室国库，并任由三位一体会与仁慈会的修士为我方船长所扣押的俘虏赎身。这种柯尔索经济以奖赏金与赎金收入资助国库，其规模之大，绝非沿海诸省的常规课税所能企及。"
 hispano_moresque_style: "西班牙‑摩尔风格"
 hispano_moresque_style_desc: "两个世纪以来，逃离基督教前线的安达卢西亚工匠已定居于我们的马格里布诸城，将他们的瓷砖镶嵌、木雕与灰泥装饰技艺带入我们的清真寺、经学院与宫殿。我们大清真寺的阿尔摩拉维德讲坛、王室宫廷的花边拱门，以及圣祠的葬礼穹顶，无不带有鲜明的#italic西班牙-摩尔式#!印记。安达卢西亚艺术的涌入，为马格里布诸宫廷注入了足以比肩$granada$本身的审美情趣，并为$maghreb_region$的高雅文化树立了标准。"
 mor_marabouts: "苏菲隐士"
 mor_marabouts_desc: "#italic马拉布特#!——#italic卡迪里耶道团#!、#italic沙兹里耶道团#!与#italic提加尼耶道团#!的苏菲教团谢赫——已在马格里布乡间各地建立起#italic扎维亚#!道堂，在那里讲学、仲裁纠纷，并引导民间宗教情感。他们的陵墓成为朝圣之地，其在世的继承者所持有的道德权威足以与城中法学家相媲美，而他们对某位统治者的认可，便能在部落乡野间赋予该统治者以合法性。这种遍布乡村的苏菲权威网络，使每一个$maghreb_region_ADJ$国家无需直接的行政渗透，便能在每一个村落都拥有宗教存在。"
 slave_soldiers: "奴隶士兵"
 slave_soldiers_desc: "自十四世纪以来，$tunis$的哈夫斯王朝苏丹或$tlemcen$的扎延王朝埃米尔，便已组建起由#italic古拉姆#!与#italic马穆鲁克#!式侍从构成的军团，他们或购自黑非洲市场，或掳自对基督教伊比利亚的劫掠，或作为先前奴隶兵之子而生于此制度之中。这些军人只效忠于统治者本人，而非部落或地方，使其成为对抗那支在王位继承纷争中让任何马格里布苏丹都无法完全信任的动荡#italic希拉尔部族#!军队的可靠砝码。军事奴隶制度为我国提供了政治上可靠的步兵与骑兵，这是任何纯粹的部落军队都无法做到的。"
 trans_saharan_trade: "跨撒哈拉贸易"
 trans_saharan_trade_desc: "跨撒哈拉 #italic 商队 #! 路线的北端终点——西吉尔马萨、瓦尔格拉、特莱姆森、加达梅斯与的黎波里——皆坐落于我们的疆土之上，将来自苏丹地区的班布克与布雷金沙、$slaves_goods$ 与象牙汇聚于我们的市场。我们的 #italic 贾拉巴 #! 商人为穿越沙漠的旅程提供资金，我们的铸币厂在王室专营之下，以流入的黄金铸造金质 #italic 第纳尔 #! ，我们的转口贸易则将苏丹商货再分销给地中海与大西洋沿岸的买家。这种对撒哈拉经济北半部的主导地位，使每一个马格里布国家都兼得贸易路线收益与铸币声望，这是任何纯粹的地中海王国都无法比拟的。"
 rais_of_the_navy: "海军的拉伊斯"
 rais_of_the_navy_desc: "我们的柯尔索船长，即 #italic Ra'īs #! ，远不止是海盗：他们是久经沙场的海军指挥官，其航海经验滋养着深厚的海事传统，壮大着我们海军引以为傲的遗产。我们的海军部让每一位有前途的年轻船长都在一位老练 #italic Ra'īs #! 的麾下受训，使这套任何正规海军学院都无法复制的实用航海知识得以代代相传。专业船长的高度集中，赋予马格里布诸国一支单凭内陆国库的正规训练资金所无法培养出的海军军官团。"
 algiers_ojaq_janissaries: "$a_algiers_ojaq_janissaries$"
 algiers_ojaq_janissaries_desc: "$a_algiers_ojaq_janissaries_desc$"
