 hellenism_religion.31.desc: "在众神的指引下，我们可以祈求新的神谕，以襄助前征。"
 invoke_omen_with_god: "祈求[Player.GetGodInvokingOmen.GetName]的神谕"
 invoke_omen_with_god_desc: "在[Player.GetGodInvokingOmen.GetName]的指引下，我们将能够祈求一道新的神谕来帮助我们前行。\n在一切可能的神谕之中，[Player.GetGodInvokingOmen.GetNameWithNoTooltip]会选择哪一道作为真正的谕诏？请谨慎抉择。"
 #Institutions
 feudalism: "封建制度"
 feudalism_desc: "随着时间的推移，大部分的社会都逐渐需要一种更为强力且持久的政府体系。在罗马帝国分崩离析之后，出现的一些政府体系以及习惯满足了这一诉求，而这也被认为是欧洲封建体系的一部分。\n\n由于相似的原因，世界各地都建立起了相应的长期政府以及社会体系，其中一部分体制甚至可以追溯到封建制度出现之前。"
 legalism: "律法主义"
 legalism_desc: "在中国，法家思想蕴含的理论已经融入社会结构成百上千年。以纯粹的理想主义佐以压倒性的内部稳定才是富国强兵之道的观念，已深深根植于东亚地区的思想领域之中。\n\n然而，随着商人和迁徙者带来的思想交流，律法主义的理念传遍了整个伊斯兰世界，并促使伊斯兰国家采取了穆斯林和异教徒共存相处的政策。\n\n在欧洲，律法主义见证着伟大的罗马帝国从一个垂垂老矣的残存国家到为世人留下宝贵的法律源流遗产。这些遗产中的许多内容后来成为了整个旧大陆现代法理学的基础。"
 meritocracy: "任人唯贤"
 meritocracy_desc: "许多德隆望尊、身居高位的人往往选择任命与自己亲近的人担任重要职务。\n\n然而，作为一场掀起了思想运动并最终形成规章制度的思潮，唯贤主义在中华帝国的宫廷中十分盛行。在中国，孔子本人支持统治者应当以功绩和品质，而非血缘和出身作为任命的标准。\n\n这使得贵族血缘政治在中国早早让位于任人唯贤的精英政治。这一思潮的发展与传播将波及亚洲之外的地区，并最终影响到欧洲王室的宫廷——在那里，权力与权威仍牢牢把握在贵族们手中。"
 renaissance: "文艺复兴"
 renaissance_desc: "自十四世纪以来，意大利诸城邦的财阀世族们就一直对有意探索他们古希腊与古罗马祖先社会的艺术家和学者们进行赞助。\n\n文艺复兴作为一场文化运动，其思想已经深入并且广泛传播在意大利各地，同时对文学，艺术，哲学以及音乐产生了深远的影响。人文主义学者们也在研究分析他们所生活的社会，将其与古典哲学理想进行比较。文艺复兴人文主义已经发展成熟，即将渗透至社会的各个方面。\n这种新思想的影响不仅是对统治者的，更是对被统治者的。藉由早期印刷机的帮助，这些全新的理念迅速传播。\n\n真正的文艺复兴时代人文主义者须通晓方方面面，不仅要专精于政治与哲学，更要涉猎艺术、文字分析、音乐、建筑。如今，文艺复兴正准备重塑整个世界，让它朝着其古典主义的理想迈进。"
 banking: "银行系统"
 banking_desc: "自第一枚铸币从熔炉中打造而出，借贷便随之产生了。然而，这样的信用关系长期局限于个人和家族群体，以及一些古代国家内部。随着中世纪亚欧大陆及其周边外延的长距离商业活动重新发展起来，信用与借贷迎来了飞跃。\n\n随着犹太社区在基督教世界和穆斯林世界之间广泛活动，职业放贷人开始组织起来。而在12世纪的十字军东征之后，信贷需求的激增鼓励了意大利城邦的商人们去建立更庞大的信贷组织，第一批银行机构，如佩鲁齐家族和巴尔迪家族，便随之产生。\n\n更多的金融工具，像汇票和债务债券被发明出来。而像美第奇家族、富格尔家族和韦尔瑟家族这样的金融世家很快将变得名副其实地富可敌国。"
 professional_armies: "职业军队"
 professional_armies_desc: "从数千年前战争被发明以来，军队便随之诞生。然而，几个世纪以来，它的形式发生了巨大的变化，在不同的文化和不同的时期，军队的组织形式和招募方式各式各样。\n\n直至中世纪晚期，绝大多数国家的军队都依赖于封建社会结构的征召体系，骑士和时令性征召的步卒构成了军队的核心。然而，在一些地区的国家足够强大，以支撑起一支招募职业士兵，全年脱产执勤的常备军。\n\n在百年战争爆发之后，这一军事制度也在欧洲发展起来，并成为推动近代早期军事革命的主要变化之一。世界各地的统治者们很快将面临两个重大的挑战，那就是一边扩大常备军的规模和质量，一方面寻找维护这么一支常备军的新财政来源。"
 new_world: "发现新大陆"
 new_world_desc: "新大陆的发现预兆着一个新时代的到来，这不仅对于殖民者和被殖民者来说是如此，也意味着原材料与科技迅速传播，人们认识到脚下的星球竟有如此广袤。随着许多动物，农作物，白银，当然还有各类疾病开始穿梭在大西洋两岸的世界，人类终于向经济全球化迈出了第一步。当陌生的土地出现在地图上，当陌生的民族被记载下来，我们的理念，我们的宗教与哲学之辩也越来越受到这些远洋社会的影响。一些伟人开始思考那些人们一度确信的真理是否存伪，于是，从巴利亚多利德至法塔赫布尔西格里，思想家们纷纷开始讨论起世界的本质。"
 printing_press: "印刷机应用"
 printing_press_desc: "大量印刷文字的能力将彻底改变信息的传播方式，并在各个方面改变近代社会的整体。在文艺复兴的时代，像威尼斯印刷商阿尔杜斯·马努提乌斯这样的人所发明的新技术让译制经典更加易于传播，进一步推动了那场运动的进程。后来，由于圣经的新译本以及相关的重要著作通过印刷术迅速传播开来，宗教改革的进程也从这项技术中获益。\n\n如今，印刷技术已经发展成熟，并且已经布及欧洲各地，从宗教和政治小册子，到科学论文、行为指南，成千上万的各式各样的印刷品在欧洲大陆上广泛流传着。随着印刷行业的逐步壮大，越来越多的统治者发现自己难以管控这一项新技术，因为这些生产技术相对简单，印刷商若想要逃脱审查，只需把生意移到边境线之外，甚至只用改变书的标题，都不是什么难事。"
 pike_and_shot: "枪刺与射击"
 pike_and_shot_desc: "在15世纪末的意大利战争期间，一种新型的战争形式得以发展。在中世纪晚期，一方面，以火绳枪和滑膛枪为主的便携式火器得以发展；一方面，长枪兵取代了短兵器步兵，这种擅于抵抗重骑兵冲锋的兵种被广泛使用。士兵们现在采取了一种新的阵型，即长枪兵排列方阵，火枪手在阵型两翼和正前方分散射击，并在敌方逼近时退回方阵内或方阵后寻求掩护，以防军阵进入近距离搏斗。这种新型军阵被称为“长枪与射击方阵”，首先被德意志雇佣兵和西班牙大方阵所青睐，并很快被其他军队所采用。这种方阵统治了欧陆战场将近两个世纪，直到18世纪被装配新型燧发火枪和刺刀的线列步兵阵型所取代。"
 confessionalism: "认信主义"
 confessionalism_desc: "长久以来，$catholic$都被视为一个团结统一的实体，直到$protestant$信仰的出现结束了这一局面。随着对信仰应有的形态的多种不同解释的出现，$christian$世界再难被称为“统一”。从前，任何偏离罗马教会的行为都能轻率地被判决以“异端”的责罚，而现在，这些造成差异的界限已经越来越模糊不清。\n\n因此，不仅是教会当局，世俗政权也越加感兴趣于将他们各自的信仰形态进行明确的定义，并在宗教生活和现实生活的方方面面执行他们所定下的观点与规则。这些权威对本国人民的信仰施加了愈加牢固的控制，与其他教派之间的差异与敌意也愈加滋生。"
 global_trade: "全球贸易"
 global_trade_desc: "自古以来，货物便在不同大陆间流转不息。然而过去的贸易活动仅局限于特定路线与商品——例如来自$india$和$CHI$的制成品，只能通过$indian_ocean_continent$与丝绸之路进行流通。而今，贸易格局正逐渐融入更广阔的世界网络。随着美洲大陆的发现、环绕$africa$海上航线的开辟，以及横跨$pacific_ocean_continent$的远洋通航，原本分散的区域贸易网络正被紧密编织成一张覆盖全球的互联体系。\n\n来自$andes_region$开采的$silver$正经由$europe$运往$CHI$与$india$，在$scandinavian_region$冶炼的$iron$正由$ENG_ADJ$商贩销往$west_africa$，更有商人仅通过向$south_east_asia$分销$cloth$与香料便积累起惊人财富。$india$商贾甚至已开始注资欧洲未来的贸易项目！虽然谈论真正意义上的全球经济或许为时过早，但毫无疑问，这颗种子早已悄然扎根。"
 artillery_institution: "炮兵应用"
 artillery_institution_desc: "火药的发明起源于$CHI$，由此催生出利用其爆破威力的战争装置——火炮。虽然13世纪时火炮已传入$europe$与$asia$地区，但直到15世纪才真正被广泛用作武器系统。随着炮管长度的增加与火药配方的改良，火炮威力显著提升，足以对$europe$普遍存在的石砌城堡与防御工事构成有效威胁。此后不久，火炮不仅用于攻城作战，更现身于野战战场：凭借出色的机动性，小口径火炮得以快速部署运用。直至18世纪，尤其是在拿破仑于关键战役中精妙运用火炮战术后，这一兵种才最终发展为决定战场胜负的核心作战体系。"
 manufactories: "工场生产"
 manufactories_desc: "十六、十七世纪的一系列技术创新提高了诸如铁、布料等商品的产量，但是生产方面最大的创新却在于各种新的组织方式。商业资本家们在城市之外建立起一座座工场，规避着那些限制大规模生产的行会规则，同时还能开拓增加生产效率的新方法，比如集中一处进行劳动的组织化和专业化。这些未来工业革命的先驱们并没有依靠昂贵的新机器来提高工业的产出，而是依靠发掘获得原材料的便捷途径，以及组织大规模的生产活动来达到自己的目的。相对于老旧而又限制较多的旧制度，这无疑是一次巨大的革新，与之后的科技革命一道，这一全新的模式又会为这个社会带来巨大的变革。"
 scientific_revolution: "科学革命"
 scientific_revolution_desc: "显而易见的是，如今的世界变得比我们历代先辈所见的还要更小。全球性的贸易活动和印刷产业的兴盛促进了人员与思想的流动，使得知识得以更广泛地传播，这反过来也促成了人们对现实世界更为彻底的审视与怀疑。曾经被视为事实的东西现在被质疑，曾经理解不清的东西现在被观察，曾经只是普遍认同的东西现在被检验。\n\n近年来人类在数学、物理和生物学等领域的进步是无可争辩的，然而，真正革命性的飞跃是对科学本身的认识观与方法论的变化。系统性的实验才是真正的科学革命，即一场真正改变我们对世界看法的革命。"
 military_revolution: "军事革命"
 military_revolution_desc: "16至17世纪影响全欧陆的持续战争状态导致常备军的规模急剧增加，这一趋势也是互不相让的专制政权们权威扩张的必然结果。步兵现在淘汰了旧的长枪与射击方阵，统一列装了燧发火枪，并以新式阵型部署，这大大提升了他们的战斗火力与战场表现。这一军事进步同样考验着国家行政当局的能力，持续扩大的军队规模对于人力和财政都造成了巨大负担。除此之外，一种用于支援军队作战的补给仓库得以出现，并逐渐发展出为军队提供粮食与给养的供应链。这些进步的结果无非是，在即将到来的18世纪，军事化程度日益增强的国家之间战争的频次和烈度都急剧增加了。"
 enlightenment: "启蒙运动"
 enlightenment_desc: "在上一个世纪，理性主义和经验主义受到了越来越多的伟大思想家的推崇。不论是君主，是科学家，还是文学家，无论在信件中，在书本中，还是在咖啡馆里，都在讨论着开放包容，科学方法以及启蒙思想的传播能够给全人类带来的美好未来。从知名大学，到开明君主的宫廷，四处都有人在给这个世界进行科学测量、分类、称重和制图，以便于我们更好理解的世界运转的规律。同时亦有许多的人探讨着社会运转的规律，试图就人权的含义达成一致。\n\n为了全人类的福祉，一些伟大的项目开始实行，比如修订包含一切知识的百科全书或者完成世界上所有动植物和真菌的图鉴。理性之光已经点亮，对许多人而言，他们的使命就是马不停蹄地让这束光芒照亮地球的每个角落。"
 industrialization: "工业革命"
 industrialization_desc: "18世纪的初期，人类对于增长的渴求不断增加，许多新的制度应运而生。生产制造领域的进步与复杂机械的发明正在世界每个角落改造着我们所熟知的这个世界。如火如荼的工业革命不仅体现在工业和商业领域，同时也为社会本身的结构带来了持久的变化。而像动力织布机和蒸汽机这样的发明更是将人类文明的生产力提升到前所未有的顶峰。"
 levee_en_masse: "全民动员"
 levee_en_masse_desc: "战争是一个不断演化的概念，它经历了一代又一代的创新与磨砺。18世纪见证了各个世界强权的崛起和他们贪婪扩张的雄心。侵略与野心的锻炉呼唤着年轻的躯体作为供养的燃料。新的全面征兵法案将付诸实施，以将全国所有未婚男子征募在其麾下，他们的规模将足以屈折历史的进程。"
 #Generic Advances
 #No Institution
 alchemy_advance: "炼金术"
 alchemy_advance_desc: "炼金术的技艺涉及使用草药、矿物和其他天然成分组合来制作药水和长生不老药。虽然并不总是可靠，但炼金术有时可以在治疗各种疾病方面产生显著效果。"
 apothecary_advance: "$apothecary$"
 apothecary_advance_desc: "$apothecary_desc$"
 army_country_movement_speed_advance: "侦察小队"
 army_country_movement_speed_advance_desc: "通过使用骑马侦察兵，我们可以探查部队前方的地形，并据此规划军队的机动。这使我们能够以比其他军队更快的速度穿越相同的地点。"
 bronze_working: "青铜铸造"
 bronze_working_desc: "青铜是铜和锡的合金，它的发现与发展使工具和武器更加耐用。同时，与铜相比，青铜更具延展性，也更容易加工。"
 cathedral_advance: "主教座堂"
 cathedral_advance_desc: "主教座堂是最大的，也是最重要的基督教圣殿，主教在其中设有宝座。教堂可以精美而细腻，但主教座堂却庄严宏伟，规模巨大，每个角落都精致无比。"
 chancery_advance: "秘书室"
 chancery_advance_desc: "秘书室是中世纪统治者为管理领地而设立的官僚机构，随着社会变得更加复杂，管理难度增加。秘书室的主要职能是书写、发送和接收与领地管理相关的文件。"
 city_building_advance: "城镇"
 city_building_advance_desc: "市中心的发展是城市化运动的核心，其目的是建造一大片错综复杂的建筑物。"
 colonies: "殖民地"
 colonies_desc: "无论是将我们的人民派遣到新土地进行定居，还是令在我国治下的土著定居，或两者兼有，建立一个殖民地使我们在某一地区获得一个立足点，并进一步扩大控制。"
 construction_speed_traditions: "石匠大师"
 construction_speed_traditions_desc: "城市建设永无止境，村镇发展亦不容停滞。雇佣一位能监督规划施工的资深石匠统筹全局，才能在疆域拓展中实现质的飞跃。"
 cultural_acceptance_advance: "文化认可"
 cultural_acceptance_advance_desc: "当我们去接纳和吸收其他民族，显而易见的是，他们的外来传统可能会同我们的传统产生摩擦。解决这一问题的一个简单思路是去包容这些外来民族，并试图将他们如同我们的亲人般去对待。"
 cultural_traditions_law_advance: "$cultural_traditions_law$"
 cultural_traditions_law_advance_desc: "$cultural_traditions_law_desc$"
 diplomatic_capacity_traditions: "外事档案"
 diplomatic_capacity_traditions_desc: "外交事务的常规运作离不开详尽的文书往来与人脉档案的缜密记录。"
 distribution_of_power_advance: "$distribution_of_power_law$"
 distribution_of_power_advance_desc: "$distribution_of_power_law_desc$"
 fine_metals_mining: "贵金属开采"
 fine_metals_mining_desc: "得益于发现与发展新金属合金，能够在更大规模上提取和利用新型贵金属，与其他类型的采矿相比，这一过程极具盈利性。"
 guilds: "同业行会"
 guilds_desc: "行会是商人或工匠的协会，他们为了互相保护、援助以及追求自己的利益而走到一起。行会对其商品和贸易实行垄断，并为商品的质量和价格制定标准。"
 industry_promotion_advance: "产业赞助"
 industry_promotion_advance_desc: "凭借已成立的行会和遍地的商贾网络，王室可以积极鼓励选定行业的发展，将投资和工艺引向它希望繁荣的手艺。"
 library_advance: "图书馆"
 library_advance_desc: "$library_desc$"
 mapmaking: "制图"
 mapmaking_desc: "在纸张或卷轴上绘制地点或国家不仅仅是一门艺术，更能收集其中信息以供战略使用。知晓各个地点的位置，不仅能让我们更好地协调进攻，还让我们更好地了解自己的领土。正如长者所说，知识就是力量。"
 mining_law_advance: "$mining_law$"
 mining_law_advance_desc: "$mining_law_desc$"
 minting_trade_range_trad_building: "贸易拓张计划"
 minting_trade_range_trad_building_desc: "与外国的贸易是我们国家的命脉。通过精心规划贸易路线并为每次航行储备足够的物资，我们可以到达距离我们本土更远的市场。"
 more_merchants_age_of_trad: "商业公会"
 more_merchants_age_of_trad_desc: "行会组织长久以来深刻塑造着我国的经济格局。虽然工匠组建行会已成惯例，但商人群体却尚未形成相同传统。我们应当推动商人建立行会体系，以此整合我们的商业发展目标。"
 organized_religion: "改进的宗教组织"
 organized_religion_desc: "宗教在每个社会中都扮演着重要角色，但并非每种信仰都有相同的结构。组织化的宗教具有系统建立的仪式和信仰体系，并遵循定义明确的教义。"
 paper_guild_advance: "造纸师行会"
 paper_guild_advance_desc: "$paper_guild_desc$"
 paper_guild_fiber_pulp_maintenance_advance: "$paper_guild_fiber_pulp_maintenance$"
 paper_guild_fiber_pulp_maintenance_advance_desc: "通过使用诸如大麻或构树等纤维植物，纸张的生产将变得在全球范围内广泛普及。尽管生产成本低廉，但这种纸的质量有所欠缺。"
 peasant_connections_advance: "乡镇联系"
 peasant_connections_advance_desc: "我们的商人已与境内外的乡村聚落建立了联系。因此，他们能够以优于预期的价格获取粮食等物资。"
 road_building: "道路建设"
 road_building_desc: "货物、军队和人员的运输对我们的生存至关重要。开发最基础的道路网络后，我们至少可以接触到我们的人民，并协助他们的日常工作。"
 rural_rgo_traditions: "整治荒地"
 rural_rgo_traditions_desc: "要开发边疆地区的经济潜力，就必须对其进行有效治理。这不仅能拓展民众的生存空间，还可提升他们对国家的经济贡献。"
 scholasticism: "古典经院哲学"
 scholasticism_desc: "经院哲学基于亚里士多德的逻辑和早期基督教教父的著作，旨在通过强调宗教教理的信仰和传统来传播知识。"
 scriptorium_advance: "抄写室"
 scriptorium_advance_desc: "$scriptorium_desc$"
 state_administration_advance: "国家行政"
 state_administration_advance_desc: "只要我们知道人们住在哪里，以及哪些地方习俗和法律适用于民众，对我们的人口征税就是可行的。因此，有必要引入一套管理领土的系统。"
 subjects_advance: "属国"
 subjects_advance_desc: "将地方政府的管理权下放给属国是一种可以接受的方式，既可以防止他们叛乱，又可以从他们那里榨取宝贵的贡品。"
 taxation_advance: "赋税"
 taxation_advance_desc: "文明社会的运行意味着维持中央权威。通过向臣民和公民征税，我们将能够以有效的方式运作。"
 trade_advance_age_of_trad: "贸易集市"
 trade_advance_age_of_trad_desc: "随着中世纪贸易路线的恢复和发展，新兴的贸易集市开始出现。这些大型活动每年在城镇和城市举行，来自不同地方的商人可以在此会面并达成交易。"
 weapon_guild_advance: "$weapon_guild$"
 weapon_guild_advance_desc: "$weapon_guild_desc$"
 #Feudalism Institution
 advanced_mining: "先进采矿"
 advanced_mining_desc: "更先进和耐用的工具的发展，可以进一步扩展矿产和金属的开采。"
 agriculture_advance: "农业"
 agriculture_advance_desc: "土地是财富、繁荣和产品的最大来源之一。为了促进社会进步，养活人民并实现繁荣，我们必须学会如何利用它。"
 castle_advance: "城堡"
 castle_advance_desc: "$castle_desc$"
 faster_levy_recruitment: "义务武器训练"
 faster_levy_recruitment_desc: "所有男性农民都被要求熟练掌握长矛或弓箭，并定期接受训练，以便在被征召入伍时成为一名有用的士兵。"
 feudalism_advance: "封建制度"
 feudalism_advance_desc: "封建制度是一种以效忠和劳役换取领地权的政治体制，是一种权利与义务的集合，并以一种组织严密的社会模式将社会中的每个个体连结到一起。"
 fort_limit_1_advance: "城堡长制度"
 fort_limit_1_advance_desc: "由官方任命的城堡长官专门负责管辖当地要塞及驻军，这标志着首个系统化的堡垒管理体系正式确立。"
 horse_riding_advance: "马术"
 horse_riding_advance_desc: "训马彻底改变了人类移动和携带重物的方式。在战斗中，马匹不仅为骑马的战士提供了更快的移动速度，还提供了更高的攻击范围或者以坐骑的重量对敌军进行碾压。"
 iron_working: "炼铁"
 iron_working_desc: "铁是制造各类工具和武器的关键材料。它不仅成为每个村庄中铁匠交易的核心物资，更是大型制造产业链中不可或缺的重要元素。"
 local_smelters_advance: "$local_smelters$"
 local_smelters_advance_desc: "$local_smelters_desc$"
 metallurgy: "冶金"
 metallurgy_desc: "冶金术，或操作和处理不同金属的能力，是任何先进文明发展的关键因素之一。与简单的石头相比，金属工具和武器在其功能上更为优越，能够提高工人和军队的效率。"
 mining_advance: "采石场"
 mining_advance_desc: "采矿自人类诞生以来就是一项基本的经济活动。金属加工得到广泛利用，进一步凸显了勘探和开采各种矿物和金属对于复杂社会发展的重要性。"
 ranching: "畜牧"
 ranching_desc: "得益于畜牧业发展，大规模饲养马匹成为可能，从而培育出最适合旅行、战争以及许多其他任务的优良动物。"
 republican_assembly_advance: "共和议会"
 republican_assembly_advance_desc: "只要我们依然希望国家由拥有高尚美德的、卓越的人们来治理。作为共和国的核心的$republican_assembly$就是至关重要的机构。"
 royal_court_advance: "王宫"
 royal_court_advance_desc: "$royal_court_desc$"
 ship_building_advance: "船舶建造"
 ship_building_advance_desc: "海洋蕴藏着许多冒险、财富以及商业和扩张的机遇。"
 unlock_archers_advance: "$a_archers$"
 unlock_archers_advance_desc: "$a_archers_desc$"
 unlock_armored_horsemen_advance: "$a_armored_horsemen$"
 unlock_armored_horsemen_advance_desc: "$a_armored_horsemen_desc$"
 unlock_camel_1_advance: "$a_light_camelry_1$"
 unlock_camel_1_advance_desc: "$a_light_camelry_1_desc$"
