 unlock_camel_6_advance: "$a_light_camelry_6$"
 unlock_camel_6_advance_desc: "$a_light_camelry_6_desc$"
 unlock_cog_advance: "$n_cog$"
 unlock_cog_advance_desc: "$n_cog_desc$"
