l_simp_chinese:
 expedition_category_exploration: "探索扩张"
 expedition_category_commercial: "商业"
 expedition_category_military: "军事"
 expedition_category_religious: "宗教"
 expedition_category_diplomatic: "外交"
 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "每月改变[MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2]，来自于："
 EXPEDITION_VARIABLES_TT_TITLE: "探险变量"
 pilgrimage_expedition: "大朝圣"
 pilgrimage_expedition_desc: "我们的统治者将启程前往[ShowReligionAdjective('catholic')]信仰的圣地朝圣。"
 pilgrimage_expedition_historical_info: "从公元4世纪起，耶路撒冷便开始吸引基督教徒前来朝圣。彼时，君士坦丁大帝下令在耶稣基督受难、埋葬及复活的原址上修建了圣墓教堂。在十字军东征期间，这座城市几经易手：它于1099年被第一次十字军攻占，1187年被萨拉丁夺回，1229年通过腓特烈二世的谈判短暂收复，但最终落入了马穆鲁克的控制之下。然而，即便基督教失去了统治权，圣地的各个圣所依然通过外交协议对朝圣者保持开放。这使得耶路撒冷在整个中世纪，始终是天主教信仰最至高无上的朝圣地。"
 pilgrimage_expedition_outcome_overview: "$BULLET$我们的[ruler|e]每抵达一处[holy_site|e]便可获得奖励，从[legitimacy|e]、[prestige|e]到[ShowEstateTypeName('clergy_estate')]的感激。\n$BULLET$完成朝圣后，将根据朝圣的虔诚程度授予以下奖励：\n$BULLET_WITH_TAB$最高#G +5#![legitimacy]\n$BULLET_WITH_TAB$[ShowEstateTypeName('clergy_estate')][estate_satisfaction|e]\n$BULLET_WITH_TAB$提高[GetCountry('PAP').GetName]的[opinion|e]"
 piety: "虔诚"
 piety_desc: "朝圣的虔诚程度。它在旅途中逐渐消退，并一路上被世俗的选择消耗掉。如果它完全耗尽，朝圣就会沦为耻辱；如果保持得高，它就会放大朝圣最终得到的回报。"
 retinue: "亲卫队"
 retinue_desc: "朝圣君主的护卫队。它不会自行损耗，只会因路上的不测遭遇减员。如果护卫队彻底折损殆尽，君主就会陷入毫无防备的危险境地，朝圣也随之失败。"
 pilgrimage_expedition_cooldown: "大朝圣"
 holy_site_pilgrimage_expedition: "前往圣地朝圣"
 holy_site_pilgrimage_expedition_desc: "我们的统治者动身前往一处选定的圣地，去那里祈祷，让民众看到自己祈祷的模样，再带着这段旅程带来的声望和宗教影响力返程。需使用朝圣行动启程，而非探险界面。"
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$抵达选择的[holy_site|e]会根据我们的[religion|e]给予奖励：\n$BULLET_WITH_TAB$#G +10#![religious_influence|e]、[purity|e]或[karma|e]，受圣地与我国首都的距离修正，最多#G +100#!\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]宗教会根据[holy_site]的[god|e]的性质，改变#Y 20#![yanantin|e]\n$BULLET_WITH_TAB$符合条件的[ShowReligionGroupAdjective('muslim')]教派会向[ShowSocietyDirectionName('mysticism')]或[ShowSocietyDirectionName('jurisprudence')]改变#Y 10#!"
 holy_site_pilgrimage_expedition_order_zeal_tt: "未来数年，朝圣者在这片领地上的虔诚将激起守护此地的修会的热忱"
 holy_site_pilgrimage_cooldown: "前往圣地朝圣"
 treasure_fleet_expedition: "宝船队"
 treasure_fleet_expedition_desc: "派出宝船队，前往选定的区域执行国事航行。船队沿着近海航道驶向目的地再返航，沿途停靠外国港口。这次航行将拓展宫廷的外交覆盖范围，向南洋的君主分发礼物和[ShowGoodsName('silk')]，收缴朝贡，最终带回珍稀货物、使节，以及那些听闻过中国帆影的君王的名录。"
 treasure_fleet_expedition_outcome_overview: "$BULLET$船队满载着国库支付的礼物启航。\n$BULLET$安全返回时，未使用的部分将成为[gold|e]，获得#G +10#![prestige|e]。\n$BULLET$每个外国宫廷会有不同反应：\n$BULLET_WITH_TAB$尽心招待我们的宫廷给予#G +5#![prestige]，可能作为朝贡国加入[GetUniqueInternationalOrganization('middle_kingdom').GetName]，并送出贡品和稀有礼物丰富我们的[market|e]。\n$BULLET_WITH_TAB$拒绝朝贡的宫廷与我们的[opinion|e]#R ‑50#!，获得[ShowModifier('chi_resisting_subjugation')]。"
 treasure_fleet_cooldown: "宝船队"
 western_ocean_voyage_expedition: "向西航行"
 western_ocean_voyage_expedition_desc: "派出一支舰队向西驶入开阔的大西洋，寻找通往印度群岛的海上航线。没有任何海图能让我们预知[ShowAreaName('canary_islands_area')]之外的景象，我们能依靠的只有风、海水，以及祈祷这片海洋比学者们认定的更窄。"
 western_ocean_voyage_expedition_historical_info: "在首次尝试向西航行前的数十年里，欧洲学者就已经在辩论向西航行到达亚洲的可能性。当时的主要障碍并非地球的形状——受过教育的人都知道地球是球形的——而是它的大小。大多数学者的判断是正确的，他们认为海洋太大难以横渡。然而，最终证明他们判断有误的的那些航行，并没有推翻这个估算，只是在途中发现了意料之外的事物。"
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$航行会绘制沿途所经远洋，揭露抵达的海岸。\n$BULLET$初见陆地获得：\n$BULLET_WITH_TAB$#G +10#![prestige|e]。\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]。\n$BULLET_WITH_TAB$若发现美洲，再获得#G +20#![prestige]，并为未来殖民打开新大陆。"
 western_ocean_voyage_cooldown: "向西航行"
 hajj_caravan_expedition: "朝觐"
 hajj_caravan_expedition_desc: "让我们的统治者启程前往[ShowLocationName('mecca')]朝圣，完成伊斯兰教的五功之一。路途漫长，此行开销不菲，但从圣城归来的统治者，能获得任何军队都无法赋予的权威。"
 hajj_caravan_expedition_historical_info: "阿拔斯王朝的哈里发哈伦·拉希德在位期间（786–809年）曾九次从巴格达启程朝觐，甚至为了展现虔诚步行穿越部分路段。他的虔敬之举成为后世虔诚统治者竞相效仿的典范。"
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$#G +20#![religious_influence|e]。\n"
 hajj_caravan_expedition_outcome_overview: "$BULLET$抵达[ShowLocationNameWithNoTooltip('mecca')]将为队伍带来最高如下的荣光：\n$BULLET_WITH_TAB$#G +20#![prestige|e]。\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$返回家乡再给予：\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]。\n$BULLET_WITH_TAB$5年[ShowModifier('hajj_pious_return')][modifier|e]。\n$BULLET_WITH_TAB$永久的[ShowModifier('hajji_pilgrim')]荣耀，仅限[ruler|e]的第一次朝觐。\n$BULLET$队伍必须在出发后同年抵达[ShowLocationNameWithNoTooltip('mecca')]，否则朝圣会彻底失败。"
 guards: "护卫"
 guards_desc: "旅队的武装护卫，可通过雇佣护卫或沿途护送#italic 朝觐轿#!来扩充，会因遭遇劫掠和艰难路况而减员。护卫充足的旅队更有可能在袭击中存活下来。"
 splendor: "辉煌"
 splendor_desc: "旅队的补给和装饰的奢华程度。它可通过大额开销和财富展示来提升，会被沿途的风暴和艰难处境消耗降低。它决定了旅队抵达[ShowLocationNameWithNoTooltip('mecca')]后能获得的回报。"
 hajj_caravan_cooldown: "朝觐"
 circumnavigation_expedition: "环球航行"
 circumnavigation_expedition_desc: "派出一支舰队向西出发完成环球航行：向南驶过拉[ShowRegionName('la_plata_region')]，穿过大地尽头的海峡，越过一片尚无名称的大洋，抵达香料群岛，再绕过[ShowLocationName('good_hope_cape')]返航。此前没有任何舰队完成过这件事，也没人能确定这件事真的能做成。"
 circumnavigation_expedition_historical_info: "1519年9月，斐迪南·麦哲伦与西班牙王室签订合同，从桑卢卡尔‑德巴拉梅达出发，寻找一条通往香料群岛的西行航线。此次远航由五艘船组成：#italic 特立尼达号#!、#italic 圣安东尼奥号#!、#italic 康塞普西翁号#!、#italic 维多利亚号#!和#italic 圣地亚哥号#!。麦哲伦是一名葡萄牙航海家，在为葡萄牙服务期间曾航行至印度和摩鹿加群岛，后在曼努埃尔一世拒绝为其涨薪后，转而效忠西班牙王室。这次航行将成为人类历史上首次环球航行，尽管麦哲伦本人未能活着看到它的完成。"
 circumnavigation_expedition_outcome_overview: "$BULLET$第一个完成环球航行的国家获得：\n$BULLET_WITH_TAB$#G +100#![prestige|e]\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]\n$BULLET_WITH_TAB$[ShowModifier('first_circumnavigation')][modifier|e]\n$BULLET$任意完成者也会获得：\n$BULLET_WITH_TAB$#G +10#! [prestige]\n$BULLET_WITH_TAB$至少三艘船返乡进一步#G +10#!\n$BULLET_WITH_TAB$一名精神良好的船员#G +5#!\n$BULLET_WITH_TAB$在[ShowAreaName('moluccas_area')]收集的[ShowGoodsName('cloves')]以市场价出售获得[gold|e]"
 circumnavigation_expedition_low_morale_prestige_tt: "低船员士气会减少获得的威望"
 circumnavigation_expedition_high_morale_prestige_tt: "高船员士气会增加获得的威望"
 morale: "船员士气"
 morale_desc: "船员的士气。士气低落可能引发哗变。"
 provisions: "补给"
 provisions_desc: "旅途所需的食物和水。它在行进过程中会持续消耗，一旦耗尽，整支队伍就会陷入危险。"
 num_ships: "船只"
 num_ships_desc: "舰队中剩余的船只。如果一艘都没剩下，这支探险队就彻底覆灭了。"
 cargo: "货物"
 cargo_desc: "航行途中装载的贵重货物，会在舰队返航后拿到市场上出售。"
 cape_route_to_india_expedition: "印度好望角航路"
 cape_route_to_india_expedition_desc: "派出一支舰队沿着非洲海岸向南航行，绕过巨大的南部海角，开辟出一条通往香料群岛的海路，绕开所有奥斯曼帝国的关卡和威尼斯中间商。这条航线十分凶险，两年的航程里全是开阔洋面、未知海岸和能吹散船队的风暴，但第一个打通这条航线的国家，将掌控全世界的香料贸易。"
 cape_route_to_india_expedition_historical_info: "葡萄牙人寻找通往$india$的海路的探险，是近一个世纪以来沿非洲海岸逐步向南探索的巅峰。1488年，巴尔托洛梅乌·迪亚士绕过好望角，证明了这条路线的可行性。瓦斯科·达伽马在1497年至1499年的航行完成了这一使命，返航时带回的胡椒和香料之多，足以支付六十次此次探险的费用。这次航行从根本上改变了全球香料贸易，打破了威尼斯和奥斯曼帝国对陆路贸易路线的垄断。"
 cape_route_to_india_expedition_outcome_overview: "$BULLET$沿非洲海岸的每一次停留可建造一座[ShowBuildingTypeName('por_feitoria')]；若港口无人占据，则可建造一座[ShowBuildingTypeName('por_trading_post')]并直接占领该[location|e]，每座建筑都会附带一项持久的贸易[modifier|e]。\n$BULLET$抵达[ShowLocationName('kozhikode')]可获得[ShowModifier('calicut_trade_rights')]及一批可以市场价格出售获取[gold|e]的[ShowGoodsName('pepper')]。\n$BULLET$完成航路后额外获得：\n$BULLET_WITH_TAB$#G +20#![prestige|e]。\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]。\n$BULLET_WITH_TAB$永久[ShowModifier('cape_route_pioneer')][modifier]；若建成三座或五座商站，则改为获得[ShowModifier('portuguese_african_network')]或[ShowModifier('east_africa_trade_dominance')]。"
 cape_route_to_india_expedition_low_morale_prestige_tt: "低船员士气会减少获得的威望"
 cape_route_to_india_expedition_high_morale_prestige_tt: "高船员士气会增加获得的威望"
 grand_tour_expedition: "大游学"
 grand_tour_expedition_desc: "我们的继承人将启程前往[ShowRegionName('italy_region')]的各大名城——途经[ShowLocationName('florence')]、[ShowLocationName('rome')]、[ShowLocationName('venice')]和[ShowLocationName('naples')]——在[ShowInstitutionName('renaissance')]的熏陶下求学。归来的继承人将不再是当初出发的那个人。他学到的一切知识，以及师从何人，都将塑造他日后登上君位时所具备的品性。"
 grand_tour_expedition_historical_info: "大游学——即欧洲年轻贵族前往意大利长期游学——在十五和十六世纪逐渐兴起，到十七世纪已成为北欧贵族中的一种正式制度。佛罗伦萨、罗马、威尼斯和那不勒斯形成了经典的巡游路线，每座城市都能提供北方宫廷所缺乏的东西：人文主义学术、古典遗迹、文艺复兴赞助艺术以及欧洲最古老宫廷的礼仪。参与者在归来时往往脱胎换骨，具备国内导师无法培养的治国与外交才能。"
 grand_tour_expedition_outcome_overview: "$BULLET$每访问一座城市，都会根据所做选择积累知识、人脉或经验；花费时间学习会提供[research_progress|e]，花费时间访问宫廷会提供[legitimacy|e]。\n$BULLET$到达[ShowRegionNameWithNoTooltip('italy_region')]的至少三座大城市后，将给予：\n$BULLET_WITH_TAB$[ShowTraitName('free_thinker')]、[ShowTraitName('well_connected')]或[ShowTraitName('worldly')]三者之一，取决于结束时哪一项最高。\n$BULLET_WITH_TAB$永久的[ShowModifier('returned_from_grand_tour')][modifier|e]。\n$BULLET_WITH_TAB$#G +10#![prestige|e]。\n$BULLET$较短的游学只获得#G +5#![prestige]，且不会获得[trait|e]。"
 gt_diligence: "勤勉"
 gt_diligence_desc: "继承人从游学中学习的资质，取决于出发时的[ability|e]数值。越勤勉的继承人，越能从旅途的见闻中获益。"
 knowledge: "知识"
 knowledge_desc: "游学期间通过理论学习获得的知识——图书馆、讲座，以及学者的陪伴。如果一位继承人在巡游结束时获得的知识多于其他任何东西，归来会获得[ShowTraitName('free_thinker')]。"
 connections: "人脉"
 connections_desc: "游学期间在到访的宫廷中建立的关系。如果一位继承人在游学结束时拥有的关系最为突出，归来会获得[ShowTraitName('well_connected')]。"
 experience: "经验"
 experience_desc: "游学期间获得的实际动手经验——工坊、港口和账房。如果一位继承人在游学结束时拥有的经验多于其他任何东西，归来会获得[ShowTraitName('worldly')]。"
 grand_tour_cooldown: "大游学"
 grand_embassy_expedition: "大使团"
 grand_embassy_expedition_desc: "让君主隐姓埋名游历西欧各国宫廷，去研究那些已经完成现代化的国家的制度、陆军和海军。以王室名义公开的代表团只会得到宴会和空泛的礼遇；低调行事的代表团才能进入真正的造船厂和制图室。但消息总会传开，一旦统治者过早暴露身份，大门便将再度紧闭。"
 grand_embassy_expedition_outcome_overview: "$BULLET$使团行事有多隐秘，决定了其真实目的能在每个东道主面前隐藏多久，以及一旦被发现，宫廷会如何反应。\n$BULLET$每访问一个宫廷，都会提供若干向其学习的机会；期间的偶遇能提升统治者自身的能力、加深现代化或消耗隐蔽。\n$BULLET$一旦使团结束，其积累的现代化会提升我们拥有的每个地点的[institutions|e]进度（首都提升幅度大于其他地方）以及[army_tradition|e]；若曾访问港口，还会提升[navy_tradition|e]。\n$BULLET$将使团拒之门外的宫廷会损失[prestige|e]；允许其进入，或被恳求多次进入的宫廷，则会奖励[prestige|e]和更多机会。"
 grand_embassy_expedition_institution_spread_tt: "使所选思潮在治下每一个尚未拥有它的地点推进[GetVariable('grand_embassy_institution_progress_amount')|V0]进度，在首都推进[GetVariable('grand_embassy_institution_progress_capital_amount')|V0]进度"
 grand_embassy_expedition_stalled_status: "学识"
 discretion: "隐蔽"
 discretion_desc: "代表团的真实目的，以及君主的身份对外界的保密程度。高于90时，当地宫廷会把这支使团当成普通使节，不会有人产生任何怀疑。保在90及以下时，东道国就会查清同行者中谁才是真正的君主，可能是单纯怀疑，也可能是通过他们自己的间谍网络。"
 modernization: "现代化"
 modernization_desc: "使团吸收西方技术制度的累计进度。每掌握一项内容，进度就会增加，君主带回的相关积累越多，这次外交访问结束后能获得的回报就越大。"
 opportunities: "机会"
 opportunities_desc: "使团从这座特定宫廷获取学习资源的权限程度。每到一处新的停留点，这个数值都会重新设定，取决于君主选择在当地以多大程度公开自己的身份。"
 pacific_crossing_expedition: "寻找复航之路"
 pacific_crossing_expedition_desc: "从我们位于美洲的太平洋海岸派出一支舰队，寻找#italic 返航航线#!——一条能横跨地球上最大的大洋的可靠返程路线。信风很容易就能把船向西吹到亚洲；顶着信风返航的所有尝试都失败了，在返程航线被测绘出来之前，我们的殖民地和香料群岛的财富都遥不可及。第一个找到这条返程路线的国家，将把美洲和亚洲联结起来，打通横跨太平洋的大帆船贸易。"
 pacific_crossing_expedition_historical_info: "向东的#italic 返航航线#!是早期太平洋航行中一直未能解决的重大难题。1528年和1529年，从新西班牙出发的阿尔瓦罗·德·萨韦德拉两次被信风所阻，被迫折返，最终在尝试中丧生；1542年，鲁伊·洛佩斯·德·比利亚洛沃斯的探险队同样抵达了亚洲，却找不到返航路线。直到1565年，一条可靠的返航路线才被发现。在此之前，一支舰队可以抵达亚洲，却永远无法将货物运回。"
 pacific_crossing_expedition_outcome_overview: "$BULLET$绘制横跨[ShowContinentName('pacific_ocean_continent')]的返航路线可获得：\n$BULLET_WITH_TAB$#G +100#![prestige|e]。\n$BULLET_WITH_TAB$#G +15#![legitimacy|e]。\n$BULLET_WITH_TAB$长期贸易路线[modifier|e]。\n$BULLET_WITH_TAB$在[ShowAreaName('moluccas_area')]收集的[ShowGoodsName('cloves')]，按市场价格出售换取[gold|e]。\n$BULLET_WITH_TAB$永久解锁[ShowDecisionName('charter_manila_galleon')][decision|e]，此后每五年可再次执行，以获得可观的[gold]回报。\n$BULLET$未能找到返航路线的舰队则一无所获。"
 pacific_crossing_expedition_low_morale_prestige_tt: "低船员士气会减少获得的威望"
 pacific_crossing_expedition_high_morale_prestige_tt: "高船员士气会增加获得的威望"
 cartographic_survey_expedition: "沿海勘测"
 cartographic_survey_expedition_desc: "派出一艘勘测船沿着我们的海岸线航行，测绘沿岸港口，测量浅滩水深，标记航行危险点。这项工作并不起眼，但最终绘出的海图能沿用一代人的时间，此后每一次探险的筹备，都会因为这些海图而成本更低、速度更快。"
 cartographic_survey_expedition_historical_info: "系统的海岸测绘在16世纪开始真正兴起，海上贸易量的不断增长使准确的海图成为国家利益攸关之事。塞维利亚的#italic 贸易厅#!和葡萄牙的#italic 几内亚与印度贸易署#!都设有官方制图师，负责制作和更新海图；荷兰海军部也在17世纪效仿了这一做法。"
 cartographic_survey_expedition_outcome_overview: "$BULLET$每勘测一座[port|e]，可获得持续10至20年的[location_modifier|e]，提高港口数种商品之一的产出，比如[ShowGoodsName('fish')]、[ShowGoodsName('pearls')]或[ShowGoodsName('amber')]，或是直接改良港口设施，同时额外获得[prestige|e]。\n$BULLET$勘测三座或以上港口，还将额外获得：\n$BULLET_WITH_TAB$为期15年的[ShowModifier('accurate_charts')][modifier|e]。\n$BULLET_WITH_TAB$#G +10#![prestige]。\n$BULLET$勘测不足三座则仅获得#G +5#![prestige]。"
 cartographic_survey_cooldown: "沿海勘测"
 mining_survey_expedition: "高地勘探"
 mining_survey_expedition_desc: "派出一队探矿者和化验师进入我们的高地地区，沿着河床行走，敲打露出地表的岩层，检测岩石里的贵金属含量。这些山丘此前就产出过财富，一名老矿工辛苦积累的经验，抵得上宫廷里一整年的凭空猜测。"
 mining_survey_expedition_historical_info: "系统勘探在中世纪和近代早期的欧洲十分普遍，其中最著名的是萨克森和波希米亚的厄尔士山脉。12世纪银矿脉的发现，催生了弗赖贝格、亚希莫夫和施内贝格等新兴城镇。格奥尔格·阿格里科拉的#italic 《论矿冶》#!（1556年）成为该领域的标准教科书，详细描述了寻矿杖的使用、在小坩埚中测试金矿石样品的方法以及规范采矿权申领的法律惯例。"
 mining_survey_expedition_outcome_overview: "$BULLET$每次勘探都会获得为期20年的[ShowModifier('thorough_survey')][modifier|e]，提高全国的原材料产出。\n$BULLET$每次发现矿脉还会获得富矿，如[ShowModifier('rich_silver_vein')]或[ShowModifier('rich_gold_strike')]，可选择公开开采以获得[prestige|e]，或秘密开采以获得[gold|e]。\n$BULLET$此外还可获得：\n$BULLET_WITH_TAB$发现两处及以上矿脉时，获得#G +10#![prestige]。\n$BULLET_WITH_TAB$每勘探一处高地，获得#G +5#!。"
 mining_survey_cooldown: "高地勘探"
 relic_expedition: "寻找圣物"
 relic_expedition_desc: "派遣一支探险队前往[ShowLocationName('jerusalem')]，从那里出发穿越圣地以及更广阔的[ShowRegionName('crescent_region')]，去追寻圣物的传闻——只要足够耐心、足够幸运找到它，任何人都能将其收回手中。"
 relic_expedition_historical_info: "中世纪和近代早期的圣物贸易规模相当可观。天主教与东正教社群竞相争夺最珍贵的圣物；数百年间，通过买卖、交换乃至公然盗窃，圣物流转于整个基督教世界。十字军国家的圣物尤其容易卷入这类贸易：1187年在哈丁被夺的真十字架再也没能找回，1098年在安条克发现的圣枪也在第一次十字军东征结束后不久就从史料记载中消失了。这两件圣物的遗失，催生了流传数百年的传闻，人们始终在猜测这些物品可能藏在什么地方。"
 relic_expedition_outcome_overview: "$BULLET$最终找到的圣物取决于运气和搜寻的进展：它可能是遗失已久的真十字架或圣枪本身，也可能是一枚钉子、一块骨头、一片残片这类更普通的圣物。\n$BULLET$无论找到什么，都会成为一件实物[work_of_art|e]，被带回我们的首都。"
 clues: "线索"
 clues_desc: "探险队距离同圣物的接近程度。从一则传闻开始，每追查一条线索，进度就会随之增减。如果进度彻底归零，搜寻行动就可能被取消。"
 hunt_retinue: "随员"
 hunt_retinue_desc: "探险队的护卫、翻译和学术随员。这部分人手不会自行损耗，但如果彻底耗尽，探险队就会解散，搜寻行动也会失败。"
