 traditional: "传统"
 improvisational: "即兴"
 Jacob_Regnart: "雅各布·雷格纳特（1540年代—1599）"
 Jacob_Regnart_facts: "雷格纳特是一位佛兰德文艺复兴作曲家，出生于杜埃，创作圣乐与世俗音乐。他一生曾在奥地利与波希米亚等地活动，并于1580年代在因斯布鲁克担任斐迪南大公麾下的乐长等职务。"
 Martin_Rinckart: "马丁·林卡特（1586—1649）"
 Martin_Rinckart_facts: "马丁·林卡特是一位路德宗牧师和赞美诗作者，曾任萨克森北部艾伦堡的副主教，他在此出生并逝世。"
 Joachim_Neander: "约阿希姆·诺伊安德（1650—1680）"
 Joachim_Neander_facts: "约阿希姆·诺伊安德出生于布莱梅，是改革宗（加尔文宗）教堂圣诗作者、神学家与教师。他被视为改革宗教堂最重要的圣诗作者，写下约60首圣诗。"
 Dietrich_Buxtehude: "迪特里希·布克斯特胡德（1637—1707）"
 Dietrich_Buxtehude_facts: "迪特里希·布克斯特胡德本名迪特里希·汉森·布克斯特胡德，1637年出生于斯堪尼亚省的赫尔辛堡。布克斯特胡德被视为17世纪最重要的作曲家之一，并对巴赫与亨德尔等后世作曲家产生深远影响。"
 Gabriel_Asaad: "加布里埃尔·阿萨德（1907—1997）"
 Rohi_al_Khammash: "罗希·哈马什（1923—1998）"
