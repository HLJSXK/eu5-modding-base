 Norrkoping_Symphony_Orchestra: "北雪平交响乐团"
 Yingying_Herrdahl: "英英·赫达尔（琵琶）"
 Yingying_Herrdahl_facts: "英英·赫达尔是一位琵琶演奏名家，目前居住于瑞典。"
 Pipa_facts: "中国琵琶是一种梨形弹拨弦乐器，以指甲弹奏，历史上也曾使用拨子。其起源可追溯至近两千年前，也是最受欢迎的中国乐器之一。"
 Martin_Ostergren: "马丁·厄斯特格伦（管风琴）"
 Feras_Charestan: "费拉斯·查雷斯坦（卡农琴）"
 Feras_Charestan_facts: "费拉斯·查雷斯坦来自叙利亚东北部的哈塞克市，并曾在大马士革高等音乐学院学习卡农琴。"
 Qanun_facts: "卡农琴，是齐特琴家族的一种弦乐器，可能起源于古代美索不达米亚，但其起源尚不确定。"
 Ilona_Danho: "伊洛娜·丹霍（人声）"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$，$Ilona_Danho$"
 Dan_Cecil_Hill: "丹·塞西尔·希尔（长笛）"
 Dan_Cecil_Hill_facts: "丹·塞西尔·希尔（卡尤加族，苍鹭氏族）是一位豪登诺索尼（易洛魁）艺术家与音乐家，专长于传统原住民银器制作与长笛制作。作为艺术家、表演者与文化领袖，他一生大部分时间都致力于保存并传播其民族的历史与文化，这些传统可以追溯到美国殖民时代之前甚至更早时期。"
 Pierre_Harmon: "皮埃尔·哈蒙"
 Pierre_Harmon_facts: "皮埃尔·哈蒙是一位知名长笛演奏家，也是前哥伦布时期音乐的著名专家。他以珍贵的音乐学研究闻名全球，尤其是在阿兹特克音乐方面；他也拥有规模最大的古代乐器收藏之一，并将其职业生涯投入于掌握这些乐器。"
 Laurent_Sauron: "洛朗·索隆"
 Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$（长笛）、$Laurent_Sauron$（打击乐）"
 Nana_Osei_Twum_Barima_seperewa: "纳纳·奥塞伊·特武姆·巴里马（人声、塞佩雷瓦琴）"
 Nana_Osei_Twum_Barima_aho: "纳纳·奥塞伊·特武姆·巴里马（人声、阿通潘鼓、恩塔赫拉号角、达乌罗钟、菲里基瓦铃、恩特瓦穆鼓）"
 Nana_Osei_Twum_Barima_asanteman: "纳纳·奥塞伊·特武姆·巴里马（人声、塞佩雷瓦琴、佩佩姆苏阿鼓、阿通潘鼓、达乌罗钟、菲里基瓦铃、恩特瓦穆鼓）"
 Rohan_Pillai: "罗汉·皮莱（维纳琴）"
 Pancham_Upadhyay: "潘查姆·乌帕迪亚伊（姆里丹加鼓）"
