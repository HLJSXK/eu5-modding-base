 MusicPlayer_sol_deccan_raga_keeravani: "德干 ‑ 基拉瓦尼拉格"
 MusicPlayer_sol_deccan_raga_keeravani_flavour: "以经典三段式卡纳提克风格演奏。曲名意为“虔敬拉格”"
 MusicPlayer_sol_deccan_raga_nattaikurunji: "德干 ‑ 拉格纳泰库林吉"
 MusicPlayer_sol_deccan_raga_nattaikurunji_flavour: "以经典三部分卡纳提克风格演奏。歌曲标题意为“浪漫主义之拉格”。"
 MusicPlayer_sol_deccan_raga_saraswathi: "德干 ‑ 萨拉斯瓦蒂拉格"
 MusicPlayer_sol_deccan_raga_saraswathi_flavour: "以经典三部分卡纳提克风格演奏。歌曲标题意为“神秘主义之拉格”。"
 MusicPlayer_sol_iroquois_Akwesasne: "易洛魁 ‑ 阿奎萨内"
 MusicPlayer_sol_iroquois_Akwesasne_flavour: "$Dan_Cecil_Hill_facts$歌曲标题意为“鹧鸪击鼓之地”。"
