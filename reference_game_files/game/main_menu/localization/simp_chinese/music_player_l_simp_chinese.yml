 #### TRACK NAMES AND FLAVOUR TEXT ####
 MusicPlayer_01_Overture_I_Genesis: "01 ‑ 序曲I 创世"
 MusicPlayer_01_Overture_I_Genesis_flavour: "“世界苏醒，阳光逐片揭示它的面容。”"
 MusicPlayer_02_Overture_II_The_Odyssey: "02 ‑ 序曲II 奥德赛"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "“我们故事的序曲，在其中我们认识它的角色与主题。”"
 MusicPlayer_03_Royal_Court_Invitation: "03 ‑ 王室宫廷邀请"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "此曲中听到的羽管键琴，是文艺复兴和巴洛克音乐中盛行的一种键盘乐器。它通过按下琴键，进而带动羽毛拨片拨动单根琴弦，以机械方式拨动安装在音板上的一组琴弦来发声。"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 ‑ 外交的高贵艺术"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "鲁特琴家族乐器在世界许多地区和各个历史时期都有悠久历史，而欧洲鲁特琴是欧洲文艺复兴世俗音乐中的主导乐器。"
 MusicPlayer_21_Conquer_or_Fall: "21 ‑ 征服或陨落"
 MusicPlayer_21_Conquer_or_Fall_flavour: "一部包含圆号、弦乐和合唱的史诗性作品。呈现了《Europa Universalis V》音乐中其中一个主要旋律主题的鼓舞人心的变奏。"
 MusicPlayer_07_For_the_Lost_Ones: "07 ‑ 献给逝去者"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "一首哀婉而起伏回荡的乐曲，呼应《Europa Universalis V》中其他乐曲的主题和动机。"
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 ‑ 小丑说出真相"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "一首受早期文艺复兴音乐启发的作品，围绕《Europa Universalis V》音乐主要旋律动机的变奏展开。"
 MusicPlayer_05_The_Rise_of_an_Empire: "05 ‑ 一个帝国的崛起"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "这首作品以《Europa Universalis V》的主旋律开场，强劲地表现了这段体验的核心情感。"
 MusicPlayer_20_Thirty_Years: "20 ‑ 三十年"
 MusicPlayer_20_Thirty_Years_flavour: "三十年战争（1618—1648年）是欧洲历史上最具毁灭性的冲突之一，导致约450万至800万人死亡。它由16世纪的宗教改革引发，并因外部利益冲突和旧日宿怨而进一步加剧。"
 MusicPlayer_24_The_Black_Death: "24 ‑ 黑死病"
 MusicPlayer_24_The_Black_Death_flavour: "黑死病使14世纪欧洲人口减少了一半，是人类历史上最致命的瘟疫之一。"
 MusicPlayer_10_Gloria_Patri: "10 ‑ 愿光荣归于父"
 MusicPlayer_10_Gloria_Patri_flavour: "一首基于巴赫《G大调第一大提琴组曲，BWV1007：I.前奏曲》的声乐变奏。"
 MusicPlayer_14_Lux_aeterna: "14 ‑ 愿以永光照耀"
 MusicPlayer_14_Lux_aeterna_flavour: "《愿以永光照耀》是一段通常被配乐用于天主教会亡者弥撒的文本。它讲述天主的恩典以及祂的永恒之光照耀逝者。"
 MusicPlayer_18_Falalalan: "18 ‑ 法拉拉兰"
 MusicPlayer_18_Falalalan_flavour: "历史始终存在于音乐之中，有时不止以一种方式。"
 MusicPlayer_22_A_Message_to_The_King: "22 ‑ 致国王的讯息"
 MusicPlayer_22_A_Message_to_The_King_flavour: "一首充满紧迫与热忱的作品，传达出刻不容缓的感觉。"
 MusicPlayer_08_No_Fear_No_Mercy: "08 ‑ 无惧，无怜悯"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "一首凯旋般的作品，令人想起战前的宁静，以及战斗者心中因期待而跳动的心。"
 MusicPlayer_06_Pain_is_Salvation: "06 ‑ 苦难即救赎"
 MusicPlayer_06_Pain_is_Salvation_flavour: "歌词融合了英语、古德语和拉丁语，讲述通往救赎之路上的苦难。"
 MusicPlayer_04_In_Your_Honor: "04 ‑ 光荣祢"
 MusicPlayer_04_In_Your_Honor_flavour: "一首气势恢宏的作品，令人想起绿色牧场，以及对天主与自然的敬畏。"
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 ‑ 与贝耳则步的交易"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "宗教与战争，以及因宗教而起的战争。虔诚与嗜血交织。这里描绘的几个世纪，是充满鲜明对比、又夹杂灰色地带的世纪。"
 MusicPlayer_16_The_Path_to_Potsdam: "16 ‑ 通往波茨坦之路"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "波茨坦市在三十年战争期间失去了近一半人口。"
 MusicPlayer_11_Maiden_Voyage: "11 ‑ 处女航"
 MusicPlayer_11_Maiden_Voyage_flavour: "一首舞曲节奏的作品，如驶向未知海域时波浪起伏。"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 ‑ 裸体皇帝的加冕"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "一首世俗巴洛克风格的作品，以弦乐和羽管键琴为特色。"
 MusicPlayer_13_Battle_of_Lutzen: "13 ‑ 吕岑战役"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "吕岑战役于1632年11月16日由瑞典军队在萨克森和黑森‑卡塞尔军队支持下，与神圣罗马帝国皇帝的帝国军队交战，是三十年战争最重要的战役之一。瑞典国王古斯塔夫·阿道夫在此役中阵亡后，海尔布隆联盟成立。"
 MusicPlayer_26_Peace_of_Westphalia: "26 ‑ 威斯特伐利亚和约"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "《威斯特伐利亚和约》是1648年在奥斯纳布吕克和明斯特签署的两份独立和约的统称，结束了三十年战争，并为神圣罗马帝国带来和平。"
 MusicPlayer_23_The_Flagellant: "23 ‑ 自笞者"
 MusicPlayer_23_The_Flagellant_flavour: "自笞是指鞭打自己以忏悔罪孽并分担耶稣受难的行为，存在于许多基督教传统中。自笞派是14世纪西方基督教中的一场运动，最初是对战争、饥荒和瘟疫的回应。"
 MusicPlayer_19_O_quam_gloriosum: "19 ‑ 吁，何等光荣"
 MusicPlayer_19_O_quam_gloriosum_flavour: "这首作品基于托马斯·路易斯·德·维多利亚（1548—1611）为其《吁，何等光荣弥撒》撰写的文本。"
 MusicPlayer_09_Libera_me_Domine: "09 ‑ 俯祈天主拯救我"
 MusicPlayer_09_Libera_me_Domine_flavour: "这首作品结合了通常被配乐用于天主教会亡者弥撒的文本《慈悲的耶稣》和《拯救我》。它们祈求逝者得到耶稣的怜悯，赐予安息，并在审判之日获得拯救。"
 MusicPlayer_sol_ashanti_Aho: "阿散蒂 ‑ 阿霍"
 MusicPlayer_sol_ashanti_Aho_flavour: "纳纳·奥塞·图姆·巴里马精通阿散蒂音乐和仪式中使用的所有乐器，包括塞佩雷瓦琴、传统号角和打击乐器。他也是阿散蒂王国皇帝兼缔造者的继承人。这首歌曲的标题意为“战歌”。"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "阿散蒂 ‑ 阿散蒂曼·耶尼姆·科"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "这首歌歌词开头大致意为“阿散蒂人懂得战斗，却不懂得逃跑”，接着宣扬阿散蒂战士的优越性。"
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "阿散蒂 ‑ 塞佩雷瓦·阿卡萨"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "歌曲标题意为“塞佩雷瓦已开口”。塞佩雷瓦是一种竖琴‑鲁特琴家族乐器，具有箱形共鸣箱和10到14根琴弦，这些琴弦直接缠绕在琴颈上连接到乐器颈部。它起源于西非，据说阿桑特/阿散蒂帝国的缔造者奥塞·图图国王非常喜爱它，以至于用黄金制作了一件复制品，作为他的王室仪仗用品。"
 MusicPlayer_sol_aztec_Mictlan: "阿兹特克 ‑ 米克特兰"
 MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$。歌曲标题意为“冥界”。"
