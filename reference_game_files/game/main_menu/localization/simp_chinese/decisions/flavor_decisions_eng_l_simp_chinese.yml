l_simp_chinese:
 eng_yorkist_tradition_decision.title: "任命中产官员"
 eng_yorkist_tradition_decision.desc: "由于难以寻觅到足以胜任政府职务的杰出人才，有人提出我们应扩大选拔范围，将[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]以及以律师为代表的中产阶级纳入其中。双方都满怀期待，盼望着我们能够实施这样的改革，以回应社会对改革的强烈呼声。"
 eng_yorkist_tradition_decision.desc.entry: "中产阶级正在壮大，因此有人提出，有必要让他们中的一些人进入政府任职。既然要能找到可任用的人才，那么把中产阶级纳入我们可选拔的人才库，无疑会拓宽我们的选择。"
 eng_yorkist_tradition_decision.a: "给予他们支持。"
 eng_yorkist_tradition_decision.b: "他们在政府没有立足之地。"
 enable_yorkist_tradition_policy: "解锁[ShowPolicyName('yorkist_tradition_policy')][policy|e]"
 eng_yorkist_tradition_decision.historical_info: "增加来自中产阶级的政府官员的数量——尤其是神职人员和律师的数量是英格兰长久的约克传统。贵族和教士坚决反对，他们认为这是社会地位较高或神职男性独有的特权。"
 eng_court_of_the_star_chamber_decision.title: "星室法庭"
 eng_court_of_the_star_chamber_decision.desc: "目前，[ShowPolicyName('common_law_policy')]在维护正义方面发挥了至关重要的作用。然而，由于诉讼程序在很大程度上依赖于判例和法官的裁决，这导致了程序的缓慢，某些案件甚至需要数周乃至数月才能得出裁决。因此，有人呼吁建立一个司法程序更为灵活的上诉法院，以处理那些对普通法院来说过于复杂和敏感的案件。尽管如此，[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]权力的扩张、对异议声音的压制以及对持不同政见者的必要惩罚，可能会带来潜在的负面后果。"
 eng_court_of_the_star_chamber_decision.desc.entry: "判例法是我们伸张正义的传统方式，但它必然使程序缓慢，案件裁决耗时良久。若另设一个法庭，能自由设定自己的程序，便可迅速处理此类事务；这或许会成为一种惯例，对$crown_estate$大有裨益。"
 eng_court_of_the_star_chamber_decision.a: "不可或缺的部门。"
 eng_court_of_the_star_chamber_decision.b: "[ShowPolicyNameWithNoTooltip('common_law_policy')]够用了。"
 enable_court_of_the_star_chamber_reform: "解锁[ShowGovernmentReformName('court_of_the_star_chamber_reform')][government_reform|e]"
 eng_court_of_the_star_chamber_decision.historical_info: "星室法庭，这个由国王枢密院会议演变而来的机构，在亨利七世统治时期变得尤为重要。它的名称来源于威斯敏斯特宫天花板上的星型装饰。到了1487年，星室法庭成为一个独立于枢密院的司法机构，其主要职责是审理申诉案件。"
 eng_benevolence_tax_decision.title: "设立强制捐献税"
 eng_benevolence_tax_decision.desc: "由于国家的卓越管理，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]在[ShowDisasterName('war_of_the_roses')]后成功恢复了[ROOT.GetCountry.GetAdjective]的王权与政局稳定。由于对细节的密切关注和反对挥霍无度，[ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer]的重点似乎转向了通过引入无情高效的税收机制来增加新的收入。"
 eng_benevolence_tax_decision.desc.entry: "一位花钱少、记账仔细的统治者，很快便会注意到其他人都在花多少钱。[ShowDisasterName('war_of_the_roses')]之后赢得的和平，使国库保持稳定，也让统治者的注意力得以自由地转向富人的钱袋。"
 eng_benevolence_tax_decision.a: "国家和平，经济繁荣。"
 eng_benevolence_tax_decision.b: "让我们沉浸在所创造的安稳中就够了。"
 eng_benevolence_tax_decision.a.custom: "解锁[ShowGovernmentReformName('benevolence_tax_reform')][government_reform|e]"
 eng_benevolence_tax_decision.historical_info: "亨利七世的统治有助于稳定王国的财政，巩固君主的权力，在大法官约翰·莫顿的帮助下，国王引入了“强制捐献税”，其逻辑是：生活节俭的民众必然有所积蓄，能够捐献；而那些生活奢侈的人显然财力雄厚，同样能够捐献。"
 eng_council_of_the_north_decision.title: "北方议会"
 eng_council_of_the_north_decision.desc: "有观点称，北方离[ROOT.GetCountry.GetCapital.GetName]的权力中心太远，进一步加剧了当地缺乏教会司法的问题。在[target_location.GetName]设立一个独立理事会来处理此类事务，可以下放一些权力，以换取确保正义得到维护。"
 eng_council_of_the_north_decision.desc.entry: "骑马赶路三周才能送达的正义，便不是正义。一个设在[ShowLocationName('york')]、拥有自身权威的议会，将无需让北部各郡的请愿先穿越整个国家，便能回应他们——代价是我们再也无法亲自行使那部分权威。"
 eng_council_of_the_north_decision.a: "我们对此意见一致。"
 eng_council_of_the_north_decision.b: "繁文缛节不是解决办法。"
 eng_council_of_the_north_decision.b_tt: "[ShowAreaName('northumbria_area')]所有地点会获得[ShowModifier('lack_of_conciliar_justice')][modifier|e]"
 STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "缺乏代表议会"
 eng_council_of_the_north_decision.historical_info: "北方议会是一个行政机构，成立的目的是对北方各郡实施更直接的控制。该委员会的主要职能是维护法律和秩序，确保王国北境臣民的忠诚。该委员会最终于1641年英国内战期间被废除。"
 eng_austere_monastic_life_decision.title: "修道院改革"
 eng_austere_monastic_life_decision.desc: "长期以来，宗教改革派将[ROOT.GetCountry.GetName]宗教团体的过度富裕视为一大顽疾；[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]对教会势力的过于嚣张跋扈不满也是呼吁变革的另一因素。\n\n我们可以尝试改革这些现状，让宗教教团回归朴素的隐修理想。\n\n总共而言，有#Y [ROOT.GetVariable('num_of_monasteries').GetValue]#!所修道院出现在这次改革清单中。"
 eng_austere_monastic_life_decision.desc.entry: "没有什么比一个富有的隐修士更让穷人恼火。改革派多年来一直这么说，$peasants_estate$也已开始赞同他们；而让各修会回归其誓愿，将会受到除修会自身之外所有人的欢迎。"
 eng_austere_monastic_life_decision.a: "改革吧。"
 eng_austere_monastic_life_decision.a.custom: "修会将使大批僧侣还俗并重新成为[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]"
 eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$"
 eng_austere_monastic_life_decision.b.custom: "受雇于修道院修会的[ShowPopTypeName('clergy')]获得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"
 eng_austere_monastic_life_decision.tt: "除非撤销这一[privilege|e]，否则无法拆除修道院"
 eng_austere_monastic_life_decision.historical_info: "修道院改革，或称裁撤修道院，是16世纪英国接受宗教改革后发生的重大事件。国王的首相托马斯·克伦威尔最初试图取缔修道院体系，因为修道院被视为罗马天主教会的延伸。这一事件最终导致英格兰各地的修道院、大修道院和女修道院等宗教机构被关闭。"
 eng_navy_board_decision.title: "海军委员会"
 eng_navy_board_decision.desc: "人们已经认识到，我们的海岸在某种程度上很容易受到外敌入侵。为了保卫[ROOT.GetCountry.GetName]的未来，我们必须控制我们岛屿周围的海域，挫败任何侵占我们土地的企图。\n\n通过优化我们的后勤流程并简化舰队的管理，我们可以发展我们的造船工作，并以更低的成本支持更大规模的海军。"
 eng_navy_board_decision.desc.entry: "一座岛屿的安全，取决于它周围的水域；而我们的水域，正被并非我们建造的舰队监视着。把船厂、仓库和给养置于一个委员会的统管之下，能让我们用同样的钱维持更多舰船在海上，而这是目前我们唯一负担得起的海军扩张方式。"
 eng_navy_board_decision.a: "进行这项必要的改革。"
 eng_navy_board_decision.b: "陆军是更重要的问题。"
 enable_navy_board_reform: "解锁[ShowGovernmentReformName('navy_board_reform')][government_reform|e]"
 eng_navy_board_decision.historical_info: "16世纪中叶，英王亨利八世在位期间，海军委员会应运而生。该机构负责监督海军各项事务，包括舰船建造与后勤保障。在亨利八世的领导下，海军委员会积极推动英国舰队规模扩张，致力于打造一支不容小觑的海上力量，以保卫国家免受外来侵略。"
 eng_grand_remonstrance_decision.title: "大抗议书"
 eng_grand_remonstrance_decision.desc: "一名议会代表郑重地向我们呈上了一份请愿清单，他们认为只有完成这些条款才能抚平他们对国家事务的腐败和宗教事务的影响问题的担忧。他们指出，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]已经相当长一段时间没有召集议会便进行统治，如今他们试图通过限制君主权力来维护自身的权利与特权。\n\n此外，他们还提出[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]人员在国王的内阁担任顾问的问题，这些人士被认为是教会在国家事务中影响力的延伸。有人因此提议禁止神职人员参与内阁，作为回报，议会将在未来的立法中予以更多支持。"
 eng_grand_remonstrance_decision.desc.entry: "议会已把不满写成书面文件——人们若只想被听见，不会这么做；他们这么做，是要得到答复。他们想限制君主，并把$clergy_estate$逐出内阁；作为交换，他们暗示愿意合作，而这是我们多年未曾有过的。"
 eng_grand_remonstrance_decision.a: "起草一份措辞严谨的否决案。"
 eng_grand_remonstrance_decision.b: "同意他们的条件。"
 eng_grand_remonstrance_decision.c: "尝试达成一份妥协案。"
 eng_grand_remonstrance_decision.tt1: "议会或将因此作出敌对反应，并试图通过一切必要手段限制王权"
 STATIC_MODIFIER_NAME_grand_remonstrance_refused: "拒绝了大抗议书"
 eng_grand_remonstrance_decision.b.custom: "实施[ShowGovernmentReformName('grand_remonstrance_reform')][government_reform|e]"
 eng_grand_remonstrance_decision.c.custom1: "我们的统治者拙劣的外交能力使这一选项的成功率降低了"
 eng_grand_remonstrance_decision.c.custom2: "我们的统治者高超的外交能力拉拢了足够的议员以通过法案"
 eng_grand_remonstrance_decision.tt2: "妥协可能不会导致一个好结果"
 eng_grand_remonstrance_decision.historical_info: "1641年，英国议会向国王查理一世呈交了一份正式文件《大抗议书》，控诉了他们对国王统治的不满，并要求进行全面改革以限制国王干预议会程序的权力。它还提到对天主教会在国王顾问中影响力的担忧。《大抗议书》上呈后不久，议会与国王的紧张态势急剧升级，并最终导致了英国内战的爆发。"
 eng_overhauled_admiralty_decision.title: "全面改革海军部"
 eng_overhauled_admiralty_decision.desc: "我们的一位海军行政官[samuel_pepys.GetName]尽管缺乏航海经验，但表现出了对海洋事务的巨大潜力。其影响力、勤奋和才能一定能帮助海军委员会进行改革，并为皇家海军的专业化水平提高作出贡献。"
 eng_overhauled_admiralty_decision.desc.entry: "海军从来不缺勇敢的舰长，只缺能把库存账目算清的人。$name_samuel$·$Pepys$从未指挥过一艘船，但很可能正因如此，他才是合适的人选。"
 eng_overhauled_admiralty_decision.a: "任命他为我们的海军大臣。"
 eng_overhauled_admiralty_decision.b: "他目前的改革成果就足够了。"
 enable_overhauled_admiralty_reform: "解锁[ShowGovernmentReformName('overhauled_admiralty_reform')][government_reform|e]"
 STATIC_MODIFIER_NAME_samuel_pepys_diligence: "塞缪尔·佩皮斯的贡献"
 eng_overhauled_admiralty_decision.tt3: "他在海军委员会的工作使得海军管理程序得到了简化"
 eng_overhauled_admiralty_decision.historical_info: "在皇家海军发展史上的关键时期，塞缪尔·佩皮斯的工作对皇家海军的现代化改革而言不可或缺。其中一些条例包括了改善海军的供应配给、建立水兵和军官的定期薪饷制度。今天的人们对他最深刻的印象是跨度达十年的《佩皮斯日记》，其中事无巨细地记载了他十年生活的每一个细节，为伦敦大火和伦敦鼠疫等历史事件提供了详细的记录。"
 eng_taxation_law_decision.title: "所得税"
 eng_taxation_law_decision.desc: "国家的财政状况十分微妙，引发了人们对改革必要性的讨论。人们普遍认为，目前的税收制度让富人受益过多，却未能为政府带来足够收入。内阁成员[william_pitt_the_younger.GetName]主张征收临时所得税，以支撑国家财政并重新分配财富，但这一建议显然遭到了[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的反对。"
 eng_taxation_law_decision.desc.entry: "不对富人征收的税收不上几个钱，而且没人会对此满意。$name_william$·$Pitt$提议直接征收一项临时但不可豁免的所得税，正因如此，$nobles_estate$和$clergy_estate$会拼命反对到底。"
 eng_taxation_law_decision.a: "公平且进步。"
 eng_taxation_law_decision.b: "关税和消费税将撑起我们的国库。"
 eng_taxation_law_decision.c: "真是个棘手的政治问题。"
 eng_taxation_law_decision.custom: "解锁[ShowLawName('eng_taxation_law')][law|e]"
 eng_taxation_law_decision.tt: "议会对我们无视[target_root_country.GetNameWithNoTooltip]脆弱的财政状况感到不满"
 STATIC_MODIFIER_NAME_temporary_income_tax: "临时所得税"
 eng_taxation_law_decision.historical_info: "英国首相小威廉·皮特提出了所得税制度以解决持续的拿破仑战争造成的财政压力。他将所得税设计为累进税制，即收入越高的人缴纳的税款占其收入的比例越高。它遭到了高收入者的反对，最终在战争结束后被废除。"
 eng_factory_working_conditions_decision.title: "工厂法"
 eng_factory_working_conditions_decision.desc: "改革者正在倡导改善工厂工人的工作权利，他们往往遭遇无处不在的剥削，处于恶劣的工作条件却领着微薄的工资。任何改变现状的尝试都会遭到反对，并可能对经济增长和生产力产生不利影响。然而，如果情况得不到改善，我们将面临劳动力外流的风险。"
 eng_factory_working_conditions_decision.a: "这些可怜的灵魂需要救济。"
 eng_factory_working_conditions_decision.b: "工人是经济引擎的动力。"
 eng_factory_working_conditions_decision.c: "这些忘恩负义的人本该表示些感激。"
 eng_factory_working_conditions_decision.custom: "解锁[ShowLawName('factory_working_conditions_law')][law|e]"
 eng_factory_working_conditions_decision.historical_info: "《工厂法》是英国的一项重要立法，标志着改善工作条件和保护工厂工人（尤其是童工）权利的一个转折点，以防止这些童工每天工作超过12小时却领着微薄工资。该法案引入了年龄限制、教育要求和工厂检查，并迫使工厂主改善总体安全状况和保存雇佣记录。"
 eng_coke_smelting_decision.title: "投资达比的工作"
 eng_coke_smelting_decision.desc: "钢铁业的先驱[abraham_darby.GetName]开发出了一种称为“焦炭”的高炉用新燃料。这种燃料挥发性较低，与该行业目前使用的木炭相比，能够持续产生更高的热量。[abraham_darby.GetNameWithNoTooltip]目前正在他的家族[ShowBuildingTypeName('iron_foundry')]产业进行试验，并取得了可喜的成果。"
 eng_coke_smelting_decision.desc.entry: "木炭烧得够热，可供铁匠使用，却始终不够热，难以供高炉使用。$name_abraham$·$Darby$一直在把煤焙烧成一种更稳定的东西，而他在[ShowBuildingTypeName('iron_foundry')]的初次试验表明，铁很快就能以森林永远无法支撑的数量生产出来。"
 eng_coke_smelting_decision.a: "使其成为行业规范。"
 eng_coke_smelting_decision.tt2: "新的加工燃料提高了对[ShowGoodsName('coal')]的需求"
 enable_coke_smelting_advance: "解锁[ShowAdvanceName('coke_smelting')][advance|e]"
 unlocked_advance_coke_smelting_tt: "已采取$eng_coke_smelting_decision.title$[decision|e]"
 eng_coke_smelting_decision.historical_info: "亚伯拉罕·达比一世发明的焦炭冶炼工艺被认为是大大推动工业革命的主要催化剂。它带来的直接影响是炼铁技术的根本性变革，使钢铁在各行各业得到广泛应用。它还为铸铁的大规模生产奠定了基础，这对工业革命至关重要。"
 eng_royal_society_decision.title: "皇家学会"
 eng_royal_society_decision.desc: "最优质的头脑汇聚到我们的麾下，诞生了我们社会中最伟大的那些发明。我们可以在[ROOT.GetCountry.GetCapital.GetName]成立一个独立的机构，并由独立理事会进行管理，以支持和表彰杰出的科学贡献。它还将为政策和教育提供科学建议，使我们的研究工作重点突出。"
 eng_royal_society_decision.desc.entry: "学者们本来就在自行聚会、通信、争论，不劳我们插手；他们缺的只是一处屋檐和一纸特许状。若把这两样赐予他们，本国的自然哲学家便既能探究自己的问题，也能为我们所用。"
 eng_royal_society_decision.a: "很棒的主意。"
 eng_royal_society_decision.b: "投资现有的大学院校。"
 eng_royal_society_decision.historical_info: "英国皇家学会成立于1660年，正值英国国王查尔斯二世统治时期。它的发起人是科学界的领军人物，致力于拓展科学理解的边界，确保科学的进步。其目标是创建一个平台，让科学家、学者和知识分子能够聚在一起交流研究成果，从而将理论转化为实际成果。"
 eng_royal_society_decision.tt1: "我们的统治者成为了新成立学会的赞助人"
 eng_royal_academy_of_arts_decision.title: "皇家艺术学会"
 eng_royal_academy_of_arts_decision.desc: "有人提议[ROOT.GetCountry.GetGovernment.GetRuler.GetName]出资成立一个负责创办一所旨在促进创造力和艺术发展的机构，并作为一所学院或设计院校供艺术学徒使用。该机构每年应举办一场当代艺术展览，并欢迎所有艺术家参与。"
 eng_royal_academy_of_arts_decision.desc.entry: "在海外受训的画家，在带回技法的同时也带回了外国的品味。若我们设立自己的学院，每年举办向所有艺术家开放的展览，并由统治者的钱袋作为后盾——便能让下一代在国内学习这门技艺。"
 eng_royal_academy_of_arts_decision.a: "欣然同意！"
 eng_royal_academy_of_arts_decision.b: "最好用来教化底层民众。"
 STATIC_MODIFIER_NAME_increased_educational_spending: "增加教育支出"
 eng_royal_academy_of_arts_decision.historical_info: "英国皇家艺术学会是一家私人资助的机构，致力于促进视觉艺术和建筑艺术的发展。它由乔舒亚·雷诺兹和威廉·钱伯斯两位爵士于1768年创办，国王乔治三世成为了研究院的首位皇家赞助人。学会的会员身份极富声望，授予在各自领域做出重大贡献的艺术家和建筑师。"
 eng_enclosure_act_decision.title: "圈地法"
 eng_enclosure_act_decision.desc: "工厂和土地所有者正在向议会请愿，要求允许公共土地进一步私有化，以加快劳动力从农村地区向城市地区迁移。虽然这可能会造成大量的社会人口迁移，但也能确保劳动力的充足供应，并提高农业的整体产量。"
 eng_enclosure_act_decision.a: "背井离乡的工人才是最有劲的工人。"
 eng_enclosure_act_decision.a.custom: "愤怒的[ShowPopTypeName('peasants')]引发骚乱，使10个[locations|e]降低[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%][prosperity|e]"
 eng_enclosure_act_decision.tt: "法案以牺牲[ShowEstateTypeName('peasants_estate')]为代价加快了城市化进程并促进了工业化"
 enable_enclosure_act_policy: "解锁[ShowPolicyName('enclosure_act')][policy|e]"
 enclosure_riots: "圈地骚乱"
 eng_enclosure_act_decision.historical_info: "《圈地法》是英格兰颁布的一系列法律，允许进一步圈占公有土地和空地，或将其私有化。它们是更广泛的经济和农业变革的一部分，被认为是支持商业农业崛起和工业化发展所必需的。这些法案加剧了社会不平等，导致成千上万的农村劳动力流离失所，被迫到城市寻找工作。最终，被剥夺了传统权利的农民和工人爆发了骚乱。"
 sco_witchcraft_act_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]《巫术法案》"
 sco_witchcraft_act_decision.title.entry: "巫术法案"
 sco_witchcraft_act_decision.desc: "民众对女巫和巫术日益增长的厌恶情绪已越来越受到宫廷的关注。关于女巫活动的报告在[ROOT.GetCountry.GetGovernment.GetRuler.GetName]面前堆积如山，亟待解决。这些报告内容广泛，从被指控熬制药水的看似无害的当地治疗师，到所谓的恶魔附身事件。甚至有个农夫发誓说自己曾变成蝾螈，但后来又恢复了原样。\n\n要求制定新法律来迫害女巫的提议越来越多，[ROOT.GetCountry.GetGovernment.GetRulerTitle]也开始就此事表达[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]自己的看法。"
 sco_witchcraft_act_decision.desc.entry: "宫廷如今收到的巫术指控比盗窃指控还多，必须有人决定其中哪些值得开庭审理。一项法令至少能把此事纳入法律轨道，尽管一项针对女巫的法律有一种奇特的属性：它会制造出更多女巫。"
 sco_witchcraft_act_decision.a: "为《巫术法案》辩护。"
 sco_witchcraft_act_decision.b: "废除它。"
 sco_witchcraft_act_decision.historical_info: "1563年《苏格兰巫术法案》将施行巫术及咨询女巫的行为均定为死罪。詹姆斯六世在北贝里克女巫审判案中发挥了重要作用，这是新法案下首批大规模审判。国王于1597年在《恶魔研究》中为猎巫行为辩护，但后来逐渐产生怀疑并采取措施限制起诉。苏格兰约有6000人因巫术受审，其中75%被告为女性，超过1500人被处决。"
 sco_preserve_clan_autonomy_decision.title: "艾奥纳法规"
 sco_preserve_clan_autonomy_decision.desc: "虽然[ROOT.GetCountry.GetAdjective]低地地区的多数[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]已让继承人接受本地学校教育，但许多残余的[ShowCultureName('highland')]氏族仍遵循传统的教育方式。\n\n随着时间的推移，这种情况被视为对[ROOT.GetCountry.GetNameWithNoTooltip]不利。[ROOT.GetCountry.GetGovernment.GetCourtTitle]内有人提议推行新政策，强制这些氏族成员将继承人送入[ROOT.GetCountry.GetNameWithNoTooltip]低地的各类学校就读。\n\n该政策无疑将培养出受过更良好教育的氏族领袖，但也有人担忧这会使[ShowCultureNameWithNoTooltip('highland')]氏族变得与低地氏族无异。"
 sco_preserve_clan_autonomy_decision.desc.entry: "一个在本土教育继承人的氏族，培养出的是忠于氏族的人；一个把继承人送往南方的氏族，培养出的是忠于教导他们之人的人。强迫[ShowCultureName('highland')]酋长选择后者，将给我们带来更有用的一代领主，以及更少高地色彩的一代。"
 sco_preserve_clan_autonomy_decision.a: "实施这项法规。"
 sco_preserve_clan_autonomy_decision.b: "他们的旧权利将得到加强。"
 eng_east_india_company_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]东印度公司"
 eng_east_india_company_decision.title.entry: "东印度公司"
 eng_east_india_company_decision.desc: "和这个时代所有沿海国家一样，[ROOT.GetCountry.GetLongName]也效仿他们进行海外扩张，并找到了一条通往东印度群岛的航线。成立一家公司来开发那里的丰富资源，对我们肯定大有好处。"
 eng_east_india_company_decision.desc.entry: "东方的航线已不再是一个值得保守的秘密，每一个拥有港口的对手都已经在走这条航线了。一家特许公司可以让私人资本承担远航的风险，而王室则从返航所得中收取收益。"
 eng_east_india_company_decision.a: "我们会利用这次机会！"
 eng_east_india_company_decision.b: "我们应该专注于本土。"
 sco_company_of_scotland_decision.title: "建立[ShowGovernmentReformNameWithNoTooltip('company_of_scotland')]"
 sco_company_of_scotland_decision.desc: "随着我们对海外贸易的兴趣日益增长，政府对洲际贸易航线缺乏监管这一点也越来越令人担忧。我们应当把贸易垄断权授予值得托付的人，由他们负责组织我们的航运，并保护我们的投资。"
 sco_company_of_scotland_decision.a: "公司会为我国带来繁荣！"
 sco_company_of_scotland_decision.b: "这听起来有点冒险。"
