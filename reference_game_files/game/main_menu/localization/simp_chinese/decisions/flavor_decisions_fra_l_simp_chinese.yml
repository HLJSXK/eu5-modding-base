l_simp_chinese:
 fra_taille_tax_decision.title: "稳定税收体制的建立"
 fra_taille_tax_decision.desc: "经过一系列艰巨的工作，[ruler_fra.GetName]完成了[ROOT.GetCountry.GetName]财政的重塑。虽然[ROOT.GetCountry.GetNameWithNoTooltip]保留了只在战争期间征收的[ShowPolicyName('exceptional_only')]政策，但[ruler_fra.GetShortNameWithNoTooltip]成功建立了稳定税收体制的框架。在与[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]达成妥协后，新政策可以颁布了，不过这些新赋税政策一定会招致[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]的反对。"
 fra_taille_tax_decision.desc.entry: "只在战时才获表决通过的税，每次征战都必须重新恳求批准。将其永久固定下来便能终结这种恳求；只要赋税的重担落在$burghers_estate$和$peasants_estate$身上，就能使$nobles_estate$和$clergy_estate$同意。"
 fra_taille_tax_decision.a: "推行它。"
 fra_taille_tax_decision.b: "老方法更好……"
 enables_taille_laws: "[ROOT.GetCountry.GetName]会解锁[ShowLawName('fra_taille')]法律"
 fra_taille_tax_decision.historical_info: "查理七世统治时期，法兰西财政体系得到重塑，建立起了平民税制度，使法国出现了稳定的税收制度。虽然贵族和教士得到免税待遇，但平民税这一直接土地税将会在百年战争结束后为国家财政提供极大的助力。"
 fra_5_percent_tax_decision.title: "[target_character.GetLastNameWithNoTooltip]的廿一税"
 fra_5_percent_tax_decision.title.entry: "$de_machault$的廿一税"
 fra_5_percent_tax_decision.desc: "当[ShowLawName('fra_taille')]最初实施时，它取代了[ROOT.GetCountry.GetLongName]沿用已久的封建税制。然而，随着时间推移，国家的整体税收体系日趋复杂，过去赋予[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层的特殊豁免权逐渐显得低效。\n\n[ROOT.GetCountry.GetAdjectiveWithNoTooltip]行政官员[target_character.GetName]提出了一项改革方案，拟重新定义[ShowLawNameWithNoTooltip('fra_taille')]，即在原有土地税的基础上，额外征收#italic 5%#!的赋税，并将其适用于[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]。尽管该方案有助于改善国家财政，但[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]已对此表达强烈反对。"
 fra_5_percent_tax_decision.desc.entry: "数百年前因服役而授予的免税特权，至今每年仍在耗费国库。$name_john.french_language$·$name_baptiste$·$de_machault$提议，凡持有土地者，都应按土地收成缴纳统一份额；这笔数额不算大，但其原则却令人无法容忍，$clergy_estate$和$nobles_estate$已经一片哗然。"
 fra_5_percent_tax_decision.a: "强制通过！"
 fra_5_percent_tax_decision_tt: "$name_john.french_language$·$name_baptiste$·$de_machault$会加入我们的[court|e]"
 fra_5_percent_tax_decision.b: "我们可不能惹怒他们。"
 unlocks_machault_tax_reforms: "[ROOT.GetCountry.GetName]会解锁[ShowLawName('fra_5_percent_tax')]，这是[ShowLawName('fra_taille')]的延伸"
 fra_5_percent_tax_decision.historical_info: "1745年12月，让‑巴蒂斯特·马绍成为法国财政总管后，发现法国正处在破产的边缘。贵族和教士都没有缴纳一般土地税。1749年，马绍试图改革赋税制度，以无差别征收的廿一税收取代古老的、贵族和教士无需缴纳的什一税。该提案遭到神职人员和贵族声讨，他们列举了他们的历史特权，使得马绍无法通过议案。"
 fra_fouage_tax_decision.title: "壁炉税"
 fra_fouage_tax_decision.desc: "[scope_ruler.GetName]在当政期间过着相当奢靡的生活。从巡游[GetCountry('FRA').GetName]的各个庄园到[ROOT.GetCountry.GetCapital.GetName]王宫的维护都导致帑藏空虚。为了维持[scope_ruler.GetShortNameWithNoTooltip]奢侈的生活方式并稳定财政，内阁成员提出了对整个[GetCountry('FRA').GetNameWithNoTooltip]的家庭征收#italic 壁炉税#!的想法。虽然这项拟议的税种将对[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]造成沉重打击，但它也能让[scope_ruler.GetShortNameWithNoTooltip]保持奢靡生活的同时恢复内帑。"
 fra_fouage_tax_decision.desc.entry: "宫殿、巡幸以及排场浩大地巡行的宫廷，都不是靠统治者自掏腰包维持的。一项壁炉税能触及$FRA$的每一户人家，并会迅速充实国库；这使它得到内阁青睐，却不受任何住在那些壁炉旁的人欢迎。"
 fra_fouage_tax_decision.a: "为了[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]征收该项赋税。"
 fra_fouage_tax_decision.a.entry: "为$crown_estate$征收该项赋税。"
 fra_fouage_tax_decision.b: "暂缓征收此项税赋。"
 fra_fouage_tax_decision.c: "国家不会承担[scope_ruler.GetShortNameWithNoTooltip]的奢靡。"
 fra_fouage_tax_decision.c.entry: "国家不会承担统治者的奢靡。"
 variable_tt_enabled_fouage_tax: "已启用炉灶税"
 fra_fouage_tax_decision.historical_info: "壁炉税最初由腓力三世设立，以支付王室开支以及弥补黑死病和百年战争的财政影响，是为了维持法兰西君主的内帑而征收的著名税种之一。虽然该税起初只在[GetCountry('FRA').GetAdjectiveWithNoTooltip]部分地区征收，但最终于14世纪晚期扩大到了法兰西的大部分地区。"
 fra_edict_of_toleration_decision.title: "枫丹白露敕令"
 fra_edict_of_toleration_decision.desc: "宗教改革的传播如同一股海啸席卷[ShowContinentName('europe')]，许多质疑[ShowReligionAdjective('catholic')]会教义的人如今改信了新成立的[ShowReligionAdjective('lutheran')]。虽然[GetCountry('FRA').GetName]大多数人仍追随[ShowReligionAdjectiveWithNoTooltip('catholic')]信仰，但[ShowReligionAdjectiveWithNoTooltip('lutheran')]信徒日益增长的影响力已迫使[ROOT.GetCountry.GetGovernment.GetCourtTitle]采取行动。\n\n有人请愿[ruler_fra.GetName]实施《[ShowPolicyName('edict_of_fontainebleau')]》，旨在在[ShowReligionAdjectiveWithNoTooltip('lutheran')]于[GetCountry('FRA').GetNameWithNoTooltip]制造更多动荡前粉碎它的影响力。"
 fra_edict_of_toleration_decision.desc.entry: "在商人和印刷商中传播的信仰，比农民所持的信仰更难铲除。[ShowReligionAdjective('lutheran')]会众目前仍然很少，我们的宫廷必须决定：是现在就用[ShowPolicyName('edict_of_fontainebleau')]将其镇压，还是学会与它们共存。"
 fra_edict_of_toleration_decision.a: "我们被迫采取行动对抗异端的崛起。"
 fra_edict_of_toleration_decision.b: "我们应该以人文主义的观点对待[ShowReligionAdjectiveWithNoTooltip('lutheran')]信徒。"
 fra_colonial_ambitions_decision.title: "回归殖民事务"
 fra_colonial_ambitions_decision.desc: "在宗教动乱席卷[GetCountry('FRA').GetName]几十年后，[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]再次提出了致力于殖民新大陆的方案。之前探索者的航行已经为[GetCountry('FRA').GetNameWithNoTooltip]带回了大量关于新大陆的信息，但宗教改革的爆发迫使[ROOT.GetCountry.GetGovernment.GetCourtTitle]放弃了殖民。然而，其他[ShowContinentName('europe')]殖民国家已经在新大陆建立了各自的定居点，[GetCountry('FRA').GetAdjectiveWithNoTooltip]定居点可能导致与其他殖民国家的外交破裂。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]还有些人提议国家致力于垄断新的印度贸易路线，在[ShowContinentName('asia')]建立一家贸易公司。"
 fra_colonial_ambitions_decision.desc.entry: "我们已知道西行的航路，缺的只是国内有足够安定的十年，来运用这份知识。对手已用这十年开拓殖民地，因此我们如今建立的任何定居点，都只能建在别人的地界上，除非我们转而着眼于[ShowContinentName('asia')]的贸易。"
 fra_colonial_ambitions_decision.a: "新大陆的土地将成为我们的重心。"
 fra_colonial_ambitions_decision.b: "我们应该尝试垄断印度贸易。"
 fra_centralize_monarchy_decision.title: "整合封邑领土"
 fra_centralize_monarchy_decision.desc: "经历了几个世纪的碎片化之后，王室终于收回了许多封邑领土，将其再次并入王室领地。虽然卡佩家族的各支系已证明他们是有能力的臣子，但他们也使集权变得困难重重。如今整合了这些土地，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]和他的宫廷可以采取措施将[GetCountry('FRA').GetName]改革为一个更现代的国家了。"
 fra_centralize_monarchy_decision.desc.entry: "几代人以来，这些封地都由王室宗亲治理，这样虽方便，却使改革无从谈起。那些土地终于直接听命于王室，而一个听命于单一权威的王国，也终于可以作为一个国家来治理了。"
 fra_centralize_monarchy_decision.a: "[GetCountry('FRA').GetNameWithNoTooltip]现代化的一大步。"
 fra_code_louis_decision.title: "起草路易法典"
 fra_code_louis_decision.desc: "为了统一国内法律体系，[fra_ruler.GetName]和[fra_ruler.GetHisHer]在[ROOT.GetCountry.GetGovernment.GetCourtTitle]内的许多近臣完成了#italic 《路易法典》#!，第一部试图统一全[ROOT.GetCountry.GetName]法律制度的法典。几个世纪以来，[ROOT.GetCountry.GetNameWithNoTooltip]存在两种并存的法律体系，北部省份通行旧的习惯法，而南方省份则以罗马民法为主要法典。\n\n虽然《路易法典》会统一[ROOT.GetCountry.GetNameWithNoTooltip]的法律，但一些顾问谏言推行它时要多加谨慎，因为一些省份，尤其是通行罗马法的南方省份，也许不愿采纳新法典。"
 fra_code_louis_decision.desc.entry: "一个商人从一省跨入另一省，改换法律就如同换马一样必然。为整个$FRA$颁行一部统一法典便能终结这种局面，但南方诸省早在王国存在之前就已保有罗马法，绝不会轻易放弃。"
 fra_code_louis_decision.a: "是时候让整个[ROOT.GetCountry.GetNameWithNoTooltip]遵循一部统一的法典了。"
 fra_code_louis_decision.a.entry: "是时候让整个国家遵循一部统一的法典了。"
 fra_code_louis_decision.b: "暂时仅在[ROOT.GetCountry.GetNameWithNoTooltip]北部省份实施法典。"
 fra_code_louis_decision.b.entry: "暂时仅在$FRA$北部省份实施法典。"
 fra_versailles_residence_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]与凡尔赛宫"
 fra_versailles_residence_decision.title.entry: "$nobles_estate$与凡尔赛宫"
 fra_versailles_residence_decision.desc: "凡尔赛宫自建成起迅速成为了极受欢迎的[fra_ruler.GetName]和[ROOT.GetCountry.GetGovernment.GetAdjective]统治家族招待[ROOT.GetCountry.GetName]权贵的聚会宫。虽然这座宫殿是作为[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetRulerTitle]“君权神授”的象征而建的，但它也逐渐成为了获准居住于其中的贵族政治地位的象征。\n\n[fra_ruler.GetShortNameWithNoTooltip]的许多[ROOT.GetCountry.GetGovernment.GetCourtTitle]近臣建议[fra_ruler.GetHerHis]扩大邀请资格，让许多仍坚守旧封建思想的显要家族入住凡尔赛宫，进而加强[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]权力。"
 fra_versailles_residence_decision.desc.entry: "一座宾客盈门的豪宅，也是一座满是人质的豪宅。那些仍固守旧日封建习气的家族，可以被邀请到凡尔赛宫，用奉承让他们留下；他们每多留一季，$crown_estate$对他们的畏惧就少一分。"
 fra_versailles_residence_decision.a: "扩大资格，邀请重要家族在凡尔赛宫居住。"
 fra_versailles_residence_decision.b: "这座宫殿是为了[ROOT.GetCountry.GetGovernment.GetAdjective]统治家族而建，不要偏离这个方向。"
 fra_versailles_residence_decision.b.entry: "这座宫殿是为王室享乐而建，不要偏离这个方向。"
 this_may_lead_to_permanent_weakening_of_the_nobility: "允许[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]在凡尔赛宫居住可以永久削弱他们的影响力。"
 fra_versailles_permanent_decision.title: "为[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]设立永久驻地"
 fra_versailles_permanent_decision.title.entry: "为$nobles_estate$设立永久居所"
 fra_versailles_permanent_decision.desc: "通过允许[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]在凡尔赛宫居住以确保他们的忠诚并限制其政治影响力的做法非常有效，越来越多权贵选择入住凡尔赛宫而不是住在他们自己的庄园里。每当凡尔赛宫举行[ROOT.GetCountry.GetGovernment.GetAdjective]舞会，这些贵族沉醉于这座宫殿的奢华，并很快热衷于维持与[fra_ruler.GetName]的亲密关系，以获得[fra_ruler.GetHisHer]的恩宠。\n\n[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的权力曾是[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetRulerTitle]的肉中之刺，但凡尔赛宫的诱惑使[fra_ruler.GetShortNameWithNoTooltip]真正成为了至高无上的[ROOT.GetCountry.GetGovernment.GetRulerTitle]。"
 fra_versailles_permanent_decision.desc.entry: "陷阱合拢得比任何人预料的都更温和。$nobles_estate$如今争夺的是我们宫廷中的房间和位次，而非他们自己领地中的权力；一位不再受对手困扰的统治者，便无人可挑战。"
 fra_versailles_permanent_decision.a: "凡尔赛宫的卓越已永远遮蔽[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的光芒。"
 fra_versailles_permanent_decision.a.entry: "凡尔赛的显赫已永远遮蔽$nobles_estate$的光芒。"
 fra_versailles_permanent_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的历史权力仍必须得到尊重。"
 fra_versailles_permanent_decision.b_tt: "我们将能够在稍后选择$permanent_residence_in_versailles$"
 fra_versailles_permanent_decision.b.entry: "$nobles_estate$的历史权势仍必须得到尊重。"
 fra_marcel_great_ordinance_decision.title: "大法令"
 fra_marcel_great_ordinance_decision.desc: "近日的冲突使[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]的财政承受巨大压力，为了筹集资金和兵力，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]不得不再次请求三级会议支持[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]。然而，近几十年来，三级会议内部的情绪愈加不满，尤其是第三等级，自冲突爆发以来，令人困惑的财政政策变化让他们开始怀疑对战争的支持。在这些反对声音中，影响力日渐壮大的领袖[etienne_marcel.GetName]提出了一项提案，反对政府从三级会议中筹集新的资金。在他的《大法令》中，[etienne_marcel.GetNameWithNoTooltip]要求[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]同意限制自身权力，为[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]主导的改革铺平道路。"
 fra_marcel_great_ordinance_decision.desc.entry: "三级会议在为当前战争筹措资金的辩论中陷入僵局。由有影响力的商人领导的第三等级提出了一项“大法令”，以增加他们自身的特权和权力来换取他们的支持。我们可以接受他们的提议，或者另寻办法从三级会议那里获得资金。"
 fra_marcel_great_ordinance_decision.a: "危急时刻需要非常措施。"
 fra_marcel_great_ordinance_decision.b: "还是向贵族求助吧！"
 fra_marcel_great_ordinance_decision.c: "试图与马塞尔协商妥协。"
 fra_marcel_great_ordinance_decision_cooldown: "最近拒绝与马塞尔合作"
 fra_marcel_great_ordinance_decision.historical_info: "在普瓦捷战役以及国王约翰二世被俘后，摄政的王太子查理被迫召开三级会议应对这场战役的后果。在这次三级会议上，他遭到了在第三阶级中拥有非凡影响力的艾蒂安·马塞尔的激烈反对，马塞尔要求查理同意数项协议，包括签署《大法令》以及其他政治妥协，例如释放马塞尔的政治盟友纳瓦拉国王“恶王”查理。虽然王太子最初非常抵制马塞尔的要求，但最终还是被迫妥协，签署了法令。不过，约翰二世在1357年废止了大法令，阻止了该法令完全生效。"
 fra_marcel_compromise_decision.title: "妥协后的马塞尔大法令"
 fra_marcel_compromise_decision.desc: "[ROOT.GetCountry.GetLongName]仍深陷战争，促使[etienne_marcel.GetName]提出建议的那些国家苦难也并未减轻。我们过去拒绝了那些建议，但或许不得不面对现实：没有三级会议的支持，[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]可能难以渡过难关。或许我们该主动联系[etienne_marcel.GetNameWithNoTooltip]，重新审视他早先的提议，以达成妥协。诚然，我们将不得不把部分自身权威让给他，但作为回报，我们能获得三级会议的财政支持。"
 fra_marcel_compromise_decision.desc.entry: "我们拒绝接受《大法令》的条款，但我们仍深陷战事，三级会议也仍想利用这一局势。若我们主动与他们接触，或许能达成妥协。"
 fra_marcel_compromise_decision.a: "试图与马塞尔协商妥协。"
 fra_marcel_compromise_decision.a.tt: "$Marcel$将不再反对我们"
 fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$"
 fra_formalized_relations_decision.title: "[ShowRegionNameWithNoTooltip('italy_region')]事务"
 fra_formalized_relations_decision.desc: "最近，我们南方阿尔卑斯山沿线的边境地区重新成为焦点。[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]在过去曾接触过几个[ShowCultureGroupName('italian_group')]国家和[ShowRegionName('italy_region')]家族，但难以维持与该区域的联系。不少顾问和廷臣建议[fra_ruler.GetName]，[ROOT.GetCountry.GetName]应该在这里建立影响力，[ShowRegionNameWithNoTooltip('italy_region')]区域国家众多，有潜力成为强大的政治盟友。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中还有些人则认为，我们应该采取更咄咄逼人的方案，强行将[ShowCultureGroupNameWithNoTooltip('italian_group')]邻国置于[ROOT.GetCountry.GetNameWithNoTooltip]的羽翼之下。"
 fra_formalized_relations_decision.desc.entry: "近年来，阿尔卑斯山的各山口看起来不再像边境，而更像机遇。[ShowRegionName('italy_region')]区域的各[ShowCultureGroupName('italian_group')]国家富庶、分裂，既可作为盟友，也可作为臣属——取决于我们选择采纳谁的建议。"
 fra_formalized_relations_decision.a: "尝试与能提供利益的国家建立友善关系。"
 fra_formalized_relations_decision.b: "我们应该暂时维持中立政策。"
 fra_formalized_relations_decision.c: "我们的[ShowCultureGroupNameWithNoTooltip('italian_group')]邻国由我们掌控是最好的。"
