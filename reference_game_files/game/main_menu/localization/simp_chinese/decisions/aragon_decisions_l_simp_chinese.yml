l_simp_chinese:
 ara_coronate_ruler.title: "$flavor_ara.22.title$"
 ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
 ara_coronate_ruler.desc: "[target_character.GetName]已经登上王位，众多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]都聚集到著名的[ShowLocationName('zaragoza')]见证加冕仪式，在这里，[ROOT.GetCountry.GetGovernment.GetRulerTitle]将宣誓维护[ROOT.GetCountry.GetFlavorRank]的法律、人民的自由以及各阶层的特权。"
 ara_coronate_ruler.desc.entry: "新登上王位的统治者，只有举办合乎规格的加冕仪式，才能真正获得[ShowEstateTypeName('nobles_estate')]和[ShowEstateTypeName('peasants_estate')]阶层的效忠。没有完成加冕的君主，不会得到承认。"
 ara_coronate_ruler.a: "$flavor_ara.23.a$"
 ara_coronate_ruler.b: "让我们废除这一传统。"
 ara_unite_barcelona_dynasty.title: "统一王朝"
 ara_unite_barcelona_dynasty.desc: "随着[ShowCultureName('sicilian')]晚祷为我们家族确保了王位，我们在[ShowRegionName('italy_region')]的影响力增长了。尽管如此，[ShowAreaName('sicily_area')]仍保持其主权，与我们的王朝政治保持距离。与其让这个机会从我们身边溜走，或许我们可以联系在那里的亲属，建立更牢固的王朝联合，并有可能启动我们在[ShowRegionNameWithNoTooltip('italy_region')]的野心。"
 ara_unite_barcelona_dynasty.a: "让我们试着将两顶王冠合二为一。"
 ara_unite_barcelona_dynasty.b: "他们将作为我们的附属国为我们效力。"
 ara_effects_only_take_place_if_sic_accepts_tt: "只有[GetCountry('SIC').GetName]接受后，效果才会生效"
 ara_vassalize_bosnia.title: "要求[GetCountry('BOS').GetNameWithNoTooltip]臣服"
 ara_vassalize_bosnia.desc: "[GetCountry('BOS').GetName]的伟大统治者长期以来一直在对抗贪权的邻邦，艰难维持自身主权。由于无力独自自卫，数名[GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')]已找上我们宫廷，请求我们保护他们免受任何入侵。他们宁愿成为我们的臣民，也不愿落入异教徒之手——这一点我们可以加以利用。"
 ara_vassalize_bosnia.a: "是时候要求他们臣服了。"
 ara_ask_bosnia_for_vassalization: "我们将要求[GetCountry('BOS').GetName]臣服"
