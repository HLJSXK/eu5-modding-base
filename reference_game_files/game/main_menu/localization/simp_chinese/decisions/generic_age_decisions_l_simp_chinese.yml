l_simp_chinese:
 sponsor_a_cathedral_decision.title: "赞助主教座堂"
 sponsor_a_cathedral_decision.desc: "我们的国家仍然缺乏敬拜和践行我们信仰的场所。我们应该资助建造一座新的[ShowBuildingTypeName('cathedral')]，以满足我们人民的需要。"
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_decision.b: "现在不是合适的时机。"
 sponsor_a_cathedral_cooldown_tt: "在当前统治者统治期间尚未使用此[decision|e]"
 sponsor_a_great_madrasa_decision.title: "资助一座大伊斯兰学院"
 sponsor_a_great_madrasa_decision.desc: "虽然我们的国家已经有许多礼拜场所，但普通的[ShowBuildingTypeName('temple')]和[ShowBuildingTypeName('madrasa')]不足以满足我们学者的伟大头脑。我们应该投资建造一座新的[ShowBuildingTypeName('great_madrasa')]，为他们提供足够的空间来学习和传播知识。"
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_decision.b: "现在不是合适的时机。"
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 construct_a_grand_palace_decision.title: "委托建造一座新宫殿"
 construct_a_grand_palace_decision.desc: "我们的宫廷和统治者家族都缺乏一处配得上他们声望的住所。我们应该聘请一位[ShowArtistTypeName('architect')]来规划建造一座新的[ShowBuildingTypeName('grand_palace')]。"
 construct_a_grand_palace_decision.a: "这将是一处合适的住所。"
 construct_a_grand_palace_decision.a_tt: "聘请的[ShowArtistTypeName('architect')]将加入我们的[court|e]"
 strive_towards_thalassocracy_decision.title: "建立海权国"
 strive_towards_thalassocracy_decision.desc: "广阔的海洋可以成为我们国家和其经济扩张的重要组成部分，只要我们能充分支配沿海水域。将大量资源投入海军扩张，将使我们能够将基础设施与这种新的海外野心重点保持一致。"
 strive_towards_thalassocracy_decision.a: "让我们拥抱海洋。"
 strive_towards_thalassocracy_decision.a.tt: "我们将有20年时间来建立一支强大的海军"
 strive_thalassocracy_coastal_markets_tt: "拥有至少一个沿海[market_center|e]"
 abandon_thalassocracy_decision.title: "放弃建设海权国"
 abandon_thalassocracy_decision.desc: "通过支配海洋来统治不再适合我们自己的野心。我们应该将努力重新转向我们生活的土地。"
 abandon_thalassocracy_decision.a: "让我们回到更坚实的地面。"
 found_trade_company_india_decision.title: "支持我们的亚洲贸易路线"
 found_trade_company_india_decision.desc: "[ShowSubContinentName('south_asia')]和[ShowSubContinentName('south_east_asia')]的富裕海岸承诺给我们巨大利润。虽然我们目前的贸易努力主要由个体商人进行，但对于我们这样地位的国家来说，这显然不足够。我们应该利用国家的工具，在那些外国市场和我们自己的市场之间建立更大的贸易使团。"
 found_trade_company_india_decision.a: "投资一家印度贸易公司。"
 invite_foreign_advisor_decision.title: "购买外国创新"
 invite_foreign_advisor_decision.desc: "我国严重落后于世界其他大国。我们不能坐视其他国家在技术和创新领域超越我们。通过向这些国家中的某个人提供丰厚薪水，我们可以努力追赶，不至于在追求现代化的过程中进一步落后。"
 invite_foreign_advisor_decision.a: "欢迎外国学者。"
 invite_foreign_advisor_decision.a.tt: "一位来自其他[country|e]的学者将加入我们的[court|e]"
 invite_foreign_advisor_decision.b: "我们自己的顾问足够了。"
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 disempower_the_parliament_decision.title: "挑战议会权利"
 disempower_the_parliament_decision.desc: "在过去的几个世纪里，我们的议会获得了一些限制我们政府自身自由的权利。我们应该着眼于那些在议会中根深蒂固的席位，并撤销他们的权利！"
 disempower_the_parliament_decision.a: "我们需要遏制议会的权力。"
 disempower_the_parliament_decision.a_building_tt: "我们将移除我们某个[locations|e]中的一座[ShowBuildingTypeName('urban_parliament_seat')]"
 disempower_the_parliament_decision.a_tt: "[location|e]所有[pop|e]会失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 disempower_the_parliament_decision.b: "现在不是挑战议会的合适时机。"
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 abolish_serfdom_decision.title: "废除农奴制"
 abolish_serfdom_decision.desc: "我们国家长期实行的农奴制已经发展成为我们经济追求的障碍。考虑到我们这个时代动荡的政治气候，通过法令废除这种做法可能是明智的，以安抚我们不断壮大的中产阶级，并减轻那些在鞭子下受苦的人的痛苦。"
 abolish_serfdom_decision.a: "签署法令。"
 abolish_serfdom_decision.b: "这将极其影响稳定。"
 abandon_absolutism_decision.title: "放弃专制主义"
 abandon_absolutism_decision.desc: "我们统治者的专制政府越来越成为我们国家内部稳定的威胁。叛乱谣言变得频繁，镇压反对我们政权的人并非易事。也许现在是时候背弃旧的专制理想，为我们国家拥抱一种更自由的政府形式？"
 abandon_absolutism_decision.a: "专制主义不再适合我们。"
 abandon_absolutism_decision.b: "我们的权威至高无上！"
 jewish_expulsion_threat.title: "驱逐威胁"
 jewish_expulsion_threat.desc: "王室发出正式最后通牒：犹太社区必须支付特别税，否则将面临驱逐。这一威胁从恐惧的社区中榨取即时意外之财，但持续的不安全气氛扰乱了长期由犹太中间人维持的贸易网络。"
 jewish_expulsion_threat.a: "发出最后通牒。"
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "驱逐威胁"
 jews_may_choose_to_leave_tt: "我们大多数[ShowReligionAdjective('judaism')][pops|e]将迁移到邻国[countries|e]\n\n他们离开的每个[location|e]将遭受[ShowModifier('jewish_expulsion_threat')]，按其[ShowReligionAdjectiveWithNoTooltip('judaism')][pops]的份额增减"
