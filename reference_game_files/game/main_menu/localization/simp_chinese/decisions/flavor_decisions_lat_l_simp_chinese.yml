l_simp_chinese:
 ach_greek_populace_decision.title: "安抚[ShowCultureNameWithNoTooltip('greek_culture')]精英阶层"
 ach_greek_populace_decision.desc: "尽管[GetCountry('LAT').GetAdjective]在[ShowScriptedGeographyName('greece_geography')]的统治，已导致昔日[ShowCultureName('greek_culture')]精英阶层日渐衰落，但在国家部分地区，历史悠久的[ShowCultureNameWithNoTooltip('greek_culture')]家族成员通过与拉丁[GetEstateName('nobles_estate')]妥协，仍牢牢掌控着权力。然而自[GetCountry('LAT').GetLongNameWithNoTooltip]覆灭以来，[ShowCultureNameWithNoTooltip('greek_culture')]民众对拉丁统治愈发抵触。\n\n为谋求更稳固的统治，君主已邀请国内残存的[ShowCultureNameWithNoTooltip('greek_culture')]家族成员前往宫廷，商议妥协方案。但部分拉丁[GetEstateNameWithNoTooltip('nobles_estate')]反而要求进一步扩大他们对[ShowCultureNameWithNoTooltip('greek_culture')]民众的支配权，声称更强势的拉丁精英阶层才能镇压[ShowCultureNameWithNoTooltip('greek_culture')]的动乱。"
 ach_greek_populace_decision.desc.entry: "两个精英群体如今在这片土地上不安地共处，双方都不会在没有回报的情况下接受对方的条件。拉拢[ShowCultureName('greek_culture')]家族可以换来民众的安宁，而纵容拉丁$nobles_estate$则能买来那些已经手握刀剑之人的忠诚。"
 ach_greek_populace_decision.a: "维持现状。"
 ach_greek_populace_decision.b: "支持拉丁[GetEstateNameWithNoTooltip('nobles_estate')]。"
 ach_greek_populace_decision.b.entry: "支持拉丁$nobles_estate$。"
 ach_greek_populace_decision.c: "尽力与[ShowCultureNameWithNoTooltip('greek_culture')]家族达成妥协。"
 ach_pope_proposes_latin_restoration.title: "获得教宗对复辟拉丁帝国的支持"
 ach_pope_proposes_latin_restoration.desc: "得知我们在[ShowScriptedGeographyName('greece_geography')]的军事行动后，我们日益增长的力量已经吸引了教宗国的注意。\n\n在认可我方[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]的宣称权后，教宗承诺，若我方同意协助教宗推动[ShowReligionAdjective('catholic')]与[ShowReligionAdjective('orthodox')]教会和解，[GetCountry('PAP').GetNameWithNoTooltip]将为我方提供财政与政治支持。\n\n教宗同时强调，若成功光复[ShowLocationName('constantinople')]，绝不能重蹈第四次十字军东征给这座[ShowLocationNameWithNoTooltip('constantinople')]带来的悲剧。"
 ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')]虽昙花一现，但我们对其的宣称依然有效。为获取$PAP_ADJ$的支持，我们将在东方建立一个真正的[ShowReligionAdjective('catholic')]帝国，以[ShowLocationName('constantinople')]为首都，并比上一个更长久。"
 ach_pope_proposes_latin_restoration.a: "同意$PAP_ADJ$使节的要求，换取其支持。"
 ach_pope_proposes_latin_restoration.b: "光复[ShowLocationNameWithNoTooltip('constantinople')]无需教宗的帮助。"
 lat_aggressive_conversion_policies_tt: "若我们成功建立[GetCountry('LAT').GetLongName]，教宗可能会要求我方推行严苛的重新皈依政策，以此换取他的支持"
 lat_frankokratia_pope_proposes_latin_restoration.title: "请求教宗支持复辟拉丁帝国"
 lat_frankokratia_pope_proposes_latin_restoration.desc: "我国在[ShowScriptedGeographyName('greece_geography')]日益增长的影响力，已使我们成为该区域的重要强权，教宗也已注意到这股崛起的力量。随着[GetCountry('BYZ').GetName]影响力的衰败，教宗如今视我们为能在[ShowLocationName('constantinople')]复兴[GetCountry('LAT').GetLongName]的首要竞争者。\n\n倘若我们同意[GetCountry('PAP').GetAdjectiveWithNoTooltip]的一些要求，并且收复[ShowLocationNameWithNoTooltip('constantinople')]，教宗将提供[GetCountry('PAP').GetLongNameWithNoTooltip]的全力支持，承认我们的君主为[GetCountry('LAT').GetLongNameWithNoTooltip]的合法统治者。"
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "一个垂死的帝国和一个崛起的帝国，被同一个罗马注视着，而教宗已经决定他更偏爱我们中的哪一个。对一座复兴的[ShowLocationName('constantinople')]的合法性，是由他授予的；只要我们接受足够多他的条件，让这份馈赠看起来名正言顺，他就会授予。"
 lat_frankokratia_pope_proposes_latin_restoration.a: "接受教宗重建[GetCountry('LAT').GetLongNameWithNoTooltip]的请求。"
 lat_frankokratia_pope_proposes_latin_restoration.b: "我们不会受制于教宗的野心。"
 lat_greater_claims_of_the_latin_empire.title: "拉丁帝国的更大宣称"
 lat_greater_claims_of_the_latin_empire.desc: "1204年[ShowLocationName('constantinople')]陷落之后，昔日拉丁精英们迅速行动，巩固了对整个[ShowScriptedGeographyName('greece_geography')]地区[GetCountry('BYZ').GetAdjective]领地的控制，并宣称对[ShowRegionName('balkan_region')]拥有宗主权。然而，当时[GetCountry('SER').GetName]和[GetCountry('BUL').GetName]是拉丁人的主要竞争对手，尤其是[GetCountry('BUL').GetNameWithNoTooltip]，他们不断向拉丁领土发动军事行动，最终在当初的帝国的覆灭中扮演了重要角色。\n\n如今拉丁帝国已经重建，我们或可宣称对这些土地拥有统治权，实现昔日帝国未竟之业。"
 lat_greater_claims_of_the_latin_empire.desc.entry: "第一拉丁帝国并非亡于$BYZ_ADJ$的复仇，而是亡于它始终未能真正征服的邻邦。[ShowRegionName('balkan_region')]记得谁在1204年宣称了宗主权，以及后来是谁打破了这一宣称；一个复兴的帝国若忽视同样的对手，就是在招致同样的结局。"
 lat_greater_claims_of_the_latin_empire.a: "我们将奋力推进领土扩张，对付这些宿敌。"
 lat_greater_claims_of_the_latin_empire.b: "我们应避免重复过去的错误。"
 lat_restore_the_holy_patriarchate.title: "重建[ShowLocationNameWithNoTooltip('constantinople')]宗主教区"
 lat_restore_the_holy_patriarchate.desc: "尽管1204年[ShowLocationName('constantinople')]最初遭洗劫时遭到教宗反对，但[ShowLocationNameWithNoTooltip('constantinople')]被[ShowReligionAdjective('catholic')]十字军夺取，却为恢复宗主教区、提升[GetCountry('PAP').GetAdjective]权威提供了契机。然而，1261年[GetCharacter('byz_michael_viii_palaiologos').GetName]重新夺回[ShowLocationNameWithNoTooltip('constantinople')]使得这一称号再度失效。\n\n如今拉丁人恢复了对[ShowLocationNameWithNoTooltip('constantinople')]的统治，[GetEstateNameWithNoTooltip('clergy_estate')]内部许多人敦促我们恢复宗主教区。"
 lat_restore_the_holy_patriarchate.desc.entry: "一位驻于[ShowLocationName('constantinople')]、受我们保护的宗主教，将使该城的信仰向我们负责，而非向东方负责。我们的$clergy_estate$没有忘记这一头衔曾经存在，他们决心要让它重新设立。"
 lat_restore_the_holy_patriarchate.a: "允许恢复宗主教区。"
 lat_restore_the_holy_patriarchate.b: "承诺保护恢复后的宗主教区！"
 lat_restore_the_holy_patriarchate.c: "利用恢复后的宗主教区施加影响力。"
 lat_restore_the_holy_patriarchate.d: "拒绝恢复宗主教区。"
 latin_patriarchate_of_constantinople: "[ShowLocationNameWithNoTooltip('constantinople')]宗主教区"
