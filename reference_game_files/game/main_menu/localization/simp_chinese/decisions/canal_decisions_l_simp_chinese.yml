l_simp_chinese:
 build_suez_canal.title: "开凿苏伊士运河"
 build_suez_canal.desc: "我们的工程师报告，在苏伊士地峡开凿一条运河，以我们现有的技术完全可以实现。这个工程规模极大，但其回报，即掌控所有东方贸易，则更为巨大。"
 build_suez_canal.a: "为运河破土动工。"
 build_suez_canal.b: "现在还不行。"
 build_panama_canal.title: "开凿巴拿马运河"
 build_panama_canal.desc: "我们的工程师已经勘察过新大陆的狭窄地峡。连通两大洋的运河是可以建成的。工程的成本会非常高，但能带来的收益无法估量。"
 build_panama_canal.a: "为运河破土动工。"
 build_panama_canal.b: "现在还不行。"
