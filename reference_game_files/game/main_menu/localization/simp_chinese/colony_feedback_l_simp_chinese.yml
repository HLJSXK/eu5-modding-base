l_simp_chinese:
 ####################################################
 # M1 Forecast Row
 ####################################################
 COLONY_FORECAST_ETA_LINE: "#T 待定#! 距离下一次建立定居点约$MONTHS|v0$个月。\n该预估基于当前流入该殖民地的[migration|e]数量。随着流量加快或放缓，这一预估也会发生变化。"
 COLONY_FORECAST_ETA_LINE_SHORT: "~$MONTHS|v0$个月"
 COLONY_FORECAST_ETA_UNKNOWN: "#T 待定#!\n该殖民地尚无[migration|e]来源。一旦定居者开始抵达，就会显示预估值。"
 COLONY_FORECAST_ETA_UNKNOWN_SHORT: "待定"
 BOTTLENECK_SOURCE_DEPLETED: "@warning_icon!@peasants!来源枯竭"
 BOTTLENECK_SOURCE_DEPLETED_TT: "#T 缓慢：来源枯竭#!\n我们的定居者来源已经枯竭。向该殖民地输送[ShowPopTypeName('peasants')]的地点已无多余人口，因此在找到新来源之前，[migration|e]将持续放缓。"
 BOTTLENECK_GOODS: "@warning_icon!@goods!商品短缺"
 BOTTLENECK_GOODS_TT: "#T 缓慢：商品短缺#!\n该殖民地供应不足。它收到的[goods|e]不足所需量的75%，因此能供养的新定居者减少。"
 BOTTLENECK_MARITIME: "@warning_icon!@maritime_presence!海上存在有限"
 BOTTLENECK_MARITIME_TT: "#T 缓慢：海上存在有限#!\n定居者必须渡海才能抵达该殖民地，而我们在该区域的[maritime_presence|e]过于薄弱，无法全速运送他们。"
 BOTTLENECK_LOW_MIGRATION: "@warning_icon!@migration!移民不足"
 BOTTLENECK_LOW_MIGRATION_TT: "#T 缓慢：移民不足#!\n我们的人民中很少有人愿意前往殖民地。我们的[migration|e]过低，无法让定居者以稳定速度抵达。"
 ####################################################
 # M2 Milestone Messages
 ####################################################
 COLONIAL_CHARTER_FIRST_FLIP_SETUP: "当我们的殖民者在一个殖民省份建立首个定居点。"
 COLONIAL_CHARTER_FIRST_FLIP_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_TITLE: "$LOCATION$的首个定居点"
 COLONIAL_CHARTER_FIRST_FLIP_DESC: "我们的殖民者在$PROVINCE$的$LOCATION$建立了一个据点，这是[colonial_charter|e]$CHARTER$第一块落入我们王冠之下的土地。"
 COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "从这个滩头阵地开始，其余部分必须跟进。"
 COLONIAL_CHARTER_FIRST_FLIP_LOG: "$CHARTER$的首个定居点：$LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_BTN1: "前进！"
 COLONIAL_CHARTER_FIRST_FLIP_BTN2: "好的"
 COLONIAL_CHARTER_FIRST_FLIP_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_MAP: ""
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "当另一个国家的殖民省份中的首个地点被定居下来时。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "$LOCATION$的首个定居点"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "$COUNTRY$在$PROVINCE$的$LOCATION$建立了一个据点，这是[colonial_charter|e]$CHARTER$第一块落入他们王冠之下的土地。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "从这个滩头阵地开始，其余部分可能跟进。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "$COUNTRY$建立$CHARTER$的首个定居点：$LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN1: "我知道了。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN2: "好的"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_MAP: ""
 COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "当特许殖民地的移民来源地农民耗尽并重新随机时。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "$CHARTER$来源已枯竭"
 COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "向位于$PROVINCE$的[colonial_charter|e]$CHARTER$提供移民的来源地的[ShowPopTypeName('peasants')]已经耗尽。虽然已选定新的来源地，但在其恢复前，进度可能放缓。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "深井也有干涸之日。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "$CHARTER$移民来源已枯竭"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN1: "真不幸。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN2: "好的"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_MAP: ""
 COLONIAL_CHARTER_HALFWAY_SETUP: "当特许殖民地的进度超过50%时。"
 COLONIAL_CHARTER_HALFWAY_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_TITLE: "$PROVINCE$殖民进度过半"
 COLONIAL_CHARTER_HALFWAY_DESC: "我们在[colonial_charter|e]$CHARTER$下对$PROVINCE$的殖民已完成一半。"
 COLONIAL_CHARTER_HALFWAY_FLAVOR: "更艰难的一半还在前方，但回头路如今已比前路更长。"
 COLONIAL_CHARTER_HALFWAY_LOG: "$CHARTER$完成一半"
 COLONIAL_CHARTER_HALFWAY_BTN1: "继续推进。"
 COLONIAL_CHARTER_HALFWAY_BTN2: "好的"
 COLONIAL_CHARTER_HALFWAY_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_MAP: ""
 COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "当其他国家的特许殖民地进度超过50%时。"
 COLONIAL_CHARTER_HALFWAY_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "$PROVINCE$殖民进度过半"
 COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "$COUNTRY$在[colonial_charter|e]$CHARTER$下对$PROVINCE$的殖民已完成一半。"
 COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "更艰难的一半正等待着他们。"
 COLONIAL_CHARTER_HALFWAY_OTHER_LOG: "$CHARTER$完成一半（$COUNTRY$）"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN1: "我知道了。"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN2: "好的"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_OTHER_MAP: ""
 ####################################################
 # M3 Self-Sustaining Pill
 ####################################################
 COLONY_PILL_SELF_SUSTAINING: "#G 自给自足#!"
 COLONY_PILL_OPERATING_AT_LOSS: "#R 亏损#!"
 COLONY_SELF_SUSTAINING_HEADER: "自给自足"
 COLONY_OPERATING_AT_LOSS_HEADER: "亏损运营"
 COLONY_SELF_SUSTAINING_INCOME: "月收入：$VAL|+=$@gold!"
 COLONY_SELF_SUSTAINING_EXPENSE: "月支出：#R ‑$VAL|2$@gold!#!"
 COLONY_SELF_SUSTAINING_RESULT: "#italic 该殖民地可以自给自足，因为它每月的$BALANCE|+=2$@gold!收支已经达到了#TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!的要求门槛。#!"
 COLONY_OPERATING_AT_LOSS_RESULT: "#italic 该殖民地处于亏损状态，因为其每月结余$BALANCE|+=2$@gold!低于#TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!的要求门槛。#!"
 COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "每月支出 × 缓冲：$EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"
 ####################################################
 # M4/M5/M6 Helpful Actions Hints
 ####################################################
 COLONY_HELPFUL_ACTIONS_TITLE: "有助益的[cabinet_actions|e]"
 COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "三种[cabinet_actions|e]通常可加速特许殖民地进程：\n——鼓励移民\n——派遣人员前往特许殖民地\n——开拓边疆\n\n#weak 点击可直接跳转至这些行动。#!"
 COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "三种[cabinet_actions|e]通常可开发新殖民的地点：\n——提升控制度\n——发展省份\n——鼓励移民\n\n#weak 点击可直接跳转至这些行动。#!"
 COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "两种[cabinet_actions|e]通常有助于殖民国家的发展：\n——向殖民地派遣人口\n——发展省份\n\n#weak 点击可直接跳转至这些行动。#!"
