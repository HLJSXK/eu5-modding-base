l_simp_chinese:
 # Estate related
 maghrebi_culture_masters_of_sahara_country_bonus: "以下增益可以从$maghreb_masters_of_the_sahara.title$[decision|e]获得："
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "以下增益可以从$maghreb_masters_of_the_sahara.title$[decision|e]获得并会影响[ShowVegetationName('desert')][locations|e]："
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "以下增益可以从$maghreb_masters_of_the_sahara.title$[decision|e]获得并会影响[ShowClimateName('arid')][locations|e]："
 # Estate end
 maghrebi_culture.1.title: "[target_location.GetNameWithNoTooltip]的[ShowReligionAdjectiveWithNoTooltip('judaism')]社区"
 maghrebi_culture.1.desc: "尽管[ShowRegionName('maghreb_region')]的许多[ShowCultureName('mustaarabi')]人在穆瓦希德王朝统治期间被驱逐，但[target_location.GetName]已再度崛起为许多[ShowCultureNameWithNoTooltip('mustaarabi')]人的避难中心。虽然[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]对[ShowReligionAdjective('judaism')]采取了更为宽容的政策，但一些较为激进的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]仍然希望重新采纳已被抛弃的穆瓦希德教义。"
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip]仍将是[ShowCultureNameWithNoTooltip('mustaarabi')]人的避风港。"
 maghrebi_culture.1.b: "向激进的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]发出呼吁，迫使他们接受[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]。"
 maghrebi_culture.2.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]的[ShowReligionAdjectiveWithNoTooltip('ibadi')]地区"
 maghrebi_culture.2.desc: "尽管已经很久没有出现一个强大的[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家在[ShowRegionName('maghreb_region')]全境拥有影响力，但[our_ruler.GetName]已采取重大举措，巩固那些仍然忠于[ShowReligionAdjective('ibadi')]信仰的残余国家。尽管[ROOT.GetCountry.GetName]的土地不如[ShowRegionNameWithNoTooltip('maghreb_region')]内一些更发达的国家富裕，但[our_ruler.GetShortNameWithNoTooltip]的成功或许仍能促成一个新的[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家的最终崛起。"
 maghrebi_culture.2.a: "我们要为[ShowRegionNameWithNoTooltip('maghreb_region')]出现一个强大的[ShowReligionAdjectiveWithNoTooltip('ibadi')]政权铺平道路！"
 maghrebi_culture.2.b: "我们不如专心开辟自己的道路。"
 maghrebi_culture.3.title: "[ShowReligionAdjectiveWithNoTooltip('ibadi')]统治在[ShowRegionNameWithNoTooltip('maghreb_region')]复兴"
 maghrebi_culture.3.desc: "[our_ruler.GetName]成功做到了不可能的事，在[ShowRegionName('maghreb_region')]内开辟出一个新的[ShowReligionAdjective('ibadi')]王国。随着[ROOT.GetCountry.GetName]如今成为[ShowRegionNameWithNoTooltip('maghreb_region')]的主要强权之一，[ROOT.GetCountry.GetGovernment.GetCourtTitle]的一些成员已敦促[our_ruler.GetNameWithNoTooltip]对[ShowReligionGroupName('muslim')]的其他教派采取新政策。虽然一个新的[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家吸引了新的追随者，但[ShowRegionNameWithNoTooltip('maghreb_region')]的许多人仍然信奉[ShowReligionAdjective('sunni')]。"
 maghrebi_culture.3.a: "我们要对[ShowReligionGroupNameWithNoTooltip('muslim')]的所有派别实行宽容政策。"
 maghrebi_culture.3.b: "其他教派的信徒必须改信[ShowReligionNameWithNoTooltip('ibadi')]。"
 maghrebi_culture.4.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]羽翼未丰的[ShowReligionAdjectiveWithNoTooltip('ibadi')]诸政权"
 maghrebi_culture.4.desc: "尽管一个显赫的[ShowReligionAdjective('ibadi')]苏丹国曾在[ShowRegionName('maghreb_region')]拥有巨大影响力，但鲁斯塔姆王朝崩溃后的数百年里，许多[ShowReligionAdjectiveWithNoTooltip('ibadi')]虔诚信徒迁往[ShowAreaName('desert_area')]。随着[ROOT.GetCountry.GetName]的领土如今向这些地区延伸，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些人建议[our_ruler.GetName]对[target_country.GetName]发动战役——那是残余国家中较弱的一个。"
 maghrebi_culture.4.a: "利用[target_country.GetNameWithNoTooltip]的虚弱！"
 maghrebi_culture.4.b: "他们四分五裂，又远在天边，根本构不成威胁。"
 maghrebi_culture.5.title: "[ShowCultureGroupNameWithNoTooltip('maghrebi_group')][ShowReligionAdjectiveWithNoTooltip('ibadi')]民众的归顺"
 maghrebi_culture.5.desc: "尽管[ShowAreaName('desert_area')]一段时间以来一直是相当数量的[ShowReligionAdjectiveWithNoTooltip('ibadi')]民众的家园，但其大部分民众已落入[ROOT.GetCountry.GetName]的统治之下。随着[ROOT.GetCountry.GetNameWithNoTooltip]如今拥有不容忽视的[ShowReligionNameWithNoTooltip('ibadi')]信徒，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的许多人已敦促[our_ruler.GetName]对[ShowReligionAdjectiveWithNoTooltip('ibadi')]信众采取宽容政策，以免国家遭受宗教动荡。"
 maghrebi_culture.5.a: "他们必须改信[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]。"
 maghrebi_culture.5.b: "改为设法和平融合[ShowReligionAdjectiveWithNoTooltip('ibadi')]民众。"
 maghrebi_culture.6.title: "[ROOT.GetCountry.GetNameWithNoTooltip]日益增长的影响"
 maghrebi_culture.6.desc: "尽管[target_country_1.GetName]和[target_country.GetName]在穆瓦希德王朝崩溃后的数十年里对[ShowRegionName('maghreb_region')]拥有巨大影响力，但[target_country.GetNameWithNoTooltip]已在[our_ruler.GetName]的领导下，于[ShowRegionNameWithNoTooltip('maghreb_region')]内开辟出一个强大的王国。尽管[target_country_1.GetNameWithNoTooltip]和[target_country.GetNameWithNoTooltip]的精英们对[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的影响力心存戒备，但许多[ShowCultureGroupNameWithNoTooltip('maghrebi_group')]民众对我们的统治则更为欢迎。"
 maghrebi_culture.6.a: "我们要让[ShowRegionNameWithNoTooltip('maghreb_region')]归于[ROOT.GetCountry.GetAdjectiveWithNoTooltip]统治之下！"
 maghrebi_culture.7.title: "[target_location.GetNameWithNoTooltip]的棕榈式灌溉渠"
 maghrebi_culture.7.desc: "虽然[ShowRegionName('maghreb_region')]的许多土地拥有肥沃的土壤，但由于靠近[ShowAreaName('desert_area')]，这里也遍布严酷的地形。\n\n[target_location.GetName]已请求资源，以在[target_location.GetRank.GetName]内建立一座新的[ShowBuildingTypeName('maghreb_palm_irrigation')]，希望缓解该定居点最严酷的条件。"
 maghrebi_culture.7.a: "向当地的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]提供资源，修建灌溉网络。"
 maghrebi_culture.7.b: "我们拿不出这些资源。"
 maghrebi_culture.8.title: "[target_location.GetNameWithNoTooltip]的精巧建筑"
 maghrebi_culture.8.desc: "尽管[target_location.GetName]的人民长期以来以能使其建筑适应[ShowVegetationName('desert')]的严酷地形而闻名，但我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]的建筑师们在考察该地区后，对其所见印象深刻。尽管[ROOT.GetCountry.GetCapital.GetName]的地形与[target_location.GetNameWithNoTooltip]不同，但我们的建筑师认为，在[our_ruler.GetName]的支持下，类似的改进也可以在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]实现。"
 maghrebi_culture.8.a: "采纳[target_location.GetNameWithNoTooltip]建筑的若干特点。"
 maghrebi_culture.8.b: "我们不如向[target_location.GetNameWithNoTooltip]提供更多资源。"
 maghrebi_culture.9.title: "[ShowCultureGroupNameWithNoTooltip('amazigh_group')]人的传统"
 maghrebi_culture.9.desc: "自11世纪许多[ShowCultureName('bedouin_culture')]部落迁入[ShowRegionName('maghreb_region')]，在法蒂玛王朝的支持下，许多当地[ShowCultureGroupName('amazigh_group')]群体被迫承认这个日益壮大的[ShowCultureGroupName('arabic_group')]精英阶层。尽管在[ROOT.GetCountry.GetName]治下，许多[ShowCultureGroupNameWithNoTooltip('amazigh_group')]民族一直保持着自治，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的某些成员建议，我们应欢迎一些这样的[ShowCultureGroupNameWithNoTooltip('arabic_group')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]进入[ROOT.GetCountry.GetNameWithNoTooltip]，以使我们的统治合法化。然而，这样的邀请很可能会激怒[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]中的许多人。"
 maghrebi_culture.9.a: "我们应当努力与[ShowCultureGroupNameWithNoTooltip('arabic_group')]精英合作。"
 maghrebi_culture.9.b: "我们不如设法保存[ShowCultureGroupNameWithNoTooltip('amazigh_group')]的传统。"
 maghrebi_culture.10.title: "[target_location.GetNameWithNoTooltip]在撒哈拉贸易中日益重要的地位"
 maghrebi_culture.10.desc: "[target_location.GetName]位于[ShowAreaName('desert_area')]内众多贸易路线之一沿线，长期以来一直是[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]商人的重要落脚点。然而近年来，在[ROOT.GetCountry.GetName]的保护下，[target_location.GetRank.GetName]的重要性日益增长，许多商人因[ROOT.GetCountry.GetAdjective]领地旅途安全而选择在此停留。尽管这种重要性的提升为[target_location.GetNameWithNoTooltip]赢得了横跨撒哈拉的更大认可，但也使[target_location.GetRank.GetNameWithNoTooltip]承受了巨大压力。\n\n为确保[target_location.GetRank.GetNameWithNoTooltip]能继续作为有影响力的贸易枢纽，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的许多人已请求[our_ruler.GetName]为[target_location.GetRank.GetNameWithNoTooltip]提供适当资源，以容纳这日益涌入的商人。"
 maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip]必须维持其在撒哈拉贸易中的重要性！"
 maghrebi_culture.10.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]匀不出资源给[target_location.GetNameWithNoTooltip]。"
 maghrebi_culture.11.title: "[target_location.GetNameWithNoTooltip]的繁荣农业"
 maghrebi_culture.11.desc: "尽管[target_location.GetName]位于[ShowRegionName('maghreb_region')]中较为严酷的地区之一，但当地人民通过最近扩建的[ShowBuildingTypeName('maghreb_palm_irrigation')]，成功稳定了自身处境；这已证明是[target_location.GetNameWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]的一大福音。"
 maghrebi_culture.11.a: "$common_string_good$"
 maghrebi_culture.12.title: "在[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]治下"
 maghrebi_culture.12.desc: "自穆瓦希德王朝崩溃以来，[ShowCultureName('tunisian')][ShowDynastyNameWithNoTooltip('hafsid_dynasty')]王朝一直对东[ShowRegionName('maghreb_region')]保有相当大的影响力。尽管[ROOT.GetCountry.GetName]一直对[target_country.GetName]保持一定程度的独立，但[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]的统治者已证明是能干的宗主，保护了[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的领土。然而，随着阿尔摩哈德统治日益成为遥远的记忆，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有些人已质疑[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]统治者的合法性，暗示[ROOT.GetCountry.GetNameWithNoTooltip]是时候摆脱[ShowCultureNameWithNoTooltip('tunisian')]的枷锁了。"
 maghrebi_culture.12.a: "[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]为[ROOT.GetCountry.GetNameWithNoTooltip]提供了广泛的保护。"
 maghrebi_culture.12.b: "是时候打破[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]的镣铐了。"
 maghrebi_culture.13.title: "[ShowCultureNameWithNoTooltip('tunisian')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]干涉内政"
 maghrebi_culture.13.desc: "尽管[ROOT.GetCountry.GetLongName]承认[ShowCultureName('tunisian')]的宗主权已有一段时间，但[ROOT.GetCountry.GetNameWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]在很大程度上一直保持自治。然而，[target_character.GetName]最近闯入传统[ROOT.GetCountry.GetCulture.GetName]领土的举动，已在[ROOT.GetCountry.GetNameWithNoTooltip]全境煽动起不稳定。[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]的许多成员已要求立即将[target_character.GetNameWithNoTooltip]逐出[ROOT.GetCountry.GetNameWithNoTooltip]，尽管这样的驱逐很可能会激怒[target_country.GetName]。"
 maghrebi_culture.13.a: "将[target_character.GetNameWithNoTooltip]逐出[ROOT.GetCountry.GetNameWithNoTooltip]！"
 maghrebi_culture.13.b: "允许[target_character.GetHerHim]继续待在[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 maghrebi_culture.14.title: "盗匪[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]劫掠[target_location.GetNameWithNoTooltip]"
 maghrebi_culture.14.desc: "有报告称，效忠[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]的士兵在[target_location.GetName]劫掠商队，[ROOT.GetCountry.GetGovernment.GetCourtTitle]因此陷入混乱。[target_location.GetNameWithNoTooltip]地处撒哈拉一条重要商路之上，是许多商人的落脚点。受损的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]纷纷要求[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]赔偿这些桀骜士兵造成的损失。"
 maghrebi_culture.14.a: "强制[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]赔偿劫掠造成的损失。"
 maghrebi_culture.14.b: "斥责[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]，但由国家承担损失。"
 maghrebi_culture.14.c: "站在[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]一边，放任劫掠继续。"
 maghrebi_culture.15.title: "[target_culture.GetNameWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]的支持不断增长"
 maghrebi_culture.15.desc: "随着[ROOT.GetCountry.GetAdjective]权威在[ShowRegionName('maghreb_region')]不断扩张，当地几个族群已向[ROOT.GetCountry.GetNameWithNoTooltip]宣誓效忠。其中，[target_culture.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]对[ROOT.GetCountry.GetAdjectiveWithNoTooltip]统治的接受程度最高，许多[target_culture.GetNameWithNoTooltip]首领都表示愿意全力支持。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有人对[target_culture.GetNameWithNoTooltip]如此踊跃的支持感到意外，建议[our_ruler.GetName]给予国家层面的全面支持，在[ShowRegionNameWithNoTooltip('maghreb_region')]全境维护[target_culture.GetNameWithNoTooltip]的利益；也有人建议我们转而利用他们的热忱支持。"
 maghrebi_culture.15.a: "我们欢迎他们的支持！"
 maghrebi_culture.15.b: "利用他们的支持，加强我们在[ShowRegionNameWithNoTooltip('maghreb_region')]的影响力。"
 maghrebi_culture.16.title: "声名显赫的[target_culture.GetNameWithNoTooltip]将领"
 maghrebi_culture.16.desc: "[target_culture.GetName]民众与[ROOT.GetCountry.GetCulture.GetName]精英之间的关系日益密切，随着[ROOT.GetCountry.GetAdjective]统治在[ShowRegionName('maghreb_region')]趋于稳定，这种关系也带来了好处。为向[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]进一步表明忠诚，[target_culture.GetNameWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]献出他们一位才能出众的首领，愿为[ROOT.GetCountry.GetNameWithNoTooltip]效力。然而，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]中有人劝[our_ruler.GetName]拒绝这项提议，他们担心让[target_culture.GetNameWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]获得自治，终究会损害我们在[ShowRegionNameWithNoTooltip('maghreb_region')]的统治。"
 maghrebi_culture.16.a: "欢迎[target_character.GetShortNameWithNoTooltip]来到[ROOT.GetCountry.GetGovernment.GetCourtTitle]！"
 maghrebi_culture.16.b: "拒绝雇佣[target_character.GetHimHer]为将领。"
 maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]献上一位有前途的将领"
 maghrebi_culture.17.desc: "尽管[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]已证明是[ROOT.GetCountry.GetGovernment.GetCourtTitle]的一大负担，但近年来，曾经桀骜不驯的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]已开始在整个[ShowRegionName('maghreb_region')]承认[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的权威。为向[ROOT.GetCountry.GetGovernment.GetCourtTitle]展示这些新得的忠诚，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]已提出让[target_character.GetName]为[ROOT.GetCountry.GetNameWithNoTooltip]效力；据说此人才能出众。然而，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有些人担心，这或许是[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]为从[our_ruler.GetName]那里谋取影响力而设的圈套。"
 maghrebi_culture.17.a: "接受[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]的提议。"
 maghrebi_culture.17.b: "我们不能冒险让[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]获得更多影响力。"
 maghrebi_culture.18.title: "[our_ruler.GetDynasty.GetNameWithNoTooltip]日益显赫"
 maghrebi_culture.18.desc: "穆瓦希德王朝覆灭后，[ShowDynastyName('marinid_dynasty')]和[ShowDynastyName('hafsid_dynasty')]都曾在[ShowRegionName('maghreb_region')]积聚起相当大的势力。然而，[our_ruler.GetDynasty.GetName]近来的军事行动，已为一股新势力在[ShowRegionNameWithNoTooltip('maghreb_region')]崛起铺平了道路。尽管[our_ruler.GetDynasty.GetNameWithNoTooltip]在[ShowRegionNameWithNoTooltip('maghreb_region')]的统治已赢得当地[ShowCultureGroupNameWithNoTooltip('amazigh_group')]民众的支持，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有些人建议，若我们要在[ShowRegionNameWithNoTooltip('maghreb_region')]胜过其他主要势力，就应向外寻求助力。"
 maghrebi_culture.18.a: "我们应寻找盟友加强我们的地位。"
 maghrebi_culture.18.b: "专注于内政。"
 maghrebi_culture.19.title: "与[target_culture.GetNameWithNoTooltip]民众的团结"
 maghrebi_culture.19.desc: "尽管11世纪[ShowCultureName('bedouin_culture')]迁入[ShowRegionName('maghreb_region')]改变了该地区的政治格局，但在[ROOT.GetCountry.GetAdjectiveWithNoTooltip]统治下的[ROOT.GetCountry.GetCulture.GetName]和[target_culture.GetName]人却有一种重获团结的感觉。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]对其故土[ShowRegionNameWithNoTooltip('maghreb_region')]的统治，基本终结了这些族群此前的部落敌对，使他们转而形成一种新的共同团结。"
 maghrebi_culture.19.a: "坚定的团结让我们不可征服！"
 maghrebi_culture.19.b: "我们应当利用与[target_culture.GetNameWithNoTooltip]的紧密团结，加强我们在[ShowRegionNameWithNoTooltip('maghreb_region')]的影响力。"
 maghrebi_culture.19.c: "[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]与[target_culture.GetNameWithNoTooltip]的文化纽带牢不可破。"
 maghrebi_culture.20.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]统治[ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.20.desc: "尽管[ROOT.GetCountry.GetCulture.GetName]精英中的许多人已逐渐采纳了[ShowCultureGroupName('arabic_group')]习俗与传统的一些方面，但这有时会与[ShowRegionName('maghreb_region')]中更为传统主义的人民发生冲突。对[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]而言，[target_culture.GetName]民族已成为他们对[ROOT.GetCountry.GetGovernment.GetCourtTitle]不满的焦点，许多[target_culture.GetNameWithNoTooltip]精英拒绝与[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]做生意。\n\n为利用其在[ROOT.GetCountry.GetName]全境的影响力，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]已向[our_ruler.GetName]请愿，要求对[target_culture.GetNameWithNoTooltip]推行更激进的文化同化政策。然而，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一些成员已敦促[our_ruler.GetShortNameWithNoTooltip]拒绝他们的请求，担心由此引发动荡。"
 maghrebi_culture.20.a: "设法将他们同化进[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]社会。"
 maghrebi_culture.20.b: "我们不如设法融合[target_culture.GetNameWithNoTooltip]民众。"
 maghrebi_culture.21.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]的困境"
 maghrebi_culture.21.desc: "[ShowRegionName('iberia_region')]最后一个[ShowReligionGroupAdjective('muslim')]国家的覆灭，在整个[ShowRegionName('maghreb_region')]重新引发了恐慌，许多人担心[ShowRegionNameWithNoTooltip('iberia_region')]的[ShowReligionGroupAdjectiveWithNoTooltip('christian')]诸国很快会将目光投向[ShowRegionNameWithNoTooltip('maghreb_region')]。已有许多[ShowCultureName('andalusi')]人转向[ROOT.GetCountry.GetNameWithNoTooltip]，希望逃脱[ShowCultureGroupName('iberian_group')]的怒火。"
 maghrebi_culture.21.a: "我们不会向[ShowCultureGroupNameWithNoTooltip('iberian_group')]入侵者屈服！"
 maghrebi_culture.21.b: "我们应该对任何潜在的入侵保持警惕。"
 maghrebi_culture.22.title: "[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]存在"
 maghrebi_culture.22.desc: "尽管[ROOT.GetCountry.GetName]的人民一向更习惯于撒哈拉贸易，但[our_ruler.GetName]的征战已帮助[ROOT.GetCountry.GetNameWithNoTooltip]在沿海建立了可观的势力，从而得以进入[ShowScriptedGeographyName('mediterranean_sea_geography')]。眼见新的商业机遇，许多[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]已敦促[ROOT.GetCountry.GetGovernment.GetCourtTitle]出资扩充一支新舰队，尽管有人担心这可能扰乱长期惠及[ROOT.GetCountry.GetNameWithNoTooltip]的传统撒哈拉贸易。"
 maghrebi_culture.22.a: "我们必须尽快行动建立海上存在。"
 maghrebi_culture.22.b: "我们不能忽视我们的撒哈拉贸易路线。"
 maghrebi_culture.23.title: "阿拉伯化精英的清算"
 maghrebi_culture.23.desc: "[target_culture.GetName]长期在[ShowRegionName('maghreb_region')]拥有相当大的权力。他们也是与许多[ShowCultureGroupName('amazigh_group')]民族争执的焦点，因为他们主张激进同化政策，并敦促他们采纳[ShowCultureGroupName('arabic_group')]习俗。随着[ROOT.GetCountry.GetName]的崛起——一个由[ROOT.GetCountry.GetCulture.GetName]作为统治精英掌权的[ROOT.GetCountry.GetFlavorRank]——一些[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]已要求[our_ruler.GetName]遏制[target_culture.GetNameWithNoTooltip]的权力。然而，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的另一些人则将[target_culture.GetNameWithNoTooltip]精英视为无价盟友，有助于加强我们日益增长的对[ShowRegionNameWithNoTooltip('maghreb_region')]的统治。"
 maghrebi_culture.23.a: "力求在[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]和[target_culture.GetNameWithNoTooltip]精英之间达成妥协。"
 maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip]对[ShowRegionNameWithNoTooltip('maghreb_region')]的影响该结束了。"
 maghrebi_culture.24.title: "新[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]地毯"
 maghrebi_culture.24.desc: "[ROOT.GetCountry.GetCulture.GetName]挂毯长期以来一直是[ShowRegionName('maghreb_region')]各地的商品，也是许多[ROOT.GetCountry.GetAdjective]商人的重要货物。然而近年来，获得更可靠的[ShowGoodsNameWithNoTooltip('dyes')]来源，催生了新一代[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]基里姆地毯，同时[ShowRegionName('maghreb_region')]内外对这些挂毯的兴趣也日益增长。"
 maghrebi_culture.24.a: "享受新款织毯带来的好处。"
 maghrebi_culture.24.b: "我们必须继续投资这种新挂毯！"
 maghrebi_culture.25.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]领地的整合"
 maghrebi_culture.25.desc: "尽管[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]的实力过去在确保[ROOT.GetCountry.GetName]抵御威胁方面发挥了关键作用，但[ROOT.GetCountry.GetFlavorRank]不断扩张的官僚体系，已在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中引发了关于其效用的诸多讨论。虽然[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]过去曾帮助保护[ROOT.GetCountry.GetNameWithNoTooltip]，但当他们与[ROOT.GetCountry.GetGovernment.GetCourtTitle]的政策意见相左时，也一直是麻烦的来源。\n\n如今，这已导致[ROOT.GetCountry.GetGovernment.GetCourtTitle]中出现这样的论调：国家已变得足够强大，不再需要依赖[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]来提供保护。此外，如今必须永久约束[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]，以强化日益壮大的[ROOT.GetCountry.GetAdjectiveWithNoTooltip]国家。"
 maghrebi_culture.25.a: "让[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]们认清自己的位置。"
 maghrebi_culture.25.b: "维持[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]自治以避免内部冲突。"
 maghrebi_culture.26.title: "掌控[ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.26.desc: "尽管穆瓦希德王朝的崩溃使[ShowRegionName('maghreb_region')]陷入一段动荡时期，并削弱了对[ShowRegionName('iberia_region')]的影响力，但在[our_ruler.GetName]领导下的[ROOT.GetCountry.GetName]已崛起为该地区事实上的强权。虽然[ShowRegionNameWithNoTooltip('maghreb_region')]的其他部分仍处于[ROOT.GetCountry.GetAdjectiveWithNoTooltip]影响力之外，但倘若[ShowCultureGroupName('iberian_group')]诸王国想要征服[ShowRegionNameWithNoTooltip('maghreb_region')]，它们需要承认[ROOT.GetCountry.GetNameWithNoTooltip]是一个不可低估的地区对手。"
 maghrebi_culture.26.a: "我们是马格里布的保护者！"
 maghrebi_culture.27.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]的[our_ruler.GetDynasty.GetNameWithNoTooltip]黄金时代"
 maghrebi_culture.27.desc: "在[ShowRegionName('maghreb_region')]的大部分地区如今都处于[ROOT.GetCountry.GetAdjective]统治之下后，[our_ruler.GetDynasty.GetName]已采取措施，重新革新[ShowRegionNameWithNoTooltip('maghreb_region')]的许多重要文化建筑，并赞助修建多所新的学术中心。尽管该地区曾一度濒临被外部势力支配的边缘，但在[our_ruler.GetDynasty.GetNameWithNoTooltip]的统治下，它反而将自己磨砺成了整个[ShowScriptedGeographyName('mediterranean_sea_geography')]所尊崇的主要强权。"
 maghrebi_culture.27.a: "愿[our_ruler.GetDynasty.GetNameWithNoTooltip]的统治继续带来繁荣。"
 maghrebi_culture.28.title: "对巴巴里海盗的影响"
 maghrebi_culture.28.desc: "尽管[ShowRegionName('maghreb_region')]的私掠者已在[ShowContinentName('europe')]各地赢得了[ShowScriptedGeographyName('mediterranean_sea_geography')]主要劫掠力量的名声，但迄今为止，对他们的资助因国家而异。\n\n然而，随着[ROOT.GetCountry.GetAdjective]在沿海的影响力日益扩张，许多私掠者已转向[ROOT.GetCountry.GetNameWithNoTooltip]，希望获得我们的支持，以加大在[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]各地的劫掠强度。不过，[ROOT.GetCountry.GetGovernment.GetCourtTitle]的一些成员认为，这也创造了一个削弱私掠者的机会，以期与那些数百年来被私掠者激怒的欧洲列强重建关系。"
 maghrebi_culture.28.a: "由国家提供全面赞助。"
 maghrebi_culture.28.b: "允许海盗继续行动。"
 maghrebi_culture.28.c: "严厉打击海盗。"
 # Decisions
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "阿米·赛义德议会集权"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "自鲁斯塔姆王朝覆灭以来，[ShowRegionName('maghreb_region')]的许多[ShowReligionAdjective('ibadi')]人被迫逃入姆扎卜谷地。这些[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家中，许多选择参加由[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]主导的阿米·赛义德议会，而另一些则决定保持独立。\n\n随着许多人口更稠密的[ShowReligionAdjectiveWithNoTooltip('ibadi')]土地如今处于[ROOT.GetCountry.GetName]统治之下，[our_ruler.GetName]已寻求将阿米·赛义德议会集中到[ROOT.GetCountry.GetCapital.GetName]，希望进一步在[ShowRegionNameWithNoTooltip('maghreb_region')]创建一个强大而有影响力的[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家。"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "一个分散在自豪独立的[ShowReligionAdjective('ibadi')]诸国中的议会可以建言，却无法统治。如今，这些土地中人口最稠密的部分已听命于我们，阿米·赛义德议会便能聚集在同一屋檐下、同一权威之下。它起初只是姆扎卜谷地中的一处避难所，此后却将成为横跨[ShowRegionName('maghreb_region')]的一个名副其实的国家。"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "对[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]的忠诚有助于加强我们的统治！"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "对$crown_estate$的忠诚有助于加强我们的统治！"
 maghreb_masters_of_the_sahara.title: "撒哈拉之主"
 maghreb_masters_of_the_sahara.desc: "世世代代以来，[ShowRegionName('maghreb_region')]人一直参与撒哈拉贸易，穿越严酷的沙漠，运送珍贵的贸易商品。尽管这可能是一项令人望而生畏的任务，但倘若我们能在[ShowAreaName('desert_area')]建立可观的影响力，同时扩建核心商队驿站的基础设施，我们的人民或许仍能驯服这片无情的沙海。"
 maghreb_masters_of_the_sahara.a: "我们实现了不可能之事！"
 empower_the_desert_power_privilege_tt: "[ShowEstatePrivilegeName('desert_power')]将得到大幅强化，获得额外增益以抵消[ShowVegetationName('desert')]与[ShowClimateName('arid')][locations|e]承受的惩罚"
 empower_the_desert_power_privilege_tt_default_bonus: "[ShowEstatePrivilegeName('desert_power')]也会获得#G +0.0020#![ShowModifierTypeName('global_monthly_development')]和#G +2.50%#![ShowModifierTypeName('global_max_control')]"
