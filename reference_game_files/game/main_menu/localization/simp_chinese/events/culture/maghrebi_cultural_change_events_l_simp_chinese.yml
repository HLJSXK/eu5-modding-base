 maghrebi_cultural_change_events.1004.title: "[ShowCultureNameWithNoTooltip('andalusi')]移民的抱怨"
 maghrebi_cultural_change_events.1004.desc: "近年来，由于我们的[ShowReligionGroupAdjective('muslim')]弟兄在[ShowRegionName('iberia_region')]遭受猖獗迫害，大量[ShowCultureName('andalusi')]人涌入此地。尽管[ROOT.GetCountry.GetReligion.GetGodName]赐予了他们一个新家园，这些胆大妄为的新来者竟敢公开抱怨[ShowRegionName('maghreb_region')]的生活水准，同时却赞美那些留在卑劣的[ShowReligionGroupAdjective('christian')]国家土地上的人！\n\n一位来自[target_pop2.GetName]、身为[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]知名成员的教士，将这种态度比作“几乎背离信仰”。"
 maghrebi_cultural_change_events.1004.a: "[ShowRegionNameWithNoTooltip('iberia_region')]那么好，他们怎么不回去？"
 maghrebi_cultural_change_events.1004.b: "尝试让双方冷静下来。"
