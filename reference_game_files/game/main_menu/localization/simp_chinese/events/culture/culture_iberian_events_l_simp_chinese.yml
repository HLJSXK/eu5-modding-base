l_simp_chinese:
 iberian_culture.1.title: "收复失地运动之歌"
 iberian_culture.1.desc: "我们与异教徒的冲突，激发了吟游诗人和普通民众创作歌曲，歌颂为[ShowReligionGroupAdjective('christian')|U]事业的胜利而战的我军士兵的英勇。随着这些曲调传遍[ROOT.GetCountry.GetFlavorRank]，它们可以成为我们的有用工具——既能鼓舞我军战斗，或许还能说服更多人参军。"
 iberian_culture.1.a: "让它们在战场上被吟唱！"
 iberian_culture.1.b: "它们应该激励我们的征兵！"
 iberian_culture.2.title: "收复失地运动的英雄"
 iberian_culture.2.desc: "在对[GetCountry('GRA').GetName]作战的众多英勇之士中，[new_general.GetName]以[new_general.GetHerselfHimself]的勇气和能力在战斗中脱颖而出。[new_general.GetHerHis|U]的声名如今已先于[new_general.GetHerHim]传遍[ROOT.GetCountry.GetFlavorRank]，许多人主张，这样的才能理应获得与[new_general.GetHerHis]功绩相称的指挥权。"
 iberian_culture.2.a: "[new_general.GetSheHe|U]应当指挥我们的军队。"
 iberian_culture.2.b: "我们应在别处利用[new_general.GetHerHis]的能力。"
 iberian_culture.3.title: "南方殖民"
 iberian_culture.3.desc: "随着[ShowAreaName('granada_area')]终于从[ShowReligionGroupAdjective('muslim')]统治下解放，许多家族开始将目光投向这些土地，寻找机会。最近，我们听到有关来自[origin_province.GetName]的人的消息，他们被熟荒地的承诺和在[target_province.GetName]建立新生活的机会吸引。"
 iberian_culture.3.a: "允许他们迁徙。"
 iberian_culture.3.b: "尝试限制移民数量。"
 iberian_culture.4.title: "圣母的奇迹"
 iberian_culture.4.desc: "有消息称[target_location.GetName]发生了一桩奇迹。据当地人的说法，童贞荣福玛利亚显现于俯瞰该定居点的山坡上。尽管有人对这桩奇迹心存怀疑，它仍吸引了远近的朝圣者。如今街道挤满了旅人，当地人急切地从他们身上获利。大量奉献涌入当地金库，而这笔新得的财富应如何使用，正引发激烈争论。"
 iberian_culture.4.a: "投入当地。"
 iberian_culture.4.b: "供奉给[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]。"
 iberian_culture.4.c: "施舍穷人。"
 iberian_culture.4.d: "[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]应当监督这笔捐赠。"
 iberian_culture.5.title: "从北海归来"
 iberian_culture.5.desc: "[ShowCultureName('basque')]捕鲸者已从又一次远赴北方远海的远航中归来。他们冒着凶险的风暴和大多数水手未知的海域，带回了珍贵的货物和大量实用知识。[ROOT.GetCountry.GetGovernment.GetCourtTitle]的成员如今正辩论这些经验应如何应用。"
 iberian_culture.5.a: "每一次航行都应从上次中汲取教训。"
 iberian_culture.5.b: "海洋蕴藏着无尽的机遇。"
 iberian_culture.6.title: "能力出众的穆德哈尔艺术家"
 iberian_culture.6.desc: "我们注意到，[target_character.GetName]，一位技艺精湛的[ShowReligionGroupAdjective('muslim')]艺术家，正在整个[ROOT.GetCountry.GetFlavorRank]赢得赞誉。[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员建议邀请[target_character.GetHimHer]为我们效力，但[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]中许多人反对将这样的声望授予一个穆德哈尔人。"
 iberian_culture.6.a: "天赋不由信仰定义。"
 iberian_culture.6.b: "如此荣誉属于[ShowReligionGroupAdjective('christian')|U]臣民。"
 iberian_culture.7.title: "市场纠纷"
 iberian_culture.7.desc: "紧张局势在[target_location.GetName]爆发，[ShowReligionAdjective('sunni')]和[ShowReligionAdjective('catholic')]商人互相指责对方受到地方官员和行会的不公正待遇。[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]已被请求介入并调解这场争端。"
 iberian_culture.7.a: "正义必胜。"
 iberian_culture.7.a.tt1: "[target_location.GetName]所有[ShowReligionAdjective('sunni')][pops|e]获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 iberian_culture.7.a.tt2: "[target_location.GetName]所有[ShowReligionAdjective('catholic')][pops|e]失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.7.b: "我们必须保护自己人。"
 iberian_culture.7.b.tt1: "[target_location.GetName]所有[ShowReligionAdjective('sunni')][pops|e]失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.7.b.tt2: "[target_location.GetName]所有[ShowReligionAdjective('catholic')][pops|e]获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 iberian_culture.7.c: "他们应该自己解决。"
 iberian_culture.8.title: "关于穆德哈尔传统的纠纷"
 iberian_culture.8.desc: "在[target_location.GetName]，当地[ShowReligionAdjective('sunni')]民众再次聚集起来庆祝他们已延续数代的一个传统节日。尽管许多人将庆祝活动视为日常生活中无害的一部分，但[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的代表却施压我们禁止这些庆祝活动，因为此类公开展示会损害[ROOT.GetCountry.GetFlavorRank]的[ShowReligionAdjective('catholic')]特性。"
 iberian_culture.8.a: "让节庆继续。"
 iberian_culture.8.a.tt: "[target_location.GetName]所有[ShowReligionAdjective('sunni')][pops|e]获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 iberian_culture.8.b: "叫停节庆。"
 iberian_culture.8.b.tt: "[target_location.GetName]所有[ShowReligionAdjective('sunni')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.9.title: "繁荣的穆德哈尔区"
 iberian_culture.9.desc: "[target_location.GetName]的穆德哈尔区一直繁荣兴旺，吸引了许多工匠和商人，他们的勤劳为这一定居点带来了新的繁荣。尽管其日益增长的财富有益于当地经济，但一些地方精英已开始担心，这个社群不断增长的影响力有朝一日可能与他们自己的影响力相匹敌。"
 iberian_culture.9.a: "繁荣对他们所有人有利。"
 iberian_culture.9.b: "没收他们的部分财富以限制他们的影响力。"
 iberian_culture.9.b.tt: "[target_location.GetName]所有[ShowReligionAdjective('sunni')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.10.title: "知名穆德哈尔医师"
 iberian_culture.10.desc: "穆德哈尔医生近来在整个[ROOT.GetCountry.GetFlavorRank]赢得广泛赞誉，许多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]发现自己越来越依赖他们的医术。我们的一些顾问如今建议，应正式任命他们为[ROOT.GetCountry.GetGovernment.GetCourtTitle]医师；然而，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]中有影响力的成员强烈反对这一建议。"
 iberian_culture.10.a: "能力比信仰更重要。"
 iberian_culture.10.b: "改为任命[ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]医师。"
 iberian_culture.11.title: "被怀疑的皈依者"
 iberian_culture.11.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]收到消息：[target_character.GetName]，一位家族此前从[ShowReligionName('judaism')]改宗的能力出众的商人，被指控继续秘密奉行旧信仰的仪式。尽管报告称曾有人举行被禁止的祈祷和秘密集会，但另一些人认为这些指控源于嫉妒和债务纠纷。"
 iberian_culture.11.a: "我们的宗教法庭必须调查这些异端。"
 iberian_culture.11.b: "这些都是诽谤！"
 iberian_culture.12.title: "[ShowCultureNameWithNoTooltip('sephardi')]商人被指控"
 iberian_culture.12.desc: "几位来自[target_location.GetName]的显赫[ShowCultureName('sephardi')]商人被指控通过不正当手段聚敛财富，例如钻税收漏洞、放高利贷或为自身利益操纵价格。尽管这些指控来自他们的商业竞争对手，我们也无法确知是否属实，但必须在冲突进一步升级之前采取行动。"
 iberian_culture.12.a: "没收他们的财富。"
 iberian_culture.12.a.tt: "[target_location.GetName]所有[ShowCultureName('sephardi')][ShowPopTypeName('burghers')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.12.b: "我们不能没证据就采取行动。"
 iberian_culture.12.b.tt: "[target_location.GetName]所有非[ShowCultureName('sephardi')][ShowPopTypeName('burghers')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.13.title: "对抗酷热与瘟疫"
 iberian_culture.13.desc: "在[ROOT.GetCountry.GetFlavorRank]南部地区，人们形成了一种传统：用熟石灰粉刷房屋，以在强烈日照下保持室内凉爽。人们还相信这有助于防止疾病传播。[target_location.GetName]的民众近来苦于熟石灰短缺，已向[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]请求帮助以保护他们的家园。"
 iberian_culture.13.a: "确保他们得到足够的熟石灰。"
 iberian_culture.13.a.tt: "[target_location.GetName]所有[pops|e]获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 iberian_culture.13.b: "我们没钱。"
 iberian_culture.13.b.tt: "[target_location.GetName]所有[pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.14.title: "皇家牧道纠纷"
 iberian_culture.14.desc: "随着季节更替，数百万只绵羊沿着皇家牧道被驱赶前行——这些历史悠久的皇家牧羊大道横贯我们的乡野。然而，[target_location.GetName]的居民拒绝让牧人穿过他们的定居点，担心牲畜会践踏他们的田地。"
 iberian_culture.14.a: "维护牧民古老的路权。"
 iberian_culture.14.a.tt: "[target_location.GetName]所有[ShowPopTypeName('peasants')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.14.b: "袒护当地人。"
 iberian_culture.15.title: "水法庭纠纷"
 iberian_culture.15.desc: "传统水法庭最近一直在处理[target_location_1.GetName]与[target_location_2.GetName]之间的争端。在灼热的夏日阳光下，该地区缺乏足够的水来充分维持两个定居点的农田，因此两地居民一直在为分配权争论不休。"
 iberian_culture.15.a: "必须让[target_location_1.GetNameWithNoTooltip]优先。"
 iberian_culture.15.b: "[target_location_2.GetNameWithNoTooltip]的田地更重要。"
 iberian_culture.15.c: "水应该平均分配。"
 iberian_culture.16.title: "保护地方特许权"
 iberian_culture.16.desc: "我们派往[target_location.GetName]的收税官已被当地地方法官强行阻拦，无法进城。地方精英援引他们古老的#italic 法权#!，宣称[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]无权征收赋税，除非得到他们自己议会的明确批准。"
 iberian_culture.16.a: "尊重这些宪章。"
 iberian_culture.16.b: "国家的需要是绝对的！"
 iberian_culture.17.title: "山匪"
 iberian_culture.17.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]收到消息：全副武装的不法之徒已控制了[target_location.GetName]周围崎岖的山口。他们不断劫掠商队和货运，严重扼杀了整个地区的商业。若放任不管，更多人可能会受到鼓舞，加入匪帮。"
 iberian_culture.17.a: "我们腾不出人手。"
 iberian_culture.17.b: "组织探险队清剿。"
 iberian_culture.18.title: "穆德哈尔艺术"
 iberian_culture.18.desc: "数个世纪以来，[ShowRegionName('iberia_region')]的人们一直仰慕安达卢斯时代盛行的[ShowReligionGroupAdjective('muslim')]建筑风格。许多建筑师开始将穆德哈尔艺术的各种技法融入罗曼式和哥特式建筑，无论是几何装饰还是装饰性灰泥工艺。最近，效力于[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]的[target_artist.GetName]，已向王座请求许可，希望将这种风格纳入王室委托创作。"
 iberian_culture.18.a: "支持。"
 iberian_culture.18.b: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]艺术不能和王座有丝毫关联。"
 iberian_culture.19.title: "西班牙哥特式"
 iberian_culture.19.desc: "[ROOT.GetCountry.GetFlavorRank]各地的建筑师开始发展出一种与基督教世界任何其他风格都不同的建筑风格。受西方各国高耸的大教堂和我们自己土地上坚固建筑传统的启发，他们创造出了既宣告上帝荣耀、也宣告[ROOT.GetCountry.GetName]伟大的纪念性建筑。这种逐渐被称为“西班牙哥特式”的风格，倘若我们决定赞助它，便可能在之后数百年间在这片大地上留下印记。"
 iberian_culture.19.a: "让石头宣告我们的荣耀！"
 iberian_culture.19.b: "我们的资源最好用在其他地方。"
 iberian_culture.20.title: "早期文艺复兴"
 iberian_culture.20.desc: "被称为[ShowInstitutionNameWithNoTooltip('renaissance')]的新艺术理念已开始从[ShowRegionName('italy_region')]传入我们[ROOT.GetCountry.GetFlavorRank]；作为回应，我们的许多建筑师和画家已将这些影响与本土传统交织在一起。如今许多人委托创作受这一新兴风格影响的作品，而倘若加以鼓励，这场新的艺术运动或许能开启一个繁荣与创新的时代。"
 iberian_culture.20.a: "接受这种新传统。"
 iberian_culture.20.b: "维护旧传统。"
 iberian_culture.21.title: "新基督徒的皈依"
 iberian_culture.21.desc: "[target_location.GetName]相当多的[ShowReligionAdjective('judaism')]人群已决定自愿接受洗礼，皈依[ShowReligionName('catholic')]信仰。尽管许多人将这些皈依者誉为教会成功的明证，另一些人仍怀疑他们的诚意，称他们为“新基督徒”，以区别于那些家族长期信奉该信仰的人。"
 iberian_culture.21.a: "欢迎他们加入信仰。"
 iberian_culture.21.b: "强迫更多人皈依。"
 iberian_culture.21.b.tt: "[target_location.GetName]所有[ShowReligionAdjective('judaism')][pops|e]失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.22.title: "奔牛节"
 iberian_culture.22.desc: "[ShowLocationName('cuellar')]的居民正艰难地为一年一度的庆典筹措资金。这个定居点被认为拥有[ShowRegionName('iberia_region')]最古老的奔牛节。他们已向[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]求助，并承诺如果我们资助他们，庆典将献给[target_ruler.GetName]，而不是他们通常庆祝的主保圣人——玫瑰圣母。"
 iberian_culture.22.a: "我们必须帮他们！"
 iberian_culture.22.b: "我们不能支持这种野蛮的节庆！"
 iberian_culture.22.b.tt: "[ShowLocationName('cuellar')]所有[pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.23.title: "光照派"
 iberian_culture.23.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]和教会收到了令人不安的消息：一个陌生的神秘主义兄弟会正在[ROOT.GetCountry.GetFlavorRank]悄悄吸收成员。他们自称光照派，声称真正虔诚者可以直接从圣灵获得神圣启示，从而使神父、圣事、朝圣甚至弥撒都变得不再必要。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]代表担心他们的教义类似新教异端，呼吁展开调查。"
 iberian_culture.23.a: "制裁光照派。"
 iberian_culture.23.b: "并非每个传言都隐藏着异端。"
 iberian_culture.23.b.tt: "如果不加以控制，教派的影响可能会进一步蔓延"
 iberian_culture.24.title: "真相揭晓"
 iberian_culture.24.desc: "事实证明，我们不去调查关于光照派的传言就是个错误。该教派在[target_province.GetName]的影响力已大大增长，他们已公开承认信奉[ShowReligionAdjective('lutheran')]异端。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]如今指责[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]无视警告和调查请求，并主张果断行动本可阻止这场异端爆发。"
 iberian_culture.24.a: "我们不能迫害每一个持不同意见的人。"
 iberian_culture.24.a.tt: "[target_province.GetName]15%的[ShowReligionAdjective('catholic')][pops|e]会改信[ShowReligionName('lutheran')]"
 iberian_culture.24.a.tt2: "[target_province.GetName]所有[ShowReligionAdjective('catholic')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.24.b: "他们是对的，我们必须谨慎行事。"
 iberian_culture.24.b.tt: "[target_province.GetName]5%的[ShowReligionAdjective('catholic')][pops|e]会改信[ShowReligionName('lutheran')]"
 iberian_culture.24.b.tt2: "[target_province.GetName]所有[pops|e]失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 iberian_culture.25.title: "维护[ShowBuildingTypeNameWithNoTooltip('irrigation_systems')]"
 iberian_culture.25.desc: "[ShowReligionGroupAdjective('muslim')]对[ShowAreaName('granada_area')]的统治期间，修建了精巧复杂的[ShowBuildingTypeName('irrigation_systems')]，将珍贵的水从内华达山脉引至肥沃河谷的农田与果园。对该地区的争夺已对这些系统造成严重破坏，而当地人长期以来一直依赖它们维持生计。"
 iberian_culture.25.a: "支持重建。"
 iberian_culture.25.b: "我们无力承担这项投资。"
 iberian_culture.26.title: "圣地亚哥之路"
 iberian_culture.26.desc: "每年，成千上万的朝圣者踏上前往[ShowLocationName('santiago_compostela')]的漫长旅程。他们的通行给无数定居点带来了繁荣，但旅途依然艰难，因为沿途许多道路和桥梁已年久失修。[target_location.GetName]的当地人已向[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]请愿，要求改善通往孔波斯特拉的道路，主张这既能鼓励虔诚，也能加强整个[ROOT.GetCountry.GetFlavorRank]的商业。"
 iberian_culture.26.a: "为朝圣者无需吝惜钱财。"
 iberian_culture.26.b: "我们目前有更重要的事务。"
 iberian_culture.27.title: "逐渐衰落的传统"
 iberian_culture.27.desc: "世世代代，[ShowAreaName('galicia_area')]的游吟诗人们一直用[ShowDialectName('galician_dialect')]吟唱他们传统的#italic 坎蒂加#!；这是一种享有盛誉的文学语言，其影响远远扩展到[ShowAreaNameWithNoTooltip('galicia_area')]的边界之外。然而，由于这种语言并非[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]语言，这一传统正在慢慢衰落。"
 iberian_culture.27.a: "赞助维持该传统。"
 iberian_culture.27.b: "加强我们语言的使用。"
 iberian_culture.28.title: "渔业兄弟会"
 iberian_culture.28.desc: "[target_location.GetName]的渔民们组织成了一个行会，自称渔业兄弟会。据称，其宗旨是规范捕鱼、保存航海知识，并保护那些勇于出海者的利益。它也是当地社群的支柱，通过向成员及其家人提供援助，确保他们在艰难时期仍能坚韧不拔。"
 iberian_culture.28.a: "加强他们的行会。"
 iberian_culture.28.b: "我们的海军需要他们。"
 iberian_culture.29.title: "巴伦西亚[ShowGoodsNameWithNoTooltip('silk')]繁荣"
 iberian_culture.29.desc: "[ShowLocationName('valencia')]的织工因其生产的精美[ShowGoodsName('silk')]而闻名，这些织物在[ShowContinentName('europe')]各地备受赞赏。这一繁荣产业所产生的财富，既充实了商人的金库，也充实了[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]的金库，然而[ROOT.GetCountry.GetGovernment.GetCourtTitle]对这笔财富应如何使用却意见不一。"
 iberian_culture.29.a: "投资当地产业。"
 iberian_culture.29.b: "这些财富必须为[ROOT.GetCountry.GetFlavorRank]服务。"
 iberian_culture.30.title: "里奥哈的葡萄"
 iberian_culture.30.desc: "在埃布罗河沿岸的肥沃河谷，里奥哈的葡萄园已繁盛了数代。这些土地出产品质卓越的葡萄酒，这引起了我们[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]的注意；他们如今看到了良机，想通过在[ROOT.GetCountry.GetFlavorRank]各地扩张葡萄园来打造一项重要产业，但[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]抗议说，这可能扰乱数百年来指导酿酒的地方习俗。"
 iberian_culture.30.a: "让我们移植葡萄园。"
 iberian_culture.30.b: "保护我们的酿酒传统。"
