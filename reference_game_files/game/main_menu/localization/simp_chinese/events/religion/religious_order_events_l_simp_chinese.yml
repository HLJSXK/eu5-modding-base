l_simp_chinese:
 religious_orders.1.title: "虔诚的遗赠"
 religious_orders.1.desc: "一位富有的赞助人去世了，遗嘱将一笔不小的财富留给[target_order.GetName]。修士们已经在谈论为他们的分会院换新屋顶，以及在门口为穷人施面包。按照惯例，这类礼物归他们所有，尽管这种规模的钱币很少能逃过[target_character.GetName]的注意。"
 religious_orders.1.a: "让修士们留着吧。"
 religious_orders.1.b: "为国库索取它。"
 religious_orders.2.title: "[target_order.GetNameWithNoTooltip]寻求立足点"
 religious_orders.2.desc: "[target_order.GetName]已经超出了它那几座会院的容量，修士们向我们施压，要求扩展空间。他们看中了[target_location.GetName]，想在那里建立一座新的分会院，并从周围乡村吸引初学生。土地归我们给予或保留，他们等待我们的话。"
 religious_orders.2.a: "授予土地。"
 religious_orders.2.b: "改为资助当地的[GetEstateNameWithNoTooltip('clergy_estate')]。"
 religious_orders.2.c: "直接拒绝他们。"
 locals_embrace_the_order_desc: "人们立刻接纳了修士们，一季之内，新会院仿佛一直矗立在他们中间"
 order_works_to_bolster_local_wealth_desc: "修士们着手排干田地、修补道路，该地区因他们的劳动而更加富裕"
 order_projects_central_authority_desc: "随着修会在[target_location.GetName]安顿，[target_character.GetName]的敕令如今传得比以往更远一些"
 order_appreciates_new_holding_desc: "修士们感激地接受授予，[target_character.GetName]的恩惠在修会的会院中被温暖地谈论"
 religious_orders.3.title: "[target_order.GetNameWithNoTooltip]激起信众的热情"
 religious_orders.3.desc: "[target_order.GetName]已在乡间激起一片虔诚，修士们为他们点燃的热忱感到自豪。有些人想把这份热忱送到我们信仰尚未扎根的城镇，赢得堂区神父从未能赢得的灵魂。另一些人只是嘟囔说，这种情绪很少对行会中的有钱人保持温和。"
 religious_orders.3.a: "祝福这份热忱。"
 religious_orders.3.b: "向[GetEstateNameWithNoTooltip('burghers_estate')]施压要求捐助。"
 religious_orders.3.c: "派修士去信仰最薄弱的地方讲道。"
 religious_orders.4.title: "修院丑闻"
 religious_orders.4.desc: "消息传到我们这里，[target_order.GetName]某些修士的生活已背离他们的誓言，低语已经传遍到修院墙外。分会指望我们在丑闻造成真正伤害之前采取行动。"
 religious_orders.4.a: "清除有罪者。"
 religious_orders.4.b: "悄悄解决。"
 scandal_kept_quiet_desc: "事情被抹平，尽管修会的名声上残留着淡淡的污点"
 scandal_breaks_open_desc: "沉默没有保持住，修士们将丑闻泄露归咎于[target_character.GetName]"
 religious_orders.5.title: "一位赞助人退出"
 religious_orders.5.desc: "[GetEstateName('nobles_estate')]阶层中的一个名门望族长期资助[target_order.GetName]，如今那个钱袋已经关闭。修士们立刻感到匮乏，来到[target_character.GetName]面前，希望[target_character.GetSheHe]不会让他们的工作停滞。"
 religious_orders.5.a: "从国库弥补缺口。"
 religious_orders.5.b: "让他们用更少的资源应付。"
 religious_orders.5.c: "要求[GetEstateNameWithNoTooltip('nobles_estate')]寻找新赞助人。"
 new_patron_steps_forward_desc: "一个敌对家族接过了赞助，修会的金库再次充盈"
 no_patron_steps_forward_desc: "没有新赞助人出现，修士们对我们的干涉感到不满"
 treasury_gift_entrenches_order_desc: "修会善用这份礼物，它对我们土地的控制因此更加稳固"
 treasury_gift_earns_gratitude_desc: "修士将钱币视为恩惠的标志，他们对[target_character.GetName]的好感加深"
 religious_orders.6.title: "空荡的初学院"
 religious_orders.6.desc_martial: "前来加入[target_order.GetName]，拿起剑与十字架的青年寥寥无几。各指挥部人手不足一半，资深骑士不禁公开问道：等他们走后，谁来守御边疆？"
 religious_orders.6.desc_monastic: "每年扣响[target_order.GetName]大门的初学生越来越少。晨祷时唱经班席位空空荡荡，年老的修士们忧心忡忡：等他们离去之后，还有谁来按时诵念日课？"
 religious_orders.6.a: "向任何愿意服侍的人敞开大门。"
 religious_orders.6.b: "坚持严格的誓言。"
 religious_orders.6.c: "资助招募活动。"
 order_abandons_a_house_desc: "没有初学生填充，修会悄悄放弃了一座会院"
 order_withers_for_want_of_novices_desc: "修会坚守标准，但因缺乏新血，其实力和热忱都在消退"
 religious_orders.101.title: "修会的勇士"
 religious_orders.101.desc: "在[target_order.GetName]的弟兄之中，有一位名字已在边境村庄的歌谣中被传颂的骑士。他的上级深知自己的饭碗靠谁，已表示只要我们的战事需要，[target_character.GetName]的剑便可听凭我们的旗帜调遣。"
 religious_orders.101.a: "给他一个配得上歌谣的指挥权。"
 religious_orders.101.b: "他的位置在边疆。"
 religious_orders.102.title: "越境之剑"
 religious_orders.102.desc: "[target_order.GetName]的骑士未经许可便策马闯入[target_country.GetName]，回来时还赶着偷来的牛群。我们并未处于战争。邻国的使节已经在路上了，而他们此来绝非为了祈祷。"
 religious_orders.102.a: "赔偿并斥责修会。"
 religious_orders.102.b: "从异教徒那里拿来的就是拿得好。"
 religious_orders.103.title: "石上之石"
 religious_orders.103.desc: "一封来自[target_order.GetName]守卫者的信，以士兵的方式写成：他们在[target_location.GetName]的会院围墙比他们守卫的边境还要古老，而灰泥比哀悼便宜。他们要求不多，且直言不讳。"
 religious_orders.103.a: "拨款采购坚固石材。"
 religious_orders.103.b: "围墙可以先等等；让他们扩大巡逻范围。"
 religious_orders.104.title: "烽火未燃"
 religious_orders.104.desc_captives: "等到[target_location.GetName]的警报响起时，袭击者已经骑马离去，而且并非空手而去。村民们被绳子串在一起，赶到我们永远不会见到的市场上卖掉。[target_order.GetName]的守夜火整夜燃烧，却没有警告任何人，而看守们曾立誓阻止这种事发生。"
 religious_orders.104.desc_herds: "[target_location.GetName]周围的牧场在一夜之间被扫荡一空，这一带连一只蹄或一只角都不剩了。不等年关到来，粮仓便会尝到损失的滋味。[target_order.GetName]的看守们彼此追问不休：烽火为何始终未燃？"
 religious_orders.104.desc_plate: "袭击者夜间溜过了[target_order.GetName]的守夜火，到清晨，[target_location.GetName]的教堂已被剥得只剩光秃秃的石墙，银器和圣物都被装进袋子驮在马鞍上带走。修士们不敢与我们对视。"
 religious_orders.104.a: "承受损失。"
 religious_orders.104.b: "派修士们追击袭击者。"
 wardens_spoils_recovered_desc: "修士们马不停蹄，在一处渡口追上了劫掠者。他们带回了除道歉以外的一切，故事在讲述中越穿越神"
 wardens_trail_cold_desc: "修士们策马追击，却只找到蹄印和冷灰。损失仍在，耻辱也在"
 religious_orders.105.title: "墨水与羊皮纸"
 religious_orders.105.desc: "[target_order.GetName]的修士们保存着我们土地上最整洁的账簿，他们知道这一点。他们的上级向我们提供书记员，其[ROOT.GetCountry.GetLiturgicalLanguage.GetName]精准无误，算术丝毫不差，只求一间安静的房间和一份微薄的津贴作为回报。"
 religious_orders.105.a: "让他们处理税册。"
 religious_orders.105.b: "让他们处理国家信件。"
 religious_orders.106.title: "破碎的封印"
 religious_orders.106.desc: "一封盖有御玺的信在收件人拆封前三天就在[target_order.GetName]的分会院被诵读。在我们的秘书室服务的修士从不忘事。现在看来，他们也不把知道的事只留给自己。"
 religious_orders.106.a: "禁止他们进入秘书室。"
 religious_orders.106.b: "给他们一份假账簿。"
 religious_orders.106.c: "默默忍受。"
 confidants_ruse_swallowed_desc: "假数字完全按我们希望的那样传播，我们标记了它们经过的每一只手"
 confidants_ruse_discovered_desc: "一位眼尖的修士在一周内发现了编造的数字，修会不会原谅被当作傻瓜耍"
 religious_orders.107.title: "从海上归来"
 religious_orders.107.desc_crews: "一艘[target_order.GetName]的桨帆船低低地浮在水面上，艰难驶入港口；甲板上挤满了从外滩一处失事船只上救起的船员。幸存者发誓说，修士们是在任何受雇船长都不愿面对的天气里划桨前行，并在码头边的每一家酒馆里大声宣扬此事。"
 religious_orders.107.desc_charts: "一艘[target_order.GetName]的桨帆船完成长期护航归来，船长带着亲手校正过的航路指南上岸：那些我们自己的领航员从未知晓的测深数据和锚地，都被清清楚楚地标了出来，凡是识字之人都能看懂。"
 religious_orders.107.desc_relic: "半个海岸的人都出来观看[target_order.GetName]的一艘桨帆船挂满所有旗幡进港。修士们带着一件在远方港口买来的圣物上岸，码头边挤满了想一睹为快的人。"
 religious_orders.107.a: "以荣誉接待他们。"
 religious_orders.107.b: "修会保留自己的东西。"
 religious_orders.108.title: "无人生还"
 religious_orders.108.desc: "[target_order.GetName]最好的桨帆船在冬季狂风中撞礁碎裂，港口近在眼前，却已救援不及。船上的修士与他们花费多年训练的领航员一起溺亡。沿海一带修会的钟声敲响，却没有尸体可埋葬。"
 religious_orders.108.a: "由我们出资整修他们的分舰队。"
 religious_orders.108.b: "大海给予，大海夺取。"
 religious_orders.109.title: "按时诵念的日课"
 religious_orders.109.desc: "[target_order.GetName]的修士们一直按时诵念日课，从未有一夜中断，比大多数在世之人的记忆还要久远。霜冻中的晨祷，热病季节中的晚祷，祈祷叠着祈祷，如墙壁层层砌起。人们开始公开说，[ROOT.GetCountry.GetFlavorRank]之所以屹立，是因为修士们跪下祈祷。"
 religious_orders.109.a: "宣布一个感恩日。"
 religious_orders.109.b: "请院长降福。"
 religious_orders.110.title: "来自小房间的声音"
 religious_orders.110.desc: "[target_order.GetName]的一位隐修士，二十年来被砌封在自己的小房间之中，如今开始透过窗缝哭喊：火与瘟疫如一把出鞘之剑，悬在我们头顶。朝圣者把他的话语从一个教区传到另一个教区，比任何传令官骑马都快，而每转述一次，内容就变得更糟一分。"
 religious_orders.110.a: "命院长让他闭嘴。"
 religious_orders.110.b: "让他喊出他的警告。"
 doom_talk_fades_desc: "一季之内，乡间屏住呼吸。然后收成良好，天空拒绝坠落，预言在尴尬中悄然死去"
 dread_takes_hold_desc: "恐惧扎根。田地半荒，忏悔者走在路上，修会的小堂从未如此满过"
 religious_orders.111.title: "手抄本重见天日"
 religious_orders.111.desc: "[target_location.GetName]的[target_order.GetName]修士在重新装订一本虫蛀的诗篇集时，从封面木板下发现了一份更古老的文本：一部几个世纪前抄写、被每一位寻找过它的学者哀悼为失传的手抄本。那位图书管理员自此再未合眼，而他写给我们的信表明，他也不打算合眼。"
 religious_orders.111.a: "为我们自己的人制作副本。"
 religious_orders.111.b: "让它留在他们的图书馆。"
 religious_orders.112.title: "缮写室火灾"
 religious_orders.112.desc_chronicles: "一截蜡烛头，一阵穿堂风，[target_location.GetName]的[target_order.GetName]缮写室便在晨祷前化为乌有。修士们年复一年记载我们事迹的编年史——早在活着的人记忆之前便已开始——也随同存放它们的书架一起烧毁。。无论我们做过什么，如今能证明我们做过这些事的凭据，已所剩无几。"
 religious_orders.112.desc_psalters: "[target_location.GetName]的[target_order.GetName]缮写室在黎明前烧到门框，伟大的唱经班书也随之烧毁。诗篇集和交替圣歌集是这座会院的骄傲，经历了数代人的彩饰。如今日课只能凭记忆咏唱，而记忆终会出错。"
 religious_orders.112.desc_charters: "夜里，一场大火烧毁了[target_location.GetName]的[target_order.GetName]缮写室，也烧掉了半个地区的特许状和地契。修士们曾在羊皮纸上确定的每一条边界，如今都成了各执一词的问题，而在这类事情上，各方的意见很少会谦逊。"
 religious_orders.112.a: "重建它，书架和书桌。"
 religious_orders.112.b: "灰烬教人谦卑。"
 religious_orders.113.title: "从荒地开出的田地"
 religious_orders.113.desc: "[target_order.GetName]的修士们花了三个冬天排干他们在[target_location.GetName]的田庄下方的沼泽，今年春天水终于退去。原先苍鹭筑巢之处，如今是一片黑土，比任何人预想的都多，而谁的犁将翻耕它的问题随着第一个干燥的星期到来了。"
 religious_orders.113.a: "让田庄扩展。"
 religious_orders.113.b: "让我们自己的人定居在新犁沟上。"
 religious_orders.114.title: "牛棚中的牛瘟"
 religious_orders.114.desc: "[target_order.GetName]在[target_location.GetName]附近的牛棚爆发了牛瘟。牲畜低着头颤抖，兽医们互相争论，而修士们则直截了当地问我们是拿刀还是诵念德叙祷文。"
 religious_orders.114.a: "屠宰并焚烧。"
 religious_orders.114.b: "信赖祈祷和干净的稻草。"
 murrain_passes_over_desc: "疾病在一个月内消退。修士们虽早知会如此，却也宽宏地并未大声宣扬"
 murrain_spreads_desc: "牛瘟从修会的牛棚蔓延到该地区每一群牛中，德叙祷文对减缓它的步伐毫无作用"
 religious_orders.115.title: "市场广场上的雷霆"
 religious_orders.115.desc: "[target_order.GetName]的一位修士开始在[target_location.GetName]的市场讲道，专挑放贷人开桌的时辰。他不点名，也无需点名。穷人挤满广场听他讲道，而放贷人最近开始晚到早走。"
 religious_orders.115.a: "让他打雷。"
 religious_orders.115.b: "建议更温和的讲道。"
 religious_orders.116.title: "讲坛转向"
 religious_orders.116.desc: "填满广场的同一份天赋也能同样轻易地清空名声。[target_order.GetName]的一位修士在[target_location.GetName]将他的讲道的矛头转向我们：我们的赋税和我们的罪，在讲坛上被一一数列，而人群在一旁大声计数。"
 religious_orders.116.a: "以宽厚回应他。"
 religious_orders.116.b: "把他从讲坛上拖下来。"
 friar_recants_desc: "在拘押中他火气消退，在证人面前撤回言论。修会只能独自咽下这份难堪"
 martyr_of_the_square_desc: "他唱着歌走向自己的囚室，广场不会忘记这一幕。修士和镇上的人已将他称为殉道者"
 religious_orders.117.title: "弃婴轮"
 religious_orders.117.desc: "[target_order.GetName]的修士们在[target_location.GetName]会院的墙上装了一个转轮，婴儿可以不留姓名地放在那里，被不问问题地收留。转轮转动得比镇子愿意承认的更频繁，修会的摇篮满了。"
 religious_orders.117.a: "赞扬他们的慈善。"
 religious_orders.117.b: "让教区带走孩子。"
 religious_orders.118.title: "拥挤的收容所"
 religious_orders.118.desc: "热病随着路上往来的人流传来，[target_order.GetName]在[target_location.GetName]的收容所已遵照会规敞开大门。病人两人挤一张床，连床铺之间的回廊走道也躺满了。镇上的医生把这地方称为为飞蛾点亮的灯。"
 religious_orders.118.a: "闩上收容所的门。"
 religious_orders.118.b: "慈善不退缩。"
 hospice_spared_desc: "热病仿佛如约一般在收容所围墙内消退。修士们埋葬为数不多的死者，并感叹会规果然经受住了考验"
 hospice_fever_spreads_desc: "聚集在收容所的东西并未停留在收容院里。热病随痊愈者和哀悼者一同走了出去，这一地带一条街接一条街地病倒"
 religious_orders.119.title: "边境的赦罪"
 religious_orders.119.desc: "战争结束了，但它的账尚未结清。[target_order.GetName]的告解神父请求允许走访受害最重的地区，倾听人们不愿对邻人讲的事，赦免他们无法忘却的罪"
 religious_orders.119.a: "派他们到人民中去。"
 religious_orders.119.b: "他们首先要处理的是权贵。"
 religious_orders.120.title: "赦罪，买卖"
 religious_orders.120.desc_noble: "[target_order.GetName]的一位修士做起了一桩不宜声张的买卖：为一个[GetEstateName('nobles_estate')]大家族告解尚未犯过的罪，随着一次次赦罪，礼物也源源不断地送来。分会为之脸红。涉事家族却毫无愧色。"
 religious_orders.120.desc_merchant: "[target_order.GetName]的一位修士一直在向账房出售干净的良心，赦罪像任何其他存货一样按账簿定价。对[GetEstateName('burghers_estate')]来说，诚实地付一笔公道价钱根本算不上罪，而这正是问题的核心。"
 religious_orders.120.desc_prelate: "[target_order.GetName]的告解神父中有一人，罪人越是显贵，他给的补赎就明显越轻，而他的每一个忏悔者都是教会同僚，被赦免的尽是各堂区耳熟能详的罪。[GetEstateName('clergy_estate')]宁愿我们别查得太细。"
 religious_orders.120.a: "要求修会交出他。"
 religious_orders.120.b: "告解属于天主。"
 religious_orders.201.title: "突袭之后"
 religious_orders.201.desc: "修士们带着战利品和俘虏从突袭中归来，指挥部对如何纪念此事意见不一。"
 religious_orders.201.a: "游行展示战利品，让修会对边境的热忱燃烧得更旺。"
 religious_orders.201.b: "将收益悄悄并入边境防御。"
