l_simp_chinese:
 shurat: "舍身"
 ibadi_events.1.title: "$legacy_of_rustamids$"
 ibadi_events.1.desc: "$legacy_of_rustamids_desc$\n\n秉承古老伊玛目国的精神，[target_character.GetName]刚刚被宣布为第一位[ShowPolicyName('ibadi_zuhur_imam_policy')]，统治[ShowRegionName('maghreb_region')]。信众将不再被迫生活在[ShowPolicyNameWithNoTooltip('ibadi_kitman_imam_policy')]之下。"
 ibadi_events.1.a: "一个新时代开始了。"
 ibadi_events.1.b: "诚然，[ROOT.GetCountry.GetReligion.GetGodName]向我们微笑。"
 may_adopt_a_different_color: "我们可以采用#Y 深蓝色#!作为我们的国家颜色"
 rustamids_adopt_different_color: "我们采用#Y 深蓝色#!作为我们的国家颜色"
 ibadi_events.2.title: "弱势伊玛目"
 ibadi_events.2.desc: "[target_estate.GetName]对[ShowPolicyName('ibadi_daif_imam_policy')][target_character.GetName]的统治越来越不满。毕竟，弱势伊玛目的统治只在危机时期被容忍，而[ROOT.GetCountry.GetName]的[ShowReligionAdjective('ibadi')]信众不再受到威胁。"
 ibadi_events.2.a: "我们必须找到更好的候选人来领导我们。"
 ibadi_weak_imam_penalty_tt: "[ShowPolicyName('ibadi_daif_imam_policy')]将给我们带来递增的惩罚，直到我们通过[ShowGenericActionName('return_to_zuhur_imamate')]更换我们的[ruler|e]"
 has_penalty_for_weak_imam: "不再满足要求，且#Y $ibadi_events.2.title$#![event|e]已触发"
