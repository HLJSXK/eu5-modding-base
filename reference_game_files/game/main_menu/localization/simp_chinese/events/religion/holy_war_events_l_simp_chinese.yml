l_simp_chinese:
 holy_war.1.title: "圣战的号召"
 holy_war.1.desc: "讲道者来到我们的宫廷，他们的声音因热忱而嘶哑，号召每一位真信徒拿起武器对抗[preach_io.GetTarget.GetName]。信众们的目光转向我们。我们会响应号召吗？"
 holy_war.1.a: "我们投身这项事业！"
 holy_war.1.b: "此时不行。"
 holy_war.2.title: "为圣战征收的税"
 holy_war.2.desc: "来自[levy_leader.GetLongName]的使节抵达，他们领导着[levy_io.GetName]，带着庄严的恳求。对抗[levy_io.GetTarget.GetName]的圣战消耗钱币如同流血一样迅猛，作为信仰中的兄弟，我们被召唤来充实其战争金库。我们会为这项事业打开我们的金库吗？"
 holy_war.2.a: "支付一笔适度的款项。"
 holy_war.2.b: "慷慨支付。"
 holy_war.2.c: "不如我们自己加入这项事业。"
 holy_war.2.d: "我们不会为别人的战争纳税。"
 holy_war.2.d.tt: "[levy_io.GetName]的每位成员都认为我们#R 逃避圣战#!"
 holy_war.3.title: "我们的人民被改信"
 holy_war.3.desc: "在敌人从我们手中撕裂的土地上，他们的神职人员从一个村庄到另一个村庄，强迫我们的人民放弃祖先的信仰，否则就要为此受苦。每一次改宗的消息都传到我们的宫廷，这种暴行不会被遗忘。"
 holy_war.3.a: "他们会为此付出代价。"
 holy_war.3.a.tt: "我们不对强制改信采取行动"
 holy_war.4.title: "来自信众的斥责"
 holy_war.4.desc: "圣战的领袖指责我们逃避神圣职责，并威胁如果我们不证明我们的虔诚，将会有严重后果。我们如何回应？"
 holy_war.4.a: "我们发誓加倍努力。"
 holy_war.4.a.tt: "圣战领袖授予我们#G 2年#!时间来证明自己。如果到那时我们对圣战的参与有所增长，信众们将感到满意；如果没有，我们同样会遭受他们的斥责。"
 holy_war.4.b: "我们不向任何人负责。"
 holy_war.6.title: "信众们感到满意"
 holy_war.6.desc: "我们重新燃起的圣战热忱的消息传得很远，信众们的领袖现在带着温暖提到我们的名字。曾经怀疑的地方，如今有了青睐。"
 holy_war.6.a: "#italic 神的旨意#!。"
 holy_war.6.a.muslim: "#italic 安拉胡阿克巴#!。"
 holy_war.20.title: "信众们感到不满"
 holy_war.20.desc: "给予我们兑现誓言的时间已经到期，我们没有做任何事来履行它们。圣战的领袖没有忘记我们的承诺，也没有忘记我们未能遵守，他们警告的斥责现在落在我们身上。"
 holy_war.20.a: "我们必须承受他们的审判。"
 holy_war.7.title: "我们的号召得到响应"
 holy_war.7.desc: "[preach_target.GetName]听从了我们的讲道，加入了圣战，为事业誓言献出剑与财宝。又一把剑为信仰而出鞘，大军壮大。"
 holy_war.7.a: "信众们聚集。"
 holy_war.8.title: "我们的号召被拒绝"
 holy_war.8.desc: "[preach_target.GetName]对我们的讲道充耳不闻，提供冷淡的言辞和关闭的城门，不会加入圣战。信众们会记住这一怠慢。"
 holy_war.8.a: "就这样吧。"
 holy_war.8.a.tt: "他们无视了我们的提议"
 holy_war.9.title: "提供枢机席位"
 holy_war.9.desc: "[cardinal_offerer.GetName]，作为[cardinal_io.GetName]的领袖，提出如果我们拿起十字架，就将我们的一位教长提升为枢机席位，该席位将建立在我们自己的领地内。这种赞助将把我们绑到神圣事业上。我们接受吗？"
 holy_war.9.a: "我们接受这一荣誉并加入十字军。"
 holy_war.9.a.no_seat_tt: "我们的领地每个定居点都已拥有一个枢机席位，因此我们反而获得更高的声望作为荣誉"
 holy_war.9.b: "我们拒绝这一提议。"
 holy_war.10.title: "提供认可"
 holy_war.10.desc: "[recognition_offerer.GetName]，作为[recognition_io.GetName]的领袖，提出如果我们加入对抗异教徒的圣战，就承认我们在信众中的地位，授予宗教权威和合法性。我们接受吗？"
 holy_war.10.a: "我们接受并加入圣战。"
 holy_war.10.b: "我们拒绝这一提议。"
 holy_war.13.title: "异教徒付钱"
 holy_war.13.desc: "我们的要求已经结果。[parias_payer.GetName]支付了贡赋，而不是在未准备好的情况下面对[threatening_crusade.GetName]。他们的钱币充实我们的金库，而他们的缓刑只是缓刑。圣战只是被推迟。"
 holy_war.13.a: "他们的黄金服务于神圣事业。"
 holy_war.13.a.tt: "他们支付了贡赋"
 holy_war.14.title: "异教徒违抗我们"
 holy_war.14.desc: "[parias_payer.GetName]拒绝了我们的贡赋要求，选择了违抗。他们的无礼只会让信众们的决心更加坚定，[threatening_crusade.GetName]的热忱因此燃烧得更旺。"
 holy_war.14.a: "那就让剑来回答。"
 holy_war.14.a.tt: "他们拒绝支付贡赋"
 holy_war.17.title: "奇迹般的康复"
 holy_war.17.desc: "一名普通士兵，被营地医生放弃为死人，却从病床上健康完整地站了起来，许多人已经称之为上天之作。然而在高烧中，他被奇怪而令人不安的梦境造访，他发誓这些异象预示了将要发生的事，士兵们不安地低语。我们如何处理此事？"
 holy_war.17.a: "宣布他的康复是奇迹，并集结大军！"
 holy_war.17.a.muslim: "$holy_war.17.a$"
 holy_war.17.a.tt: "将圣战的宗教热忱提高#G 5#!"
 holy_war.17.b: "在恐惧蔓延前压下此事。"
 holy_war.18.title: "营地中的热忱消退"
 holy_war.18.desc: "漫长的等待残酷地消耗着大军。曾经热忱响亮的祈祷现在按惯例喃喃而出，脾气因最微小的琐事而磨损，旧的仇恨每晚在营火旁重新闷烧。最初吸引信众们的热情已冷却成灰烬，除非有什么很快重新点燃他们的精神，整个事业可能在发出一击之前就消散。该怎么办？"
 holy_war.18.a: "为大军举行一场盛大的讲道和宴会。"
 holy_war.18.a.tt: "将圣战的宗教热忱提高#G 8#!"
 holy_war.18.b: "信众们必须自己找到火焰。"
 holy_war.18.b.tt: "将圣战的宗教热忱降低#R 5#!，并将其准备工作推迟#R 5#!"
 holy_war.19.title: "一位煽动性的讲道者"
 holy_war.19.desc: "一位目光狂野的讲道者出现在营地边缘，他的长袍旅途磨损，声音因连日不停劝诫而嘶哑。他燃烧的话语吸引了一大群贫穷和虔诚的人，还有劳工和无地者，他们全都叫嚷着要在这个时辰为信仰进军。他狂热得毫无理性，完全不受约束，我们中没有领主能指挥他。我们该如何对待这位煽动者？"
 holy_war.19.a: "给他自由，让他召集信众。"
 holy_war.19.a.tt: "将圣战的宗教热忱提高#G 5#!"
 holy_war.19.b: "在他煽动混乱之前约束他。"
 holy_war.21.title: "关于战利品的争吵"
 holy_war.21.desc: "城镇刚刚陷落，我们的士兵和一支盟军的士兵就为战利品的分配打了起来。窄巷中已拔出刀剑，帐篷被掀翻，两营之间的旧怨沸腾成公开斗殴。如果争吵不迅速解决，可能会破坏整个战役，在敌人仍站立时让兄弟反目。我们如何解决？"
 holy_war.21.a: "让士兵拿走他们应得的东西。"
 holy_war.21.a.tt: "将圣战的宗教热忱降低#R 5#!"
 holy_war.21.b: "为事业大局约束他们。"
 holy_war.21.b.tt: "将圣战的宗教热忱提高#G 5#!"
 holy_war.22.title: "大军中的疾病"
 holy_war.22.desc: "一种消耗性的热病在拥挤的围城线中蔓延，每个灰色的早晨都有更多人被从帐篷中无意识地抬出。营地医生为他们放血、催泻并祈祷，但没有什么能阻止疾病，死亡的气味沉重地笼罩整个营地。每过一天，大军都在离家如此遥远、城墙仍未攻破的情况下流失它负担不起的力量。我们如何应对这场灾祸？"
 holy_war.22.a: "推进战役，无论代价如何。"
 holy_war.22.b: "让大军休息直到疾病过去。"
 holy_war.22.b.tt: "将圣战的宗教热忱降低#R 5#!"
 holy_war.23.title: "一位勇士倒下"
 holy_war.23.desc: "在[sieged_location.GetName]的围城中，[fallen_champion.GetName]在激烈战斗中倒下，在将被传唱一代人的英勇事迹之后被砍倒在城墙上。大军哀悼一位受普通士兵和骄傲领主同样爱戴的勇士，然而即使在悲伤中，士兵们的血液也被点燃，许多人现在请求荣誉，要在敌人身上为倒下者复仇。我们该如何纪念这一死亡？"
 holy_war.23.a: "欢呼他为信仰的殉道者！"
 holy_war.23.a.tt: "将圣战的宗教热忱提高#G 10#!"
 holy_war.23.b: "以安静的尊严纪念他。"
 holy_war.23.b.tt: "将圣战的宗教热忱提高#G 3#!"
 holy_war.24.title: "队伍中的假信徒"
 holy_war.24.desc: "丑陋的低语在营地中流传，说异端和假信徒已潜入信众之中，他们的祈祷是空洞的嘲弄，他们的忠诚严重可疑。大军中最虔诚的人要求在他们毒害整支军队之前将其根除，而较冷静的头脑建议，一个人手中的剑就是剑，无论他心中埋藏什么信条。我们如何回答这一指控？"
 holy_war.24.a: "从大军中清除假信徒。"
 holy_war.24.a.tt: "将圣战的宗教热忱提高#G 8#!"
 holy_war.24.b: "视而不见。我们需要每一把剑。"
 holy_war.24.b.tt: "将圣战的宗教热忱降低#R 5#!"
 holy_war.25.title: "虔诚的遗赠"
 holy_war.25.desc: "我们领地的一位富有的显贵，最近去了他的永恒奖赏，在最后遗嘱中给圣战留下了一大笔钱。他的遗嘱执行人已将财富交给我们保管，密封的钱箱由我们视事业需要支配，而神职人员、军官和穷人已经各自对其提出要求。这笔财富该去哪里？"
 holy_war.25.a: "拿这笔财富资助我们自己的战争。"
 holy_war.25.b: "把它交给圣战的战争金库。"
 holy_war.25.b.tt: "将圣战的宗教热忱提高#G 3#!"
 holy_war.25.c: "把它作为施舍分发给信众。"
 holy_war.25.c.tt: "将圣战的宗教热忱提高#G 3#!"
 holy_war.27.title: "逃兵被收买"
 holy_war.27.desc: "我们的银子已经悄然见效。[desertion_member.GetName]接受了贿赂，放弃了他们的事业，收起旗帜，带着没人真正相信的借口溜回家。我们的敌人因他们的离开而更弱。黄金再次买到了钢铁和讲道都无法买到的东西，一个麻烦的敌人被悄悄从棋盘上移除。或许这是一个关于忠诚真正价格的教训。"
 holy_war.27.a: "剑无法达成的事，贪婪却能做到。"
 holy_war.27.a.tt: "[desertion_member.GetName]接受了贿赂并离开了[desertion_io.GetName]"
 holy_war.28.title: "我们的白银被唾弃"
 holy_war.28.desc: "[desertion_member.GetName]直接拒绝了我们的秘密提议，将我们的使节逐出他们的宫廷，发誓要坚定不移地坚持战争，不受我们钱币的诱惑。更糟的是，这次尝试的消息可能传播，如果传到公众耳中，我们的名字将被玷污为教唆者和骗子。这次冒险除了风险几乎一无所获。"
 holy_war.28.a: "就这样吧。"
 holy_war.28.a.tt: "他们拒绝了贿赂"
 holy_war.29.title: "教宗特使"
 holy_war.29.desc: "教宗陛下已派遣[papal_legate.GetName]——一位在战争艺术和神职方面同样精通的战士兼高级神职人员——骑行在我们大军的前头，为我们的[holy_war.GetName]带来罗马的全面祝福。这样的人可以磨砺我们的军队，并将我们与圣座绑得更紧，尽管他首先对教宗负责，然后才对我们。我们要让他为我们效劳吗？"
 holy_war.29.a: "欢迎特使加入我们的旗帜。"
 holy_war.29.a.tt: "将[crusade|e]的宗教热忱提高#G 5#!"
 holy_war.29.b: "带着我们的感谢送他回罗马。"
 holy_war.30.title: "营地中的赎罪券贩子"
 holy_war.30.desc: "一群赎罪券贩子像秃鹫扑向新鲜腐肉一样降临营地，向任何愿意交出钱币的士兵兜售赎罪券和神圣小饰品。他们的收入增长得和虔诚者的抱怨一样快，后者称整个交易是事业的丑闻。然而钱币就是钱币，没有圣战是仅仅靠祈祷赢得的。该对他们怎么办？"
 holy_war.30.a: "让他们的收入充实战争金库。"
 holy_war.30.a.tt: "将[crusade|e]的宗教热忱降低#R 3#!"
 holy_war.30.b: "悄悄将钱币转入我们自己的金库。"
 holy_war.30.b.tt: "将[crusade|e]的宗教热忱降低#R 5#!"
 holy_war.30.c: "将贩子赶出营地。"
 holy_war.30.c.tt: "将[crusade|e]的宗教热忱提高#G 5#!"
 holy_war.31.title: "圣人的遗骸"
 holy_war.31.desc: "一位受尊敬的圣人的骨骸已交给我们保管，由一队感激的修士带到我们的宫廷，他们护送圣髑穿越了许多危险的里格。这样的圣髑是超越任何黄金价格的财富，因为它们最终安息的地方，信众们会成千上万地聚集来祈祷和惊叹。这些圣髑该保存在哪里？"
 holy_war.31.a: "将它们供奉在我们的首都。"
 holy_war.31.b: "将它们带在军队前进入战斗。"
 holy_war.31.b.tt: "将[crusade|e]的宗教热忱提高#G 8#!"
 holy_war.32.title: "十字军的誓言"
 holy_war.32.desc: "在整个集结的宫廷面前，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]跪在祭坛前，立下强大的誓言，要亲自拿起十字架，带领信众进入圣战的核心，与最卑微的步兵一起分担战役的每一份艰辛和危险。这是一个大胆的誓言，也是一个危险的誓言，整个王国现在等待我们的话语。我们让这个誓言成立吗？"
 holy_war.32.a: "让[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]亲自领导大军。"
 holy_war.32.a.tt: "将[crusade|e]的宗教热忱提高#G 5#!"
 holy_war.32.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]留在王座上更有利于王国。"
 holy_war.33.title: "基督教世界背起十字架"
 holy_war.33.desc: "一股巨大的神圣热忱浪潮席卷王国，各阶层的人叫嚷着要把十字架缝到束腰外衣上，为信仰进军。骄傲的骑士和拥有土地的领主互相争夺先锋的荣耀，而在村庄里，普通民众拿起他们能拿到的任何武器。我们最充分利用谁的热情？"
 holy_war.33.a: "召唤骑士和贵族到旗帜下。"
 holy_war.33.b: "从普通民众中召集一支大军。"
 holy_war.34.title: "一位苏菲谢赫"
 holy_war.34.desc: "一位受尊敬的苏菲谢赫，[sufi_shaykh.GetName]，他的虔诚和学识在整个穆斯林世界闻名，带着一队虔诚的门徒来到我们的营地。他在晚火旁的讲道让圣战者的心燃烧，昨天还疲惫行军的士兵现在眼睛闪亮地谈论殉道。我们如何接待这位圣洁的人？"
 holy_war.34.a: "将谢赫带入我们的宫廷。"
 holy_war.34.a.tt: "将[jihad|e]的宗教热忱提高#G 5#!"
 holy_war.34.b: "与这位流浪神秘主义者保持距离。"
 holy_war.34.b.tt: "将[jihad|e]的宗教热忱降低#R 3#!"
 holy_war.35.title: "圣战者要求他们的一份"
 holy_war.35.desc: "成群响应号召而来的志愿战士现在强硬地催促我们兑现承诺给他们的战利品，挤在我们帐篷前，声音响亮，耐心短暂。他们说，他们为信仰而战，但也为妻儿而战，而空手意味着下一场硬仗时队伍空空。我们如何回答他们的要求？"
 holy_war.35.a: "授予圣战者他们应得的战利品份额。"
 holy_war.35.a.tt: "将[jihad|e]的宗教热忱提高#G 5#!"
 holy_war.35.b: "战利品属于战争努力，不属于贪婪。"
 holy_war.35.b.tt: "将[jihad|e]的宗教热忱降低#R 3#!"
 holy_war.36.title: "一位法学家的教令"
 holy_war.36.desc: "一位受人尊敬的法官，他的话语在#italic 乌玛#!从一端到另一端都有分量，发布了一项#italic 教令#!，宣布圣战是每位能拿起武器的信徒必须承担的神圣职责。由上百只手抄写，从一个清真寺传到另一个清真寺，这样的裁决可能为我们的事业点燃整个伊斯兰世界。我们广泛传播它吗？"
 holy_war.36.a: "将裁决传播到每个角落。"
 holy_war.36.a.tt: "将[jihad|e]的宗教热忱提高#G 8#!"
 holy_war.36.b: "带着安静的感谢接受它。"
 holy_war.36.b.tt: "将[jihad|e]的宗教热忱提高#G 3#!"
 holy_war.37.title: "来自乌玛各地的志愿者"
 holy_war.37.desc: "圣战的消息已传到我们边界之外很远，现在成群的圣战志愿者从遥远的穆斯林土地抵达集结地。他们脚痛、满身尘土、急切，只要求队伍中的一个位置和与敌人战斗的机会。确实，他们是要喂的许多张嘴，但也是许多愿意的剑。我们接纳他们吗？"
 holy_war.37.a: "欢迎志愿兵加入集结。"
 holy_war.37.a.tt: "将[jihad|e]的宗教热忱提高#G 3#!"
 holy_war.37.b: "我们不能喂饱每一个流浪的狂热者。"
 holy_war.38.title: "神圣旗帜"
 holy_war.38.desc: "一面古老的战旗，据说曾在信仰最早的日子里飘扬在最早信众的胜利之上，已被托付给我们保管。虽然布已褪色破旧，但它的景象就足以将信众们激起正义的愤怒，人们发誓他们将跟随它进入任何危险而不退缩。我们该如何处理这样珍贵的圣物？"
 holy_war.38.a: "将它高高举在大军之上。"
 holy_war.38.a.tt: "将[jihad|e]的宗教热忱提高#G 5#!"
 holy_war.38.b: "像它应得的宝藏一样守护它。"
 sacred_war_banner: "神圣旗帜"
 sacred_war_banner_desc: "一面褪色破旧的战旗，据说曾飘扬在最早信众的胜利之上，现在作为王国的神圣宝藏保存，在最神圣的日子被带出，以将信众们激起正义的愤怒。"
 holy_war.39.title: "枢机席位被接受"
 holy_war.39.desc: "[cardinal_candidate.GetName]接受了我们的枢机席位提议，拿起十字架，加入了[cardinal_io.GetName]。让他们中升起一位新的教会亲王。"
 holy_war.39.a: "感谢天主！"
 holy_war.40.title: "枢机席位被拒绝"
 holy_war.40.desc: "[cardinal_candidate.GetName]拒绝了我们的枢机席位提议，不会加入[cardinal_io.GetName]。这一荣誉将被提供给别处。"
 holy_war.40.a: "就这样吧。"
 holy_war.41.title: "我们的承认被接受"
 holy_war.41.desc: "[recognition_candidate.GetName]接受了我们的承认提议，加入了[recognition_io.GetName]，与信众们一起向异教徒拔剑。"
 holy_war.41.a: "真主至大！"
 holy_war.42.title: "我们的承认被拒绝"
 holy_war.42.desc: "[recognition_candidate.GetName]拒绝了我们的承认提议，不会加入[recognition_io.GetName]。信众们会记住谁站在一边。"
 holy_war.42.a: "就这样吧。"
