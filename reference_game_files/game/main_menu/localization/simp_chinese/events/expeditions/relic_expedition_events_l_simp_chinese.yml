l_simp_chinese:
 relic_expedition_events.1.title: "寻找圣物"
 relic_expedition_events.1.desc: "主教们提出了请求，而[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]已经同意。一位从黎凡特归来的商人这样讲述：一位大马士革商人从他父亲那里听说，当十字军王国陷落时，法兰克人教堂中保存的许多东西被运走并埋藏，而不是被烧毁。埋藏的东西可以被挖出来。它们也可以被买到，只要一个人在合适的一周找到合适的人家，并且不在能被旁人听见的地方讨价还价。\n\n是哪件圣物，在哪里，没人会说。这类故事在那条海岸的每个港口都很廉价。而这一则，已经传到了该听的人耳中。"
 relic_expedition_events.1.a: "给他们配备齐全：礼物、一名翻译、一名修士、一个钱袋。"
 relic_expedition_events.1.b: "一名密探，一个不声张的钱袋。更少的眼睛，更小的风险。"
 relic_expedition_events.1.historical_info: "真十字架于1187年7月被带上哈丁战场，随后被萨拉丁的军队夺走。狮心王理查、拜占庭皇帝和格鲁吉亚女王都曾试图赎回它，但全都失败了；最后一份可信的记载称它在大马士革，此后便完全从记录中消失了。1098年在安条克被发现的圣枪，也在第一次十字军东征继续推进后同样悄无声息地不见了。这两件圣物的遗失始终没有得到解释——而这正是搜寻者不断寻找的原因。"
 relic_expedition_events.2.title: "抵达"
 relic_expedition_events.2.desc_jerusalem_first: "探险队来到了[ShowLocationName('jerusalem')]，站在圣墓教堂前。[location_scope.GetOwner.GetAdjective]驻军打量了这群人，然后失去了兴趣。每个季节都有外国人为了同一座坟墓和同样的故事来到这里。在这些故事背后的某处，有一条值得追寻的线索，找到它将缓慢而昂贵，而且主要是选择相信谁的问题。"
 relic_expedition_events.2.desc_jerusalem_repeat: "回到[ShowLocationNameWithNoTooltip('jerusalem')]。圣墓的神职人员现在已经认识[target_leader.GetName]了，驻军也不再费心抬头看。"
 relic_expedition_events.2.desc_acre_first: "探险队抵达[ShowLocationName('acre')]，这是十字军王国的首都，直到1291年被马穆鲁克攻占。大教堂还勉强矗立着，屋顶的位置只剩下天空，整个街区自劫掠以来从未重建。还没有人有理由去翻找瓦砾。"
 relic_expedition_events.2.desc_acre_repeat: "又回到[ShowLocationNameWithNoTooltip('acre')]。[target_leader.GetName]知道哪些小巷值得再走一遍。"
 relic_expedition_events.2.desc_antioch_first: "探险队抵达[ShowLocationName('antioch')]，这是消失的十字军公国的所在地，也是1098年那个绝望的夏天，$relic_holy_lance_found$从教堂地板下被挖出的城市。当军队南下前往[ShowLocationNameWithNoTooltip('jerusalem')]后，圣枪去了哪里，西方从未有定论。这不是这座城市唯一失去踪迹的东西。"
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName]回到[ShowLocationNameWithNoTooltip('antioch')]，仍在打听失落圣枪的下落，每个问题仍然得到三个答案。"
 relic_expedition_events.2.desc_damascus_first: "探险队抵达[ShowLocationName('damascus')]，这是[ShowProvinceDefinitionName('shaam_province')]的伟大[location_scope.GetOwner.GetAdjective]首都，也是哈丁战役后$relic_true_cross_found$最后一次被可靠报道的地方。那件特定的圣物是否还在这里是另一回事。这样规模的城市在几个世纪里接收了大量珍宝，却很少归还。"
 relic_expedition_events.2.desc_damascus_repeat: "回到[ShowLocationNameWithNoTooltip('damascus')]。[target_leader.GetName]已经知道在这个[location_scope.GetRank.GetNameWithNoTooltip]里谁会透露消息，以及代价是什么。"
 relic_expedition_events.2.desc_tripoli_first: "探险队抵达[ShowLocationName('tripoli_syria')]，这是一个十字军伯国，直到1289年陷落。港口的贸易一如既往地活跃，但旧城堡的小教堂已经未被祝圣的时间比这里任何人记得的都长，也没有人清空过它。"
 relic_expedition_events.2.desc_tripoli_repeat: "回到[ShowLocationNameWithNoTooltip('tripoli_syria')]。港口的商人现在已经能认出[target_leader.GetName]了。"
 relic_expedition_events.2.desc_tyre_first: "探险队抵达[ShowLocationName('sur')]，这是一个古老到福音书记载基督经过其领土的[location_scope.GetRank.GetName]，也是十字军1291年前在大陆上最后几个据点之一。它的大主教区保存了两个世纪的记录。幸存下来的记录散落在十几个私人住宅中，没有两个主人对自己拥有什么达成一致。"
 relic_expedition_events.2.desc_tyre_repeat: "回到[ShowLocationNameWithNoTooltip('sur')]。[target_leader.GetName]已经读过了旧总主教区留下的大部分东西。"
 relic_expedition_events.2.desc_jaffa_first: "探险队抵达[ShowLocationName('jaffa')]，朝圣者曾在此整船登陆，宗徒伯多禄据说在此使寡妇塔彼达从死里复活。两个世纪的朝圣交通双向经过这个港口，并非所有人都再次离开。"
 relic_expedition_events.2.desc_jaffa_repeat: "回到[ShowLocationNameWithNoTooltip('jaffa')]。码头区已经习惯了[target_leader.GetName]的问题。"
 relic_expedition_events.2.desc_hebron_first: "探险队抵达[ShowLocationName('hebron')]和族长洞穴，据说亚巴郎、伊撒格和雅各伯都埋葬在那里，对[ShowReligionGroupAdjective('israelite_group')]、[ShowReligionGroupAdjective('christian')]和[ShowReligionGroupAdjective('muslim')]信徒同样神圣。三个信仰几个世纪以来都为这个圣龛增添和取走东西。某件小东西，在错误的世纪被收起来，可能永远无人注意地坐在这里。"
 relic_expedition_events.2.desc_hebron_repeat: "回到[ShowLocationNameWithNoTooltip('hebron')]。[target_leader.GetName]以前走过圣龛的辖区，知道哪里不该被看见走动。"
 relic_expedition_events.2.desc_sidon_first: "探险队抵达[ShowLocationName('sidon')]，这是福音书记载基督访问过的另一座城镇，也是一个十字军领主领地，直到王国陷落。旧法兰克区此后已被重新定居两次。现在的租户不知道自己的地窖里有什么。"
 relic_expedition_events.2.desc_sidon_repeat: "回到[ShowLocationNameWithNoTooltip('sidon')]。[target_leader.GetName]有一份值得再次拜访的法兰克家族清单。"
 relic_expedition_events.2.desc_karak_first: "探险队抵达[ShowLocationName('karak')]，这是雷纳德·德·沙蒂永作为外约旦领主持有的沙漠城堡。雷纳德多年来抢劫朝圣商队，据说把赃物储存在这里，以应对他知道萨拉丁会带来的围困。下面镇上的每个家庭讲述这个故事的方式都不同。"
 relic_expedition_events.2.desc_karak_repeat: "回到[ShowLocationNameWithNoTooltip('karak')]。[target_leader.GetName]已经听过一次城堡的传说，又听爱说话的人讲了两次。"
 relic_expedition_events.2.desc_gaza_first: "探险队抵达[ShowLocationName('gaza')]，这是一座古城，当年有圣殿骑士团驻军，位于通往[ShowRegionName('egypt_region')]的沙漠道路上。该修会几代前被镇压，其弟兄分散到基督教世界各地。他们在这里保存的东西并没有全部随他们离开。"
 relic_expedition_events.2.desc_gaza_repeat: "回到[ShowLocationNameWithNoTooltip('gaza')]。[target_leader.GetName]已经与住在圣殿骑士团旧地的多数家庭交谈过。"
 relic_expedition_events.2.desc_famagusta_first: "探险队抵达[ShowLocationName('famagusta')]，这是[ShowProvinceDefinitionName('cyprus_province')]的[location_scope.GetOwner.GetAdjective][location_scope.GetOwner.GetFlavorRank]的伟大港口。1291年[ShowLocationNameWithNoTooltip('acre')]陷落后，拉丁家庭大量逃到这里，其中许多人从大陆带来的东西比他们的头衔更多。"
 relic_expedition_events.2.desc_famagusta_repeat: "回到[ShowLocationNameWithNoTooltip('famagusta')]。圣尼古拉斯主教座堂的人现在认识[target_leader.GetName]了。"
 relic_expedition_events.2.desc_nicosia_first: "探险队抵达[ShowLocationName('nicosia_cyp')]，这是[ShowProvinceDefinitionName('cyprus_province')]的权力所在地。[location_scope.GetOwner.GetAdjective][location_scope.GetOwner.GetGovernment.GetCourtTitle]保存着一份长长的档案，记录流亡的大陆贵族带来了什么，还有一份更长的记录他们后来典当了什么。"
 relic_expedition_events.2.desc_nicosia_repeat: "回到[ShowLocationNameWithNoTooltip('nicosia_cyp')]。[location_scope.GetOwner.GetAdjective]档案管理员已经不再问[target_leader.GetName]为什么不断返回。"
 relic_expedition_events.2.desc_rhodes_first: "探险队抵达[ShowLocationName('rodos')]，[location_scope.GetOwner.GetAdjective]领土。这里的修会记得[ShowLocationNameWithNoTooltip('acre')]的陷落如同自己的历史，并保存了大陆上每个被放弃的指挥部的清单。这些水域中没有其他城市会向一个天主教搜寻队开放这样的记录。"
 relic_expedition_events.2.desc_rhodes_repeat: "回到[ShowLocationNameWithNoTooltip('rodos')]。[location_scope.GetOwner.GetAdjective]档案管理员像迎接一个熟悉的麻烦一样迎接[target_leader.GetName]。"
 relic_expedition_events.2.desc_fallback: "又一站，又一轮介绍。[target_leader.GetName]重新开始，等待值得追逐的东西。"
 relic_expedition_events.2.a: "四处打听。朝圣者和士兵会说话，如果用[ShowGoodsNameWithNoTooltip('wine')]支付。"
 relic_expedition_events.2.b: "我们终于找到了一件圣物的线索。"
 relic_expedition_events.2.c: "在这里雇用更多随从。好守卫不便宜。"
 relic_expedition_events.2.d: "贿赂一名宫廷官员，获取当地档案中的任何东西。"
 relic_expedition_events.2.e: "寻找一位学者。受过训练的大脑更善于解读谣言。"
 relic_expedition_events.2.f: "沿着一条有希望的线索前往[relic_hunt_new_lead.GetNameWithNoTooltip]。"
 relic_expedition_events.2.g: "取消搜寻并返回。"
 relic_expedition_events.3.title: "搜寻继续"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName]在黎明前回到圣墓，赶在朝圣人群之前。还有另一个地下室要在烛光下查看，另一段磨损的铭文要抄录，另一位神职人员愿意为合适的报酬开口。"
 relic_expedition_events.3.desc_acre: "空心墙被敲打听音，倒塌的砖石在几代人无人打扰的地方被翻动。[ShowLocationNameWithNoTooltip('acre')]是一个很大的[relic_hunt_loc.GetRank.GetName]，里面的人很少，一支队伍只能覆盖这么多。"
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName]追踪消失城墙的线路，将仍然矗立的部分与朝圣者关于圣枪出土位置的记载相对照。这些记载彼此不一致，也没有一个与地面相符。"
 relic_expedition_events.3.desc_damascus: "一个又一个集市，[target_leader.GetName]培养商人和放债人。谣言在这么大的城市里传播缓慢，但它们确实在传播，而且到达时已经附带了价格。"
 relic_expedition_events.3.desc_tripoli: "城堡小堂被一块块地拆开，灰泥在墙壁声音不对的地方被撬掉。仅小堂就是数周的工作。"
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName]梳理[ShowLocationNameWithNoTooltip('sur')]总主教区记录中幸存下来的部分，把水渍斑斑的账簿放在半可读的宪章旁边，寻找与其他条目不符的那一条。"
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName]在[ShowLocationNameWithNoTooltip('jaffa')]的港口度过日子，为码头工人和船夫买酒，询问法兰克人离开前哪些仓库处理朝圣货物。"
 relic_expedition_events.3.desc_hebron: "圣龛被一个壁龛一个壁龛地检查，缓慢而极其小心，以免冒犯守护它的三个信仰中的任何一个。[target_leader.GetName]记下每个封闭的通道，但不对其中任何一个出声询问。"
 relic_expedition_events.3.desc_sidon: "在旧法兰克区，一家又一家被重新定居的房屋，[target_leader.GetName]敲门询问自上一个基督教租户逃离以来无人打开过的地窖和阁楼。"
 relic_expedition_events.3.desc_karak: "[target_leader.GetName]提着灯笼走过[ShowLocationNameWithNoTooltip('karak')]的拱顶和蓄水池，将讲故事者描述的雷纳德·德·沙蒂永的宝藏与墙壁实际承认的进行比较。"
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName]继续追查被镇压修会在[ShowLocationNameWithNoTooltip('gaza')]的财产，向邻居施压，询问圣殿骑士团哪些储藏室保持锁闭，以及后来谁拿了钥匙。"
 relic_expedition_events.3.desc_famagusta: "我们逐个翻查[ShowLocationNameWithNoTooltip('famagusta')]流亡大陆家族的家传箱笼，逐一核验从[ShowLocationNameWithNoTooltip('acre')]带出来的东西，以及此后被悄悄遗忘的东西。"
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName]在[ShowLocationNameWithNoTooltip('nicosia_cyp')]阅读[relic_hunt_loc.GetOwner.GetAdjective][relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle]的档案，将清单与继承名册交叉比对，寻找一件没人想起要过问的圣物。"
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName]在[ShowLocationNameWithNoTooltip('rodos')]向[relic_hunt_loc.GetOwner.GetAdjective]档案管理员施压，索要他们未提供的卷册，并将他们的清单与年老修士们所称从[ShowLocationNameWithNoTooltip('acre')]运出的物品进行比对。"
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName]继续努力，把每条小线索依次翻过再放手。"
 relic_expedition_events.3.a: "继续询问。这里有人知道的比他们说的多。"
 relic_expedition_events.3.b: "终于，线索本身。我们找到了。"
 relic_expedition_events.3.c: "趁我们在这里，雇用更多随从。"
 relic_expedition_events.3.d: "再贿赂一名官员。这个镇子保存着更好的记录。"
 relic_expedition_events.3.e: "在继续前进之前咨询当地学者。"
 relic_expedition_events.3.f: "一条新线索指向别处。沿着它前往[relic_hunt_new_lead.GetNameWithNoTooltip]。"
 relic_expedition_events.3.g: "取消搜寻并返回。"
 relic_expedition_events.4.title: "线索愈发渺茫"
 relic_expedition_events.4.desc: "[target_leader.GetName]追查的每条线索都一无所获。翻译们已经跑遍了酒馆，被贿赂的官员没有什么可再卖的，队伍在异国闲置，钱袋每周都在变轻。消息传回王室：支付更多搜寻费用，或者结束它。"
 relic_expedition_events.4.a: "寄送必要的资金。"
 relic_expedition_events.4.b: "够了。召回探险队。"
 relic_expedition_events.5.title: "护卫队失踪"
 relic_expedition_events.5.desc: "[target_leader.GetName]的护卫队不见了，三三两两地损失于强盗、热病，以及报酬太低、看不到尽头的搜寻中安静的开小差。没有人会向领主或修道院长索要他们不愿交出的圣物，而请求背后没有武装人员站着。\n\n搜寻到此结束。"
 relic_expedition_events.5.a: "没有他们，任务无法继续。"
 relic_expedition_events.6.title: "一位主动的出售者"
 relic_expedition_events.6.desc_true_cross: "镇上一位商人，小心注意谁在听力范围内，说他持有$relic_true_cross_found$本身的一块碎片，那是在哈丁丢失的木头，通过他不愿透露姓名的渠道传下来。不过，他会开个价。"
 relic_expedition_events.6.desc_holy_lance: "一位死去士兵的家族自曾祖父服役以来保存着一枚矛头，并坚持认为它是$relic_holy_lance_found$，即1098年发现的那一枚。他们宁愿要钱。"
 relic_expedition_events.6.desc_holy_shroud: "一位商人展开一块亚麻布，上面有一个被钉十字架的人的淡淡图像。他无法说明它在这些世纪里在哪里，但他要价极高。"
 relic_expedition_events.6.desc_holy_nail: "一位铁匠的遗孀拿出一枚因年代久远而变黑的铁钉。她丈夫的家族一直发誓它是十字架受难时的钉子之一。她愿意卖。"
 relic_expedition_events.6.desc_true_cross_fragment: "一座贫穷且半被遗忘的修院在一个朴素的圣物箱里保存着一块木头碎片，仅标记为$relic_true_cross_found$的一块。如果出售能维持屋顶，院长愿意悄悄出手。"
 relic_expedition_events.6.desc_saint_bones: "一位教区神父提供一个小骨匣，上面用褪色的拉丁文写着一个圣人的名字。他会把付款称为对教会的捐赠。"
 relic_expedition_events.6.desc_baptist_head: "该地区的一座教堂敬拜它所说的洗者若翰的头颅。这一说法从未超出教区范围，神职人员愿意讨论转让。"
 relic_expedition_events.6.desc_virgin_milk: "一个小圣龛保存着一小瓶密封的白色粉状残留物，几代人以来被尊为圣母玛利亚的乳汁。看守人愿意卖掉它，连同银质圣物箱一起。"
 relic_expedition_events.6.desc_holy_thorn: "一个次要贵族家庭拥有一个朴素圣物箱中的一根刺，据他们说，是从荆棘冠冕传给他们祖先的。他们希望任何出售都不被注意。"
 relic_expedition_events.6.desc_holy_chalice: "一位商人预料到不会被相信，并这么说了，然后提供一个普通石杯，他坚称是最后的晚餐的真正圣杯，无论别处更宏大的宣称者怎么说。他的价格不低。"
 relic_expedition_events.6.desc_titulus_crucis: "当地传说认为，当十字架的木头西去时，其上方的铭文板留在了后面并被藏起来。这里的一个家庭声称继承的正是这样一块板，并愿意出售。"
 relic_expedition_events.6.a: "讨价还价。要价很高，但有空间。"
 relic_expedition_events.6.b: "支付要价。有些东西值得这个价。"
 relic_expedition_events.6.c: "让我们的随从规模来代替说话。"
 relic_expedition_events.7.title: "敲定交易"
 relic_expedition_events.7.desc: "条款达成，圣物箱被布包裹。剩下的就是[target_leader.GetName]决定相信卖家的故事到什么程度。"
 relic_expedition_events.7.a: "付款，把圣物带回家。"
 relic_expedition_events.7.b: "有些东西不对劲。走开。"
 relic_expedition_events.8.title: "一位愿意合作的同谋"
 relic_expedition_events.8.desc_true_cross: "当地一位显贵家中的仆人，对他不愿解释的事情感到不满，提到他的主人保存着一块包裹着的深色木头碎片，他称之为$relic_true_cross_found$，在他的其他珍宝中不起眼。只要给钱，仆人愿意帮我们拿走它。"
 relic_expedition_events.8.desc_holy_lance: "一名被拖欠一年军饷的驻军士兵无意中透露，军械库里有一枚无人记得清点过的旧矛头。年长的人仍称它为$relic_holy_lance_found$。他能带我们进去。"
 relic_expedition_events.8.desc_holy_shroud: "一名修院门房，最近与院长发生了激烈争执，说修会保存着一块带图像的折叠布，除了资深弟兄外都锁着。他会留一扇门不闩。"
 relic_expedition_events.8.desc_holy_nail: "一名深陷债务的财务书记承认，一枚被尊为十字架钉子之一的旧铁钉放在侧库里未编目。他持有唯一的钥匙。"
 relic_expedition_events.8.desc_true_cross_fragment: "一名对自己的圣职不满的初学生提出，可以让他所在修会保存$relic_true_cross_found$碎片的小教堂的一扇百叶窗不关。"
 relic_expedition_events.8.desc_saint_bones: "一名为一生工作报酬过低的掘墓人知道教区保存圣人骨匣的地方，以及圣物管理员下午躺下休息的时间。"
 relic_expedition_events.8.desc_baptist_head: "一名多次晋品无望的低阶神职人员提出带我们去高级神职人员尊为存放洗者若翰头颅的圣物箱。"
 relic_expedition_events.8.desc_virgin_milk: "圣龛自己的看守人，在数十年低薪后暗自愤怒，会在自己选择的一个夜晚不锁圣物箱。"
 relic_expedition_events.8.desc_holy_thorn: "一名曾被解雇又勉强复职的管家确切知道家族把装有荆棘冠冕单根刺的圣物箱放在哪里。"
 relic_expedition_events.8.desc_holy_chalice: "一名主教座堂圣物管理员对他服务多年的神职们没有好话，并提出帮我们拿走他们私下称为最后的晚餐真正圣杯的外表普通的石杯。"
 relic_expedition_events.8.desc_titulus_crucis: "有个家族一直守着一个古老、连他们自己都半信半疑的传说，他们提出了完全不同的方案：帮他们从一个不肯把东西卖给他们的亲戚手里，拿回他们认定是真十字架铭文板的东西。"
 relic_expedition_events.8.a: "谨慎需要花钱。"
 relic_expedition_events.8.d: "不需要黄金。[target_leader.GetHerHis|U]自己的魅力就能确保他们的帮助。"
 relic_expedition_events.8.b: "不带钱进去。更少的报酬意味着更少的人说话。"
 relic_expedition_events.8.c: "不需要同谋。我们的随从可以直接拿走。"
 relic_expedition_events.9.title: "盗窃"
 relic_expedition_events.9.desc: "到目前为止计划奏效。本该看守的人睡着了，或者在别处，或者被收买视而不见，同谋承诺的门没有闩。[target_leader.GetName]在黑暗中等待可能意味着相反的喊声。"
 relic_expedition_events.9.a: "大功告成。圣物是我们的，无人知晓。"
 relic_expedition_events.9.b: "有人醒了。喊声，跑动的脚步。撤退！"
 relic_expedition_events.10.title: "学者的指引"
 relic_expedition_events.10.desc_true_cross: "一位读过所有哈丁编年史的旅行学者，从三份几乎偶然一致的记载中，锁定了据说撤退的骑士们埋葬$relic_true_cross_found$碎片的那片土地，以免它落入萨拉丁之手。他愿意拿出自己的笔记、磨损的地图，同时亲自带队前往。"
 relic_expedition_events.10.desc_holy_lance: "一位第一次十字军东征的学者相信，他从[GetCharacter('koj_petrus_bartholomaeus').GetName]本人的记述中，找到了1098年$relic_holy_lance_found$出土的地窖。他论证说，旁边的东西从未被完全找回。当时与之敌对的神职人员称这个想法异想天开，但没有人反驳它。"
 relic_expedition_events.10.desc_holy_shroud: "一位年迈的古物研究者半信半疑于一个他无法恰当溯源的谣言：一块带圣像的裹尸布被逃离袭击的修士砌进一个地下室，而那次袭击未见于任何编年史中。他几乎失明，想完成人生最后一次发现，愿意亲自带我们去那个地方。"
 relic_expedition_events.10.desc_holy_nail: "一位圣物学者指向一座半倒塌的小教堂，当地传统认为一名逃跑的牧师在士兵经过前埋下了一枚真十字架的钉子。"
 relic_expedition_events.10.desc_true_cross_fragment: "三卷修道院账册，从头读到尾，把一位学者带到一个匆忙废弃的隐修院，据说最后一位隐修士在逃命前把一块$relic_true_cross_found$放在小堂地板下。"
 relic_expedition_events.10.desc_saint_bones: "一位当地圣徒传作者从几乎变为碎屑的教区登记册中，确定了一座旧墓地边缘的无名坟墓：一位非著名的骨骸被藏起来，以免落入敌军之手。"
 relic_expedition_events.10.desc_baptist_head: "从修院档案中发现的一份残缺编年史中，一位学者论证说，一个被尊为存放洗者若翰头颅的圣物箱在一次旧围城期间被放在小堂地板下，之后那座小教堂就整个塌了，把它压在了底下。"
 relic_expedition_events.10.desc_virgin_milk: "一位学者引用一本没人费心去读的朝圣者日记，指向一个废弃圣龛中被墙封住的壁龛，据说看守人把一小瓶圣母乳汁藏在那里，以免落入劫掠者之手。"
 relic_expedition_events.10.desc_holy_thorn: "一位学者读遍了一个消亡家族的私人信件，将荆棘冠冕的一根刺追溯到他们的墓穴。自从家族绝嗣在那场瘟疫后，墓穴就一直封死着。"
 relic_expedition_events.10.desc_holy_chalice: "这里有一条与[ShowLocationName('genoa')]和[ShowLocationName('valencia')]著名宣称无关的圣杯传说线索。追随它的学者相信一个普通石杯躺在旧围城中被毁的小堂下，其会众在有人想到挖掘之前早已四散。"
 relic_expedition_events.10.desc_titulus_crucis: "当地传统认为真十字架的铭文板从未西去。一位认真看待这个传说的学者认为，它在十字军最后撤退时被封进了这里的一座小教堂的墙里，还主动提出帮忙找到那面墙。"
 relic_expedition_events.10.a: "雇用当地劳工。更多人手，更大成功几率。"
 relic_expedition_events.10.b: "用探险队自己的人挖掘。避免人多口杂。"
 relic_expedition_events.10.c: "不需要付钱给外人。我们自己的随从可以挖掘。"
 relic_expedition_events.11.title: "挖掘"
 relic_expedition_events.11.desc: "地面坚硬，挖掘缓慢。[target_leader.GetName]现在只能等待，看看学者是否能读懂地图。"
 relic_expedition_events.11.a: "铲子碰到了什么东西。就在学者说的地方。"
 relic_expedition_events.11.b: "只有泥土和瓦砾。地点已被清空。"
 relic_expedition_events.clues_up_1_tt: "线索愈发清晰（#G +1#!线索）"
 relic_expedition_events.clues_down_1_tt: "线索愈发渺茫（#R ‑1#!线索）"
 relic_expedition_events.retinue_up_10_tt: "探险队随从增加（#G +10#!随从）"
 relic_expedition_events.retinue_down_5_tt: "探险队随从减少（#R ‑5#!随从）"
 relic_expedition_events.retinue_down_8_tt: "探险队随从减少（#R ‑8#!随从）"
 relic_expedition_events.retinue_down_10_tt: "探险队随从减少（#R ‑10#!随从）"
 relic_expedition_events.retinue_down_15_tt: "探险队随从减少（#R ‑15#!随从）"
 relic_expedition_events.retinue_down_25_tt: "探险队随从减少（#R ‑25#!随从）"
 relic_expedition_events.relic_recovered_tt: "找回圣物并开始回家之旅"
 relic_expedition_announce_true_cross_tt: "每位天主教统治者都将得知$relic_true_cross_found$已被找到"
 relic_expedition_announce_holy_lance_tt: "每位天主教统治者都将得知$relic_holy_lance_found$已被找到"
 relic_expedition_announce_holy_shroud_tt: "每位天主教统治者都将得知$relic_holy_shroud_found$已被找到"
 relic_expedition_events.12.title: "对手寻宝者"
 relic_expedition_events.12.desc: "一位乐于收两份钱的酒馆老板给[target_leader.GetName]带来消息：一个敌对势力的密探一直坐在同样的房间里，为同样的码头工人买酒，打听把我们带到这里来的同一则传闻。他们比我们早一周上岸，此后花钱一直大手大脚。在这个镇上，沉默和合作都有价格，谁先出得起价钱，线索就归谁。"
 relic_expedition_events.12.a: "出价比他们能出的更高。王室会超过任何金额。"
 relic_expedition_events.12.b: "让他们追这条线索。春天会有别的人来。"
 relic_expedition_events.12.c: "在狭窄处等他们，在那里了结此事。"
 relic_expedition_events.13.title: "伪造者的作坊"
 relic_expedition_events.13.desc: "一名工匠被抓到向轻信的朝圣者出售圣人指骨，那是当天早上用羊肉雕刻并用茶染色的。被追问还骗过谁时，他反而发誓说他知道一些真东西，是在为作坊收集旧木头和更旧铁器时遇到的。他会说出地区，但在看到钱之前不会说出街道。伪造者的话值多少就是多少。"
 relic_expedition_events.13.a: "付钱给他所说的，但只付一次。"
 relic_expedition_events.13.b: "让随从逼他。恐惧比白银便宜。"
 relic_expedition_events.13.forger_honest_tt: "这一次，钱买到了真东西，伪造者的故事站得住脚"
 relic_expedition_events.13.forger_cheated_tt: "他命名的地区只有流言；伪造者因同一个谎言拿了两次钱"
 relic_expedition_events.13.threats_work_tt: "恐惧松开了白银无法松开的东西，伪造者交出了真东西"
 relic_expedition_events.13.threats_fail_tt: "他只是更大声地找借口；随从的威胁只换来瘀伤的指节"
 relic_expedition_events.14.title: "路上沙暴"
 relic_expedition_events.14.desc: "正午前后，地平线上升起一堵赭石色尘墙，一小时内吞没了道路。骆驼折起腿拒绝站起，沙砾钻进每一层布和每个水袋，向导承认他再也认不出标记道路的石堆。[target_leader.GetName]可以盲目前进，或者损失数天等风暴过去。"
 relic_expedition_events.14.a: "穿过它前进。道路不会离得太远。"
 relic_expedition_events.14.b: "压住帐篷，扎营，让它吹完。"
 relic_expedition_events.15.title: "热病来袭"
 relic_expedition_events.15.desc_land: "热病随水夫而来，几乎毫无预警地三三两两夺走人命：黎明头痛，正午颤抖，第二个早晨浅坟。队伍的两名医生已经无法帮助所有求助的人，健康的人开始睡在远离病人的地方。[target_leader.GetName]必须决定王室会花多少钱来控制它。"
 relic_expedition_events.15.desc_sea: "热病随上次在港口取的水上船，几乎毫无预警地三三两两夺走人命：黎明头痛，正午颤抖，第二个早晨尸体从栏杆滑下。队伍的两名医生在狭窄的船舱里已经无法帮助所有求助的人，健康的人开始尽可能睡在远离病人的甲板上。[target_leader.GetName]必须决定王室会花多少钱来控制它。"
 relic_expedition_events.15.a: "不惜代价治疗病人并隔离他们。"
 relic_expedition_events.15.b: "让它自然发展。热病很快就会烧尽。"
 relic_expedition_events.16.title: "沙漠强盗索贡"
 relic_expedition_events.16.desc: "武装人员排列在道路穿过两道山脊之间的地方，人数太多，秩序太好，不可能是普通的趁火打劫者。他们的首领骑马走到阵前，报出了一笔买平安通过的钱数，明明白白地表示，他早就掂量过动起手来自己要付出什么代价。"
 relic_expedition_events.16.a: "支付通行费，在他重新考虑价格前离开。"
 relic_expedition_events.16.b: "打过去。我们走到这里不是为了被抢。"
 relic_expedition_events.16.c: "让我们的数量说话。很少有人和这么多人争论。"
 relic_expedition_events.17.title: "朝圣者的谣言"
 relic_expedition_events.17.desc: "一队朝圣者与我们在驿站共度一夜，火边的话题一如既往转向圣物。其中一人，一个来自远方的羊毛商人之子，重复了他从死去二十年的叔叔那里半记得的故事：修士们从燃烧的房子中带出一个包裹，在海岸公路上过了一夜，完成了一场本不该有人看见的埋葬。他说不出房子的名字，但却奇怪地确定那条路。"
 relic_expedition_events.17.a: "给这人再买一杯，逼问每个细节。"
 relic_expedition_events.17.b: "千般故事中的又一个。我们黎明继续前进。"
 relic_expedition_events.17.tale_confirmed_tt: "一枚硬币让他松了口，溜出一个他可能不该分享的细节"
 relic_expedition_events.17.tale_fades_tt: "再喝一杯也无济于事；细节每次重述都更加模糊"
 relic_expedition_events.18.title: "资金短缺"
 relic_expedition_events.18.desc: "这个月汇兑行情很差，放贷人突然对给外国人借钱变得十分谨慎，让探险队的金库比预想中空缺了一大截。随从的薪水已经拖欠了两周，赶骡人要求用他们信得过的钱币结算，而不是我们的货币，一支欠账队伍的消息在这些城镇里传得比我们的任何打探都要快。"
 relic_expedition_events.18.a: "从王室自己的钱袋迅速补足缺口。"
 relic_expedition_events.18.b: "让他们的工资再拖欠一阵。他们别无去处。"
 relic_expedition_events.19.title: "引起地方当局注意"
 relic_expedition_events.19.desc_muslim: "当地#italic 噶最#!听说有外国人正在打探关于法兰克宝藏的尖锐问题，还打听那些王国覆灭时，哪些人家私藏了什么东西。他的秘书带着茶和客套话来拜访[target_leader.GetName]，在客气的措辞之下，传递的信息十分直白：这类打探只要让他的主人知情，再为清真寺的维护献上一笔合适的捐助，推进起来就会顺利得多。"
 relic_expedition_events.19.desc_christian: "当地[relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')]注意到，有一支外来队伍正在过于深入地打探他们认定只属于教会、和旁人无关的圣物。执事以各种礼节接待[target_leader.GetName]，相当冗长地谈到贪婪之罪，并毫不含糊地表示他持续的善意需要一份礼物放在祭坛上。"
 relic_expedition_events.19.desc_fallback: "探险队问题的谈话传到了本不该被惊动的人耳朵里。一个没人费心介绍的男人在天黑后来到寄宿处，未经邀请就坐了下来，并详细解释一支外国队伍在这样的镇子里能给自己惹上多少麻烦。警告不慌不忙，完全礼貌，且完全清楚。"
 relic_expedition_events.19.a: "支付必要的敬意，让合适的人看到。"
 relic_expedition_events.19.b: "无视警告，继续工作。时间已经够紧了。"
 relic_expedition_events.20.title: "真十字架寻回"
 relic_expedition_events.20.desc: "消息传到基督教世界的宫廷，[relic_finder.GetName]找回了$relic_true_cross_found$，这件圣物自哈丁灾难以来下落不明，如今被其保存在自己的宝库中。每个主教座堂的神职们都会想要自己关于它如何被找到的说法，而其中很少会同意它的合法性。"
 relic_expedition_events.20.a: "消息在基督教世界传播得很快。"
 relic_expedition_events.21.title: "圣枪重现"
 relic_expedition_events.21.desc: "信徒中传播消息，[relic_finder.GetName]找回了$relic_holy_lance_found$，自第一次十字军东征离开[ShowLocationName('antioch')]以来下落不明。不止一条朝圣路线将因此重绘。"
 relic_expedition_events.21.a: "又一件圣物找到了回家的路。"
 relic_expedition_events.22.title: "圣裹尸布被发现"
 relic_expedition_events.22.desc: "天主教欧洲流传报告，[relic_finder.GetName]获得了$relic_holy_shroud_found$，一块长期被谈论却从未被找到的布。怀疑者会怀疑，一如既往。信徒会无论如何踏上旅程。"
 relic_expedition_events.22.a: "让朝圣者自己判断。"
