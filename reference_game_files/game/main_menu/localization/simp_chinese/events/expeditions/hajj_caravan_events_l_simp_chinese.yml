l_simp_chinese:
 hajj_caravan_events.1.title: "前往[ShowLocationNameWithNoTooltip('mecca')]之路"
 hajj_caravan_events.1.desc: "队伍集结，祷词念毕，前往[ShowAreaName('hedjaz_area')]的漫长道路就此开始。人群夹道相送，证明这个家族仍然恪守信仰的义务。[ShowLocationName('mecca')]远在数月脚程之外，中间隔着会惩罚准备不足者的沙漠与开阔水域。"
 hajj_caravan_events.1.a: "我们的[ROOT.GetCountry.GetGovernment.GetRulerTitle]既是君主，也是[ROOT.GetCountry.GetReligion.GetGodName]的仆人。"
 hajj_caravan_events.1.b: "为队伍提供补给，并招募一支护卫队随行。"
 hajj_caravan_events.1.c: "为队伍备足物资，确保安全，并让#italic 朝觐轿#!行走在队伍最前方。"
 hajj_caravan_events.1.historical_info: "阿拔斯王朝的哈里发哈伦·拉希德在位期间（786–809年）曾九次从巴格达启程朝觐，甚至为了展现虔诚步行穿越部分路段。他的虔敬之举成为后世虔诚统治者竞相效仿的典范。"
 hajj_caravan_events.display_wealth: "公开携带#italic 朝觐轿#!，让所有人都能目睹我们[ROOT.GetCountry.GetFlavorRank]的财富。"
 hajj_caravan_events.guards_up_tt: "朝觐队伍的护卫增长（#G +25#!护卫）"
 hajj_caravan_events.guards_down_15_tt: "朝觐队伍的护卫减少（#R ‑15#!护卫）"
 hajj_caravan_events.guards_down_20_tt: "朝觐队伍的护卫减少（#R ‑20#!护卫）"
 hajj_caravan_events.splendor_up_15_tt: "朝觐队伍的辉煌增长（#G +15#!辉煌）"
 hajj_caravan_events.splendor_up_20_tt: "朝觐队伍的辉煌增长（#G +20#!辉煌）"
 hajj_caravan_events.splendor_up_30_tt: "朝觐队伍的辉煌增长（#G +30#!辉煌）"
 hajj_caravan_events.splendor_down_10_tt: "朝觐队伍的辉煌减少（#R ‑10#!辉煌）"
 hajj_caravan_events.splendor_down_15_tt: "朝觐队伍的辉煌减少（#R ‑15#!辉煌）"
 hajj_caravan_events.splendor_down_20_tt: "朝觐队伍的辉煌减少（#R ‑20#!辉煌）"
 hajj_caravan_events.splendor_down_25_tt: "朝觐队伍的辉煌减少（#R ‑25#!辉煌）"
 hajj_caravan_events.weakened_tt: "朝觐队伍被迫一刻不停地赶路，已然虚弱不堪，难以应对前方仍待承受的考验"
 hajj_caravan_events.recovered_tt: "朝觐队伍得到休息和饮水，摆脱了疲惫"
 hajj_caravan_events.mahmal_lost_tt: "朝觐轿在风暴中丢失"
 hajj_caravan_events.mahmal_gained_tt: "朝觐队伍现在携带朝觐轿，可以在沿途向外国东道主展示财富，尽管它可能被袭击者或风暴夺走"
 hajj_caravan_events.2.title: "[ShowLocationNameWithNoTooltip('mecca')]之门"
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]。这座古老的港口[jeddah_location.GetRank.GetName|l]散发着[ShowGoodsName('salt')]、[ShowGoodsName('incense')]的气味，以及比我们先一步从海路抵达的一万名朝圣者的汗味。商人们以翻倍的价格兜售补给，学者们则争论着仪式的正确顺序。[ShowLocationName('mecca')]已经近了，走陆路不到三天，但队伍已疲惫不堪，补给也所剩无几。我们可以继续赶路，也可以先在这里休息一天、补充物资。"
 hajj_caravan_events.2.a: "在这里休息，然后精神饱满地进入圣城。"
 hajj_caravan_events.2.b: "我们已经走得太远，现在不能停下。继续前往[ShowLocationNameWithNoTooltip('mecca')]。"
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "哈里发奥斯曼·伊本·阿凡，正统哈里发中的第三位，于646年指定吉达为经海路抵达的朝觐者的官方入境港口，此后，该城便一直承担着朝觐交通的这一角色。"
 hajj_caravan_events.3.title: "克尔白"
 hajj_caravan_events.3.desc: "大清真寺在我们面前敞开，克尔白矗立于其中心，覆盖着黑色帷幔，古老得超越记忆。周围，身披白袍的信众耐心地绕行，成千上万，来自每一个能听到宣礼声的地方。在这里，苏丹与牧羊人衣着无异。旅程结束了。现在的问题在于，我们将成为何种朝圣者。此地所奉献的一切，将在此后一代人的时间里，回响于穆斯林世界的集市、清真寺与宫廷之中。"
 hajj_caravan_events.3.a: "分发黄金。不要让这里任何朝圣者挨饿。"
 hajj_caravan_events.3.b: "资助清真寺和守护圣城的学者。"
 hajj_caravan_events.3.c: "安静地履行仪式。这是我们与[ROOT.GetCountry.GetReligion.GetGodName]之间的事。"
 hajj_caravan_events.3.d: "我们的[ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')]已经准备好了一切。"
 hajj_caravan_events.3.e: "无需吝惜钱财。用黄金和丝绸装饰朝觐队伍。"
 hajj_caravan_events.3.historical_info: "历史上最著名的皇家朝觐，是马里帝国的曼萨·穆萨一世于1324年进行的那次。他这次的朝觐有六万人随行，携带的黄金足以在每个停留地随意施舍，导致北非和中东的金价暴跌长达十年。他造访埃及苏丹宫廷一事，被阿拉伯编年史家广泛记载，他们既记录了他非凡的慷慨，也记录了他造成的经济动荡。"
 hajj_caravan_events.4.title: "千塔之城"
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')]辽阔而古老，我们一穿过北门，它便将整支队伍吞没——喧嚣、香料、鞣制皮革、烤肉的气味。屋顶之上，爱资哈尔大清真寺巍然耸立，其学者被公认为[ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]世界中最优秀学者之列。我们的统治者可以留下来师从他们研习，或者只是补充给养，继续向[ShowLocationName('mecca')]进发。"
 hajj_caravan_events.4.a: "趁此机会与爱资哈尔的学者们坐下论道。"
 hajj_caravan_events.4.b: "我们来是为了[ShowLocationNameWithNoTooltip('mecca')]，不是[ShowLocationNameWithNoTooltip('cairo')]。补充完补给就走。"
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "历史学家和学者伊本·赫勒敦于1382年定居开罗，在爱资哈尔任教，并担任该城的马立克派首席法官。他的声望吸引了来自穆斯林世界各地的统治者和学者，他们渴望旁听他的讲座，或向他寻求建议。"
 hajj_caravan_events.5.title: "旧都"
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')]曾是世界上最伟大的城市，一个从[ShowContinentName('atlantic_ocean_continent')]一直延伸到[ShowSubContinentName('central_asia')]的哈里发国的首都，直到蒙古人将它夷为平地。如今留存下来的它更为安静——市场更小，学者也不再那么热忱——但城中那些圣徒的陵墓仍然吸引着来自东方的朝圣者，我们的统治者可以在此凭吊，然后再南下前往[ShowAreaName('hedjaz_area')]。"
 hajj_caravan_events.5.a: "参观圣陵，寻找他们的学者。"
 hajj_caravan_events.5.b: "表达敬意，然后继续旅程。"
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "祖拜达·宾特·贾法尔，阿拔斯王朝哈里发哈伦·拉希德的妻子，在亲身目睹了朝圣之路的艰辛之后，出资修建了祖拜达之路——一条从巴格达附近一直延伸到麦加的朝圣道路，沿途设有水井、蓄水池和驿站。"
 hajj_caravan_events.6.title: "大马士革的停留"
 hajj_caravan_events.6.desc: "果园渐渐退去，[ShowLocationName('damascus')]的城墙映入眼帘——那是现存最古老的城市之一，其大清真寺在整个信仰世界都享有盛名。在其穹顶下祈祷，与挤满庭院的法学家们坐而论道，会耗费我们或许并不拥有的数日时光；朝觐队伍也完全可以只补给饮水和物资，天亮前便离去。"
 hajj_caravan_events.6.a: "在清真寺和法学家那儿逗留一会儿。"
 hajj_caravan_events.6.b: "给牲畜饮水，黎明前离开。"
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "16世纪50年代，奥斯曼苏丹苏莱曼大帝下令在大马士革修建苏莱曼尼耶建筑群，其中包括一座清真寺、一所客栈和一处施粥所，专门用于接待和供养每年在朝觐队伍启程前往麦加之前聚集于此的数千名朝圣者。"
 hajj_caravan_events.7.title: "朝觐者"
 hajj_caravan_events.7.desc: "朝觐队伍回到家乡，行囊更轻了，朝觐者却已脱胎换骨。消息早已比骆驼先一步传回，人群聚集而来，迎接这位曾在克尔白前站立，又活着归来讲述此行的统治者。自今日起，我们的统治者便拥有“哈吉”之称——并非授予，而是挣得，且永远属于其本人。"
 hajj_caravan_events.7.a: "让世人知道：承[ROOT.GetCountry.GetReligion.GetGodName]恩典，前往[ShowLocationNameWithNoTooltip('mecca')]并返回。"
 hajj_caravan_events.7.historical_info: "桑海帝国的阿斯基亚·穆罕默德·图雷于1496至1497年进行朝觐，随行数百人，并携带巨额黄金，沿途施舍济贫。在开罗，一位自称阿拔斯王朝哈里发的人授予他“苏丹之地哈里发”的称号；他回国时已获得“哈吉”之称，其对西非伊斯兰教的权威也因这次朝觐而得到确认。"
 hajj_caravan_events.8.title: "在前往[ShowLocationNameWithNoTooltip('mecca')]的路上死亡"
 hajj_caravan_events.8.desc: "消息传到朝觐队伍：我们的统治者已在途中去世，远离家乡，更远离克尔白。没有了领头的君主，队伍再也无法照旧前行。它就此解散——一些朝觐者折返回头，另一些则独自继续向前，去完成他们此行为之而来的仪式。"
 hajj_caravan_events.8.a: "愿[ROOT.GetCountry.GetReligion.GetGodName]怜悯他们的灵魂。"
 hajj_caravan_events.hire_escorts: "为前路雇用更多护卫。"
 hajj_caravan_events.adorn: "用旗帜和丝绸装饰商队，然后等待。"
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.9.title: "路上的袭击者"
 hajj_caravan_events.9.desc: "他们从热浪中现身，沙漠骑手举着长矛，绕着队伍打转。他们看着我们穿过他们的沙地，判定这支朝觐队伍值得一劫。我们的护卫收紧阵型，但在开阔的沙漠中交战，从来都没有必胜的把握。"
 hajj_caravan_events.9.a: "交钱保命。白银比鲜血便宜。"
 hajj_caravan_events.9.b: "让护卫证明自己值这份钱。"
 hajj_caravan_events.9.b.chance_tt: "我们的护卫可能无法击退袭击者，损失护卫和辉煌，而不是[prestige|e]"
 hajj_caravan_events.9.c: "这些是前往[ShowLocationNameWithNoTooltip('mecca')]的朝圣者，由[ROOT.GetCountry.GetReligion.GetGodName]庇护。"
 hajj_caravan_events.9.c.chance_tt: "呼吁可能无法让袭击者离开，损失护卫和辉煌，而不是[prestige|e]和[legitimacy|e]"
 hajj_caravan_events.10.title: "干涸的水井"
 hajj_caravan_events.10.desc: "前方的水井空空如也——井底只剩干裂的泥，几天前经过的某个商队将水喝得一滴不剩。挂在骆驼两侧的水袋已经干瘪，牲畜因干渴而低鸣，太阳无情地越爬越高。向导们开始嘀咕下一处好水源还有多远。"
 hajj_caravan_events.10.a: "慢一点总比没命强。改道去远处那口井。"
 hajj_caravan_events.10.b: "下一处水源就行。继续走。"
 hajj_caravan_events.11.title: "西蒙风"
 hajj_caravan_events.11.desc: "地平线化为铁锈色，风声尖啸而起。一道沙墙朝队伍滚滚压来，转眼之间，道路没了，天空没了，前方的骑手也没了——只剩刺痛的黑暗。"
 hajj_caravan_events.11.a: "卸下驮包，蒙上面巾。我们等它过去。"
 hajj_caravan_events.11.b: "把队伍用绳索连起来，顶着风前进。"
 hajj_caravan_events.12.title: "队伍中的热病"
 hajj_caravan_events.12.desc: "起初只有几例，但到清晨每顶帐篷里都已出现：一种短短几天就能掏空最强壮之人的热病。朝觐者们在路上挤作一团，根本无从躲避。"
 hajj_caravan_events.12.a: "我们停下。绝不让任何朝觐者被抛弃等死。"
 hajj_caravan_events.12.b: "季节不会等待病人。"
 hajj_caravan_events.13.title: "[toll_owner.GetGovernment.GetRulerTitle]的价码"
 hajj_caravan_events.13.desc: "前方的道路穿过一位当地领主的土地，他的骑手横马挡在路中，长矛不慌不忙地杵在地上。他的传令官笑着出来：水要收费，过路要收费，就连我们脚下的沙子也要收费，不付清，队伍就休想再往前挪一步。在我们身后，朝觐者在酷热中等待着，想看看他们的君主究竟有多大能耐。"
 hajj_caravan_events.13.a: "拿钱了结此事。"
 hajj_caravan_events.13.b: "我们不欠他什么。绕过他的水井。"
 hajj_caravan_events.13.c: "让[toll_owner.GetGovernment.GetRulerTitle]看看我们的队伍，重新考虑收费。"
 hajj_caravan_events.14.title: "绿洲停留"
 hajj_caravan_events.14.desc: "前方沙地中升起一片棕榈树，树下有一眼泉水，周围有人出来用椰枣和清凉的泉水招待朝圣者。接待那些前往圣城的人，本身就是一种虔诚之举，而且分文不取。"
 hajj_caravan_events.14.a: "让队伍充分休息和饮水，然后继续前行。"
 hajj_caravan_events.14.b: "与绿洲穷人分享我们的给养。"
 hajj_caravan_events.14.c: "感谢他们，继续赶路。"
 hajj_caravan_events.15.title: "路上的学者"
 hajj_caravan_events.15.desc: "一群旅行学者加入朝觐队伍，前往同一座圣城，他们的鞍袋里装满书籍。在晚间的火堆旁，他们谈论法律和经文直到深夜。"
 hajj_caravan_events.15.a: "坐在他们中间倾听。"
 hajj_caravan_events.15.b: "与他们唇枪舌剑。"
 hajj_caravan_events.16.title: "季节已过"
 hajj_caravan_events.16.desc: "我们到得太晚了。年份已经转换，我们错过了进驻阿拉法特山的时刻——从正午到日落之间的那几个小时，当季每位朝觐者都应一起站在仁慈山下的那片平原上，祈祷并请求宽恕。先知有言，朝觐无非就是那一个下午；一旦错过，此后举行任何仪式都无法补全这次朝觐。队伍别无他法，只能解散返乡，明年从头再来一遍。"
 hajj_caravan_events.16.a: "我们耽搁得太久了。必须再走一遍。"
 hajj_caravan_events.17.title: "风暴"
 hajj_caravan_events.17.desc: "天空变黑，大海隆起灰色的水山。船身剧烈颠簸，索具尖声嘶鸣，一个浪头不对就可能撞破船体或把船和船上每一个人拖入水底。"
 hajj_caravan_events.17.a: "抓紧。造船匠把她造得够结实。"
 hajj_caravan_events.17.b: "让她顺风跑。"
 hajj_caravan_events.18.title: "无风"
 hajj_caravan_events.18.desc: "风完全停了。帆松弛地挂着，海面平滑如锻打过的金属，船在无情的烈日下纹丝不动。无风的日子一天天过去，淡水越来越少，脾气越来越火爆。"
 hajj_caravan_events.18.a: "等待。风总会回来。"
 hajj_caravan_events.18.b: "放下小船。我们不会坐着腐烂。"
 hajj_caravan_events.19.title: "甲板下的热病"
 hajj_caravan_events.19.desc: "一种疾病在甲板下封闭污浊的空气中蔓延，不出几日，病倒的人已多过健康的人。船仍需照常运转，而每一次黎明降临，能操船的人手便越来越少。"
 hajj_caravan_events.19.a: "驶向海岸。船员必须有干净的水。"
 hajj_caravan_events.19.b: "保持航向，相信他们能撑住。"
 hajj_caravan_events.20.title: "海盗"
 hajj_caravan_events.20.desc: "一艘低矮、迅捷的桨帆船向舰队驶来，后面还跟着两艘，桨在阳光下闪闪发亮。没有旗帜，没有招呼，只有船舷上刀锋的寒光和一阵越来越急的鼓点传过水面。是海盗——他们已经把朝觐者当成了猎物。瞭望员发出警报，甲板之下，信徒抓紧他们的包裹，不住祈祷。"
 hajj_caravan_events.20.a: "花钱买路。"
 hajj_caravan_events.20.b: "清空甲板。我们杀过去。"
 hajj_caravan_events.20.b.chance_tt: "我们的护卫可能无法击退海盗，损失护卫和辉煌，而不是[prestige|e]"
 hajj_caravan_events.21.title: "暗礁"
 hajj_caravan_events.21.desc: "一阵摩擦的震颤沿船身传来，甲板在脚下倾斜——一处未标注的暗礁，珊瑚的利齿正刮擦着水线以下的船板。海水已经咕噜咕噜涌入货舱，船员扑向水泵。船身破了洞，正在下沉，但尚未沉没，而最近的陆地，不过是地平线上一抹低矮的绿色。"
 hajj_caravan_events.21.a: "把船在海滩搁浅，好好修理她。"
 hajj_caravan_events.21.b: "留一队人救她。其余继续航行。"
 hajj_caravan_events.22.title: "海上商人"
 hajj_caravan_events.22.desc: "一艘商船在水上向我们招呼，甲板上堆满来自遥远港口的丝绸和精美布匹。船长愿意按行价交易，但前提是得先来一番商人那种不紧不慢的讨价还价。"
 hajj_caravan_events.22.a: "购买船上最好的布料。"
 hajj_caravan_events.22.b: "没时间讨价还价。挥手让他们走。"
