l_simp_chinese:
 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "舰队启航"
 cape_route_to_india_events.1.desc: "我们的水域已经有一代人未曾见过这样的舰队。四艘船，一百七十人，足够数年之用的[ShowGoodsName('salt')]、[ShowGoodsName('fish')]和硬饼干——以及来自[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]的命令，去寻找通往$india$的海路。神父们为船体祝福。人群挤到水边。有些人在哭泣。\n\n[target_leader.GetName]站在船首，船只越过沙洲，驶入开阔的[ShowContinentName('atlantic_ocean_continent')]。在[target_leader.GetHerHim]身后，港口缩小为绿色山丘上的一抹白痕。在[target_leader.GetHerHim]面前，海洋向四面八方无边无际地延伸。[target_leader.GetSheHe|U]已经做了计算。[target_leader.GetSheHe|U]知道这次航行需要什么。这是否足够，一如既往，掌握在[ROOT.GetCountry.GetReligion.GetGodName]手中。"
 cape_route_to_india_events.1.a: "[ROOT.GetCountry.GetReligion.GetGodName|U]保佑，我们将满载香料归来。"
 cape_route_to_india_events.1.b: "让我们祈祷——然后全速航行。"
 cape_route_to_india_events.1.historical_info: "葡萄牙寻找通往$india$海路的探险是近一个世纪沿非洲海岸逐步南下探索的顶峰。巴尔托洛梅乌·迪亚士于1488年绕过了好望角，证明这条路线是可能的。瓦斯科·达·伽马于1497—1499年的航行完成了这一使命，带回的胡椒和香料足以支付探险费用的六十倍。这次航行从根本上改变了全球香料贸易，打破了威尼斯和奥斯曼对陆路路线的垄断。"
 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "[ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]群岛"
 cape_route_to_india_events.2.desc: "十座火山岛从平坦无特征的海面升起：这就是[ShowProvinceDefinitionName('cape_verde_province')]群岛。舰队知道会看到它们，但它们仍然带来宽慰——在茫茫大洋航行数周后能踏上的坚实陆地。[ShowLocationName('santiago')]的总督住所是一座刷着白灰的朴素石屋。港口弥漫着盐和干鱼的气味，还有一丝从岩石上刮下来用于制作染料的紫地衣的气味。\n\n[target_leader.GetName]权衡着选择。[ROOT.GetCountry.GetName]已拥有这些岛屿数十年，但“拥有”是个宽容的说法——一小支驻军，几个定居者，一艘年度补给船。如果这条路线要对[ROOT.GetCountry.GetNameWithNoTooltip]的未来有意义，这些岛屿就不能仅仅是一个休息站。"
 cape_route_to_india_events.2.a: "在这里投资，扩建守卫我们南方路线的哨站。"
 cape_route_to_india_events.2.b: "补充补给，取淡水，继续航行。"
 cape_route_to_india_events.2.c: "继续前进——我们不能这么早就耽搁。"
 cape_route_to_india_events.2.d: "回家。"
 cape_route_to_india_events.2.historical_info: "佛得角群岛由葡萄牙航海家于约1456年发现，自1462年起永久定居。由于它们在大西洋中的位置——正处于东北信风带——它们成为前往南美洲和绕过非洲的航行的重要中转站。在瓦斯科·达·伽马的航行证明印度洋航线可行后，它们的战略重要性大幅提升。到16世纪，它们已成为大西洋奴隶贸易的重要枢纽。"
 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "[ShowLocationNameWithNoTooltip('sao_tome')]岛"
 cape_route_to_india_events.3.desc_common: "炎热在海岸线之前就宣告了自己的到来：一道潮湿、令人窒息的热墙，在舰队越过赤道的那一刻就笼罩在甲板上，让人们在从未变凉过的空气中喘息。[ShowLocationName('sao_tome')]从晨雾中升起，像一顶深绿色的王冠，两座山峰拖着云，瀑布穿过茂密的森林倾泻而下，那树林是如此茂密，光线都无法照射到地面。"
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\n一处小定居点紧贴西岸。定居者说，这里的土壤异常肥沃。种什么长什么。一个人可以在这个岛上靠糖发财，只要他有劳动力来耕作。"
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\n任何海岸都没有炊烟升起。任何海湾都没有船只等待。这个岛完全没有人——舰队的船只是最先触碰这片海滩的。然而，在丛林被砍开的地方，土壤又黑又深，无比肥沃。一个人可以在这样的岛上靠糖发财，只要他有劳动力来耕作——只要赤道的热病不先夺走他的性命。"
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\n西岸已经有一处定居点紧贴海岸，悬挂着一面不属于我们的旗帜——码头、一座小教堂、先于[ROOT.GetCountry.GetName]抵达这座肥沃岛屿的[rival_owner.GetAdjective]定居者开垦的第一批原始甘蔗田。土壤确如传闻所许诺的那样肥沃，但已经名花有主。我们无论想从[ShowLocationNameWithNoTooltip('sao_tome')]获取什么，现在都只能从[rival_owner.GetNameWithNoTooltip]手中夺取，或与其商讨条件。"
 cape_route_to_india_events.3.a: "建立一座贸易站；这个岛的潜力值得这么做。"
 cape_route_to_india_events.3.a.owned: "进一步投资该岛——[ShowLocationNameWithNoTooltip('sao_tome')]已经听命于我们的旗帜。"
 cape_route_to_india_events.3.b: "立一根#italic 发现柱#!，为王室宣称该岛。"
 cape_route_to_india_events.3.c: "取淡水，向南航行。"
 cape_route_to_india_events.3.d: "回家。"
 cape_route_to_india_events.3.historical_info: "圣多美在葡萄牙航海家于约1470年到达时无人居住。其赤道气候对欧洲定居者而言极为致命——疾病死亡率很高——但非常适合种植甘蔗。到1520年代，圣多美已成为世界上最大的甘蔗生产地，几乎完全依靠被奴役的非洲人耕作。该岛后来成为大西洋奴隶贸易的主要转运点，这一角色持续了两个多世纪。"
 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "大河之口"
 cape_route_to_india_events.4.desc: "这里的海水变成了棕色。舰队已经观察了一天——颜色从南方渗入海中，茶色般深浓，饱含泥沙。然后他们看到了原因：一条比[ROOT.GetCountry.GetName]任何河流都宽，比这些人见过的任何河流都宽的河流，以棕色洪流注入[ShowContinentName('atlantic_ocean_continent')]，将海洋染污数公里。\n\n独木舟从红树林边缘出现了。它们巨大无比——由单根树干挖空，三十英尺长，由十几个人整齐划一地划桨。站在船头的人没有武装。他们带着一种从容的好奇注视着舰队，那是从未害怕过陌生人的人才有的神情。"
 cape_route_to_india_events.4.a: "寻求与这片土地的[target_owner.Custom('GetRulerOrRegentTitle')]会面。"
 cape_route_to_india_events.4.b: "交易[ShowGoodsNameWithNoTooltip('ivory')]、[ShowGoodsNameWithNoTooltip('copper')]以及他们提供的任何东西。"
 cape_route_to_india_events.4.c: "绘制河口海图，继续南下；我们不能耽搁。"
 cape_route_to_india_events.4.d: "回家。"
 cape_route_to_india_events.4.historical_info: "刚果王国是撒哈拉以南非洲最复杂的政治实体之一，控制着横跨现代刚果、安哥拉和加蓬大部分地区的领土。马尼刚果（国王）通过一套等级官僚体系统治，并维持着复杂的省级治理制度。葡萄牙传教士于1480年代与该王国接触，开始了一段对双方都具有变革性——最终是灾难性——的关系。该王国于1490年代皈依基督教，马尼刚果取教名为若昂一世。"
 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "[ShowLocationNameWithNoTooltip('luanda')]湾"
 cape_route_to_india_events.5.desc: "探险队的每位军官一看到这里就认了出来。没有水手在非洲海岸的任何地方见过这样的港口：一个长长的弯曲海湾，被天然沙嘴从西南方遮蔽，深水靠近海岸，后面是一个低矮的海角，四面八方视野开阔。当地渔民称它为洛安达——平坦之地。\n\n[target_leader.GetName]在午后的光线中走过沙嘴的长度，一边是海湾，另一边是开阔的[ShowContinentName('atlantic_ocean_continent')]。[target_leader.GetSheHe|U]已经在盘算城墙、淡水，盘算这里的驻军能保护——或者拦截——多少艘船。在这里建一座城镇可以控制整个南大西洋贸易。"
 cape_route_to_india_events.5.desc.owned: "舰队驶入一处一眼便可知其价值的海湾：[ShowLocationName('luanda')]已经飘扬着[ROOT.GetCountry.GetName]的旗帜，其长长的沙嘴庇护着听命于我们王冠的船只。\n\n[target_leader.GetName]在午后的光线中走完整条沙嘴，一侧是海湾，另一侧是开阔的[ShowContinentName('atlantic_ocean_continent')]——心里想的不是要不要夺取这片土地，而是它还能产出多少。若进一步加强，这里的城镇便能控制整个南大西洋贸易。"
 cape_route_to_india_events.5.a: "在这里建造一座大型[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]——无与伦比。"
 cape_route_to_india_events.5.a.owned: "扩建我们在[ShowLocationNameWithNoTooltip('luanda')]的伟大商站——此海岸无与伦比。"
 cape_route_to_india_events.5.b: "建立一个小型贸易站和一个补给站。"
 cape_route_to_india_events.5.b.owned: "扩大我们已在此持有的贸易站和补给站。"
 cape_route_to_india_events.5.c: "在海图上标记其位置，继续南下。"
 cape_route_to_india_events.5.d: "回家。"
 cape_route_to_india_events.5.historical_info: "罗安达于1575年在保罗·迪亚士·德·诺瓦伊斯领导下正式成为葡萄牙殖民地，是撒哈拉以南非洲最古老的欧洲定居点之一。其天然港口使它成为葡属安哥拉的主要港口长达四个多世纪。从16世纪起，罗安达成为南部非洲跨大西洋奴隶贸易的主要启运点，将数百万被奴役者运往巴西和加勒比地区。"
 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "沙漠海岸"
 cape_route_to_india_events.6.desc: "沙漠在这里一直延伸到海边，红色沙丘直接从浪线升起，丘脊将沙子吹向空中。没有树木。看不到淡水。从北方的海岸——人们已经称它为[ShowLocationName('skeleton_coast')]，因为海滩上晒白的鲸骨——向任何方向延伸数百英里都不见有人类居住的迹象。\n\n然而海湾是平静的。它挡住了最凶猛的涌浪，为舰队提供了修理受损桅杆和从沙丘中微咸的泉眼中补充淡水的机会。在上面的海角上，船上的领航员正用仪器测量太阳高度角并做记录。他说，向南航行不超过一周就能到非洲南端的海角了。一些人在胸前划起了十字。"
 cape_route_to_india_events.6.a: "鼓舞士气：南端海角终于触手可及。前进！"
 cape_route_to_india_events.6.b: "这些洋流和风在说话；让我读懂它们。"
 cape_route_to_india_events.6.c: "让船员们休息；他们需要力量应对前方的风暴。"
 cape_route_to_india_events.6.d: "回家——这海岸太荒凉，无法继续推进。"
 cape_route_to_india_events.6.historical_info: "纳米比亚海岸被葡萄牙水手称为#italic 骷髅海岸#!，因为这里存在大量鲸骨和海豹骨，也因为被强劲的西南风吹到下风岸失事的船只残骸。鲸湾——名称来自于荷兰语#italic 鲸鱼湾#!——是这条充满危险的海岸线上少数几个避风锚地之一。巴尔托洛梅乌·迪亚士在1488年南航途中曾在此停靠。"
 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "风暴角"
 cape_route_to_india_events.7.desc: "三个月航行中的任何经历，都不足以让他们为这一刻做好准备。风暴毫无预兆地从西南方袭来，驱赶着高达四十英尺的巨浪。领头的船消失在一个波谷中，三十秒后才重新出现。索具被冲走。有人从帆索上被打落。[target_leader.GetName]双手紧抓船尾栏杆，盯着[target_leader.GetHerHim]周围的混乱，在狂风与碎浪交织的嘈杂声中，[target_leader.GetSheHe]明白了某件事：他们通过了。那个海角——非洲大陆的伟大南端，已知世界的尽头——已在船尾。\n\n通往$india$的航路已经打开。"
 cape_route_to_india_events.7.a: "将其命名为好望角，立即向东航行！"
 cape_route_to_india_events.7.b: "在海角的背风处避风，直到风暴过去。"
 cape_route_to_india_events.7.d: "我们已经做得够多了；南端海角已绕过。返航。"
 cape_route_to_india_events.7.historical_info: "巴尔托洛梅乌·迪亚士于1488年首次绕过非洲南端的海角，将其命名为#italic 风暴角#!。根据葡萄牙史料，若昂二世国王将其改名为#italic 好望角#!以鼓励未来的探险，不过这一说法可能是杜撰的。好望角并非非洲最南端——这一殊荣属于更东方约两百公里的厄加勒斯角——但它标志着大西洋和印度洋的交汇点，以及通往东方的大门。"
 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "牧牛人之湾"
 cape_route_to_india_events.8.desc: "海湾平静而美丽，西南方有一座低矮的海角为它挡风。沿岸的乳木树投下宜人的荫凉。在海滩上方的山坡上——是牛群。肥壮健康的牛群成群结队地吃草，由一些身材高大，佩戴赭石和玻璃珠的人照料，自舰队下锚以来，他们一直在安全距离外注视着。\n\n一些人看到鲜肉，几乎要落下泪来。他们已经靠咸鱼和硬饼干生活了好几周。最终，一名牧人走到水边，站在那里望着；直到舰队船长爬上一艘长艇，划过去与他相见。双方进行了一场交易，涉及[ShowGoodsName('copper')]环、干鱼以及大量耐心的手势。到夜幕降临时，三头牛已进了货舱。那低沉的牛叫声，对舰队上的每一个人来说，都是他们听过的最美的声音。"
 cape_route_to_india_events.8.a: "用[ShowGoodsNameWithNoTooltip('copper')]、[ShowGoodsNameWithNoTooltip('cloth')]换取牛；立一根#italic 发现柱#!。"
 cape_route_to_india_events.8.a.morale_tt: "船员士气大幅上升（#G +15#!船员士气）"
 cape_route_to_india_events.8.b: "升起一根#italic 发现柱#!，为[ROOT.GetCountry.GetNameWithNoTooltip]宣称这片土地。"
 cape_route_to_india_events.8.b.morale_tt: "船员士气略微上升（#G +8#!船员士气）"
 cape_route_to_india_events.8.c: "让船员们在这里休息恢复，然后我们再向北推进。"
 cape_route_to_india_events.8.c.morale_tt: "船员士气明显上升（#G +10#!船员士气）"
 cape_route_to_india_events.8.d: "回家。"
 cape_route_to_india_events.8.historical_info: "莫塞尔湾被葡萄牙水手称为#italic 牧牛人之湾#!或后来的#italic 圣布莱斯取水处#!。巴尔托洛梅乌·迪亚士于1488年在此竖立了一根石制#italic 发现柱#!，瓦斯科·达·伽马在1497年延续了这一传统。土著科伊科伊人最初愿意与两次探险队交易，但后来变得敌对——瓦斯科·达·伽马的人没有给够报酬就试图取水，结果被扔了石头。"
 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "[ShowLocationNameWithNoTooltip('sofala')]黄金港"
 cape_route_to_india_events.9.desc: "[ShowLocationName('sofala')]的港口挤满了三角帆船。这些不是舰队在南方海岸已经看惯的小渔船；它们是来自[ShowRegionName('arabia_region')]和[ShowRegionName('persia_region')]的远洋船只，满载着[ShowGoodsName('ivory')]、乌木和[ShowGoodsName('cloth')]，吃水很深。在滨水区，商人用[ShowLanguageName('arabic_language')]和[location.GetDominantCulture.GetLanguage.GetName]做生意，后者是一种舰队所有翻译都无法辨识的语言。一小撮金粉换来了一匹匹印度棉布。\n\n主导这个港口已有数世纪的阿拉伯商人从他们仓库的遮阳篷下注视着[ROOT.GetCountry.GetAdjective]舰队的到来。他们的表情难以捉摸，但肢体语言不会错：这些带着铁炮，船帆上画着十字架的陌生人出现，可不是什么受欢迎的发展。舰队船长记下了最大的几座仓库、三角帆船停泊的位置、海湾入口的水深。"
 cape_route_to_india_events.9.a: "建造一座大型[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]；这些黄金将让[ROOT.GetCountry.GetNameWithNoTooltip]变富。"
 cape_route_to_india_events.9.a.owned: "向我们在[ShowLocationNameWithNoTooltip('sofala')]的商站投入资金——这些黄金将让[ROOT.GetCountry.GetNameWithNoTooltip]变富。"
 cape_route_to_india_events.9.b: "交易金粉，了解内陆有什么。"
 cape_route_to_india_events.9.c: "收集情报，继续前进——时间宝贵。"
 cape_route_to_india_events.9.d: "回家。"
 cape_route_to_india_events.9.historical_info: "索法拉是斯瓦希里贸易网络里最靠南的重要港口，掌控着通往西部高原上产金的#italic 穆塔帕#!王国（大津巴布韦）的通道。阿拉伯商人至少从十世纪起就在这里经营。葡萄牙人1505年占领索法拉，摧毁了阿拉伯人的贸易网络，试图把黄金贸易转到自己的渠道里——结果成败参半，大量贸易直接转移到了他们势力范围之外的内陆。"
 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "[ShowLocationNameWithNoTooltip('mozambique')]岛"
 cape_route_to_india_events.10.desc: "一个小岛，从头到尾不超过三公里，与大陆之间隔着一条深度刚够远洋船只通行的狭窄水道。岛上最显眼的是一座飘扬着绿旗的石砌贸易站，港口挤满了来自[ShowContinentName('indian_ocean_continent')]各个角落的三角帆船。[ShowGoodsName('ivory')]和乌木从内陆流下，被奴役的男女从大陆被驱赶而来，[ShowGoodsName('copper')]从南方运来，[ShowGoodsName('cloth')]和[ShowGoodsName('porcelain')]从$india$和$china$到达——所有这些都在一个已经运行了六个世纪的贸易网络中转手。\n\n[target_ruler_country.Custom('GetRulerOrRegentTitle')]富有而多疑。先于舰队抵达的[ShowCultureGroupName('arabian_group')]商人警告[target_ruler.GetHimHer]，这些陌生人是[ROOT.GetCountry.GetReligion.GetAdjective]海盗，抢不走的东西就毁掉。[target_ruler.GetHeShe|U]在武装卫兵簇拥下，谨慎有礼地接待舰队的使节，并询问了许多关于军备的问题。[target_ruler.GetHerHis|U]自己的处境——身处一座被炮口环抱的港口中央——绝非[ROOT.GetCountry.GetAdjective]人会称之为安稳的那种。"
 cape_route_to_india_events.10.a: "用商品贿赂[target_ruler_country.Custom('GetRulerOrRegentTitle')]，买下建造权。"
 cape_route_to_india_events.10.b: "通过外交和礼物谈判贸易权。"
 cape_route_to_india_events.10.c: "出价高于[ShowCultureGroupNameWithNoTooltip('arabian_group')]商人，拉拢[target_ruler_country.Custom('GetRulerOrRegentTitle')]。"
 cape_route_to_india_events.10.d: "暂时承认[target_ruler_country.Custom('GetRulerOrRegentTitle')]的宣称，向北推进。"
 cape_route_to_india_events.10.f: "升起#italic 圣若热发现柱#!。"
 cape_route_to_india_events.10.e: "回家。"
 cape_route_to_india_events.10.historical_info: "1507年正式建立的据点使莫桑比克岛成为了葡萄牙在东非最重要的基地。16世纪建造的圣塞巴斯蒂昂堡，至今仍是撒哈拉以南非洲现存最古老的欧洲防御工事之一。该岛作为葡属东非的行政首都和$india$航线的中转站超过两个世纪。葡萄牙人对该岛的占领，实际上摧毁了阿拉伯人对北部斯瓦希里海岸贸易网络的控制。"
 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "[ShowLocationNameWithNoTooltip('mombasa')]的陷阱"
 cape_route_to_india_events.11.desc: "[ShowLocationName('mombasa')]的入口水道很窄，不超过两根锚链宽，两岸都有高地。舰队驶入时，众人开始感到有些不对劲——滨水区有人闲荡，那种过分的随意，正是全副武装却被吩咐要装作手无寸铁的人才有的，一艘三角帆船停泊在会堵住水道出口的奇怪位置，而带着礼物登上旗舰的[target_ruler_country.Custom('GetRulerOrRegentTitle')]使者礼仪繁复，又问了太多关于船上作战人员的问题。\n\n当晚，舰队雇佣的一名翻译溜进船长舱。在返回岸上之前，那位[target_ruler_country.Custom('GetRulerOrRegentTitle')]的使节用[location.GetDominantCulture.GetLanguage.GetName]对他的同伴说了一句话——翻译能听懂这种语言。那句话的意思十分明确：舰队不得离开[ShowLocationNameWithNoTooltip('mombasa')]。"
 cape_route_to_india_events.11.a: "天亮前离开；这种欢迎不值得冒险。"
 cape_route_to_india_events.11.b: "尽管明显局势紧张，仍留下尝试贸易。"
 cape_route_to_india_events.11.c: "既然他们计划背叛，那我们先下手为强；让士兵做好准备。"
 cape_route_to_india_events.11.d: "回家——我们不会在这里冒险。"
 cape_route_to_india_events.11.historical_info: "瓦斯科·达·伽马于1498年4月在蒙巴萨险些遭到伏击。根据葡萄牙记述，苏丹提供的当地领航员试图将舰队引上沙洲。达·伽马在陷阱发动前撤退。在随后的几十年里，葡萄牙人多次返回炮击和洗劫蒙巴萨。1593年建成的耶稣堡最终确保了葡萄牙对港口的控制——尽管该城在长期围困后于1698年被阿曼人夺取。"
 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "友好的[target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
 cape_route_to_india_events.12.desc: "[ShowLocationName('malindi')]的一切都与之前不同。[target_ruler_country.Custom('GetRulerOrRegentTitle')][target_ruler.GetName]身穿白色和绿色丝绸，由演奏着[ROOT.GetCountry.GetAdjective]人从未听过的乐器的乐师陪同，亲自来到港口。[target_ruler.GetSheHe|U]从南方的联系人那里得到了舰队的消息，一直在期待他们的到来。\n\n[target_ruler.GetSheHe|U]有一份比象牙更有价值的礼物：在[target_ruler.GetHerHis]麾下，有一人曾十二次航行到卡利卡特。此人知道从这里到马拉巴尔海岸之间的每一道洋流、每一处暗礁、每一次风向变化，知道西南季风何时能在三周内将船送过[ShowContinentName('indian_ocean_continent')]，何时会在二十四小时内让同一艘船葬身大海。这位领航员的名字，[target_ruler.GetNameWithNoTooltip]解释说，很难用欧洲语言表达。但[target_ruler.GetHerHis]的知识并不难表达，而这份知识的代价是友谊。"
 cape_route_to_india_events.12.a: "欣然接受[target_ruler.GetNameWithNoTooltip]的领航员和[target_ruler.GetHerHis]的友谊。"
 cape_route_to_india_events.12.b: "向[target_ruler_country.Custom('GetRulerOrRegentTitle')]提供礼物、存在和保护。"
 cape_route_to_india_events.12.c: "让我们在渡海前祈祷；[ROOT.GetCountry.GetReligion.GetGodName|U]把我们带到了这里。"
 cape_route_to_india_events.12.e: "在这次伟大的渡海开始前立起#italic 圣神发现柱#!。"
 cape_route_to_india_events.12.d: "回家；卡利卡特太远，渡海太危险。"
 cape_route_to_india_events.12.historical_info: "马林迪苏丹与蒙巴萨长期敌对，因此对葡萄牙人颇有好感——葡萄牙人的到来可能成为制衡其敌人的力量。他为瓦斯科·达·伽马提供的那位印度洋领航员——葡萄牙史料中称为马莱莫·卡纳卡——数百年来一直是学术争论的主题。一些历史学家将他认定为艾哈迈德·伊本·马吉德，即15世纪最伟大的阿拉伯航海家、数部印度洋航行著作的作者。另一些人则认为这一认定有误，那位领航员是一名古吉拉特商人。他的身份至今仍不确定。"
 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "卡利卡特——香料之门"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')]比[ROOT.GetCountry.GetCapital.GetName]更大。港口里的船只多得舰队军官都数不清——来自[ShowRegionName('arabia_region')]、[ShowRegionName('persia_region')]、[ShowAreaName('gujarat_area')]、[ShowRegionName('bengal_region')]、$china$、[ShowLocationName('malacca')]和[ShowAreaName('java_area')]的船只。一个彼此相连的完整世界，被[ShowGoodsName('pepper')]、肉桂、小豆蔻和[ShowGoodsName('cloves')]的磁力吸引到一起，这一切都流经这个港口。舰队在早已挤满三角帆船的锚地抛锚，滨水区的[ShowCultureGroupName('arabian_group')]商人注视着。\n\n两个月来，他们一直告诉[target_ruler_country.Custom('GetRulerOrRegentTitle')]——从重重高墙后治理卡利卡特的统治者——这些新来者是来自寒冷北方的海盗，不是商人。[target_ruler_country.Custom('GetRulerOrRegentTitle')|U]已同意接见舰队船长，但[target_ruler.GetHerHis]的[target_ruler_country.GetGovernment.GetCourtTitle|l]心存戒备，[target_ruler.GetHerHis]的商人也紧张不安。空气中弥漫着黑[ShowGoodsNameWithNoTooltip('pepper')]的气味，以及见证过千年贸易的海洋的咸味。这次航行所追求的一切，都取决于接下来一小时里所说的话。"
 cape_route_to_india_events.13.a: "将我们的货物摆在[target_ruler_country.Custom('GetRulerOrRegentTitle')]面前，寻求一个贸易站。"
 cape_route_to_india_events.13.b: "提议一项条约：固定关税、安全锚地、保护。"
 cape_route_to_india_events.13.c: "称[ShowCultureGroupNameWithNoTooltip('arabian_group')]商人为骗子；让[target_ruler_country.Custom('GetRulerOrRegentTitle')]选择。"
 cape_route_to_india_events.13.d: "我们的领航员了解这个[target_ruler_country.GetGovernment.GetCourtTitle|l]；他的建议指导我们的话。"
 cape_route_to_india_events.13.e: "为所有人竖起#italic 圣加布里埃尔发现柱#!。"
 cape_route_to_india_events.13.historical_info: "科泽科德（欧洲人称为卡利卡特）是印度洋上最重要的香料贸易港口。其统治者是#italic 萨穆蒂里#!（即扎莫林，意为“海之领主”），他在主导贸易的阿拉伯商人、相互竞争的印度政治体，以及后来抵达的欧洲人之间维持着谨慎的平衡。1498年瓦斯科·达·伽马首次在此受到的接待可谓喜忧参半：他带来的礼物被认为不够体面，阿拉伯商人又成功地在宫廷中破坏了双方关系。他离开时只带着少量且不令人满意的货物。直到后来的几次航行，在葡萄牙火炮的威胁支持下，才得以谈成有实际意义的贸易安排。"
 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "黄金海岸"
 cape_route_to_india_events.14.desc: "从海岸线往内陆走一天的路程，森林就开始出现，海岸和森林之间的那条路被踩得很平整。商队每周会有两三次抵达海滩：挑夫们背着皮袋，里面装着从内陆河沙里淘出来的金粉，[ShowCultureName('akan')]国王们控制着所有淘洗场地，通过一个延续了四百年的万加腊商人网络，把多余的黄金卖出去。\n\n[ROOT.GetCountry.GetAdjective]人早就听说过这个地方。每一位沿着这片海岸做生意的[ShowCultureGroupName('arabian_group')]船长都讲过，黄金海岸的市场是几内亚沿岸产出最丰厚的一段。这里的人以前见过外国船。他们并不害怕，只盘算着这些新来的人能带来多少价值。"
 cape_route_to_india_events.14.a: "建立圣若热达米纳；[ShowCultureNameWithNoTooltip('akan')]人会向其持有者出售商品。"
 cape_route_to_india_events.14.a.owned: "加强圣若热达米纳——[ShowCultureNameWithNoTooltip('akan')]人已经通过我们的手出售。"
 cape_route_to_india_events.14.b: "谈判获取[ShowCultureNameWithNoTooltip('akan')]人作为战争贡品掳走的战俘。"
 cape_route_to_india_events.14.c: "在万加腊商人离开前突袭定居点。"
 cape_route_to_india_events.14.d: "记下贸易量，向南推进。没时间耽搁。"
 cape_route_to_india_events.14.e: "回家。仅黄金就足以证明这次航行。"
 cape_route_to_india_events.14.historical_info: "葡萄牙人于1482年在黄金海岸建造了圣若热达米纳（即埃尔米纳城堡），所用石材采自附近的一处岬角，木材则在葡萄牙预先切割好，并为此装船运来。堡垒在几周内便告建成，一部分是通过与当地酋长卡拉曼萨谈判，一部分则靠出其不意。它最初旨在控制与阿肯森林诸王国的黄金贸易。但不出数十年，它便成为大西洋奴隶贸易的主要枢纽，接收来自内陆战争中的俘虏，并将他们向西运往圣多美，后来又运往巴西的甘蔗种植园。历史学家沃尔特·罗德尼估计，在奴隶贸易取代黄金成为主要商品之前，黄金海岸贸易每年为葡萄牙带来数十万克鲁扎多金币的收入。"
 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "费尔南多波岛"
 cape_route_to_india_events.15.desc: "一座岛屿从几内亚湾升起：一座火山峰，峰顶拖着云，丛林茂密直至水边。居住在这里的[ShowCultureName('bubi_culture')]人此前从未见过欧洲人。他们从树线后注视着舰队在一处天然海湾抛锚，一艘小艇被放下。\n\n一代人以前，那位以自己的名字为这座岛命名的探险家经过这里，在海图上粗略画下了它。舰队的领航员有那张海图。海图没有显示的是，这座岛是否值得停靠。"
 cape_route_to_india_events.15.desc.owned: "这座岛依旧如从前那样从海中升起——一座火山峰，峰顶拖着云，丛林茂密直至水边——但下面的锚地已经飘扬着我们的旗帜，出来迎接舰队的船只也是我们自己的。\n\n[target_leader.GetName]无需再琢磨这座岛是否值得停靠。如今的问题只在于，[ROOT.GetCountry.GetNameWithNoTooltip]在此掌控[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]贸易的这块立足点，还能再产出多少。"
 cape_route_to_india_events.15.a: "建立一个商站；该岛掌控着[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]贸易。"
 cape_route_to_india_events.15.a.owned: "加强我们在此的商站——该岛是我们在[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]贸易的支柱。"
 cape_route_to_india_events.15.b: "立一根#italic 发现柱#!，绘制该岛海图，并宣称它。"
 cape_route_to_india_events.15.c: "倾侧船体修理，装满水桶，在岛上觅食。"
 cape_route_to_india_events.15.c.tt: "船体被刮净并用沥青密封，船蛆在这次航行中不会困扰舰队"
 cape_route_to_india_events.15.d: "回家，[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]本身就是足够的理由。"
 cape_route_to_india_events.15.historical_info: "费尔南多波（今比奥科）由葡萄牙探险家费尔南·多·波于约1472年到达，他是第一个看到该岛的欧洲人。土著布比人已经在那里与世隔绝地生活了几个世纪，很久以前就从大陆渡海而来。葡萄牙人将该岛用作中转站，但难以建立持久定居点，部分由于热带疾病，部分由于布比人抵制接触。该岛在后来几个世纪中多次易手；根据1778年的《埃尔帕尔多条约》，葡萄牙将其转让给西班牙，以换取南美洲的领土让步，它最终成为现代赤道几内亚的一部分。"
 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "海之苏丹之城"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')]比我们预想的更大。港口里满是来自[ShowRegionName('arabia_region')]和$india$的三角帆船，满载[ShowGoodsName('cloth')]、[ShowGoodsName('copper')]和[ShowGoodsName('porcelain')]。[ShowLocationNameWithNoTooltip('mogadishu')]由[target_owner.GetName]的[target_owner.Custom('GetRulerOrRegentTitle')]统治，掌管着[ShowCultureName('somali_culture')]内陆与更广阔海洋世界之间的贸易。滨水区的商人用精于算计的眼光打量我们的船只。我们不是第一批带着陌生船帆和陌生货物到达这里的陌生人，但我们可能是第一批从如此遥远的西方来的。"
 cape_route_to_india_events.16.a: "与[ShowCultureNameWithNoTooltip('somali_culture')]商人交易。每一次接触都重要。"
 cape_route_to_india_events.16.b: "观察、记录、向北航行。我们寻找的是$india$，不是这个。"
 cape_route_to_india_events.16.c: "掉头。路线未知；给养撑不住。"
 cape_route_to_india_events.16.historical_info: "摩加迪沙是东非海岸最古老、最富庶的城市之一，其连续贸易史可追溯到葡萄牙人到来之前的几个世纪。阿拉伯地理学家早在9世纪就将其记录为一座重要港口。到达·伽马航行时，它由一个苏丹国统治，并构成了连接非洲内陆与阿拉伯、波斯和印度次大陆的斯瓦希里海岸贸易网络的一部分。葡萄牙人决定绕过或胁迫这些斯瓦希里城邦，以建立自己的贸易垄断，这使他们与一个现有且高度运作的商业体系发生了直接冲突。"
 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "伊巴德港"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')]从红色悬崖升起，这里的海风气息不同——更干燥、更刺鼻，带着灰尘和[ShowGoodsName('salt')]混合的味道。港口是[ShowProvinceDefinitionName('arabian_sea_province')]上最优良的港口之一，水深足以容纳大型船只，还能为船只遮挡西南季风。[ShowCultureName('omani_culture')]商人已经航行到$india$一千年了。滨水区的人熟悉航线、风向和时机。他们知道何时出航，何时等待。他们看着我们，想知道我们想要什么。"
 cape_route_to_india_events.17.a: "寻找[ShowCultureNameWithNoTooltip('omani_culture')]当局并表明身份。"
 cape_route_to_india_events.17.b: "向[ShowCultureGroupNameWithNoTooltip('arabian_group')]领航员购买前往$india$的海图。"
 cape_route_to_india_events.17.c: "补充补给并离开。[ShowCultureNameWithNoTooltip('omani_culture')]水手不是朋友。"
 cape_route_to_india_events.17.d: "掉头返航。前往$india$的航行超出我们的能力。"
 cape_route_to_india_events.17.historical_info: "马斯喀特是西印度洋主要海上力量之一的阿曼伊巴德派伊玛目国的主要港口。阿曼水手是世界上最熟练的航海者之一，深谙决定阿拉伯与印度次大陆之间渡海时机的季风。葡萄牙人的到来威胁了阿曼作为香料贸易中间商的角色，葡萄牙与阿曼的关系在16世纪大部分时间保持敌对，最终演变为争夺波斯湾和东非港口控制权的多次战争。阿曼最终在17世纪将葡萄牙人逐出其东非网络的大部分。"
 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "葡萄牙人已建造[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.18.desc: "他们的船只毫无预警地抵达，在外锚地抛锚，将炮口对准港口。他们的要求表面上充满礼貌，实质上不容拒绝。他们希望建造一座贸易站。他们会支付一小笔租金。他们会尊重当地法律。他们没有说——也无需说——的是，如果我们拒绝会发生什么。木材已经砍好装在他们的船舱里。商站几天内就建好了。如今，它飘扬着[por_feitoria_builder.GetAdjective]的十字旗，而以前飘扬的是我们自己的旗帜。"
 cape_route_to_india_events.18.a: "我们别无选择；我们的抗议敌不过他们的大炮。"
 cape_route_to_india_events.18.b: "发出抗议，要求尊重我们的主权。"
 cape_route_to_india_events.18.historical_info: "葡萄牙的贸易站制度，是欧洲在亚洲和非洲实行商业帝国主义的最早范例之一。葡萄牙通过在现有港口建立设防贸易站，得以嵌入已有的贸易网络，而无需承担全面领土征服的成本。同意合作的当地统治者可获得葡萄牙商品，以及对抗对手的海军保护；拒绝者则遭到炮击。这一制度将印度洋从一个相对开放的商业空间，转变为一个围绕葡萄牙海军霸权和印度商行贸易垄断而组织起来的体系。"
 cape_route_to_india_events.provisioned_25_tt: "舰队补给充足，船员将更好地承受前方的漫长航段（#G +25#!补给）"
 cape_route_to_india_events.provisioned_30_tt: "舰队补给充足，船员将更好地承受前方的漫长航段（#G +30#!补给）"
 cape_route_to_india_events.provisioned_40_tt: "舰队补给充足，船员将更好地承受前方的漫长航段（#G +40#!补给）"
 cape_route_to_india_events.supplies_up_10_tt: "舰队给养得到补充（#G +10#!补给）"
