 cape_route_to_india_events.ship_lost_tt: "损失一艘船，探险队规模减少（#R ‑1#!船只）"
 cape_route_to_india_events.cargo_loaded_tt: "货舱装满[ShowGoodsName('pepper')]——航行幸存者越富有，带回家的货物越多"
 cape_route_to_india_events.cargo_spent_tt: "货舱更轻——用于购买这种恩典的货物在旅程结束时不会出售（#R ‑20#!货物）"
 cape_route_to_india_events.pilot_gained_tt: "一位经验丰富的领航员现在引导舰队，并在我们与卡利卡特统治者交涉时提供更明智的建议"
 cape_route_to_india_events.19.title: "海上疾病"
 cape_route_to_india_events.19.desc: "病症一如既往地从牙龈开始。牙龈先是变软，然后出血，然后牙齿在牙槽中松动。多年前愈合的旧伤像新切的一样裂开。人们变得无精打采，继而呼吸急促，最后再也无法从吊床上起身。医生没有对策——谁都没有。支撑舰队穿越空旷海域的咸鱼和象鼻虫饼干桶没有任何东西能应对这个。每天黎明点名，应到的声音一天比一天少。尸体被裹在自己的吊床中扔下船，而到下一个友好海岸的航程无情地延伸。"
 cape_route_to_india_events.19.a: "配给最后的水果，全速驶向陆地。"
 cape_route_to_india_events.19.b: "无事可做。埋葬死者，为其余人祈祷。"
 cape_route_to_india_events.19.b.tt: "许多船员将无法生还——航行的回报将减少"
 cape_route_to_india_events.19.historical_info: "坏血病，由缺乏维生素C引起，是长途航行时代水手的头号杀手。在瓦斯科·达·伽马第一次前往$india$的航程中，估计一百四十八人中有九十三人死亡，绝大多数死于远离新鲜食物的漫长开阔航段上的坏血病。其原因在两个半世纪后才得到确切认知；水手和医生只掌握到新鲜给养——尤其是柑橘类水果——不知怎么地遏制了这种疾病，这一知识反复被人掌握，又反复被人遗忘。"
 cape_route_to_india_events.20.title: "南方狂风"
 cape_route_to_india_events.20.desc: "气压计已经发出警告，只是无人懂得解读：一道长长的重涌浪从西南方在晴朗天空下滚来。然后天空不再晴朗。风猛烈起来，然后更猛烈，撕掉浪尖，将浪沫平展地甩过水面。海浪堆积到船上无人有词语形容的高度，灰绿色的墙壁带着泡沫条纹，将船只船尾朝上抬向飞驰的云层，然后落入风突然变得诡异静止的波谷。在昏暗中的某处，其他船只正在鸣炮保持位置，炮声几乎刚响起就被轰鸣的风浪吞没。现在除了海浪允许的航向，没有别的航向可以走。"
 cape_route_to_india_events.20.a: "收帆，顶风停船。我们相信这些船。"
 cape_route_to_india_events.20.b: "在少量帆下顺风跑，祈祷我们不被尾浪淹没。"
 cape_route_to_india_events.20.b.win_tt: "赌赢了——舰队跑赢了最恶劣的风暴"
 cape_route_to_india_events.20.b.lose_tt: "大海对舰队为所欲为"
 cape_route_to_india_events.20.historical_info: "非洲南部外海是世界上最危险的海域之一，温暖的厄加勒斯洋流在这里和从南大洋北上的寒冷大西洋涌流交汇。直到今天，这里仍有能掀翻大型船只的异常巨浪的记录。对于大航海时代排水量仅数百吨的小型船只——克拉克帆船和卡拉维尔帆船来说，南大西洋的风暴是致命的威胁，绕过这片海角的航线也因此早早得名“风暴之角”，这完全名副其实。"
 cape_route_to_india_events.21.title: "无风之海"
 cape_route_to_india_events.21.desc: "正午时分风停了，再也没有回来。帆松弛地挂在桅杆上，随着涌浪的起伏无用拍打。到第二天，海面已变成玻璃，一面巨大的耀眼镜子延伸到因热而闪烁的地平线。甲板缝中的沥青融化。水桶中的水变温、变绿、变臭。除了等待无事可做——等待，看着太阳，听着木材吱嘎作响，尽量不计算那些无处可去的人正在吃掉多少给养。水手们低声谈论多年后被人发现的船只：漂流着，船员早已渴死，至死没望见那阵永远没能追上的风。"
 cape_route_to_india_events.21.a: "等待风。没有别的办法。"
 cape_route_to_india_events.21.b: "放下小船拖行；什么都比这死寂好。"
 cape_route_to_india_events.21.historical_info: "赤道无风带，或称热带辐合带，是往返南半球的大西洋横渡中臭名昭著的危险。帆船可能在那里因无风而停滞数日甚至数周，消耗着给养和淡水，却完全无法前进。正是为了避开这条无风带和逆风带，葡萄牙航海者才发展出了#italic 海之回旋#!——即向西深入大西洋、几乎抵达巴西的大迂回，以便先借到有利的南风，再折返向东驶向好望角。"
 cape_route_to_india_events.22.title: "船体内的蛀虫"
 cape_route_to_india_events.22.desc: "木匠在例行测量舱底时发现了问题：螺旋钻回来时是软的，当他探查水线以下的船板时，工具直接陷进本应铁硬的木头。是船蛆。温暖的热带水域满是这种生物，自舰队越过赤道以来一直在钻入船体——成千上万的苍白洞穴从内部蜂巢化木材，直到木板断裂或水泵无法跟上才可见。如果不处理，如此侵扰的船有一天会在接缝处裂开，与所有人一起沉没。木匠的脸色在说话之前就告诉了[target_leader.GetName]一切。"
 cape_route_to_india_events.22.a: "倾侧船只，用火从木材中烧出蛀虫。"
 cape_route_to_india_events.22.a.tt: "倾侧耗费时间和金钱，但拯救舰队"
 cape_route_to_india_events.22.b: "拆下最差的船体作补给和木材，弃船。"
 cape_route_to_india_events.22.c: "驶向友好港口，好好修复她。"
 cape_route_to_india_events.22.c.tt: "在安全港口进行适当修复恢复舰队士气"
 cape_route_to_india_events.22.historical_info: "船蛆又名#italic 凿船贝#!——其实并非蛆虫，而是一种咸水蛤——是温暖水域中木船的灾星，能够在一季内毁掉未加保护的船体。它的破坏促使人们在数百年间持续采取对策：船体包铅、涂沥青和牛脂或采用双层板，外层作为牺牲层。这个问题在$india$航线上如此严重，以至于葡萄牙人最终在其各个印度洋基地建造了专门的倾侧设施，在航行之间刮除附着物并修理船体。"
 cape_route_to_india_events.24.title: "叛变"
 cape_route_to_india_events.24.desc: "这种状况已经酝酿了好几个星期——军官一走近就戛然而止的低声交谈，执行命令时带着愠怒的拖沓，还有那些眼神。现在它彻底公开了。前甲板上聚着一小群人，其中一个人手里攥着一根解缆针，他们身后是一大群还没打定主意站哪边的人。这些人的诉求，是一群觉得自己正被带向死亡的受惊之人的诉求：掉头返航，驶向一个信奉[ROOT.GetCountry.GetReligion.GetAdjective]的港口，做什么都可以，就是别继续驶入这片已经吞掉了他们太多同伴的大洋。[target_leader.GetName]独自站在后甲板的边缘。[target_leader.GetSheHe]在接下来一分钟的回应将决定是否还有航行。"
 cape_route_to_india_events.24.a: "把带头的送上岸，让怯懦者离开。"
 cape_route_to_india_events.24.b: "用冰冷钢铁迎接他们，船上可没有民主。"
 cape_route_to_india_events.24.fight_win_tt: "军官们获胜，秩序恢复"
 cape_route_to_india_events.24.fight_lose_tt: "战斗血腥，舰队付出代价"
 cape_route_to_india_events.24.c: "向他们讲述$india$，讲述未来的财富和荣耀。"
 cape_route_to_india_events.24.rouse_tt: "[target_leader.GetNameWithNoTooltip]的话语重新点燃船员的决心"
 cape_route_to_india_events.25.title: "空旷的海岸"
 cape_route_to_india_events.25.desc: "一片低矮的绿色海岸从下风处的薄雾里显现——没有炊烟，没有船帆，没有任何人类活动的痕迹，只有森林一直延伸到浪线边，更远处，也许有淡水，还有这片陆地上可能存在的任何猎物。海图上对此地没有丝毫记录。这片土地无人认领，无人知晓，里面可能有任何东西：便利的泉眼和容易猎到的猎物，或是热病，或是躲在我们看不见的林线后面、怀有敌意的当地人。但水桶已经快空了，船员们眼睛都凹了进去，海岸总归是海岸。"
 cape_route_to_india_events.25.a: "派船上岸取水和土地产出的一切。"
 cape_route_to_india_events.25.b: "在这海岸风险太大。记下它，继续航行。"
 cape_route_to_india_events.26.title: "愿意贸易的海岸"
 cape_route_to_india_events.26.desc: "这片海岸有人居住，当地居民并不抱有敌意。船队向岸边靠近时，独木舟从岸边划了出来——一开始他们很谨慎，之后就大胆了不少，举着鱼和水果，朝着海滩打手势，那里很快凑出了一个简易的交易点。控制这片海岸的人对这些外来者没有敌意，船队携带的[ShowGoodsName('iron')]和[ShowGoodsName('cloth')]显然勾起了他们交易的兴趣。这正是漫长的空航路段里极少能遇到的机会：一个可以补满水桶、采购新鲜食物，让船员们在没有恶意的人群当中踏上坚实陆地的地方。"
 cape_route_to_india_events.26.a: "用[ShowGoodsNameWithNoTooltip('iron')]和[ShowGoodsNameWithNoTooltip('cloth')]换取所有新鲜给养。"
 cape_route_to_india_events.26.b: "我们没有时间耽搁。只取水，继续前进。"
 cape_route_to_india_events.27.title: "全员失踪"
 cape_route_to_india_events.27.desc: "最后一艘船消失了。是死于大海、疾病、人们自己的绝望，还是落入敌对海岸，家里的人永远不会确切知道——只知道那支隆重启航的舰队不会回来了。没有装满[ShowGoodsName('pepper')]的货舱，没有凯旋，没有通往$india$的道路海图。在那片巨大海洋弧线的某处，在非洲海岸与东方财富之间，探险队就这样结束了，大海吞没了它，仿佛它从未存在过。在里斯本，家人将等待数月，然后数年，才终于明白。"
 cape_route_to_india_events.27.a: "愿[ROOT.GetCountry.GetReligion.GetGodName]接纳他们。我们不会很快再次尝试。"
 cape_route_to_india_events.27.historical_info: "通往$india$的海上航线，是以惊人的人力代价开辟的。即便成功的航行，也通常损失半数船员和一部分船只；失败的航行则完全消失，除了某支船队未能返回之外，不留任何记录。在接下来一个世纪里，尝试#italic 印度航线#!的船只中，有相当一部分彻底损失——有的在非洲海岸失事，有的在南大洋风暴中沉没，有的则干脆再无音讯。巨额财富或许流向了里斯本，但其代价是大量溺亡和身染热病的人，其规模不应被遗忘。"
 cape_route_to_india_events.28.title: "在[ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]登陆"
 cape_route_to_india_events.28.desc.empty: "十个黑色火山岩锥从冷漠的海中升起，没有一个上面有人迹。没有炊烟，没有帆，没有旗帜——只有海鸟、风，和灰烬中几处微咸泉。旧海图命名了这些岛屿，但从未有国家在此定居。它们横跨我们的路线必须穿越的水域，[target_leader.GetName]清楚地知道它们的价值，就像[target_leader.GetSheHe]知道[target_leader.GetHerHis]自己的名字一样：谁持有[ShowProvinceDefinitionName('cape_verde_province')]，谁就持有[ShowContinentName('atlantic_ocean_continent')]的门户。而此时此刻，尚无任何归属。"
 cape_route_to_india_events.28.desc.foreign: "[rival_owner.GetAdjective]旗帜在[ShowLocationName('santiago')]的锚地上飘扬。[rival_owner.GetName]先于我们到达这些岛屿并扎下根——驻军、炮台、一位划船出来询问我们事务的港务长，语气礼貌与不欢迎同等。这些岛屿横跨我们的路线必须穿越的水域；在[rival_owner.GetAdjectiveWithNoTooltip]手中，它们是一把抵在每个南下航行咽喉上的刀。[target_leader.GetName]倚着栏杆审视着防御工事，什么也不说，却想了很多。"
 cape_route_to_india_events.28.a: "宣称这些岛屿；升起一面飘扬我们旗帜的[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]。"
 cape_route_to_india_events.28.b: "上岸取水，采集岛上所能提供的。"
 cape_route_to_india_events.28.c: "这些岛屿不是我们该使用的。继续南下。"
 cape_route_to_india_events.28.d: "回家。"
 cape_route_to_india_events.28.historical_info: "佛得角群岛由葡萄牙航海家于约1456年发现，1462年开始向这里移民，在此之前这些群岛完全无人居住。它们在大西洋中部的位置，捕捉东北信风，使其成为绕非洲和前往美洲航行不可或缺的中转站。控制佛得角的势力在每条南方路线上都有一个咽喉点；葡萄牙随着其海洋野心增长而着手定居和设防这些岛屿绝非偶然。"
 cape_route_to_india_events.29.title: "石柱"
 cape_route_to_india_events.29.desc.rafael: "舰队停泊在一条宽阔浑浊的河口，领航员们已经称它为[ShowLocationNameWithNoTooltip('quelimane')]——“好兆头之河”——因为在这里，人们终于见到他们跨越半个世界寻找的东西：当地船只按[ShowCultureGroupName('arabian_group')]方式装配，商人知道“$india$”这个词，说的时候指向东方。伟大渡海就在眼前。货舱里躺着从家乡带来的加工石灰岩柱，正是为此目的，每根都顶着十字架和王室纹章。木匠问是否要带一根上岸。竖起石柱意味着以石头宣示主权，并在石匠工作时取淡水和木材——但这将耗费舰队可能本就所剩无几的几天时间。"
 cape_route_to_india_events.29.desc.maria: "低矮的小岛位于此处海岸外，绿色且水源充足，免受涌浪影响——疲惫舰队珍视胜过黄金的那种土地。$india$现在近了；马拉巴尔海岸向南航行几天。货舱中等待着另一根石灰岩柱，在航行开始前就修整和刻字，准备宣告我们王冠的船只最先到达这片水域。立起这根柱子，留下的印记将比船上每个人生命更长久——但立碑仪式，以及随之而来的修船、补给淡水的工作，会让船队在此停留，直到季风季节过去。"
 cape_route_to_india_events.29.desc: "这里的海岸值得标记。货舱中躺着一根从家乡带来的修整石灰岩柱——顶着十字架和王室纹章——意在立在海角上，宣告我们的船只最先来到这里。竖起它是庄严的事，也是缓慢的事；舰队必须在石匠安放石头时停泊等待。"
 cape_route_to_india_events.29.a: "升起#italic 发现柱#!——让石头和十字架标记我们的航程。"
 cape_route_to_india_events.29.b: "没时间举行仪式——取水、觅食、继续前进。"
 cape_route_to_india_events.29.historical_info: "#italic 发现柱#!是顶上有十字架和葡萄牙纹章的石柱，它先预制成型然后随船携带，在新到达的海岸竖立以宣示发现和主权。根据人文主义者达米昂·德·戈伊斯记载，瓦斯科·达·伽马的舰队在前往$india$的航行中竖立了五根：好兆头之河的#italic 圣拉斐尔发现柱#!，莫桑比克的#italic 圣若热发现柱#!，马林迪的#italic 圣神发现柱#!，小岛的#italic 圣玛丽亚发现柱#!，以及卡里卡特的#italic 圣加布里埃尔发现柱#!。这些石柱取代了早期航行易腐烂的木十字架，意在长久留存；有几根存留了几个世纪。"
 cape_route_to_india_events.30.title: "航行放弃"
 cape_route_to_india_events.30.desc: "命令下达，这艘船上没有争论——只有一些人脸上的宽慰和另一些人脸上的失望。船头调转。在他们身后，未知海岸退去；在前方，漫长熟悉的回家路。没有$india$的海图，没有[ShowGoodsName('pepper')]的货舱，没有在谁最先找到东方海路的历史学家记述中的位置。但船只完整，船员活着，家乡的港口是确定而非希望。\n\n[target_leader.GetName]长时间注视着船尾的地平线，然后把注意力转向[target_leader.GetHerHim]前方仍有的航行任务。"
 cape_route_to_india_events.30.a: "就这样吧。我们带着所学甚少返回。"
 cape_route_to_india_events.30.historical_info: "并非每支沿非洲海岸南下的葡萄牙探险队都推进到最终目标。船长们经常权衡未知渡海的风险与已聚集的船只和人员，安全返回并部分记录新海岸线通常被认为是更明智的选择。这样的航行即使未达$india$，也逐步增加了海图，而一代人航行积累的知识最终使瓦斯科·达·伽马的完整渡海成为可能。"
 cape_route_to_india_events.31.title: "葡萄牙人建造他们的[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.31.desc: "他们的船长带着礼物而非炮手上岸，条款在三天会谈中敲定：水边一块地供他们的[ShowBuildingTypeName('por_feitoria')]，向我们国库支付的租金，我们自己的法庭裁决他们的人与我们的人之间的任何争吵，以及他们的舰队站在这个港口和我们的对手之间。木材从他们船舱中取出时已按尺寸切好，商站在几天内建成。\n\n它飘扬着[por_feitoria_builder.GetName]的纹章在我们自己的旁边，下面的锚地比一代人以来更繁忙。我们的孙子可能还会诅咒这笔交易，但今天的账目足够清楚：我们有火药、布和一个有炮的朋友，他们有仓库和码头。"
 cape_route_to_india_events.31.a: "遵守条款；我们的宫廷会对异国武器抱怨。"
 cape_route_to_india_events.31.b: "立此为据，租金和权利为双方王室固定下来。"
 cape_route_to_india_events.31.historical_info: "并非每一座商站都是在炮舰威胁下建立起来的。马林迪苏丹与蒙巴萨长期敌对，因此把瓦斯科·达·伽马的舰队视为有用的制衡力量，并提供了那位领航员，引导舰队横渡至卡利卡特。马林迪在此后数十年间一直是葡萄牙在斯瓦希里海岸的盟友，先后接纳了一座葡萄牙商站，后来又接纳了一座堡垒。那些早早与葡萄牙达成协议的统治者，得以获得葡萄牙商品，以及针对自身敌人的海军保护；有几位还利用这种安排清算了自己的旧怨。这类交易很少是对等的，但在双方自愿达成的地方，它们往往比靠武力强加的安排持久得多。"
