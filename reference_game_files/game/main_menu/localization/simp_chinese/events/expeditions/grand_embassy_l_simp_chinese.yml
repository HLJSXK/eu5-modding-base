l_simp_chinese:
 grand_embassy.1.title: "筹备使团"
 grand_embassy.1.desc: "使团出发前，我们必须决定其形式。一位被簇拥着出席宴会，下榻于戒备森严的馆舍的统治者，只能看到主人想展示的东西；工坊、干船坞和练兵场对贵宾始终关闭。[figurehead.GetName]将作为使团的头面人物出行，而[target_ruler.GetName]则藏身于随从之中，避开关注的目光自由行动。为了维持这一点，我们该做到何种程度？"
 grand_embassy.1.a: "按常规标准准备使团。"
 grand_embassy.1.a.tt: "常规准备，常规保密（隐蔽：55）"
 grand_embassy.1.b: "不遗余力地保守秘密。"
 grand_embassy.1.b.tt: "额外小心换来真正的匿名（隐蔽：75）"
 grand_embassy.1.c: "派出诱饵使团。"
 grand_embassy.1.c.tt: "诱饵分散追踪（隐蔽：95）"
 grand_embassy.2.title: "在[embassy_country.GetCapital.GetNameWithNoTooltip]呈递使团"
 grand_embassy.2.desc.port: "使团已抵达[embassy_country.GetCapital.GetName]。我们来此是为了进入：[embassy_country.GetName]建造使其在海上保持领先的舰队的干船坞和军械库。我们在[embassy_country.GetGovernment.GetCourtTitle]如何展示自己，将决定他们实际让我们看多少。"
 grand_embassy.2.desc.inland: "使团已抵达[embassy_country.GetCapital.GetName]。我们来此是为了进入：[embassy_country.GetName]的工匠和操练教官已经重塑其贸易和军队的工坊与练兵场。我们在[embassy_country.GetGovernment.GetCourtTitle]如何展示自己，将决定他们实际让我们看多少。"
 grand_embassy.2.a: "让[figurehead.GetShortNameWithNoTooltip]发言；[target_ruler.GetShortNameWithNoTooltip]留在随从中。"
 grand_embassy.2.a_no_figurehead: "让[target_ruler.GetShortNameWithNoTooltip]留在随从中。"
 grand_embassy.2.b: "公开呈现[target_ruler.GetShortNameWithNoTooltip]，也就是[target_ruler.GetHerHim]的真实身份。"
 grand_embassy.2.c: "避开[embassy_country.GetGovernment.GetCourtTitle]。我们来此不是为了被看见。"
 grand_embassy.3.title: "大使团在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.3.desc.unaware: "一支来自[from.GetName]的使团已抵达[ROOT.GetCountry.GetGovernment.GetCourtTitle]，据他们自己说是普通旅行者，渴望看看[ROOT.GetCountry.GetName]如何做事。我们让他们进入我们的工坊和机构，还是打发他们上路？"
 grand_embassy.3.desc.aware: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]已经悄悄弄清谁真正随这支使团旅行。直接揭穿[target_ruler.GetName]会让所有相关者难堪，然而接待一位愿意从[ROOT.GetCountry.GetName]的奇迹中学习、甚至不惜伪装的统治者，并非小事。看来，谨慎是一把双刃剑。"
 grand_embassy.3.a: "允许他们进入。"
 grand_embassy.3.b: "我们的奇迹供所有人观看。"
 grand_embassy.3.c: "我们不会让外国人学习我们的秘密。"
 grand_embassy.3.d: "谨慎地允许他们进入。"
 grand_embassy.3.e: "如此重要的客人可以不受阻碍地观看我们的奇迹。"
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip]，我们认识你，你在这里不受欢迎。"
 grand_embassy.4.title: "大方挽留"
 grand_embassy.4.desc: "既然谁随使团旅行的真相已为人知，[embassy_country.GetName]的[embassy_country.GetGovernment.GetCourtTitle]已发出邀请：再留一段时间，看看更多可看的东西。"
 grand_embassy.4.a: "感激地接受邀请。"
 grand_embassy.4.b: "乞求更长的逗留。"
 grand_embassy.6.title: "延长访问时间的回报"
 grand_embassy.6.desc: "消息已传到[embassy_country.GetCapital.GetName]，使团中真正随行的是谁，已经瞒不住了。[embassy_country.GetGovernment.GetCourtTitle]已对这场伪装失去耐心，现在召见[target_ruler.GetName]——不是以一位可以谢绝的宾客身份，而是以[target_ruler.GetSheHe]身为统治者的身份。再无回旋余地：要么直面宫廷，要么现在就回头。"
 grand_embassy.6.a: "我们的政府架构会从中受益！"
 grand_embassy.6.b: "我们的陆军会从中受益！"
 grand_embassy.7.title: "大使团访问成果丰硕"
 grand_embassy.7.desc: "使团已经用尽了在[embassy_country.GetName]所能利用的一切门路，如今必须做出抉择：要么继续前往另一个宫廷，要么打道回府，把已学到的东西付诸实用。"
 grand_embassy.7.a: "回家。"
 grand_embassy.7.b: "继续前往[target_1.GetNameWithNoTooltip]。"
 grand_embassy.7.c: "改为前往[target_2.GetNameWithNoTooltip]。"
 grand_embassy.7.d: "将目光投向[target_3.GetNameWithNoTooltip]。"
 grand_embassy.7.e: "还有[target_4.GetNameWithNoTooltip]可访问。"
 grand_embassy.7.f: "将使团转向[target_5.GetNameWithNoTooltip]。"
 grand_embassy.5.title: "逗留请求遭拒"
 grand_embassy.5.desc: "为了使[ROOT.GetCountry.GetName]迈向现代化，研习[ShowSubContinentName('western_europe')]先进科技的机会可谓弥足珍贵。遗憾的是，我们的使团逗留[embassy_country.GetCapital.GetName]的请求遭到拒绝。"
 grand_embassy.5.a: "回家。"
 grand_embassy.5.b: "在[target_1.GetNameWithNoTooltip]尽力挽回。"
 grand_embassy.5.c: "在[target_2.GetNameWithNoTooltip]寻求更热情的欢迎。"
 grand_embassy.5.d: "[target_3.GetNameWithNoTooltip]可能更殷勤。"
 grand_embassy.5.e: "改为在[target_4.GetNameWithNoTooltip]碰运气。"
 grand_embassy.5.f: "还有[target_5.GetNameWithNoTooltip]可拜访。"
 grand_embassy.discretion_down_5_tt: "可藏身之处更少（#R ‑5#!隐蔽）"
 grand_embassy.discretion_down_10_tt: "宫廷起疑（#R ‑10#!隐蔽）"
 grand_embassy.discretion_down_20_tt: "太多恩宠引来太多目光（#R ‑20#!隐蔽）"
 grand_embassy.discretion_down_30_tt: "伪装被揭穿（#R ‑30#!隐蔽）"
 grand_embassy.discretion_up_10_tt: "我们避开了视线（#G +10#!隐蔽）"
 grand_embassy.discretion_set_0_tt: "伪装结束（隐蔽：0）"
 grand_embassy.modernization_up_0to10_tt: "不被看见时教训效果更好（#G +0至+10#!现代化）"
 grand_embassy.opportunities_set_1_tt: "对陌生人展示甚少（机会：1）"
 grand_embassy.opportunities_set_2_tt: "有些门无论如何会打开（机会：2）"
 grand_embassy.opportunities_set_3_tt: "每扇门都向我们敞开（机会：3）"
 grand_embassy.opportunities_set_4_tt: "毫无保留（机会：4）"
 grand_embassy.opportunities_up_1_tt: "邀请打开了另一扇门（#G +1#!机会）"
 grand_embassy.opportunities_up_2_tt: "坚持，无论多么不体面，再打开两扇（#G +2#!机会）"
 grand_embassy.opportunities_down_1_tt: "一天被耗尽了（#R ‑1#!机会）"
 received_grand_embassy: "接待大使团"
 rejected_grand_embassy: "拒绝大使团"
 humiliated_grand_embassy: "受辱的大使团"
 grand_embassy.8.title: "国内麻烦"
 grand_embassy.8.desc: "消息传到使团，国内爆发了麻烦。由于[target_ruler.GetName]仍在国外，[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]想知道为什么他们的[ROOT.GetCountry.GetGovernment.GetRulerTitle]不见踪影。现在缩短旅程意味着回家时一无所获。坚持终归意味着继续缺席统治一段时间。"
 grand_embassy.8.a: "我们必须立刻回国。"
 grand_embassy.8.b: "仍要学习的教训值得这个代价。"
 grand_embassy.modernization_up_5_tt: "教训效果很好（#G +5#!现代化）"
 grand_embassy.modernization_up_15_tt: "教训完全掌握（#G +15#!现代化）"
 grand_embassy.discretion_up_20_tt: "金钱能买到大量遗忘（#G +20#!隐蔽）"
 grand_embassy.9.title: "账房"
 grand_embassy.9.desc: "在[embassy_country.GetName]，一位账目管理员带我们查看维持国库运转的账簿和税册。沾墨的手指毫不犹豫地沿每一列移动，总数似乎从不说谎。管理员把每笔金额记两次，一次作应收，一次作已付，以免任何钱币未被察觉地溜走，并在周末前将账目与港口舱单交叉核对。对于那些愿意为管理员的时间付钱、并有足够耐心追随方法到底的人，还有更多可学。"
 grand_embassy.9.a: "记下方法。"
 grand_embassy.9.b: "付钱完整研究登记册。"
 grand_embassy.9.c: "付钱查看每一本账簿，并留下来掌握它们。"
 grand_embassy.10.title: "历书制作者"
 grand_embassy.10.desc: "[embassy_country.GetCapital.GetName]的一群书记员开始计算一切：出生、收成、港口船只，甚至每周面包价格。他们的账簿填满整个书架，每一列都注明日期并与上一列对照，直到数字本身开始讲述任何编年史家都无法讲述的故事。他们的历书声称比任何编年史都更真实地展示一个王国，从似乎只有他们注意到的模式中预测饥荒和丰饶。只要付费，他们愿意向任何有耐心听完算术的人解释方法。"
 grand_embassy.10.a: "记下他们的方法。"
 grand_embassy.10.b: "付钱获取他们技艺的完整说明。"
 grand_embassy.10.c: "付钱获取完整调查，并留下来掌握它。"
 grand_embassy.11.title: "宫廷时尚"
 grand_embassy.11.desc: "外套的剪裁、假发的样式、鞠躬的正确深度：[embassy_country.GetName]的廷臣研究这些东西，其仔细程度不亚于研究任何条约，错误的裙摆造成的名誉损失可能需要数年才能修复。每一道褶痕和每一根羽毛都承载着外行无法解读的含义，穿着不得体的使团根本不会被当回事。一位廷臣私下表示，愿意为我们讲解该穿什么、为何如此穿，以及应当先向谁行礼、行到多深。"
 grand_embassy.11.a: "观察并记住。"
 grand_embassy.11.b: "付钱给这位廷臣，以获取更完整的课程。"
 grand_embassy.11.c: "付钱获取完整课程，并留下来掌握它。"
 grand_embassy.12.title: "思想沙龙"
 grand_embassy.12.desc: "在宫殿附近的一座联排别墅里，商人、学者和闲散贵族大多数晚上聚集在咖啡旁争论曾经不会说出口的事情：税收、信仰，以及王冠权威的适当界限。谈话持续到深夜，随着蜡烛燃尽而变得更响亮，似乎没人在意谁在听，只要他们也有值得说的话。安排一份加入他们的邀请，即使作为陌生人，也并非不可能，只要咖啡好、观点大胆。"
 grand_embassy.12.a: "安静坐着听。"
 grand_embassy.12.b: "付钱进入圈子。"
 grand_embassy.12.c: "付钱完全进入，并留下来掌握它。"
 grand_embassy.13.title: "铸造车间"
 grand_embassy.13.desc: "[embassy_country.GetName]的铸造厂用我们自己的枪炮匠会付出高昂代价去了解的方法铸造大炮：合金的配比、模具的形状、冷却的时机。炉口热浪闪烁，工人们围绕熔融金属移动，带着一种熟练的平静，说明是长期习惯而非仅仅技能。铸造大师满身汗水，显然为工作自豪，愿意为报酬解释更多，而且似乎最喜欢真正懂得他们在看什么的观众。"
 grand_embassy.13.a: "观看铸造。"
 grand_embassy.13.b: "付钱给铸造大师让其解释工艺。"
 grand_embassy.13.c: "全额付给大师，并留下来掌握工艺。"
 grand_embassy.14.title: "练兵场"
 grand_embassy.14.desc: "在[embassy_country.GetCapital.GetName]外的练兵场上，连队齐步转身并装填，比我们自己的任何征召兵都快，靴子以似乎从不紊乱的节奏敲击夯实的地面。军官喊出命令，队列在话语离开嘴巴之前就已回应，整个阵型像一个身体而不是一百个独立的人一样转动。一位操练教官被我们的关注奉承，提出完整走一遍步伐，从第一声号令到最后一轮齐射。"
 grand_embassy.14.a: "观看操练。"
 grand_embassy.14.b: "付钱给教官近距离观看。"
 grand_embassy.14.c: "全额付给教官，并留下来掌握操练。"
 grand_embassy.15.title: "在正确的人耳边说句话"
 grand_embassy.15.desc: "安排我们觐见的侍从长悄悄放出消息，要给对的人送上一份礼物，许多大门便能轻易敞开，一旦钱币易手，某些名单上的某些名字就有办法从记忆中遗忘。他随意谈起这些事，几乎像顺便提到天气，并等着看我们是否领会他的意思。这是小事，在任何宫廷都足够常见，尽管价格往往随开口而水涨船高。"
 grand_embassy.15.a: "送上惯常礼物。"
 grand_embassy.15.b: "送上远更慷慨的礼物。"
 grand_embassy.16.title: "谨慎的掮客"
 grand_embassy.16.desc: "一位以替外国访客铺路为生的掮客提供服务，声称在此地与边境之间的每个哨所和海关都有关系。他说话小心地只说半句，从不真正点名谁欠他人情，只强调确有其事。只要付费，他可以确保关于使团去哪里、为什么去的问题少有人过问，而且如果被追问，答案会令人满意地模糊。"
 grand_embassy.16.a: "雇用掮客。"
 grand_embassy.16.b: "雇用掮客，并额外付钱买他的沉默。"
 grand_embassy.17.title: "口风不严"
 grand_embassy.17.desc: "我们随从中的一人在酒馆喝得酩酊大醉，急于在一桌陌生人面前表现，说了太多关于谁真正领导这支使团的话。到早上他甚至不记得说过，但酒馆老板记得，邻桌喝酒的每个人也记得。传闻已经在仆人厅堂中传播，带着对待藏不住的好秘密时特有的兴致。"
 grand_embassy.17.a: "现在也做不了什么了。"
 grand_embassy.17.b: "付钱压下传言。"
 grand_embassy.18.title: "在街上被认出"
 grand_embassy.18.desc: "一位多年前在更愉快的情况下曾在[ROOT.GetCountry.GetName]贸易的商人，在街上与使团擦肩而过，却猛地停住脚步，盯着[target_ruler.GetName]的脸多看了那么一瞬，随后一言不发匆匆离去。他脸上掠过的表情不会认错：不是闲来无事的好奇，而是骤然一惊的认出。他清清楚楚知道自己见到了谁，而他会不会把这个秘密藏在心里，完全不在我们掌控之中。"
 grand_embassy.18.a: "希望他守口如瓶。"
 grand_embassy.18.b: "找到他，给他一笔封口费。"
 grand_embassy.19.title: "好奇的客栈老板"
 grand_embassy.19.desc: "接待使团的客栈老板有太多问题，每个问题都带着刻意的漫不经心，仿佛早已猜到答案至关重要：为什么如此气派的随从却出行得如此朴素，为什么钱币总是随手备好、从不点数两遍，为什么问起事务时队伍中没人敢与他对视。他尚未起疑，只是好奇，像一个人翻转硬币检查是否被剪边一样在脑中翻转这些小异常。但这种状态恐怕维持不了多久了。"
 grand_embassy.19.a: "尽量少回答。"
 grand_embassy.19.b: "付他足够多的钱让他停止询问。"
 grand_embassy.20.title: "一封信被截获"
 grand_embassy.20.desc: "一封寄回家的信，直呼[target_ruler.GetName]之名，并比谨慎所允许的更详细描述使团真实目的，在信使和船之间失踪了。没有勒索信，没有指控，没有任何它去了哪里的迹象，这本身比有迹象更令人不安。它最终到了哪里，谁读了它，他们打算用现在知道的东西做什么，我们都无法说。"
 grand_embassy.20.a: "无法召回。"
 grand_embassy.20.b: "不惜花费找到并烧毁它。"
 grand_embassy.21.title: "为我们举办的宴会"
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle]为使团安排了一场宴会，祝酒、颂词和演讲足够填满一整天，每道菜都比上一道更精致，仿佛厨房在互相竞争。每道菜都必须称赞，每次祝酒都必须回敬，每位啰嗦的显贵都必须听完，无论他实际有多少话可说。拒绝是侮辱；出席就是把一天完全丢给仪式和满盘食物。"
 grand_embassy.21.a: "坐着熬过去。"
 grand_embassy.21.b: "溜走去看看更有用的东西。"
 grand_embassy.22.title: "被指派一名陪护"
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle]指派了一名官员引导使团的每一步：愉快、不知疲倦，并且完全决心让我们只看花园和画廊，无论对更多东西的请求措辞多么礼貌。他对每个问题都有现成答案，对每次沉默都有现成转移，只要谈话过于接近任何有用东西，就把话题引回喷泉和壁画。无论我们怎么问，工坊始终遥不可及。"
 grand_embassy.22.a: "跟着走。"
 grand_embassy.22.b: "以有身份的访客身份坚持要看更多。"
 grand_embassy.23.title: "漫长的觐见"
 grand_embassy.23.desc: "与一位低级官员的觐见拖了几个小时：交换恭维，欣赏礼物，没说什么实质内容，同样的几句客套以略有不同的顺序重复，直到完全失去意义。他似乎一点也不急，享受外国访客的关注远胜于他们可能讨论的任何实质。等它终于结束，做任何更有用事情的一天早已过去。"
 grand_embassy.23.a: "礼貌地忍受。"
 grand_embassy.23.b: "缩短觐见，权威见鬼去吧。"
 grand_embassy.24.title: "富有同情心的总管"
 grand_embassy.24.desc: "保管家庭每日记录的总管以做过这种事的人那种小心方式暗示，只要考虑合适，几个名字可以干脆不被记录。他不直接开口；他让沉默来问，并以熟练的耐心等我们填补。"
 grand_embassy.24.a: "付钱给总管让记录更轻。"
 grand_embassy.24.b: "付钱给总管让记录完全丢失。"
 grand_embassy.25.title: "诱饵谣言"
 grand_embassy.25.desc: "一支来自较小宫廷的对手使团几乎与我们同时抵达，引来远更多的闲话，因为他们吵闹、不微妙，且总体更容易谈论。在合适的仆人中间撒一点钱可以保持这样，把每条闲舌引向他们的来去而不是我们的。"
 grand_embassy.25.a: "撒一点钱。"
 grand_embassy.25.b: "撒大量钱。"
 grand_embassy.26.title: "沉默的护送"
 grand_embassy.26.desc: "一位当地向导熟悉哪些街道和门避开窥探的眼睛，以及哪些时辰守卫会视而不见，提出带领使团来去不被看见。他不问为什么需要如此小心，只问这对我们值多少。"
 grand_embassy.26.a: "雇用向导。"
 grand_embassy.26.b: "雇用向导，并额外付钱买更多谨慎。"
