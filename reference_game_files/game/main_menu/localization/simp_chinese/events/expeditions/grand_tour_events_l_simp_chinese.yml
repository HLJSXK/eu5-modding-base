 grand_tour_events.1.title: "壮游"
 grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]已集合，箱子已打包，护卫已在南下的路上组成。[ShowRegionName('italy_region')]在等待：古老的废墟之地、[ShowInstitutionName('renaissance')]学识，以及其政治艺术让北方显得年轻的宫廷。我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]在那里学到的东西将塑造这个王国一代人。唯一的问题是我们打算给[target_leader.GetHerHim]什么样的教育。"
 grand_tour_events.1.a: "它的宫廷将教[target_leader.GetHerHim]书本无法教的东西。"
 grand_tour_events.1.party: "在上路前花掉金币享受最后一夜狂欢。"
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName]是一个[target_location.GetRank.GetName]，它故意违抗地理而存在，建在泥沼上，浮在贸易上，由一个商人家庭组成的议会治理，这个议会比[ShowContinentName('europe')]的每个王朝都更长久。"
 grand_tour_events.2.desc.ducal_palace: "而奢华的公爵宫在泻湖上方闪耀着粉色，向所有人展示精致与奢华。"
 grand_tour_events.2.desc.heir_arrival: "我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]已抵达也许是[ShowContinentNameWithNoTooltip('europe')]中最国际化的[target_location.GetRank.GetNameWithNoTooltip]，在那里市场上说着地中海的各种语言，只要价格合适，任何情报都能买到。"
 grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip]，最尊贵共和国"
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$横跨东部地区的[ShowBuildingTypeName('venetian_arsenal')]可以在一个工作日内铺设军舰龙骨并让其完整下水。$grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$普通的造船厂排列在东部地区，[ShowContinentNameWithNoTooltip('europe')]每个港口常见的悠闲节奏生产商船船体和海战桨帆船。$grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.knowledge: "在[ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]学习海军工程。"
 grand_tour_events.2.experience: "参观建造[target_location.GetNameWithNoTooltip]海战桨帆船的造船厂。"
 grand_tour_events.2.connections: "参加[court_host.GetNameWithNoTooltip]举行的招待会。"
 grand_tour_events.2.party: "用账簿换取在运河狂欢者中的一夜。"
 grand_tour_events.2.historical_info: "1645年升天周期间，当时正在法兰西和意大利进行长期游历的英国绅士约翰·伊夫林，在威尼斯的一家公共剧院观看了一场歌剧#italic 《吕底亚的赫拉克勒斯》#!的演出。他的日记惊叹于布景竟变换了十三次，并特别提到女高音安娜·伦齐，不过他认为一名阉伶歌手比她还要出色，还称一位热那亚男低音“无可比拟”。在绘景透视与飞行机械之间，这场奇观“让我们目不转睛、洗耳恭听到凌晨两点”。次年春天他离开威尼斯，箱子里装满了书、版画和一罐罐该城著名的底野迦。"
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip]，[ShowInstitutionNameWithNoTooltip('renaissance')]的[target_location.GetRank.GetNameWithNoTooltip]"
 grand_tour_events.3.desc: "[target_location.GetName]比它之前的声誉更小，也更奇怪。这个[target_location.GetRank.GetName]嗡嗡作响着新思想：哲学家称之为古风的重生，商人称之为好生意，画家称之为光线落在灰泥上的方式。我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]抵达后发现，如果[target_leader.GetSheHe]没有被旅途弄得过于疲惫，宫廷今晚将接待外国访客。\n\n另外，还有一份邀请，去修道院图书馆，那里静静等待着西方基督教世界最非凡的[ShowCultureName('greek_culture')]手稿收藏。"
 grand_tour_events.3.knowledge: "寻求被引见给修院的学者。"
 grand_tour_events.3.experience: "参观[ShowGoodsNameWithNoTooltip('wool')]作坊和老桥金匠。"
 grand_tour_events.3.connections: "在[court_host.GetNameWithNoTooltip]的宫廷学习赞助的技艺。"
 grand_tour_events.3.party: "把手稿放在一边，去[target_location.GetNameWithNoTooltip]的赌桌赌博。"
 grand_tour_events.3.historical_info: "1764年秋天，体弱的苏格兰小说家托比亚斯·斯摩莱特参观了乌菲兹美术馆，站在所有其他壮游者都凭信仰赞美过的维纳斯·德·美第奇像前，写道：“我不禁认为维纳斯的容貌没有美，姿态笨拙且不合性格。”劳伦斯·斯特恩后来使这一爆发永垂不朽，让他的虚构人物约里克在罗马万神殿前与“斯梅尔冯格斯”对质，抱怨他“攻击了女神，把她用得比普通妓女还糟，毫无自然挑衅。”他们关于一尊大理石维纳斯的争吵比他们两人都活得久。"
 grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip]，永恒之城"
 grand_tour_events.4.desc: "[target_location.GetName]同时存在于两个时代。古罗马广场在冬草下敞开，其柱子以奇怪的角度立在牧牛场中间，大理石被过去一千年里每个需要它的承包商开采。在这一切之上，将作为整个基督教世界所在地的教堂高耸于现代[target_location.GetRank.GetName]的中心。\n\n[target_leader.GetName]可以把[target_leader.GetHisHer]时间花在废墟中或活人中间。教廷古老、隆重，并与[ShowContinentName('europe')]的每个[ShowReligionAdjective('catholic')]王座相连。"
 grand_tour_events.4.knowledge: "查阅梵蒂冈图书馆的手稿和人文主义者。"
 grand_tour_events.4.experience: "漫步古代废墟，测量纪念碑。"
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.party: "离开废墟，去[target_location.GetNameWithNoTooltip]的酒馆过一夜。"
 grand_tour_events.4.historical_info: "1764年10月15日，英国绅士爱德华·吉本，当时正在完成他自己的意大利壮游，坐在卡比托利欧山的废墟中沉思，赤脚的修士们在他以为是旧朱庇特神庙的地方唱晚祷。他后来在回忆录中写道，就在那里，在断裂的柱子和消逝的晚祷歌声中，“撰写这座城市衰亡史的想法第一次在我心中萌生。”他从那个罗马夜晚带走的念头，在回到英国后的二十年研究中，成长为#italic 《罗马帝国衰亡史》#!。"
 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip]，[target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.5.desc: "[target_location.GetName]是旅行的最南端，也是最古老的伟大[ShowCultureGroupName('italian_group')]宫廷，一个拥有百万灵魂的[target_location.GetRank.GetName]铺展在维苏威火山的阴影下，其历史层层叠叠：[ShowCultureName('greek_culture')]叠在[ShowCultureName('roman_culture')]、[ShowCultureName('norman')]甚至更近的统治者之上，只要知道往哪里看，每次征服都在建筑中可见。[target_country.GetGovernment.GetAdjective][target_country.GetGovernment.GetCourtTitle]接待访客的仪式让[ShowContinentName('europe')]北方的宫廷相比之下显得临时。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]已经见过[ShowLocationName('venice')]、[ShowLocationName('florence')]和[ShowLocationName('rome')]。这是最后一课。"
 grand_tour_events.5.knowledge: "在图书馆和废墟中度过最后几周。"
 grand_tour_events.5.experience: "加入挖掘被掩埋的赫库兰尼姆的挖掘者行列。"
 grand_tour_events.5.connections: "在[court_host.GetNameWithNoTooltip]的宫廷度过最后几周。"
 grand_tour_events.5.party: "用课程换取在[target_location.GetNameWithNoTooltip]酒馆的最后一夜。"
 grand_tour_events.5.historical_info: "1786年1月，赫斯特·皮奥齐与向导巴托洛梅奥——“维苏威的独眼巨人”——用绳子绑在一起攀登维苏威火山，并在半途的隐士小屋停下来休息。那位法国隐士突然认出了她：“夫人，我以前从未见过您吗？是的，我肯定见过，还给您做过头发，那时我在伦敦当理发师。”当她得知队伍中一个四岁男孩已经到达火山口边缘时，她羞愧地继续前进，皮奥齐坚持亲自去看冒烟的烟囱，并在她出版的旅行书信中记录了整个遭遇。"
 grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip]，古代竞技场之城"
 grand_tour_events.6.desc: "[target_location.GetName]在河流弯曲处崛起，其[target_location.GetRank.GetName]建在一座比[ShowRegionName('italy_region')]任何宫廷都古老的圆形剧场的长影中。罗马竞技场几乎完整矗立，其石阶爬升到屋顶之上，举办市场和集市，在罕见的节日里，还有几乎像它为之建造的比赛。\n\n这里有演讲厅和废墟，还有一个渴望接待来访[ROOT.GetCountry.GetGovernment.GetHeirTitle]的宫廷。"
 grand_tour_events.6.knowledge: "研究罗马废墟和竞技场的古代工程。"
 grand_tour_events.6.experience: "参观[ShowGoodsNameWithNoTooltip('marble')]采石场和沿阿迪杰河的河流贸易。"
 grand_tour_events.6.connections: "拜访[court_host.GetNameWithNoTooltip]和[target_location.GetRank.GetNameWithNoTooltip]的主要家族。"
 grand_tour_events.6.party: "无视圆形剧场，去下面的酒馆过一夜。"
 grand_tour_events.6.historical_info: "1785年4月抵达维罗纳时，赫斯特·皮奥齐发现罗马圆形剧场保存得如此完好，感到内心“明显振奋起来”，后来称这座城市是“我住过的最快乐的城镇”。一位带她参观爱乐学院古物的向导向她断言，英国自己的阿伦德尔大理石早已被煤烟毁坏，直到她认出这段话一字不差来自他背下来的导游手册#italic 《维罗纳图志》#!。她在出版的旅行记述中将这一欺骗记录为“背信弃义，带着极荒谬的偏见”。"
 grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip]，理想之城"
 grand_tour_events.7.desc: "[target_location.GetName]看起来不像自发形成的，事实也确非如此。宽阔笔直的大道穿过[target_location.GetRank.GetName]，一般中世纪城镇不可能有这种规整格局。城市得到精心规划，既供居住也供观赏。公爵剧院、印刷厂和流连宫廷的诗人都服务于同一个野心：让这个小小的[target_location.GetRank.GetNameWithNoTooltip]看起来像城市设计的未来。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现这里的宫廷对诗歌的兴趣不亚于治国。"
 grand_tour_events.7.knowledge: "阅读公爵图书馆收藏的骑士传奇。"
 grand_tour_events.7.experience: "参观公爵军械库和[target_location.GetRank.GetNameWithNoTooltip]的运河船闸。"
 grand_tour_events.7.connections: "在[court_host.GetNameWithNoTooltip]的宫廷观看演出。"
 grand_tour_events.7.party: "把公爵的诗放在一边，去外面过一个更热闹的夜晚。"
 grand_tour_events.7.historical_info: "1817年4月，当时正在意大利旅行的拜伦勋爵参观了费拉拉的圣安娜医院，并被带去看一间狭小的牢房，据说诗人托尔夸托·塔索在1580年代被阿方索二世·德·埃斯特公爵以疯癫为由关押在那里。拜伦觉得这遗物比附近阿里奥斯托自己的纪念碑更感人，第二天他创作了《塔索的哀歌》，一首表达诗人绝望的戏剧独白。这次访问成为浪漫主义时代最著名的壮游朝圣之一，将费拉拉衰落的埃斯特宫廷固定在旅行者的想象中。"
 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip]，博学之城"
 grand_tour_events.8.desc: "[target_location.GetName]教授法律和辩论的时间比基督教世界的任何其他地方都长，而[target_location.GetRank.GetName]公开炫耀其学识：柱廊两旁挤满来自各国的学生，讲堂比周围大多数教堂都古老。一位来访的[ROOT.GetCountry.GetGovernment.GetHeirTitle]即便在这里度过一生，仍无法穷尽法学家们写下的东西。\n\n如果政治比法学更吸引我们，这里也有一座宫廷可以参观。"
 grand_tour_events.8.knowledge: "在大学参加一场民法讲座。"
 grand_tour_events.8.experience: "参观使[target_location.GetNameWithNoTooltip]的丝线闻名的[ShowGoodsNameWithNoTooltip('silk')]作坊。"
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.party: "无视讲堂，去学生中间喝酒。"
 grand_tour_events.8.historical_info: "1739年，法国地方法官夏尔·德·布罗斯在意大利旅行时，在博洛尼亚劳拉·巴西家中度过了一个夜晚，她已是欧洲第一位拥有大学教席的女性，当地学者聚集在那里辩论电学的新科学。德·布罗斯后来回忆说，他不得不掸去生疏的学生时代拉丁语，才能在众人面前争论磁力和“带电物体的奇异吸引力”。他在他的#italic 《意大利书简》#!中记录了这个夜晚，而巴西的沙龙成为途经该城的壮游者最常造访的一站。"
 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip]，帕利奥之城"
 grand_tour_events.9.desc: "[target_location.GetName]横跨三道山脊，围绕一个贝壳形广场，其条纹大教堂从每条爬向它的街道都可见。[target_location.GetRank.GetName]在[ShowLocationName('florence')]超越它之前，靠[ShowGoodsName('wool')]和银行业积累了财富，而它从未真正原谅那次超越，这种竞争仍然影响着宫廷中的每一次谈话。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]及时抵达，观看一年两次填满广场的赛马，旗帜等等。"
 grand_tour_events.9.knowledge: "在大学参加一场教会法讲座。"
 grand_tour_events.9.experience: "研究壁画和[target_location.GetRank.GetNameWithNoTooltip]著名的银行账簿。"
 grand_tour_events.9.connections: "从[court_host.GetNameWithNoTooltip]的凉廊观看比赛。"
 grand_tour_events.9.party: "用壁画换取坎波广场的赌桌。"
 grand_tour_events.9.historical_info: "1764年秋天，小说家托比亚斯·斯摩莱特在从佛罗伦萨到罗马的旅途中在锡耶纳住了一晚，并在出版的#italic 《法国与意大利游记》#!中抱怨说他“被安排在一间像厕所一样臭的房子里，待遇平平”，并且“晚餐吃得很糟糕”。他承认这座城市“大而建得好”，并指出锡耶纳人“以他们的礼貌和方言的纯正自夸”，以至于外国游客住在那里纯粹是为了学习正确的意大利语发音。斯摩莱特的记述成为英国人对托斯卡纳壮游款待最著名的抱怨之一。"
 grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip]，斜塔之城"
 grand_tour_events.10.desc: "[target_location.GetName]建了一座无法直立的钟楼，却并未拆除，而是继续建造；[target_location.GetRank.GetName]把这处倾斜当成自豪而非缺陷。它曾是可与[ShowLocationName('genoa')]和[ShowLocationName('venice')]匹敌的海上强国，它的桨帆船如今消失了，但它的大学和大教堂广场仍在。\n\n一位来访的[ROOT.GetCountry.GetGovernment.GetHeirTitle]可以在这里学习，也可以像漫步曾经重要的港口一样轻松。"
 grand_tour_events.10.knowledge: "在大教堂广场的大学参加讲座。"
 grand_tour_events.10.experience: "参观旧军械库和阿尔诺河沿岸的皮革工人。"
 grand_tour_events.10.connections: "向[court_host.GetNameWithNoTooltip]引见我们自己。"
 grand_tour_events.10.party: "离开讲座，去港口酒馆过一夜。"
 grand_tour_events.10.historical_info: "1821年末，珀西和玛丽·雪莱在比萨定居，并说服拜伦勋爵加入他们，将他安置在伦加诺的兰弗兰基宫；与爱德华和简·威廉姆斯，以及后来的爱德华·特里劳尼一起，他们组成了后来被称为“比萨圈”的团体。拜伦带着马、狗和猴子的随从到来，这群人整个冬天都在起草一本文学杂志#italic 《自由》#!的计划。利·亨特终于在次年夏天抵达意大利，就在那年七月雪莱在托斯卡纳海岸溺亡的前几天登陆；雪莱在比萨建立的聚会在几个月内散去，使这座城市成为浪漫主义最著名的中转站之一。"
 grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip]，圣方济之城"
 grand_tour_events.11.desc: "[target_location.GetName]沿着绿色山坡攀升，围绕一座为保存出生于此的修士的遗骨而建的大教堂，这位修士一无所有，却给[target_location.GetRank.GetName]留下了西方最伟大的朝圣地之一。内部的壁画墙吸引着画家和朝圣者，数量相当。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]可以在壁画中或仍在遵守会规的修士中度过这次访问。"
 grand_tour_events.11.knowledge: "研究壁画和圣人的生平。"
 grand_tour_events.11.experience: "参观制作虔诚圣物和徽章的作坊。"
 grand_tour_events.11.connections: "与[court_host.GetNameWithNoTooltip]和小镇官员会面。"
 grand_tour_events.11.party: "把修士的陪伴放在一边，去镇上过更热闹的一夜。"
 grand_tour_events.11.historical_info: "1786年10月26日傍晚，约翰·沃尔夫冈·冯·歌德抵达亚西西，根据他在#italic 《意大利之旅》#!中的自述，他转身离开那座“像巴别塔一样层层堆叠的庞大教堂群”（那里保存着圣方济的圣髑），公开厌恶地抛弃了这个朝圣地。他反而爬上老城广场上的罗马密涅瓦神庙，称之为“我见过的第一座完整的古代纪念物”。歌德对阿西西最著名圣地的冷落，转而青睐一座异教神庙，成为壮游时代最令人震惊的个人评判之一。"
 grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip]，伊特鲁里亚之城"
 grand_tour_events.12.desc: "[target_location.GetName]高高坐落在其山上，周围环绕着伊特鲁里亚人在罗马重要之前很久就建起的城墙，而[target_location.GetRank.GetName]至今仍每天穿过他们的城门，不假思索。它的画家最近在[ShowRegionName('italy_region')]闯出了名堂，它的大学让讲堂座无虚席。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]可以根据兴趣，研究旧城墙或新绘画。"
 grand_tour_events.12.knowledge: "在大学学习，漫步古老的伊特鲁里亚城墙。"
 grand_tour_events.12.experience: "参观以马约利卡闻名的陶工作坊。"
 grand_tour_events.12.connections: "在[court_host.GetNameWithNoTooltip]的宫廷寻求引见。"
 grand_tour_events.12.party: "无视旧城墙，去学生酒馆过一夜。"
 grand_tour_events.12.historical_info: "1765年初，小说家托比亚斯·斯摩莱特从罗马返回佛罗伦萨时，他的马车开始陡峭地爬入佩鲁贾，疲惫的马匹开始随着马车的重量向后滑，把它拖向悬崖边缘。一个路人及时把一块大石头楔在一个轮子后面，止住了下滑，救了整个队伍，用斯摩莱特自己的话说，免于被摔成碎片。那天没有可换的马，斯摩莱特一家被迫在城里过夜，参观其教堂和当地之子彼得罗·佩鲁吉诺的画作，然后继续前往佛罗伦萨的路。"
 grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip]，多瑙河之城"
 grand_tour_events.13.desc: "[target_location.GetName]守卫着来自[ShowRegionName('italy_region')]、[ShowRegionName('balkan_region')]和[ShowLanguageName('german_language')]土地的道路交汇的河流渡口，而[target_location.GetRank.GetName]靠通行税变得富有。公爵的霍夫堡宫占据其中心，这是一个自认为不仅仅是地区性的宫廷。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]终于越过了阿尔卑斯山；从这里出发的道路更容易。"
 grand_tour_events.13.knowledge: "参观大教堂学校，拜访城市学者。"
 grand_tour_events.13.experience: "参观军械库和多瑙河沿岸的船夫码头。"
 grand_tour_events.13.connections: "在霍夫堡宫向[court_host.GetNameWithNoTooltip]引见我们自己。"
 grand_tour_events.13.party: "用大教堂学校换取多瑙河畔的一夜。"
 grand_tour_events.13.historical_info: "1775年，医生约翰·摩尔陪同年轻的汉密尔顿公爵游览维也纳。两人被约瑟夫二世皇帝私下接见，然后在美泉宫被玛丽亚·特蕾莎皇后本人接见。摩尔注意到，当国家首相考尼茨亲王得知摩尔十四岁的儿子一并随行，这孩子还坚持要求皇帝和皇后也接见他后，宫廷传说中的僵硬规矩就松了下来。摩尔还记下一则旧宫廷故事，关于八年前袭击哈布斯堡家族的天花疫情：皇后的一位女儿得知自己染上这种病，立即要了一面镜子，平静地和即将被疾病毁掉的美貌告别。"
 grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip]，金色之城"
 grand_tour_events.14.desc: "[target_location.GetName]铺展在伏尔塔瓦河两岸，其石桥连接老城和城堡山，而[target_location.GetRank.GetName]举止像帝国的首都。山上的大学吸引着来自[ShowLanguageName('german_language')]土地每个角落及更远地方的学生。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现一座用世纪而非季节衡量自身重要性的城市。"
 grand_tour_events.14.knowledge: "在山上大学参加讲座。"
 grand_tour_events.14.experience: "参观玻璃厂和黄金巷的金匠。"
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.14.party: "离开大学，去河畔酒馆过一夜。"
 grand_tour_events.14.historical_info: "1775年，医生约翰·摩尔陪同年轻的汉密尔顿公爵游览波希米亚。当二人行走在布拉格街头时，，一位属于该城神学院的过路神父听到他们谈话，随即表示：“我向你们保证，我也是爱尔兰人。”当被问及如何如此迅速地认出他们的国籍时，神父回答说一听到他们说英语就知道了。他在余下的访问中成为二人的向导，一度向他们展示1618年两位贵族及其秘书被扔出的总理府窗户，摩尔挖苦地将这一先例推荐给各地政治家。"
 grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip]，修士之城"
 grand_tour_events.15.desc: "[target_location.GetName]的名字就来自那些在公爵们在其旁建市场和铸币厂之前就定居于此的修士，而[target_location.GetRank.GetName]此后发展了很多。维特尔斯巴赫家族的公爵宫廷让[target_location.GetRank.GetNameWithNoTooltip]比大多数地方更有秩序，当地酿酒师让它供应充足。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]会发现学者和一个管理良好的宫廷都在等待。"
 grand_tour_events.15.knowledge: "参观大教堂学校和城市编年史家。"
 grand_tour_events.15.experience: "参观公爵军械库和[ShowGoodsNameWithNoTooltip('salt')]贸易仓库。"
 grand_tour_events.15.connections: "向[court_host.GetNameWithNoTooltip]的公爵宫廷引见我们自己。"
 grand_tour_events.15.party: "把编年史放在一边，去酿酒师中间过一夜。"
 grand_tour_events.15.historical_info: "1786年，作家赫斯特·林奇·皮奥齐与丈夫在漫长的欧洲大陆蜜月旅行中经过慕尼黑，在从因斯布鲁克翻越阿尔卑斯山一夜后于黎明抵达，并停下来参观选帝侯的画廊和珍奇柜。一位当地收藏家向她展示的作品中，有一幅用类似纺出的蛛丝渲染的圣母与圣婴的精细图像，细到肉眼无法分辨其人物，只有在显微镜下才可见。皮奥齐惊奇地记录了这一展示，惊叹于在如此精致而不实用的工艺上花费的巨大心血。"
 grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip]，塞纳河之城"
 grand_tour_events.16.desc: "[target_location.GetName]横跨其河流，围绕一座以伟大教堂为冠的岛屿，而[target_location.GetRank.GetName]比我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]在这次旅行中见过的几乎任何地方都大。左岸的大学区向比大多数城市人口还多的学生教授神学和法律。\n\n王室宫廷在接待访客时，其正式程度让人毫不怀疑它对自己的看法。"
 grand_tour_events.16.knowledge: "在左岸大学参加辩论。"
 grand_tour_events.16.experience: "参观大学附近的书装店和印刷店。"
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.16.party: "不去辩论，去左岸的酒馆。"
 grand_tour_events.16.historical_info: "1763年10月，小说家托比亚斯·斯摩莱特在巴黎逗留期间，看着一辆出租马车在通往舒瓦西的路上停下，下来五六个武装人员，每人分别在一棵树后占据位置。斯摩莱特以为他们是追捕罪犯的强盗或官员，便问仆人他们是谁，却得知他们是城里的绅士，专程出城进行一日野兔狩猎，从隐蔽处射击经过的任何猎物。斯摩莱特觉得整个景象怪诞，但冷冷地指出这至少是清空田野里野兔的有效方法。"
 grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip]，集市之城"
 grand_tour_events.17.desc: "[target_location.GetName]位于两条河流交汇处，而[target_location.GetRank.GetName]把这一汇流变成了财富：来自[ShowRegionName('italy_region')]、[ShowCultureGroupName('german_group')]土地和佛兰德的商人都汇聚于此参加皇家集市，那时街道上挤满的[ShowGoodsName('silk')]和[ShowGoodsName('dyes')]比仓库能容纳的还多。这里的印刷机几乎和织布机一样快。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]抵达后发现一座靠商业而非仪式运转的城市。"
 grand_tour_events.17.knowledge: "寻找聚集在印刷厂的人文主义诗人。"
 grand_tour_events.17.experience: "参观印刷厂和商人的账簿。"
 grand_tour_events.17.connections: "拜访[court_host.GetNameWithNoTooltip]和[target_location.GetRank.GetNameWithNoTooltip]的主要商人。"
 grand_tour_events.17.party: "把账簿放在一边，去狂欢者中过一夜。"
 grand_tour_events.17.historical_info: "1763年10月，小说家托比亚斯·斯摩莱特在南下意大利途中抵达里昂，并在后来出版为#italic 《法国与意大利游记》#!的书信中记录了这次访问。他被带到一家客满的旅馆，然后被领到一家酒馆，三个破房间要每天十二里弗，膳食还要三十二里弗；对这种宰客行为感到愤怒，他一言不发地离开，直接驱车前往另一家客栈。斯摩莱特对里昂漫天要价的客栈老板的记述成为他书中最常被引用的段落之一，是前往意大利的英国旅行者的主要抱怨。"
 grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip]，十字路口之城"
 grand_tour_events.18.desc: "[target_location.GetName]的名字来自在此交叉的道路，而[target_location.GetRank.GetName]仍然服务于同样的目的，横跨将[ShowLanguageName('french_language')]地区与[ShowLanguageName('german_language')]地区分开的河流。其大教堂尖塔比我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]在整个旅行中见过的任何东西都高，一座单独的塔楼，匹配的第二座从未建造。\n\n这座自由城市自治，其印刷商最近开始变得和商人一样重要。"
 grand_tour_events.18.knowledge: "参加约翰内斯·施图尔姆文理中学的讲座。"
 grand_tour_events.18.experience: "爬上大教堂塔楼，参观印刷作坊。"
 grand_tour_events.18.connections: "与[court_host.GetNameWithNoTooltip]和市议会会面。"
 grand_tour_events.18.party: "离开印刷厂，去尖塔下过一夜。"
 grand_tour_events.18.historical_info: "1770年代初，苏格兰医生约翰·摩尔作为汉密尔顿公爵的伴侣游览欧洲大陆，爬上了斯特拉斯堡大教堂466英尺高的尖塔，并在#italic 《法国、瑞士和德国社会与风俗见闻录》#!中记录了他的访问。他描述了与人群一起等待路易十五的私生子参加弥撒，却因贵族未到而正午钟声敲响，会众未闻布道便散去，然后他听到了一场关于激情暴政的激烈布道。摩尔还注意到大教堂的大号角，每晚吹响，以纪念向导们仍归咎于四个世纪前一场屠杀的阴谋。"
 grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip]，地中海之门"
 grand_tour_events.19.desc: "[target_location.GetName]在罗马存在之前就已是港口，由看到港口就再也没离开的[ShowCultureName('greek_culture')]水手建立，而[target_location.GetRank.GetName]每个角落仍然闻得到盐和焦油味。来自半个地中海的桨帆船挤满其滨水区，市场上出售从未见过[GetCountry('FRA').GetName]内陆的商品。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现海洋本身才是[target_location.GetRank.GetNameWithNoTooltip]的真正统治者。"
 grand_tour_events.19.knowledge: "研究纪念[target_location.GetRank.GetNameWithNoTooltip]的[ShowCultureNameWithNoTooltip('greek_culture')]创建者的铭文。"
 grand_tour_events.19.experience: "参观港口，与地中海水手交谈。"
 grand_tour_events.19.connections: "拜访[court_host.GetNameWithNoTooltip]。"
 grand_tour_events.19.party: "用流言换取码头酒馆的一夜。"
 grand_tour_events.19.historical_info: "1765年5月，小说家托比亚斯·斯摩莱特在穿越普罗旺斯的回程中抵达马赛，并在后来出版为#italic 《法国与意大利游记》#!的书信中描述了这座港口城市。在港口码头漫步时，他看着王室出租的桨帆船奴隶在小租棚里从事手艺，一只脚被锁住，但用他的话说：“生活得很好，看起来像鞋匠、银匠和书商一样快乐”。斯摩莱特评价马赛是一座高贵而繁荣的城市，尽管他抱怨客栈老板每餐向他收四里弗。"
 grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip]，奥古斯都之城"
 grand_tour_events.20.desc: "[target_location.GetName]以建立它的皇帝的名字命名，这座[target_location.GetRank.GetName]从未停止发展。这里的银行调动的金额，足以让某些王室国库相形见绌，帝国议会召开之频繁，已让这座[target_location.GetRank.GetNameWithNoTooltip]习惯了接待诸侯。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]抵达后发现，在这里金钱和血统一样公开讨论。"
 grand_tour_events.20.knowledge: "查阅城市的古物和人文主义手稿。"
 grand_tour_events.20.experience: "研究各大银行的账簿。"
 grand_tour_events.20.connections: "参加[court_host.GetNameWithNoTooltip]举办的招待会。"
 grand_tour_events.20.party: "把账簿放在一边，去赌桌。"
 grand_tour_events.20.historical_info: "1772年7月15日早晨，英国音乐史学家查尔斯·伯尼彻夜赶路后抵达奥格斯堡，径直前往大教堂，在那里听到一场德语布道，以及两个唱诗班为庆祝节日而演唱的弥撒。他欣赏那些歌手，却觉得管风琴师的和声如此粗劣牵强，以至于这场演出像是折磨耳朵；而在举扬圣体时，一阵粗野的鼓号齐鸣让他吃了一惊——这种习俗他除了在安特卫普，别处从未听过。得知他捎带信件的那位乐长不在城里，为撰写音乐史而收集材料的伯尼没有久留。"
 grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip]，主教座堂之城"
 grand_tour_events.21.desc: "[target_location.GetName]建造主教座堂的时间比任何活着的人记得的都长，一座未完成的塔楼矗立在[target_location.GetRank.GetName]上方，顶部仍停着石匠留下的一台起重机。莱茵河经过这座[target_location.GetRank.GetNameWithNoTooltip]的贸易几乎比[ShowLanguageName('german_language')]土地的任何其他地方都多，这里的总主教像任何诸侯一样统治。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现了一座用世纪衡量耐心的城市。"
 grand_tour_events.21.knowledge: "参观主教座堂工程和大学的学者。"
 grand_tour_events.21.experience: "参观为莱茵兰教堂铸钟的铸造厂。"
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.21.party: "无视主教座堂工程，去莱茵河畔过一夜。"
 grand_tour_events.21.historical_info: "1794年9月，小说家安·拉德克利夫与丈夫游览莱茵兰时抵达科隆，此行记录在她出版的游记#italic 《1794年夏日旅行》#!中。她发现这座城市挤满了逃离向列日和马斯特里赫特推进的法国军队的难民，街道上满是载着伤者和垂死者的医院马车。每家客栈都满了；同行旅人因找不到房间，只能睡在马车里、台球桌上和躺椅上。拉德克利夫后来写道，这一幕比她读过的任何战役都更能让她了解战争的真实代价。"
 grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip]，巴尔喀诺城"
 grand_tour_events.22.desc: "[target_location.GetName]的城墙可追溯到最初矗立于此的罗马殖民地，而[target_location.GetRank.GetName]已发展成为此海岸最繁忙的港口，其港口挤满穿越西地中海贸易[ShowGoodsName('wool')]、香料和[ShowGoodsName('dyes')]的桨帆船。它自己的海事法典被从未踏足该城的船长们参考。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]几乎完成了漫长的归途。"
 grand_tour_events.22.knowledge: "参加一场关于加泰罗尼亚#italic 地方议会#!法律的讲座。"
 grand_tour_events.22.experience: "研究保存在商人交易所的海事法典。"
 grand_tour_events.22.connections: "向[court_host.GetNameWithNoTooltip]的宫廷引见我们自己。"
 grand_tour_events.22.party: "用海事法典换取码头酒馆。"
 grand_tour_events.22.historical_info: "1775年10月末，英国古物学家亨利·斯温伯恩在城门夜间关闭前抵达巴塞罗那，他在#italic 《1775—1776年西班牙游记》#!中叙述了这一插曲。在拜会总督后，他去了剧院，起初抱怨“沉闷已在这个舞台上建立王座”，几天后却被一场穿着旧西班牙服装演出的#italic 《熙德·坎佩亚多尔》#!的生动表演征服。他还视察了城堡，指出之所以选择这片低洼、潮湿、蚊虫肆虐的地方，并不是为了健康，而是为了震慑下方的城市。"
 grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip]，众王之城"
 grand_tour_events.23.desc: "[target_location.GetName]以其城堡为所在山丘加冕，而国王们在城堡中加冕和下葬，这座[target_location.GetRank.GetName]以同样的庄重对待这两种仪式。它的大学比说[ShowLanguageName('german_language')]的土地的大多数大学都更古老，向来自周边各地的学生教授天文学和法律，而[ShowGoodsName('amber')]和[ShowGoodsName('salt')]贸易让它的市场全年繁忙。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现，这是回家前的最后一个重要停靠点。"
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.23.experience: "参观商人交易货物的布厅。"
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.23.party: "离开讲堂，去城堡附近过一夜。"
 grand_tour_events.23.historical_info: "1778年7月25日，威廉·考克斯，作为年轻的赫伯特勋爵在穿越北欧和东欧的长期壮游中的旅行导师，越过维斯瓦河进入克拉科夫，发现这座古老的波兰首都因近期的围城而布满炮弹和霰弹留下的伤痕，其宏伟的房屋沦为废墟。他参观了由卡齐米日大帝创建的大学，图书管理员向他展示了一本本身价值不高，却作为珍品备受珍视的土耳其语书籍：它是在霍京战役中作为战利品缴获的，由约翰·索别斯基国王本人赠送给大学，以纪念那场拯救了波兰并为他赢得王位的胜利。"
 grand_tour_events.24.title: "下一站？"
 grand_tour_events.24.desc: "从[target_location.GetName]出发，有几条路可走。[target_leader.GetName]必须决定这趟旅程继续走哪条路：深入[ShowRegionName('italy_region')]，还是回家。"
 grand_tour_events.24.a: "绕道去[ShowLocationNameWithNoTooltip('verona')]。"
 grand_tour_events.24.b: "改为前往[ShowLocationNameWithNoTooltip('ferrara')]。"
 grand_tour_events.24.c: "转道[ShowLocationNameWithNoTooltip('bologna')]。"
 grand_tour_events.24.d: "继续前往[ShowLocationNameWithNoTooltip('florence')]。"
 grand_tour_events.24.e: "在[ShowLocationNameWithNoTooltip('siena')]中途停留。"
 grand_tour_events.24.f: "先顺路去[ShowLocationNameWithNoTooltip('pisa')]。"
 grand_tour_events.24.g: "转向[ShowLocationNameWithNoTooltip('assisi')]。"
 grand_tour_events.24.h: "改为前往[ShowLocationNameWithNoTooltip('perugia')]。"
 grand_tour_events.24.i: "继续前往[ShowLocationNameWithNoTooltip('rome')]。"
 grand_tour_events.24.j: "继续前往[ShowLocationNameWithNoTooltip('naples')]。"
 grand_tour_events.24.k: "这次旅行看够了。回家。"
 grand_tour_events.25.title: "归途"
 grand_tour_events.25.desc: "旅程终于转向回家。与其原路返回整个南方路线，[target_leader.GetName]必须选择在最后一段路程前在哪里中途停留：一个让马匹休息的地方，或许还能在返回前得到另一个宫廷的接待。"
 grand_tour_events.25.desc.second: "一次停留不足以称之为回家。在道路最终通向[ROOT.GetCountry.GetCapital.GetName]之前，[target_leader.GetName]选择再在一个城市中途停留：再拜访最后一个宫廷、再观赏最后一个奇观，然后旅行才真正结束。"
 grand_tour_events.25.a: "在[ShowLocationNameWithNoTooltip('vienna')]中途停留。"
 grand_tour_events.25.b: "在[ShowLocationNameWithNoTooltip('prague')]让马匹休息。"
 grand_tour_events.25.c: "经[ShowLocationNameWithNoTooltip('munich')]回家。"
 grand_tour_events.25.d: "在最后一段路程前在[ShowLocationNameWithNoTooltip('paris')]停留。"
 grand_tour_events.25.e: "回家路上经过[ShowLocationNameWithNoTooltip('lyon')]。"
 grand_tour_events.25.f: "在转向内陆前渡到[ShowLocationNameWithNoTooltip('london')]。"
 grand_tour_events.25.g: "先在[ShowLocationNameWithNoTooltip('strasbourg')]停留一下。"
 grand_tour_events.25.h: "路线经过[ShowLocationNameWithNoTooltip('marseille')]。"
 grand_tour_events.25.i: "在最后一段路程去一下[ShowLocationNameWithNoTooltip('augsburg')]。"
 grand_tour_events.25.k: "在[ShowLocationNameWithNoTooltip('cologne')]休息一会儿。"
 grand_tour_events.25.l: "经[ShowLocationNameWithNoTooltip('barcelona')]航行回家。"
 grand_tour_events.25.n: "在[ShowLocationNameWithNoTooltip('orleans')]中途停留。"
 grand_tour_events.25.o: "在回家最后一段路程经过[ShowLocationNameWithNoTooltip('krakow')]。"
 grand_tour_events.25.p: "别再耽搁了。直接回家。"
 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip]，泰晤士河之城"
 grand_tour_events.26.desc: "[target_location.GetName]沿着其河流铺展在罗马人最早建起的城墙之后，而[target_location.GetRank.GetName]此后已远远超出城墙，其桥上挤满了自己的房屋和商店。[ShowGoodsName('wool')]贸易填满其仓库，议会经常开会，以至于[target_location.GetRank.GetNameWithNoTooltip]已习惯承办王国事务。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现一个和大陆任何宫廷一样雄心勃勃的宫廷。"
 grand_tour_events.26.knowledge: "在律师学院参加一场关于普通法的诵读。"
 grand_tour_events.26.experience: "参观[ShowGoodsNameWithNoTooltip('wool')]商人和城市行会大厅。"
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.party: "把行会大厅放在一边，去[target_location.GetNameWithNoTooltip]的酒馆过一夜。"
 grand_tour_events.26.historical_info: "1765年，法国地方法官兼文人皮埃尔‑让·格罗斯利在伦敦待了将近一年，为后来翻译为#italic 《伦敦之行》#!的书籍收集素材。据他记载，他曾看到一位国务大臣在赌桌旁连续度过二十四小时，全程只靠夹在两片烤面包之间的冷牛肉维持体力。“这道新菜，”格罗斯利写道，“在我旅居伦敦期间大为流行，”此后以其发明者的名字闻名。这则轶事，无论是否经过润色，都成了他的《伦敦之行》中被引用最多的句子。"
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip]，卢瓦尔河之城"
 grand_tour_events.27.desc: "[target_location.GetName]位于卢瓦尔河向北弯曲然后转回大海的地方，长期以来，这座[target_location.GetRank.GetName]从河流带来的交通便利中获益颇丰。它的大学教授法律的严谨程度几乎不亚于[ShowLocationName('bologna')]大学，而它的城墙抵挡住了其他城市未能幸存的围城。\n\n我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]发现这里的学者和士兵都有故事可讲。"
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.experience: "参观酒窖和卢瓦尔河船夫行会。"
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.party: "不去法律讲座，去河边酒馆。"
 grand_tour_events.27.historical_info: "1644年4月，年轻的日记作家约翰·伊夫林在奥尔良中断了沿卢瓦尔河而下的旅程，这成为最早有记录的壮游之一。他参观了那座古老的大学，当时学生仍被划分为四个历史性的“民族”：法兰西、诺曼、皮卡第和高地德意志，每个都有自己的官员，他还使用了城中的两座公共图书馆，并评论说学者只需留下一张签名便条，就能把书借回自己的住处——这种慷慨令他惊叹。他还看到了圣十字协同教堂，它曾经气派非凡，但如今仍清晰可见近期内战留下的伤痕。"
 grand_tour_events.28.title: "学习机会"
 grand_tour_events.28.desc.university: "消息传到随行人员那里，[target_location.GetName]大学的学生中可以为[target_leader.GetName]安排一个位置：讲座、辩论，以及学者的陪伴，他们的名字将在这趟旅行被遗忘很久之后仍被铭记。"
 grand_tour_events.28.desc.scholar: "消息传到随行人员那里，[target_location.GetName]有一位学者，其声誉吸引着整个大陆的学生，只要给出合适的报酬，并且学生资质符合要求，或许会同意让[target_leader.GetName]在其门下学习一段时间。"
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.29.title: "讲座结束"
 grand_tour_events.29.desc: "数月的学习接近尾声，[target_leader.GetName]必须决定在[target_location.GetName]真正学到了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.30.title: "战场机会"
 grand_tour_events.30.desc: "我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]得知[target_country.GetLongName]正在打仗，其军官团愿意接受有合适引荐的访客。[target_leader.GetName]不会拥有真正的指挥权，也不会对士兵遭遇的事情负责，但可以骑马伴随经验丰富的军官，亲眼观看一场战役，并学到从任何战略书籍中都学不到的东西。"
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.31.title: "战役结束"
 grand_tour_events.31.desc: "作战季节接近尾声，[target_leader.GetName]必须决定从[target_location.GetName]的军官那里真正学到了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.32.title: "人脉机会"
 grand_tour_events.32.desc: "[target_leader.GetName]受到邀请，以宾客身份在接下来的一季里住进[target_country.GetLongName]的宫廷：届时将提供宫中居所、所有招待会的常设邀请，并引荐给每一个值得结识的廷臣和来访的外交官。"
 grand_tour_events.32.desc.no_owner: "[target_leader.GetName]受到邀请，以宾客身份在接下来的一季里住进[target_location.GetName]当地最显赫的家族宅邸：引见给每一位值得认识的显要，并随时列席他们的宴席。"
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.33.title: "宫廷季节结束"
 grand_tour_events.33.desc: "宫廷季节接近尾声，[target_leader.GetName]必须决定从[target_location.GetName]结识的人那里真正获得了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.33.a: "反思所得，继续旅程。"
 grand_tour_events.34.title: "学剑机会"
 grand_tour_events.34.desc: "我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]得知，[target_location.GetName]藏有一位真正有名望的剑术大师，愿意收一位有前途的学生一季。[target_leader.GetName]不会参加任何有实质意义的决斗，也不会解决任何真正的争吵，但可以学习步法、时机，以及任何兵器手册都教不会的勇气。"
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.35.title: "课程结束"
 grand_tour_events.35.desc: "一季的课程接近尾声，[target_leader.GetName]必须决定从[target_location.GetName]进行的对练中真正学到了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.36.title: "家书"
 grand_tour_events.36.desc: "一封来自[ROOT.GetCountry.GetName]的信终于追上旅途队伍。它带来[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的温情话语，说宫廷对[target_leader.GetName]评价很好，也认可[target_leader.GetHerHim]在国外的表现，这在国内已经不止一次成为晚餐桌上的话题。"
 grand_tour_events.36.a: "小小庆祝纪念一下。"
 grand_tour_events.36.b: "我们没有时间理会老家的宫廷。"
 grand_tour_events.37.title: "当地爱慕者"
 grand_tour_events.37.desc: "[gt_admirer.GetName]，一位显然被[target_leader.GetHerHis]地位和教养吸引的当地年轻贵族，找到了[target_leader.GetHerHim]，渴望在[target_leader.GetHerHis]访问[target_location.GetName]期间有所用处。"
 grand_tour_events.37.a: "让[target_leader.GetHerHim]被引见给合适的人。"
 grand_tour_events.37.b: "接受[gt_admirer.GetHerHis]赠送的精美衣服，适合旅行。"
 grand_tour_events.37.c: "接受[gt_admirer.GetHerHis]邀请，前往其家中做客。"
 grand_tour_events.38.title: "有用的引见"
 grand_tour_events.38.desc: "在一次晚宴上，[target_leader.GetName]被安排坐在[gt_secretary.GetName]旁边。这个年轻人并不起眼，很少谈自己，直到一句偶然的话透露他是[target_cardinal.GetName]枢机的秘书。他无意中透露，如果今晚留下的印象合适，他的一句话就能让[target_leader.GetNameWithNoTooltip]被枢机本人接见。"
 grand_tour_events.38.a: "争取引见，冒留下尴尬印象的风险。"
 grand_tour_events.38.b: "全力争取，尴尬见鬼去吧。"
 grand_tour_events.38.c: "享受夜晚，就此打住。"
 grand_tour_events.39.title: "洞察时刻"
 grand_tour_events.39.desc: "在[target_location.GetName]的一场辩论中，[target_leader.GetName]的一个论点突然展现出极具洞察力的天才思路，聚集的学者们沉默下来，然后点头赞同。"
 grand_tour_events.39.a: "进一步推进，如果出错可能招致嘲笑。"
 grand_tour_events.39.b: "推到极限，嘲笑见鬼去吧。"
 grand_tour_events.39.c: "今天表现不错。就此打住。"
 grand_tour_events.40.title: "技巧展示"
 grand_tour_events.40.desc: "在[target_location.GetName]击剑学校的一场对练中，[target_leader.GetName]发现了一个没有教练教过的破绽，一时间整个房间都看着[target_leader.GetSheHe]如何利用它。"
 grand_tour_events.40.a: "继续进攻，冒摔得难看的风险。"
 grand_tour_events.40.b: "强行交锋，受伤见鬼去吧。"
 grand_tour_events.40.c: "抓住机会，就此打住。"
 grand_tour_events.40.injury_tt: "[target_leader.GetName]摔得很重，卧床休养，照料淤青和自尊"
 grand_tour_events.41.title: "疾病"
 grand_tour_events.41.desc: "[target_leader.GetName]患上严重腹泻，医生怀疑是当地水质引起的。医生向随行人员保证没有生命危险，但可能得要[target_leader.GetHerHim]卧床几日，而且他们的诊疗可不便宜。"
 grand_tour_events.41.a: "请一位医生。"
 grand_tour_events.41.b: "请最好的医生。"
 grand_tour_events.41.c: "让它自然发展。"
 grand_tour_events.42.title: "思乡"
 grand_tour_events.42.desc: "逗留的新鲜感已经消退，[target_leader.GetName]发现[target_leader.GetHerHis]思绪飘回家，尤其是[target_parent.GetName]。这对[target_leader.GetHerHis]的注意力毫无帮助。"
 grand_tour_events.42.a: "写信回家给[target_parent.GetHerHim]，附上一份小礼物。"
 grand_tour_events.42.b: "委托画一幅肖像送给[target_parent.GetHerHim]。"
 grand_tour_events.42.c: "放弃旅行，回家到[target_parent.GetHerHim]身边。"
 grand_tour_events.43.title: "代价高昂的失礼"
 grand_tour_events.43.desc: "事后才得知，[target_leader.GetName]在昨晚的招待会上不合时宜地向当地长官致意，房间里所有人都看见这次显而易见的礼宾失误，唯独随行人员浑然不觉。东道主不大可能在没有任何致歉的情况下忘掉这件事，但笨拙的致歉举动很容易让事态进一步恶化。"
 grand_tour_events.43.a: "送一份小礼物作为道歉，冒它毫无效果的风险。"
 grand_tour_events.43.b: "做出盛大的道歉姿态。"
 grand_tour_events.43.c: "让事情过去。"
 grand_tour_events.44.title: "腐败的守夜人"
 grand_tour_events.44.desc: "入夜后，[target_leader.GetName]在小巷里被穿着城市守夜人制服的人袭击，这些人比起他们誓言维护的法律，更感兴趣的是陌生人的钱袋。"
 grand_tour_events.44.a: "早上向长官告发守夜人。"
 grand_tour_events.44.b: "在小巷里与守夜人决斗。"
 grand_tour_events.44.c: "逃到街上，大声呼救。"
 grand_tour_events.44.d: "交出钱包，然后离开。"
 grand_tour_events.45.title: "同行旅人"
 grand_tour_events.45.desc: "在一家热闹客栈的人群中，我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]与[gt_friend.GetName]交谈起来，后者是一位来自祖国的年轻贵族，为了大致相同的原因走着大致相同的路线。两人立刻投缘，分享关于他们的国家和旅行的故事，直到道路再次把他们分开，各自前往不同的城市。"
 grand_tour_events.45.a: "一段美好友谊正在形成。"
 grand_tour_events.45.b: "祝他好运，我们只管和自己人待在一起。"
 grand_tour_events.friendship_up_1_tt: "与[gt_friend.GetName]的友谊加深（#G +1#!友谊）"
 grand_tour_events.friendship_up_2_tt: "与[gt_friend.GetName]的友谊大大加深（#G +2#!友谊）"
 grand_tour_events.friendship_down_1_tt: "与[gt_friend.GetName]的友谊降温（#R ‑1#!友谊）"
 grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName]，我们的继承人在途中结交的朋友，愿意跟随[heir.GetHerHim]回到我们的宫廷"
 grand_tour_events.friend_reunion_intro: "机缘巧合之下，[gt_friend.GetName]也来到了[target_location.GetName]，两位朋友在分别一段时间后再次相遇，谈话像不会停止一样持续。"
 grand_tour_events.46.title: "患难之交"
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$[gt_friend.GetSheHe]承认，[gt_friend.GetHerHis]的钱包已被一连串牌桌坏运气掏空；[gt_friend.GetSheHe]非常尴尬地问，在债务变成丑闻之前，是否有任何办法我们可以帮忙。"
 grand_tour_events.46.a: "悄悄从我们自己的钱包里掏钱替[gt_friend.GetHerHis]还债。"
 grand_tour_events.46.b: "写信给我们的联系人，让他们给[gt_friend.GetHerHim]贷款。"
 grand_tour_events.46.c: "祝[gt_friend.GetHerHim]好运，让[gt_friend.GetHerHim]自己找[gt_friend.GetHerHis]的出路。"
 grand_tour_events.47.title: "共同发现"
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$在追述各自分别后学到的东西时，[gt_friend.GetNameWithNoTooltip]坦言自己对一篇讲稿感到困惑，那篇文章在我们自己的研究中早已明了，对方请我们帮忙理清其中的含义。"
 grand_tour_events.47.a: "坐下来解释，利用我们已经知道的东西。"
 grand_tour_events.47.b: "雇一位导师带[gt_friend.GetHerHim]过一遍。"
 grand_tour_events.47.c: "告诉[gt_friend.GetHerHim]这很简单，让[gt_friend.GetHerHim]自己解决。"
 grand_tour_events.48.title: "在正确的人耳边说句话"
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$[gt_friend.GetNameWithNoTooltip]听说[target_location.GetNameWithNoTooltip]有一个私人沙龙，[target_location.GetRank.GetName]的豪门子弟在那里聚会，但没有熟人能为[gt_friend.GetHerHim]引荐。但[target_leader.GetName]凭借在旅行中建立的关系，则完全是另一回事。"
 grand_tour_events.48.a: "传话给我们的熟人，为[gt_friend.GetHerHim]担保。"
 grand_tour_events.48.b: "花钱让[gt_friend.GetHerHis]进入一个较小的聚会。"
 grand_tour_events.48.c: "告诉[gt_friend.GetHerHim]要进去就自己想办法。"
 grand_tour_events.49.title: "暴力威胁"
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$重聚迅速变糟：[gt_friend.GetNameWithNoTooltip]得罪了一个当地放债人，那人现在带着两个雇来的打手站在客栈他们的桌旁，承诺除非今晚还清债务，否则要打断的就不只是家具了。"
 grand_tour_events.49.a: "我们自己介入；我们知道怎么对付这种人。"
 grand_tour_events.49.b: "直接付清欠款，就此了结。"
 grand_tour_events.49.c: "让[gt_friend.GetHerHim]独自面对后果。"
 grand_tour_events.50.title: "一场小病"
 grand_tour_events.50.desc: "[target_leader.GetName]收到消息，[gt_friend.GetName]也来到了[target_location.GetName]，因路上染上的发烧寒战而躺在当地客栈床上。客栈老板嘟囔说这位年轻人付房钱时钱包看起来很薄，而且他已经两次挥手拒绝当地医生以节省费用。"
 grand_tour_events.50.a: "不顾[gt_friend.GetHerHis]反对，付钱请医生。"
 grand_tour_events.50.b: "用我们自己的旅途经验亲自护理[gt_friend.GetHerHim]。"
 grand_tour_events.50.c: "拜访[gt_friend.GetHerHim]并祝[gt_friend.GetHerHim]好运。"
 grand_tour_events.50.d: "那么，最好别靠近。"
