l_simp_chinese:
 expedition_succession_events.new_leader_tt: "[target_leader.GetName]接管了探险队的指挥权"
 expedition_succession_events.morale_down_tt: "船员们因失去领袖而士气低落（#R ‑20#!船员士气）"
 expedition_succession_events.1.title: "初掌海图"
 expedition_succession_events.1.desc: "消息传至[ROOT.GetCountry.GetCapital.GetName]，探险队的领袖已不幸身亡。所幸船上仍有一位学识渊博且胆识过人的军官，能看懂海图，也能把船员凝聚在一起，自从失去领袖后，其他人就一直听从他的安排。\n\n船员们正式确认他的指挥权，探险队在他的带领下继续航行。"
 expedition_succession_events.1.a: "既然如此，航行继续。"
 expedition_succession_events.2.title: "新任长官"
 expedition_succession_events.2.desc: "消息传至[ROOT.GetCountry.GetCapital.GetName]，舰队的海军将领已经去世。舰队在这片海域航行不能没有领袖。所幸舰队中一名军官资历足够深、能力足够强，其他人都把他的话当作命令，他也已经登上了后甲板。\n\n军官们正式确认他为舰队的新任指挥官，航行在他的带领下继续。"
 expedition_succession_events.2.a: "既然如此，舰队继续航行。"
 expedition_succession_events.generic_new_leader_tt: "[target.GetName]接管了探险队的指挥权"
 expedition_succession_events.3.title: "指挥权移交"
 expedition_succession_events.3.desc: "最后一艘返航的船只带回了一份急报：带领这支探险队的[former_leader.GetName]已经在途中去世。队伍没有等待指示；这封信封好时，幸存者已经在内部解决了这个问题，正如大多数远离宫廷的人会做的那样。\n\n[target.GetName]接过了指挥权，探险队继续向前推进。"
 expedition_succession_events.3.a: "这项事业非一人之力所能完成。"
