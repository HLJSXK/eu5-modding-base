l_simp_chinese:
 cartographic_survey_events.1.title: "测绘任务"
 cartographic_survey_events.1.desc: "命令已经下达。一支由两三艘船组成的小舰队，带着制图师、仪器保管员和一位选定的船长，将沿着我们的海岸线航行全程，带回足以供下个世纪使用的海图。我们对自家海岸的大部分了解来自当地领航员和商人传闻。这次探险之后，将有海图用墨水记录下[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]的所有港口、航海者的危险和走私者的小湾。问题只在于为这次航行订制什么装备。"
 cartographic_survey_events.1.a: "订制最精良的黄铜仪器，聘请最优秀的制图师。"
 cartographic_survey_events.1.b: "常规水准的制图师就够了。无需奢侈。"
 cartographic_survey_events.1.historical_info: "系统的海岸测绘在16世纪开始真正兴起，海上贸易量的不断增长使准确的海图成为国家利益攸关之事。塞维利亚的#italic 贸易厅#!和葡萄牙的#italic 几内亚与印度贸易署#!都设有官方制图师，负责制作和更新海图；荷兰海军部也在17世纪效仿了这一做法。"
 # GOOD events: material-specific
 cartographic_survey_events.10.title: "渔场已绘制成图"
 cartographic_survey_events.10.desc: "测量船已在[target_location.GetName]及其周边与当地渔民合作了三周，在大渔场上测深，标出季节性鱼群的路线，并记录那些在天气转变前把渔船送回家的洋流。制图师绘制出一张工作图，记录了水深、海底构成和惯常渔季。一位当地领航员评论说，他一生都在这些渔场度过，却从未见过它们被描绘得如此清晰。"
 cartographic_survey_events.10.a: "将海图分发给渔村，用于贸易。"
 cartographic_survey_events.10.historical_info: "前现代渔业依赖于在渔民家庭和行会内部口头传承的知识。向绘制成图的渔场——标出渔滩、等深线，并记录季节规律——的转变是一个缓慢的过程，在十七和十八世纪随着国家资助的水文学兴起而加速。"
 cartographic_survey_events.11.title: "海岸上的林木"
 cartographic_survey_events.11.desc: "测量员与林务员和首席造船师一起骑马穿过[target_location.GetName]的沿海森林，标记最好的桅杆松和造船橡树林，以及原木可顺流漂运至装货海滩的溪流，并记录木材最适合锯切的季节。那位从船坞被请来勘察最有前景林区的造船工程师，宣布这里的木材适合用于第一流的龙骨和框架。"
 cartographic_survey_events.11.a: "将最好的林区保留为[ROOT.GetCountry.GetGovernment.GetAdjective]海军木材。"
 cartographic_survey_events.11.historical_info: "在风帆时代，海军木材，尤其是建造战列舰框架所需的橡木，以及制作桅杆所需的高大松木，是一种战略物资。英国、法国和荷兰王室都保有对沿海木材资源的勘测记录，并将较好的林区保留为王室财产，对采伐、干燥和运输实行严格管制。"
 cartographic_survey_events.12.title: "编目盐田"
 cartographic_survey_events.12.desc: "测量船记录了[target_location.GetName]沿岸的每一处[ShowGoodsName('salt')]田、盐泉和浅滩。煮盐锅已清点完毕，惯常作业季节也已注明，当地[ShowGoodsNameWithNoTooltip('salt')]商接受了采访，谈及价格、需求和[ShowGoodsNameWithNoTooltip('salt')]运往内陆的路线。由此绘成的海图展现了一种[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]迄今几乎一无所知的沿海经济，若能将[ShowGoodsNameWithNoTooltip('salt')]税扩展覆盖这一经济，将从中获得可观收益。"
 cartographic_survey_events.12.a: "将海图送给负责[ShowGoodsNameWithNoTooltip('salt')]的官员以规范贸易。"
 cartographic_survey_events.12.historical_info: "沿海通过日光蒸发制盐的盐业生产，自古以来就在地中海周边以及法国、葡萄牙和伊比利亚的大西洋沿岸实行。布尔格讷夫湾、雷岛和塞图巴尔半岛的盐沼是前现代欧洲的重要原盐产区，为北大西洋的鳕鱼渔业和整个欧洲大陆的腌肉贸易提供盐。"
 cartographic_survey_events.13.title: "发现珍珠床"
 cartographic_survey_events.13.desc: "测量队通过与世代在[target_location.GetName]水域采珠的潜水家族合作，定位并绘制了当地的[ShowGoodsName('pearls')]床。海图记录了水深、采集季节、竞争采珠社群之间的惯常边界，以及采获物运抵城市切割匠手中的路线。被请来检查当季采获样品的宝石匠宣称这些珍珠光泽非凡。"
 cartographic_survey_events.13.a: "这种品质的[ShowGoodsNameWithNoTooltip('pearls')]必须处于[ROOT.GetCountry.GetGovernment.GetAdjective]监管之下。"
 cartographic_survey_events.13.historical_info: "欧洲的珍珠场与波斯湾和斯里兰卡的大珍珠床相比规模有限，但赫布里底群岛、维斯瓦河以及布列塔尼和威尔士海岸的水域确实出产具有商业品质的淡水和海水珍珠。苏格兰王室从中世纪起就对某些河系的珍珠采获维持王室垄断，威尼斯元老院则对亚得里亚海的采集活动实施管制。"
 cartographic_survey_events.14.title: "绘制葡萄园海岸"
 cartographic_survey_events.14.desc: "测量员与葡萄种植者一起骑马穿过[target_location.GetName]的沿海丘陵，记录下最适合种植葡萄的山坡、决定果实成熟还是腐烂的盛行风以及木桶可以装船出口的装货海滩。那些平日里守口如瓶的[ShowGoodsName('wine')]商人，一旦明白更好的海图意味着更好的出口时机，就变得出乎意料地乐于帮忙。"
 cartographic_survey_events.14.a: "将海图送给[ShowGoodsNameWithNoTooltip('wine')]运输商，以便更好地把握时机。"
 cartographic_survey_events.14.historical_info: "海上葡萄酒贸易是加龙河谷、杜罗河、爱琴海诸岛和达尔马提亚海岸等地区的经济支柱。葡萄采收的时机、航运窗口期和港口质量，决定了一年压榨所得的葡萄酒能否以良好状态运抵市场。因此，产酒海岸的制图便成为一项具有重大商业利益的事务；波尔多和波尔图的大葡萄酒商数百年来都保有自己的私人海图收藏。"
 cartographic_survey_events.15.title: "测绘染料海岸"
 cartographic_survey_events.15.desc: "测量队已绘制了[target_location.GetName]当地出产染料的海岸：采集推罗紫的骨螺床、悬崖上的胭脂虫栎、内陆平原上的靛蓝种植，以及任何能产出[ShowGoodsName('cloth')]商人愿意付钱购买的颜色的当地植物或贝壳。海图记录了作业季节、惯常采集地和[ShowGoodsName('dyes')]运抵纺织城镇的路线。"
 cartographic_survey_events.15.a: "将海图送给[ShowGoodsNameWithNoTooltip('cloth')]商人和村庄。"
 cartographic_survey_events.15.historical_info: "合成染料问世以前，染料在中世纪和近代早期始终是一种战略商品。推罗紫取自骨螺壳，克尔姆斯红取自橡树介壳虫，靛蓝取自木蓝属植物，菘蓝染料则取自菘蓝的叶子；它们各有自己的产地分布，而布匹贸易有赖于从原料采集地到纺织城镇的供应链是否稳定可靠。"
 cartographic_survey_events.16.title: "测绘[ShowGoodsNameWithNoTooltip('amber')]海岸"
 cartographic_survey_events.16.desc: "测量队已绘制了[target_location.GetName]的海滩——风暴过后，[ShowGoodsName('amber')]便会被冲上这些海滩——标明了值得采捞的滩涂、海浪将树脂送上岸的季节以及当地分配采获物的习俗。城市的[ShowGoodsNameWithNoTooltip('amber')]切割者向来为最澄澈的琥珀支付高价，而当他们知道哪些海滩出产哪个等级后，还会付得更高。"
 cartographic_survey_events.16.a: "将最好的前滩置于[ROOT.GetCountry.GetGovernment.GetAdjective]保留之下。"
 cartographic_survey_events.16.historical_info: "波罗的海琥珀海岸，从桑比亚半岛到东波美拉尼亚海岸，自古以来就是欧洲手工艺琥珀的主要来源。条顿骑士团以对琥珀采集实施严格垄断而闻名，对未经许可的采集处以严厉惩罚。琥珀之路将波罗的海沿岸与波希米亚、意大利和君士坦丁堡的作坊连接起来，长达一千多年。"
 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "一处避风港"
 cartographic_survey_events.20.desc: "测量船绕过了[target_location.GetName]的一处低矮海角，在一处当地渔民世代使用但现存海图上不见记载的避风水域抛锚。水深稳定在四英寻，底下是沙质海底，盛行风在外礁上无害地破碎，当地领航员报告说，任何吃水合理的船只都可以在任何天气下停泊在这里。有了适当的测深数据和导标线，这座港口便能供更大的船只使用。"
 cartographic_survey_events.20.a: "设置导标线，正确绘制港口海图。"
 cartographic_survey_events.20.historical_info: "当地渔民常常知道一些不见于任何官方海图的避风锚地，这些知识作为实用引航经验世代相传，而非以文字记录。国家水文测绘部门会有意走访这类引航人，而将一处此前未标注的港湾补入官方航海指南，正是前现代海岸测绘工作中一种常规的结果。"
 cartographic_survey_events.21.title: "穿过礁石的航道"
 cartographic_survey_events.21.desc: "制图师花了两周时间，用测深绳探测[target_location.GetName]近海一处向来被视为无法通行的礁石。他们找到了一条航道：最窄处三十英尺宽，低潮时四英寻深，只要在后方岬角上设置正确的导标杆，任何天气下都可通行。一位当地领航员——后来才发现他三十年前就知道这条航道，却从未告诉过任何人——为标记这条航道收取了一小笔费用。"
 cartographic_survey_events.21.a: "标记导标杆。航道上海图。"
 cartographic_survey_events.21.historical_info: "近海礁石遮蔽可航水道，是前现代沿海航海中反复出现的现象。叠标法——即船只以两个显著岸标前后重叠成一线的方位来接近航道——是标记此类通道的标准技术；而关于这类叠标的本地知识，往往是当地引航业严守的秘密。"
 cartographic_survey_events.22.title: "一处长期使用的小湾"
 cartographic_survey_events.22.desc: "测量队已定位了[target_location.GetName]一处距离最近官方港口数里格的避风小湾。海底有近期的锚痕，海滩上方的岩石有木桶滚过的旧痕，而当地渔民的孩子被问及时，无法完全保持严肃表情。这处小湾多年来一直被用于非官方贸易。如今它的存在已载入官方记录，小湾可以转为合法用途，或至少置于能产生收入的海关监管。"
 cartographic_survey_events.22.a: "记录小湾并设立一个小海关站。"
 cartographic_survey_events.22.historical_info: "走私者港湾，从古代到早期工业时代，一直是欧洲海岸线上常见的景象。海岸警卫队、海关缉私艇以及系统化的可疑登陆点海图的出现，逐渐把非官方贸易逼进更小、更偏远的湾澳；但直到铁路、电报和蒸汽动力巡逻船问世，才真正使任何规模的走私变得困难。"
 # BAD events
 cartographic_survey_events.30.title: "风暴吹散测量队"
 cartographic_survey_events.30.desc: "工作第三天，一场风暴从西南方升起，将测量船吹到下风岸，经历了两个寒冷夜晚的巨浪拍岸，派去工作站点接制图师的小艇也被吹散。等风势减弱，船重新浮起时，本季的工作已经白费，仪器浸湿，水手长的两名副手被葬在海滩上方的沙丘里。[target_location.GetName]沿岸的海图仍然和以前一样空白。"
 cartographic_survey_events.30.a: "放弃。季节已经太晚，无法重新开始。"
 cartographic_survey_events.30.historical_info: "突发风暴是小型船只海岸测绘工作中长期存在的职业危险。蒲福风级、标准化风暴警报以及系统性天气预报，直到19世纪才出现；在那之前，一艘测量船若在风力渐强的下风岸附近，它与灾难之间就只剩下测深绳、锚以及航海长的胆识了。"
 cartographic_survey_events.31.title: "在未标注的浅滩上搁浅"
 cartographic_survey_events.31.desc: "测量船在[target_location.GetName]撞上了一处现存海图未标记的浅滩，几乎就在测深绳显示四英寻的同时，海底在龙骨下骤然升起。船体在舱壁前方被撞穿，木匠正趁船侧倾在海滩上时，用铅补板和围堰修理。制图师在沙滩上架起仪器，一连工作了数日，但这段海岸的测量已经结束。"
 cartographic_survey_events.31.a: "修理船只。至少那片浅滩在我们的海图上了。"
 cartographic_survey_events.31.historical_info: "搁浅在未标注的浅滩上，是前现代测绘工作中常见的不幸；而那些失事的船只，往往比那些小心翼翼、安全驶过同一海岸的测深船提供了更准确的水文信息。许多航海指南在标注浅滩时，会参照发现它们的沉船；一处此前未知的礁石位置，也常常会被补入海图，并附上一句简洁的注记：某船于某年在此触礁。"
 cartographic_survey_events.32.title: "一艘有敌意的船只"
 cartographic_survey_events.32.desc: "一艘未悬挂旗帜，明显武装齐全的三角帆船只，突然从薄雾中驶出，朝停泊在[target_location.GetName]的测量船逼近。我们的船员正在岸上带着仪器作业，不得不放弃工作，登上小艇，带着记了一半的笔记本返回船上。那艘不明船只尾随了半天，然后朝一处不友好母港的方位离去，让这段海岸的测量支离破碎。怎么劝说制图师都不肯返回。"
 cartographic_survey_events.32.a: "避开。被敌意眼睛注视的海岸不会产出海图。"
 cartographic_survey_events.32.historical_info: "海岸测绘工作具有政治敏感性，因为外国海岸的精确海图是对其采取海军行动的先决条件。在争议水域作业的测量船，经常被当地势力的武装船只尾随，有时被扣留，有时只是被阻挠。17世纪和18世纪，英国海军部对西班牙海岸和爱琴海海岸的水文测绘，就因这类压力而屡次中断；测绘人员受过训练，一有被登船检查的迹象，就把最要命的记录扔下船去。"
 cartographic_survey_events.33.title: "浓雾阻碍工作"
 cartographic_survey_events.33.desc: "第二天早晨，雾气滚滚而来，此后三周都没有散去。制图员无法对隐没在云墙后的海岸地标进行交叉方位测量，只好靠掷骰子打发时间，并抱怨天气寒冷。给养日渐减少；[target_leader.GetName]判定继续等待只是浪费储备，于是对[target_location.GetName]海岸的测绘就此放弃——海图只画了一半，测深数据也未核实。当然，船开走后的第二天，雾就散了。"
 cartographic_survey_events.33.a: "接受本季的损失，暂时放弃。"
 cartographic_survey_events.33.historical_info: "沿海浓雾是前现代测绘工作长期存在的顽敌。标准的水文测量方法要求从海上作业站到固定岸标之间保持清晰的视线，而持续的浓雾会使整个程序根本无法进行。在纽芬兰、北海和太平洋西北地区等多雾地区，测绘队等待天气放晴的时间，常常比他们实际从事测绘工作的时间还要多。"
