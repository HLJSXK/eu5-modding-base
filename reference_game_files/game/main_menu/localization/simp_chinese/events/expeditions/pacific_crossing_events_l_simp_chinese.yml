 pacific_crossing_events.1.title: "归途"
 pacific_crossing_events.1.desc: "任务不只是抵达[ShowContinentName('asia')]——早就有船做到过，顺着信风往西漂，就像树叶顺着溪流走。任务是要能回来。如果一支舰队能开到大洋的远岸，却永远回不来，那在那里建立的殖民地就毫无价值。整个行动的核心，是找到一条可靠的返航航线，让船能年复一年地航行，运出[ShowGoodsName('silver')]，运回[ShowGoodsName('silk')]。\n\n出航的风是已知的，也很稳定。但大洋另一边是什么，这片海会不会给舰队留一条回去的路，这个港口里的任何海图都没有答案。领航员们只确定一件事：去的路，绝不会是回来的路。"
 pacific_crossing_events.1.a: "配备一支更大的舰队，为前方的探索增派一艘船。"
 pacific_crossing_events.1.a.tt: "额外建造并编入一艘船（#G +1#!船只）"
 pacific_crossing_events.1.b: "备足补给，其余听天由命。"
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip]将记录下我们穿越的每一阵风和每一道洋流。"
 pacific_crossing_events.1.historical_info: "向东的#italic 返航航线#!是早期太平洋航行中一直未能解决的重大难题。1528年和1529年，从新西班牙出发的阿尔瓦罗·德·萨韦德拉两次被信风所阻，被迫折返，最终在尝试中丧生；1542年，鲁伊·洛佩斯·德·比利亚洛沃斯的探险队同样抵达了亚洲，却找不到返航路线。直到1565年，一条可靠的返航路线才被发现。在此之前，一支舰队可以抵达亚洲，却永远无法将货物运回。"
 pacific_crossing_events.2.title: "强盗群岛"
 pacific_crossing_events.2.desc: "一连几周眼前只有海水和天空，直到瞭望员大喊看见陆地：一座低矮的绿色小岛，外围绕着一圈白色的浪。舰队还没来得及下锚，独木舟就争先恐后划了过来——这些带外支架的窄小船张着三角帆，在浪尖上滑得飞快，连领航员都站着看愣了。岛上的人一窝蜂爬上船舷，笑着，一点也不害怕，随手拿走所有没被捆牢的东西。在他们看来，拿走没人看管的东西不算偷；但对在海上漂了一个月、饥肠辘辘的船员来说，这就是挑衅。\n\n但这里有淡水，有水果，有鱼，唾手可得——不管用什么方式。"
 pacific_crossing_events.2.a: "用贸易珠、[ShowGoodsNameWithNoTooltip('cloth')]和[ShowGoodsNameWithNoTooltip('iron')]换取水和水果。"
 pacific_crossing_events.2.b: "用武力夺取船只所需之物。没时间耽搁了。"
 pacific_crossing_events.2.fight_win_tt: "岛民在船舰武器前四散奔逃，船员们随意取用淡水和水果"
 pacific_crossing_events.2.fight_lose_tt: "岛民的反抗比预期更为激烈，船员们两手空空地被赶回了船上"
 pacific_crossing_events.2.c: "别管淡水了——记下他们迅捷的船体和风帆。"
 pacific_crossing_events.2.historical_info: "1521年3月6日，在连续三个多月没有靠岸之后，斐迪南·麦哲伦舰队的幸存者抵达了关岛。查莫罗人乘着快速的外支架独木舟划了过来，编年史家安东尼奥·皮加费塔称赞这些船比西班牙人驾驶的任何船只都快。在岛民拿走了舰队的一艘小艇之后，麦哲伦将这片群岛命名为#italic “强盗群岛”#!，随后他带人强行登陆获取补给，之后继续航行前往菲律宾。"
 pacific_crossing_events.3.title: "四十天无事"
 pacific_crossing_events.3.desc: "没有陆地，没有飞鸟，水面上甚至连一缕海藻都没有。船员已经在海上漂了好几周，领航员的底气一周比一周弱。有人牙龈出血，牙齿松动；有个人坚称自己多年前早已愈合的旧伤又裂开了。水桶快空了，饼干里的象鼻虫比能吃的部分还多。风很顺，稳定又凉爽，却把他们往一片看不到尽头的大洋深处越带越远。\n\n船长脸上保持镇定，语气平稳，在海图上数着日子，只说自己确信的事。"
 pacific_crossing_events.3.a: "削减配给。我们必须咬牙坚持。"
 pacific_crossing_events.3.b: "航向正确。前方有陆地——保持航向。"
 pacific_crossing_events.3.c: "严明纪律，船长的话就是法律！"
 pacific_crossing_events.4.title: "跨西海之地"
 pacific_crossing_events.4.desc: "离开强盗群岛很久之后，瞭望员在晨雾里望见了绿色的山丘。舰队驶入宽阔的海湾时，能清楚看到这不是一处无人的海岸。岸边的山坡上，分布着一片白墙、棕榈叶铺顶的定居点。带外支架的独木舟朝着船队划来，船上的人穿着彩色布料，一点也不慌张。\n\n其中最有分量的那个人，脖子上戴着金饰，说着[location.GetDominantCulture.GetLanguage.GetName]，没有一个领航员听得懂这种语言。他朝着岸边打手势，动作自然，一看就常和陌生人打交道。这些岛屿有自己的一套秩序——遥远中国的[ShowGoodsName('silk')]和[ShowGoodsName('porcelain')]，早已经在这里流通。"
 pacific_crossing_events.4.desc.owned: "离开强盗群岛很久之后，瞭望员在晨雾里望见了绿色的山丘——紧接着，山坡上的定居点上方，清清楚楚飘着我们自己的旗帜。舰队没有误闯到未知的海岸，而是驶进了我们自己的港口：[pacific_colony.GetName]，属于王室的领地，这里的码头和仓库已经在运转。\n\n载着同胞的小船划出来迎接船队，他们很惊讶，居然有一支舰队从东边空无一物的大洋里开过来。在这里，船员可以安全地补充淡水和食物，还能装上中国商人运到我们码头的[ShowGoodsName('silk')]和[ShowGoodsName('porcelain')]。"
 pacific_crossing_events.4.desc.hostile: "离开强盗群岛很久之后，瞭望员在晨雾里望见了绿色的山丘——紧接着，水边的木寨上方飘起了一面不属于我们的旗帜。另一股势力先一步抵达了这些岛屿。舰队驶入海湾时，[pacific_rival_shore.GetName]的城墙上已经架好了火炮，载着武装人员的小船朝着船队划来，盘问他们的来意。\n\n这里现在是[pacific_rival.GetName]的地盘，对方最多只会带着戒备接待我们。中国的丝绸和瓷器仍然流经这个群岛——但经过的是对手的手，不会自由地到我们手中。"
 pacific_crossing_events.4.a: "公开在此地贸易[ShowGoodsNameFlat('silk')]和[ShowGoodsNameFlat('porcelain')]。"
 pacific_crossing_events.4.b: "袭击定居点——强行夺取水源和补给。"
 pacific_crossing_events.4.b.raid_win_tt: "村民们向内陆逃去，船员们将定居点的食物和水洗劫一空"
 pacific_crossing_events.4.b.raid_lose_tt: "村民们为家园而战，将劫掠者击退至船上，空手而归、狼狈不堪"
 pacific_crossing_events.4.d: "从我们自己的仓库装载当季货物。"
 pacific_crossing_events.4.e: "在我方港口休整并补充船员。"
 pacific_crossing_events.4.f: "在敌方炮火下谨慎应对对手的代理人。"
 pacific_crossing_events.4.g: "强行占领锚地，用武力夺取我们所需之物。"
 pacific_crossing_events.4.h: "与他们的火炮保持安全距离，并维持我方航向。"
 pacific_crossing_events.4.raid_win_tt: "前哨被攻陷，物资被洗劫一空；船员们欢欣鼓舞"
 pacific_crossing_events.4.raid_lose_tt: "突袭被击退并遭受损失，一艘受损严重的船只不得不被弃置"
 pacific_crossing_events.4.historical_info: "鲁伊·洛佩斯·德·比利亚洛沃斯于1542年从新西班牙渡过大洋，以西班牙王位继承人，未来的腓力二世之名将这个群岛命名为#italic 菲律宾群岛#!。西班牙的持久存在直到1565年才开始，当时米格尔·洛佩斯·德·莱加斯皮在宿务建立了第一个定居点；1571年，他从拉贾苏莱曼手中夺取了马尼拉，将其作为西班牙东印度群岛的首府，以及大帆船贸易的西端终点。"
 pacific_crossing_events.5.title: "丁香岛"
 pacific_crossing_events.5.desc: "气味比岛先到了船队——风里带着一股甜香，浓郁、浓烈，混着香料的气息。一座孤零零的火山峰顶飘着云，从山脚到水边全是绿色。港口里挤满了马来和爪哇的独木舟，从锚地就能清清楚楚看见[target_owner.GetName]的[target_owner.Custom('GetRulerOrRegentTitle')]的宫殿。\n\n[ShowLocationName('lisbon')]和[ShowLocationName('sevilla')]的每一个商人，都愿意为这股气味花大价钱，却从来没人知道它的产地。这支舰队里没人这么近距离靠近过它的源头——海湾上方的山坡上，树上挂满了没成熟的[ShowGoodsName('cloves')]，一整船的货，价值比这次航行的全部开销还高。船舱在这里就能装满。剩下的事，就是把它们运回家。"
 pacific_crossing_events.5.desc_known: "气味比岛先到了船队——风里带着一股甜香，浓郁、浓烈，混着香料的气息。一座孤零零的火山峰顶飘着云，从山脚到水边全是绿色。港口里挤满了马来和爪哇的独木舟，从锚地就能清清楚楚看见[target_owner.GetName]的[target_owner.Custom('GetRulerOrRegentTitle')]的宫殿。\n\n[ShowLocationName('lisbon')]和[ShowLocationName('sevilla')]的每一个商人，都只间接了解过这股气味，并愿意为它花大价钱。这支舰队里没人这么近距离靠近过它的源头——海湾上方的山坡上，树上挂满了没成熟的[ShowGoodsName('cloves')]，一整船的货，价值比这次航行的全部开销还高。船舱在这里就能装满。剩下的事，就是把它们运回家。"
 pacific_crossing_events.5.desc.driven_back: "香料群岛再次从船头前方浮现——还是那座绿色的山峰，还是那个拥挤的锚地，同时浮上心头的还有一个苦涩的事实：舰队被一路逼回了起点，返航的航线依然没有找到。信风推着船，根本没有别的选择，只能一路逃回这片海岸。\n\n现在在锚地停靠已经成了一套沉重的固定流程。岛上还能提供淡水和食物；病人可以送上岸休养，船员能歇口气，船舱里也能尽可能补上船上还装得下的补给。但船上的每个人都清楚等着他们的结局——舰队必须重新整备，再次出海尝试返航航线，而他们剩下的尝试机会已经不多了。"
 pacific_crossing_events.5.a: "将货舱装满[ShowGoodsNameWithNoTooltip('cloves')]——把最后一桶也装上。"
 pacific_crossing_events.5.b: "为漫长的归途补充给养。"
 pacific_crossing_events.5.c: "让船员上岸休整恢复。"
 pacific_crossing_events.5.d: "放弃搜寻——绕好望角远航归家。"
 pacific_crossing_events.5.historical_info: "1512年，葡萄牙航海家抵达摩鹿加群岛，弗朗西斯科·塞朗在当地成为特尔纳特苏丹的顾问。1521年，麦哲伦舰队幸存的船只在敌对的蒂多雷苏丹国装满了丁香。西葡两国对这片群岛的争夺，在1529年通过《萨拉戈萨条约》得到解决：当时急需资金的查理五世皇帝，以35万杜卡特的价格，把西班牙对摩鹿加群岛的宣称卖给了葡萄牙。"
 pacific_crossing_events.6.title: "归乡之路"
 pacific_crossing_events.6.desc: "船舱已经装满，航行里轻松的那半段已经过去了。现在舰队要做的事，是船上所有海图都没教过的：找到路线，横跨刚走过的那片大洋返航。之前一路把船稳稳向西送的风，现在正正地挡在他们的归路上，桌边的每一位领航员都清楚这意味着什么。\n\n舰队的军官们对着海图坐到深夜，这一次领航员们没法达成一致。每个人都坚持一条航线，也都有理由忌惮其他人的选择。在已知海域的边界之外，没人能保证任何一条路通向哪里——剩下的只有猜测，以及赌上一切的胆量。决定权只在船长手里，船上的每一个人，生或死，全看他定下的航线。"
 pacific_crossing_events.6.desc.driven_back: "船队的军官们再次开会，桌边的气氛已经变坏了。选定的航线被大海抛了回来；船队一路挣扎到这里，只得到了这个教训。剩下的航线仍然只是争论——并不比以前更有把握，而现在可以用来冒险的船只更少，船员也更单薄。\n\n领航员们已经不再大声争执。每个俯身在海图上的人都清楚，这片海不能一次次硬闯，每次都要付出代价。他们必须再选定一条航线，驶离这片水域，剩下的选择机会已经不多了。"
 pacific_crossing_events.6.a: "北线：贴着亚洲海岸航行，然后向东行驶。"
 pacific_crossing_events.6.a.tt: "沿着[ShowRegionName('japan_region')]的海岸向北航行，再继续往前，之后让高纬度的西风带着舰队一路横穿到[ShowContinentName('america')]，返回家乡"
 pacific_crossing_events.6.b: "中程航路——逆着信风向东航行。"
 pacific_crossing_events.6.b.tt: "向东直航，逆着信风，途经旧群岛。狂风曾将每一支尝试此路的舰队吹回——做好一路被吹回香料群岛的准备"
 pacific_crossing_events.6.c: "极南航线——一条广阔而漫长却畅通无阻的弧线。"
 pacific_crossing_events.6.c.tt: "向遥远的南方和东方进发，穿越遍布岛屿的南大洋。那条航路或许确实存在——但路程极其漫长，舰队的补给恐怕无法支撑到终点"
 pacific_crossing_events.6.historical_info: "所有从亚洲沿热带向东航行的尝试都失败了。1522年，贡萨洛·戈麦斯·德·埃斯皮诺萨的船#italic 特立尼达号#!试图返回新西班牙，被风逼退，之后被葡萄牙人俘获；阿尔瓦罗·德·萨阿韦德拉在1528年和1529年两次尝试，都没能成功。1565年，奥古斯丁会修士安德烈斯·德·乌尔达内塔成功了，他向北航行很远，到大约北纬四十度的位置，搭上黑潮和西风带，顺着它们横跨北太平洋到加利福尼亚，再南下抵达阿卡普尔科。他开辟的航线，在之后的两个半世纪里一直为马尼拉大帆船所用。"
 pacific_crossing_events.7.title: "太平洋"
 pacific_crossing_events.7.desc: "风停了。帆布松垮地挂着，海面平得像玻璃，一直铺到每一处地平线，船只在白得晃眼、像在燃烧的天空下一动不动。正是因为这样的无风状态，这片大洋才被叫做“和平之海”——这种温和，从前已经让不少船员饿死在这里。\n\n木桶里的水变热、变臭。每一个无风的日子，都要消耗一天的补给，却往前挪不了一点距离，船员们都清楚这点。他们盯着空荡荡的索具和地平线，已经两次把一团云当成陆地大喊，最后那团云散得无影无踪。困在无风带的船上，闲下来的手很少能一直闲下去。"
 pacific_crossing_events.7.a: "静静等待，每一滴每一屑都要省着用。风会回来。"
 pacific_crossing_events.7.b: "放下小艇——在无风时拖曳船只。"
 pacific_crossing_events.7.c: "涌浪向东南方向涌动——顺势漂向风向。"
 pacific_crossing_events.8.title: "大帆船归来"
 pacific_crossing_events.8.desc: "特许大帆船返航了。沿着漫长的北部弧线在海上航行了数月，它驶进锚地时吃水很深，满载着货物——来自[ShowContinentName('asia')]的财富，横跨整片大洋，安全运抵。它还没下锚，码头上就挤满了代理商和买家。这条航线走通了，这次航行赚了钱；明年、后年，还会有下一艘大帆船出发。"
 pacific_crossing_events.8.a: "一笔财富安全抵达。"
 pacific_crossing_events.8.historical_info: "马尼拉大帆船在1565年到1815年的大部分年份里，都往返于阿卡普尔科和马尼拉之间，是历史上存续时间最长的航线之一。它向西运送美洲的白银，向东运送中国的丝绸、瓷器和香料；单艘大帆船的货物就能让投资者赚得盆满钵满。这条贸易线路把美洲的白银和中国的市场连在一起，让太平洋变成了全球贸易的一条通途。"
 pacific_crossing_events.9.title: "熟悉的海岸"
 pacific_crossing_events.9.desc: "向北长时间航行，驶入冰冷灰暗的海域，之后向东沿着空旷大洋划出无尽弧线，这一切终于结束了——瞭望员终于看见了它：一片林木茂密的高海岸，岬角在雾团下向南延伸开去。这里不属于[ShowContinentName('asia')]，也不是任何岛屿——这正是[ShowContinentName('america')]的西海岸。舰队已经从[ShowContinentName('pacific_ocean_continent')]驶出，来到了世界的近侧，只需要沿着海图上已经标注的海岸向南航行，就能抵达一处安全的港口。\n\n回家的路已经找到了。剩下的，只是走完最后这段航程。"
 pacific_crossing_events.9.a: "沿着我们熟悉的海岸向南回家。"
 pacific_crossing_events.9.b: "先放水和食物——船员们配得上这些。"
 pacific_crossing_events.9.historical_info: "安德烈斯·德·乌尔达内塔1565年的返航航程，在开阔的北太平洋上走了大约四个月后，在加利福尼亚海岸靠近门多西诺角的位置抵达美洲陆地。从那里，#italic 圣佩德罗号#!向南航行，于1565年10月8日抵达阿卡普尔科，这条航线就此得到验证。这条北部弧线航线，后来成了马尼拉大帆船返航的标准路线。"
 pacific_crossing_events.10.title: "海水涌起"
 pacific_crossing_events.10.desc: "天空变成淤青的颜色，风像一堵墙似的压过来。不到一个小时，整支舰队都在为活命挣扎——浪头抬得比主桅帆桁还高，绿色的海水猛地冲上船腰，帆布裂开的声响像枪响一样。船只吃力地颠簸摇晃，在昏暗里，它们一个接一个看不见彼此了。领航员们什么也做不了，只能死死稳住船身，数着时间熬过去。\n\n眼下有一个选择，根本没时间权衡：要么收帆，就在当前的位置扛过风暴，要么顺着风往黑暗里冲，寄希望于船身能撑住不散架。"
 pacific_crossing_events.10.a: "顶风停船，光桅杆撑过去。"
 pacific_crossing_events.10.b: "顺风疾行，祈愿船体坚固。"
 pacific_crossing_events.10.weathered_tt: "舰队虽然受创，但完好无损地通过了"
 pacific_crossing_events.10.foundered_tt: "一艘船沉没了，船上所有人遇难"
 pacific_crossing_events.11.title: "生木料"
 pacific_crossing_events.11.desc: "这些船是在美洲太平洋海岸的新船坞里仓促造出来的，用的是根本没来得及风干的木料，造船工匠也从没为这样的大洋造过船。现在大海来讨债了。船身中部的一块木板从接缝里脱开，填缝的材料松了；甲板下的船员站在不断上涨的水里，水泵日夜咔哒作响，水位一点也不见降。木匠的脸色已经说明了一切。\n\n情况撑不下去了，最近的陆地还隔着半个大洋。"
 pacific_crossing_events.11.a: "将最严重的部分倾侧并妥善修理。"
 pacific_crossing_events.11.b: "轮流操作水泵，无论如何都要坚持前进。"
 pacific_crossing_events.11.c: "放弃受损的船；将船员转移到其余的船只。"
 pacific_crossing_events.12.title: "大海的馈赠"
 pacific_crossing_events.12.desc: "最先出现的是海豚——一大群海豚，赶着什么东西朝船的方向游过来。接着海面像着了火：一大群鱼被赶到水面，数英亩的银色鱼群在船身周围翻涌闪烁，被绕圈游动的海豚团团围住，挤得几乎看不见海水。\n\n船员们不用等命令，小艇立刻被放下海，鱼线和渔网也跟着下水，人们从船舷边探出身，大把大把把鱼拖上甲板，甲板很快堆满了渔获，滑溜溜的。吃了几周的饼干和咸肉之后，这既是一场盛宴，也是意外之喜，更是一场及时的馈赠。"
 pacific_crossing_events.12.a: "放下所有船只和渔线——能捞多少就捞多少。"
 pacific_crossing_events.12.b: "快速打捞一批，然后重新迎风航行。"
 pacific_crossing_events.13.title: "腐坏补给"
 pacific_crossing_events.13.desc: "膳食管理员手里拿着帽子，走到船长面前报告。在底舱里，一整排木桶都被撬开，发现里面的东西全坏了——咸肉腌制得不对，饼干装进去的时候就受潮了，木桶本身没经过充分风干，里面的水早就变臭了。在出发港口匆忙装船、还没干透就封起来的补给，在热带高温下已经腐烂，本该够船员吃几周的食物，现在全变成了发臭、爬满蛆虫的废品。\n\n海中没有集市，也没有重来的机会——只有坏掉的储备粮和饿着肚子的船员。"
 pacific_crossing_events.13.a: "将变质的补给扔下船，承担损失。"
 pacific_crossing_events.13.b: "无论怎样都要配给——有什么船员就吃什么。"
 pacific_crossing_events.17.title: "迷失于大海"
 pacific_crossing_events.17.desc: "报告终于传来，却只是零星的片段——一个名字，一个日期，最后已知的航向。那支出发寻找返航路线的舰队，始终没能找到那条路。没人能确定这些船是被风暴吞没，撞上了某座无名暗礁，还是一直漂流到水耗尽、船员也随之死去。大海把它们都留下了。\n\n返航的路线依然没有找到。在那片海域的某个地方，风依然朝着错误的方向吹。"
 pacific_crossing_events.17.a: "他们不会是我们在那片海洋上失去的最后一批人。"
 pacific_crossing_events.17.end_tt: "探险队失踪了，航程在此终结"
 pacific_crossing_events.17.historical_info: "向东的大洋夺走了许多尝试者的性命。探险队指挥官加西亚·霍夫雷·德·洛艾萨和环球航海者胡安·塞巴斯蒂安·埃尔卡诺都在1526年横渡太平洋期间死于海上；阿尔瓦罗·德·萨维德拉在1529年尝试返航时死于大洋中央；费迪南德·麦哲伦则于1521年在麦克坦被杀。随麦哲伦离开西班牙的大约二百七十人中，只有十八人乘#italic 维多利亚号#!返回。"
 pacific_crossing_events.18.title: "船员哗变"
 pacific_crossing_events.18.desc: "船员们已经受够了。配给短缺，汪洋无边，航线除了领航员没人能保证可行——这些已经把船员磨得不再服从命令。一群水手聚到船尾，面色阴沉，带着武器，直白地提出要求：让舰队掉头，不然他们就自己动手让船转向。军官寡不敌众，而且火枪并不全掌握在他们手里。\n\n无论现在做出什么决定，舰队都将失去一样难以轻易补上的东西。"
 pacific_crossing_events.18.desc.last_ship: "船员们已经受够了。舰队里只剩下一艘船，在这艘拥挤、散发着臭味的甲板上，没有哪个军官能找到藏身的地方。带头的人一起走到船尾，这一次他们没有请求——他们用直白得吓人的方式，向船长说出了他们处境的真相：没有别的船可以逃去，没有水兵可以调来，船外是大片的海洋。他们说，现在就掉头回家，不然就被扔进海里。\n\n领航员们都沉默了。船长独自站在栏杆边，背后是大海，必须给出答复。"
 pacific_crossing_events.18.a: "让步——允许领头的乘船返航。"
 pacific_crossing_events.18.b: "武力镇压。绞死首恶，继续航行。"
 pacific_crossing_events.18.c: "提醒他们家中有什么在等待，以及是谁引领他们归途。"
 pacific_crossing_events.18.fight_win_tt: "哗变被平息，秩序恢复（#G +5#!船员士气）"
 pacific_crossing_events.18.fight_lose_tt: "战况变得惨烈，混乱中一艘船沉没"
 pacific_crossing_events.18.overboard_tt: "哗变者制服了长官，将[target_leader.GetName]投入大海。航程至此终结"
 pacific_crossing_events.19.title: "再临强盗群岛"
 pacific_crossing_events.19.desc: "舰队顶着风向东航行，没能推进任何能稳住的距离，最后低矮的绿色岛屿[ShowLocationName('guahan')]再次从船头前方浮现——正是他们横渡大洋后离开的那片海岸。当地的小船像之前那样快速划了出来，带着警惕和好奇，船上的人看着这些从空荡大洋折返、一无所获的外来者。无论初次造访时此处发生过什么，岛上的人都还没忘记。"
 pacific_crossing_events.19.desc.friendly: "舰队顶着风向东航行，没能推进任何能稳住的距离，最后低矮的绿色岛屿[ShowLocationName('guahan')]再次从船头前方浮现。这一次当地的小船毫无惧色地划了出来——岛上的人记得之前的公平交易，他们当中有几张脸，船员们也隐约觉得眼熟。有人举起了用来交易的货物，双方比画着手势，补给淡水和新鲜食物的意向已经十分明确。\n\n舰队正急需这两样东西。在这片海域，旧日的善意似乎比任何海图都更有用。"
 pacific_crossing_events.19.desc.hostile: "舰队顶着风向东航行，没能推进任何能稳住的距离，最后低矮的绿色岛屿[ShowLocationName('guahan')]再次从船头前方浮现。但此刻驶出的当地小船数量众多，船上的人没有一点笑意——岛上的人没有忘记那次劫掠，他们一直在等着。岸边长矛林立，从前能随意获取淡水的锚地，现在再也没法轻易拿到补给了。\n\n舰队无论如何都需要淡水和食物，船员们清楚，他们必须从一群做好了防备的人手里把这些东西夺过来。"
 pacific_crossing_events.19.a: "再次与对我们怀有善意的人们进行贸易。"
 pacific_crossing_events.19.b: "在他们集结之前，先以武力夺取我们所需之物。"
 pacific_crossing_events.19.b.win_tt: "登岛在岛民集结之前夺取了食物和水源"
 pacific_crossing_events.19.b.lose_tt: "岛民们这次严阵以待；劫掠者被击退，损失惨重"
 pacific_crossing_events.19.c: "尽可能不发生冲突就装上淡水，然后继续航行。"
 pacific_crossing_events.19.historical_info: "马里亚纳群岛成了横渡太平洋的船只常规的淡水补给点，在大帆船航线通行的几个世纪里，和查莫罗人的关系在谨慎交易与公开冲突之间摇摆不定。善待岛上居民的舰队有希望拿到补给；没这么做的舰队，往往会发现同一片海岸对他们关上大门，或是每装一桶水都得打上一仗。"
 pacific_crossing_events.20.title: "险峻海岸"
 pacific_crossing_events.20.desc: "又一座岛屿从无边无际的南方海域中升起——地势陡峭，植被葱郁，四周环绕着暗礁。这座岛上有人居住：树丛间升起炊烟，独木舟划离海滩，上面挤满了身上涂着颜料，带着长矛的身影，隔着水面发出一阵喧闹的声响，分不清是示好还是警告。船上没人能判断出来。\n\n领航员从未测绘过这个地方，也叫不出占据这里的族群的名字。但淡水桶已经快空了，船员们饥肠辘辘，一座有人居住的岛屿就意味着有食物，只要能拿到手。这片海岸是会给舰队提供补给，还是反过来对他们动武，全看接下来这一个小时怎么应对。"
 pacific_crossing_events.20.a: "绕开这座岛屿——别在这里打。"
 pacific_crossing_events.20.b: "靠过去交易——举起[ShowGoodsNameWithNoTooltip('iron')]和[ShowGoodsNameWithNoTooltip('cloth')]，碰碰运气。"
 pacific_crossing_events.20.trade_ok_tt: "岛上的人放下了长矛，自由地以物易物；小船返程时载满了食物和淡水"
 pacific_crossing_events.20.trade_ambush_tt: "谈判是个圈套——独木舟蜂拥围上我方小艇，舰队付出惨重的伤亡才杀出重围"
 pacific_crossing_events.20.c: "强行登陆，以武力夺取该岛的一切。"
 pacific_crossing_events.20.raid_win_tt: "登陆行动把岛上的人逼退到树林里，掠走了他们储存的物资"
 pacific_crossing_events.20.raid_lose_tt: "岛民为保卫家园而奋勇作战，劫掠者被重创并被迫退回船上"
 pacific_crossing_events.21.title: "被迫折返‌"
 pacific_crossing_events.21.desc: "一个星期又一个星期，船队艰难地向东航行，而一个星期又一个星期，大海把取得的一切都推了回去。信风从未减弱，也从未转向；它像一堵墙正对着船头，下方的洋流也朝着同一个方向流动，夜里把船往西带的速度，比他们白天向东航行的速度还要快。领航员完成观测、核对完数据后，都陷入了沉默——海图上的航线标记已经停止向前推进，开始往回滑退。\n\n这是无法反驳的事实：他们走的是踏轮，不是航道，耗在这上面的每一天，都在白白消耗淡水和人命。剩下的唯一选择十分苦涩：调转航向，顺着击败他们的风航行，把舰队带回香料群岛，重新做打算。"
 pacific_crossing_events.21.a: "这片海域无法强行穿越。"
 pacific_crossing_events.22.title: "船员的请愿"
 pacific_crossing_events.22.desc: "每一天，补给消耗的速度都超过我们推进的里程。淡水短缺，还发出一股臭味，饼干已经变成了粉末，病患名单每天早上都在变长。一群老船员代表走到船尾——他们还没哗变，至少暂时没有，但这些能数清桶数的人，态度十分笃定。他们算过这次航行的账，结果对他们不利。他们说，趁货舱里的存粮还够抵达一处已知海岸，掉头回去。要是继续硬撑，只会让整个舰队葬身这片大洋。\n\n不管这番话听着多让人难受，里面的道理是实实在在的。"
 pacific_crossing_events.22.a: "听从他们的意见，让舰队折返香料群岛。"
 pacific_crossing_events.22.b: "拒绝。我们已经走得太远，现在无法回头。"
 pacific_crossing_events.23.title: "甲板上的血"
 pacific_crossing_events.23.desc: "从请愿被拒绝那天开始的争论从未真正平息，今天终于演变成动手。一名忠于这次航行的水手长和一伙仍在为拒绝返航而耿耿于怀的人互相辱骂；辱骂变成推搡，推搡变成一场迅速蔓延到整个甲板的斗殴，不止一个人拔出了刀。\n\n[target_leader.GetName]赶到现场时，发现值班船员早已打成一团——而这场争吵，其实从来都不是为了那名水手长。"
 pacific_crossing_events.23.a: "介入并制止斗殴。"
 pacific_crossing_events.23.b: "把那个带头闹事的扔下船，这事就算了结了。"
 pacific_crossing_events.23.c: "听从他们的意见，让舰队折返香料群岛。"
 pacific_crossing_events.23.break_up_win_tt: "这场斗殴在真正流血之前被制止"
 pacific_crossing_events.23.break_up_lose_tt: "斗殴在秩序恢复前演变为流血"
 pacific_crossing_events.23.overboard_tt: "带头闹事的被制服，随即被毫不留情地抛入海中。船员们冷眼旁观，沉默不语"
 pacific_crossing_events.24.title: "海中之火"
 pacific_crossing_events.24.desc: "船尾传来一声呼喊：船队中另一艘船着火了。起初又是一场关于返乡航线的斗殴，在混乱中打翻了一盏灯笼，火苗沿着缆绳蔓延的速度已经快过人们打水的速度。火星随风飘向船队的其他船只。\n\n[target_leader.GetName]必须迅速决定，是靠近帮忙灭火，还是保持距离，让那艘着火的船自求多福。"
 pacific_crossing_events.24.a: "把你的船靠上去，帮忙灭火。"
 pacific_crossing_events.24.b: "保持距离，让他们独自灭火。"
 pacific_crossing_events.24.saved_tt: "额外的援手在火焰蔓延之前将其扑灭"
 pacific_crossing_events.24.caught_fire_tt: "火花跃过间隙，你的船只也随之起火"
 pacific_crossing_events.24.distance_tt: "着火的船一直烧到水线，船队只在安全距离外眼睁睁看着"
 pacific_crossing_events.25.title: "船上哗变"
 pacific_crossing_events.25.desc: "消息通过信号从另一艘船传到[target_leader.GetName]那里：那艘船上的船员已经起来反抗长官，同样是关于返航的争论，已经恶变成了公开的叛变。忠于职守的船员被堵在下层舱室，哗变者正在争执接下来该怎么做。留给决定要不要介入的时间已经不多了。\n\n现在放下小艇过去，或许还能扭转那艘船上的局势，也可能只是白白把第二艘船送到哗变者手里。"
 pacific_crossing_events.25.a: "登船支援忠诚的船员。"
 pacific_crossing_events.25.b: "保持距离，让他们自行解决。"
 pacific_crossing_events.25.c: "听从他们的意见，让舰队折返香料群岛。"
 pacific_crossing_events.25.loyal_win_tt: "忠诚者占据上风，船上秩序得以恢复"
 pacific_crossing_events.25.loyal_lose_tt: "叛乱者制服了登船队并夺取了船只"
 pacific_crossing_events.25.distance_tt: "叛乱者不等我们采取任何行动便劫船而去"
 pacific_crossing_events.26.title: "再次请愿"
 pacific_crossing_events.26.desc: "船员代表又来了，这次语气更收敛，但决心丝毫不减。他们不威胁，也不提高嗓门；只是把同样的一笔账又摆了出来，距离上次被拒绝又过了些日子，这笔账显得更严峻了。如果[target_leader.GetName]愿意，做出几项小小的让步也许能在下层甲板换来一些安宁。\n\n不然也可以给出和上次一样的答复，让这份请愿毫无结果地被带回甲板下层。"
 pacific_crossing_events.26.a: "听取他们的诉求，并给予一些小的让步。"
 pacific_crossing_events.26.b: "再次驳回他们，继续前进。"
 pacific_crossing_events.27.title: "夜间破坏"
 pacific_crossing_events.27.desc: "夜里有人动了补给：一桶淡水被凿破，一卷索具被割得只剩半连。都是小事，但意图却很明确。那些想让这次航行掉头返航的人，已经认定光靠说话没用了。[target_leader.GetName]可以下令彻查，找出肇事者，也可以直接加派值班人手，不追查肇事者继续前行。\n\n不管选哪样，这个信号已经传达到了。"
 pacific_crossing_events.27.a: "调查并找出责任人。"
 pacific_crossing_events.27.b: "加倍警戒，继续前进，不必寻求答案。"
 pacific_crossing_events.27.culprit_found_tt: "罪魁祸首被找到，并在全体船员面前被公开惩处，以儆效尤"
 pacific_crossing_events.27.culprit_free_tt: "调查一无所获，破坏者又在行动被叫停前再次出手"
 pacific_crossing_events.27.no_investigation_tt: "警戒已加倍，但对补给的损害已经造成"
