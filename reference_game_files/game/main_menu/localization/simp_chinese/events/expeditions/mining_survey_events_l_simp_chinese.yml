l_simp_chinese:
 mining_survey_events.1.title: "勘探委员会"
 mining_survey_events.1.desc: "一队勘探者已在庭院中整装待发，驮骡背上载着镐、钻，以及一只涂了油的木箱，里面装着试金师的坩埚、天平和酸液。他们将用一年时间穿行我们的高地乡野，在河床中检测砂金，敲击石英矿脉，并向牧羊人打听哪些山谷能在淘金盘里淘出金来。这些山丘以前就曾献出过财富，而且往往是献给我们早已彻底遗忘的民族。没有理由认为它们已经一无所有。"
 mining_survey_events.1.a: "不惜工本。派遣熟练的化验师，用黄金换取样品。"
 mining_survey_events.1.b: "一笔适度的费用即可，头人们会提供向导和住处。"
 mining_survey_events.1.historical_info: "系统勘探在中世纪和近代早期的欧洲十分普遍，其中最著名的是萨克森和波希米亚的厄尔士山脉。12世纪银矿脉的发现，催生了弗赖贝格、亚希莫夫和施内贝格等新兴城镇。格奥尔格·阿格里科拉的#italic 《论矿冶》#!（1556年）成为该领域的标准教科书，详细描述了寻矿杖的使用、在小坩埚中测试金矿石样品的方法以及规范采矿权申领的法律惯例。"
 mining_survey_events.10.title: "[ShowGoodsNameWithNoTooltip('iron')]矿脉"
 mining_survey_events.10.desc: "勘探者发现了一条高品位[ShowGoodsName('iron')]矿层，矿脉深深伸入山体；被镐头刨开的地方，岩石上布满黑色和红色的条纹。最近村庄的头人说，他祖父曾讲过山坡上方某处有旧矿坑；这些新竖井也许不过是在重新打开早已失传的矿场。如果这一发现能够持续，下游的锻炉和铸造厂足以兴旺一代人。"
 mining_survey_events.10.a: "公布发现，让[ROOT.GetCountry.GetFlavorRank]知道我们拥有什么。"
 mining_survey_events.10.b: "悄悄开发，竞争对手的铸造厂还不需要听说。"
 mining_survey_events.10.historical_info: "前现代欧洲的铁矿开采以小型露天作业和浅竖井为中心，沿着可见的矿石露头进行；块炼炉在矿场附近将矿石炼成熟铁。中世纪晚期引入的高炉使铸铁能够以更大的数量生产，瑞典、施蒂里亚和巴斯克地区等大产铁区正是以此奠定了它们近代早期的繁荣。"
 mining_survey_events.11.title: "一处[ShowGoodsNameWithNoTooltip('copper')]矿藏"
 mining_survey_events.11.desc: "勘探者沿着一道带绿色斑纹的岩石追上山坡，找到了源头：一条贯穿崖面的[ShowGoodsName('copper')]矿脉，暴露在风化中，等待开采。化验师在他的便携铁砧上打碎样品，投入坩埚，报告说金属纯净且产出良好。冶炼工已经从南方城镇被召集而来。"
 mining_survey_events.11.a: "公开开发，让[ROOT.GetCountry.GetFlavorRank]知道我们的[ShowGoodsNameWithNoTooltip('copper')]。"
 mining_survey_events.11.b: "悄悄开发。如果谣言不传开，黄铜铸造厂会付更多钱。"
 mining_survey_events.11.historical_info: "在前工业时代的欧洲，铜矿开采集中在少数几个著名地区：瑞典的法伦、厄尔士山脉的山坡、萨克森的曼斯费尔德地区以及蒂罗尔阿尔卑斯山。这种金属对于青铜火炮、船底包铜和黄铜制品至关重要；一座高产铜矿既能让拥有它的王室致富，也能让资助其开发的商行发财。富格尔银行王朝的崛起，部分正是通过控制蒂罗尔铜矿实现的。"
 mining_survey_events.12.title: "山中一处[ShowGoodsNameWithNoTooltip('tin')]矿藏"
 mining_survey_events.12.desc: "勘探者沿着河床中的深色锡石卵石追上山坡，找到了矿脉露出地表的地方，含[ShowGoodsName('tin')]的岩石沿着石英脉厚实而纯净地延伸。矿工们已经在山脚下搭建木支护矿井和捣碎磨坊。青铜铸造厂、锡镴器匠和盘子制造商将有一代人的材料可加工。"
 mining_survey_events.12.a: "公布发现，一处新的[ShowGoodsNameWithNoTooltip('tin')]矿藏关乎国家。"
 mining_survey_events.12.b: "保持低调，在对手之前垄断铜贸易。"
 mining_survey_events.12.historical_info: "锡在前现代世界是一种战略金属，对青铜火炮和家用锡镴器同样不可或缺，其供应集中在少数著名地区：康沃尔、厄尔士山脉以及波希米亚部分地区。康沃尔的锡矿特区自中世纪以来便享有特殊法律地位，拥有自己的法庭和议会，而康沃尔的锡贸易则滋养了整个大西洋欧洲的黄铜与青铜生产。"
 mining_survey_events.13.title: "石灰岩中的方铅矿"
 mining_survey_events.13.desc: "在山地乡村，一条方铅矿矿层已被打开，其深色晶体中闪烁着银色光芒，预示着有用的冶炼副产品。矿层中的[ShowGoodsName('lead')]将为教堂铺顶、衬里管道并铸成弹丸，而[ShowGoodsName('silver')]部分将帮助支付开发费用。矿坑工头报告说工作面干净，新竖井通风稳定。"
 mining_survey_events.13.a: "公布发现，[ShowGoodsNameWithNoTooltip('lead')]是公众利益之事。"
 mining_survey_events.13.b: "悄悄将产出承包给火药磨坊和印刷商。"
 mining_survey_events.13.historical_info: "在前现代欧洲，铅和银几乎总是伴生开采；方铅矿经由古代发明、并在整个中世纪不断改良的灰吹法，可同时产出这两种金属。英格兰的门迪普丘陵、萨克森的哈茨山以及西班牙的莫雷纳山脉，都是重要的铅银产区；它们所产的铅，塑造了从大教堂屋顶到印刷活字，再到城市供水铅管的一切。"
 mining_survey_events.14.title: "岩石中的[ShowGoodsNameWithNoTooltip('silver')]"
 mining_survey_events.14.desc: "勘探者发现了[ShowGoodsName('silver')]，一条宽到可以挥镐的矿脉，纯到可以直接从岩石上抛光。化验师的坩埚还因测试而滚烫。竖井已用木材支护，第一批矿车已经由吱嘎作响的绞盘运到地面。铸币厂这一代人不会缺少金银，而[ShowContinentName('europe')]的宫廷将在一年内注意到这一发现。"
 mining_survey_events.14.a: "向[ROOT.GetCountry.GetFlavorRank]公布，一座[ShowGoodsNameWithNoTooltip('silver')]矿是一场胜利。"
 mining_survey_events.14.b: "保持低调。外国眼睛盯着我们的[ShowGoodsNameWithNoTooltip('silver')]会带来麻烦。"
 mining_survey_events.14.historical_info: "白银开采在中世纪晚期和近代早期改变了欧洲经济。15世纪末，蒂罗尔的施瓦茨和波希米亚的亚希莫夫发现了主要银矿脉，随后1545年安第斯山脉的波托西又有了重大发现，大量贵金属涌入欧洲，支撑起了16世纪的大通货膨胀。一座高产银矿，其战略价值堪比一支舰队或一座要塞。"
 mining_survey_events.15.title: "黄色金属"
 mining_survey_events.15.desc: "勘探者发现了[ShowGoodsName('goods_gold')]。一条石英脉，粗线般贯穿金属，暴露在崖面上，冬季的落石带走了土壤覆盖。金属在灯光下闪亮，自岩石形成以来未被触碰。村长提出将矿场租给[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]，以他所说的公平份额。化验师建议接受，附带条件。"
 mining_survey_events.15.a: "公布发现，让我们的敌人听说此事。"
 mining_survey_events.15.b: "悄悄开发。[ShowGoodsNameWithNoTooltip('goods_gold')]会引来不想要的访客。"
 mining_survey_events.15.historical_info: "前现代欧洲的原生金矿稀少，且很早就被采尽。斯洛伐克克雷姆尼察和瓦拉几亚弗朗恰的中世纪金矿是重要的地方性来源，但欧洲的大部分黄金来自莱茵河、塔霍河等河流的冲积矿，或来自从铅银矿石中提炼银时分离出的黄金成分。无论以何种数量发现原生黄金，都是头等意外之财，而王室无一例外都会立即主张对其的所有权。"
 mining_survey_events.16.title: "黑石燃烧炽热"
 mining_survey_events.16.desc: "一条厚实的[ShowGoodsName('coal')]矿层穿过这里的山丘，在两处因溪流侵蚀切割到地层而露出地表。矿层可追踪，[ShowGoodsNameWithNoTooltip('coal')]燃烧干净。当地铁匠已经在用他们的锻炉木柴换它。锻炉、盐田和玻璃作坊都可以从这条矿层获得燃料，而无需进一步砍伐乡村森林。"
 mining_survey_events.16.a: "在[ROOT.GetCountry.GetGovernment.GetAdjective]特许下开发。告诉[ROOT.GetCountry.GetFlavorRank]。"
 mining_survey_events.16.b: "将矿场租给铁匠大师，收取稳定分成。"
 mining_survey_events.16.historical_info: "采煤从中世纪起就在欧洲小规模进行，主要是在威尔士、纽卡斯尔煤田以及列日部分地区；但它真正的扩张，是随着近代早期的燃料危机而来的——当时森林被砍伐，用以扩大耕地。到17世纪，纽卡斯尔的海运煤已以千吨计运往伦敦；若没有它，冶铁业在失去木炭之后便无法存续。"
 mining_survey_events.17.title: "一种良好的切割[ShowGoodsNameWithNoTooltip('stone')]"
 mining_survey_events.17.desc: "山丘中开了一座新采石场，[ShowGoodsName('stone')]沿着层理面干净切割，暴露后硬化。首席石匠从大教堂工程被请来检查样品石块，宣布它适合方石、精细雕刻和承重层。方圆一百英里的每座大教堂和幕墙都将在一代人的时间里取用这里。"
 mining_survey_events.17.a: "将矿场置于[ROOT.GetCountry.GetGovernment.GetAdjective]控制下。[ShowGoodsNameWithNoTooltip('stone')]具有战略意义。"
 mining_survey_events.17.b: "将采石场租给石匠行会，收取稳定租金。"
 mining_survey_events.17.historical_info: "在前工业时代的欧洲，建筑石材是一种运输缓慢却价值高昂的商品，因为运输成本是其价格的主导因素。一座距大城市或建筑工地不超过一天运程的高产采石场，便是一项长期资产；兰斯、索尔兹伯里和科隆的伟大中世纪大教堂工程，都曾世代保有专用采石场，以满足其建造需求。"
 mining_survey_events.18.title: "山谷中的[ShowGoodsNameWithNoTooltip('marble')]"
 mining_survey_events.18.desc: "在一个避风的山谷中发现了最上等的纹理[ShowGoodsName('marble')]，首席石匠切下一块样品，抛光后呈现深邃半透明的光泽。当地雕塑家已经在请愿要求优先购买产出。远至首都的作坊将在一代人的时间里取用这座采石场，祭坛画和陵墓纪念碑的雕刻者将自认有福。"
 mining_survey_events.18.a: "公布它。一座伟大的[ShowGoodsNameWithNoTooltip('marble')]采石场是国宝。"
 mining_survey_events.18.b: "悄悄将[ShowGoodsNameWithNoTooltip('marble')]保留给[ROOT.GetCountry.GetGovernment.GetAdjective]使用。"
 mining_survey_events.18.historical_info: "在中世纪和文艺复兴时期的欧洲，用于精美雕塑和建筑的大理石，来自少数几个著名采石场：托斯卡纳的卡拉拉、希腊的帕罗斯和彭特利库斯，以及比利牛斯山的圣贝阿。发现一条新的、可产出雕像级大理石的高产矿层，在艺术家中间是件引人注目的事，他们会委托索取样品，并亲自前往考察有前景的发现。"
 mining_survey_events.19.title: "捕捉光线的石头"
 mining_survey_events.19.desc: "勘探者在河床中发现了含[ShowGoodsName('gems')]的砾石，并追踪到上方山坡中一个更富集的矿囊，那里的基质是贯穿晶体的伟晶岩。从首都请来的宝石匠代表将一堆原石按颜色和净度分类，报告说可切割比例异常高。宫廷珠宝匠这一代人不会缺少宝石。"
 mining_survey_events.19.a: "公布发现。一座[ShowGoodsNameWithNoTooltip('gems')]矿坑是值得夸耀的奇迹。"
 mining_survey_events.19.b: "悄悄将[ShowGoodsNameWithNoTooltip('gems')]留在[ROOT.GetCountry.GetGovernment.GetAdjective]金库。"
 mining_survey_events.19.historical_info: "与印度和缅甸的大型宝石矿区相比，欧洲的宝石开采只是小规模营生，但波希米亚高地、苏格兰凯恩戈姆山脉以及比利牛斯山部分地区，都曾开采当地出产的石榴石、绿柱石、紫水晶和黄玉。莱茵兰伊达尔-奥伯施泰因的宝石切割作坊，逐渐成为切割当地开采宝石的中心；一次有开采价值的发现，便足以让那里的工匠忙上数年。"
 mining_survey_events.20.title: "山中朱砂"
 mining_survey_events.20.desc: "在高地发现了一处朱砂矿床，其鲜红矿石是岩石中含[ShowGoodsName('mercury')]的明确标志。蒸馏器和冷凝器正在离矿区安全距离处设置。炼金术士、化验师和镀金匠将在一代人的时间里取用这座矿，而新世界的白银精炼者可能愿意付任何价钱将我们的[ShowGoodsNameWithNoTooltip('mercury')]运到他们的铸币厂。"
 mining_survey_events.20.a: "公开开发该矿。[ShowGoodsNameWithNoTooltip('mercury')]是战略商品。"
 mining_survey_events.20.b: "悄悄开发。垄断[ShowGoodsNameWithNoTooltip('mercury')]是极具分量的事。"
 mining_survey_events.20.historical_info: "汞是室温下唯一呈液态的金属，对16世纪逐渐主导美洲白银精炼的混汞法至关重要。卡斯蒂利亚的阿尔马登矿和卡尼奥拉的伊德里亚矿是欧洲两大来源，西班牙王室将阿尔马登矿作为严格的皇家垄断产业，汞在海军护航下用大帆船运往墨西哥和秘鲁。"
 mining_survey_events.21.title: "一处盐泉"
 mining_survey_events.21.desc: "在高地发现了一处新的岩[ShowGoodsName('salt')]矿床，地层穿过谷底处有盐泉流出。煮盐者已经在工作，当地农民把牛赶到盐泉边饮水。腌肉贸易和餐桌都将改善，而如果我们选择征收盐税，仅此一项发现就能支付一年的[ROOT.GetCountry.GetGovernment.GetAdjective]家庭开支。"
 mining_survey_events.21.a: "在[ROOT.GetCountry.GetGovernment.GetAdjective]特许下开发[ShowGoodsNameWithNoTooltip('salt')]工场。"
 mining_survey_events.21.b: "将运营租给盐商，收取稳定分成。"
 mining_survey_events.21.historical_info: "在前现代欧洲，盐是一种战略商品，对食物保存不可或缺，并且通过各类盐税和专卖制度成为国家收入的一大来源，其中最著名的是法国的盐税。波兰的维利奇卡、奥地利的哈尔施塔特和加泰罗尼亚的卡尔多纳等大型盐矿经营了数百年，使拥有它们的家族和王室发了财。"
 mining_survey_events.22.title: "发现[ShowGoodsNameWithNoTooltip('alum')]页岩"
 mining_survey_events.22.desc: "勘探者在山地发现了含[ShowGoodsName('alum')]的页岩，岩石自然风化成一种盐，染工愿意付任何价钱。一个试验蒸馏器从首批样品中产出了干净的白色[ShowGoodsNameWithNoTooltip('alum')]，布商代表已经在询问长期合同。纺织贸易等待一个比托尔法教宗垄断产地更近的来源已经很久了。"
 mining_survey_events.22.a: "公布发现。[ShowGoodsNameWithNoTooltip('alum')]是[ROOT.GetCountry.GetFlavorRank]工艺的胜利。"
 mining_survey_events.22.b: "悄悄开发。教宗的[ShowGoodsNameWithNoTooltip('alum')]垄断不需要为人所知。"
 mining_survey_events.22.historical_info: "明矾是使染料固着于布料上的重要媒染剂，在整个中世纪和近代早期都是一种具有战略意义的纺织商品。1462年，教宗国的托尔法发现了巨大的明矾矿藏，由此造就了梵蒂冈长达一个多世纪的垄断，直到英格兰、瑞典和尼德兰开发出替代来源为止。任何一个能够自供明矾的国家，都能使其纺织业摆脱令人恼火的外国依赖。"
 mining_survey_events.23.title: "山谷中的[ShowGoodsNameWithNoTooltip('saltpeter')]"
 mining_survey_events.23.desc: "从一处避风山谷的土壤中提取出了[ShowGoodsName('saltpeter')]，春季融雪后白色晶体在岩面上绽放。从军械库请来的火药大师取样粗硝石，宣布它适合精炼成一等火药。火药磨坊这一代人不会缺少硝石，而[ROOT.GetCountry.GetFlavorRank]的炮兵列车终于可以与其野心相配。"
 mining_survey_events.23.a: "在[ROOT.GetCountry.GetGovernment.GetAdjective]垄断下开发。[ShowGoodsNameWithNoTooltip('saltpeter')]意味着战争。"
 mining_survey_events.23.b: "让火药商开发，以换取产出优先购买权。"
 mining_survey_events.23.historical_info: "硝石是火药的主要成分。在前现代欧洲，人们从长期施粪肥且避雨的土壤中提取硝石，或以高昂代价从印度和黎凡特进口。国家对硝石生产的控制是一项战略要务：英格兰实行一套硝石工制度，这些人拥有在马厩和鸽舍下方挖掘的法定权力；法国则将#italic 火药管理局#!作为皇家垄断机构一直维持到19世纪。"
 # BAD events
 mining_survey_events.30.title: "试验坑塌方"
 mining_survey_events.30.desc: "[ShowGoodsName('iron')]勘探点发生灾难。试验竖井在夜间坍塌，支护木材被矿带上方松散页岩的缓慢沉降扯出。两名勘探队员被埋；另一名，化验师的学徒，被拉出来时腿断了，并拒绝再下竖井。矿坑工头说[ShowGoodsNameWithNoTooltip('iron')]就在那里，但要到达它意味着穿过更硬的地面开一条新平硐，成本将相当大。"
 mining_survey_events.30.a: "撤回队伍。有些土地不值得用人命去埋。"
 mining_survey_events.30.historical_info: "顶板坍塌和竖井垮塌，是前现代采矿业长期存在的职业危险。支撑工作面的木支架在潮湿地面中腐烂；矿带上方松散的岩层会毫无预警地滑落；而标准的房柱式开采法，随着矿石被采出，会留下越来越多失去支撑的空区。矿工礼拜堂、矿工丧葬互助会和矿工遗孀基金，是每个欧洲矿区都长期存在的固定配置。"
 mining_survey_events.31.title: "矿区有毒烟雾"
 mining_survey_events.31.desc: "[ShowGoodsName('copper')]勘探点产出的矿石性质出乎意料。第一个焙烧堆，为在冶炼前驱除硫化物而设，正产生刺鼻的黄色烟雾，已将工人赶下山坡，并使下风半英里内的草枯萎。当地农民已正式投诉。冶金师说可以建造适当的焙烧窑来控制烟雾，但这将花费我们未预算的黄金和时间。"
 mining_survey_events.31.a: "放弃勘探点。当地人对空气的看法没错。"
 mining_survey_events.31.historical_info: "从硫化矿石中冶炼铜会释放大量二氧化硫，损害周边乡村的庄稼、牲畜和人的肺部。瑞典的法伦铜矿区因烟雾而臭名昭著，据说使周围数英里的农田变得荒芜；下哈茨的铜冶炼大谷地同样具有毁灭性。自中世纪以来，因烟雾损害而对采矿作业提起民事诉讼便十分常见。"
 mining_survey_events.32.title: "河床干涸"
 mining_survey_events.32.desc: "[ShowGoodsName('tin')]勘探点起初很有希望：可采数量的冲积锡石，从河床中按车淘出。但砂矿的来源尚未找到，河床现在已被冲刷掉重矿。在矿区上方挖的山坑只碰到贫瘠基质。队伍已没有明显可挖的地方，而在没有证据的情况下开凿更深竖井的成本难以证明合理。"
 mining_survey_events.32.a: "放弃勘探点。砂矿只是一时之兴。"
 mining_survey_events.32.historical_info: "冲积锡矿淘洗，即对溪床和河床中含锡砾石进行采选，是康沃尔锡矿开采的最初方式，并一直延续到近代早期。一旦容易开采的砾石被采尽，矿工就必须通过对周围山丘的系统勘探，沿着砂矿追溯其源头。许多看似有前景的溪流，最终只通向一条单薄而分散的矿脉，并不足以证明进行地下开采的成本是值得的。"
 mining_survey_events.33.title: "工人患病"
 mining_survey_events.33.desc: "[ShowGoodsName('lead')]矿点正在产出矿石。工人们则在产出怨言。下班出来的矿工牙龈发灰、关节肿胀，还带着一种沉重的迟钝，营地医生称之为铅工绞痛。已有两人死亡；另有四人病得太重，无法下井。矿场工头说，只要我们雇用替补并接受损失，作业就可以继续，但当地头人正在尖锐地追问：下一个倒下的会是谁。"
 mining_survey_events.33.a: "关闭它。我们来这里不是为了埋葬[ROOT.GetCountry.GetFlavorRank]的自由民。"
 mining_survey_events.33.historical_info: "铅中毒，即古人所称的#italic 铅绞痛#!，是铅矿工、冶炼工、玻璃工和陶工中广为人知的职业病。贝尔纳迪诺·拉马齐尼的#italic 《论工匠的疾病》#!（1700年）——职业医学的奠基之作——用很长的篇幅讨论了这种病痛。放血、催泻和喝牛奶这些标准疗法都无效，而唯一真正有效的预防措施是限制接触，但矿主几乎没有经济激励去这么做。"
 mining_survey_events.34.title: "矿脉尖灭"
 mining_survey_events.34.desc: "[ShowGoodsName('silver')]矿脉在勘探者最初打开的地方很宽，头几车矿石验出每担含[ShowGoodsNameWithNoTooltip('silver')]超过三十马克。随后，沿矿层倾斜向下十码，矿脉急剧变窄，矿石变得贫瘠，如今工作面几乎不值得把岩石运到地面的成本。地质学上的术语叫#italic 尖灭#!。矿工们的叫法则远没那么文雅。沿断层更远处也许还有更多[ShowGoodsNameWithNoTooltip('silver')]，但要找到它，就意味着在毫无证据的情况下开凿昂贵的勘探竖井。"
 mining_survey_events.34.a: "撤回。尖灭的矿脉是一扇关闭的门。"
 mining_survey_events.34.historical_info: "银矿脉沿其长度方向变化之大是出了名的：有些地段膨胀成数英尺厚的矿体，另一些地段则收窄为无矿的细脉。矿脉几何形态的反复无常，使银矿开采成了一种有学问的赌博；亚希莫夫、施瓦茨和伊格劳等中世纪矿业繁荣城镇的兴衰，都以残酷的规律性紧随特定矿脉的发现与枯竭。"
 mining_survey_events.35.title: "发光的未必都是金子"
 mining_survey_events.35.desc: "[ShowGoodsName('goods_gold')]勘探点的失望。贯穿石英的明亮金属斑点不是[ShowGoodsNameWithNoTooltip('goods_gold')]而是黄铁矿，自冶金术诞生以来一直欺骗勘探者的铁硫化物。化验师的第一次测试，通过在坩埚中还原，产生的不是黄色[ShowGoodsNameWithNoTooltip('goods_gold')]珠，而是一层薄薄的红色含硫浮渣和一块生铁。当地村长显然并不惊讶；他听过这个山坡上关于#italic 愚人金#!的古老祖父故事，一直在等着看我们的学者是否知道区别。"
 mining_survey_events.35.a: "收拾离开。愚人金，勘探者最古老的把戏。"
 mining_survey_events.35.historical_info: "黄铁矿，即岩石中闪着黄铜色光泽的硫化铁，在德国矿区得了#italic 愚人金#!的俗称；自人类开始寻找真正的金属以来，它就一直在误导勘探者。鉴别它的方法——锤下延展性（黄铁矿会碎裂；黄金会压扁）、比重（黄金约为水的十九倍；黄铁矿仅为五倍），以及火试金中的表现（黄金留存下来；黄铁矿则焙烧成硫和氧化铁而消失）——对任何称职的试金师来说都是标准做法。"
 mining_survey_events.36.title: "矿层中的瓦斯"
 mining_survey_events.36.desc: "[ShowGoodsName('coal')]矿层厚实而干净。它也充满瓦斯。在任何深[ShowGoodsNameWithNoTooltip('coal')]作业中积聚的沼气从一名采煤工的灯上点燃，由此产生的爆炸当场杀死三人，另烧伤六人严重到无法再工作。矿坑工头说矿层可以开采，但只能通过通风竖井和熔炉持续通风，这需要在任何[ShowGoodsNameWithNoTooltip('coal')]产出之前投入相当资本。"
 mining_survey_events.36.a: "关闭作业。我们还没有能力对抗瓦斯。"
 mining_survey_events.36.historical_info: "瓦斯，即积聚在煤矿巷道中的甲烷，遇任何火焰都会爆炸性点燃，是前工业时代煤矿工人长期以来的致命杀手。标准的应对办法是系统通风：通过成对竖井，在出风井底部设置炉火，使空气穿过采掘区；而能够照明却不引燃瓦斯的戴维安全灯，直到1815年才被发明出来。在那之前，每一处深部煤层的开采，都像是在间歇性灾难的判决之下进行。"
 mining_survey_events.37.title: "采石场被淹"
 mining_survey_events.37.desc: "[ShowGoodsName('stone')]极好，但采石场无法保持干燥。第一个坑切入层理面十二英尺，一夜之间就被采石工没有预料到的泉水灌满，底部[ShowGoodsNameWithNoTooltip('stone')]层现在在寒冷的三英尺水下。首席石匠说如果开一条排水廊道通到下方山谷，采石场可以开采，但廊道本身就是一年的石方工程，预算没有为此留出余地。"
 mining_survey_events.37.a: "放弃采石场。被淹的坑就是关闭的坑。"
 mining_survey_events.37.historical_info: "在前工业时代的石材开采中，采石场排水是一个长期存在的工程难题；许多原本高产的采坑，一旦工作面降到当地地下水位以下，便被废弃。标准的解决办法包括：开凿通向低地的水平排水廊道（即德国采矿传统中所谓的#italic 平硐#!）、使用水轮驱动的斗链泵，以及从17世纪起逐渐引入蒸汽驱动抽水机。"
 mining_survey_events.38.title: "石块碎裂"
 mining_survey_events.38.desc: "[ShowGoodsName('marble')]在工作面最初看起来完好。两天后，当第一块大石终于从基岩上分离并降到木滚上时，它沿着一条看不见的裂缝裂开，在自身下降的重量下碎成六块无用碎片。首席石匠走过被拒的石块，用锤子敲击，宣布队伍已经知道的事：这个山谷中的[ShowGoodsNameWithNoTooltip('marble')]充满了内部断裂线，任何工作面的检查都没有发现。"
 mining_survey_events.38.a: "关闭它。碎裂的[ShowGoodsNameWithNoTooltip('marble')]只配做筑路石。"
 mining_survey_events.38.historical_info: "用于雕像和精细建筑工程的大理石荒料必须没有内部瑕疵；而发现隐藏的裂缝线（意大利采石工行话中的#italic 毛隙#!）一直是这一行业挥之不去的梦魇。雕塑大师会在委托之前亲自前往采石场检查粗料；而一项重大雕像委托的费用中，也会为交付后才发现有瑕疵的石块预留一笔相当充裕的损耗余量。"
 mining_survey_events.39.title: "是铅玻璃，不是水晶"
 mining_survey_events.39.desc: "含[ShowGoodsName('gems')]的砾石异常丰富，丰富得可疑。从首都由守卫护送请来的皇家宝石匠在强灯下检查收获，用手掌掂量每颗石头，用一块刚玉碎片划一颗，宣布不可避免的结果：大部分发现是铅玻璃仿制品，巧妙切割并风化以类似未加工水晶。有人一直在河床中掺假。矿坑工头今早明显不在营地。"
 mining_survey_events.39.a: "收拾。整个勘探点是一场骗局。"
 mining_survey_events.39.historical_info: "“撒盐”，即在勘探点植入真正的矿石或经过加工的宝石材料以吸引投资，是矿业边疆一种古老的职业欺诈手段。给自己的矿场“撒盐”的矿场工头、沿选定的河床撒下几块隐蔽标本的当地向导，以及安排人把发现物仔细布置好的不在场发起人，在欧洲和美国矿业史上都是反复出现的人物。再加上为这种欺诈出具确认报告的腐败验矿师，就凑成了这套标准的操作套路。"
 mining_survey_events.40.title: "[ShowGoodsNameWithNoTooltip('mercury')]疯病"
 mining_survey_events.40.desc: "[ShowGoodsName('mercury')]工场正在生产金属。它们也在生产疯子。蒸馏器旁的工人开始无法控制地颤抖；被指派搅拌冷凝[ShowGoodsNameWithNoTooltip('mercury')]的学徒失去了牙齿和右手两根手指的功能；而比任何人都更了解风险的首席冶金师，已陷入一种易怒的恍惚，营地医生称之为#italic 制帽匠疯病#!并断言无药可救。[ShowGoodsNameWithNoTooltip('mercury')]就在那里，但能开采它的人却不在。"
 mining_survey_events.40.a: "关闭工场。没有金属值得这样。"
 mining_survey_events.40.historical_info: "汞中毒，表现为震颤、牙齿脱落和进行性精神衰退，是辰砂矿工、蒸馏工和银汞齐化炼银工公认的职业病。卡斯蒂利亚的阿尔马登矿是欧洲汞的主要来源，正因如此，其开采部分由囚犯劳工承担。英语短语#italic 疯得像帽匠#!保留了对这一行业的记忆：当年毡帽制造工正是被其工艺中使用的汞毒害。"
 mining_survey_events.41.title: "盐泉枯竭"
 mining_survey_events.41.desc: "[ShowGoodsName('salt')]勘探点开局良好。盐泉强劲，锅炉生产出一等白色[ShowGoodsNameWithNoTooltip('salt')]，盐商已经在谈判长期合同。然后，在一个干旱的夏季和比往常更冷的冬季之后，泉水减弱为细流，最后停止。被派去调查的地质学家报告说，地下来源是一处有限的封闭盐水囊，不是再生的水流，勘探点实际上已枯竭。"
 mining_survey_events.41.a: "撤回。干涸的泉是[ShowGoodsNameWithNoTooltip('salt')]泉工场的终结。"
 mining_survey_events.41.historical_info: "卤水泉与岩盐矿床在地质特征和经济前景上截然不同。有些卤水来源，如萨克森的哈勒或汝拉地区的萨兰莱班，持续涌流数百年，支撑起了相当规模的城镇；另一些则本质上只是“化石”般的封闭卤水囊，在密集开采后一代人之内便告枯竭。岩盐则在维利奇卡和卡尔多纳等地开采，是一种更可靠但也更资本密集的资源。"
 mining_survey_events.42.title: "页岩贫瘠"
 mining_survey_events.42.desc: "页岩露头在地表看起来很有希望，岩石风化成的盐在化验中干净洁白。但覆盖层下的页岩是贫瘠的：厚、暗，完全缺乏表面样品似乎承诺的含[ShowGoodsName('alum')]黄铁矿脉。化学家尝试酸浸，然后焙烧，然后在废石堆上长期风化，几乎什么也没产出。工人以相当费用从纺织城镇请来，现在闲置着，而工程师一个接一个尝试方法。"
 mining_survey_events.42.a: "关闭工场。化学无法让这里产出[ShowGoodsNameWithNoTooltip('alum')]。"
 mining_survey_events.42.historical_info: "从含黄铁矿的页岩中制造明矾，需要恰好合适的矿物化学条件：黄铁矿提供硫酸根离子，铝质页岩提供铝，再经过漫长的风化过程，使两者在溶液中结合。地表样本很容易产生误导，因为露头处正是天然风化已经完成作用的地方；而地下的岩石往往贫瘠无矿。北海沿岸的约克郡明矾工场耗费了数十年时间和大量资本，开采的页岩最终却毫无产出。"
 mining_survey_events.43.title: "土壤毫无产出"
 mining_survey_events.43.desc: "山谷土壤本应富含[ShowGoodsName('saltpeter')]。当地农民说他们的祖父每年春天从岩面上收集白色霜花。勘探者现在从谷底十几个地方挖土、浸滤、蒸发，几乎没有产出有价值的东西。火药大师看到微薄产量后，指出旧的[ShowGoodsNameWithNoTooltip('saltpeter')]矿层可能已被那些祖父讲故事的同一些农民挖尽。山谷现在已没有[ShowGoodsNameWithNoTooltip('saltpeter')]。"
 mining_survey_events.43.a: "放弃山谷。土壤已死；这里没有[ShowGoodsNameWithNoTooltip('saltpeter')]。"
 mining_survey_events.43.historical_info: "含硝石的土壤并非取之不尽。在潮湿、施过厩肥的土地中，硝石的自然生成过程需要数年，且很容易因密集提取而枯竭。因此，德国的#italic 硝石煮炼工#!传统包括系统地建立人工#italic 硝石培育场#!，在那里将厩肥、石灰和灰烬堆积起来并照料多年，以产生稳定的硝石产量。从寻找硝石到制造硝石的转变，是前工业时代火药生产合理化的重要一步。"
