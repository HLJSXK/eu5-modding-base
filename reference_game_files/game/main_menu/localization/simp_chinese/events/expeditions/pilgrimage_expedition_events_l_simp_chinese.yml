l_simp_chinese:
 pilgrimage_expedition_events.1.title: "[current_location.GetNameWithNoTooltip]，圣城"
 pilgrimage_expedition_events.1.desc: "经过数月疲惫的旅行，[target_ruler.GetName]终于站在[current_location.GetName]的城墙前，这是受难之城、复活之城、整个基督教世界最神圣的土地。千百朝圣者的尘土悬浮在空气中，与从上百个小堂飘来的乳香混合。\n\n在这一切的中心矗立着圣墓教堂，建在各各他岩石之上。[target_ruler.GetSheHe|U]为这一刻长途跋涉。漫长的道路、起泡的双脚、不眠之夜，都在大门开启、圣油和古老石头的气味向[target_ruler.GetHimHer]涌来时消散。"
 pilgrimage_expedition_events.1.a: "在圣墓前俯伏。"
 pilgrimage_expedition_events.1.b: "以[ROOT.GetCountry.GetNameWithNoTooltip]之名委托建造一座小堂。"
 pilgrimage_expedition_events.1.historical_info: "从公元4世纪起，耶路撒冷便开始吸引基督教徒前来朝圣。彼时，君士坦丁大帝下令在耶稣基督受难、埋葬及复活的原址上修建了圣墓教堂。在十字军东征期间，这座城市几经易手：它于1099年被第一次十字军攻占，1187年被萨拉丁夺回，1229年通过腓特烈二世的谈判短暂收复，但最终落入了马穆鲁克的控制之下。然而，即便基督教失去了统治权，圣地的各个圣所依然通过外交协议对朝圣者保持开放。这使得耶路撒冷在整个中世纪，始终是天主教信仰最至高无上的朝圣地。"
 pilgrimage_expedition_events.2.title: "永恒之城"
 pilgrimage_expedition_events.2.desc: "[current_location.GetName]从平原中缓缓升起，其圆顶和塔楼在[target_ruler.GetName]的随从穿过台伯河上最后一座桥时捕捉着午后的光线。这个[current_location.GetRank.GetName]广阔而古老，街道挤满来自基督教世界各个角落的朝圣者，每个人都被同一股无形的潮流吸引。\n\n在梵蒂冈山巅，圣伯多禄大殿耸立天际。这里是基督在世之代表的宝座，教会在世俗的权威。[target_ruler.GetNameWithNoTooltip]对身处[ShowReligionAdjective('catholic')]灵性中心感到敬畏。"
 pilgrimage_expedition_events.2.a: "谦卑地承认神圣权威。"
 pilgrimage_expedition_events.2.b: "做出配得上我们[ROOT.GetCountry.GetGovernment.GetRulerTitle]的捐赠。"
 pilgrimage_expedition_events.2.c: "我们已表达敬意。我们的人民需要我们回家。"
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.2.historical_info: "从教会最早的几个世纪起，罗马就成为基督教权威的所在地，这是由于宗徒伯多禄的殉道——他的墓位于以他命名的宏大圣殿之下。教宗制逐渐发展成为一种既是属灵又是世俗的权力，吸引着全欧洲的统治者和朝圣者前来，寻求赦罪、合法性以及伯多禄继承人的祝福。禧年始于1300年教宗波尼法爵八世在位期间，吸引了数十万朝圣者，并巩固了罗马作为天主教朝圣首要目的地的地位。"
 pilgrimage_expedition_events.3.title: "朝圣之路的终点"
 pilgrimage_expedition_events.3.desc: "#italic 圣地亚哥朝圣之路#!的最后几英里最为拥挤。从每条道路和每个山谷，朝圣者的溪流汇聚到[current_location.GetName]的大教堂，他们的手杖磨得光滑，斗篷沾满五百里格的尘土。有人哭泣。有人赤脚走了一百英里。\n\n[target_ruler.GetName]骑行在[target_ruler.GetHerHis]随从的前头，但当大教堂塔楼进入视野时，便下马步行。走完最后一段似乎是对的。朝圣者赞美诗的巨大轰鸣在风中升起，#italic “继续前进！继续前进！”#!道路的石头似乎与之共鸣。"
 pilgrimage_expedition_events.3.a: "在圣雅各伯墓前表达感恩。"
 pilgrimage_expedition_events.3.b: "宣称这是天主眷顾我们统治的迹象。"
 pilgrimage_expedition_events.3.c: "意义深远的一天。但我们仍有[ROOT.GetCountry.GetFlavorRank]需要治理。"
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.3.historical_info: "对圣雅各伯宗徒的敬礼，在圣地亚哥‑德孔波斯特拉兴起于9世纪。当时在加利西亚发现了被认定为圣雅各伯的圣髑，并由阿斯图里亚斯国王阿方索二世供奉起来。由此形成的朝圣路线——#italic 圣地亚哥之路#!——与罗马、耶路撒冷并列为中世纪基督教世界的三大朝圣之一。到12世纪，这条道路沿线遍布医院、修院和教堂，来自欧洲各国的朝圣者都行走其上。抵达圣地亚哥，朝圣者便可获得一张孔波斯特拉朝圣证书和一次全大赦。"
 pilgrimage_expedition_events.4.title: "三王圣龛"
 pilgrimage_expedition_events.4.desc: "[current_location.GetName]是一个满是起重机和脚手架的[current_location.GetRank.GetName]。这座主教座堂已建造近两个世纪，未完成的塔楼每年向一个仍未出生的几代人之后才会到来的完工攀升。然而即使未完成，这座建筑也大得无法估量，人们说，它是世界上最大的。\n\n在南耳堂，在一座闪耀着金箔和烛光的祭坛后，矗立着三王圣龛：一个金色圣物箱，装着跟随星辰到白冷的东方三王的遗骨。[target_ruler.GetName]从小就听说过它。没有什么能让[target_ruler.GetHimHer]为此完全做好准备。"
 pilgrimage_expedition_events.4.a: "跪下敬礼三王圣龛。"
 pilgrimage_expedition_events.4.b: "为主教座堂的建造慷慨捐赠。"
 pilgrimage_expedition_events.4.c: "我们将祈祷，然后上路。"
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.4.historical_info: "科隆三王圣龛是西方世界最大的圣髑匣，也是据称圣经中东方三博士遗骨的安放处。这些圣髑是神圣罗马帝国皇帝腓特烈·巴巴罗萨在1164年征服米兰后获得的，并被赠予科隆大主教达塞尔的雷纳德。它们的到来使科隆成为北欧最重要的朝圣地之一，并促成了1248年动工的宏伟哥特式大教堂的建造——这项工程直到1880年才完成。三博士与王权及主显节的关联，使对他们的敬礼尤其能引起那些寻求神意认可的世俗统治者的共鸣。"
 pilgrimage_expedition_events.5.title: "[current_location.GetNameWithNoTooltip]圣母"
 pilgrimage_expedition_events.5.desc: "人们说，[current_location.GetName]的玻璃窗无法用语言描述，只能亲见方能体会。[target_ruler.GetName]站在教堂中殿里，明白了原因。整座大教堂浸在蓝光里，这光穿过上千块彩色玻璃，变成了某种不再完全属于尘世的东西。它落在石地板上，形成不断移动的光斑，落在跪地朝圣者的脸上，落在高高的祭坛后方金匣子里的古老圣物上。\n\n#italic 圣罩#!，也就是圣母玛利亚的面纱，据说在天使报喜时她就戴着它，从查理曼大帝时代起就吸引着信徒来到这里。[target_ruler.GetNameWithNoTooltip]一动不动地站着，意外地被触动了。"
 pilgrimage_expedition_events.5.a: "敬奉#italic 圣罩#!，并向圣母祈祷。"
 pilgrimage_expedition_events.5.b: "此地的美值得沉思。"
 pilgrimage_expedition_events.5.c: "一座美丽的主教座堂。我们的人民需要我们回家。"
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.5.historical_info: "沙特尔圣母大教堂是法国哥特式建筑最杰出的典范之一，自中世纪早期起便是一处朝圣地。它的主要圣髑——#italic 圣衣#!，即一段据信是圣母领报时所穿束腰外衣的布料——由查理曼赠予该教堂，并在1194年一场摧毁了先前罗曼式建筑的大火中幸存下来。大教堂随后围绕这件圣髑以极快的速度重建；其西侧玫瑰窗和柳叶窗约建于1220年，是世界上最著名的中世纪彩绘玻璃之一。#italic 圣衣#!使沙特尔成为欧洲首屈一指的圣母朝圣地。"
 pilgrimage_expedition_events.6.title: "殉道者圣龛"
 pilgrimage_expedition_events.6.desc: "[current_location.GetName]坐落在绿意盎然的[ShowCultureName('english')]乡间的一处浅谷里，旅行者在抵达前数英里，就能看见它的大教堂塔楼。[current_location.GetRank.GetName]里挤满了朝圣者；旅店住不下，人们就住进谷仓和庭院里，路上挤满了说着十几种语言的人，全都往同一个地方走。\n\n圣托马斯·贝克特的圣祠在高高的祭坛后方的三一礼拜堂里。它曾是[ShowScriptedGeographyName('england_geography')]装饰最奢华的圣祠：珠宝、黄金，还有各式各样的还愿供品。[target_ruler.GetName]在它面前停下脚步。这里曾有一个人因为反抗国王被击倒。在这里，这份反抗成了圣迹。不管怎么说，这件事里总藏着某种值得琢磨的东西。"
 pilgrimage_expedition_events.6.a: "在贝克特神龛前点燃蜡烛并祈祷。"
 pilgrimage_expedition_events.6.b: "为信众的灵魂奉献一台弥撒。"
 pilgrimage_expedition_events.6.c: "这位圣徒已经受够了统治者们的敬礼。我们回家。"
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.6.historical_info: "坎特伯雷大主教托马斯·贝克特于1170年12月29日在他自己的大教堂内被英格兰国王亨利二世的骑士杀害，据说他们受国王的暗示行事。他的死震惊了整个基督教世界，仅仅三年后，即1173年，他便被册封为圣人。亨利二世被迫在贝克特的墓前公开补赎；贝克特的圣龛很快成为英格兰最多人朝拜的圣地，并因杰弗里·乔叟的#italic 《坎特伯雷故事集》#!而不朽。这座圣龛装饰着两个世纪间捐赠的、数量惊人的珠宝与黄金，其中包括“法兰西王宝”——一颗由法国国王路易七世赠予的大红宝石。1538年，亨利八世下令摧毁这座圣龛，并没收其财宝。"
 pilgrimage_expedition_events.7.title: "圣帕特里克座堂"
 pilgrimage_expedition_events.7.desc: "[current_location.GetName]坐落在[ShowRegionName('ireland_region')]北部的一座矮丘上，它的两座大教堂从周围的农田里就能望见。这不是一座宏伟的城市——比不上[ShowLocationName('rome')]，也比不上[ShowLocationName('jerusalem')]——但它带着沉静的威严，尽显古老。这里是[ShowRegionNameWithNoTooltip('ireland_region')]境内最古老的[ShowReligionGroupAdjective('christian')]社群，是圣帕特里克当年登岛传教时亲自设立的教区。\n\n[target_ruler.GetName]清晨抵达，雾气还缠在山丘上。大教堂的一位教士在门口迎接[target_ruler.GetHimHer]，领着[target_ruler.GetHimHer]走到传说中圣帕特里克曾祈祷的地方。这个地方的朴素让人意外，却又莫名地合适。"
 pilgrimage_expedition_events.7.a: "在圣帕特里克主教座堂望弥撒。"
 pilgrimage_expedition_events.7.b: "在圣帕特里克圣龛留下献仪。"
 pilgrimage_expedition_events.7.c: "一次怀着敬意的访问。是时候返回了。"
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.7.historical_info: "阿马在传统上被视为爱尔兰的教会首府，这一地位源自它与圣帕特里克的渊源——据说圣帕特里克约于公元445年在那里建立了自己的主教堂。阿马教座后来成为爱尔兰教会的首席主教座，如今城里两座山丘上分别矗立的天主教堂和新教教堂，至今仍在争夺这一地位。随着宗教改革临近，阿马的重要性既在于其政治权力，也在于其象征分量——它是那位使爱尔兰皈依的宗徒的教会——这使它成为统治者寻求展示虔诚或与爱尔兰教会团结的目的地。"
 pilgrimage_expedition_events.8.title: "沿途的圣龛"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName]抵达[current_location.GetName]，漫长虔诚之路上的又一个驿站。无论最初是什么圣物或圣洁记忆吸引朝圣者来此，它仍然吸引着他们，一代又一代，远在大多数经过此地的人忘记细节之后。\n\n[target_ruler.GetSheHe|U]在其他旅行者中停下，像[target_ruler.GetHerHis]自己的随从一样疲惫、满身尘土，为至此的安全通行感恩。"
 pilgrimage_expedition_events.8.a: "为安全通行感恩。"
 pilgrimage_expedition_events.8.b: "为后来的朝圣者留下献仪。"
 pilgrimage_expedition_events.8.c: "这圣地已在我们身后。是时候转向回家了。"
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.9.title: "朝圣以悲伤告终"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName]死在路上，朝圣如今未完成。损失的消息将慢慢传到[ROOT.GetCountry.GetName]，由最后留在[target_leader.GetHerHis]身边的随从带回家。"
 pilgrimage_expedition_events.9.a: "我们将哀悼我们的损失。"
 pilgrimage_expedition_events.17.title: "朝圣被放弃"
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName]带着未履行的誓言转向回家，朝圣在离终点某处被放弃。违背誓言的消息在[target_leader.GetHimHer]之前传到[ROOT.GetCountry.GetName]，而[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]将在[ROOT.GetCountry.GetGovernment.GetCourtTitle]早已翻篇后仍长久记得。"
 pilgrimage_expedition_events.17.a: "我们羞愧地返回，对天主的誓言未履行。"
 pilgrimage_expedition_events.10.title: "亚西西的穷人"
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName]爬上最后一道坡进入[current_location.GetName]，伟大的主教座堂在[target_ruler.GetHimHer]面前以两层苍白石头升起，嵌入山坡本身，在其所纪念的人死后以惊人速度建成——一个一无所有的乞丐，如今拥有一座意大利最壮丽教堂之一。\n\n在下层教堂内，一个从活岩中凿出的地下室，躺着亚西西的圣方济本人。[target_ruler.GetSheHe|U]跪在一个放弃丝绸和黄金、选择绳带和赤脚的人墓前，据说他曾向鸟讲道并驯服了一只狼。圣人的贫穷与为纪念他而建的辉煌之间的矛盾，[target_ruler.GetHimHer]并非没有察觉。"
 pilgrimage_expedition_events.10.a: "像圣方济本人那样谦卑跪下。"
 pilgrimage_expedition_events.10.b: "以圣人自己的精神，在外面施舍穷人。"
 pilgrimage_expedition_events.10.c: "我们已表达敬意。是时候回去了。"
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "亚西西的方济各（1181/2—1226）放弃家族财富，过贫穷生活，以谦卑、巡回布道和服务贫病者为原则，创立了方济各会。他于1228年被教宗额我略九世册封为圣人，即去世仅两年后，是中世纪历史上最快的封圣案例之一。同年，圣方济各大殿开始建造，至1253年大体完工；其下层教堂和上层教堂后来装饰有被认为是契马布埃和乔托所作的壁画。尽管这位圣人本人拒绝物质财富，亚西西却成为天主教欧洲伟大的朝圣地之一，吸引着统治者和普通朝圣者前来。"
 pilgrimage_expedition_events.11.title: "水手圣人"
 pilgrimage_expedition_events.11.desc: "[target_ruler.GetName]还没到[current_location.GetName]城墙，就已经闻到了海的味道。这座港口[current_location.GetRank.GetName]是围绕着一件独一无二的至宝建起来的。在大教堂的罗马式拱顶下方，是米拉的尼古拉斯的墓，一百多年前当地水手把他从已经无力保护这些圣物的、日渐破败的东方基督教教堂里带了回来，安置在这里。\n\n每年一次，墓会被打开，从圣徒的骸骨周围取出一种清澈的液体，也就是#italic 甘露#!，[ShowReligionAdjective('catholic')]和[ShowReligionAdjective('orthodox')]的信徒都相信它拥有治愈的力量。有人给[target_ruler.GetName]看了一小瓶这种液体，[target_ruler.GetName]忽然意识到，这次朝圣之旅中，没有别的圣地在基督教的两个分支那里同时受到如此完整的尊崇。"
 pilgrimage_expedition_events.11.a: "敬奉陵墓，获得一瓶甘露。"
 pilgrimage_expedition_events.11.b: "为将圣人迎回故乡的水手们委托举行一场弥撒。"
 pilgrimage_expedition_events.11.c: "圣人已祝福我们。现在我们回家。"
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "1087年，六十二名来自巴里的水手航行至利西亚的米拉——当时该地正受到塞尔柱征服的威胁——在圣尼古拉的遗骨可能遗失或被毁之前将其移走。圣髑于1087年5月9日抵达巴里，这一天至今仍作为“圣髑迁移节”庆祝；人们兴建了圣尼古拉大教堂来安放它们，其地下墓室于1089年在教宗乌尔班二世面前被祝圣。自圣髑抵达以来，一种信众称为#italic 吗哪#!的清澈液体便持续在遗骨周围形成，每年由巴里大主教取出。作为水手、商人和儿童的主保圣人，也是天主教和东正教世界同等敬奉的少数圣人之一，尼古拉使巴里成为意大利独一无二的朝圣地。"
 pilgrimage_expedition_events.12.title: "天使的祝圣"
 pilgrimage_expedition_events.12.desc: "[current_location.GetName]的本笃会修道院坐落在[ShowCultureGroupName('swiss_group')]高地的一片黑森林边缘，这里穿黑袍的修士，都是几代前在这个地点被强盗杀害的一名隐士的后人。[target_ruler.GetName]从小就听过这个故事：这里的小教堂没有经过任何主教祝圣，而是由基督本人在祝圣前夜，带着天使和圣徒的唱诗班降临完成的。\n\n在圣母小礼拜堂里，立着那次存在争议的首次祝圣的对象：一尊圣母小雕像，几个世纪的烛火熏烤让它变成了深黑色。来自所有德语地区的朝圣者在她面前跪成绵延不断的长队，队伍延伸的长度远超出[target_ruler.GetNameWithNoTooltip]轻易能想象的范围。"
 pilgrimage_expedition_events.12.a: "在黑圣母像前虔诚跪拜，默默祈祷。"
 pilgrimage_expedition_events.12.b: "资助修院著名的图书馆和缮写室。"
 pilgrimage_expedition_events.12.c: "这些黑暗森林我们看够了。继续前进。"
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "艾因西德伦的起源可追溯到隐士迈因拉德，他在这片森林中定居，并于861年被强盗杀害。934年，在修士埃伯哈德主持下，该址上建立了一座正式的修道院。根据流传不衰的传说，其小教堂于948年9月14日夜间由基督亲自奇迹般地祝圣，这一说法后来得到教宗良八世的认可。该修院的黑圣母数世纪以来一直是朝圣敬礼的对象，使艾因西德伦成为德语世界参观人数最多的圣母朝圣地之一。"
 pilgrimage_expedition_events.13.title: "光明山"
 pilgrimage_expedition_events.13.desc: "在[target_ruler.GetName]抵达修道院大门前很久，#italic 光明山#!已从平原上显露出来，它的白墙以建造它的保罗派修士刻意设计的方式迎着光。在内部，一整面还愿银器和燃烧的蜡烛后方，悬挂着那幅黑面圣母圣像，正是它让这座不起眼的[ShowCultureGroupName('polish_group')][current_location.GetRank.GetName]成了来自整个北方的朝圣者的目的地。\n\n[target_ruler.GetName]仔细看着圣母的脸，看到了那些痕迹：她右脸颊上有两道平行的伤疤，是很旧的伤口，任何修复都没能完全抹去。很久以前，一个掠夺者的剑砍中了她，之后修士们重新给她上色时，发现那些切口一次又一次地从新漆下面渗出血来，直到他们放弃掩盖已经发生的事。"
 pilgrimage_expedition_events.13.a: "敬奉圣像及其历久弥新的圣痕。"
 pilgrimage_expedition_events.13.b: "承诺黄金用于防御工事，使其不被掠夺。"
 pilgrimage_expedition_events.13.c: "我们已见圣山。让我们回家吧。"
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "光明山的保禄会修道院由奥波莱公爵瓦迪斯瓦夫于1382年创建，他带来了一幅拜占庭风格的圣母圣婴像，当时已被尊为奇迹圣像。1430年复活节，一伙来自波希米亚、摩拉维亚和西里西亚的胡斯派劫掠者冲进修道院，将圣像打成碎片，并用马刀在圣母脸上砍了两刀。克拉科夫瓦迪斯瓦夫·雅盖沃王室宫廷的修复师修复了这块画板，但每重新涂上一层颜料，伤痕都会再次显现，最终被保留为圣像永久而有意保留的特征。琴斯托霍瓦圣母成为波兰最首要的圣母朝圣地；此后数百年间，她带伤痕的面容被复制到该地区各地的圣像上。"
 pilgrimage_expedition_events.14.title: "圣斯德望座堂"
 pilgrimage_expedition_events.14.desc: "[current_location.GetName]坐落在多瑙河的弯道处，城中的大教堂山俯瞰着这条曾作为基督教欧洲边界的河流。在这里，在一座历经反复重建的小礼拜堂里，匈牙利的斯蒂芬出生、受洗，并在千禧年之交的一个冬日，加冕为他的族人的第一位基督教国王。\n\n[target_ruler.GetName]受到了[current_location.GetNameWithNoTooltip]大主教——匈牙利首席主教、斯德望本人创立的教区的继任者——的接待。大主教谈起那位舍弃旧神选择受洗的年轻国王，谈起他先建这座教堂、再修建自己宫殿的往事，以及他去世后短短数十年就被封圣的经历，而这恰恰是因为他明白，一顶基督教的王冠，必须依托于一座基督教的教会。"
 pilgrimage_expedition_events.14.a: "以默祷向圣斯德望的遗产致敬。"
 pilgrimage_expedition_events.14.b: "与匈牙利大主教兼首席主教进行深入探讨。"
 pilgrimage_expedition_events.14.c: "对一位基督徒统治者来说是一次相称的访问。该离开了。"
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "匈牙利的伊什特万一世约于975年出生在埃斯泰尔戈姆，并在公元1000年圣诞节临近时于该地加冕——这一事件标志着基督教匈牙利王国的正式诞生。伊什特万于1001年创立了埃斯泰尔戈姆总主教区，这是该国最古老的总主教区，其总主教自此一直拥有匈牙利首席主教的地位。埃斯泰尔戈姆在13世纪中叶之前一直是王国的政治与宗教首都；而伊什特万本人于1083年被册封为圣人，更巩固了这座城市作为匈牙利基督教精神核心的地位。"
 pilgrimage_expedition_events.15.title: "克罗地亚的拿撒勒"
 pilgrimage_expedition_events.15.desc: "在[current_location.GetName]上方俯瞰海湾的山丘上，有一座不大的方济各会教堂，围绕着一块空地而建——这里的朝圣者坚持说，那块空地上曾经立着某样非凡的东西。他们说，有三年时间，圣家本人的房子就立在这块地上，当圣地变得太危险、无法保护它时，被天使整座从拿撒勒搬来，之后又继续它那奇迹般的旅程，去了意大利的洛雷托。\n\n有人向[target_ruler.GetName]展示了教宗送来的画作，用来安抚[current_location.GetRank.GetName]，弥补圣家房屋的离去：画中是正在给圣婴哺乳的圣母，据说这幅画出自圣路加本人之手。从那之后的一代代人里，它一直将朝圣者吸引到这座山坡上，成为一座纪念某样已不在此处，却又以某种方式依然存在的事物的圣所。"
 pilgrimage_expedition_events.15.a: "敬礼特拉萨特圣母画。"
 pilgrimage_expedition_events.15.b: "在一个靠海为生的[current_location.GetRank.GetNameWithNoTooltip]，为安全航行奉献一台弥撒。"
 pilgrimage_expedition_events.15.c: "家族已前往洛雷托。我们也必须踏上归途。"
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "根据传说，纳匝肋的圣家——圣母玛利亚的居所——于1291年5月10日由天使搬运到里耶卡上方的特尔萨特山丘，在那里停留了三年，随后于1294年12月10日继续迁往意大利的洛雷托。尼古拉一世·弗兰科潘在该址上修建了第一座教堂，以标记圣屋曾矗立之处。1367年，教宗乌尔班五世向该朝圣地赠送了一幅圣母圣婴画像，传统上认为出自圣路加之手，作为圣屋离去后的慰藉；自下个世纪起，方济各会修士一直守护着这处圣所。这一传说使该镇赢得了流传至今的称号：克罗地亚的纳匝肋。"
 pilgrimage_expedition_events.16.title: "殉道国王"
 pilgrimage_expedition_events.16.desc: "[current_location.GetName]的大教堂在北方的天空下拔地而起，色调冷峻灰暗，它修建在一片沙洲之上。一位国王去世一年多后，他的墓穴被打开，在场所有人都震惊地发现，他的遗体没有腐烂。故事里说，他的头发和指甲在黑暗的泥土里仍在继续生长，本该散发出死亡腐臭的棺木中，却飘出甜美的香气。\n\n[target_ruler.GetName]站在奥拉夫·哈拉尔松的圣祠前。他曾是一名维京军阀，在试图将基督教强行推行给一个不愿接受它的王国时战死，死后不到一年，仅凭民众的拥戴就被追封为圣徒，根本不需要远在别处的教宗批准。[target_ruler.GetNameWithNoTooltip]暗自思忖，这是一种很特别的圣徒身份：它不是靠温和的虔诚赢得的，而是靠刀剑，靠为一个事后看来才算正义的事业赴死换来的。"
 pilgrimage_expedition_events.16.a: "在他的圣龛前敬礼不腐的国王。"
 pilgrimage_expedition_events.16.b: "奥拉夫的教训：以剑传教，信仰依旧。"
 pilgrimage_expedition_events.16.c: "一个寒冷而神圣的地方。让我们回家。"
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "挪威国王奥拉夫·哈拉尔松于1030年7月29日在斯蒂克莱斯塔德战役中阵亡，当时他正为夺回王位、并以武力完成王国的基督教化而战。一年零五天后，即1031年8月3日，他的坟墓被打开，格里姆凯尔主教发现遗体似乎未曾腐烂，仅凭这一发现便宣布奥拉夫为圣人——这是一次地方性的封圣，后来于1164年得到教宗亚历山大三世的确认。尼达罗斯大教堂建在他的圣龛之上，成为北方最首要的朝圣地，吸引着来自斯堪的纳维亚及更远地方的信众，沿着如今仍被称为“圣奥拉夫之路”的道路网络前来。"
 pilgrimage_expedition_events.18.title: "山口"
 pilgrimage_expedition_events.18.desc: "道路爬入光秃、被风刮过的乡间，路窄成沿山肩的一条小径。[target_ruler.GetName]在岔路处停下：一条较长的路线绕过最艰难的攀登，一条直接的路线，当地牧羊人说准备不足的人不总能活下来。\n\n[target_ruler.GetSheHe|U]权衡山与日历。花在寻找更容易路线上的每一天，都是队伍没有更接近旅程终点的一天。"
 pilgrimage_expedition_events.18.a: "雇用知道每个安全落脚点的当地向导。"
 pilgrimage_expedition_events.18.b: "没有他们继续前进，信赖信仰和脚步。"
 pilgrimage_expedition_events.18.c: "掉头走绕山脉的较长道路。"
 pilgrimage_expedition_events.19.title: "海上风暴"
 pilgrimage_expedition_events.19.desc: "船上的天空毫无预警地变暗，一小时内船员就在与完全越过栏杆的巨浪搏斗。[target_ruler.GetName]在找到抓手前被摔到桅杆上，[target_ruler.GetHimHer]脚下的甲板像活物一样颠簸。\n\n在甲板下，朝圣者抓住任何固定住的东西，用十几种方言同时祈祷。在海决定与他们了结之前，几乎无事可做。"
 pilgrimage_expedition_events.19.a: "在甲板下挺过去，希望船能撑住。"
 pilgrimage_expedition_events.19.b: "把队伍聚集在甲板上，在风暴中祈祷。"
 pilgrimage_expedition_events.19.afloat_tt: "船员设法让船浮着"
 pilgrimage_expedition_events.19.off_course_tt: "风暴使船严重偏离航向"
 pilgrimage_expedition_events.19.faith_protects_tt: "我们的信仰在风暴中保护我们"
 pilgrimage_expedition_events.19.piety_lacking_tt: "我们的虔诚在风暴面前不够"
 pilgrimage_expedition_events.20.title: "涉水过河"
 pilgrimage_expedition_events.20.desc: "道路在一条因近日雨水而高涨、浑浊的河流处突然中断，本应在那里的浅滩淹没在水流下，强到能把马冲倒。一个渡船夫在对岸看着，不急着过河，除非看见实打实的钱币。\n\n[target_ruler.GetName]轮流打量水和渡船夫。今天两者看起来都不特别可信。"
 pilgrimage_expedition_events.20.a: "付钱给渡船夫以求安全通行。"
 pilgrimage_expedition_events.20.b: "直接涉水过河，省下通行费。"
 pilgrimage_expedition_events.21.title: "沼泽热病"
 pilgrimage_expedition_events.21.desc: "道路陷入低洼死水数英里，空气因腐烂和咬人昆虫而变浓。几天内，随从中咳嗽变成发烧，不止一个旅行者不得不被抬着而不是行走。\n\n[target_ruler.GetName]看着队伍在这片乡间每过一英里就变得更稀少、更安静，想知道他们中有多少人报名的是朝圣而不是瘟疫。"
 pilgrimage_expedition_events.21.a: "快速前进，把沼泽抛在身后。"
 pilgrimage_expedition_events.21.b: "停下让病人恢复后再继续。"
 pilgrimage_expedition_events.22.title: "冬天封路"
 pilgrimage_expedition_events.22.desc: "雪以高过人的雪堆封住前方山口，当地村民直说春天前没人能过这条路。[target_ruler.GetName]没有计划因天气损失一个季节，但山不咨询旅行计划。\n\n附近有一个镇子，有足够空间容纳队伍，如果[target_ruler.GetHerHis]的钱包能承受住宿。或者有向导，收费，声称知道即使现在也能通过的路。"
 pilgrimage_expedition_events.22.a: "在附近镇子等待冬天过去。"
 pilgrimage_expedition_events.22.b: "付钱请向导和马车强行通过。"
 pilgrimage_expedition_events.23.title: "领主的款待"
 pilgrimage_expedition_events.23.desc: "朝圣接近的消息比队伍本身传得更快，当地领主亲自骑马出来迎接[target_ruler.GetName]，邀请在继续前行前在他自己的餐桌旁休息。提供的款待很慷慨，明显意在被人看见和记住。\n\n[target_ruler.GetSheHe|U]认出这个提议的本质：如果以恰当的优雅接受，既是虔诚也是声望。"
 pilgrimage_expedition_events.23.a: "优雅地接受款待。"
 pilgrimage_expedition_events.23.b: "拒绝耽搁，改为私下祈祷。"
 pilgrimage_expedition_events.24.title: "敌意领主的通行费"
 pilgrimage_expedition_events.24.desc: "前方的道路穿过一位将[ROOT.GetCountry.GetName]列为其敌人之一的领主的土地，他的人带着通行税卡和一项要求等在边境。[target_ruler.GetName]本希望安静通过。那个希望在看到横在路上的长矛时破灭了。\n\n收税人报出的价格与其说是提议不如说是侮辱，并等着看[target_ruler.GetHerHis]的骄傲值多少。"
 pilgrimage_expedition_events.24.a: "支付要求的通行费。"
 pilgrimage_expedition_events.24.b: "凭借我们现有的随从强行通过。"
 pilgrimage_expedition_events.24.c: "转道寻找绕过领地的远路。"
 pilgrimage_expedition_events.25.title: "另一种信仰"
 pilgrimage_expedition_events.25.desc: "道路经过一座对[current_location.GetDominantReligion.GetAdjective]信徒神圣的圣龛，其圣像和仪式都很陌生。[target_ruler.GetName]看着当地崇拜者进行敬拜，他们对途经此地的外来者既感好奇又略带警惕。\n\n朝圣者中有一个古老习惯，只要有人愿意听，就同对方争论信仰。[target_ruler.GetSheHe|U]权衡今天是否要顺着习惯来。"
 pilgrimage_expedition_events.25.a: "与当地人争论真正信仰的优点。"
 pilgrimage_expedition_events.25.b: "让睡着的狗躺着，安静通过。"
 pilgrimage_expedition_events.26.title: "路上的强盗"
 pilgrimage_expedition_events.26.desc: "荒野吞没道路一段，没有领主的法令保它安全，人影在队伍能反应前从树线出现：武装、衣衫褴褛，显然对抢劫旅行者不陌生。[target_ruler.GetName]快速数了数他们。人数足够成为问题，又太少算不上军队。\n\n他们的首领走上前，报出安全通行的价格，语气清楚表明如果拒绝会发生什么。"
 pilgrimage_expedition_events.26.a: "付钱给他们，了结此事。"
 pilgrimage_expedition_events.26.b: "为朝圣的荣誉战斗。"
 pilgrimage_expedition_events.27.title: "朝圣者加入队伍"
 pilgrimage_expedition_events.27.desc: "王室朝圣在路上的消息提前传开，当[target_ruler.GetName]到达下一个十字路口时，一列衣衫褴褛的普通朝圣者已经聚集在那里，希望在一名统治者随从的保护下走完剩余路程。\n\n他们中有家庭，有步行的老人，独自走不了多远。[target_ruler.GetSheHe|U]不能永远养活整个队伍，但在这里拒绝他们意味着拒绝他们自谋生路。"
 pilgrimage_expedition_events.27.a: "欢迎他们加入队伍。"
 pilgrimage_expedition_events.27.b: "拒绝他们以保持速度。"
 pilgrimage_expedition_events.29.title: "海岸外的海盗"
 pilgrimage_expedition_events.29.desc: "一具低矮、黑暗的船体划过地平线，桨在阳光下闪烁，比任何诚实商人该有的速度更快地接近朝圣船。[target_ruler.GetName]在瞭望员喊出之前很久就认出了海盗的轮廓，没有港口、没有海岸、没有援助在可及范围内。\n\n[target_ruler.GetSheHe|U]把随从能召集的战斗人员聚集到甲板上，权衡他们是否人手足够，或者船上的货物是否比战斗更值钱。"
 pilgrimage_expedition_events.29.a: "拿起武器击退他们。"
 pilgrimage_expedition_events.29.b: "交出船上的货物，希望他们满意。"
 pilgrimage_expedition_events.30.title: "被扣为人质索要赎金"
 pilgrimage_expedition_events.30.desc: "随从因路途而减少，[target_ruler.GetName]成为容易的目标，路上有人注意到了。武装人员在能组织起适当守卫前围住队伍，他们的首领像商人报面包价格一样随意地报出放统治者自由的价钱。\n\n[target_ruler.GetSheHe|U]剩下可召唤的人很少，好的选择更少。"
 pilgrimage_expedition_events.30.a: "支付要求的赎金。"
 pilgrimage_expedition_events.30.b: "试图在夜色掩护下溜走。"
 pilgrimage_expedition_events.28.title: "空空的食品柜"
 pilgrimage_expedition_events.28.desc: "队伍的储备在过了最后一个值得一提的镇子后某处耗尽，随从的肚子像曾经装面包的袋子一样空。[target_ruler.GetName]以前没带过军队，这看得出来：饥饿不在乎前方道路的神圣。\n\n这里的土地至少足够善良，提供了一些东西：田地、果园和一个可及的村庄市场，如果[target_ruler.GetHerHis]队伍愿意花时间、钱或骄傲来利用它们。"
 pilgrimage_expedition_events.28.a: "派随从到乡间觅食。"
 pilgrimage_expedition_events.28.b: "买能找到的任何食物，无论要价多少。"
 pilgrimage_expedition_events.28.c: "没办法了，我们掉头。"
 pilgrimage_resupply_light: "付钱给当地人换取新坐骑、食物和雇工。"
 pilgrimage_resupply_heavy: "不惜代价全面补给和增援随从。"
