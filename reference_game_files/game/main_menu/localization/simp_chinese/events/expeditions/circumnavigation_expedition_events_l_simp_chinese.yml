l_simp_chinese:
 circumnavigation_expedition_events.1.title: "伟大事业"
 circumnavigation_expedition_events.1.desc: "五艘船，二百七十名船员，一年的给养，以及一条没有任何领航员航行过的航线。[target_leader.GetName]平静地讲述着遍布丁香的岛屿，以及一条向西通往香料群岛的航道。港务长不相信[target_leader.GetHimHer]的说法，领航员心里也没底。但船只已经配齐补给，风向也很合适，委任状上还盖着王室的印章。\n\n前方的一切，都尚未出现在任何一张海图上。"
 circumnavigation_expedition_events.1.magellan: "航向加那利群岛。若上帝庇佑，我们将找到西方之海。"
 circumnavigation_expedition_events.1.a: "驶向加那利群岛。何物在远方，我们自会揭晓。"
 circumnavigation_expedition_events.1.historical_info: "1519年9月，斐迪南·麦哲伦与西班牙王室签订合同，从桑卢卡尔‑德巴拉梅达出发，寻找一条通往香料群岛的西行航线。此次远航由五艘船组成：#italic 特立尼达号#!、#italic 圣安东尼奥号#!、#italic 康塞普西翁号#!、#italic 维多利亚号#!和#italic 圣地亚哥号#!。麦哲伦本是葡萄牙航海家，在为葡萄牙服务期间曾航行至印度和摩鹿加群岛，后在国王曼努埃尔一世拒绝为其涨薪后，转而效忠西班牙王室。这次航行将成为人类历史上首次环球航行，尽管麦哲伦本人未能活着看到它的完成。"
 circumnavigation_expedition_events.2.title: "最后的熟悉海岸"
 circumnavigation_expedition_events.2.desc: "[current_location.GetProvince.GetName]从海中升起，呈平坦的棕色阶梯状——是岩石的堡垒，映衬着与[departure_port.GetName]依然相同的天空。领航员做最后的测深。人们从铁桶中喝淡水，修补被大西洋涌浪磨损的缆绳。越过最后一道海角，海图便到头了。\n\n一些人在祈祷。少数几个人写下了根本没法寄出去的信。[target_leader.GetName]在甲板上踱步，像是在丈量某种根本无法丈量的东西。此刻装上船的所有物资，必须撑过整片大洋，以及大洋之后的所有行程。"
 circumnavigation_expedition_events.2.a: "带足给养。我们可能再也不会回到这里。"
 circumnavigation_expedition_events.2.b: "趁着水手们还有勇气，马上出发。"
 circumnavigation_expedition_events.2.c: "航线过于不确定。返回港口。"
 circumnavigation_expedition_events.2.historical_info: "加那利群岛——当时处于卡斯蒂利亚统治之下——在整个大航海时代一直是伊比利亚大西洋探险队的标准补给停靠点。麦哲伦的船队在特内里费停靠，装载新鲜补给，然后才开始横渡大西洋前往南美洲海岸的漫长航行。这些岛屿在15世纪初被卡斯蒂利亚殖民，既是补给站，也是驶向未知海域的出发点。一支船队在这里补给得是否充分，直接决定了船员能否在接下来的茫茫大洋航程中存活。"
 circumnavigation_expedition_events.3.title: "新大陆的边缘"
 circumnavigation_expedition_events.3.desc: "在茫茫[ShowContinentName('atlantic_ocean_continent')]上航行了数周之后，一道低矮的绿色线条在西边的地平线上逐渐清晰——那就是新大陆的海岸。鹦鹉在林间鸣叫，上百条河流流淌着甘甜的淡水。独木舟从岸边驶来，划桨的人带着好奇，却并不害怕，送上木材、水和奇怪的水果。这里有一支疲惫的船队想要的一切，但季节正在改变，向南的航道还没有找到。\n\n[target_leader.GetName]权衡着岸上的安逸和仍需航行的里程。"
 circumnavigation_expedition_events.3.a: "上岸补充木材、淡水和水果；与当地人进行贸易。"
 circumnavigation_expedition_events.3.b: "海岸可以再等等。趁着季节尚可，向南推进。"
 circumnavigation_expedition_events.3.historical_info: "麦哲伦的船队于1519年末抵达巴西海岸，在圣阿戈斯蒂纽角附近登陆，然后继续向南航行。根据《托德西利亚斯条约》，巴西属于葡萄牙的那一半世界，因此一支为西班牙效力的船队不能公开在那片海岸停留；尽管如此，沿海的图皮人仍热切地与其交易。这片土地物产丰饶，让横渡大西洋的船员们得到了难得的舒缓。"
 circumnavigation_expedition_events.4.title: "巨湾"
 circumnavigation_expedition_events.4.desc: "船队驶入一处巨大而避风的港湾，仿佛天赐之物——四周青山环绕，水中银光闪烁，满是鱼群。岸边的居民成群结队地前来，用家禽、水果和鱼交换鱼钩和刀具，拿出的货物多到船舱都装不下。经历了横跨大西洋的漫长航程之后，这里简直就是天堂，船员们巴不得永远留在这里。\n\n但天堂从来不是远航的好归宿。[target_leader.GetName]必须决定这支舰队可以在此停留多久。"
 circumnavigation_expedition_events.4.a: "让船员休整，并补充满给养；这样的丰饶不会再有。"
 circumnavigation_expedition_events.4.b: "尽可能换取补给，一周内离开。"
 circumnavigation_expedition_events.4.c: "我们不是来赴宴的。无需贸易，继续航行。"
 circumnavigation_expedition_events.4.historical_info: "这片日后将孕育里约热内卢的巨大海湾，为麦哲伦船队提供了整个航程中最丰富的一次补给。这里避风的水域鱼群密集，沿岸的图皮人用数量惊人的食物换取小饰物和铁制工具。在这里彻底补足给养，让船员们做好了应对寒冷纬度和寻找海峡的准备；而匆忙离开的船队，将在南方为自己的仓促付出代价。"
 circumnavigation_expedition_events.5.title: "白银之口"
 circumnavigation_expedition_events.5.desc: "领航员们知道一定存在一条航道。没有哪块大陆会永远延伸下去。可这片巨大的河口实在太宽，从桅杆顶端也望不见对岸，河水虽然带咸味，却裹挟着泥沙，将四十里格的水域染成了黄褐色。小船被派往河口上游探查，耗时两周。\n\n它们回来后，只带回了这里有鲶鱼、水域很浅、没有通往任何大洋的航道的消息。真正的航道还在更靠南的某处等待着——前提是它真的存在。"
 circumnavigation_expedition_events.5.a: "好好勘察一下河口；这或许值得了解。"
 circumnavigation_expedition_events.5.b: "我们没时间浪费在不知流向的河流上。向南推进。"
 circumnavigation_expedition_events.5.press_tt: "舰队毫不耽搁地向南进发，寻找必定位于下方某处的航道"
 circumnavigation_expedition_events.5.c: "这里的纬度超出了常理。返航吧。"
 circumnavigation_expedition_events.5.historical_info: "拉普拉塔河——意为“白银之河”——由西班牙航海家胡安·迪亚斯·德·索利斯于1516年发现并进行探索，但他在登陆后不久便被原住民杀死。麦哲伦的探险队在1520年1月探查了这片河口，错误地认为这里可能就是向西的航道。这个失误让他们耗费了数周时间，却也促成了西班牙人对拉普拉塔河区域的首次详细勘察。这条河得名于查鲁亚人和瓜拉尼人在此交易的白银，不过传闻中位于内陆深处的银山，始终没能找到。"
 circumnavigation_expedition_events.6.title: "世界尽头的通道"
 circumnavigation_expedition_events.6.desc: "这条通道寒冷、狭窄，处处暗藏致命危险。两侧黑色岩壁陡直如削，水道七弯八绕，领航员也已分不清哪边是西。风才是真正的敌人：它从雪原上倾泻而下，毫无预兆地改变方向，在骤起的白飑中呼啸着穿过索具，把船吹回原路，又一连数日将它们困在岩壁旁。\n\n岩壁不断向中间收拢，[target_leader.GetName]在旗舰船首沉默伫立。领航员说这条通道可以通航。船员却不敢确定领航员是否还清醒。如果海图还有一点可信度的话，前方的某处，就是一片广阔到还没有名字的大洋。"
 circumnavigation_expedition_events.6.a: "全速前进，乘风破浪。区区风力无法阻挡我们。"
 circumnavigation_expedition_events.6.b: "在这里过冬。等船员们休整好了，航道会好走些。"
 circumnavigation_expedition_events.6.c: "没有哪条航线值得这样冒险。让舰队调头。"
 circumnavigation_expedition_events.6.historical_info: "麦哲伦海峡——于1520年11月完成首次航行——是一条贯穿南美洲最南端的570公里长的通道，一侧是火地岛，得名于当地居民点燃的守望篝火。这段穿越航程耗时38天。在靠近海峡的途中，麦哲伦在圣胡利安港镇压了一场哗变，处决了一名船长，将另一名船长流放荒岛。第三艘船#italic “圣安东尼奥号”#!擅自离队，返航西班牙。剩下的三艘船——#italic “特立尼达号”#!、#italic “康塞普西翁号”#!和#italic “维多利亚号”#!——在1520年11月28日驶入麦哲伦命名的#italic 太平洋#!，之所以如此命名，是因为在经历了海峡的凶险之后，这片海域看起来格外平静。"
 circumnavigation_expedition_events.7.title: "起名太平洋的海"
 circumnavigation_expedition_events.7.desc: "海峡最后一处黑色的海岬落到了船尾后方，舰队面前是一片无边无际的大洋。[target_leader.GetName]因其平静将它命名为#italic 太平洋#!——而这种平静将化为一种诅咒。一周又一周过去，没有岛屿出现。桶里的水变黄发臭；饼干成了粉末和象鼻虫；船员们啃起了挂在船边泡软的牛皮，甚至愿意为一只老鼠出半个杜卡特。\n\n领航员说不出这片海到底有多宽，因为从未有人横渡。无论[target_leader.GetName]选择怎样面对它，出发的人中总有一些活不到看见对岸。"
 circumnavigation_expedition_events.7.a: "按现有物资定量配给，保持稳定谨慎的航向。"
 circumnavigation_expedition_events.7.endured_tt: "船员们撑过了这次横渡；船队抵达对岸时仍有作战能力"
 circumnavigation_expedition_events.7.scurvy_tt: "坏血病和饥饿造成了惨重损失；船队拖着被掏空的船员继续向前"
 circumnavigation_expedition_events.7.b: "全帆前进。越早靠岸，死的人就越少。"
 circumnavigation_expedition_events.7.fast_tt: "迅速的航行避免了最严重的伤亡，陆地及时出现了"
 circumnavigation_expedition_events.7.lost_tt: "大海比任何人想象的都要辽阔。最后的给养耗尽，探险队全军覆没"
 circumnavigation_expedition_events.7.c: "向北寻找传闻中的岛屿，祈求能找到淡水。"
 circumnavigation_expedition_events.7.islands_tt: "零星岛屿提供了水源和新鲜食物；船队几乎完整地渡过了这片海域"
 circumnavigation_expedition_events.7.empty_sea_tt: "向北的航程和其他方向一样空无一物；这次搜寻耗费了宝贵的时间，也搭上了更多人的性命"
 circumnavigation_expedition_events.7.historical_info: "麦哲伦横渡太平洋的航程持续了约九十九天，全程未获任何补给——舰队误打误撞穿过了地球上最大的海洋里最空旷的一片海域，几乎没见到任何陆地。大约十九人死于坏血病；幸存者靠吃锯末、泡过海水的皮制防磨护垫以及船员之间高价倒卖的老鼠活了下来。他们第一次登陆的地点是1521年3月抵达的马里亚纳群岛中的关岛，西班牙人将这里称为#italic 盗贼群岛#!，起因是查莫罗岛民拿走了其中一艘船的小艇，这引发了一场惩罚性的袭击。向东横跨太平洋返航的航线一直难住了航海者，直到安德烈斯·德·乌尔达内塔在1565年找到了北方的#italic 返航航线#!，开启了持续数百年的马尼拉大帆船贸易。"
 circumnavigation_expedition_events.8.title: "两个月来第一块陆地"
 circumnavigation_expedition_events.8.desc: "六十多天来，船队除了水什么也没看见。忽然，桅杆顶上传来一声呼喊：陆地！希望如火焰般传遍各船——直到小艇靠近才发现，这片“陆地”只是一圈低矮的珊瑚礁和棕榈树，被海浪不断拍打着，没有能下锚的水深，也找不到淡水的痕迹。鸟群在头顶盘旋，树上没有任何能让饿肚子的人果腹的东西。\n\n这座岛给予的，只有希望落空的残忍。[target_leader.GetName]必须决定是留下来搜寻，还是继续向前航行。"
 circumnavigation_expedition_events.8.a: "放下小船，在礁石上寻找淡水或食物。"
 circumnavigation_expedition_events.8.barren_tt: "礁石一无所出，只余对“陆地”的嘲弄，时间就这样白白浪费"
 circumnavigation_expedition_events.8.relief_tt: "一点雨水，几只海鸟——聊以慰藉饥肠辘辘"
 circumnavigation_expedition_events.8.b: "这里什么都没有，也没有能下锚的水深。继续航行吧。"
 circumnavigation_expedition_events.8.historical_info: "1521年1月24日，舰队望见了它在太平洋上见到的第一片陆地：一座无人居住的小型环礁，他们将其命名为圣巴勃罗，它很可能就是土阿莫土群岛中的普卡普卡岛。根据皮加费塔的记录，横渡途中发现的两座岛屿“没有可以下锚的地方，因为测不到水深”，岛上“只有鸟和树”。无法登陆的饥饿船员没法从岛上获取任何物资，麦哲伦将这两座岛命名为#italic 不幸群岛#!。"
 circumnavigation_expedition_events.9.title: "鲨鱼岛"
 circumnavigation_expedition_events.9.desc: "第二座岛屿从海面浮现，它和第一座一样荒芜——只有珊瑚和低矮灌木，四周海浪环绕，无处下锚。附近水域唯一的活物是鲨鱼，它们灰色的身影在船底下游动，数量多到让水手们连连在胸前画起十字。这里没法登陆，没有淡水，没有食物——只有同样空旷的大洋，船员们的希望一天比一天更微弱。\n\n[target_leader.GetName]必须决定要让舰队如何承受这份绝望。"
 circumnavigation_expedition_events.9.a: "再次放下小船，试着冲浪上岸。"
 circumnavigation_expedition_events.9.a.tt: "船只空载而归，但船员们至少知道努力过，士气仅小幅下降（#R ‑3#!船员士气）"
 circumnavigation_expedition_events.9.b: "将它命名为鲨鱼岛，然后默默起航。"
 circumnavigation_expedition_events.9.historical_info: "不幸群岛的第二座岛屿于1521年2月21日被发现，得名#italic 鲨鱼岛#!，因为皮加费塔记录这片海域有大量鲨鱼。它大概率是加罗林岛或弗林特岛，同样没有可供下锚的水深，也没法给船员提供任何补给。两座岛之间的那几周是这次横渡最艰难的阶段：坏血病持续夺走生命，船员们靠吃皮革、锯末和老鼠勉强活命。他们没有捕捞海里的鲨鱼；他们甚至连岸边都没法靠近。"
 circumnavigation_expedition_events.10.title: "盗贼群岛"
 circumnavigation_expedition_events.10.desc: "就在所有人快要撑不住时，瞭望员发现了绿色的山峦——终于见到了真正的陆地，这里有淡水、水果和鱼。独木舟成群地驶出来迎接船队，舟上的人迅捷而无所畏惧，登上船后拿走了所有没被绑牢的东西。对他们来说，无人看管的东西就是可以随便拿走的；而在饥肠辘辘的船员眼中，这就是抢劫。\n\n这些岛屿可以拯救探险队，只要[target_leader.GetName]能从他们那里弄到补给。"
 circumnavigation_expedition_events.10.a: "公平交易，换取我们能携带的所有食物和水。"
 circumnavigation_expedition_events.10.b: "带武器上岸夺回小艇，拿走我们需要的东西。"
 circumnavigation_expedition_events.10.c: "夺走独木舟上的东西，然后驶向大海。"
 circumnavigation_expedition_events.10.historical_info: "舰队于1521年3月6日抵达马里亚纳群岛的关岛，这是他们驶过海峡之后第一次靠岸。麦哲伦将这些岛屿命名为#italic 盗贼群岛#!——因为查莫罗人没有私有财产的概念，拿走了一艘船上的小艇。作为报复，麦哲伦派出约四十名武装人员登陆，烧毁房屋，杀死数名岛民，以夺回小艇。不管过程如何，这次停靠让濒死的船员们三个多月以来第一次吃到了新鲜食物、喝到了淡水，这成了他们的救命转机。"
 circumnavigation_expedition_events.11.title: "宿务的血与信仰"
 circumnavigation_expedition_events.11.desc: "这些岛屿拯救了探险队。在横渡的磨难之后，[target_leader.GetName]的船员们补充了淡水、水果和鲜肉，在宿务，拉贾设宴款待他们。双方以血立誓：他的人民将皈依[ROOT.GetCountry.GetReligion.GetName]，作为回报，这些陌生人的枪炮将为他效力。在热带的阳光下，数百人在一天之内皈依。\n\n但结盟的代价随之而来。隔着一道狭窄的海峡，在麦克坦岛上，一位桀骜的酋长既拒绝信奉[ROOT.GetCountry.GetReligion.GetGodName]，也不承认这位新的宗主——我们的盟友指望我们去制服他。在这些岛屿上交一个朋友，就等于继承了他的所有敌人。"
 circumnavigation_expedition_events.11.a: "为盟友挺身而出，让麦克坦见识我们的实力。"
 circumnavigation_expedition_events.11.mactan_triumph_tt: "展示武力震慑住群岛，我们盟友的敌人也被迫低头"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "强攻在浅滩失利；许多人战死，舰队的实力也因此被削弱"
 circumnavigation_expedition_events.11.b: "收下群岛提供的补给，然后继续航行；此事与我们无关。"
 circumnavigation_expedition_events.11.c: "升起王室旗帜。让王室记下这一发现。"
 circumnavigation_expedition_events.11.historical_info: "麦哲伦于1521年3月抵达菲律宾群岛，将其命名为圣拉萨罗群岛。菲律宾让他们第一次和西太平洋的族群建立了长期接触，也提供了补给，救下了这支饥肠辘辘的舰队。麦哲伦和宿务的拉贾·胡马邦缔结了血盟，让他和数千名臣民皈依了基督教。这个同盟给麦哲伦带来了杀身之祸：1521年4月27日，麦哲伦为了新盟友，发动了一场考虑不周的进攻，越过礁石去攻打酋长拉普拉普，结果在麦克坦之战中阵亡。指挥权最终被移交给胡安·塞瓦斯蒂安·埃尔卡诺，幸存船员因人数过少无法操纵三艘船只，遂在保和岛焚毁了#italic 康塞普西翁号#!。"
 circumnavigation_expedition_events.12.title: "香料群岛"
 circumnavigation_expedition_events.12.desc: "摩鹿加群岛。每一张地图上都标注着这个点，此前没有一艘伊比利亚的船从西边抵达过这里。岛屿还没出现在视野里，气味先飘到了船上——是浓郁厚重的丁香，香气乘着那股带着他们跨过大洋的风飘了过来。\n\n领航员报出测深数据时，[target_leader.GetName]站在甲板上，久久没有开口。船舱几乎空了。船员的规模也只剩当初的一小部分。但他们到了这里，苏丹的船只已经划出来迎接他们了。"
 circumnavigation_expedition_events.12.a: "将货舱装满[ShowGoodsNameWithNoTooltip('cloves')]；我们跨越世界正是为了它。"
 circumnavigation_expedition_events.12.cloves_loaded_tt: "剩下的船舱里装满了[ShowGoodsName('cloves')]，等舰队返航后，这些货物会在[ROOT.GetCountry.GetCapital.GetMarket.GetName]出售。一支完整穿过太平洋的船队，能带回来的货物要丰厚得多"
 circumnavigation_expedition_events.12.b: "与苏丹签订条约。同盟重于货物。"
 circumnavigation_expedition_events.12.treaty_cargo_tt: "与苏丹宣誓缔结了一份条约，装上了一部分[ShowGoodsName('cloves')]——这批货物不算重，但他们在香料群岛建立的友谊，会比这批货物留存得更久"
 circumnavigation_expedition_events.12.historical_info: "摩鹿加群岛，也就是最初的“香料群岛”，是丁香、肉豆蔻和肉豆蔻干皮的产地，正是这些香料让东方贸易极为有利可图。埃尔卡诺的船队于1521年11月抵达蒂多雷，那里的苏丹是特尔纳特的对手，而特尔纳特当时处于葡萄牙势力范围内。#italic 维多利亚号#!和#italic 特立尼达号#!装载了丁香；#italic 特立尼达号#!后来试图向东横渡太平洋返航，因逆风失败，被葡萄牙人俘获。只有埃尔卡诺指挥的#italic 维多利亚号#!继续向西航行。当它最终于1522年9月抵达桑卢卡尔‑德巴拉梅达时，船上只有十八名幸存者和一舱丁香，但仅那一船香料就抵得上为期三年的探险费用，还能盈利不少。"
 circumnavigation_expedition_events.13.title: "绕过好望角"
 circumnavigation_expedition_events.13.desc: "这座海角完全符合老水手故事里描述的样子——一一堵由灰色海水和风组成的墙，把船只当成落叶一样对待。剩下的船员没有抱怨。他们已经穿过了一条本不可能通行的航道，一片没有名字的大洋，还有一个差点吞掉整支舰队的群岛。好望角不过是又一道障碍。\n\n当旗舰绕过海角，风势减弱时，[target_leader.GetName]看向东方，再看向西方。他们现在去过了世界上所有的大洋。"
 circumnavigation_expedition_events.13.a: "心怀感激。无论如何，我们都将被历史铭记。"
 circumnavigation_expedition_events.13.b: "不要什么仪式了。向北推进。我们还没到家。"
 circumnavigation_expedition_events.13.historical_info: "#italic 维多利亚号#!在埃尔卡诺指挥下于1522年5月绕过好望角，完成了返回西班牙之前最后一个主要地理障碍。葡萄牙人控制着好望角航线及其补给港口；由于西班牙和葡萄牙依据《托德西利亚斯条约》对摩鹿加群岛的主权存在争议，这支探险队的身份在法律上并不明确，埃尔卡诺因此避开了这些港口。船的状况很差，不断进水，船员从最初的270人减至18人，几乎耗尽了全部力气。他们在1522年9月6日抵达桑卢卡尔‑德巴拉梅达，用不到三年的时间完成了人类历史上首次环球航行。"
 circumnavigation_expedition_events.14.title: "友好海岸"
 circumnavigation_expedition_events.14.desc: "前方的岛屿上飘扬着[ROOT.GetCountry.GetName]自己的旗帜。在海图未记录的水域航行多年后，船队终于踏上了友好的土地——一处可以修补船缝、装满水桶、让骨瘦如柴的船员无需担惊受怕无需编造谎言就能吃上一顿饱饭的港湾。总督的人来到码头，目瞪口呆地看着这群形容枯槁、衣衫褴褛、声称自己绕了世界一圈的人。\n\n家乡的水域近了。[target_leader.GetName]只需要决定休整多久。"
 circumnavigation_expedition_events.14.a: "让船只恢复状态：填塞缝隙，装满水桶，喂饱船员。"
 circumnavigation_expedition_events.14.b: "只作短暂停留。等回了家，船员才能好好歇息。"
 circumnavigation_expedition_events.14.historical_info: "在麦哲伦的时代，佛得角群岛属于葡萄牙，西班牙舰队不敢公开在此地补给。但如果有一个王权自己掌控着这些大西洋岛屿，就会发现它们是返航前最后一段路途中极其宝贵的落脚点——一处避风之地，可以让一艘被史上最长航行折磨到极致的船倾侧修理、补充淡水和给养。"
 circumnavigation_expedition_events.15.title: "时间问题"
 circumnavigation_expedition_events.15.desc: "最后这艘船的每一道接缝都在漏水，船员饥肠辘辘，可附近唯一能抵达的港口，挂着敌对王冠的旗帜。[target_leader.GetName]下令驾船驶入港口，并编了一套虚假的说辞——他们是从美洲返航，而非其被禁止通行的东方海域。但当船员上岸询问当天日期时，得到的答案却差了一天：在环球航行的途中，舰队的计时里少了一天，这个偏差可能会把所有事都暴露出来。\n\n只要这个骗局不被拆穿，补给就唾手可得。"
 circumnavigation_expedition_events.15.a: "咬定这套说辞。在对方开始盘问之前，快速完成采购。"
 circumnavigation_expedition_events.15.ruse_ok_tt: "故事站得住脚；补给已备妥，船在疑问坐实之前悄然离港"
 circumnavigation_expedition_events.15.ruse_failed_tt: "谎言因为日期有误露了馅，一部分上岸的船员在船逃走之前就被抓"
 circumnavigation_expedition_events.15.b: "别去冒险闯对手的港口。就算我们饿着肚子，也要直接回家。"
 circumnavigation_expedition_events.15.historical_info: "1522年7月，#italic 维多利亚号#!停靠在葡属佛得角群岛的圣地亚哥岛，谎称其从美洲返航，以此掩盖它穿过葡萄牙宣称拥有主权的东方海域的事实。这个伪装一直没被识破，直到航海日志里出现一天的偏差——这也是环球航行对日历产生影响的首个实际证据——葡萄牙人随即扣押了十三名船员。剩下的人砍断缆绳逃走，最终抵达西班牙时，船上只剩十八个人。"
 circumnavigation_expedition_events.16.title: "荒凉的锚地"
 circumnavigation_expedition_events.16.desc: "这些岛屿无人居住——干燥、被风刮得光秃秃的岩堆和灌木丛——但它们毕竟是陆地，石头间有避风的水湾和泉水。更好的是，山坡上跑着野山羊，是早先某艘船留下的，水手们想到在吃了那么久的腐败食物和象鼻虫之后能有鲜肉，就直流口水。\n\n这次停泊，只是会花费一些时间，而对于一艘返航的船来说，时间恰恰是耗得起的东西。[target_leader.GetName]下达了指令。"
 circumnavigation_expedition_events.16.a: "派猎人上岸猎山羊，去泉边把木桶装满水。"
 circumnavigation_expedition_events.16.b: "给船补充淡水，继续前进。家乡已近在咫尺。"
 circumnavigation_expedition_events.16.historical_info: "过往船只常会在大西洋的无人岛屿上放养山羊和猪，它们繁衍成野生种群，把光秃秃的岩石变成了后来航海者意料之外的食物库。返航途中一座未被殖民却有淡水的岛屿，能为疲惫的探险队获得鲜肉和干净的水，只需要耽误几天时间——这算不上多大的恩惠，却实实在在，而且离家已经不远了。"
 circumnavigation_expedition_events.17.title: "无船返航"
 circumnavigation_expedition_events.17.desc: "季节在[capital_location.GetName]更迭往复，舰队却杳无音信，直到所有人都不再抱有希望。这支探险队不会返航了。在已知世界边界之外的某个地方——被一片宽到无法横渡的大海吞没，或者因船只与人员损耗殆尽而无法继续航行——船只和船员都消失了。这支出发去环游世界的舰队，除了一片寂静和死者的名字，什么也没回来。\n\n这个梦想比追逐它的人活得更久。下一个统治期，另一批船员，或许会完成这支队伍开启的事业。"
 circumnavigation_expedition_events.17.a: "他们不会被遗忘。"
 circumnavigation_expedition_events.17.end_tt: "探险队失踪了，航行在此终结"
 circumnavigation_expedition_events.17.historical_info: "1525年，加西亚·霍夫雷·德·洛艾萨率领七艘船出发，重走麦哲伦的航线，最终只有一艘破损的船和少数幸存者抵达摩鹿加群岛，而且没有任何一艘经东部航路完成返航。在那个年代，全员覆灭是真实存在的风险：环球航行意味着经年累月在海上漂泊，完全没有获得补给的指望，一支被太平洋吞没的舰队，可能永远都不会有人知道下落。"
 circumnavigation_expedition_events.18.title: "哗变"
 circumnavigation_expedition_events.18.desc: "这类事件总是以这样的方式开始：值夜班时有人低声私语，一小群人在军官走过时立刻闭了嘴，有位船长再也不肯和[target_leader.GetName]对视。补给不足，船员又冷又怕，他们当初签约是要去印度群岛，不是要去什么世界的尽头。现在不满已经变成了明确的行动——有一位船长直接拒绝服从命令，他的船员站在他身后，要求舰队掉头返航。\n\n[target_leader.GetNameWithNoTooltip]也许还有一天时间，在哗变蔓延到其他船只之前。必须现在就做出决定。"
 circumnavigation_expedition_events.18.a: "让不满者返航吧。我们不带他们继续航行。"
 circumnavigation_expedition_events.18.b: "以武力镇压叛乱。首恶必将受到惩处。"
 circumnavigation_expedition_events.18.fight_win_tt: "叛乱被平息，领头的人被严惩以儆效尤。秩序恢复了，但这次清算还是耗掉了舰队不少时间"
 circumnavigation_expedition_events.18.fight_lose_tt: "镇压演变为公开冲突，局势恶化：混乱中损失了一艘船，秩序才得以恢复，舰队也因此耽搁了时间"
 circumnavigation_expedition_events.18.c: "提醒他们地平线之外等待着什么。"
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName]巡视甲板，与船员交谈，其方式绝非寻常指挥官所能做到。叛乱自行消解，船员的士气比之前更高了"
 circumnavigation_expedition_events.19.title: "我们自己的海岸"
 circumnavigation_expedition_events.19.desc: "在茫茫[ShowContinentName('atlantic_ocean_continent')]上航行数周后，西边的地平线上慢慢显出一道低矮的绿色岸线——那座港口小镇上方飘扬着我们自己的旗帜。一处[ROOT.GetCountry.GetName]殖民地，就扎在这片遥远的海岸上，它敞开了仓库，迎接王室的舰队。淡水、水果、咸肉以及用来修船的木材，全都能在这里拿到，而且在同胞这里，这些都可以免费取用。\n\n[target_leader.GetName]可以让舰队把能装下的所有物资都装上船，之后再向南驶向未知的海域。"
 circumnavigation_expedition_events.19.a: "充分休整并补满给养。像这样友好的土地实属难得。"
 circumnavigation_expedition_events.19.b: "短暂停留以表感激，随即南下。季节不等人。"
 circumnavigation_expedition_events.19.historical_info: "巴西的东北沿海一带——伯南布哥、帕拉伊巴、里奥格兰德——是伊比利亚人在新大陆最早定居、也最富庶的区域之一，海岸边遍布巴西红木，没过多久就种满了甘蔗。掌控这些港口的王室，可以让舰队在自己的土地上补充淡水和给养，之后再向南长距离航行进入高纬度海域——这是麦哲伦在穿行于对手海域时，从未享受到的便利。"
 circumnavigation_expedition_events.20.title: "宿敌的海岸"
 circumnavigation_expedition_events.20.desc: "在茫茫[ShowContinentName('atlantic_ocean_continent')]上航行数周后，西边的地平线上慢慢显出一道低矮的绿色岸线——但港口上方飘着的是[rival_crown.GetName]的旗帜。他们的殖民地占据了这片海岸，我们麾下的舰队无权使用这里的码头。不过这里的仓库装得很满，当地代理商也愿意为了优质的钱币进行交易，而船员饿得什么都愿意吃，只要不是长满象鼻虫的饼干。\n\n[target_leader.GetName]必须决定是停靠在敌对势力的炮口下，还是继续向南航行。"
 circumnavigation_expedition_events.20.a: "谨慎地与[rival_crown.GetNameWithNoTooltip]的殖民地贸易以获取补给。"
 circumnavigation_expedition_events.20.b: "远离对手的港口，向南推进。"
 circumnavigation_expedition_events.20.historical_info: "根据《托德西利亚斯条约》，巴西海岸属于被划分给葡萄牙的那半个世界，为卡斯蒂利亚效力的舰队无权使用这里的港口。实际情况里，饥饿的船员和愿意配合的殖民地代理商，还是能私下达成补给交易，但驶入敌对王室港口的船只，始终面临着因无法证明自己合法身份而被扣押、勒索或没收的风险。"
 circumnavigation_expedition_events.21.title: "船上坏血病"
 circumnavigation_expedition_events.21.desc: "每一次长途航行都躲不开的坏血病，最终还是找上了舰队。船员的牙龈发黑出血，旧伤疤自己裂开，牙齿在牙床里松动，一个月前还健壮的人，现在连从甲板上爬起来都做不到。船上的外科医生没有别的办法，只能让大家休息、吃点新鲜食物，可这两样东西都少得可怜。\n\n[target_leader.GetName]必须掂量清楚，这支快要垮掉的船员队伍，到底还能撑着走多远。"
 circumnavigation_expedition_events.21.a: "配给新鲜补给，静待最坏的时刻过去。"
 circumnavigation_expedition_events.21.b: "时不我待，继续前进；强者自会坚持到底。"
 circumnavigation_expedition_events.21.b.tt: "航行在艰难中推进，生病的船员只能听天由命。很多人再也见不到对岸，活下来的人寥寥无几，不足以将整支舰队带回家"
 circumnavigation_expedition_events.22.title: "风暴"
 circumnavigation_expedition_events.22.desc: "天空变成淤青一样的颜色，海面翻涌成灰色的浪山。风撕扯着索具，船在足以吞没一座尖塔的波谷里苦苦挣扎。绿色的海水直接漫过甲板，领航员连彼此的船都看不见了。\n\n[target_leader.GetName]必须做出选择：是正面硬扛这场风暴，还是顺着风往前跑，祈祷整支舰队能不散架。"
 circumnavigation_expedition_events.22.a: "顶风停船，收帆，挺过风暴。"
 circumnavigation_expedition_events.22.b: "顺风疾行，全速前进。"
 circumnavigation_expedition_events.22.b.win_tt: "舰队撑过了最凶险的阶段，虽然被吹得四散，船身晃得厉害，但全都完好地驶了出来"
 circumnavigation_expedition_events.22.b.lose_tt: "行动赌输了，舰队在黑暗里被冲散，到下一个天亮，可能再也找不到某艘船的踪迹"
 circumnavigation_expedition_events.23.title: "船体内的蛀虫"
 circumnavigation_expedition_events.23.desc: "在这片温暖的海域里，船蛆钻进船板的速度比木匠堵洞的速度还快，直到船板像蜂巢一样布满孔洞。船员全天轮班抽水，舱底的积水还是在往上涨。船体损坏到这个地步，不经过一次彻底的倾侧修理——把船拖上岸，烧掉船底的附着物，重新填塞船缝——便不能指望它横渡大洋。\n\n[target_leader.GetName]必须决定如何让舰队保持浮航。"
 circumnavigation_expedition_events.23.a: "找一处荒僻的海滩，尽力倾侧检修。"
 circumnavigation_expedition_events.23.a.tt: "舰队在空旷的海岸边颠簸前行，尽其所能；工作进展缓慢且代价高昂，但船体还能再支撑一段时间"
 circumnavigation_expedition_events.23.b: "放弃损坏最严重的船，把船员调配至其余船只。"
 circumnavigation_expedition_events.23.c: "驶向附近的友好港口并进行整修。"
 circumnavigation_expedition_events.23.c.tt: "舰队驶入了附近一处友好的港口，在安全的环境里整修。这里的维修条件比偏僻海滩上靠谱得多，船员们也能好好休息一阵"
 circumnavigation_expedition_events.24.title: "无风停航"
 circumnavigation_expedition_events.24.desc: "风完全停了。松垮的船帆垂在桅杆上，海面平坦如镜，躺在惨白无情的天空下。一天天过去，船只纹丝不动，木桶里的水变了质，食物也快耗尽。船员们先是闷闷不乐，之后开始害怕，小声念叨舰队已经驶出世界风带之外，再也等不到风了。\n\n[target_leader.GetName]只能等待，或是让船员划小艇拖船前进。"
 circumnavigation_expedition_events.24.a: "静候风起，无论需要多久。"
 circumnavigation_expedition_events.24.b: "出动小船，靠人力拖曳舰船。"
 circumnavigation_expedition_events.25.title: "人手不足"
 circumnavigation_expedition_events.25.desc: "有太多人死去，或是因伤或疾病躺在甲板下动弹不得，剩下能干活的健全人已经不够操纵所有船。没有别的办法：一艘船被拆走一切可用之物，船上仅存的几个还能行动的人被分到其他船上，空船壳则被弃于大海。舰队现在以更小的规模继续航行，但至少剩下的船还能配备足够的人手。"
 circumnavigation_expedition_events.25.a: "别无选择，只能将船员分派到其他船只上。"
 circumnavigation_expedition_events.26.title: "船只沉没"
 circumnavigation_expedition_events.26.desc: "当风暴终于平息，舰队重新集结时，有一艘船不见了踪影。没人说得清它是被吹到下风岸搁了浅，还是船体开裂沉入黑暗中，亦或者只是被风带到了目力所及之外就此迷失。它再也没有归队。大海带走了它，还有船上的每一个人。"
 circumnavigation_expedition_events.26.a: "为逝者祈祷，然后继续航行。"
 circumnavigation_expedition_events.27.title: "空旷的海岸"
 circumnavigation_expedition_events.27.desc: "船舱里的补给快见底了，而一片低矮的绿色海岸正出现在船侧。瞭望员能确认的是，这里没人居住，没有生火的烟，也没有独木舟划出来。十几道溪流从岩石间淌出淡水，水鸟挤在浅滩上，树林里有野果、木材和猎物，愿意上岸的小队都能拿到。\n\n收集足够的补给要花掉舰队耗不起的好几天，但空着肚子代价更大。[target_leader.GetName]下达了命令。"
 circumnavigation_expedition_events.27.a: "上岸。装满水桶，收集木材、水果和猎物。"
 circumnavigation_expedition_events.27.b: "没时间觅食了。就算饿着肚子，也得继续前进。"
 circumnavigation_expedition_events.28.title: "与海岸贸易"
 circumnavigation_expedition_events.28.desc.christian: "船舱里的补给快见底了，不过附近海岸有一座基督教[trade_shore.GetRank.GetName]——教堂的钟声隔着水面隐约传来，港口上方立着十字架。当地人划着小船出来打量这些陌生人，带着戒备但没有敌意，只要有共同的信仰，就有了可以用来讨价还价的共同话语。谷物、咸肉、水果和淡水，都能用钱币和货物换到。\n\n在此停泊数日，便能把船舱重新装满。[target_leader.GetName]权衡着补给不断减少的现状，和在这里耽搁的分量。"
 circumnavigation_expedition_events.28.desc.muslim: "船舱里的补给快见底了，不过附近海岸有一座穆斯林[trade_shore.GetRank.GetName]——宣礼声飘过水面，独桅帆船停在岸边。当地的商人出来和舰队碰面，精明又毫无惧色，这些人在全世界每一片海域都做过买卖。大米、椰枣、咸鱼和淡水，都能用足量的钱币和合适的货物换到。\n\n在此停泊数日，便能把船舱重新装满。[target_leader.GetName]权衡着补给不断减少的现状，和在这里耽搁的分量。"
 circumnavigation_expedition_events.28.desc.pagan: "船舱里的补给快见底了，但附近海岸有一座[trade_shore.GetRank.GetName]，当地居民信奉的神，舰队的随军牧师连名字都没听过。他们小心翼翼地划着独木舟出来，拿出根茎、水果、鱼和装着淡水的葫芦，对陌生人举出来交换的铁器、布料和小物件充满好奇。两边都听不懂对方的话，但饥饿和以物换物不需要语言。\n\n在这里花几天时间交易，就能把船舱重新装满。[target_leader.GetName]权衡着补给不断减少的现状，和在这里耽搁的分量。"
 circumnavigation_expedition_events.28.a: "靠过去交易，把船舱装满给养。"
 circumnavigation_expedition_events.28.b: "我们没时间交易。就算饿着肚子，也要继续前进。"
