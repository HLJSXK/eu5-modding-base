l_simp_chinese:
 western_ocean_voyage_events.1.title: "我们向西航行"
 western_ocean_voyage_events.1.desc: "船只低低地停泊在港口里，为一次没有任何海图可参考的航行装足了补给。[target_leader.GetName]在[ROOT.GetCountry.GetGovernment.GetCourtTitle]花了几个月为自己的主张争辩，说西边那片大洋比学者们声称的要窄，说印度在一支有决心的船队能够到达的范围之内。\n\n学者们还是不信。水手们心里也不安。但现在风向正好，潮水正在转向，剩下能做的事只有解开缆绳。"
 western_ocean_voyage_events.1.columbus: "按照[target_leader.GetNameWithNoTooltip]的精确计算，这段距离是三千英里，不会更远。"
 western_ocean_voyage_events.1.a: "扬帆前行，无论海洋隐藏着什么。我们将率先发现它。"
 western_ocean_voyage_events.1.historical_info: "在首次尝试向西航行前的数十年里，欧洲学者就已经在辩论向西航行到达亚洲的可能性。当时的主要障碍并非地球的形状——受过教育的人都知道地球是球形的——而是它的大小。大多数学者的判断是正确的，他们认为海洋太大难以横渡。然而，最终证明他们判断有误的的那些航行，并没有推翻这个估算，只是在途中发现了意料之外的事物。"
 western_ocean_voyage_events.2.title: "已知世界的边缘"
 western_ocean_voyage_events.2.desc: "幸运群岛，古人是这么命名的，它位于我们在[ShowLocationName('northern_fuerteventura_coast')]携带的每一张海图的最边缘。再往外的大洋没有名字，没有记录水深，也没有画出任何海岸线。当地渔民说，风暴来临前，他们有时会看见从西边飞来的鸟，[target_leader.GetName]把这当成海平线之外有陆地的迹象。船员们却把这当成风暴要来的迹象。\n\n我们装上了淡水、咸肉和硬饼干。日落时，船员们看着海面变成金色，随后没入黑暗。"
 western_ocean_voyage_events.2.a: "在一周内完成补给并启航。"
 western_ocean_voyage_events.2.b: "手下的人还没准备好，我们返航。"
 western_ocean_voyage_events.2.historical_info: "加那利群岛是当时驶向未知海域的大西洋航行的常规出发点，因为它地处已测绘的大西洋水域边缘，从那里向西南吹向加勒比海的信风十分稳定。它的战略价值早已被人熟知，15世纪的大部分时间里，葡萄牙和卡斯蒂利亚都在争夺这片群岛的控制权。"
 western_ocean_voyage_events.3.title: "我们已经走得够远了"
 western_ocean_voyage_events.3.desc: "面包已经发霉。水桶散发出异味。有三个人染上了热病。今天早上，一群代表来找[target_leader.GetName]，只带来一句直白的话：他们已向西航行了足够久，除了茫茫大海什么都没看见，不管[target_leader.GetNameWithNoTooltip]同不同意，他们都打算掉头向东返航。\n\n四周任何方向都看不到陆地。这里什么都没有，只有身后的风，它把他们带到了这么远的地方，却没法再把他们吹回去。"
 western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip]根据伪造的航海日志向船员们承诺再过三天就能见到陆地。"
 western_ocean_voyage_events.3.a: "承诺三天后见到陆地，并分享我们找到的一切。"
 western_ocean_voyage_events.3.b: "他们说得对。我们回去吧。"
 western_ocean_voyage_events.3.historical_info: "现存的1492年航行记录显示，船队在大西洋航行约一个月时确实遭遇了士气危机，当时船员们以哗变相威胁，要求哥伦布调转航向返航。这次危机的解决方式说法不一，有人说是哥伦布承诺三天内就能见到陆地，有人说是船员看到了漂浮的植被，也有人认为全靠哥伦布的个人魅力，至今没有定论。第二天清晨，陆地终于出现在了视野中。"
 western_ocean_voyage_events.4.title: "陆地！"
 western_ocean_voyage_events.4.desc: "破晓时分，瞭望台上传来一声呼喊。接着又是一声，声音更大。随后甲板上的每一个人都喊了起来。\n\n海平线上出现了一个轮廓。一开始很低，不过是天空的一抹暗色，但随着光线变亮，它变得不容错认：树木，海岸线，从平静水面上升起的绿色山丘。船队周围的海水已经从深蓝色变成绿色，再变成浅绿松石色。陌生的鸟在头顶盘旋。带着陌生叶子的树枝从船身旁边漂过。\n\n[target_leader.GetName]站在船头，很久都没有说话。\n\n当小艇靠岸时，岛上的居民已经聚在那里观望，有几个人的鼻子上明显戴着小小的黄金饰品。大家询问他们——更多是用手势而非言语——黄金从何而来时，他们指向内陆，还有一些人指向南边，指向船员们从这里根本看不见的山丘。"
 western_ocean_voyage_events.4.columbus: "插下旗帜。[target_leader.GetShortNameWithNoTooltip]确信这里就是印度。"
 western_ocean_voyage_events.4.a: "插上旗帜。不管这是什么地方，它现在属于我们了。"
 western_ocean_voyage_events.4.b: "这与任何关于印度的记载都不符。暂且不要妄下断言。"
 western_ocean_voyage_events.4.historical_info: "欧洲人与美洲各族群的首次接触发生在1492年的加勒比地区。巴哈马的泰诺居民——他们称自己的岛为#italic 瓜纳哈尼#!——在岸上迎接了到来的船只。在一代人的时间里，泰诺人此前从未接触过的流行病杀死了加勒比岛屿上的大部分人口。这次横渡的长期后果重塑了地球上每一个大洲的生态、经济和人口。"
 western_ocean_voyage_events.5.title: "七城岛"
 western_ocean_voyage_events.5.desc: "航行过了中点之后，风势稳定，船队走得很顺，领航员们把一张旧海图拿到了[target_leader.GetName]面前。这张海图由从未在这片大洋航行过的人绘制，却标出了[ShowAreaName('azores_area')]以西很远的一座大岛：安蒂利亚，岛四周有围墙，分布着七座城市，据说它是当年伍麦叶军队攻占[ShowRegionName('iberia_region')]时，从那里逃出来的主教们建立的。\n\n船上无人见过这座岛，也无人指望能见到。但这张海图年代久远，绘制它的人也不是傻子，在这片海平线上空无一物的地方，一个老故事的分量，比在港口里要重得多。"
 western_ocean_voyage_events.5.a: "如果旧海图无误，便依此定下航向。"
 western_ocean_voyage_events.5.b: "水手们的海图上满是从未存在过的岛屿。"
 western_ocean_voyage_events.5.historical_info: "安蒂利亚，七城之岛，早在1424年就出现在葡萄牙和热那亚的海图上，标示为亚速尔群岛以西的一座大岛。根据传说，七位西哥特主教在714年伍麦叶征服期间逃离伊比利亚，在西方大洋的一座岛上建立了七座城市。这个传说的生命力甚至超过了否定它存在的大航海时代：当弗朗西斯科·巴斯克斯·德·科罗纳多数十年后出发寻找美国西南部的七座黄金城时，他正是以这个更古老、纯粹属于欧洲的传说来命名自己的目标。"
 western_ocean_voyage_events.6.title: "黄金从何来"
 western_ocean_voyage_events.6.desc: "译员们的翻译并不统一。一个人坚持说岛民指的是一个地点。另一个人说，他们指的是一个族群。第三个人认为，指向内陆和指向南方的两个手势，是对两个不同问题的两种不同回答，而没人把这两个问题准确翻译出来。\n\n唯一能确定的只有方向：往内陆走，再往远了走，向南，朝着船员们谁都没见过的山脉和河流。[target_leader.GetName]还是让领航员把这个位置标在了海图上，一半是传闻，一半是猜测，以防将来有人需要知道该往哪里找。"
 western_ocean_voyage_events.6.a: "照原样记录，包括其中的矛盾之处。"
 western_ocean_voyage_events.6.b: "仅保留各方共识的部分：内陆与黄金。"
 western_ocean_voyage_events.6.historical_info: "加勒比地区早期的接触记录里提到，泰诺人佩戴着小型黄金饰品，这些饰品经过加工，但接触者在当地看不到任何规模的开采痕迹。当接触者用手势询问黄金的来源时，岛民反复指向内陆，部分记录里还指向更靠南和更靠西的陆地。这些经过转手、被误译的方位指引，比任何得到证实的发现都更决定了之后几代探险者在美洲寻找黄金的路线。"
 western_ocean_voyage_events.7.title: "我们在[ROOT.GetCountry.GetGovernment.GetCourtTitle]阅读报告"
 western_ocean_voyage_events.7.desc: "船队终于进港，满身盐渍，伤痕累累，不出数日，我们便在[ROOT.GetCountry.GetGovernment.GetCourtTitle]大声朗读[target_leader.GetName]的记述。那些岛屿，那次横渡，那些奇怪的鸟和更奇怪的水果，那些在我们到达之前从未听说过我们的族群所佩戴的黄金。\n\n有些人对其中的大部分内容表示怀疑，但我们还是把一切都记了下来。海图开始谨慎地变化，在以前什么都没画的西部边缘上。"
 western_ocean_voyage_events.7.a: "让记录保持原样。"
 western_ocean_voyage_events.7.historical_info: "返航船队带回的书面和口头报告，在每次登陆后的几个月内，就传到了西欧各国的王室宫廷，之后译本也广泛流传。这些记录在翻译和叙述者野心的影响下变得失真，描述了欧洲人从未亲眼见过的内陆财富。正是这些二手的证词，而非任何已确认的发现，驱使后来几代探险家向更内陆、更南方的区域搜寻，寻找第一批抵达者只匆匆瞥见的那些资源的源头。"
 western_ocean_voyage_mythical_cities_tt: "绘制美洲海岸线将解锁寻找其传说中失落之城的[expeditions|e]"
