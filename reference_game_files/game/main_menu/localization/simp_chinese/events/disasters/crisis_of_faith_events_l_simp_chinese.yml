l_simp_chinese:
 crisis_of_faith.1.title: "分裂爆发"
 crisis_of_faith.1.desc: "民众对国教会的虔诚已经崩塌，信众不再听从它的教诲。分裂派传教士各自聚拢起一批民众，教士阶层也分裂成改革派与强硬派。我们必须选定道路：要么顺应改革派，寻求妥协，要么用烈火与刀剑镇压这场分裂。"
 crisis_of_faith.1.a: "顺应改革派。"
 crisis_of_faith.1.b: "镇压分裂派！"
 crisis_of_faith.1.tt: "动荡最严重的省份将转而支持[ShowDisasterName('crisis_of_faith')]派系"
 crisis_of_faith.1.a.tt: "少数最动荡省份的教士仍会加入[ShowDisasterName('crisis_of_faith')]派系"
 crisis_of_faith.2.title: "异端蔓延"
 crisis_of_faith.2.desc: "有报告称，整批会众正转向分裂派教义。我们可以派遣忠心的教士铲除异端，阻止它继续扩散；也可以任其发展，指望这股狂热自行熄灭。"
 crisis_of_faith.2.a: "铲除异端。"
 crisis_of_faith.2.b: "任其溃烂。"
 crisis_of_faith.3.title: "信众集结"
 crisis_of_faith.3.desc: "面对这场分裂，虔诚的民众聚集起来，重申对既定信仰的拥护。他们的热忱或许能重新点燃全国上下的虔诚，但这种激情一旦失控，也很容易演变为动乱。"
 crisis_of_faith.3.a: "顺应这股热忱。"
 crisis_of_faith.3.b: "维持秩序。"
 crisis_of_faith.4.title: "教士要求改革教义"
 crisis_of_faith.4.desc: "一批温和派教士前来请愿，要求修改教会教义，在裂痕扩大前加以弥合。答应他们的改革可以安抚教士阶层，延缓分裂，但改动神圣教义绝非小事。如果我们拒绝，就能守住立场，代价是失去教士的好感。"
 crisis_of_faith.4.a: "答应他们的改革。"
 crisis_of_faith.4.b: "拒绝改动教义。"
 crisis_of_faith.5.title: "宗教审判的时机"
 crisis_of_faith.5.desc: "最狂热的教士请求准许对分裂派发动宗教审判。一场清洗能恢复虔诚、震慑异端，但由此产生的恐惧会波及整个国家。我们也可以选择克制，让民众免受更多苦难。"
 crisis_of_faith.5.a: "发动宗教审判。"
 crisis_of_faith.5.b: "保持克制。"
 crisis_of_faith.12.title: "分裂派的庇护人"
 crisis_of_faith.12.desc: "分裂派的事业如今有了钱袋。[crisis_of_faith_heresiarch_scope.GetName]已在我们领土的一座厅堂中受到接待，那位为其敞开大门的贵族如今出钱抄写我们明令禁止的布道文。我们可以私下出价，把这份忠诚买回来；也可以承认，我们无法管束全国的每一座厅堂。"
 crisis_of_faith.12.a: "把那份忠诚买回来。"
 crisis_of_faith.12.b: "我们无法管束每一座厅堂。"
 crisis_of_faith.13.title: "公开布道"
 crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName]不再在地窖里布道。一群人聚集在集市广场，听人当众宣讲分裂派教义，没有人出面阻止。打断这场布道可以表明我们的教会仍握有权威，但当着人群把传教士从布道台上拖下来，本身就是一桩丑闻。"
 crisis_of_faith.13.a: "制止这场布道。"
 crisis_of_faith.13.b: "让信众自行判断。"
 crisis_of_faith.100.title: "异端被镇压"
 crisis_of_faith.100.desc: "分裂已经弥合。分裂派传教士四散而去，信从他们的人重回教会怀抱，教士阶层在同一套教义下重新团结。我们的教会焕然一新，权威与虔诚都得以恢复。"
 crisis_of_faith.100.a: "信仰得以延续。"
 crisis_of_faith.101.title: "分裂派教义扎根"
 crisis_of_faith.101.desc: "分裂取得了胜利。改革后的教义在我们的教会与宫廷中扎根，旧教义被弃置一旁。整整一代人的时间里，我们的国家将生活在分裂的信仰中，教士阶层也不再完全听命于王位。"
 crisis_of_faith.101.desc.heresiarch: "分裂取得了胜利，而且它有了具体的面孔。[crisis_of_faith_heresiarch_scope.GetName]一直宣讲改革后的教义，直到再没有人能封堵其口；不过真正摧毁我们权威的，是教士阶层在各地的公开反叛。如今获胜的教士宣布对[crisis_of_faith_heresiarch_scope.GetHerHis]的擢升，我们的教会里再没有人敢出面拒绝他们。他们悄悄搁置了我们曾视为神圣并加以捍卫的东西。"
 crisis_of_faith.101.a: "分裂派压倒了一切。"
 crisis_of_faith.101.b: "让异端首脑登上王位。"
 crisis_of_faith.102.title: "信仰被弃"
 crisis_of_faith.102.desc: "我们不再以教会的首脑身份进行统治。无论分裂派宣讲了什么，我们的教士都不会回应，因为教士阶层不再代表国家发言。我们放弃捍卫的教义，仍留在信众的口中；那些替我们守护旧正统的人，也记得是谁把他们弃在了那里。"
 crisis_of_faith.102.a: "教会已不再归我们治理。"
 crisis_of_faith.10.title: "宣讲复兴"
 crisis_of_faith.10.desc: "我们派出最虔诚的教士走入民众之中，宣讲复兴，召唤信众回归。他们的布道在全国重新点燃虔诚，也让分裂派失去大批追随者；不过这场大规模复兴带来的动荡会扰乱既有的秩序。"
 crisis_of_faith.10.a: "派出传教士。"
 crisis_of_faith.10.a.tt: "当前支持[ShowDisasterName('crisis_of_faith')]派系的所有人群都会获得些许满意度"
 crisis_of_faith.11.title: "召开宗教会议"
 crisis_of_faith.11.desc: "我们召集教士举行一次大型会议，彻底解决有争议的教义。与会的高级教士团结在正统教义周围，孤立分裂派，让教会恢复了一定程度的统一。"
 crisis_of_faith.11.a: "召集会议。"
 crisis_of_faith.11.a.tt: "当前支持[ShowDisasterName('crisis_of_faith')]派系的所有人群都会获得些许满意度"
 crisis_of_faith.6.title: "分裂背后的主谋"
 crisis_of_faith.6.desc: "我们的密探顺着被禁的布道文一路追查，经过抄写员和信使的手，每条线索最终都指向同一扇门。[crisis_of_faith_heresiarch_scope.GetName]正是分裂派教义的作者，而直到现在，[crisis_of_faith_heresiarch_scope.GetSheHe]仍在我们的教会内部宣讲这套教义。"
 crisis_of_faith.6.a: "指认异端头目。"
 crisis_of_faith.6.a.tt: "查明异端头目的身份为我们解锁“谴责异端头目”行动"
 crisis_of_faith.7.title: "谴责异端头目"
 crisis_of_faith.7.desc.ready: "王室的话语重新有了权威，现在正是动用它的时候。我们要在聚集的信众面前点出[crisis_of_faith_heresiarch_scope.GetName]之恶名，完整列举[crisis_of_faith_heresiarch_scope.GetHerHis]的错误，并剥夺[crisis_of_faith_heresiarch_scope.GetHerHim]那使分裂成为可能的地位。失去始作俑者之后，改革后的教义不过是一则传言。"
 crisis_of_faith.7.desc.not_ready: "我们本想在聚集的信众面前点出[crisis_of_faith_heresiarch_scope.GetName]之名，就此了结这场分裂，但王室镇不住场面。庇护[crisis_of_faith_heresiarch_scope.GetHerHim]的教士，比想要谴责[crisis_of_faith_heresiarch_scope.GetHerHim]的王权更强大；一次失败的谴责，会被记成一次遭到回绝的谴责。"
 crisis_of_faith.7.a: "在信众面前谴责异端首脑。"
 crisis_of_faith.7.a.fail_tt: "王室缺乏对付异端首脑的权威"
 crisis_of_faith.8.title: "向分裂派让步"
 crisis_of_faith.8.desc: "这场分裂已无法弥合，只能通过花费钱财来平息。我们将满足改革派所要求的教义条款，并授予他们随之而来的教会地位。派系就此解散，传教士们也将回到如今依法应属于他们的会众当中。然而，我们虔诚的信仰再也无法从中恢复，而这一让步也已无法收回。"
 crisis_of_faith.8.a: "让他们保留自己的教义吧。"
