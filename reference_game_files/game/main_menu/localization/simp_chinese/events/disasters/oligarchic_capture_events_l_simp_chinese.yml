l_simp_chinese:
 oligarchic_capture.1.title: "派系崛起"
 oligarchic_capture.1.desc: "多年的衰败已经掏空了我们共和国的制度根基。一个权势最盛的阶层嗅到了虚弱的气息，已经出手将立法机构据为己有，将对手拒之门外，并让法律屈从于他们的意志。我们必须决定如何应对这场挑战：是向派系低头，以换取脆弱的和平；还是冒着引发公开叛乱的风险反抗他们。"
 oligarchic_capture.1.a: "顺从派系的要求。"
 oligarchic_capture.1.b: "不惜一切代价，抵抗他们！"
 oligarchic_capture.1.tt: "不满最严重的省份将转而支持[ShowDisasterName('oligarchic_capture')]派系"
 oligarchic_capture.2.title: "寡头索取献金"
 oligarchic_capture.2.desc: "派系的首领向我们提出了一份几乎不加掩饰的索款要求，却冠以“为公共事业出资”的名义。若我们出钱，他们的喧嚣便会暂时平息；若我们拒绝，他们便会以我们的抗拒为借口，借此为其主张争取更多的支持。"
 oligarchic_capture.2.a: "出钱打发他们。"
 oligarchic_capture.2.b: "我们不接受勒索。"
 oligarchic_capture.3.title: "公民集会要求改革"
 oligarchic_capture.3.desc: "人群聚集在公共广场之上，高声呼吁恢复廉洁的政府、终结派系政治。这股热情是重新唤醒共和精神的良机，然而，若纵容这股力量，也可能引发难以控制的混乱局面。"
 oligarchic_capture.3.a: "支持他们的诉求。"
 oligarchic_capture.3.b: "维持街头秩序。"
 oligarchic_capture.4.title: "元老院中的一派系遭到清洗"
 oligarchic_capture.4.desc: "寡头们开始动手，试图驱逐一批他们认为不够忠诚的元老。若放任这场清洗，短期内固然可以稳住局面，但却无异于给派系送去又一场胜利；若选择保护那些被指控的人，虽然能够捍卫我们的制度，却也将付出更多动荡的代价。"
 oligarchic_capture.4.a: "听任清洗继续。"
 oligarchic_capture.4.b: "保护被指控的人物。"
 oligarchic_capture.5.title: "街头骚乱"
 oligarchic_capture.5.desc: "派系的党羽与反对者在集市和码头爆发斗殴。我们可以让怒气自行平息，也可以派卫兵以强硬手段恢复秩序。"
 oligarchic_capture.5.a: "让怒气自行平息。"
 oligarchic_capture.5.b: "严厉镇压。"
 oligarchic_capture.100.title: "共和国得以恢复"
 oligarchic_capture.100.desc: "派系的掌控已被打破。我们的法庭、议事会和公民大会重新向公民负责，而不再听命于一小撮权贵。共和国挺过了这场风暴，它的制度也在这场考验中变得更加坚韧。"
 oligarchic_capture.100.a: "我们的制度经受住了考验。"
 oligarchic_capture.101.title: "寡头宪法根深蒂固"
 oligarchic_capture.101.desc: "派系赢了。一部为寡头服务的新宪法，把他们的统治地位嵌进了国家的根基。整整一代人的时间里，我们的共和国将徒有虚名，官职只在少数有权势的人当中私相授受。"
 oligarchic_capture.101.desc.ringleader: "派系赢了。它的主使[oligarchic_ringleader_scope.GetName]从元老院的后室走到台前，公然夺取王位。整整一代人的时间里，我们的共和国将徒有虚名，官职只在少数有权势的人当中私相授受。"
 oligarchic_capture.101.a: "派系赢了。"
 oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName]掌握权柄。"
 oligarchic_capture.6.title: "揭穿幕后主使"
 oligarchic_capture.6.desc: "我们的密探花了数周时间，顺着钱款、人情与暗中传递的指令，摸清派系内部的脉络。最终真正操纵局面的名字浮现——[oligarchic_ringleader_scope.GetName]。"
 oligarchic_capture.6.a: "我们终于知道该对付谁了。"
 oligarchic_capture.7.title: "直面幕后主使"
 oligarchic_capture.7.desc.ready: "[oligarchic_ringleader_scope.GetName]已经暴露，我们可以直接对他动手。政府本身已经恢复了足够的权威，派系应该很快就会被击破。"
 oligarchic_capture.7.desc.not_ready: "[oligarchic_ringleader_scope.GetName]已经暴露，我们本可直接动手，但政府尚未恢复足够的权威。过早出击，只会让派系更加团结。"
 oligarchic_capture.7.a: "对他动手。"
 oligarchic_capture.7.a.success_tt: "我们的[crown_power|e]已达到30%或以上，因此这次行动成功"
 oligarchic_capture.7.a.fail_tt: "我们的[crown_power|e]尚未达到30%，因此行动失败，随之而来的反扑将让我们付出稳定度的巨大代价"
 oligarchic_capture.8.title: "与阶层商谈妥协"
 oligarchic_capture.8.desc: "与其正面交锋，我们不如悄悄开启一条谈判渠道，用金钱和些许让步平息派系的不满，减缓它的扩张。"
 oligarchic_capture.8.a: "开启谈判。"
 oligarchic_capture.12.title: "主使拉拢廷臣"
 oligarchic_capture.12.desc: "有消息传来：派系的主使一直在暗中拉拢我们宫廷中的一位成员，许以人情与承诺，换取他的支持。我们可以装作不知，也可以设法稳固这名廷臣的忠诚。"
 oligarchic_capture.12.a: "随他去吧，不值得为此费心。"
 oligarchic_capture.12.b: "稳固这名廷臣对政府的忠诚。"
 oligarchic_capture.13.title: "主使试探国家权力"
 oligarchic_capture.13.desc: "派系的主使在一众廷臣面前当众试探国家权力的影响还能延伸到多远，寻找可乘的破绽。我们可以对这次挑衅不予回应，也可以作出强硬答复。"
 oligarchic_capture.13.a: "对挑衅不予理会。"
 oligarchic_capture.13.b: "强硬回应。"
 oligarchic_capture.10.title: "号召公民"
 oligarchic_capture.10.desc: "传令官走遍每一处城区和集市，传达我们的号召：共和国属于它的公民，不属于一小撮权贵。广场上聚满了愿意重申旧秩序的人，不过这样的集会从来都伴随着动乱的风险。"
 oligarchic_capture.10.a: "到广场去！"
 oligarchic_capture.11.title: "清洗寡头"
 oligarchic_capture.11.desc: "我们决意直接打击派系的领导层。我们逮捕要犯，切断他们的关系网，撬松他们对我们各项机构的掌控。贵族对这种强硬手段心怀不满，国家也为之震动，但寡头们确实受到了挫折。"
 oligarchic_capture.11.a: "擒贼先擒王。"
