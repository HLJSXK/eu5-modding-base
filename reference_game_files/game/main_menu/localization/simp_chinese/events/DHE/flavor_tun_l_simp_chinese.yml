l_simp_chinese:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "很好。"
 flavor_tun.1.b: "我们不在乎这种无谓的开支！"
 tun_have_more_gp_score_than_us: "没有[ShowReligionAdjective('sunni')][country|e]拥有比[THIS.GetCountry.GetName]更高的[great_power_score|e]"
 flavor_tun.2.caliphal_backstory: "在[GetCountry('ALM').GetAdjective]哈里发国崩溃之际，我们的国家建立。当时，[ShowDynastyName('hafsid_dynasty')]王朝的创建者，尊贵的阿布·扎卡里亚自称#italic “信士的长官”#!，承担起$rank_empire_muslim_ruler_male$的角色，并#italic 事实上#!宣告独立。这一宣称立即得到[ShowCountryNameIfActive('GRA')]的[ShowDynastyName('nasrid_dynasty')]以及其他[ShowCultureName('andalusi')]城镇领袖的承认。当[ShowCountryNameIfActive('TLE')]和[ShowCountryNameIfActive('MOR')]两国建立时，他们也迅速承认了我们的宣称。我们的权威远至圣城[ShowLocationName('mecca')]都受到尊重——在阿拔斯王朝新近被蒙古人推翻后，那里的谢里夫于1259年承认了我们的哈里发宣称。"
 flavor_tun.2.title: "哈里发国的衰落"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\n如今，昔日辉煌已所剩无几。我们的内部问题极大地削弱了我们[ROOT.GetCountry.GetGovernment.GetRulerTitle]的权威，让其$rank_empire_muslim_ruler_male$徒留虚名。我们必须把哈里发权威还给[ROOT.GetCountry.GetLongName]！"
 flavor_tun.2.a: "我们会让他们尊重我们！"
 flavor_tun.2.b: "放弃这个头衔。"
 tun_caliphate_decision_enabled: "启用[ShowDecisionName('hafsid_caliphate_decision')][decision|e]"
 flavor_tun.3.title: "恢复哈里发权威"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\n尽管这一权威在接下来的一个世纪里走向衰落，我们还是成功将这个[ROOT.GetCountry.GetLongName]从被彻底边缘化的边缘拉了回来。如今，[ROOT.GetCountry.GetFlavorRank]再度成为[ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]世界的主要强国之一。"
 flavor_tun.3.a: "我们会管理好#italic 乌玛#!！"
 hafsid_caliphate_name_tt: "我们的国名将包含头衔#Y 哈里发国#!"
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.desc.entry: "我们没能确立自身作为[GetCountry('ALM').GetAdjective]哈里发国继承者的身份。这绝不能被接受！我们必须夺回[ShowReligionAdjective('sunni')]社群领袖的位置！"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
 flavor_tun.4.title: "[aging_monarch.GetNameWithNoTooltip]的继承"
 flavor_tun.4.entry: "[GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip]的继承"
 flavor_tun.4.desc: "[aging_monarch.GetName]越来越关注一位年迈君主必须做出的最阴郁却又最至关重要的决定：指定[aging_monarch.GetHerHis]的继承人。人选本来相当明显，因为[preferred_heir.GetName]一直是我们敬爱的[ROOT.GetCountry.GetGovernment.GetRulerTitle]最宠爱的孩子。问题出在[aging_monarch.GetHerHis]的其他子女身上：[future_usurper.GetName]在[ROOT.GetCountry.GetCapital.GetName]协助政务，以及[target_country2.GetName]的[third_way.GetName]，一位可能的王位觊觎者。\n\n这一选择将在[aging_monarch.GetShortNameWithNoTooltip]去世后很久，仍对[ROOT.GetCountry.GetLongName]的稳定产生深远影响。"
 flavor_tun.4.a: "让[target_country.GetNameWithNoTooltip]的[preferred_heir.GetNameWithNoTooltip]接手。"
 flavor_tun.4.a.entry: "让$GFS$的[GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip]接手。"
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip]是安全的选择。"
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip]是安全的选择。"
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip]有助于统一诸国。"
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip]有助于统一诸国。"
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName]会被指定为[ROOT.GetCountry.GetName][heir|e]"
 TUN_unite_two_realms_tt: "由于[THIS.GetCharacter.GetName]是[THIS.GetCharacter.GetCourtCountry.GetName][ShowSubjectTypeName('familial_governor')]的[ruler|e]，当[THIS.GetCharacter.GetSheHe]继位时，两国会合并"
 TUN_civil_war_from_preferred_heir_tt: "由于[preferred_heir.GetName]是首选继承人，[preferred_heir.GetSheHe]将在[ShowEstateTypeName('tribes_estate')]的支持下迅速发动一场[war|e]，这将导致我们在[ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')]内的[locations|e]叛离"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName]可能会试图从[THIS.GetCharacter.GetName]手中篡夺王位"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]将继承[from_country.GetName]的王位，只要没有篡权行为发生，两国就会在[from_country.GetAdjectiveWithNoTooltip]的旗帜下完成统一"
 flavor_tun.5.title: "在[from_country.GetNameWithNoTooltip]的任命"
 flavor_tun.5.desc_positive: "好消息！[from_country.GetLongName]的[aging_monarch.GetName]刚刚任命[preferred_heir.GetName]为[aging_monarch.GetHerHis]的[from_country.GetFlavorRank]的继承人。这并不令人意外，因为[preferred_heir.GetShortNameWithNoTooltip]长期以来一直被公认为预期的继任者。有这样一位领袖掌舵，[ShowScriptedGeographyName('ifriqiya_geography')]的未来似乎一片光明。"
 flavor_tun.5.desc_negative: "该死！[from_country.GetName]的[aging_monarch.GetName]竟史无前例地任命[appointed_heir.GetName]接替[aging_monarch.GetHerHim]。[ShowScriptedGeographyName('ifriqiya_geography')]的人都知道，[preferred_heir.GetName]才是最得人心、最自然的继承人，因此必定发生了什么不正当的勾当，才会让[appointed_heir.GetNameWithNoTooltip]被立为继承人。"
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip]绝不会坐视不管！"
 flavor_tun.5.c: "我们只能接受这个现实。"
 flavor_tun.6.title: "预期的回应"
 flavor_tun.6.desc: "不出所料，[appointed_heir.GetName]的任命并未得到[preferred_heir.GetName]的认可，后者迅速采取行动质疑这一任命。在[ShowEstateTypeName('tribes_estate')]的支持下，[target_country.GetName]已为[ROOT.GetCountry.GetName]的王位宣战，[preferred_heir.GetShortNameWithNoTooltip]的军队正在开往[ROOT.GetCountry.GetCapital.GetName]。"
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 GFS_will_receive_following: "如果[target_country.GetName]选择就此发动[war|e]："
 flavor_tun.7.title: "继承权被篡夺！"
 flavor_tun.7.desc: "尽管已指定[target_character2.GetName]为[from_country.GetLongName]的继承人，其桀骜不驯的同胞[target_character.GetName]却选择利用[target_character.GetHerHis]目前在首都的地位，试图夺取[from_country.GetFlavorRank]的控制权。这无疑会激怒[target_country.GetName]的[target_character2.GetShortNameWithNoTooltip]，后者必定会拿起武器，对抗[target_character.GetHerHis]的[target_character2.GetSisterBrother]。"
 flavor_tun.7.a: "先来先得。"
 flavor_tun.7.b: "这太荒谬了！这不公平！"
 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.desc: "[target_character2.GetName]在[from_country.GetLongName]的继承权，已被[target_character2.GetHerHis]的[target_character.GetSisterBrother][target_character.GetName]篡夺；后者迅速采取行动，控制了[from_country.GetFlavorRank]，并制服了其[from_country.GetGovernment.GetCourtTitle]。\n\n[target_character2.GetShortNameWithNoTooltip]竟让自己的名声如此受损，真是奇耻大辱！我们必须惩罚[target_character.GetShortNameWithNoTooltip]。"
 flavor_tun.8.a: "开战！"
 flavor_tun.8.b: "我们承担不起作战的代价。"
 flavor_tun.10.title: "埃米尔主义"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')]是一片无法无天、堕落腐败的巢穴。近一个世纪以来，[ROOT.GetCountry.GetLongName]及其[ShowDynastyName('hafsid_dynasty')]附属势力一直无法将控制力扩展到城市之外，导致乡村省份普遍动荡、犯罪横行。然而，一束希望之光正照耀在[ShowCultureName('andalusi')]显贵与[ShowEstateTypeName('nobles_estate')]主要谢赫之间——那就是埃米尔主义的思想，它主张一个未来：由一位地区埃米尔统治整个[ShowAreaName('tunis_area')]，带领它再度繁荣昌盛。"
 flavor_tun.10.a: "愿[ROOT.GetCountry.GetReligion.GetGodName]赐我们光明。"
 flavor_tun.10.a.entry: "愿$muslim_god_name$赐我们光明。"
 tun_info_about_tunis_decentralization: "我们应尽快移除[ShowGovernmentReformName('tun_strong_familial_governors')][government_reform|e]"
 tun_additional_benefits_for_farfanes_tt: "[ShowGovernmentReformName('catalan_merchant_privileges')]根据我们的[ShowUnitDefinitionName('a_farfanes')]数量为我们的[ShowModifierTypeName]提供增益"
 flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')]再次统一"
 flavor_tun.11.desc: "[ROOT.GetCountry.GetLongName]的权力分散问题已从根源上得到解决。[ShowGovernmentReformName('tun_strong_familial_governors')]的时代已经结束，整个[ShowScriptedGeographyName('ifriqiya_geography')]重新统一在[ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]的旗帜之下。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的乡村再也不会被猖獗的犯罪蹂躏；[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的埃米尔再也不会被[ShowEstateTypeName('nobles_estate')]要挟；[ROOT.GetCountry.GetAdjectiveWithNoTooltip]国家再也不会依赖外国势力的支持。\n\n这是旧秩序的清算时刻，也是我们开创一个新时代的绝佳机会。"
 flavor_tun.11.a: "这是新时代的黎明。"
 flavor_tun.11.b: "新身份的诞生。"
 IFRIQIYA_NAME: "易弗里基叶"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.desc.entry: "[ShowScriptedGeographyName('ifriqiya_geography')]分裂为众多国家已经太久了，其中许多由[ShowDynastyName('hafsid_dynasty')]家族的分支统治。我们不能再让这种分裂局面持续下去了。"
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
 flavor_tun.12.title: "[ShowLocationNameWithNoTooltip('bejaia')]海盗兴起"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "近年来，[target_location.GetName]见证了其最不寻常却高产的一项产业的扩张——[ShowScriptedGeographyName('mediterranean_sea_geography')]的海盗活动。数十年来，当地谢赫一直广泛支持[ShowBuildingTypeName('pirate_haven')]及其对[ShowReligionGroupAdjective('christian')]村庄并非那么隐秘的劫掠，尽管已有商业关系存在。此类劫掠确实损害我们与潜在贸易伙伴的关系，但我们从[ShowPolicyName('state_piracy_policy')]中获得的利润不容低估。"
 flavor_tun.12.a: "他们是[ROOT.GetCountry.GetReligion.GetGodName]的敌人！"
 flavor_tun.12.a.entry: "他们是$muslim_god_name$的敌人！"
 flavor_tun.12.b: "随便了。"
 flavor_tun.12.c: "海盗对我们没有好处。"
 flavor_tun.13.title: "经济束缚"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "[ROOT.GetCountry.GetName]的[ShowReligionGroupAdjective('christian')]商人早已获得广泛的[ShowGovernmentReformName('catalan_merchant_privileges')]。尽管如此，尽管我们如此慷慨地为他们提供居留区，给予他们按自己法律裁断的权利，赋予他们宗教自由，[target_country.GetAdjective]的[target_country.GetGovernment.GetEstateName('burghers_estate')]仍要求更多——否则他们的祖国可能会完全停止与我们通商。"
 flavor_tun.13.a: "雇佣兵太重要了。"
 flavor_tun.13.b: "呸！我们不需要他们的服务。"
 tun_economic_stranglehold_tt: "[ShowGovernmentReformName('catalan_merchant_privileges')]的[ShowModifierTypeName('global_merchant_power')]会降低#R ‑10.0%#!"
 flavor_tun.14.title: "亲属的要求"
 flavor_tun.14.desc: "[ShowDynastyName('hafsid_dynasty')]家族的[target_character.GetName]亲王已变得颇具影响力，足以要求获得[ShowSubjectTypeName('familial_governor')]职位。除非我们默许，将[target_location.GetName]授予[target_character.GetNameWithNoTooltip]，否则必定会在[ROOT.GetCountry.GetLongName]中挑起祸端。"
 flavor_tun.14.a: "给[target_character.GetHerHim]！"
 flavor_tun.14.b: "现在还不是时候。"
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName]期望成为[ShowSubjectTypeName('familial_governor')]，在[target_character.GetSheHe]被通过[ShowCharacterInteractionName('assign_familial_governor')]授予该职位前，[target_character.GetSheHe]会一直触发该[event|e]"
 flavor_tun.15.title: "继承争议"
 flavor_tun.15.desc: "老[old_ruler.GetName]的去世，在[ROOT.GetCountry.GetCapital.GetName]留下了权力真空。名义上，[new_ruler.GetName]本应接替[ROOT.GetCountry.GetName]的总督之位，继承几乎已成定局。一场由不明势力支持的民众叛乱，目前正在首都街头游行，试图确保[target_character2.GetName]的继承权。我们是支持合法继承人，还是让[ShowEstateTypeName('burghers_estate')]得逞？"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip]是合法继承人！"
 flavor_tun.15.b: "我们必须听叛乱分子的。"
 flavor_tun.16.title: "[target.GetNameWithNoTooltip]的继承"
 flavor_tun.16.desc: "随着[new_ruler.GetName]的继承，[target.GetLongName]与[ROOT.GetCountry.GetName]两国再次统一在一位[ShowDynastyName('hafsid_dynasty')]中央统治者之下。让我们希望[ShowScriptedGeographyName('ifriqiya_geography')]能很快重新统一，不再遭受严重的[ShowSocietyDirectionName('decentralization')]之苦。"
 flavor_tun.16.a: "离统一更近一步。"
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "[target.GetName]被[ROOT.GetCountry.GetName][annexed|e]"
 flavor_tun.17.title: "[from_country.GetNameWithNoTooltip]的继承争议"
 flavor_tun.17.desc: "在从[from_country.GetCapital.GetName]的[from_country.GetGovernment.GetEstateName('burghers_estate')]那里获得足够多的民众支持后，[target_character2.GetShortNameWithNoTooltip]已成为该国的名义统治者，实质上剥夺了[new_ruler.GetNameWithNoTooltip]的合法继承权，也使我们失去了他们的领导。"
 flavor_tun.17.a: "我们绝不允许！"
 flavor_tun.17.b: "其他事务更为重要。"
 flavor_tun.18.title: "[ShowCultureNameWithNoTooltip('andalusi')]名人"
 flavor_tun.18.desc: "一位当地[ShowCultureName('andalusi')][target_character.GetWomanMan]，在[target_character.GetBirthLocation.GetArea.GetName]出生并长大，最近一路晋升，进入了[ROOT.GetCountry.GetCapital.GetName]的[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]。看来[target_character.GetName]很快就会成为我们[ROOT.GetCountry.GetFlavorRank]的[ShowEstatePrivilegeName('andalusi_elite')]成员之一。"
 flavor_tun.18.a: "棒极了！"
 flavor_tun.19.title: "新继承人？"
 flavor_tun.19.desc: "近来，[ROOT.GetCountry.GetCapital.GetName]的街头一直回荡着低语和流言。这座[ROOT.GetCountry.GetCapital.GetRank.GetName]正在讨论[target_character2.GetName]的统治，以及谁可能是接替[target_character2.GetHerHim]的理想人选。[ShowEstateTypeName('burghers_estate')]已选出一位显赫人物[target_character.GetName]，他们认为此人将是[ROOT.GetCountry.GetName]王位的合适继承人。据说[ShowEstateTypeNameWithNoTooltip('burghers_estate')]已被[target_character.GetHerHis]慷慨许诺的特权与额外权利所打动。"
 flavor_tun.19.a: "行吧，指定[target_character.GetNameWithNoTooltip]。"
 flavor_tun.19.b: "傻子才会信这个。"
