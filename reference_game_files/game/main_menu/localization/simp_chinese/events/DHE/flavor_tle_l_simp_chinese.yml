l_simp_chinese:
 banu_al_wad: "阿卜杜勒·瓦德"
 FATE_OF_TLEMCEN: "[ShowLocationNameWithNoTooltip('tlemcen')]的命运"
 flavor_tle.1.title: "[capital_scope.GetNameWithNoTooltip]的陷落"
 flavor_tle.1.desc: "[ROOT.GetCountry.GetFlavorRank]首都[capital_scope.GetName]不幸落入可恶的敌人手中，更悲剧的是，我们敬爱的统治者[ruler_scope.GetName]和他的儿子在战斗中丧生。\n\n这严重打击了整个[ROOT.GetCountry.GetFlavorRank]的士气，让对抗我们的敌人变得无比困难。"
 flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 tle_morrocan_tlemcen_war: "如果[target_location.GetName]在[target_war.GetName]中被[mor_scope.GetLongName]占领，[mor_scope.GetName]将可以强迫[tle_scope.GetName]成为[ShowSubjectTypeName('fiefdom')]"
 tle_additional_warning: "必须尽快解除[target_siege.GetName]！"
 flavor_tle.2.title: "[target.GetNameWithNoTooltip]的陷落"
 flavor_tle.2.desc: "[target.GetName]，[target.GetArea.GetName]的明珠，终于在我们的围攻下屈服，向我们强大的军队投降了。城门一开，我军便冲入[target.GetRank.GetName]，试图控制主城堡，以期夺取战利品和俘虏。城堡内有许多[target_country.GetGovernment.GetAdjective]家族成员，我军迅速将其俘获，并押送到[from_country.GetAdjective]将领们面前。这会不会就是[target_war.GetName]的终结？"
 flavor_tle.2.a: "确保[target_dynasty.GetNameWithNoTooltip]不成为阻碍。"
 flavor_tle.2.b: "前进，向[ShowLocationNameWithNoTooltip('oran')]进发！"
 TLE_once_truce_ends_zayyanid_pretenders_tt: "一旦与[target_country.GetName]的[truce|e]结束，他们将获得[ShowDecisionName('zayyanid_pretenders_decision')][decision|e]，允许他们发动特殊[ShowCasusBelliName('cb_independence_war')][war|e]"
 flavor_tle.3.title: "$flavor_tle.2.title$"
 flavor_tle.3.desc: "我们挚爱的[ROOT.GetCountry.GetFlavorRank]的首都[target.GetName]已落入来自[from_country.GetLongName]的可憎敌人之手。更添悲剧的是，我们挚爱的[target_dynasty.GetName]家族许多成员在攻城中被杀。\n\n这场灾难使绝望的冲击波席卷整个[ROOT.GetCountry.GetLongName]，并使继续战争实际上已不可能。虽然仅凭杀戮不足以使国家瘫痪，但对领导层的信任丧失无疑足以做到。由于被部落盟友抛弃，我们的士气降至历史最低点；且没有成型的抵抗运动，这标志着[target_war.GetName]的终结。"
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 TLE_as_per_the_warning: "我们没有听从警告，任由我们挚爱的[target.GetName]被占领。[target_dynasty.GetName]家族已被屠杀，而我们如今成了[from_country.GetName]的[ShowSubjectTypeName('fiefdom')]。"
 zayyanid_pretenders_decision.title: "拥立[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]王子"
 zayyanid_pretenders_decision.desc: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName]的统治，往坏了说是暴虐无道，往好了说也只是[ROOT.GetCountry.GetLongName]的麻烦根源。让我们邀请一位[ShowDynastyName('zayyanid_dynasty')]王子再次统治我们，并团结所有[ShowEstateTypeName('tribes_estate')]对抗共同的敌人。"
 zayyanid_pretenders_decision.desc.entry: "我们宗主的统治完全是暴政，它从根本上动摇了$banu_al_wad$部落的优势地位。我们可以邀请一位[ShowDynastyName('zayyanid_dynasty')]王子重新统治我们，联合所有[ShowEstateTypeName('tribes_estate')]对抗共同的敌人。"
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 zayyanid_pretenders_decision.a.entry: "$common_string_great$"
 zayyanid_prince_takes_over: "一位[ShowDynastyName('zayyanid_dynasty')][dynasty|e]的王子掌权"
 flavor_tle.4.title: "$flavor_tle.7.title$"
 flavor_tle.4.desc: "[from_country.GetName]的局势正日益难以为继。许多[target_dynasty.GetName]王位宣称者已从藏匿处现身，并在当地[ShowCultureName('zenati')]部落中积极寻求支持。倘若我们不能安抚当地阶层，[target_location.GetName]就可能成为民众叛乱的温床，终结我们在[ShowRegionName('maghreb_region')]的霸权。[target_country.GetName]能经受住这样一场风暴吗？"
 flavor_tle.4.a: "我们必须留意这些警告。"
 tle_rules_for_zayyanid_pretenders: "如果[target_country.GetName]在接下来的#Y 20#!年内的任何一年未能使[from_country.GetLongName]的[subject_loyalty|e]保持在#Y 30#!以上，则[from_country.GetName]将可以通过[ShowDecisionName('zayyanid_pretenders_decision')][decision|e]发动[ShowCasusBelliName('cb_independence_war')][war|e]"
 tle_rules_part_two: "如果发生这种情况，[from_country.GetName]将获得显著的军事力量加成，而[target_country.GetName]将获得以下效果："
 flavor_tle.5.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]回到[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]！"
 flavor_tle.5.desc: "[target_character.GetName]，一位觊觎[from_country.GetAdjective]王位的宣称者，刚刚在[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]代表的欢呼声中进入[ROOT.GetCountry.GetCapital.GetName]。此举是[from_country.GetName]对[target_country.GetLongName]的公然宣战——那个统治[ROOT.GetCountry.GetCapital.GetName]实在太久的国家。[target_character.GetShortNameWithNoTooltip]在[from_country.GetNameWithNoTooltip]享有广泛支持，但最重要的是获得了[ShowModifier('tle_zayyanid_tribe_support')]：即[ROOT.GetCountry.GetFlavorRank]内最大、最强的[ShowCultureName('zenati')]部落的支持，也是[target_dynasty.GetName]的母部落。\n\n我们将让那些[target_country.GetAdjectiveWithNoTooltip]混蛋看看，谁才将在[target_war.GetName]中获胜！"
 flavor_tle.5.a: "荣耀归于[ROOT.GetCountry.GetReligion.GetGodName]！"
 zayyanid_pretender_effect: "我们将对我们的[overlord|e]发动[ShowCasusBelliName('cb_independence_war')]，并从以下事件获得额外增益："
 flavor_tle.6.title: "[from_country.GetLongNameWithNoTooltip]的叛乱！"
 flavor_tle.6.desc: "我们热切的努力——授予特权、派遣外交使团、赠送奢华礼物、授予职位——全都白费了，[from_country.GetName]的部落仍然选择支持来自[target_dynasty.GetName]的暴虐的[target_character.GetName]，而不是更仁慈的[target_country.GetAdjective]统治。\n\n那就这样吧！让他们面对我们军队的怒火！我们将把[ROOT.GetCountry.GetReligion.GetGodName]的神圣惩罚施加于他们，并在[target_war.GetName]中夺取胜利！"
 flavor_tle.6.a: "我们在[ShowRegionNameWithNoTooltip('maghreb_region')]的霸权绝不会动摇！"
 flavor_tle.7.title: "[target_dynasty.GetNameWithNoTooltip]觊觎者"
 flavor_tle.7.entry: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]觊觎者"
 flavor_tle.7.desc: "过去几年中，[target_dynasty.GetName]王朝的许多幸存成员已从藏匿处现身，试图争夺[target_location.GetName]和[from_country.GetAdjective]王位。他们确实在民众和[target_country.GetGovernment.GetEstateName('tribes_estate')]中获得不温不火的支持，而民意正慢慢转向他们。倘若我们在[target_country.GetLongName]的宗主继续加剧[target_location.GetProvince.GetName]的危机，我们很可能看到[target_dynasty.GetNameWithNoTooltip]重新掌权。"
 flavor_tle.7.a: "这可能对我们有利。"
 flavor_tle.8.title: "[ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]"
 flavor_tle.8.desc: "[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]最近发布了一项新的法特瓦，允许我们的宗教弟兄在面临迫害时践行#italic 塔基亚#!。这项以其发布地命名的[ShowDecisionName('oran_fatwa_decision')]已传到[ShowRegionName('iberia_region')]，并在受压迫的[ShowReligionAdjective('sunni')]同胞中广泛传播。\n\n这项允许践行塔基亚的许可，允许在伪装成其他信仰的同时秘密践行[ShowReligionGroupName('muslim')]。这在#italic 乌玛#!中通常是被禁止的，但该法特瓦允许在[ShowRegionName('iberia_region')]这样做。"
 flavor_tle.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tle.8.a.entry: "$common_string_great$"
 oran_fatwa_decision.title: "[ShowLocationNameWithNoTooltip('oran')]法特瓦"
 oran_fatwa_decision.desc: "$flavor_tle.8.desc$"
 oran_fatwa_decision.desc.entry: "我们在[ShowRegionName('iberia_region')]的[ShowReligionAdjective('sunni')]教友正遭受压迫。我们不能让他们继续处于#italic 塔基亚#!之中，任其信仰衰微。我们需要发布一份法特瓦，来支援他们的抗争。"
 oran_fatwa_decision.a: "$flavor_tle.8.a$"
 has_more_prestige_than_root_tt: "拥有比[ROOT.GetCountry.GetName]更高的[prestige|e]"
 has_most_prestige_out_of_all_maghrebi_sunni_countries: "拥有比所有[capital|e]位于[ShowRegionName('maghreb_region')]的[ShowReligionAdjective('sunni')]国家更高的[prestige|e]"
 tle_enable_free_the_mudejar_cb_tt: "[capital|e]位于[ShowRegionName('maghreb_region')]的[ShowReligionAdjective('sunni')][countries|e]将可以制造[ShowCasusBelliName('cb_free_the_mudejar')][casus_belli|e]，针对在[ShowRegionName('iberia_region')]的[provinces|e]拥有[ShowReligionAdjective('sunni')][pops|e]的[ShowReligionGroupAdjective('christian')]国家"
 tle_enable_events_for_liberating_mudejar_tt: "在[ShowCasusBelliName('cb_free_the_mudejar')][war|e]中[occupy|e]拥有[ShowReligionAdjective('sunni')][pops|e]的[locations|e]的[ShowReligionAdjective('sunni')][countries|e]将触发关于解放当地人群的[events|e]"
 flavor_tle.9.title: "[target.GetNameWithNoTooltip]的解放"
 flavor_tle.9.desc: "我们在[target.GetName]的[ROOT.GetCountry.GetReligion.GetAdjective]同胞受压迫的时代或许终于结束了。数十年来，这些可怜的灵魂在[target.GetOwner.GetLongName]的暴虐统治下饱受虐待。而如今，他们已被我们的军队解放，终于可以和平地信奉[ShowReligionGroupName('muslim')]。他们再也不必隐藏自己的信仰。"
 flavor_tle.9.a: "欢呼吧，弟兄们！"
 tle_fires_for_all_locations: "此[effect|e]适用于每个被解放的[location|e]，但此[event|e]通知仅针对[province_capitals|e]"
 flavor_tle.10.title: "[ROOT.GetCountry.GetNameWithNoTooltip]阿拉伯化"
 flavor_tle.10.entry: "$TLE$阿拉伯化"
 flavor_tle.10.desc: "[ShowAreaName('algiers_area')]不过是在[ShowCultureGroupName('arabic_group')][ShowEstateTypeName('tribes_estate')]影响下被严重阿拉伯化的[ShowRegionName('maghreb_region')]地区之一。随着这一进程推进，[ShowLanguageName('tamazight_language')]正逐渐被弃用，城市精英正认真接纳当地的[ShowLanguageName('arabic_language')]方言。事实上，随着来自[ShowRegionName('iberia_region')]的移民不断增加，我们看到自己的[ShowEstateTypeName('nobles_estate')]已全面采纳那些习俗。我们的国家很可能很快就会以成为[ShowCultureName('algerian')]人为荣。"
 flavor_tle.10.a: "我们需要加强我们的根源。"
 flavor_tle.10.b: "这就是我们的未来！"
 flavor_tle.11.title: "已确保忠诚"
 flavor_tle.11.desc: "自[target_country.GetAdjective]征服[from_country.GetName]已经过去数十年，关于[ShowDynastyName('zayyanid_dynasty')]复辟的传闻也已基本平息。看来我们终于降服了[ShowCultureName('zenati')][from_country.GetGovernment.GetEstateName('tribes_estate')]，尤其是其中的$banu_al_wad$。一旦他们的领土被并入，我们将为[ShowRegionName('maghreb_region')]开启一个繁荣的新时代。"
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tle_secured: "[from_country.GetName]将不再能通过[ShowDecisionName('zayyanid_pretenders_decision')]叛乱"
 flavor_tle.12.title: "摆脱部落的根"
 flavor_tle.12.entry: "$flavor_tle.12.title$"
 flavor_tle.12.desc: "[target_country.GetAdjective]国家的基础建立在[target_government_reform.GetName]——[target_location.GetName]附近人口最多的部落——之上。正是从这个部落中，[target_dynasty.GetName]王朝发源，进而催生了我们今日的[target_country.GetFlavorRank]。然而，近来[target_estate.GetName]逐渐衰弱，威胁到[ROOT.GetCountry.GetGovernment.GetCourtTitle]内的权力平衡。若不采取行动增强$banu_al_wad$的权力，他们的政治特权将湮没于历史之中。"
 flavor_tle.12.a: "我们必须从部落之外寻求合法性。"
 flavor_tle.12.b: "必须维护$banu_al_wad$的至高地位！"
 tle_empower_banu_al_wad_reform: "[ShowGovernmentReformName('tle_support_of_banu_al_wad')]将额外提供不受加成影响的[ShowNamedValue('small_stability_investment')|+=][ShowModifierTypeName('stability_investment')][modifier|e]"
 flavor_tle.13.title: "[ShowLocationNameWithNoTooltip('oran')]的发展"
 flavor_tle.13.entry: "$flavor_tle.13.title$"
 flavor_tle.13.desc: "如果[target_location2.GetName]是我们与[ShowScriptedGeographyName('sahara_desert_geography')]贸易的门户，那么[target_location.GetName]就是我们与[ShowContinentName('europe')]通商的窗口。没有哪个港口能像[target_location.GetNameWithNoTooltip]的港口那样发挥如此重要的作用，因为它是连接我们与[ShowScriptedGeographyName('mediterranean_sea_geography')]海上伙伴的主要港湾。或许[target_location.GetRank.GetName]理应获得额外特权，以赋予当地[target_estate.GetName]更多权力。"
 flavor_tle.13.a: "绝妙的主意！"
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip]不配得到特殊待遇。"
