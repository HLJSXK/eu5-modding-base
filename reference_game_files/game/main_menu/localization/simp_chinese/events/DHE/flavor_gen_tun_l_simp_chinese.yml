l_simp_chinese:
 flavor_gen_tun.1.title: "唾手可得"
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.1.desc: "[target_location.GetName]这座古老而美丽的[target_location.GetRank.GetName]高踞于[ShowLocationName('cape_tajura')]之上。尽管它对[ShowScriptedGeographyName('mediterranean_sea_geography')]的经济至关重要，却仍为[target_country.GetLongName]所掌控，而该国势单力薄，根本无法独自抵御我们的攻击。我们不妨在[ShowProvinceDefinitionName('tripolitania_province')]登陆，扫荡海岸，随后将战利品拍卖给邻国——又或者索性将其纳入囊中。"
 flavor_gen_tun.1.a: "绝好的主意！"
 flavor_gen_tun.1.b: "这种机会只属于好战之徒。"
 flavor_gen_tun.2.title: "出售$tripoli$"
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.2.desc: "在成功攻陷并洗劫了[target_location.GetName]之后，我们的[ROOT.GetCountry.GetFlavorRank]如今已经在[target_location.GetArea.GetName]地区建立了一片颇具规模的殖民地。然而，这片土地在文化与宗教上都与我们在[ROOT.GetCountry.GetCapital.GetName]的都城存在着显著差异。或许，我们应当考虑将其统治权移交给邻近的某个部落。"
 flavor_gen_tun.2.a: "卖给邻近的萨比特家族。"
 flavor_gen_tun.2.b: "也许马基家族会愿意买回他们的领地。"
 flavor_gen_tun.2.c: "我们确信[tunis_location.GetOwner.GetLongNameWithNoTooltip]会感兴趣。"
 flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip]属于我们！"
 flavor_gen_tun.2.d.entry: "$tripoli$属于我们！"
 sale_of_tripoli_tt: "我们会以[SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+][gold_i|e][gold|e]出售我们在[target_location.GetName]的殖民地，转让所有相连的[locations|e]——共计#Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#!个[locations|e]"
 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
 flavor_gen_tun.3.desc: "来自[from_country.GetName]的使节已经抵达[ROOT.GetCountry.GetCapital.GetName]，提出以相当可观的价格出售其在[target_location.GetName]的领土。无论如何，这个[target_location.GetRank.GetName]的价值不容低估——对[ROOT.GetCountry.GetFlavorRank]而言，这将是一笔相当划算的收购。"
 flavor_gen_tun.3.desc_banu_makki: "[from_country.GetLongName]的狂妄与无礼，理应招致[ROOT.GetCountry.GetReligion.GetGodName]的直接惩罚！在征服了我们美丽的[target_location.GetRankAndName]之后，他们如今竟“慷慨”地给予我们一个赎回的机会。最令人恼火的是，我们或许真的会接受这个提议……"
 flavor_gen_tun.3.a: "很好，我们同意。"
 flavor_gen_tun.3.b: "我们为什么要为能够征服的东西付钱？"
 flavor_gen_tun.3.c: "恕我直言，我们并不在乎。"
