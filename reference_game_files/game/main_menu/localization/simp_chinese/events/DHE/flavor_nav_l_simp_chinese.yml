l_simp_chinese:
 flavor_nav.1.title: "[target_character.GetNameWithNoTooltip]与[target_character_2.GetNameWithNoTooltip]的共同统治"
 flavor_nav.1.entry: "胡安娜二世与埃夫勒的菲利普的共同统治"
 flavor_nav.1.desc: "在[target_character.GetName]和[target_character_2.GetName]于1329年登上[ROOT.GetCountry.GetName]王位之后，他们一直密切地共同统治着[ROOT.GetCountry.GetFlavorRank]；然而，两位共治君主显然更偏爱[target_character_2.GetNameWithNoTooltip]在[ShowRegionName('france_region')]的领地，常常离开[ROOT.GetCountry.GetNameWithNoTooltip]，前往他们的[ShowCultureGroupNameWithNoTooltip('french_group')]属地居住。\n\n尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]在统治者缺席期间找到了许多有能力的摄政者来治理[ROOT.GetCountry.GetFlavorRank]，但过去几年中，疑虑日益增长：许多[ROOT.GetCountry.GetAdjectiveWithNoTooltip]领主希望向这两位统治者请愿，要求他们更长久地定居于[ROOT.GetCountry.GetCapital.GetName]，以免[ROOT.GetCountry.GetFlavorRank]在觊觎已久的外国列强眼中显得虚弱。"
 flavor_nav.1.a: "我们在[ShowRegionNameWithNoTooltip('france_region')]的领地为重中之重。"
 flavor_nav.1.b: "应平等治理两个国家。"
 flavor_nav.1.c: "我们必须首要关注[ROOT.GetCountry.GetNameWithNoTooltip]的土地。"
 flavor_nav.2.title: "[target_character.GetNameWithNoTooltip]即位"
 flavor_nav.2.entry: "纳瓦拉的查理即位"
 flavor_nav.2.desc: "[GetCharacter('nav_jeanne_ii_capet').GetName]的去世，让野心勃勃的[target_character.GetName]登上了王位。抵达[ROOT.GetCountry.GetCapital.GetName]参加[ROOT.GetCountry.GetGovernment.GetAdjective|U]的加冕礼时，[target_character.GetSheHe]已经显露出自己是一位非典型的统治者，因为[target_character.GetNameWithNoTooltip]表现出了用[ShowDialectName('aragonese_dialect')]宣誓的兴趣。这引起了[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]中一些人的不满，他们更希望宣誓以传统的[ShowLanguageNameWithNoTooltip('latin_language')]进行。"
 flavor_nav.2.a: "以罗曼语宣誓。"
 flavor_nav.2.b: "愚蠢的想法：誓言必须以[ShowLanguageNameWithNoTooltip('latin_language')]进行。"
 flavor_nav.2.c: "改为以[ShowLanguageNameWithNoTooltip('basque_language')]宣誓。"
 flavor_nav.3.title: "[target_character.GetNameWithNoTooltip]的领地"
 flavor_nav.3.entry: "纳瓦拉的查理在法国的领地"
 flavor_nav.3.desc: "继承了[GetCharacter('nav_philip_iii_evreux').GetName]和[GetCharacter('nav_jeanne_ii_capet').GetName]的土地之后，[target_character.GetName]如今统治着一片辽阔的领土，涵盖[ROOT.GetCountry.GetName]以及[ShowRegionName('france_region')]内的若干领地。尽管[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip]和[GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip]曾共同统治[ROOT.GetCountry.GetNameWithNoTooltip]，他们却只短暂来访过[ROOT.GetCountry.GetFlavorRank]，更愿意在[ShowRegionNameWithNoTooltip('france_region')]居住。\n\n随着[target_character.GetNameWithNoTooltip]登基，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的许多盟友敦促[target_character.GetHerHim]在[ROOT.GetCountry.GetNameWithNoTooltip]更长久地定居，尽管另一些人认为这位[ROOT.GetCountry.GetGovernment.GetRulerTitle]可能对[ShowRegionNameWithNoTooltip('france_region')]那有争议的王位怀有更大野心。"
 flavor_nav.3.a: "在我们位于[ShowRegionNameWithNoTooltip('france_region')]的领地处理[ROOT.GetCountry.GetGovernment.GetCourtTitle]事务。"
 flavor_nav.3.b: "将主要[ROOT.GetCountry.GetGovernment.GetCourtTitle]设在[ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_nav.3.c: "以[evr_country.GetNameWithNoTooltip]为统治中心。"
 flavor_nav.3.c.entry: "以埃夫勒为统治中心。"
 nav_will_be_able_to_rally_other_appanages_tt: "与[GetCountry('FRA').GetName]的一个封邑附属国达到#G 150#!关系，将使他们更倾向于通过[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')][decision|e]支持我们对[GetCountry('FRA').GetNameWithNoTooltip]的战争"
 flavor_nav.4.title: "[ShowDynastyNameWithNoTooltip('capet_dynasty')]的宣称"
 flavor_nav.4.entry: "卡佩王朝的宣称"
 flavor_nav.4.desc: "尽管许多人曾怀疑[target_character.GetName]是一位野心勃勃的[ROOT.GetCountry.GetGovernment.GetRulerTitle]，但许多人并未料到会直接听到[target_character.GetHerHis]对[fra_country.GetName]王位的宣称。虽然[target_character.GetNameWithNoTooltip]的宣称因[GetCharacter('nav_jeanne_ii_capet').GetShortName]的[ShowDynastyName('capet_dynasty')]血统而颇具分量，但[GetCharacter('nav_jeanne_ii_capet').GetHerHis]继承[ROOT.GetCountry.GetName]的条件之一，便是放弃对[fra_country.GetNameWithNoTooltip]的宣称。\n\n尽管[fra_country.GetNameWithNoTooltip]的许多领主也不太可能因古老的[ShowHeirSelectionName('salic_law')]而完全承认[target_character.GetNameWithNoTooltip]的宣称，但一些人认为[target_character.GetNameWithNoTooltip]应利用[target_character.GetHerHis]在[fra_country.GetNameWithNoTooltip]内的政治影响力，去说服更强大的领主。"
 flavor_nav.4.a: "[fra_country.GetNameWithNoTooltip]的王位理应属于[target_character.GetNameWithNoTooltip]！"
 flavor_nav.4.a.entry: "法兰西王位理应属于查理！"
 flavor_nav.4.b: "利用这些宣称来向我们的[ShowCultureGroupNameWithNoTooltip('french_group')]臣民证明合法性。"
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip]已经放弃了[GetCharacter('nav_jeanne_ii_capet').GetHerHis]的宣称：让我们转而专注于统治[ROOT.GetCountry.GetNameWithNoTooltip]。"
 unlocks_enforce_the_capetian_claim_to_france_tt: "解锁$navarre_charles_ii_claim_to_france.title$[decision|e]"
 nav_appanage_support_for_french_throne_tt: "如果[ROOT.GetCountry.GetNameWithNoTooltip]是一个封邑，且与[GetCountry('FRA').GetNameWithNoTooltip]的其他封邑附属国达到#G +150#!关系，将使他们倾向于通过[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')][decision|e]支持我们对[GetCountry('FRA').GetNameWithNoTooltip]的战争"
 flavor_nav.5.title: "与[target_character_2.GetNameWithNoTooltip]结盟"
 flavor_nav.5.entry: "与艾蒂安·马塞尔结盟"
 flavor_nav.5.desc: "起初，[target_character.GetName]争取支持的许多努力都陷入停滞，多名[fra_country.GetAdjectiveWithNoTooltip]领主表达了对[fra_ruler.GetName]的忠诚，并拒绝承认[target_character.GetNameWithNoTooltip]的宣称。但尽管[target_character.GetNameWithNoTooltip]成功拉拢了一些较小的[fra_country.GetAdjectiveWithNoTooltip]领主，[target_character.GetShortNameWithNoTooltip]的许多顾问却没料到，显赫的[target_character_2.GetName]愿意将[target_character_2.GetHerHis]的支持投向[target_character.GetNameWithNoTooltip]。虽然[target_character_2.GetNameWithNoTooltip]是[fra_country.GetAdjectiveWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]成员，却长期作为[fra_ruler.GetNameWithNoTooltip]的眼中钉，在三级会议中拖延了[fra_ruler.GetHerHis]的许多努力。尽管[target_character_2.GetNameWithNoTooltip]将成为极其宝贵的助力，但一些人担心[target_character_2.GetHerHis]的野心可能与[target_character.GetNameWithNoTooltip]的不同，最终反而成为累赘。\n\n此外，[target_character_2.GetNameWithNoTooltip]还带来消息：[nrm_country.GetName]的领主们已对[fra_ruler.GetNameWithNoTooltip]愈发不满，很可能愿意向[target_character.GetShortNameWithNoTooltip]提供支持。"
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip]将证明是无价的合作者。"
 flavor_nav.5.a.entry: "艾蒂安·马塞尔将证明是无价的合作者。"
 flavor_nav.5.b: "让[target_character_2.GetHerHim]从[fra_country.GetNameWithNoTooltip]抽取收入挪进我们的金库。"
 flavor_nav.5.b.entry: "让他从法国抽取收入挪进我们的金库。"
 flavor_nav.5.c: "完全拒绝[target_character_2.GetHerHis]的协助。我们将在没有[target_character_2.GetHerHis]阴谋的情况下夺取[fra_country.GetNameWithNoTooltip]。"
 flavor_nav.5.c.entry: "完全拒绝他的协助。我们将在没有他阴谋的情况下夺取法国。"
 nav_decision_seizure_of_duchy_of_normandy_tt: "解锁$nav_coercing_of_normandy.title$[decision|e]"
 flavor_nav.6.title: "烈火结局"
 flavor_nav.6.entry: "纳瓦拉的查理被烧死"
 flavor_nav.6.desc: "尽管[target_character.GetName]的健康近年来每况愈下，[ROOT.GetCountry.GetGovernment.GetCourtTitle]仍对[target_character.GetSheHe]前一晚在寝殿中死于火灾的消息感到震惊。[ROOT.GetCountry.GetGovernment.GetCourtTitle]传言称，[target_character.GetNameWithNoTooltip]在接受疾病治疗时，一支蜡烛掉到了[target_character.GetHerHis]的床上，将其点燃。\n\n[scope_our_heir.GetName]如今登上王位，其野心不如[our_ruler.GetHerHis]的前任，许多人想知道[ROOT.GetCountry.GetName]的史官将如何记载[target_character.GetNameWithNoTooltip]的统治。"
 flavor_nav.6.a: "[target_character.GetHerHis|U]的统治将被铭记为野心勃勃但可怕的统治。"
 flavor_nav.6.b: "[target_character.GetSheHe|U]将被铭记为[GetCountry('FRA').GetNameWithNoTooltip]的征服者！"
 flavor_nav.6.c: "[target_character.GetSheHe|U]将因尽管有拥有[ShowCultureGroupNameWithNoTooltip('french_group')]血统却转向[ROOT.GetCountry.GetNameWithNoTooltip]而被铭记。"
 flavor_nav.6.d: "我们应转而展望未来。"
 flavor_nav.7.title: "有争议的边境"
 flavor_nav.7.entry: "边境地区的分割"
 flavor_nav.7.desc: "尽管[ROOT.GetCountry.GetName]与[cas_country.GetName]之间的关系过去一直敌对，但[cas_country.GetNameWithNoTooltip]的统治者从未寻求完全征服[ROOT.GetCountry.GetFlavorRank]。然而，在[ShowProvinceDefinitionName('biscay_province')]、[ShowProvinceDefinitionName('gipuzkoa_province')]和[ShowProvinceDefinitionName('alava_province')]的边境地区，由于该区域边界划分不清，更强大的地方家族之间的紧张关系已持续加剧了一段时间。\n\n虽然[cas_country.GetNameWithNoTooltip]和[our_ruler.GetName]的代表曾致力于解决边界争端，但[ShowDisasterNameWithNoTooltip('castilian_civil_war')]在[cas_country.GetNameWithNoTooltip]的爆发极大地阻碍了进一步谈判，导致显赫的地方王朝之间冲突更多。\n\n随着[cas_country.GetNameWithNoTooltip]如今陷入内部冲突，这些地方家族的代表已向[our_ruler.GetNameWithNoTooltip]请愿，要求发动入侵以夺取争议土地。"
 flavor_nav.7.a: "这些领土争端，如果不解决，可能会继续激怒[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的各个家族。"
 flavor_nav.7.b: "暂停任何进一步的外交谈判：我们必须确保我们对地区的主张成立！"
 flavor_nav.8.title: "权力真空蔓延至[ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_nav.8.entry: "权力真空蔓延至纳瓦拉"
 flavor_nav.8.desc: "虽然[ShowDisasterNameWithNoTooltip('castilian_civil_war')]已经结束，但整个[ShowRegionName('iberia_region')]仍在承受余波。随着边境地区驻军大幅减少，该区域各家族间的许多仇恨已演变成公开战争。\n\n由于[cas_country.GetName]实力薄弱，该区域冲突的强度对[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]来说将是一项仅凭一己之力难以解决的艰巨任务。"
 flavor_nav.8.a: "[ROOT.GetCountry.GetNameWithNoTooltip]面临危险时期。"
 nav_end_blood_feud_decision_enabled_tt: "解锁$nav_end_the_blood_feuds.title$[decision|e]"
 nav_sow_division_in_the_borderlands_enabled_tt: "解锁$nav_sow_division_in_the_borderlands.title$[decision|e]"
 flavor_nav.9.title: "[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]的解体"
 flavor_nav.9.entry: "比斯开的解体"
 flavor_nav.9.desc: "尽管[ShowProvinceDefinitionName('biscay_province')]的控制权长期受[cas_country.GetName]与[ROOT.GetCountry.GetName]争夺，该地区一直是许多显赫家族的家园，其中阿罗家族是最有影响力且最忠诚的封臣。然而，[cas_country.GetNameWithNoTooltip]已开始直接撤销该地区的头衔，并随后吞并[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]内存在争议的区域。\n\n[cas_country.GetNameWithNoTooltip]的这些举动极大地激怒了阿罗家族，他们已敦促[ROOT.GetCountry.GetGovernment.GetCourtTitle]资助[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]的叛军，以打击那些支持[cas_country.GetAdjectiveWithNoTooltip]吞并该地区的人。"
 flavor_nav.9.a: "我们无法在不招致[cas_country.GetAdjectiveWithNoTooltip]愤怒的情况下默许阿罗家族的要求。"
 flavor_nav.9.a.entry: "我们无法在不招致卡斯蒂利亚愤怒的情况下默许阿罗家族的要求。"
 flavor_nav.9.b: "支持阿罗家族在当地播撒无政府状态。"
 flavor_nav.10.title: "教会的呼召"
 flavor_nav.10.entry: "$flavor_nav.10.title$"
 flavor_nav.10.desc: "[target_character.GetName]——我们[ROOT.GetCountry.GetGovernment.GetRuler.GetName]最年长的女儿，正等待护送她前往[ShowLocationName('paris')]开始新生活的随行队伍。\n\n她出生时，群星仿佛都在为她微笑，作为父母全部财产的继承人，但这一切已成过往。她与[GetCountry('ARA').GetGovernment.GetRuler.GetName]的婚约被取消，如今反而成为她妹妹[target_sister.GetShortName]的阻碍。\n\n现在她将加入[ShowLocationNameWithNoTooltip('paris')]的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]，侍奉我主基督。\n\n不过仍有人认为，她或许还能为国家效力，成为其他外交谈判中的潜在筹码。"
 flavor_nav.10.a: "她将成为一名修女。"
 flavor_nav.10.a.entry: "利用王冠的权威防止进一步流血。"
 flavor_nav.10.b: "她仍有利用价值。"
 flavor_nav.11.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]支持的家族在[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]取得优势"
 flavor_nav.11.entry: "纳瓦拉支持的家族在边境取得优势"
 flavor_nav.11.desc: "尽管在[ShowScriptedGeographyName('nav_contested_basque_borderlands')]中，亲[ROOT.GetCountry.GetAdjective]家族与亲[GetCountry('CAS').GetAdjective]家族之间的冲突给该地区留下了毁灭性影响，但[ROOT.GetCountry.GetAdjectiveWithNoTooltip]家族还是做到了近乎不可能的事，恢复了[ROOT.GetCountry.GetNameWithNoTooltip]对[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]的大部分影响力。尽管[GetCountry('CAS').GetNameWithNoTooltip]仍可能重新确立对该地区的控制，但这对[GetCountry('CAS').GetAdjectiveWithNoTooltip][GetCountry('CAS').GetGovernment.GetCourtTitle]来说无疑代价高昂。"
 flavor_nav.11.a: "让这为更强大的[ROOT.GetCountry.GetNameWithNoTooltip]铺平道路。"
 navarre_gains_castile_basque_lands_tt: "[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')]拥有的所有地点，都有较高概率转归[ROOT.GetCountry.GetName]所有，除非[GetCountry('CAS').GetNameWithNoTooltip]决定采取极端措施来维持对这些领土的控制"
 flavor_nav.12.title: "兄弟会的加强"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "尽管[ROOT.GetCountry.GetName]的兄弟会过去曾证明是能干的盟友，但[ROOT.GetCountry.GetAdjectiveWithNoTooltip]各家族之间数十年的血仇已达到沸点。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]的许多成员已出资赞助兄弟会的[ROOT.GetCountry.GetGovernment.GetAdjective|U]分支。尽管耗资不菲，但一旦获得授权，兄弟会将帮助在争斗家族中强制执行[our_ruler.GetName]的权威，并帮助他们一劳永逸地管束这些家族。"
 flavor_nav.12.a: "兄弟会将最终制止这些家族争吵。"
 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip]与[scope_our_heir.GetNameWithNoTooltip]的监护"
 flavor_nav.13.entry: "胡安·德·博蒙与继承人的监护"
 flavor_nav.13.desc: "尽管博蒙派在[ROOT.GetCountry.GetName]内早已拥有影响力，但他们提出亲自担任[scope_our_heir.GetName]导师的提议仍令人意外。虽然[target_character.GetName]以正直的品格闻名，但一些顾问担心[target_character.GetHerHis]的教导提议可能是一种影响[scope_our_heir.GetNameWithNoTooltip]的手段，后者终有一日将统治[ROOT.GetCountry.GetAdjectiveWithNoTooltip]。"
 flavor_nav.13.a: "[target_character.GetHeShe|U]会是一位出色的导师。"
 flavor_nav.13.a.entry: "他会是一位出色的导师。"
 flavor_nav.13.b: "我们不能冒险让[target_character.GetHerHim]对我们的[scope_our_heir.GetNameWithNoTooltip]有影响力。"
 flavor_nav.13.b.entry: "我们不能冒险让他对我们的继承人有影响力。"
 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip]与[target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "配偶与佩德罗·德·佩拉尔塔的影响"
 flavor_nav.14.desc: "作为[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的显赫派系之一，阿格拉蒙特派在[target_character.GetName]带领下积累了相当的影响力，同时与[scope_our_consort.GetName]建立了密切伙伴关系。虽然他们的贡献为[ROOT.GetCountry.GetName]带来了成果，但有些人担心他们的阴谋中可能隐藏着更为黑暗的目标。"
 flavor_nav.14.a: "阿格拉蒙特派一直为我们尽职效力。"
 flavor_nav.14.b: "[target_character.GetHerHis|U]与[scope_our_consort.GetNameWithNoTooltip]的影响力令人担忧：采取措施将他们分开。"
 flavor_nav.14.b.entry: "他与配偶的影响力令人担忧：采取措施将他们分开。"
 flavor_nav.15.title: "针对[the_legal_heir.GetNameWithNoTooltip]的篡位迫在眉睫"
 flavor_nav.15.entry: "针对继承人的篡位迫在眉睫"
 flavor_nav.15.desc: "虽然[our_ruler.GetName]维持了稳定的统治，但[our_ruler.GetSheHe]近日已卧病在床。担心[ROOT.GetCountry.GetGovernment.GetRulerTitle]的生命即将结束，忠于[the_consort_usurper.GetName]的阿格拉蒙特派支持者已悄悄加冕[the_consort_usurper.GetHerHim]为[ROOT.GetCountry.GetName]的新统治者。\n\n[the_legal_heir.GetNameWithNoTooltip]目前不在[ROOT.GetCountry.GetGovernment.GetCourtTitle]，博蒙派中的一些人已秘密送信给[the_legal_heir.GetHerHis]的随从，希望通知[the_legal_heir.GetHerHim]阿格拉蒙特派的背叛。如果信件及时到达，可能还有时间集结足够支持，在阿格拉蒙特派阴谋得逞之前将其粉碎。"
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip]更适合领导[ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_nav.15.a.entry: "宫廷更适合领导纳瓦拉。"
 flavor_nav.15.b: "支持[ROOT.GetCountry.GetNameWithNoTooltip]的合法统治者[the_legal_heir.GetNameWithNoTooltip]！"
 flavor_nav.15.b.entry: "支持纳瓦拉的合法统治者，我们的继承人！"
 flavor_nav.15.historical_info: "共治君主布兰卡一世与胡安二世曾颁令，规定其子维亚纳亲王卡洛斯应在布兰卡去世后继承纳瓦拉王位。然而，胡安二世并未将王位传给卡洛斯，而是选择继续管理纳瓦拉，实际上自立为国王，推翻了自己的儿子。后来，在博蒙派和阿格拉蒙特派分别支持下，父子二人于纳瓦拉内战中兵戎相见；最终胡安二世获胜，保住了纳瓦拉王位。"
 flavor_nav.16.title: "[target_country.GetAdjectiveWithNoTooltip]的宣称"
 flavor_nav.16.desc: "在[ShowRegionName('france_region')]各地赢得相当多支持后，[target_character.GetName]已公开宣布要争夺[ShowRegionNameWithNoTooltip('france_region')]的王位，并向[ShowRegionNameWithNoTooltip('france_region')]各地派遣信使，给予他们最后的机会，加入[target_character.GetHerHim]夺取王位的行动。尽管[target_character.GetShortNameWithNoTooltip]已在我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]中博取了不少好感，但议会中一些人担心，倘若[target_character.GetSheHe]成功，将严重动摇[ShowRegionNameWithNoTooltip('france_region')]的稳定。"
 flavor_nav.16.a: "我们将支持[target_character.GetNameWithNoTooltip]。"
 flavor_nav.16.b: "置身于这场冲突之外。"
 flavor_nav.16.c: "必须阻止[target_character.GetSheHe|U]。"
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName]会加入[target_character.GetName]争夺[ShowRegionName('france_region')]控制权的战争"
 flavor_nav.17.title: "[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]的困境"
 flavor_nav.17.desc: "我们与[GetCountry('NAV').GetName]之间沿[ShowScriptedGeographyName('nav_contested_basque_borderlands')]的许多领土已被亲[GetCountry('NAV').GetAdjectiveWithNoTooltip]派系侵占，许多忠于[ROOT.GetCountry.GetName]的[ShowCultureName('basque')]家族已元气大伤。尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]的一些成员认为该地区尚未丢失，但如今当地许多民众已受制于强大的[GetCountry('NAV').GetAdjectiveWithNoTooltip]家族，要重新夺回权威将十分困难。"
 flavor_nav.17.a: "就让给[GetCountry('NAV').GetNameWithNoTooltip]吧。"
 flavor_nav.17.b: "我们将记住[ShowCultureNameWithNoTooltip('basque')]人的这次叛乱。"
 flavor_nav.17.c: "迅速镇压叛乱，不惜一切代价！"
 flavor_nav.20.title: "奥利特的圣方济各会修道院"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "作为虔诚的信徒，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]无法容忍[ShowLocationName('olite')]圣方济各修道院工程的缓慢进展。\n\n这座修道院开工已逾百年，至今仍未完工。\n\n尽管加速工程将耗费国库，但此举能极大提升当地声望与我们的威望。"
 flavor_nav.20.a: "赞美天主！"
 flavor_nav.20.b: "既然等了这么久，不妨再等等。"
 flavor_nav.20.historical_info: "据传，亚西西的圣方济各在1213至1214年朝圣圣地亚哥的旅途中，创立了奥利特修道院。\n\n自特奥巴尔多二世国王奠定基础以来，纳瓦拉的历代君主，尤其是让娜二世和夏尔二世，不断提供财政和精神上的支持，推动了修道院的发展和深化了其宗教信仰。\n\n随着时间的流逝，修道院经历了多次变革，最终演变成一所“宗徒学院”，专门用于培训和派遣传教士前往西班牙和美洲。在1795年的比利牛斯山战争期间，修道院还曾被用作战地医院。"
 flavor_nav.21.title: "教会的呼召"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "[target_character.GetName]，我们[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的长女，正在等待护送她前往[ShowLocationName('paris')]开始新生活的随行队伍。\n\n她出生时，星辰似乎对她微笑；她曾是父母全部财产的继承人，但这一切已成过往。她与[GetCountry('ARA').GetGovernment.GetRuler.GetName]的婚事被取消，她成了妹妹[target_sister.GetShortName]的障碍。\n\n如今她将加入[ShowLocationNameWithNoTooltip('paris')]的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]，侍奉我主基督。\n\n然而，有些人不禁想，她是否仍能对王国有所用处，成为其他外交谈判中的潜在筹码。"
 flavor_nav.21.a: "她将成为一名修女。"
 flavor_nav.21.b: "她仍有利用价值。"
 flavor_nav.21.historical_info: "尽管让娜曾与阿拉贡的佩德罗四世订婚，这场婚姻最终未能实现。历史学家推测她可能存在某种缺陷或疾病，导致其未婚夫失去兴趣。最终她的妹妹玛丽亚取代其位置嫁给了佩德罗。\n\n为确保婚约履行，让娜被迫放弃继承权，进入巴黎近郊隆尚的方济各会修道院成为贫穷嘉勒会修女。"
 flavor_nav.30.title: "图德拉灌溉工程"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "即便[ROOT.GetCountry.GetGovernment.GetRulerTitle]常驻[ShowRegionName('france_region')]领地，[ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe]仍持续关注[ROOT.GetCountry.GetLongName]的发展蓝图，不断提出新的开发项目。\n\n在[ROOT.GetCountry.GetFlavorRank]南部的[ShowLocationName('tudela')]周边地区，土地肥沃但水源稀缺，干旱问题长期困扰着当地居民。为了解决这一难题，[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]计划开凿水渠以改善灌溉系统，这将使作物生长更加茁壮，并显著提升作物产量。"
 flavor_nav.30.a: "这能极大地肥沃这些土地。"
 flavor_nav.30.b: "我们不能纵容国库承担这些开销。"
 flavor_nav.30.historical_info: "在让娜二世和菲利佩三世的统治时期，纳瓦拉王国各地实施了一系列经济发展项目，其中包括扩展王国南部主要城镇图德拉的灌溉系统。"
 flavor_nav.40.title: "《纳瓦拉法典》的抄本"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "随着[ROOT.GetCountry.GetGovernment.GetRulerTitle]越来越多地参与王国的日常事务，已下令为[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]本人制作一份#italic 《纳瓦拉法典》#!的抄本。\n\n这份抄本将制作精美，采用最优质的皮革封面，并由王国最熟练的抄写员书写。按照传统，文本将使用[spanish_language.GetName]撰写，其中夹杂着一些有趣的[basque_language.GetName]术语。\n\n遗憾的是，我们的[ROOT.GetCountry.GetGovernment.GetRulerTitle]讲的是[french_language.GetName]，并不懂纳瓦拉罗曼语。"
 flavor_nav.40.a: "顺带制作一部[french_language.GetNameWithNoTooltip]译本。"
 flavor_nav.40.a.entry: "顺带制作一部[ShowLanguageNameWithNoTooltip('french_language')]译本。"
 flavor_nav.40.b: "或许是时候让我们的统治者学习这片土地的语言了。"
 flavor_nav.40.c: "如果人人都说巴斯克语，那么它就应该成为官方语言。"
 flavor_nav.40.historical_info: "尽管纳瓦拉王国的大部分人口很可能以巴斯克语（#italic Lingua Navarrorum#!）为母语，但王国的官方文件主要使用纳瓦拉‑阿拉贡语（#italic Ydiomate Navarre Terrae#!、#italic Ydiomate Navarre#!或#italic Lengoage de Navarra#!），因为曾经作为通用宫廷语言的奥克语逐渐衰落。\n\n此外，自1234年香槟家族入主纳瓦拉王国以来，法语变体也在官方文件中变得日益普遍。"
 flavor_nav.50.title: "阿尔赫西拉斯之围"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "[target_country.GetAdjective]边境的战争消息已传至王国。[GetCountry('CAS').GetName]已重新对[target_country.GetNameWithNoTooltip]发起十字军征讨，[target_character.GetName]迅速返回[ROOT.GetCountry.GetName]参战。\n\n尽管我们的[ROOT.GetCountry.GetFlavorRank]似乎难以从中获益，但我们始终认为帮助邻邦将[ShowReligionGroupAdjective('muslim')]驱逐出[ShowRegionName('iberia_region')]是我们的责任。"
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip]将指挥我们的战士。"
 flavor_nav.50.a.entry: "角色将指挥我们的战士。"
 flavor_nav.50.b: "我们必须派遣士兵参加十字军，但我们不会派[target_character.GetShortNameWithNoTooltip]去。"
 flavor_nav.50.b.entry: "我们必须派遣士兵参加十字军，但我们不会派他去。"
 flavor_nav.50.c: "这不关[ROOT.GetCountry.GetNameWithNoTooltip]的事。"
 flavor_nav.50.c.entry: "这不关我们的事。"
 flavor_nav.50.historical_info: "1343年，纳瓦拉国王菲利佩准备加入针对格拉纳达的十字军，履行他作为伊比利亚众王国统治者之一的责任。尽管兵力较少，但得到了比斯开湾物资支持的菲利佩在阿尔赫西拉斯之围中发挥了重要作用。但不幸的是，菲利佩染上了疾病，并最终于1343年9月去世。他的遗体被送回潘普洛纳安葬，而他的心脏则被送至巴黎。他的遗孀让娜得到了教宗克莱孟六世的慰问。阿尔赫西拉斯最终被攻陷，让娜继续统治直到于1349年去世，并将王位传给了他们的儿子，夏尔二世。"
 flavor_nav.60.title: "女王的遗愿"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "[target_character.GetName]去世了，人们宣读了她的遗嘱。在遗嘱中，[target_character.GetHeSheFormal]要求她的继承人为[ShowLocationName('olite')]的王家圣玛利亚教堂添加一座礼拜堂。\n\n交际花中有人建议将这座礼拜堂献给圣母始胎。这说服了我们的统治者[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，因为[ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe]很了解[target_character.GetShortNameWithNoTooltip]有多么虔诚。"
 flavor_nav.60.a: "母亲的遗愿必须遵从。"
 flavor_nav.60.b: "我们的钱有更好的用途。"
 flavor_nav.60.historical_info: "女王让娜二世于1349年死于黑死病时，在遗嘱中要求她的儿子夏尔二世在奥利特王家圣玛利亚哥特教堂投资建造一座礼拜堂。\n\n这座教堂曾被埃夫勒家族用于宗教活动，其风格受到了巴黎圣母院的影响。"
 #Decisions
 navarre_charles_ii_claim_to_france.title: "对[GetCountry('FRA').GetNameWithNoTooltip]的合法宣称"
 navarre_charles_ii_claim_to_france.desc: "尽管[GetCharacter('nav_jeanne_ii_capet').GetName]放弃了[GetCharacter('nav_jeanne_ii_capet').GetHerHis]对[GetCountry('FRA').GetNameWithNoTooltip]的宣称，[GetCharacter('nav_charles_ii_evreux').GetName]仍保有与先王[GetCharacter('fra_louis_x_capet').GetName]的直接血脉联系。即便[ShowHeirSelectionName('salic_law')]错误地判定[GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip]无资格继承，[GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip]的宣称仍比[GetCountry('FRA').GetNameWithNoTooltip]现任统治者更强！"
 navarre_charles_ii_claim_to_france.a: "现在是时候提出我们对[GetCountry('FRA').GetNameWithNoTooltip]的合法宣称了！"
 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
 navarre_charles_ii_claim_to_france_appanage_route.a: "是时候发动内战夺取王位了！"
 nav_appanage_willingness_to_join_tt: "与其他[GetCountry('FRA').GetNameWithNoTooltip]封邑关系达到#G +150#!，将使他们在我们针对[GetCountry('FRA').GetNameWithNoTooltip]的夺取王位战争中倾向于支持我们"
 nav_coercing_of_normandy.title: "对[GetCountry('NRM').GetNameWithNoTooltip]的胁迫"
 nav_coercing_of_normandy.desc: "作为[ShowSituationNameWithNoTooltip('hundred_years_war')]的前线，[GetCountry('NRM').GetName]的许多领主已对[GetCountry('FRA').GetName]的现任统治者愈发不满。通过继承[GetCharacter('nav_philip_iii_evreux').GetName]的领地，[GetCharacter('nav_charles_ii_evreux').GetName]与[GetCountry('NRM').GetFlavorRank]中的人保持着密切联系，其中一些人可能愿意接受[GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip]作为他们的新领主。"
 nav_coercing_of_normandy.a: "夺取[GetCountry('NRM').GetNameWithNoTooltip]的控制！"
 nav_end_the_blood_feuds.title: "血仇的终结"
 nav_end_the_blood_feuds.desc: "自[ShowDisasterName('castilian_civil_war')]结束以来，[GetCountry('NAV').GetName]的大部分地区一直是各家族之间长期血仇的舞台；这些家族因[GetCountry('CAS').GetAdjectiveWithNoTooltip]在当地影响力的削弱而变得有恃无恐。如今，随着[GetCountry('NAV').GetAdjectiveWithNoTooltip]影响力增强，我们可以利用这一点，彻底终结这些世仇。"
 nav_end_the_blood_feuds.a: "权威已恢复！"
 nav_sow_division_in_the_borderlands.title: "在边境播撒分裂"
 nav_sow_division_in_the_borderlands.desc: "随着[GetCountry('CAS').GetAdjective]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')]的影响力大不如前，该地区忠于[GetCountry('NAV').GetName]的各家族之间持续不断的世仇，或许会派上用场——只要我们选择支持他们对仍忠于[GetCountry('CAS').GetNameWithNoTooltip]的其他家族公开开战。尽管这可能会付出高昂的代价，但[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]或许能再次与[GetCountry('NAV').GetNameWithNoTooltip]重新统一。"
 nav_sow_division_in_the_borderlands.a: "授予摧毁敌对家族领地的许可。"
 nav_sow_division_in_the_borderlands.b: "烧毁边境郊区。"
 nav_sow_division_in_the_borderlands.c: "在[GetCountry('CAS').GetAdjectiveWithNoTooltip]持有的土地中播撒怀疑。"
 nav_sow_division_in_the_borderlands_a_tt: "[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')][owned|e]的所有[location|e]将获得[ShowModifier('nav_feud_crossfire')]，持续3年，并失去大量[prosperity|e]和[pop_satisfaction|e]"
 nav_sow_division_in_the_borderlands_b_tt: "[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')][owned|e]的所有[location|e]将获得[ShowModifier('nav_destructive_feuds')]，持续3年，并失去中量[prosperity|e]、[pop_satisfaction|e]和[development|e]"
 nav_sow_division_in_the_borderlands_c_tt: "[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')][owned|e]的所有[location|e]将获得[ShowModifier('nav_widespread_distrust_caused_by_feuds')]，持续3年，并失去中量[prosperity|e]、[pop_satisfaction|e]和[control|e]"
