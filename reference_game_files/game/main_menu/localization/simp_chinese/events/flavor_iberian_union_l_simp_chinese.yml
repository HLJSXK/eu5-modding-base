l_simp_chinese:
 flavor_iberian_union.1.title: "伊比利亚大婚"
 flavor_iberian_union.1.desc: "[iu_member_a.GetName]与[iu_member_b.GetName]的联姻是在两国间建立持久纽带的机会。虽然联姻是出于政治需要，但[ROOT.GetCountry.GetGovernment.GetAdjective]的新人似乎在婚姻中非常幸福，并共同致力于稳定联盟，以建立一个可以在[ShowContinentName('europe')]舞台上被视为主要政权的持久政治结构。"
 flavor_iberian_union.1.historical_info: "伊比利亚最著名的王朝联统，由1469年由卡斯蒂利亚的伊莎贝拉一世与阿拉贡的斐迪南二世——即“天主教双王”——的婚姻缔结而成。他们的结合统合了半岛上两个最强大的王冠，同时保留了各自独立的制度；他们的外孙查理将继承这两个后来成为单一国家的领地。一个世纪后的1580年，西班牙的腓力二世提出了对空缺的葡萄牙王位的宣称，将卡斯蒂利亚、阿拉贡和葡萄牙统一在西班牙哈布斯堡王朝之下，直到1640年葡萄牙复国为止。"
 flavor_iberian_union.1.a: "要确保联姻留下持久的遗产。"
 flavor_iberian_union.2.title: "伊比利亚联盟"
 flavor_iberian_union.2.desc: "[ShowRegionName('iberia_region')]各王国的王冠已归于同一位君主。起初只是两家的联姻，如今已演变为一场共主联合，我们各王国的王冠都落在同一个人的头上。每个王国都保留自己的法律、自己的法庭和自己的骄傲，但在正统性与王朝传承的问题上，他们发出同一个声音。伊比利亚联盟就此诞生，随之而来的是一个足以与基督教世界任何强权比肩的前景。"
 flavor_iberian_union.2.historical_info: "当两个王冠的继承人继承了两者时，结果并非一个单一王国，而是一个复合君主国：若干分离的王国共享一位君主。这就是西班牙君主制的宪制现实：卡斯蒂利亚、阿拉贡以及后来的葡萄牙，都在一位共同国王之下各自保留自己的#italic 议会#!、法律和行政机构。这类联合只在共享的王朝延续时才能维持，而继承人的缺失则可能分裂婚姻所结合的一切。"
 flavor_iberian_union.2.a: "愿我们各王国同享繁荣。"
 flavor_iberian_union.3.title: "伊比利亚大婚"
 flavor_iberian_union.3.desc: "继承问题严重困扰着[ROOT.GetCountry.GetName]，[initiator_candidate.GetName]仍未婚。[ROOT.GetCountry.GetGovernment.GetCourtTitle]敦促[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]寻求结婚以确保继承问题，并提出我们应该努力与[ShowRegionName('iberia_region')]其他[ShowReligionGroupAdjective('christian')]王冠之一联合两国的财富。如果没有强有力的继承人，[ROOT.GetCountry.GetFlavorRank]可能会面临动荡、敌对宣称者或甚至外部干预。"
 flavor_iberian_union.3.historical_info: "所谓伊比利亚大婚反映了卡斯蒂利亚国王恩里克四世的继承问题。在他去世后，两位继承人争夺王位：卡斯蒂利亚的伊莎贝拉，受她的丈夫阿拉贡的费尔南多支持；以及她的侄女胡安娜，由葡萄牙支持。冲突以伊莎贝拉和费尔南多的胜利告终，巩固了伊莎贝拉的统治，并标志着著名的天主教双王统治的开始。这次卡斯蒂利亚和阿拉贡的联姻后来促成了统一的西班牙的建立。"
 flavor_iberian_union.3.a: "向[iu_partner_a.GetNameWithNoTooltip]发出联姻提议。"
 flavor_iberian_union.3.b: "转而求助[iu_partner_b.GetNameWithNoTooltip]。"
 flavor_iberian_union.3.c: "我们另找办法。"
 flavor_iberian_union.4.title: "伊比利亚大婚"
 flavor_iberian_union.4.desc: "来自[iu_initiator.GetName]的使者到达我国[ROOT.GetCountry.GetGovernment.GetCourtTitle]。他们提议[initiator_candidate.GetName]与[iu_chosen_candidate.GetName]缔结王室婚姻，以合并两国疆域。这项提议承诺了共同的繁荣与稳定，然而，我们的一些顾问对此持怀疑态度。虽然这样的联姻可能巩固对抗共同敌人的联盟，并可能促成王冠的统一，但其他人则警告称从长期来看，这可能威胁到我们的独立性。"
 flavor_iberian_union.4.a: "我们稳赚不赔。"
 flavor_iberian_union.4.b: "拒绝更明智。"
 flavor_iberian_union.5.title: "王室联姻被接受"
 flavor_iberian_union.5.desc: "钟声响彻我们的[ROOT.GetCountry.GetFlavorRank]，也响彻[iu_chosen.GetName]的国度：[initiator_candidate.GetName]与[iu_chosen_candidate.GetName]就此联姻，归入同一个[ROOT.GetCountry.GetGovernment.GetAdjective]家族。民众沿街而立，两座宫廷同为这桩由使节与主教费力促成的姻缘举杯。过去只是一桩冷静的政治算计，如今已在誓言与庆典中敲定。\n\n这桩婚事带来的远不止一季的庆典。两国王室就此结合，两个家族以血亲相连；倘若这段婚姻有幸诞下足以继承两顶王冠的子嗣，终有一天，我们两个王国或将同归一体治理。眼下，我们的继承问题因此更加稳固，我们在基督教世界各宫廷中的地位也随庆典的盛大而提升。"
 flavor_iberian_union.5.a: "欢乐的时刻！"
 flavor_iberian_union.6.title: "王室联姻被拒绝"
 flavor_iberian_union.6.desc: "我国向[iu_chosen.GetName]提出的联姻请求遭到拒绝。这一决定无疑将在未来多年损害两国关系，但更重要的是，我国继承人问题仍然悬而不决。"
 flavor_iberian_union.6.a: "我们会另寻出路。"
 flavor_iberian_union.7.title: "遭到冷落"
 flavor_iberian_union.7.desc: "[iu_initiator.GetName]选择与[iu_chosen.GetName]联姻，而不是与我们，尽管我们本是同样合适的选择。受此轻视固然令人难堪，却也并非没有机会：这样的侮辱足以成为理由，让我们用武力夺取本应通过联姻得到的东西。"
 flavor_iberian_union.7.a: "我们不会对这份轻视置之不理。"
 iu_marriage_may_form_union_tt: "这可能促成[union|e]的建立"
 iu_spurned_will_be_displeased_tt: "[iu_spurned.GetName]未必愿意看到自己在这场联姻中被冷落"
